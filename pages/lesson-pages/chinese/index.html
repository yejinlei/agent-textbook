<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语文单课阅读 | 小学知识大全</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        .lesson-index-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #4a90e2;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .grade-section {
            margin-bottom: 40px;
        }
        .grade-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #4a90e2;
        }
        .term-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .term-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .term-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #4a90e2;
        }
        .lesson-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .lesson-list li {
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .lesson-list li:last-child {
            border-bottom: none;
        }
        .lesson-list a {
            color: #333;
            text-decoration: none;
            display: block;
            transition: color 0.2s;
        }
        .lesson-list a:hover {
            color: #4a90e2;
            padding-left: 5px;
        }
        .tip {
            background: #f0f7ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            color: #2c6cb0;
            border-left: 4px solid #4a90e2;
        }
    </style>
</head>
