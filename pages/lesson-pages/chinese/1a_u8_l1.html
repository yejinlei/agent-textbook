<h1 class="lesson-title">雪孩子</h1>
<div class="book-cover">
<img src="https://yejinlei.github.io/agent-textbook/chinese/covers/%E4%B8%80%E5%B9%B4%E7%BA%A7%E4%B8%8A%E5%86%8C.jpg" alt="一年级上册教材封面" loading="lazy">
</div>
<div class="lesson-text">
<p>下了一天一夜的大雪。房子上、树上、地上一片白。兔妈妈要出去找吃的，她堆了一个漂亮的雪孩子，让他和小白兔一起玩。</p><p>小白兔跳舞给雪孩子看，唱歌给雪孩子听。他玩累了，就回家去睡午觉。屋子里很冷，他往火里加了一些柴，就睡觉了。</p><p>火把旁边的柴堆烧着了！小白兔睡得正香，一点儿也不知道。雪孩子看见小白兔家着火了，就飞快地跑了过去。雪孩子从大火里救出了小白兔，自己却化成了水。</p><p>不一会儿，雪孩子变成了一朵白云，一朵美丽的白云。</p>
