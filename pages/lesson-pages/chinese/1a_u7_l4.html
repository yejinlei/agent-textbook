<div class="lesson-text">
<p>认识生字：工、厂、医、院、生；背诵《春节童谣》：小孩小孩你别馋，过了腊八就是年。腊八粥，喝几天，哩哩啦啦二十三。二十三，糖瓜粘。二十四，扫房子。二十五，冻豆腐。二十六，去买肉。二十七，宰公鸡。二十八，把面发。二十九，蒸馒头。三十晚上熬一宿。初一初二满街走。</p>
