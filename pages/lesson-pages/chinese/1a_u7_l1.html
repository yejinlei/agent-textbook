<h1 class="lesson-title">明天要远足</h1>
<div class="book-cover">
<img src="https://yejinlei.github.io/agent-textbook/chinese/covers/%E4%B8%80%E5%B9%B4%E7%BA%A7%E4%B8%8A%E5%86%8C.jpg" alt="一年级上册教材封面" loading="lazy">

<div class="lesson-text">
<p>翻过来，</p><p>唉——</p><p>睡不着。</p><p>那地方的海，</p><p>真的像老师说的，</p><p>那么多种颜色吗？</p><p>翻过去，</p><p>唉——</p><p>睡不着。</p><p>那地方的云，</p><p>真的像同学说的，</p><p>那么洁白柔软吗？</p><p>翻过来，</p><p>翻过去，</p><p>唉——</p><p>到底什么时候，</p><p>才天亮呢？</p>
