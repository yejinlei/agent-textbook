 "book": "五年级上册", "unit": "Unit 4", "scene": "Mike's mother and Miss White are talking on the phone.", "function": "询问信息", "turns": [{"speaker": "Miss White", "en": "Mike has a cold today, children.", "zh": "孩子们，Mike今天感冒了。"}, {"speaker": "Miss White", "en": "He has to stay at home.", "zh": "他得待在家里。"}, {"speaker": "Binbin", "en": "Oh no! It's flu season now.", "zh": "哦不！现在是流感季节。"}, {"speaker": "Miss White", "en": "That's right. How can we all stay healthy?", "zh": "没错。我们怎样才能保持健康？"}, {"speaker": "Amy", "en": "We should eat healthy food.", "zh": "我们应该吃健康的食物。"}, {"speaker": "Miss White", "en": "Good. And what else?", "zh": "很好。还有什么呢？"}, {"speaker": "Zhang Peng", "en": "We should exercise every day.", "zh": "我们应该每天锻炼。"}, {"speaker": "Miss White", "en": "Yes, but please drink enough water.", "zh": "是的，但请喝足够的水。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 4", "scene": "Let's talk: How can I stay healthy?", "function": "请求与应答", "turns": [{"speaker": "A", "en": "How can I stay healthy?", "zh": "我怎样才能保持健康？"}, {"speaker": "B", "en": "You should get enough sleep. It's a good habit.", "zh": "你应该睡足够的觉。这是一个好习惯。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 4", "scene": "Let's talk: Hello, Ms Wang!", "function": "问候与介绍", "turns": [{"speaker": "Mike", "en": "Hello, Ms Wang!", "zh": "你好，王老师！"}, {"speaker": "Ms Wang", "en": "Hi, Mike.", "zh": "嗨，Mike。"}, {"speaker": "Ms Wang", "en": "What healthy habits do you have?", "zh": "你有哪些健康的习惯？"}, {"speaker": "Mike", "en": "I ...", "zh": "我……"}, {"speaker": "Mike", "en": "Eat healthy food.", "zh": "吃健康的食物。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 4", "scene": "Listen, write and say: Sarah and Sam are talking at home.", "function": "请求与应答", "turns": [{"speaker": "Sam", "en": "Can I watch a TV show now, please?", "zh": "请问我现在可以看个电视节目吗？"}, {"speaker": "Sarah", "en": "No, I'm afraid not.", "zh": "不，恐怕不行。"}, {"speaker": "Sam", "en": "Can I play on Mum's phone?", "zh": "我可以在妈妈的手机上玩吗？"}, {"speaker": "Sarah", "en": "No. You shouldn't play on a phone so often.", "zh": "不。你不应该这么频繁地玩手机。"}, {"speaker": "Sam", "en": "What should I do then?", "zh": "那我该做什么呢？"}, {"speaker": "Sarah", "en": "You should rest your eyes. Let's take a walk.", "zh": "你应该让眼睛休息一下。我们去散个步吧。"}, {"speaker": "Sam", "en": "That's no fun.", "zh": "那不好玩。"}, {"speaker": "Sarah", "en": "OK. Let's play in the garden then. It's a nice day.", "zh": "好吧。那我们去花园里玩吧。今天天气不错。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 4", "scene": "Let's talk: How can I take care of my teeth?", "function": "询问信息", "turns": [{"speaker": "Sam", "en": "How can I take care of my teeth?", "zh": "我怎样才能保护我的牙齿？"}, {"speaker": "Sarah", "en": "You should eat less candy.", "zh": "你应该少吃糖果。"}, {"speaker": "Sarah", "en": "You shouldn't check your phone so often.", "zh": "你不应该这么频繁地看手机。"}, {"speaker": "Sam", "en": "I can't see clearly.", "zh": "我看不太清楚。"}, {"speaker": "Sam", "en": "I have a bad tooth.", "zh": "我有一颗坏牙。"}, {"speaker": "Sam", "en": "My eyes are tired.", "zh": "我的眼睛很疲劳。"}, {"speaker": "Sarah", "en": "You should rest your eyes.", "zh": "你应该让眼睛休息一下。"}, {"speaker": "Sarah", "en": "You should brush your teeth twice a day.", "zh": "你应该每天刷两次牙。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 4", "scene": "Reading time: Zoom and the speaker", "function": "请求与应答", "turns": [{"speaker": "Speaker", "en": "You shouldn't eat too much honey, Zoom. It's not good for your teeth.", "zh": "Zoom，你不应该吃太多蜂蜜。这对你的牙齿不好。"}, {"speaker": "Zoom", "en": "Oh, OK.", "zh": "哦，好的。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "scene": "Oliver 在家向妈妈点餐", "function": "请求与应答", "turns": [{"speaker": "Oliver", "en": "Mum, I'm hungry.", "zh": "妈妈，我饿了。"}, {"speaker": "Mum", "en": "What would you like to eat?", "zh": "你想吃什么？"}, {"speaker": "Oliver", "en": "I'd like beef and rice.", "zh": "我想要牛肉和米饭。"}, {"speaker": "Mum", "en": "No problem. Would you like some chicken soup too?", "zh": "没问题。你还想要些鸡汤吗？"}, {"speaker": "Oliver", "en": "Yes, please.", "zh": "好的，谢谢。"}, {"speaker": "Mum", "en": "You should also have some salad. Vegetables are good for you.", "zh": "你也应该吃点沙拉。蔬菜对你有好处。"}, {"speaker": "Oliver", "en": "OK. Can I have some ice cream, please?", "zh": "好的。我可以吃点冰淇淋吗？"}, {"speaker": "Mum", "en": "Yes, but just a little.", "zh": "可以，但只能吃一点。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "scene": "Zhang Peng 和 Amy 点餐", "function": "请求与应答", "turns": [{"speaker": "Zhang Peng", "en": "What would you like to eat?", "zh": "你想吃什么？"}, {"speaker": "Amy", "en": "I'd like a hamburger and some ice cream.", "zh": "我想要一个汉堡和一些冰淇淋。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "scene": "Mrs Green 和 Binbin 谈论椰子", "function": "询问信息", "turns": [{"speaker": "Mrs Green", "en": "What's your favourite fruit, Binbin?", "zh": "Binbin，你最喜欢的水果是什么？"}, {"speaker": "Binbin", "en": "Coconuts are my favourite.", "zh": "椰子是我最喜欢的。"}, {"speaker": "Mrs Green", "en": "Why do you like coconuts?", "zh": "你为什么喜欢椰子？"}, {"speaker": "Binbin", "en": "Because coconut water is nice. And it's healthy.", "zh": "因为椰子水很好喝，而且很健康。"}, {"speaker": "Mrs Green", "en": "We can also cook delicious meals with coconut.", "zh": "我们还可以用椰子做美味的饭菜。"}, {"speaker": "Binbin", "en": "Yes! And some people make houses with coconut tree leaves.", "zh": "是的！而且有些人用椰子树叶盖房子。"}, {"speaker": "Mrs Green", "en": "That's interesting. Where does your coconut come from?", "zh": "真有趣。你的椰子是从哪里来的？"}, {"speaker": "Binbin", "en": "Hainan! There are many coconut trees there.", "zh": "海南！那里有很多椰子树。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "scene": "询问椰子水的价格和产地", "function": "购物与价格", "turns": [{"speaker": "A", "en": "How much is the coconut water?", "zh": "椰子水多少钱？"}, {"speaker": "B", "en": "It's 16 yuan.", "zh": "16元。"}, {"speaker": "A", "en": "Where does it come from?", "zh": "它来自哪里？"}, {"speaker": "B", "en": "It comes from Hainan.", "zh": "它来自海南。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "scene": "Zip 谈论茶的产地", "function": "询问信息", "turns": [{"speaker": "A", "en": "What would you like to eat?", "zh": "你想吃什么？"}, {"speaker": "B", "en": "Where does your tea come from, Zip?", "zh": "Zip，你的茶来自哪里？"}, {"speaker": "Zip", "en": "Most of my tea comes from China!", "zh": "我的茶大部分来自中国！"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 6", "scene": "Mike's family are in a nature park. They are talking with Mr Liu, the tour guide.", "function": "询问信息", "turns": [{"speaker": "Mike's dad", "en": "Wow! That lake is really lovely!", "zh": "哇！那个湖真可爱！"}, {"speaker": "Mr Liu", "en": "Yes. There are also many rivers in the nature park.", "zh": "是的。自然公园里还有许多河流。"}, {"speaker": "Mike's dad", "en": "Is there a waterfall in the forest?", "zh": "森林里有瀑布吗？"}, {"speaker": "Mr Liu", "en": "Yes, there is. You'll see a beautiful one today!", "zh": "是的，有。你今天会看到一个美丽的瀑布！"}, {"speaker": "Mike", "en": "Great! Are there any famous mountains in the nature park?", "zh": "太棒了！自然公园里有著名的山吗？"}, {"speaker": "Mr Liu", "en": "Yes, there are. We'll visit one tomorrow. There are many flowers too. And there are rabbits!", "zh": "是的，有。我们明天会去参观一座。还有许多花。还有兔子！"}, {"speaker": "Mike", "en": "That's great!", "zh": "那太棒了！"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 6", "scene": "Mike and his dad are talking about the weather.", "function": "时间与日程", "turns": [{"speaker": "Mr Liu", "en": "I'm sorry. The wind is very strong outside. We can't go on our trip this morning.", "zh": "对不起。外面风很大。今天上午我们不能去旅行了。"}, {"speaker": "Mike's mum", "en": "I agree. Strong winds are often dangerous.", "zh": "我同意。大风通常很危险。"}, {"speaker": "Mike's dad", "en": "There will be heavy rain in the afternoon too. Mike, stay in the hotel with Mum and close the windows. I'll go to buy some umbrellas and raincoats.", "zh": "下午也会有大雨。Mike，和妈妈待在酒店里，关上窗户。我去买些雨伞和雨衣。"}, {"speaker": "Mike's mum", "en": "There is a small shop in the hotel. You can buy them there.", "zh": "酒店里有个小商店。你可以在那里买。"}, {"speaker": "Mike's dad", "en": "OK.", "zh": "好的。"}, {"speaker": "Mr Liu", "en": "Please don't worry! It'll be a fine day tomorrow.", "zh": "请不要担心！明天会是好天气。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 6", "scene": "Mike and Mr Liu are talking about bad weather in different seasons.", "function": "描述事物", "turns": [{"speaker": "Mike", "en": "Is there any bad weather here in summer?", "zh": "夏天这里有恶劣天气吗？"}, {"speaker": "Mr Liu", "en": "Yes. There is heavy rain. Sometimes there are floods.", "zh": "是的。有大雨。有时还有洪水。"}, {"speaker": "Mike", "en": "Autumn is windy. Be careful of fires.", "zh": "秋天风大。小心火灾。"}, {"speaker": "Mr Liu", "en": "Sometimes there is heavy snow in winter. It is very cold.", "zh": "冬天有时有大雪。非常冷。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Revision", "scene": "New Year's party planning", "function": "请求与应答", "turns": [{"speaker": "Miss White", "en": "Children, New Year's Day is coming. Let's have a class party. What can you do for the party?", "zh": "孩子们，新年快到了。我们办一个班级派对吧。你们能为派对做些什么？"}, {"speaker": "Zhang Peng", "en": "I can draw pictures.", "zh": "我会画画。"}, {"speaker": "Binbin", "en": "I can choose the music for the party.", "zh": "我可以为派对选音乐。"}, {"speaker": "Amy", "en": "Let's play the piano together, John.", "zh": "我们一起弹钢琴吧，John。"}, {"speaker": "John", "en": "Great idea!", "zh": "好主意！"}, {"speaker": "Miss White", "en": "Wonderful!", "zh": "太棒了！"}, {"speaker": "Chen Jie", "en": "Oliver and I are in the Cooking Club. We can make some food for the party.", "zh": "Oliver 和我在烹饪俱乐部。我们可以为派对做一些食物。"}, {"speaker": "Mike", "en": "Sarah, Liu Jia and I are in the Drama Club. We can put on a play.", "zh": "Sarah、刘佳和我在戏剧俱乐部。我们可以演一出戏。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Appendix 1", "scene": "Unit 1 My friends", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "My best friend is clever.", "zh": "我最好的朋友很聪明。"}, {"speaker": "Chant", "en": "Let me say it aloud.", "zh": "让我大声说出来。"}, {"speaker": "Chant", "en": "I think he's different.", "zh": "我觉得他很特别。"}, {"speaker": "Chant", "en": "There is no doubt.", "zh": "毫无疑问。"}, {"speaker": "Chant", "en": "He plays me the pipa. He plays very loud.", "zh": "他给我弹琵琶，弹得很响。"}, {"speaker": "Chant", "en": "He's so different. Yes, he is.", "zh": "他很特别。是的，他是。"}, {"speaker": "Chant", "en": "My good friend is so lovely.", "zh": "我的好朋友很可爱。"}, {"speaker": "Chant", "en": "Let me say it aloud.", "zh": "让我大声说出来。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Appendix 1", "scene": "Unit 2 My friend Sam is angry", "function": "感受与情绪", "turns": [{"speaker": "Chant", "en": "My friend Sam is angry.", "zh": "我的朋友萨姆很生气。"}, {"speaker": "Chant", "en": "Yes, he is, he is.", "zh": "是的，他是，他是。"}, {"speaker": "Chant", "en": "My friend Sam is sad. Oh yes, he is.", "zh": "我的朋友萨姆很难过。哦是的，他是。"}, {"speaker": "Chant", "en": "My friend Sam's dog is sick.", "zh": "萨姆的狗生病了。"}, {"speaker": "Chant", "en": "His dad's away.", "zh": "他爸爸不在家。"}, {"speaker": "Chant", "en": "He's having a horrible day.", "zh": "他今天过得很糟糕。"}, {"speaker": "Chant", "en": "My friend Sam's so unhappy.", "zh": "我的朋友萨姆很不开心。"}, {"speaker": "Chant", "en": "Yes, he is, he is.", "zh": "是的，他是，他是。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Appendix 1", "scene": "Unit 3 Going to school", "function": "其他", "turns": [{"speaker": "Chant", "en": "Go, go, go to school.", "zh": "走，走，去上学。"}, {"speaker": "Chant", "en": "It's a place to learn.", "zh": "那是学习的地方。"}, {"speaker": "Chant", "en": "Study English, read and write.", "zh": "学英语，读和写。"}, {"speaker": "Chant", "en": "There's so much to learn.", "zh": "有很多东西要学。"}, {"speaker": "Chant", "en": "Go, go, go to school.", "zh": "走，走，去上学。"}, {"speaker": "Chant", "en": "It's a place to play.", "zh": "那是玩耍的地方。"}, {"speaker": "Chant", "en": "See your friends, and do some sports.", "zh": "见见朋友，做做运动。"}, {"speaker": "Chant", "en": "We're happy every day.", "zh": "我们每天都开心。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Appendix 1", "scene": "Unit 4 Good habits", "function": "其他", "turns": [{"speaker": "Chant", "en": "Brush your teeth.", "zh": "刷牙。"}, {"speaker": "Chant", "en": "Wash your face.", "zh": "洗脸。"}, {"speaker": "Chant", "en": "Do it every day.", "zh": "每天都做。"}, {"speaker": "Chant", "en": "Study hard and exercise.", "zh": "努力学习并锻炼。"}, {"speaker": "Chant", "en": "And don't forget to play.", "zh": "别忘了玩耍。"}, {"speaker": "Chant", "en": "Hey!", "zh": "嘿！"}, {"speaker": "Chant", "en": "Sleep enough.", "zh": "睡足觉。"}, {"speaker": "Chant", "en": "Eat good food.", "zh": "吃健康的食物。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Appendix 1", "scene": "Unit 5 Eat and drink", "function": "邀请与建议", "turns": [{"speaker": "Chant", "en": "Let's eat chicken and rice.", "zh": "我们吃鸡肉和米饭吧。"}, {"speaker": "Chant", "en": "Let's eat ice cream and cake.", "zh": "我们吃冰淇淋和蛋糕吧。"}, {"speaker": "Chant", "en": "Let's eat noodles and beef.", "zh": "我们吃面条和牛肉吧。"}, {"speaker": "Chant", "en": "Let's all eat now.", "zh": "我们现在一起吃吧。"}, {"speaker": "Chant", "en": "And we can drink some milk.", "zh": "我们可以喝些牛奶。"}, {"speaker": "Chant", "en": "And we can drink some tea.", "zh": "我们可以喝些茶。"}, {"speaker": "Chant", "en": "We can drink some water.", "zh": "我们可以喝些水。"}, {"speaker": "Chant", "en": "Let's all drink now.", "zh": "我们现在一起喝吧。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Appendix 1", "scene": "Unit 6 Beautiful nature", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "Up in the mountain,", "zh": "在山上，"}, {"speaker": "Chant", "en": "The mountain so high.", "zh": "山那么高。"}, {"speaker": "Chant", "en": "There is a waterfall,", "zh": "有一个瀑布，"}, {"speaker": "Chant", "en": "Touching the sky.", "zh": "触碰到天空。"}, {"speaker": "Chant", "en": "Deep in the forest,", "zh": "在森林深处，"}, {"speaker": "Chant", "en": "The forest so low.", "zh": "森林那么低。"}, {"speaker": "Chant", "en": "There are flowers,", "zh": "有花朵，"}, {"speaker": "Chant", "en": "Starting to grow.", "zh": "开始生长。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Appendix 4", "scene": "Unit 2", "function": "询问信息", "turns": [{"speaker": "A", "en": "What's your favourite day at school, John?", "zh": "你在学校最喜欢哪一天，约翰？"}, {"speaker": "B", "en": "What do you have on Wednesdays?", "zh": "星期三你有什么课？"}, {"speaker": "A", "en": "I have Chinese, maths, music and PE.", "zh": "我有语文课、数学课、音乐课和体育课。"}, {"speaker": "A", "en": "What do you usually do at the weekend, children?", "zh": "孩子们，周末你们通常做什么？"}, {"speaker": "B", "en": "I often play football. Sometimes I play Chinese chess with my father.", "zh": "我经常踢足球。有时我和爸爸下象棋。"}, {"speaker": "A", "en": "Does your mother work on both Saturdays and Sundays?", "zh": "你妈妈周六周日都工作吗？"}, {"speaker": "B", "en": "Yes, she does.", "zh": "是的，她（周末两天）都工作。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Appendix 4", "scene": "Unit 3", "function": "描述事物", "turns": [{"speaker": "A", "en": "What's he like?", "zh": "他什么样？"}, {"speaker": "B", "en": "He's tall and strong.", "zh": "他又高又壮。"}, {"speaker": "A", "en": "Is he good at football?", "zh": "他擅长踢足球吗？"}, {"speaker": "B", "en": "Yes, I think he is.", "zh": "是的，我想他擅长。"}, {"speaker": "A", "en": "What can you do for the festival?", "zh": "你能为科学艺术节做什么？"}, {"speaker": "B", "en": "I can make a robot.", "zh": "我能制作机器人。"}, {"speaker": "A", "en": "Can you make robots, Sarah?", "zh": "萨拉，你能制作机器人吗？"}, {"speaker": "B", "en": "No, I can't.", "zh": "不，我不能。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Appendix 4", "scene": "Unit 1", "function": "邀请与建议", "turns": [{"speaker": "A", "en": "Why not do both?", "zh": "为什么不两个活动都做呢？"}, {"speaker": "B", "en": "It's important to listen to each other.", "zh": "听取彼此的想法很重要。"}, {"speaker": "A", "en": "Yes, Miss White. I need to talk to Mike.", "zh": "是的，怀特老师。我需要和迈克谈谈。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Appendix 4", "scene": "Appendix 4", "function": "购物与价格", "turns": [{"speaker": "A", "en": "What would you like to eat?", "zh": "你想吃些什么？"}, {"speaker": "B", "en": "I'd like beef and rice.", "zh": "我想吃牛肉和米饭。"}, {"speaker": "A", "en": "Would you like some chicken soup too?", "zh": "你还想喝鸡汤吗？"}, {"speaker": "B", "en": "Yes, please.", "zh": "是的，请（给我鸡汤）。"}, {"speaker": "A", "en": "Where does your coconut come from?", "zh": "你的椰子是哪里的？"}, {"speaker": "B", "en": "Hainan!", "zh": "海南！"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Appendix 4", "scene": "Unit 6", "function": "询问信息", "turns": [{"speaker": "A", "en": "Is there a waterfall in the forest?", "zh": "森林里有瀑布吗？"}, {"speaker": "B", "en": "Yes, there is.", "zh": "是的，这里有。"}, {"speaker": "A", "en": "Are there any famous mountains in the nature park?", "zh": "自然公园有名山吗？"}, {"speaker": "B", "en": "Yes, there are.", "zh": "是的，这里有。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Appendix 4", "scene": "Unit 4", "function": "请求与应答", "turns": [{"speaker": "A", "en": "How can we all stay healthy?", "zh": "我们怎样才能保持健康？"}, {"speaker": "B", "en": "We should eat healthy food.", "zh": "我们应该吃健康的食物。"}, {"speaker": "A", "en": "Can I play on Mum's phone?", "zh": "我可以玩玩妈妈的手机吗？"}, {"speaker": "B", "en": "No. You shouldn't play on a phone so often.", "zh": "不行。你不应总是玩手机。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 1", "scene": "A Let's talk", "function": "询问信息", "turns": [{"speaker": "Zhang Peng", "en": "When do you finish class in the morning?", "zh": "你早上什么时候下课？"}, {"speaker": "Pedro", "en": "We finish class at 1 o’clock. Then we eat lunch at home.", "zh": "我们1点下课。然后我们在家吃午饭。"}, {"speaker": "Zhang Peng", "en": "Wow! When do you go back to school after lunch?", "zh": "哇！午饭后你们什么时候回学校？"}, {"speaker": "Pedro", "en": "At 2:30. Classes start at 3 o’clock.", "zh": "2点半。3点开始上课。"}, {"speaker": "Zhang Peng", "en": "When do you usually eat dinner in Spain?", "zh": "在西班牙你们通常什么时候吃晚饭？"}, {"speaker": "Pedro", "en": "Usually at 9:30 or 10 o’clock.", "zh": "通常9点半或10点。"}, {"speaker": "Zhang Peng", "en": "Wow! That’s too late!", "zh": "哇！那太晚了！"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 1", "scene": "A Let's try", "function": "询问信息", "turns": [{"speaker": "A", "en": "When do you get up?", "zh": "你什么时候起床？"}, {"speaker": "B", "en": "I get up at 6:00 a.m.", "zh": "我早上6点起床。"}, {"speaker": "A", "en": "When do you go to bed?", "zh": "你什么时候睡觉？"}, {"speaker": "B", "en": "At 6 o’clock in the morning.", "zh": "早上6点。"}, {"speaker": "B", "en": "I work at night.", "zh": "我晚上工作。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 1", "scene": "B Let's talk", "function": "询问信息", "turns": [{"speaker": "Shopkeeper", "en": "Why are you shopping today?", "zh": "你今天为什么来购物？"}, {"speaker": "Sarah", "en": "My mum worked last night. So I’m shopping today.", "zh": "我妈妈昨晚工作了。所以我今天来购物。"}, {"speaker": "Shopkeeper", "en": "Good girl! So what do you do on the weekend?", "zh": "好孩子！那你周末做什么？"}, {"speaker": "Sarah", "en": "I often watch TV and play ping-pong with my father.", "zh": "我经常看电视，和爸爸打乒乓球。"}, {"speaker": "Shopkeeper", "en": "That sounds like a lot of fun.", "zh": "听起来很有趣。"}, {"speaker": "Sarah", "en": "Yes, but I’m also hard-working.", "zh": "是的，但我也很勤奋。"}, {"speaker": "Sarah", "en": "I usually wash my clothes.", "zh": "我通常洗衣服。"}, {"speaker": "Sarah", "en": "Sometimes I cook dinner.", "zh": "有时我做晚饭。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 1", "scene": "C Story time", "function": "询问信息", "turns": [{"speaker": "Zip", "en": "It’s Saturday now. Zoom, I’m always very busy.", "zh": "现在是星期六。Zoom，我总是很忙。"}, {"speaker": "Zoom", "en": "Why?", "zh": "为什么？"}, {"speaker": "Zip", "en": "On Friday, I eat nuts with my friends.", "zh": "星期五，我和朋友们一起吃坚果。"}, {"speaker": "Zoom", "en": "What do you usually do on the weekend?", "zh": "你周末通常做什么？"}, {"speaker": "Zip", "en": "I often watch TV, but this weekend I have a show. I’ll play the pipa.", "zh": "我经常看电视，但这个周末我有一场演出。我要弹琵琶。"}, {"speaker": "Zoom", "en": "When?", "zh": "什么时候？"}, {"speaker": "Zip", "en": "Saturday, at 12 o’clock.", "zh": "星期六，12点。"}, {"speaker": "Zip", "en": "Oh, no!", "zh": "哦，不！"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 2", "scene": "Mr Jones 与 Mike、Wu Binbin 讨论最喜欢的季节", "function": "表达喜好", "turns": [{"speaker": "Mr Jones", "en": "Do you like the music, children?", "zh": "孩子们，你们喜欢这首音乐吗？"}, {"speaker": "Mike", "en": "Yes. It’s very beautiful. What is it?", "zh": "是的。它非常美。这是什么？"}, {"speaker": "Mr Jones", "en": "Today we’ll draw the seasons. Which season do you like best, Mike?", "zh": "今天我们要画四季。Mike，你最喜欢哪个季节？"}, {"speaker": "Mike", "en": "Winter. I like snow.", "zh": "冬天。我喜欢雪。"}, {"speaker": "Mr Jones", "en": "I like snow, too. Which season do you like best, Wu Binbin?", "zh": "我也喜欢雪。Wu Binbin，你最喜欢哪个季节？"}, {"speaker": "Wu Binbin", "en": "Spring. It’s pretty.", "zh": "春天。它很美。"}, {"speaker": "Mr Jones", "en": "Yes, it is.", "zh": "是的，它很美。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 2", "scene": "Amy 与 Miss White 讨论最喜欢的季节", "function": "表达喜好", "turns": [{"speaker": "Amy", "en": "Hello, Miss White. Look at my picture.", "zh": "你好，White 老师。看我的画。"}, {"speaker": "Miss White", "en": "Good job! I like the trees. The colours are very pretty!", "zh": "做得好！我喜欢这些树。颜色非常漂亮！"}, {"speaker": "Amy", "en": "Yes. I like autumn best. The weather is good and the colours are beautiful! Which season do you like best, Miss White?", "zh": "是的。我最喜欢秋天。天气很好，颜色也很美！White 老师，你最喜欢哪个季节？"}, {"speaker": "Miss White", "en": "Summer.", "zh": "夏天。"}, {"speaker": "Amy", "en": "Why?", "zh": "为什么？"}, {"speaker": "Miss White", "en": "Because I like summer vacation!", "zh": "因为我喜欢暑假！"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 2", "scene": "Robin 谈论四季", "function": "表达喜好", "turns": [{"speaker": "Robin", "en": "Look at the green trees and pink flowers.", "zh": "看这些绿树和粉红色的花。"}, {"speaker": "Robin", "en": "The weather is hot, hot, hot!", "zh": "天气很热，很热，很热！"}, {"speaker": "Robin", "en": "What lovely colours! The leaves fall and fall and fall. I love fall!", "zh": "多美的颜色啊！树叶落啊落啊落。我爱秋天！"}, {"speaker": "Robin", "en": "There is lots of snow. It is white everywhere.", "zh": "有很多雪。到处都是白色的。"}, {"speaker": "Robin", "en": "I like spring because there are beautiful flowers everywhere.", "zh": "我喜欢春天，因为到处都有美丽的花。"}, {"speaker": "Robin", "en": "Wow! I want to paint a picture, too!", "zh": "哇！我也想画一幅画！"}, {"speaker": "Robin", "en": "I like winter because I can play in the snow.", "zh": "我喜欢冬天，因为我可以在雪里玩。"}, {"speaker": "Robin", "en": "I like summer, but I can’t swim.", "zh": "我喜欢夏天，但我不会游泳。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 2", "scene": "Boy 与 Girl 讨论最喜欢的季节", "function": "表达喜好", "turns": [{"speaker": "Boy", "en": "Which season do you like best?", "zh": "你最喜欢哪个季节？"}, {"speaker": "Girl", "en": "Spring.", "zh": "春天。"}, {"speaker": "Boy", "en": "Do you like summer?", "zh": "你喜欢夏天吗？"}, {"speaker": "Girl", "en": "No, I don’t. It’s too hot.", "zh": "不，我不喜欢。太热了。"}, {"speaker": "Boy", "en": "Which season do you like best?", "zh": "你最喜欢哪个季节？"}, {"speaker": "Girl", "en": "Autumn. The colours are beautiful. I can pick fresh apples.", "zh": "秋天。颜色很美。我可以摘新鲜苹果。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 2", "scene": "Zip、Zoom 与 Koala 讨论圣诞节与最喜欢的季节", "function": "表达喜好", "turns": [{"speaker": "Zip & Zoom", "en": "Welcome!", "zh": "欢迎！"}, {"speaker": "Koala", "en": "Thank you. Merry Christmas!", "zh": "谢谢。圣诞快乐！"}, {"speaker": "Zip & Zoom", "en": "Merry Christmas!", "zh": "圣诞快乐！"}, {"speaker": "Zoom", "en": "What do you usually do on Christmas Day?", "zh": "你通常在圣诞节做什么？"}, {"speaker": "Koala", "en": "I usually go to the beach and swim in the sea!", "zh": "我通常去海滩，在海里游泳！"}, {"speaker": "Zoom", "en": "You swim in winter?", "zh": "你在冬天游泳？"}, {"speaker": "Koala", "en": "Christmas is in summer in Australia, so we never have snow for Christmas.", "zh": "在澳大利亚，圣诞节在夏天，所以我们圣诞节从不下雪。"}, {"speaker": "Zoom", "en": "Which season do you like best?", "zh": "你最喜欢哪个季节？"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 3", "scene": "Let's talk", "function": "询问信息", "turns": [{"speaker": "A", "en": "When is Tree Planting Day?", "zh": "植树节是什么时候？"}, {"speaker": "B", "en": "It's in March.", "zh": "在三月。"}, {"speaker": "A", "en": "When is Dragon Boat Festival?", "zh": "端午节是什么时候？"}, {"speaker": "B", "en": "It's usually in June.", "zh": "通常在六月。"}, {"speaker": "A", "en": "When is the summer vacation?", "zh": "暑假是什么时候？"}, {"speaker": "B", "en": "It's in July and August.", "zh": "在七月和八月。"}, {"speaker": "A", "en": "When is the school trip this year?", "zh": "今年的学校旅行是什么时候？"}, {"speaker": "B", "en": "It's usually in May.", "zh": "通常在五月。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 3", "scene": "Let's talk", "function": "询问信息", "turns": [{"speaker": "Mike", "en": "We have a few fun things in spring.", "zh": "春天我们有一些有趣的活动。"}, {"speaker": "Mike", "en": "After the sports meet, we have an English party.", "zh": "运动会之后，我们有一个英语派对。"}, {"speaker": "Zhang Peng", "en": "When is the party?", "zh": "派对是什么时候？"}, {"speaker": "Mike", "en": "It's in April.", "zh": "在四月。"}, {"speaker": "Mike", "en": "We have a school trip, too.", "zh": "我们还有一个学校旅行。"}, {"speaker": "Zhang Peng", "en": "When is that?", "zh": "那是什么时候？"}, {"speaker": "Mike", "en": "It's in May.", "zh": "在五月。"}, {"speaker": "Zhang Peng", "en": "Cool!", "zh": "太酷了！"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 3", "scene": "Let's talk", "function": "询问信息", "turns": [{"speaker": "Oliver", "en": "I like autumn. I really like the colours.", "zh": "我喜欢秋天。我真的很喜欢那些颜色。"}, {"speaker": "Chen Jie", "en": "I like autumn, too. We usually have a school trip in autumn.", "zh": "我也喜欢秋天。我们通常在秋天有一次学校旅行。"}, {"speaker": "Oliver", "en": "Great! When is the trip this year?", "zh": "太棒了！今年的旅行是什么时候？"}, {"speaker": "Chen Jie", "en": "It's in October. We'll go to the Great Wall.", "zh": "在十月。我们将去长城。"}, {"speaker": "Oliver", "en": "Cool! I love the Great Wall!", "zh": "太酷了！我喜欢长城！"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 3", "scene": "Story time", "function": "询问信息", "turns": [{"speaker": "Zoom", "en": "Look at my summer vacation plan!", "zh": "看看我的暑假计划！"}, {"speaker": "Zip", "en": "It's April now. The summer vacation is still three months away.", "zh": "现在是四月。暑假还有三个月。"}, {"speaker": "Zoom", "en": "Early planning is always good.", "zh": "提前计划总是好的。"}, {"speaker": "Zip", "en": "What will you do there?", "zh": "你在那里会做什么？"}, {"speaker": "Zoom", "en": "We'll go to Grape Valley.", "zh": "我们将去葡萄谷。"}, {"speaker": "Zoom", "en": "The grapes there are very sweet! Grapes are my favourite fruit!", "zh": "那里的葡萄很甜！葡萄是我最喜欢的水果！"}, {"speaker": "Zip", "en": "You have a great plan, but what will you do this weekend?", "zh": "你有一个很棒的计划，但这个周末你会做什么？"}, {"speaker": "Zoom", "en": "This weekend?", "zh": "这个周末？"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 3", "scene": "Recycle 1", "function": "询问信息", "turns": [{"speaker": "Robin", "en": "Do you work at night?", "zh": "你晚上工作吗？"}, {"speaker": "Sarah's father", "en": "Yes, I'm a doctor. I often work at night.", "zh": "是的，我是医生。我经常晚上工作。"}, {"speaker": "Robin", "en": "When do you go to bed, then?", "zh": "那你什么时候睡觉？"}, {"speaker": "Sarah's father", "en": "At 9:00 a.m.", "zh": "在上午九点。"}, {"speaker": "Robin", "en": "Wow! When do you eat lunch?", "zh": "哇！你什么时候吃午饭？"}, {"speaker": "Sarah's father", "en": "At 2:00 p.m.", "zh": "在下午两点。"}, {"speaker": "Robin", "en": "When do you go home?", "zh": "你什么时候回家？"}, {"speaker": "Sarah's father", "en": "At 5:00 p.m.", "zh": "在下午五点。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "scene": "母亲节问候与介绍", "function": "问候与介绍", "turns": [{"speaker": "A", "en": "Happy birthday, Mum!", "zh": "生日快乐，妈妈！"}, {"speaker": "B", "en": "Thank you.", "zh": "谢谢你。"}, {"speaker": "A", "en": "When is Mother's Day?", "zh": "母亲节是什么时候？"}, {"speaker": "B", "en": "It's on the second Sunday in May.", "zh": "在五月第二个星期日。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "scene": "中秋节与生日蛋糕", "function": "询问信息", "turns": [{"speaker": "A", "en": "When is Mid-Autumn Festival this year?", "zh": "今年中秋节是什么时候？"}, {"speaker": "B", "en": "September 27th.", "zh": "9月27日。"}, {"speaker": "A", "en": "A birthday cake for Mid-Autumn Festival?!", "zh": "中秋节吃生日蛋糕？！"}, {"speaker": "B", "en": "My cousin's birthday is on Mid-Autumn Festival this year!", "zh": "我表哥的生日今年正好是中秋节！"}, {"speaker": "A", "en": "What do you usually do on Mid-Autumn Festival?", "zh": "你们中秋节通常做什么？"}, {"speaker": "B", "en": "We eat mooncakes.", "zh": "我们吃月饼。"}, {"speaker": "B", "en": "My family will also eat a birthday cake.", "zh": "我们家也会吃一个生日蛋糕。"}, {"speaker": "A", "en": "Cool!", "zh": "太酷了！"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "scene": "五月特殊日子", "function": "询问信息", "turns": [{"speaker": "Mr Jones", "en": "There are some other special days in May.", "zh": "五月还有一些其他特殊的日子。"}, {"speaker": "Zhang Peng", "en": "What are they?", "zh": "它们是什么？"}, {"speaker": "Mr Jones", "en": "The school art show and the reading festival.", "zh": "学校艺术展和读书节。"}, {"speaker": "Zhang Peng", "en": "When is the art show?", "zh": "艺术展是什么时候？"}, {"speaker": "Mr Jones", "en": "It's on May 1st.", "zh": "在5月1日。"}, {"speaker": "Zhang Peng", "en": "It's Labour Day. When is the reading festival?", "zh": "那是劳动节。读书节是什么时候？"}, {"speaker": "Mr Jones", "en": "It's on May 5th.", "zh": "在5月5日。"}, {"speaker": "Zhang Peng", "en": "Wow! May is fun!", "zh": "哇！五月真有趣！"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "scene": "国庆节", "function": "询问信息", "turns": [{"speaker": "A", "en": "When is China's National Day?", "zh": "国庆节是什么时候？"}, {"speaker": "B", "en": "It's on October 1st.", "zh": "在10月1日。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "scene": "Let's talk 假期对话", "function": "询问信息", "turns": [{"speaker": "A", "en": "When is the sports meet?", "zh": "运动会是什么时候？"}, {"speaker": "B", "en": "It's on November 2nd.", "zh": "在11月2日。"}, {"speaker": "A", "en": "When is the English test?", "zh": "英语考试是什么时候？"}, {"speaker": "B", "en": "It's on April 5th.", "zh": "在4月5日。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "scene": "生日派对邀请", "function": "邀请与建议", "turns": [{"speaker": "Chen Jie", "en": "When is your birthday?", "zh": "你的生日是什么时候？"}, {"speaker": "Mike", "en": "My birthday is on April 4th.", "zh": "我的生日是4月4日。"}, {"speaker": "Chen Jie", "en": "That's my mother's birthday, too!", "zh": "那也是我妈妈的生日！"}, {"speaker": "Mike", "en": "Cool! What will you do for your mum?", "zh": "太酷了！你打算为你妈妈做什么？"}, {"speaker": "Chen Jie", "en": "I'll cook noodles for her.", "zh": "我会给她煮面条。"}, {"speaker": "Mike", "en": "Chinese noodles are delicious!", "zh": "中国面条很好吃！"}, {"speaker": "Chen Jie", "en": "Please come then. We can have a birthday party for both of you!", "zh": "那请来吧。我们可以为你们俩办一个生日派对！"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "scene": "新年生日", "function": "询问信息", "turns": [{"speaker": "A", "en": "When is your birthday?", "zh": "你的生日是什么时候？"}, {"speaker": "B", "en": "My birthday is on January 1st.", "zh": "我的生日是1月1日。"}, {"speaker": "A", "en": "That's New Year's Day!", "zh": "那是新年！"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "scene": "Role-play 生日询问", "function": "询问信息", "turns": [{"speaker": "A", "en": "When is Grandpa's birthday?", "zh": "爷爷的生日是什么时候？"}, {"speaker": "B", "en": "It's on October 12th.", "zh": "在10月12日。"}, {"speaker": "A", "en": "When is your birthday?", "zh": "你的生日是什么时候？"}, {"speaker": "B", "en": "My birthday is on March 21st.", "zh": "我的生日是3月21日。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "scene": "Zoom 练习唱歌", "function": "邀请与建议", "turns": [{"speaker": "Music teacher", "en": "The singing test will be on May 4th.", "zh": "唱歌考试将在5月4日。"}, {"speaker": "Zoom", "en": "I can't sing well.", "zh": "我唱得不好。"}, {"speaker": "Zip", "en": "Don't worry. Practice makes perfect.", "zh": "别担心。熟能生巧。"}, {"speaker": "Zip", "en": "Will you come to the party? Today is Rabbit's birthday.", "zh": "你会来参加派对吗？今天是兔子的生日。"}, {"speaker": "Zoom", "en": "Sorry, I can't. I want to practise my song.", "zh": "对不起，我不能。我想练习我的歌。"}, {"speaker": "Rabbit", "en": "Will you play football with me after lunch?", "zh": "午饭后你愿意和我一起踢足球吗？"}, {"speaker": "Zoom", "en": "Sorry, I can't. I want to practise the song.", "zh": "对不起，我不能。我想练习这首歌。"}, {"speaker": "Cat", "en": "Let's watch TV together. The show is very funny!", "zh": "我们一起看电视吧。这个节目很有趣！"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 5", "scene": "Let's talk (A)", "function": "询问信息", "turns": [{"speaker": "Chen Jie", "en": "The yellow picture is mine.", "zh": "这张黄色的画是我的。"}, {"speaker": "Chen Jie", "en": "Are these all ours?", "zh": "这些都是我们的吗？"}, {"speaker": "Mike", "en": "Yes, they are.", "zh": "是的，它们是。"}, {"speaker": "Chen Jie", "en": "Wow! That picture of Beijing is beautiful.", "zh": "哇！那张北京的画真美。"}, {"speaker": "Chen Jie", "en": "Whose is it?", "zh": "它是谁的？"}, {"speaker": "Mike", "en": "It’s Zhang Peng’s.", "zh": "它是张鹏的。"}, {"speaker": "Chen Jie", "en": "Look! There is a picture of Shanghai, too.", "zh": "看！还有一张上海的画。"}, {"speaker": "Mike", "en": "It’s Binbin’s.", "zh": "它是彬彬的。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 5", "scene": "Let's talk (B)", "function": "询问信息", "turns": [{"speaker": "Sam", "en": "Where is Fido now?", "zh": "Fido现在在哪里？"}, {"speaker": "Chen Jie", "en": "He’s in the kitchen.", "zh": "他在厨房里。"}, {"speaker": "Sam", "en": "Is he drinking water?", "zh": "他在喝水吗？"}, {"speaker": "Chen Jie", "en": "No, he isn’t. He’s eating.", "zh": "不，他不是。他在吃东西。"}, {"speaker": "Sam", "en": "Can I play with him now?", "zh": "我现在可以和他玩吗？"}, {"speaker": "Chen Jie", "en": "Yes. Can you take him to the park?", "zh": "可以。你能带他去公园吗？"}, {"speaker": "Sam", "en": "Of course! Fido, come here!", "zh": "当然！Fido，过来！"}, {"speaker": "Fido", "en": "Woof, woof!", "zh": "汪汪！"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 5", "scene": "Story time", "function": "询问信息", "turns": [{"speaker": "Zoom", "en": "What are they doing?", "zh": "他们在做什么？"}, {"speaker": "Zip", "en": "Why are they looking at us?", "zh": "他们为什么看着我们？"}, {"speaker": "Zoom", "en": "I don’t know.", "zh": "我不知道。"}, {"speaker": "Zip", "en": "Look! They’re taking pictures, too.", "zh": "看！他们也在拍照。"}, {"speaker": "Zoom", "en": "That’s cute. They’re copying us!", "zh": "真可爱。他们在模仿我们！"}, {"speaker": "Zoom", "en": "Whose tail is that?", "zh": "那是谁的尾巴？"}, {"speaker": "Zoom", "en": "It’s running so fast.", "zh": "它跑得真快。"}, {"speaker": "Zoom", "en": "Is it the tiger’s?", "zh": "是老虎的吗？"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 6", "scene": "A. 看熊猫、猴子和大象", "function": "描述事物", "turns": [{"speaker": "Chen Jie", "en": "Look at the pandas.", "zh": "看这些熊猫。"}, {"speaker": "Mike", "en": "What are they doing?", "zh": "它们在做什么？"}, {"speaker": "Chen Jie", "en": "Haha. They’re eating lunch! They’re so cute.", "zh": "哈哈。它们在吃午饭！它们真可爱。"}, {"speaker": "Mike", "en": "Oh, yes! They like bamboo.", "zh": "哦，是的！它们喜欢竹子。"}, {"speaker": "Chen Jie", "en": "What’s the little monkey doing?", "zh": "那只小猴子在做什么？"}, {"speaker": "Mike", "en": "It’s playing with its mother!", "zh": "它正在和妈妈玩！"}, {"speaker": "Chen Jie", "en": "Do you see any elephants?", "zh": "你看到大象了吗？"}, {"speaker": "Mike", "en": "Yes! Look there! The elephant is drinking water.", "zh": "看到了！看那边！大象正在喝水。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 6", "scene": "B. 图书馆里保持安静", "function": "请求与应答", "turns": [{"speaker": "Tom", "en": "My name is Tom. What’s your name?", "zh": "我叫汤姆。你叫什么名字？"}, {"speaker": "John", "en": "Shh. Talk quietly. I’m John. I can show you the English books.", "zh": "嘘。小声说话。我叫约翰。我可以给你看英语书。"}, {"speaker": "Tom", "en": "Thanks.", "zh": "谢谢。"}, {"speaker": "John", "en": "Here they are.", "zh": "给你。"}, {"speaker": "Tom", "en": "OK. Can I read the books here?", "zh": "好的。我可以在这儿看书吗？"}, {"speaker": "John", "en": "Yes. Of course.", "zh": "可以。当然可以。"}, {"speaker": "Tom", "en": "Anything else?", "zh": "还有别的吗？"}, {"speaker": "John", "en": "Yes. Keep your desk clean.", "zh": "有。保持你的书桌整洁。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 6", "scene": "C. 电影院里看大猩猩", "function": "感受与情绪", "turns": [{"speaker": "Zip", "en": "I love the film.", "zh": "我喜欢这部电影。"}, {"speaker": "Zoom", "en": "Yes. The gorilla is great!", "zh": "是的。大猩猩太棒了！"}, {"speaker": "Zip", "en": "Wow! The gorilla is eating a banana.", "zh": "哇！大猩猩正在吃香蕉。"}, {"speaker": "Zoom", "en": "It’s so big and strong.", "zh": "它又大又强壮。"}, {"speaker": "Zip", "en": "What’s that noise?", "zh": "那是什么声音？"}, {"speaker": "Zoom", "en": "I’m eating popcorn.", "zh": "我在吃爆米花。"}, {"speaker": "Zip", "en": "It’s so exciting!", "zh": "太激动人心了！"}, {"speaker": "Zoom", "en": "Yes, it is!", "zh": "是的，确实如此！"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Appendix 1", "scene": "Unit 1 My weekend", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "I like to do things on the weekend.", "zh": "我喜欢在周末做事情。"}, {"speaker": "Chant", "en": "I clean my room and go shopping at the mall.", "zh": "我打扫房间，去商场购物。"}, {"speaker": "Chant", "en": "I have a music class and do exercises.", "zh": "我上音乐课并做运动。"}, {"speaker": "Chant", "en": "I play football and play basketball.", "zh": "我踢足球和打篮球。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Appendix 1", "scene": "Unit 3 The twelve months", "function": "询问信息", "turns": [{"speaker": "Chant", "en": "Apples, peaches, pears and plums,", "zh": "苹果、桃子、梨和李子，"}, {"speaker": "Chant", "en": "Tell me when your birthday comes.", "zh": "告诉我你的生日是什么时候。"}, {"speaker": "Chant", "en": "January, February, March, April,", "zh": "一月、二月、三月、四月，"}, {"speaker": "Chant", "en": "May, June, July, August,", "zh": "五月、六月、七月、八月，"}, {"speaker": "Chant", "en": "September, October, November, December.", "zh": "九月、十月、十一月、十二月。"}, {"speaker": "Chant", "en": "Please tell me when it’s your birthday.", "zh": "请告诉我你的生日是什么时候。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Appendix 1", "scene": "Unit 2 What’s your favourite season?", "function": "表达喜好", "turns": [{"speaker": "Chant", "en": "Summer, winter,", "zh": "夏天、冬天，"}, {"speaker": "Chant", "en": "Spring and fall,", "zh": "春天和秋天，"}, {"speaker": "Chant", "en": "Spring and fall,", "zh": "春天和秋天，"}, {"speaker": "Chant", "en": "Spring and fall.", "zh": "春天和秋天。"}, {"speaker": "Chant", "en": "Summer, winter,", "zh": "夏天、冬天，"}, {"speaker": "Chant", "en": "Spring and fall,", "zh": "春天和秋天，"}, {"speaker": "Chant", "en": "What’s your favourite season?", "zh": "你最喜欢哪个季节？"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Appendix 1", "scene": "Unit 4 When is your birthday?", "function": "询问信息", "turns": [{"speaker": "Chant", "en": "My birthday is in January. My birthday is in January.", "zh": "我的生日在一月。我的生日在一月。"}, {"speaker": "Chant", "en": "My birthday is in January. It’s on January 1st.", "zh": "我的生日在一月。它是一月一日。"}, {"speaker": "Chant", "en": "My birthday is in August. My birthday is in August.", "zh": "我的生日在八月。我的生日在八月。"}, {"speaker": "Chant", "en": "My birthday is in August. It’s on August 5th.", "zh": "我的生日在八月。它是八月五日。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Appendix 1", "scene": "Unit 5 Animals, animals are everywhere", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "Rabbits and monkeys and elephants,", "zh": "兔子、猴子和大象，"}, {"speaker": "Chant", "en": "Pandas and tigers, too.", "zh": "还有熊猫和老虎。"}, {"speaker": "Chant", "en": "Some are climbing, some are jumping,", "zh": "有的在爬，有的在跳，"}, {"speaker": "Chant", "en": "Animals in the zoo.", "zh": "动物园里的动物。"}, {"speaker": "Chant", "en": "Cats and monkeys and elephants,", "zh": "猫、猴子和大象，"}, {"speaker": "Chant", "en": "A dog, a rabbit, a bear.", "zh": "一只狗，一只兔子，一只熊。"}, {"speaker": "Chant", "en": "Some are eating, some are sleeping,", "zh": "有的在吃，有的在睡，"}, {"speaker": "Chant", "en": "Animals everywhere!", "zh": "动物无处不在！"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Appendix 1", "scene": "Unit 6 School days", "function": "其他", "turns": [{"speaker": "Chant", "en": "School days! School days!", "zh": "校园时光！校园时光！"}, {"speaker": "Chant", "en": "We come to work and play.", "zh": "我们来学习和玩耍。"}, {"speaker": "Chant", "en": "We need to work and talk quietly.", "zh": "我们需要安静地学习和说话。"}, {"speaker": "Chant", "en": "And listen every day.", "zh": "并且每天倾听。"}, {"speaker": "Chant", "en": "We need to keep our desks clean.", "zh": "我们需要保持课桌整洁。"}, {"speaker": "Chant", "en": "We need to take turns to talk.", "zh": "我们需要轮流说话。"}, {"speaker": "Chant", "en": "Keep to the left,", "zh": "靠左走，"}, {"speaker": "Chant", "en": "And keep to the right.", "zh": "并且靠右走。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Appendix 4", "scene": "Unit 1 上午课程结束时间", "function": "时间与日程", "turns": [{"speaker": "A", "en": "When do you finish class in the morning?", "zh": "你们上午的课到几点结束？"}, {"speaker": "B", "en": "We finish class at 1 o’clock.", "zh": "我们一点钟结束上午的课。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Appendix 4", "scene": "Unit 1 周末活动", "function": "询问信息", "turns": [{"speaker": "A", "en": "What do you do on the weekend?", "zh": "你周末做什么？"}, {"speaker": "B", "en": "I often watch TV and play ping-pong with my father.", "zh": "我经常看电视，也常和我爸爸一起打乒乓球。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Appendix 4", "scene": "Unit 2 最喜欢的季节", "function": "表达喜好", "turns": [{"speaker": "A", "en": "Which season do you like best, Miss White?", "zh": "怀特小姐，你最喜欢哪个季节？"}, {"speaker": "B", "en": "Summer.", "zh": "夏天。"}, {"speaker": "A", "en": "Why?", "zh": "为什么？"}, {"speaker": "B", "en": "Because I like summer vacation!", "zh": "因为我喜欢暑假！"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Appendix 4", "scene": "Unit 3 聚会时间", "function": "时间与日程", "turns": [{"speaker": "A", "en": "When is the party?", "zh": "聚会什么时候举行？"}, {"speaker": "B", "en": "It’s in April.", "zh": "在4月。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Appendix 4", "scene": "Unit 3 今年秋游时间", "function": "时间与日程", "turns": [{"speaker": "A", "en": "When is the trip this year?", "zh": "今年的（秋）游在什么时候？"}, {"speaker": "B", "en": "It’s in October. We’ll go to the Great Wall.", "zh": "在10月。我们将去长城。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Appendix 4", "scene": "Unit 4 艺术节与生日时间", "function": "时间与日程", "turns": [{"speaker": "A", "en": "When is the art show?", "zh": "艺术节是哪天？"}, {"speaker": "B", "en": "It’s on May 1st.", "zh": "它在5月1日。"}, {"speaker": "A", "en": "When is your birthday?", "zh": "你的生日是哪天？"}, {"speaker": "B", "en": "My birthday is on April 4th.", "zh": "我的生日是4月4日。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 1", "scene": "Zhang Peng 和 Leo 谈论上周末的活动", "function": "询问信息", "turns": [{"speaker": "Zhang Peng", "en": "Hi, Leo! How was your weekend?", "zh": "嗨，Leo！你周末过得怎么样？"}, {"speaker": "Leo", "en": "Not too bad, thanks. And you?", "zh": "还不错，谢谢。你呢？"}, {"speaker": "Zhang Peng", "en": "It was great! I climbed the Great Wall.", "zh": "太棒了！我爬了长城。"}, {"speaker": "Leo", "en": "Wow! The Great Wall is amazing.", "zh": "哇！长城太神奇了。"}, {"speaker": "Zhang Peng", "en": "Yes, it is! It's about 21,000 kilometres long. What did you do, Leo?", "zh": "是的！它大约有两万一千公里长。你做了什么，Leo？"}, {"speaker": "Leo", "en": "I visited the \"Gingerbread House\" last Saturday.", "zh": "我上周六参观了“姜饼屋”。"}, {"speaker": "Zhang Peng", "en": "What did you do there? Eat gingerbread?", "zh": "你在那里做了什么？吃姜饼吗？"}, {"speaker": "Leo", "en": "Ha! Ha! No! It's a beautiful train station in New Zealand.", "zh": "哈哈！不！它是新西兰的一个美丽火车站。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 1", "scene": "Amy、Binbin 和 Sarah 谈论暑假旅行", "function": "询问信息", "turns": [{"speaker": "Amy", "en": "Where did you go over the summer holidays, Binbin?", "zh": "Binbin，你暑假去了哪里？"}, {"speaker": "Binbin", "en": "I went to Xi'an with my family.", "zh": "我和家人去了西安。"}, {"speaker": "Sarah", "en": "I like Xi'an. What did you do there?", "zh": "我喜欢西安。你在那里做了什么？"}, {"speaker": "Binbin", "en": "We ate some famous Xi'an noodles. Then we went to see the Terracotta Warriors.", "zh": "我们吃了一些著名的西安面条。然后我们去看兵马俑。"}, {"speaker": "Sarah", "en": "Wow! I really want to go there! How was it?", "zh": "哇！我真的很想去那里！怎么样？"}, {"speaker": "Binbin", "en": "Amazing! There are over seven thousand clay warriors and horses.", "zh": "太神奇了！有七千多个陶俑和陶马。"}, {"speaker": "Amy", "en": "I saw pictures on the internet. What else did you do?", "zh": "我在网上看过照片。你还做了什么？"}, {"speaker": "Binbin", "en": "Well, we walked around the old city and rode bikes on the old city wall.", "zh": "嗯，我们在老城区散步，还在古城墙上骑自行车。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 1", "scene": "谈论假期去了哪里以及做了什么", "function": "询问信息", "turns": [{"speaker": "A", "en": "Where did you go over the holidays?", "zh": "你假期去了哪里？"}, {"speaker": "B", "en": "I went to Wuhan.", "zh": "我去了武汉。"}, {"speaker": "B", "en": "I ate hot dry noodles.", "zh": "我吃了热干面。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 1", "scene": "谈论上周末去了附近的村庄", "function": "描述事物", "turns": [{"speaker": "A", "en": "Last week my family took a trip to a nearby village.", "zh": "上周我家人去了一个附近的村庄旅行。"}, {"speaker": "A", "en": "We saw many ducks and ate fresh fruit there.", "zh": "我们在那里看到了许多鸭子，还吃了新鲜水果。"}, {"speaker": "A", "en": "It was warm and sunny.", "zh": "天气温暖晴朗。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 1", "scene": "John、Zhang Peng 和 Amy 谈论假期去了哪里以及做了什么", "function": "询问信息", "turns": [{"speaker": "John", "en": "Zhang Peng, Amy, where did you go?", "zh": "Zhang Peng，Amy，你们去了哪里？"}, {"speaker": "Zhang Peng", "en": "I took a trip to Guangzhou.", "zh": "我去了广州旅行。"}, {"speaker": "Amy", "en": "What did you do there?", "zh": "你在那里做了什么？"}, {"speaker": "Zhang Peng", "en": "...", "zh": "……"}, {"speaker": "John", "en": "I went to Hangzhou and Shaoxing. I visited Lu Xun Native Place. Lu Xun was a famous writer.", "zh": "我去了杭州和绍兴。我参观了鲁迅故里。鲁迅是一位著名的作家。"}, {"speaker": "Zhang Peng", "en": "Yes, he was. He wrote a lot of great books.", "zh": "是的，他是。他写了很多很棒的书。"}, {"speaker": "Amy", "en": "...", "zh": "……"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 2", "scene": "Mike 和 Binbin 谈论中秋节假期", "function": "询问信息", "turns": [{"speaker": "Mike", "en": "How was your Mid-Autumn Festival holiday, Binbin?", "zh": "Binbin，你的中秋节假期过得怎么样？"}, {"speaker": "Binbin", "en": "It was great! My family and I had a really nice day.", "zh": "太棒了！我和家人度过了非常愉快的一天。"}, {"speaker": "Mike", "en": "What did you do? Did you take a trip?", "zh": "你们做了什么？去旅行了吗？"}, {"speaker": "Binbin", "en": "No, we didn't. My aunt's family visited us.", "zh": "没有。我阿姨一家来看望我们了。"}, {"speaker": "Mike", "en": "Did you eat mooncakes?", "zh": "你们吃月饼了吗？"}, {"speaker": "Binbin", "en": "Yes, we did. We enjoyed some mooncakes and fruit. Grandpa told us some stories about the festival.", "zh": "是的，我们吃了。我们享用了月饼和水果。爷爷给我们讲了一些关于这个节日的故事。"}, {"speaker": "Mike", "en": "Wow! Can I join you next year?", "zh": "哇！明年我可以加入你们吗？"}, {"speaker": "Binbin", "en": "Sure. You can also join us for the Spring Festival. We can paste fu and eat jiaozi together.", "zh": "当然可以。你也可以和我们一起过春节。我们可以一起贴福字、吃饺子。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 2", "scene": "Let's talk 关于春节的活动", "function": "询问信息", "turns": [{"speaker": "A", "en": "Did you eat mooncakes?", "zh": "你们吃月饼了吗？"}, {"speaker": "B", "en": "No, we didn't.", "zh": "没有。"}, {"speaker": "A", "en": "Did you count down to 12 o'clock?", "zh": "你们倒计时到12点了吗？"}, {"speaker": "B", "en": "Yes, we did.", "zh": "是的，我们倒计时了。"}, {"speaker": "A", "en": "Oh, it's the Spring Festival!", "zh": "哦，是春节！"}, {"speaker": "B", "en": "My dad and I cleaned the house.", "zh": "我和爸爸打扫了房子。"}, {"speaker": "A", "en": "My sister and I pasted fu on the door.", "zh": "我和姐姐在门上贴了福字。"}, {"speaker": "B", "en": "We waited for the Spring Festival Gala.", "zh": "我们等待春节联欢晚会。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 2", "scene": "Chen Jie 和 Amy 谈论上周末", "function": "询问信息", "turns": [{"speaker": "Chen Jie", "en": "How was your weekend, Amy?", "zh": "Amy，你的周末过得怎么样？"}, {"speaker": "Amy", "en": "It was great. My mother and I went to a marathon on Sunday. She worked as a volunteer. I watched the race.", "zh": "太棒了。周日我和妈妈去了一场马拉松。她当志愿者，我观看了比赛。"}, {"speaker": "Chen Jie", "en": "What did you like about it?", "zh": "你喜欢它什么？"}, {"speaker": "Amy", "en": "I liked watching the runners. They ran very fast. I cheered for them.", "zh": "我喜欢看跑步的人。他们跑得很快。我为他们加油。"}, {"speaker": "Binbin", "en": "Nice! And you, Chen Jie? What did you do last weekend?", "zh": "不错！你呢，Chen Jie？你上周末做了什么？"}, {"speaker": "Chen Jie", "en": "I joined an online book fair. I liked it very much.", "zh": "我参加了一个线上书展。我非常喜欢。"}, {"speaker": "Binbin", "en": "What did you like about it?", "zh": "你喜欢它什么？"}, {"speaker": "Chen Jie", "en": "We shared ideas and talked about different books.", "zh": "我们分享想法，谈论不同的书。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 2", "scene": "Zhang Peng 和 Sarah 谈论书展", "function": "询问信息", "turns": [{"speaker": "Zhang Peng", "en": "Did you go to the book fair yesterday?", "zh": "你昨天去书展了吗？"}, {"speaker": "Sarah", "en": "Yes, I did. I liked it.", "zh": "是的，我去了。我很喜欢。"}, {"speaker": "Zhang Peng", "en": "What did you like about it?", "zh": "你喜欢它什么？"}, {"speaker": "Sarah", "en": "The writer read his book to us.", "zh": "作者给我们读了他的书。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 2", "scene": "Miss White 和 Binbin 谈论重阳节照片", "function": "询问信息", "turns": [{"speaker": "Miss White", "en": "Are these photos from the Double Ninth Festival this year?", "zh": "这些照片是今年重阳节的吗？"}, {"speaker": "Binbin", "en": "Yes, they are.", "zh": "是的，它们是。"}, {"speaker": "Miss White", "en": "Did the old people have a good time?", "zh": "老人们玩得开心吗？"}, {"speaker": "Binbin", "en": "Yes, they did.", "zh": "是的，他们很开心。"}, {"speaker": "Miss White", "en": "What did they like about it?", "zh": "他们喜欢什么？"}, {"speaker": "Binbin", "en": "...", "zh": "……"}, {"speaker": "Miss White", "en": "Did you ...?", "zh": "你们……了吗？"}, {"speaker": "Binbin", "en": "...", "zh": "……"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 3", "scene": "Mike and Chen Jie are in the playground.", "function": "询问信息", "turns": [{"speaker": "Mike", "en": "Hello?", "zh": "你好？"}, {"speaker": "Binbin", "en": "Hi, Mike. It's Binbin. I'm going to the science museum tomorrow. Are you going?", "zh": "嗨，Mike。我是Binbin。我明天要去科学博物馆。你去吗？"}, {"speaker": "Mike", "en": "I'm afraid not, Binbin. I have a bad cold.", "zh": "恐怕不行，Binbin。我得了重感冒。"}, {"speaker": "Binbin", "en": "Oh dear! How do you feel?", "zh": "天哪！你感觉怎么样？"}, {"speaker": "Mike", "en": "I feel ill. My head hurts and I have a runny nose.", "zh": "我感觉不舒服。我头疼，还流鼻涕。"}, {"speaker": "Binbin", "en": "I'm sorry to hear that. Maybe you should see a doctor.", "zh": "听到这个我很难过。也许你应该去看医生。"}, {"speaker": "Mike", "en": "I know. My mum is going to take me to hospital this afternoon.", "zh": "我知道。今天下午我妈妈要带我去医院。"}, {"speaker": "Binbin", "en": "That's good. Take care and get well soon!", "zh": "那很好。保重，早日康复！"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 3", "scene": "Let's talk: How do we know we are ill?", "function": "询问信息", "turns": [{"speaker": "A", "en": "What's the matter?", "zh": "怎么了？"}, {"speaker": "B", "en": "I have a bad cold. And I have a runny nose.", "zh": "我得了重感冒。而且我流鼻涕。"}, {"speaker": "A", "en": "You should ...", "zh": "你应该……"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 3", "scene": "Miss White and students discuss health.", "function": "描述事物", "turns": [{"speaker": "Miss White", "en": "Class, now we're going to discuss health. First, what is health?", "zh": "同学们，现在我们要讨论健康。首先，什么是健康？"}, {"speaker": "Chen Jie", "en": "Health is having a good body and feeling happy.", "zh": "健康就是身体好并且感到快乐。"}, {"speaker": "Miss White", "en": "Thank you, Chen Jie. So, how can we live a healthy life?", "zh": "谢谢你，Chen Jie。那么，我们怎样才能过上健康的生活？"}, {"speaker": "Sarah", "en": "We need to eat healthy food. We should exercise too.", "zh": "我们需要吃健康的食物。我们也应该锻炼。"}, {"speaker": "Miss White", "en": "That's right. What do you think, Binbin?", "zh": "没错。Binbin，你怎么看？"}, {"speaker": "Binbin", "en": "I think our family and friends are also very important.", "zh": "我认为我们的家人和朋友也非常重要。"}, {"speaker": "Chen Jie", "en": "Yes, it's always good to talk to our family and friends.", "zh": "是的，和家人朋友聊天总是好的。"}, {"speaker": "Miss White", "en": "Good job, everyone!", "zh": "大家做得好！"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 3", "scene": "Liu Jia and Miss White talk about feelings.", "function": "感受与情绪", "turns": [{"speaker": "Miss White", "en": "What's the matter, Liu Jia? You look sad.", "zh": "怎么了，Liu Jia？你看起来很伤心。"}, {"speaker": "Liu Jia", "en": "I'm feeling down. My good friend Lucy moved to another city.", "zh": "我感到很沮丧。我的好朋友Lucy搬到了另一个城市。"}, {"speaker": "Miss White", "en": "Think about happy things. Call your friend or send her some emails.", "zh": "想想开心的事。给你的朋友打电话或给她发些邮件。"}, {"speaker": "Liu Jia", "en": "I tried that, but I still feel unhappy.", "zh": "我试过了，但我还是感到不开心。"}, {"speaker": "Miss White", "en": "Maybe you can do some exercise. Exercise may cheer you up!", "zh": "也许你可以做些运动。运动可能会让你振作起来！"}, {"speaker": "Miss White", "en": "Join some after-school clubs and make new friends! You can talk and have fun with them.", "zh": "加入一些课外俱乐部，结交新朋友！你可以和他们聊天、一起玩。"}, {"speaker": "Liu Jia", "en": "I will try. Thank you, Miss White.", "zh": "我会试试的。谢谢你，White老师。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 4", "scene": "Mike 和 Matt 谈论 Matt 的零花钱及打算怎么花", "function": "询问信息", "turns": [{"speaker": "Mike", "en": "Are you counting your pocket money, Matt?", "zh": "Matt，你在数你的零花钱吗？"}, {"speaker": "Matt", "en": "Yes. I have three hundred and fifty-seven yuan.", "zh": "是的。我有三百五十七元。"}, {"speaker": "Mike", "en": "Wow, that's a lot! How are you going to spend it?", "zh": "哇，好多啊！你打算怎么花？"}, {"speaker": "Matt", "en": "I'm going to buy a schoolbag.", "zh": "我打算买一个书包。"}, {"speaker": "Mike", "en": "Yes, you need a new one.", "zh": "是的，你需要一个新的。"}, {"speaker": "Matt", "en": "I also want to buy some animal books.", "zh": "我还想买一些动物书。"}, {"speaker": "Mike", "en": "Nice. They're interesting.", "zh": "不错。它们很有趣。"}, {"speaker": "Matt", "en": "Maybe I can also buy some ice cream.", "zh": "也许我还可以买一些冰淇淋。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 4", "scene": "Mum 和 Sarah 谈论 Sarah 的零花钱及购物计划", "function": "询问信息", "turns": [{"speaker": "Mum", "en": "How much pocket money do you have?", "zh": "你有多少零花钱？"}, {"speaker": "Sarah", "en": "I have one hundred and forty-six yuan.", "zh": "我有一百四十六元。"}, {"speaker": "Mum", "en": "What else are you going to buy?", "zh": "你还打算买什么？"}, {"speaker": "Sarah", "en": "A lot. But first I'm going to buy a pair of sunglasses for Grandpa.", "zh": "很多。但首先我打算给爷爷买一副太阳镜。"}, {"speaker": "Mum", "en": "That's so nice of you!", "zh": "你真好！"}, {"speaker": "Sarah", "en": "I also want to buy a microscope.", "zh": "我还想买一台显微镜。"}, {"speaker": "Mum", "en": "Good idea! But microscopes are expensive.", "zh": "好主意！但显微镜很贵。"}, {"speaker": "Sarah", "en": "I have some lucky money from the Spring Festival, but I still need to save more.", "zh": "我有春节的一些压岁钱，但我还需要再存一些。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 5", "scene": "Mr Liu 与孩子们在课堂上讨论天空与外太空", "function": "描述事物", "turns": [{"speaker": "Mr Liu", "en": "Hi, children. Let's talk about our planet Earth.", "zh": "嗨，孩子们。我们来谈谈我们的地球。"}, {"speaker": "Mr Liu", "en": "What can you see in the sky?", "zh": "你们能在天空中看到什么？"}, {"speaker": "Mike", "en": "The sky is often blue in the daytime. We can see the Sun and clouds. We can also see birds and planes.", "zh": "白天天空通常是蓝色的。我们可以看到太阳和云。我们还可以看到鸟和飞机。"}, {"speaker": "Amy", "en": "At night, we can see the Moon and the stars.", "zh": "晚上，我们可以看到月亮和星星。"}, {"speaker": "Mr Liu", "en": "Very good. But what can we see from outer space? Let's look at some photos from a space station.", "zh": "很好。但是从外太空我们可以看到什么？我们来看看一些来自空间站的照片。"}, {"speaker": "Binbin", "en": "Wow! We can see mountains, oceans and clouds.", "zh": "哇！我们可以看到山脉、海洋和云。"}, {"speaker": "Chen Jie", "en": "There are large oceans on Earth. It looks like a big blue marble.", "zh": "地球上有大片海洋。它看起来像一颗巨大的蓝色弹珠。"}, {"speaker": "Mike", "en": "It's so beautiful. I want to know more about our Mother Earth!", "zh": "太美了。我想知道更多关于我们的地球母亲的事情！"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 5", "scene": "Mike、Chen Jie 和 Oliver 讨论关于火星的杂志", "function": "询问信息", "turns": [{"speaker": "Mike", "en": "Hey, Chen Jie. What are you reading about?", "zh": "嘿，陈杰。你在读什么？"}, {"speaker": "Chen Jie", "en": "Mars.", "zh": "火星。"}, {"speaker": "Oliver", "en": "Mars? What does it say?", "zh": "火星？上面写了什么？"}, {"speaker": "Chen Jie", "en": "It talks about things on Mars.", "zh": "它讲的是火星上的事物。"}, {"speaker": "Oliver", "en": "Wow! Is there any water on Mars?", "zh": "哇！火星上有水吗？"}, {"speaker": "Chen Jie", "en": "Yes, there is. There is soil too.", "zh": "是的，有。也有土壤。"}, {"speaker": "Oliver", "en": "Oh! Are there any aliens?", "zh": "哦！有外星人吗？"}, {"speaker": "Chen Jie", "en": "I don't think so. They say there aren't any living things.", "zh": "我不这么认为。他们说没有任何生物。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 6", "scene": "Binbin 和 Mike 讨论项目选题", "function": "邀请与建议", "turns": [{"speaker": "Binbin", "en": "Hi, Mike. Any ideas about our project?", "zh": "嗨，Mike。关于我们的项目有什么想法吗？"}, {"speaker": "Mike", "en": "Maybe we can talk about water power.", "zh": "也许我们可以谈谈水力发电。"}, {"speaker": "Binbin", "en": "OK. We use water every day. Let's find out more about water power.", "zh": "好的。我们每天都用水。让我们多了解一些水力发电吧。"}, {"speaker": "Mike", "en": "What do you know about it?", "zh": "你对它了解多少？"}, {"speaker": "Binbin", "en": "Running water can make electricity. We can get power from the sea too.", "zh": "流动的水可以发电。我们也可以从海里获取能源。"}, {"speaker": "Mike", "en": "What else do you want to know about water?", "zh": "关于水你还想知道什么？"}, {"speaker": "Binbin", "en": "Well, where does water come from? How do we make power from water?", "zh": "嗯，水从哪里来？我们怎样用水发电？"}, {"speaker": "Mike", "en": "Good questions. Let's go to the library. We can work on it together.", "zh": "好问题。我们去图书馆吧。我们可以一起研究。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 6", "scene": "Mrs Green 与 Binbin、Mike 讨论如何节约能源", "function": "请求与应答", "turns": [{"speaker": "Mrs Green", "en": "We use energy every day. But many resources are running out. What should we do?", "zh": "我们每天都使用能源。但许多资源正在枯竭。我们该怎么办？"}, {"speaker": "Mike", "en": "We should save energy.", "zh": "我们应该节约能源。"}, {"speaker": "Mrs Green", "en": "Yes, but how can we save energy?", "zh": "是的，但我们怎样才能节约能源？"}, {"speaker": "Binbin", "en": "We can change our energy use.", "zh": "我们可以改变我们的能源使用方式。"}, {"speaker": "Mrs Green", "en": "Can you give us an example, Binbin?", "zh": "你能给我们举个例子吗，Binbin？"}, {"speaker": "Binbin", "en": "Sure. We can take quick showers. That will save energy and water.", "zh": "当然。我们可以快速洗澡。这样可以节约能源和水。"}, {"speaker": "Mike", "en": "I agree. We can also use LED lighting.", "zh": "我同意。我们还可以使用 LED 照明。"}, {"speaker": "Binbin", "en": "And we should always unplug our computers and TVs.", "zh": "而且我们应该总是拔掉电脑和电视的插头。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Revision", "scene": "Miss White 与学生们讨论学习博物馆", "function": "询问信息", "turns": [{"speaker": "Miss White", "en": "What do you want to learn about, children?", "zh": "孩子们，你们想学习什么？"}, {"speaker": "Binbin", "en": "I want to know about space and planets.", "zh": "我想知道关于太空和行星的知识。"}, {"speaker": "Chen Jie", "en": "I want to learn more about staying healthy.", "zh": "我想更多地了解如何保持健康。"}, {"speaker": "Mike", "en": "I want to know more about Chinese festivals.", "zh": "我想更多地了解中国的节日。"}, {"speaker": "Miss White", "en": "Those are great ideas! What can help you learn about these things?", "zh": "这些都是很棒的想法！什么可以帮助你们学习这些内容？"}, {"speaker": "Chen Jie", "en": "We can read books or use the internet.", "zh": "我们可以读书或使用互联网。"}, {"speaker": "Mike", "en": "We can travel to different places.", "zh": "我们可以去不同的地方旅行。"}, {"speaker": "Miss White", "en": "That's right. We can also learn in museums. This week, we're going to plan some museum trips.", "zh": "没错。我们也可以在博物馆里学习。这周，我们要计划一些博物馆之旅。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Revision", "scene": "Zhang Peng 和 Sarah 讨论博物馆旅行计划", "function": "询问信息", "turns": [{"speaker": "Zhang Peng", "en": "Do you have a plan for your museum trip?", "zh": "你有博物馆旅行的计划吗？"}, {"speaker": "Sarah", "en": "Yes, I'm going to visit some museums online.", "zh": "是的，我打算在线参观一些博物馆。"}, {"speaker": "Zhang Peng", "en": "That's a good idea!", "zh": "这是个好主意！"}, {"speaker": "Zhang Peng", "en": "I'm going to visit the China Great Wall Museum.", "zh": "我打算去参观中国长城博物馆。"}, {"speaker": "Sarah", "en": "Wow! But it's very far.", "zh": "哇！但是它很远。"}, {"speaker": "Zhang Peng", "en": "I have 100 yuan. The museum is free. But I need to take a bus and buy some food and drink. Before that, I want to look good in my photos.", "zh": "我有100元。博物馆是免费的。但我需要坐公交车并买一些食物和饮料。在那之前，我想在照片里看起来好看。"}, {"speaker": "Sarah", "en": "Ha! Ha! I want to see your photos.", "zh": "哈哈！我想看你的照片。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Revision", "scene": "记者采访 Binbin 和 John 关于博物馆参观", "function": "询问信息", "turns": [{"speaker": "Reporter", "en": "What did you see in the museum?", "zh": "你们在博物馆里看到了什么？"}, {"speaker": "Binbin", "en": "I saw a big spaceship. I also went into a mini space station.", "zh": "我看到了一艘大宇宙飞船。我还进入了一个迷你空间站。"}, {"speaker": "Reporter", "en": "Did you see any other interesting things there?", "zh": "你们在那里还看到其他有趣的东西吗？"}, {"speaker": "John", "en": "Yes. A robot dressed in a Tang suit. She pasted fu on the door.", "zh": "是的。一个穿着唐装的机器人。她在门上贴了福字。"}, {"speaker": "Reporter", "en": "What did you like about the museum?", "zh": "你们喜欢博物馆的什么？"}, {"speaker": "John", "en": "We watched a short play about Chang'e and Houyi. Then we saw another amazing robot. He gave us a speech.", "zh": "我们看了一出关于嫦娥和后羿的短剧。然后我们看到了另一个神奇的机器人。他给我们做了一场演讲。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Revision", "scene": "后羿与玉兔在月宫对话", "function": "问候与介绍", "turns": [{"speaker": "Narrator", "en": "It was the Mid-Autumn Festival. On the Moon, the Rabbit ran and jumped. Then he saw a big spaceship in the sky!", "zh": "那是中秋节。在月球上，玉兔跑着跳着。然后他看到天空中有一艘大宇宙飞船！"}, {"speaker": "Chang'e", "en": "How did you get to the Moon?", "zh": "你是怎么到月球的？"}, {"speaker": "Houyi", "en": "A spaceship brought me here. We have great spaceships in China.", "zh": "一艘宇宙飞船把我带到了这里。我们中国有伟大的宇宙飞船。"}, {"speaker": "Chang'e", "en": "Wow!", "zh": "哇！"}, {"speaker": "Houyi", "en": "Chang'e, you came to the Moon so long ago. What did you do here?", "zh": "嫦娥，你很久以前就来到月球了。你在这里做了什么？"}, {"speaker": "Chang'e", "en": "Rabbit and I read books and sang folk songs. But I always thought of our days together.", "zh": "我和玉兔读书、唱民歌。但我总是想起我们在一起的日子。"}, {"speaker": "Houyi", "en": "What did you do on Earth…?", "zh": "你在地球上做了什么……？"}, {"speaker": "Chang'e", "en": "Hello, Rabbit!", "zh": "你好，玉兔！"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Appendix 1", "scene": "Unit 1 Travelling around", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "I visited Beijing,", "zh": "我参观了北京。"}, {"speaker": "Chant", "en": "And I learnt about the place.", "zh": "我了解了这个地方。"}, {"speaker": "Chant", "en": "I went to Tian'anmen Square,", "zh": "我去了天安门广场，"}, {"speaker": "Chant", "en": "And to the Great Wall the next day.", "zh": "第二天去了长城。"}, {"speaker": "Chant", "en": "I visited Beijing,", "zh": "我参观了北京，"}, {"speaker": "Chant", "en": "And I learnt about its history.", "zh": "我了解了它的历史。"}, {"speaker": "Chant", "en": "I took so many pictures,", "zh": "我拍了很多照片，"}, {"speaker": "Chant", "en": "And ate new snacks on the street.", "zh": "还在街上吃了新小吃。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Appendix 1", "scene": "Unit 2 Getting together", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "My family and I, we have a great time.", "zh": "我和我的家人，我们玩得很开心。"}, {"speaker": "Chant", "en": "We get together at special events.", "zh": "我们在特别的活动中聚在一起。"}, {"speaker": "Chant", "en": "Events are fun. I love every one.", "zh": "活动很有趣，我喜欢每一个。"}, {"speaker": "Chant", "en": "Yeah, yeah, yeah! Yeah, yeah, yeah!", "zh": "耶，耶，耶！耶，耶，耶！"}, {"speaker": "Chant", "en": "My parents and I, we had a sports day.", "zh": "我和我的父母，我们过了一个运动日。"}, {"speaker": "Chant", "en": "There were many fun activities to do.", "zh": "有很多有趣的活动可以做。"}, {"speaker": "Chant", "en": "We ran so fast. My brother clapped.", "zh": "我们跑得很快，我哥哥鼓掌。"}, {"speaker": "Chant", "en": "Go, go, go! Go, go, go!", "zh": "加油，加油，加油！加油，加油，加油！"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Appendix 1", "scene": "Unit 3 How can we stay healthy?", "function": "感受与情绪", "turns": [{"speaker": "Chant", "en": "How can we stay healthy?", "zh": "我们怎样才能保持健康？"}, {"speaker": "Chant", "en": "The boy has a runny nose.", "zh": "这个男孩流鼻涕。"}, {"speaker": "Chant", "en": "He should see a doctor.", "zh": "他应该去看医生。"}, {"speaker": "Chant", "en": "Maybe he knows.", "zh": "也许他知道。"}, {"speaker": "Chant", "en": "How can we stay healthy?", "zh": "我们怎样才能保持健康？"}, {"speaker": "Chant", "en": "The girl has a little cough.", "zh": "这个女孩有点咳嗽。"}, {"speaker": "Chant", "en": "She should get enough sleep.", "zh": "她应该睡足够的觉。"}, {"speaker": "Chant", "en": "Let's switch all the lights off.", "zh": "让我们把所有灯关掉。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Appendix 1", "scene": "Unit 4 Did they use money well?", "function": "购物与价格", "turns": [{"speaker": "Chant", "en": "Simon bought a new computer.", "zh": "西蒙买了一台新电脑。"}, {"speaker": "Chant", "en": "He bought a new computer.", "zh": "他买了一台新电脑。"}, {"speaker": "Chant", "en": "It was an expensive computer.", "zh": "那是一台昂贵的电脑。"}, {"speaker": "Chant", "en": "Did he use his money well?", "zh": "他钱花得合理吗？"}, {"speaker": "Chant", "en": "Mary bought two schoolbags.", "zh": "玛丽买了两个书包。"}, {"speaker": "Chant", "en": "She bought two schoolbags.", "zh": "她买了两个书包。"}, {"speaker": "Chant", "en": "Now Mary has three schoolbags.", "zh": "现在玛丽有三个书包。"}, {"speaker": "Chant", "en": "Did she use her money well?", "zh": "她钱花得合理吗？"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Appendix 1", "scene": "Unit 5 In space", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "We live on Earth.", "zh": "我们住在地球上。"}, {"speaker": "Chant", "en": "It's a planet in space.", "zh": "它是太空中的一个行星。"}, {"speaker": "Chant", "en": "We go round the Sun.", "zh": "我们绕着太阳转。"}, {"speaker": "Chant", "en": "We have our place.", "zh": "我们有自己的位置。"}, {"speaker": "Chant", "en": "Space is so big,", "zh": "太空如此之大，"}, {"speaker": "Chant", "en": "But you can see,", "zh": "但你可以看到，"}, {"speaker": "Chant", "en": "So many stars, so very far,", "zh": "那么多星星，那么遥远，"}, {"speaker": "Chant", "en": "Through a telescope with me.", "zh": "通过望远镜和我一起看。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Appendix 1", "scene": "Unit 6 Helping our planet", "function": "邀请与建议", "turns": [{"speaker": "Chant", "en": "We need to use more solar power,", "zh": "我们需要使用更多的太阳能，"}, {"speaker": "Chant", "en": "Do you know?", "zh": "你知道吗？"}, {"speaker": "Chant", "en": "We need to use more water power,", "zh": "我们需要使用更多的水力，"}, {"speaker": "Chant", "en": "Do you know?", "zh": "你知道吗？"}, {"speaker": "Chant", "en": "We need to use more green power,", "zh": "我们需要使用更多的绿色能源，"}, {"speaker": "Chant", "en": "Wind, water, sun and heat underground.", "zh": "风、水、太阳和地下的热能。"}, {"speaker": "Chant", "en": "We can help save our planet,", "zh": "我们可以帮助拯救我们的星球，"}, {"speaker": "Chant", "en": "Do you know?", "zh": "你知道吗？"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Appendix 4", "scene": "Unit 1 周末与假期活动", "function": "询问信息", "turns": [{"speaker": "A", "en": "How was your weekend?", "zh": "你周末过得怎么样？"}, {"speaker": "B", "en": "It was great! I climbed the Great Wall.", "zh": "非常棒！我去爬长城了。"}, {"speaker": "A", "en": "What did you do, Leo?", "zh": "你做什么了，利奥？"}, {"speaker": "Leo", "en": "I visited the \"Gingerbread House\" last Saturday.", "zh": "我上个星期六去参观“姜饼屋”了。"}, {"speaker": "A", "en": "Where did you go over the summer holidays, Binbin?", "zh": "你暑假去哪儿了，斌斌？"}, {"speaker": "Binbin", "en": "I went to Xi'an with my family.", "zh": "我和家人去西安了。"}, {"speaker": "A", "en": "What did you do there?", "zh": "你们在那儿做了些什么？"}, {"speaker": "Binbin", "en": "We went to see the Terracotta Warriors.", "zh": "我们去看兵马俑了。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Appendix 4", "scene": "Unit 2 中秋假期", "function": "询问信息", "turns": [{"speaker": "A", "en": "How was your Mid-Autumn Festival holiday, Binbin?", "zh": "你中秋假期过得怎么样，斌斌？"}, {"speaker": "Binbin", "en": "It was great!", "zh": "非常棒！"}, {"speaker": "A", "en": "Did you take a trip?", "zh": "你们去旅行了吗？"}, {"speaker": "Binbin", "en": "No, we didn't.", "zh": "不，我们没有。"}, {"speaker": "A", "en": "Did you eat mooncakes?", "zh": "你们吃月饼了吗？"}, {"speaker": "Binbin", "en": "Yes, we did.", "zh": "是的，我们吃了。"}, {"speaker": "A", "en": "My mother and I went to a marathon on Sunday.", "zh": "我和妈妈上周日去看了一场马拉松比赛。"}, {"speaker": "A", "en": "What did you like about it?", "zh": "你喜欢它哪一点？"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Appendix 4", "scene": "Unit 3 健康与感受", "function": "感受与情绪", "turns": [{"speaker": "A", "en": "How do you feel?", "zh": "你感觉怎么样？"}, {"speaker": "B", "en": "I feel ill. My head hurts and I have a runny nose.", "zh": "我感觉不舒服。我头痛还流鼻涕。"}, {"speaker": "A", "en": "I'm sorry to hear that. Maybe you should see a doctor.", "zh": "对此我感到难过。也许你应该去看医生。"}, {"speaker": "A", "en": "How can we live a healthy life?", "zh": "我们怎样能过健康的生活？"}, {"speaker": "B", "en": "We need to eat healthy food. We should exercise too.", "zh": "我们需要吃健康的食物。我们还需要运动。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Appendix 4", "scene": "Unit 4 购物计划", "function": "购物与价格", "turns": [{"speaker": "A", "en": "How are you going to spend it?", "zh": "你打算怎么花（这些钱）？"}, {"speaker": "B", "en": "I'm going to buy a schoolbag.", "zh": "我打算买一个书包。"}, {"speaker": "B", "en": "I also want to buy some animal books.", "zh": "我还想买一些动物类书籍。"}, {"speaker": "A", "en": "What else are you going to buy?", "zh": "你还打算买什么？"}, {"speaker": "B", "en": "I'm going to buy a pair of sunglasses for Grandpa.", "zh": "我打算给爷爷买一副太阳镜。"}, {"speaker": "B", "en": "I also want to buy a microscope.", "zh": "我还想买一个显微镜。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Appendix 4", "scene": "Unit 5 天空与火星", "function": "描述事物", "turns": [{"speaker": "A", "en": "What can you see in the sky?", "zh": "你能在天空中看到什么？"}, {"speaker": "B", "en": "We can see the Sun and clouds.", "zh": "我们能看到太阳和云。"}, {"speaker": "B", "en": "At night, we can see the Moon and the stars.", "zh": "在晚上，我们能看到月亮和星星。"}, {"speaker": "A", "en": "Is there any water on Mars?", "zh": "火星上有水吗？"}, {"speaker": "B", "en": "Yes, there is. There is soil too.", "zh": "是，有的。那里还有土壤。"}, {"speaker": "A", "en": "Are there any aliens?", "zh": "那儿有外星生物吗？"}, {"speaker": "B", "en": "I don't think so. They say there aren't any living things.", "zh": "我不这样认为。据说那里没有生物。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Appendix 4", "scene": "Unit 6 水与能源", "function": "询问信息", "turns": [{"speaker": "A", "en": "What do you know about it?", "zh": "关于它你知道些什么？"}, {"speaker": "B", "en": "Running water can make electricity.", "zh": "流水可以发电。"}, {"speaker": "A", "en": "What else do you want to know about water?", "zh": "关于水你还想了解些什么？"}, {"speaker": "B", "en": "Where does water come from?", "zh": "水从哪儿来？"}, {"speaker": "A", "en": "What should we do?", "zh": "我们该怎么办？"}, {"speaker": "A", "en": "How can we save energy?", "zh": "我们怎样才能节约能源？"}, {"speaker": "B", "en": "We can take quick showers.", "zh": "我们可以快速淋浴。"}, {"speaker": "B", "en": "We can also use LED lighting.", "zh": "我们还可以使用LED照明。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 1", "scene": "A. 恐龙馆", "function": "描述事物", "turns": [{"speaker": "Zhang Peng", "en": "Look! That’s the tallest dinosaur in this hall.", "zh": "看！那是这个大厅里最高的恐龙。"}, {"speaker": "Mike", "en": "Yes, it is. How tall is it?", "zh": "是的。它有多高？"}, {"speaker": "Zhang Peng", "en": "Maybe 4 metres.", "zh": "大概4米。"}, {"speaker": "Mike", "en": "Wow! It’s taller than both of us together.", "zh": "哇！它比我们俩加起来还高。"}, {"speaker": "Zhang Peng", "en": "Look! There are more dinosaurs over there!", "zh": "看！那边还有更多恐龙！"}, {"speaker": "Mike", "en": "They’re all so big and tall.", "zh": "它们都又大又高。"}, {"speaker": "Zhang Peng", "en": "Hey, this dinosaur isn’t tall! I’m taller than this one.", "zh": "嘿，这只恐龙不高！我比它高。"}, {"speaker": "Mike", "en": "Oh, yes. How tall are you?", "zh": "哦，是的。你有多高？"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 1", "scene": "A. Let’s talk", "function": "询问信息", "turns": [{"speaker": "Zhang Peng", "en": "How tall are you?", "zh": "你有多高？"}, {"speaker": "John", "en": "I’m 1.61 metres.", "zh": "我1.61米。"}, {"speaker": "Zhang Peng", "en": "Oh! I’m taller.", "zh": "哦！我更高。"}, {"speaker": "John", "en": "You’re older than me, too.", "zh": "你比我大。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 1", "scene": "B. 鞋店", "function": "购物与价格", "turns": [{"speaker": "Mike", "en": "Those shoes in the window are nice! Let’s have a look.", "zh": "橱窗里那些鞋真不错！我们去看看。"}, {"speaker": "Wu Binbin", "en": "What size are your shoes, Mike?", "zh": "迈克，你的鞋多大码？"}, {"speaker": "Mike", "en": "Size 7.", "zh": "7码。"}, {"speaker": "Wu Binbin", "en": "Size 7? That’s so small.", "zh": "7码？那太小了。"}, {"speaker": "Mike", "en": "In China I wear size 40 shoes.", "zh": "在中国我穿40码的鞋。"}, {"speaker": "Wu Binbin", "en": "Oh! Your feet are bigger than mine. My shoes are size 37.", "zh": "哦！你的脚比我的大。我的鞋是37码。"}, {"speaker": "Mike", "en": "Really? You look taller than me.", "zh": "真的吗？你看起来比我高。"}, {"speaker": "Wu Binbin", "en": "But I think you are heavier. How heavy are you?", "zh": "但我觉得你更重。你有多重？"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 1", "scene": "B. Let’s talk", "function": "询问信息", "turns": [{"speaker": "John", "en": "How heavy are you, Jim?", "zh": "吉姆，你有多重？"}, {"speaker": "Jim", "en": "I’m 52 kilograms.", "zh": "我52公斤。"}, {"speaker": "John", "en": "You’re heavier than me.", "zh": "你比我重。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 1", "scene": "C. Story time", "function": "请求与应答", "turns": [{"speaker": "Zebra", "en": "They need a new goalkeeper.", "zh": "他们需要一名新守门员。"}, {"speaker": "Deer", "en": "I’d like to have a try.", "zh": "我想试一试。"}, {"speaker": "Giraffe", "en": "Me too.", "zh": "我也是。"}, {"speaker": "Dog", "en": "I can’t wait.", "zh": "我等不及了。"}, {"speaker": "Zoom", "en": "How tall are you?", "zh": "你有多高？"}, {"speaker": "Deer", "en": "I’m 1.8 metres.", "zh": "我1.8米。"}, {"speaker": "Zip", "en": "How heavy are you?", "zh": "你有多重？"}, {"speaker": "Deer", "en": "I’m 86 kilograms.", "zh": "我86公斤。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 2", "scene": "Mike打电话给爷爷，聊上周末", "function": "问候与介绍", "turns": [{"speaker": "Mike", "en": "Hi, Grandpa. How are you? How was your weekend?", "zh": "嗨，爷爷。你好吗？你上周末过得怎么样？"}, {"speaker": "Grandpa", "en": "I’m fine, Mike. It was good, thank you.", "zh": "我很好，Mike。过得不错，谢谢你。"}, {"speaker": "Mike", "en": "What did you do?", "zh": "你做了什么？"}, {"speaker": "Grandpa", "en": "Well, I stayed at home with your grandma. We drank tea in the afternoon and watched TV.", "zh": "嗯，我和你奶奶待在家里。我们下午喝茶，还看了电视。"}, {"speaker": "Mike", "en": "I watched TV, too. I watched some children’s shows on TV.", "zh": "我也看了电视。我看了一些儿童节目。"}, {"speaker": "Grandpa", "en": "That’s nice. Did you do anything else?", "zh": "那很好。你还做了别的事吗？"}, {"speaker": "Mike", "en": "Yes, I cleaned my room and washed my clothes.", "zh": "是的，我打扫了房间，还洗了衣服。"}, {"speaker": "Grandpa", "en": "You are a good boy!", "zh": "你是个好孩子！"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 2", "scene": "Let's talk：Mike和Chen Jie聊上周末", "function": "询问信息", "turns": [{"speaker": "Mike", "en": "How was your weekend?", "zh": "你上周末过得怎么样？"}, {"speaker": "Chen Jie", "en": "It was fine, thanks.", "zh": "还不错，谢谢。"}, {"speaker": "Mike", "en": "What did you do?", "zh": "你做了什么？"}, {"speaker": "Chen Jie", "en": "I stayed at home and watched TV.", "zh": "我待在家里看了电视。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 2", "scene": "John和Amy聊上周末和去书店", "function": "邀请与建议", "turns": [{"speaker": "John", "en": "Hey, Amy. Let’s go to the bookstore. I want to buy the new film magazine.", "zh": "嘿，Amy。我们去书店吧。我想买那本新的电影杂志。"}, {"speaker": "Amy", "en": "Oh, I read it last weekend.", "zh": "哦，我上周末读过了。"}, {"speaker": "John", "en": "Was it interesting?", "zh": "有趣吗？"}, {"speaker": "Amy", "en": "Yes, it talked about a lot of new films.", "zh": "是的，它讲了很多新电影。"}, {"speaker": "John", "en": "What did you do last weekend? Did you see a film?", "zh": "你上周末做了什么？你看电影了吗？"}, {"speaker": "Amy", "en": "No, I had a cold. I stayed at home all weekend and slept.", "zh": "没有，我感冒了。我整个周末都待在家里睡觉。"}, {"speaker": "Amy", "en": "Oh, I’m sorry. I’m happy you feel better now.", "zh": "哦，很抱歉。很高兴你现在感觉好些了。"}, {"speaker": "John", "en": "Thanks. Let’s go by bus. It’s faster than walking.", "zh": "谢谢。我们坐公交车去吧。比走路快。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 2", "scene": "Let's talk：John和Amy聊看电影", "function": "表达喜好", "turns": [{"speaker": "John", "en": "What did you do last weekend?", "zh": "你上周末做了什么？"}, {"speaker": "Amy", "en": "I saw a film.", "zh": "我看了一部电影。"}, {"speaker": "John", "en": "Did you like it?", "zh": "你喜欢吗？"}, {"speaker": "Amy", "en": "Yes, I did. It was great.", "zh": "是的，我喜欢。太棒了。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 2", "scene": "Zip和Zoom聊上周末的安排", "function": "时间与日程", "turns": [{"speaker": "Zip", "en": "How was your weekend?", "zh": "你上周末过得怎么样？"}, {"speaker": "Zoom", "en": "It was a busy one.", "zh": "挺忙的。"}, {"speaker": "Zip", "en": "What did you do on Sunday morning?", "zh": "你周日上午做了什么？"}, {"speaker": "Zoom", "en": "I cleaned my room. Then I visited my grandparents.", "zh": "我打扫了房间。然后我去看望了爷爷奶奶。"}, {"speaker": "Zip", "en": "What did you do on Sunday afternoon?", "zh": "你周日下午做了什么？"}, {"speaker": "Zoom", "en": "I played football. Then I watched TV.", "zh": "我踢了足球。然后看了电视。"}, {"speaker": "Zip", "en": "That was a busy weekend.", "zh": "那是个忙碌的周末。"}, {"speaker": "Zoom", "en": "Yes, it was. Now I need another weekend.", "zh": "是的。现在我需要再有一个周末。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 2", "scene": "Story time：同学关心受伤的同学", "function": "感受与情绪", "turns": [{"speaker": "A", "en": "You didn’t come to school. What happened?", "zh": "你没来上学。发生什么事了？"}, {"speaker": "B", "en": "Oh dear! Are you all right?", "zh": "天哪！你还好吗？"}, {"speaker": "A", "en": "Can I come and visit you?", "zh": "我可以来看你吗？"}, {"speaker": "B", "en": "Yes, I’m OK. Thanks.", "zh": "好的，我没事。谢谢。"}, {"speaker": "A", "en": "I fell off my bike and hurt my foot.", "zh": "我从自行车上摔下来，脚受伤了。"}, {"speaker": "B", "en": "Sure! You can see my photos from the Labour Day holiday.", "zh": "当然！你可以看看我劳动节假期的照片。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 3", "scene": "Amy打电话给John，询问假期经历", "function": "询问信息", "turns": [{"speaker": "Amy", "en": "What happened?", "zh": "发生什么事了？"}, {"speaker": "John", "en": "I fell off my bike last Saturday and hurt my foot.", "zh": "上周六我从自行车上摔下来，伤了脚。"}, {"speaker": "Amy", "en": "That’s too bad! Are you all right?", "zh": "太糟糕了！你还好吗？"}, {"speaker": "John", "en": "I’m OK now. Come and look at my photos from the Labour Day holiday.", "zh": "我现在没事了。来看看我劳动节假期的照片吧。"}, {"speaker": "Amy", "en": "Where did you go?", "zh": "你去了哪里？"}, {"speaker": "John", "en": "Mt. Tianshan, Xinjiang. I rode a horse. Look, it’s very small!", "zh": "新疆天山。我骑了马。看，它很小！"}, {"speaker": "Amy", "en": "Oh, yes. It looks like a mule! Did you go to Turpan?", "zh": "哦，是的。它看起来像骡子！你去吐鲁番了吗？"}, {"speaker": "John", "en": "Yes, we did. We saw lots of grapes there, but we couldn’t eat them. They won’t be ready till August.", "zh": "是的，我们去了。我们在那里看到了很多葡萄，但不能吃。它们要到八月才成熟。"}]},
