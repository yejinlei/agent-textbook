"en": "What's this?", "zh": "这是什么？"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 5", "scene": "Unit 4 表达喜好", "function": "表达喜好", "turns": [{"speaker": "A", "en": "Mike, do you like apples?", "zh": "迈克，你喜欢苹果吗？"}, {"speaker": "B", "en": "Yes, I do. And you?", "zh": "是的，我喜欢。你呢？"}, {"speaker": "A", "en": "No, I don't.", "zh": "不，我不喜欢。"}, {"speaker": "A", "en": "Do you like the farm?", "zh": "你们喜欢农场吗？"}, {"speaker": "B", "en": "I like the fresh air.", "zh": "我喜欢新鲜的空气。"}, {"speaker": "A", "en": "We can plant new trees.", "zh": "我们可以新种些树。"}, {"speaker": "B", "en": "Plants can give us many things.", "zh": "植物能为我们提供很多东西。"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 5", "scene": "Unit 5 颜色与喜好", "function": "表达喜好", "turns": [{"speaker": "A", "en": "What colour is it?", "zh": "它是什么颜色？"}, {"speaker": "B", "en": "It's orange.", "zh": "它是橙红色。"}, {"speaker": "A", "en": "Red and blue make purple.", "zh": "红色加蓝色是紫色。"}, {"speaker": "A", "en": "What colours do you like?", "zh": "你喜欢什么颜色？"}, {"speaker": "B", "en": "I like red and pink.", "zh": "我喜欢红色和粉色。"}, {"speaker": "A", "en": "Let's draw some purple and brown birds.", "zh": "我们一起画一些紫色和棕色的鸟吧。"}, {"speaker": "A", "en": "Be careful!", "zh": "小心！"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 5", "scene": "Unit 6 年龄、数量与购物", "function": "购物与价格", "turns": [{"speaker": "A", "en": "How old are you?", "zh": "你几岁了？"}, {"speaker": "B", "en": "I'm five years old.", "zh": "我五岁了。"}, {"speaker": "A", "en": "Me too.", "zh": "我也是。"}, {"speaker": "A", "en": "How many apples?", "zh": "几个苹果？"}, {"speaker": "B", "en": "Two.", "zh": "两个。"}, {"speaker": "A", "en": "Great! Let's go to the shop!", "zh": "好极了！我们一起去商店吧！"}, {"speaker": "B", "en": "That's ten yuan, please.", "zh": "（共）十元，谢谢。"}, {"speaker": "A", "en": "Here you are.", "zh": "给您。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "scene": "Listen and chant", "function": "问候与介绍", "turns": [{"speaker": "Chant", "en": "Where are you from?", "zh": "你从哪里来？"}, {"speaker": "Chant", "en": "I'm from Shandong, China.", "zh": "我来自中国山东。"}, {"speaker": "Chant", "en": "Where are you from?", "zh": "你从哪里来？"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "scene": "Listen and sing", "function": "问候与介绍", "turns": [{"speaker": "A", "en": "Hi! I'm Zhang Peng.", "zh": "嗨！我是张鹏。"}, {"speaker": "B", "en": "What's your name?", "zh": "你叫什么名字？"}, {"speaker": "A", "en": "My name's Amy Green.", "zh": "我叫艾米·格林。"}, {"speaker": "A", "en": "I'm new here.", "zh": "我是新来的。"}, {"speaker": "A", "en": "I'm from the UK.", "zh": "我来自英国。"}, {"speaker": "B", "en": "What about you?", "zh": "你呢？"}, {"speaker": "A", "en": "Me too!", "zh": "我也是！"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "scene": "Let's talk", "function": "问候与介绍", "turns": [{"speaker": "teacher", "en": "We have two new friends today.", "zh": "今天我们有两个新朋友。"}, {"speaker": "student", "en": "Hi! I'm Amy.", "zh": "嗨！我是艾米。"}, {"speaker": "student", "en": "I'm from the UK.", "zh": "我来自英国。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "scene": "Listen and chant", "function": "问候与介绍", "turns": [{"speaker": "Chant", "en": "Hello, Jake.", "zh": "你好，杰克。"}, {"speaker": "Chant", "en": "Hello, Jake.", "zh": "你好，杰克。"}, {"speaker": "Chant", "en": "My name is Dave.", "zh": "我叫戴夫。"}, {"speaker": "Chant", "en": "Let's play a game.", "zh": "我们来玩个游戏吧。"}, {"speaker": "Chant", "en": "My name is Jake.", "zh": "我叫杰克。"}, {"speaker": "Chant", "en": "My name is Jake.", "zh": "我叫杰克。"}, {"speaker": "Chant", "en": "I like my name.", "zh": "我喜欢我的名字。"}, {"speaker": "Chant", "en": "I can make a cake.", "zh": "我会做蛋糕。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "scene": "Let's talk", "function": "问候与介绍", "turns": [{"speaker": "A", "en": "That's my new neighbour, Mr Lin.", "zh": "那是我的新邻居，林先生。"}, {"speaker": "B", "en": "Hi, Zhang Peng!", "zh": "嗨，张鹏！"}, {"speaker": "A", "en": "Who's that man?", "zh": "那个男人是谁？"}, {"speaker": "B", "en": "Hi!", "zh": "嗨！"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "scene": "Read and write", "function": "问候与介绍", "turns": [{"speaker": "A", "en": "After you.", "zh": "你先请。"}, {"speaker": "B", "en": "I'm from Henan, China.", "zh": "我来自中国河南。"}, {"speaker": "B", "en": "My name is Linlin.", "zh": "我叫林林。"}, {"speaker": "A", "en": "Yes.", "zh": "是的。"}, {"speaker": "C", "en": "Sawat di kha! Hello! I'm from Thailand.", "zh": "萨瓦迪卡！你好！我来自泰国。"}, {"speaker": "C", "en": "Do you like pineapple rice?", "zh": "你喜欢菠萝饭吗？"}, {"speaker": "A", "en": "Thank you.", "zh": "谢谢你。"}, {"speaker": "D", "en": "Hi! I'm John.", "zh": "嗨！我是约翰。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "scene": "Let's talk (A)", "function": "描述事物", "turns": [{"speaker": "A", "en": "It's orange. It has a long tail and big ears.", "zh": "它是橙色的。它有一条长尾巴和大耳朵。"}, {"speaker": "A", "en": "Your dog is cute. It has a long body and short legs.", "zh": "你的狗很可爱。它有一个长身体和短腿。"}, {"speaker": "A", "en": "Yes, that's right.", "zh": "是的，没错。"}, {"speaker": "A", "en": "Do you like dogs?", "zh": "你喜欢狗吗？"}, {"speaker": "A", "en": "It's the fox.", "zh": "它是狐狸。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "scene": "Listen and chant (A)", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "I have a cat.", "zh": "我有一只猫。"}, {"speaker": "Chant", "en": "He's old and fat,", "zh": "他又老又胖，"}, {"speaker": "Chant", "en": "And he's also very slow.", "zh": "而且他也很慢。"}, {"speaker": "Chant", "en": "His tail is long.", "zh": "他的尾巴很长。"}, {"speaker": "Chant", "en": "His legs are short.", "zh": "他的腿很短。"}, {"speaker": "Chant", "en": "But I love him, don't you know?", "zh": "但我爱他，你知道吗？"}, {"speaker": "Chant", "en": "I love my rabbit. It has long ears and a short tail.", "zh": "我爱我的兔子。它有长耳朵和短尾巴。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "scene": "Let's talk (B)", "function": "表达喜好", "turns": [{"speaker": "A", "en": "That's nice.", "zh": "那很好。"}, {"speaker": "A", "en": "No, I don't. I often make her gifts.", "zh": "不，我不。我经常给她做礼物。"}, {"speaker": "A", "en": "Bye, Mum.", "zh": "再见，妈妈。"}, {"speaker": "A", "en": "Love you!", "zh": "爱你！"}, {"speaker": "A", "en": "Do you often say that to your mum?", "zh": "你经常对妈妈说那句话吗？"}, {"speaker": "A", "en": "Yes, I do. What about you?", "zh": "是的，我常说。你呢？"}, {"speaker": "A", "en": "No, I don't.", "zh": "不，我不。"}, {"speaker": "A", "en": "Bye, Dad.", "zh": "再见，爸爸。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "scene": "Listen and chant (B)", "function": "邀请与建议", "turns": [{"speaker": "Chant", "en": "We all like to smile.", "zh": "我们都喜欢微笑。"}, {"speaker": "Chant", "en": "Let's make a card.", "zh": "我们来做一张卡片吧。"}, {"speaker": "Chant", "en": "Let's sing and dance.", "zh": "我们唱歌跳舞吧。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "scene": "Read and write", "function": "询问信息", "turns": [{"speaker": "A", "en": "I often make a card for my dad.", "zh": "我经常给我爸爸做一张卡片。"}, {"speaker": "A", "en": "What about you?", "zh": "你呢？"}, {"speaker": "A", "en": "Do you have a pet?", "zh": "你有宠物吗？"}, {"speaker": "A", "en": "Yes, I have a dog. It's thin.", "zh": "是的，我有一只狗。它很瘦。"}, {"speaker": "A", "en": "It has a long body. I like it.", "zh": "它有一个长身体。我喜欢它。"}, {"speaker": "A", "en": "Do you listen to your friend with care?", "zh": "你会认真听朋友说话吗？"}, {"speaker": "A", "en": "Yes, I do.", "zh": "是的，我会。"}, {"speaker": "A", "en": "Do you often play together?", "zh": "你们经常一起玩吗？"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "scene": "Reading time", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "We like fruit. We can have fun with fruit.", "zh": "我们喜欢水果。我们可以用水果玩得开心。"}, {"speaker": "Chant", "en": "We can make animals with fruit.", "zh": "我们可以用水果做动物。"}, {"speaker": "Chant", "en": "We have friends.", "zh": "我们有朋友。"}, {"speaker": "Chant", "en": "We can make fruit friends too.", "zh": "我们也可以做水果朋友。"}, {"speaker": "Chant", "en": "We can act as fruit.", "zh": "我们可以扮演水果。"}, {"speaker": "Chant", "en": "We can be tall or short.", "zh": "我们可以高或矮。"}, {"speaker": "Chant", "en": "We can be fat or thin.", "zh": "我们可以胖或瘦。"}, {"speaker": "Chant", "en": "We can also \"write\" with fruit.", "zh": "我们也可以用水果“写字”。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "scene": "Can I use your pen?", "function": "请求与应答", "turns": [{"speaker": "A", "en": "Can I use your pen?", "zh": "我能用一下你的钢笔吗？"}, {"speaker": "B", "en": "No problem.", "zh": "没问题。"}, {"speaker": "A", "en": "Thanks.", "zh": "谢谢。"}, {"speaker": "A", "en": "Excuse me. Can I use your eraser, please?", "zh": "打扰一下，我能用一下你的橡皮吗？"}, {"speaker": "B", "en": "I can't find my ruler. Can I use your ruler, Zhang Peng?", "zh": "我找不到我的尺子了。张鹏，我能用一下你的尺子吗？"}, {"speaker": "Zhang Peng", "en": "Sure. Here you are.", "zh": "当然可以。给你。"}, {"speaker": "A", "en": "Here you are.", "zh": "给你。"}, {"speaker": "A", "en": "Can I use your eraser, please?", "zh": "我能用一下你的橡皮吗？"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "scene": "What are these?", "function": "询问信息", "turns": [{"speaker": "A", "en": "What are these?", "zh": "这些是什么？"}, {"speaker": "B", "en": "Quack! Quack! What about this?", "zh": "嘎嘎！嘎嘎！这个呢？"}, {"speaker": "A", "en": "What are these?", "zh": "这些是什么？"}, {"speaker": "B", "en": "They're grapes.", "zh": "它们是葡萄。"}, {"speaker": "A", "en": "Aha! It's a duck!", "zh": "啊哈！是一只鸭子！"}, {"speaker": "A", "en": "What's this?", "zh": "这是什么？"}, {"speaker": "B", "en": "It's a pencil.", "zh": "它是一支铅笔。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "scene": "What are these?", "function": "询问信息", "turns": [{"speaker": "A", "en": "What are these?", "zh": "这些是什么？"}, {"speaker": "B", "en": "They're rabbits.", "zh": "它们是兔子。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "scene": "Breakfast time", "function": "请求与应答", "turns": [{"speaker": "Mum", "en": "Would you like some bread?", "zh": "你想要一些面包吗？"}, {"speaker": "Child", "en": "OK, Mum. I'd like some bread and eggs, please.", "zh": "好的，妈妈。我想要一些面包和鸡蛋。"}, {"speaker": "Mum", "en": "Here you are.", "zh": "给你。"}, {"speaker": "Mum", "en": "Have some milk too.", "zh": "也喝点牛奶吧。"}, {"speaker": "Child", "en": "Thanks.", "zh": "谢谢。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "scene": "Ordering food", "function": "请求与应答", "turns": [{"speaker": "A", "en": "I'd like some juice and noodles.", "zh": "我想要一些果汁和面条。"}, {"speaker": "B", "en": "I'd like some milk and bread.", "zh": "我想要一些牛奶和面包。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "scene": "Offering food", "function": "请求与应答", "turns": [{"speaker": "Mum", "en": "Would you like some rice and meat?", "zh": "你想要一些米饭和肉吗？"}, {"speaker": "Child", "en": "Have some vegetables too.", "zh": "也吃点蔬菜吧。"}, {"speaker": "Child", "en": "They're good.", "zh": "它们很好。"}, {"speaker": "Mum", "en": "Yes, please.", "zh": "好的，请。"}, {"speaker": "Mum", "en": "Thank you. I love vegetables.", "zh": "谢谢。我喜欢蔬菜。"}, {"speaker": "Mum", "en": "No, thank you.", "zh": "不，谢谢。"}, {"speaker": "Mum", "en": "Would you like some rice?", "zh": "你想要一些米饭吗？"}, {"speaker": "Child", "en": "Yes, please.", "zh": "好的，请。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "scene": "Healthy plate discussion", "function": "描述事物", "turns": [{"speaker": "A", "en": "We are healthy. What do we need?", "zh": "我们要健康。我们需要什么？"}, {"speaker": "B", "en": "Water, soup, milk and juice.", "zh": "水、汤、牛奶和果汁。"}, {"speaker": "A", "en": "We are healthy. What do we need?", "zh": "我们要健康。我们需要什么？"}, {"speaker": "B", "en": "Vegetables, rice, meat and fruit.", "zh": "蔬菜、米饭、肉和水果。"}, {"speaker": "A", "en": "This is my healthy plate.", "zh": "这是我的健康餐盘。"}, {"speaker": "A", "en": "I have vegetables, ...", "zh": "我有蔬菜……"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "scene": "Reading time", "function": "表达喜好", "turns": [{"speaker": "Zoom", "en": "What would you like to eat, Zoom?", "zh": "Zoom，你想吃什么？"}, {"speaker": "Zoom", "en": "Vegetables are healthy. I love carrots.", "zh": "蔬菜很健康。我喜欢胡萝卜。"}, {"speaker": "Zoom", "en": "You can try!", "zh": "你可以试试！"}, {"speaker": "Zoom", "en": "Healthy food.", "zh": "健康的食物。"}, {"speaker": "Zoom", "en": "How about nuts?", "zh": "坚果怎么样？"}, {"speaker": "Zoom", "en": "OK.", "zh": "好的。"}, {"speaker": "Zoom", "en": "Would you like some meat, Zoom?", "zh": "Zoom，你想要一些肉吗？"}, {"speaker": "Zoom", "en": "It's healthy.", "zh": "它很健康。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "scene": "Let's talk (A)", "function": "询问信息", "turns": [{"speaker": "A", "en": "Do you have old things at home?", "zh": "你家里有旧东西吗？"}, {"speaker": "B", "en": "Yes, I do. I have many old toys and books.", "zh": "是的，我有。我有很多旧玩具和书。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "scene": "Let's talk (B)", "function": "方位与路线", "turns": [{"speaker": "A", "en": "Where is my map?", "zh": "我的地图在哪里？"}, {"speaker": "B", "en": "It's under the box.", "zh": "它在盒子下面。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "scene": "Reading time", "function": "请求与应答", "turns": [{"speaker": "Cat", "en": "Hi, Cat! Do you have any old toys? I need an arm for my robot.", "zh": "嗨，猫！你有一些旧玩具吗？我的机器人需要一只手臂。"}, {"speaker": "Cat", "en": "I have an old doll's arm.", "zh": "我有一只旧娃娃的手臂。"}, {"speaker": "Cat", "en": "Nice!", "zh": "太好了！"}, {"speaker": "Cat", "en": "Thank you.", "zh": "谢谢你。"}, {"speaker": "Tiger", "en": "Hi, Tiger! Do you have any old toys? I need an eye for my robot.", "zh": "嗨，老虎！你有一些旧玩具吗？我的机器人需要一只眼睛。"}, {"speaker": "Tiger", "en": "I have an old car. You can use the light!", "zh": "我有一辆旧汽车。你可以用那个灯！"}, {"speaker": "Tiger", "en": "I also need a foot for my robot.", "zh": "我的机器人还需要一只脚。"}, {"speaker": "Tiger", "en": "How about this?", "zh": "这个怎么样？"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "scene": "Let's talk (A)", "function": "描述事物", "turns": [{"speaker": "A", "en": "Five and six makes eleven.", "zh": "五加六等于十一。"}, {"speaker": "A", "en": "Add one, it's twelve.", "zh": "再加一，就是十二。"}, {"speaker": "A", "en": "Six and seven makes thirteen.", "zh": "六加七等于十三。"}, {"speaker": "A", "en": "Add one, it's fourteen.", "zh": "再加一，就是十四。"}, {"speaker": "A", "en": "Three fives are fifteen.", "zh": "三个五是十五。"}, {"speaker": "A", "en": "We can count to fifteen!", "zh": "我们可以数到十五！"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "scene": "Let's talk (B)", "function": "购物与价格", "turns": [{"speaker": "A", "en": "How much is this bag?", "zh": "这个包多少钱？"}, {"speaker": "B", "en": "Six yuan, or three for seventeen yuan.", "zh": "六元，或者三个十七元。"}, {"speaker": "A", "en": "OK.", "zh": "好的。"}, {"speaker": "A", "en": "It's twenty yuan.", "zh": "二十元。"}, {"speaker": "B", "en": "How about three for sixteen yuan?", "zh": "三个十六元怎么样？"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "scene": "Role-play", "function": "时间与日程", "turns": [{"speaker": "A", "en": "One minute, tick.", "zh": "一分钟，滴答。"}, {"speaker": "A", "en": "Two minutes, tock.", "zh": "两分钟，答。"}, {"speaker": "A", "en": "Sixteen, seventeen, eighteen.", "zh": "十六、十七、十八。"}, {"speaker": "A", "en": "Don't watch the clock.", "zh": "别老看钟。"}, {"speaker": "A", "en": "Nineteen minutes, tick.", "zh": "十九分钟，滴答。"}, {"speaker": "A", "en": "Twenty minutes, tock.", "zh": "二十分钟，答。"}, {"speaker": "A", "en": "Time goes slowly, When you watch the clock!", "zh": "当你盯着钟看时，时间过得真慢！"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "scene": "Let's talk (B)", "function": "购物与价格", "turns": [{"speaker": "A", "en": "How much is this boat?", "zh": "这条船多少钱？"}, {"speaker": "B", "en": "It's twenty yuan.", "zh": "二十元。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "scene": "Read and tick", "function": "询问信息", "turns": [{"speaker": "A", "en": "How many pencils do you have?", "zh": "你有多少支铅笔？"}, {"speaker": "B", "en": "I have five.", "zh": "我有五支。"}, {"speaker": "A", "en": "How much is each book？", "zh": "每本书多少钱？"}, {"speaker": "B", "en": "It's three yuan.", "zh": "三元。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "scene": "Reading time", "function": "询问信息", "turns": [{"speaker": "A", "en": "How many eggs do we have?", "zh": "我们有多少个鸡蛋？"}, {"speaker": "B", "en": "Twelve.", "zh": "十二个。"}, {"speaker": "A", "en": "In a mobile phone number, how many numbers are there?", "zh": "一个手机号码里有多少个数字？"}, {"speaker": "B", "en": "Twelve?", "zh": "十二个？"}, {"speaker": "A", "en": "No, eleven.", "zh": "不，十一个。"}, {"speaker": "B", "en": "That's not true!", "zh": "那不是真的！"}, {"speaker": "A", "en": "Oh, how so?", "zh": "哦，怎么会？"}, {"speaker": "B", "en": "And a football team always has eleven players.", "zh": "而且一支足球队总是有十一名球员。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Revision", "scene": "Amy 和妈妈商量去学校集市", "function": "邀请与建议", "turns": [{"speaker": "Amy", "en": "Mum, can we go?", "zh": "妈妈，我们能去吗？"}, {"speaker": "Mum", "en": "Sounds fun! Let's go after breakfast.", "zh": "听起来很有趣！我们早餐后去吧。"}, {"speaker": "Amy", "en": "OK. I'd like some bread and milk.", "zh": "好的。我想要一些面包和牛奶。"}, {"speaker": "Mum", "en": "Sure. Here you are.", "zh": "当然。给你。"}, {"speaker": "Mum", "en": "Honey, would you like some fruit?", "zh": "亲爱的，你想要一些水果吗？"}, {"speaker": "Amy", "en": "Yes, please. Oh! We can make some fun fruit plates for the fair!", "zh": "好的，谢谢。哦！我们可以为集市做一些有趣的水果拼盘！"}, {"speaker": "Mum", "en": "Good idea!", "zh": "好主意！"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Revision", "scene": "自我介绍与问答练习", "function": "问候与介绍", "turns": [{"speaker": "A", "en": "What's your name?", "zh": "你叫什么名字？"}, {"speaker": "B", "en": "My name is Amy Green.", "zh": "我叫艾米·格林。"}, {"speaker": "A", "en": "Where are you from?", "zh": "你来自哪里？"}, {"speaker": "B", "en": "I'm from the UK.", "zh": "我来自英国。"}, {"speaker": "A", "en": "Who's that man?", "zh": "那个男人是谁？"}, {"speaker": "B", "en": "That's my father.", "zh": "那是我爸爸。"}, {"speaker": "A", "en": "Can I use your pen?", "zh": "我可以用你的钢笔吗？"}, {"speaker": "B", "en": "Sure. Here you are.", "zh": "当然。给你。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Revision", "scene": "Mike 和 Amy 在集市上购物", "function": "购物与价格", "turns": [{"speaker": "Mike", "en": "How much is this pencil box?", "zh": "这个铅笔盒多少钱？"}, {"speaker": "Amy", "en": "It's four yuan.", "zh": "四元。"}, {"speaker": "Mike", "en": "OK, I'll take it. How much is this book?", "zh": "好的，我买了。这本书多少钱？"}, {"speaker": "Amy", "en": "It's three yuan. I have five more.", "zh": "三元。我还有五本。"}, {"speaker": "Mike", "en": "Thanks. I just want this one. Oh, what's this? Is it a crab?", "zh": "谢谢。我只想要这一个。哦，这是什么？是螃蟹吗？"}, {"speaker": "Amy", "en": "Yes, it is. These are apples, oranges and grapes.", "zh": "是的。这些是苹果、橙子和葡萄。"}, {"speaker": "Mike", "en": "Great! How much is it?", "zh": "太好了！多少钱？"}, {"speaker": "Amy", "en": "Five yuan, or three for thirteen yuan.", "zh": "五元，或者三个十三元。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Revision", "scene": "关于猫和蛋糕的 chant", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "We like the cat! It's cute. It's cute.", "zh": "我们喜欢这只猫！它很可爱。它很可爱。"}, {"speaker": "Chant", "en": "It has milk and cake for the fair.", "zh": "它有牛奶和蛋糕给集市。"}, {"speaker": "Chant", "en": "The rose on the cake is red. It's red.", "zh": "蛋糕上的玫瑰是红色的。它是红色的。"}, {"speaker": "Chant", "en": "Let's get some cake over there!", "zh": "我们去那边拿些蛋糕吧！"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 1", "scene": "Unit 1 Where are you from?", "function": "问候与介绍", "turns": [{"speaker": "Chant", "en": "Where are you from?", "zh": "你来自哪里？"}, {"speaker": "Chant", "en": "Nice to meet you. What's your name?", "zh": "很高兴见到你。你叫什么名字？"}, {"speaker": "Chant", "en": "What's your name? What's your name?", "zh": "你叫什么名字？你叫什么名字？"}, {"speaker": "Chant", "en": "Nice to meet you. What's your name?", "zh": "很高兴见到你。你叫什么名字？"}, {"speaker": "Chant", "en": "My name's Amy.", "zh": "我叫艾米。"}, {"speaker": "Chant", "en": "I'm from China. Where are you from?", "zh": "我来自中国。你来自哪里？"}, {"speaker": "Chant", "en": "Where are you from? Where are you from?", "zh": "你来自哪里？你来自哪里？"}, {"speaker": "Chant", "en": "I'm from China. Where are you from?", "zh": "我来自中国。你来自哪里？"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 1", "scene": "Unit 2 Expressing yourself", "function": "感受与情绪", "turns": [{"speaker": "Chant", "en": "You are happy and you know it.", "zh": "你很开心，你知道。"}, {"speaker": "Chant", "en": "Sing a song.", "zh": "唱首歌。"}, {"speaker": "Chant", "en": "You are happy and you know it.", "zh": "你很开心，你知道。"}, {"speaker": "Chant", "en": "Sing a song.", "zh": "唱首歌。"}, {"speaker": "Chant", "en": "You are happy and you know it, and you really want to show it.", "zh": "你很开心，你知道，而且你真的想表现出来。"}, {"speaker": "Chant", "en": "You are happy and you know it.", "zh": "你很开心，你知道。"}, {"speaker": "Chant", "en": "Sing a song.", "zh": "唱首歌。"}, {"speaker": "Chant", "en": "You have long legs and you know it. Make them dance.", "zh": "你有长腿，你知道。让它们跳舞。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 1", "scene": "Unit 3 Can I use your pen?", "function": "请求与应答", "turns": [{"speaker": "Chant", "en": "Can I use your pen? Can I use your pen?", "zh": "我可以用你的钢笔吗？我可以用你的钢笔吗？"}, {"speaker": "Chant", "en": "Yes, no problem. Yes, no problem.", "zh": "可以，没问题。可以，没问题。"}, {"speaker": "Chant", "en": "You can use my pen.", "zh": "你可以用我的钢笔。"}, {"speaker": "Chant", "en": "Can I use your ruler? Can I use your ruler?", "zh": "我可以用你的尺子吗？我可以用你的尺子吗？"}, {"speaker": "Chant", "en": "You can use it. You can use it.", "zh": "你可以用它。你可以用它。"}, {"speaker": "Chant", "en": "You can use my ruler.", "zh": "你可以用我的尺子。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 1", "scene": "Unit 4 Would you like some bread?", "function": "邀请与建议", "turns": [{"speaker": "Chant", "en": "Would you like some bread? Would you like some bread?", "zh": "你想要一些面包吗？你想要一些面包吗？"}, {"speaker": "Chant", "en": "Yes, I'd like some bread. Yes, I'd like some bread.", "zh": "是的，我想要一些面包。是的，我想要一些面包。"}, {"speaker": "Chant", "en": "Would you like some fish? Would you like some fish?", "zh": "你想要一些鱼吗？你想要一些鱼吗？"}, {"speaker": "Chant", "en": "Yes, put it on my dish. Please, put it on my dish.", "zh": "是的，请把它放在我的盘子里。请把它放在我的盘子里。"}, {"speaker": "Chant", "en": "Would you like some meat? Would you like some meat?", "zh": "你想要一些肉吗？你想要一些肉吗？"}, {"speaker": "Chant", "en": "Yes, I'd like some meat. Yes, I'd like some meat.", "zh": "是的，我想要一些肉。是的，我想要一些肉。"}, {"speaker": "Chant", "en": "Would you like some juice? Would you like some juice?", "zh": "你想要一些果汁吗？你想要一些果汁吗？"}, {"speaker": "Chant", "en": "Yes, pour it in my glass. Please, pour it in my glass.", "zh": "是的，请把它倒进我的杯子里。请把它倒进我的杯子里。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 1", "scene": "Unit 5 Giving old things new life", "function": "能力与他人", "turns": [{"speaker": "Chant", "en": "Let's make new things. Let's use old things.", "zh": "让我们做新东西。让我们用旧东西。"}, {"speaker": "Chant", "en": "What can you do? What can you do?", "zh": "你能做什么？你能做什么？"}, {"speaker": "Chant", "en": "I can use a blue car, I can use two blue cars,", "zh": "我可以用一辆蓝色小车，我可以用两辆蓝色小车，"}, {"speaker": "Chant", "en": "As my shoes, as my shoes.", "zh": "当作我的鞋子，当作我的鞋子。"}, {"speaker": "Chant", "en": "Let's make new things. Let's use old things.", "zh": "让我们做新东西。让我们用旧东西。"}, {"speaker": "Chant", "en": "What can you do? What can you do?", "zh": "你能做什么？你能做什么？"}, {"speaker": "Chant", "en": "I can use a brown bag, I can use a brown bag,", "zh": "我可以用一个棕色袋子，我可以用一个棕色袋子，"}, {"speaker": "Chant", "en": "To hold my shoes, to hold my shoes.", "zh": "来装我的鞋子，来装我的鞋子。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 1", "scene": "Unit 6 Let me count!", "function": "其他", "turns": [{"speaker": "Chant", "en": "There are nineteen on the bus.", "zh": "公交车上有十九个人。"}, {"speaker": "Chant", "en": "They all make a fuss, pull over, pull over.", "zh": "他们都闹哄哄的，靠边停，靠边停。"}, {"speaker": "Chant", "en": "So the bus pulls over, and two get out.", "zh": "于是公交车靠边停，两个人下车。"}, {"speaker": "Chant", "en": "There are seventeen on the bus.", "zh": "公交车上有十七个人。"}, {"speaker": "Chant", "en": "They all make a fuss, pull over, pull over.", "zh": "他们都闹哄哄的，靠边停，靠边停。"}, {"speaker": "Chant", "en": "So the bus pulls over, and three get out.", "zh": "于是公交车靠边停，三个人下车。"}, {"speaker": "Chant", "en": "There are fourteen on the bus.", "zh": "公交车上有十四个人。"}, {"speaker": "Chant", "en": "They all make a fuss, pull over, pull over.", "zh": "他们都闹哄哄的，靠边停，靠边停。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 4", "scene": "Unit 1 问候与介绍", "function": "问候与介绍", "turns": [{"speaker": "A", "en": "What's your name?", "zh": "你叫什么名字？"}, {"speaker": "B", "en": "My name's Amy Green.", "zh": "我叫埃米·格林。"}, {"speaker": "A", "en": "Where are you from?", "zh": "你是哪里人？"}, {"speaker": "B", "en": "I'm from the UK.", "zh": "我是英国人。"}, {"speaker": "A", "en": "Let me help.", "zh": "我来帮忙。"}, {"speaker": "B", "en": "After you!", "zh": "您先请！"}, {"speaker": "A", "en": "You're welcome.", "zh": "别客气。"}, {"speaker": "A", "en": "Who's that girl?", "zh": "那个女孩是谁？"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 4", "scene": "Unit 2 描述事物与表达喜好", "function": "描述事物", "turns": [{"speaker": "A", "en": "It has a long body and short legs.", "zh": "它有长长的身体和短短的腿。"}, {"speaker": "A", "en": "Dogs are friendly.", "zh": "狗是友善的。"}, {"speaker": "A", "en": "Do you often say that to your mum?", "zh": "你经常对妈妈那么说吗？"}, {"speaker": "B", "en": "Yes, I do.", "zh": "是的。"}, {"speaker": "B", "en": "I often make her gifts.", "zh": "我经常给她做礼物。"}, {"speaker": "A", "en": "We express ourselves in many ways.", "zh": "我们用很多种方式表达自己。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 4", "scene": "Unit 3 请求与应答", "function": "请求与应答", "turns": [{"speaker": "A", "en": "Excuse me.", "zh": "劳驾。"}, {"speaker": "A", "en": "Can I use your eraser, please?", "zh": "我能用一下你的橡皮吗？"}, {"speaker": "B", "en": "Sure. Here you are.", "zh": "当然。给你。"}, {"speaker": "A", "en": "No problem.", "zh": "没问题。"}, {"speaker": "A", "en": "What are these?", "zh": "这些是什么？"}, {"speaker": "B", "en": "They're grapes.", "zh": "是葡萄。"}, {"speaker": "A", "en": "What about this?", "zh": "这个呢？"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 4", "scene": "Unit 4 邀请与建议", "function": "邀请与建议", "turns": [{"speaker": "A", "en": "I'd like some bread and eggs, please.", "zh": "我想吃点儿面包和鸡蛋。"}, {"speaker": "B", "en": "Have some milk too.", "zh": "也喝点儿牛奶吧。"}, {"speaker": "B", "en": "Would you like some rice and meat?", "zh": "要吃点儿米饭和肉吗？"}, {"speaker": "A", "en": "Yes, please.", "zh": "好的，谢谢。"}, {"speaker": "B", "en": "Eat some every day!", "zh": "每天吃一些吧！"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 4", "scene": "Unit 5 询问信息与方位", "function": "方位与路线", "turns": [{"speaker": "A", "en": "Do you have old things?", "zh": "你有旧东西吗？"}, {"speaker": "B", "en": "Yes, I do. I have some old books.", "zh": "是的。我有些旧书。"}, {"speaker": "A", "en": "This boat is cool.", "zh": "这只船很酷。"}, {"speaker": "B", "en": "You can keep it.", "zh": "你可以留着它。"}, {"speaker": "A", "en": "Mum, where is my animal book?", "zh": "妈妈，我的动物书在哪儿？"}, {"speaker": "B", "en": "Is it on the shelf?", "zh": "在架子上吗？"}, {"speaker": "A", "en": "No, it isn't.", "zh": "不，不在。"}, {"speaker": "B", "en": "It's in the box.", "zh": "它在盒子里。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 4", "scene": "Unit 6 购物与价格", "function": "购物与价格", "turns": [{"speaker": "A", "en": "How many books do we have?", "zh": "我们有多少本书？"}, {"speaker": "B", "en": "We have fifteen books.", "zh": "我们有十五本书。"}, {"speaker": "A", "en": "How many boxes do we need?", "zh": "我们需要多少个箱子？"}, {"speaker": "B", "en": "We need three boxes.", "zh": "我们需要三个箱子。"}, {"speaker": "A", "en": "How much is this bag?", "zh": "这个包多少钱？"}, {"speaker": "B", "en": "It's twenty yuan.", "zh": "二十元。"}, {"speaker": "B", "en": "Six yuan, or three for seventeen yuan.", "zh": "六元，或者十七元三本。"}, {"speaker": "A", "en": "How about three for sixteen yuan?", "zh": "十六元三本行吗？"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "scene": "Listen and chant", "function": "问候与介绍", "turns": [{"speaker": "Chant", "en": "Where are you from?", "zh": "你来自哪里？"}, {"speaker": "Chant", "en": "I'm from Shandong, China.", "zh": "我来自中国山东。"}, {"speaker": "Chant", "en": "Where are you from?", "zh": "你来自哪里？"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "scene": "Listen and sing", "function": "问候与介绍", "turns": [{"speaker": "A", "en": "Hi! I'm Zhang Peng.", "zh": "嗨！我是张鹏。"}, {"speaker": "B", "en": "What's your name?", "zh": "你叫什么名字？"}, {"speaker": "A", "en": "My name's Amy Green.", "zh": "我叫艾米·格林。"}, {"speaker": "A", "en": "I'm new here.", "zh": "我是新来的。"}, {"speaker": "A", "en": "I'm from the UK.", "zh": "我来自英国。"}, {"speaker": "B", "en": "What about you?", "zh": "你呢？"}, {"speaker": "A", "en": "Me too!", "zh": "我也是！"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "scene": "Let's talk", "function": "问候与介绍", "turns": [{"speaker": "teacher", "en": "We have two new friends today.", "zh": "今天我们有两个新朋友。"}, {"speaker": "student", "en": "Hi! I'm Amy.", "zh": "嗨！我是艾米。"}, {"speaker": "student", "en": "I'm from the UK.", "zh": "我来自英国。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "scene": "Let's learn", "function": "问候与介绍", "turns": [{"speaker": "A", "en": "Hello, Jake.", "zh": "你好，杰克。"}, {"speaker": "B", "en": "Hello, Jake.", "zh": "你好，杰克。"}, {"speaker": "A", "en": "My name is Dave.", "zh": "我叫戴夫。"}, {"speaker": "A", "en": "Let's play a game.", "zh": "我们玩个游戏吧。"}, {"speaker": "B", "en": "My name is Jake.", "zh": "我叫杰克。"}, {"speaker": "B", "en": "My name is Jake.", "zh": "我叫杰克。"}, {"speaker": "B", "en": "I like my name.", "zh": "我喜欢我的名字。"}, {"speaker": "B", "en": "I can make a cake.", "zh": "我会做蛋糕。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "scene": "Read, listen and circle.", "function": "请求与应答", "turns": [{"speaker": "A", "en": "Let me help.", "zh": "让我来帮忙。"}, {"speaker": "B", "en": "After you!", "zh": "你先请！"}, {"speaker": "B", "en": "Thank you.", "zh": "谢谢你。"}, {"speaker": "A", "en": "You're welcome.", "zh": "不客气。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "scene": "Let's talk", "function": "问候与介绍", "turns": [{"speaker": "A", "en": "That's my new neighbour, Mr Lin.", "zh": "那是我的新邻居，林先生。"}, {"speaker": "B", "en": "Hi, Zhang Peng!", "zh": "嗨，张鹏！"}, {"speaker": "A", "en": "Who's that man?", "zh": "那个男人是谁？"}, {"speaker": "B", "en": "Hi!", "zh": "嗨！"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "scene": "Listen and chant", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "You are happy.", "zh": "你是快乐的。"}, {"speaker": "Chant", "en": "Jump and dance.", "zh": "跳起来，跳舞吧。"}, {"speaker": "Chant", "en": "You are happy.", "zh": "你是快乐的。"}, {"speaker": "Chant", "en": "Smile and sing.", "zh": "微笑，唱歌吧。"}, {"speaker": "Chant", "en": "Love makes you happy,", "zh": "爱让你快乐，"}, {"speaker": "Chant", "en": "And love is everything!", "zh": "爱就是一切！"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "scene": "Look, say and guess", "function": "描述事物", "turns": [{"speaker": "A", "en": "It's orange. It has a long tail and big ears.", "zh": "它是橙色的。它有一条长尾巴和大耳朵。"}, {"speaker": "B", "en": "Your dog is cute. It has a long body and short legs.", "zh": "你的狗很可爱。它有一个长身体和短腿。"}, {"speaker": "A", "en": "Yes, that's right.", "zh": "是的，没错。"}, {"speaker": "A", "en": "Do you like dogs?", "zh": "你喜欢狗吗？"}, {"speaker": "B", "en": "It's the fox.", "zh": "它是狐狸。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "scene": "Let's talk", "function": "表达喜好", "turns": [{"speaker": "A", "en": "Yes, I do. Dogs are friendly.", "zh": "是的，我喜欢。狗很友好。"}, {"speaker": "A", "en": "They can help us too.", "zh": "它们也能帮助我们。"}, {"speaker": "B", "en": "I have a cat.", "zh": "我有一只猫。"}, {"speaker": "B", "en": "He's old and fat,", "zh": "它又老又胖，"}, {"speaker": "B", "en": "And he's also very slow.", "zh": "而且它也很慢。"}, {"speaker": "B", "en": "His tail is long.", "zh": "它的尾巴很长。"}, {"speaker": "B", "en": "His legs are short.", "zh": "它的腿很短。"}, {"speaker": "B", "en": "But I love him, don't you know?", "zh": "但我爱它，你知道吗？"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "scene": "Listen and chant", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "I love my rabbit. It has long ears and a short tail.", "zh": "我爱我的兔子。它有长耳朵和短尾巴。"}, {"speaker": "Chant", "en": "He likes to run.", "zh": "他喜欢跑。"}, {"speaker": "Chant", "en": "She likes to jump.", "zh": "她喜欢跳。"}, {"speaker": "Chant", "en": "We sing and dance.", "zh": "我们唱歌跳舞。"}, {"speaker": "Chant", "en": "Be happy and have fun!", "zh": "快乐起来，玩得开心！"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "scene": "Let's talk", "function": "感受与情绪", "turns": [{"speaker": "A", "en": "That's nice.", "zh": "那很好。"}, {"speaker": "B", "en": "No, I don't. I often make her gifts.", "zh": "不，我不。我经常给她做礼物。"}, {"speaker": "A", "en": "Bye, Mum.", "zh": "再见，妈妈。"}, {"speaker": "A", "en": "Love you!", "zh": "爱你！"}, {"speaker": "B", "en": "Do you often say that to your mum?", "zh": "你经常对妈妈说那句话吗？"}, {"speaker": "A", "en": "Yes, I do. What about you?", "zh": "是的，我常说。你呢？"}, {"speaker": "B", "en": "No, I don't.", "zh": "不，我不。"}, {"speaker": "A", "en": "Bye, Dad.", "zh": "再见，爸爸。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "scene": "Listen and chant", "function": "邀请与建议", "turns": [{"speaker": "Chant", "en": "We all like to smile.", "zh": "我们都喜欢微笑。"}, {"speaker": "Chant", "en": "Let's make a card.", "zh": "让我们做一张卡片。"}, {"speaker": "Chant", "en": "Let's sing and dance.", "zh": "让我们唱歌跳舞。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "scene": "Can I use your pen?", "function": "请求与应答", "turns": [{"speaker": "A", "en": "Can I use your pen?", "zh": "我能用一下你的钢笔吗？"}, {"speaker": "B", "en": "No problem.", "zh": "没问题。"}, {"speaker": "A", "en": "Thanks.", "zh": "谢谢。"}, {"speaker": "A", "en": "Excuse me. Can I use your eraser, please?", "zh": "打扰一下，我能用一下你的橡皮吗？"}, {"speaker": "B", "en": "Here you are.", "zh": "给你。"}, {"speaker": "A", "en": "I can't find my ruler. Can I use your ruler, Zhang Peng?", "zh": "我找不到我的尺子了。张鹏，我能用一下你的尺子吗？"}, {"speaker": "B", "en": "Sure. Here you are.", "zh": "当然可以。给你。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "scene": "What are these?", "function": "询问信息", "turns": [{"speaker": "A", "en": "What are these?", "zh": "这些是什么？"}, {"speaker": "B", "en": "Quack! Quack! What about this?", "zh": "嘎嘎！嘎嘎！这个呢？"}, {"speaker": "A", "en": "What are these?", "zh": "这些是什么？"}, {"speaker": "B", "en": "They're grapes.", "zh": "它们是葡萄。"}, {"speaker": "A", "en": "Aha! It's a duck!", "zh": "啊哈！它是一只鸭子！"}, {"speaker": "A", "en": "What's this?", "zh": "这是什么？"}, {"speaker": "B", "en": "It's a pencil.", "zh": "它是一支铅笔。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "scene": "Listen and chant", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "See some fruit,", "zh": "看一些水果，"}, {"speaker": "Chant", "en": "Touch and feel.", "zh": "触摸并感受。"}, {"speaker": "Chant", "en": "Taste an apple,", "zh": "尝一个苹果，"}, {"speaker": "Chant", "en": "Hear the sound.", "zh": "听声音。"}, {"speaker": "Chant", "en": "Take an orange,", "zh": "拿一个橙子，"}, {"speaker": "Chant", "en": "Smell the peel.", "zh": "闻闻果皮。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "scene": "Listen and sing", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "I smell with my nose.", "zh": "我用鼻子闻。"}, {"speaker": "Chant", "en": "I taste with my tongue.", "zh": "我用舌头尝。"}, {"speaker": "Chant", "en": "I see and hear in class.", "zh": "我在课堂上看和听。"}, {"speaker": "Chant", "en": "I can use paper, pencils, books and computers to learn.", "zh": "我可以用纸、铅笔、书和电脑来学习。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "scene": "What helps us learn?", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "What helps us learn?", "zh": "什么帮助我们学习？"}, {"speaker": "Chant", "en": "I hear with my ears.", "zh": "我用耳朵听。"}, {"speaker": "Chant", "en": "I see with my eyes.", "zh": "我用眼睛看。"}, {"speaker": "Chant", "en": "What helps us learn?", "zh": "什么帮助我们学习？"}, {"speaker": "Chant", "en": "I use rulers and crayons.", "zh": "我用尺子和蜡笔。"}, {"speaker": "Chant", "en": "I use pencils and pens.", "zh": "我用铅笔和钢笔。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "scene": "What helps you learn?", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "I hear birds.", "zh": "我听到鸟叫。"}, {"speaker": "Chant", "en": "I smell flowers.", "zh": "我闻到花香。"}, {"speaker": "Chant", "en": "I feel the sun.", "zh": "我感受到阳光。"}, {"speaker": "Chant", "en": "I taste an apple.", "zh": "我尝一个苹果。"}, {"speaker": "Chant", "en": "I touch the grass.", "zh": "我触摸草地。"}, {"speaker": "Chant", "en": "I see spring.", "zh": "我看到春天。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "scene": "Breakfast time", "function": "请求与应答", "turns": [{"speaker": "Mum", "en": "Would you like some bread?", "zh": "你想要一些面包吗？"}, {"speaker": "Child", "en": "OK, Mum. I'd like some bread and eggs, please.", "zh": "好的，妈妈。我想要一些面包和鸡蛋。"}, {"speaker": "Mum", "en": "Here you are.", "zh": "给你。"}, {"speaker": "Mum", "en": "Have some milk too.", "zh": "也喝点牛奶吧。"}, {"speaker": "Child", "en": "Thanks.", "zh": "谢谢。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "scene": "Ordering food", "function": "请求与应答", "turns": [{"speaker": "A", "en": "I'd like some juice and noodles.", "zh": "我想要一些果汁和面条。"}, {"speaker": "B", "en": "I'd like some milk and bread.", "zh": "我想要一些牛奶和面包。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "scene": "Ordering food", "function": "请求与应答", "turns": [{"speaker": "Mum", "en": "Would you like some rice and meat?", "zh": "你想要一些米饭和肉吗？"}, {"speaker": "Child", "en": "Have some vegetables too.", "zh": "也吃点蔬菜吧。"}, {"speaker": "Child", "en": "They're good.", "zh": "它们很好。"}, {"speaker": "Mum", "en": "Yes, please.", "zh": "好的，请。"}, {"speaker": "Mum", "en": "Thank you. I love vegetables.", "zh": "谢谢。我喜欢蔬菜。"}, {"speaker": "Child", "en": "No, thank you.", "zh": "不，谢谢。"}, {"speaker": "Mum", "en": "Would you like some rice?", "zh": "你想要一些米饭吗？"}, {"speaker": "Child", "en": "Yes, please.", "zh": "好的，请。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "scene": "Healthy food chant", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "Rice and noodles are good.", "zh": "米饭和面条很好。"}, {"speaker": "Chant", "en": "Meat, milk and eggs are good too.", "zh": "肉、牛奶和鸡蛋也很好。"}, {"speaker": "Chant", "en": "Fruit and vegetables are colourful and healthy.", "zh": "水果和蔬菜色彩丰富又健康。"}, {"speaker": "Chant", "en": "Eat some every day!", "zh": "每天吃一点！"}, {"speaker": "Chant", "en": "Candy and cake are yummy, but don't eat too much!", "zh": "糖果和蛋糕很好吃，但不要吃太多！"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "scene": "Healthy food chant", "function": "询问信息", "turns": [{"speaker": "Chant", "en": "We are healthy. What do we need?", "zh": "我们是健康的。我们需要什么？"}, {"speaker": "Chant", "en": "Water, soup, milk and juice.", "zh": "水、汤、牛奶和果汁。"}, {"speaker": "Chant", "en": "We are healthy. What do we need?", "zh": "我们是健康的。我们需要什么？"}, {"speaker": "Chant", "en": "Vegetables, rice, meat and fruit.", "zh": "蔬菜、米饭、肉和水果。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "scene": "Reading time", "function": "表达喜好", "turns": [{"speaker": "Zoom", "en": "What would you like to eat, Zoom?", "zh": "Zoom，你想吃什么？"}, {"speaker": "Zoom", "en": "Vegetables are healthy. I love carrots.", "zh": "蔬菜很健康。我喜欢胡萝卜。"}, {"speaker": "Zoom", "en": "You can try!", "zh": "你可以试试！"}, {"speaker": "Zoom", "en": "Healthy food.", "zh": "健康的食物。"}, {"speaker": "Zoom", "en": "How about nuts?", "zh": "坚果怎么样？"}, {"speaker": "Zoom", "en": "OK.", "zh": "好的。"}, {"speaker": "Zoom", "en": "Would you like some meat, Zoom?", "zh": "Zoom，你想要一些肉吗？"}, {"speaker": "Zoom", "en": "It's healthy.", "zh": "它很健康。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "scene": "Let's talk (A)", "function": "询问信息", "turns": [{"speaker": "A", "en": "Do you have old things at home?", "zh": "你家里有旧东西吗？"}, {"speaker": "B", "en": "Yes, I do. I have many old toys and books.", "zh": "是的，我有。我有很多旧玩具和书。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "scene": "Let's talk (B)", "function": "方位与路线", "turns": [{"speaker": "A", "en": "Where is my map?", "zh": "我的地图在哪里？"}, {"speaker": "B", "en": "It's under the box.", "zh": "它在盒子下面。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "scene": "Reading time", "function": "请求与应答", "turns": [{"speaker": "Cat", "en": "Hi, Cat! Do you have any old toys? I need an arm for my robot.", "zh": "嗨，猫！你有一些旧玩具吗？我的机器人需要一只手臂。"}, {"speaker": "Cat", "en": "I have an old doll's arm.", "zh": "我有一只旧娃娃的手臂。"}, {"speaker": "Cat", "en": "Nice!", "zh": "太好了！"}, {"speaker": "Cat", "en": "Thank you.", "zh": "谢谢你。"}, {"speaker": "Cat", "en": "Hi, Tiger! Do you have any old toys? I need an eye for my robot.", "zh": "嗨，老虎！你有一些旧玩具吗？我的机器人需要一只眼睛。"}, {"speaker": "Tiger", "en": "I have an old car. You can use the light!", "zh": "我有一辆旧汽车。你可以用那个灯！"}, {"speaker": "Cat", "en": "I also need a foot for my robot.", "zh": "我的机器人还需要一只脚。"}, {"speaker": "Tiger", "en": "How about this?", "zh": "这个怎么样？"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "scene": "Let's talk (A)", "function": "描述事物", "turns": [{"speaker": "A", "en": "Five and six makes eleven.", "zh": "五加六等于十一。"}, {"speaker": "A", "en": "Add one, it's twelve.", "zh": "再加一，就是十二。"}, {"speaker": "A", "en": "Six and seven makes thirteen.", "zh": "六加七等于十三。"}, {"speaker": "A", "en": "Add one, it's fourteen.", "zh": "再加一，就是十四。"}, {"speaker": "A", "en": "Three fives are fifteen.", "zh": "三个五是十五。"}, {"speaker": "A", "en": "We can count to fifteen!", "zh": "我们可以数到十五！"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "scene": "Let's talk (B)", "function": "购物与价格", "turns": [{"speaker": "A", "en": "How much is this bag?", "zh": "这个包多少钱？"}, {"speaker": "B", "en": "Six yuan, or three for seventeen yuan.", "zh": "六元，或者三个十七元。"}, {"speaker": "A", "en": "OK.", "zh": "好的。"}, {"speaker": "B", "en": "It's twenty yuan.", "zh": "二十元。"}, {"speaker": "A", "en": "How about three for sixteen yuan?", "zh": "三个十六元怎么样？"}, {"speaker": "B", "en": "How much is this book?", "zh": "这本书多少钱？"}, {"speaker": "B", "en": "How much is this toy car?", "zh": "这个玩具车多少钱？"}, {"speaker": "A", "en": "It's twelve yuan.", "zh": "十二元。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "scene": "Role-play", "function": "时间与日程", "turns": [{"speaker": "A", "en": "One minute, tick.", "zh": "一分钟，滴答。"}, {"speaker": "A", "en": "Two minutes, tock.", "zh": "两分钟，滴答。"}, {"speaker": "A", "en": "Sixteen, seventeen, eighteen.", "zh": "十六、十七、十八。"}, {"speaker": "A", "en": "Don't watch the clock.", "zh": "别老看钟。"}, {"speaker": "A", "en": "Nineteen minutes, tick.", "zh": "十九分钟，滴答。"}, {"speaker": "A", "en": "Twenty minutes, tock.", "zh": "二十分钟，滴答。"}, {"speaker": "A", "en": "Time goes slowly, when you watch the clock!", "zh": "当你盯着钟看时，时间过得真慢！"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "scene": "Listen and chant (piggy bank)", "function": "购物与价格", "turns": [{"speaker": "Zhang Peng", "en": "I pay fifteen yuan for five books.", "zh": "我花十五元买了五本书。"}, {"speaker": "Zhang Peng", "en": "And I pay three yuan for a ball.", "zh": "我还花三元买了一个球。"}, {"speaker": "Zhang Peng", "en": "I put two yuan back in my piggy bank.", "zh": "我把两元放回我的存钱罐里。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "scene": "Read and tick", "function": "购物与价格", "turns": [{"speaker": "A", "en": "Ho
