 {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 3", "scene": "Sarah和Wu Binbin询问Amy寒假经历", "function": "询问信息", "turns": [{"speaker": "Sarah", "en": "Where did you go over the winter holiday?", "zh": "你寒假去了哪里？"}, {"speaker": "Amy", "en": "My family and I went to Sanya.", "zh": "我和家人去了三亚。"}, {"speaker": "Wu Binbin", "en": "Really? Did you like it?", "zh": "真的吗？你喜欢那里吗？"}, {"speaker": "Amy", "en": "Yes, it was so warm.", "zh": "是的，那里很暖和。"}, {"speaker": "Sarah", "en": "Hainan is far from here. How did you go there?", "zh": "海南离这里很远。你们怎么去的？"}, {"speaker": "Amy", "en": "We went there by plane.", "zh": "我们坐飞机去的。"}, {"speaker": "Wu Binbin", "en": "How was the beach? What did you do there?", "zh": "海滩怎么样？你在那里做了什么？"}, {"speaker": "Amy", "en": "It was beautiful. I took lots of pictures, and I also went swimming.", "zh": "很美。我拍了很多照片，还去游泳了。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 3", "scene": "Amy询问Wu Binbin暑假情况", "function": "询问信息", "turns": [{"speaker": "Amy", "en": "How was your summer holiday, Binbin?", "zh": "Binbin，你的暑假过得怎么样？"}, {"speaker": "Wu Binbin", "en": "It was good. I went swimming every weekend and took lots of pictures.", "zh": "很好。我每个周末都去游泳，还拍了很多照片。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 3", "scene": "Zoom和Zip谈论Zoom的月球之旅（梦境）", "function": "询问信息", "turns": [{"speaker": "Zoom", "en": "Am I now on the moon? I can’t believe it! She must be Chang’e. Oh, there is the rabbit.", "zh": "我现在在月球上吗？我不敢相信！她一定是嫦娥。哦，那是兔子。"}, {"speaker": "Zip", "en": "Where did you go?", "zh": "你去了哪里？"}, {"speaker": "Zoom", "en": "I went to the moon.", "zh": "我去了月球。"}, {"speaker": "Zip", "en": "How did you go there?", "zh": "你怎么去的？"}, {"speaker": "Zoom", "en": "By spaceship.", "zh": "坐宇宙飞船。"}, {"speaker": "Zip", "en": "What did you see?", "zh": "你看到了什么？"}, {"speaker": "Zoom", "en": "I saw Chang’e, the rabbit and the tree.", "zh": "我看到了嫦娥、兔子和树。"}, {"speaker": "Zip", "en": "Did you take any pictures?", "zh": "你拍照了吗？"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 3", "scene": "Wu Binbin和父亲看旧照片", "function": "描述事物", "turns": [{"speaker": "Wu Binbin", "en": "Binbin, that’s your father.", "zh": "Binbin，那是你爸爸。"}, {"speaker": "Wu Binbin", "en": "You weren’t very big then, Mr Wu!", "zh": "吴先生，那时候您还不算大！"}, {"speaker": "Mr Wu", "en": "No, so I didn’t like PE class very much. I couldn’t run fast or play basketball well.", "zh": "是的，所以我不太喜欢体育课。我跑不快，篮球也打不好。"}, {"speaker": "Wu Binbin", "en": "Wow!", "zh": "哇！"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 4", "scene": "Then and now A", "function": "询问信息", "turns": [{"speaker": "Grandpa", "en": "Wow, a library! There was no library in my old school.", "zh": "哇，一个图书馆！我以前的学校没有图书馆。"}, {"speaker": "Sarah", "en": "Tell us about your school, please.", "zh": "请给我们讲讲你的学校吧。"}, {"speaker": "Grandpa", "en": "There was only one small building on a hill.", "zh": "山上只有一栋小楼。"}, {"speaker": "Wu Binbin", "en": "Could you see stars at night?", "zh": "你晚上能看到星星吗？"}, {"speaker": "Grandpa", "en": "Yes, I liked the stars.", "zh": "是的，我喜欢星星。"}, {"speaker": "Sarah", "en": "Me too. One day I’m going to visit the moon.", "zh": "我也是。总有一天我要去月球。"}, {"speaker": "Wu Binbin", "en": "The Americans took about five days to get there in 1969.", "zh": "1969年美国人花了大约五天到达那里。"}, {"speaker": "Sarah", "en": "How do you know that?", "zh": "你怎么知道的？"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 4", "scene": "Let's talk A", "function": "询问信息", "turns": [{"speaker": "Wu Binbin’s father", "en": "There was no gym in my school thirty years ago.", "zh": "三十年前我的学校没有体育馆。"}, {"speaker": "Wu Binbin", "en": "Now there’s a new one in our school.", "zh": "现在我们学校有一个新的。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 4", "scene": "Then and now B", "function": "描述事物", "turns": [{"speaker": "Chen Jie", "en": "John, come and look at Mike’s old photos!", "zh": "约翰，来看看迈克的旧照片吧！"}, {"speaker": "John", "en": "That’s funny, Mike! You’re wearing a pink T-shirt.", "zh": "真有趣，迈克！你穿着一件粉色T恤。"}, {"speaker": "Mike", "en": "Yes, but I don’t like pink now.", "zh": "是的，但我现在不喜欢粉色了。"}, {"speaker": "Chen Jie", "en": "We are all different now!", "zh": "我们现在都不一样了！"}, {"speaker": "Mike", "en": "Right. Before, I was quiet. Now, I’m very active in class. How about you?", "zh": "对。以前我很安静。现在我在课堂上很活跃。你呢？"}, {"speaker": "John", "en": "Well, I was short, so I couldn’t ride my bike well. Now, I go cycling every day. I like it very much.", "zh": "嗯，我以前很矮，所以骑不好自行车。现在我每天都骑车。我非常喜欢。"}, {"speaker": "Chen Jie", "en": "That’s good exercise.", "zh": "那是很好的锻炼。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 4", "scene": "Let's talk B", "function": "感受与情绪", "turns": [{"speaker": "Wu Binbin", "en": "I didn’t like winter before. I thought it was too cold, and I couldn’t go cycling.", "zh": "我以前不喜欢冬天。我觉得太冷了，而且不能骑车。"}, {"speaker": "Mike", "en": "How about now?", "zh": "现在呢？"}, {"speaker": "Wu Binbin", "en": "Now I love to ice-skate, so I like winter.", "zh": "现在我喜欢滑冰，所以我喜欢冬天。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 4", "scene": "What a dream!", "function": "描述事物", "turns": [{"speaker": "Wu Binbin", "en": "Mum, I had an interesting dream last night.", "zh": "妈妈，我昨晚做了一个有趣的梦。"}, {"speaker": "Mum", "en": "What did you dream about?", "zh": "你梦到了什么？"}, {"speaker": "Wu Binbin", "en": "I had a race with Dad and Max, but I couldn’t run fast.", "zh": "我和爸爸还有马克赛跑，但我跑不快。"}, {"speaker": "Mum", "en": "What happened then?", "zh": "然后发生了什么？"}, {"speaker": "Wu Binbin", "en": "Robin gave me some water. I drank it and then could run very fast. Suddenly I tripped and fell. Then I woke up.", "zh": "罗宾给了我一些水。我喝了之后就能跑得很快。突然我绊倒摔了一跤。然后我醒了。"}, {"speaker": "Mum", "en": "What a dream!", "zh": "真是个梦啊！"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 4", "scene": "Then and now C", "function": "描述事物", "turns": [{"speaker": "Zip", "en": "Oh, cavemen didn’t cook their meat?", "zh": "哦，穴居人不做熟肉吗？"}, {"speaker": "Zoom", "en": "It’s OK. They didn’t do the dishes either!", "zh": "没关系。他们也不洗碗！"}, {"speaker": "Zip", "en": "Heal the world!", "zh": "治愈世界！"}, {"speaker": "Zoom", "en": "Make it a better place!", "zh": "让它变得更美好！"}, {"speaker": "Zip", "en": "Look! How beautiful the world was! Oh! What will the birds do?", "zh": "看！世界曾经多么美丽！哦！鸟儿会怎么办？"}, {"speaker": "Zoom", "en": "Don’t worry. People will help them.", "zh": "别担心。人们会帮助它们的。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Recycle", "scene": "Mike and Bill's game", "function": "描述事物", "turns": [{"speaker": "Bill", "en": "It's an elephant. It's big.", "zh": "这是一头大象。它很大。"}, {"speaker": "Bill", "en": "Guess! Is this bigger or smaller than the elephant?", "zh": "猜猜看！这个比大象大还是小？"}, {"speaker": "Mike", "en": "I think it's bigger than the elephant.", "zh": "我觉得它比大象大。"}, {"speaker": "Bill", "en": "No, it isn't. It's smaller. Look. It's a tiger.", "zh": "不，不是。它更小。看，这是一只老虎。"}, {"speaker": "Bill", "en": "Look. The other card is a whale.", "zh": "看。另一张卡片是一头鲸鱼。"}, {"speaker": "Mike", "en": "So the whale is the biggest, and the tiger is the smallest.", "zh": "所以鲸鱼是最大的，老虎是最小的。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Recycle", "scene": "Zip and Zoom's conversation", "function": "询问信息", "turns": [{"speaker": "Zip", "en": "I have some good news and some bad news.", "zh": "我有一些好消息和一些坏消息。"}, {"speaker": "Zoom", "en": "What is it?", "zh": "是什么？"}, {"speaker": "Zip", "en": "I'm going away for a long time.", "zh": "我要离开很长一段时间。"}, {"speaker": "Zoom", "en": "I'm sorry to hear that.", "zh": "听到这个消息我很难过。"}, {"speaker": "Zoom", "en": "Where are you going?", "zh": "你要去哪里？"}, {"speaker": "Zip", "en": "America. My father has a new job there.", "zh": "美国。我父亲在那里有一份新工作。"}, {"speaker": "Zoom", "en": "That is good news for your father. It's sad news for me.", "zh": "这对你的父亲来说是好消息。对我来说是坏消息。"}, {"speaker": "Zip", "en": "Me too.", "zh": "我也是。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Appendix 1", "scene": "Unit 1 My small cat", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "My small cat, my small cat,", "zh": "我的小猫咪，我的小猫咪，"}, {"speaker": "Chant", "en": "My small cat is smaller than yours.", "zh": "我的小猫咪比你的小。"}, {"speaker": "Chant", "en": "He’s smaller and shorter and younger than yours.", "zh": "它比你的更小、更矮、更年轻。"}, {"speaker": "Chant", "en": "My small cat.", "zh": "我的小猫咪。"}, {"speaker": "Chant", "en": "My big dog, my big dog,", "zh": "我的大狗狗，我的大狗狗，"}, {"speaker": "Chant", "en": "My big dog is bigger than yours.", "zh": "我的大狗狗比你的大。"}, {"speaker": "Chant", "en": "He’s bigger and longer and stronger than yours.", "zh": "它比你的更大、更长、更强壮。"}, {"speaker": "Chant", "en": "My big dog.", "zh": "我的大狗狗。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Appendix 1", "scene": "Unit 2 Last weekend", "function": "询问信息", "turns": [{"speaker": "Chant", "en": "Last weekend I went to the zoo.", "zh": "上周末我去了动物园。"}, {"speaker": "Chant", "en": "What did you do last weekend?", "zh": "你上周末做了什么？"}, {"speaker": "Chant", "en": "I saw a film and played ping-pong.", "zh": "我看了一场电影，还打了乒乓球。"}, {"speaker": "Chant", "en": "What did you do last weekend?", "zh": "你上周末做了什么？"}, {"speaker": "Chant", "en": "Last night I watched TV.", "zh": "昨晚我看了电视。"}, {"speaker": "Chant", "en": "What did you do last night?", "zh": "你昨晚做了什么？"}, {"speaker": "Chant", "en": "I stayed at home and read a book.", "zh": "我待在家里看书。"}, {"speaker": "Chant", "en": "What did you do last night?", "zh": "你昨晚做了什么？"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Appendix 1", "scene": "Unit 3 Tell me about your holiday", "function": "询问信息", "turns": [{"speaker": "Chant", "en": "Where did you go on your holiday, holiday, holiday?", "zh": "你假期去了哪里，假期，假期？"}, {"speaker": "Chant", "en": "Did you swim? Did you shop?", "zh": "你游泳了吗？你购物了吗？"}, {"speaker": "Chant", "en": "What did you do?", "zh": "你做了什么？"}, {"speaker": "Chant", "en": "I went swimming in the sea, in the sea, in the sea.", "zh": "我去海里游泳了，海里，海里，海里。"}, {"speaker": "Chant", "en": "I went shopping near the sea.", "zh": "我去海边购物了。"}, {"speaker": "Chant", "en": "I bought a gift for you.", "zh": "我给你买了一份礼物。"}, {"speaker": "Chant", "en": "Where did you go on your holiday, holiday, holiday?", "zh": "你假期去了哪里，假期，假期？"}, {"speaker": "Chant", "en": "Did you run? Did you jump?", "zh": "你跑步了吗？你跳跃了吗？"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Appendix 1", "scene": "Unit 4 Changes in me", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "Now I am taller, taller than before.", "zh": "现在我更高了，比以前更高。"}, {"speaker": "Chant", "en": "Every day I grow bigger. Every day I grow more.", "zh": "我每天长得更大。我每天长得更多。"}, {"speaker": "Chant", "en": "Once I was a young boy, younger than I am today.", "zh": "曾经我是一个小男孩，比今天的我更年轻。"}, {"speaker": "Chant", "en": "Now I am a big boy, and I’m bigger every day.", "zh": "现在我是一个大男孩，而且我每天长得更大。"}, {"speaker": "Chant", "en": "For school I get up early, earlier than before.", "zh": "为了上学我起得很早，比以前更早。"}, {"speaker": "Chant", "en": "Every day I get up early, sometimes at four!", "zh": "我每天起得很早，有时候四点！"}, {"speaker": "Chant", "en": "Once I didn’t talk a lot. I wasn’t an active boy,", "zh": "曾经我不怎么说话。我不是一个活跃的男孩，"}, {"speaker": "Chant", "en": "But now I talk more than before. I always talk with joy!", "zh": "但现在我比以前说得更多了。我总是开心地说话！"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Appendix 4", "scene": "Unit 1 恐龙身高与鞋码体重", "function": "询问信息", "turns": [{"speaker": "A", "en": "That’s the tallest dinosaur in this hall.", "zh": "那是这个厅里最高的恐龙。"}, {"speaker": "B", "en": "It’s taller than both of us together.", "zh": "它比我俩加起来还高。"}, {"speaker": "A", "en": "How tall are you?", "zh": "你有多高？"}, {"speaker": "B", "en": "I’m 1.65 metres.", "zh": "我身高1.65米。"}, {"speaker": "A", "en": "What size are your shoes, Mike?", "zh": "迈克，你穿多大号的鞋？"}, {"speaker": "B", "en": "Your feet are bigger than mine. My shoes are size 37.", "zh": "你的脚比我的大。我穿37号的鞋。"}, {"speaker": "A", "en": "How heavy are you?", "zh": "你体重多少？"}, {"speaker": "B", "en": "I’m 48 kilograms.", "zh": "我体重48公斤。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Appendix 4", "scene": "Unit 2 周末过得怎么样", "function": "询问信息", "turns": [{"speaker": "A", "en": "How was your weekend?", "zh": "你周末过得怎么样？"}, {"speaker": "B", "en": "It was good, thank you.", "zh": "很好，谢谢。"}, {"speaker": "A", "en": "What did you do?", "zh": "你（周末）干什么了？"}, {"speaker": "B", "en": "I stayed at home with your grandma. We drank tea in the afternoon and watched TV.", "zh": "我和你外婆待在家里。我们喝了下午茶，还看了电视。"}, {"speaker": "A", "en": "Did you do anything else?", "zh": "你还做了其他什么事吗？"}, {"speaker": "B", "en": "Yes, I cleaned my room and washed my clothes.", "zh": "是的，我打扫了房间，还洗了衣服。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Appendix 4", "scene": "Unit 2 买杂志与上周末", "function": "请求与应答", "turns": [{"speaker": "A", "en": "I want to buy the new film magazine.", "zh": "我想买期新的电影杂志。"}, {"speaker": "B", "en": "What did you do last weekend? Did you see a film?", "zh": "你上周末干什么了？你看电影了吗？"}, {"speaker": "A", "en": "No, I had a cold. I stayed at home all weekend and slept.", "zh": "没有，我感冒了。整个周末都待在家里睡觉。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Appendix 6", "scene": "Pete 向卖稻草的人买稻草", "function": "购物与价格", "turns": [{"speaker": "Pete", "en": "Can I please buy your straw?", "zh": "请问我可以买你的稻草吗？"}, {"speaker": "Straw-seller", "en": "Sure. What for?", "zh": "当然可以。用来做什么？"}, {"speaker": "Pete", "en": "I am going to build a house with it.", "zh": "我打算用它盖一座房子。"}, {"speaker": "Straw-seller", "en": "Straw is not strong.", "zh": "稻草不结实。"}, {"speaker": "Pete", "en": "That’s OK. I need a house before winter.", "zh": "没关系。我需要在冬天前有一所房子。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Appendix 6", "scene": "Pat 向卖木棍的人买木棍", "function": "购物与价格", "turns": [{"speaker": "Pat", "en": "Can I please buy your sticks?", "zh": "请问我可以买你的木棍吗？"}, {"speaker": "Stick-seller", "en": "Sure. What for?", "zh": "当然可以。用来做什么？"}, {"speaker": "Pat", "en": "I am going to build a house with them.", "zh": "我打算用它们盖一座房子。"}, {"speaker": "Stick-seller", "en": "Sticks are not strong.", "zh": "木棍不结实。"}, {"speaker": "Pat", "en": "That’s OK. I need a house before winter.", "zh": "没关系。我需要在冬天前有一所房子。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Appendix 6", "scene": "Paul 向卖砖的人买砖", "function": "购物与价格", "turns": [{"speaker": "Paul", "en": "Can I please buy your bricks?", "zh": "请问我可以买你的砖吗？"}, {"speaker": "Brick-seller", "en": "Sure. What for?", "zh": "当然可以。用来做什么？"}, {"speaker": "Paul", "en": "I am going to build a house with them.", "zh": "我打算用它们盖一座房子。"}, {"speaker": "Brick-seller", "en": "Great! Bricks are very strong.", "zh": "太好了！砖非常结实。"}, {"speaker": "Pete", "en": "It is hard work to build a house of bricks.", "zh": "用砖盖房子是很辛苦的工作。"}, {"speaker": "Pat", "en": "Bricks are very heavy.", "zh": "砖很重。"}, {"speaker": "Paul", "en": "Bricks are heavier than straw and sticks.", "zh": "砖比稻草和木棍更重。"}, {"speaker": "Paul", "en": "Brick houses are stronger than straw houses and stick houses.", "zh": "砖房比稻草房和木棍房更坚固。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Appendix 6", "scene": "狼来到 Pete 的稻草房前", "function": "请求与应答", "turns": [{"speaker": "Wolf", "en": "Little Pig, Little Pig, let me in!", "zh": "小猪，小猪，让我进去！"}, {"speaker": "Pete", "en": "No way! No way! Not by the hair on my chin.", "zh": "不行！不行！休想！"}, {"speaker": "Wolf", "en": "Then I will blow your house down.", "zh": "那我就把你的房子吹倒。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Appendix 6", "scene": "狼来到 Pat 的木棍房前", "function": "请求与应答", "turns": [{"speaker": "Wolf", "en": "Little Pig, Little Pig, let me in!", "zh": "小猪，小猪，让我进去！"}, {"speaker": "Pete & Pat", "en": "No way! No way! Not by the hair on my chin.", "zh": "不行！不行！休想！"}, {"speaker": "Wolf", "en": "Then I will blow your house down.", "zh": "那我就把你的房子吹倒。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Appendix 6", "scene": "狼来到 Paul 的砖房前", "function": "请求与应答", "turns": [{"speaker": "W
