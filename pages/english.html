的，他能。他能扫地。"}, {"speaker": "A", "en": "Can we help?", "zh": "我们能帮忙吗？"}, {"speaker": "B", "en": "Yes, we can. That's for sure!", "zh": "是的，我们能。那是肯定的！"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 1", "scene": "Let's talk", "function": "询问信息", "turns": [{"speaker": "A", "en": "You have a big family. Is this your father?", "zh": "你有一个大家庭。这是你爸爸吗？"}, {"speaker": "B", "en": "Yes, it is. He's a PE teacher.", "zh": "是的，他是。他是一名体育老师。"}, {"speaker": "A", "en": "Doctors are great! My father is a doctor too.", "zh": "医生很棒！我爸爸也是一名医生。"}, {"speaker": "A", "en": "What's your mother's job?", "zh": "你妈妈的工作是什么？"}, {"speaker": "B", "en": "She's a doctor.", "zh": "她是一名医生。"}, {"speaker": "A", "en": "What's your mother's job?", "zh": "你妈妈的工作是什么？"}, {"speaker": "B", "en": "She's a teacher.", "zh": "她是一名老师。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 1", "scene": "Let's learn", "function": "询问信息", "turns": [{"speaker": "A", "en": "What's your father's job?", "zh": "你爸爸的工作是什么？"}, {"speaker": "B", "en": "He's a factory worker.", "zh": "他是一名工厂工人。"}, {"speaker": "A", "en": "What's Mike's job?", "zh": "迈克的工作是什么？"}, {"speaker": "B", "en": "He's a doctor.", "zh": "他是一名医生。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 1", "scene": "Let's talk", "function": "能力与他人", "turns": [{"speaker": "A", "en": "Mum and Dad are busy and tired. What can we do for them?", "zh": "爸爸妈妈又忙又累。我们能为他们做些什么？"}, {"speaker": "B", "en": "I can clean the room.", "zh": "我能打扫房间。"}, {"speaker": "B", "en": "We can do some chores.", "zh": "我们能做些家务。"}, {"speaker": "B", "en": "I can cook.", "zh": "我能做饭。"}, {"speaker": "A", "en": "The Double Ninth Festival is coming. What can we do for our grandparents?", "zh": "重阳节快到了。我们能为什么爷爷奶奶做些什么？"}, {"speaker": "B", "en": "I can ...", "zh": "我能……"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 1", "scene": "Listen and chant", "function": "能力与他人", "turns": [{"speaker": "Chant", "en": "We sweep the floor.", "zh": "我们扫地。"}, {"speaker": "Chant", "en": "I look after my sister.", "zh": "我照顾我的妹妹。"}, {"speaker": "Chant", "en": "We cook together. We are happy together.", "zh": "我们一起做饭。我们一起很开心。"}, {"speaker": "Chant", "en": "Mum and Dad are busy.", "zh": "爸爸妈妈很忙。"}, {"speaker": "Chant", "en": "I cook for my family.", "zh": "我为家人做饭。"}, {"speaker": "Chant", "en": "I look after my doggy.", "zh": "我照顾我的小狗。"}, {"speaker": "Chant", "en": "I sweep the floor. It's easy.", "zh": "我扫地。这很容易。"}, {"speaker": "Chant", "en": "We are a happy family.", "zh": "我们是一个幸福的家庭。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 1", "scene": "Let's learn", "function": "能力与他人", "turns": [{"speaker": "Xiao Lin", "en": "Mum, You are a great nurse. You help many people. I can help you at home!", "zh": "妈妈，你是一名很棒的护士。你帮助很多人。我能在家帮你！"}, {"speaker": "Mum", "en": "Xiao Lin, You are still a child. What can you do?", "zh": "小林，你还是个孩子。你能做什么？"}, {"speaker": "Xiao Lin", "en": "Mum, I am a big boy now. I can sweep the floor. I can cook. I can look after my baby sister too!", "zh": "妈妈，我现在是个大男孩了。我能扫地。我能做饭。我也能照顾我的小妹妹！"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 2", "scene": "Look and think", "function": "描述事物", "turns": [{"speaker": "A", "en": "Mum, I have a new friend.", "zh": "妈妈，我有一个新朋友。"}, {"speaker": "A", "en": "Look! He's tall and strong.", "zh": "看！他又高又壮。"}, {"speaker": "B", "en": "Yes. He's also kind.", "zh": "是的，他也很善良。"}, {"speaker": "B", "en": "He often helps me.", "zh": "他经常帮助我。"}, {"speaker": "A", "en": "His name is Zhang Peng.", "zh": "他叫张鹏。"}, {"speaker": "B", "en": "Let me see. He's tall and strong.", "zh": "让我看看。他又高又壮。"}, {"speaker": "B", "en": "I know! It's Zhang Peng.", "zh": "我知道！是张鹏。"}, {"speaker": "B", "en": "He has nice short hair too.", "zh": "他也有漂亮的短发。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 2", "scene": "Let's talk", "function": "描述事物", "turns": [{"speaker": "A", "en": "Tim is my friend.", "zh": "蒂姆是我的朋友。"}, {"speaker": "A", "en": "He's a good, good boy.", "zh": "他是个好、好男孩。"}, {"speaker": "A", "en": "He's tall and thin.", "zh": "他又高又瘦。"}, {"speaker": "A", "en": "He's a good, good boy.", "zh": "他是个好、好男孩。"}, {"speaker": "B", "en": "Lily is my friend.", "zh": "莉莉是我的朋友。"}, {"speaker": "B", "en": "She's a good, good girl.", "zh": "她是个好、好女孩。"}, {"speaker": "B", "en": "She's quiet and kind.", "zh": "她安静又善良。"}, {"speaker": "B", "en": "She's a good, good girl.", "zh": "她是个好、好女孩。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 2", "scene": "Let's spell", "function": "请求与应答", "turns": [{"speaker": "A", "en": "I have no shell.", "zh": "我没有壳。"}, {"speaker": "A", "en": "Can we share?", "zh": "我们能分享吗？"}, {"speaker": "B", "en": "Share? No, we can't.", "zh": "分享？不，我们不能。"}, {"speaker": "B", "en": "Shoo! Go away, Fish!", "zh": "走开！走开，鱼！"}, {"speaker": "A", "en": "You can share my shell!", "zh": "你可以分享我的壳！"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 2", "scene": "Talk about your best friend", "function": "描述事物", "turns": [{"speaker": "A", "en": "Who's your best friend?", "zh": "你最好的朋友是谁？"}, {"speaker": "B", "en": "Liu Jia. She's tall and ... She has long hair. She often ...", "zh": "刘佳。她又高又……她有长发。她经常……"}, {"speaker": "A", "en": "Who's your best friend?", "zh": "你最好的朋友是谁？"}, {"speaker": "B", "en": "Chen Jie. She's funny. She often makes me smile.", "zh": "陈杰。她很有趣。她经常让我笑。"}, {"speaker": "A", "en": "How about you?", "zh": "你呢？"}, {"speaker": "B", "en": "Who's your best friend?", "zh": "你最好的朋友是谁？"}, {"speaker": "C", "en": "My best friend is John. He's very kind.", "zh": "我最好的朋友是约翰。他很善良。"}, {"speaker": "C", "en": "He often helps me with English.", "zh": "他经常帮我学英语。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 2", "scene": "Look, choose and say", "function": "描述事物", "turns": [{"speaker": "A", "en": "Who's your best friend?", "zh": "你最好的朋友是谁？"}, {"speaker": "B", "en": "Zhang Peng.", "zh": "张鹏。"}, {"speaker": "B", "en": "He often reads books with me.", "zh": "他经常和我一起看书。"}, {"speaker": "B", "en": "He reads books with me.", "zh": "他和我一起看书。"}, {"speaker": "B", "en": "He helps me with Chinese.", "zh": "他帮我学中文。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 2", "scene": "Reading time", "function": "描述事物", "turns": [{"speaker": "A", "en": "Tell me about your good friend.", "zh": "跟我说说你的好朋友。"}, {"speaker": "B", "en": "He has small eyes and very big ears.", "zh": "他有小眼睛和非常大的耳朵。"}, {"speaker": "A", "en": "What does he look like?", "zh": "他长什么样？"}, {"speaker": "B", "en": "He has short legs, but his body is very long.", "zh": "他腿短，但身体很长。"}, {"speaker": "A", "en": "Oh, he's great.", "zh": "哦，他真棒。"}, {"speaker": "A", "en": "He likes the park.", "zh": "他喜欢公园。"}, {"speaker": "A", "en": "We often play games here.", "zh": "我们经常在这里玩游戏。"}, {"speaker": "A", "en": "What do you do together?", "zh": "你们一起做什么？"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 3", "scene": "Let's talk (A)", "function": "描述事物", "turns": [{"speaker": "A", "en": "There is a park in your community.", "zh": "你的社区里有一个公园。"}, {"speaker": "B", "en": "Yes, they are. There is a playground.", "zh": "是的，它们都是。还有一个操场。"}, {"speaker": "A", "en": "I often play there with my friends.", "zh": "我经常和朋友们在那里玩。"}, {"speaker": "B", "en": "Your neighbours are very friendly.", "zh": "你的邻居们非常友好。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 3", "scene": "Let's talk (A)", "function": "描述事物", "turns": [{"speaker": "A", "en": "We're at the park.", "zh": "我们在公园里。"}, {"speaker": "B", "en": "Look! There is a shop.", "zh": "看！有一家商店。"}, {"speaker": "A", "en": "Great! Let's go and see.", "zh": "太好了！我们去看看。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 3", "scene": "Let's talk (B)", "function": "描述事物", "turns": [{"speaker": "A", "en": "There is a beautiful park. I often take a walk there.", "zh": "有一个美丽的公园。我经常在那里散步。"}, {"speaker": "B", "en": "There is a playground. I do sports there.", "zh": "有一个操场。我在那里做运动。"}, {"speaker": "A", "en": "There is a shop. I go shopping there.", "zh": "有一家商店。我在那里购物。"}, {"speaker": "B", "en": "There is a hospital. I see a doctor there.", "zh": "有一家医院。我在那里看病。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 3", "scene": "Reading time", "function": "问候与介绍", "turns": [{"speaker": "Peter", "en": "Hi! I'm Peter. My family moved to Chengdu.", "zh": "嗨！我是彼得。我的家人搬到了成都。"}, {"speaker": "Xiao Lin", "en": "Hi! I'm Xiao Lin. What's your name?", "zh": "嗨！我是小林。你叫什么名字？"}, {"speaker": "Peter", "en": "Hi! I'm Peter. I'm from London. It's my first day here.", "zh": "嗨！我是彼得。我来自伦敦。这是我在这里的第一天。"}, {"speaker": "Xiao Lin", "en": "Nice to meet you!", "zh": "很高兴认识你！"}, {"speaker": "Peter", "en": "You're a good player.", "zh": "你是个很好的球员。"}, {"speaker": "Xiao Lin", "en": "Thanks. You too.", "zh": "谢谢。你也是。"}, {"speaker": "Peter", "en": "Would you like some vegetables?", "zh": "你想要一些蔬菜吗？"}, {"speaker": "Xiao Lin", "en": "Yes, please.", "zh": "好的，谢谢。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 4", "scene": "Reading time", "function": "其他", "turns": [{"speaker": "Teacher", "en": "Hello, boys and girls! Let's talk about safety in our community.", "zh": "孩子们好！我们来谈谈社区里的安全。"}, {"speaker": "Student", "en": "There is a big lake in the park. My family often take a walk there.", "zh": "公园里有一个大湖。我的家人经常去那里散步。"}, {"speaker": "Teacher", "en": "What's wrong here?", "zh": "这里有什么问题？"}, {"speaker": "Student", "en": "The light is red! But they're crossing the road.", "zh": "红灯亮了！但他们正在过马路。"}, {"speaker": "Teacher", "en": "Right! Don't cross at a red light!", "zh": "对！红灯时不要过马路！"}, {"speaker": "Teacher", "en": "That's nice! But don't swim there. It's not safe.", "zh": "很好！但不要在那里游泳。那不安全。"}, {"speaker": "Student", "en": "Yes, sir!", "zh": "是的，先生！"}, {"speaker": "Teacher", "en": "Who can help her?", "zh": "谁能帮她？"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 5", "scene": "电话对话：Mark与John谈论北京和悉尼的天气", "function": "询问信息", "turns": [{"speaker": "Mark", "en": "Hello! Mark speaking.", "zh": "你好！我是Mark。"}, {"speaker": "John", "en": "What's the weather like in Beijing?", "zh": "北京天气怎么样？"}, {"speaker": "Mark", "en": "It's cool and sunny.", "zh": "凉爽且晴朗。"}, {"speaker": "John", "en": "Wow! It's cold!", "zh": "哇！好冷啊！"}, {"speaker": "Mark", "en": "Well, it's sunny today.", "zh": "嗯，今天天气晴朗。"}, {"speaker": "John", "en": "No, it isn't. It's 21 degrees.", "zh": "不，不是。现在是21度。"}, {"speaker": "Mark", "en": "Is it hot?", "zh": "热吗？"}, {"speaker": "John", "en": "That's not bad. It's only two degrees in Beijing.", "zh": "那还不错。北京只有2度。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 5", "scene": "看图说天气：北京、哈尔滨、武汉、广州、桂林", "function": "询问信息", "turns": [{"speaker": "A", "en": "What's the weather like in Beijing tomorrow?", "zh": "明天北京天气怎么样？"}, {"speaker": "B", "en": "It's cool and sunny.", "zh": "凉爽且晴朗。"}, {"speaker": "A", "en": "What's the weather like in Harbin?", "zh": "哈尔滨天气怎么样？"}, {"speaker": "B", "en": "It's warm and windy.", "zh": "温暖且多风。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 5", "scene": "John与朋友讨论下雨天的活动", "function": "邀请与建议", "turns": [{"speaker": "A", "en": "John, it's raining now.", "zh": "John，现在下雨了。"}, {"speaker": "B", "en": "It's cold and rainy.", "zh": "又冷又下雨。"}, {"speaker": "A", "en": "We can't play football. But we can make cards at home.", "zh": "我们不能踢足球。但我们可以在家做卡片。"}, {"speaker": "B", "en": "It's OK. We can go to the library.", "zh": "没关系。我们可以去图书馆。"}, {"speaker": "A", "en": "Oh no! We can't play basketball in the park.", "zh": "哦不！我们不能在公园打篮球。"}, {"speaker": "B", "en": "Hmm. Let's go and see a film.", "zh": "嗯。我们去看电影吧。"}, {"speaker": "A", "en": "But it's closed now.", "zh": "但现在它关门了。"}, {"speaker": "B", "en": "That's a good idea!", "zh": "那是个好主意！"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 5", "scene": "阅读时间：妈妈和孩子讨论不同天气下孩子们是否喜欢天气", "function": "感受与情绪", "turns": [{"speaker": "Child", "en": "Mum, do the children like me?", "zh": "妈妈，孩子们喜欢我吗？"}, {"speaker": "Mum", "en": "Of course! Why?", "zh": "当然！为什么这么问？"}, {"speaker": "Child", "en": "Look, it's sunny! They're playing football on the grass!", "zh": "看，天气晴朗！他们在草地上踢足球！"}, {"speaker": "Mum", "en": "They look happy!", "zh": "他们看起来很开心！"}, {"speaker": "Child", "en": "Look, it's windy! The boy is flying a kite and smiling.", "zh": "看，有风！那个男孩在放风筝并且微笑。"}, {"speaker": "Mum", "en": "Yes. He's having fun.", "zh": "是的。他玩得很开心。"}, {"speaker": "Child", "en": "Look, it's snowy! They can play in the snow.", "zh": "看，下雪了！他们可以在雪里玩。"}, {"speaker": "Mum", "en": "Yes, they're making a snowman and having a snowball fight.", "zh": "是的，他们在堆雪人和打雪仗。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 6", "scene": "Let's talk (Unit 6 开头)", "function": "询问信息", "turns": [{"speaker": "A", "en": "What do we wear in different seasons?", "zh": "我们在不同季节穿什么？"}, {"speaker": "B", "en": "In spring, wear a sweater.", "zh": "春天，穿毛衣。"}, {"speaker": "B", "en": "In summer, wear shorts.", "zh": "夏天，穿短裤。"}, {"speaker": "B", "en": "In autumn, wear a jacket.", "zh": "秋天，穿夹克。"}, {"speaker": "B", "en": "In winter, wear a lot!", "zh": "冬天，穿很多！"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 6", "scene": "Let's talk (Binbin and Xinxin packing for winter trip)", "function": "询问信息", "turns": [{"speaker": "Binbin", "en": "Whose sweater is this, Mum?", "zh": "妈妈，这是谁的毛衣？"}, {"speaker": "Mum", "en": "It's Lu Wei's.", "zh": "是陆伟的。"}, {"speaker": "Binbin", "en": "Whose shirts are these?", "zh": "这些是谁的衬衫？"}, {"speaker": "Mum", "en": "They're Xiao Fei's.", "zh": "是肖飞的。"}, {"speaker": "Binbin", "en": "Whose socks are these?", "zh": "这些是谁的袜子？"}, {"speaker": "Mum", "en": "They're mine.", "zh": "是我的。"}, {"speaker": "Binbin", "en": "Can I wear this new shirt today?", "zh": "我今天能穿这件新衬衫吗？"}, {"speaker": "Mum", "en": "Yes, but wear a coat too. It's cold and windy outside.", "zh": "可以，但也要穿件外套。外面又冷又刮风。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 6", "scene": "Let's talk (Act and guess)", "function": "表达喜好", "turns": [{"speaker": "A", "en": "Sarah, which season do you like?", "zh": "莎拉，你喜欢哪个季节？"}, {"speaker": "Sarah", "en": "Winter. It snows a lot. I can play in the snow and make a snowman. What about you?", "zh": "冬天。雪下得很多。我可以在雪里玩，堆雪人。你呢？"}, {"speaker": "A", "en": "I like winter too. There are many festivals. My family and I often get together and have fun.", "zh": "我也喜欢冬天。有很多节日。我和家人经常聚在一起玩得很开心。"}, {"speaker": "A", "en": "You like winter.", "zh": "你喜欢冬天。"}, {"speaker": "Sarah", "en": "You're right!", "zh": "你说得对！"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 6", "scene": "Reading time (Christmas)", "function": "描述事物", "turns": [{"speaker": "A", "en": "Welcome! Merry Christmas!", "zh": "欢迎！圣诞快乐！"}, {"speaker": "A", "en": "Where is your coat?", "zh": "你的外套在哪里？"}, {"speaker": "B", "en": "It's very cold outside.", "zh": "外面很冷。"}, {"speaker": "B", "en": "I don't have a coat, but I have a warm sweater.", "zh": "我没有外套，但我有一件暖和的毛衣。"}, {"speaker": "A", "en": "Thank you!", "zh": "谢谢！"}, {"speaker": "B", "en": "What do you usually do on Christmas Day?", "zh": "你通常在圣诞节做什么？"}, {"speaker": "A", "en": "I put on my shorts and T-shirt and go to the beach.", "zh": "我穿上短裤和T恤，去海滩。"}, {"speaker": "B", "en": "You can go to the beach on Christmas Day?", "zh": "你圣诞节可以去海滩？"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 6", "scene": "Reading time (Snowman)", "function": "感受与情绪", "turns": [{"speaker": "A", "en": "Brrr! It's cold and snowy.", "zh": "好冷啊！又冷又下雪。"}, {"speaker": "B", "en": "You need a warm hat.", "zh": "你需要一顶暖和的帽子。"}, {"speaker": "A", "en": "Yes, I have one. Thank you.", "zh": "是的，我有。谢谢。"}, {"speaker": "B", "en": "OK. Let's go.", "zh": "好的。我们走吧。"}, {"speaker": "A", "en": "Oh look! It's a snowman.", "zh": "哦，看！是个雪人。"}, {"speaker": "B", "en": "Yes, it looks like you.", "zh": "是的，它看起来像你。"}, {"speaker": "A", "en": "He looks cold. He needs a warm hat.", "zh": "他看起来很冷。他需要一顶暖和的帽子。"}, {"speaker": "B", "en": "Ha! Ha! Snowmen love cold weather.", "zh": "哈哈！雪人喜欢寒冷的天气。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Revision", "scene": "讨论如何帮助社区", "function": "邀请与建议", "turns": [{"speaker": "Teacher", "en": "Class, how can you help your community?", "zh": "同学们，你们怎样能帮助社区？"}, {"speaker": "Teacher", "en": "What can you do?", "zh": "你们能做什么？"}, {"speaker": "Student", "en": "We can go to the park and give out some posters.", "zh": "我们可以去公园发一些海报。"}, {"speaker": "Teacher", "en": "Sounds great!", "zh": "听起来很棒！"}, {"speaker": "Student", "en": "We can help the cleaners.", "zh": "我们可以帮助清洁工。"}, {"speaker": "Student", "en": "We can also water the plants.", "zh": "我们还可以给植物浇水。"}, {"speaker": "Teacher", "en": "Which idea do you like? What's your plan?", "zh": "你喜欢哪个主意？你的计划是什么？"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Revision", "scene": "介绍Binbin一家在社区中心的帮助", "function": "描述事物", "turns": [{"speaker": "Binbin", "en": "I'm Wu Binbin. My family often helps at the children's centre.", "zh": "我是吴彬彬。我的家人经常在社区中心帮忙。"}, {"speaker": "Binbin", "en": "My dad is a doctor. He is kind. He often helps the children there.", "zh": "我爸爸是医生。他很善良。他经常在那里帮助孩子们。"}, {"speaker": "Binbin", "en": "My mum is a cook. She cooks nice food there.", "zh": "我妈妈是厨师。她在那里做美味的食物。"}, {"speaker": "Binbin", "en": "My uncle is a PE teacher. He plays football with the children.", "zh": "我叔叔是体育老师。他和孩子们一起踢足球。"}, {"speaker": "Binbin", "en": "My sister Xinxin and I play games with them.", "zh": "我和妹妹欣欣和他们一起玩游戏。"}, {"speaker": "Binbin", "en": "All my family help make our community better.", "zh": "我们全家都帮助让我们的社区变得更好。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Revision", "scene": "关于动物园的chant", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "Three Chinese children help in the zoo.", "zh": "三个中国孩子在动物园帮忙。"}, {"speaker": "Chant", "en": "There are fish, dolphins and big elephants too.", "zh": "那里有鱼、海豚和大象。"}, {"speaker": "Chant", "en": "They take a lot of photos.", "zh": "他们拍了很多照片。"}, {"speaker": "Chant", "en": "The photos are really cool!", "zh": "这些照片真的很酷！"}, {"speaker": "Chant", "en": "Tick, tock. Time for lunch.", "zh": "滴答，滴答。该吃午饭了。"}, {"speaker": "Chant", "en": "Oh! What delicious food!", "zh": "哦！多么美味的食物！"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Appendix 1", "scene": "Unit 1 Helping at home", "function": "描述事物", "turns": [{"speaker": "Song", "en": "This is the way she cleans her room, cleans her room, cleans her room.", "zh": "这就是她打扫房间的方式，打扫房间，打扫房间。"}, {"speaker": "Song", "en": "This is the way she cleans her room and helps her mum and dad.", "zh": "这就是她打扫房间并帮助爸爸妈妈的方式。"}, {"speaker": "Song", "en": "This is the way he cleans his room, cleans his room, cleans his room.", "zh": "这就是他打扫房间的方式，打扫房间，打扫房间。"}, {"speaker": "Song", "en": "This is the way he cleans his room and helps his mum and dad.", "zh": "这就是他打扫房间并帮助爸爸妈妈的方式。"}, {"speaker": "Song", "en": "This is the way they clean their rooms, clean their rooms, clean their rooms.", "zh": "这就是他们打扫房间的方式，打扫房间，打扫房间。"}, {"speaker": "Song", "en": "This is the way they clean their rooms and help their parents at home.", "zh": "这就是他们打扫房间并在家帮助父母的方式。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Appendix 1", "scene": "Unit 2 My friends", "function": "表达喜好", "turns": [{"speaker": "Song", "en": "You like me.", "zh": "你喜欢我。"}, {"speaker": "Song", "en": "I like you.", "zh": "我喜欢你。"}, {"speaker": "Song", "en": "I'm your friend.", "zh": "我是你的朋友。"}, {"speaker": "Song", "en": "You're my friend too.", "zh": "你也是我的朋友。"}, {"speaker": "Song", "en": "We play games.", "zh": "我们玩游戏。"}, {"speaker": "Song", "en": "We like to have fun.", "zh": "我们喜欢玩得开心。"}, {"speaker": "Song", "en": "Let's make friends with everyone.", "zh": "让我们和每个人交朋友。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Appendix 1", "scene": "Unit 3 We love our community!", "function": "描述事物", "turns": [{"speaker": "Song", "en": "My community is important.", "zh": "我的社区很重要。"}, {"speaker": "Song", "en": "My community's important to me.", "zh": "我的社区对我来说很重要。"}, {"speaker": "Song", "en": "The park is my favourite place.", "zh": "公园是我最喜欢的地方。"}, {"speaker": "Song", "en": "There are flowers and people to see.", "zh": "那里有花和人可以看。"}, {"speaker": "Song", "en": "Our community is important.", "zh": "我们的社区很重要。"}, {"speaker": "Song", "en": "Our community helps you and me.", "zh": "我们的社区帮助你和我。"}, {"speaker": "Song", "en": "We can meet and help each other.", "zh": "我们可以见面并互相帮助。"}, {"speaker": "Song", "en": "We love our community.", "zh": "我们爱我们的社区。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Appendix 1", "scene": "Unit 4 Helping in the community", "function": "邀请与建议", "turns": [{"speaker": "Song", "en": "Here's how you can help your town and community.", "zh": "这就是你可以如何帮助你的城镇和社区。"}, {"speaker": "Song", "en": "Help old people cross the road, and keep your town clean.", "zh": "帮助老人过马路，保持城镇清洁。"}, {"speaker": "Song", "en": "There are many ways to help your town and community.", "zh": "有很多方法可以帮助你的城镇和社区。"}, {"speaker": "Song", "en": "Plant a tree or make new friends, and ask them round for tea.", "zh": "种一棵树或结交新朋友，并邀请他们来喝茶。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Appendix 1", "scene": "Unit 5 The weather and us", "function": "询问信息", "turns": [{"speaker": "Song", "en": "What can we do on a rainy day?", "zh": "下雨天我们可以做什么？"}, {"speaker": "Song", "en": "We can go to the library—oh!", "zh": "我们可以去图书馆——哦！"}, {"speaker": "Song", "en": "What can we do on a windy day?", "zh": "刮风天我们可以做什么？"}, {"speaker": "Song", "en": "We can fly our kite—oh!", "zh": "我们可以放风筝——哦！"}, {"speaker": "Song", "en": "What can we do on a sunny day?", "zh": "晴天我们可以做什么？"}, {"speaker": "Song", "en": "We can do what we like—oh!", "zh": "我们可以做我们喜欢的事——哦！"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Appendix 1", "scene": "Unit 6 What should I wear today?", "function": "请求与应答", "turns": [{"speaker": "A", "en": "Wear your new sweater, please.", "zh": "请穿上你的新毛衣。"}, {"speaker": "A", "en": "And wear a hat.", "zh": "再戴上一顶帽子。"}, {"speaker": "B", "en": "Do I have to wear all this?", "zh": "我必须穿这么多吗？"}, {"speaker": "A", "en": "Yes, it is cold.", "zh": "是的，天气很冷。"}, {"speaker": "A", "en": "Wear your yellow coat today.", "zh": "今天穿上你的黄色外套。"}, {"speaker": "A", "en": "Take an umbrella.", "zh": "带一把伞。"}, {"speaker": "B", "en": "Do I have to take all this?", "zh": "我必须带这么多吗？"}, {"speaker": "A", "en": "Yes, it is rainy.", "zh": "是的，下雨了。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 1", "scene": "Look and think", "function": "能力与他人", "turns": [{"speaker": "A", "en": "Can you help?", "zh": "你能帮忙吗？"}, {"speaker": "B", "en": "Yes, I can. I can clean my room.", "zh": "是的，我能。我能打扫我的房间。"}, {"speaker": "A", "en": "Can she help?", "zh": "她能帮忙吗？"}, {"speaker": "B", "en": "Yes, she can. She can do some chores.", "zh": "是的，她能。她能做些家务。"}, {"speaker": "A", "en": "Can he help?", "zh": "他能帮忙吗？"}, {"speaker": "B", "en": "Yes, he can. He can sweep the floor.", "zh": "是的，他能。他能扫地。"}, {"speaker": "A", "en": "Can we help?", "zh": "我们能帮忙吗？"}, {"speaker": "B", "en": "Yes, we can. That's for sure!", "zh": "是的，我们能。那是肯定的！"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 1", "scene": "Let's talk", "function": "询问信息", "turns": [{"speaker": "A", "en": "You have a big family. Is this your father?", "zh": "你有一个大家庭。这是你爸爸吗？"}, {"speaker": "B", "en": "Yes, it is. He's a PE teacher.", "zh": "是的，他是。他是一名体育老师。"}, {"speaker": "A", "en": "Doctors are great! My father is a doctor too.", "zh": "医生很棒！我爸爸也是一名医生。"}, {"speaker": "A", "en": "What's your mother's job?", "zh": "你妈妈的工作是什么？"}, {"speaker": "B", "en": "She's a doctor.", "zh": "她是一名医生。"}, {"speaker": "A", "en": "What's your mother's job?", "zh": "你妈妈的工作是什么？"}, {"speaker": "B", "en": "She's a teacher.", "zh": "她是一名老师。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 1", "scene": "Let's learn", "function": "询问信息", "turns": [{"speaker": "A", "en": "What's your father's job?", "zh": "你爸爸的工作是什么？"}, {"speaker": "B", "en": "He's a factory worker.", "zh": "他是一名工厂工人。"}, {"speaker": "A", "en": "What's Mike's job?", "zh": "Mike的工作是什么？"}, {"speaker": "B", "en": "He's a doctor.", "zh": "他是一名医生。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 1", "scene": "Let's talk", "function": "能力与他人", "turns": [{"speaker": "A", "en": "Mum and Dad are busy and tired. What can we do for them?", "zh": "爸爸妈妈又忙又累。我们能为他们做些什么？"}, {"speaker": "B", "en": "I can clean the room.", "zh": "我能打扫房间。"}, {"speaker": "B", "en": "We can do some chores.", "zh": "我们能做些家务。"}, {"speaker": "B", "en": "I can cook.", "zh": "我能做饭。"}, {"speaker": "A", "en": "The Double Ninth Festival is coming. What can we do for our grandparents?", "zh": "重阳节快到了。我们能为什么爷爷奶奶做些什么？"}, {"speaker": "B", "en": "I can ...", "zh": "我能……"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 1", "scene": "Let's learn", "function": "能力与他人", "turns": [{"speaker": "A", "en": "Mum, You are a great nurse. You help many people. I can help you at home!", "zh": "妈妈，你是一名很棒的护士。你帮助很多人。我能在家帮你！"}, {"speaker": "B", "en": "Xiao Lin, You are still a child. What can you do?", "zh": "小林，你还是个孩子。你能做什么？"}, {"speaker": "A", "en": "Mum, I am a big boy now. I can sweep the floor. I can cook. I can look after my baby sister too!", "zh": "妈妈，我现在是个大男孩了。我能扫地。我能做饭。我也能照顾我的小妹妹！"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 1", "scene": "Reading time", "function": "描述事物", "turns": [{"speaker": "A", "en": "My mum is a writer. She writes a lot of good books.", "zh": "我妈妈是一名作家。她写了很多好书。"}, {"speaker": "A", "en": "Mum is also a great cook. She can cook great food!", "zh": "妈妈也是一名很棒的厨师。她能做出美味的食物！"}, {"speaker": "A", "en": "Mum is very busy. We can help her at home.", "zh": "妈妈很忙。我们可以在家帮她。"}, {"speaker": "A", "en": "We want to make this. But now we have this!", "zh": "我们想做这个。但现在我们有了这个！"}, {"speaker": "A", "en": "Mum is still happy! She's a great mum!", "zh": "妈妈还是很开心！她是一位很棒的妈妈！"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 2", "scene": "Let's talk (A)", "function": "描述事物", "turns": [{"speaker": "A", "en": "Mum, I have a new friend.", "zh": "妈妈，我有一个新朋友。"}, {"speaker": "A", "en": "Look! He's tall and strong.", "zh": "看！他又高又壮。"}, {"speaker": "Mum", "en": "Yes. He's also kind.", "zh": "是的，他也很善良。"}, {"speaker": "Mum", "en": "He often helps me.", "zh": "他经常帮助我。"}, {"speaker": "A", "en": "He's tall and strong.", "zh": "他又高又壮。"}, {"speaker": "A", "en": "He has short hair.", "zh": "他留着短发。"}, {"speaker": "Mum", "en": "Really? What's your friend's name?", "zh": "真的吗？你朋友叫什么名字？"}, {"speaker": "A", "en": "His name is Zhang Peng.", "zh": "他叫张鹏。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 2", "scene": "Let's talk (B)", "function": "描述事物", "turns": [{"speaker": "A", "en": "Tim is my friend.", "zh": "蒂姆是我的朋友。"}, {"speaker": "A", "en": "He's a good, good boy.", "zh": "他是个好、好男孩。"}, {"speaker": "A", "en": "He's tall and thin.", "zh": "他又高又瘦。"}, {"speaker": "A", "en": "He's a good, good boy.", "zh": "他是个好、好男孩。"}, {"speaker": "A", "en": "Lily is my friend.", "zh": "莉莉是我的朋友。"}, {"speaker": "A", "en": "She's a good, good girl.", "zh": "她是个好、好女孩。"}, {"speaker": "A", "en": "She's quiet and kind.", "zh": "她安静又善良。"}, {"speaker": "A", "en": "She's a good, good girl.", "zh": "她是个好、好女孩。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 2", "scene": "Let's talk (C)", "function": "描述事物", "turns": [{"speaker": "A", "en": "Who's your best friend?", "zh": "你最好的朋友是谁？"}, {"speaker": "B", "en": "Liu Jia. She's tall and ... She has long hair. She often ...", "zh": "刘佳。她又高又……她留着长发。她经常……"}, {"speaker": "A", "en": "Who's your best friend?", "zh": "你最好的朋友是谁？"}, {"speaker": "B", "en": "Chen Jie. She's funny. She often makes me smile.", "zh": "陈洁。她很有趣。她经常逗我笑。"}, {"speaker": "A", "en": "How about you?", "zh": "你呢？"}, {"speaker": "B", "en": "Who's your best friend?", "zh": "你最好的朋友是谁？"}, {"speaker": "A", "en": "My best friend is John. He's very kind.", "zh": "我最好的朋友是约翰。他很善良。"}, {"speaker": "A", "en": "He often helps me with English.", "zh": "他经常帮我学英语。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 2", "scene": "Let's spell", "function": "请求与应答", "turns": [{"speaker": "A", "en": "I have no shell.", "zh": "我没有壳。"}, {"speaker": "B", "en": "Can we share?", "zh": "我们能分享吗？"}, {"speaker": "A", "en": "Share? No, we can't.", "zh": "分享？不，我们不能。"}, {"speaker": "A", "en": "Shoo! Go away, Fish!", "zh": "走开！走开，鱼！"}, {"speaker": "B", "en": "You can share my shell!", "zh": "你可以分享我的壳！"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 2", "scene": "Reading time", "function": "描述事物", "turns": [{"speaker": "A", "en": "Tell me about your good friend.", "zh": "跟我说说你的好朋友。"}, {"speaker": "B", "en": "He has small eyes and very big ears.", "zh": "他眼睛很小，耳朵很大。"}, {"speaker": "A", "en": "What does he look like?", "zh": "他长什么样？"}, {"speaker": "B", "en": "He has short legs, but his body is very long.", "zh": "他腿很短，但身体很长。"}, {"speaker": "A", "en": "Oh, he's great.", "zh": "哦，他真棒。"}, {"speaker": "A", "en": "He likes the park.", "zh": "他喜欢公园。"}, {"speaker": "A", "en": "We often play games here.", "zh": "我们经常在这里玩游戏。"}, {"speaker": "A", "en": "What do you do together?", "zh": "你们一起做什么？"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 3", "scene": "Reading time", "function": "问候与介绍", "turns": [{"speaker": "Peter", "en": "Hi! I'm Peter. My family moved to Chengdu. This is my video diary.", "zh": "嗨！我是彼得。我的家人搬到了成都。这是我的视频日记。"}, {"speaker": "Xiao Lin", "en": "Hi! I'm Xiao Lin.", "zh": "嗨！我是小林。"}, {"speaker": "Xiao Lin", "en": "What's your name?", "zh": "你叫什么名字？"}, {"speaker": "Peter", "en": "Hi! I'm Peter. I'm from London. It's my first day here.", "zh": "嗨！我是彼得。我来自伦敦。这是我在这里的第一天。"}, {"speaker": "Xiao Lin", "en": "Nice to meet you!", "zh": "很高兴见到你！"}, {"speaker": "Xiao Lin", "en": "You're a good player.", "zh": "你是个很好的球员。"}, {"speaker": "Peter", "en": "Thanks. You too.", "zh": "谢谢。你也是。"}, {"speaker": "Xiao Lin", "en": "Would you like some vegetables?", "zh": "你想吃些蔬菜吗？"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 4", "scene": "Reading time", "function": "其他", "turns": [{"speaker": "Teacher", "en": "Hello, boys and girls! Let's talk about safety in our community.", "zh": "孩子们好！我们来谈谈社区里的安全。"}, {"speaker": "Student", "en": "There is a big lake in the park. My family often take a walk there.", "zh": "公园里有一个大湖。我的家人经常去那里散步。"}, {"speaker": "Teacher", "en": "What's wrong here?", "zh": "这里有什么问题？"}, {"speaker": "Student", "en": "The light is red! But they're crossing the road.", "zh": "红灯亮了！但他们正在过马路。"}, {"speaker": "Teacher", "en": "Right! Don't cross at a red light!", "zh": "对！红灯时不要过马路！"}, {"speaker": "Teacher", "en": "That's nice! But don't swim there. It's not safe.", "zh": "很好！但不要在那里游泳。那不安全。"}, {"speaker": "Student", "en": "Yes, sir!", "zh": "是的，先生！"}, {"speaker": "Teacher", "en": "Who can help her?", "zh": "谁能帮她？"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 5", "scene": "电话对话：Mark与John谈论北京和悉尼的天气", "function": "询问信息", "turns": [{"speaker": "Mark", "en": "Hello! Mark speaking.", "zh": "你好！我是Mark。"}, {"speaker": "John", "en": "What's the weather like in Beijing?", "zh": "北京的天气怎么样？"}, {"speaker": "Mark", "en": "It's cool and sunny.", "zh": "天气凉爽又晴朗。"}, {"speaker": "John", "en": "Wow! It's cold!", "zh": "哇！好冷啊！"}, {"speaker": "Mark", "en": "Well, it's sunny today.", "zh": "嗯，今天天气晴朗。"}, {"speaker": "John", "en": "No, it isn't. It's 21 degrees.", "zh": "不，不是。现在是21度。"}, {"speaker": "Mark", "en": "Is it hot?", "zh": "热吗？"}, {"speaker": "John", "en": "That's not bad. It's only two degrees in Beijing.", "zh": "那还不错。北京只有2度。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 5", "scene": "看图说天气：北京、哈尔滨、武汉、广州、桂林", "function": "询问信息", "turns": [{"speaker": "A", "en": "What's the weather like in Beijing tomorrow?", "zh": "明天北京的天气怎么样？"}, {"speaker": "B", "en": "It's cool and sunny.", "zh": "天气凉爽又晴朗。"}, {"speaker": "A", "en": "What's the weather like in Harbin?", "zh": "哈尔滨的天气怎么样？"}, {"speaker": "B", "en": "It's warm and windy.", "zh": "天气温暖又有风。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 5", "scene": "天气与活动：下雨天能做什么", "function": "请求与应答", "turns": [{"speaker": "A", "en": "John, it's raining now.", "zh": "John，现在下雨了。"}, {"speaker": "B", "en": "It's cold and rainy.", "zh": "天气又冷又下雨。"}, {"speaker": "A", "en": "We can't play football. But we can make cards at home.", "zh": "我们不能踢足球。但我们可以在家做卡片。"}, {"speaker": "B", "en": "It's OK. We can go to the library.", "zh": "没关系。我们可以去图书馆。"}, {"speaker": "A", "en": "Oh no! We can't play basketball in the park.", "zh": "哦不！我们不能在公园里打篮球。"}, {"speaker": "B", "en": "Hmm. Let's go and see a film.", "zh": "嗯。我们去看电影吧。"}, {"speaker": "A", "en": "But it's closed now.", "zh": "但现在它关门了。"}, {"speaker": "B", "en": "That's a good idea!", "zh": "那是个好主意！"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 5", "scene": "不同天气下能做什么", "function": "描述事物", "turns": [{"speaker": "A", "en": "It's cold and snowy.", "zh": "天气又冷又下雪。"}, {"speaker": "B", "en": "What can we do?", "zh": "我们能做什么？"}, {"speaker": "A", "en": "We can't fly a kite.", "zh": "我们不能放风筝。"}, {"speaker": "B", "en": "On snowy days, we can make a snowman.", "zh": "下雪天，我们可以堆雪人。"}, {"speaker": "A", "en": "On sunny days, we can play basketball.", "zh": "晴天，我们可以打篮球。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 5", "scene": "明信片：爸爸写给John的信", "function": "询问信息", "turns": [{"speaker": "Dad", "en": "Hi, John!", "zh": "嗨，John！"}, {"speaker": "Dad", "en": "How are you?", "zh": "你好吗？"}, {"speaker": "Dad", "en": "I'm in a big park in Sydney today.", "zh": "我今天在悉尼的一个大公园里。"}, {"speaker": "Dad", "en": "It's hot and sunny here.", "zh": "这里又热又晴朗。"}, {"speaker": "Dad", "en": "It's fun to go to the park with my new friends.", "zh": "和我的新朋友去公园玩很有趣。"}, {"speaker": "Dad", "en": "We play basketball together.", "zh": "我们一起打篮球。"}, {"speaker": "Dad", "en": "Their children swim in the pool.", "zh": "他们的孩子在游泳池里游泳。"}, {"speaker": "Dad", "en": "How about you?", "zh": "你呢？"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 5", "scene": "阅读时间：妈妈和孩子谈论天气", "function": "感受与情绪", "turns": [{"speaker": "Child", "en": "Mum, do the children like me?", "zh": "妈妈，孩子们喜欢我吗？"}, {"speaker": "Mum", "en": "Of course! Why?", "zh": "当然！为什么这么问？"}, {"speaker": "Child", "en": "Look, it's sunny! They're playing football on the grass!", "zh": "看，天气晴朗！他们在草地上踢足球！"}, {"speaker": "Child", "en": "They look happy!", "zh": "他们看起来很开心！"}, {"speaker": "Child", "en": "Look, it's windy! The boy is flying a kite and smiling.", "zh": "看，有风！那个男孩在放风筝并且微笑着。"}, {"speaker": "Mum", "en": "Yes. He's having fun.", "zh": "是的。他玩得很开心。"}, {"speaker": "Child", "en": "Look, it's snowy! They can play in the snow.", "zh": "看，下雪了！他们可以在雪里玩。"}, {"speaker": "Mum", "en": "Yes, they're making a snowman and having a snowball fight.", "zh": "是的，他们在堆雪人和打雪仗。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 6", "scene": "Let's talk (Unit 6 开头)", "function": "询问信息", "turns": [{"speaker": "A", "en": "What do we wear in different seasons?", "zh": "我们在不同季节穿什么？"}, {"speaker": "B", "en": "In spring, wear a sweater.", "zh": "春天，穿一件毛衣。"}, {"speaker": "B", "en": "In summer, wear shorts.", "zh": "夏天，穿短裤。"}, {"speaker": "B", "en": "In autumn, wear a jacket.", "zh": "秋天，穿一件夹克。"}, {"speaker": "B", "en": "In winter, wear a lot!", "zh": "冬天，穿很多！"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 6", "scene": "Let's talk (Binbin and Xinxin packing for their winter trip)", "function": "询问信息", "turns": [{"speaker": "Binbin", "en": "Whose sweater is this, Mum?", "zh": "妈妈，这是谁的毛衣？"}, {"speaker": "Mum", "en": "It's mine.", "zh": "是我的。"}, {"speaker": "Binbin", "en": "Whose socks are these?", "zh": "这些是谁的袜子？"}, {"speaker": "Mum", "en": "They're mine.", "zh": "是我的。"}, {"speaker": "Xinxin", "en": "Can I wear this new shirt today?", "zh": "我今天可以穿这件新衬衫吗？"}, {"speaker": "Mum", "en": "Yes, but wear a coat too. It's cold and windy outside.", "zh": "可以，但也要穿件外套。外面又冷又刮风。"}, {"speaker": "Mum", "en": "It's your dad's. Put it there, please.", "zh": "这是你爸爸的。请把它放在那里。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 6", "scene": "Let's talk (Act and guess)", "function": "表达喜好", "turns": [{"speaker": "A", "en": "Sarah, which season do you like?", "zh": "Sarah，你喜欢哪个季节？"}, {"speaker": "Sarah", "en": "Winter. It snows a lot. I can play in the snow and make a snowman. What about you?", "zh": "冬天。雪下得很多。我可以在雪里玩，还能堆雪人。你呢？"}, {"speaker": "A", "en": "I like winter too. There are many festivals. My family and I often get together and have fun.", "zh": "我也喜欢冬天。有很多节日。我和家人经常聚在一起，玩得很开心。"}, {"speaker": "A", "en": "You like winter.", "zh": "你喜欢冬天。"}, {"speaker": "Sarah", "en": "You're right!", "zh": "你说得对！"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 6", "scene": "Reading time (Christmas)", "function": "描述事物", "turns": [{"speaker": "A", "en": "Welcome! Merry Christmas!", "zh": "欢迎！圣诞快乐！"}, {"speaker": "A", "en": "Where is your coat?", "zh": "你的外套在哪里？"}, {"speaker": "B", "en": "It's very cold outside.", "zh": "外面很冷。"}, {"speaker": "B", "en": "I don't have a coat, but I have a warm sweater.", "zh": "我没有外套，但我有一件暖和的毛衣。"}, {"speaker": "A", "en": "Thank you!", "zh": "谢谢！"}, {"speaker": "B", "en": "What do you usually do on Christmas Day?", "zh": "你通常在圣诞节做什么？"}, {"speaker": "A", "en": "I put on my shorts and T-shirt and go to the beach.", "zh": "我穿上短裤和T恤，去海滩。"}, {"speaker": "B", "en": "You can go to the beach on Christmas Day?", "zh": "你圣诞节可以去海滩？"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 6", "scene": "Reading time (Snowman)", "function": "感受与情绪", "turns": [{"speaker": "A", "en": "Brrr! It's cold and snowy.", "zh": "好冷啊！又冷又下雪。"}, {"speaker": "B", "en": "You need a warm hat.", "zh": "你需要一顶暖和的帽子。"}, {"speaker": "A", "en": "Yes, I have one.", "zh": "是的，我有一顶。"}, {"speaker": "A", "en": "Thank you.", "zh": "谢谢。"}, {"speaker": "B", "en": "OK. Let's go.", "zh": "好的。我们走吧。"}, {"speaker": "A", "en": "Oh look! It's a snowman.", "zh": "哦，看！是个雪人。"}, {"speaker": "B", "en": "Yes, it looks like you.", "zh": "是的，它看起来像你。"}, {"speaker": "A", "en": "He looks cold.", "zh": "他看起来很冷。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Revision", "scene": "讨论如何帮助社区", "function": "邀请与建议", "turns": [{"speaker": "Teacher", "en": "Class, how can you help your community?", "zh": "同学们，你们怎样能帮助社区？"}, {"speaker": "Teacher", "en": "What can you do?", "zh": "你们能做什么？"}, {"speaker": "Student", "en": "We can go to the park and give out some posters.", "zh": "我们可以去公园发一些海报。"}, {"speaker": "Teacher", "en": "Sounds great!", "zh": "听起来很棒！"}, {"speaker": "Student", "en": "We can help the cleaners.", "zh": "我们可以帮助清洁工。"}, {"speaker": "Student", "en": "We can also water the plants.", "zh": "我们还可以给植物浇水。"}, {"speaker": "Teacher", "en": "Which idea do you like? What's your plan?", "zh": "你喜欢哪个主意？你的计划是什么？"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Revision", "scene": "Binbin 介绍家人在社区中心的帮助", "function": "描述事物", "turns": [{"speaker": "Binbin", "en": "I'm Wu Binbin. My family often helps at the children's centre.", "zh": "我是吴彬彬。我的家人经常在儿童中心帮忙。"}, {"speaker": "Binbin", "en": "My dad is a doctor. He is kind. He often helps the children there.", "zh": "我爸爸是医生。他很善良。他经常在那里帮助孩子们。"}, {"speaker": "Binbin", "en": "My mum is a cook. She cooks nice food there.", "zh": "我妈妈是厨师。她在那里做美味的食物。"}, {"speaker": "Binbin", "en": "My uncle is a PE teacher. He plays football with the children.", "zh": "我叔叔是体育老师。他和孩子们一起踢足球。"}, {"speaker": "Binbin", "en": "My sister Xinxin and I play games with them.", "zh": "我妹妹欣欣和我和他们一起玩游戏。"}, {"speaker": "Binbin", "en": "All my family help make our community better.", "zh": "我们全家都帮助让我们的社区变得更好。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Revision", "scene": "关于动物园的chant", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "Three Chinese children help in the zoo.", "zh": "三个中国孩子在动物园帮忙。"}, {"speaker": "Chant", "en": "There are fish, dolphins and big elephants too.", "zh": "那里有鱼、海豚和大象。"}, {"speaker": "Chant", "en": "They take a lot of photos.", "zh": "他们拍了很多照片。"}, {"speaker": "Chant", "en": "The photos are really cool!", "zh": "这些照片真的很酷！"}, {"speaker": "Chant", "en": "Tick, tock. Time for lunch.", "zh": "滴答，滴答。该吃午饭了。"}, {"speaker": "Chant", "en": "Oh! What delicious food!", "zh": "哦！多么美味的食物！"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Appendix 1", "scene": "Unit 1 Helping at home", "function": "描述事物", "turns": [{"speaker": "Song", "en": "This is the way she cleans her room, cleans her room, cleans her room.", "zh": "这就是她打扫房间的方式，打扫房间，打扫房间。"}, {"speaker": "Song", "en": "This is the way she cleans her room and helps her mum and dad.", "zh": "这就是她打扫房间并帮助爸爸妈妈的方式。"}, {"speaker": "Song", "en": "This is the way he cleans his room, cleans his room, cleans his room.", "zh": "这就是他打扫房间的方式，打扫房间，打扫房间。"}, {"speaker": "Song", "en": "This is the way he cleans his room and helps his mum and dad.", "zh": "这就是他打扫房间并帮助爸爸妈妈的方式。"}, {"speaker": "Song", "en": "This is the way they clean their rooms, clean their rooms, clean their rooms.", "zh": "这就是他们打扫房间的方式，打扫房间，打扫房间。"}, {"speaker": "Song", "en": "This is the way they clean their rooms and help their parents at home.", "zh": "这就是他们打扫房间并在家帮助父母的方式。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Appendix 1", "scene": "Unit 2 My friends", "function": "表达喜好", "turns": [{"speaker": "Song", "en": "You like me.", "zh": "你喜欢我。"}, {"speaker": "Song", "en": "I like you.", "zh": "我喜欢你。"}, {"speaker": "Song", "en": "I'm your friend.", "zh": "我是你的朋友。"}, {"speaker": "Song", "en": "You're my friend too.", "zh": "你也是我的朋友。"}, {"speaker": "Song", "en": "We play games.", "zh": "我们玩游戏。"}, {"speaker": "Song", "en": "We like to have fun.", "zh": "我们喜欢玩得开心。"}, {"speaker": "Song", "en": "Let's make friends with everyone.", "zh": "让我们和每个人交朋友。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Appendix 1", "scene": "Unit 3 We love our community!", "function": "描述事物", "turns": [{"speaker": "Song", "en": "My community is important.", "zh": "我的社区很重要。"}, {"speaker": "Song", "en": "My community's important to me.", "zh": "我的社区对我来说很重要。"}, {"speaker": "Song", "en": "The park is my favourite place.", "zh": "公园是我最喜欢的地方。"}, {"speaker": "Song", "en": "There are flowers and people to see.", "zh": "那里有花和人可以看。"}, {"speaker": "Song", "en": "Our community is important.", "zh": "我们的社区很重要。"}, {"speaker": "Song", "en": "Our community helps you and me.", "zh": "我们的社区帮助你和我。"}, {"speaker": "Song", "en": "We can meet and help each other.", "zh": "我们可以见面并互相帮助。"}, {"speaker": "Song", "en": "We love our community.", "zh": "我们爱我们的社区。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Appendix 1", "scene": "Unit 4 Helping in the community", "function": "邀请与建议", "turns": [{"speaker": "Song", "en": "Here's how you can help your town and community.", "zh": "这就是你可以帮助你的城镇和社区的方式。"}, {"speaker": "Song", "en": "Help old people cross the road, and keep your town clean.", "zh": "帮助老人过马路，保持城镇清洁。"}, {"speaker": "Song", "en": "There are many ways to help your town and community.", "zh": "有很多方式可以帮助你的城镇和社区。"}, {"speaker": "Song", "en": "Plant a tree or make new friends, and ask them round for tea.", "zh": "种一棵树或结交新朋友，并邀请他们来喝茶。"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Appendix 1", "scene": "Unit 5 The weather and us", "function": "询问信息", "turns": [{"speaker": "Song", "en": "What can we do on a rainy day?", "zh": "下雨天我们可以做什么？"}, {"speaker": "Song", "en": "We can go to the library—oh!", "zh": "我们可以去图书馆——哦！"}, {"speaker": "Song", "en": "What can we do on a windy day?", "zh": "刮风天我们可以做什么？"}, {"speaker": "Song", "en": "We can fly our kite—oh!", "zh": "我们可以放风筝——哦！"}, {"speaker": "Song", "en": "What can we do on a sunny day?", "zh": "晴天我们可以做什么？"}, {"speaker": "Song", "en": "We can do what we like—oh!", "zh": "我们可以做我们喜欢的事——哦！"}]}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Appendix 1", "scene": "Unit 6 , "en": "We put back the chairs and close the doors.", "zh": "我们把椅子放好并关门。"}, {"speaker": "A", "en": "Our job is done!", "zh": "我们的任务完成了！"}, {"speaker": "B", "en": "Now the classroom is clean!", "zh": "现在教室很干净了！"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 1", "scene": "Look and say", "function": "询问信息", "turns": [{"speaker": "A", "en": "Who's on duty today?", "zh": "今天谁值日？"}, {"speaker": "B", "en": "We are, Miss White.", "zh": "我们值日，怀特老师。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 1", "scene": "Project: Make signs for class rules", "function": "邀请与建议", "turns": [{"speaker": "A", "en": "Look at this sign.", "zh": "看这个标志。"}, {"speaker": "B", "en": "What rule is it?", "zh": "这是什么规则？"}, {"speaker": "A", "en": "Keep the classroom clean.", "zh": "保持教室整洁。"}, {"speaker": "B", "en": "Yes, you're right! Let's put it on the wall.", "zh": "是的，你说得对！我们把它贴在墙上吧。"}, {"speaker": "A", "en": "OK.", "zh": "好的。"}, {"speaker": "B", "en": "Let's put them on the classroom wall.", "zh": "我们把这些贴在教室的墙上吧。"}, {"speaker": "A", "en": "Let's make some signs.", "zh": "我们做一些标志吧。"}, {"speaker": "B", "en": "OK.", "zh": "好的。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 1", "scene": "Reading time", "function": "请求与应答", "turns": [{"speaker": "Zip", "en": "Zip, look!", "zh": "Zip，看！"}, {"speaker": "Zip", "en": "Shh! Don't talk in class.", "zh": "嘘！不要在课堂上说话。"}, {"speaker": "Zip", "en": "It's a bee!", "zh": "是一只蜜蜂！"}, {"speaker": "Zip", "en": "Don't turn off the lights.", "zh": "不要关灯。"}, {"speaker": "Zip", "en": "It's too dark.", "zh": "太黑了。"}, {"speaker": "Zip", "en": "Sorry, sir!", "zh": "对不起，老师！"}, {"speaker": "Zip", "en": "The bee is on the light!", "zh": "蜜蜂在灯上！"}, {"speaker": "Zip", "en": "Look! It's on my desk!", "zh": "看！它在我的桌子上！"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 2", "scene": "Let's talk (A)", "function": "询问信息", "turns": [{"speaker": "A", "en": "What are your family rules?", "zh": "你的家规是什么？"}, {"spea 吃午饭了！"}, {"speaker": "Chant", "en": "Tick-tock. Time moves fast.", "zh": "滴答滴答。时间过得真快。"}, {"speaker": "Chant", "en": "Move your hands round and round.", "zh": "把手指转来转去。"}, {"speaker": "Chant", "en": "Tell the time on the clock.", "zh": "说出钟面上的时间。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 3", "scene": "Let's talk", "function": "时间与日程", "turns": [{"speaker": "A", "en": "Hi, Binbin. School is over.", "zh": "嗨，彬彬。放学了。"}, {"speaker": "A", "en": "Let's go to the playground.", "zh": "我们去操场吧。"}, {"speaker": "B", "en": "It's 5 o'clock.", "zh": "现在是五点。"}, {"speaker": "B", "en": "Oh! Let's go.", "zh": "哦！走吧。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 3", "scene": "Let's talk", "function": "时间与日程", "turns": [{"speaker": "A", "en": "Time to go home, kids.", "zh": "孩子们，该回家了。"}, {"speaker": "B", "en": "OK.", "zh": "好的。"}, {"speaker": "A", "en": "What time is it?", "zh": "现在几点了？"}, {"speaker": "A", "en": "Where are you?", "zh": "你在哪里？"}, {"speaker": "B", "en": "It's 6 o'clock.", "zh": "现在是六点。"}, {"speaker": "B", "en": "It's time for dinner.", "zh": "该吃晚饭了。"}, {"speaker": "B", "en": "I'm in New York.", "zh": "我在纽约。"}, {"speaker": "A", "en": "What time is it now?", "zh": "现在几点了？"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 3", "scene": "Let's talk", "function": "时间与日程", "turns": [{"speaker": "A", "en": "What time is it?", "zh": "现在几点了？"}, {"speaker": "B", "en": "It's 7:20. It's time for breakfast.", "zh": "现在是7点20分。该吃早饭了。"}, {"speaker": "A", "en": "It's time for lunch.", "zh": "该吃午饭了。"}, {"speaker": "A", "en": "Let's have some chicken.", "zh": "我们吃点鸡肉吧。"}, {"speaker": "A", "en": "It's time for maths class.", "zh": "该上数学课了。"}, {"speaker": "A", "en": "Let's count and write.", "zh": "我们来数数和写字吧。"}, {"speaker": "A", "en": "It's time for art class.", "zh": "该上美术课了。"}, {"speaker": "A", "en": "Let's draw a picture.", "zh": "我们来画画吧。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 3", "scene": "Let's talk", "function": "时间与日程", "turns": [{"speaker": "A", "en": "We're ready!", "zh": "我们准备好了！"}, {"speaker": "A", "en": "It's time to go to school. Bye, Mum.", "zh": "该上学了。再见，妈妈。"}, {"speaker": "B", "en": "What time is it?", "zh": "现在几点了？"}, {"speaker": "A", "en": "It's 7:30.", "zh": "现在是7点30分。"}, {"speaker": "B", "en": "It's 7 o'clock. It's time to get up.", "zh": "现在是7点。该起床了。"}, {"speaker": "A", "en": "Bye. Have a nice day!", "zh": "再见。祝你今天愉快！"}, {"speaker": "B", "en": "Breakfast is ready.", "zh": "早饭准备好了。"}, {"speaker": "A", "en": "It's time to go to school.", "zh": "该上学了。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 3", "scene": "Let's talk", "function": "时间与日程", "turns": [{"speaker": "A", "en": "It's 7:30. It's time to go to school.", "zh": "现在是7点30分。该上学了。"}, {"speaker": "A", "en": "It's 8 o'clock. John is late.", "zh": "现在是8点。约翰迟到了。"}, {"speaker": "A", "en": "It's time to go to school.", "zh": "该上学了。"}, {"speaker": "A", "en": "What's wrong with John's schedule?", "zh": "约翰的时间表有什么问题？"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 4", "scene": "Look and think", "function": "请求与应答", "turns": [{"speaker": "Child", "en": "Look, Mum! Those shorts are nice. Can I buy a pair?", "zh": "看，妈妈！那条短裤很漂亮。我能买一条吗？"}, {"speaker": "Mum", "en": "You already have too many shorts. Let's buy trousers.", "zh": "你已经有太多短裤了。我们买条长裤吧。"}, {"speaker": "Child", "en": "Mum, my trousers are too short. Can I buy a new pair?", "zh": "妈妈，我的长裤太短了。我能买一条新的吗？"}, {"speaker": "Mum", "en": "Sure. Let's go to the clothes shop.", "zh": "当然可以。我们去服装店吧。"}, {"speaker": "Child", "en": "Mum, can I buy a new coat? This one is too small.", "zh": "妈妈，我能买一件新外套吗？这件太小了。"}, {"speaker": "Mum", "en": "Sure. You need a new coat. Let's go shopping.", "zh": "当然可以。你需要一件新外套。我们去购物吧。"}, {"speaker": "Child", "en": "Can I buy a toy car too?", "zh": "我也能买一辆玩具车吗？"}, {"speaker": "Mum", "en": "You already have too many toy cars. Let's just buy the coat.", "zh": "你已经有太多玩具车了。我们只买外套吧。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 4", "scene": "Let's talk (Read and role-play)", "function": "询问信息", "turns": [{"speaker": "A", "en": "What do we need to buy?", "zh": "我们需要买什么？"}, {"speaker": "B", "en": "My skirt is too small. I need a new one.", "zh": "我的裙子太小了。我需要一条新的。"}, {"speaker": "A", "en": "That one is nice.", "zh": "那条很漂亮。"}, {"speaker": "B", "en": "I need a pair of shorts and a ...", "zh": "我需要一条短裤和一件……"}, {"speaker": "A", "en": "I need my school uniform.", "zh": "我需要我的校服。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 4", "scene": "Let's talk (Read and role-play)", "function": "购物与价格", "turns": [{"speaker": "A", "en": "Look! The blue skirt is nice too. It's 79 yuan.", "zh": "看！那条蓝色的裙子也很漂亮。79元。"}, {"speaker": "B", "en": "OK. Let's take it.", "zh": "好的。我们买它吧。"}, {"speaker": "A", "en": "Can I help you?", "zh": "需要帮忙吗？"}, {"speaker": "B", "en": "Yes. I like this pink dress. How much is it?", "zh": "是的。我喜欢这条粉色的连衣裙。多少钱？"}, {"speaker": "A", "en": "It's 180 yuan.", "zh": "180元。"}, {"speaker": "B", "en": "Yes. I like it.", "zh": "是的。我喜欢它。"}, {"speaker": "A", "en": "I'm sorry, dear. That's expensive.", "zh": "对不起，亲爱的。那太贵了。"}, {"speaker": "B", "en": "OK. Let's take it.", "zh": "好的。我们买它吧。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 4", "scene": "Let's talk (Read and role-play)", "function": "购物与价格", "turns": [{"speaker": "A", "en": "Yes! They're beautiful.", "zh": "是的！它们很漂亮。"}, {"speaker": "B", "en": "How much are they?", "zh": "它们多少钱？"}, {"speaker": "A", "en": "They're 99 yuan.", "zh": "99元。"}, {"speaker": "B", "en": "They're 20 yuan.", "zh": "20元。"}, {"speaker": "A", "en": "Can I help you?", "zh": "需要帮忙吗？"}, {"speaker": "B", "en": "Yes. I like the blue shorts. How much are they?", "zh": "是的。我喜欢那条蓝色的短裤。它们多少钱？"}, {"speaker": "A", "en": "Do you like the sunglasses?", "zh": "你喜欢这副太阳镜吗？"}, {"speaker": "B", "en": "That's cheap!", "zh": "那很便宜！"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 4", "scene": "Look and role-play", "function": "购物与价格", "turns": [{"speaker": "A", "en": "How much are these shorts and sunglasses?", "zh": "这些短裤和太阳镜多少钱？"}, {"speaker": "B", "en": "Sunglasses: Sixty yuan now!", "zh": "太阳镜：现在60元！"}, {"speaker": "A", "en": "Shorts: Fifteen yuan each!", "zh": "短裤：每条15元！"}, {"speaker": "B", "en": "Many colours! Buy two, get one free!", "zh": "颜色很多！买二送一！"}, {"speaker": "A", "en": "Hats: Large (L) size only, ten yuan!", "zh": "帽子：只有大号（L），10元！"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 4", "scene": "Project: Choose clothes for a singing contest", "function": "购物与价格", "turns": [{"speaker": "A", "en": "I like the shirt with the black tie. Can we buy Set 2?", "zh": "我喜欢那件带黑色领带的衬衫。我们能买第二套吗？"}, {"speaker": "B", "en": "How much is it?", "zh": "多少钱？"}, {"speaker": "A", "en": "It's 60 yuan.", "zh": "60元。"}, {"speaker": "B", "en": "We only have 50 yuan each.", "zh": "我们每人只有50元。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 5", "scene": "On the farm", "function": "询问信息", "turns": [{"speaker": "A", "en": "How many cows do you have?", "zh": "你有多少头牛？"}, {"speaker": "B", "en": "I have 20.", "zh": "我有20头。"}, {"speaker": "A", "en": "What animals do you have on the farm?", "zh": "你在农场里有什么动物？"}, {"speaker": "B", "en": "I have a lot of animals. Cows, horses, sheep, pigs and chickens.", "zh": "我有很多动物。牛、马、羊、猪和鸡。"}, {"speaker": "A", "en": "Cows are great. They give us milk.", "zh": "牛很棒。它们给我们牛奶。"}, {"speaker": "B", "en": "Yes. Farm animals give us many things.", "zh": "是的。农场动物给我们很多东西。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 5", "scene": "Ask and answer", "function": "询问信息", "turns": [{"speaker": "A", "en": "What farm animals do you know?", "zh": "你知道哪些农场动物？"}, {"speaker": "B", "en": "I have a lot of animals.", "zh": "我有很多动物。"}, {"speaker": "A", "en": "Yes. There are sheep, cows ...", "zh": "是的。有羊、牛……"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 5", "scene": "Play a guessing game", "function": "描述事物", "turns": [{"speaker": "A", "en": "What are these?", "zh": "这些是什么？"}, {"speaker": "B", "en": "They're tomatoes.", "zh": "它们是西红柿。"}, {"speaker": "A", "en": "But they're yellow!", "zh": "可是它们是黄色的！"}, {"speaker": "B", "en": "They're bee boxes.", "zh": "它们是蜂箱。"}, {"speaker": "A", "en": "Bees are good for plants.", "zh": "蜜蜂对植物有好处。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 5", "scene": "Listen and chant", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "It's a busy day on the farm. Mr Wang is putting the tomatoes in boxes.", "zh": "农场里是忙碌的一天。王先生正在把西红柿装进箱子里。"}, {"speaker": "Chant", "en": "What are these? They are cans for milk.", "zh": "这些是什么？它们是装牛奶的罐子。"}, {"speaker": "Chant", "en": "These are carrots. Those are green beans and potatoes.", "zh": "这些是胡萝卜。那些是青豆和土豆。"}, {"speaker": "Chant", "en": "How fresh!", "zh": "多新鲜啊！"}, {"speaker": "Chant", "en": "There are boxes of eggs too.", "zh": "还有几箱鸡蛋。"}, {"speaker": "Chant", "en": "It is a big year for Mr Wang.", "zh": "对王先生来说，这是丰收的一年。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 5", "scene": "Read and write", "function": "描述事物", "turns": [{"speaker": "A", "en": "This is Mr Wang's farm. Let's have a look!", "zh": "这是王先生的农场。我们来看看！"}, {"speaker": "B", "en": "These are sheep.", "zh": "这些是羊。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 6", "scene": "Listen and chant", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "How do we get food?", "zh": "我们如何获得食物？"}, {"speaker": "Chant", "en": "What do farmers do?", "zh": "农民做什么？"}, {"speaker": "Chant", "en": "They work hard for us all.", "zh": "他们为我们所有人辛勤工作。"}, {"speaker": "Chant", "en": "When do they work?", "zh": "他们什么时候工作？"}, {"speaker": "Chant", "en": "From winter to fall.", "zh": "从冬天到秋天。"}, {"speaker": "Chant", "en": "What do they plant?", "zh": "他们种什么？"}, {"speaker": "Chant", "en": "Fruit, vegetables and more!", "zh": "水果、蔬菜还有更多！"}, {"speaker": "Chant", "en": "What do they feed?", "zh": "他们喂什么？"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 6", "scene": "Look and think", "function": "请求与应答", "turns": [{"speaker": "A", "en": "OK. Can you please pass me the vegetables?", "zh": "好的。你能把蔬菜递给我吗？"}, {"speaker": "B", "en": "Sure. Here you are.", "zh": "当然。给你。"}, {"speaker": "A", "en": "Thanks.", "zh": "谢谢。"}, {"speaker": "A", "en": "Good idea! Let's feed the pigs.", "zh": "好主意！我们去喂猪吧。"}, {"speaker": "B", "en": "Here are some vegetables.", "zh": "这里有一些蔬菜。"}, {"speaker": "A", "en": "Look! Binbin and John are watering the vegetables.", "zh": "看！彬彬和约翰正在给蔬菜浇水。"}, {"speaker": "B", "en": "Oh yes! We can help too.", "zh": "哦，是的！我们也可以帮忙。"}, {"speaker": "A", "en": "Let's feed the chickens.", "zh": "我们去喂鸡吧。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 6", "scene": "Let's talk", "function": "询问信息", "turns": [{"speaker": "A", "en": "What can we do on a farm?", "zh": "我们在农场能做什么？"}, {"speaker": "B", "en": "Farmers do a lot of work on the farm.", "zh": "农民在农场做很多工作。"}, {"speaker": "B", "en": "Farmers plant potatoes.", "zh": "农民种土豆。"}, {"speaker": "B", "en": "They water carrots.", "zh": "他们给胡萝卜浇水。"}, {"speaker": "B", "en": "They pick tomatoes.", "zh": "他们摘西红柿。"}, {"speaker": "B", "en": "They feed chickens.", "zh": "他们喂鸡。"}, {"speaker": "B", "en": "They milk cows.", "zh": "他们给奶牛挤奶。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 6", "scene": "Let's spell", "function": "请求与应答", "turns": [{"speaker": "A", "en": "The food is delicious!", "zh": "食物真美味！"}, {"speaker": "B", "en": "Thank you!", "zh": "谢谢！"}, {"speaker": "A", "en": "No, thank you, Mr Wang.", "zh": "不，谢谢，王先生。"}, {"speaker": "A", "en": "I can use chopsticks.", "zh": "我会用筷子。"}, {"speaker": "B", "en": "Mike, Amy, would you like a knife and fork?", "zh": "迈克，艾米，你们想要刀叉吗？"}, {"speaker": "A", "en": "Can you please pass me the fork?", "zh": "你能把叉子递给我吗？"}, {"speaker": "B", "en": "Don't waste food, please.", "zh": "请不要浪费食物。"}, {"speaker": "A", "en": "Yes, please.", "zh": "好的，请。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 6", "scene": "Let's talk", "function": "其他", "turns": [{"speaker": "A", "en": "How should we eat?", "zh": "我们应该怎么吃？"}, {"speaker": "B", "en": "Don't waste food.", "zh": "不要浪费食物。"}, {"speaker": "B", "en": "Don't play with your knife/fork.", "zh": "不要玩你的刀/叉。"}, {"speaker": "B", "en": "Don't point chopsticks at others.", "zh": "不要用筷子指着别人。"}, {"speaker": "B", "en": "Set the table before dinner.", "zh": "晚饭前摆好桌子。"}, {"speaker": "B", "en": "Clear the table after dinner.", "zh": "晚饭后收拾桌子。"}, {"speaker": "A", "en": "Let's set the table.", "zh": "我们来摆桌子吧。"}, {"speaker": "B", "en": "Sure.", "zh": "当然。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 6", "scene": "Reading time", "function": "请求与应答", "turns": [{"speaker": "A", "en": "Can you please pass me some potatoes?", "zh": "你能递给我一些土豆吗？"}, {"speaker": "B", "en": "Let's pick some tomatoes.", "zh": "我们去摘一些西红柿吧。"}, {"speaker": "A", "en": "I can do a lot of work on the farm!", "zh": "我能在农场做很多工作！"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Revision", "scene": "Sarah's family plan a farm trip and picnic", "function": "邀请与建议", "turns": [{"speaker": "Mum", "en": "Let's take a farm trip this weekend.", "zh": "这个周末我们去农场旅行吧。"}, {"speaker": "Sarah", "en": "Yeah! What's the weather like this weekend?", "zh": "好啊！这个周末天气怎么样？"}, {"speaker": "Dad", "en": "It's cloudy but warm.", "zh": "多云但暖和。"}, {"speaker": "Sarah", "en": "Can I wear a skirt and a T-shirt?", "zh": "我可以穿裙子和T恤吗？"}, {"speaker": "Mum", "en": "A skirt is not a good idea. Trousers or shorts are good.", "zh": "穿裙子不是个好主意。长裤或短裤比较好。"}, {"speaker": "Sam", "en": "Well, I'd like to wear my shorts.", "zh": "嗯，我想穿我的短裤。"}, {"speaker": "Dad", "en": "It's sunny today. Let's go to the park on the hill.", "zh": "今天天气晴朗。我们去山上的公园吧。"}, {"speaker": "Mike", "en": "Great! We can have a picnic.", "zh": "太棒了！我们可以野餐。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Revision", "scene": "Sarah's family on the farm", "function": "请求与应答", "turns": [{"speaker": "Dad", "en": "It's time to milk the cows.", "zh": "该挤牛奶了。"}, {"speaker": "Sarah", "en": "Oh no! It's raining.", "zh": "哦不！下雨了。"}, {"speaker": "Mum", "en": "It's OK. We'll milk the cows later. You can pick tomatoes in the greenhouse.", "zh": "没关系。我们稍后挤牛奶。你可以在温室里摘西红柿。"}, {"speaker": "Sam", "en": "Great! Let's make a salad.", "zh": "太好了！我们做沙拉吧。"}, {"speaker": "Sam", "en": "Yummy!", "zh": "好吃！"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Revision", "scene": "Mike's family in the car museum", "function": "询问信息", "turns": [{"speaker": "Mike", "en": "Wow! There are so many old cars here!", "zh": "哇！这里有很多老式汽车！"}, {"speaker": "Matt", "en": "Can we go to the second floor? I like racing cars.", "zh": "我们能去二楼吗？我喜欢赛车。"}, {"speaker": "Dad", "en": "OK. Matt and I can go together. Mike, you can go with your mum.", "zh": "好的。我和Matt一起去。Mike，你可以和你妈妈一起去。"}, {"speaker": "Dad", "en": "What time is it now? It's 2:15. Let's meet here at 5:30.", "zh": "现在几点了？2点15分。我们5点30分在这里碰头。"}, {"speaker": "Mum", "en": "Then we can have dinner. Don't be late!", "zh": "然后我们可以吃晚饭。别迟到！"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Revision", "scene": "Shopping for apples", "function": "购物与价格", "turns": [{"speaker": "A", "en": "Would you like some apples?", "zh": "你想要些苹果吗？"}, {"speaker": "B", "en": "What are those, Dad?", "zh": "爸爸，那些是什么？"}, {"speaker": "B", "en": "Can I help you?", "zh": "我能帮你吗？"}, {"speaker": "A", "en": "Yes, I'd like some apples.", "zh": "是的，我想要些苹果。"}, {"speaker": "B", "en": "How much are they?", "zh": "它们多少钱？"}, {"speaker": "A", "en": "They're ... yuan.", "zh": "它们……元。"}, {"speaker": "B", "en": "That's cheap. They look very nice.", "zh": "真便宜。它们看起来很漂亮。"}, {"speaker": "B", "en": "I'll take some.", "zh": "我要一些。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Revision", "scene": "Uncle Mark's farm song", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "Uncle Mark has a farm, E-I-E-I-O.", "zh": "马克叔叔有一个农场，E-I-E-I-O。"}, {"speaker": "Chant", "en": "On his farm he has a barn, E-I-E-I-O.", "zh": "在他的农场里他有一个谷仓，E-I-E-I-O。"}, {"speaker": "Chant", "en": "There are cucumbers here, and corn there.", "zh": "这里有黄瓜，那里有玉米。"}, {"speaker": "Chant", "en": "Here is a fork. There is a shirt.", "zh": "这里有一把叉子。那里有一件衬衫。"}, {"speaker": "Chant", "en": "There are also big tall firs.", "zh": "还有高大挺拔的云杉。"}, {"speaker": "Chant", "en": "Uncle Mark has a farm, E-I-E-I-O.", "zh": "马克叔叔有一个农场，E-I-E-I-O。"}, {"speaker": "Chant", "en": "Auntie Amber goes to a park, E-I-E-I-O.", "zh": "安珀阿姨去公园，E-I-E-I-O。"}, {"speaker": "Chant", "en": "In the park there's a pear tree, E-I-E-I-O.", "zh": "公园里有一棵梨树，E-I-E-I-O。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Appendix 1", "scene": "Unit 1 Class rules", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "Rules, rules, rules.", "zh": "规则，规则，规则。"}, {"speaker": "Chant", "en": "Rules, rules, rules.", "zh": "规则，规则，规则。"}, {"speaker": "Chant", "en": "What class rules does your school have?", "zh": "你们学校有什么课堂规则？"}, {"speaker": "Chant", "en": "Listen with care. Put up your hand!", "zh": "认真听。请举手！"}, {"speaker": "Chant", "en": "Rules, rules, rules.", "zh": "规则，规则，规则。"}, {"speaker": "Chant", "en": "They're good, good, good.", "zh": "它们很好，很好，很好。"}, {"speaker": "Chant", "en": "Rules, rules, rules.", "zh": "规则，规则，规则。"}, {"speaker": "Chant", "en": "Rules, rules, rules.", "zh": "规则，规则，规则。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Appendix 1", "scene": "Unit 2 Rules at home", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "There are lots of rules at home.", "zh": "家里有很多规则。"}, {"speaker": "Chant", "en": "There are lots of things to do.", "zh": "有很多事情要做。"}, {"speaker": "Chant", "en": "Tidy your room.", "zh": "整理你的房间。"}, {"speaker": "Chant", "en": "Clean the dishes.", "zh": "洗碗。"}, {"speaker": "Chant", "en": "Listen to your parents too.", "zh": "也要听父母的话。"}, {"speaker": "Chant", "en": "There are lots of rules at home,", "zh": "家里有很多规则，"}, {"speaker": "Chant", "en": "And things you cannot do.", "zh": "还有你不能做的事。"}, {"speaker": "Chant", "en": "Don't say bad words.", "zh": "不要说脏话。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Appendix 1", "scene": "Unit 3 What time is it now?", "function": "时间与日程", "turns": [{"speaker": "Chant", "en": "What time is it now?", "zh": "现在几点了？"}, {"speaker": "Chant", "en": "It's time for breakfast.", "zh": "该吃早饭了。"}, {"speaker": "Chant", "en": "Tra-la-la-la-la, la-la-la-la.", "zh": "啦啦啦啦啦，啦啦啦啦。"}, {"speaker": "Chant", "en": "What time is it now?", "zh": "现在几点了？"}, {"speaker": "Chant", "en": "It's time for Chinese.", "zh": "该上语文课了。"}, {"speaker": "Chant", "en": "Tra-la-la-la-la, la-la-la-la.", "zh": "啦啦啦啦啦，啦啦啦啦。"}, {"speaker": "Chant", "en": "Time to speak,", "zh": "该说话了，"}, {"speaker": "Chant", "en": "And time to listen.", "zh": "也该听了。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Appendix 1", "scene": "Unit 4 How much is it?", "function": "购物与价格", "turns": [{"speaker": "Chant", "en": "How much are the red shoes in the window?", "zh": "橱窗里的红鞋多少钱？"}, {"speaker": "Chant", "en": "They're nice. Can I buy a new pair?", "zh": "它们很漂亮。我可以买一双新的吗？"}, {"speaker": "Chant", "en": "How much are the red shoes in the window?", "zh": "橱窗里的红鞋多少钱？"}, {"speaker": "Chant", "en": "I hope that the price is quite fair.", "zh": "我希望价格很公道。"}, {"speaker": "Chant", "en": "How much is the blue hat in the window?", "zh": "橱窗里的蓝帽子多少钱？"}, {"speaker": "Chant", "en": "Oh, please, please tell me the price!", "zh": "哦，请，请告诉我价格！"}, {"speaker": "Chant", "en": "How much is the blue hat in the window?", "zh": "橱窗里的蓝帽子多少钱？"}, {"speaker": "Chant", "en": "Can I try it on? It looks really nice.", "zh": "我可以试戴吗？它看起来真的很漂亮。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Appendix 1", "scene": "Unit 5 On the farm", "function": "询问信息", "turns": [{"speaker": "Chant", "en": "How many cows do you have on the farm?", "zh": "你们农场有多少头牛？"}, {"speaker": "Chant", "en": "How many cows do you have?", "zh": "你们有多少头牛？"}, {"speaker": "Chant", "en": "Ten in the field,", "zh": "田野里有十头，"}, {"speaker": "Chant", "en": "And eight in the shed.", "zh": "棚里有八头。"}, {"speaker": "Chant", "en": "That makes eighteen cows on the farm.", "zh": "农场里一共有十八头牛。"}, {"speaker": "Chant", "en": "How many trees do you have on the farm?", "zh": "你们农场有多少棵树？"}, {"speaker": "Chant", "en": "How many trees do you have?", "zh": "你们有多少棵树？"}, {"speaker": "Chant", "en": "Five apple trees,", "zh": "五棵苹果树，"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Appendix 1", "scene": "Unit 6 Farmers", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "This is a farmer. He works hard.", "zh": "这是一位农民。他工作很努力。"}, {"speaker": "Chant", "en": "He milks cows, and he plants his fruit.", "zh": "他挤牛奶，也种他的水果。"}, {"speaker": "Chant", "en": "He waters plants and picks them too.", "zh": "他给植物浇水，也采摘它们。"}, {"speaker": "Chant", "en": "All to make some good food for you.", "zh": "都是为了给你做美味的食物。"}, {"speaker": "Chant", "en": "This is a farmer. She works hard.", "zh": "这是一位农民。她工作很努力。"}, {"speaker": "Chant", "en": "She feeds the pigs, and she plants her fruit.", "zh": "她喂猪，也种她的水果。"}, {"speaker": "Chant", "en": "She waters plants and picks them too.", "zh": "她给植物浇水，也采摘它们。"}, {"speaker": "Chant", "en": "All to make some good food for you.", "zh": "都是为了给你做美味的食物。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Appendix 4", "scene": "Unit 1 课堂与值日", "function": "请求与应答", "turns": [{"speaker": "A", "en": "Hurry up! Don't be late for class!", "zh": "快点！上课别迟到！"}, {"speaker": "B", "en": "I'm ready. Let's go!", "zh": "我准备好了。我们走吧！"}, {"speaker": "A", "en": "Who's on duty today?", "zh": "今天谁值日？"}, {"speaker": "B", "en": "I can put back the desks and chairs.", "zh": "我可以把桌椅放回原位。"}, {"speaker": "A", "en": "Excuse me?", "zh": "对不起，请再说一次可以吗？"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Appendix 4", "scene": "Unit 2 家庭与提醒", "function": "请求与应答", "turns": [{"speaker": "Child", "en": "Mum, can I watch TV?", "zh": "妈妈，我能看电视吗？"}, {"speaker": "Mum", "en": "No. You have to do your homework first.", "zh": "不行。你得先做作业。"}, {"speaker": "Mum", "en": "Shh. Don't be so loud!", "zh": "嘘。别这么大声！"}, {"speaker": "Mum", "en": "Be careful, Jack. Don't touch hot things.", "zh": "杰克，要小心。别碰烫的东西。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Appendix 4", "scene": "Unit 3 时间与日常", "function": "时间与日程", "turns": [{"speaker": "A", "en": "What time is it?", "zh": "几点了？"}, {"speaker": "B", "en": "It's 5 o'clock.", "zh": "现在五点了。"}, {"speaker": "A", "en": "Time to go home, kids.", "zh": "孩子们，该回家了。"}, {"speaker": "A", "en": "It's time for dinner.", "zh": "该吃晚饭了。"}, {"speaker": "A", "en": "It's time to get up.", "zh": "该起床了。"}, {"speaker": "A", "en": "Have a nice day!", "zh": "祝你一天愉快！"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Appendix 4", "scene": "Unit 4 购物", "function": "购物与价格", "turns": [{"speaker": "Child", "en": "Can I buy a new pair?", "zh": "我能买条新的（裤子）吗？"}, {"speaker": "Mum", "en": "Sure. Let's go to the clothes shop.", "zh": "当然。我们去服装店吧。"}, {"speaker": "Mum", "en": "You already have too many shorts. Let's buy trousers.", "zh": "你已经有很多短裤了。我们买长裤吧。"}, {"speaker": "Shop assistant", "en": "Can I help you?", "zh": "要帮忙吗？"}, {"speaker": "Child", "en": "Yes. I like this pink dress.", "zh": "嗯。我喜欢这件粉色的长裙。"}, {"speaker": "Mum", "en": "Let's take it.", "zh": "我们买下它吧。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Appendix 4", "scene": "Unit 5 农场与蔬果", "function": "描述事物", "turns": [{"speaker": "A", "en": "What animals do you have on the farm?", "zh": "您的农场上都养了哪些动物？"}, {"speaker": "B", "en": "I have a lot of animals.", "zh": "我养了很多动物。"}, {"speaker": "A", "en": "What are these?", "zh": "这些是什么？"}, {"speaker": "B", "en": "They're tomatoes.", "zh": "这些是西红柿。"}, {"speaker": "A", "en": "How fresh!", "zh": "真新鲜啊！"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Appendix 4", "scene": "Unit 6 用餐与礼貌", "function": "请求与应答", "turns": [{"speaker": "A", "en": "Let's feed the chickens.", "zh": "我们喂鸡吧。"}, {"speaker": "B", "en": "Can you please pass me the vegetables?", "zh": "能否请你把蔬菜递给我？"}, {"speaker": "Mr Wang", "en": "Mike, Amy, would you like a knife and fork?", "zh": "迈克、埃米，你们需要餐刀和餐叉吗？"}, {"speaker": "Mike", "en": "No, thank you, Mr Wang. I can use chopsticks.", "zh": "不用，谢谢您，王先生。我会用筷子。"}, {"speaker": "Mr Wang", "en": "Don't waste food, please.", "zh": "请不要浪费食物。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Appendix 5", "scene": "语调练习：购物与日常对话", "function": "请求与应答", "turns": [{"speaker": "A", "en": "Whose sweater is this?", "zh": "这是谁的毛衣？"}, {"speaker": "B", "en": "It's your dad's.", "zh": "这是你爸爸的。"}, {"speaker": "A", "en": "Can I buy a new pair?", "zh": "我可以买一条新的吗？"}, {"speaker": "B", "en": "Sure.", "zh": "当然可以。"}, {"speaker": "A", "en": "Don't run in the living room.", "zh": "别在客厅里跑。"}, {"speaker": "B", "en": "Miss you!", "zh": "想你了！"}, {"speaker": "A", "en": "Who's your best friend?", "zh": "你最好的朋友是谁？"}, {"speaker": "B", "en": "Is this your sister?", "zh": "这是你的姐姐吗？"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 1", "scene": "Listen and sing - My friends", "function": "问候与介绍", "turns": [{"speaker": "Miss White", "en": "Hi, class. You'll have a new classmate.", "zh": "同学们好。你们将有一位新同学。"}, {"speaker": "Miss White", "en": "He's from Australia. His name is Oliver.", "zh": "他来自澳大利亚。他叫奥利弗。"}, {"speaker": "Mike", "en": "What's he like?", "zh": "他是什么样的人？"}, {"speaker": "Miss White", "en": "He's tall and strong.", "zh": "他又高又壮。"}, {"speaker": "Zhang Peng", "en": "Is he good at football?", "zh": "他擅长足球吗？"}, {"speaker": "Miss White", "en": "Yes, I think he is. He can run very fast.", "zh": "是的，我想他是。他跑得很快。"}, {"speaker": "Zhang Peng", "en": "Great! Our football team needs more players.", "zh": "太棒了！我们的足球队需要更多队员。"}, {"speaker": "Miss White", "en": "Oliver can't speak Chinese. Would you like to help him, Zhang Peng?", "zh": "奥利弗不会说中文。你愿意帮助他吗，张鹏？"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 1", "scene": "Let's talk - How are your friends different?", "function": "描述事物", "turns": [{"speaker": "Oliver", "en": "What's Chen Jie like?", "zh": "陈洁是什么样的人？"}, {"speaker": "Amy", "en": "She's lovely.", "zh": "她很可爱。"}, {"speaker": "Oliver", "en": "Is she hard-working?", "zh": "她勤奋吗？"}, {"speaker": "Amy", "en": "Yes, she is.", "zh": "是的，她是。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 1", "scene": "Let's talk - What can you do for the festival?", "function": "能力与他人", "turns": [{"speaker": "Binbin", "en": "The Science and Art Festival is in two weeks.", "zh": "科技艺术节在两周后。"}, {"speaker": "Sarah", "en": "Yes. What can you do for the festival?", "zh": "是的。你能为艺术节做什么？"}, {"speaker": "Binbin", "en": "I can make a robot.", "zh": "我可以制作机器人。"}, {"speaker": "Oliver", "en": "Oh! I like making robots too.", "zh": "哦！我也喜欢制作机器人。"}, {"speaker": "Oliver", "en": "We can work together.", "zh": "我们可以一起合作。"}, {"speaker": "Binbin", "en": "Great! Can you make robots, Sarah?", "zh": "太棒了！你会制作机器人吗，莎拉？"}, {"speaker": "Sarah", "en": "No, I can't.", "zh": "不，我不会。"}, {"speaker": "Oliver", "en": "What can you do?", "zh": "你会做什么？"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 1", "scene": "Let's learn - Robin the Robot", "function": "能力与他人", "turns": [{"speaker": "Sarah", "en": "What can Robin do…?", "zh": "罗宾能做什么？"}, {"speaker": "Binbin", "en": "He can jump rope.", "zh": "他会跳绳。"}, {"speaker": "Sarah", "en": "Can he play the piano?", "zh": "他会弹钢琴吗？"}, {"speaker": "Binbin", "en": "Yes, he can.", "zh": "是的，他会。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 1", "scene": "Reading time - Grace", "function": "问候与介绍", "turns": [{"speaker": "A", "en": "We have a new student in our class today. Her name's Grace.", "zh": "今天我们班有一位新同学。她叫格蕾丝。"}, {"speaker": "A", "en": "Grace is so lovely and friendly.", "zh": "格蕾丝非常可爱又友好。"}, {"speaker": "B", "en": "Is she strong? Can she play football?", "zh": "她强壮吗？她会踢足球吗？"}, {"speaker": "A", "en": "Yes. I like her.", "zh": "是的。我喜欢她。"}, {"speaker": "B", "en": "I don't know.", "zh": "我不知道。"}, {"speaker": "B", "en": "But she can't play football with us. What a pity!", "zh": "但她不能和我们一起踢足球。真遗憾！"}, {"speaker": "A", "en": "Class, this is Grace.", "zh": "同学们，这是格蕾丝。"}, {"speaker": "Grace", "en": "Hi, everyone. Nice to meet you all!", "zh": "大家好。很高兴见到你们！"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 2", "scene": "Chen Jie 与 Mike 讨论学校项目分歧", "function": "感受与情绪", "turns": [{"speaker": "Chen Jie", "en": "Hi, Mike. You look sad. What's the matter?", "zh": "嗨，Mike。你看起来很伤心。怎么了？"}, {"speaker": "Mike", "en": "It's about our school project. John wants to go to the children's centre, but I want to clean up the park.", "zh": "是关于我们的学校项目。John 想去儿童中心，但我想去清理公园。"}, {"speaker": "Chen Jie", "en": "I see. So you don't agree with each other?", "zh": "我明白了。所以你们意见不一致？"}, {"speaker": "Mike", "en": "That's right. And we have to finish our project by Monday. I'm so worried!", "zh": "没错。而且我们必须在周一前完成项目。我很担心！"}, {"speaker": "Chen Jie", "en": "Why not do both? I can help. We can work together.", "zh": "为什么不两个都做呢？我可以帮忙。我们可以一起合作。"}, {"speaker": "Mike", "en": "That's a good idea!", "zh": "这是个好主意！"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 2", "scene": "John 与 Chen Jie 谈论 Fido 的感受", "function": "感受与情绪", "turns": [{"speaker": "John", "en": "Mike is back home. How does Fido feel?", "zh": "Mike 回家了。Fido 感觉怎么样？"}, {"speaker": "Chen Jie", "en": "He's excited.", "zh": "他很兴奋。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 2", "scene": "Oliver 与 Amy 讨论项目困难", "function": "感受与情绪", "turns": [{"speaker": "Oliver", "en": "Our project is so hard.", "zh": "我们的项目太难了。"}, {"speaker": "Amy", "en": "We can ask Miss White for help.", "zh": "我们可以向 White 老师求助。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 2", "scene": "Miss White 与 John 讨论项目分歧", "function": "感受与情绪", "turns": [{"speaker": "Miss White", "en": "What's the matter, John? You look worried.", "zh": "怎么了，John？你看起来很担心。"}, {"speaker": "John", "en": "It's about our project. Mike and I want to do different things.", "zh": "是关于我们的项目。Mike 和我想做不同的事情。"}, {"speaker": "Miss White", "en": "I see. It's important to listen to each other.", "zh": "我明白了。互相倾听很重要。"}, {"speaker": "John", "en": "Yes, Miss White. I need to talk to Mike. But I'm afraid he's angry with me.", "zh": "是的，White 老师。我需要和 Mike 谈谈。但我怕他生我的气。"}, {"speaker": "Miss White", "en": "Look, here he comes. You can talk to him now.", "zh": "看，他来了。你现在可以和他谈谈。"}, {"speaker": "Mike", "en": "John, I'm sorry. Let's do both projects! Chen Jie can work with us.", "zh": "John，对不起。我们两个项目都做吧！Chen Jie 可以和我们合作。"}, {"speaker": "John", "en": "That's great!", "zh": "太好了！"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 2", "scene": "Benjy 与朋友们在雪地里", "function": "感受与情绪", "turns": [{"speaker": "A", "en": "It's snowing. I'm so excited!", "zh": "下雪了。我太兴奋了！"}, {"speaker": "A", "en": "Benjy looks worried. This is his first snow!", "zh": "Benjy 看起来很担心。这是他第一次看到雪！"}, {"speaker": "A", "en": "Come on, Benjy! Don't be afraid. It's important to try new things!", "zh": "加油，Benjy！别害怕。尝试新事物很重要！"}, {"speaker": "A", "en": "Benjy doesn't look happy. He's cold.", "zh": "Benjy 看起来不开心。他很冷。"}, {"speaker": "A", "en": "He needs to exercise. Let's play with him.", "zh": "他需要运动。我们和他一起玩吧。"}, {"speaker": "A", "en": "Good idea!", "zh": "好主意！"}, {"speaker": "A", "en": "He's happy now. I think he likes the snow.", "zh": "他现在开心了。我觉得他喜欢雪。"}, {"speaker": "A", "en": "Yes, he's not afraid now.", "zh": "是的，他现在不害怕了。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 3", "scene": "John 和爷爷谈论最喜欢的上学日", "function": "询问信息", "turns": [{"speaker": "Grandpa", "en": "What's your favourite day at school, John?", "zh": "约翰，你最喜欢上学的一天是哪天？"}, {"speaker": "John", "en": "Wednesday.", "zh": "星期三。"}, {"speaker": "Grandpa", "en": "What do you have on Wednesdays?", "zh": "你星期三有什么课？"}, {"speaker": "John", "en": "I have Chinese, maths, music and PE.", "zh": "我有语文、数学、音乐和体育课。"}, {"speaker": "Grandpa", "en": "Maths is not easy.", "zh": "数学不容易。"}, {"speaker": "John", "en": "No, but I really like my maths teacher!", "zh": "是的，但我真的很喜欢我的数学老师！"}, {"speaker": "Grandpa", "en": "That's good. Is music your favourite subject?", "zh": "那很好。音乐是你最喜欢的科目吗？"}, {"speaker": "John", "en": "Yes. I really like singing. And I like PE too.", "zh": "是的。我真的很喜欢唱歌。我也喜欢体育课。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 3", "scene": "Robin 和 Binbin 谈论最喜欢的上学日", "function": "询问信息", "turns": [{"speaker": "Robin", "en": "What's your favourite day at school?", "zh": "你最喜欢上学的一天是哪天？"}, {"speaker": "Binbin", "en": "It's Tuesday.", "zh": "是星期二。"}, {"speaker": "Robin", "en": "What do you have on Tuesdays?", "zh": "你星期二有什么课？"}, {"speaker": "Binbin", "en": "I have maths, Chinese, art and English.", "zh": "我有数学、语文、美术和英语课。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 3", "scene": "Miss White 和学生们谈论周末活动", "function": "询问信息", "turns": [{"speaker": "Miss White", "en": "What do you usually do at the weekend, children?", "zh": "孩子们，你们周末通常做什么？"}, {"speaker": "Zhang Peng", "en": "I often play football. Sometimes I play Chinese chess with my father.", "zh": "我经常踢足球。有时我和爸爸下中国象棋。"}, {"speaker": "Miss White", "en": "That's nice.", "zh": "那很好。"}, {"speaker": "Sarah", "en": "My mother works at the weekend, so I often cook lunch for my family.", "zh": "我妈妈周末上班，所以我经常为家人做午饭。"}, {"speaker": "Miss White", "en": "Good girl! Does your mother work on both Saturdays and Sundays?", "zh": "好女孩！你妈妈星期六和星期日都上班吗？"}, {"speaker": "Sarah", "en": "Yes, she does.", "zh": "是的，她上班。"}, {"speaker": "Chen Jie", "en": "I do my homework on Saturdays. And I usually have pipa lessons on Sundays.", "zh": "我星期六做作业。我通常星期日有琵琶课。"}, {"speaker": "Miss White", "en": "Great! Have a nice weekend, everyone!", "zh": "太好了！大家周末愉快！"}]}, {"grade": "五年级", "term": "上册",
