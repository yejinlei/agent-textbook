gory": "情态动词"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 4", "point": "询问与表达喜好", "pattern": "Do you like ...? Yes, I do. / No, I don't. I like ...", "rule": "用 Do you like 开头问别人喜不喜欢某物，回答用 Yes, I do. 或 No, I don't.，并说出自己喜欢的东西。", "category": "疑问句"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 4", "point": "情态动词 can 表能力", "pattern": "We can ... / Can we ...?", "rule": "用 can 表示“能够、可以”做某事，后面直接加动词原形。", "category": "情态动词"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 4", "point": "一般现在时（描述植物需要）", "pattern": "Plants need ... / ... need air, water and sun.", "rule": "用 need 表示“需要”，主语是复数或第三人称单数时，need 不变或加 s。", "category": "时态"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 4", "point": "一般现在时（描述植物能给予）", "pattern": "Plants can give us ... / I give ... to ...", "rule": "用 give 表示“给予”，后面接给的东西和接受的人。", "category": "时态"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 4", "point": "形容词描述特征", "pattern": "... are ... / The ... are so ...", "rule": "用 are 连接主语和形容词，描述事物的特征，so 表示“非常”。", "category": "形容词副词"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 4", "point": "指示代词 this 与 be 动词", "pattern": "This is ... / I am ...", "rule": "用 This is 介绍某物，用 I am 介绍自己。", "category": "代词"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 5", "point": "询问颜色", "pattern": "What colour is it? / What colour is ...?", "rule": "用来问某样东西是什么颜色，回答时用 It's ... 或 ... is ...。", "category": "疑问句"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 5", "point": "描述颜色", "pattern": "... is/are ... colour.", "rule": "用 is 或 are 来说某样东西是什么颜色。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 5", "point": "询问喜欢的颜色", "pattern": "What colours do you like? / I like ...", "rule": "用来问别人喜欢什么颜色，回答时用 I like ...。", "category": "疑问句"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 5", "point": "表达看见的颜色", "pattern": "I see ...", "rule": "用 I see ... 来说  I don't.。", "category": "时态"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 5", "point": "询问物品名称", "pattern": "What's this? / What's that? / It's a ...", "rule": "用 What's this 问近处的东西，用 What's that 问远处的东西，回答用 It's a 加名词。", "category": "疑问句"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 5", "point": "询问颜色", "pattern": "What colour is it? / It's ... / What colours do you like? / I like ...", "rule": "用 What colour is it 问颜色，回答用 It's 加颜色词；用 What colours do you like 问喜欢的颜色，回答用 I like 加颜色词。", "category": "疑问句"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 5", "point": "询问年龄与数量", "pattern": "How old are you? / I'm ... years old. / How many ...? / ...", "rule": "用 How old are you 问年龄，回答用 I'm 加数字加 years old；用 How many 问数量，回答直接说数字。", "category": "疑问句"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 1", "point": "自我介绍与问候句型", "pattern": "Hello! / Hi! / What's your name? / I'm ... / My name is ... / Nice to meet you. / Nice to meet you too.", "rule": "见面时先打招呼，再问或说自己的名字，最后互相说很高兴认识你。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 1", "point": "一般现在时（第一人称陈述）", "pattern": "I + 动词原形 ...", "rule": "用 I 开头说“我”做什么，动词用原形。", "category": "时态"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 1", "point": "一般现在时（第三人称单数）", "pattern": "He/She/It + 动词三单 ...", "rule": "说别人做什么时，动词要加 s 或 es。", "category": "时态"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 1", "point": "情态动词 can 表能力", "pattern": "I/We/You + can + 动词原形 ...", "rule": "用 can 表示“会、能”做某事，后面跟动词原形。", "category": "情态动词"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 1", "point": "一般疑问句（Am I ...? / Are you ...?）", "pattern": "Am I ...? / Are you ...? Yes, I am! / Yes, you are!", "rule": "用 Am I 或 Are you 开头提问，回答用 Yes, I am! 或 Yes, you are!", "category": "疑问句"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 1", "point": "祈使句（动作指令）", "pattern": "动词原形 + ...!", "rule": "用动词原形开头，告诉别人做什么动作。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 2", "point": "介绍他人（This is ...）", "pattern": "This is my ...", "rule": "用 This is 来介绍身边的人，后面接家庭成员的名字或称呼。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 2", "point": "问候与初次见面", "pattern": "Nice to meet you. / How do you do?", "rule": "第一次见面时用来打招呼，表示很高兴认识对方。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 2", "point": "一般疑问句 Is this/that ...?", "pattern": "Is this/that your ...?", "rule": "用 Is this 或 Is that 来问眼前或远处的人是不是某人的家人。", "category": "疑问句"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 2", "point": "肯定/否定回答 Yes, it is. / No, it's ...", "pattern": "Yes, it is. / No, it's my ...", "rule": "回答 Is this/that ...? 的问题，肯定用 Yes, it is.，否定用 No, it's my ... 并说出正确称呼。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 2", "point": "have 表示拥有", "pattern": "I have a/an ...", "rule": "用 I have 来说自己家里有哪些成员，a 用于辅音开头，an 用于元音开头。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 2", "point": "can 表示能力", "pattern": "They can ...", "rule": "用 can 来说家人能做的事情，后面接动词原形。", "category": "情态动词"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 2", "point": "形容词 big / small 描述家庭", "pattern": "This family is big/small.", "rule": "用 big 或 small 来形容家庭是大家庭还是小家庭。", "category": "形容词副词"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 3", "point": "询问与回答是否拥有宠物", "pattern": "Do you have a pet? Yes, I do. / No, I don't.", "rule": "用 Do you have...? 问别人有没有某样东西，回答用 Yes, I do. 或 No, I don't.", "category": "疑问句"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 3", "point": "一般现在时陈述句（I have / I like）", "pattern": "I have ... / I like ...", "rule": "用 I have 表示“我有”，用 I like 表示“我喜欢”，后面直接加名词。", "category": "时态"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 3", "point": "What's this? / What's that? 询问物品", "pattern": "What's this? / What's that? It's a/an ...", "rule": "用 What's this? 问近处的东西，用 What's that? 问远处的东西，回答用 It's a/an ...", "category": "疑问句"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 3", "point": "形容词描述动物特征", "pattern": "The ... is big / small / tall / fast.", "rule": "用 The + 动物 + is + 形容词 来描述动物的特点。", "category": "形容词副词"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 3", "point": "There be 句型（隐含在描述中）", "pattern": "There is/are ...", "rule": "用 There is 表示“有”单数，There are 表示“有”复数，描述某处存在的事物。", "category": "There be"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 3", "point": "情态动词 can 表示能力", "pattern": "We can ...", "rule": "用 can 表示“能够”，后面加动词原形，说明人或动物会做什么。", "category": "情态动词"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 4", "point": "询问与回答喜好（Do you like...?）", "pattern": "Do you like ...? Yes, I do. / No, I don't. I like ...", "rule": "用 Do you like 开头问别人喜不喜欢某物，回答用 Yes, I do. 或 No, I don't.，后面可以说自己喜欢什么。", "category": "疑问句"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 4", "point": "表达喜好（I like...）", "pattern": "I like ...", "rule": "用 I like 后面加水果或事物，表示自己喜欢什么。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 4", "point": "表达拥有（I have...）", "pattern": "I have ...", "rule": "用 I have 后面加名词，表示我有什么。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 4", "point": "表达看见（I see...）", "pattern": "I see ...", "rule": "用 I see 后面加名词，表示我看见什么。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 4", "point": "情态动词 can 表能力或建议", "pattern": "We can ... / Can we ...?", "rule": "用 can 表示能够做某事，We can 后面加动词原形，Can we 用来提问。", "category": "情态动词"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 4", "point": "一般现在时描述植物特征", "pattern": "... are ... / ... make you ...", "rule": "用 are 描述事物的特征，用 make you 表示使某人怎么样。", "category": "时态"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 5", "point": "询问颜色", "pattern": "What colour is it? / What colour is ...?", "rule": "用来问某样东西是什么颜色，回答时用 It's ... 或 ... is ...。", "category": "疑问句"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 5", "point": "描述颜色", "pattern": "... is/are ... colour.", "rule": "用 is 或 are 来说某样东西是什么颜色。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 5", "point": "询问喜欢的颜色", "pattern": "What colours do you like? / I like ...", "rule": "用来问别人喜欢什么颜色，回答时用 I like ...。", "category": "疑问句"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 5", "point": "颜色混合表达", "pattern": "... and ... make ...", "rule": "用 and 连接两种颜色，make 表示混合后变成什么颜色。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 5", "point": "颜色含义表达", "pattern": "... can say \"...\"", "rule": "用 can say 来说某种颜色代表什么含义。", "category": "情态动词"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 5", "point": "描述事物颜色", "pattern": "... are ...", "rule": "用 are 来说复数事物是什么颜色。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 6", "point": "询问年龄", "pattern": "How old are you? / How old is ...?", "rule": "用 How old 来问别人或某人的年龄，回答用 I'm ... years old 或 He/She is ... years old。", "category": "疑问句"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 6", "point": "询问数量", "pattern": "How many ...?", "rule": "用 How many 来问有多少个某物，后面接可数名词复数，回答用数字。", "category": "疑问句"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 6", "point": "数字 1-10 的基数词", "pattern": "one, two, three, four, five, six, seven, eight, nine, ten", "rule": "用这些单词表示 1 到 10 的数量，可以数东西、说年龄、说时间。", "category": "其他"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 6", "point": "数字与年龄表达", "pattern": "I'm ... years old.", "rule": "用 I'm 加数字加 years old 来说自己的年龄。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 6", "point": "数字与时间表达", "pattern": "It's ... o'clock.", "rule": "用 It's 加数字加 o'clock 来说几点整。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 6", "point": "数字与价格表达", "pattern": "I have ... yuan. / That's ... yuan, please.", "rule": "用 I have 加数字加 yuan 来说自己有多少钱，用 That's ... yuan, please 来说多少钱。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Revision", "point": "介绍他人", "pattern": "This is ...", "rule": "用 This is 来介绍身边的人或物。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Revision", "point": "初次见面问候", "pattern": "Nice to meet you. / Nice to meet you too.", "rule": "第一次见面时说 Nice to meet you，对方回应 Nice to meet you too。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Revision", "point": "一般疑问句：Do you like ...?", "pattern": "Do you like ...? Yes, I do. / No, I don't.", "rule": "用 Do you like 来问别人喜不喜欢某样东西，回答用 Yes, I do 或 No, I don't。", "category": "疑问句"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Revision", "point": "情态动词 can 表能力", "pattern": "We can ...", "rule": "用 can 表示“能够、可以”做某事。", "category": "情态动词"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Revision", "point": "祈使句：Be ...", "pattern": "Be ... , please.", "rule": "用 Be 开头告诉别人要怎么做，后面加 please 表示礼貌。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Revision", "point": "疑问句：What's this? / Is that ...?", "pattern": "What's this? / Is that a ...? It's a ...", "rule": "用 What's this 问“这是什么”，用 Is that 问“那是……吗”，回答用 It's a ...。", "category": "疑问句"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 1", "point": "初次见面问候", "pattern": "Nice to meet you. / Nice to meet you, my new friend.", "rule": "第一次见到新朋友时，用这句话打招呼，表示很高兴认识对方。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 1", "point": "介绍家人", "pattern": "This is my ...", "rule": "用 This is my ... 来介绍自己的家人是谁。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 1", "point": "表示和某人在一起", "pattern": "I am with my ...", "rule": "用 I am with my ... 表示自己和家人在一起。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 1", "point": "询问对方在哪里", "pattern": "Where are you?", "rule": "用 Where are you? 问对方在哪里。", "category": "疑问句"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 1", "point": "动物叫声表达", "pattern": "A ... says \"...\".", "rule": "用 A ... says \"...\" 来说某种动物会发出什么声音。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 1", "point": "情态动词 can 表示能力", "pattern": "I can ... / They can ... / We can ...", "rule": "用 can 表示“会、能够”做某事。", "category": "情态动词"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 2", "point": "祈使句（Show me...）", "pattern": "Show me a/an ...!", "rule": "用 Show me 开头，后面加 a 或 an 加一个字母或物品，表示“给我看一个……”。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 2", "point": "祈使句（After me / Say...）", "pattern": "After me. ...! / Say ...!", "rule": "After me 表示“跟我读”，后面跟要读的字母；Say 后面跟要说的字母或单词。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 2", "point": "祈使句（Sit down / Get up and run）", "pattern": "...!", "rule": "动词开头，表示命令或建议，句末用感叹号。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 2", "point": "一般现在时（be动词 is）", "pattern": "... is ...", "rule": "主语是单数时，用 is 表示“是”。", "category": "时态"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 2", "point": "一般现在时（be动词 is 表状态/颜色）", "pattern": "The ... is ...", "rule": "用 The + 名词 + is + 形容词，描述事物的状态或颜色。", "category": "时态"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 2", "point": "一般现在时（has 表拥有）", "pattern": "... has ...", "rule": "主语是单数时，用 has 表示“有”。", "category": "时态"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 2", "point": "一般现在时（I see...）", "pattern": "I see ...", "rule": "用 I see 表示“我看见”，后面加看见的东西。", "category": "时态"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 5", "point": "自我介绍与问候", "pattern": "Hello! I'm ... / Hi! My name is ... / Nice to meet you. / Nice to meet you too.", "rule": "见面打招呼时，用 I'm 或 My name is 介绍自己，用 Nice to meet you 表示初次见面很高兴。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 5", "point": "介绍家人", "pattern": "This is my ... / Is that your ...? / Yes, it is.", "rule": "用 This is 介绍身边的人或物，用 Is that 询问远处的人或物，回答用 Yes, it is. 或 No, it isn't.。", "category": "句型"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 5", "point": "一般疑问句（Do you...?）", "pattern": "Do you ...? / Yes, I do. / No, I don't.", "rule": "用 Do you 开头提问对方是否做某事或拥有某物，肯定回答 Yes, I do.，否定回答 No, I don't.。", "category": "疑问句"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 5", "point": "询问物品与颜色", "pattern": "What's this? / What's that? / It's a ... / What colour is it? / It's ...", "rule": "用 What's this/that 询问近处或远处的物品，用 It's a 回答；用 What colour is it 询问颜色，直接用颜色词回答。", "category": "疑问句"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 5", "point": "询问年龄与数量", "pattern": "How old are you? / I'm ... years old. / How many ...? / ...", "rule": "用 How old are you 问年龄，用 I'm ... years old 回答；用 How many 问数量，直接用数字回答。", "category": "疑问句"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 5", "point": "情态动词 can 表能力", "pattern": "We can ... / ... can ...", "rule": "用 can 表示“能够、可以”，后面直接加动词原形，说明某人或某物具备某种能力。", "category": "情态动词"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "point": "询问与回答姓名", "pattern": "What's your name? / My name's ... / I'm ...", "rule": "用 What's your name? 问别人叫什么，回答可以说 My name's ... 或 I'm ...。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "point": "询问与回答国籍/来自哪里", "pattern": "Where are you from? / I'm from ... / Where is he/she from? / He's/She's from ...", "rule": "用 Where are you from? 问对方来自哪里，回答用 I'm from ...；问第三人称用 Where is he/she from?，回答用 He's/She's from ...。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "point": "介绍他人（That's ...）", "pattern": "That's ... / Who's that ...?", "rule": "用 That's ... 介绍远处或新出现的人；用 Who's that ...? 问那是谁。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "point": "问候与回应", "pattern": "Nice to meet you. / Nice to meet you too. / Nice to see you. / Nice to see you too.", "rule": "初次见面用 Nice to meet you.，对方回应 Nice to meet you too.；再次见面用 Nice to see you.，回应 Nice to see you too。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "point": "礼貌用语：请、谢谢、不客气、让我帮忙", "pattern": "After you. / Thank you. / You're welcome. / Let me help.", "rule": "After you. 表示请（你先）；Thank you. 表示感谢；You're welcome. 表示不客气；Let me help. 表示让我来帮忙。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "point": "一般现在时（is/are）", "pattern": "... is ... / ... are ...", "rule": "用 is 表示单数，用 are 表示复数，说明人或物是什么、在哪里。", "category": "时态"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "point": "描述动物/物品特征（It has...）", "pattern": "It has a/an ... and ...", "rule": "用 It has 来说一个动物或物品有什么身体部位或特征，后面接名词短语。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "point": "一般疑问句 Do you...? 及回答 Yes, I do. / No, I don't.", "pattern": "Do you ...? Yes, I do. / No, I don't.", "rule": "用 Do you 开头问对方是否做某事，回答用 Yes, I do. 或 No, I don't.。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "point": "情态动词 can 表能力", "pattern": "We/They/You can ...", "rule": "用 can 表示某人或某物能够做某事，后面接动词原形。", "category": "情态动词"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "point": "祈使句 Let's ...", "pattern": "Let's ...", "rule": "用 Let's 开头提出一起做某事的建议，后面接动词原形。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "point": "形容词描述外貌（long, short, fat, thin, slow, big）", "pattern": "It is/He is/She is ...", "rule": "用 is 后面接形容词来描述人或动物的样子。", "category": "形容词副词"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "point": "like 表喜好", "pattern": "I/He/She likes ...", "rule": "用 like 表示喜欢某物，第三人称单数用 likes。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "point": "询问与回答物品名称（单数）", "pattern": "What's this? It's a ...", "rule": "用 What's this? 问“这是什么”，用 It's a ... 回答，后面接一个单数物品。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "point": "询问与回答物品名称（复数）", "pattern": "What are these? They're ...", "rule": "用 What are these? 问“这些是什么”，用 They're ... 回答，后面接复数名词。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "point": "礼貌借用物品", "pattern": "Can I use your ..., please?", "rule": "用 Can I use your ..., please? 礼貌地借别人的东西，回答可以用 Sure. / No problem. 等。", "category": "情态动词"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "point": "用感官描述学习", "pattern": "I ... with my ...", "rule": "用 I ... with my ... 说明“我用……来……”，后面接感官动词和身体部位。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "point": "祈使句（学习指令）", "pattern": "... with your ...", "rule": "用动词开头说“用你的……做……”，如 Write with your pencil. 表示学习动作。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "point": "情态动词 can 表能力", "pattern": "I can ...", "rule": "用 I can ... 表示“我能……”，后面接动词原形。", "category": "情态动词"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "point": "询问想要什么食物", "pattern": "Would you like some ...?", "rule": "用 Would you like some ...? 来问别人要不要吃点东西，some 后面可以接可数名词复数或不可数名词。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "point": "表达想要某物", "pattern": "I'd like some ...", "rule": "用 I'd like some ... 来表示自己想要一些东西，some 后面可以接可数名词复数或不可数名词。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "point": "肯定回答与感谢", "pattern": "Yes, please. / Thanks. / Thank you.", "rule": "别人问你要不要某物时，想要就说 Yes, please. 然后说 Thanks. 或 Thank you. 表示感谢。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "point": "否定回答与感谢", "pattern": "No, thank you. / No, thanks.", "rule": "别人问你要不要某物时，不想要就说 No, thank you. 或 No, thanks. 礼貌地拒绝。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "point": "一般现在时（描述喜好）", "pattern": "I like/love ...", "rule": "用 I like/love ... 来说自己喜欢什么，后面直接加食物名称。", "category": "时态"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "point": "一般现在时（描述食物属性）", "pattern": "... is/are ...", "rule": "用 is 或 are 来说食物是什么或怎么样，单数用 is，复数用 are。", "category": "时态"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "point": "have 句型（拥有）", "pattern": "I have ... / I have some ...", "rule": "用 I have 来说自己有什么东西，some 后面跟复数名词。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "point": "Do you have ...? 一般疑问句", "pattern": "Do you have ...? Yes, I do. / No, I don't.", "rule": "用 Do you have 来问别人有没有某物，回答用 Yes, I do. 或 No, I don't.。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "point": "What do you have? 询问拥有物", "pattern": "What do you have? / What toys do you have?", "rule": "用 What do you have 来问对方有什么，后面可以加名词限定范围。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "point": "Where is ...? 询问位置", "pattern": "Where is ...? It's in/on/under ...", "rule": "用 Where is 来问某物在哪里，回答用 It's 加介词 in、on 或 under 表示位置。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "point": "Is it ...? 一般疑问句（位置）", "pattern": "Is it in/on/under ...? Yes, it is. / No, it isn't.", "rule": "用 Is it 加介词来问某物是否在某个位置，回答用 Yes, it is. 或 No, it isn't.。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "point": "介词 in / on / under 表示位置", "pattern": "... in ... / ... on ... / ... under ...", "rule": "in 表示在……里面，on 表示在……上面，under 表示在……下面。", "category": "介词"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "point": "询问数量", "pattern": "How many ... do you have? / How many ... do we need?", "rule": "用 How many 加可数名词复数来问有多少个，回答用数字。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "point": "回答数量", "pattern": "We have ... / We need ... / I have ...", "rule": "用 have 或 need 加数字来回答有多少或需要多少。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "point": "数字加法表达", "pattern": "... and ... makes ... / Add one, it's ...", "rule": "用 and 连接两个数字，makes 表示加起来等于；Add one 表示再加一。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "point": "询问价格", "pattern": "How much is this ...? / How much is each ...?", "rule": "用 How much is 来问这个东西多少钱，each 表示每一个。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "point": "回答价格", "pattern": "It's ... yuan. / ... yuan, please.", "rule": "用 It's 加数字和 yuan 来回答价格，买东西时可以说 ... yuan, please。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "point": "数字 11 到 20 的读法", "pattern": "eleven, twelve, thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen, twenty", "rule": "11 到 19 大多在数字后加 -teen，20 是 twenty。", "category": "其他"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Revision", "point": "询问与回答价格", "pattern": "How much is ...? It's ... yuan.", "rule": "用 How much is 来问某样东西多少钱，回答用 It's 加价格。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Revision", "point": "询问与回答数量", "pattern": "How many ... do I need?", "rule": "用 How many 来问需要多少件某样东西。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Revision", "point": "询问与回答物品所属", "pattern": "What's this? Is it a ...? Yes, it is.", "rule": "用 What's this 问这是什么，用 Is it a 来猜测，回答 Yes, it is。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Revision", "point": "询问与回答物品数量", "pattern": "How much is each thing?", "rule": "用 How much is each thing 来问每样东西多少钱。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Revision", "point": "询问与回答物品数量", "pattern": "I have ... more.", "rule": "用 I have ... more 来表示我还有多少件。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Revision", "point": "询问与回答物品数量", "pattern": "I'll take ... for my family.", "rule": "用 I'll take ... for my family 来表示我要买多少件给家人。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 1", "point": "询问国籍/来自哪里", "pattern": "Where are you from? I'm from ...", "rule": "用 Where are you from? 问别人来自哪里，用 I'm from ... 回答。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 1", "point": "初次见面问候与自我介绍", "pattern": "Nice to meet you. What's your name? My name's ...", "rule": "见面时先说 Nice to meet you.，再用 What's your name? 问名字，用 My name's ... 回答。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 1", "point": "邀请/请坐", "pattern": "Here's a seat. Please sit down.", "rule": "用 Here's a seat. 表示有座位，再用 Please sit down. 请对方坐下。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 1", "point": "表达情绪与动作", "pattern": "You are ... and you know it. ... it.", "rule": "用 You are ... 描述状态，再用 and you know it 表示你知道，后面接动作。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 1", "point": "请求借用物品", "pattern": "Can I use your ...? Yes, no problem. You can use ...", "rule": "用 Can I use your ...? 请求借用，对方用 Yes, no problem. 同意，并说 You can use ...。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 1", "point": "提供食物/饮料", "pattern": "Would you like some ...? Yes, I'd like some ...", "rule": "用 Would you like some ...? 问对方要不要一些食物或饮料，用 Yes, I'd like some ... 回答。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 4", "point": "询问姓名", "pattern": "What's your name? / My name's ...", "rule": "用 What's your name? 问别人叫什么名字，回答用 My name's 加名字。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 4", "point": "询问国籍/来自哪里", "pattern": "Where are you from? / I'm from ...", "rule": "用 Where are you from? 问别人来自哪里，回答用 I'm from 加国家或地方。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 4", "point": "介绍人物", "pattern": "Who's that ...? / That's ...", "rule": "用 Who's that ...? 问那个是谁，回答用 That's 加人物介绍。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 4", "point": "描述动物特征", "pattern": "It has ... and ...", "rule": "用 It has 加身体部位，描述动物有什么特征。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 4", "point": "一般现在时的一般疑问句", "pattern": "Do you ...? / Yes, I do. / No, I don't.", "rule": "用 Do you 开头问别人是否做某事，回答用 Yes, I do. 或 No, I don't.", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Appendix 4", "point": "询问数量", "pattern": "How many ... do we have/need? / We have/need ...", "rule": "用 How many 加可数名词问有多少，回答用 We have/need 加数量。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "point": "询问与回答姓名", "pattern": "What's your name? / My name's ... / I'm ...", "rule": "用 What's your name? 问别人叫什么，回答可以说 My name's ... 或 I'm ...。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "point": "询问与回答国籍或来自哪里", "pattern": "Where are you from? / I'm from ... / Where is he/she from? / He's/She's from ...", "rule": "用 Where are you from? 问对方来自哪里，回答用 I'm from ...；介绍别人时用 He's/She's from ...。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "point": "介绍他人（That's ...）", "pattern": "Who's that man/woman/boy/girl? / That's ...", "rule": "用 Who's that ...? 问那个人是谁，回答用 That's ... 介绍。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "point": "礼貌用语：请、谢谢、不客气、让我帮忙", "pattern": "After you. / Thank you. / You're welcome. / Let me help.", "rule": "见面或排队时可以用 After you. 表示请；别人帮忙时说 Thank you.，对方回答 You're welcome.；想帮忙时说 Let me help.。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "point": "问候与回应", "pattern": "Nice to meet you. / Nice to meet you too. / Nice to see you. / Nice to see you too.", "rule": "第一次见面用 Nice to meet you.，对方回应 Nice to meet you too.；再次见面用 Nice to see you.。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "point": "一般现在时（介绍身份与状态）", "pattern": "... is ... / ... are ...", "rule": "介绍人是谁、来自哪里、是什么身份时，用 is 或 are 连接。", "category": "时态"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "point": "一般现在时描述特征", "pattern": "It is/has ...", "rule": "用 is 或 has 来说一个东西长什么样、有什么。", "category": "时态"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "point": "一般现在时描述人", "pattern": "He/She is ... He/She has ...", "rule": "用 is 或 has 来说一个人长什么样、有什么。", "category": "时态"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "point": "一般现在时描述动作", "pattern": "We ...", "rule": "用动词原形来说我们做什么。", "category": "时态"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "point": "一般现在时描述喜好", "pattern": "I love ...", "rule": "用 love 来说我喜欢什么。", "category": "时态"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "point": "一般现在时描述能力", "pattern": "We can ...", "rule": "用 can 来说我们能做什么。", "category": "时态"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "point": "一般现在时描述习惯", "pattern": "I often ...", "rule": "用 often 来说我经常做什么。", "category": "时态"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "point": "询问与回答物品（What's this? / What are these?）", "pattern": "What's this? It's a ... / What are these? They're ...", "rule": "用 What's this? 问单数物品，用 It's a ... 回答；用 What are these? 问复数物品，用 They're ... 回答。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "point": "礼貌借用物品（Can I use your ..., please?）", "pattern": "Can I use your ..., please? Sure. / No problem. / Here you are.", "rule": "用 Can I use your ..., please? 礼貌地借东西，对方可以用 Sure.、No problem. 或 Here you are. 回答。", "category": "情态动词"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "point": "用感官描述学习（I see/hear/smell/taste/touch with ...）", "pattern": "I see/hear/smell/taste/touch with my eyes/ears/nose/tongue/hands.", "rule": "用 I + 感官动词 + with my + 身体部位，说明我用什么器官来学习。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "point": "用工具学习（I use ... / I can use ... to learn）", "pattern": "I use ... / I can use ... to learn.", "rule": "用 I use ... 或 I can use ... to learn 说明我用什么工具来学习。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "point": "祈使句（Read/Write/Put/Draw ...）", "pattern": "Read/Write/Put/Draw ...", "rule": "用动词原形开头，告诉别人做什么，比如 Read your book. 或 Put the pen in your pencil box.", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "point": "i-e 拼读规则（Let's spell）", "pattern": "...i-e (like, bike, fine, size)", "rule": "字母 i 在词尾前加 e 时，通常发长音 /aɪ/，如 like、bike、fine、size。", "category": "其他"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "point": "询问与表达想要的食物", "pattern": "Would you like some ...? / I'd like some ..., please.", "rule": "用 Would you like some ...? 来问别人要不要某种食物；用 I'd like some ... 来说自己想吃某种食物。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "point": "表达喜欢与爱好的食物", "pattern": "I like ... / I love ...", "rule": "用 I like 或 I love 来说自己喜欢或喜爱的食物。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "point": "建议与提供食物", "pattern": "Have some ... too. / Here you are.", "rule": "用 Have some ... 来建议或提供某种食物；用 Here you are 把东西递给对方。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "point": "一般现在时（描述喜好与习惯）", "pattern": "主语 + like/love/eat + 食物", "rule": "用一般现在时来说平时喜欢吃什么或经常吃什么。", "category": "时态"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "point": "名词单复数与不可数名词", "pattern": "some + 可数名词复数 / 不可数名词", "rule": "some 后面可以接可数名词的复数，也可以接不可数名词。", "category": "名词"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "point": "疑问句：What do you see / What do we eat", "pattern": "What do you/we ...?", "rule": "用 What do you/we ...? 来询问看到什么或吃什么。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "point": "have 句型（拥有）", "pattern": "I have ... / I have some ...", "rule": "用 I have 来说自己有什么东西，some 后面跟复数名词。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "point": "Do you have ...? 一般疑问句", "pattern": "Do you have ...? Yes, I do. / No, I don't.", "rule": "用 Do you have 来问别人有没有某样东西，回答用 Yes, I do. 或 No, I don't.。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "point": "Where is ...? 询问地点", "pattern": "Where is ...? It's in/on/under ...", "rule": "用 Where is 来问某物在哪里，回答用 It's 加介词 in、on、under 表示位置。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "point": "Is it ...? 一般疑问句", "pattern": "Is it in/on/under ...? Yes, it is. / No, it isn't.", "rule": "用 Is it 加介词来问某物是否在某个位置，回答用 Yes, it is. 或 No, it isn't.。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "point": "What's this? / What are these? 询问物品", "pattern": "What's this? It's a ... / What are these? They're ...", "rule": "用 What's this 问单数物品，回答用 It's a ...；用 What are these 问复数物品，回答用 They're ...。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "point": "情态动词 can 表能力或许可", "pattern": "You can ... / I can ...", "rule": "用 can 表示可以做某事或允许做某事。", "category": "情态动词"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "point": "询问数量（How many）", "pattern": "How many ... do you/we have? / How many ... do we need?", "rule": "用 How many 来问有多少个可数东西，回答用数字或 I have ...。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "point": "询问价格（How much）", "pattern": "How much is this/that ...? / How much is each ...?", "rule": "用 How much 来问东西多少钱，回答用 It's ... yuan。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "point": "数字加法与结果表达", "pattern": "... and ... makes ... / Add one, it's ...", "rule": "用 and 把两个数字加起来，用 makes 说出结果；Add one 表示再加一。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "point": "数字倍数表达", "pattern": "... ... are ...", "rule": "用数字加名词复数表示几个几是多少，如 Three fives are fifteen。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "point": "数字 11-20 的基数词", "pattern": "eleven, twelve, thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen, twenty", "rule": "11 到 20 的数字要会读会写，用来数东西、买东西和说时间。", "category": "名词"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "point": "数字用于购物与支付", "pattern": "I pay ... yuan for ... / I'll take ...", "rule": "用 I pay ... yuan for ... 表示我花多少钱买什么；I'll take ... 表示我要买……个。", "category": "句型"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Revision", "point": "询问与回答价格", "pattern": "How much is this/that/it? It's ... yuan.", "rule": "用 How much is...? 来问东西多少钱，回答用 It's + 数字 + yuan。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Revision", "point": "询问与回答数量", "pattern": "How many do I need?", "rule": "用 How many...? 来问需要多少，后面接可数名词。", "category": "疑问句"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Revision", "point": "询问与回答姓名", "pattern": "What's your name? My name is ...", "rule": "用 What's your name? 问别人叫什么名字，回答用 My name ? / I'm ... / He's ... / She's ...", "rule": "用 How do/does 问别人感觉，用 I'm/He's/She's 加情绪形容词回答。", "category": "疑问句"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 2", "point": "询问原因与安慰", "pattern": "What's the matter? / You look ... / I'm sorry. / Don't worry.", "rule": "用 What's the matter? 问怎么了，用 You look + 情绪词 描述对方样子，再用 I'm sorry 或 Don't worry 安慰。", "category": "句型"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 2", "point": "表达担忧与困难", "pattern": "I'm so worried! / I can't ... / It's about ...", "rule": "用 I'm so worried! 表达担心，用 I can't 说不能做某事，用 It's about 说明事情原因。", "category": "句型"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 2", "point": "提出建议", "pattern": "Why not ...? / You can ... / Let's ...", "rule": "用 Why not 或 You can 或 Let's 提出建议，后面接动词原形。", "category": "句型"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 2", "point": "表达同意与不同意", "pattern": "I agree with ... / I don't agree with ... / We don't agree with each other.", "rule": "用 agree with 表示同意某人，加 don't 表示不同意，用 each other 表示彼此。", "category": "句型"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 2", "point": "表达需要与重要性", "pattern": "I need to ... / It's important to ...", "rule": "用 I need to 表示我需要做某事，用 It's important to 表示做某事很重要，后面接动词原形。", "category": "句型"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 3", "point": "询问课程安排", "pattern": "What do you have on ...? I have ...", "rule": "用 What do you have on + 星期 来问某天有什么课，回答用 I have + 科目。", "category": "句型"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 3", "point": "询问最喜欢的科目", "pattern": "What's your favourite subject? It's ...", "rule": "用 What's your favourite subject? 问最喜欢的科目，回答用 It's + 科目。", "category": "句型"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 3", "point": "询问最喜欢的日子", "pattern": "What's your favourite day at school? It's ...", "rule": "用 What's your favourite day at school? 问在学校最喜欢哪一天，回答用 It's + 星期。", "category": "句型"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 3", "point": "频率副词 usually / often / sometimes", "pattern": "I usually ... I often ... Sometimes I ...", "rule": "usually 表示通常，often 表示经常，sometimes 表示有时，放在动词前面说明做某事的频率。", "category": "形容词副词"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 3", "point": "询问周末活动", "pattern": "What do you do at the weekend? I usually ... I often ... Sometimes ...", "rule": "用 What do you do at the weekend? 问周末做什么，回答用频率副词加动词短语。", "category": "句型"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 3", "point": "一般现在时第三人称单数", "pattern": "He/She + 动词三单形式 ...", "rule": "主语是 he 或 she 时，动词要用第三人称单数形式，如 plays, does, has。", "category": "时态"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 4", "point": "should 表建议", "pattern": "You should ...", "rule": "用 should 告诉别人应该做什么，表示建议。", "category": "情态动词"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 4", "point": "shouldn't 表不建议", "pattern": "You shouldn't ... (so often)", "rule": "用 shouldn't 告诉别人不应该做什么，表示不建议。", "category": "情态动词"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 4", "point": "can 表请求", "pattern": "Can I ...?", "rule": "用 Can I ...? 向别人请求做某事。", "category": "情态动词"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 4", "point": "can't 表否定回答", "pattern": "No, you can't.", "rule": "用 No, you can't. 回答别人不能做某事。", "category": "情态动词"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 4", "point": "have to 表必须", "pattern": "... has to ...", "rule": "用 has to 表示某人必须做某事。", "category": "情态动词"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 4", "point": "一般现在时（频率副词）", "pattern": "I ... every day / often / usually / sometimes", "rule": "用一般现在时描述经常做的习惯，可加 every day、often、usually、sometimes 等词。", "category": "时态"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 4", "point": "一般现在时（否定）", "pattern": "I don't ...", "rule": "用 don't 表示一般现在时的否定，说明不常做某事。", "category": "时态"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 4", "point": "How can ...? 询问方法", "pattern": "How can I ...?", "rule": "用 How can I ...? 询问自己可以怎么做。", "category": "疑问句"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 4", "point": "There is 句型", "pattern": "There is ... on the ...", "rule": "用 There is ... 表示某处有某物。", "category": "There be"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "point": "询问想吃什么/喝什么", "pattern": "What would you like to eat/drink?", "rule": "用这个句型问别人想吃或喝什么。", "category": "句型"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "point": "表达想要某物", "pattern": "I'd like ...", "rule": "用 I'd like 后面加食物或饮料，表示“我想要……”。", "category": "句型"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "point": "请求得到某物", "pattern": "Can I have some ...?", "rule": "用 Can I have some ...? 礼貌地请求得到一些食物或饮料。", "category": "句型"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "point": "询问食物来源", "pattern": "Where does ... come from? It comes from ...", "rule": "用 Where does ... come from? 问食物来自哪里，用 It comes from ... 回答。", "category": "句型"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "point": "一般现在时（第三人称单数）", "pattern": "Subject + does/doesn't + verb ...", "rule": "主语是第三人称单数时，疑问句用 does，否定句用 doesn't，动词用原形。", "category": "时态"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "point": "There be 句型", "pattern": "There is/are ...", "rule": "用 There is 表示有单数或不可数名词，用 There are 表示有复数名词。", "category": "There be"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 6", "point": "There be 句型", "pattern": "There is/are ...", "rule": "用 There is 表示“有一个/有一些”，用 There are 表示“有多个/有一些”，后面接名词。", "category": "There be"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 6", "point": "一般疑问句 Are there...? / Is there...?", "pattern": "Are there any ...? / Is there a ...?", "rule": "用 Are there 或 Is there 开头提问，回答用 Yes, Bananas are yellow. Ducks are ...…", "topic": "制作颜色翻翻书"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "The colourful world", "name": "Draw and say", "genre": "对话", "source": "Let's read", "text": "Let's draw some purple\nand brown birds.\nOK. Let's draw some red and pink flowers.\nWhat colours do you like?\nAnd the birds?\nI like red and pink.\nWhat colours do you like?\nI like green and yellow.", "topic": "画画与颜色偏好"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Useful numbers", "name": "Start to read", "genre": "故事", "source": "Start to read", "text": "It's Xinxin's birthday soon.\nListen and circle.\nCircle the numbers you read in the text.\nSay the numbers in each group.\n1. How many people are there?\n2. How old is Matt?\n1. How old is Xinxin now?\n2. What time is the party?\n3. What numbers do you see on the card?", "topic": "生日与数字"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 1", "name": "Reading time", "genre": "故事", "source": "Reading", "text": "Zoom is nice.\nZoom is my new friend.\nWe share food.\nHi! I'm Zip.\nNice to meet you.\nHi! My name is Zoom.\nNice to meet you too.\nWe are good friends now.\nWe play together.\nWe listen with care and help each other.\nHold my hand.\nOuch!\nMy mouth!", "topic": ""}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 3", "name": "Reading time", "genre": "对话", "source": "Reading", "text": "Mum, what makes us great?\nWe are big.\nElephants are big too.\nWe are fast.\nFish are fast too.\nYes! We can sing nice songs.\nI know! We sing!\nPandas eat a lot too.\nWe eat a lot.", "topic": "动物与人类的共同点"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 5", "name": "Colour meanings", "genre": "短文", "source": "Start to read", "text": "It's red. Red\ncan say \"No!\"\nIt's green. Green\ncan say \"Go!\"\nIt's blue. Blue can\nsay \"Use again!\"\nIt's yellow. Yellow\ncan say \"Be careful!\"\n...", "topic": "颜色的含义"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 5", "name": "I am a sunflower", "genre": "故事", "source": "其他", "text": "I am a sunflower. I am\ntall and green.\nNow I am a big\nyellow flower. Bees\ncome. They are\nyellow and black.\nI give them food.\nThen I am green\nand yellow.\nNow it is cold. I am\ngreen and brown.\nI am gone. But my\nchildren grow.", "topic": "向日葵的生长过程"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 5", "name": "Project: Make a colour flip book", "genre": "说明", "source": "其他", "text": "Which colours do the children say? Listen\nand circle.\nChoose the colours you like.\nMake your book.\nI like yellow,\nred and blue.\nWhat colours do\nyou like, Sarah?\nThis is my book. I like yellow, red and\nblue. Bananas are yellow. Ducks are ...…\nMake your book.\nShare your book in class.", "topic": "制作颜色翻翻书"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 6", "name": "Start to read", "genre": "故事", "source": "Start to read", "text": "It's Xinxin's birthday soon.\nListen and circle.\n1. How many people are there?\n2. How old is Matt?\n1. How old is Xinxin now?\n2. What time is the party?\n3. What numbers do you see on the card?\n• One.\n• Two.\n• Three.\n• Four.\n• Five.\n• Six.\n• Seven.\n• Eight.\n• Nine.\n• Ten.\n• Three.\n• Four.\n• Five.\n• Six.\n• Five.\n• Seven.\n• 5 p.m.\n• 6 p.m.\nRead the card and circle the numbers.", "topic": "生日与数字"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 1", "name": "Reading time", "genre": "故事", "source": "Reading", "text": "Zoom is nice.\nZoom is my new friend.\nWe share food.\nHi! I'm Zip.\nNice to meet you.\nHi! My name is Zoom.\nNice to meet you too.\nWe are good friends now.\nWe play together.\nWe listen with care and help each other.\nHold my hand.\nOuch!\nMy mouth!", "topic": ""}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 4", "name": "Reading time", "genre": "故事", "source": "Reading", "text": "I am an apple tree.\nMy new family help me.\nI need air, water and sun. My family water me.\nIt is cold. They help me.\nI am big now. I give apples to my family. We are all happy!\nMy family like me.\nI love the fresh air.\nThe flowers are so beautiful!", "topic": "苹果树与家人互相帮助"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 5", "name": "Colour meanings", "genre": "短文", "source": "Start to read", "text": "It's red. Red\ncan say \"No!\"\nIt's green. Green\ncan say \"Go!\"\nIt's blue. Blue can\nsay \"Use again!\"\nIt's yellow. Yellow\ncan say \"Be careful!\"", "topic": "颜色的含义"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 5", "name": "I am a sunflower", "genre": "故事", "source": "Let's read", "text": "I am a sunflower. I am\ntall and green.\nNow I am a big\nyellow flower. Bees\ncome. They are\nyellow and black.\nI give them food.\nThen I am green\nand yellow.\nNow it is cold. I am\ngreen and brown.\nI am gone. But my\nchildren grow.", "topic": "向日葵的生长过程"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 6", "name": "Start to read", "genre": "故事", "source": "Start to read", "text": "It's Xinxin's birthday soon.\nListen and circle.\n1. How many people are there?\n2. How old is Matt?\n1. How old is Xinxin now?\n2. What time is the party?\n3. What numbers do you see on the card?\n• One.\n• Two.\n• Three.\n• Four.\n• Five.\n• Six.\n• Seven.\n• Eight.\n• Nine.\n• Ten.\n• Three.\n• Four.\n• Five.\n• Six.\n• Five.\n• Seven.\n• 5 p.m.\n• 6 p.m.\nRead the card and circle the numbers.", "topic": "生日与数字"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 2", "name": "Start to read", "genre": "短文", "source": "Start to read", "text": "This family is small.\nThey love each other.\nThis family is big.\nThey love each other too.\nThis is my mum.\nAnd this is my dad.", "topic": "家庭"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 3", "name": "Mum, what makes us great?", "genre": "对话", "source": "Reading", "text": "Mum, what makes us great?\nWe are big.\nElephants are big too.\nWe are fast.\nFish are fast too.\nYes! We can sing nice songs.\nI know! We sing!\nPandas eat a lot too.\nWe eat a lot.", "topic": ""}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 3", "name": "Great animals", "genre": "短文", "source": "Start to read", "text": "The giraffe is tall!\nThe lion is fast!\nThe elephant is big!\nThe fish is small!", "topic": ""}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "name": "Reading time", "genre": "故事", "source": "Reading", "text": "Hi! I'm Ra.\nNice to meet you.\nNice to meet you too.\nZoom, look!\nThis book is so cool!\nWow!\nWe're from China.\nHello! I'm Zip.\nWhat's your name?\nWelcome to Russia!\nWhere are you from?\nWhat a trip!\nWhat fun!\nEast or west, home is best!\nBear, who's that?\nThat's my neighbour, Beaver.\nLook! Pandas!\nWe're back in China!", "topic": "介绍新朋友、国家与旅行"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "name": "Read and write", "genre": "对话", "source": "Read and write", "text": "After you.\nI'm from Henan, China.\nMy name is Linlin.\nYes.\nSawat di kha! Hello! I'm from Thailand.\nDo you like pineapple rice?\nThank you.\nHi! I'm John.\nWhere are you from?", "topic": "在美食节上认识新朋友"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "name": "Reading time", "genre": "短文", "source": "Reading", "text": "We learn from Mum and Dad. Polar bears do the same.\nWe play and learn. Lions do the same.\nWe taste food with our tongues. Frogs get food with their tongues.\nWe speak and learn. Ants can't speak. But they can use smell to learn.\nWe draw maps with pencils and paper. Bees can't draw. But they can make a \"map\".\nEagles can see a rabbit from the sky. We can't. But we can use tools to see more!", "topic": "人与动物如何学习"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "name": "Read and write", "genre": "短文", "source": "Read and write", "text": "What helps you learn?\nI can hear with my ears.\nI can see with my eyes.\nI can smell with my nose.\nI can touch with my hands.\nI can use a bag, a book, paper, a pen, a pencil and a ruler to learn.\nCan I use your eraser, please?\nWhat are these? They're grapes.", "topic": "感官与学习工具"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "name": "Read and write", "genre": "短文", "source": "Read and write", "text": "I hear birds.\nI smell flowers.\nI feel the sun.\nI taste an apple.\nI touch the grass.\nI see spring.", "topic": "用感官感受春天"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "name": "Read and write", "genre": "短文", "source": "Read and write", "text": "I see teachers and students.\nI hear songs.\nI love my school!", "topic": "我的学校"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "name": "Project: Make a sense book", "genre": "说明", "source": "Reading", "text": "This is my sense book. I see ...\nMake your sense book.\nShare your book in class.", "topic": "制作感官书"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "name": "Where is my boat?", "genre": "故事", "source": "其他", "text": "Where is my boat?\nIs it in this box? Wow!\nMy old robot!\nOh no! My robot has one arm, one eye and one foot.\nI need some help.\nHi, Cat! Do you have any old toys? I need an arm for my robot.\nNice!\nThank you.\nI have an old doll's arm.\nHi, Tiger! Do you have any old toys? I need an eye for my robot.\nI have an old car.\nYou can use the light!\nI also need a foot for my robot.\nHow about this?\nThat works!\nLook at my robot now!\nWow!", "topic": "用旧玩具改造机器人"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "name": "Read and write", "genre": "短文", "source": "Read and write", "text": "I have some old cars and boats.\nThey are still good. I put them on the shelves.\nI have some old dolls and animal toys. They are still nice. I put them in a box.\nI have many old books. They are still good. I put them in a box.\nDo you have old things at home?\nYes. I have a                and some                .", "topic": "旧玩具与旧学习用品的存放"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "name": "Read and match", "genre": "短文", "source": "Read and write", "text": "Where is the ball?\nIs the ruler on the book?\nIt's                the map.\nNo, it's                the book.\nin     on     under", "topic": "物品位置"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "name": "Read and write", "genre": "对话", "source": "Read and write", "text": "How much is the bread?\nIt's twelve yuan.\nTwelve yuan, please.\nOK. I'll take two.\nHow much is it?\nIt's six yuan.", "topic": ""}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "name": "Reading time", "genre": "对话", "source": "Reading", "text": "Numbers are useful. And numbers are interesting too.\nA clock has twelve numbers.\nWe use them to tell the time.\nAnd a year has twelve months!\nHow many eggs do we have?\nTwelve.\nIn a mobile phone number, how many numbers are there?\nAnd a football team always has eleven players.\nA player can get a red card!\nThat's true. Then the team only has ten players!\nNo, eleven.\nThat's not true!\nOh, how so?\nTwelve?", "topic": ""}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "name": "Project: Make and sell fun sandwiches", "genre": "说明", "source": "其他", "text": "Choose healthy food and make your sandwiches.\nSell fun sandwiches.", "topic": ""}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "name": "Self-assessment", "genre": "说明", "source": "其他", "text": "1. I can use the numbers 11 to 20 to count things.\n2. I can use numbers to buy or sell things.\n3. I can use the numbers 11 to 20 in different places.\n4. I can read and spell words with \"c\", \"g\", \"l\" and \"y\".", "topic": ""}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "name": "Reading time", "genre": "短文", "source": "Reading", "text": "We like fruit. We can have fun with fruit.\nWe can make animals with fruit.\nWe have friends.\nWe can make fruit friends too.\nWe can act as fruit.\nWe can be tall or short.\nWe can be fat or thin.\nWe can also \"write\" with fruit.\nWe can express our ideas in different ways!\nIt is fun!", "topic": "用水果表达想法"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "name": "Read and write", "genre": "短文", "source": "Read and write", "text": "I have a dog. It's thin.\nIt has a long body.\nI like it.\nI often make a card for my dad.\nWhat about you?", "topic": "介绍宠物与表达爱意"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "name": "Read and write", "genre": "对话", "source": "Read and write", "text": "Do you have a pet?\nYes, I have a dog. It's thin.\nIt has a long body. I like it.\nDo you listen to your friend with care?\nYes, I do.\nDo you often play together?\n...", "topic": "宠物与朋友相处"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "name": "Reading time", "genre": "对话", "source": "Reading", "text": "What would you like to eat, Zoom?\nVegetables are healthy. I love carrots.\nYou can try!\nHealthy food.\nHow about nuts?\nOK.\nWould you like some meat, Zoom?\nIt's healthy.\nI eat from flowers. They're yummy and healthy too.\nNuts, vegetables, meat, flowers ... What's healthy food?\nEat what's good for you. But you also need to exercise!", "topic": "健康食物"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "name": "Read and write", "genre": "对话", "source": "Read and write", "text": "OK.\nHave some vegetables and fruit, John.\nYour plate is not healthy, John.\nWhose plate is healthy? Look and say.", "topic": "健康餐盘"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "name": "I have some old cars and boats.", "genre": "短文", "source": "Read and write", "text": "I have some old cars and boats.\nThey are still good. I put them on the shelves.\nI have some old dolls and animal toys. They are still nice. I put them in a box.\nI have many old books. They are still good. I put them in a box.\nDo you have old things at home?\nYes. I have a                and some               .", "topic": "旧物存放"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "name": "Where is my boat?", "genre": "故事", "source": "其他", "text": "Where is my boat?\nIs it in this box? Wow!\nMy old robot!\nOh no! My robot has one arm, one eye and one foot.\nI need some help.\nHi, Cat! Do you have any old toys? I need an arm for my robot.\nNice!\nThank you.\nI have an old doll's arm.\nHi, Tiger! Do you have any old toys? I need an eye for my robot.\nI have an old car.\nYou can use the light!\nI also need a foot for my robot.\nHow about this?\nThat works!\nLook at my robot now!\nWow!", "topic": "旧物改造机器人"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "name": "Project: Reuse some old things", "genre": "说明", "source": "其他", "text": "What old things does Mike have? Listen, circle the words and match.\nStep\nMake new things from the old things in Box 3.\nWhat's this?\nIt's a fish.\nWhat are these?\nThey're boats.\nFind some old things at home.\nStep\nStep\nGroup the old things and put them in different boxes.\nsell\ngive away\nmake\nnew\nthings\nReuse some things at home.\nShare your work in class.", "topic": "旧物再利用项目"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "name": "Self-check", "genre": "其他", "source": "其他", "text": "1. I can talk about old things I have.\n2. I can ask and say where things are.\n3. I can share ideas about reusing things.\n4. I can read and spell words with \"u-e\".", "topic": "单元自查"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "name": "Reading time", "genre": "短文", "source": "Reading", "text": "We like fruit. We can have fun with fruit.\nWe can make animals with fruit.\nWe have friends.\nWe can make fruit friends too.\nWe can act as fruit.\nWe can be tall or short.\nWe can be fat or thin.\nWe can also \"write\" with fruit.\nWe can express our ideas in different ways!\nIt is fun!", "topic": "用水果表达想法"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "name": "Read and write", "genre": "书信", "source": "Read and write", "text": "I have a dog. It's thin.\nIt has a long body. I like it.\nI often make a card for my dad.\nWhat about you?\nDo you have a pet?\nYes, I have a dog. It's thin.\nIt has a long body. I like it.\nDo you listen to your friend with care?\nYes, I do.\nDo you often play together?\n...", "topic": "介绍宠物与表达友谊"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "name": "Reading time", "genre": "故事", "source": "Reading", "text": "Hi! I'm Ra.\nNice to meet you.\nNice to meet you too.\nZoom, look!\nThis book is so cool!\nWow!\nWe're from China.\nHello! I'm Zip.\nWhat's your name?\nWelcome to Russia!\nWhere are you from?\nWhat a trip!\nWhat fun!\nEast or west,\nhome is best!\nBear, who's that?\nThat's my neighbour, Beaver.\nLook! Pandas!\nWe're back in China!", "topic": "介绍新朋友、旅行与家乡"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "name": "Read and write", "genre": "对话", "source": "Read and write", "text": "After you.\nI'm from Henan, China.\nMy name is Linlin.\nYes.\nSawat di kha! Hello! I'm from Thailand.\nDo you like pineapple rice?\nThank you.\nHi! I'm John.\nWhere are you from?", "topic": "在美食节上认识新朋友"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 2", "name": "True friends", "genre": "短文", "source": "Read and write", "text": "True friends\n. Tall or\n, strong or not, they help each other.", "topic": "友谊"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 4", "name": "We are community helpers", "genre": "短文", "source": "Read and write", "text": "We are community helpers. We\noften help children and old people.\nIn the kindergarten, John and Class\nOne are singing songs together. Zhang\nPeng is telling stories to Class Two.\nIn the old people's home, Chen Jie\nis making the bed. Amy is drawing a\npicture of Ms Xu. They are all happy.\nWe love the people in our community.", "topic": "社区帮手与帮助他人"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 6", "name": "Colourful seasons, colourful life!", "genre": "诗歌", "source": "Read and write", "text": "Spring is green.\nIt's full of life.\nI take many walks,\nAnd fly my kite.\nSummer is blue.\nI play games and sing songs,\nWear dresses and T-shirts.\nThe days are so long.\nAutumn is orange.\nI like the falling leaves.\nI wear sweaters and shirts,\nAnd enjoy mooncakes.\nWinter is white.\nI make snowmen with friends,\nWear warm coats and gloves.\nThen spring comes again.", "topic": "四季的颜色、活动与穿着"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 2", "name": "True friends", "genre": "短文", "source": "其他", "text": "True friends\nTall or short, strong or not, they help each other.\nWho's your best friend?\nLiu Jia. She's tall and ... She has long hair. She often ...\nWho's your best friend?\nChen Jie. She's funny.\nShe often makes me smile.\nHow about you?\nWho's your best friend?\nMy best friend is John. He's very kind.\nHe often helps me with English.", "topic": "介绍最好的朋友"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 2", "name": "Liu Jia is my best friend", "genre": "短文", "source": "Read and write", "text": "Liu Jia is tall. She has long hair. She often reads books with me. We like animal books and often share. She likes weiqi, but I like ball games. I often play football and basketball. Liu Jia is kind. She always makes me smile. We are best friends.", "topic": "介绍好朋友刘佳"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 2", "name": "Self-check", "genre": "其他", "source": "其他", "text": "1. I can talk about my friends.\n2. I can say what I do with my friends.\n3. I can tell why someone is my friend.\n4. I can read and spell words with \"sh\".", "topic": "单元自查"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 2", "name": "Project: Make a book about your friend", "genre": "其他", "source": "其他", "text": "Project: Make  Talk and draw.\nThis is my dream community.\nThere is ... People often ...\nThere are ... People often ...", "topic": "谈论梦想社区"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 3", "name": "There is a beautiful park. I often take a walk there.", "genre": "短文", "source": "其他", "text": "There is a beautiful park. I often take a walk there.\nThere is a playground. I do sports there.\nThere is a shop. I go shopping there.\nThere is a hospital. I see a doctor there.\nThere is a playground in my community. I often do sports there.", "topic": "社区里的场所及人们的活动"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 3", "name": "What can we see in a community?", "genre": "说明", "source": "其他", "text": "What can we see in a community?\nDraw and say.\nChoose, stick and say.\nLook and say.\nLook and think.\nWe love our community!", "topic": "社区里的场所"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 3", "name": "What do people do in a community?", "genre": "说明", "source": "其他", "text": "What do people do in a community?\ngo shopping\ndo sports\ntake a walk\nsee a doctor", "topic": "社区里的活动"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 4", "name": "We are community helpers", "genre": "短文", "source": "Read and write", "text": "We are community helpers. We\noften help children and old people.\nIn the kindergarten, John and Class\nOne are singing songs together. Zhang\nPeng is telling stories to Class Two.\nIn the old people's home, Chen Jie\nis making the bed. Amy is drawing a\npicture of Ms Xu. They are all happy.\nWe love the people in our community.", "topic": "社区帮手与帮助他人"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 4", "name": "Liu Jia's father takes us to school every day", "genre": "短文", "source": "Read and write", "text": "Liu Jia's father takes us to school every day. Look! He is\ndriving our school bus.\nMiss Lin often helps us. She is helping some students cross\nthe road.\nMr Zhang cleans our school. rong wind. We can't ...", "topic": "不同天气下能做什么"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 5", "name": "Project: Make a bad weather reminder", "genre": "其他", "source": "其他", "text": "Project: Make a bad weather reminder\nIt's too hot. We can't play football outside.\nThere is a strong wind. We can't ...\nMake a bad weather reminder.\nShare your reminder in class.", "topic": "制作恶劣天气提醒"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 5", "name": "Self-check", "genre": "其他", "source": "其他", "text": "1. I can talk about different weather.\n2. I can say what my friends and I do in different weather.\n3. I can tell others how people can have fun in different weather.\n4. I can read and spell words with \"th\".", "topic": "单元自查"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 5", "name": "Let's learn (weather and activities)", "genre": "其他", "source": "其他", "text": "play basketball\nfly a kite\nsee a film\nmake a snowman\nOn snowy days, we can\nmake a snowman.\nOn sunny days, we can play basketball.\nWe can ...\nWe can't fly a kite.\nWhat can we do?\nIt's cold and snowy.", "topic": "不同天气下的活动"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 5", "name": "Let's spell (th words)", "genre": "其他", "source": "其他", "text": "It's warm again.\nI'm thirsty and hungry.\nGood to see you!\nYou are so thin now.\nThese gifts are for you.\nThanks. They're my\nfavourite!\nthank\nthink\nthese\nthey\nthere\nthree\nthem\nthin\nth\nMum, you're very\nnow.\nyou, my dear!", "topic": "th 发音与单词"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 5", "name": "Look and say (weather in cities)", "genre": "其他", "source": "其他", "text": "snowy\n-6°C\ncold\nwindy\n23°C\nwarm\n32°C\nhot\ncloudy\nrainy\n6°C\ncold\nsunny\n18°C\ncool", "topic": "城市天气与温度"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 5", "name": "Look and think (weather and us)", "genre": "其他", "source": "其他", "text": "The weather and us\nMoscow\n
