ic": "家人与家庭帮助"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 1", "name": "Read and write", "genre": "说明", "source": "Read and write", "text": "What is the job of Chen Jie's father?\nWhat is the job of Chen Jie's mother?\nWhat do you do with your family?\nI often ...\noffice worker\nfarmer\ndoctor\nfactory worker", "topic": "家人职业与家庭活动"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 1", "name": "Project: Make a poster of a happy family", "genre": "说明", "source": "Read and write", "text": "I have a happy family. My mother is a/an ...\nWe often ... together. My father is a/an ...\nMake a poster of your family.\nShare your poster in class.\nMy mother is a/an .\nWe often together.\nI have a .\nI can look after .\nMy father is a/an .\nWe often together.", "topic": "家庭海报与家庭介绍"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 1", "name": "每日巧手菜：小猫煎蛋", "genre": "故事", "source": "Reading", "text": "每日巧手菜：小猫煎蛋\nMum is very busy.\nWe can help her at home.\nWe want to make this.\nBut now we have this!\nMum is still happy! She's a great mum!", "topic": "家庭帮助与亲情"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 3", "name": "My favourite place is the museum", "genre": "短文", "source": "Read and write", "text": "My favourite place is the museum.\nThere are many old things and photos. I can read stories about them.\nI can \"hear\" them too! There is also a nice shop. People buy gifts and books there.\nThe museum is in a nice park. We often play in the park. I love that museum!", "topic": "介绍最喜欢的社区场所——博物馆"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 3", "name": "Peter's video diary", "genre": "日记", "source": "Reading", "text": "Hi! I'm Peter. My family moved to Chengdu.\nThis is my video diary.\nHi! I'm Xiao Lin.\nWhat's your name?\nHi! I'm Peter. I'm from London. It's my first day here.\nNice to meet you!\nYou're a good player.\nThanks. You too.\nWould you like some vegetables?\nYes, please.\nThanks, Xiao Lin.\nThere's a baby panda.\nOh yes! Do you like pandas?\nYes, I do. They're so cute!\nBianlian is great!\nThere are nice people and great places here. I love Chengdu! Bye for now!", "topic": "新搬来成都的男孩彼得与小林相识并介绍成都"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 3", "name": "Project: Make a dream community model", "genre": "剧本", "source": "其他", "text": "Binbin and Amy are talking about their dream communities. Listen, tick and match.\nWhat is in your dream community? Talk and draw.\nThis is my dream community.\nThere is ... People often ...\nThere are ... People often ...", "topic": "制作梦想社区模型并介绍"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 3", "name": "There is a playground. Children can have fun there.", "genre": "短文", "source": "其他", "text": "There is a playground.\nChildren can have fun there.\nThere is a shop in our dream community. People can go shopping there.", "topic": "梦想社区里的场所"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 1", "name": "Reading time", "genre": "故事", "source": "Reading", "text": "My mum is a writer.\nShe writes a lot of good books.\nMum is also a great cook.\nShe can cook great food!\nMum is very busy.\nWe can help her at home.\nWe want to make this.\nBut now we have this!\nMum is still happy! She's a great mum!", "topic": "家庭与帮助家人"}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 1", "name": "Helping hands in class", "genre": "短文", "source": "Read and write", "text": "Helping hands in class\nWe have some class rules. We put up our hands to speak. We turn off the lights after school. When we don't understand, we say, \"Excuse me?\"\nWe also have some jobs. Some of us make wall newspapers. Some of us keep our classroom clean and tidy. Some hand out the workbooks. We all help make our classroom great!", "topic": "课堂规则与班级任务"}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 1", "name": "Project: Make signs for class rules", "genre": "剧本", "source": "其他", "text": "Look at this sign.\nWhat rule is it?\nKeep the classroom clean.\nYes, you're right! Let's put it on the wall.\nOK.\nLet's put them on the classroom wall.\nStep 3\nStep 4\nMake some signs for your class rules.\nShare your signs in class.\nStep 1\nDon't              Please\nStep 2\nLet's make some signs.\nOK.", "topic": "制作课堂规则标志"}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 2", "name": "Rules at home", "genre": "短文", "source": "Read and write", "text": "Rules at home.\nThey keep us safe.\nDon't run! Don't bounce the balls!\nListen to what Mum and Dad say.\nRules at home.\nThey make us happy.\nDon't make a mess! Think of others!\nUse nice words and speak kindly.", "topic": "家庭规矩"}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 3", "name": "Reading time", "genre": "故事", "source": "其他", "text": "Sam, time for bed.\nHurry up, Sam!\nYour music class will begin soon.\nCan I go to bed late tonight? It's Friday.\nOK, but not too late.\nIt's 10 o'clock now. Go to bed, Sam!\nOK, Mum.\nOK, Mum.\n4 Oh no! I'm in the wrong class!\nThis is Sarah's class code.\nSarah, what time is it?\nWhat's that noise?\nIt's my watch alarm.\nIt's 8:20. Time for my music class.\nMum, it's 1 o'clock now.\nThe film is at 2 o'clock.\nWe should go soon.\nI see. What time is it now?\nWow! You plan things well now.\nIt's 9 o'clock.\nOh, it's time to go to bed.", "topic": "时间管理与作息"}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 3", "name": "Read and write", "genre": "说明", "source": "Read and write", "text": "Make your weekend schedule.\nStep 1\nChoose a way to keep to your schedule.\nStep 2\nThis is my weekend schedule. I ...\nAt 3:50, it's time to do sports.\nMy friend often calls me at ...\nTime\n7:40 a.m.\na.m.\n3:50 p.m.\np.m.\nActivity\nget up\ndo sports\nWhat time is it?\nOh, it's time to do sports.", "topic": "制作周末作息表"}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 3", "name": "Project: Make a weekend schedule", "genre": "说明", "source": "Read and write", "text": "Project: Make a weekend schedule\n• get up\n• go to bed\n• have breakfast\n• play football\n• play maths games\n• read English storybooks\nHow can we keep to our schedule?\nAsk friends to help.\nOften check the schedule.", "topic": "周末作息表项目"}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 3", "name": "Reading time", "genre": "故事", "source": "其他", "text": "Sam, time for bed.\nHurry up, Sam!\nYour music class will begin soon.\nCan I go to bed late tonight? It's Friday.\nOK, but not too late.\nIt's 10 o'clock now. Go to bed, Sam!\nOK, Mum.\nOK, Mum.\n4 Oh no! I'm in the wrong class!\nThis is Sarah's class code.\nSarah, what time is it?\nWhat's that noise?\nIt's my watch alarm.\nIt's 8:20. Time for my music class.\nMum, it's 1 o'clock now.\nThe film is at 2 o'clock.\nWe should go soon.\nI see. What time is it now?\nWow! You plan things well now.\nIt's 9 o'clock.\nOh, it's time to go to bed.", "topic": "时间管理与作息"}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 4", "name": "A girl buys a pretty skirt", "genre": "故事", "source": "其他", "text": "A girl buys a pretty skirt.\nShe sees a bird—it's hurt.\nFirst she thinks, then helps the bird.\nNow the girl needs a new skirt!", "topic": ""}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 4", "name": "Dear Mike", "genre": "书信", "source": "Read and write", "text": "Dear Mike,\nHere's your shopping list.\nDon't buy socks! You have a lot of socks!\nMum\nSunglasses\nBuy a nice and cheap pair.\nShorts\nBuy two pairs. Try them on first.\nA hat\nFind your size. You can choose any colour.", "topic": ""}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 4", "name": "Dad, I love the red bike", "genre": "故事", "source": "其他", "text": "Dad, I love the red bike.\nCan I save up my money and buy it?\nYes. That's a great idea, Ben.\nMum, Dad! I can buy the red bike soon.\nOh no! The red bike is not here.\nI'm sorry.\nTwo months later\nWow! It's the red bike!\nYou work hard and often help Mum and me. This is our special gift for you.\nThank you so much, Dad!\nI will, Dad. Thanks.\nI still have all this money.\nPlease take it!\nNo. It's your money. Save it for a rainy day.", "topic": ""}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 6", "name": "Reading time", "genre": "说明", "source": "Reading", "text": "There are many farms around us. Let's look at some of them. They can show us new ways to grow food.\nLook! On this farm there is a robot farmer. It is planting potatoes.\nThose robots are picking tomatoes very quickly.\nThis robot does the work of bees. It helps plants grow fruit.\nThis farm is very big and high. It grows many vegetables without soil.\nWe have many farms, but there are so many people in the world. Don't waste your food. Help save food for others.\nI can do a lot of work on the farm!", "topic": "现代农场与节约粮食"}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 6", "name": "Read and write", "genre": "短文", "source": "Read and write", "text": "Where do you get your tomatoes?\nIn a supermarket? At a farm? Chen Jie grows them by herself. She has a small \"garden\" at home. Spring is a good time to plant tomatoes.\nChen Jie waters the tomato plants every week. In summer, Chen Jie picks the tomatoes. She makes a salad and eats it with her family. It's so delicious!", "topic": "在家种西红柿"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 1", "name": "The Magic Teacher", "genre": "说明", "source": "Read and write", "text": "Everyone can draw pictures. But can you make your pictures come to life? Mr Zhang will draw a lovely rabbit, and it will come to life in front of your eyes!\nJumping rope is easy and fun. Meet the jumping stars: John and Amy. They are wonderful jumpers!\nBinbin loves music. He can play the piano and the pipa! Come and listen!\nRobin is a clever robot. He is good at playing Chinese chess. Can you play Chinese chess? Come and play with him!", "topic": "才艺表演者介绍"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 1", "name": "Reading time", "genre": "对话", "source": "Reading", "text": "We have a new student in our class today. Her name's Grace.\nGrace is so lovely and friendly.\nIs she strong? Can she play football?\nYes. I like her.\nI don't know.\nBut she can't play football with us. What a pity!\nClass, this is Grace.\nHi, everyone. Nice to meet you all!\nGreat! We need a poster for the match.\nCan you draw, Grace?\nYes, I can draw really well.\nYes. The poster is great!\nThank you for your help, Grace.\nYou're welcome.\nHey, everyone! Our football match is next week.\nWhat a goal!\nWe won! Hooray!\nHooray!", "topic": "新同学与足球比赛"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 2", "name": "Jim's email and Mike's reply", "genre": "邮件", "source": "Read and write", "text": "Dear Mike,\nI am happy at school. I have many friends. I play with them in the playground, and we share ideas in class. We laugh and study together all day. I enjoy school.\nBut my family just moved to a new home. I have no friends there. I feel sad. I don't want to tell my parents. I don't want them to feel bad.\nWhat can I do? Can you help me?\nYours,\nJim\nDear Jim,\nDon't feel sad. You can . You can also . It is OK to feel bad sometimes. It is always good to share your feelings.\nYours,\nMike", "topic": "感受与求助"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 2", "name": "Benjy and the snow", "genre": "故事", "source": "其他", "text": "Me too. Let's go out and play.\nIt's snowing. I'm so excited!\nBenjy looks worried.\nThis is his first snow!\nCome on, Benjy! Don't be afraid. It's important to try new things!\nBenjy doesn't look happy.\nHe's cold.\nHe needs to exercise.\nLet's play with him.\nGood idea!\nHe's happy now. I think he likes the snow.\nYes, he's not afraid now.\nBenjy, come inside.\nDon't worry, Benjy. We can play in the snow again tomorrow!\nHe looks sad. He still wants to play outside.", "topic": "感受与鼓励"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 3", "name": "Eric and Li Xia's letters to Miss White", "genre": "书信", "source": "Read and write", "text": "Dear Miss White,\nOn Monday, Tuesday and Friday evenings, I play football. I often watch TV on Wednesdays and Thursdays.\nOn Saturdays and Sundays, I play basketball and go running. I am so busy. I don't have much time to study.\nEric\n\nDear Miss White,\nI play ping-pong with Binbin on Mondays and Thursdays. On Tuesdays, I cook dinner because my mother works on Tuesday nights. On Wednesdays and Fridays, I usually read books. At the weekend, I often play with my friends in the park or visit my grandparents. I am busy, but I always do my homework on time!\nLi Xia", "topic": "课后活动与工作与娱乐的平衡"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 3", "name": "Ron's timetable", "genre": "说明", "source": "Read and write", "text": "1. is Ron's favourite day. He has , English, and PE.\n2. Ron usually visits his grandparents on .\n3. Ron does his homework on Sunday mornings. He and in the afternoon.\n4. Ron doesn't at the weekend.", "topic": "罗恩的日程安排"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "name": "Oliver is at home now", "genre": "对话", "source": "Read and write", "text": "Oliver is at home now. Listen and tick.\n1. How is Oliver feeling now?\n2. What would Oliver like to drink?\nOliver:  Mum, I'm hungry.\nMum:  What would you like to eat?\nOliver:  I'd like beef and rice.\nMum:  No problem. Would you like some\nchicken soup too?\nOliver:  Yes, please.\nMum:  You should also have some salad.\nVegetables are good for you.\nOliver:  OK. Can I have some ice cream, please?\nMum:  Yes, but just a little.\nOliver:  OK. Thanks, Mum.", "topic": "点餐与饮食建议"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "name": "Mrs Green and Binbin talk about coconuts", "genre": "对话", "source": "Read and write", "text": "Mrs Green:  What's your favourite fruit, Binbin?\nBinbin:  Coconuts are my favourite.\nMrs Green:  Why do you like coconuts?\nBinbin:  Because coconut water is nice.\nAnd it's healthy.\nMrs Green:  We can also cook delicious meals\nwith coconut.\nBinbin:  Yes! And some people make houses\nwith coconut tree leaves.\nMrs Green:  That's interesting. Where does your coconut come from?\nBinbin:  Hainan! There are many coconut trees there.", "topic": "水果与产地"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "name": "The history of tea", "genre": "短文", "source": "Reading", "text": "At first, people didn't drink tea. But they did eat tea leaves!\nThe history of tea\nLater, more people began to drink tea. There were many\ndifferent kinds of tea. People put tea leaves in hot water to\nmake a drink.\nTea was first popular in China. Then it travelled to Japan\nand other countries. In the 1700s, tea became popular in the UK.\nHow can I make a\ngood cup of tea?\nWater is very\nimportant.\nIn China, some people like to cook chicken and eggs with\ntea leaves. They make cakes and ice cream with tea too!\nNow, tea is popular all over the world. There is green tea,\nblack tea, flower tea …... The", "topic": "茶的历史与种类"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "name": "The lotus plant", "genre": "说明", "source": "Read and write", "text": "Lotus flowers are very\nbeautiful. They have many\ncolours. Lotus plants grow\nin lakes around the world. It\nis also a great plant to eat.\n•\nLotus seeds are small\nand round. We can cook\nand eat them in different\nways.\n•\nWe eat lotus roots. The\nbig brown and yellow\nroots are delicious.\nThere are many ways\nto cook them.\n•\nLotus leaves are big,\nround and green. We can\neat the young leaves.\nWe can also cook rice in\nthe leaves.\n•\nThe lotus plant\nThe part of the plant\nWhat it looks like\nHow people use it\nThe lotus plant\nRead and answer.\nRead and say.\nRead and fill in the table.", "topic": "莲植物的各部分与用途"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "name": "See how a carrot grows", "genre": "说明", "source": "Read and write", "text": "First, we plant the\nin spring or autumn.\nThen a\nwill grow from the seed.\nNext, the\nwill grow big and strong.\nWe eat this part of a carrot.\nFinally, we will pull up the carrot by the\nand\n.\nSee how a carrot grows. Complete the sentences\nand talk.\nPrepare for a presentation.", "topic": "胡萝卜的生长过程"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "name": "What to eat / What to drink", "genre": "图表说明", "source": "Read and write", "text": "What to eat\nWhat to drink\nName\nrice,\n, carrots\nBinbin\ntea\nChen Jie\n, a vegetable salad\nMike\nChoose a plant you want to talk about.", "topic": "饮食记录表"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 6", "name": "Welcome to River Nature Park", "genre": "说明", "source": "Read and write", "text": "Welcome to River Nature Park\nThere are many rivers and big trees here.\nThere are a lot of fish in the rivers. You can go boating on the river with your friends.\nThere is heavy rain in summer. Sometimes there are floods too. Check the weather report before you go.", "topic": ""}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 6", "name": "Welcome to Mountain Nature Park", "genre": "说明", "source": "Read and write", "text": "Welcome to Mountain Nature Park\nThere are many mountains, and there is a big forest. It is a great place to hike or walk your dog.\nThere is often heavy fog on spring mornings. Don't go into the forest then. In autumn, it is often windy. Be careful of fires.", "topic": ""}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 6", "name": "Welcome to Waterfall Nature Park", "genre": "说明", "source": "Read and write", "text": "Welcome to Waterfall Nature Park\nThere is a big waterfall here. You can take pictures of your family near the waterfall.\nIt is very cold in winter. Sometimes there is heavy snow. Check the weather report before you go.", "topic": ""}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Revision", "name": "New Year's party", "genre": "对话", "source": "Read and write", "text": "Miss White:  Children, New Year's Day\nis coming. Let's have a\nclass party. What can\nyou do for the party?\nZhang Peng:  I can draw pictures.\nBinbin:  I can choose the music\nfor the party.\nAmy:  Let's play the piano\ntogether, John.\nJohn:  Great idea!\nMiss White:  Wonderful!\nChen Jie:  Oliver and I are in the\nCooking Club. We can\nmake some food for the\nparty.\nMike:  Sarah, Liu Jia and I are\nin the Drama Club. We\ncan put on a play.\nBinbin:  I want to tell a story.\nMiss White:  It's time for English class.\nLet's talk about it later.", "topic": "班级新年派对准备"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Revision", "name": "Miss White's note", "genre": "书信", "source": "Read and write", "text": "Dear students,\nOur New Year's party is next Monday. I can see you are all\nvery excited. I am too. I have some tips for you:\n1. Plan your time well.\nYou need to prepare for the party. There will also be tests\non Wednesday and Friday. You are very hard-working, but don't\nforget to rest.\n2. Stay healthy.\nIt is flu season. You should get enough sleep. You should also\neat healthy food and drink enough water.\n3. Don't be afraid to ask for help.\nIf you have any problems, don't worry. Everyone has problems.\nYou can always talk to your parents, and you can ask me for help\ntoo.\nYours,\nMiss White", "topic": "新年派对前的建议"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Revision", "name": "Bingo", "genre": "其他", "source": "Read and write", "text": "Date: 1 January\nTime: 2:00 p.m.\nPlace:\nActivities\nFood and drink\nFour in a row?\nSay \"Bingo!\"\n1.\n2.\n3.\nRead and group the words.\nChoose 16 words from above and write them in the boxes below.\nWrite a different word in each box.\nListen and cross out the words you hear.\nautumn  beef  book  coat  day  draw  goat  know  lie\nnight\nplay  rain\nright  see\nslow\ntalk\ntea\ntoo\nplay the piano,\nPlay Bingo.\nMake a poster.", "topic": "宾果游戏与单词分类"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Revision", "name": "Students in the Drama Club", "genre": "剧本", "source": "Short plays", "text": "Students in the Drama Club are practising.\n■ What do you see in the pictures?\n■ What bad weather can you name?\n■ What should people do in bad weather?\nScene 1: Plants are wonderful!\nScene 2: Nature is beautiful!\nScene 3: Nature is powerful!", "topic": "戏剧俱乐部排练"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Revision", "name": "Binbin's story", "genre": "故事", "source": "Short plays", "text": "What would\nyou like to eat?\nMy seeds can fly.\nI have a long,\nstraight stem.\nBill is a good boy,\nbut he ...…\nOliver and Chen Jie are doing\na survey.\n■ What food are they talking\nabout?\nBinbin is practising his story.\n■ What is Bill like?\n■ How do Bill and his pets feel in each\npicture?\nDoes every plant\nhave leaves?\nLook, think and talk.", "topic": "彬彬的故事与植物调查"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Revision", "name": "Bill's story", "genre": "故事", "source": "Short plays", "text": "Bill is a good boy,\nbut he ...…", "topic": "比尔的故事"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 1", "name": "Robinson's letter", "genre": "书信", "source": "Read and write", "text": "My name is Robinson. I live on an island. I always get up early every day. I wash my face, and then I eat breakfast. Sometimes I clean my cave, too.\nI often go swimming in the water. In the afternoon, I play sports with my friend. His name is Friday.\nFriday is good at sports. He often wins.", "topic": "介绍自己的日常活动"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 2", "name": "The Four Seasons", "genre": "诗歌", "source": "Let's read", "text": "Spring is green with flowers and songs.\nSummer is hot and the days are long.\nAutumn is golden and farmers are busy.\nWinter is white and the year is gone.", "topic": "四季"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 2", "name": "Robin's favourite seasons", "genre": "故事", "source": "Let's read", "text": "Look at the green trees and pink flowers.\nThe weather is hot, hot, hot!\nWhat lovely colours! The leaves fall and fall and fall. I love fall!\nThere is lots of snow. It is white everywhere.\nI like spring because there are beautiful flowers everywhere.\nWow! I want to paint a picture, too!\nI like winter because I can play in the snow.\nI like summer, but I can't swim.\nRobin likes them all!", "topic": "四季与喜好"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 2", "name": "Read and write dialogue", "genre": "对话", "source": "Read and write", "text": "Boy: _____________________?\nGirl: ___________.\nBoy: Do you like summer?\nGirl: No, I don't. It's too hot.\nBoy: _________________________?\nGirl: ___________. The colours are beautiful. I can pick fresh apples.", "topic": "最喜欢的季节"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 2", "name": "Story time: Koala's Christmas", "genre": "剧本", "source": "Story time", "text": "Zip & Zoom: Welcome!\nKoala: Thank you. Merry Christmas!\nZip & Zoom: Merry Christmas!\nZoom: What do you usually do on Christmas Day?\nKoala: I usually go to the beach and swim in the sea!\nZoom: You swim in winter?!\nKoala: Christmas is in summer in Australia, so we never have snow for Christmas.\nZoom: Which season do you like best?\nKoala: Summer. I like sunny days.\nKoala: Wow! A white Christmas!\nZoom: Let's make a snowman.\nZip & Koala: Great!\nZip: Say \"cheese\"!\nKoala: Cheese!", "topic": "圣诞节与季节"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 2", "name": "Story time: Festivals and vacation", "genre": "对话", "source": "Story time", "text": "When is Tree Planting Day?\nThat's very kind of you.\nWhen is Dragon Boat Festival?\nWhen is the summer vacation?\nIt's in March.\nIt's usually in June.\nMy mum will make zongzi then. I hope you can come and share some with us.", "topic": "节日与假期"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 3", "name": "My school calendar", "genre": "对话", "source": "Read and write", "text": "Mike: We have a few fun things in spring.\nAfter the sports meet, we have an English party.\nZhang Peng: When is the party?\nMike: It’s in April. We have a school trip, too.\nZhang Peng: When is that?\nMike: It’s in May.\nZhang Peng: Cool!", "topic": "学校日历与春季活动"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 3", "name": "A birthday party", "genre": "对话", "source": "Read and write", "text": "Oliver: I like autumn. I really like the colours.\nChen Jie: I like autumn, too. We usually have a school trip in autumn.\nOliver: Great! When is the trip this year?\nChen Jie: It’s in October. We’ll go to the Great Wall.\nOliver: Cool! I love the Great Wall!", "topic": "秋天与学校旅行"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 3", "name": "English Party", "genre": "通知", "source": "Read and write", "text": "WHEN:  April 12th, 7 p.m.\nWHERE:  Gym\nWHAT:  You will play games. You will read riddles.\nYou will act out stories.\nYou will meet Robin the Robot.\nHe is a great English teacher!\nRSVP:  Will you come to the party?\nPlease send an email by March 23rd.", "topic": "英语派对通知"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 3", "name": "Zoom and Zip’s summer vacation plan", "genre": "对话", "source": "Story time", "text": "Zoom: Look at my summer vacation plan!\nZip: It’s April now. The summer vacation is still three months away.\nZoom: Early planning is always good.\nZip: What will you do there?\nZoom: We’ll go to Grape Valley. The grapes there are very sweet! Grapes are my favourite fruit!\nZip: You have a great plan, but what will you do this weekend?\nZoom: This weekend?\nZip: There will be a maths test next Monday. So please study hard.\nZoom: Oh my goodness! I forgot!\nZoom: In August, I’ll go to Huangshan Mountain. The trees there are very famous. The clouds are beautiful!\nZip: Sounds great!\nZoom: In July I’ll vis", "topic": "暑假计划"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "name": "When is the art show?", "genre": "对话", "source": "Read and write", "text": "Mr Jones: There are some other special days in May.\nZhang Peng: What are they?\nMr Jones: The school art show and the reading festival.\nZhang Peng: When is the art show?\nMr Jones: It’s on May 1st.\nZhang Peng: It’s Labour Day. When is the reading festival?\nMr Jones: It’s on May 5th.\nZhang Peng: Wow! May is fun!", "topic": "五月的特殊日子"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "name": "Two new kittens", "genre": "日记", "source": "Read and write", "text": "April 15th\nMy cat has two new kittens. They are pink because they are very young. They still can’t see.\nApril 21st\nThe kittens are six days old. They make noises when they are hungry. They have white fur now. They are cute.\nApril 26th\nTheir eyes are open! They are blue.\nMay 3rd\nThe kittens can walk now. They can play with Robin!", "topic": "小猫的成长日记"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "name": "Zoom practises his song", "genre": "剧本", "source": "Story time", "text": "Music teacher: The singing test will be on May 4th.\nZoom: I can’t sing well.\nZip: Don’t worry. Practice makes perfect.\nZip: Will you come to the party? Today is Rabbit’s birthday.\nZoom: Sorry, I can’t. I want to practise my song.\nRabbit: Will you play football with me after lunch?\nZoom: Sorry, I can’t. I want to practise the song.\nCat: Let’s watch TV together. The show is very funny!\nZoom: Sorry. I need more practice.\nMusic teacher: Good job, Zoom.\nZoom: Thank you, Miss Bird.\nCat: I’ll go swimming tonight. Will you go?\nZoom: Of course!", "topic": "Zoom练习唱歌"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "name": "Whose dog is this?", "genre": "对话", "source": "Story time", "text": "Wow! What a beautiful painting! Is it yours?\nOh, it’s mine. He’s sleeping. He’s very tired.\nHey! Whose dog is this?\nNo. It’s his.", "topic": "画中的狗"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "name": "Chen Jie and Mike talk about birthdays", "genre": "对话", "source": "Let's read", "text": "Chen Jie: When is your birthday?\nMike: My birthday is on April 4th.\nChen Jie: That’s my mother’s birthday, too!\nMike: Cool! What will you do for your mum?\nChen Jie: I’ll cook noodles for her.\nMike: Chinese noodles are delicious!\nChen Jie: Please come then. We can have a birthday party for both of you!", "topic": "生日与计划"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "name": "When is your birthday?", "genre": "对话", "source": "Let's read", "text": "When is your birthday?\nThat’s New Year’s Day!\nMy birthday is on January 1st.", "topic": "生日与新年"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "name": "When is Grandpa’s birthday?", "genre": "对话", "source": "Let's read", "text": "When is Grandpa’s birthday?\nIt’s on October 12th.\nWhen is your birthday?\nMy birthday is on March 21st.", "topic": "生日日期"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "name": "When is the sports meet?", "genre": "对话", "source": "Let's read", "text": "When is the sports meet?\nWhen is the English test?\nIt’s on November 2nd.\nIt’s on April 5th.", "topic": "学校活动日期"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "name": "When is Mid-Autumn Festival this year?", "genre": "对话", "source": "Let's read", "text": "When is Mid-Autumn Festival this year?\nA birthday cake for Mid-Autumn Festival?!\nWhat do you usually do on Mid-Autumn Festival?\nWe eat mooncakes.\nMy family will also eat a birthday cake.\nSeptember 27th.\nCool!\nMy cousin’s birthday is on Mid-Autumn Festival this year!", "topic": "中秋节与生日"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "name": "When is China’s National Day?", "genre": "对话", "source": "Let's read", "text": "When is China’s National Day?\nIt’s on October 1st.", "topic": "国庆节"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "name": "When is the art show?", "genre": "对话", "source": "Let's read", "text": "When is the art show?\nMay 1st\nart show\nMay 5th\nreading festival\nMarch.\nApril.\nSeptember.\nFebruary.\nChildren’s Day\nJanuary 1st\nLabour Day\nMay 1st\nChina’s National Day\nJune 1st\nNew Year’s Day\nOctober 1st", "topic": "特殊日子与月份"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "name": "When is the art show?", "genre": "对话", "source": "Let's read", "text": "Mr Jones: There are some other special days in May.\nZhang Peng: What are they?\nMr Jones: The school art show and the reading festival.\nZhang Peng: When is the art show?\nMr Jones: It’s on May 1st.\nZhang Peng: It’s Labour Day. When is the reading festival?\nMr Jones: It’s on May 5th.\nZhang Peng: Wow! May is fun!", "topic": "五月的特殊日子"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "name": "When is the art show?", "genre": "对话", "source": "Let's read", "text": "Mr Jones: There are some other special days in May.\nZhang Peng: What are they?\nMr Jones: The school art show and the reading festival.\nZhang Peng: When is the art show?\nMr Jones: It’s on May 1st.\nZhang Peng: It’s Labour Day. When is the reading festival?\nMr Jones: It’s on May 5th.\nZhang Peng: Wow! May is fun!", "topic": "五月的特殊日子"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 5", "name": "Robin at the zoo", "genre": "故事", "source": "Read and write", "text": "Sarah and Robin are at the zoo.\nRobin is excited!\nWhat are you doing here, Robin?\nRobin, do you want to swim like a fish?\nNo! No! I don't want to be a fish!\nI'm looking at a bear. I'm dancing like a bear.\nI'm looking at a tiger. I'm running like a tiger.\nI'm looking at a monkey. I'm climbing like him.\nI'm looking at the rabbits. I'm eating like a rabbit.\nI'm looking at an elephant. I'm walking like an elephant.\nI'm looking at a bird. I like flying. I want to be a bird!", "topic": "在动物园里模仿动物"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 5", "name": "Zoom and Zip at the zoo", "genre": "对话", "source": "Story time", "text": "Zoom: What are they doing?\nZip: Why are they looking at us?\nZoom: I don't know.\nZip: Look! They're taking pictures, too.\nZoom: That's cute. They're copying us!\nZoom: Whose tail is that?\nIt's running so fast.\nIs it the tiger's?\nZip: Yes, it is.\nZip: Here comes a tiger.\nZoom: Where is it?\nZip: Shh. Be quiet.\nZip: I see two monkeys.\nZoom: Where are they?\nZip: Shh. They're climbing.\nZoom: Wow! They're fast, too.\nZoom: Ah-choo!", "topic": "在动物园观察动物"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 6", "name": "Story time", "genre": "对话", "source": "Story time", "text": "Zip: I love the film.\nZoom: Yes. The gorilla is great!\nZip: Wow! The gorilla is eating a banana.\nZoom: It’s so big and strong.\nZip: What’s that noise?\nZoom: I’m eating popcorn.\nZip: It’s so exciting!\nZoom: Yes, it is!\nZip: Look at the sign.\nZoom: Oh, no!\nTiger: Shh! Talk quietly!\nZoom: Sorry!", "topic": "在电影院看电影时保持安静"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 6", "name": "Read and write", "genre": "短文", "source": "Read and write", "text": "Fill in the blanks.\n1. It’s 7:00 a.m. We ______ ______ ______ at 7 o’clock.\n2. I sometimes clean my bike on the weekend. I ______ ______ it now.\n3. It’s 9 p.m. They ______ ______ now, but they often go to bed at 10 p.m.", "topic": "用现在进行时填空描述正在做的事情"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 6", "name": "Recycle 2", "genre": "短文", "source": "Reading", "text": "Mike is at summer camp. What will he do? Listen and match.\nMike’s mum: Be a good boy. _________________________.\nA. Work quietly     B. Keep your room clean\nC. Talk quietly", "topic": "夏令营中的行为规范"}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 2", "name": "Mike and Matt are having breakfast", "genre": "对话", "source": "Read and write", "text": "Mike and Matt are having breakfast. Listen and write T (True) or F (False).\n1. Matt knows about mooncakes. (      )\n2. Mike's father bought the mooncakes. (      )", "topic": "中秋节"}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 3", "name": "Liu Jia's letter and story", "genre": "故事", "source": "Read and write", "text": "Liu Jia was crying. So Miss White asked her, \"What's the matter, Liu Jia? You look sad.\"\nLiu Jia answered, \"I'm feeling down. My good friend Lucy moved to another city.\"\nMiss White listened carefully and told Liu Jia, \"Think about happy things. Call your friend or send her some emails.\"\n\"I tried that, but I still feel unhappy,\" said Liu Jia.\nMiss White gave her a glass of water.\n\"Maybe you can do some exercise. Exercise may cheer you up!\"\n\"Join some after-school clubs and make new friends! You can talk and have fun with them,\" added Miss White.\n\"I will try. Thank you, Miss White,\" said Liu Jia", "topic": "如何保持心理健康"}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 4", "name": "Our winner", "genre": "短文", "source": "Read and write", "text": "The winner is my good friend,\nChen Jie. She's a 12-year-old\ngirl from Class One, Grade Six.\n\nChen Jie has her special way to manage money. She writes a\nspending plan every Sunday. Every week, she gets her pocket money.\nShe also gets some money from selling old things. She keeps her\nmoney in three money jars. Jar 1 is money to spend. She uses this\nmoney to buy goods, like books. She also uses it to pay\nfor services, like haircuts. Jar 2 is money to share. She\nuses this money to buy gifts, for example, birthday\ngifts for her family. Jar 3 is money to save. Chen Jie\nputs money there to save up fo", "topic": "管理金钱"}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 4", "name": "Reading time", "genre": "说明", "source": "Reading", "text": "A long time ago, people exchanged\ngoods or services. Sometimes it\nwas difficult to get the things they\nwanted.\n\nMetal coins were heavy to carry.\nSo people used paper money.\n\nLater, people used different forms\nof money. But what did the money\nlook like? Look! There was shell\nmoney, knife money, copper coins, ...\n\nWe still use pape", "topic": "货币的历史"}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 5", "name": "In space", "genre": "短文", "source": "Read and write", "text": "Chinese astronauts are called taikonauts. Their life in space is special.\nThe taikonauts get up early in the morning. But getting ready in space is different. They can't use water to wash their faces. So taikonauts have to use a wet cloth. They brush their teeth with a special toothpaste and have to \"eat\" it!\nEach day the taikonauts are very busy. They do a lot of work. For example, they grow vegetables and rice. Sometimes, they also give classes to children and answer questions about space.\nIt is hard work. The taikonauts must stay healthy. Every afternoon they do exercise to keep healthy and", "topic": "中国航天员在太空中的生活"}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 6", "name": "Green Energy", "genre": "说明", "source": "Read and write", "text": "Green Energy\nWhat green energy do you know?\nWind power, solar power and water power are types of green energy.\nHow do we use it?\nWe use green energy to light, heat and cool our homes and schools.\nWe also use it to run cars, buses and trains.\nMany resources will run out. How can we save energy?\nWe should follow the \"3R\" rules. We can reduce energy use, reuse things, and recycle old clothes, toys and books.", "topic": "绿色能源与节约能源"}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 6", "name": "Letter to the Editor", "genre": "书信", "source": "Read and write", "text": "Dear readers,\nHow can we help Mother Earth? We want good ideas from our readers. Please write to us and share your ideas and tips. Thank you.\nSincerely,\nThe Editor\n\nDear Editor,\nWe are running out of resources, but it is not too late. We can do things to change this. Here are my ideas.\nTips to save energy and resources:\n1.\n2.\n3.\nSincerely,", "topic": "给编辑写信分享节约能源的建议"}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 6", "name": "Reading time", "genre": "故事", "source": "Reading", "text": "It was a sunny day. Grandpa, Binbin and Robin played outside.\nT", "topic": "户外玩耍"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 1", "name": "Little Duck is watching the sun go down", "genre": "故事", "source": "Read and write", "text": "Little Duck is watching the sun\ngo down. It is getting lower and\nlower, but his shadow is getting\nlonger and longer.\n\"Why is that?\" Little Duck asks\nhis friend Old Tree. \"You are\nolder and smarter than me. Tell\nme — why is my shadow longer\nwhen the sun gets lower?\"\nOld Tree says,\n\"That’s easy, Little\nDuck. The sun goes\ndown every day, and\nwe grow older every\nday. Your shadow\ngrows longer because\nyou are growing taller.\nYou are becoming a big\nbeautiful bird!\"\nCan you answer Little\nDuck’s question, Robin?", "topic": "影子变长与成长"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 1", "name": "Football needs teamwork", "genre": "剧本", "source": "Story time", "text": "Zebra: They need a new\ngoalkeeper.\nDeer: I’d like to have a try.\nGiraffe: Me too.\nDog: I can’t wait.\nZoom: How tall are you?\nDeer: I’m 1.8 metres.\nZip: How heavy are you?\nDeer: I’m 86 kilograms.\nZip: Mr Zebra is 10\ncentimetres taller than\nMr Deer.\nZoom: Yes, and he’s stronger.\nBut he can’t catch the ball!\nGiraffe: I’m the tallest one.\nZip: Sorry. Your neck is\ntoo long. The others\ncan’t reach you.\nFootball needs\nteamwork.\nHippo: What’s happening here?\nZip: Oh! Here’s the one\nwe want!\nZoom: Why? He’s too heavy!\nZip: We need a big guy!\nZoom: Oh! He’s almost bigger\nthan the goal!\nDog: Yes! He’s an", "topic": "选守门员与团队合作"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 1", "name": "Wu Binbin and his family are going on a trip to the countryside", "genre": "其他", "source": "Read and write", "text": "Spring is coming! The sky is clearer and the sun is\nbrighter. Can you think of any other changes? Look\nand tick.\nWu Binbin and his family are going on a trip to the\ncountryside. Wu Binbin has a story to tell Robin.", "topic": "春天的变化与旅行"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 1", "name": "Mike and Wu Binbin are talking about the weekend", "genre": "其他", "source": "其他", "text": "Mike and Wu Binbin are talking about the weekend.\nListen and circle.", "topic": "周末计划"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 3", "name": "Wu Binbin's diary", "genre": "日记", "source": "Read and write", "text": "Saturday, April 23rd\nToday was a sunny day. In the morning, we rode a bike for three people. Max sat in a basket on the front of the bike.\nThat was fun! We took pictures of the beautiful countryside.\nWe bought some gifts and ate some delicious food.\nIn the afternoon, Mum ate some bad fruit and didn’t feel well. So we stayed in the hotel. Dad and I wanted to make her happy. We dressed up and made a funny play. Robin played the part of a dog. He was so cute. Max liked him so much. He jumped on him and licked him. Of course, Robin didn’t like it.\nWe laughed and laughed.\nIt was a bad day but also ", "topic": "难忘的一天"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 3", "name": "Zoom and Zip on the moon", "genre": "对话", "source": "Story time", "text": "Zoom: Am I now on the moon? I can’t believe it! She must be Chang’e.\nOh, there is the rabbit.\nZip: Where did you go?\nZoom: I went to the moon.\nZip: How did you go there?\nZoom: By spaceship.\nZip: What did you see?\nZoom: I saw Chang’e, the rabbit and the tree.\nZip: Did you take any pictures?\nZoom: Yes, I did. Oops, where did I put the pictures?\nZoom: Oh, it was a dream.\nZip: How was your holiday?\nZoom: It was fun.\nZoom: It’s time to go.\nGood! Here comes a spaceship.", "topic": "月球之旅"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 4", "name": "What a dream!", "genre": "故事", "source": "Read and write", "text": "Wu Binbin had a race with his father and Max. There were many people there. His father ran very fast, but Wu Binbin could not.\nThere was nothing he could do. He was so worried. \"I could run fast at school,\" he thought. \"Why am I so slow now?\"\nThen Robin said, \"Drink this!\" and gave Wu Binbin some water. Wu Binbin drank it and suddenly he felt good. He could run fast again.\nThere was a second race. There were many animals in that race.\nWu Binbin ran like a cheetah. He could win the race! But suddenly he tripped and fell. Then he woke up. He was in bed. It was all a dream!", "topic": "梦境与比赛"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Recycle", "name": "Mike's happy days", "genre": "故事", "source": "Story time", "text": "Saturday was a busy day for me.\nIn the morning, I got up early.\nThen I __________________.\nAfter that, I _________________.\nNext, I __________________.\nIn the afternoon, I _______________.\nIn the evening, I ________________.\nFinally, I __________________ at 10 p.m.", "topic": "描述星期六一天的活动"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Recycle", "name": "Mike's PPT about his school life", "genre": "说明", "source": "Read and write", "text": "I go to school from Monday to Friday.\nMy favourite day is Monday.\nIn English class, I read many English stories, and I like to speak English with my friends.\nOn Monday I have maths, English, music and PE. I like PE best.\nI play the piano or sing songs in music class. This is very noisy and often great fun.\nMaths is my first class. I often answer maths questions. Sometimes they're difficult.\nIn the afternoon I have PE class. I sometimes play football or exercise in the gym. I'm not good at running, but I like football best!", "topic": "描述学校生活"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Recycle", "name": "A farewell party", "genre": "邮件", "source": "Read and write", "text": "Dear Friends,\nIt is time to leave our school. We are all going to middle school soon, so we will say goodbye to each other. We are going to have a farewell party. You can bring your friends.\nPlace: Our music room     Time: Friday  3 p.m.\nActivities:\nWe will draw pictures and sing songs. We are going to give prizes for the best pictures. We are going to have cake, candy and juice, too. Yum!\nWe will also give many prizes to our good students. For example, who helped others the most? Who studied hard? Who wrote the best story?\nWe will listen to music, play games and dance. It will be great fun.\nS", "topic": "告别派对邀请"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Recycle", "name": "Zip and Zoom", "genre": "对话", "source": "Story time", "text": "Zip: I have some good news and some bad news.\nZoom: What is it?\nZip: I'm going away for a long time.\nZoom: I'm sorry to hear that.\nZoom: Where are you going?\nZip: America. My father has a new job there.\nZoom: That is good news for your father. It's sad news for me.\nZip: Me too.\nZoom: Are you going to a new school?\nZip: I'm going to a new middle school. I'll be in Grade 7.\nZoom: Will you promise to write to me?\nZip: Of course.\nZoom: Take care.\nZip: Take care.", "topic": "告别与未来"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Recycle", "name": "Mike and his new friends: Part 1", "genre": "说明", "source": "Read and write", "text": "1. Mike likes Monday best. His favourite class is English.\n2. English is his first class on Monday. He reads many English stories, and he likes to speak English with his friends.\n3. In the maths class, Mike often answers very difficult maths questions.\n4. In the PE class, Mike sometimes plays basketball or exercises in the gym. He likes basketball best.", "topic": "描述Mike的学校生活"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Recycle", "name": "Mike and his new friends: Part 2", "genre": "说明", "source": "Read and write", "text": "Bill told his friends about Mike. Read and underline the mistakes.\n1. Bill liked candy.\n2. Bill is taller than before.\n3. Bill will wear a red hat to work.\n4. Bill likes to read storybooks.\n5. Bill was smaller before.\n6. Bill will be thinner than he is now.", "topic": "描述Bill的变化"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Recycle", "name": "Mike's surprise", "genre": "说明", "source": "Read and write", "text": "Mike's school sent him an invitation.\ncl\npl        br\nfr         ch              sh         th\nng\nnk\nclock\nbrown bread\ncheese\ncake\nfresh fruit\nmilk\norange juice\ntea bags\nchocolates\nplates\nknives\nforks\nEnglish books\nmaths books\npink party hats\nprizes\npaints\nballoons\nping-pong balls\nclock", "topic": "派对物品清单"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Recycle", "name": "A farewell party", "genre": "说明", "source": "Read and write", "text": "The party is on Friday.\nIt's time to say goodbye.\nWe won't sing any sad songs,\nAnd we'll have lots of fun.\nThe party is on Friday.\nWe'll dance and sing and play.\nDon't be late for the party.\nWe'll have a happy, happy day.", "topic": "派对与告别"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Recycle", "name": "Mike's happy days", "genre": "故事", "source": "Story time", "text": "Saturday was a busy day for me.\nIn the morning, I got up early.\nThen I __________________.\nAfter that, I _________________.\nNext, I __________________.\nIn the afternoon, I _______________.\nIn the evening, I ________________.\nFinally, I __________________ at 10 p.m.", "topic": "描述星期六一天的活动"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 2", "name": "Mike and Grandpa", "genre": "对话", "source": "Read and write", "text": "Mike: Hi, Grandpa. How are you? How was your weekend?\nGrandpa: I’m fine, Mike. It was good, thank you.\nMike: What did you do?\nGrandpa: Well, I stayed at home with your grandma. We drank tea in the afternoon and watched TV.\nMike: I watched TV, too. I watched some children’s shows on TV.\nGrandpa: That’s nice. Did you do anything else?\nMike: Yes, I cleaned my room and washed my clothes.\nGrandpa: You are a good boy!", "topic": "周末活动"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 2", "name": "John and Amy", "genre": "对话", "source": "Read and write", "text": "John: Hey, Amy. Let’s go to the bookstore. I want to buy the new film magazine.\nAmy: Oh, I read it last weekend.\nJohn: Was it interesting?\nAmy: Yes, it talked about a lot of new films.\nWhat did you do last weekend? Did you see a film?\nJohn: No, I had a cold. I stayed at home all weekend and slept.\nAmy: Oh, I’m sorry. I’m happy you feel better now.\nJohn: Thanks. Let’s go by bus. It’s faster than walking.", "topic": "周末活动与身体状况"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 2", "name": "Dear Sir", "genre": "书信", "source": "Read and write", "text": "Dear Sir,\nOur weekend at your hotel was bad. Our room was big but everything was very old. Our friend Robin cleaned our room and fixed a broken chair.\nMy mother wanted to read a book but the lamp was too small.\nMy dad got some hamburgers from the hotel kitchen, but they were cold and tasted bad.\nI wanted to watch TV but the TV didn’t work. The people in Room 301 listened to loud music. I didn’t sleep all night.\nI’m sorry, but we didn’t enjoy our stay very much.\nWu Binbin and family", "topic": "酒店住宿经历"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 2", "name": "Dear Manager", "genre": "书信", "source": "Read and write", "text": "Dear Manager,\nLast weekend, the Wu family were not happy with their room.\nThe people in Room 301 ____________________ all night. It was very noisy. The father ____________________ from the kitchen but ________________________. Also, the mother ____________________ but the lamp ____________________.\nThe TV didn’t work either.\nIt wasn’t a good stay. Maybe we can write an email and say sorry to them.\nMrs Broom", "topic": "酒店住宿投诉"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 2", "name": "Zip and Zoom", "genre": "对话", "source": "Story time", "text": "Zip: How was your weekend?\nZoom: It was a busy one.\nZip: What did you do on Sunday morning?\nZoom: I cleaned my room. Then I visited my grandparents.\nZip: What did you do on Sunday afternoon?\nZoom: I played football. Then I watched TV.\nZip: That was a busy weekend.\nZoom: Yes, it was. Now I need another weekend.\nZip: What did you do on Saturday afternoon?\nZoom: I did my homework. Then I went fishing.\nZip: What did you do on Saturday morning?\nZoom: I washed my schoolbag. Then I went to the park.", "topic": "周末活动"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 2", "name": "You didn’t come to school", "genre": "对话", "source": "Story time", "text": "You didn’t come to school.\nWhat happened?\nOh dear! Are you all right?\nCan I come and visit you?\nYes, I’m OK. Thanks.\nI fell off my bike and hurt my foot.\nSure! You can see my photos from the Labour Day holiday.", "topic": "受伤与问候"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 2", "name": "Mike and Grandpa", "genre": "对话", "source": "Read and write", "text": "Mike: Hi, Grandpa. How are you? How was your weekend?\nGrandpa: I’m fine, Mike. It was good, thank you.\nMike: What did you do?\nGrandpa: Well, I stayed at home with your grandma. We drank tea in the afternoon and watched TV.\nMike: I watched TV, too. I watched some children’s shows on TV.\nGrandpa: That’s nice. Did you do anything else?\nMike: Yes, I cleaned my room and washed my clothes.\nGrandpa: You are a good boy!", "topic": "周末活动"}], "dialogues": [{"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Making friends", "scene": "Let's talk", "function": "问候与介绍", "t ok": "三年级上册", "unit": "Unit 2", "scene": "Reading time", "function": "描述事物", "turns": [{"speaker": "Chant", "en": "This is my family.", "zh": "这是我的家人。"}, {"speaker": "Chant", "en": "I play with my brothers.", "zh": "我和我的兄弟们一起玩。"}, {"speaker": "Chant", "en": "I share with my sisters.", "zh": "我和我的姐妹们分享。"}, {"speaker": "Chant", "en": "I talk with my cousins.", "zh": "我和我的堂/表兄弟姐妹们聊天。"}, {"speaker": "Chant", "en": "We listen with care.", "zh": "我们用心倾听。"}, {"speaker": "Chant", "en": "I have a big family.", "zh": "我有一个大家庭。"}, {"speaker": "Chant", "en": "I love my big family.", "zh": "我爱我的大家庭。"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 3", "scene": "Let's talk (A)", "function": "问候与介绍", "turns": [{"speaker": "Mike", "en": "Good morning, Mike!", "zh": "早上好，Mike！"}, {"speaker": "Mike", "en": "Good morning!", "zh": "早上好！"}, {"speaker": "Mike", "en": "Come in.", "zh": "请进。"}, {"speaker": "Mike", "en": "I like your dog.", "zh": "我喜欢你的狗。"}, {"speaker": "Mike", "en": "Thanks. Do you have a pet?", "zh": "谢谢。你有宠物吗？"}, {"speaker": "Mike", "en": "Yes, I do. I have a dog.", "zh": "是的，我有。我有一只狗。"}, {"speaker": "Mike", "en": "No, I don't.", "zh": "不，我没有。"}, {"speaker": "Mike", "en": "No, I don't.", "zh": "不，我没有。"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 3", "scene": "Let's talk (B)", "function": "描述事物", "turns": [{"speaker": "Miss White", "en": "Miss White, what's that?", "zh": "White老师，那是什么？"}, {"speaker": "Miss White", "en": "Look!", "zh": "看！"}, {"speaker": "Miss White", "en": "What's this?", "zh": "这是什么？"}, {"speaker": "Miss White", "en": "It's a fox.", "zh": "是一只狐狸。"}, {"speaker": "Miss White", "en": "Great!", "zh": "太棒了！"}, {"speaker": "Miss White", "en": "Let's go to the zoo!", "zh": "我们去动物园吧！"}, {"speaker": "Miss White", "en": "It's a red panda.", "zh": "是一只小熊猫。"}, {"speaker": "Miss White", "en": "It's cute!", "zh": "它很可爱！"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 3", "scene": "Reading time", "function": "描述事物", "turns": [{"speaker": "Child", "en": "Mum, what makes us great?", "zh": "妈妈，是什么让我们很了不起？"}, {"speaker": "Mum", "en": "We are big.", "zh": "我们很大。"}, {"speaker": "Mum", "en": "Elephants are big too.", "zh": "大象也很大。"}, {"speaker": "Mum", "en": "We are fast.", "zh": "我们很快。"}, {"speaker": "Mum", "en": "Fish are fast too.", "zh": "鱼也很快。"}, {"speaker": "Mum", "en": "Yes! We can sing nice songs.", "zh": "是的！我们能唱好听的歌。"}, {"speaker": "Mum", "en": "I know! We sing!", "zh": "我知道！我们唱歌！"}, {"speaker": "Mum", "en": "Pandas eat a lot too.", "zh": "熊猫也吃很多。"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 4", "scene": "Let's talk", "function": "表达喜好", "turns": [{"speaker": "A", "en": "Do you like apples?", "zh": "你喜欢苹果吗？"}, {"speaker": "B", "en": "No, I don't. I like bananas.", "zh": "不，我不喜欢。我喜欢香蕉。"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 4", "scene": "Plants and us", "function": "表达喜好", "turns": [{"speaker": "Miss White", "en": "Mike, do you like apples?", "zh": "迈克，你喜欢苹果吗？"}, {"speaker": "Mike", "en": "No, I don't. I like bananas.", "zh": "不，我不喜欢。我喜欢香蕉。"}, {"speaker": "Miss White", "en": "Do you like the farm?", "zh": "你喜欢农场吗？"}, {"speaker": "Mike", "en": "Yes, Miss White.", "zh": "是的，怀特老师。"}, {"speaker": "Miss White", "en": "Do you like apples?", "zh": "你喜欢苹果吗？"}, {"speaker": "Mike", "en": "Yes, I do.", "zh": "是的，我喜欢。"}, {"speaker": "Miss White", "en": "I like the fresh air.", "zh": "我喜欢新鲜的空气。"}, {"speaker": "Mike", "en": "Yes, I do.", "zh": "是的，我也喜欢。"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 4", "scene": "Look and talk", "function": "请求与应答", "turns": [{"speaker": "A", "en": "How can we help?", "zh": "我们怎样才能帮忙？"}, {"speaker": "B", "en": "We can water the grass.", "zh": "我们可以给草浇水。"}, {"speaker": "A", "en": "We can water the flowers.", "zh": "我们可以给花浇水。"}, {"speaker": "B", "en": "The school gardens need help.", "zh": "学校的花园需要帮助。"}, {"speaker": "A", "en": "Nice. And?", "zh": "很好。还有呢？"}, {"speaker": "B", "en": "We can plant trees.", "zh": "我们可以种树。"}, {"speaker": "A", "en": "We can plant new trees.", "zh": "我们可以种新树。"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 4", "scene": "Reading time", "function": "描述事物", "turns": [{"speaker": "Apple tree", "en": "I am an apple tree.", "zh": "我是一棵苹果树。"}, {"speaker": "Apple tree", "en": "My new family help me.", "zh": "我的新家人帮助我。"}, {"speaker": "Apple tree", "en": "I need air, water and sun.", "zh": "我需要空气、水和阳光。"}, {"speaker": "Apple tree", "en": "My family water me.", "zh": "我的家人给我浇水。"}, {"speaker": "Apple tree", "en": "It is cold. They help me.", "zh": "天气很冷。他们帮助我。"}, {"speaker": "Apple tree", "en": "I am big now.", "zh": "我现在长大了。"}, {"speaker": "Apple tree", "en": "I give apples to my family.", "zh": "我给家人苹果。"}, {"speaker": "Apple tree", "en": "We are all happy!", "zh": "我们都很开心！"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 5", "scene": "Colour song", "function": "描述事物", "turns": [{"speaker": "A", "en": "What colour is it?", "zh": "它是什么颜色？"}, {"speaker": "B", "en": "It's orange.", "zh": "它是橙色的。"}, {"speaker": "A", "en": "What colour is it?", "zh": "它是什么颜色？"}, {"speaker": "B", "en": "It's green.", "zh": "它是绿色的。"}, {"speaker": "A", "en": "Wow! It's green.", "zh": "哇！它是绿色的。"}, {"speaker": "A", "en": "Look! Red and blue make purple.", "zh": "看！红色和蓝色混合成紫色。"}, {"speaker": "A", "en": "What colour is it?", "zh": "它是什么颜色？"}, {"speaker": "A", "en": "Wow! Blue and yellow make green.", "zh": "哇！蓝色和黄色混合成绿色。"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 5", "scene": "Let's talk (Guess and check)", "function": "询问信息", "turns": [{"speaker": "A", "en": "What colours do you see?", "zh": "你看到了什么颜色？"}, {"speaker": "B", "en": "I see colours here and there.", "zh": "我到处都能看到颜色。"}, {"speaker": "B", "en": "Purple flowers, green grass and blue sea.", "zh": "紫色的花，绿色的草和蓝色的海。"}, {"speaker": "B", "en": "I see colours here and there.", "zh": "我到处都能看到颜色。"}, {"speaker": "A", "en": "A big brown bear. What else can you see?", "zh": "一只大棕熊。你还能看到什么？"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 5", "scene": "Let's talk (Colour and say)", "function": "表达喜好", "turns": [{"speaker": "A", "en": "Let's draw some purple and brown birds.", "zh": "我们画一些紫色和棕色的鸟吧。"}, {"speaker": "B", "en": "OK. Let's draw some red and pink flowers.", "zh": "好的。我们画一些红色和粉色的花吧。"}, {"speaker": "A", "en": "What colours do you like?", "zh": "你喜欢什么颜色？"}, {"speaker": "B", "en": "And the birds?", "zh": "那鸟呢？"}, {"speaker": "B", "en": "I like red and pink.", "zh": "我喜欢红色和粉色。"}, {"speaker": "A", "en": "What colours do you like?", "zh": "你喜欢什么颜色？"}, {"speaker": "B", "en": "I like green and yellow.", "zh": "我喜欢绿色和黄色。"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 5", "scene": "Project: Make a colour flip book", "function": "表达喜好", "turns": [{"speaker": "A", "en": "I like yellow, red and blue.", "zh": "我喜欢黄色、红色和蓝色。"}, {"speaker": "B", "en": "What colours do you like, Sarah?", "zh": "莎拉，你喜欢什么颜色？"}, {"speaker": "A", "en": "This is my book. I like yellow, red and blue. Bananas are yellow. Ducks are ...", "zh": "这是我的书。我喜欢黄色、红色和蓝色。香蕉是黄色的。鸭子是……"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 6", "scene": "Numbers", "function": "问候与介绍", "turns": [{"speaker": "A", "en": "Hi, Sam! This is my sister, Xinxin.", "zh": "嗨，Sam！这是我妹妹，欣欣。"}, {"speaker": "B", "en": "Hello, Xinxin! How old are you?", "zh": "你好，欣欣！你几岁了？"}, {"speaker": "Xinxin", "en": "Hello, Xiaoli! How old are you?", "zh": "你好，小丽！你几岁了？"}, {"speaker": "Xiaoli", "en": "I'm five years old.", "zh": "我五岁了。"}, {"speaker": "Xiaoli", "en": "Binbin, this is my brother, Sam.", "zh": "彬彬，这是我哥哥，Sam。"}, {"speaker": "Sam", "en": "I'm five years old.", "zh": "我五岁了。"}, {"speaker": "Xinxin", "en": "Me too.", "zh": "我也是。"}, {"speaker": "Xinxin", "en": "Hi, Sam!", "zh": "嗨，Sam！"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 6", "scene": "Let's talk", "function": "购物与价格", "turns": [{"speaker": "A", "en":  "Care and share.", "zh": "关心与分享。"}, {"speaker": "A", "en": "Say \"Goodbye!\"", "zh": "说“再见！”"}, {"speaker": "A", "en": "How can we be a good guest?", "zh": "我们怎样才能做一个好客人？"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 1", "scene": "Unit 1 Nice to meet you!", "function": "问候与介绍", "turns": [{"speaker": "Song", "en": "Nice to meet you. Nice to meet you.", "zh": "很高兴认识你。很高兴认识你。"}, {"speaker": "Song", "en": "Nice to meet you, my new friend.", "zh": "很高兴认识你，我的新朋友。"}, {"speaker": "Song", "en": "I am happy. Smile and say \"Hi!\"", "zh": "我很开心。微笑并说“嗨！”"}, {"speaker": "Song", "en": "Nice to meet you, my new friend.", "zh": "很高兴认识你，我的新朋友。"}, {"speaker": "Song", "en": "Nice to meet you. Nice to meet you.", "zh": "很高兴认识你。很高兴认识你。"}, {"speaker": "Song", "en": "Nice to meet you, my new friend.", "zh": "很高兴认识你，我的新朋友。"}, {"speaker": "Song", "en": "Shake my hand. Let's play a game now.", "zh": "握握我的手。我们现在来玩个游戏吧。"}, {"speaker": "Song", "en": "Nice to meet you, my new friend.", "zh": "很高兴认识你，我的新朋友。"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 1", "scene": "Unit 2 My family", "function": "描述事物", "turns": [{"speaker": "Song", "en": "This is my mother. This is my father.", "zh": "这是我的妈妈。这是我的爸爸。"}, {"speaker": "Song", "en": "Where am I? Where am I?", "zh": "我在哪里？我在哪里？"}, {"speaker": "Song", "en": "I am with my sister. I am with my brother.", "zh": "我和我姐姐在一起。我和我哥哥在一起。"}, {"speaker": "Song", "en": "My family and I. My family and I.", "zh": "我和我的家人。我和我的家人。"}, {"speaker": "Song", "en": "This is my grandma. This is my grandpa.", "zh": "这是我的奶奶。这是我的爷爷。"}, {"speaker": "Song", "en": "Where am I? Where am I?", "zh": "我在哪里？我在哪里？"}, {"speaker": "Song", "en": "I am with my aunt. I am with my uncle.", "zh": "我和我阿姨在一起。我和我叔叔在一起。"}, {"speaker": "Song", "en": "My family and I. My family and I.", "zh": "我和我的家人。我和我的家人。"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 1", "scene": "Unit 2 Finger family song", "function": "问候与介绍", "turns": 它们帮我长得很好！"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 1", "scene": "Unit 5 Colour song", "function": "描述事物", "turns": [{"speaker": "Song", "en": "Red and orange and yellow and green,", "zh": "红色、橙色、黄色和绿色，"}, {"speaker": "Song", "en": "Purple and then I see blue.", "zh": "紫色，然后我看到蓝色。"}, {"speaker": "Song", "en": "I can see a rainbow, see a rainbow.", "zh": "我能看到彩虹，看到彩虹。"}, {"speaker": "Song", "en": "Can you see one too?", "zh": "你也能看到一个吗？"}, {"speaker": "Song", "en": "Red and yellow and then I see green.", "zh": "红色和黄色，然后我看到绿色。"}, {"speaker": "Song", "en": "They can mean stop, wait and go.", "zh": "它们可以表示停止、等待和通行。"}, {"speaker": "Song", "en": "Colours from the rainbow, from the rainbow.", "zh": "来自彩虹的颜色，来自彩虹的颜色。"}, {"speaker": "Song", "en": "What can they show?", "zh": "它们能展示什么？"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 1", "scene": "Unit 6 Numbers", "function": "询问信息", "turns": [{"speaker": "Song", "en": "How old are you, my friend?", "zh": "你多大了，我的朋友？"}, {"speaker": "Song", "en": "I can count up from one to ten.", "zh": "我可以从一数到十。"}, {"speaker": "Song", "en": "How old are you, my friend?", "zh": "你多大了，我的朋友？"}, {"speaker": "Song", "en": "I can count back again.", "zh": "我可以倒着数。"}, {"speaker": "Song", "en": "How can numbers help us out?", "zh": "数字如何帮助我们？"}, {"speaker": "Song", "en": "We can sort and solve and count.", "zh": "我们可以分类、解决和计数。"}, {"speaker": "Song", "en": "How can numbers help us out?", "zh": "数字如何帮助我们？"}, {"speaker": "Song", "en": "We can help each other out!", "zh": "我们可以互相帮助！"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 2", "scene": "Unit 1 字母歌谣1", "function": "其他", "turns": [{"speaker": "Chant", "en": "A, A, A. Show me an A!", "zh": "A，A，A。给我看一个A！"}, {"speaker": "Chant", "en": "B, B, B. Show me a B!", "zh": "B，B，B。给我看一个B！"}, {"speaker": "Chant", "en": "C, C, C. Show me a C!", "zh": "C，C，C。给我看一个C！"}, {"speaker": "Chant", "en": "D, D, D. Show me a D!", "zh": "D，D，D。给我看一个D！"}, {"speaker": "Chant", "en": "After me. A, B, C, D!", "zh": "跟我读。A，B，C，D！"}, {"speaker": "Chant", "en": "After me. A, B, C, D!", "zh": "跟我读。A，B，C，D！"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 2", "scene": "Unit 1 字母音歌谣2", "function": "其他", "turns": [{"speaker": "Chant", "en": "A is for /æ/.", "zh": "A 发 /æ/ 音。"}, {"speaker": "Chant", "en": "/æ/, /æ/, apple.", "zh": "/æ/，/æ/，苹果。"}, {"speaker": "Chant", "en": "/æ/, /æ/, bag.", "zh": "/æ/，/æ/，包。"}, {"speaker": "Chant", "en": "I see an apple in a bag.", "zh": "我看见一个苹果在包里。"}, {"speaker": "Chant", "en": "B is for /b/.", "zh": "B 发 /b/ 音。"}, {"speaker": "Chant", "en": "/b/, /b/, bed.", "zh": "/b/，/b/，床。"}, {"speaker": "Chant", "en": "/b/, /b/, Bob.", "zh": "/b/，/b/，鲍勃。"}, {"speaker": "Chant", "en": "I see Bob in the bed.", "zh": "我看见鲍勃在床上。"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 2", "scene": "Unit 2 字母歌谣1", "function": "其他", "turns": [{"speaker": "Chant", "en": "E, E, E. Show me an E!", "zh": "E，E，E。给我看一个E！"}, {"speaker": "Chant", "en": "F, F, F. Show me an F!", "zh": "F，F，F。给我看一个F！"}, {"speaker": "Chant", "en": "G, G, G. Show me a G!", "zh": "G，G，G。给我看一个G！"}, {"speaker": "Chant", "en": "H, H, H. Show me an H!", "zh": "H，H，H。给我看一个H！"}, {"speaker": "Chant", "en": "Say E, F, G and H!", "zh": "说E，F，G和H！"}, {"speaker": "Chant", "en": "Say E, F, G and H!", "zh": "说E，F，G和H！"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 2", "scene": "Unit 2 字母音歌谣2", "function": "其他", "turns": [{"speaker": "Chant", "en": "E is for /e/.", "zh": "E 发 /e/ 音。"}, {"speaker": "Chant", "en": "/e/, /e/, egg.", "zh": "/e/，/e/，鸡蛋。"}, {"speaker": "Chant", "en": "/e/, /e/, nest.", "zh": "/e/，/e/，巢。"}, {"speaker": "Chant", "en": "I see an egg in the nest.", "zh": "我看见一个鸡蛋在巢里。"}, {"speaker": "Chant", "en": "F is for /f/.", "zh": "F 发 /f/ 音。"}, {"speaker": "Chant", "en": "/f/, /f/, fish.", "zh": "/f/，/f/，鱼。"}, {"speaker": "Chant", "en": "/f/, /f/, beef.", "zh": "/f/，/f/，牛肉。"}, 拉。/ 谢谢你，陈杰。"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 5", "scene": "Unit 2 介绍家人", "function": "描述事物", "turns": [{"speaker": "A", "en": "This is my grandma.", "zh": "这是我的奶奶。"}, {"speaker": "A", "en": "Look! This is my family.", "zh": "看！这是我的家庭。"}, {"speaker": "B", "en": "Is that your brother?", "zh": "那是你弟弟吗？"}, {"speaker": "A", "en": "Yes, it is.", "zh": "对，是的。"}, {"speaker": "A", "en": "They love each other.", "zh": "他们相互关爱。"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 5", "scene": "Unit 3 问候与邀请", "function": "问候与介绍", "turns": [{"speaker": "A", "en": "Good morning, Mike!", "zh": "早上好，迈克！"}, {"speaker": "B", "en": "Good morning! Come in.", "zh": "早上好！进来吧。"}, {"speaker": "A", "en": "Do you have a pet?", "zh": "你有宠物吗？"}, {"speaker": "B", "en": "No, I don't.", "zh": "不，我没有。"}, {"speaker": "B", "en": "Yes, I do. I have a cat.", "zh": "是的，我有。我有一只猫。"}, {"speaker": "A", "en": "Let's go to the zoo!", "zh": "我们一起去动物园吧！"}, {"speaker": "B", "en": "Great!", "zh": "太好了！"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 5", "scene": "Unit 3 询问事物", "function": "询问信息", "turns": [{"speaker": "A", "en": "What's this?", "zh": "这是什么？"}, {"speaker": "B", "en": "It's a fox.", "zh": "是只狐狸。"}, {"speaker": "A", "en": "Miss White, what's that?", "zh": "怀特老师，那是什么？"}, {"speaker": "B", "en": "It's a red panda.", "zh": "是只小熊猫。"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 5", "scene": "Unit 4 表达喜好", "function": "表达喜好", "turns": [{"speaker": "A", "en": "Mike, do you like apples?", "zh": "迈克，你喜欢苹果吗？"}, {"speaker": "B", "en": "Yes, I do. And you?", "zh": "是的，我喜欢。你呢？"}, {"speaker": "A", "en": "No, I don't.", "zh": "不，我不喜欢。"}, {"speaker": "A", "en": "Do you like the farm?", "zh": "你们喜欢农场吗？"}, {"speaker": "B", "en": "I like the fresh air.", "zh": "我喜欢新鲜的空气。"}, {"speaker": "A", "en": "We can plant new trees.", "zh": "我们可以新种些树。"}, {"speaker": "A", "en": "Plants can give us many things.", "zh": "植物能提供很多东西 ": "三年级上册", "unit": "Appendix 1", "scene": "Unit 2 My family", "function": "描述事物", "turns": [{"speaker": "Song", "en": "This is my mother. This is my father.", "zh": "这是我的妈妈。这是我的爸爸。"}, {"speaker": "Song", "en": "Where am I? Where am I?", "zh": "我在哪里？我在哪里？"}, {"speaker": "Song", "en": "I am with my sister. I am with my brother.", "zh": "我和我姐姐在一起。我和我哥哥在一起。"}, {"speaker": "Song", "en": "My family and I. My family and I.", "zh": "我和我的家人。我和我的家人。"}, {"speaker": "Song", "en": "This is my grandma. This is my grandpa.", "zh": "这是我的奶奶。这是我的爷爷。"}, {"speaker": "Song", "en": "Where am I? Where am I?", "zh": "我在哪里？我在哪里？"}, {"speaker": "Song", "en": "I am with my aunt. I am with my uncle.", "zh": "我和我阿姨在一起。我和我叔叔在一起。"}, {"speaker": "Song", "en": "My family and I. My family and I.", "zh": "我和我的家人。我和我的家人。"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 1", "scene": "Unit 2 Finger family song", "function": "问候与介绍", "turns": [{"speaker": "Song", "en": "Daddy Finger, Daddy Finger, where are you?", "zh": "爸爸手指，爸爸手指，你在哪里？"}, {"speaker": "Song", "en": "This is my daddy.", "zh": "这是我的爸爸。"}, {"speaker": "Song", "en": "How do you do?", "zh": "你好吗？"}, {"speaker": "Song", "en": "Mummy Finger, Mummy Finger, where are you?", "zh": "妈妈手指，妈妈手指，你在哪里？"}, {"speaker": "Song", "en": "This is my mummy.", "zh": "这是我的妈妈。"}, {"speaker": "Song", "en": "How do you do?", "zh": "你好吗？"}, {"speaker": "Song", "en": "Grandpa Finger, Grandpa Finger, where are you?", "zh": "爷爷手指，爷爷手指，你在哪里？"}, {"speaker": "Song", "en": "This is my grandpa.", "zh": "这是我的爷爷。"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 1", "scene": "Unit 3 Animal song", "function": "描述事物", "turns": [{"speaker": "Song", "en": "A dog says \"woof\". A cat says \"meow\".", "zh": "狗说“汪汪”。猫说“喵喵”。"}, {"speaker": "Song", "en": "I watch them run to the top of the hill,", "zh": "我看着它们跑到山顶，"}, {"speaker": "Song", "en": "And then run down again.", "zh": "然后又跑下来。"}, {"speaker": "Song", "en": "A lion says \"roar\". A ti  "F, F, F. Show me an F!", "zh": "F，F，F。给我看一个F！"}, {"speaker": "Chant", "en": "G, G, G. Show me a G!", "zh": "G，G，G。给我看一个G！"}, {"speaker": "Chant", "en": "H, H, H. Show me an H!", "zh": "H，H，H。给我看一个H！"}, {"speaker": "Chant", "en": "Say E, F, G and H!", "zh": "说 E，F，G 和 H！"}, {"speaker": "Chant", "en": "Say E, F, G and H!", "zh": "说 E，F，G 和 H！"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 2", "scene": "Unit 2 字母音歌谣2", "function": "其他", "turns": [{"speaker": "Chant", "en": "E is for /e/.", "zh": "E 发 /e/ 音。"}, {"speaker": "Chant", "en": "/e/, /e/, egg.", "zh": "/e/，/e/，鸡蛋。"}, {"speaker": "Chant", "en": "/e/, /e/, nest.", "zh": "/e/，/e/，巢。"}, {"speaker": "Chant", "en": "I see an egg in the nest.", "zh": "我看见一个鸡蛋在巢里。"}, {"speaker": "Chant", "en": "F is for /f/.", "zh": "F 发 /f/ 音。"}, {"speaker": "Chant", "en": "/f/, /f/, fish.", "zh": "/f/，/f/，鱼。"}, {"speaker": "Chant", "en": "/f/, /f/, beef.", "zh": "/f/，/f/，牛肉。"}, {"speaker": "Chant", "en": "I see fish and beef.", "zh": "我看见鱼和牛肉。"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 2", "scene": "Unit 3 字母歌谣1", "function": "其他", "turns": [{"speaker": "Chant", "en": "I, I, I. Show me an I!", "zh": "I，I，I。给我看一个I！"}, {"speaker": "Chant", "en": "J, J, J. Show me a J!", "zh": "J，J，J。给我看一个J！"}, {"speaker": "Chant", "en": "K, K, K. Show me a K!", "zh": "K，K，K。给我看一个K！"}, {"speaker": "Chant", "en": "L, L, L. Show me an L!", "zh": "L，L，L。给我看一个L！"}, {"speaker": "Chant", "en": "Say it well. I, J, K and L!", "zh": "好好说。I，J，K 和 L！"}, {"speaker": "Chant", "en": "Say it well. I, J, K and L!", "zh": "好好说。I，J，K 和 L！"}]}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Appendix 2", "scene": "Unit 3 字母音歌谣2", "function": "其他", "turns": [{"speaker": "Chant", "en": "I is for /ɪ/.", "zh": "I 发 /ɪ/ 音。"}, {"speaker": "Chant", "en": "/ɪ/, /ɪ/, ill.", "zh": "/ɪ/，/ɪ/，生病。"}, {"speaker": "Chant", "en": "/ɪ/, /ɪ/, kid.", "zh": "/ɪ/，/ɪ/，小孩。"}, {"speaker": "Chant", "en": "The kid is ill.", "zh": "这个小孩
