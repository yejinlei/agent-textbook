里，一边大口喘气一边说：“今天可把我累坏了！力气总算没白费，禾苗都长高了一大截他的儿子不明白是怎么回事，第二天跑到田里一看，禾苗都枯死了。意思。他堵上那个窟窿，把羊圈修得结结实实的。他赶紧堵上那个窟窿，把羊圈修得结结实实的。他在田边转来转去。他在田边焦急地转来转去。亡亡补补牢牢丢丢劝劝助助坏坏死死寓则亡补牢圈叼修堵悔实焦筋喘费截", "glossary": [], "tr": "", "literal": [], "notes": "[]"}, {"grade": "二年级", "term": "下册", "book": "二年级下册", "unit_no": 6, "title": "绝句", "kind": "古诗", "dynasty": "唐", "author": "杜甫", "text": "两个黄鹂鸣翠柳，一行白鹭上青天。窗含西岭千秋雪，门泊东吴万里船。", "glossary": [{"word": "迟日", "sense": "春天的太阳"}, {"word": "泥融", "sense": "泥土解冻变软"}, {"word": "鸳鸯", "sense": "一种水鸟，雌雄成对"}], "tr": "春天的太阳照耀着江山，景色美丽。春风吹来，花草散发着香气。泥土融化了，燕子飞来飞去。沙滩温暖，鸳鸯在上面睡觉。", "literal": [{"src": "迟日江山丽，", "tr": "春天的太阳照耀着江山，景色美丽。"}, {"src": "春风花草香。", "tr": "春风吹来，花草散发着香气。"}, {"src": "泥融飞燕子，", "tr": "泥土融化了，燕子飞来飞去。"}, {"src": "沙暖睡鸳鸯。", "tr": "沙滩温暖，鸳鸯在上面睡觉。"}], "notes": "[]"}, {"grade": "二年级", "term": "下册", "book": "二年级下册", "unit_no": 6, "title": "晓出净慈寺送林子方", "kind": "古诗", "dynasty": null, "author": null, "text": "晓出净慈寺送林子方[宋] 杨万里毕竟西湖六月中，风光不与四时同。接天莲叶无穷碧，映日荷花别样红。鸣翠柳，一行白鹭上青天。窗窗含含岭岭映映吴吴泊泊净净莲莲甫鸣含岭泊晓净寺宋毕竟", "glossary": [{"word": "晓", "sense": "早晨"}, {"word": "毕竟", "sense": "到底，究竟"}, {"word": "四时", "sense": "四季"}, {"word": "接天", "sense": "与天相接，形容广阔无边"}, {"word": "映日", "sense": "在阳光照耀下"}, {"word": "别样", "sense": "特别，格外"}], "tr": "清晨从净慈寺出发，送别林子方。终究是六月的西湖，风光与其他季节不同。与天相接的莲叶无边无际，一片碧绿，映着阳光的荷花格外红艳。黄鹂在翠绿的柳枝间鸣叫，一行白鹭飞上青天。", "literal": [{"src": "晓出净慈寺送林子方[宋] 杨万里", "tr": "清晨从净慈寺出发，送别林子方。[宋代] 杨万里"}, {"src": "毕竟西湖六月中，", "tr": "终究是六月的西湖，"}, {"src": "风光不与四时同。", "tr": "风光与其他季节不同。"}, {"src": "接天莲叶无穷碧，", "tr": "与天相接的莲叶无边无际，一片碧绿，"}, {"src": "映日荷花别样红。", "tr": "映着阳光的荷花格外红艳。"}, {"src": "鸣翠柳，一行白鹭上青天。", "tr": "黄鹂在翠绿的柳枝间鸣叫，一行白鹭飞上青天。"}, {"src": "窗窗含含岭岭映映吴吴泊泊净净莲莲甫鸣含岭泊晓净寺宋毕竟", "tr": "（此句为乱序重复字，无实际意义）"}], "notes": "[]"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit_no": 2, "title": "望洞庭", "kind": "古诗", "dynasty": "唐", "author": "刘禹", "text": "锡湖光秋月两相和，潭面无风镜未磨遥望洞庭山水翠，白银盘里一青螺", "glossary": [{"word": "相和", "sense": "互相配合，和谐"}, {"word": "潭面", "sense": "湖面"}, {"word": "镜未磨", "sense": "像未磨光的铜镜"}, {"word": "青螺", "sense": "青色的螺，比喻君山"}], "tr": "湖面的光和秋天的月亮互相映衬，十分和谐。湖面没有风，平静得像一面没有打磨过的镜子；远远望去，洞庭湖的山水一片翠绿，就像白银盘子里放着一颗青螺。", "literal": [{"src": "锡湖光秋月两相和", "tr": "湖面的光和秋天的月亮互相映衬，十分和谐。"}, {"src": "潭面无风镜未磨遥望洞庭山水翠", "tr": "湖面没有风，平静得像一面没有打磨过的镜子；远远望去，洞庭湖的山水一片翠绿。"}, {"src": "白银盘里一青螺", "tr": "就像白银盘子里放着一颗青螺。"}], "notes": "[]"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit_no": 2, "title": "山行", "kind": "古诗", "dynasty": "唐", "author": "杜牧", "text": "远上寒山石径斜白云生处有人家。停车坐爱枫林晚，霜叶红于二月花。叶发出的声音。蛐。", "glossary": [{"word": "寒山", "sense": "深秋时节的山"}, {"word": "石径", "sense": "石头铺成的小路"}, {"word": "坐", "sense": "因为"}, {"word": "霜叶", "sense": "经霜的枫叶"}], "tr": "远远地登上寒冷的山，石头铺成的小路弯弯曲曲地向上延伸，白云升腾的地方有人家居住。停下车来，因为喜爱傍晚时分的枫林，经霜的枫叶比二月的鲜花还要红。叶子发出的声音。蟋蟀的叫声。", "literal": [{"src": "远上寒山石径斜白云生处有人家。", "tr": "远远地登上寒冷的山，石头铺成的小路弯弯曲曲地向上延伸，白云升腾的地方有人家居住。"}, {"src": "停车坐爱枫林晚，霜叶红于二月花。", "tr": "停下车来，因为喜爱傍晚时分的枫林，经霜的枫叶比二月的鲜花还要红。"}, {"src": "叶发出的声音。", "tr": "叶子发出的声音。"}, {"src": "蛐。", "tr": "蟋蟀的叫声。"}], "notes": "[]"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit_no": 2, "title": "夜书所见", "kind": "古诗", "dynasty": "宋", "author": "叶绍", "text": "翁萧萧梧叶送寒声，江上秋风动客情。知有儿童挑促织，夜深篱落一灯明。这三首诗写的是哪个季节的景色？你是从哪些地方发现的？◇  遥望洞庭山水翠，白银盘里一青螺。挑枫霜斜深落庭未相寒径庭未磨斜萧挑促", "glossary": [{"word": "萧萧", "sense": "形容风吹梧桐叶的声音"}, {"word": "客情", "sense": "旅客的思乡之情"}, {"word": "促织", "sense": "蟋蟀"}, {"word": "篱落", "sense": "篱笆"}, {"word": "挑", "sense": "捉、捕捉"}], "tr": "梧桐叶在秋风中沙沙作响，送来阵阵寒意。江上的秋风触动了游子的思乡之情。知道有儿童在捉蟋蟀。夜深了，篱笆旁一盏灯还亮着。这三首诗描写的是哪个季节的景色？你是从哪里发现的？远远望去，洞庭湖的山水一片翠绿。白银盘里放着一颗青螺。", "literal": [{"src": "翁萧萧梧叶送寒声，", "tr": "梧桐叶在秋风中沙沙作响，送来阵阵寒意。"}, {"src": "江上秋风动客情。", "tr": "江上的秋风触动了游子的思乡之情。"}, {"src": "知有儿童挑促织，", "tr": "知道有儿童在捉蟋蟀。"}, {"src": "夜深篱落一灯明。", "tr": "夜深了，篱笆旁一盏灯还亮着。"}, {"src": "这三首诗写的是哪个季节的景色？", "tr": "这三首诗描写的是哪个季节的景色？"}, {"src": "你是从哪些地方发现的？", "tr": "你是从哪里发现的？"}, {"src": "◇  遥望洞庭山水翠，", "tr": "远远望去，洞庭湖的山水一片翠绿。"}, {"src": "白银盘里一青螺。", "tr": "白银盘里放着一颗青螺。"}], "notes": "[]"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit_no": 7, "title": "鹿柴", "kind": "古诗", "dynasty": "唐", "author": "王维", "text": "空山不见人，但闻人语响。返景入深林，复照青苔上。", "glossary": [{"word": "但", "sense": "只,仅仅"}, {"word": "返景", "sense": "返照的阳光(景通\"影\")"}, {"word": "复", "sense": "又,再"}], "tr": "空旷的山里看不见人，只听到人说话的声音。夕阳返照的光射入深林，又照在青苔上。", "literal": [{"src": "空山不见人", "tr": "空旷的山里看不见人"}, {"src": "但闻人语响", "tr": "只听到人说话的声音"}, {"src": "返景入深林", "tr": "夕阳返照的光射入深林"}, {"src": "复照青苔上", "tr": "又照在青苔上"}], "notes": "[]"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit_no": 7, "title": "望天门山", "kind": "古诗", "dynasty": "唐", "author": "李白", "text": "天门中断楚江开，碧水东流至此回。两岸青山相对出，孤帆一片日边来。", "glossary": [{"word": "中断", "sense": "从中间断开"}, {"word": "开", "sense": "劈开"}, {"word": "碧水", "sense": "碧：青绿色"}, {"word": "回", "sense": "回旋"}, {"word": "孤帆", "sense": "孤：单独"}, {"word": "日边", "sense": "太阳旁边"}], "tr": "天门山从中间断开，楚江从这里奔涌而出。碧绿的江水向东流去，到了这里又回旋起来。两岸的青山相对而立，仿佛迎面走来。一片孤帆从太阳旁边驶来。西梁山的合称。东梁山在今天的芜湖市，西梁山在今天的马鞍山市，两座山隔着江水相对而立。", "literal": [{"src": "天门中断楚江开", "tr": "天门山从中间断开，楚江从这里奔涌而出。"}, {"src": "碧水东流至此回", "tr": "碧绿的江水向东流去，到了这里又回旋起来。"}, {"src": "两岸青山相对出", "tr": "两岸的青山相对而立，仿佛迎面走来。"}, {"src": "孤帆一片日边来", "tr": "一片孤帆从太阳旁边驶来。"}, {"src": "西梁山的合称", "tr": "西梁山的合称。"}, {"src": "东梁山在今芜湖市", "tr": "东梁山在今天的芜湖市。"}, {"src": "西梁山在今马鞍山市", "tr": "西梁山在今天的马鞍山市。"}, {"src": "两山隔江相对", "tr": "两座山隔着江水相对而立。"}], "notes": "[]"}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit_no": 7, "title": "饮湖上初晴后雨", "kind": "古诗", "dynasty": "宋", "author": null, "text": "苏轼水光潋滟晴方好，山色空蒙雨亦奇。欲把西湖比西子，淡妆浓抹总相宜越国的美女。", "glossary": [{"word": "潋滟", "sense": "水波荡漾的样子"}, {"word": "空蒙", "sense": "云雾迷茫的样子"}, {"word": "欲", "sense": "想要"}, {"word": "西子", "sense": "西施，越国美女"}, {"word": "相宜", "sense": "合适，适宜"}, {"word": "方", "sense": "正，正在"}], "tr": "晴天里，湖面上波光闪动，景色正好；雨天里，山色迷蒙，景色也很奇妙。如果把西湖比作西施，无论是淡妆还是浓妆，都同样合适。", "literal": [{"src": "水光潋滟晴方好，", "tr": "晴天里，湖面上波光闪动，景色正好。"}, {"src": "山色空蒙雨亦奇。", "tr": "雨天里，山色迷蒙，景色也很奇妙。"}, {"src": "欲把西湖比西子，", "tr": "如果把西湖比作西施，"}, {"src": "淡妆浓抹总相宜", "tr": "无论是淡妆还是浓妆，都同样合适。"}], "notes": "[]"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 1, "title": "绝句", "kind": "古诗", "dynasty": "唐", "author": "杜甫", "text": "迟日江山丽，春风花草香。泥融飞燕子，沙暖睡鸳鸯。", "glossary": [{"word": "迟日", "sense": "春天的太阳"}, {"word": "泥融", "sense": "泥土解冻变软"}, {"word": "鸳鸯", "sense": "一种水鸟，雌雄成对"}], "tr": "春天的太阳照耀着江山，景色美丽。春风吹来，花草散发着香气。泥土融化了，燕子飞来飞去。沙滩温暖，鸳鸯在上面睡觉。", "literal": [{"src": "迟日江山丽，", "tr": "春天的太阳照耀着江山，景色美丽。"}, {"src": "春风花草香。", "tr": "春风吹来，花草散发着香气。"}, {"src": "泥融飞燕子，", "tr": "泥土融化了，燕子飞来飞去。"}, {"src": "沙暖睡鸳鸯。", "tr": "沙滩温暖，鸳鸯在上面睡觉。"}], "notes": "[]"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 1, "title": "惠崇春江晚景", "kind": "古诗", "dynasty": null, "author": null, "text": "竹外桃花三两枝，春江水暖鸭先知。蒌蒿满地芦芽短，正是河豚欲上时。", "glossary": [{"word": "蒌蒿", "sense": "一种水生植物"}, {"word": "芦芽", "sense": "芦苇刚长出的嫩芽"}, {"word": "河豚", "sense": "一种鱼，即河鲀"}, {"word": "欲", "sense": "将要"}, {"word": "上", "sense": "逆流而上，指游到上游"}], "tr": "竹林外面，桃花已经开了三两枝。春天江水变暖了，鸭子最先知道。蒌蒿长满了地，芦苇的嫩芽还很短。这正是河豚要逆流而上的时候。", "literal": [{"src": "竹外桃花三两枝", "tr": "竹林外面，桃花已经开了三两枝。"}, {"src": "春江水暖鸭先知", "tr": "春天江水变暖了，鸭子最先知道。"}, {"src": "蒌蒿满地芦芽短", "tr": "蒌蒿长满了地，芦苇的嫩芽还很短。"}, {"src": "正是河豚欲上时", "tr": "这正是河豚要逆流而上的时候。"}], "notes": "[]"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 1, "title": "三衢道中", "kind": "古诗", "dynasty": null, "author": null, "text": "梅子黄时日日晴，小溪泛尽却山行。绿阴不减来时路，添得黄鹂四五声。", "glossary": [{"word": "泛尽", "sense": "乘船到尽头"}, {"word": "却", "sense": "再，又"}, {"word": "绿阴", "sense": "绿色的树荫"}, {"word": "黄鹂", "sense": "黄莺，一种鸟"}], "tr": "梅子黄的时候，天天都是晴天。乘小船到了小溪的尽头，就改走山路。绿树的浓荫和来时路上一样多，还增添了四五声黄鹂的鸣叫。", "literal": [{"src": "梅子黄时日日晴", "tr": "梅子黄的时候，天天都是晴天"}, {"src": "小溪泛尽却山行", "tr": "乘小船到了小溪的尽头，就改走山路"}, {"src": "绿阴不减来时路", "tr": "绿树的浓荫和来时路上一样多"}, {"src": "添得黄鹂四五声", "tr": "还增添了四五声黄鹂的鸣叫"}], "notes": "[]"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 4, "title": "元日", "kind": "古诗", "dynasty": "宋", "author": "王安石", "text": "爆竹声中一岁除，春风送暖入屠苏千门万户曈曈日，总把新桃换旧符。", "glossary": [{"word": "除", "sense": "过去，逝去"}, {"word": "屠苏", "sense": "一种酒名"}, {"word": "曈曈", "sense": "太阳初升，光明灿烂的样子"}, {"word": "新桃", "sense": "新桃符，即桃木板"}, {"word": "旧符", "sense": "旧的桃符"}], "tr": "在爆竹声中，旧的一年过去了。春风送来温暖，人们饮着屠苏酒，千家万户沐浴在初升的朝阳中。总是把新的桃符换下旧的桃符。", "literal": [{"src": "爆竹声中一岁除，", "tr": "在爆竹声中，旧的一年过去了"}, {"src": "春风送暖入屠苏千门万户曈曈日，", "tr": "春风送来温暖，人们饮着屠苏酒，千家万户沐浴在初升的朝阳中"}, {"src": "总把新桃换旧符。", "tr": "总是把新的桃符换下旧的桃符"}], "notes": "[]"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 4, "title": "清明", "kind": "古诗", "dynasty": "唐", "author": "杜牧", "text": "清明时节雨纷纷，路上行人欲断魂。借问酒家何处有？牧童遥指杏花村。", "glossary": [{"word": "纷纷", "sense": "形容雨多而密"}, {"word": "欲断魂", "sense": "形容心情悲伤"}, {"word": "借问", "sense": "请问，询问"}, {"word": "遥指", "sense": "远远地指着"}, {"word": "异客", "sense": "外乡人"}, {"word": "茱萸", "sense": "一种植物，重阳节佩戴"}], "tr": "清明节的时候，细雨纷纷地下着。路上的行人心里非常愁苦，好像魂都要断了。请问哪里有可以喝酒的店家呢？牧童远远地指着杏花村的方向。", "literal": [{"src": "清明时节雨纷纷", "tr": "清明节的时候，细雨纷纷地下着"}, {"src": "路上行人欲断魂", "tr": "路上的行人心里非常愁苦，好像魂都要断了"}, {"src": "借问酒家何处有？", "tr": "请问哪里有可以喝酒的店家呢？"}, {"src": "牧童遥指杏花村", "tr": "牧童远远地指着杏花村的方向"}], "notes": "[]"}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 4, "title": "九月九日忆山东兄弟", "kind": "古诗", "dynasty": null, "author": null, "text": "独在异乡为异客，每逢佳节倍思亲。遥知兄弟登高处，遍插茱萸少一人。", "glossary": [{"word": "异乡", "sense": "他乡，外地"}, {"word": "异客", "sense": "外地的客人，指自己"}, {"word": "倍", "sense": "加倍，更加"}, {"word": "茱萸", "sense": "一种植物，重阳节佩戴"}], "tr": "独自一人在他乡做客，每到佳节就加倍思念亲人。远远地知道兄弟们登上高处，到处插茱萸却少了一个人。", "literal": [{"src": "独在异乡为异客，", "tr": "独自一人在他乡做客，"}, {"src": "每逢佳节倍思亲。", "tr": "每到佳节就加倍思念亲人。"}, {"src": "遥知兄弟登高处，", "tr": "远远地知道兄弟们登上高处，"}, {"src": "遍插茱萸少一人。", "tr": "到处插茱萸却少了一个人。"}], "notes": "[]"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit_no": 1, "title": "秋晚的江上", "kind": "古诗", "dynasty": null, "author": null, "text": "归巢的鸟儿，尽管是倦了，还驮着斜阳回去。双翅一翻，把斜阳掉在江上；头白的芦苇，也妆成一瞬的红颜了。", "glossary": [{"word": "归巢", "sense": "回到巢穴"}, {"word": "倦", "sense": "疲倦，劳累"}, {"word": "驮", "sense": "用背负载"}, {"word": "斜阳", "sense": "傍晚的太阳"}, {"word": "一瞬", "sense": "极短的时间"}, {"word": "妆成", "sense": "打扮成"}], "tr": "飞回巢穴的鸟儿，虽然已经很累了，还背着夕阳飞回去。翅膀一翻，就把夕阳掉在了江面上；白了头的芦苇也被装扮成了一瞬间的红脸。", "literal": [{"src": "归巢的鸟儿，尽管是倦了，还驮着斜阳回去。", "tr": "飞回巢穴的鸟儿，虽然已经很累了，还背着夕阳飞回去。"}, {"src": "双翅一翻，把斜阳掉在江上；", "tr": "翅膀一翻，就把夕阳掉在了江面上；"}, {"src": "头白的芦苇也妆成一瞬的红颜了。", "tr": "白了头的芦苇也被装扮成了一瞬间的红脸。"}], "notes": "[]"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit_no": 1, "title": "花牛歌", "kind": "古诗", "dynasty": null, "author": null, "text": "花牛在草地里坐，压扁了一穗剪秋罗花牛在草地里眠，白云霸占了半个天。花牛在草地里走，小尾巴甩得滴溜溜。花牛在草地里做梦，太阳偷渡了西山的青峰。", "glossary": [{"word": "剪秋罗", "sense": "一种花，也叫石竹花"}, {"word": "霸占", "sense": "强行占据"}, {"word": "滴溜溜", "sense": "形容旋转滚动"}, {"word": "偷渡", "sense": "偷偷越过，这里指太阳悄悄落下"}, {"word": "青峰", "sense": "青色的山峰"}, {"word": "一穗", "sense": "一簇，形容花成串生长"}], "tr": "花牛坐在草地上，压扁了一穗剪秋罗花。花牛在草地上睡觉，白云占据了半个天空。花牛在草地上走，小尾巴甩得转来转去。花牛在草地上做梦，太阳悄悄地越过了西山的青峰。", "literal": [{"src": "花牛在草地里坐，压扁了一穗剪秋罗", "tr": "花牛坐在草地上，压扁了一穗剪秋罗花。"}, {"src": "花牛在草地里眠，白云霸占了半个天。", "tr": "花牛在草地上睡觉，白云占据了半个天空。"}, {"src": "花牛在草地里走，小尾巴甩得滴溜溜。", "tr": "花牛在草地上走，小尾巴甩得转来转去。"}, {"src": "花牛在草地里做梦，太阳偷渡了西山的青峰。", "tr": "花牛在草地上做梦，太阳悄悄地越过了西山的青峰。"}], "notes": "[]"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit_no": 1, "title": "我们与环境", "kind": "古诗", "dynasty": null, "author": null, "text": "观山，看海，听雨，赏花……和大自然亲密接触，让我们心旷神怡。每个人都希望生活在美好的环境里。可是，只要大家稍稍留心就不难发现，人类的许多行为破坏了我们的生活环境。围绕下面的话题的生活环境，我们可以做些什么？最后离开教室的同学要记得关灯，大家一起努力，做到不开“无人灯”。外出的时候，我们尽量乘坐公共交通工具，绿色出行。议》，在学校、社区等地方宣传。◎ 围绕话题发表看法，不跑题。◎ 判断别人的发言是否与话题相关。", "glossary": [{"word": "心旷神怡", "sense": "心情舒畅，精神愉快"}, {"word": "亲密接触", "sense": "亲近地接触"}, {"word": "稍稍", "sense": "稍微，略微"}, {"word": "留心", "sense": "注意，留意"}], "tr": "看山，看海，听雨，赏花……和大自然亲近接触，让我们心情舒畅、精神愉快。每个人都希望生活在美好的环境里。可是，只要大家稍微留心就不难发现，", "literal": [{"src": "观山，看海，听雨，赏花……和大自然亲密接触，让我们心旷神怡。", "tr": "看山，看海，听雨，赏花……和大自然亲近接触，让我们心情舒畅、精神愉快。"}, {"src": "每个人都希望生活在美好的环境里。", "tr": "每个人都希望生活在美好的环境里。"}, {"src": "可是，只要大家稍稍留心就不难发现，", "tr": "可是，只要大家稍微留心就不难发现，"}], "notes": "[]"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit_no": 1, "title": "推荐一个好地方", "kind": "古诗", "dynasty": null, "author": null, "text": "水乡小镇让我们赏心悦目，游乐场让我们兴奋不已，书店让我们流连忘返，村头的小树林是我们的乐园……每个人都有自己喜欢的地方，你愿意和大家分享吗？推荐一个好地方给同学吧。习  作你打算推荐什么地方？这个地方在哪里？它有什么特别之处？写出推荐的理由，吸引大家去看看。如，推荐一个古镇：写的时候，如果有多个理由，可以分段说明。写完后，自己先充分。再读给同学听，请他们提出修改建议。举办“最受欢迎的好地方”推荐会，看看哪些地方最吸引大家。", "glossary": [{"word": "赏心悦目", "sense": "看到美景，心情愉快"}, {"word": "兴奋不已", "sense": "非常高兴，激动得停不下来"}, {"word": "流连忘返", "sense": "留恋得忘记了回去"}, {"word": "水乡", "sense": "河流湖泊多的地方"}], "tr": "水乡小镇让我们看了心情舒畅，游乐场让我们非常兴奋，书店让我们舍不得离开，村头的小树林是我们的乐园……每个人都有自己喜欢的地方，你愿意和大家一起分享吗？推荐一个好地方给同学们吧。习作：你打算推荐什么地方？这个地方在哪里？", "literal": [{"src": "水乡小镇让我们赏心悦目，游乐场让我们兴奋不已，书店让我们流连忘返，村头的小树林是我们的乐园……", "tr": "水乡小镇让我们看了心情舒畅，游乐场让我们非常兴奋，书店让我们舍不得离开，村头的小树林是我们的乐园……"}, {"src": "每个人都有自己喜欢的地方，你愿意和大家分享吗？", "tr": "每个人都有自己喜欢的地方，你愿意和大家一起分享吗？"}, {"src": "推荐一个好地方给同学吧。", "tr": "推荐一个好地方给同学们吧。"}, {"src": "习 作你打算推荐什么地方？", "tr": "习作：你打算推荐什么地方？"}, {"src": "这个地方在哪里？", "tr": "这个地方在哪里？"}], "notes": "[]"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit_no": 3, "title": "暮江吟", "kind": "古诗", "dynasty": null, "author": null, "text": "一道残阳铺水中，半江瑟瑟半江红。可怜九月初三夜，露似真珠月似弓。", "glossary": [{"word": "残阳", "sense": "快要落山的太阳"}, {"word": "瑟瑟", "sense": "碧绿色"}, {"word": "可怜", "sense": "可爱"}, {"word": "真珠", "sense": "珍珠"}, {"word": "弓", "sense": "弯弓，形容弯月"}], "tr": "一道快要落山的太阳光铺在水面上，江水一半是碧绿的，一半是红色的。九月初三的夜晚多么可爱，露水像珍珠一样，月亮像弯弓一样。", "literal": [{"src": "一道残阳铺水中", "tr": "一道快要落山的太阳光铺在水面上"}, {"src": "半江瑟瑟半江红", "tr": "江水一半是碧绿的，一半是红色的"}, {"src": "可怜九月初三夜", "tr": "九月初三的夜晚多么可爱"}, {"src": "露似真珠月似弓", "tr": "露水像珍珠一样，月亮像弯弓一样"}], "notes": "[]"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit_no": 3, "title": "题西林壁", "kind": "古诗", "dynasty": "宋", "author": null, "text": "横看成岭侧成峰，远近高低各不同。不识庐山真面目，只缘身在此山中。", "glossary": [{"word": "缘", "sense": "因为"}, {"word": "真面目", "sense": "真实的面貌"}], "tr": "苏轼：从正面看是山岭，从侧面看是山峰，从远处、近处、高处、低处看，景色各不相同。认不清庐山真正的样子，只因为自己就在这座山中。残破的墙壁铺展着横峰侧面，在庐山的输降章评里阅读。议论梅花和雪哪个更好。", "literal": [{"src": "苏轼横看成岭侧成峰", "tr": "苏轼：从正面看是山岭，从侧面看是山峰"}, {"src": "远近高低各不同", "tr": "从远处、近处、高处、低处看，景色各不相同"}, {"src": "不识庐山真面目", "tr": "认不清庐山真正的样子"}, {"src": "只缘身在此山中", "tr": "只因为自己就在这座山中"}, {"src": "残壁铺横峰侧缘庐输降章评里读", "tr": "残破的墙壁铺展着横峰侧面，在庐山的输降章评里阅读"}, {"src": "议梅与雪的高下", "tr": "议论梅花和雪哪个更好"}], "notes": "[]"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit_no": 3, "title": "雪梅", "kind": "古诗", "dynasty": "宋", "author": null, "text": "卢钺梅雪争春未肯降骚人阁笔费评章‌。梅须逊雪三分白，雪却输梅一段香。暮残瑟缘降骚评逊《暮江吟》写了哪两个时间段的景色？作者观察了哪些景物？", "glossary": [{"word": "骚人", "sense": "指诗人"}, {"word": "阁笔", "sense": "放下笔"}, {"word": "评章", "sense": "评议，评论"}, {"word": "逊", "sense": "差，不如"}, {"word": "降", "sense": "服输，认输"}], "tr": "卢钺写梅花和雪争着报春，谁也不肯认输。诗人们放下笔，费尽心思也难以评判。梅花在洁白上要比雪差三分，雪在香气上却比梅花少一段。暮色残照，瑟音低回，诗人评说谁胜谁负。", "literal": [{"src": "卢钺梅雪争春未肯降", "tr": "卢钺写梅花和雪争着报春，谁也不肯认输。"}, {"src": "骚人阁笔费评章", "tr": "诗人们放下笔，费尽心思也难以评判。"}, {"src": "梅须逊雪三分白", "tr": "梅花在洁白上要比雪差三分。"}, {"src": "雪却输梅一段香", "tr": "雪在香气上却比梅花少一段。"}, {"src": "暮残瑟缘降骚评逊", "tr": "暮色残照，瑟音低回，诗人评说谁胜谁负。"}], "notes": "[]"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit_no": 8, "title": "凉州词", "kind": "古诗", "dynasty": "唐", "author": "王翰", "text": "葡萄美酒夜光杯，欲饮琵琶马上催。醉卧沙场君莫笑，古来征战几人回？", "glossary": [{"word": "夜光杯", "sense": "用美玉制成的酒杯，夜间能发光"}, {"word": "欲饮", "sense": "正要喝酒"}, {"word": "催", "sense": "催促，指催促出征"}, {"word": "醉卧", "sense": "醉酒后躺卧"}, {"word": "沙场", "sense": "战场，指沙漠中的战场"}, {"word": "征战", "sense": "出征打仗"}], "tr": "葡萄美酒盛在夜光杯里，正要喝酒，琵琶声在马上催促；醉倒在沙场上，请你不要笑，自古以来出征打仗的人有几个能回来呢？广。这里泛指英勇善战的将领。方游牧民族骑兵。部及河北北部。", "literal": [{"src": "葡萄美酒夜光杯，", "tr": "葡萄美酒盛在夜光杯里，"}, {"src": "欲饮琵琶马上催醉卧沙场君莫笑，", "tr": "正要喝酒，琵琶声在马上催促；醉倒在沙场上，请你不要笑，"}, {"src": "古来征战几人回？", "tr": "自古以来出征打仗的人有几个能回来呢？"}, {"src": "广。", "tr": "广。"}, {"src": "这里泛指英勇善战的将领。", "tr": "这里泛指英勇善战的将领。"}, {"src": "方游牧民族骑兵。", "tr": "方游牧民族骑兵。"}, {"src": "部及河北北部。", "tr": "部及河北北部。"}], "notes": "[]"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit_no": 8, "title": "出塞", "kind": "古诗", "dynasty": "唐", "author": "王昌龄", "text": "秦时明月汉时关，万里长征人未还。但使龙城飞将在，不教胡马度阴山‌。", "glossary": [{"word": "长征", "sense": "远行，远征"}, {"word": "但使", "sense": "只要"}, {"word": "飞将", "sense": "指汉代名将李广"}, {"word": "不教", "sense": "不让"}, {"word": "胡马", "sense": "指北方游牧民族的骑兵"}, {"word": "阴山", "sense": "山名，在今内蒙古境内"}], "tr": "秦朝时的明月照着汉朝时的边关，万里远征的将士至今还没有回来。只要龙城的飞将军还在，就不会让胡人的兵马越过阴山。", "literal": [{"src": "秦时明月汉时关，", "tr": "秦朝时的明月照着汉朝时的边关"}, {"src": "万里长征人未还。", "tr": "万里远征的将士至今还没有回来"}, {"src": "但使龙城飞将在，", "tr": "只要龙城的飞将军还在"}, {"src": "不教胡马度阴山‌。", "tr": "就不会让胡人的兵马越过阴山"}], "notes": "[]"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit_no": 8, "title": "夏日绝句", "kind": "古诗", "dynasty": "宋", "author": "李清照", "text": "生当作人杰死亦为鬼雄。至今思项羽，不肯过江东。什么。军领袖。邦争夺天下失败，有人劝他东渡长江，再作打算。但他觉得无颜见江东父老，不肯渡江，自杀身死。江东，长江在安徽芜湖、江苏南京间作西南、东北流向，古人习惯上称自此以下的长江南岸地区为江东。词萄葡杯塞秦项鬼将杰雄催君征塞秦杰鬼", "glossary": [{"word": "人杰", "sense": "人中的豪杰"}, {"word": "鬼雄", "sense": "鬼中的英雄"}, {"word": "江东", "sense": "长江下游南岸地区"}], "tr": "活着的时候应当做人中的豪杰，死了也要做鬼中的英雄。到现在还在怀念项羽，他不愿渡过江东。什么。军队的领袖。邦争夺天下失败，有人劝他向东渡过长江，再作打算。", "literal": [{"src": "生当作人杰死亦为鬼雄。", "tr": "活着的时候应当做人中的豪杰，死了也要做鬼中的英雄。"}, {"src": "至今思项羽，不肯过江东。", "tr": "到现在还在怀念项羽，他不愿渡过江东。"}, {"src": "什么。", "tr": "什么。"}, {"src": "军领袖。", "tr": "军队的领袖。"}, {"src": "邦争夺天下失败，有人劝他东渡长江，再作打算。", "tr": "邦争夺天下失败，有人劝他向东渡过长江，再作打算。"}], "notes": "[]"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit_no": 8, "title": "写信", "kind": "古诗", "dynasty": null, "author": null, "text": "书信曾经是人们和远方的亲人朋友互通消息、交流感情的主要方式，现在仍然是重要的联络手段。下面是小杰写给叔叔的一封信。写好的信要寄出去，还需要有信封，和同学交流一下写信封的注意事项。请给你的亲友或者其他人写一封信，可以通过邮局寄给对方，也可以通过电子邮件发给对方。习  作称呼问候语正文亲爱的叔叔：您好！您寄来的书已经收到了，我很喜欢。谢谢您！告诉您一个好消息，我们学校搬进了新的校园。新教室宽敞明亮，配有多媒体设备，上课时老师经常使用它们。学校有一个很大的操场，我每天都会去踢足球。搬进新校园，同学们每天都很开心。您好久没回来了，家里人都很想您。今年过年，您会回来吗？祝身体健康！侄儿小杰2023年12月10日祝福语署名日期", "glossary": [{"word": "互通", "sense": "互相沟通"}, {"word": "联络", "sense": "联系、沟通"}, {"word": "手段", "sense": "方法、方式"}, {"word": "注意事项", "sense": "需要注意的地方"}, {"word": "亲友", "sense": "亲戚朋友"}], "tr": "书信曾经是人们和远方的亲人朋友互相传递消息、交流感情的主要方式，现在仍然是重要的联络方式。下面是小杰写给叔叔的一封信。写好的信要寄出去，还需要有信封，和同学交流一下写信封时要注意的事情。请给你的亲友或者其他人写一封信，可以通过邮局寄给对方，", "literal": [{"src": "书信曾经是人们和远方的亲人朋友互通消息、交流感情的主要方式，现在仍然是重要的联络手段。", "tr": "书信曾经是人们和远方的亲人朋友互相传递消息、交流感情的主要方式，现在仍然是重要的联络方式。"}, {"src": "下面是小杰写给叔叔的一封信。", "tr": "下面是小杰写给叔叔的一封信。"}, {"src": "写好的信要寄出去，还需要有信封，和同学交流一下写信封的注意事项。", "tr": "写好的信要寄出去，还需要有信封，和同学交流一下写信封时要注意的事情。"}, {"src": "请给你的亲友或者其他人写一封信，可以通过邮局寄给对方，", "tr": "请给你的亲友或者其他人写一封信，可以通过邮局寄给对方，"}], "notes": "[]"}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": 1, "title": "四时田园杂兴（其二十五）", "kind": "古诗", "dynasty": null, "author": null, "text": "梅子金黄杏子肥，麦花雪白菜花稀。日长篱落无人过，惟有蜻蜓蛱蝶飞。", "glossary": [{"word": "杂兴", "sense": "随兴而写的诗"}, {"word": "篱落", "sense": "篱笆"}, {"word": "蛱蝶", "sense": "蝴蝶的一种"}, {"word": "疏疏", "sense": "稀疏的样子"}, {"word": "急走", "sense": "快速奔跑"}, {"word": "未成阴", "sense": "还没有形成树荫"}], "tr": "梅子已经变得金黄，杏子也长得又大又饱满。麦花白得像雪，油菜花已经稀稀落落了。白天变长了，篱笆边没有人经过，只有蜻蜓和蝴蝶在飞来飞去。", "literal": [{"src": "梅子金黄杏子肥，", "tr": "梅子已经变得金黄，杏子也长得又大又饱满。"}, {"src": "麦花雪白菜花稀。", "tr": "麦花白得像雪，油菜花已经稀稀落落了。"}, {"src": "日长篱落无人过，", "tr": "白天变长了，篱笆边没有人经过。"}, {"src": "惟有蜻蜓蛱蝶飞。", "tr": "只有蜻蜓和蝴蝶在飞来飞去。"}], "notes": "[]"}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": 1, "title": "宿新市徐公店", "kind": "古诗", "dynasty": null, "author": null, "text": "篱落疏疏一径深，树头新绿未成阴。儿童急走追黄蝶，飞入菜花无处寻。", "glossary": [], "tr": "篱笆稀稀落落，一条小路通向远方。树上新发的绿叶还没有形成树荫。小孩子飞快地奔跑着追赶黄色的蝴蝶，蝴蝶飞进了油菜花丛中，再也找不到了。", "literal": [{"src": "篱落疏疏一径深", "tr": "篱笆稀稀落落，一条小路通向远方"}, {"src": "树头新绿未成阴", "tr": "树上新发的绿叶还没有形成树荫"}, {"src": "儿童急走追黄蝶", "tr": "小孩子飞快地奔跑着追赶黄色的蝴蝶"}, {"src": "飞入菜花无处寻", "tr": "蝴蝶飞进了油菜花丛中，再也找不到了"}], "notes": "[]"}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": 1, "title": "清平乐·村居", "kind": "古诗", "dynasty": null, "author": null, "text": "清平乐·村居[宋] 辛弃疾茅檐低小，溪上青青草。醉里吴音相媚好，白发谁家翁媪大儿锄豆溪东，中儿正织鸡笼。最喜小儿亡赖，溪头卧剥莲蓬。这里读。闲居带湖 （今属江西）时写的。此地古代属吴地，所以称当地的方言为“吴音”。指顽皮、淘气。“亡”，这里读。", "glossary": [{"word": "茅檐", "sense": "茅草盖的屋檐"}, {"word": "吴音", "sense": "吴地的方言"}, {"word": "相媚好", "sense": "互相逗趣、取悦"}, {"word": "翁媪", "sense": "老翁和老妇"}, {"word": "亡赖", "sense": "同'无赖'，这里指顽皮、淘气"}, {"word": "莲蓬", "sense": "莲花开过后的花托"}], "tr": "茅草屋的屋檐又低又小，小溪边长满了青青的草。带着醉意的吴地方言互相逗趣，听起来很亲切，那满头白发的老翁老妇是谁家的呢。大儿子在溪东边的豆田里锄草，二儿子正在编织鸡笼。最让人喜欢的是小儿子顽皮可爱，他趴在溪边剥着莲蓬吃。", "literal": [{"src": "茅檐低小，", "tr": "茅草屋的屋檐又低又小，"}, {"src": "溪上青青草。", "tr": "小溪边长满了青青的草。"}, {"src": "醉里吴音相媚好，", "tr": "带着醉意的吴地方言互相逗趣，听起来很亲切，"}, {"src": "白发谁家翁媪。", "tr": "那满头白发的老翁老妇是谁家的呢。"}, {"src": "大儿锄豆溪东，", "tr": "大儿子在溪东边的豆田里锄草，"}, {"src": "中儿正织鸡笼。", "tr": "二儿子正在编织鸡笼。"}, {"src": "最喜小儿亡赖，", "tr": "最让人喜欢的是小儿子顽皮可爱，"}, {"src": "溪头卧剥莲蓬。", "tr": "他趴在溪边剥着莲蓬吃。"}], "notes": "[]"}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": 3, "title": "繁星（七一）", "kind": "古诗", "dynasty": null, "author": null, "text": "这些事——是永不漫灭的回忆：月明的园中，藤萝的叶下，母亲的膝上。本诗作者冰心，选作课文时有改动。", "glossary": [{"word": "漫灭", "sense": "磨灭，消失"}, {"word": "藤萝", "sense": "紫藤，一种攀援植物"}, {"word": "膝上", "sense": "膝盖上"}], "tr": "这些事情——是永远不会消失的回忆：月光明亮的园子里，藤萝的叶子下面，母亲的膝盖上。", "literal": [{"src": "这些事——是永不漫灭的回忆：", "tr": "这些事情——是永远不会消失的回忆："}, {"src": "月明的园中，", "tr": "月光明亮的园子里，"}, {"src": "藤萝的叶下，", "tr": "藤萝的叶子下面，"}, {"src": "母亲的膝上。", "tr": "母亲的膝盖上。"}], "notes": "[]"}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": 3, "title": "繁星（一三一）", "kind": "古诗", "dynasty": null, "author": null, "text": "大海啊！哪一颗星没有光？哪一朵花没有香？哪一次我的思潮里没有你波涛的清响？", "glossary": [{"word": "思潮", "sense": "思想、思绪"}, {"word": "清响", "sense": "清脆的响声"}, {"word": "藤萝", "sense": "一种攀援植物"}, {"word": "膝上", "sense": "膝盖上"}], "tr": "大海啊！哪一颗星星没有光亮呢？哪一朵花没有香味呢？哪一次我的思绪里没有你波涛的清脆声响呢？月光明亮的园子里，藤萝的叶子下面，母亲的膝盖上，唤起了你什么样的感受呢？", "literal": [{"src": "大海啊！", "tr": "大海啊！"}, {"src": "哪一颗星没有光？", "tr": "哪一颗星星没有光亮呢？"}, {"src": "哪一朵花没有香？", "tr": "哪一朵花没有香味呢？"}, {"src": "哪一次我的思潮里没有你波涛的清响？", "tr": "哪一次我的思绪里没有你波涛的清脆声响呢？"}, {"src": "\"月明的园中，藤萝的叶下，母亲的膝上\"，唤起了你怎样的感受？", "tr": "月光明亮的园子里，藤萝的叶子下面，母亲的膝盖上，唤起了你什么样的感受呢？"}], "notes": "[]"}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": 3, "title": "繁星（一五九）", "kind": "古诗", "dynasty": null, "author": null, "text": "母亲啊！天上的风雨来了，鸟儿躲到它的巢里；心中的风雨来了，我只躲到你的怀里。繁灭漫膝藤萝涛躲", "glossary": [{"word": "风雨", "sense": "风和雨，比喻困难或挫折"}, {"word": "巢", "sense": "鸟窝"}], "tr": "妈妈啊！天上的风雨来了，鸟儿就躲到它的巢里；心中的风雨来了，我只躲到你的怀里。", "literal": [{"src": "母亲啊！", "tr": "妈妈啊！"}, {"src": "天上的风雨来了，", "tr": "天上的风雨来了，"}, {"src": "鸟儿躲到它的巢里；", "tr": "鸟儿就躲到它的巢里；"}, {"src": "心中的风雨来了，", "tr": "心中的风雨来了，"}, {"src": "我只躲到你的怀里。", "tr": "我只躲到你的怀里。"}], "notes": "[]"}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": 6, "title": "囊萤夜读", "kind": "文言文", "dynasty": null, "author": null, "text": "胤恭勤不倦，博学多通。家贫不常得油，夏月则练囊盛数十萤火以照书，以夜继日焉。", "glossary": [{"word": "恭勤", "sense": "恭敬勤勉"}, {"word": "不倦", "sense": "不厌倦"}, {"word": "多通", "sense": "通晓很多"}, {"word": "不常", "sense": "不经常"}, {"word": "以夜继日", "sense": "日夜不停"}, {"word": "焉", "sense": "语气词，无实义"}], "tr": "胤恭敬勤勉，不知疲倦，学识广博，通晓很多知识。家里贫穷，不能经常得到灯油，夏天的时候就用白绢做的袋子装几十只萤火虫来照明读书，夜以继日地读书。", "literal": [{"src": "胤恭勤不倦", "tr": "胤恭敬勤勉，不知疲倦"}, {"src": "博学多通", "tr": "学识广博，通晓很多知识"}, {"src": "家贫不常得油", "tr": "家里贫穷，不能经常得到灯油"}, {"src": "夏月则练囊盛数十萤火以照书", "tr": "夏天的时候就用白绢做的袋子装几十只萤火虫来照明读书"}, {"src": "以夜继日焉", "tr": "夜以继日地读书"}], "notes": "[]"}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": 6, "title": "铁杵成针", "kind": "文言文", "dynasty": null, "author": null, "text": "磨针溪，在象耳山下。世传李太白读书山中，未成，弃去。过是②溪，逢老媪方③磨铁杵。问之，曰：\"欲作针。\"太白感其意④，还卒业⑤。", "glossary": [{"word": "世传", "sense": "世代相传，传说"}, {"word": "未成", "sense": "没有完成学业"}, {"word": "弃去", "sense": "放弃离开"}, {"word": "逢", "sense": "遇到"}, {"word": "老媪", "sense": "老妇人"}, {"word": "铁杵", "sense": "铁棒"}], "tr": "磨针溪，在象耳山的下面。世人传说李太白在山中读书，没有完成学业，就放弃离开了。经过这条溪，遇到一位老妇人正在磨铁杵。问老妇人，", "literal": [{"src": "磨针溪，在象耳山下。", "tr": "磨针溪，在象耳山的下面。"}, {"src": "世传李太白读书山中，未成，弃去。", "tr": "世人传说李太白在山中读书，没有完成学业，就放弃离开了。"}, {"src": "过是②溪，逢老媪方③磨铁杵。", "tr": "经过这条溪，遇到一位老妇人正在磨铁杵。"}, {"src": "问之，", "tr": "问老妇人，"}], "notes": "[]"}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": 7, "title": "芙蓉楼送辛渐", "kind": "古诗", "dynasty": null, "author": null, "text": "寒雨连江夜入吴，平明送客楚山孤。洛阳亲友如相问，一片冰心在玉壶。", "glossary": [{"word": "平明", "sense": "天刚亮的时候"}, {"word": "连江", "sense": "与江水相连"}, {"word": "楚山", "sense": "楚地的山"}, {"word": "如相问", "sense": "如果有人问起我"}, {"word": "冰心", "sense": "像冰一样纯洁的心"}, {"word": "玉壶", "sense": "玉做的壶"}], "tr": "寒冷的雨连着江水，夜里进入了吴地。天亮时送别客人，楚地的山显得孤单。洛阳的亲友如果问起我，我的心像冰一样纯洁，装在玉壶里。", "literal": [{"src": "寒雨连江夜入吴", "tr": "寒冷的雨连着江水，夜里进入了吴地"}, {"src": "平明送客楚山孤", "tr": "天亮时送别客人，楚地的山显得孤单"}, {"src": "洛阳亲友如相问", "tr": "洛阳的亲友如果问起我"}, {"src": "一片冰心在玉壶", "tr": "我的心像冰一样纯洁，装在玉壶里"}], "notes": "[]"}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": 7, "title": "塞下曲", "kind": "古诗", "dynasty": "唐", "author": null, "text": "月黑雁飞高，单于夜遁逃。欲将轻骑逐，大雪满弓刀。", "glossary": [{"word": "单于", "sense": "匈奴首领"}, {"word": "遁逃", "sense": "逃跑"}, {"word": "轻骑", "sense": "轻装骑兵"}, {"word": "弓刀", "sense": "弓箭和刀"}], "tr": "月亮被乌云遮住，大雁飞得很高。单于趁夜色逃跑。想要率领轻装骑兵去追赶，大雪落满了弓和刀。", "literal": [{"src": "月黑雁飞高，", "tr": "月亮被乌云遮住，大雁飞得很高。"}, {"src": "单于夜遁逃。", "tr": "单于趁夜色逃跑。"}, {"src": "欲将轻骑逐，", "tr": "想要率领轻装骑兵去追赶。"}, {"src": "大雪满弓刀。", "tr": "大雪落满了弓和刀。"}], "notes": "[]"}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": 7, "title": "墨梅", "kind": "古诗", "dynasty": "元", "author": "王冕", "text": "我家洗砚池头树，朵朵花开淡墨痕。不要人夸好颜色，只留清气满乾坤芙蓉洛单砚乾坤浙江绍兴）蕺山下有晋代大书法家王羲之的洗砚池。由于经常洗笔砚，池塘的水都染黑了。", "glossary": [{"word": "砚", "sense": "磨墨用的石头"}, {"word": "洗砚池", "sense": "洗毛笔的池子"}, {"word": "淡墨痕", "sense": "淡淡的墨色痕迹"}, {"word": "乾坤", "sense": "天地，指世间"}, {"word": "清气", "sense": "清正的香气，喻高洁品格"}], "tr": "我家洗砚池边上的那棵树，每一朵花开出来都是淡淡的墨色痕迹。不需要别人夸赞它颜色好看，因为经常洗笔砚，池塘的水都被染黑了。", "literal": [{"src": "我家洗砚池头树", "tr": "我家洗砚池边上的那棵树"}, {"src": "朵朵花开淡墨痕", "tr": "每一朵花开出来都是淡淡的墨色痕迹"}, {"src": "不要人夸好颜色", "tr": "不需要别人夸赞它颜色好看"}, {"src": "由于经常洗笔砚，池塘的水都染黑了", "tr": "因为经常洗笔砚，池塘的水都被染黑了"}], "notes": "[]"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 4, "title": "示儿", "kind": "古诗", "dynasty": "宋", "author": "陆游", "text": "死去元知万事空，但悲不见九州同。王师北定中原日，家祭无忘告乃翁。", "glossary": [{"word": "元知", "sense": "本来就知道"}, {"word": "但悲", "sense": "只是悲伤"}, {"word": "九州", "sense": "指中国"}, {"word": "王师", "sense": "指南宋朝廷的军队"}, {"word": "北定", "sense": "平定北方"}, {"word": "乃翁", "sense": "你们的父亲"}], "tr": "我本来就知道，人死后万事皆空，只是悲伤看不到九州统一。朝廷的军队北伐平定中原的那一天，在家祭的时候不要忘记告诉你的父亲。", "literal": [{"src": "死去元知万事空，", "tr": "我本来就知道，人死后万事皆空"}, {"src": "但悲不见九州同。", "tr": "只是悲伤看不到九州统一"}, {"src": "王师北定中原日，", "tr": "朝廷的军队北伐平定中原的那一天"}, {"src": "家祭无忘告乃翁。", "tr": "在家祭的时候不要忘记告诉你的父亲"}], "notes": "[]"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 4, "title": "题临安邸", "kind": "古诗", "dynasty": "宋", "author": "林升", "text": "山外青山楼外楼，西湖歌舞几时休？暖风熏得游人醉，直把杭州作汴州。", "glossary": [{"word": "几时休", "sense": "什么时候停止"}, {"word": "熏", "sense": "吹、吹拂"}, {"word": "游人", "sense": "指南宋权贵、达官贵人"}, {"word": "直把", "sense": "简直把"}], "tr": "山外有青山，楼外有高楼。西湖边的歌舞什么时候才能停止呢？温暖的风吹得游人陶醉，简直把杭州当成了汴州。", "literal": [{"src": "山外青山楼外楼，", "tr": "山外有青山，楼外有高楼。"}, {"src": "西湖歌舞几时休？", "tr": "西湖边的歌舞什么时候才能停止呢？"}, {"src": "暖风熏得游人醉，", "tr": "温暖的风吹得游人陶醉。"}, {"src": "直把杭州作汴州。", "tr": "简直把杭州当成了汴州。"}], "notes": "[]"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 4, "title": "己亥杂诗", "kind": "古诗", "dynasty": null, "author": null, "text": "己亥杂诗[清] 龚自珍九州生气恃风雷，万马齐喑究可哀。我劝天公重抖擞不拘一格降人材。乃  邸  熏  亥  龚  恃读懂诗歌的题目有助于我们理解诗歌的内容。从三首诗的题目中，你能了解到哪些信息？样的情感。自珍在己亥年（1839）写的一组诗，共315首。这里选的是其中一首。指朝气蓬勃的局面。无声。比喻人们沉默不语，不敢发表意见。喑，沉默。杭珍哀翁乃祭", "glossary": [{"word": "九州", "sense": "指中国"}, {"word": "恃", "sense": "依靠"}, {"word": "喑", "sense": "沉默，不说话"}, {"word": "究", "sense": "终究，毕竟"}, {"word": "抖擞", "sense": "振作精神"}, {"word": "天公", "sense": "指上天"}], "tr": "己亥年（1839年）写的杂诗，作者是清朝的龚自珍。整个国家要有活力，必须依靠像狂风和惊雷一样的巨大变革。所有的马都沉默不叫，这终究是令人悲哀的景象。我劝上天重新振作精神，不要拘泥于一种规格，要降下各种各样的人才。从三首诗的题目中，你能了解到哪些信息？样的情感。龚自珍在己亥年（1839年）写的一组诗，总共315首。", "literal": [{"src": "己亥杂诗[清] 龚自珍", "tr": "己亥年（1839年）写的杂诗，作者是清朝的龚自珍。"}, {"src": "九州生气恃风雷，", "tr": "整个国家要有活力，必须依靠像狂风和惊雷一样的巨大变革。"}, {"src": "万马齐喑究可哀。", "tr": "所有的马都沉默不叫，这终究是令人悲哀的景象。"}, {"src": "我劝天公重抖擞", "tr": "我劝上天重新振作精神。"}, {"src": "不拘一格降人材。", "tr": "不要拘泥于一种规格，要降下各种各样的人才。"}, {"src": "从三首诗的题目中，你能了解到哪些信息？", "tr": "从三首诗的题目中，你能了解到哪些信息？"}, {"src": "样的情感。", "tr": "样的情感。"}, {"src": "自珍在己亥年（1839）写的一组诗，共315首。", "tr": "龚自珍在己亥年（1839年）写的一组诗，总共315首。"}], "notes": "[]"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 7, "title": "山居秋暝", "kind": "古诗", "dynasty": "唐", "author": "王维", "text": "空山新雨后，天气晚来秋。明月松间照，清泉石上流。竹喧归浣女，莲动下渔舟。随意春芳歇，王孙自可留。", "glossary": [{"word": "空山", "sense": "空旷寂静的山"}, {"word": "新雨", "sense": "刚下的雨"}, {"word": "晚来", "sense": "傍晚时分"}, {"word": "浣女", "sense": "洗衣的女子"}, {"word": "王孙", "sense": "指诗人自己"}, {"word": "歇", "sense": "消散，停止"}], "tr": "空旷的山中刚下过一场雨，傍晚时分天气转凉，已是秋天。明亮的月光透过松林照射下来，清澈的泉水在石头上流淌。竹林里传来喧闹声，是洗衣归来的女子；莲叶摇动，是渔船顺流而下。任凭春天的花草凋谢，王孙自然可以留在这里。", "literal": [{"src": "空山新雨后，", "tr": "空旷的山中刚下过一场雨，"}, {"src": "天气晚来秋。", "tr": "傍晚时分天气转凉，已是秋天。"}, {"src": "明月松间照，", "tr": "明亮的月光透过松林照射下来，"}, {"src": "清泉石上流。", "tr": "清澈的泉水在石头上流淌。"}, {"src": "竹喧归浣女，", "tr": "竹林里传来喧闹声，是洗衣归来的女子，"}, {"src": "莲动下渔舟。", "tr": "莲叶摇动，是渔船顺流而下。"}, {"src": "随意春芳歇，", "tr": "任凭春天的花草凋谢，"}, {"src": "王孙自可留。", "tr": "王孙自然可以留在这里。"}], "notes": "[]"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 7, "title": "枫桥夜泊", "kind": "古诗", "dynasty": "唐", "author": "张继", "text": "月落乌啼霜满天，江枫渔火对愁眠。姑苏城外寒山寺，夜半钟声到客船。诗人自己。苏州有姑苏山而得名。座寺庙，相传唐代僧人寒山曾住于此。代诗人张籍，他在同族兄弟中排行第十八，曾任水部员外郎。细腻。酥，酥油。展开想象，说说下列诗句描绘的景象。暝  浣  愈  酥", "glossary": [{"word": "乌啼", "sense": "乌鸦啼叫"}, {"word": "江枫", "sense": "江边的枫树"}, {"word": "渔火", "sense": "渔船上的灯火"}, {"word": "愁眠", "sense": "因忧愁而难以入睡"}, {"word": "姑苏", "sense": "苏州的别称"}, {"word": "客船", "sense": "旅客所乘的船"}], "tr": "月亮落下，乌鸦啼叫，寒霜弥漫天空。江边的枫树和渔船上的灯火，陪伴着我这满怀愁绪的旅人入眠。苏州城外有座寒山寺。半夜里，寺庙的钟声传到了客船上。诗人自己。苏州因姑苏山而得名。一座寺庙相传唐代僧人寒山曾住在这里。", "literal": [{"src": "月落乌啼霜满天，", "tr": "月亮落下，乌鸦啼叫，寒霜弥漫天空。"}, {"src": "江枫渔火对愁眠。", "tr": "江边的枫树和渔船上的灯火，陪伴着我这满怀愁绪的旅人入眠。"}, {"src": "姑苏城外寒山寺，", "tr": "苏州城外有座寒山寺。"}, {"src": "夜半钟声到客船。", "tr": "半夜里，寺庙的钟声传到了客船上。"}, {"src": "诗人自己。", "tr": "诗人自己。"}, {"src": "苏州有姑苏山而得名。", "tr": "苏州因姑苏山而得名。"}, {"src": "座寺庙，", "tr": "一座寺庙"}, {"src": "相传唐代僧人寒山曾住于此。", "tr": "相传唐代僧人寒山曾住在这里。"}], "notes": "[]"}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 7, "title": "早春呈水部张十八员外", "kind": "古诗", "dynasty": "唐", "author": "韩愈", "text": "天街小雨润如酥草色遥看近却无。最是一年春好处，绝胜烟柳满皇都。眠孙寺愈维", "glossary": [{"word": "天街", "sense": "京城里的街道"}, {"word": "酥", "sense": "酥油，形容细腻润泽"}, {"word": "绝胜", "sense": "远远胜过"}, {"word": "烟柳", "sense": "像烟雾一样的柳树"}, {"word": "皇都", "sense": "京城"}], "tr": "京城的小雨细腻滋润，像酥油一样。远远看去有淡淡的草色，走近了却几乎看不见。这是一年中春天最美好的时候，远远胜过那满城烟柳的盛春景象。", "literal": [{"src": "天街小雨润如酥", "tr": "京城的小雨细腻滋润，像酥油一样。"}, {"src": "草色遥看近却无。", "tr": "远远看去有淡淡的草色，走近了却几乎看不见。"}, {"src": "最是一年春好处，", "tr": "这是一年中春天最美好的时候，"}, {"src": "绝胜烟柳满皇都。", "tr": "远远胜过那满城烟柳的盛春景象。"}], "notes": "[]"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit_no": 1, "title": "四时田园杂兴（其三十一）", "kind": "古诗", "dynasty": "宋", "author": "范成大", "text": "昼出耘田夜绩麻，村庄儿女各当家。童孙未解供耕织，也傍桑阴学种瓜。", "glossary": [{"word": "昼", "sense": "白天"}, {"word": "儿女", "sense": "指村庄里的成年男女"}, {"word": "当家", "sense": "主持家务"}, {"word": "童孙", "sense": "小孩子"}, {"word": "桑阴", "sense": "桑树荫下"}, {"word": "耕织", "sense": "耕田织布"}], "tr": "白天出去在田里除草，晚上在家搓麻线，村庄里的男男女女各自挑起家庭的重担。小孩子还不懂得耕田织布，也靠在桑树荫下学着种瓜。", "literal": [{"src": "昼出耘田夜绩麻，", "tr": "白天出去在田里除草，晚上在家搓麻线。"}, {"src": "村庄儿女各当家。", "tr": "村庄里的男男女女各自挑起家庭的重担。"}, {"src": "童孙未解供耕织，", "tr": "小孩子还不懂得耕田织布，"}, {"src": "也傍桑阴学种瓜。", "tr": "也靠在桑树荫下学着种瓜。"}], "notes": "[]"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit_no": 1, "title": "稚子弄冰", "kind": "古诗", "dynasty": null, "author": null, "text": "稚子金盆脱晓冰，彩丝穿取当银钲。敲成玉磬穿林响，忽作玻璃碎地声。", "glossary": [{"word": "稚子", "sense": "幼小的孩子"}, {"word": "脱", "sense": "取出"}, {"word": "晓冰", "sense": "早晨结的冰"}, {"word": "玉磬", "sense": "一种玉石打击乐器"}, {"word": "玻璃", "sense": "古代指一种天然玉石"}], "tr": "小孩子从金盆里取出早晨结的冰，用彩色的丝线穿起来当作银钲。敲起来像玉磬一样穿过树林发出响声，忽然发出像玻璃碎在地上一样的声音。", "literal": [{"src": "稚子金盆脱晓冰，", "tr": "小孩子从金盆里取出早晨结的冰"}, {"src": "彩丝穿取当银钲。", "tr": "用彩色的丝线穿起来当作银钲"}, {"src": "敲成玉磬穿林响，", "tr": "敲起来像玉磬一样穿过树林发出响声"}, {"src": "忽作玻璃碎地声。", "tr": "忽然发出像玻璃碎在地上一样的声音"}], "notes": "[]"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit_no": 1, "title": "村晚", "kind": "古诗", "dynasty": "宋", "author": "雷震", "text": "草满池塘水满陂山衔落日浸寒漪牧童归去横牛背，短笛无腔信口吹。根据古诗内容，展开想象，选择其中一首改写成短文。桑耘晓昼", "glossary": [{"word": "陂", "sense": "池岸，池塘的边"}, {"word": "衔", "sense": "含在嘴里，这里指山像含着落日"}, {"word": "浸", "sense": "浸泡，倒映在水中"}, {"word": "漪", "sense": "水波纹"}, {"word": "横", "sense": "横坐，随意地坐"}, {"word": "无腔", "sense": "不成曲调，没有固定的调子"}], "tr": "池塘边长满了青草，水也涨满了堤岸，山峦衔着落日，倒映在寒冷的波纹中，牧童骑在牛背上横着回家。短笛没有曲调，随口吹奏。根据古诗内容，展开想象，《村晚》：乡村傍晚的景色。清晨到白天，桑田里都在忙着耕种。", "literal": [{"src": "草满池塘水满陂山衔落日浸寒漪牧童归去横牛背，", "tr": "池塘边长满了青草，水也涨满了堤岸，山峦衔着落日，倒映在寒冷的波纹中，牧童骑在牛背上横着回家。"}, {"src": "短笛无腔信口吹。", "tr": "短笛没有曲调，随口吹奏。"}, {"src": "根据古诗内容，", "tr": "根据古诗内容，"}, {"src": "展开想象，", "tr": "展开想象，"}, {"src": "选择其中一首改写成短文。", "tr": "《村晚》：乡村傍晚的景色。"}, {"src": "桑耘晓昼", "tr": "清晨到白天，桑田里都在忙着耕种。"}], "notes": "[]"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit_no": 4, "title": "从军行", "kind": "古诗", "dynasty": "唐", "author": "王昌龄", "text": "青海长云暗雪山，孤城遥望玉门关。黄沙百战穿金甲，不破楼兰终不还。多写边塞情况和战士的生活。今甘肃敦煌西北。里泛指西域地区的各部族政权。有感》。地区，当时是叛军盘踞的地方。", "glossary": [{"word": "长云", "sense": "连绵不断的云"}, {"word": "暗", "sense": "使……变得暗淡"}, {"word": "穿", "sense": "磨破"}, {"word": "金甲", "sense": "金属铠甲"}, {"word": "终", "sense": "终究，最终"}], "tr": "青海湖上空连绵的乌云使雪山变得昏暗，孤零零的城池远远地望见玉门关。在黄沙中经历了无数次战斗，连铠甲都被磨穿了，不打败楼兰就绝不返回。多描写边塞的情况和战士们的生活。现在位于甘肃敦煌的西北方。泛指西域地区的各个部族政权。有感》。", "literal": [{"src": "青海长云暗雪山，", "tr": "青海湖上空连绵的乌云使雪山变得昏暗，"}, {"src": "孤城遥望玉门关。", "tr": "孤零零的城池远远地望见玉门关。"}, {"src": "黄沙百战穿金甲，", "tr": "在黄沙中经历了无数次战斗，连铠甲都被磨穿了，"}, {"src": "不破楼兰终不还。", "tr": "不打败楼兰就绝不返回。"}, {"src": "多写边塞情况和战士的生活。", "tr": "多描写边塞的情况和战士们的生活。"}, {"src": "今甘肃敦煌西北。", "tr": "现在位于甘肃敦煌的西北方。"}, {"src": "里泛指西域地区的各部族政权。", "tr": "泛指西域地区的各个部族政权。"}, {"src": "有感》。", "tr": "有感》。"}], "notes": "[]"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit_no": 4, "title": "秋夜将晓出篱门迎凉有感", "kind": "古诗", "dynasty": null, "author": null, "text": "三万里河东入海，五千仞岳上摩天。遗民泪尽胡尘里，南望王师又一年。", "glossary": [], "tr": "三万里长的黄河向东流入大海，五千仞高的华山向上直插云霄。沦陷区的百姓在胡人的统治下眼泪都流干了，盼望朝廷的军队收复失地，又过了一年。", "literal": [{"src": "三万里河东入海", "tr": "三万里长的黄河向东流入大海"}, {"src": "五千仞岳上摩天", "tr": "五千仞高的华山向上直插云霄"}, {"src": "遗民泪尽胡尘里", "tr": "沦陷区的百姓在胡人的统治下眼泪都流干了"}, {"src": "南望王师又一年", "tr": "盼望朝廷的军队收复失地，又过了一年"}], "notes": "[]"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit_no": 4, "title": "闻官军收河南河北", "kind": "古诗", "dynasty": "唐", "author": "杜甫", "text": "剑外忽传收蓟北，初闻涕泪满衣裳却看妻子愁何在，漫卷诗书喜欲狂。白日放歌须纵酒，青春作伴好还乡。即从巴峡穿巫峡，便下襄阳向洛阳。岳仞篱", "glossary": [{"word": "剑外", "sense": "剑门关以外，指蜀地"}, {"word": "蓟北", "sense": "泛指唐代幽州、蓟州一带"}, {"word": "却看", "sense": "回头看"}, {"word": "妻子", "sense": "妻子和儿女"}, {"word": "漫卷", "sense": "胡乱地卷起"}, {"word": "青春", "sense": "指春天"}], "tr": "在剑门关外忽然传来收复蓟北的消息，刚听到这个消息，眼泪就洒满了衣裳。回头看妻子和孩子，哪里还有忧愁，胡乱地卷起诗书，高兴得快要发狂。白天放声高歌，还要开怀痛饮，明媚的春光作伴，正好返回故乡。立刻从巴峡穿过巫峡，再顺流而下经过襄阳直奔洛阳。", "literal": [{"src": "剑外忽传收蓟北，", "tr": "在剑门关外忽然传来收复蓟北的消息"}, {"src": "初闻涕泪满衣裳", "tr": "刚听到这个消息，眼泪就洒满了衣裳"}, {"src": "却看妻子愁何在，", "tr": "回头看妻子和孩子，哪里还有忧愁"}, {"src": "漫卷诗书喜欲狂。", "tr": "胡乱地卷起诗书，高兴得快要发狂"}, {"src": "白日放歌须纵酒，", "tr": "白天放声高歌，还要开怀痛饮"}, {"src": "青春作伴好还乡。", "tr": "明媚的春光作伴，正好返回故乡"}, {"src": "即从巴峡穿巫峡，", "tr": "立刻从巴峡穿过巫峡"}, {"src": "便下襄阳向洛阳。", "tr": "再顺流而下经过襄阳直奔洛阳"}], "notes": "[]"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit_no": 5, "title": "摔跤", "kind": "篇", "dynasty": null, "author": null, "text": "“要不—摔跤。”“是吗？”小胖墩儿跳起来，立刻退后两步，一闪身脱了单褂儿，叉着腰说，“来吧，是一叉一搂的，还是随便摔？”小嘎子在家里跟人摔跤，一向仗着手疾眼快，从不单凭力气，自然不跟他一叉一搂。两人把“枪”和“鞭”放在门墩儿上，各自虎势儿一站，公鸡鹐架似的对起阵来。起初，小嘎子精神抖擞，欺负对手傻大黑粗，动转不灵，围着他猴儿似的蹦来蹦去，总想使巧招，下冷绊子，仿佛很占了上风。可是小胖墩儿也是个摔跤的惯手，塌着腰，合了裆，鼓着眼珠子，不露一点儿破绽。两人走马灯似的转了三四圈，终于三抓两挠，揪在了一起。这一来，小嘎子可上了当：小胖墩儿膀大腰粗，一身牛劲儿，任你怎样推拉拽顶，硬是扳他不动。小嘎子已有些沉不住气，刚想用脚腕子去钩他的腿，不料反给他把脚别住了。小胖墩儿趁势往旁侧里一推，咕咚一声，小嘎子摔了个仰面朝天。", "glossary": [], "tr": "", "literal": [], "notes": "[]"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit_no": 5, "title": "他像一棵挺脱的树", "kind": "篇", "dynasty": null, "author": null, "text": "他的身量与筋肉都发展到年岁前边去了。二十来岁，他已经很大很高，虽然肢体还没被年月铸成一定的格局，可是已经像个成人了—一个脸上身上都带出天真淘气的样子的大人。看着那高等的车夫，他计划着怎样杀进他的腰去，好更显出他的铁扇面似的胸与直硬的背。扭头看看自己的肩，多么宽，多么威严！杀好了腰，再穿上肥腿的白裤，裤脚用鸡肠子带儿系住，露出那对“出号”的大脚！是的，他无疑可以成为最出色的车夫，傻子似的他自己笑了。他没有什么模样，使他可爱的是脸上的精神。头不很大，圆眼，肉鼻子，两条眉很短很粗，头上永远剃得发亮；腮上没有多余的肉，脖子可是几乎与头一边儿粗；脸上永远红扑扑的，特别亮的是颧骨与右耳之间一块不小的疤—小时候在树下睡觉，被驴啃了一口。他不甚注意他的模样，他爱自己的脸正如同他爱自己的身体，都那么结实硬棒，他把脸仿佛算在四肢之内，只要硬棒就好。是的，到城里以后，他还能头朝下，倒着立半天。这样立着，他觉得，他就很像一棵树，上下没有一个地方不挺脱的。自此，严监生的病，一日重似一日，再不回头。诸亲六眷都来问候。五个侄子穿梭的过来陪郎中弄药。到中秋已后，医家都不下药了。把管庄的家人都从乡里叫了上来。病重得一连三天不能说话。晚间挤了一屋的人，桌上点着一盏灯。严监生喉咙里痰响得一进一出，一声不倒一声的，总不得断气，还把手从被单里拿取得这种称号。", "glossary": [], "tr": "", "literal": [], "notes": "[]"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit_no": 5, "title": "两茎灯草", "kind": "篇", "dynasty": null, "author": null, "text": "自此，严监生的病，一日重似一日，再不回头。诸亲六眷都来问候。五个侄子穿梭的过来陪郎中弄药。到中秋已后，医家都不下药了。把管庄的家人都从乡里叫了上来。病重得一连三天不能说话。晚间挤了一屋的人，桌上点着一盏灯。严监生喉咙里痰响得一进一出，一声不倒一声的，总不得断气，还把手从被单里拿出来，伸着两个指头。大侄子走上前来问道：“二叔，你莫不是还有两个亲人不曾见面？”他就把头摇了两三摇。二侄子走上前来问道：“二叔，莫不是还有两笔银子在那里，不曾吩咐明白？”他把两眼睁的的溜圆，把头又狠狠摇了几摇，越发指得紧了。奶妈抱着哥子插口道：“老爷想是因两位舅爷不在跟前，故此记念。”他听了这话，把眼闭着摇头，那手只是指着不动。赵氏慌忙揩揩眼泪，走近上前道：“爷，别人都说的不相干，只有我晓得你的意思！你是为那灯盏里点的是两茎灯草，不放心，恐费了油。我如今挑掉一茎就是了。”说罢，忙走去挑掉一茎。众人看严监生时，点一点头，把手垂下，登时就没了气。", "glossary": [], "tr": "", "literal": [], "notes": "[]"}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 1, "title": "宿建德江", "kind": "古诗", "dynasty": "唐", "author": "孟浩然", "text": "移舟泊烟渚，日暮客愁新。野旷天低树，江清月近人。", "glossary": [{"word": "烟渚", "sense": "烟雾笼罩的小洲"}, {"word": "野旷", "sense": "原野空旷辽阔"}, {"word": "翻墨", "sense": "像打翻的墨汁"}, {"word": "白雨", "sense": "大雨，雨点如白珠"}, {"word": "跳珠", "sense": "跳动的珍珠"}, {"word": "卷地风", "sense": "贴着地面刮起的风"}], "tr": "把船移近岸边，停泊在烟雾笼罩的小洲上。太阳落山了，旅人又添了新的愁绪。原野空旷，天空显得比树还低。江水清澈，月亮仿佛离人很近。", "literal": [{"src": "移舟泊烟渚", "tr": "把船移近岸边，停泊在烟雾笼罩的小洲上"}, {"src": "日暮客愁新", "tr": "太阳落山了，旅人又添了新的愁绪"}, {"src": "野旷天低树", "tr": "原野空旷，天空显得比树还低"}, {"src": "江清月近人", "tr": "江水清澈，月亮仿佛离人很近"}], "notes": "[]"}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 1, "title": "六月二十七日望湖楼醉书", "kind": "古诗", "dynasty": null, "author": null, "text": "黑云翻墨未遮山，白雨跳珠乱入船。卷地风来忽吹散，望湖楼下水如天。", "glossary": [{"word": "翻墨", "sense": "像打翻的墨汁一样翻滚"}, {"word": "跳珠", "sense": "像跳动的珍珠一样溅起"}, {"word": "卷地风", "sense": "贴着地面刮来的大风"}, {"word": "忽", "sense": "忽然，突然"}, {"word": "如天", "sense": "像天空一样平静开阔"}], "tr": "黑云像打翻的墨汁一样翻滚，还没有遮住山。白色的雨点像跳动的珍珠一样杂乱地落入船中。一阵卷地而来的风忽然把云吹散了。望湖楼下的水面平静得像天空一样。", "literal": [{"src": "黑云翻墨未遮山", "tr": "黑云像打翻的墨汁一样翻滚，还没有遮住山"}, {"src": "白雨跳珠乱入船", "tr": "白色的雨点像跳动的珍珠一样杂乱地落入船中"}, {"src": "卷地风来忽吹散", "tr": "一阵卷地而来的风忽然把云吹散了"}, {"src": "望湖楼下水如天", "tr": "望湖楼下的水面平静得像天空一样"}], "notes": "[]"}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 1, "title": "西江月·夜行黄沙道中", "kind": "古诗", "dynasty": null, "author": null, "text": "明月别枝惊鹊，清风半夜鸣蝉。稻花香里说丰年，听取蛙声一片。七八个星天外，两三点雨山前。旧时茅店社林边，路转溪桥忽见。", "glossary": [], "tr": "明亮的月光惊动了栖息在枝头的喜鹊，使它们离开树枝飞走。半夜里清凉的风吹过，蝉在鸣叫。在稻花的香气中，谈论着丰收的年景，听到一片青蛙的叫声。天边有七八颗星星，山前飘着两三点雨。从前熟悉的那家茅草小店就在土地庙旁的树林边，转过小路，经过溪上的小桥，忽然看见了它。", "literal": [{"src": "明月别枝惊鹊，", "tr": "明亮的月光惊动了栖息在枝头的喜鹊，使它们离开树枝飞走。"}, {"src": "清风半夜鸣蝉。", "tr": "半夜里清凉的风吹过，蝉在鸣叫。"}, {"src": "稻花香里说丰年，", "tr": "在稻花的香气中，谈论着丰收的年景。"}, {"src": "听取蛙声一片。", "tr": "听到一片青蛙的叫声。"}, {"src": "七八个星天外，", "tr": "天边有七八颗星星。"}, {"src": "两三点雨山前。", "tr": "山前飘着两三点雨。"}, {"src": "旧时茅店社林边，", "tr": "从前熟悉的那家茅草小店就在土地庙旁的树林边。"}, {"src": "路转溪桥忽见。", "tr": "转过小路，经过溪上的小桥，忽然看见了它。"}], "notes": "[]"}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 1, "title": "变形记", "kind": "古诗", "dynasty": null, "author": null, "text": "本单元课文运用了丰富的联想和想象，读来很有趣味。如果让你来想象自己变成另一种事物，会发生什么呢？你可以变得很小，如一只蚂蚁，一棵草，一粒石子；也可以变得很大，如一头大象，一辆汽车，甚至是一个星球。变形后，你生活的世界将随之发生改变。能会结交几位蚂蚁朋友，可能会跟着哪只小昆虫去探索一个全新的世界……身边走过，你会看到很多发生在路上的故事……从下面的题目中选一个来写你地球自述我是一条幸福的蚯蚓在房间里旅行夜晚，一棵大树下的故事发挥想象，把你“变形”后看到的景物、发生的事情等写下来，注意把重点部分写得详细一些。写完后，和同学交换习作，看看他们对你的“世界”是不是感兴趣，再参考他们的意见修改自己的习作。习  作", "glossary": [{"word": "运用", "sense": "使用，利用"}, {"word": "丰富", "sense": "很多，充足"}, {"word": "联想", "sense": "由一件事想到另一件事"}, {"word": "趣味", "sense": "有趣味，有意思"}, {"word": "事物", "sense": "东西，物件"}], "tr": "", "literal": [], "notes": "[]"}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 6, "title": "浪淘沙（其一）", "kind": "古诗", "dynasty": null, "author": null, "text": "九曲黄河万里沙，浪淘风簸自天涯。如今直上银河去，同到牵牛织女家。", "glossary": [{"word": "浪淘", "sense": "波浪淘洗"}, {"word": "风簸", "sense": "风浪颠簸"}, {"word": "直上", "sense": "径直向上"}, {"word": "同到", "sense": "一同到达"}], "tr": "黄河弯弯曲曲，夹带着万里黄沙，浪涛冲刷，风浪颠簸，从天边涌来。如今可以直上银河去，一同到牛郎织女的家去。", "literal": [{"src": "九曲黄河万里沙", "tr": "黄河弯弯曲曲，夹带着万里黄沙"}, {"src": "浪淘风簸自天涯", "tr": "浪涛冲刷，风浪颠簸，从天边涌来"}, {"src": "如今直上银河去", "tr": "如今可以直上银河去"}, {"src": "同到牵牛织女家", "tr": "一同到牛郎织女的家去"}], "notes": "[]"}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 6, "title": "江南春", "kind": "古诗", "dynasty": "唐", "author": "杜牧", "text": "千里莺啼绿映红，水村山郭酒旗风。南朝四百八十寺，多少楼台烟雨中。", "glossary": [{"word": "莺啼", "sense": "黄莺啼叫"}, {"word": "绿映红", "sense": "绿叶映衬红花"}, {"word": "山郭", "sense": "靠山的城郭"}, {"word": "酒旗", "sense": "酒家的旗帜"}, {"word": "楼台", "sense": "楼阁亭台"}], "tr": "千里江南，黄莺在啼叫，绿叶映衬着红花。临水的村庄，依山的城郭，酒旗在风中飘扬。南朝时期修建的四百八十座寺庙，有多少楼台亭阁笼罩在烟雨之中。", "literal": [{"src": "千里莺啼绿映红", "tr": "千里江南，黄莺在啼叫，绿叶映衬着红花。"}, {"src": "水村山郭酒旗风", "tr": "临水的村庄，依山的城郭，酒旗在风中飘扬。"}, {"src": "南朝四百八十寺", "tr": "南朝时期修建的四百八十座寺庙。"}, {"src": "多少楼台烟雨中", "tr": "有多少楼台亭阁笼罩在烟雨之中。"}], "notes": "[]"}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 6, "title": "书湖阴先生壁", "kind": "古诗", "dynasty": null, "author": null, "text": "茅檐长扫净无苔，花木成畦手自栽。一水护田将绿绕，两山排闼送青来。", "glossary": [{"word": "茅檐", "sense": "茅草屋的屋檐"}, {"word": "长扫", "sense": "经常打扫"}, {"word": "畦", "sense": "田园中分成的小区"}, {"word": "排闼", "sense": "推开门"}, {"word": "闼", "sense": "门"}], "tr": "茅草屋的屋檐经常打扫，干净得没有青苔。花草树木种成整齐的行，都是亲手栽种的。一条溪水环绕着农田，把绿色围在周围。两座青山像推开大门一样，把青翠的山色送了过来。", "literal": [{"src": "茅檐长扫净无苔", "tr": "茅草屋的屋檐经常打扫，干净得没有青苔。"}, {"src": "花木成畦手自栽", "tr": "花草树木种成整齐的行，都是亲手栽种的。"}, {"src": "一水护田将绿绕", "tr": "一条溪水环绕着农田，把绿色围在周围。"}, {"src": "两山排闼送青来", "tr": "两座青山像推开大门一样，把青翠的山色送了过来。"}], "notes": "[]"}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 6, "title": "意见不同怎么办", "kind": "古诗", "dynasty": null, "author": null, "text": "对生活中的很多事情，大家的意见会有分歧，需要协商才能解决。如，遇到下面这样的情况，应该怎么办呢？事  例有关方面的人爆竹声声辞旧岁，银花朵朵贺新年。噼里啪啦的爆竹、五彩缤纷的烟花，给人们带来浓浓的年味和喜庆气氛， 但也给环保、安全等方面带来很多问题。是否燃放烟花爆竹，一些城市的政策不断摇摆。那么，春节到底该不该燃放烟花爆竹呢？普通市民消防队员环卫工人鞭炮厂工人多年前，某市为了拓宽城市道路，砍掉了道路两边生长了几十年的大树。这件事引起了热议。有人认为，为拓宽城市道路，促进经济繁荣，砍树是值得的；有人认为，砍树容易栽树难，应该另想办法发展交通， 不应该砍树。到底是要路还是要树呢？司机交通运输局工作人员道路附近居民市政园林局局长分小组，选择一则材料进行讨论。讨论时，小组成员分别选择一个角色，推想这个角色可能的想法，从角色出发阐述对这个问题的看法。听到不同意见，要换位思考，积极沟通。◎ 准确把握别人的观点，不曲解，不断章取义。◎ 尊重不同意见，讨论问题时态度要平和，以理服人。", "glossary": [{"word": "分歧", "sense": "意见不一致"}, {"word": "协商", "sense": "商量讨论"}, {"word": "爆竹", "sense": "鞭炮"}, {"word": "辞旧岁", "sense": "告别旧的一年"}, {"word": "银花", "sense": "烟花绽放如银花"}, {"word": "贺新年", "sense": "祝贺新年"}], "tr": "对于生活中的很多事情，大家的意见会有不同，需要商量才能解决。比如，遇到下面这样的情况，应该怎么办呢？事例：有关方面的人——爆竹声声辞旧岁，银花朵朵贺新年。", "literal": [{"src": "对生活中的很多事情，大家的意见会有分歧，需要协商才能解决。", "tr": "对于生活中的很多事情，大家的意见会有不同，需要商量才能解决。"}, {"src": "如，遇到下面这样的情况，应该怎么办呢？", "tr": "比如，遇到下面这样的情况，应该怎么办呢？"}, {"src": "事 例有关方面的人爆竹声声辞旧岁，银花朵朵贺新年。", "tr": "事例：有关方面的人——爆竹声声辞旧岁，银花朵朵贺新年。"}], "notes": "[]"}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 6, "title": "学写倡议书", "kind": "古诗", "dynasty": null, "author": null, "text": "如果你有一个想法希望得到大家的支持，并一起实施，可以写一份倡议书。如，呼吁同学节约用水、合理使用一次性用品，建议家人朋友低碳出行、杜绝餐饮浪费，倡议居民分类投放垃圾。读读下面的倡议书，倡议书需要注意什么。习  作正文写清楚倡议的内容，可以分点说明。最后要署名并写上日期。“节约用水”倡议书同学们：我国是水资源紧缺的国家，爱护水资源是我们每个人的义务。节约用水不能仅仅是一句口号，我们要时时刻刻注意从自身做起。为此，我们向全校同学发出节约用水的倡议，让我们从今天起努力做到以下几点：1. 洗漱时，及时关掉水龙头。2. 一水多用，充分利用水资源。如，用淘米水浇花，用洗脸水冲厕所。3. 制作“节约用水”的标签并张贴。4. 看到浪费水的行为，及时劝说并制止。一份倡议，一个承诺，一种责任。亲爱的同学们，让我们行动起来吧！育英小学阳光中队全体少先队员12月8日标题也可以只写“倡议书”三个字。依据倡议的对象写称呼。有时也可以不用称呼， 在正文中点出即可。仿照上面的例子，结合你前期的调查写一份倡议书。根据倡议的对象，将倡议书发布在合适的地方，如校园的公告栏、小区的布告栏、网络平台。发布时要注意符合相关要求。", "glossary": [{"word": "倡议", "sense": "提出建议，号召大家一起做"}, {"word": "实施", "sense": "实际去做，实行"}, {"word": "呼吁", "sense": "号召大家做某事"}, {"word": "杜绝", "sense": "完全制止，不再发生"}, {"word": "低碳出行", "sense": "减少碳排放的出行方式"}, {"word": "分类投放", "sense": "按类别分开丢弃"}], "tr": "如果你有一个想法，希望得到大家的支持，并且大家一起去做，就可以写一份倡议书。比如，呼吁同学节约用水、合理使用一次性用品，建议家人朋友低碳出行、杜绝餐饮浪费，倡议居民分类投放垃圾。读读下面的倡议书，", "literal": [{"src": "如果你有一个想法希望得到大家的支持，并一起实施，可以写一份倡议书。", "tr": "如果你有一个想法，希望得到大家的支持，并且大家一起去做，就可以写一份倡议书。"}, {"src": "如，呼吁同学节约用水、合理使用一次性用品，建议家人朋友低碳出行、杜绝餐饮浪费，倡议居民分类投放垃圾。", "tr": "比如，呼吁同学节约用水、合理使用一次性用品，建议家人朋友低碳出行、杜绝餐饮浪费，倡议居民分类投放垃圾。"}, {"src": "读读下面的倡议书，", "tr": "读读下面的倡议书，"}], "notes": "[]"}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 7, "title": "两小儿辩日", "kind": "文言文", "dynasty": null, "author": null, "text": "孔子东游，见两小儿辩斗，问其故。一儿曰：“我以日始出时去人近，而日中时远也。”一儿曰：“我以日初出远，而日中时近也。”一儿曰：“ 日初出大如车盖，及日中则如盘盂 ，此不为远者小而近者大 乎？”一儿曰：“日初出沧沧凉凉，及其日中如探汤，此不为近者热而远者凉乎？”孔子不能决也。两小儿笑曰：“孰为汝多知乎？”题目为后人所加。盖，像雨伞一样。这里比喻天气很热。汤，热水。读i。邓哀王冲传》，题目为后人所加。曹冲，字仓舒，谥（）号邓哀王。嶷，出自《诗经·大雅·生民》，形容幼年聪慧。吴国的创建者。", "glossary": [{"word": "辩斗", "sense": "辩论、争论"}, {"word": "日中", "sense": "正午"}, {"word": "探汤", "sense": "把手伸进热水里"}, {"word": "决", "sense": "判断、裁决"}, {"word": "孰", "sense": "谁"}], "tr": "孔子向东游历，看见两个小孩在争论，问他们争论的原因。一个小孩说：我认为太阳刚出来时离人近，而正午时离人远。另一个小孩说：我认为太阳刚出来时离人远，而正午时离人近。一个小孩说：太阳刚出来时大得像车盖，", "literal": [{"src": "孔子东游，", "tr": "孔子向东游历，"}, {"src": "见两小儿辩斗，", "tr": "看见两个小孩在争论，"}, {"src": "问其故。", "tr": "问他们争论的原因。"}, {"src": "一儿曰：", "tr": "一个小孩说："}, {"src": "我以日始出时去人近，而日中时远也。", "tr": "我认为太阳刚出来时离人近，而正午时离人远。"}, {"src": "一儿曰：", "tr": "另一个小孩说："}, {"src": "我以日初出远，而日中时近也。", "tr": "我认为太阳刚出来时离人远，而正午时离人近。"}, {"src": "一儿曰：", "tr": "一个小孩说："}, {"src": "日初出大如车盖，", "tr": "太阳刚出来时大得像车盖，"}], "notes": "[]"}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 7, "title": "曹冲称象", "kind": "文言文", "dynasty": null, "author": null, "text": "邓哀王冲字仓舒。少聪察岐嶷 ，生五六岁，智意所及，有若成人之智。时孙权曾致巨象，太祖欲知其斤重，访之群下，咸莫能出其理。冲曰：“置象大船之上，而刻其水痕所至，称物以载之，则校可知矣。”太祖大悦，即施行焉。正确、流利地3 也。3 其理。", "glossary": [{"word": "咸", "sense": "都"}, {"word": "载", "sense": "装载"}, {"word": "校", "sense": "比较、核对"}, {"word": "刻", "sense": "刻记、标记"}, {"word": "水痕", "sense": "水留下的痕迹"}, {"word": "称", "sense": "称量"}], "tr": "邓哀王冲，字仓舒。小时候聪明机敏，与众不同，五六岁的时候，他的智慧和想法所达到的程度，好像成年人的智慧。当时孙权曾送来一头大象，太祖想知道它的重量，就向手下的人询问。", "literal": [{"src": "邓哀王冲字仓舒。", "tr": "邓哀王冲，字仓舒。"}, {"src": "少聪察岐嶷，", "tr": "小时候聪明机敏，与众不同，"}, {"src": "生五六岁，", "tr": "五六岁的时候，"}, {"src": "智意所及，", "tr": "他的智慧和想法所达到的程度，"}, {"src": "有若成人之智。", "tr": "好像成年人的智慧。"}, {"src": "时孙权曾致巨象，", "tr": "当时孙权曾送来一头大象，"}, {"src": "太祖欲知其斤重，", "tr": "太祖想知道它的重量，"}, {"src": "访之群下，", "tr": "就向手下的人询问，"}], "notes": "[]"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": 1, "title": "寒食", "kind": "古诗", "dynasty": "唐", "author": "韩翃", "text": "春城无处不飞花，寒食东风御柳斜。日暮汉宫传蜡烛，轻烟散入五侯家。者不详，写作时代大约在东汉末年。汉，银河。", "glossary": [{"word": "春城", "sense": "春天的京城"}, {"word": "寒食", "sense": "寒食节，清明前一两日"}, {"word": "御柳", "sense": "皇宫里的柳树"}, {"word": "日暮", "sense": "傍晚，太阳落山"}, {"word": "五侯", "sense": "指权贵豪门"}], "tr": "春天的京城，到处都飘着落花。寒食节这天，东风吹得皇宫里的柳树斜斜地飘着。傍晚时分，皇宫里传出赐蜡烛的命令。蜡烛的轻烟飘散，进入了五位权贵的家中。", "literal": [{"src": "春城无处不飞花", "tr": "春天的京城，到处都飘着落花。"}, {"src": "寒食东风御柳斜", "tr": "寒食节这天，东风吹得皇宫里的柳树斜斜地飘着。"}, {"src": "日暮汉宫传蜡烛", "tr": "傍晚时分，皇宫里传出赐蜡烛的命令。"}, {"src": "轻烟散入五侯家", "tr": "蜡烛的轻烟飘散，进入了五位权贵的家中。"}], "notes": "[]"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": 1, "title": "迢迢牵牛星", "kind": "古诗", "dynasty": null, "author": null, "text": "迢迢牵牛星迢迢牵牛星，皎皎河汉女。纤纤擢素手，札札弄机杼终日不成章，泣涕零如雨。河汉清且浅，相去复几许。盈盈一水间，脉脉不得语。结合牛郎织女的故事，说说《迢迢牵牛星》表达的情感。《十五夜望月》中的“不知秋思落谁家”委婉地表达了思念之情。在你读过的古诗词中，这三首古诗分别与哪些传统节日有关？还有一些古诗也写到了传统节日和习俗，查找资料了解一下。", "glossary": [{"word": "河汉", "sense": "银河"}, {"word": "擢", "sense": "伸出"}, {"word": "素手", "sense": "白皙的手"}, {"word": "泣涕", "sense": "眼泪"}, {"word": "几许", "sense": "多少"}, {"word": "相去", "sense": "相隔"}], "tr": "遥远的牵牛星，遥远的牵牛星，明亮的织女星。纤细地伸出白皙的手，织布机札札响，整天织不出花纹，哭泣的泪水像雨一样落下。银河又清又浅，相隔又能有多远呢。只隔着一道清清的水，", "literal": [{"src": "迢迢牵牛星迢迢牵牛星，", "tr": "遥远的牵牛星，遥远的牵牛星，"}, {"src": "皎皎河汉女。", "tr": "明亮的织女星。"}, {"src": "纤纤擢素手，", "tr": "纤细地伸出白皙的手，"}, {"src": "札札弄机杼终日不成章，", "tr": "织布机札札响，整天织不出花纹，"}, {"src": "泣涕零如雨。", "tr": "哭泣的泪水像雨一样落下。"}, {"src": "河汉清且浅，", "tr": "银河又清又浅，"}, {"src": "相去复几许。", "tr": "相隔又能有多远呢。"}, {"src": "盈盈一水间，", "tr": "只隔着一道清清的水，"}], "notes": "[]"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": 1, "title": "十五夜望月", "kind": "古诗", "dynasty": "唐", "author": "王建", "text": "中庭地白树栖鸦，冷露无声湿桂花。今夜月明人尽望，不知秋思落谁家。中秋节的夜晚。而呈现银白色。", "glossary": [{"word": "中庭", "sense": "庭院中间"}, {"word": "栖", "sense": "栖息，停留"}, {"word": "冷露", "sense": "秋天的露水"}, {"word": "尽", "sense": "都，全部"}, {"word": "秋思", "sense": "秋天的思念之情"}], "tr": "庭院里的地面被月光照得发白，树上栖息着乌鸦。冰冷的露水无声无息地打湿了桂花。今晚月色明亮，人们都在仰望，不知道这秋天的思念会落到谁家。", "literal": [{"src": "中庭地白树栖鸦，", "tr": "庭院里的地面被月光照得发白，树上栖息着乌鸦。"}, {"src": "冷露无声湿桂花。", "tr": "冰冷的露水无声无息地打湿了桂花。"}, {"src": "今夜月明人尽望，", "tr": "今晚月色明亮，人们都在仰望。"}, {"src": "不知秋思落谁家。", "tr": "不知道这秋天的思念会落到谁家。"}], "notes": "[]"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": 4, "title": "马诗", "kind": "古诗", "dynasty": "唐", "author": "李贺", "text": "大漠沙如雪，燕山月似钩。何当金络脑，快走踏清秋。", "glossary": [{"word": "钩", "sense": "弯刀，这里形容弯月"}, {"word": "快走", "sense": "飞快地奔跑"}, {"word": "踏", "sense": "踩踏，这里指奔驰"}], "tr": "大沙漠里的沙子像雪一样白，燕山上的月亮像弯钩一样。什么时候能戴上金色的笼头，在清爽的秋天里飞快地奔跑。", "literal": [{"src": "大漠沙如雪", "tr": "大沙漠里的沙子像雪一样白"}, {"src": "燕山月似钩", "tr": "燕山上的月亮像弯钩一样"}, {"src": "何当金络脑", "tr": "什么时候能戴上金色的笼头"}, {"src": "快走踏清秋", "tr": "在清爽的秋天里飞快地奔跑"}], "notes": "[]"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": 4, "title": "石灰吟", "kind": "古诗", "dynasty": "明", "author": "于谦", "text": "千锤万凿出深山，烈火焚烧若等闲。粉骨碎身浑不怕，要留清白在人间。三首古诗", "glossary": [{"word": "等闲", "sense": "平常，轻易"}, {"word": "浑", "sense": "全，都"}, {"word": "清白", "sense": "指纯洁的品格"}, {"word": "焚烧", "sense": "烧，烧灼"}], "tr": "经过千万次锤打和开凿，石灰石才从深山里被开采出来。烈火的焚烧对它来说就像平常事一样。即使粉身碎骨也完全不怕，只要把清白留在人世间。", "literal": [{"src": "千锤万凿出深山", "tr": "经过千万次锤打和开凿，石灰石才从深山里被开采出来。"}, {"src": "烈火焚烧若等闲", "tr": "烈火的焚烧对它来说就像平常事一样。"}, {"src": "粉骨碎身浑不怕", "tr": "即使粉身碎骨也完全不怕。"}, {"src": "要留清白在人间", "tr": "只要把清白留在人世间。"}], "notes": "[]"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": 4, "title": "竹石", "kind": "古诗", "dynasty": "清", "author": "郑燮", "text": "咬定青山不放松，立根原在破岩中。千磨万击还坚劲任尔东西南北风。", "glossary": [{"word": "咬定", "sense": "紧紧咬住，比喻坚定不动摇"}, {"word": "破岩", "sense": "破裂的岩石"}, {"word": "千磨万击", "sense": "形容经历无数磨难打击"}, {"word": "坚劲", "sense": "坚韧刚劲"}, {"word": "任尔", "sense": "任凭你"}], "tr": "紧紧抓住青山不放松，它的根原本就扎在破裂的岩石中。经历了千次磨砺万次打击仍然坚强有力，任凭你从东西南北各个方向吹来风。", "literal": [{"src": "咬定青山不放松", "tr": "紧紧抓住青山不放松"}, {"src": "立根原在破岩中", "tr": "它的根原本就扎在破裂的岩石中"}, {"src": "千磨万击还坚劲", "tr": "经历了千次磨砺万次打击仍然坚强有力"}, {"src": "任尔东西南北风", "tr": "任凭你从东西南北各个方向吹来风"}], "notes": "[]"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": 5, "title": "学弈", "kind": "文言文", "dynasty": null, "author": null, "text": "弈秋，通国之善弈者也。使弈秋诲二人弈，其一人专心致志，惟弈秋之为听一人虽听之，一心以为有鸿鹄 将至，思援弓缴而射之。虽与之俱学，弗若之矣。为是其智弗若与？曰：非然也。上》，题目为后人所加。弈，下棋。善于下棋，所以称为弈秋。秋的教诲。这里指带有丝绳的箭，射出后可以将箭收回。那个人。表示疑问。这里读。", "glossary": [{"word": "弈", "sense": "下棋"}, {"word": "惟", "sense": "只"}, {"word": "虽", "sense": "虽然"}, {"word": "援", "sense": "引、拉"}, {"word": "思", "sense": "想、打算"}, {"word": "以为", "sense": "认为"}], "tr": "弈秋，是全国最擅长下棋的人。让弈秋教两个人下棋，其中一个人专心致志，只听弈秋的教导。另一个人虽然在听，一心以为有大雁将要飞来，想着拉弓搭箭去射它。虽然和他一起学习，", "literal": [{"src": "弈秋，通国之善弈者也。", "tr": "弈秋，是全国最擅长下棋的人。"}, {"src": "使弈秋诲二人弈，", "tr": "让弈秋教两个人下棋，"}, {"src": "其一人专心致志，", "tr": "其中一个人专心致志，"}, {"src": "惟弈秋之为听", "tr": "只听弈秋的教导"}, {"src": "一人虽听之，", "tr": "另一个人虽然在听，"}, {"src": "一心以为有鸿鹄将至，", "tr": "一心以为有大雁将要飞来，"}, {"src": "思援弓缴而射之。", "tr": "想着拉弓搭箭去射它。"}, {"src": "虽与之俱学，", "tr": "虽然和他一起学习，"}], "notes": "[]"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": 5, "title": "两小儿辩日", "kind": "文言文", "dynasty": null, "author": null, "text": "孔子东游，见两小儿辩斗，问其故。一儿曰：“我以日始出时去人近，而日中时远也。”一儿曰：“我以日初出远，而日中时近也。”一儿曰：“日初出大如车盖，及日中则如盘盂 ，此不为远者小而近者大乎？”一儿曰：“日初出沧沧凉凉，及其日中如探汤，此不为近者热而远者凉乎？”孔子不能决也。两小儿笑曰：“孰为汝多知乎？”题目为后人所加。篷盖，像雨伞一样。这里比喻天气很热。汤，热水。里读。正确、流利地3 弈者也。3 也。对照注释，想想每句话的意思，再连起来说说故事的内容。在《两小儿辩日》中，两个小孩的观点分别是什么？他们是怎样说明自己的观点的？", "glossary": [{"word": "辩斗", "sense": "辩论、争论"}, {"word": "日中", "sense": "正午"}, {"word": "探汤", "sense": "把手伸进热水里"}, {"word": "决", "sense": "判断、裁决"}, {"word": "孰", "sense": "谁"}], "tr": "孔子向东游历，看见两个小孩在争论，问他们争论的原因。一个小孩说：我认为太阳刚出来时离人近，而正午时离人远。另一个小孩说：我认为太阳刚出来时离人远，而正午时离人近。一个小孩说：太阳刚出来时大得像车盖，", "literal": [{"src": "孔子东游，", "tr": "孔子向东游历，"}, {"src": "见两小儿辩斗，", "tr": "看见两个小孩在争论，"}, {"src": "问其故。", "tr": "问他们争论的原因。"}, {"src": "一儿曰：", "tr": "一个小孩说："}, {"src": "我以日始出时去人近，而日中时远也。", "tr": "我认为太阳刚出来时离人近，而正午时离人远。"}, {"src": "一儿曰：", "tr": "另一个小孩说："}, {"src": "我以日初出远，而日中时近也。", "tr
