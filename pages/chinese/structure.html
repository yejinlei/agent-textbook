": 20, "gist": "船长镇定指挥救援，秩序井然"}, {"from": 21, "to": 27, "gist": "船长巍然屹立指挥到最后，轮船下沉"}], "main": "“诺曼底号”被撞后，哈尔威船长镇定指挥救援，最终与船一同沉没。", "genre": "记事写人", "why": "叙述海难事件，刻画船长形象"}, {"title": "挑山工", "book": "四年级下册", "grade": "四年级", "term": "下册", "unit_no": 7, "unit": "第七单元", "page": 114, "n": 4, "parts": [{"from": 0, "to": 1, "gist": "描写挑山工的外形、装备及折尺形登山路线及其原因。"}, {"from": 2, "to": 3, "gist": "指出曲折路线使路程加倍，但挑山工用时并不比游人多。"}], "main": "描写泰山挑山工的外形和折尺形登山路线，指出他们虽路程加倍但用时不比游人多。", "genre": "记事写人", "why": "记叙泰山见闻，描写挑山工形象"}, {"title": "巨人的花园", "book": "四年级下册", "grade": "四年级", "term": "下册", "unit_no": 8, "unit": "第八单元", "page": 125, "n": 16, "parts": [{"from": 0, "to": 1, "gist": "孩子们喜欢在巨人美丽的花园里玩耍"}, {"from": 2, "to": 4, "gist": "巨人回来后砌墙禁止孩子们进入花园"}, {"from": 5, "to": 9, "gist": "花园因没有孩子而四季如冬，春天迟迟不来"}, {"from": 10, "to": 12, "gist": "孩子们从墙洞爬回花园，春天随之到来"}, {"from": 13, "to": 15, "gist": "巨人醒悟后拥抱孩子，春天回到花园"}], "main": "巨人因自私砌墙赶走孩子，花园失去春天；醒悟后拥抱孩子，春天重回花园。", "genre": "童话寓言", "why": "巨人、会说话的雪霜等奇幻元素"}, {"title": "海的女儿", "book": "四年级下册", "grade": "四年级", "term": "下册", "unit_no": 8, "unit": "第八单元", "page": 129, "n": 6, "parts": [{"from": 0, "to": 2, "gist": "描写大海的蓝、清、深，以及海底奇异的植物、游鱼和海王宫殿。"}, {"from": 3, "to": 3, "gist": "描写海王宫殿的珊瑚墙、琥珀窗和含珍珠的蚌壳屋顶。"}, {"from": 4, "to": 5, "gist": "说明课文有改动，并提示这是童话开头部分及阅读要求。"}], "main": "课文描写了美丽深邃的大海、奇异的海洋生物和海王宫殿，是童话《海的女儿》的开头部分。", "genre": "童话寓言", "why": "安徒生著名童话作品"}, {"title": "宝葫芦的秘密（节选）", "book": "四年级下册", "grade": "四年级", "term": "下册", "unit_no": 8, "unit": "第八单元", "page": 122, "n": 25, "parts": [{"from": 0, "to": 4, "gist": "王葆介绍自己并引出宝葫芦的故事话题。"}, {"from": 5, "to": 16, "gist": "奶奶每次要求王葆做事都要给他讲故事作为条件。"}, {"from": 17, "to": 19, "gist": "奶奶讲的宝葫芦故事里，得到宝葫芦的人要什么有什么。"}, {"from": 20, "to": 23, "gist": "王葆常常幻想自己有一个宝葫芦来解决生活中的困难。"}, {"from": 24, "to": 24, "gist": "列出课文中的难字。"}], "main": "王葆回忆奶奶给他讲宝葫芦的故事，并幻想自己有一个宝葫芦来解决生活中的困难。", "genre": "童话寓言", "why": "宝葫芦是虚构的神奇物品"}, {"title": "桂花雨​", "book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 1, "unit": "第一单元", "page": 2, "n": 12, "parts": [{"from": 0, "to": 1, "gist": "中秋节前后桂花盛开，作者最喜欢桂花"}, {"from": 2, "to": 3, "gist": "母亲担心台风，桂花成熟时要及时摇落"}, {"from": 4, "to": 7, "gist": "摇桂花的快乐及桂花的用途"}, {"from": 8, "to": 9, "gist": "杭州桂花虽香，母亲仍觉得不如家乡的"}, {"from": 10, "to": 11, "gist": "作者怀念故乡童年摇花乐和桂花雨"}], "main": "作者回忆故乡童年摇桂花的快乐，表达对故乡和童年生活的怀念", "genre": "散文", "why": "第一人称回忆童年摇桂花经历"}, {"title": "落花生", "book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 1, "unit": "第一单元", "page": 5, "n": 17, "parts": [{"from": 0, "to": 1, "gist": "种花生、过收获节"}, {"from": 2, "to": 5, "gist": "父亲到来，问花生的好处"}, {"from": 6, "to": 8, "gist": "孩子们说花生的好处"}, {"from": 9, "to": 10, "gist": "父亲说花生最可贵之处"}, {"from": 11, "to": 14, "gist": "父亲教导要做有用的人"}, {"from": 15, "to": 16, "gist": "父亲的话印在心上，分角色朗读"}], "main": "通过种花生、议花生的故事，父亲教导孩子们要做有用的人，不要做只讲体面而对别人没有好处的人。", "genre": "散文", "why": "记叙家庭种花生及议论"}, {"title": "珍珠鸟", "book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 1, "unit": "第一单元", "page": 7, "n": 15, "parts": [{"from": 0, "to": 2, "gist": "朋友送珍珠鸟，我用吊兰垂蔓蒙盖鸟笼使其安全自在"}, {"from": 3, "to": 4, "gist": "我不惊扰它们，雏儿出生，我们渐渐熟悉"}, {"from": 5, "to": 8, "gist": "雏儿出笼在屋里活动，我不管它，它也不飞出去"}, {"from": 9, "to": 10, "gist": "雏儿渐渐亲近我，完全放心地啄我笔尖和手指"}, {"from": 11, "to": 12, "gist": "雏儿白天陪伴我，一天竟趴在我肩头睡着了"}, {"from": 13, "to": 14, "gist": "我写下感受：信赖创造美好境界，附生字表"}], "main": "珍珠鸟从怕人到亲近我，最终睡在我肩头，信赖创造了美好的境界。", "genre": "散文", "why": "第一人称记述养鸟经历"}, {"title": "冀中的地道战", "book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 2, "unit": "第二单元", "page": 14, "n": 5, "parts": [{"from": 0, "to": 1, "gist": "日本侵略军'大扫荡'，冀中人民在共产党领导下创造地道战。"}, {"from": 2, "to": 3, "gist": "地道战是奇迹，式样有一百多种，任丘地道结构精巧。"}, {"from": 4, "to": 4, "gist": "用较快的速度阅读。"}], "main": "冀中人民在共产党领导下创造地道战，粉碎敌人'扫荡'，坚持敌后游击战争。", "genre": "说明文", "why": "介绍地道战的结构与功能"}, {"title": "“诺曼底号”遇难记", "book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 2, "unit": "第二单元", "page": 25, "n": 6, "parts": [{"from": 0, "to": 1, "gist": "介绍'诺曼底号'邮船及哈尔威船长夜间航行"}, {"from": 2, "to": 3, "gist": "浓雾弥漫，夜色漆黑，轮船缓缓行驶"}, {"from": 4, "to": 5, "gist": "玛丽号突然出现直逼诺曼底号"}], "main": "1870年3月17日夜，哈尔威船长驾驶'诺曼底号'在浓雾中航行，'玛丽号'突然出现直逼而来。", "genre": "记事写人", "why": "叙述海难事件，刻画船长形象"}, {"title": "将相和", "book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 2, "unit": "第二单元", "page": 17, "n": 9, "parts": [{"from": 0, "to": 2, "gist": "战国时秦国强大，秦王欲以十五城换和氏璧，赵王及大臣左右为难。"}, {"from": 3, "to": 6, "gist": "蔺相如主动请缨带璧赴秦，赵王派他前往秦国。"}, {"from": 7, "to": 8, "gist": "蔺相如到秦国献璧，秦王双手捧着璧。"}], "main": "秦王欲以十五城换赵王和氏璧，赵王为难，蔺相如主动请缨带璧赴秦，到秦国后献上和氏璧。", "genre": "记事写人", "why": "叙述蔺相如完璧归赵的故事"}, {"title": "猎人海力布​", "book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 3, "unit": "第三单元", "page": 34, "n": 9, "parts": [{"from": 0, "to": 1, "gist": "介绍民间故事背景及猎人海力布热心助人的品质"}, {"from": 2, "to": 5, "gist": "海力布救小白蛇，获赠能听懂动物语言的宝石"}, {"from": 6, "to": 7, "gist": "海力布得知灾难将至，焦急劝说村民搬家"}, {"from": 8, "to": 8, "gist": "生字词学习"}], "main": "猎人海力布救小白蛇获赠宝石，能听懂动物语言，得知灾难后焦急劝说村民搬家。", "genre": "神话传说", "why": "民间故事，含超自然元素"}, {"title": "牛郎织女（一）​", "book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 3, "unit": "第三单元", "page": 37, "n": 24, "parts": [{"from": 0, "to": 2, "gist": "牛郎受哥嫂虐待，与老牛相依为命，因放牛得名牛郎。"}, {"from": 3, "to": 5, "gist": "牛郎悉心照料老牛，与牛亲密交流，希望牛能说话。"}, {"from": 6, "to": 9, "gist": "哥嫂分家赶走牛郎，牛郎牵牛拉车离家，在山前安家。"}, {"from": 10, "to": 14, "gist": "老牛开口说话，告知牛郎去湖边捡仙女纱衣的机会。"}, {"from": 15, "to": 18, "gist": "牛郎到湖边捡起粉红纱衣，与织女相识并互诉衷情。"}, {"from": 19, "to": 21, "gist": "织女讲述天上无自由之苦，二人决定结为夫妻。"}, {"from": 22, "to": 23, "gist": "牛郎织女回到草房，老牛迎接新娘，课文提示发挥想象。"}], "main": "牛郎受哥嫂虐待与老牛相依为命，老牛指点他结识织女，二人结为夫妻。", "genre": "神话传说", "why": "牛郎织女是民间神话传说故事"}, {"title": "牛郎织女（二）​", "book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 3, "unit": "第三单元", "page": 42, "n": 3, "parts": [{"from": 0, "to": 1, "gist": "牛郎织女婚后生活美满，老牛临终嘱咐牛郎留下牛皮以备急用。"}, {"from": 2, "to": 2, "gist": "用之前学到的阅读方法尽可能快地阅读。"}], "main": "牛郎织女婚后生活幸福美满，老牛临终嘱咐牛郎留下牛皮以备急用。", "genre": "神话传说", "why": "牛郎织女为经典民间神话故事"}, {"title": "圆明园的毁灭​", "book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 4, "unit": "第四单元", "page": 56, "n": 6, "parts": [{"from": 0, "to": 0, "gist": "圆明园的毁灭是中国和世界文化史上不可估量的损失。"}, {"from": 1, "to": 4, "gist": "圆明园建筑宏伟、收藏珍贵，是举世闻名的皇家园林。"}, {"from": 5, "to": 5, "gist": "英法联军侵入北京，掠夺并焚毁圆明园。"}], "main": "圆明园是举世闻名的皇家园林，建筑宏伟、收藏珍贵，却被英法联军掠夺焚毁，是文化史上不可估量的损失。", "genre": "说明文", "why": "介绍圆明园并叙述其毁灭"}, {"title": "梅兰芳蓄须明志​", "book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 4, "unit": "第四单元", "page": 59, "n": 10, "parts": [{"from": 0, "to": 2, "gist": "梅兰芳为抗日蓄须明志，表示不给侵略者演戏的决心。"}, {"from": 3, "to": 5, "gist": "梅兰芳拒绝戏园子老板的优厚条件和日本人的演出要求。"}, {"from": 6, "to": 7, "gist": "梅兰芳请医生朋友帮忙装病，成功摆脱日本人的纠缠。"}, {"from": 8, "to": 9, "gist": "抗战胜利后梅兰芳剃须登台，其民族气节令人敬佩。"}], "main": "梅兰芳在抗日战争期间蓄须明志，拒绝为侵略者演出，以各种方式坚持民族气节，胜利后剃须登台。", "genre": "记事写人", "why": "记叙梅兰芳蓄须明志的事迹"}, {"title": "太阳​", "book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 5, "unit": "第五单元", "page": 66, "n": 9, "parts": [{"from": 0, "to": 2, "gist": "太阳离我们很远，体积很大，温度很高。"}, {"from": 3, "to": 8, "gist": "太阳虽然离我们很远，但与人类关系非常密切。"}], "main": "课文介绍了太阳的远、大、热三个特点，以及太阳与人类和地球密切的关系。", "genre": "说明文", "why": "介绍太阳特征及与地球关系"}, {"title": "金字塔​", "book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 5, "unit": "第五单元", "page": 68, "n": 14, "parts": [{"from": 0, "to": 1, "gist": "介绍金字塔的由来、名称及保存现状。"}, {"from": 2, "to": 6, "gist": "介绍胡夫金字塔的建造时间、尺寸、重量及建造技术。"}, {"from": 7, "to": 13, "gist": "通过练习和讨论，学习说明性文章的说明方法。"}], "main": "课文介绍胡夫金字塔的规模与建造技术，并引导学生学习说明性文章的说明方法。", "genre": "说明文", "why": "用数据、比较等说明方法介绍金字塔"}, {"title": "慈母情深​", "book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 6, "unit": "第六单元", "page": 76, "n": 36, "parts": [{"from": 0, "to": 4, "gist": "我想买《青年近卫军》，想得整天失魂落魄。"}, {"from": 5, "to": 6, "gist": "我来到母亲上班的街道小厂向她要钱。"}, {"from": 7, "to": 16, "gist": "工厂环境恶劣，我穿过缝纫机找到瘦弱的母亲。"}, {"from": 17, "to": 18, "gist": "母亲疲惫的眼睛让我体会到她挣钱的艰难。"}, {"from": 19, "to": 27, "gist": "我向母亲要钱买书，母亲问清用途和金额。"}, {"from": 28, "to": 30, "gist": "母亲掏出皱皱的毛票，不顾旁人劝阻把钱塞给我。"}, {"from": 31, "to": 33, "gist": "母亲立刻继续干活，我鼻子一酸攥着钱跑出去。"}, {"from": 34, "to": 35, "gist": "我用钱给母亲买水果罐头，母亲责怪我不该买。"}], "main": "我想买书向母亲要钱，看到母亲在恶劣环境中辛苦劳作仍毫不犹豫给我钱，深受感动后为母亲买了水果罐头。", "genre": "记事写人", "why": "叙述向母亲要钱买书的事"}, {"title": "航天员写给孩子的信", "book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 6, "unit": "第六单元", "page": 84, "n": 17, "parts": [{"from": 0, "to": 2, "gist": "妈妈在儿童节写信，表达对孩子的爱与不舍，解释拒绝孩子送行的原因。"}, {"from": 3, "to": 3, "gist": "介绍神舟十四号任务背景及阅读要求。"}, {"from": 4, "to": 6, "gist": "妈妈表达梦想与使命，承诺完成任务，叮嘱孩子照顾家人。"}, {"from": 7, "to": 9, "gist": "妈妈鼓励孩子树立梦想、勇敢面对困难、养成好习惯。"}, {"from": 10, "to": 11, "gist": "妈妈分别对女儿和儿子送上入学寄语，表达深沉的爱。"}, {"from": 12, "to": 14, "gist": "回忆分别场景，告诉孩子想妈妈时抬头看星空。"}, {"from": 15, "to": 16, "gist": "夜深思念孩子，落款签名。"}], "main": "航天员妈妈在出征前写给孩子的信，表达不舍与爱，叮嘱孩子照顾家人、树立梦想、养成好习惯。", "genre": "散文", "why": "书信体，情感真挚的散文"}, {"title": "父爱之舟", "book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 6, "unit": "第六单元", "page": 80, "n": 11, "parts": [{"from": 0, "to": 1, "gist": "梦中回忆父母半夜喂蚕、父亲卖茧后给'我'买枇杷"}, {"from": 2, "to": 4, "gist": "父亲借船送'我'上学、庙会中做万花筒、背'我'冒雨上学"}, {"from": 5, "to": 6, "gist": "父亲凑钱送'我'住校，'我'以考试为法宝从未落榜"}, {"from": 7, "to": 9, "gist": "父亲摇船送'我'赴无锡报考，缝补棉被的背影永难忘怀"}, {"from": 10, "to": 10, "gist": "梦醒枕边一片湿，父爱之舟载满深情"}], "main": "全文通过梦境回忆父亲借船送'我'上学、庙会做万花筒、背'我'冒雨上学等往事，展现深沉的父爱。", "genre": "散文", "why": "以第一人称回忆父亲往事抒情"}, {"title": "第一场雪​", "book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 7, "unit": "第七单元", "page": 94, "n": 7, "parts": [{"from": 0, "to": 1, "gist": "寒流侵入胶东半岛的消息"}, {"from": 2, "to": 3, "gist": "天气骤变，大雪纷纷落下"}, {"from": 4, "to": 5, "gist": "雪后清晨，粉妆玉砌的美丽雪景"}, {"from": 6, "to": 6, "gist": "课文标题"}], "main": "课文描写了胶东半岛第一场雪从寒流侵入、大雪纷落到雪后美景的全过程。", "genre": "写景状物", "why": "全文描绘雪景与雪后风光"}, {"title": "白鹭​", "book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 7, "unit": "第七单元", "page": 96, "n": 13, "parts": [{"from": 0, "to": 4, "gist": "白鹭色素身段精巧适宜，却因常见而被人们忘却其美。"}, {"from": 5, "to": 8, "gist": "白鹭在清水田钓鱼、树顶站立、黄昏低飞，构成优美画面。"}, {"from": 9, "to": 11, "gist": "白鹭不是铿锵的歌，而是一首韵在骨子里的散文诗。"}, {"from": 12, "to": 12, "gist": "生字词及朗读要求。"}], "main": "白鹭外形精巧适宜，在清水田、树顶、黄昏中展现优美姿态，是一首韵在骨子里的散文诗。", "genre": "写景状物", "why": "描写白鹭外形与姿态之美"}, {"title": "忆读书", "book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 8, "unit": "第八单元", "page": 104, "n": 12, "parts": [{"from": 0, "to": 4, "gist": "作者回忆童年因听舅父讲故事而开始读《三国演义》的经历"}, {"from": 5, "to": 6, "gist": "作者阅读《水浒传》《红楼梦》等古典小说的体会"}, {"from": 7, "to": 10, "gist": "作者总结读书之乐并学会比较挑选好书"}, {"from": 11, "to": 11, "gist": "作者以九字总结读书之道"}], "main": "作者回忆从小爱读书的经历，总结读书之乐与体会，倡导读书好、多读书、读好书。", "genre": "散文", "why": "回忆读书经历，抒发个人感受"}, {"title": "走遍天下书为侣", "book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 8, "unit": "第八单元", "page": 109, "n": 10, "parts": [{"from": 0, "to": 2, "gist": "提出旅行只能带一样东西的问题，作者毫不犹豫地选择一本书。"}, {"from": 3, "to": 5, "gist": "回应质疑，书如朋友和家，总能从中发现新东西。"}, {"from": 6, "to": 7, "gist": "描述反复读书的具体方法，思考、续编、品味、列单、想象。"}, {"from": 8, "to": 9, "gist": "总结书是朋友和故地，是属于自己的东西。"}], "main": "作者认为书是最好的旅行伴侣，反复阅读总能发现新东西，书是朋友、故地，也是属于自己的东西。", "genre": "散文", "why": "以第一人称抒发对书的热爱"}, {"title": "月是故乡明", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 1, "unit": "第一单元", "page": 8, "n": 5, "parts": [{"from": 0, "to": 0, "gist": "每个人都有故乡，人人都爱故乡的月亮。"}, {"from": 1, "to": 2, "gist": "故乡无山，但有小村苇坑，童年在坑边望月玩耍。"}, {"from": 3, "to": 4, "gist": "故乡明月寄托了中国人自古以来的思乡之情。"}], "main": "作者回忆故乡无山有水的环境和童年望月的经历，表达月亮寄托思乡之情的主题。", "genre": "散文", "why": "借月抒怀，抒发思乡之情"}, {"title": "梅花魂", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 1, "unit": "第一单元", "page": 10, "n": 19, "parts": [{"from": 0, "to": 1, "gist": "故乡梅花引发回忆，外祖父教我读诗时因思乡落泪。"}, {"from": 2, "to": 4, "gist": "外祖父格外爱惜墨梅图，我弄脏后他大发脾气。"}, {"from": 5, "to": 12, "gist": "母亲说要回祖国，外祖父因不能同行而痛哭。"}, {"from": 13, "to": 14, "gist": "外祖父赠我墨梅图，借梅花喻中华民族的气节。"}, {"from": 15, "to": 16, "gist": "离别时外祖父送我到码头，赠我绣着梅花的白手绢。"}, {"from": 17, "to": 18, "gist": "我领悟到带走的是外祖父眷恋祖国的赤子之心。"}], "main": "本文通过外祖父教我读诗落泪、珍爱墨梅图、赠画赠绢等事，表现海外华侨老人对祖国的深切眷恋。", "genre": "散文", "why": "以散文笔法记述外祖父思乡之情"}, {"title": "走进他们的童年岁月", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 1, "unit": "第一单元", "page": 13, "n": 3, "parts": [{"from": 0, "to": 0, "gist": "童年纯真难忘，让我们走进大人们的童年岁月了解他们小时候的故事。"}, {"from": 1, "to": 2, "gist": "了解他人童年需先确定对象列出问题清单，再认真倾听并做简要记录。"}], "main": "本文引导我们走进大人们的童年岁月，通过确定对象、列出问题清单、认真倾听记录来了解他们小时候的故事。", "genre": "其他", "why": "口语交际活动指导文"}, {"title": "祖父的园子", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 1, "unit": "第一单元", "page": 4, "n": 21, "parts": [{"from": 0, "to": 2, "gist": "描写花园里的昆虫、色彩及花园的历史"}, {"from": 3, "to": 5, "gist": "跟着祖父在园子里栽花、拔草、铲地"}, {"from": 6, "to": 12, "gist": "把狗尾草当谷穗，祖父耐心讲解"}, {"from": 13, "to": 14, "gist": "在园子里自由玩耍，追蜻蜓、扬水喊下雨"}, {"from": 15, "to": 16, "gist": "园子里阳光灿烂，万物自由生长"}, {"from": 17, "to": 18, "gist": "天空高远，白云飘过祖父的草帽"}, {"from": 19, "to": 20, "gist": "玩累了在房下睡着，附生字表"}], "main": "回忆童年在祖父园子里自由玩耍的快乐时光，展现园中万物自由生长的景象。", "genre": "写景状物", "why": "以描写园中景物为主"}, {"title": "草船借箭", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 2, "unit": "第二单元", "page": 18, "n": 16, "parts": [{"from": 0, "to": 2, "gist": "周瑜妒忌诸葛亮，以造箭为由设下难题，诸葛亮立下军令状。"}, {"from": 3, "to": 7, "gist": "周瑜密谋阻挠，诸葛亮请鲁肃借船备料，鲁肃照办。"}, {"from": 8, "to": 13, "gist": "诸葛亮利用大雾草船借箭，成功取得十万多支箭。"}, {"from": 14, "to": 15, "gist": "周瑜感叹诸葛亮神机妙算，佩服不已。"}], "main": "周瑜妒忌诸葛亮，设下造箭难题，诸葛亮利用大雾草船借箭，成功取得十万多支箭，令周瑜叹服。", "genre": "记事写人", "why": "叙述诸葛亮借箭的故事"}, {"title": "景阳冈", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 2, "unit": "第二单元", "page": 22, "n": 13, "parts": [{"from": 0, "to": 3, "gist": "武松在酒店连饮十八碗酒，绰绰有余"}, {"from": 4, "to": 4, "gist": "酒家告知景阳冈有虎伤人，劝武松留宿"}, {"from": 5, "to": 6, "gist": "武松见榜文知有虎仍上冈，酒力发作躺石上"}, {"from": 7, "to": 7, "gist": "武松与吊睛白额大虫搏斗，拳打脚踢打死老虎"}, {"from": 8, "to": 9, "gist": "武松力竭无法拖虎，趁天黑前下冈"}, {"from": 10, "to": 12, "gist": "课后练习：补充故事顺序、讲述打虎、评价武松"}], "main": "武松在景阳冈酒店连饮十八碗酒后，不顾酒家劝阻和榜文警告，独自上冈，与吊睛白额大虫搏斗并将其打死，随后力竭下冈。", "genre": "记事写人", "why": "记叙武松饮酒经历"}, {"title": "猴王出世", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 2, "unit": "第二单元", "page": 28, "n": 2, "parts": [{"from": 0, "to": 1, "gist": "花果山顶仙石孕育石猴，石猴在山中自由生活。"}], "main": "花果山顶仙石孕育出一只石猴，石猴在山中自由自在地生活。", "genre": "神话传说", "why": "选自《西游记》，石猴出世属神话故事"}, {"title": "红楼春趣", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 2, "unit": "第二单元", "page": 31, "n": 3, "parts": [{"from": 0, "to": 0, "gist": "众人发现竹梢挂风筝，经讨论后黛玉提议放风筝放晦气。"}, {"from": 1, "to": 2, "gist": "丫头们忙着准备放风筝，众人各展风筝，宝玉又派人去取更多风筝。"}], "main": "课文讲述宝玉、黛玉等在大观园里发现风筝后，众人一起放风筝的故事。", "genre": "记事写人", "why": "叙述放风筝事件，刻画人物"}, {"title": "读古典名著，品百味人生", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 2, "unit": "第二单元", "page": 39, "n": 16, "parts": [{"from": 0, "to": 1, "gist": "列举古典名著人物，邀请读者漫步名著长廊品读故事。"}, {"from": 2, "to": 5, "gist": "介绍《西游记》取经之旅，展示孙悟空与牛魔王斗法的精彩片段。"}, {"from": 6, "to": 9, "gist": "介绍《三国演义》《水浒传》《红楼梦》中的精彩故事与主题。"}, {"from": 10, "to": 11, "gist": "介绍章回体小说的特点，说明通过回目可猜故事内容。"}, {"from": 12, "to": 15, "gist": "列出感受汉字趣味、搜集资料、写研究报告等学习目标。"}], "main": "本文介绍中国古典名著中的人物与故事，展示章回体小说特点，并列出相关学习目标。", "genre": "其他", "why": "教材单元导读，非传统体裁"}, {"title": "青山处处埋忠骨", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 4, "unit": "第四单元", "page": 56, "n": 9, "parts": [{"from": 0, "to": 2, "gist": "中南海毛主席卧室中，彭德怀电报报告毛岸英在朝鲜牺牲。"}, {"from": 3, "to": 5, "gist": "毛主席得知岸英牺牲后悲痛万分，整日沉默，喃喃呼唤儿子。"}, {"from": 6, "to": 8, "gist": "秘书请示安葬事宜，毛主席强忍悲痛，内心矛盾挣扎。"}], "main": "毛主席得知爱子毛岸英在朝鲜牺牲后悲痛万分，面对是否将遗骨运回国内的抉择，强忍悲痛内心矛盾。", "genre": "记事写人", "why": "叙述毛岸英牺牲及主席悲痛"}, {"title": "军神", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 4, "unit": "第四单元", "page": 59, "n": 30, "parts": [{"from": 0, "to": 10, "gist": "沃克医生通过伤势和从容镇定，发现病人是军人。"}, {"from": 11, "to": 15, "gist": "病人拒绝使用麻醉剂，沃克医生震惊于他的决定。"}, {"from": 16, "to": 22, "gist": "手术中病人一声不吭数刀数，沃克医生双手颤抖。"}, {"from": 23, "to": 27, "gist": "沃克医生惊叹病人是军神，得知其真名为刘伯承。"}, {"from": 28, "to": 29, "gist": "课后思考与朗读练习。"}], "main": "沃克医生为拒绝麻醉的军人刘伯承做眼部手术，被其钢铁意志震撼，称他为军神。", "genre": "记事写人", "why": "以叙事方式刻画人物形象"}, {"title": "清贫", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 4, "unit": "第四单元", "page": 63, "n": 11, "parts": [{"from": 0, "to": 0, "gist": "交代革命十余年过着朴素生活，引出趣事。"}, {"from": 1, "to": 7, "gist": "被俘后兵士搜身无果，只得抢走表和水笔。"}, {"from": 8, "to": 10, "gist": "唯一财产是旧衣裤，清贫朴素是革命者战胜困难的力量。"}], "main": "方志敏以被俘搜身一事为例，说明清贫朴素的生活是革命者战胜困难的力量。", "genre": "记事写人", "why": "记叙被俘搜身事件，刻画人物"}, {"title": "了", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 4, "unit": "第四单元", "page": 65, "n": 2, "parts": [{"from": 0, "to": 1, "gist": "引导学生选择一种情绪，回忆相关事件并具体描写人物表现"}], "main": "这是一篇习作指导，要求学生选择一种情绪，回忆相关事件，具体描写人物当时的表现以反映其内心。", "genre": "记事写人", "why": "习作指导，写人物表现与内心"}, {"title": "人物描写一组", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 5, "unit": "第五单元", "page": 70, "n": 3, "parts": [{"from": 0, "to": 1, "gist": "小嘎子提议摔跤，小胖墩儿应战并询问摔跤方式。"}, {"from": 2, "to": 2, "gist": "小嘎子与小胖墩儿摔跤，小嘎子最终摔了个仰面朝天。"}], "main": "小嘎子和小胖墩儿摔跤，小嘎子使巧招却反被小胖墩儿摔倒。", "genre": "记事写人", "why": "描写摔跤事件与人物形象"}, {"title": "摔跤", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 5, "unit": "第五单元", "page": 70, "n": 3, "parts": [{"from": 0, "to": 1, "gist": "小嘎子提议摔跤，小胖墩儿应战并询问摔跤方式。"}, {"from": 2, "to": 2, "gist": "小嘎子使巧招摔跤，被小胖墩儿摔了个仰面朝天。"}], "main": "小嘎子提议与小胖墩儿摔跤，凭借手疾眼快使巧招，最终被小胖墩儿摔了个仰面朝天。", "genre": "记事写人", "why": "记叙小嘎子与小胖墩儿摔跤"}, {"title": "他像一棵挺脱的树", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 5, "unit": "第五单元", "page": 71, "n": 3, "parts": [{"from": 0, "to": 1, "gist": "描写他高大结实的身体和朴实可爱的面容。"}, {"from": 2, "to": 2, "gist": "他倒立半天，觉得自己像一棵挺脱的树。"}], "main": "课文通过描写他高大结实的身体、朴实可爱的面容和倒立如树的姿态，展现了一个充满生命力的青年车夫形象。", "genre": "记事写人", "why": "描写人物外貌与精神"}, {"title": "两茎灯草", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 5, "unit": "第五单元", "page": 72, "n": 4, "parts": [{"from": 0, "to": 1, "gist": "严监生病重不愈，众人围观，桌上点着一盏灯。"}, {"from": 2, "to": 3, "gist": "严监生伸出两个指头，赵氏挑掉一茎灯草后他断气。"}], "main": "严监生病重临终，因灯盏里点着两茎灯草不肯断气，赵氏挑掉一茎后他才咽气。", "genre": "记事写人", "why": "通过事件刻画人物形象"}, {"title": "刷子李", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 5, "unit": "第五单元", "page": 74, "n": 14, "parts": [{"from": 0, "to": 1, "gist": "刷子李刷浆穿黑衣无白点，立下白刷不要钱的规矩"}, {"from": 2, "to": 6, "gist": "曹小三跟师傅干活，亲眼目睹其刷浆绝活"}, {"from": 7, "to": 11, "gist": "曹小三搜索白点未果，后发现白点实为烟洞"}, {"from": 12, "to": 13, "gist": "师傅劝曹小三好好学本事，曹小三深受启发"}], "main": "刷子李刷浆穿黑衣无白点，徒弟曹小三亲眼见证其绝活，发现白点实为烟洞，深受启发。", "genre": "记事写人", "why": "以刷子李师徒故事写人"}, {"title": "我的朋友容容", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 5, "unit": "第五单元", "page": 78, "n": 23, "parts": [{"from": 0, "to": 6, "gist": "容容每天帮\"我\"取报纸，\"我\"自己取报后她委屈哭泣，体现她忠于职守。"}, {"from": 7, "to": 20, "gist": "容容对信产生好奇，追问\"我\"信是什么、怎么寄，表现出天真好奇。"}, {"from": 21, "to": 22, "gist": "容容寄来一封欠资信，里面只有一片梧桐树叶，\"我\"十分纳闷。"}], "main": "课文通过取报纸和寄信两件事，表现了容容助人为乐、忠于职守、天真好奇的品质。", "genre": "记事写人", "why": "通过取报、问信等事例写人"}, {"title": "小守门员和他的观众们", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 5, "unit": "第五单元", "page": 80, "n": 14, "parts": [{"from": 0, "to": 1, "gist": "放学后孩子们在空地踢球，小守门员全神贯注，候补男孩跃跃欲试。"}, {"from": 2, "to": 6, "gist": "观众紧盯球赛，容容忍不住告诉'我'她寄了一封藏叶子的信。"}, {"from": 7, "to": 10, "gist": "课文分析：守门员描写符合身份，容容动作神态突显可爱，观众各有特点。"}, {"from": 11, "to": 13, "gist": "红领巾男孩、白狗、抱洋娃娃女孩、戴帽男孩和大个子叔叔各有表现。"}], "main": "课文描写了放学后孩子们踢球的场景，小守门员尽职尽责，观众们各具特点，生动展现了球赛的吸引力。", "genre": "记事写人", "why": "描写守门员和观众的人物形象"}, {"title": "田忌赛马", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 6, "unit": "第六单元", "page": 85, "n": 19, "parts": [{"from": 0, "to": 1, "gist": "孙膑是田忌门客，观察赛马后发现各方马匹脚力相差不多，可分三等。"}, {"from": 2, "to": 7, "gist": "孙膑向田忌提出必胜办法，田忌信任孙膑决定全听他的。"}, {"from": 8, "to": 9, "gist": "双方约好赛马，孙膑悄悄把办法告诉田忌。"}, {"from": 10, "to": 14, "gist": "三场比赛田忌以下对上、上对中、中对下，最终胜两场输一场。"}, {"from": 15, "to": 16, "gist": "齐威王好奇询问，田忌引荐孙膑，齐威王任命孙膑为军师。"}, {"from": 17, "to": 18, "gist": "课后练习：连一连对阵图并思考孙膑安排出场顺序的原因。"}], "main": "孙膑通过巧妙安排马的出场顺序，帮助田忌在赛马中胜两场输一场，最终赢得齐威王。", "genre": "记事写人", "why": "讲述孙膑与田忌赛马的故事"}, {"title": "跳水", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 6, "unit": "第六单元", "page": 87, "n": 13, "parts": [{"from": 0, "to": 2, "gist": "帆船航行中，猴子在甲板上模仿人取乐，水手们哈哈大笑。"}, {"from": 3, "to": 5, "gist": "猴子摘走孩子帽子爬上桅杆，孩子追猴爬上横木陷入危险。"}, {"from": 6, "to": 7, "gist": "作者介绍及孩子处境危急，无法回身，双腿发抖。"}, {"from": 8, "to": 10, "gist": "船长持枪逼孩子跳海，孩子跳入海中，水手们迅速救起他。"}, {"from": 11, "to": 12, "gist": "课后思考题：分析水手们的笑与情节关系及船长的办法。"}], "main": "猴子摘走孩子帽子，孩子追猴爬上桅杆顶端陷入险境，船长持枪逼孩子跳海，水手们及时将其救起。", "genre": "记事写人", "why": "记叙事件，刻画人物形象"}, {"title": "牧场之国", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 7, "unit": "第七单元", "page": 97, "n": 8, "parts": [{"from": 0, "to": 0, "gist": "荷兰是水之国、花之国，也是牧场之国。"}, {"from": 1, "to": 3, "gist": "白天，运河间低地上牛马羊等牲畜悠然自得，尽显牧场风光。"}, {"from": 4, "to": 5, "gist": "傍晚挤奶，入夜后牧场归于寂静，车船运奶驶向城市。"}, {"from": 6, "to": 7, "gist": "这就是真正的荷兰。"}], "main": "课文通过描写荷兰牧场白天与夜晚的宁静景象，展现了荷兰作为牧场之国的独特魅力。", "genre": "写景状物", "why": "描写荷兰牧场风光与动物"}, {"title": "金字塔夕照", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 7, "unit": "第七单元", "page": 99, "n": 4, "parts": [{"from": 0, "to": 1, "gist": "描写九月初开罗金字塔在金色夕阳下的壮观景象。"}, {"from": 2, "to": 3, "gist": "作者由金字塔之名引发思考，抒发对大漠夕照中金字塔的难忘感受。"}], "main": "课文描写了九月初开罗金字塔在金色夕阳下的壮观景象，并抒发了作者对这一人间奇迹的赞叹与怀古幽思。", "genre": "写景状物", "why": "描写金字塔夕照景色"}, {"title": "不可思议的金字塔", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 7, "unit": "第七单元", "page": 100, "n": 3, "parts": [{"from": 0, "to": 0, "gist": "提出当时人们如何修建金字塔的问题"}, {"from": 1, "to": 2, "gist": "介绍胡夫金字塔的高度、边长、重量、体积及建造年代等信息"}], "main": "课文以提问引出金字塔，并介绍胡夫金字塔的高度、边长、重量、体积及建造年代等信息。", "genre": "说明文", "why": "用数据客观介绍金字塔特征"}, {"title": "威尼斯的小艇", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 7, "unit": "第七单元", "page": 94, "n": 7, "parts": [{"from": 0, "to": 2, "gist": "介绍威尼斯水上城市特点及小艇乘坐体验和船夫驾驶技术"}, {"from": 3, "to": 3, "gist": "说明课文作者为美国马克·吐温及译者信息"}, {"from": 4, "to": 6, "gist": "描写人们乘小艇的日常活动和夜晚威尼斯的静寂景象"}], "main": "课文介绍了威尼斯水上城市的特点，描写了小艇乘坐体验、船夫驾驶技术及人们乘小艇的日常活动和夜晚静寂景象。", "genre": "写景状物", "why": "描写小艇特点与威尼斯景色"}, {"title": "金字塔", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 7, "unit": "第七单元", "page": 99, "n": 4, "parts": [{"from": 0, "to": 1, "gist": "描写九月开罗金色的景色和金字塔的壮观"}, {"from": 2, "to": 2, "gist": "思考金字塔名称的由来及其珍贵价值"}, {"from": 3, "to": 3, "gist": "表达对大漠夕照中金字塔金色的难忘感受"}], "main": "课文描写了九月开罗金色的景色和金字塔的壮观，抒发了对金字塔的赞美和怀古幽思。", "genre": "写景状物", "why": "描写金字塔景色与色彩感受"}, {"title": "手指", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 8, "unit": "第八单元", "page": 109, "n": 9, "parts": [{"from": 0, "to": 0, "gist": "总写五根手指各有不同姿态、性格、长短。"}, {"from": 1, "to": 5, "gist": "分述大拇指、食指、中指、无名指和小指各自的姿态与性格。"}, {"from": 6, "to": 8, "gist": "总结五指团结则根根有用，并附语言赏析与思考练习。"}], "main": "课文通过描写五根手指不同的姿态与性格，说明团结起来则根根有用、根根有力量。", "genre": "散文", "why": "以拟人手法描写手指，属文学散文"}, {"title": "童年的发现", "book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 8, "unit": "第八单元", "page": 112, "n": 6, "parts": [{"from": 0, "to": 2, "gist": "作者九岁发现胚胎发育规律，因想起发现而受罚"}, {"from": 3, "to": 4, "gist": "梦中飞行的经历及发现同伴也梦中飞行，决定请教老师"}, {"from": 5, "to": 5, "gist": "提出梦中飞行与人类起源的探究问题"}], "main": "作者九岁发现胚胎发育规律，从梦中飞行开始探究，经历受罚与求教的过程", "genre": "记事写人", "why": "以第一人称叙述童年发现经历"}, {"title": "草原", "book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 1, "unit": "第一单元", "page": 2, "n": 7, "parts": [{"from": 0, "to": 0, "gist": "描写草原辽阔美丽的自然风光，令人心旷神怡。"}, {"from": 1, "to": 3, "gist": "描写汽车在草原上行驶，沿途所见所闻。"}, {"from": 4, "to": 6, "gist": "描写主人远迎客人及蒙古包内的热情款待。"}], "main": "本文描写了草原的美丽风光、行车所见以及蒙古族主人热情迎客的场景，展现了民族团结互助的主题。", "genre": "写景状物", "why": "描写草原景色，运用比喻渲染"}, {"title": "丁香结", "book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 1, "unit": "第一单元", "page": 5, "n": 8, "parts": [{"from": 0, "to": 1, "gist": "描写城里城外丁香花盛开的美景"}, {"from": 2, "to": 3, "gist": "写斗室外丁香花与作者文思梦想的关联"}, {"from": 4, "to": 5, "gist": "由古诗引出丁香结并发现花蕾如盘花扣"}, {"from": 6, "to": 7, "gist": "由丁香结联想到人生问题解不完"}], "main": "本文描写丁香花的美丽，由丁香结联想到人生中的问题解不完，表达积极乐观的人生态度。", "genre": "写景状物", "why": "以丁香花为描写对象，状物抒情"}, {"title": "狼牙山五壮士", "book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 2, "unit": "第二单元", "page": 16, "n": 11, "parts": [{"from": 0, "to": 1, "gist": "七连六班接受掩护任务，痛击追兵"}, {"from": 2, "to": 3, "gist": "五位战士选择绝路，向顶峰攀登"}, {"from": 4, "to": 6, "gist": "顶峰战斗，用石头和手榴弹击敌"}, {"from": 7, "to": 10, "gist": "英勇跳崖，壮烈牺牲"}], "main": "狼牙山五壮士为掩护群众和连队转移，英勇战斗，最后壮烈跳崖牺牲。", "genre": "记事写人", "why": "叙述五壮士英勇事迹"}, {"title": "开国大典", "book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 2, "unit": "第二单元", "page": 19, "n": 19, "parts": [{"from": 0, "to": 2, "gist": "开国大典的时间、地点、参加人员及会场布置"}, {"from": 3, "to": 4, "gist": "群众从四面八方来到天安门广场参加开国大典"}, {"from": 5, "to": 8, "gist": "毛泽东主席庄严宣告中华人民共和国中央人民政府成立"}, {"from": 9, "to": 11, "gist": "五星红旗徐徐上升，礼炮齐鸣，全场肃立欢呼"}, {"from": 12, "to": 13, "gist": "毛主席宣读公告，阅兵式开始"}, {"from": 14, "to": 16, "gist": "各部队依次接受检阅，群众热烈欢呼鼓掌"}, {"from": 17, "to": 18, "gist": "群众游行，毛主席向群众挥手致意，大典圆满结束"}], "main": "1949年10月1日，开国大典在北京天安门广场举行，毛泽东主席宣告新中国成立，举行阅兵和群众游行。", "genre": "记事写人", "why": "按时间顺序记述开国大典经过"}, {"title": "我的战友邱少云", "book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 2, "unit": "第二单元", "page": 24, "n": 19, "parts": [{"from": 0, "to": 3, "gist": "潜伏在敌人阵地附近，必须一动不动，邱少云伪装隐蔽得很好。"}, {"from": 4, "to": 6, "gist": "炮兵轰击敌人阵地，作者盼望天黑痛快地打一仗。"}, {"from": 7, "to": 11, "gist": "敌人用燃烧弹搜索，荒草着火蔓延，火烧到邱少云身上。"}, {"from": 12, "to": 14, "gist": "邱少云为了不暴露部队纹丝不动，被火烧了半个多小时牺牲。"}, {"from": 15, "to": 18, "gist": "黄昏冲锋为邱少云报仇，作者永远忘不了那一天。"}], "main": "邱少云在潜伏中被燃烧弹引燃，为了不暴露部队纹丝不动直至牺牲，作者永远铭记这一天。", "genre": "记事写人", "why": "记叙潜伏战斗及战友事迹"}, {"title": "竹节人", "book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 3, "unit": "第三单元", "page": 32, "n": 6, "parts": [{"from": 0, "to": 1, "gist": "小时候玩具自己做，新鲜玩意很快风靡，大家迷上斗竹节人。"}, {"from": 2, "to": 2, "gist": "用毛笔杆锯截钻孔穿线制作竹节人，锯时要小心。"}, {"from": 3, "to": 4, "gist": "妈妈怪丢毛笔，卖笔老头生意好，课桌破旧裂缝多。"}, {"from": 5, "to": 5, "gist": "同一篇文章因阅读目的不同，关注内容和阅读方法也不同。"}], "main": "课文回忆了小时候自制竹节人风靡全校的趣事及由此带来的生活细节，并提示阅读方法因目的而异。", "genre": "记事写人", "why": "叙述制作和玩竹节人的经历"}, {"title": "宇宙生命之谜", "book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 3, "unit": "第三单元", "page": 36, "n": 20, "parts": [{"from": 0, "to": 1, "gist": "由古人太空想象引出宇宙生命之谜，理论上地球不是唯一有生命的天体。"}, {"from": 2, "to": 5, "gist": "生命存在需具备温度、水分、大气、光和热四个条件。"}, {"from": 6, "to": 7, "gist": "科学家分析太阳系其他行星，只有火星可能还存在生命。"}, {"from": 8, "to": 11, "gist": "火星与地球相似，人们曾猜测火星上有生命。"}, {"from": 12, "to": 14, "gist": "科学家用探测器近距离观测火星，发现火星上生命难以存在。"}, {"from": 15, "to": 19, "gist": "介绍阅读策略，帮助读者有针对性地获取信息。"}], "main": "本文介绍了宇宙中生命存在的条件，分析了太阳系各行星，并通过探测器观测火星，探讨地球之外是否有生命存在。", "genre": "说明文", "why": "介绍宇宙生命条件，客观说明"}, {"title": "故宫博物院", "book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 3, "unit": "第三单元", "page": 40, "n": 2, "parts": [{"from": 0, "to": 0, "gist": "介绍紫禁城的位置、历史及现为故宫博物院。"}, {"from": 1, "to": 1, "gist": "描述紫禁城的城墙高度、四座城门及占地面积。"}], "main": "介绍紫禁城的历史地位及其建筑格局。", "genre": "说明文", "why": "客观介绍故宫建筑特征"}, {"title": "桥", "book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 4, "unit": "第四单元", "page": 50, "n": 29, "parts": [{"from": 0, "to": 6, "gist": "洪水突然袭来，村民惊慌逃命，涌向唯一的木桥。"}, {"from": 7, "to": 13, "gist": "老汉镇定指挥，要求党员排后，村民有序过桥。"}, {"from": 14, "to": 23, "gist": "水势加剧，老汉揪出儿子排后，桥塌二人被洪水吞没。"}, {"from": 24, "to": 28, "gist": "洪水退去，老太太来祭奠丈夫和儿子。"}], "main": "山洪暴发，党支部书记老汉镇定指挥村民过桥，最终与儿子一同被洪水吞没，揭示了他舍己为人的崇高精神。", "genre": "记事写人", "why": "叙述洪水救人事件，塑造老汉形象"}, {"title": "穷人", "book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 4, "unit": "第四单元", "page": 53, "n": 25, "parts": [{"from": 0, "to": 1, "gist": "桑娜在暴风雨夜等待丈夫，家中温暖但生活贫困。"}, {"from": 2, "to": 7, "gist": "桑娜出门探望病邻居西蒙，发现她已死，身边有两个孩子。"}, {"from": 8, "to": 11, "gist": "桑娜把西蒙的孩子抱回家，忐忑不安地等待丈夫。"}, {"from": 12, "to": 19, "gist": "渔夫打鱼归来，与桑娜谈论恶劣天气和糟糕的收成。"}, {"from": 20, "to": 24, "gist": "桑娜告知西蒙死讯，渔夫决定收养两个孩子。"}], "main": "渔夫和妻子桑娜在贫困生活中，主动收养了邻居西蒙死后留下的两个孩子。", "genre": "记事写人", "why": "有完整故事情节和人物描写"}, {"title": "金色的鱼钩", "book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 4, "unit": "第四单元", "page": 58, "n": 6, "parts": [{"from": 0, "to": 2, "gist": "红军过草地，指导员派老班长照顾三个病号。"}, {"from": 3, "to": 4, "gist": "老班长照顾病号，用缝衣针做鱼钩钓鱼。"}, {"from": 5, "to": 5, "gist": "这是一篇以红军长征为背景的小说。"}], "main": "红军过草地时，老班长照顾三个病号，找野菜、做鱼钩钓鱼，自己却比病号瘦得更厉害。", "genre": "记事写人", "why": "以长征为背景，记叙老班长事迹"}, {"title": "盼", "book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 5, "unit": "第五单元", "page": 73, "n": 24, "parts": [{"from": 0, "to": 1, "gist": "收到新雨衣，迫不及待试穿"}, {"from": 2, "to": 3, "gist": "盼变天，终于等来几滴雨"}, {"from": 4, "to": 15, "gist": "央求妈妈让自己出门，未能如愿"}, {"from": 16, "to": 19, "gist": "雨停后盼明天再下雨"}, {"from": 20, "to": 22, "gist": "第二天雨来，穿上雨衣走在雨中"}, {"from": 23, "to": 23, "gist": "初试身手练习"}], "main": "蕾蕾收到新雨衣后盼着下雨，央求妈妈未果，雨停后盼明天，终于等到雨天穿上雨衣走在雨中。", "genre": "记事写人", "why": "记叙穿雨衣盼下雨的经历"}, {"title": "灯光", "book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 5, "unit": "第五单元", "page": 70, "n": 17, "parts": [{"from": 0, "to": 1, "gist": "作者在天安门广场被'多好啊'触发回忆。"}, {"from": 2, "to": 7, "gist": "回忆郝副营长看电灯插图，憧憬孩子们用电灯学习。"}, {"from": 8, "to": 12, "gist": "战斗中郝副营长点燃书本为部队照亮道路，壮烈牺牲。"}, {"from": 13, "to": 16, "gist": "回到现实缅怀战友，思考灯光与牺牲的意义。"}], "main": "课文通过回忆郝副营长为照亮部队前进道路而牺牲的故事，表达了革命先烈对美好未来的憧憬和无私奉献精神。", "genre": "记事写人", "why": "以回忆方式叙述郝副营长事迹"}, {"title": "只有一个地球", "book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 6, "unit": "第六单元", "page": 82, "n": 15, "parts": [{"from": 0, "to": 1, "gist": "地球美丽壮观但宇宙中渺小，不会再长大。"}, {"from": 2, "to": 4, "gist": "地球自然资源有限，人类滥用导致资源枯竭和生态灾难。"}, {"from": 5, "to": 8, "gist": "科学家证明附近无适合居住的星球，移民设想遥远。"}, {"from": 9, "to": 10, "gist": "宇航员感叹地球可爱又易碎，呼吁保护地球生态环境。"}, {"from": 11, "to": 14, "gist": "附公民生态环境行为规范节选及资料袋。"}], "main": "地球美丽但资源有限，人类无法移居他星，应保护地球生态环境。", "genre": "说明文", "why": "客观介绍地球特征与资源"}, {"title": "青山不老", "book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 6, "unit": "第六单元", "page": 84, "n": 4, "parts": [{"from": 0, "to": 1, "gist": "作者所见绿洲与晋西北险恶环境的对比，突出老人创造的奇迹。"}, {"from": 2, "to": 2, "gist": "老人孤独坚守，老伴离世，默默守护青山。"}, {"from": 3, "to": 3, "gist": "人与土地、人与自然相互依存，青山有人默默守护。"}], "main": "一位老人在晋西北险恶环境中默默植树造林，创造绿洲，体现了人与自然的相互依存。", "genre": "记事写人", "why": "记叙老人植树造林的事迹"}, {"title": "他们那时候多有趣啊", "book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 7, "unit": "第七单元", "page": 103, "n": 9, "parts": [{"from": 0, "to": 2, "gist": "玛琪在日记中记录托米发现了一本真正的旧书，书页发黄，字静止不动。"}, {"from": 3, "to": 6, "gist": "玛琪询问书的来源和内容，托米说书在顶楼找到，写的是学校。"}, {"from": 7, "to": 8, "gist": "玛琪对'学校'不屑一顾，表示讨厌学校里的机器老师。"}], "main": "2155年，玛琪和托米发现了一本关于学校的旧书，玛琪对书中提到的学校感到不屑和厌恶。", "genre": "其他", "why": "科幻小说，非传统体裁"}, {"title": "表里的生物", "book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 7, "unit": "第七单元", "page": 100, "n": 18, "parts": [{"from": 0, "to": 1, "gist": "小时候\"我\"认为能发声的都是活的生物，父亲的表也会发出声音。"}, {"from": 2, "to": 6, "gist": "想动表被父亲禁止，好奇心增加，猜测表里有活的生物。"}, {"from": 7, "to": 8, "gist": "父亲打开表给\"我\"看，\"我\"看到表里美丽的世界。"}, {"from": 9, "to": 14, "gist": "父亲说表里是小蝎子的尾巴，\"我\"证实了表里有活的生物。"}, {"from": 15, "to": 17, "gist": "\"我\"常对人说父亲表里有个小蝎子，不知何时才不说了。"}], "main": "小时候\"我\"认为能发声的都是活的生物，因好奇表里的声音，猜测表里有活的生物，父亲打开表证实了\"我\"的猜测。", "genre": "记事写人", "why": "以第一人称叙述童年看表经历"}, {"title": "好的故事", "book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 8, "unit": "第八单元", "page": 114, "n": 15, "parts": [{"from": 0, "to": 2, "gist": "昏沉的夜里，\"我\"闭眼靠在椅背上，在蒙胧中看见一个好的故事。"}, {"from": 3, "to": 6, "gist": "梦中故事美丽幽雅有趣，山阴道倒影与水中交织的美的人和美的事如云锦飞动。"}, {"from": 7, "to": 9, "gist": "故事清楚分明，\"我\"正要凝视时骤然惊醒，云锦被撕成片片碎影。"}, {"from": 10, "to": 11, "gist": "\"我\"想追回碎影却只见昏暗灯光，但总记得见过这一篇好的故事。"}, {"from": 12, "to": 14, "gist": "写作日期及阅读提示和思考题。"}], "main": "\"我\"在昏沉的夜里梦见一篇美丽幽雅有趣的好故事，醒来后碎影无踪，但总记得见过它。", "genre": "散文", "why": "以梦境描写抒情，形散神聚"}, {"title": "有的人—纪念鲁迅有感", "book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 8, "unit": "第八单元", "page": 121, "n": 9, "parts": [{"from": 0, "to": 3, "gist": "通过对比手法，描写了两种截然不同的人生态度。"}, {"from": 4, "to": 4, "gist": "介绍《有的人》的创作背景，引导读者思考鲁迅其人。"}, {"from": 5, "to": 8, "gist": "进一步对比两种人，揭示其不同结局。"}], "main": "全诗通过对比手法，赞扬了鲁迅为人民奉献的精神，批判了骑在人民头上的压迫者。", "genre": "现代诗", "why": "臧克家创作的现代诗歌"}, {"title": "少年闰土", "book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 8, "unit": "第八单元", "page": 110, "n": 18, "parts": [{"from": 0, "to": 2, "gist": "描写闰土月下刺猹的场景，介绍闰土来历及“我”对闰土的期待。"}, {"from": 3, "to": 4, "gist": "“我”盼望新年见到闰土，描述闰土外貌，两人很快熟识。"}, {"from": 5, "to": 15, "gist": "闰土向“我”讲述捕鸟、捡贝壳、看瓜刺猹、跳鱼儿等新鲜事。"}, {"from": 16, "to": 17, "gist": "“我”感叹闰土见多识广，对比自己只见过四角天空的局限。"} 下册", "unit_no": 3, "unit": "第三单元", "page": 44, "n": 9, "parts": [{"from": 0, "to": 1, "gist": "以自然景物的循环反衬，设问日子为何一去不复返"}, {"from": 2, "to": 3, "gist": "感叹八千多日子无声溜走，内心空虚悲伤"}, {"from": 4, "to": 5, "gist": "通过日常细节描写日子匆匆流逝，以匆匆二字强调"}, {"from": 6, "to": 7, "gist": "反思人生无所作为，再次追问日子为何一去不复返"}, {"from": 8, "to": 8, "gist": "朗读提示"}], "main": "文章通过描写日子在日常生活细节中匆匆流逝，感叹时光一去不复返，反思人生无所作为，追问生命的意义。", "genre": "散文", "why": "抒情散文，写时间流逝"}, {"title": "那个星期天", "book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": 3, "unit": "第三单元", "page": 46, "n": 8, "parts": [{"from": 0, "to": 2, "gist": "母亲答应星期天带孩子出去玩，孩子平生第一次盼望一个日子。"}, {"from": 3, "to": 4, "gist": "早晨母亲买菜耽搁，孩子独自在院子里焦急又兴奋地等待。"}, {"from": 5, "to": 7, "gist": "下午母亲忙个不停，孩子看着光线渐暗，盼望落空。"}], "main": "那个星期天，母亲答应带孩子出去玩却一再耽搁，孩子从早晨盼到黄昏，最终盼望落空。", "genre": "散文", "why": "史铁生散文，叙事抒情"}, {"title": "阳光的两种用法", "book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": 3, "unit": "第三单元", "page": 54, "n": 11, "parts": [{"from": 0, "to": 2, "gist": "童年大院生活不富裕，母亲把老阳儿叠进被子里，被窝温暖如母亲抚摸。"}, {"from": 3, "to": 7, "gist": "毕大妈把老阳儿煮进水缸，孩子们用温水洗澡，母亲用词准确生动。"}, {"from": 8, "to": 10, "gist": "老阳儿如柴米油盐般不可或缺，善用阳光需智慧和温暖的心。"}], "main": "通过母亲叠被子和毕大妈煮水两个事例，展现阳光在艰苦生活中的两种用法，体现智慧与温情。", "genre": "散文", "why": "个人回忆叙事抒情，文学性强"}, {"title": "别了，语文课", "book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": 3, "unit": "第三单元", "page": 51, "n": 20, "parts": [{"from": 0, "to": 2, "gist": "我忽然喜欢上语文课，读完张先生送的书，了解中文的丰富优美。"}, {"from": 3, "to": 6, "gist": "我问爸爸移民后能否学中文，得知困难后焦急温习语文。"}, {"from": 7, "to": 11, "gist": "我默书进步，张先生表扬时我含泪说出即将移民的消息。"}, {"from": 12, "to": 14, "gist": "离别临近，同学留言叮嘱不要忘记中国和中文。"}, {"from": 15, "to": 19, "gist": "最后一次语文课，张先生和同学送书，我决心不忘中文。"}], "main": "即将移民的我，在最后一次语文课上与老师和同学告别，决心不忘中文。", "genre": "记事写人", "why": "第一人称叙述个人经历与感受"}, {"title": "十六年前的回忆", "book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": 4, "unit": "第四单元", "page": 60, "n": 35, "parts": [{"from": 0, "to": 0, "gist": "开篇点明时间，引出父亲被难日。"}, {"from": 1, "to": 5, "gist": "父亲烧掉书籍文件，局势日益严峻。"}, {"from": 6, "to": 7, "gist": "父亲坚决不肯离开北京。"}, {"from": 8, "to": 18, "gist": "四月六日父亲被捕，全家被关押。"}, {"from": 19, "to": 29, "gist": "法庭上父女最后一次相见。"}, {"from": 30, "to": 34, "gist": "得知父亲被害，牢记四月二十八日。"}], "main": "本文回忆了父亲李大钊被捕、受审到被害的经过，表现了父亲对革命事业的坚定信念。", "genre": "记事写人", "why": "回忆父亲被捕经过，叙事写人"}, {"title": "为人民服务", "book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": 4, "unit": "第四单元", "page": 64, "n": 7, "parts": [{"from": 0, "to": 0, "gist": "共产党领导的革命队伍完全为着解放人民、为人民利益工作。"}, {"from": 1, "to": 1, "gist": "为人民利益而死比泰山还重，张思德同志的死重于泰山。"}, {"from": 2, "to": 2, "gist": "因为为人民服务，所以不怕批评，对人民有好处就照办。"}, {"from": 3, "to": 4, "gist": "为共同革命目标奋斗，要看到光明，关心爱护互相帮助。"}, {"from": 5, "to": 6, "gist": "为做过有益工作的人开追悼会，使整个人民团结起来。"}], "main": "本文论述了为人民服务的宗旨，阐述了死的意义、接受批评、团结奋斗和追悼制度等内容。", "genre": "议论文", "why": "提出论点并论证"}, {"title": "董存瑞舍身炸暗堡", "book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": 4, "unit": "第四单元", "page": 66, "n": 5, "parts": [{"from": 0, "to": 0, "gist": "战斗打响，敌军暗堡封锁道路，我军被压制。"}, {"from": 1, "to": 3, "gist": "董存瑞和郅顺义主动请战，连长同意并下令。"}, {"from": 4, "to": 4, "gist": "董存瑞和郅顺义互相配合，跃出战壕冲上去。"}], "main": "董存瑞在解放隆化战斗中，主动请战与战友郅顺义配合，跃出战壕冲向敌军暗堡。", "genre": "记事写人", "why": "记叙董存瑞炸暗堡的英雄事迹"}, {"title": "真理诞生于一百个问号之后", "book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": 5, "unit": "第五单元", "page": 82, "n": 9, "parts": [{"from": 0, "to": 1, "gist": "提出论点：真理诞生于一百个问号之后，科学家善于从细微现象中发现问题"}, {"from": 2, "to": 3, "gist": "波义耳从紫罗兰遇酸变红现象中发现石蕊试纸"}, {"from": 4, "to": 4, "gist": "魏格纳从大陆轮廓吻合现象中提出大陆漂移说"}, {"from": 5, "to": 5, "gist": "阿瑟林斯基从眼珠转动现象中发现做梦规律"}, {"from": 6, "to": 7, "gist": "总结：见微知著、善于发问并不断探索才能发现真理"}, {"from": 8, "to": 8, "gist": "思考题：列举事例及写作顺序"}], "main": "文章通过三个科学发现的事例，说明真理诞生于一百个问号之后，只要见微知著、善于发问并不断探索，就能发现真理。", "genre": "议论文", "why": "提出论点并用事例论证"}, {"title": "他们那时候多有趣啊", "book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": 5, "unit": "第五单元", "page": 90, "n": 33, "parts": [{"from": 0, "to": 2, "gist": "玛琪在日记中记录托米发现了一本真正的旧书，书页发黄，字静止不动。"}, {"from": 3, "to": 7, "gist": "玛琪问书的内容，托米说是关于学校的，玛琪对机器学校表示厌恶。"}, {"from": 8, "to": 12, "gist": "玛琪因地理测验成绩差被叫来视察员，机器老师被调慢，她仍很失望。"}, {"from": 13, "to": 21, "gist": "托米解释书里写的是几百年前有真人老师的老式学校，玛琪难以想象。"}, {"from": 22, "to": 27, "gist": "托米描述所有孩子到一处上学、学同样功课，玛琪很想知道老式学校的情况。"}, {"from": 28, "to": 32, "gist": "玛琪被叫去上课，想象老式学校的情景，感叹那些孩子一定热爱学校。"}], "main": "玛琪和托米发现一本关于旧式学校的书，通过对比未来机器教学与过去真人教学，玛琪感叹过去孩子们上学多有趣。", "genre": "其他", "why": "科幻小说，非以上体裁"}, {"title": "表里的生物", "book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": 5, "unit": "第五单元", "page": 87, "n": 16, "parts": [{"from": 0, "to": 1, "gist": "小时候认为能发声的都是活的生物，父亲的表也会发声"}, {"from": 2, "to": 5, "gist": "想动表被父亲禁止，好奇心增加，猜测表里有活的生物"}, {"from": 6, "to": 7, "gist": "父亲打开表给看，看到美丽的世界"}, {"from": 8, "to": 13, "gist": "追问表里是什么，父亲说是蝎子尾巴，证实了猜测"}, {"from": 14, "to": 15, "gist": "向人讲述表里有小蝎子，不知何时才不说了"}], "main": "小时候因好奇猜测表里有活的生物，父亲打开表后说是蝎子尾巴，证实了猜测，后来向人讲述此事", "genre": "记事写人", "why": "以第一人称叙述童年看表经历"}, {"title": "依依惜别", "book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": 6, "unit": "第六单元", "page": 105, "n": 33, "parts": [{"from": 0, "to": 2, "gist": "介绍毕业前开展的活动，包括举办毕业联欢会及写策划书。"}, {"from": 3, "to": 4, "gist": "毕业联欢会活动策划书，含活动分工、流程及节目单。"}, {"from": 5, "to": 8, "gist": "建议给老师、同学、母校和自己写信，表达感恩与展望。"}, {"from": 9, "to": 14, "gist": "何其芳诗作《我为少男少女们歌唱》，歌唱希望与青春。"}, {"from": 15, "to": 19, "gist": "华罗庚演讲，阐述聪明在于学习、天才在于积累的道理。"}, {"from": 20, "to": 26, "gist": "巴金给家乡孩子的信，谈生命意义在于奉献，勉励珍惜时间。"}, {"from": 27, "to": 32, "gist": "毕业赠言，表达对师友母校的惜别之情与美好祝愿。"}], "main": "本文围绕毕业前开展的活动，包括联欢会策划、写信、阅读材料和毕业赠言，表达对师友母校的惜别之情。", "genre": "其他", "why": "毕业活动实践指导，非文学体裁"}, {"title": "采薇（节选）", "book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": 6, "unit": "第六单元", "page": 111, "n": 4, "parts": [{"from": 0, "to": 1, "gist": "昔往今归，杨柳依依与雨雪霏霏形成鲜明对比"}, {"from": 2, "to": 3, "gist": "归途饥渴行路艰难，心中伤悲无人知晓"}], "main": "通过昔往今归的景物对比和归途艰辛的描写，表达征人归途中的伤悲与哀痛", "genre": "其他", "why": "诗经古诗，非所列体裁"}, {"title": "浣溪沙", "book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": 6, "unit": "第六单元", "page": 119, "n": 2, "parts": [{"from": 0, "to": 0, "gist": "交代词牌、作者及写作背景，点明清泉寺临兰溪、溪水西流。"}, {"from": 1, "to": 1, "gist": "描写兰溪春景，借溪水西流抒发人生可再少的乐观情怀。"}], "main": "苏轼游清泉寺见溪水西流，借景抒怀，表达人生可再少的乐观豁达。", "genre": "其他", "why": "古诗词（词），非所列体裁"}, {"title": "清平乐", "book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": 6, "unit": "第六单元", "page": 120, "n": 3, "parts": [{"from": 0, "to": 1, "gist": "询问春天归去何处，希望有人能唤春归来同住。"}, {"from": 2, "to": 2, "gist": "无人知春踪，问黄鹂却无人能解其鸣，黄鹂飞过蔷薇。"}], "main": "词人询问春天归去何处，希望唤春归来，却无人能解，唯见黄鹂飞过蔷薇。", "genre": "其他", "why": "宋词属古诗词体裁"}, {"title": "回忆往事", "book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": 6, "unit": "第六单元", "page": 98, "n": 37, "parts": [{"from": 0, "to": 2, "gist": "围绕难忘小学生活主题开展综合性学习活动，表达师生情和感激之情。"}, {"from": 3, "to": 4, "gist": "借助时间轴回忆六年小学生活，选取代表性内容与同学分享。"}, {"from": 5, "to": 20, "gist": "田老师用讲故事的方式教学，在作者幼小的心田上播下了文学的种子。"}, {"from": 21, "to": 26, "gist": "作文上九十八个红双圈激励作者走上文学创作之路，终生难忘。"}, {"from": 27, "to": 36, "gist": "介绍制作成长纪念册的方法，包括收集筛选资料、分类和编排。"}], "main": "围绕难忘小学生活主题，通过回忆往事和阅读材料，引导学生制作成长纪念册珍藏成长记忆。", "genre": "记事写人", "why": "叙述入学经历，描写田老师"}], "genres": [["记事写人", 78], ["写景状物", 44], ["童话寓言", 44], ["说明文", 27], ["散文", 22], ["儿歌", 11], ["其他", 10], ["神话传说", 10], ["现代诗", 9], ["议论文", 2]], "books": ["一年级上册", "一年级下册", "三年级上册", "三年级下册", "二年级上册", "二年级下册", "五年级上册", "五年级下册", "六年级上册", "六年级下册", "四年级上册", "四年级下册"]};</script>
