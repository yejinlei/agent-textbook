, "why": "句式整齐押韵，适合儿童诵读"}, {"title": "吃水不忘挖井人", "book": "一年级下册", "grade": "一年级", "term": "下册", "unit_no": 2, "unit": "第二单元", "page": 18, "n": 5, "parts": [{"from": 0, "to": 2, "gist": "毛主席在沙洲坝带领挖井，解放后乡亲立碑刻字铭记。"}, {"from": 3, "to": 4, "gist": "课文来源说明及生字练习。"}], "main": "毛主席在沙洲坝带领挖井，解放后乡亲立碑刻字，时刻想念毛主席。", "genre": "记事写人", "why": "叙述毛主席带人挖井的事迹"}, {"title": "我多想去看看", "book": "一年级下册", "grade": "一年级", "term": "下册", "unit_no": 2, "unit": "第二单元", "page": 20, "n": 6, "parts": [{"from": 0, "to": 2, "gist": "妈妈和爸爸分别告诉“我”北京和新疆的美景，“我”表达想去看看的愿望。"}, {"from": 3, "to": 5, "gist": "读记词语，并和同学交流自己的愿望。"}], "main": "课文通过“我”想去北京看天安门和想去新疆看天山，表达了孩子对祖国美好景色的向往。", "genre": "散文", "why": "抒情叙事，表达愿望"}, {"title": "小公鸡和小鸭子", "book": "一年级下册", "grade": "一年级", "term": "下册", "unit_no": 3, "unit": "第三单元", "page": 26, "n": 10, "parts": [{"from": 0, "to": 2, "gist": "小公鸡和小鸭子在草里玩，小公鸡捉到虫子分给小鸭子吃。"}, {"from": 3, "to": 5, "gist": "小公鸡偷偷跟小鸭子下水，小鸭子救起落水的小公鸡。"}, {"from": 6, "to": 9, "gist": "补充练习句子，涉及小鸭子游到小公鸡身边和小公鸡下水。"}], "main": "小公鸡和小鸭子一起出去玩，在草里互相分享食物，在河边小鸭子救了落水的小公鸡。", "genre": "童话寓言", "why": "动物拟人，讲述互助故事"}, {"title": "树和喜鹊", "book": "一年级下册", "grade": "一年级", "term": "下册", "unit_no": 3, "unit": "第三单元", "page": 29, "n": 2, "parts": [{"from": 0, "to": 0, "gist": "从前只有一棵树一只喜鹊，树和喜鹊都很孤单。"}, {"from": 1, "to": 1, "gist": "后来种了好多树，喜鹊有了邻居，每天一起飞出去。"}], "main": "从前树和喜鹊很孤单，后来有了邻居，喜鹊们每天一起飞出去，不再孤单。", "genre": "童话寓言", "why": "树和喜鹊被拟人化，有情感行为"}, {"title": "怎么都快乐", "book": "一年级下册", "grade": "一年级", "term": "下册", "unit_no": 3, "unit": "第三单元", "page": 31, "n": 14, "parts": [{"from": 0, "to": 2, "gist": "一个人玩很好，可以折纸、踢毽子、跳绳、搭积木、看画画听。"}, {"from": 3, "to": 5, "gist": "两个人玩很好，可以讲故事、下象棋、打羽毛球、坐跷跷板。"}, {"from": 6, "to": 8, "gist": "三个人玩很好，可以讲故事和甩绳子轮流跳。"}, {"from": 9, "to": 10, "gist": "四个人玩很好，五个人玩也很好。"}, {"from": 11, "to": 13, "gist": "许多人玩更好，什么游戏都能玩，连开运动会也可以。"}], "main": "课文通过一个人到许多人玩的不同游戏，说明怎么都快乐。", "genre": "儿歌", "why": "句式简短重复，节奏明快"}, {"title": "端午粽", "book": "一年级下册", "grade": "一年级", "term": "下册", "unit_no": 4, "unit": "第四单元", "page": 42, "n": 8, "parts": [{"from": 0, "to": 1, "gist": "端午节外婆煮好粽子，描写粽子的样子和味道。"}, {"from": 2, "to": 4, "gist": "外婆粽子花样多，还装小篮分给邻居吃。"}, {"from": 5, "to": 5, "gist": "端午节吃粽子是为了纪念爱国诗人屈原。"}, {"from": 6, "to": 7, "gist": "课后讨论外婆的红枣粽和端午节的故事。"}], "main": "课文写了外婆在端午节煮粽子、粽子好吃花样多，以及端午节吃粽子纪念屈原的传说。", "genre": "记事写人", "why": "写外婆包粽子及吃粽经历"}, {"title": "夜色", "book": "一年级下册", "grade": "一年级", "term": "下册", "unit_no": 4, "unit": "第四单元", "page": 40, "n": 7, "parts": [{"from": 0, "to": 1, "gist": "从前胆子很小怕黑，妈妈讲勇敢故事也没用"}, {"from": 2, "to": 3, "gist": "爸爸拉去散步，发现夜晚花草微笑小鸟睡觉"}, {"from": 4, "to": 6, "gist": "课文标题及生字词部分"}], "main": "我从前怕黑，爸爸拉我去散步后发现夜晚也有美好，从此不再害怕黑夜", "genre": "儿歌", "why": "押韵有节奏，语言浅显"}, {"title": "要下雨了", "book": "一年级下册", "grade": "一年级", "term": "下册", "unit_no": 6, "unit": "第六单元", "page": 69, "n": 11, "parts": [{"from": 0, "to": 2, "gist": "小白兔割草时遇到小燕子，燕子告诉他要下雨了。"}, {"from": 3, "to": 6, "gist": "小白兔看到小鱼游到水面，小鱼告诉他要下雨了。"}, {"from": 7, "to": 9, "gist": "小白兔往家跑，告诉蚂蚁要下雨的消息，大雨下起来了。"}, {"from": 10, "to": 10, "gist": "生字表。"}], "main": "小白兔通过观察小燕子、小鱼和蚂蚁的行为，知道要下雨了，赶紧回家。", "genre": "童话寓言", "why": "动物拟人对话，借故事说明自然现象"}, {"title": "荷叶圆圆", "book": "一年级下册", "grade": "一年级", "term": "下册", "unit_no": 6, "unit": "第六单元", "page": 66, "n": 7, "parts": [{"from": 0, "to": 0, "gist": "描写荷叶圆圆的、绿绿的外形特点。"}, {"from": 1, "to": 5, "gist": "小水珠、小蜻蜓、小青蛙和小鱼儿分别把荷叶当作摇篮、停机坪、歌台和凉伞。"}, {"from": 6, "to": 6, "gist": "认读与课文相关的生字词。"}], "main": "课文描写了圆圆的绿绿的荷叶，小水珠、小蜻蜓、小青蛙和小鱼儿分别把荷叶当作摇篮、停机坪、歌台和凉伞。", "genre": "现代诗", "why": "拟人排比，节奏鲜明"}, {"title": "文具的家", "book": "一年级下册", "grade": "一年级", "term": "下册", "unit_no": 7, "unit": "第七单元", "page": 78, "n": 8, "parts": [{"from": 0, "to": 2, "gist": "贝贝经常丢铅笔和橡皮，向妈妈要新的，妈妈问她为什么天天丢东西。"}, {"from": 3, "to": 5, "gist": "妈妈让贝贝给文具找家，贝贝想到文具盒就是文具的家，从此每天检查文具是否都回家。"}, {"from": 6, "to": 7, "gist": "识字练习和讨论如何不再丢文具。"}], "main": "贝贝经常丢文具，在妈妈引导下想到用文具盒给文具安家，从此每天检查文具是否都回家。", "genre": "记事写人", "why": "讲述贝贝丢文具的故事"}, {"title": "一分钟", "book": "一年级下册", "grade": "一年级", "term": "下册", "unit_no": 7, "unit": "第七单元", "page": 81, " 们不明真相跟着逃跑，野牛追问真相后大家发现咕咚只是木瓜落水的声音。", "genre": "童话寓言", "why": "动物拟人，借事寓理"}, {"title": "小壁虎借尾巴", "book": "一年级下册", "grade": "一年级", "term": "下册", "unit_no": 8, "unit": "第八单元", "page": 105, "n": 11, "parts": [{"from": 0, "to": 2, "gist": "小壁虎被蛇咬断尾巴，决定向别人借一条尾巴。"}, {"from": 3, "to": 5, "gist": "小壁虎向小鱼、老牛、燕子借尾巴，都被拒绝了。"}, {"from": 6, "to": 7, "gist": "小壁虎回家找妈妈，发现自己长出了新尾巴。"}, {"from": 8, "to": 10, "gist": "课后活动：了解其他动物尾巴的用处，说一说和分角色朗读。"}], "main": "小壁虎尾巴被咬断后向小鱼、老牛、燕子借尾巴未果，回家发现自己长出了新尾巴。", "genre": "童话寓言", "why": "动物拟人对话，借尾巴故事"}, {"title": "小蝌蚪找妈妈", "book": "二年级上册", "grade": "二年级", "term": "上册", "unit_no": 1, "unit": "第一单元", "page": 1, "n": 6, "parts": [{"from": 0, "to": 0, "gist": "小蝌蚪误把乌龟当妈妈，乌龟告诉他们妈妈的特征。"}, {"from": 1, "to": 3, "gist": "小蝌蚪找到青蛙妈妈，青蛙妈妈确认他们已经长成青蛙。"}, {"from": 4, "to": 5, "gist": "小青蛙跟着妈妈捉害虫，附分角色朗读字词。"}], "main": "小蝌蚪在寻找妈妈的过程中不断成长，最终长成青蛙，跟着妈妈捉害虫。", "genre": "童话寓言", "why": "动物拟人化，有对话和情节"}, {"title": "我是什么", "book": "二年级上册", "grade": "二年级", "term": "上册", "unit_no": 1, "unit": "第一单元", "page": 5, "n": 7, "parts": [{"from": 0, "to": 1, "gist": "\"我\"会变化，变成汽、云、雨、冰雹和雪。"}, {"from": 2, "to": 4, "gist": "\"我\"在各地活动，有时温和有时暴躁，既做好事也做坏事。"}, {"from": 5, "to": 6, "gist": "请小朋友猜\"我\"是什么，并练习生字。"}], "main": "课文以第一人称介绍\"我\"的各种形态、活动场所及利弊，最后请小朋友猜\"我\"是什么。", "genre": "说明文", "why": "以第一人称说明水的变化"}, {"title": "植物妈妈有办法", "book": "二年级上册", "grade": "二年级", "term": "上册", "unit_no": 1, "unit": "第一单元", "page": 8, "n": 13, "parts": [{"from": 0, "to": 1, "gist": "孩子长大要离开妈妈，植物旅行用什么办法？"}, {"from": 2, "to": 3, "gist": "蒲公英妈妈用降落伞，让风把娃娃带向远方。"}, {"from": 4, "to": 5, "gist": "苍耳妈妈给孩子穿上带刺铠甲，挂住动物皮毛传播。"}, {"from": 6, "to": 7, "gist": "石榴妈妈不怕小鸟吃娃娃，种子在鸟肚子里安家。"}, {"from": 8, "to": 9, "gist": "豌豆妈妈让豆荚晒太阳，炸开后种子蹦跳离开。"}, {"from": 10, "to": 11, "gist": "植物妈妈办法很多，仔细观察才能发现知识。"}, {"from": 12, "to": 12, "gist": "课后练习：找出植物并说明传播种子的方法。"}], "main": "课文介绍了蒲公英、苍耳、石榴、豌豆四种植物传播种子的不同办法，告诉我们要仔细观察才能发现知识。", "genre": "儿歌", "why": "押韵拟人，语言浅显，适合儿童诵读"}, {"title": "彩虹", "book": "二年级上册", "grade": "二年级", "term": "上册", "unit_no": 3, "unit": "第三单元", "page": 28, "n": 5, "parts": [{"from": 0, "to": 3, "gist": "雨停后孩子想象在彩虹上为爸爸浇田、为妈妈照镜、与彩虹荡秋千。"}, {"from": 4, "to": 4, "gist": "本课要求认读的生字词。"}], "main": "雨停后，孩子想象在彩虹上为家人做力所能及的事，表达纯真美好的愿望。", "genre": "写景状物", "why": "描写彩虹这一自然景物"}, {"title": "去外婆家", "book": "二年级上册", "grade": "二年级", "term": "上册", "unit_no": 3, "unit": "第三单元", "page": 30, "n": 7, "parts": [{"from": 0, "to": 1, "gist": "小时候最大的乐趣是去山脚下的外婆家，那里宝贝多。"}, {"from": 2, "to": 4, "gist": "舅舅带回山货、山雀在林间欢跳、春天山上开满鲜花。"}, {"from": 5, "to": 6, "gist": "外婆家真有趣，并引导说一说外婆家带来的乐趣。"}], "main": "课文讲述了小时候去外婆家的乐趣，包括舅舅带回的山货、林间的山雀和春天的野花。", "genre": "记事写人", "why": "记叙童年去外婆家的经历"}, {"title": "数星星的孩子", "book": "二年级上册", "grade": "二年级", "term": "上册", "unit_no": 3, "unit": "第三单元", "page": 32, "n": 8, "parts": [{"from": 0, "to": 1, "gist": "夜晚，一个孩子坐在院子里仰头数星星，数到了几百颗。"}, {"from": 2, "to": 4, "gist": "奶奶质疑孩子能否数清星星，孩子坚持能数清并指出星星有规律。"}, {"from": 5, "to": 6, "gist": "爷爷讲解北斗七星绕北极星转，孩子验证后得知自己是张衡。"}, {"from": 7, "to": 7, "gist": "本课生字表。"}], "main": "本文讲述汉朝张衡小时候认真观察星星，发现星星运行规律，后来成为著名天学家的故事。", "genre": "记事写人", "why": "记叙张衡数星星的故事"}, {"title": "日月潭", "book": "二年级上册", "grade": "二年级", "term": "上册", "unit_no": 4, "unit": "第四单元", "page": 45, "n": 7, "parts": [{"from": 0, "to": 2, "gist": "介绍日月潭的位置、周围环境和湖的形状"}, {"from": 3, "to": 4, "gist": "描写日月潭清晨和中午的美景"}, {"from": 5, "to": 6, "gist": "日月潭风光秀丽，吸引中外游客"}], "main": "日月潭位于台湾省中部山区，湖水碧绿，风光秀丽，吸引中外游客。", "genre": "写景状物", "why": "描写日月潭自然风光"}, {"title": "葡萄沟", "book": "二年级上册", "grade": "二年级", "term": "上册", "unit_no": 4, "unit": "第四单元", "page": 47, "n": 9, "parts": [{"from": 0, "to": 2, "gist": "介绍葡萄沟盛产水果，葡萄成熟时景色美丽，老乡热情好客"}, {"from": 3, "to": 4, "gist": "阅读提示，联系上下文理解'五光十色'的含义"}, {"from": 5, "to": 5, "gist": "介绍葡萄干的加工方法和优良品质"}, {"from": 6, "to": 8, "gist": "总结葡萄沟是好地方，附课后练习"}], "main": "葡萄沟盛产葡萄，景色美丽，老乡热情好客，葡萄干品质优良，真是个好地方。", "genre": "写景状物", "why": "描写葡萄沟景色与物产"}, {"title": "黄山奇石", "book": "二年级上册", "grade": "二年级", "term": "上册", "unit_no": 4, "unit": "第四单元", "page": 42, "n": 8, "parts": [{"from": 0, "to": 0, "gist": "黄山风景区位于安徽省南部，以怪石闻名。"}, {"from": 1, "to": 3, "gist": "介绍仙桃石和猴子观海等奇石的有趣形态。"}, {"from": 4, "to": 5, "gist": "描写仙人指路和金鸡叫天都等奇石的生动形象。"}, {"from": 6, "to": 7, "gist": "列举更多奇石名称并邀请读者为无名岩石起名。"}], "main": "黄山风景区以怪石闻名，课文介绍了仙桃石、猴子观海、仙人指路、金鸡叫天都等奇石的有趣形态。", "genre": "写景状物", "why": "描写黄山奇石景色"}, {"title": "坐井观天", "book": "二年级上册", "grade": "二年级", "term": "上册", "unit_no": 5, "unit": "第五单元", "page": 54, "n": 7, "parts": [{"from": 0, "to": 2, "gist": "青蛙在井里，小鸟飞来落在井沿，小鸟说从天上飞了一百多里来找水喝。"}, {"from": 3, "to": 6, "gist": "青蛙说天只有井口大，小鸟说天无边无大，青蛙坚持自己不会弄错。"}], "main": "青蛙坐在井里，认为天只有井口大；小鸟说天无边无大，青蛙坚持自己不会弄错。", "genre": "童话寓言", "why": "借动物对话讲道理"}, {"title": "寒号鸟", "book": "二年级上册", "grade": "二年级", "term": "上册", "unit_no": 5, "unit": "第五单元", "page": 56, "n": 12, "parts": [{"from": 0, "to": 1, "gist": "山崖上寒号鸟与喜鹊做邻居，冬天将至。"}, {"from": 2, "to": 4, "gist": "喜鹊忙着做窝劝寒号鸟，寒号鸟不听劝告只顾玩耍。"}, {"from": 5, "to": 7, "gist": "寒号鸟冻得哀号，天暖后又得过且过不做窝。"}, {"from": 8, "to": 9, "gist": "寒冬腊月寒号鸟冻死，喜鹊呼唤无回应。"}, {"from": 10, "to": 11, "gist": "作者反思生活中类似的人，并安排分角色朗读。"}], "main": "寒号鸟不听喜鹊劝告不做窝，得过且过，最终在寒冬中冻死。", "genre": "童话寓言", "why": "民间故事，借鸟喻人寓理"}, {"title": "我要的是葫芦", "book": "二年级上册", "grade": "二年级", "term": "上册", "unit_no": 5, "unit": "第五单元", "page": 60, "n": 8, "parts": [{"from": 0, "to": 2, "gist": "一个人种葫芦，藤上长出小葫芦，他只要葫芦。"}, {"from": 3, "to": 5, "gist": "叶子上生了蚜虫，他不治虫，邻居劝他治虫他也不听。"}, {"from": 6, "to": 7, "gist": "蚜虫越来越多，小葫芦慢慢变黄，一个一个都落了。"}], "main": "一个人种葫芦，只想要葫芦，不治叶子上的蚜虫，结果小葫芦都落了。", "genre": "童话寓言", "why": "借故事说明道理，属寓言体裁"}, {"title": "八角楼上", "book": "二年级上册", "grade": "二年级", "term": "上册", "unit_no": 6, "unit": "第六单元", "page": 67, "n": 3, "parts": [{"from": 0, "to": 0, "gist": "毛主席住在八角楼，每当夜幕降临灯就亮了。"}, {"from": 1, "to": 2, "gist": "寒冬深夜毛主席穿着单衣在八角楼上拨灯芯写作。"}], "main": "毛主席在井冈山艰苦斗争年代住在八角楼，寒冬深夜仍坚持在灯下写作。", "genre": "记事写人", "why": "叙述毛主席深夜工作场景"}, {"title": "朱德的扁担", "book": "二年级上册", "grade": "二年级", "term": "上册", "unit_no": 6, "unit": "第六单元", "page": 69, "n": 6, "parts": [{"from": 0, "to": 1, "gist": "1928年朱德到井冈山会师，红军需储备粮食，战士们争着去挑粮。"}, {"from": 2, "to": 3, "gist": "朱德跟战士们一起挑粮，战士们心疼藏起扁担，朱德又找一根写上\"朱德的扁担\"。"}, {"from": 4, "to": 5, "gist": "大家越发敬爱朱德，不好意思再藏他的扁担。"}], "main": "朱德同志在井冈山跟战士们一起挑粮，战士们心疼藏起扁担，朱德又找一根写上\"朱德的扁担\"，大家越发敬爱他。", "genre": "记事写人", "why": "记叙朱德挑粮的故事"}, {"title": "难忘的泼水节", "book": "二年级上册", "grade": "二年级", "term": "上册", "unit_no": 6, "unit": "第六单元", "page": 72, "n": 10, "parts": [{"from": 0, "to": 1, "gist": "凤凰花开泼水节到，1961年周总理与傣族人民一起过节"}, {"from": 2, "to": 4, "gist": "人们敲鼓撒花瓣欢迎周总理，周总理与傣族人民一起跳舞"}, {"from": 5, "to": 6, "gist": "泼水开始，周总理和傣族人民互相泼水祝福，十分开心"}, {"from": 7, "to": 9, "gist": "感叹1961年泼水节幸福难忘"}], "main": "1961年泼水节，周总理与傣族人民一起过节，互相泼水祝福，十分幸福难忘。", "genre": "记事写人", "why": "记叙周总理过泼水节的事"}, {"title": "刘胡兰", "book": "二年级上册", "grade": "二年级", "term": "上册", "unit_no": 6, "unit": "第六单元", "page": 75, "n": 5, "parts": [{"from": 0, "to": 0, "gist": "刘胡兰因叛徒出卖被捕关押在庙里"}, {"from": 1, "to": 2, "gist": "敌人审问收买威胁，刘胡兰坚贞不屈"}, {"from": 3, "to": 4, "gist": "刘胡兰英勇就义，毛主席为她题词"}], "main": "刘胡兰因叛徒出卖被捕，面对敌人审问威胁坚贞不屈，英勇就义，毛主席为她题词生的伟大死的光荣。", "genre": "记事写人", "why": "叙述刘胡兰被捕牺牲的事迹"}, {"title": "称赞", "book": "二年级上册", "grade": "二年级", "term": "上册", "unit_no": 8, "unit": "第八单元", "page": 95, "n": 11, "parts": [{"from": 0, "to": 3, "gist": "小刺猬称赞小獾做的小板凳，小獾高兴极了。"}, {"from": 4, "to": 7, "gist": "小獾感谢小刺猬的称赞，送他一把椅子。"}, {"from": 8, "to": 10, "gist": "小刺猬回赠苹果，小獾称赞苹果香，并提出思考题。"}], "main": "小刺猬称赞小獾做的小板凳，小獾因此有了自信并学会做椅子，两人互相称赞、互赠礼物。", "genre": "童话寓言", "why": "动物拟人化，借故事讲道理"}, {"title": "纸船和风筝", "book": "二年级上册", "grade": "二年级", "term": "上册", "unit_no": 8, "unit": "第八单元", "page": 98, "n": 14, "parts": [{"from": 0, "to": 2, "gist": "松鼠和小熊住在山上，松鼠用纸船向小熊表达祝福。"}, {"from": 3, "to": 6, "gist": "小熊用风筝回赠松鼠，纸船和风筝让他们成了好朋友。"}, {"from": 7, "to": 10, "gist": "他们因小事吵架，纸船和风筝都消失了，双方都很难过。"}, {"from": 11, "to": 13, "gist": "松鼠主动和好，双方重归于好，纸船和风筝又飞了起来。"}], "main": "松鼠和小熊通过纸船和风筝成为好朋友，吵架后主动和好，友谊更加珍贵。", "genre": "童话寓言", "why": "动物拟人化，讲述友谊故事"}, {"title": "快乐的小河", "book": "二年级上册", "grade": "二年级", "term": "上册", "unit_no": 8, "unit": "第八单元", "page": 101, "n": 12, "parts": [{"from": 0, "to": 2, "gist": "小河撞山后哭泣，大山安慰它说跌跟头才有力量。"}, {"from": 3, "to": 5, "gist": "小河与泉水做好朋友，泉水希望流向远方。"}, {"from": 6, "to": 9, "gist": "泉水说瀑布更勇敢，小河与瀑布也做好朋友。"}, {"from": 10, "to": 11, "gist": "三个好伙伴手拉手一起流向远方。"}], "main": "小河撞山后在大山鼓励下，与泉水、瀑布做好朋友，一起快乐地流向远方。", "genre": "童话寓言", "why": "小河、大山等拟人化对话"}, {"title": "找春天", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 1, "unit": "第一单元", "page": 4, "n": 9, "parts": [{"from": 0, "to": 1, "gist": "春天来了，孩子们脱掉棉袄冲出家门奔向田野寻找春天。"}, {"from": 2, "to": 3, "gist": "春天像害羞的小姑娘躲藏起来，孩子们仔细地找。"}, {"from": 4, "to": 7, "gist": "孩子们找到了小草、野花、嫩芽和小溪等春天的景象。"}, {"from": 8, "to": 8, "gist": "孩子们从多种感官感受到春天，春天无处不在。"}], "main": "孩子们冲出家门在田野中寻找春天，通过小草、野花、嫩芽和小溪等景象，用多种感官感受到了春天的到来。", "genre": "写景状物", "why": "以拟人手法描写春天景物"}, {"title": "开满鲜花的小路", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 1, "unit": "第一单元", "page": 6, "n": 15, "parts": [{"from": 0, "to": 2, "gist": "鼹鼠先生收到长颈鹿大叔的包裹，打开后看到一堆认不出的小颗粒。"}, {"from": 3, "to": 4, "gist": "鼹鼠先生请松鼠太太看包裹，发现包裹破了，东西都漏在了路上。"}, {"from": 5, "to": 12, "gist": "春天鼹鼠先生去松鼠太太家做客，发现路上开满鲜花，松鼠太太认出那是花籽。"}, {"from": 13, "to": 14, "gist": "借助插图讲故事，分角色朗读。"}], "main": "长颈鹿大叔寄给鼹鼠先生的花籽在来时的路上漏出，春天开满了鲜花，成为一份美好的礼物。", "genre": "童话寓言", "why": "动物拟人对话，虚构情节"}, {"title": "邓小平爷爷植树", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 1, "unit": "第一单元", "page": 9, "n": 7, "parts": [{"from": 0, "to": 1, "gist": "1987年4月5日，83岁的邓小平爷爷在天坛公园兴致勃勃地植树。"}, {"from": 2, "to": 3, "gist": "邓爷爷精心挑选树苗，仔细栽好一棵笔直的小柏树，露出满意的笑容。"}, {"from": 4, "to": 6, "gist": "邓爷爷栽种的柏树已成风景，并开展拓展活动找春天。"}], "main": "1987年邓小平爷爷在天坛公园精心植树，小柏树已成风景，并开展找春天的拓展活动。", "genre": "记事写人", "why": "记叙邓小平植树事件"}, {"title": "雷锋叔叔，你在哪里", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 2, "unit": "第二单元", "page": 15, "n": 12, "parts": [{"from": 0, "to": 3, "gist": "沿着小溪寻找雷锋足迹，小溪讲述他冒雨抱迷路孩子的事。"}, {"from": 4, "to": 8, "gist": "顺着小路寻找雷锋足迹，小路讲述他踏荆棘背年迈大娘的事。"}, {"from": 9, "to": 11, "gist": "乘着春风四处寻觅，终于明白哪里需要爱心雷锋就出现在哪里。"}], "main": "课文通过小溪和小路的讲述展现雷锋助人为乐的事迹，揭示哪里需要爱心雷锋就出现在哪里。", "genre": "现代诗", "why": "课文自述为诗歌，有问有答"}, {"title": "千人糕", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 2, "unit": "第二单元", "page": 18, "n": 12, "parts": [{"from": 0, "to": 2, "gist": "爸爸介绍千人糕，说需要很多很多人才能做成。"}, {"from": 3, "to": 4, "gist": "孩子以为千人糕很大很特别，尝后却发现就是平常的米糕。"}, {"from": 5, "to": 8, "gist": "爸爸讲解米糕的制作过程，涉及种稻、熬糖、包装、送货、销售等，需要很多人劳动。"}, {"from": 9, "to": 11, "gist": "爸爸总结平平常常的糕需要很多人劳动，孩子认同应叫千人糕，并练习生字。"}], "main": "爸爸通过讲解米糕的制作过程，让孩子明白一块平平常常的糕需要很多很多人的劳动才能做成。", "genre": "记事写人", "why": "以父子对话叙事，记述事件"}, {"title": "我不是最弱小的", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 2, "unit": "第二单元", "page": 21, "n": 10, "parts": [{"from": 0, "to": 1, "gist": "一家人到森林游玩，萨沙发现野蔷薇开花"}, {"from": 2, "to": 4, "gist": "下雨了，妈妈把雨衣给了萨沙，萨沙不解"}, {"from": 5, "to": 6, "gist": "萨沙问自己是否最弱小，妈妈说要保护弱小"}, {"from": 7, "to": 9, "gist": "萨沙用雨衣保护野蔷薇，妈妈夸他勇敢"}], "main": "萨沙在妈妈的引导下，用雨衣保护了弱小的野蔷薇，明白了保护弱小就是勇敢。", "genre": "记事写人", "why": "记叙萨沙保护野蔷薇的故事"}, {"title": "读读儿童故事", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 2, "unit": "第二单元", "page": 28, "n": 4, "parts": [{"from": 0, "to": 0, "gist": "介绍儿童故事的特点，鼓励找儿童故事书来读。"}, {"from": 1, "to": 2, "gist": "介绍目录的作用，并举例说明如何根据目录制定读书计划。"}, {"from": 3, "to": 3, "gist": "选书时关注目录，先读感兴趣的内容。"}], "main": "课文介绍儿童故事的特点，并教学生如何通过目录了解书的内容、制定读书计划和选择感兴趣的内容来阅读。", "genre": "说明文", "why": "介绍目录作用及阅读方法"}, {"title": "彩色的梦", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 4, "unit": "第四单元", "page": 42, "n": 9, "parts": [{"from": 0, "to": 1, "gist": "彩色的梦是彩色铅笔，躺在铅笔盒里，打开就在白纸上跳蹦。"}, {"from": 2, "to": 4, "gist": "彩色铅笔描绘出绿草坪、红花、蓝天、葱郁森林和苹果般的太阳。"}, {"from": 5, "to": 6, "gist": "彩色铅笔是大森林的精灵，彩色梦境有水果香、季节风和紫葡萄的叮咛。"}, {"from": 7, "to": 8, "gist": "联系插图猜词义，并仿照课文用彩色铅笔画想画的内容。"}], "main": "课文描写了彩色铅笔在白纸上描绘出的美丽画面和充满香气的彩色梦境。", "genre": "现代诗", "why": "自由诗体，意象丰富，语言抒情"}, {"title": "一匹出色的马", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 4, "unit": "第四单元", "page": 45, "n": 10, "parts": [{"from": 0, "to": 2, "gist": "春天傍晚一家人到郊外散步，沿途景色美丽，恋恋不舍不想回去。"}, {"from": 3, "to": 5, "gist": "往回走时妹妹累了求抱，妈妈和爸爸都拒绝了。"}, {"from": 6, "to": 9, "gist": "爸爸拾起柳枝当马给妹妹骑，妹妹高兴地骑马先回到家。"}], "main": "春天傍晚一家人郊外散步，妹妹回家路上累了，爸爸用柳枝当马让她骑回家。", "genre": "记事写人", "why": "记叙散步事件，刻画人物"}, {"title": "枫树上的喜鹊", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 4, "unit": "第四单元", "page": 48, "n": 17, "parts": [{"from": 0, "to": 1, "gist": "渡口旁枫树有喜鹊窝，\"我\"喜欢喜鹊阿姨"}, {"from": 2, "to": 3, "gist": "发现小喜鹊，称它们喜鹊弟弟"}, {"from": 4, "to": 6, "gist": "\"我\"常到渡口看望喜鹊弟弟，它们长得快"}, {"from": 7, "to": 10, "gist": "喜鹊阿姨教喜鹊弟弟唱歌、做游戏、学拼音字母"}, {"from": 11, "to": 14, "gist": "喜鹊阿姨问太阳，喜鹊弟弟回答是太阳"}, {"from": 15, "to": 16, "gist": "\"我\"真高兴；生字词"}], "main": "\"我\"喜欢枫树上的喜鹊窝，常去看望喜鹊弟弟，看喜鹊阿姨教它们唱歌、做游戏、学拼音和认识太阳。", "genre": "散文", "why": "郭风散文，第一人称抒情叙事"}, {"title": "亡羊补牢", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 5, "unit": "第五单元", "page": 55, "n": 6, "parts": [{"from": 0, "to": 2, "gist": "羊圈破洞丢羊，邻居劝修，主人拒绝不修。"}, {"from": 3, "to": 3, "gist": "第二天又丢了一只羊。"}, {"from": 4, "to": 5, "gist": "课文出处及单元信息。"}], "main": "一个人羊圈破洞丢了羊，不听邻居劝告不修补，结果又丢了一只羊。", "genre": "童话寓言", "why": "课文标注为寓言二则"}, {"title": "小马过河", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 5, "unit": "第五单元", "page": 61, "n": 14, "parts": [{"from": 0, "to": 2, "gist": "老马让小马驮半口袋麦子去磨坊"}, {"from": 3, "to": 5, "gist": "小马遇到小河，向老牛询问能否蹚过去"}, {"from": 6, "to": 7, "gist": "老牛说水浅，松鼠说水深，小马不知所措"}, {"from": 8, "to": 10, "gist": "小马回家问妈妈，妈妈让他自己动脑筋试试"}, {"from": 11, "to": 12, "gist": "小马亲自试了，成功蹚过小河"}, {"from": 13, "to": 13, "gist": "分角色朗读提示"}], "main": "小马驮麦子去磨坊，遇河不知深浅，妈妈让他自己试试，小马蹚过小河，明白要自己动脑筋。", "genre": "童话寓言", "why": "动物拟人，含寓意"}, {"title": "揠苗助长", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 5, "unit": "第五单元", "page": 56, "n": 6, "parts": [{"from": 0, "to": 1, "gist": "他后悔没听劝告，赶紧修好羊圈，从此羊再没丢过。"}, {"from": 2, "to": 3, "gist": "有人巴望禾苗快长，焦急之下把禾苗一棵棵往高里拔。"}, {"from": 4, "to": 5, "gist": "他以为禾苗长高了，第二天儿子发现禾苗都枯死了。"}], "main": "他修好羊圈后羊再没丢过；有人为让禾苗快长而拔苗，结果禾苗都枯死了。", "genre": "童话寓言", "why": "揠苗助长是经典寓言故事"}, {"title": "画杨桃", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 5, "unit": "第五单元", "page": 58, "n": 20, "parts": [{"from": 0, "to": 1, "gist": "图画课上\"我\"从特定角度认真画杨桃"}, {"from": 2, "to": 4, "gist": "同学看到画后大笑，说像五角星"}, {"from": 5, "to": 10, "gist": "老师审视后提问，同学仍觉得好笑"}, {"from": 11, "to": 16, "gist": "老师请同学坐到\"我\"的位置看杨桃"}, {"from": 17, "to": 18, "gist": "老师讲解道理，\"我\"终生难忘"}, {"from": 19, "to": 19, "gist": "课后思考题"}], "main": "图画课上\"我\"认真画杨桃被同学嘲笑，老师让同学换位观察后讲解道理，教会大家看问题要换位思考。", "genre": "记事写人", "why": "记叙课堂事件，刻画师生形象"}, {"title": "雷雨", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 6, "unit": "第六单元", "page": 72, "n": 10, "parts": [{"from": 0, "to": 1, "gist": "乌云压顶，树叶不动，蝉不出声，忽然大风，蜘蛛逃走。"}, {"from": 2, "to": 4, "gist": "闪电越来越亮，雷声越来越响，雨越下越大，窗外景物看不清。"}, {"from": 5, "to": 7, "gist": "雨停了，太阳出来，彩虹出现，蝉叫了，蜘蛛回网上，青蛙叫了。"}, {"from": 8, "to": 9, "gist": "课文注释和生字表。"}], "main": "课文按雷雨前、中、后的顺序，描写了雷雨时天气和景物的变化。", "genre": "写景状物", "why": "描写雷雨前后自然景象"}, {"title": "要是你在野外迷了路", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 6, "unit": "第六单元", "page": 74, "n": 12, "parts": [{"from": 0, "to": 1, "gist": "迷路别慌张，大自然有很多天然指南针帮助辨别方向。"}, {"from": 2, "to": 3, "gist": "太阳是忠实的向导，中午在南边，树影指着北方。"}, {"from": 4, "to": 5, "gist": "北极星永远高挂北方，认出它就不会在黑夜里乱闯。"}, {"from": 6, "to": 7, "gist": "阴雨天大树帮忙，枝叶稠的一面是南方，稀的一面是北方。"}, {"from": 8, "to": 9, "gist": "沟渠积雪化得快慢不同，可以分辨北方和南方。"}, {"from": 10, "to": 11, "gist": "迷路别慌张，需要细细观察、多多去想辨别方向。"}], "main": "大自然有很多天然指南针，如太阳、北极星、大树和积雪，迷路时细细观察、多多去想就能辨别方向。", "genre": "儿歌", "why": "押韵分行，节奏明快，适合儿童诵读"}, {"title": "太空生活趣事多", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 6, "unit": "第六单元", "page": 77, "n": 8, "parts": [{"from": 0, "to": 0, "gist": "航天员在空间站生活，太空生活挺有趣。"}, {"from": 1, "to": 1, "gist": "航天员睡觉必须钻进固定在舱壁上的睡袋里。"}, {"from": 2, "to": 2, "gist": "航天员在舱体里移动主要靠手臂和扶手。"}, {"from": 3, "to": 4, "gist": "航天员喝水需用带吸管的饮水袋，不能用普通杯子。"}, {"from": 5, "to": 6, "gist": "航天员洗澡困难，现在通常用免洗湿巾擦拭身体。"}, {"from": 7, "to": 7, "gist": "在太空中生活很有趣。"}], "main": "本文介绍了航天员在空间站睡觉、活动、喝水和洗澡等趣事，说明太空生活很有趣。", "genre": "说明文", "why": "介绍太空生活趣事，客观说明"}, {"title": "大象的耳朵", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 7, "unit": "第七单元", "page": 84, "n": 11, "parts": [{"from": 0, "to": 3, "gist": "大象耳朵耷拉着，小兔子质疑，大象说天生如此。"}, {"from": 4, "to": 6, "gist": "小兔子、小羊、小鹿、小马、小老鼠都说大象耳朵耷拉着。"}, {"from": 7, "to": 8, "gist": "大象不安起来，决定让耳朵竖起来。"}, {"from": 9, "to": 10, "gist": "大象用竹竿撑耳朵，但小虫子飞进去，又头痛又心烦。"}], "main": "大象因其他动物说它耳朵耷拉着，便用竹竿撑耳朵，结果小虫子飞进去，又头痛又心烦。", "genre": "童话寓言", "why": "动物拟人对话，含寓意"}, {"title": "蜘蛛开店", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 7, "unit": "第七单元", "page": 87, "n": 16, "parts": [{"from": 0, "to": 2, "gist": "蜘蛛因寂寞无聊，决定开一家口罩编织店。"}, {"from": 3, "to": 4, "gist": "河马来买口罩，蜘蛛织了一整天，决定改卖围巾。"}, {"from": 5, "to": 9, "gist": "长颈鹿来买围巾，蜘蛛忙了一个星期才织完。"}, {"from": 10, "to": 13, "gist": "蜘蛛决定卖袜子，却被四十二只脚的蜈蚣吓跑。"}, {"from": 14, "to": 15, "gist": "续编故事提示及生字词。"}], "main": "蜘蛛因寂寞开店卖口罩、围巾、袜子，却因顾客特殊而屡屡受挫。", "genre": "童话寓言", "why": "蜘蛛拟人开店，动物顾客"}, {"title": "小毛虫", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 7, "unit": "第七单元", "page": 94, "n": 11, "parts": [{"from": 0, "to": 1, "gist": "小毛虫观察周围生机勃勃的世界，发现自己既不会唱也不会跑更不会飞。"}, {"from": 2, "to": 4, "gist": "小毛虫虽行动笨拙却不悲观，懂得该学会抽丝纺织为自己编织茧屋。"}, {"from": 5, "to": 7, "gist": "小毛虫尽心竭力织茧，在茧中被告知万事万物都有自己的规律。"}, {"from": 8, "to": 10, "gist": "小毛虫破茧成蛾，长出色彩斑斓的翅膀飞入雾霭，附词语练习。"}], "main": "小毛虫虽笨拙却尽心竭力抽丝纺织，耐心等待后破茧成蛾，长出翅膀飞向蓝天。", "genre": "童话寓言", "why": "拟人化小毛虫，寓含哲理"}, {"title": "青蛙卖泥塘", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 7, "unit": "第七单元", "page": 90, "n": 14, "parts": [{"from": 0, "to": 1, "gist": "青蛙想把烂泥塘卖掉，在泥塘边竖起\"卖泥塘\"的牌子。"}, {"from": 2, "to": 4, "gist": "老牛建议周围种些草，青蛙采集草籽播撒在泥塘周围。"}, {"from": 5, "to": 7, "gist": "野鸭建议引些水，青蛙找泉水砍竹子把水引到泥塘里。"}, {"from": 8, "to": 9, "gist": "泥塘仍未卖出，小动物们建议栽树种花修路盖房，青蛙照做。"}, {"from": 10, "to": 12, "gist": "青蛙觉得泥塘这么好，自己住挺好，决定不再卖泥塘。"}, {"from": 13, "to": 13, "gist": "生字练习：卖、倒、砍、泳、搬、泉、破、蛙。"}], "main": "青蛙想卖泥塘，根据小动物们的建议不断改进，最终觉得泥塘很好，决定不再卖。", "genre": "童话寓言", "why": "动物拟人化，虚构故事"}, {"title": "羿射九日", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 8, "unit": "第八单元", "page": 100, "n": 12, "parts": [{"from": 0, "to": 3, "gist": "十个太阳一齐出现，炙烤大地，人类日子艰难"}, {"from": 4, "to": 6, "gist": "羿射下九个太阳，留下最后一个"}, {"from": 7, "to": 10, "gist": "用表格梳理故事的起因、经过和结果"}, {"from": 11, "to": 11, "gist": "思考故事中哪些内容很神奇"}], "main": "十个太阳一齐出现炙烤大地，神箭手羿射下九个太阳，留下最后一个，大地重新恢复生机。", "genre": "神话传说", "why": "羿射九日是古代神话故事"}, {"title": "黄帝的传说", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 8, "unit": "第八单元", "page": 103, "n": 11, "parts": [{"from": 0, "to": 2, "gist": "介绍黄帝轩辕的身份及其因众多发明创造被尊为部落联盟首领。"}, {"from": 3, "to": 5, "gist": "黄帝受草帽滚动启发发明独轮车，后人们改进为双轮车并用牲畜拉车。"}, {"from": 6, "to": 8, "gist": "黄帝受蚂蚁浮于树叶启发，带领民众挖空树干造出船。"}, {"from": 9, "to": 10, "gist": "车和船的发明发展了水陆交通，改善了人们的生活。"}], "main": "本文讲述了黄帝受自然现象启发发明车和船，发展水陆交通、改善人们生活的传说故事。", "genre": "神话传说", "why": "标题即'黄帝的传说'，讲述远古传说"}, {"title": "大禹治水", "book": "二年级下册", "grade": "二年级", "term": "下册", "unit_no": 8, "unit": "第八单元", "page": 106, "n": 13, "parts": [{"from": 0, "to": 2, "gist": "洪水泛滥给百姓带来灾难，必须治好洪水。"}, {"from": 3, "to": 4, "gist": "鲧治水失败，禹吸取教训采用疏导办法。"}, {"from": 5, "to": 7, "gist": "禹带领众人开山凿石疏通河道，十三年不离家。"}, {"from": 8, "to": 10, "gist": "禹治服洪水，恢复农业生产，百姓安居乐业。"}, {"from": 11, "to": 12, "gist": "人们尊称禹为大禹。"}], "main": "大禹吸取鲧治水失败的教训，采用疏导办法，带领众人十三年治服洪水，恢复生产，被尊称为大禹。", "genre": "神话传说", "why": "开头即点明'我国有这样一个传说'"}, {"title": "大青树下的小学", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 1, "unit": "第一单元", "page": 2, "n": 3, "parts": [{"from": 0, "to": 0, "gist": "各民族小学生高高兴兴来到学校，向小鸟、老师和国旗问好。"}, {"from": 1, "to": 2, "gist": "大青树上的铜钟敲响，上课了，大家在教室里一起。"}], "main": "课文描写了各民族小学生来到大青树下的小学上学的情景。", "genre": "写景状物", "why": "描写边疆小学环境与学生活动"}, {"title": "花的学校", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 1, "unit": "第一单元", "page": 5, "n": 9, "parts": [{"from": 0, "to": 1, "gist": "阵雨落下，东风走过荒野，花朵从地下跑出来跳舞狂欢"}, {"from": 2, "to": 5, "gist": "花儿在地下学校上学，雨一来便放假，穿着各色衣裳冲出来"}, {"from": 6, "to": 8, "gist": "花儿的家在天上星星住的地方，他们急着回到妈妈身边"}], "main": "通过孩子的想象，描写花儿在地下学校上学，雨来时放假冲出来，回到天上妈妈身边的故事。", "genre": "现代诗", "why": "散文诗体裁，诗意想象丰富"}, {"title": "不懂就要问", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 1, "unit": "第一单元", "page": 7, "n": 11, "parts": [{"from": 0, "to": 2, "gist": "孙中山在私塾读书，不懂就问，壮着胆子向先生提问"}, {"from": 3, "to": 7, "gist": "课堂鸦雀无声，先生收起戒尺，详细讲解书中的道理"}, {"from": 8, "to": 10, "gist": "同学问孙中山不怕挨打吗，孙中山说不懂就要问"}], "main": "孙中山在私塾读书时不懂就问，先生详细讲解，他坚持学问就要问清道理。", "genre": "记事写人", "why": "记叙孙中山提问的故事"}, {"title": "秋天的雨", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 2, "unit": "第二单元", "page": 19, "n": 7, "parts": [{"from": 0, "to": 0, "gist": "秋天的雨带着清凉和温柔，轻轻打开秋天的大门。"}, {"from": 1, "to": 3, "gist": "秋天的雨有五彩缤纷的颜料和香甜的气味。"}, {"from": 4, "to": 4, "gist": "秋天的雨吹起金色小喇叭，动物们准备过冬。"}, {"from": 5, "to": 6, "gist": "秋天的雨带来丰收的歌和欢乐的歌，并列出相关字词。"}], "main": "秋天的雨带着清凉和温柔打开秋天的大门，带来五彩缤纷的颜色、香甜的气味，提醒动物准备过冬，是丰收和欢乐的歌。", "genre": "写景状物", "why": "描写秋雨色彩、气味、声音"}, {"title": "铺满金色巴掌的水泥道", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 2, "unit": "第二单元", "page": 16, "n": 13, "parts": [{"from": 0, "to": 2, "gist": "秋夜风雨后放晴，\"我\"背书包上学，天空明朗"}, {"from": 3, "to": 5, "gist": "地面潮湿有水洼，梧桐落叶粘在湿水泥道上"}, {"from": 6, "to": 8, "gist": "水泥道像彩色地毯，落叶如金色小巴掌，\"我\"穿着小雨靴愉快地走"}, {"from": 9, "to": 11, "gist": "\"我\"想慢慢走却怕迟到，第一次觉得水泥道真美"}, {"from": 12, "to": 12, "gist": "生字表"}], "main": "秋夜风雨后，\"我\"上学路上发现铺满金色梧桐落叶的水泥道格外美丽。", "genre": "写景状物", "why": "描写水泥道落叶美景"}, {"title": "总也倒不了的老屋", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 3, "unit": "第三单元", "page": 28, "n": 26, "parts": [{"from": 0, "to": 1, "gist": "老屋活了一百多岁，破旧不堪，准备倒下。"}, {"from": 2, "to": 7, "gist": "小猫请求老屋再站一晚避暴风雨，老屋答应，小猫次日离开。"}, {"from": 8, "to": 11, "gist": "老母鸡请求老屋再站二十几天孵蛋，老屋答应，母鸡带小鸡离开。"}, {"from": 12, "to": 13, "gist": "读者猜测老屋可能不耐烦，又会有人来求助。"}, {"from": 14, "to": 20, "gist": "小蜘蛛请求老屋再站一会儿织网，老屋边晒太阳边听它讲故事。"}, {"from": 21, "to": 25, "gist": "读者猜测老屋不会倒了，并讨论老屋的印象和预测方法。"}], "main": "老屋每次准备倒下时都有小动物来求助，它一次次答应帮忙，最终因听小蜘蛛讲故事而一直站着。", "genre": "童话寓言", "why": "老屋拟人化，会说话会思考"}, {"title": "犟龟", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 3, "unit": "第三单元", "page": 32, "n": 23, "parts": [{"from": 0, "to": 2, "gist": "陶陶听说狮王要举行婚礼，决定出发去参加。"}, {"from": 3, "to": 7, "gist": "蜘蛛嘲笑陶陶赶不上婚礼劝她回家，陶陶坚持前行。"}, {"from": 8, "to": 14, "gist": "蜗牛告诉陶陶走反了方向，陶陶掉头继续赶路。"}, {"from": 15, "to": 16, "gist": "壁虎通知陶陶婚礼取消，让她回家。"}, {"from": 17, "to": 22, "gist": "学生分享阅读时的预测方法，并学习修正预测。"}], "main": "乌龟陶陶不顾蜘蛛、蜗牛、壁虎的劝阻，坚持前往参加狮王婚礼，课文还引导学生学习预测阅读方法。", "genre": "童话寓言", "why": "动物拟人化，讲述寓言故事"}, {"title": "小狗学叫", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 3, "unit": "第三单元", "page": 36, "n": 49, "parts": [{"from": 0, "to": 8, "gist": "不会叫的小狗被其他动物指责"}, {"from": 9, "to": 9, "gist": "阅读提示，预测故事结局"}, {"from": 10, "to": 19, "gist": "小狗向小公鸡学叫失败，被狐狸嘲笑"}, {"from": 20, "to": 30, "gist": "小狗向杜鹃学叫成功，感到高兴"}, {"from": 31, "to": 33, "gist": "猎人误将小狗当杜鹃开枪"}, {"from": 34, "to": 42, "gist": "第一种结局：小狗遇到小母牛"}, {"from": 43, "to": 44, "gist": "第二种结局：小狗遇到农夫"}, {"from": 45, "to": 46, "gist": "第三种结局：小狗听到狗叫声"}, {"from": 47, "to": 48, "gist": "讨论问题"}], "main": "一条不会叫的小狗向不同动物学叫，经历失败与成功，最终遇到三种不同结局。", "genre": "童话寓言", "why": "动物拟人对话，虚构故事"}, {"title": "宝葫芦的秘密（节选）", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 4, "unit": "第四单元", "page": 46, "n": 26, "parts": [{"from": 0, "to": 4, "gist": "王葆介绍自己并引出宝葫芦的故事，说明自己是普通人。"}, {"from": 5, "to": 16, "gist": "王葆回忆小时候奶奶以讲故事为条件让他洗脚剪指甲。"}, {"from": 17, "to": 18, "gist": "故事中的人得到宝葫芦后想要什么就有什么，过上好日子。"}, {"from": 19, "to": 22, "gist": "王葆从小常幻想拥有宝葫芦来解决生活中的困难。"}, {"from": 23, "to": 25, "gist": "课后思考题和延伸阅读建议。"}], "main": "王葆回忆小时候听奶奶讲宝葫芦的故事，并幻想自己拥有宝葫芦来解决生活中的困难。", "genre": "童话寓言", "why": "宝葫芦是童话中的神奇物品"}, {"title": "在牛肚子里旅行", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 4, "unit": "第四单元", "page": 49, "n": 22, "parts": [{"from": 0, "to": 5, "gist": "两只蟋蟀玩捉迷藏，红头躲在草堆里不作声。"}, {"from": 6, "to": 9, "gist": "红头被大黄牛吃进嘴里，拼命呼救。"}, {"from": 10, "to": 15, "gist": "青头跳到牛身上，告诉红头牛胃结构并鼓励它。"}, {"from": 16, "to": 18, "gist": "红头随草回到牛嘴，被喷嚏喷出。"}, {"from": 19, "to": 21, "gist": "红头获救感谢青头，青头安慰它。"}], "main": "红头玩捉迷藏时被牛吃进肚子，青头鼓励并帮助它，红头最终被喷嚏喷出获救。", "genre": "童话寓言", "why": "蟋蟀会说话，动物拟人化"}, {"title": "一块奶酪", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 4, "unit": "第四单元", "page": 52, "n": 7, "parts": [{"from": 0, "to": 2, "gist": "蚂蚁队长宣布不许偷嘴的纪律，大家争先恐后运粮。"}, {"from": 3, "to": 4, "gist": "蚂蚁们发现大奶酪，奶酪诱人，考验纪律性。"}, {"from": 5, "to": 6, "gist": "蚂蚁队长拽掉奶酪角，面临是否偷吃的两难抉择。"}], "main": "蚂蚁队长宣布不许偷嘴的纪律，运粮时发现大奶酪，因拽掉奶酪角而面临是否偷吃的两难抉择。", "genre": "童话寓言", "why": "蚂蚁拟人化，含道德寓意"}, {"title": "搭船的鸟", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 5, "unit": "第五单元", "page": 60, "n": 8, "parts": [{"from": 0, "to": 2, "gist": "我和母亲坐船去外祖父家，雨停后看见一只美丽的翠鸟停在船头，好奇它来做什么。"}, {"from": 3, "to": 5, "gist": "翠鸟一下子冲进水里捕鱼，飞起来后一口吞下小鱼。"}, {"from": 6, "to": 7, "gist": "母亲告诉我这是一只翠鸟，它搭了我们的船在捕鱼吃。"}], "main": "我和母亲坐船去外祖父家，途中看见一只翠鸟停在船头捕鱼，母亲告诉我它搭了我们的船。", "genre": "写景状物", "why": "以描写翠鸟外形和捕鱼为主"}, {"title": "金色的草地", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 5, "unit": "第五单元", "page": 62, "n": 8, "parts": [{"from": 0, "to": 1, "gist": "介绍窗前草地上的蒲公英，以及我和弟弟在草地上玩耍的快乐。"}, {"from": 2, "to": 3, "gist": "观察草地颜色变化，发现蒲公英花瓣开合导致草地变色。"}, {"from": 4, "to": 4, "gist": "表达对可爱草地和有趣蒲公英的喜爱之情。"}, {"from": 5, "to": 7, "gist": "课后练习：补充草地颜色变化内容并拓展观察事物变化。"}], "main": "课文通过描写蒲公英使草地随时间变色及玩耍经历，展现观察自然的乐趣。", "genre": "写景状物", "why": "描写草地与蒲公英的变化"}, {"title": "海滨小城", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 6, "unit": "第六单元", "page": 73, "n": 9, "parts": [{"from": 0, "to": 2, "gist": "描写海滨的蓝天碧海、朝阳镀金和沙滩上渔船归港的热闹景象。"}, {"from": 3, "to": 6, "gist": "描写小城庭院绿树成荫、公园榕树如伞、街道干净整洁。"}, {"from": 7, "to": 8, "gist": "总结海滨小城又美丽又整洁。"}], "main": "本文描写了海滨小城的大海、沙滩、庭院、公园和街道的美丽景色，赞美了小城的美丽与整洁。", "genre": "写景状物", "why": "描写海滨小城景色"}, {"title": "美丽的小兴安岭", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 6, "unit": "第六单元", "page": 75, "n": 11, "parts": [{"from": 0, "to": 0, "gist": "小兴安岭有数不清的树木，几百里连成一片，像绿色的海洋。"}, {"from": 1, "to": 2, "gist": "春天树木抽枝长叶，积雪融化汇成小溪，小鹿在溪边活动。"}, {"from": 3, "to": 4, "gist": "夏天树木葱茏，晨雾弥漫，阳光穿过树梢，草地野花盛开。"}, {"from": 5, "to": 6, "gist": "秋天树叶变黄，落叶飞舞，森林向人们献出各种果实和药材。"}, {"from": 7, "to": 8, "gist": "冬天雪花飞舞，积雪深厚，黑熊冬眠，紫貂捕食，松鼠过冬。"}, {"from": 9, "to": 10, "gist": "小兴安岭四季景色诱人，是美丽的大花园，也是巨大的宝库。"}], "main": "小兴安岭一年四季景色诱人，春天生机勃勃，夏天葱茏美丽，秋天果实丰富，冬天白雪皑皑，是美丽的大花园和巨大的宝库。", "genre": "写景状物", "why": "按四季描写小兴安岭景色"}, {"title": "富饶的西沙群岛", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 6, "unit": "第六单元", "page": 70, "n": 10, "parts": [{"from": 0, "to": 0, "gist": "西沙群岛位于南海西北部，风景优美，物产丰富。"}, {"from": 1, "to": 2, "gist": "海水五光十色，海底有珊瑚、海参、大龙虾等生物。"}, {"from": 3, "to": 5, "gist": "各种各样的鱼多得数不清，海里一半是水一半是鱼。"}, {"from": 6, "to": 6, "gist": "岛上树林茂密，栖息着各种海鸟，遍地鸟蛋和鸟粪。"}, {"from": 7, "to": 9, "gist": "西沙群岛必将更加美丽富饶，并附有阅读提示。"}], "main": "西沙群岛风景优美、物产丰富，海水五光十色，海底生物和鱼类众多，也是鸟的天下，必将更加美丽富饶。", "genre": "写景状物", "why": "描写西沙群岛景色与物产"}, {"title": "香港，璀璨的明珠", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 6, "unit": "第六单元", "page": 78, "n": 7, "parts": [{"from": 0, "to": 0, "gist": "香港位于我国南部，是享誉世界的金融、航运和贸易中心，也是购物美食旅游的好去处。"}, {"from": 1, "to": 2, "gist": "香港贸易繁荣，是举世闻名的贸易港，也是名满天下的美食天堂。"}, {"from": 3, "to": 4, "gist": "香港是旅游胜地，维多利亚港、金紫荆雕塑和幻彩咏香江等景观令人流连忘返。"}, {"from": 5, "to": 6, "gist": "在共建一带一路和粤港澳大湾区建设中，香港扮演重要角色，未来必定更加璀璨夺目。"}], "main": "香港是享誉世界的金融、航运和贸易中心，也是美食天堂和旅游胜地，未来在共建一带一路和粤港澳大湾区建设中必将更加璀璨夺目。", "genre": "说明文", "why": "客观介绍香港特点"}, {"title": "大自然的声音", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 7, "unit": "第七单元", "page": 86, "n": 5, "parts": [{"from": 0, "to": 0, "gist": "总起，点明大自然有许多美妙的声音。"}, {"from": 1, "to": 3, "gist": "分述风、水、动物是大自然的音乐家和歌手。"}, {"from": 4, "to": 4, "gist": "本课生字词。"}], "main": "大自然有许多美妙的声音，风、水、动物都是大自然的音乐家和歌手。", "genre": "写景状物", "why": "描写风、水、动物的声音"}, {"title": "读不完的大书", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 7, "unit": "第七单元", "page": 89, "n": 9, "parts": [{"from": 0, "to": 0, "gist": "作者五六岁时喜欢到大自然中寻找好玩的东西。"}, {"from": 1, "to": 2, "gist": "描写了小鸟、老鹰和蚂蚁等动物的有趣表现。"}, {"from": 3, "to": 5, "gist": "描写了花草树木和果树的千姿百态及鲜美的果实。"}, {"from": 6, "to": 6, "gist": "描写了作者最喜爱的竹子和棕榈树的姿态与意境。"}, {"from": 7, "to": 8, "gist": "总结大自然是读不完的大书，并提问课文描写了哪些好玩的东西。"}], "main": "课文通过描写大自然中动物、植物等好玩的东西，表达大自然是一本读不完的大书，充满奥秘和乐趣。", "genre": "写景状物", "why": "描写自然景物，抒发感悟"}, {"title": "一定要争气", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 8, "unit": "第八单元", "page": 97, "n": 8, "parts": [{"from": 0, "to": 2, "gist": "童第周出身贫寒，中学时刻苦学习赶上同学，立志争气。"}, {"from": 3, "to": 5, "gist": "童第周留学比利时，成功完成高难度实验，为中国人争气。"}, {"from": 6, "to": 7, "gist": "“一定要争气”激励童第周不断攀登科学高峰。"}], "main": "童第周出身贫寒，通过刻苦学习在中学和留学期间为中国人争气，“一定要争气”激励他攀登科学高峰。", "genre": "记事写人", "why": "记叙童第周生平事迹"}, {"title": "手术台就是阵地", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 8, "unit": "第八单元", "page": 100, "n": 7, "parts": [{"from": 0, "to": 1, "gist": "齐会战斗打响，白求恩在小庙里连续两天两夜给伤员做手术"}, {"from": 2, "to": 4, "gist": "炮火纷飞中白求恩拒绝撤离，坚持在手术台旁争分夺秒做手术"}, {"from": 5, "to": 6, "gist": "战斗胜利结束，白求恩在手术台旁连续工作六十九小时"}], "main": "齐会战斗中，白求恩大夫在炮火纷飞的小庙里坚持给伤员做手术，连续工作六十九小时，把手术台当作自己的阵地。", "genre": "记事写人", "why": "记叙白求恩战斗事迹"}, {"title": "一个粗瓷大碗", "book": "三年级上册", "grade": "三年级", "term": "上册", "unit_no": 8, "unit": "第八单元", "page": 103, "n": 4, "parts": [{"from": 0, "to": 0, "gist": "介绍军事博物馆中陈列的赵一曼用过的粗瓷大碗及其背后的故事。"}, {"from": 1, "to": 3, "gist": "通讯员送来粗瓷大碗，赵一曼要求归还，通讯员不知往哪里还。"}], "main": "赵一曼用过的粗瓷大碗陈列在军事博物馆，通讯员送来碗后赵一曼要求归还，体现了她艰苦朴素、关心战士的品质。", "genre": "记事写人", "why": "讲述赵一曼与粗瓷大碗的故事"}, {"title": "燕子", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 1, "unit": "第一单元", "page": 4, "n": 5, "parts": [{"from": 0, "to": 1, "gist": "描写小燕子的外形及春日里燕子飞来的情景"}, {"from": 2, "to": 3, "gist": "描写小燕子在空中飞翔和掠过水面的姿态"}, {"from": 4, "to": 4, "gist": "描写小燕子在电线上休憩的有趣画面"}], "main": "课文描写了小燕子的可爱外形、春日里飞翔和休憩的姿态，展现了春天的生机与燕子的美丽。", "genre": "写景状物", "why": "描写燕子外形与春日景象"}, {"title": "荷花", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 1, "unit": "第一单元", "page": 6, "n": 7, "parts": [{"from": 0, "to": 0, "gist": "清早到公园闻到清香，赶往荷花池边"}, {"from": 1, "to": 3, "gist": "描写并赞美荷花的美丽姿态"}, {"from": 4, "to": 4, "gist": "想象自己变成荷花翩翩起舞"}, {"from": 5, "to": 6, "gist": "赏析课文中\"挨挨挤挤\"和\"冒\"等用词"}], "main": "作者清早到公园看荷花，描写了荷花的美丽姿态，并想象自己变成荷花翩翩起舞。", "genre": "写景状物", "why": "描写荷花形态与池塘景色"}, {"title": "昆虫备忘录", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 1, "unit": "第一单元", "page": 8, "n": 5, "parts": [{"from": 0, "to": 1, "gist": "介绍复眼的概念及有复眼的昆虫视觉灵敏。"}, {"from": 2, "to": 3, "gist": "作者想象人长复眼后觉得还是不要。"}, {"from": 4, "to": 4, "gist": "提问读者是否了解各种昆虫及其秘密。"}], "main": "课文介绍复眼的概念与功能，幽默想象人长复眼的情景，并引导读者了解昆虫。", "genre": "写景状物", "why": "描写昆虫外形特征与习性"}, {"title": "会摇尾巴的狼", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 2, "unit": "第二单元", "page": 18, "n": 14, "parts": [{"from": 0, "to": 3, "gist": "狼掉进陷阱，假装是狗，请求老山羊帮忙"}, {"from": 4, "to": 6, "gist": "老山羊怀疑是狼，狼自称狼狗，恳求老山羊伸出腿来"}, {"from": 7, "to": 9, "gist": "老山羊识破谎言，狼摇尾巴想证明自己是狗"}, {"from": 10, "to": 12, "gist": "老山羊认出是狼，狼露出凶相，老山羊走开"}, {"from": 13, "to": 13, "gist": "分角色朗读课文"}], "main": "狼掉进陷阱后假装是狗骗老山羊帮忙，被老山羊识破后露出凶相，老山羊走开。", "genre": "童话寓言", "why": "动物拟人，寓含道理"}, {"title": "鹿角和鹿腿", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 2, "unit": "第二单元", "page": 21, "n": 11, "parts": [{"from": 0, "to": 2, "gist": "鹿在池塘边欣赏自己匀称的身段和精美的角。"}, {"from": 3, "to": 4, "gist": "鹿抱怨腿太细，随后听到狮子逼近。"}, {"from": 5, "to": 6, "gist": "鹿靠长腿甩掉狮子，角却被树枝挂住险些丧命。"}, {"from": 7, "to": 8, "gist": "鹿感叹美丽的角差点送命，难看的腿却让他逃生。"}, {"from": 9, "to": 10, "gist": "课后练习：复述故事并讨论对鹿角和鹿腿的看法。"}], "main": "一只鹿欣赏美丽的角却嫌弃细腿，遇险时腿救了他而角差点害死他，说明美丑各有用处。", "genre": "童话寓言", "why": "动物拟人，寓理于事"}, {"title": "池子与河流", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 2, "unit": "第二单元", "page": 23, "n": 5, "parts": [{"from": 0, "to": 3, "gist": "池子对河流说话，感叹河流总是滚滚滔滔、从不疲劳、背负沉重货物。"}, {"from": 4, "to": 4, "gist": "说明寓言故事可用诗的形式来讲，并提示分角色。"}], "main": "池子对邻居河流说话，感叹河流总是滚滚滔滔、从不疲劳、背负沉重货物，寓言以诗的形式呈现。", "genre": "童话寓言", "why": "拟人化角色，结尾点明寓意"}, {"title": "石蜂", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 3, "unit": "第三单元", "page": 36, "n": 8, "parts": [{"from": 0, "to": 1, "gist": "作者提出石蜂不靠记忆力回家的假设，并设计实验进行验证。"}, {"from": 2, "to": 4, "gist": "记录石蜂陆续飞回蜂窝的实验结果。"}, {"from": 5, "to": 6, "gist": "总结实验结果，得出石蜂靠特殊能力而非记忆力辨认方向的结论。"}, {"from": 7, "to": 7, "gist": "读一读加点部分，体会并找出类似语句。"}], "main": "作者通过实验验证石蜂不是靠记忆力辨认方向，而是靠一种无法解释的特殊能力。", "genre": "说明文", "why": "通过实验说明石蜂辨向能力"}, {"title": "小虾", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 3, "unit": "第三单元", "page": 38, "n": 3, "parts": [{"from": 0, "to": 1, "gist": "葡萄架下的水缸正好养小虾，我和阿成哥去小溪捉了小虾回家养。"}, {"from": 2, "to": 2, "gist": "缸里的小虾十分有趣，有的独自荡来荡去，有的互相追逐，有的紧贴缸壁。"}], "main": "葡萄架下的水缸里养着从溪中捉来的小虾，它们十分有趣。", "genre": "写景状物", "why": "以第一人称细致描写小虾外形与习性"}, {"title": "海底世界", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 3, "unit": "第三单元", "page": 34, "n": 5, "parts": [{"from": 0, "to": 0, "gist": "提出大海深处是怎样的问题"}, {"from": 1, "to": 3, "gist": "描写海底宁静黑暗、有各种声音、动物活动方法各异"}, {"from": 4, "to": 4, "gist": "课文结尾段落"}], "main": "课文描写了大海深处的宁静黑暗、各种声音和动物活动方法，展现海底世界的奇妙", "genre": "说明文", "why": "客观介绍海底特征与物产"}, {"title": "赵州桥", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 4, "unit": "第四单元", "page": 50, "n": 7, "parts": [{"from": 0, "to": 0, "gist": "介绍赵州桥的位置、名称、设计者和建造年代。"}, {"from": 1, "to": 1, "gist": "描写赵州桥的雄伟和创举式的设计。"}, {"from": 2, "to": 3, "gist": "抄写和介绍赵州桥的练习要求。"}, {"from": 4, "to": 4, "gist": "描写赵州桥栏板上精美的龙图案。"}, {"from": 5, "to": 6, "gist": "赵州桥是宝贵的历史文化遗产。"}], "main": "赵州桥是一座世界闻名的石拱桥，雄伟美观，体现了劳动人民的智慧和才干，是宝贵的历史文化遗产。", "genre": "说明文", "why": "介绍赵州桥的结构与特点"}, {"title": "一幅名扬中外的画", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 4, "unit": "第四单元", "page": 52, "n": 4, "parts": [{"from": 0, "to": 1, "gist": "介绍张择端及其名画《清明上河图》的历史与保存情况"}, {"from": 2, "to": 3, "gist": "描写画中人物众多、街市热闹的场景"}], "main": "课文介绍了北宋画家张择端的名画《清明上河图》及其画中热闹的场景。", "genre": "说明文", "why": "介绍画作历史与内容"}, {"title": "纸的发明", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 4, "unit": "第四单元", "page": 47, "n": 14, "parts": [{"from": 0, "to": 1, "gist": "造纸术是中国对世界文明的伟大贡献，纸发明前书写材料笨重不便。"}, {"from": 2, "to": 4, "gist": "从西汉麻纸到蔡伦改进造纸术，方法简便廉价得以传承。"}, {"from": 5, "to": 6, "gist": "造纸术传遍世界促进文化发展，并梳理了造纸术发展时间线。"}, {"from": 7, "to": 11, "gist": "小组交流传统节日活动，收集资料并计划展示成果。"}, {"from": 12, "to": 13, "gist": "结合课文分析蔡伦造纸法传承原因，选做古代科技成就资料查找。"}], "main": "本文介绍了造纸术的发明过程、蔡伦改进造纸术及其对世界文明的贡献，并涉及传统节日活动交流和古代科技成就拓展。", "genre": "说明文", "why": "介绍造纸术发明过程及影响"}, {"title": "胡萝卜先生的长胡子", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 5, "unit": "第五单元", "page": 58, "n": 11, "parts": [{"from": 0, "to": 4, "gist": "胡萝卜先生漏刮的胡子沾了果酱后不断变长，他浑然不知。"}, {"from": 5, "to": 6, "gist": "小男孩剪了一段胡子用来放风筝。"}, {"from": 7, "to": 8, "gist": "鸟太太剪了一段胡子用来晾小鸟的尿布。"}, {"from": 9, "to": 10, "gist": "胡子不再疯长，课文以想象题结尾。"}], "main": "胡萝卜先生漏刮的胡子沾了果酱后不断变长，先后被小男孩和鸟太太剪去使用，最后不再疯长。", "genre": "童话寓言", "why": "胡萝卜拟人化，情节奇幻"}, {"title": "我变成了一棵树", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 5, "unit": "第五单元", "page": 61, "n": 28, "parts": [{"from": 0, "to": 3, "gist": "英英不想吃饭，希望变成树，真的变成了树。"}, {"from": 4, "to": 7, "gist": "树上长满各种形状的鸟窝，邀请小动物和朋友住进来。"}, {"from": 8, "to": 12, "gist": "妈妈来了不知道英英变了，爬上树分享食物给小动物。"}, {"from": 13, "to": 20, "gist": "英英肚子饿想念饭菜，口水滴下被误认为下雨。"}, {"from": 21, "to": 24, "gist": "妈妈识破秘密，英英感叹最了解她的是妈妈。"}, {"from": 25, "to": 27, "gist": "课后思考与练习活动。"}], "main": "英英变成树后长满鸟窝，妈妈来分享食物，最终识破秘密，展现了母爱的温暖。", "genre": "童话寓言", "why": "想象变成树，虚构故事"}, {"title": "童年的水墨画", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 6, "unit": "第六单元", "page": 70, "n": 9, "parts": [{"from": 0, "to": 2, "gist": "溪边垂柳如镜，孩子垂钓，忽然鱼儿蹦跳笑声。"}, {"from": 3, "to": 5, "gist": "江上孩子如鸭群戏水，拨浪溅水，钻入水中露银牙。"}, {"from": 6, "to": 8, "gist": "林中雨后松针雨珠，小蘑菇如斗笠，孩子欢叫抖落雨珠。"}], "main": "课文通过溪边、江上、林中三个场景，描绘了童年生活中钓鱼、戏水、林中玩耍的快乐画面。", "genre": "现代诗", "why": "分节押韵，意象丰富，语言凝练"}, {"title": "肥皂泡", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 6, "unit": "第六单元", "page": 72, "n": 8, "parts": [{"from": 0, "to": 2, "gist": "介绍吹肥皂泡的缘由及制作方法"}, {"from": 3, "to": 5, "gist": "描写肥皂泡的美丽形态并展开丰富想象"}, {"from": 6, "to": 7, "gist": "课文练习：理解难句并想象泡泡去处"}], "main": "本文回忆童年吹肥皂泡的经历，描写肥皂泡的美丽形态，展开丰富想象，表达快乐、骄傲与希望。", "genre": "散文", "why": "冰心回忆童年吹肥皂泡的经历与感受"}, {"title": "灰雀", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 6, "unit": "第六单元", "page": 75, "n": 15, "parts": [{"from": 0, "to": 1, "gist": "列宁在公园喜爱三只灰雀，一天发现深红胸脯的灰雀不见了。"}, {"from": 2, "to": 10, "gist": "列宁询问男孩灰雀下落，男孩犹豫后肯定地说灰雀会飞回来。"}, {"from": 11, "to": 14, "gist": "第二天灰雀果然回来了，列宁明白男孩是诚实的。"}], "main": "列宁在公园发现灰雀失踪，通过询问男孩，最终灰雀被送回，列宁感受到男孩的诚实。", "genre": "记事写人", "why": "叙述列宁与男孩的故事"}, {"title": "我不能失信", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 6, "unit": "第六单元", "page": 77, "n": 7, "parts": [{"from": 0, "to": 1, "gist": "宋庆龄高兴地准备去伯伯家做客，却在门口突然停住。"}, {"from": 2, "to": 3, "gist": "爸爸问原因，庆龄说昨天和小珍约好教她叠花篮。"}, {"from": 4, "to": 5, "gist": "爸爸劝她改天再教，庆龄坚决拒绝，不愿让小珍扑空。"}, {"from": 6, "to": 6, "gist": "爸爸建议事后去解释，文章以孔子名言点明守信主题。"}], "main": "宋庆龄为守约教小珍叠花篮，放弃去伯伯家做客，体现了她诚实守信的品质。", "genre": "记事写人", "why": "叙述宋庆龄守信的故事"}, {"title": "火烧云", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 7, "unit": "第七单元", "page": 84, "n": 8, "parts": [{"from": 0, "to": 2, "gist": "火烧云上来，霞光把地面万物照得变了颜色。"}, {"from": 3, "to": 6, "gist": "火烧云颜色变化极多，形状变化快，一会儿像马、狗、狮子。"}, {"from": 7, "to": 7, "gist": "火烧云变化恍惚，一会儿工夫就下去了。"}], "main": "火烧云上来后，霞光使地面万物变色，天空颜色形状变化极多，一会儿工夫就下去了。", "genre": "写景状物", "why": "描写火烧云的颜色与形状变化"}, {"title": "暴风雨来临之前", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 7, "unit": "第七单元", "page": 87, "n": 10, "parts": [{"from": 0, "to": 2, "gist": "乌云逼近，动物不安，万物沉寂，暴风雨前的压抑气氛"}, {"from": 3, "to": 4, "gist": "闪电划过，人们赶路，微风轻拂，暴风雨初临"}, {"from": 5, "to": 7, "gist": "大风过后又寂静，雷声震响，暴风雨正式到来"}, {"from": 8, "to": 9, "gist": "课后思考题，比较起风前后景象并联系生活"}], "main": "课文描写了暴风雨来临前乌云逼近、动物不安、微风、大风到雷声震响的连续景象变化。", "genre": "写景状物", "why": "描写暴风雨前自然景象"}, {"title": "我们奇妙的世界", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 7, "unit": "第七单元", "page": 89, "n": 17, "parts": [{"from": 0, "to": 0, "gist": "总起全文，点明世界奇妙、万物有生命。"}, {"from": 1, "to": 6, "gist": "描写天空从清晨到夜晚的奇妙景象。"}, {"from": 7, "to": 13, "gist": "描写大地四季中植物、水果等奇妙事物。"}, {"from": 14, "to": 16, "gist": "总结全文，强调仔细观察就能发现无穷奇妙。"}], "main": "本文通过描写天空和大地的奇妙景象，告诉我们只要仔细观察寻找，就能从普通事物中发现美，世界上奇妙的事物是无穷的。", "genre": "写景状物", "why": "描写自然景物之美"}, {"title": "慢性子裁缝和急性子顾客", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 8, "unit": "第八单元", "page": 96, "n": 32, "parts": [{"from": 0, "to": 5, "gist": "急性子顾客要求做棉袄，慢性子裁缝说明年冬天交货，顾客很不满。"}, {"from": 6, "to": 13, "gist": "裁缝说服顾客等到来年冬天穿棉袄最合适，做衣服的事说定了。"}, {"from": 14, "to": 17, "gist": "顾客次日改主意，要求把棉袄改成秋天穿的夹袄，裁缝答应。"}, {"from": 18, "to": 20, "gist": "顾客第三天又要求把夹袄改成夏天穿的短袖衬衫，裁缝答应。"}, {"from": 21, "to": 27, "gist": "顾客第四天要求改成春装，裁缝拒绝接袖子但承诺做漂亮春装。"}, {"from": 28, "to": 31, "gist": "裁缝揭示还没开始裁料，提醒自己是慢性子，故事以悬念结尾。"}], "main": "急性子顾客反复更改衣服要求，慢性子裁缝始终从容应对，最终揭示他还没开始裁料。", "genre": "记事写人", "why": "叙述裁缝与顾客的对话事件"}, {"title": "漏", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 8, "unit": "第八单元", "page": 100, "n": 23, "parts": [{"from": 0, "to": 1, "gist": "老公公老婆婆养着小胖驴，老虎想吃驴，贼想偷驴。"}, {"from": 2, "to": 4, "gist": "老虎和贼来偷驴，听到老婆婆说最怕漏。"}, {"from": 5, "to": 6, "gist": "老虎和贼都以为漏比自己更厉害，十分害怕。"}, {"from": 7, "to": 8, "gist": "贼跌到虎背上，双方都以为漏在捉自己。"}, {"from": 9, "to": 12, "gist": "老虎驮贼跑到歪脖老树，双方各自脱身。"}, {"from": 13, "to": 15, "gist": "雨大清醒后，老虎和贼都不甘心，各自回去。"}, {"from": 16, "to": 19, "gist": "二人再次相遇，都以为是漏，滚下山坡吓昏。"}, {"from": 20, "to": 22, "gist": "小胖驴安然无恙，老婆婆发现屋顶真的漏雨了。"}], "main": "老虎和贼都想得到小胖驴，却因误把漏当怪物而互相惊吓，最终滚下山坡吓昏，驴安然无恙。", "genre": "童话寓言", "why": "拟人化动物与贼的民间故事"}, {"title": "枣核", "book": "三年级下册", "grade": "三年级", "term": "下册", "unit_no": 8, "unit": "第八单元", "page": 104, "n": 2, "parts": [{"from": 0, "to": 0, "gist": "夫妻盼子，生了个枣核大的孩子，取名“枣核”。"}, {"from": 1, "to": 1, "gist": "枣核不见长，爹娘发愁，枣核安慰爹娘不用愁。"}], "main": "古时候一户人家生了个枣核大的孩子，取名“枣核”，他不见长，爹娘发愁，枣核安慰他们不用愁。", "genre": "童话寓言", "why": "民间故事，含奇幻情节"}, {"title": "观潮", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 1, "unit": "第一单元", "page": 2, "n": 10, "parts": [{"from": 0, "to": 1, "gist": "点明钱塘江大潮自古以来被称为天下奇观。"}, {"from": 2, "to": 3, "gist": "描写观潮前江面平静、人山人海等待潮来的场景。"}, {"from": 4, "to": 5, "gist": "描写潮来时从远处白线到近处水墙奔腾的壮观景象。"}, {"from": 6, "to": 7, "gist": "描写潮去后余波涌来及读后感受。"}, {"from": 8, "to": 9, "gist": "介绍钱塘江大潮壮观与特殊地形有关。"}], "main": "课文描写了钱塘江大潮的壮观景象，从潮来前、潮来时到潮去后，展现了天下奇观的雄伟气势。", "genre": "写景状物", "why": "描写钱塘江大潮的景色与声音"}, {"title": "繁星", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 1, "unit": "第一单元", "page": 5, "n": 6, "parts": [{"from": 0, "to": 1, "gist": "回忆家乡和南京看繁星的美好经历"}, {"from": 2, "to": 4, "gist": "如今在海上看繁星，感到如同在母亲怀抱中"}, {"from": 5, "to": 5, "gist": "朗读练习"}], "main": "作者回忆不同时期看繁星的美好经历，表达对繁星的喜爱和如母亲怀抱般的温馨感受。", "genre": "散文", "why": "选自散文集《海行杂记》"}, {"title": "现代诗二首", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 1, "unit": "第一单元", "page": 7, "n": 2, "parts": [{"from": 0, "to": 0, "gist": "倦鸟驮着斜阳归巢。"}, {"from": 1, "to": 1, "gist": "鸟儿翻翅将斜阳掉入江中，芦苇瞬间变红。"}], "main": "描写秋晚江上倦鸟归巢、斜阳映照芦苇的美丽景象。", "genre": "", "why": ""}, {"title": "夜间飞行的秘密", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 2, "unit": "第二单元", "page": 19, "n": 5, "parts": [{"from": 0, "to": 1, "gist": "飞机夜航引出问题，从蝙蝠说起"}, {"from": 2, "to": 3, "gist": "蝙蝠夜飞本领及与飞机夜航的关系"}, {"from": 4, "to": 4, "gist": "学生活动，提出自己的问题"}], "main": "课文通过飞机夜航引出蝙蝠夜飞的本领，探讨飞机夜航与蝙蝠的关系，并引导学生提出问题。", "genre": "说明文", "why": "介绍蝙蝠夜间飞行原理及雷达应用"}, {"title": "方帽子店", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 2, "unit": "第二单元", "page": 23, "n": 8, "parts": [{"from": 0, "to": 2, "gist": "帽子店只做方帽子，坚持方帽子才是好帽子，不能改。"}, {"from": 3, "to": 4, "gist": "方帽子戴着不舒服，孩子们质疑圆圆的头为什么戴方帽子。"}, {"from": 5, "to": 7, "gist": "课文提出阅读问题，引导学生思考并写下自己的问题。"}], "main": "方帽子店只做方帽子，方帽子戴着不舒服，孩子们开始质疑，课文引导学生思考并提出问题。", "genre": "童话寓言", "why": "虚构故事，含拟人化角色与寓意"}, {"title": "一个豆荚里的五粒豆", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 2, "unit": "第二单元", "page": 14, "n": 31, "parts": [{"from": 0, "to": 3, "gist": "五粒豌豆在豆荚里一起生长，觉得应该做点事情。"}, {"from": 4, "to": 8, "gist": "豆荚被摘下放入衣袋，豌豆们等待被打开。"}, {"from": 9, "to": 13, "gist": "豆荚裂开，五粒豌豆被射出，各有不同命运。"}, {"from": 14, "to": 23, "gist": "最后一粒豌豆落在窗下裂缝，帮助病弱女孩康复。"}, {"from": 24, "to": 26, "gist": "其余豌豆被鸽子吃掉或烂在水沟里。"}, {"from": 27, "to": 30, "gist": "女孩健康微笑，课堂提问与小组交流。"}], "main": "五粒豌豆各有不同命运，最后一粒落在窗下裂缝中发芽开花，帮助病弱女孩恢复健康。", "genre": "童话寓言", "why": "豌豆拟人化，会说话有思想"}, {"title": "爬山虎的脚", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 3, "unit": "第三单元", "page": 36, "n": 6, "parts": [{"from": 0, "to": 1, "gist": "介绍爬山虎的生长位置及叶子的颜色、形状和排列特点"}, {"from": 2, "to": 4, "gist": "描写爬山虎的脚的形状、攀爬方式及牢固程度"}, {"from": 5, "to": 5, "gist": "本课生字"}], "main": "本文介绍了爬山虎的生长位置、叶子的特点以及脚的形状和攀爬方式。", "genre": "写景状物", "why": "细致描写爬山虎的叶与脚"}, {"title": "蟋蟀的住宅", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 3, "unit": "第三单元", "page": 39, "n": 10, "parts": [{"from": 0, "to": 2, "gist": "蟋蟀因住宅而出名，它慎重选择住址，用柔弱工具挖掘住宅，令人惊奇。"}, {"from": 3, "to": 6, "gist": "作者观察蟋蟀住宅，描述其外部隧道、门口平台及内部光滑简朴的特点。"}, {"from": 7, "to": 9, "gist": "蟋蟀用前足、大颚和后足挖掘住宅，工作迅速且持续整修加深。"}], "main": "课文介绍了蟋蟀住宅的特点及其建造过程，展现了蟋蟀用柔弱工具建造伟大工程的勤劳与智慧。", "genre": "说明文", "why": "介绍蟋蟀住宅特点及建造过程"}, {"title": "盘古开天地", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 4, "unit": "第四单元", "page": 48, "n": 9, "parts": [{"from": 0, "to": 1, "gist": "盘古醒来劈开混沌，轻清上升为天，重浊下降为地。"}, {"from": 2, "to": 3, "gist": "盘古顶天立地，随天地变化而长高，最终精疲力竭倒下。"}, {"from": 4, "to": 8, "gist": "盘古身体化为万物，用整个身体创造了美丽的世界。"}], "main": "盘古从混沌中醒来劈开天地，顶天立地撑住天地，最后身体化为万物，创造了美丽的世界。", "genre": "神话传说", "why": "讲述盘古开天辟地的神话故事"}, {"title": "普罗米修斯", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 4, "unit": "第四单元", "page": 51, "n": 10, "parts": [{"from": 0, "to": 1, "gist": "普罗米修斯看到人类没有火的悲惨情景，从天上盗取火种带到人间。"}, {"from": 2, "to": 4, "gist": "宙斯下令惩罚普罗米修斯，火神劝他归还火种，他坚决拒绝。"}, {"from": 5, "to": 7, "gist": "普罗米修斯被锁在高加索山上，日夜遭受风吹雨淋和鹫鹰啄食肝脏的痛苦。"}, {"from": 8, "to": 9, "gist": "大力士赫拉克勒斯射死鹫鹰、砸碎锁链，普罗米修斯终于获得自由。"}], "main": "普罗米修斯为人类盗取火种，遭受宙斯严厉惩罚，最终被赫拉克勒斯解救获得自由。", "genre": "神话传说", "why": "讲述天神普罗米修斯盗火的神话故事"}, {"title": "女娲补天", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 4, "unit": "第四单元", "page": 54, "n": 7, "parts": [{"from": 0, "to": 2, "gist": "神话充满想象，女娲造人后天地突变，世界陷入混乱。"}, {"from": 3, "to": 5, "gist": "女娲决心补天，熔炼五色石补天、杀巨鳌撑天、杀黑龙、堵洪水。"}, {"from": 6, "to": 6, "gist": "天地恢复平静，人们世世代代怀念女娲。"}], "main": "女娲在天地突变、人类危难之际，熔炼五色石补天、杀巨鳌撑天、杀黑龙、堵洪水，拯救了人类。", "genre": "神话传说", "why": "课文自述为神话故事"}, {"title": "麻雀", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 5, "unit": "第五单元", "page": 62, "n": 10, "parts": [{"from": 0, "to": 2, "gist": "打猎归来，猎狗嗅到野物，风猛烈摇撼白桦树。"}, {"from": 3, "to": 4, "gist": "发现小麻雀从巢中掉落，猎狗逼近露出利齿。"}, {"from": 5, "to": 6, "gist": "老麻雀飞落保护幼儿，浑身发抖准备牺牲。"}, {"from": 7, "to": 9, "gist": "猎狗被勇气震慑后退，我唤回猎狗离开。"}], "main": "打猎途中，老麻雀为保护掉落的幼儿，勇敢飞落猎狗面前，猎狗被其勇气震慑后退。", "genre": "记事写人", "why": "叙述打猎遇麻雀事件，刻画老麻雀形象"}, {"title": "爬天都峰", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 5, "unit": "第五单元", "page": 65, "n": 15, "parts": [{"from": 0, "to": 1, "gist": "假日去黄山爬天都峰，\"我\"仰望峰顶感到畏惧。"}, {"from": 2, "to": 4, "gist": "\"我\"遇到一位老爷爷，互相鼓励决定一起爬。"}, {"from": 5, "to": 6, "gist": "\"我\"奋力攀爬，最终和老爷爷、爸爸一起登上峰顶。"}, {"from": 7, "to": 11, "gist": "峰顶互相感谢，爸爸点明从别人身上汲取力量的道理。"}, {"from": 12, "to": 14, "gist": "课文后的看图说话、写话练习及写作提示。"}], "main": "假日\"我\"和老爷爷互相鼓励爬上天都峰，明白从别人身上汲取力量的道理。", "genre": "记事写人", "why": "记叙爬天都峰经历，刻画人物"}, {"title": "长城", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 6, "unit": "第六单元", "page": 74, "n": 6, "parts": [{"from": 0, "to": 1, "gist": "远看长城如巨龙蜿蜒，近看其高大坚固、设施完备。"}, {"from": 2, "to": 3, "gist": "联想古代劳动人民用人力畜力修筑长城，耗费大量血汗和智慧。"}, {"from": 4, "to": 5, "gist": "长城是气魄雄伟的伟大奇迹。"}], "main": "课文描写了长城雄伟壮观的景象，赞颂了古代劳动人民的血汗和智慧，称其为世界历史上的伟大奇迹。", "genre": "说明文", "why": "介绍长城构造与历史"}, {"title": "颐和园", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 6, "unit": "第六单元", "page": 77, "n": 9, "parts": [{"from": 0, "to": 0, "gist": "总起，点明颐和园是美丽的大公园。"}, {"from": 1, "to": 1, "gist": "描写长廊的长、画多、花木繁茂。"}, {"from": 2, "to": 4, "gist": "描写万寿山脚下佛香阁、排云殿及山顶俯瞰景色。"}, {"from": 5, "to": 6, "gist": "描写昆明湖的堤岸、小岛和十七孔桥。"}, {"from": 7, "to": 8, "gist": "总结全文，表达希望读者去游赏的愿望。"}], "main": "本文按游览顺序描写了颐和园长廊、万寿山、昆明湖和十七孔桥的美丽景色，表达了作者对颐和园的喜爱之情。", "genre": "写景状物", "why": "按游览顺序描写颐和园景色"}, {"title": "秦兵马俑", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 6, "unit": "第六单元", "page": 80, "n": 11, "parts": [{"from": 0, "to": 0, "gist": "秦兵马俑出土，举世无双，是珍贵历史文物"}, {"from": 1, "to": 1, "gist": "兵马俑规模宏大，气势磅礴"}, {"from": 2, "to": 7, "gist": "兵马俑类型众多，包括将军俑、武士俑、骑兵俑和陶马"}, {"from": 8, "to": 8, "gist": "每个兵马俑神态各异，是精美的艺术珍品"}, {"from": 9, "to": 10, "gist": "秦兵马俑绝无仅有，被列入世界遗产名录"}], "main": "秦兵马俑规模宏大、类型众多、神态各异，是举世无双的珍贵历史文物。", "genre": "说明文", "why": "客观介绍兵马俑规模与类型"}, {"title": "牛和鹅", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 7, "unit": "第七单元", "page": 88, "n": 27, "parts": [{"from": 0, "to": 3, "gist": "大家相信牛怕人鹅不怕人的说法，对牛不怕、对鹅很怕"}, {"from": 4, "to": 10, "gist": "放学路上“我”被鹅追赶咬住，惊慌失措"}, {"from": 11, "to": 13, "gist": "金奎叔赶来把鹅甩进池塘，“我”挂着泪笑了"}, {"from": 14, "to": 18, "gist": "金奎叔安慰“我”并教导不要怕鹅"}, {"from": 19, "to": 23, "gist": "“我”记住金奎叔的话，不再怕鹅也不再欺负牛"}, {"from": 24, "to": 26, "gist": "总结鹅不可怕，以及批注和默读练习"}], "main": "“我”因相信鹅不怕人的说法而怕鹅，被鹅袭击后金奎叔救了我并教导不要怕鹅，从此我不再怕鹅也不再欺负牛。", "genre": "记事写人", "why": "以第一人称叙述童年经历"}, {"title": "一只窝囊的大老虎", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 7, "unit": "第七单元", "page": 93, "n": 28, "parts": [{"from": 0, "to": 2, "gist": "学校有文艺表演，\"我\"渴望上台，被分派扮演老虎。"}, {"from": 3, "to": 5, "gist": "介绍演出情节和老虎戏服的样子。"}, {"from": 6, "to": 11, "gist": "排练开始，老师指导\"我\"如何演老虎，\"我\"充满自信。"}, {"from": 12, "to": 16, "gist": "排练中困难重重，\"我\"发现演老虎并不简单，同学嘲笑\"我\"窝囊。"}, {"from": 17, "to": 20, "gist": "正式演出时\"我\"笨拙表演引发哄堂大笑，演完后同学建议\"我\"豁虎跳。"}, {"from": 21, "to": 22, "gist": "\"我\"发誓不再扮老虎，却疑惑为什么不会豁虎跳就不能扮老虎。"}, {"from": 23, "to": 27, "gist": "课后练习：分析心情变化、讨论演出是否窝囊、写类似经历。"}], "main": "\"我\"渴望上台表演，被分派扮演老虎，排练和演出都很窝囊，引发哄堂大笑，\"我\"至今不明白为什么不会豁虎跳就不能扮老虎。", "genre": "记事写人", "why": "第一人称叙述演出经历"}, {"title": "陀螺", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 7, "unit": "第七单元", "page": 98, "n": 16, "parts": [{"from": 0, "to": 1, "gist": "介绍故乡冰尜儿的制作材料和抽打玩法。"}, {"from": 2, "to": 3, "gist": "小伙伴们抽陀螺比高下，小陀螺常被嘲笑。"}, {"from": 4, "to": 5, "gist": "我削不出好陀螺很懊恼，叔叔答应送我一只。"}, {"from": 6, "to": 8, "gist": "收到叔叔送的陀螺，虽丑遭嘲笑但不敢挑战。"}, {"from": 9, "to": 11, "gist": "小陀螺顽强闪躲，最终击败大陀螺。"}, {"from": 12, "to": 15, "gist": "胜利带来极大欢乐，感悟人不可貌相的道理。"}], "main": "我收到叔叔送的丑陀螺，在小伙伴嘲笑中意外战胜大陀螺，体会到人不可貌相的道理。", "genre": "记事写人", "why": "以第一人称叙述童年玩陀螺经历"}, {"title": "我将无我，不负人民", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 8, "unit": "第八单元", "page": 108, "n": 10, "parts": [{"from": 0, "to": 4, "gist": "菲科提问习近平当选国家主席时的心情"}, {"from": 5, "to": 6, "gist": "习近平回答'我将无我，不负人民'"}, {"from": 7, "to": 8, "gist": "习近平用举重运动员比喻表达建设国家的自信"}, {"from": 9, "to": 9, "gist": "乱码段落"}], "main": "习近平主席会见意大利众议长菲科时，以'我将无我，不负人民'表达为国奉献的决心和自信。", "genre": "记事写人", "why": "记叙会见事件，刻画人物言行"}, {"title": "为中华之崛起而读书", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 8, "unit": "第八单元", "page": 110, "n": 17, "parts": [{"from": 0, "to": 7, "gist": "修身课上魏校长提问，少年周恩来坚定回答为中华之崛起而读书"}, {"from": 8, "to": 12, "gist": "介绍周恩来身世及伯父告知中华不振的背景"}, {"from": 13, "to": 15, "gist": "周恩来目睹外国人欺压中国人，真正体会中华不振"}, {"from": 16, "to": 16, "gist": "课文生字词"}], "main": "少年周恩来因目睹中华不振的屈辱，立志为中华之崛起而读书", "genre": "记事写人", "why": "叙述周恩来少年事迹"}, {"title": "延安，我把你追寻", "book": "四年级上册", "grade": "四年级", "term": "上册", "unit_no": 8, "unit": "第八单元", "page": 115, "n": 3, "parts": [{"from": 0, "to": 1, "gist": "以燕子和小树为喻，并列举延安具体事物，表达对延安的追寻。"}, {"from": 2, "to": 2, "gist": "描写今日繁荣景象，并提出朗读与思考的学习要求。"}], "main": "全诗通过比喻和具体事例表达对延安的追寻，并引导学生思考追寻的意义。", "genre": "现代诗", "why": "分行押韵，意象抒情"}, {"title": "探索科学的奥秘", "book": "四年级下册", "grade": "四年级", "term": "下册", "unit_no": null, "unit": null, "page": 33, "n": 7, "parts": [{"from": 0, "to": 1, "gist": "生活中的现象蕴藏科学奥秘，科普作品以生动方式激发探索兴趣。"}, {"from": 2, "to": 3, "gist": "举例科普作品片段，介绍我国科学家创作的科普作品。"}, {"from": 4, "to": 6, "gist": "建议阅读科普作品，运用方法理解术语并查阅新成果。"}], "main": "本单元引导学生在生活中发现科学奥秘，通过阅读科普作品感受科学魅力，并掌握阅读方法。", "genre": "说明文", "why": "介绍科普作品及阅读方法"}, {"title": "乡下人家", "book": "四年级下册", "grade": "四年级", "term": "下册", "unit_no": 1, "unit": "第一单元", "page": 4, "n": 10, "parts": [{"from": 0, "to": 2, "gist": "屋前屋后种瓜藤花草竹笋，构成独特农家风光"}, {"from": 3, "to": 4, "gist": "鸡鸭在房前屋后和小河旁自由活动"}, {"from": 5, "to": 6, "gist": "夏夜晚饭和秋夜纺织娘歌声绘成田园风景画"}, {"from": 7, "to": 7, "gist": "乡下人家不论何时何季都有独特迷人的风景"}, {"from": 8, "to": 9, "gist": "课后练习：给画取名并谈最感兴趣的景致"}], "main": "课文描写了乡下人家屋前屋后的植物、家禽、夏夜晚饭和秋夜虫鸣等景致，展现独特迷人的田园风光。", "genre": "写景状物", "why": "描写乡村景物风光"}, {"title": "天窗", "book": "四年级下册", "grade": "四年级", "term": "下册", "unit_no": 1, "unit": "第一单元", "page": 7, "n": 11, "parts": [{"from": 0, "to": 2, "gist": "乡下房子只有木板窗，雨天冬天关窗后屋内黑暗，于是屋顶开了天窗。"}, {"from": 3, "to": 5, "gist": "夏天阵雨时孩子们被关在屋里，小小的天窗是唯一的慰藉，使想象锐利起来。"}, {"from": 6, "to": 7, "gist": "晚上被逼上床休息时，天窗又是唯一慰藉，夜的美丽神奇在想象中展开。"}, {"from": 8, "to": 10, "gist": "发明天窗的大人们应得感谢，孩子们能从“无”中看出“有”，从“虚”中看出“实”。"}], "main": "课文通过描写夏天阵雨和夜晚两个场景中孩子们透过天窗展开想象，表达了天窗给孩子们带来慰藉和想象力的主题。", "genre": "散文", "why": "茅盾抒情散文，借物抒怀"}, {"title": "三月桃花水", "book": "四年级下册", "grade": "四年级", "term": "下册", "unit_no": 1, "unit": "第一单元", "page": 10, "n": 8, "parts": [{"from": 0, "to": 1, "gist": "以设问引出三月桃花水，描写河流苏醒、桃花洒落河面的景象。"}, {"from": 2, "to": 3, "gist": "三月桃花水是春天的竖琴，水声应和拖拉机、与麦苗谈心、碰石叮当。"}, {"from": 4, "to": 5, "gist": "三月桃花水是春天的明镜，映出燕子、垂柳和河边姑娘。"}, {"from": 6, "to": 7, "gist": "赞美三月桃花水令人沉醉，并附课文注释。"}], "main": "课文以设问开篇，将三月桃花水比作春天的竖琴和明镜，赞美其美妙动听、清澈明丽，令人沉醉。", "genre": "写景状物", "why": "描写春水美景，运用比喻拟人"}, {"title": "琥珀", "book": "四年级下册", "grade": "四年级", "term": "下册", "unit_no": 2, "unit": "第二单元", "page": 16, "n": 23, "parts": [{"from": 0, "to": 4, "gist": "几千万年前的夏日，一只小苍蝇在松树林中飞舞。"}, {"from": 5, "to": 6, "gist": "蜘蛛逼近苍蝇，松脂在烈日下渗出。"}, {"from": 7, "to": 11, "gist": "松脂滴落将苍蝇和蜘蛛包裹，积成松脂球。"}, {"from": 12, "to": 14, "gist": "陆地沉没，松脂球被埋泥沙下，历经千万年成化石。"}, {"from": 15, "to": 19, "gist": "渔民父子在海滩发现一块含有小虫的琥珀。"}, {"from": 20, "to": 22, "gist": "透过琥珀可推测远古故事，知道远古已有苍蝇和蜘蛛。"}], "main": "课文讲述一块含有苍蝇和蜘蛛的琥珀的形成过程及被发现的故事，由此推测远古时代的情形。", "genre": "说明文", "why": "以故事形式说明琥珀形成过程"}, {"title": "飞向蓝天的恐龙", "book": "四年级下册", "grade": "四年级", "term": "下册", "unit_no": 2, "unit": "第二单元", "page": 20, "n"
