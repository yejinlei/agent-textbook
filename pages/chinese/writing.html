故事中，感悟生活的真谛和做人的道理。灰姑娘虽然身处逆境，却仍然心怀美好，真诚待人；小裁缝勇敢乐观，用自己的智慧战胜巨人……", "我们可以把自己想象成童话中的主人公，和故事中的人物一起欢笑，一起悲伤。", "绘童话，这个奇妙的王国，等待着你去漫游，去发现。", "童话世界无奇不有。阅读时，充分发挥想象，能更好地领略童话的魅力。", "生活中不缺少美，只是缺少发现美的眼睛。", "—— [法国] 罗丹第五单元◎  体会作者是怎样留心观察周围事物的。", "◎  仔细观察，把观察所得写下来。"], "tasks": [], "newchars": [], "notes": [], "kb": {"stage": "3-4", "standard": {"chars": "【识字与写字】主动识字、有独立识字能力；书写规范、端正、整洁", "read": "【阅读】用普通话正确、流利、有感情地朗读课文", "recite": "【阅读】诵读优秀诗文，体验情感、展开想象，领悟诗文大意", "words": "【阅读】联系上下文和生活积累，理解词句的意思", "parts": "【阅读】初步把握文章的内容，复述叙事性作品的大意", "idea": "【阅读】体会文章表达的思想感情", "sentences": "【阅读·第二学段起】体会课文中关键词句表达情意的作用", "questions": "【阅读】对课文中不理解的地方提出疑问；敢于提出看法、作出判断", "notes": "【阅读】感受作品中生动的形象和优美的语言（第二学段）；简单描述印象最深的场景、人物、细节（第三学段）", "background": "【阅读】借助作者、出处与背景资料理解课文（第三学段：能借助相关资料理解含义深刻的句子）", "center": "【阅读】体会文章表达的思想感情；说出对人物与事件的感受", "exam": "【学业质量】识字写字、阅读与表达的学段学业质量要求", "traps": "【识字与写字】读准字音、认清字形；第三学段：辨别词语的感情色彩、体会标点用法", "accumulate": "【阅读】积累课文中的优美词语、精彩句段（第二学段起）", "transfer": "【表达】【习作】不拘形式写下见闻与感受，把印象最深的内容写清楚", "extend": "【拓展】课外阅读与跨学科学习（课标：整本书阅读、跨学科学习）"}, "words": [{"w": "妙不可言", "mean": "奇妙得无法用语言形容。"}, {"w": "拇指姑娘", "mean": "安徒生童话里一个只有拇指大的小女孩。"}, {"w": "历经磨难", "mean": "经历了很多艰难困苦。"}, {"w": "难以磨灭", "mean": "很难被忘记或消除。"}, {"w": "温暖", "mean": "暖和；也指让人感到亲切。"}, {"w": "身处逆境", "mean": "处在困难、不顺利的环境中。"}, {"w": "妙趣横生", "mean": "充满美妙的趣味。"}, {"w": "真谛", "mean": "真实的意义、道理。"}], "sentences": [{"src": "在那里，一切都有可能发生，一切都妙不可言。", "why": "眼前像打开一扇任意门，什么奇妙的事都能发生。"}, {"src": "她坐在鸟儿的背上，把脚搁在他展开的双翼上，同时用腰带把自己紧紧地系在他最结实的一根羽毛上。", "why": "画面里拇指姑娘很小，燕子很大，动作又小心又可爱。"}, {"src": "在寒冷的高空中，拇指姑娘冻得发起抖来。于是她就钻到鸟儿温暖的羽毛下面，只把她的小脑袋伸出来欣赏下面那些美丽的景致。", "why": "又冷又暖，又小又勇敢，让人心疼又觉得她真了不起。"}], "notes": [{"para": 0, "kind": "段意", "tags": ["排比"], "text": "这一段在说童话王国里有哪些熟悉的故事，读时把四个故事连起来。"}, {"para": 1, "kind": "段意", "tags": ["排比"], "text": "介绍安徒生和他的童话，想想这些主人公给你留下什么印象。"}, {"para": 2, "kind": "字词", "tags": ["动作描写"], "text": "看拇指姑娘怎么坐、怎么系、怎么钻，动作里藏着她的勇敢。"}, {"para": 3, "kind": "段意", "tags": ["环境描写"], "text": "这一段写温暖国度的景色，读时想象阳光、葡萄、柠檬的样子。"}, {"para": 4, "kind": "提问", "tags": ["想  "读寓言，先要读懂故事内容，再体会故事中的道理。", "看，花儿在悄悄绽放；听，虫儿在窃窃私语……自然界如此奇妙，留心观察，会有新的发现。", "观察自然，探索世界。", "◎  借助关键语句概括一段话的大意。", "◎  做个小实验，把实验过程写清楚。"], "tasks": [], "newchars": ["第三单元"], "notes": [], "kb": {"stage": "3-4", "standard": {"chars": "【识字与写字】主动识字、有独立识字能力；书写规范、端正、整洁", "read": "【阅读】用普通话正确、流利、有感情地朗读课文", "recite": "【阅读】诵读优秀诗文，体验情感、展开想象，领悟诗文大意", "words": "【阅读】联系上下文和生活积累，理解词句的意思", "parts": "【阅读】初步把握文章的内容，复述叙事性作品的大意", "idea": "【阅读】体会文章表达的思想感情", "sentences": "【阅读·第二学段起】体会课文中关键词句表达情意的作用", "questions": "【阅读】对课文中不理解的地方提出疑问；敢于提出看法、作出判断", "notes": "【阅读】感受作品中生动的形象和优美的语言（第二学段）；简单描述印象最深的场景、人物、细节（第三学段）", "background": "【阅读】借助作者、出处与背景资料理解课文（第三学段：能借助相关资料理解含义深刻的句子）", "center": "【阅读】体会文章表达的思想感情；说出对人物与事件的感受", "exam": "【学业质量】识字写字、阅读与表达的学段学业质量要求", "traps": "【识字与写字】读准字音、认清字形；第三学段：辨别词语的感情色彩、体会标点用法", "accumulate": "【阅读】积累课文中的优美词语、精彩句段（第二学段起）", "transfer": "【表达】【习作】不拘形式写下见闻与感受，把印象最深的内容写清楚", "extend": "【拓展】课外阅读与跨学科学习（课标：整本书阅读、跨学科学习）"}, "words": [{"w": "凝结", "mean": "聚集、凝聚在一起，这里指智慧积累下来。"}, {"w": "发人深省", "mean": "让人深深思考，有所领悟。"}, {"w": "张牙舞爪", "mean": "形容凶恶的样子，这里写龙的样子。"}, {"w": "霎时间", "mean": "极短的时间，一转眼。"}, {"w": "乌云滚滚", "mean": "乌云像滚动一样聚集过来。"}, {"w": "雷电交加", "mean": "闪电和雷声同时出现。"}, {"w": "似曾相识", "mean": "好像以前见过，有熟悉的感觉。"}, {"w": "历久弥新", "mean": "经历时间越久，越显出新的价值。"}], "sentences": [{"src": "寓言是一个魔袋，袋子很小，却能从里面取出很多东西来。", "why": "眼前像有个小袋子，打开却装满了道理。"}, {"src": "叶公见了真龙，吓得脸色发白，浑身发抖，连忙跑走了。", "why": "画面里叶公吓得脸白发抖，一下子跑开。"}, {"src": "原来他喜欢的不是真龙。", "why": "心里一怔：原来他喜欢的只是画上的龙。"}], "notes": [{"para": 0, "kind": "段意", "tags": ["比喻"], "text": "这一段说寓言短小却道理多，像魔袋。"}, {"para": 1, "kind": "段意", "tags": [], "text": "这一段介绍中国古代寓言，问：你明白什么道理？"}, {"para": 2, "kind": "段意", "tags": ["细节描写"], "text": "这一段写叶公处处画龙、绣龙、雕龙。"}, {"para": 3, "kind": "段意", "tags": ["环境描写"], "text": "这一段写龙的样子，像云雾里飞翔。"}, {"para": 4, "kind": "段意", "tags": ["环境描写"], "text": "这一段写真龙到来，天气突然变化。"}, {"para": 5, "kind": "段意", "tags": ["神态描写"], "text": "这一段写叶公害怕逃跑，点出他喜欢的是假龙。"}], "background": "叶公好龙出自《新序·杂事》，是古代寓言，讲叶公表面爱龙，真龙来了却害怕。", "center": {"idea": "寓言短小，却藏着深刻道理。", "virtue": 怎么会是猫呢？”尾巴说，“我这只猫特别乖，我天天骑着它满地跑。”", "尾巴上的跳蚤听见它的话，哈哈大笑：“如果你有一只猫，那你为什么还跟着它到处跑？是猫有你这条尾巴，而不是你这条尾巴有一只猫。”", "尾巴坚持自己的想法：“我就是有一只猫。我跟着它跑是因为我乐意。你看看小孩子，个个当爸爸妈妈的小尾巴，跟着他们跑。难道只能是爸爸妈妈有小孩子，不能是小孩子有爸爸妈妈吗？猫可以有一条尾巴，为什么尾巴就不能有一只猫？”", "另一条尾巴听到了，高兴地说：“哎呀，原来我有一只狗哇，真好！”原来，它是一条狗的尾巴。", "狗生气了吗？没有，因为它也听见了猫尾巴的话。它跟在主人的身后，高兴地想：“对呀，原来我有一个人，真神奇！”", "像这样反方向去想象，尾巴就能有一只猫了。真有意思！", "“尾巴它有一只猫”“喜欢睡觉的风”……你还想到了什么新鲜有趣的说法？展开想象说一说。", "品味多彩童年，感受美好的童心。", "◎  运用多种方法理解难懂的句子。", "◎  写一个身边的人，尝试写出这个人的特点。", "在童年的百花园里，我们看到了真善美。"], "tasks": [], "newchars": ["第六单元"], "notes": [], "kb": {"stage": "3-4", "standard": {"chars": "【识字与写字】主动识字、有独立识字能力；书写规范、端正、整洁", "read": "【阅读】用普通话正确、流利、有感情地朗读课文", "recite": "【阅读】诵读优秀诗文，体验情感、展开想象，领悟诗文大意", "words": "【阅读】联系上下文和生活积累，理解词句的意思", "parts": "【阅读】初步把握文章的内容，复述叙事性作品的大意", "idea": "【阅读】体会文章表达的思想感情", "sentences": "【阅读·第二学段起】体会课文中关键词句表达情意的作用", "questions": "【阅读】对课文中不理解的地方提出疑问；敢于提出看法、作出判断", "notes": "【阅读】感受作品中生动的形象和优美的语言（第二学段）；简单描述印象最深的场景、人物、细节（第三学段）", "background": "【阅读】借助作者、出处与背景资料理解课文（第三学段：能借助相关资料理解含义深刻的句子）", "center": "【阅读】体会文章表达的思想感情；说出对人物与事件的感受", "exam": "【学业质量】识字写字、阅读与表达的学段学业质量要求", "traps": "【识字与写字】读准字音、认清字形；第三学段：辨别词语的感情色彩、体会标点用法", "accumulate": "【阅读】积累课文中的优美词语、精彩句段（第二学段起）", "transfer": "【表达】【习作】不拘形式写下见闻与感受，把印象最深的内容写清楚", "extend": "【拓展】课外阅读与跨学科学习（课标：整本书阅读、跨学科学习）"}, "words": [{"w": "自豪", "mean": "因为自己有某样东西或本领而感到骄傲。"}, {"w": "得意", "mean": "因为自己厉害或占了便宜而高兴。"}, {"w": "坚持", "mean": "一直不放弃自己的想法。"}, {"w": "跳蚤", "mean": "一种会跳的小虫子，常寄生在动物身上。"}, {"w": "撑竿", "mean": "撑杆跳高时用来撑地起跳的长杆。"}, {"w": "标枪", "mean": "田径比赛中投掷的长矛状器械。"}, {"w": "稿纸", "mean": "写文章用的、印好格子的纸。"}, {"w": "童话", "mean": "讲给小孩子听的、有想象的故事。"}], "sentences": [{"src": "猫有尾巴，尾巴怎么能有一只猫呢？", "why": "读到这句，觉得想法反过来了，有点好笑又新鲜。"}, {"src": "我天天骑着它满地跑。", "why": "眼前出现尾巴骑在跳蚤身上到处跑的画面，很滑稽。"}, {"src": "难道只能是爸爸妈妈有小孩子，不能是小孩子有爸爸妈妈吗？", "why": "心里一动：原来关系可以反过来想，真有意思。"}], "notes": [{"para": 0, "kind": "段意", "tags": ["想象"], "text": "铅笔的第四个梦想：为鸟当船篙，为蚂蚁当木筏。"}, {"para": 1, "kind": "段意", "tags": ["想象"], "text": "铅笔的第五个梦想：为小松鼠当撑竿，为小猴子当标枪。"}, {"para": 2, "kind": "段意", "tags": ["想象 ate": [{"t": "我发现“鸟窝”也可以叫“鸟巢”。", "why": "写观察发现时可以用。"}], "extend": {"life": "观察一种小动物，记录它的家叫什么。", "links": ["读一读《昆虫记》里的动物窝巢", "看看家里有没有养小动物，观察它们的窝"]}, "transfer": "观察一种小动物，说说它的家叫什么，比如蚂蚁窝、兔窝。"}}, {"id": "5cd7e623-5c38-4602-871a-3fba8a551db2:028", "grade": "四年级", "term": "上册", "no": 28, "book": "四年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "过一天", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 56, "chars": 245, "paras": ["我和我们读过很多故事，里面的人物各有特点：有的本领高强、爱憎分明，如哪吒、葫芦娃；有的机智聪明、惩恶扬善，如神笔马良；有的美丽纯洁、温柔善良，如白雪公主。你了解他们吗？喜欢他们吗？你还喜欢哪些人物呢？", "如果有机会和他们中的某一位一起度过一天，你会选择谁？你们会去哪里？会做些什么？会发生什么故事呢？", "把自己的想法和小组同学说一说，再写下来。写完后，听听同学的意见，认真修改，工整地誊写下来，还可以在适当的地方插入自己绘制的图片。", "习  作我想跟你去龙宫看看。", "我想和你去打妖怪。", "跟我去参加运动会吧。"], "tasks": [], "newchars": [], "notes": [], "kb": {"stage": "3-4", "standard": {"chars": "【识字与写字】主动识字、有独立识字能力；书写规范、端正、整洁", "read": "【阅读】用普通话正确、流利、有感情地朗读课文", "recite": "【阅读】诵读优秀诗文，体验情感、展开想象，领悟诗文大意", "words": "【阅读】联系上下文和生活积累，理解词句的意思", "parts": "【阅读】初步把握文章的内容，复述叙事性作品的大意", "idea": "【阅读】体会文章表达的思想感情", "sentences": "【阅读·第二学段起】体会课文中关键词句表达情意的作用", "questions": "【阅读】对课文中不理解的地方提出疑问；敢于提出看法、作出判断", "notes": "【阅读】感受作品中生动的形象和优美的语言（第二学段）；简单描述印象最深的场景、人物、细节（第三学段）", "background": "【阅读】借助作者、出处与背景资料理解课文（第三学段：能借助相关资料理解含义深刻的句子）", "center": "【阅读】体会文章表达的思想感情；说出对人物与事件的感受", "exam": "【学业质量】识字写字、阅读与表达的学段学业质量要求", "traps": "【识字与写字】读准字音、认清字形；第三学段：辨别词语的感情色彩、体会标点用法", "accumulate": "【阅读】积累课文中的优美词语、精彩句段（第二学段起）", "transfer": "【表达】【习作】不拘形式写下见闻与感受，把印象最深的内容写清楚", "extend": "【拓展】课外阅读与跨学科学习（课标：整本书阅读、跨学科学习）"}, "words": [{"w": "本领高强", "mean": "本事很大，很厉害。"}, {"w": "爱憎分明", "mean": "喜欢什么、讨厌什么，态度很清楚。"}, {"w": "惩恶扬善", "mean": "惩罚坏人坏事，表扬好人好事。"}, {"w": "机智聪明", "mean": "脑子灵活，办法多。"}, {"w": "温柔善良", "mean": "对人很和气，心地好。"}, {"w": "誊写", "mean": "把写好的字工整地再抄一遍。"}, {"w": "适当", "mean": "合适、恰当的地方。"}], "sentences": [{"src": "如果有机会和他们中的某一位一起度过一天，你会选择谁？", "why": "读到这句，心里会冒出想选谁、想干什么的画面。"}, {"src": "你们会去哪里？会做些什么？会发生什么故事呢？", "why": "一连串问题，像在心里放电影，越想越兴奋。"}, {"src": "写完后，听听同学的意见，认真修改，工整地誊写下来，还可以在适当的地方插入自己绘制的图片。", 此，神农又被称为医药之神。相传我国第一部药学著作《本草经》就是神农所作。", "我们的祖先对世界的许多问题都抱有强烈的好奇心，如，世界是如何起源的，人类是怎样产生的，他们尝试着用神话的方式给出解释，塑造了许多神和英雄，依靠口头讲述使其代代相传。", "神农尝百草是我国著名的神话，展现了先人的开拓精神。让我们阅读更多的中国神话，感受神话永恒的魅力。", "相信你可以读更多世界各地也流传着多姿多彩的神话传说。在这些充满想象的故事中，有许多鲜明的人物形象：古希腊神话中勇敢的大力士赫拉克勒斯，用音乐征服草木万物的俄耳甫斯；永远挂着迷人微笑的北欧光明之神巴德尔，爱恶作剧的火神洛基；还有敢捉弄北风的美洲辛格比……这些人物形象至今仍然熠熠生辉。", "世界神话传说中藏着无穷无尽的奥秘，你读得越多，收获就越多，赶快开始吧！", "远古时候，人们认为神话是真实而神圣的，一定要在严肃的仪式上郑重地讲出来。", "神话通常气魄宏大，读的时候要发挥想象，感受其中的神奇，读后可以与他人交流自己的阅读感受。", "我手写我心，彩笔绘生活。", "第五单元◎ 了解作者是怎样把事情写清楚的。", "◎ 写一件事，把事情写清楚。"], "tasks": [], "newchars": [], "notes": [], "kb": {"stage": "3-4", "standard": {"chars": "【识字与写字】主动识字、有独立识字能力；书写规范、端正、整洁", "read": "【阅读】用普通话正确、流利、有感情地朗读课文", "recite": "【阅读】诵读优秀诗文，体验情感、展开想象，领悟诗文大意", "words": "【阅读】联系上下文和生活积累，理解词句的意思", "parts": "【阅读】初步把握文章的内容，复述叙事性作品的大意", "idea": "【阅读】体会文章表达的思想感情", "sentences": "【阅读·第二学段起】体会课文中关键词句表达情意的作用", "questions": "【阅读】对课文中不理解的地方提出疑问；敢于提出看法、作出判断", "notes": "【阅读】感受作品中生动的形象和优美的语言（第二学段）；简单描述印象最深的场景、人物、细节（第三学段）", "background": "【阅读】借助作者、出处与背景资料理解课文（第三学段：能借助相关资料理解含义深刻的句子）", "center": "【阅读】体会文章表达的思想感情；说出对人物与事件的感受", "exam": "【学业质量】识字写字、阅读与表达的学段学业质量要求", "traps": "【识字与写字】读准字音、认清字形；第三学段：辨别词语的感情色彩、体会标点用法", "accumulate": "【阅读】积累课文中的优美词语、精彩句段（第二学段起）", "transfer": "【表达】【习作】不拘形式写下见闻与感受，把印象最深的内容写清楚", "extend": "【拓展】课外阅读与跨学科学习（课标：整本书阅读、跨学科学习）"}, "words": [{"w": "据说", "mean": "表示根据别人说的，不是亲眼所见。"}, {"w": "药性", "mean": "植物能治病或有害的性质。"}, {"w": "神性", "mean": "神话里神所具有的超自然本领。"}, {"w": "开拓精神", "mean": "敢于探索、不怕困难去开辟新路的劲头。"}, {"w": "熠熠生辉", "mean": "形容光彩闪耀、非常耀眼。"}, {"w": "气魄宏大", "mean": "气势很大、场面很壮观。"}, {"w": "郑重", "mean": "严肃认真、不随便。"}, {"w": "塑造", "mean": "创造、做出（形象、人物）。"}], "sentences": [{"src": "他试吃的植物太多了，经常中毒，最多的时候，一天之内中毒竟达七十次。", "why": "读到这句，眼前出现神农一次次中毒又爬起来的样子，心里又佩服又心疼。"}, {"src": "无论什么植物，只要用这根鞭子一抽，立刻就能够显示出它的药性。", "why": "读到这句，眼前出现红鞭一抽、植物立刻显出颜色的神奇画面。"}, {"src": "在这些充满想象的故事中，有许多鲜明的人物形象", "why": "读到这句，心里像打开一扇窗，看见世界各地神话人物一个个走出来。"}], "notes": [{"para": 0, "kind": "段意", "tags": ["细节描写"], "text": "这一段讲神农尝百草、试药救人的故事，看神农有多勇敢。"}, {"para": 1, "kind": "段意", "tags": ["想象 author": null, "dynasty": null, "page": 71, "chars": 911, "paras": ["每当我看见珍藏在抽屉里的那只精致的小木船，就想起陈明来。", "上小学一年级的时候，陈明和我是同班同学。", "我们两家离得很近。每天我们一起上学，回家，一起温习功课。我们成了形影不离的好朋友，一直到四年级。", "有一天，发生了一件不愉快的事。我们俩温习完功课，把自己在舰模小组做的小木船拿出来玩。", "我见他那只做得很精致，就拿在手上，翻过来掉过去地看，总舍不得放下。不料我一失手，啪的一声，小木船掉在地上，摔坏了。他一看，急了，哭着要我赔。我上前分辩说：“我不是故意的。”他生气地说：“谁叫你不小心，非赔不可！”还用力推了我一下。我往后一退，正好一脚踩在小木船上，把它踩碎了。这一下，陈明更生气了。他拿起我的小木船，使劲摔在地上，用脚踩了两下，一把抓起书包，头也不回地走了。看着被他踩坏的小木船，我也气得说不出话来。我们的友谊从此破裂了。", "事情是围绕“小木船”来写的。", "简单介绍陈明和“我”是好朋友。", "友谊破裂的过程写得很清楚。", "转眼几个月过去了。有一天放学回家，我走在前面，陈明走在后面。我偷偷地回头看了他一眼，他右手插在裤兜里，裤兜胀得鼓鼓的，不知手里攥着什么。忽然，他几步追上了我，从裤兜里掏出一只精致的小木船来。我惊讶地望着他。他满脸通红，激动地说：“那次是我不好，不该弄坏你的船。明天我家就要搬走了，我做了这只船送给你，留个纪念吧！”说着，他把小木船塞到我手里。想想那天发生的事，本来是我的错，望着他那双热情的眼睛，我一句话也说不出来，只是紧紧地握住他的手。", "陈明跟着爸爸妈妈搬到外地去了。从那以后，我们俩再也没有见过面。我把他送给我的小木船珍藏在抽屉里。一看见这只精致的小木船，我就好像看见陈明站在我的面前。", "“我”和陈明的矛盾持续了很长一段时间，课文只用“转眼几个月过去了”一句话加以交代，你认为这样写有没有把事情写清楚？"], "tasks": [], "newchars": [], "notes": ["① 本文选自人民教育出版社 《全日制十年制学校小学课本 （试用本）语文第七册》，有改动。"], "kb": {"stage": "3-4", "standard": {"chars": "【识字与写字】主动识字、有独立识字能力；书写规范、端正、整洁", "read": "【阅读】用普通话正确、流利、有感情地朗读课文", "recite": "【阅读】诵读优秀诗文，体验情感、展开想象，领悟诗文大意", "words": "【阅读】联系上下文和生活积累，理解词句的意思", "parts": "【阅读】初步把握文章的内容，复述叙事性作品的大意", "idea": "【阅读】体会文章表达的思想感情", "sentences": "【阅读·第二学段起】体会课文中关键词句表达情意的作用", "questions": "【阅读】对课文中不理解的地方提出疑问；敢于提出看法、作出判断", "notes": "【阅读】感受作品中生动的形象和优美的语言（第二学段）；简单描述印象最深的场景、人物、细节（第三学段）", "background": "【阅读】借助作者、出处与背景资料理解课文（第三学段：能借助相关资料理解含义深刻的句子）", "center": "【阅读】体会文章表达的思想感情；说出对人物与事件的感受", "exam": "【学业质量】识字写字、阅读与表达的学段学业质量要求", "traps": "【识字与写字】读准字音、认清字形；第三学段：辨别词语的感情色彩、体会标点用法", "accumulate": "【阅读】积累课文中的优美词语、精彩句段（第二学段起）", "transfer": "【表达】【习作】不拘形式写下见闻与感受，把印象最深的内容写清楚", "extend": "【拓展】课外阅读与跨学科学习（课标：整本书阅读、跨学科学习）"}, "words": [{"w": "形影不离", "mean": "像影子跟着身体一样，形容关系非常亲密。"}, {"w": "分辩", "mean": "说明理由，为自己辩解。"}, {"w": "破裂", "mean": "关系断绝，不再和好。"}, {"w": "攥", "mean": "用手紧紧握住。"}, {"w": "珍藏", "mean": "珍重地收藏起来。"}, {"w": "精致", "mean": "做工精细，样子好看。"}, {"w": "形影不离", "mean": "像影子跟着身体一样，形容关系非常亲密。"}, {"w": "形影不离", "mean": "像影子跟着身体一样，形容关系非常亲密。"}], "sentences": [{"src": "不料我一失手，啪的一声，小木船掉在地上，摔坏了。", "why": "听到啪的一声，眼前像看到小木船摔碎的样子。"}, {"src": "他满脸通红，激动地说：那次是我不好，不该弄坏你的船。", "why": "看到陈明脸红，心里觉得他不好意思又真诚。"}, {"src": "我一句话也说不出来，只是紧紧地握住他的手。", "why": "心里感动，说不出话，只想握住他的手。"}], "notes": [{"para": 0, "kind": "段意", "tags": ["细节描写"], "text": "开头点出小木船，引出对陈明的回忆。"}, {"para": 1, "kind": "段意", "tags": ["细节描写"], "text": "介绍陈明和我是好朋友，一起上学、回家、温习功课。"}, {"para": 2, "kind": "段意", "tags": ["动作描写", "语言描写"], "text": "写小木船摔坏、争吵、友谊破裂的过程。"}, {"para": 3, "kind": "段意", "tags": ["动作描写", "语言描写"], "text": "陈明送小木船道歉，我们重新和好。"}, {"para": 4, "kind": "段意", "tags": ["心理描写"], "text": "陈明搬走，我珍藏小木船，想起他。"}], "center": {"idea": "通过小木船的故事，写我和陈明从闹别扭到和好的过程。", "virtue": "做错事要勇于承认，朋友之间要互相谅解。"}, "exam": [{"point": "词语理解", "how": "从上下文猜形影不离、珍藏等词的意思。"}, {"point": "段落大意", "how": "按事情发展顺序概括每段写了什么。"}, {"point": "人物品质", "how": "从陈明送小木船、道歉看出他知错就改。"}, {"point": "句子理解", "how": "抓住动作、语言描写体会人物心情。"}], "traps": [{"type": "字音", "text": "模在舰模小组读mó，不读mú。"}, {"type": "字形", "text": "塞是sāi，不是sài。"}, {"type": "多音字", "text": "着在翻过来掉过去地看读zhe。"}, {"type": "形近字", "text": "攥和攒不同，攥是用手握。"}, {"type": "词语搭配", "text": "珍藏搭配小木船，不搭配珍藏朋友。"}], "accumulate": [{"t": "形影不离", "why": "写好朋友关系亲密。"}, {"t": "珍藏", "why": "写珍惜重要的东西。"}, {"t": "精致", "why": "写东西做得好看。"}], "extend": {"life": "和好朋友闹别扭后，想想怎么主动和好。", "links": ["读《友谊》相关文章", "写一写你和好朋友的故事"]}, "transfer": "写一段你和好朋友闹别扭后和好的事，写清谁先道歉、怎么和好的。"}}, {"id": "5cd7e623-5c38-4602-871a-3fba8a551db2:040", "grade": "四年级", "term": "上册", "no": 40, "book": "四年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "我是小小讲解员", "section": "口语交际", "domain": "writing", "genre": "口语交际", "author": null, "dynasty": null, "page": 82, "chars": 401, "paras": ["这段时间，我们对中国的世界文化遗产进行了深入的了解，有了很多收获。现在，假设你在一个展览上担任讲解员，要为大家介绍一项中国的世界文化遗产，应该怎么做呢？", "讲解前，需要对前期收集的相关资料进行整理，确定要讲的内容。怎样整理资料呢？"], "tasks": [], "newchars": [], "notes": [], "kb": {"stage": "3-4", "standard": {"chars": "【识字与写字】主动识字、有独立识字能力；书写规范、端正、整洁", "read": "【阅读】用普通话正确、流利、有感情地朗读课文", "recite": "【阅读】诵读优秀诗文，体验情感、展开想象，领悟诗文大意", "words": "【阅读】联系上下文和生 龙王的女儿。", "乞  巧[唐] 林杰七夕今宵看碧霄，牵牛织女渡河桥。", "家家乞巧望秋月，穿尽红丝几万条。", "日积月累仿照下面的例子，把牛郎织女初次见面的情节说得更具体。", "一只狼看见小羊在溪边饮水，想找借口把他吃掉。狼指责小羊把水弄脏了，小羊说自己在下游，不可能弄脏上游的水。狼又说小羊去年骂过他，小羊说那时自己还没有出生。狼恼羞成怒地说：“即使你辩解得再好，我也不会放过你。”于是，他就把小羊吃了。", "狼来到小溪边，看见小羊在那儿喝水。狼非常想吃小羊，就故意找碴儿，说：“你把我喝的水弄脏了！你安的什么心？” 小羊吃了一惊，温和地说：“我怎么会把您喝的水弄脏呢？您站在上游，水是从您那儿流到我这儿来的，不是从我这儿流到您那儿去的。” 狼气冲冲地说：“就算这样吧，你也还是个坏家伙！我听说，去年你在背地里说我的坏话！” 可怜的小羊喊道：“啊，亲爱的狼先生，那是不可能的，去年我还没有出生啊！”狼不想再争辩了，龇着牙，逼近小羊，大声嚷道：“你这个坏蛋！说我坏话的不是你，就是你爸爸，反正都一样。”说着就往小羊身上扑去，吃掉了小羊。"], "tasks": [], "newchars": [], "notes": [], "kb": {"stage": "5-6", "standard": {"chars": "【识字与写字】主动识字、有独立识字能力；书写规范、端正、整洁", "read": "【阅读】用普通话正确、流利、有感情地朗读课文", "recite": "【阅读】诵读优秀诗文，体验情感、展开想象，领悟诗文大意", "words": "【阅读】联系上下文和生活积累，理解词句的意思", "parts": "【阅读】初步把握文章的内容，复述叙事性作品的大意", "idea": "【阅读】体会文章表达的思想感情", "sentences": "【阅读·第二学段起】体会课文中关键词句表达情意的作用", "methods": "【阅读·第三学段】了解表达顺序，初步领悟基本的表达方法（课标要求随文学习，不做系统讲授与死记硬背）", "questions": "【阅读】对课文中不理解的地方提出疑问；敢于提出看法、作出判断", "polyphone": "【识字与写字】读准字音，分辨多音字在不同语境中的读法", "notes": "【阅读】感受作品中生动的形象和优美的语言（第二学段）；简单描述印象最深的场景、人物、细节（第三学段）", "background": "【阅读】借助作者、出处与背景资料理解课文（第三学段：能借助相关资料理解含义深刻的句子）", "center": "【阅读】体会文章表达的思想感情；说出对人物与事件的感受", "exam": "【学业质量】识字写字、阅读与表达的学段学业质量要求", "traps": "【识字与写字】读准字音、认清字形；第三学段：辨别词语的感情色彩、体会标点用法", "accumulate": "【阅读】积累课文中的优美词语、精彩句段（第二学段起）", "transfer": "【表达】【习作】内容具体、感情真实，分段表述；学写读书笔记与常见应用文", "extend": "【拓展】课外阅读与跨学科学习（课标：整本书阅读、跨学科学习）"}, "words": [{"w": "气急败坏", "mean": "形容非常生气，狼狈不堪。"}, {"w": "望眼欲穿", "mean": "形容盼望殷切，眼睛都望穿了。"}, {"w": "饮水思源", "mean": "喝水时想到水源，比喻不忘本。"}, {"w": "碧霄", "mean": "青蓝色的天空。"}, {"w": "乞巧", "mean": "七夕节女子向织女求取巧艺的习俗。"}, {"w": "找碴儿", "mean": "故意挑毛病，找借口。"}, {"w": "龇着牙", "mean": "露出牙齿，形容凶狠的样子。"}, {"w": "逼近", "mean": "靠近，逼近。"}], "sentences": [{"src": "狼非常想吃小羊，就故意找碴儿，说：你把我喝的水弄脏了！你安的什么心？", "why": "写出狼的凶狠与无理取闹，为后文冲突做铺垫。"}, {"src": "可怜的小羊喊道：啊，亲爱的狼先生，那是不可能的，去年我还没有出生啊！", "why": "写出小羊的无辜与无奈，突出其善良。"}, {"src": "狼不想再争辩了，龇着牙，逼近小羊，大声嚷道：你这个坏蛋！说我坏话的不是你，就是你爸爸，反正都一样。", "why": "写出狼的蛮横与不讲理，推动情节高潮。"}], "methods": ["语言描写", "动作描写", "神态描写", "事情发展顺序"], "polyphone": [{"zi": "还", "items": [{"py": "hái", "ci": "还没有"}]}, {"zi": "说", "items": [{"py": "shuō", "ci": "说话"}]}], "notes": [{"para": 0, "kind": "段意", "tags": ["语言描写"], "text": "总结民间故事特点：口语化、反映百姓期待、有不可思议情节。"}, {"para": 1, "kind": "字词", "tags": ["对比"], "text": "对比两组词语，体会表达效果差异，适合不同情境使用。"}, {"para": 2, "kind": "积累", "tags": ["押韵"], "text": "《乞巧》诗，描写七夕节乞巧习俗，语言优美，押韵工整。"}, {"para": 3, "kind": "写法", "tags": ["语言描写", "动作描写"], "text": "通过对话和动作，生动展现狼与小羊的冲突，情节紧凑。"}], "background": "《乞巧》作者林杰，唐代诗人，描写七夕节乞巧习俗。《狼和小羊》是伊索寓言，通过寓言故事揭示强权与弱者的关系。", "center": {"idea": "通过民间故事和寓言，体会语言魅力，理解故事背后的道理。", "virtue": "善良、机智、不畏强权，懂得感恩与坚持。"}, "exam": [{"point": "词语理解", "how": "常考词语意思，结合上下文解释。"}, {"point": "句子理解", "how": "常考句子作用，分析描写手法与情感。"}, {"point": "修辞手法", "how": "常考修辞识别，如语言描写、动作描写。"}, {"point": "中心思想", "how": "常考故事寓意，总结道理启示。"}, {"point": "小练笔", "how": "常考仿写，把情节说得更具体。"}], "traps": [{"type": "感情色彩", "text": "气急败坏、望眼欲穿等词感情色彩不同。"}, {"type": "标点", "text": "对话中引号、感叹号使用要准确。"}, {"type": "修辞误用", "text": "注意语言描写与动作描写的区别。"}], "accumulate": [{"t": "狼非常想吃小羊，就故意找碴儿，说：你把我喝的水弄脏了！你安的什么心？", "why": "学习对话描写，增强故事生动性。"}, {"t": "可怜的小羊喊道：啊，亲爱的狼先生，那是不可能的，去年我还没有出生啊！", "why": "学习表达无辜与无奈的情感。"}, {"t": "狼不想再争辩了，龇着牙，逼近小羊，大声嚷道：你这个坏蛋！说我坏话的不是你，就是你爸爸，反正都一样。", "why": "学习动作与语言结合，推动情节。"}], "extend": {"life": "读完后，可以和家人分享一个民间故事，体会其中的道理。", "links": ["《伊索寓言》其他故事", "《牛郎织女》民间故事"]}, "transfer": "仿照课文，把一个小故事的情节说得更具体，加入对话和动作。"}}, {"id": "aabf2e4a-3ceb-4e86-8804-22c10223cc57:020", "grade": "五年级", "term": "上册", "no": 20, "book": "五年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "从前有座山​", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 49, "chars": 993, "paras": ["从前有座山从前有座山，山里有座庙，庙里有个老和尚在给小和尚讲故事。", "讲的是什么故事呢？", "从前有座山……", "在你很小的时候，爷爷奶奶也许就给你讲过这个故事。像这样耳熟能详的民间故事还有很多，我们一起找来读一读吧。", "你读过吗《田螺姑娘》《梁山伯与祝英台》《八仙过海》……它们都是我国民间故事中的经典篇目。人们将对美好生活的期盼，化成了一个个民间故事。你讲，我听；我讲，他听。就这样口耳相传，直到今天仍旧吸引着我们。", "从前，有个年轻人，独自种着几亩田过活。他每天天还没亮就起床，吃完了早饭，就带了午饭到田里去耕作，直到太阳落山的时候，他才回家自己做晚饭吃。衣服脏了自己洗，鞋袜破了就自己缝缝补补。", "有一天，他到田里去耕作，捡回来一个大田螺。那是一个青艳艳像宝玉一样的田螺，他舍不得吃，就养在灶头旁边的水缸里。水缸里的水变得特别清，看不到一点儿污泥。", "第二天晚上，年轻人从田里耕作回来，一进门，就看见灶上热气腾腾的，屋子里也收拾得干干净净、整整齐齐。他揭开锅盖一看，饭做好了，菜也做好了。他感到很奇怪……", "他把这情形告诉了隔壁的老太太。老太太说：“ 一定是田螺姑娘帮了你的忙。”", "以上是中国民间故事《田螺姑娘》的片段。阅读我国的民间故事，你不仅能领略动人的情节，还能认识许多精彩的人物，如机智的徐文长、聪慧的巧姑。", "相信你可以读更多民间故事存在于世界上的每一个角落。", "欧洲各国的民间故事精彩纷呈。你可以跟随小牧羊人，踏上寻找三只会唱歌的苹果的旅途；你可以听到伊凡与灰额猫、山羊、绵羊在聊天；你还可以看到狡猾又幽默的列那狐是如何捉弄其他动物的，那些故事一定会让你捧腹大笑。", "在遥远的非洲大地，大家会在闲暇的时候，让一个人领唱优美的故事，听众则伴以合唱。鳄鱼幻想着晒太阳就能长出翅膀，大象被人类逼迫着逃离家乡却仍然坚持回乡……这些意味深远的民间故事就这样口耳相传，代代传诵。", "让我们一起阅读这些故事，感受世界各地的别样风情。", "民间故事往往寄托着人们朴素的愿望：正义却弱小的主人公有可能打败强大的对手；心地善良的穷苦人通过努力可以丰衣足食，过上幸福的生活……", "作为一种口头艺术，民间故事一般有特定的主题类型和重复的段落，这是为了方便讲述者记忆，同时加深听众的印象。", "为什么我的眼里常含泪水？", "因为我对这土地爱得深沉……", "—艾青心怀家国天下，感悟责任担当。", "◎  结合资料，深入体会文章表达的思想感情。", "◎  学习列提纲，理清习作思路。"], "tasks": [], "newchars": ["第四单元"], "notes": [], "kb": {"stage": "5-6", "standard": {"chars": "【识字与写字】主动识字、有独立识字能力；书写规范、端正、整洁", "read": "【阅读】用普通话正确、流利、有感情地朗读课文", "recite": "【阅读】诵读优秀诗文，体验情感、展开想象，领悟诗文大意", "words": "【阅读】联系上下文和生活积累，理解词句的意思", "parts": "【阅读】初步把握文章的内容，复述叙事性作品的大意", "idea": "【阅读】体会文章表达的思想感情", "sentences": "【阅读·第二学段起】体会课文中关键词句表达情意的作用", "methods": "【阅读·第三学段】了解表达顺序，初步领悟基本的表达方法（课标要求随文学习，不做系统讲授与死记硬背）", "questions": "【阅读】对课文中不理解的地方提出疑问；敢于提出看法、作出判断", "polyphone": "【识字与写字】读准字音，分辨多音字在不同语境中的读法", "notes": "【阅读】感受作品中生动的形象和优美的语言（第二学段）；简单描述印象最深的场景、人物、细节（第三学段）", "background": "【阅读】借助作者、出处与背景资料理解课文（第三学段：能借助相关资料理解含义深刻的句子）", "center": "【阅读】体会文章表达的思想感情；说出对人物与事件的感受", "exam": "【学业质量】识字写字、阅读与表达的学段学业质量要求", "traps": "【识字与写字】读准字音、认清字形；第三学段：辨别词语的感情色彩、体会标点用法", "accumulate": "【阅读】积累课文中的优美词语、精彩句段（第二学段起）", "transfer": "【表达】【习作】内容具体、感情真实，分段表述；学写读书笔记与常见应用文", "extend": "【拓展】课外阅读与跨学科学习（课标：整本书阅读、跨学科学习）"}, "words": [{"w": "亩", "mean": "土地面积单位，一亩约667平方米。"}, {"w": "典", "mean": "经典、典范，指值得学习或传诵的篇目。"}, {"w": "姑", "mean": "姑娘，年轻女子；也指父亲的姐妹。"}, {"w": "娘", "mean": "母亲；也用于姑娘、姑娘等称呼。"}, {"w": "幸", "mean": "幸福、幸运，指美好的境遇。"}, {"w": "托", "mean": "寄托、托付，把愿望放在故事里。"}, {"w": "朴", "mean": "朴素，简单不华丽，指愿望不花哨。"}, {"w": "腾", "mean": "热气腾腾，形容热气上升的样子。"}], "sentences": [{"src": "从前有座山，山里有座庙，庙里有个老和尚在给小和尚讲故事。", "why": 的祖先跟牛羊的祖先一样，生活在陆地上。后来环境发生了变化，鲸的祖先迁徙到靠近陆地的浅海里。又经过了很长很长的时间，它们的前肢和尾巴渐渐变成了鳍，后肢完全退化了，整个身子成了鱼的样子，适应了海洋的生活。", "鲸的种类很多，总的来说可以分为两大类：一类是须鲸，没有牙齿；一类是齿鲸，有锋利的牙齿。", "鲸吃什么呢？须鲸主要吃虾和小鱼。它们在海洋里游的时候，张着大嘴，把许多小鱼小虾连同海水一齐吸进嘴里，然后闭上嘴，把海水从须板中间滤出来，把小鱼小虾吞进肚子里，有的一顿就可以吃两吨多。齿鲸主要以乌贼、鱼类为食，有的还能捕食大鱼和海兽。它们遇到大鱼和海兽，就凶猛地扑上去，用锋利的牙齿撕咬，很快就吃掉了。有一种号称“海中之虎”的虎鲸，常常好几十头结成一群，围住一头三十多吨重的长须鲸，几个小时就能把它吃光。", "通过作比较、列数字，鲸的庞大就具体可感了。", "“近四十吨重”“约十八米长”，表述非常严谨。", "这段话分别介绍了须鲸和齿型和捕食方式。", "鲸跟牛羊一样用肺呼吸，这也说明它不属于鱼类。", "鲸的鼻孔长在脑袋顶上，呼气的时候浮出海面，从鼻孔喷出来的气形成一股水柱，就像花园里的喷泉一样；等肺里吸足了气，再潜入水中。鲸每隔一段时间必须呼吸一次。不同种类的鲸喷出的气形成的水柱也不一样：须鲸的水柱是垂直的，又细又高；齿鲸的水柱是倾斜的，又粗又矮。有经验的人根据水柱的形状，就能判断出鲸的种类和大小。", "鲸每天都要睡觉，睡觉的时候，总是几头聚在一起。", "它们通常会找一个比较安全的地方，头朝里，尾巴向外，围成一圈，静静地浮在海面上。如果听到什么声响，它们立即四散游开。", "鲸是胎生的，幼鲸靠吃母鲸的奶长大，这些特征也说明鲸是哺乳动物。长须鲸刚生下来就有六米多长，一两吨重，两三年就可以长成大鲸。鲸的寿命很长，一般可以活几十年，有的甚至能活近一百年。", "很形象地写出了鲸的呼吸。"], "tasks": [], "newchars": [], "notes": [], "kb": {"stage": "5-6", "standard": {"chars": "【识字与写字】主动识字、有独立识字能力；书写规范、端正、整洁", "read": "【阅读】用普通话正确、流利、有感情地朗读课文", "recite": "【阅读】诵读优秀诗文，体验情感、展开想象，领悟诗文大意", "words": "【阅读】联系上下文和生活积累，理解词句的意思", "parts": "【阅读】初步把握文章的内容，复述叙事性作品的大意", "idea": "【阅读】体会文章表达的思想感情", "sentences": "【阅读·第二学段起】体会课文中关键词句表达情意的作用", "methods": "【阅读·第三学段】了解表达顺序，初步领悟基本的表达方法（课标要求随文学习，不做系统讲授与死记硬背）", "questions": "【阅读】对课文中不理解的地方提出疑问；敢于提出看法、作出判断", "polyphone": "【识字与写字】读准字音，分辨多音字在不同语境中的读法", "notes": "【阅读】感受作品中生动的形象和优美的语言（第二学段）；简单描述印象最深的场景、人物、细节（第三学段）", "background": "【阅读】借助作者、出处与背景资料理解课文（第三学段：能借助相关资料理解含义深刻的句子）", "center": "【阅读】体会文章表达的思想感情；说出对人物与事件的感受", "exam": "【学业质量】识字写字、阅读与表达的学段学业质量要求", "traps": "【识字与写字】读准字音、认清字形；第三学段：辨别词语的感情色彩、体会标点用法", "accumulate": "【阅读】积累课文中的优美词语、精彩句段（第二学段起）", "transfer": "【表达】【习作】内容具体、感情真实，分段表述；学写读书笔记与常见应用文", "extend": "【拓展】课外阅读与跨学科学习（课标：整本书阅读、跨学科学习）"}, "words": [{"w": "上腭", "mean": "口腔顶部，硬腭和软腭的合称。"}, {"w": "须板", "mean": "须鲸上颚两侧像梳子一样的角质板，用来滤食。"}, {"w": "退化", "mean": "器官或功能逐渐变小、变弱甚至消失。"}, {"w": "凶猛", "mean": "凶恶而猛烈。"}, {"w": "胎生", "mean": "胚胎在母体内发育成熟后产出。"}, {"w": "垂直", "mean": "与水平面成直角。"}, {"w": "倾斜", "mean": "歪斜，不垂直。"}], "sentences": [{"src": "它要是张开嘴，人站在它嘴 五年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "风向袋的制作", "section": "例文", "domain": "writing", "genre": "例文", "author": null, "dynasty": null, "page": 74, "chars": 649, "paras": ["风无影无形，我们怎样才能知道它是从哪个方向吹来的呢？可以借助一些容易随风飘动的物体，比如风向袋，根据它飘动的方向判断风向。", "制作风向袋可以分为下面几个步骤：第一，准备竹竿、细铁丝、粗铁丝、尖嘴钳、尼龙纱巾（或其他较轻的纺织品）、塑料绳、针线等材料和工具。", "第二，缝制口袋。用尼龙纱巾缝一个圆锥形口袋，袋口直径约10厘米，袋长40~50厘米。用细铁丝做一个和袋口一样大小的圆圈，用针线把细铁丝固定在袋口处，把袋口撑开。", "第三，剪下4根长约10厘米的塑料绳，在袋口边缘分别扎4个小洞。将4根塑料绳的一头分别穿过4个小洞，绑在铁丝圈上，另一头绑在一起，打一个结实的绳结。", "第四，拿一根细铁丝，在离竹竿顶端10厘米处缠2~3圈，不要缠太紧，做一个可以在竹竿上自由滑动的细铁丝圈。离细铁丝圈上下各1~2厘米处，用尖嘴钳把粗铁丝在竹竿上紧紧缠绕3~4圈，这样细铁丝圈就只能在缠紧的粗铁丝圈之间上下滑动。再剪下一根15厘米长的塑料绳，一头绑在之前打好的绳结上，另一头绑在竹竿的细铁丝圈上，把口袋系在竹竿上。", "将竹竿固定在空旷的场地上，在观察前确认东西南北的准确方位。当风向袋随风飘动时，观察它飘动的方向。", "风向袋飘动的反方向就是风向。"], "tasks": [], "newchars": ["第六单元"], "notes": [], "kb": {"stage": "5-6", "standard": {"chars": "【识字与写字】主动识字、有独立识字能力；书写规范、端正、整洁", "read": "【阅读】用普通话正确、流利、有感情地朗读课文", "recite": "【阅读】诵读优秀诗文，体验情感、展开想象，领悟诗文大意", "words": "【阅读】联系上下文和生活积累，理解词句的意思", "parts": "【阅读】初步把握文章的内容，复述叙事性作品的大意", "idea": "【阅读】体会文章表达的思想感情", "sentences": "【阅读·第二学段起】体会课文中关键词句表达情意的作用", "methods": "【阅读·第三学段】了解表达顺序，初步领悟基本的表达方法（课标要求随文学习，不做系统讲授与死记硬背）", "questions": "【阅读】对课文中不理解的地方提出疑问；敢于提出看法、作出判断", "polyphone": "【识字与写字】读准字音，分辨多音字在不同语境中的读法", "notes": "【阅读】感受作品中生动的形象和优美的语言（第二学段）；简单描述印象最深的场景、人物、细节（第三学段）", "background": "【阅读】借助作者、出处与背景资料理解课文（第三学段：能借助相关资料理解含义深刻的句子）", "center": "【阅读】体会文章表达的思想感情；说出对人物与事件的感受", "exam": "【学业质量】识字写字、阅读与表达的学段学业质量要求", "traps": "【识字与写字】读准字音、认清字形；第三学段：辨别词语的感情色彩、体会标点用法", "accumulate": "【阅读】积累课文中的优美词语、精彩句段（第二学段起）", "transfer": "【表达】【习作】内容具体、感情真实，分段表述；学写读书笔记与常见应用文", "extend": "【拓展】课外阅读与跨学科学习（课标：整本书阅读、跨学科学习）"}, "words": [{"w": "无影无形", "mean": "看不见摸不着，形容风没有形状。"}, {"w": "随风飘动", "mean": "跟着风的方向摆动。"}, {"w": "圆锥形", "mean": "像圆锥一样的形状，一头尖一头圆。"}, {"w": "袋口直径", "mean": "袋口圆圈的宽度。"}, {"w": "绳结", "mean": "绳子打成的结。"}, {"w": "缠", "mean": "绕在物体上。"}, {"w": "空旷", "mean": "地方开阔，没有遮挡。"}, {"w": "反方向", "mean": "与飘动方向相反的方向。"}], "sentences": [{"src": "风无影无形，我们怎样才能知道它是从哪个方向吹来的呢？", "why": "用设问引出风向袋，激发思考。"}, {"src": "风向袋飘动 自来看。", "why": "写张飞神态与判断，为下文大喝铺垫。"}, {"src": "飞乃厉声大喝曰：我乃燕人张翼德也！谁敢与我决一死战？声如巨雷。曹军闻之，尽皆股栗。", "why": "用语言与侧面描写突出张飞神勇。"}], "methods": ["神态描写", "语言描写", "侧面描写", "夸张"], "polyphone": [{"zi": "娜", "items": [{"py": "nuó", "ci": "婀娜"}]}, {"zi": "德", "items": [{"py": "dé", "ci": "道德"}]}], "notes": [{"para": 0, "kind": "段意", "tags": ["心理描写"], "text": "写桑娜抱回孤儿，用抉择表现善良。"}, {"para": 1, "kind": "写法", "tags": ["神态描写", "语言描写"], "text": "写张飞睁眼、大喝，突出神勇。"}, {"para": 2, "kind": "写法", "tags": ["侧面描写", "夸张"], "text": "写曹军股栗，侧面衬托张飞威猛。"}, {"para": 3, "kind": "段意", "tags": [], "text": "总结本单元小说都写困境中的抉择。"}], "background": "《三国演义》为元末明初罗贯中所著，是中国古典四大名著之一，塑造了众多鲜明人物形象。", "center": {"idea": "通过人物在困境中的抉择与表现，突出人物形象。", "virtue": "善良、勇敢、担当。"}, "exam": [{"point": "词语理解", "how": "结合上下文解释股栗、抉择等词。"}, {"point": "句子理解", "how": "分析张飞大喝句如何突出人物。"}, {"point": "人物品质", "how": "从桑娜抱孤儿看出善良。"}, {"point": "修辞手法", "how": "指出声如巨雷为夸张。"}, {"point": "表达顺序", "how": "按事情发展顺序写情节。"}], "traps": [{"type": "字音", "text": "娜读nuó，不读nà。"}, {"type": "感情色彩", "text": "股栗为贬义，形容恐惧。"}, {"type": "修辞误用", "text": "声如巨雷是夸张，不是比喻。"}], "accumulate": [{"t": "声如巨雷。曹军闻之，尽皆股栗。", "why": "写人物威猛可引用。"}, {"t": "宁可自己受苦也要照顾他们", "why": "写善良担当可引用。"}], "extend": {"life": "遇到选择时想想桑娜和张飞，勇敢担当。", "links": ["《三国演义》其他英雄片段", "《穷人》中桑娜的善良"]}, "transfer": "仿写一个英雄人物在危急时刻的语言与神态，突出其性格。"}}, {"id": "2e3dc199-9c42-486b-bbee-7731bd0ee227:028", "grade": "六年级", "term": "上册", "no": 28, "book": "六年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "笑与泪，经历与成长", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 67, "chars": 1066, "paras": ["我们从出生起，就踏上了成长之旅。很多作家的作品讲述了我们同龄人的成长故事。他们的生活，有欢笑和喜悦，也有磨难和痛苦。这些或甜或苦的经历，教他们一步步向前，勇敢地面对未来。", "你读过吗《童年》是苏联作家高尔基的小说。故事的主人公阿廖沙在父亲病逝后，随母亲投奔外祖父。外祖父粗野自私，经常毒打孩子，曾把阿廖沙打得失去知觉。除了脾气暴躁的外祖父，这个家庭里还有两个为争夺财产整日争吵、打架的舅舅。阿廖沙经常惊惧不安，还好有慈祥善良的外祖母安慰他、保护他。", "那时我病得很重，刚能勉强起身。我清楚地记得，我病着的时候，开始是父亲开开心心地照顾着我，后来他突然不见了，照顾我的人换成了外祖母，一个很奇怪的人。", "“你从哪儿过来啊？”我问她。", "她回答：“从上面来，从下城来，不是过来，是坐船来！人怎么能自己从水上过来呢，真是个小迷糊！”", "这真可笑，又是上又是下的，让人糊涂。上面，楼上住的是几个染了大胡子的波斯人，而地下室住了一个卖羊皮的黄皮肤卡尔梅克老头。", "下楼梯可以从扶手上滑下去，要是摔倒的话就滚下去，这我一清二楚。", "可是这关水什么事？简直都乱套了。", "“我怎么就迷糊呢？”", "“因为你吵得人迷糊啊。”她说完也笑了起来。", "——选自苏联高尔基的《童年》，黄玫译。", "《童年》以孩子的视角来讲述故事，给这个充满伤痛的故事蒙上了一层天真烂漫的色彩。", "外祖母的爱仿佛黑暗中的明灯，照亮了阿廖沙的心。除了外祖母，善良、乐观、富于同情心的“小茨冈”，忠厚老实的老工人格里高利，献身于科学的知识分子“好事儿”，以及阿廖沙遇到的其他许许多多好人，都让他感受到了人世间的温暖和美好，让他面对苦难依然保持对生活的勇气和信心。", "相信你可以读更多成长的故事各不相同，却同样带给我们感动。", "我们知道小英雄雨来的故事，雨来为掩护交通员被鬼子抓住后机智逃脱了。《小英雄雨来》这本书还写了雨来给八路军送鸡毛信，和小伙伴们制造假地雷迷惑敌人、为八路军站岗放哨……在抗日战争中，雨来不断成长，完成了多项重要任务，最终如愿参加了游击队。", "精彩的成长故事还有很多，让我们找来读一读，"], "tasks": [], "newchars": [], "notes": [], "kb": {"stage": "5-6", "standard": {"chars": "【识字与写字】主动识字、有独立识字能力；书写规范、端正、整洁", "read": "【阅读】用普通话正确、流利、有感情地朗读课文", "recite": "【阅读】诵读优秀诗文，体验情感、展开想象，领悟诗文大意", "words": "【阅读】联系上下文和生活积累，理解词句的意思", "parts": "【阅读】初步把握文章的内容，复述叙事性作品的大意", "idea": "【阅读】体会文章表达的思想感情", "sentences": "【阅读·第二学段起】体会课文中关键词句表达情意的作用", "methods": "【阅读·第三学段】了解表达顺序，初步领悟基本的表达方法（课标要求随文学习，不做系统讲授与死记硬背）", "questions": "【阅读】对课文中不理解的地方提出疑问；敢于提出看法、作出判断", "polyphone": "【识字与写字】读准字音，分辨多音字在不同语境中的读法", "notes": "【阅读】感受作品中生动的形象和优美的语言（第二学段）；简单描述印象最深的场景、人物、细节（第三学段）", "background": "【阅读】借助作者、出处与背景资料理解课文（第三学段：能借助相关资料理解含义深刻的句子）", "center": "【阅读】体会文章表达的思想感情；说出对人物与事件的感受", "exam": "【学业质量】识字写字、阅读与表达的学段学业质量要求", "traps": "【识字与写字】读准字音、认清字形；第三学段：辨别词语的感情色彩、体会标点用法", "accumulate": "【阅读】积累课文中的优美词语、精彩句段（第二学段起）", "transfer": "【表达】【习作】内容具体、感情真实，分段表述；学写读书笔记与常见应用文", "extend": "【拓展】课外阅读与跨学科学习（课标：整本书阅读、跨学科学习）"}, "words": [{"w": "投奔", "mean": "前去依靠、投靠。"}, {"w": "粗野", "mean": "粗暴野蛮，没有礼貌。"}, {"w": "毒打", "mean": "用狠毒的手段殴打。"}, {"w": "惊惧不安", "mean": "非常害怕，心里不平静。"}, {"w": "勉强", "mean": "能力不够，还尽力去做。"}, {"w": "天真烂漫", "mean": "心地单纯，自然可爱。"}, {"w": "同情心", "mean": "对他人不幸的怜悯之心。"}, {"w": "献身", "mean": "为事业或理想付出一切。"}], "sentences": [{"src": "外祖母的爱仿佛黑暗中的明灯，照亮了阿廖沙的心。", "why": "用比喻写出外祖母的爱给阿廖沙带来温暖与希望。"}, {"src": "《童年》以孩子的视角来讲述故事，给这个充满伤痛的故事蒙上了一层天真烂漫的色彩。", "why": "点明叙述视角，让苦难故事多了童真与希望。"}, {"src": "相信你可以读更多成长的故事各不相同，却同样带给我们感动。", "why": "由一篇引向更多，激发阅读兴趣。"}], "methods": ["比喻", "语言描写", "心理描写", "对比"], "polyphone": [{"zi": "蒙", "items": [{"py": "
