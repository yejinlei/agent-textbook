谁”的游戏吧！", "选择一个同学，用几句话或一段话写一写他。注意文中不能出现他的名字，但是要让别人读了之后能猜出你写的是谁。", "你选的是谁？他有哪些特别的地方？选择一两点写下来。", "写的时候，注意一段话的开头要空两格。写好以后读给同学听，看看他们能不能猜出你写的是谁。也可以把全班同学的习作贴在墙报上，大家一起来猜一猜。", "他的头发又黑又硬，一根根向上竖着……", "他特别爱笑，一个小笑话就能让他笑个不停……", "他关心班里的每个人，不管是谁遇到困难，他都会主动帮忙。有一次……", "习  作他酷爱踢足球，也喜欢跑步，经常能在操场上看到他奔跑的身影……"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 6, "book": "三年级上册", "unit_no": 1, "unit_name": "第一单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 11, "chars": 564, "paras": ["看到这样的词句，我会多读几遍，然后抄写下来。", "词句段运用下面的成语有什么特点？说说你的发现。", "摇头晃脑    披头散发    张牙舞爪    提心吊胆面红耳赤    手忙脚乱    手疾眼快    口干舌燥怎样朗读能更好地表达句子的意思？想一想，练一练，再"], "tasks": [], "newchars": ["第二单元"]}, {"grade": "三年级", "term": "上册", "no": 14, "book": "三年级上册", "unit_no": 2, "unit_name": "第二单元", "title": "写日记", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 24, "chars": 233, "paras": ["习  作你写过日记吗？读读下面的日记，说说你有什么发现。"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 15, "book": "三年级上册", "unit_no": 2, "unit_name": "第二单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 25, "chars": 352, "paras": ["读书时遇到不理解的词语，你会怎么做？分小组完成下面的活动，看看哪个小组总结的方法多。", "词句段运用你会用哪些词语来形容不同的季节？写下来"], "tasks": [], "newchars": ["第三单元"]}, {"grade": "三年级", "term": "上册", "no": 19, "book": "三年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "名字里的故事", "section": "口语交际", "domain": "writing", "genre": "口语交际", "author": null, "dynasty": null, "page": 41, "chars": 246, "paras": ["每个人都有名字。你知道自己的名字有什么含义吗？回家问问长辈吧。你的名字里也许饱含着他们对你的期待，说不定还藏着一个故事呢！"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 20, "book": "三年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "续写故事", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 42, "chars": 162, "paras": ["下面的图讲了什么事情？接下来可能会发生什么？请你把故事写完。", "写好以后"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 21, "book": "三年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 43, "chars": 609, "paras": ["识字加油站读一读，写一写。", "恒3 心    神圣萌3 发    妥3 当车轴阁3 楼    培3 植    厘3 米恒萌圣妥阁轴厘培我通过查字典认识了这些加点的字。", "预测的方法对你的阅读有哪些帮助？你是怎么运用预测来阅读的？"], "tasks": [], "newchars": ["第四单元"]}, {"grade": "三年级", "term": "上册", "no": 25, "book": "三年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "我来编童话", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 54, "chars": 230, "paras": ["看到上面这些词语，你的脑海里浮现出了怎样的画面？你想到了什么样的故事？选择一组，发挥想象，把故事写下来。", "写之前想一想：◇  故事里有哪些角色？（可以是上面提供的角色，还可以添加你喜欢的其他角色。）"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 26, "book": "三年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 55, "chars": 477, "paras": [], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 28, "book": "三年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "在那奇妙的王国里", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 57, "chars": 788, "paras": ["在童话王国里，小蝌蚪四处寻找自己的妈妈，小壁虎着急地向别的动物借尾巴，雪孩子和小白兔在一起嬉戏玩耍，王子和公主过上了幸福的生活……在那里，一切都有可能发生，一切都妙不可言。", "你读过吗《安徒生童话》创造了一个奇妙的童话王国，这是丹麦作家安徒生送给全世界孩子和大人共同的礼物。善良的拇指姑娘，卖火柴的小女孩，坚定的锡兵，历经磨难的丑小鸭……这些故事里的主人公，一定会给你留下难以磨灭的印象。", "“是的，我要和你一块儿去！”拇指姑娘说。她坐在鸟儿的背上，把脚搁在他展开的双翼上，同时用腰带把自己紧紧地系在他最结实的一根羽毛上。燕子就这样飞到空中，飞过了森林，飞过了海洋，飞过了常年积雪的高山。在寒冷的高空中，拇指姑娘冻得发起抖来。于是她就钻到鸟儿温暖的羽毛下面，只把她的小脑袋伸出来欣赏下面那些美丽的景致。", "终于，他们来到了温暖的国度，那儿的阳光更加明亮。田沟里、篱笆上，到处都结满了最美丽的绿色和紫色的葡萄。树林里到处挂着柠檬和橙子。", "—选自丹麦安徒生的《拇指姑娘》，叶君健译，有改动。", "相信你可以读更多童话王国里还有许许多多动人的故事。", "当你走进叶圣陶笔下《稻草人》的世界，你会知道在夜间的田野，星星怎样眨眼，月亮怎样微笑。你还会知道，田野里的人们有着怎样的辛苦和悲伤。", "翻开德国格林兄弟搜集整理的《格林童话》，你能从一个个妙趣横生的故事中，感悟生活的真谛和做人的道理。灰姑娘虽然身处逆境，却仍然心怀美好，真诚待人；小裁缝勇敢乐观，用自己的智慧战胜巨人……", "我们可以把自己想象成童话中的主人公，和故事中的人物一起欢笑，一起悲伤。", "绘童话，这个奇妙的王国，等待着你去漫游，去发现。", "童话世界无奇不有。阅读时，充分发挥想象，能更好地领略童话的魅力。", "生活中不缺少美，只是缺少发现美的眼睛。", "—— [法国] 罗丹第五单元◎  体会作者是怎样留心观察周围事物的。", "◎  仔细观察，把观察所得写下来。"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 31, "book": "三年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "我们眼中的缤纷世界", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 65, "chars": 221, "paras": ["这段时间我们观察了不少身边的事物，有了很多新发现，简单列出来"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 32, "book": "三年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "我家的小狗", "section": "例文", "domain": "writing", "genre": "例文", "author": null, "dynasty": null, "page": 66, "chars": 396, "paras": ["我得好好写写我们家的小狗，它叫“王子”，是我们村里长得最花、毛色最漂亮的一只狗。它跑得特别快，我总也追不上它。不过“王子”很乖，它总是在前面等着我。", "我教过“王子”认字，可是它连一个字母也没学会，不过它倒是挺爱上课的。我教它念“狗”的时候，它叫得最欢。它准是在想，这是在说它自己呀！“王子”还会数数，不过总共才会数到二。", "它喜欢哼哼叫和汪汪叫。", "“你要干什么？”“王子”在我面前哼哼时，我问它。", "它汪地叫一声，晃一晃脑袋，表示想要出去。", "“现在还想干什么？”当我们走出院子时，我接着问它。", "“王子”又汪地叫一声，朝铁路那边跑去。", "“你该一次说完哪！”我一边埋怨，一边跟在它后面跑。我知道“王子”想去那儿干什么，它喜欢同火车赛跑。每次都是它输，可它从不在乎。每当作者观察得真仔细，他发现“王子”认“狗”字的时候叫得最欢。"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 33, "book": "三年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "我爱故乡的杨梅", "section": "例文", "domain": "writing", "genre": "例文", "author": null, "dynasty": null, "page": 67, "chars": 684, "paras": ["我的故乡在江南，我爱故乡的杨梅。", "细雨如丝，一棵棵杨梅树贪婪地吮吸着春天的甘露。它们伸展着四季常绿的枝条，一片片狭长的叶子在雨雾中欢笑着。", "端午节过后，杨梅树上挂满了杨梅。", "杨梅圆圆的，和桂圆一样大小，遍身生着小刺。", "等杨梅渐渐长熟，刺也渐渐软了，平了。摘一个放“王子”竟敢跟火车赛跑，真有趣。", "有火车开过来，“王子”都以为能跑赢它。等到跑不动了，它便冲着远去的火车汪汪叫上几声，不知是允许火车开走呢，还是骂了火车一顿。", "经过仔细观察，作者发现了“王子”的淘气可爱。把你觉得它淘气可爱的部分找出来，"], "tasks": [], "newchars": ["第六单元"]}, {"grade": "三年级", "term": "上册", "no": 38, "book": "三年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "这儿真美", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 80, "chars": 297, "paras": ["花园、果园，田野、小河……我们周围有许多美丽的地方，你发现了吗？", "让我们把身边的美景介绍给别人吧！", "写之前仔细观察，看看这个地方有些什么，是什么样子的。", "写的时候，试着运用从课文中学到的方法，围绕一个意思写一段话。如：◇  操场后面的小花园真美……"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 39, "book": "三年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 81, "chars": 497, "paras": ["我们习作的时候也可以学着这样写。", "找到这样的句子，可以帮助我们更好地理解一段话的意思。", "你在阅读时关注段落中的关键语句了吗？结合读过的文章"], "tasks": [], "newchars": ["第七单元"]}, {"grade": "三年级", "term": "上册", "no": 46, "book": "三年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "身边的“小事”", "section": "口语交际", "domain": "writing", "genre": "口语交际", "author": null, "dynasty": null, "page": 91, "chars": 157, "paras": ["我们的身边每天都在发生各种各样的“小事”，每件事都以不同的方式影响着我们的生活。", "你的身边有哪些类似这样的“小事”？和小组同学交流你发现的令人感到温暖的行为，或是不文明的行为，再谈谈你对这些行为的看法。", "汇总小组同学谈到的“小事”，和其他小组交流。", "◎ 清楚地表达自己的看法。", "◎ 汇总小组意见时，尽可能反映每个人的想法。"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 47, "book": "三年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "我有一个想法", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 92, "chars": 428, "paras": ["习  作最近我一直在想，我们班能不能开辟一个植物角呢？我们可以在植物角养花种草，或是种花生、种豆子，还可以根据季节的变化更换不同的植物。我们可以轮流照看它们，给它们浇水、施肥。这样既可以使班里的同学了解不同植物的特点，还可以使大家亲近自然，为教室增添大自然的气息。", "我发现爱玩手机的人特别多。上个月我们去给爷爷祝寿，聚会的时候大家都在各自看手机，很少一起聊天。我爸爸下班回家后也一直玩手机，谁叫他都不理。", "过于沉迷手机会影响与别人的交往，我们不应该总是玩手机，应该用更多的时间关心身边的人。", "生活中有很多需要改进的问题。如果我们积极表达自己的想法，提出改进建议和解决办法，就能使生活变得更加美好。如：生活中有哪些问题引起了你的关注？你有什么想法？从自己发现的或同学列举的问题中选择一个写一写。", "写的时候，要把问题和你的想法写清楚。如果有改进建议和解决办法，也可以写下来。", "写好以后读给同学听，看看他是否明白你的想法，再问问他对这个问题有什么看法，然后修改自己的习作。"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 48, "book": "三年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 93, "chars": 469, "paras": ["你有摘抄的习惯吗？平时是怎么做摘抄的？和同学说一说并分享你的摘抄本。", "田螺蝌蚪螃蟹鲤鱼　　鲫鱼　　鲨鱼识字加油站读一读，认一认，想想每行加点的字有什么特点。", "螃螺鲫鲨鲤蟹读书时，我会先画出写得好的语句，再抄写下来。"], "tasks": [], "newchars": ["第八单元"]}, {"grade": "三年级", "term": "上册", "no": 53, "book": "三年级上册", "unit_no "第一单元", "title": "我的植物朋友", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 12, "chars": 270, "paras": ["大自然中有各种各样的植物。让我们选择一种植物，走近它，了解它，和它交朋友。", "照样子，为自己的植物朋友做个记录卡吧。", "借助记录卡，写一写你的植物朋友，让更多的人了解它。", "写之前再去观察一下，看一看，摸一摸，闻一闻……也许你会有新的发现。", "写的时候，试着把你观察和感受到的写清楚。", "写完后，把自己的习作读给同学听。写同一种植物的同学还可以一起交流。", "习  作名称：桃花样子：花骨朵儿胀鼓鼓的。已经绽放的花朵，一个花瓣儿挨着一个花瓣儿，围成圆形。", "颜色：粉红气味：淡淡的清香其他：春天开放。结出的果实是桃子，也有只开花不结果的观赏桃花。颜色还有鲜红的、纯白的。"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "下册", "no": 10, "book": "三年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 13, "chars": 621, "paras": ["小燕子的翼尖或剪尾，偶尔沾了一下水面，那小圆晕便一圈一圈地荡漾开去。", "读到这句话，我能体会到小燕子飞行的轻盈。", "有的还是花骨朵儿，看起来饱胀得马上要破裂似的。", "作者的感受真独特，把花骨朵儿的状态写活了。", "瓢虫款款地落下来了，折好它的黑绸衬裙—膜翅，顺顺溜溜；收拢硬翅，严丝合缝。", "这些细致的动作描写，让小瓢虫仿佛出现在了我的面前。", "你在阅读时积累了哪些优美生动的语句？"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "下册", "no": 15, "book": "三年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "劝告", "section": "口语交际", "domain": "writing", "genre": "口语交际", "author": null, "dynasty": null, "page": 27, "chars": 217, "paras": ["劝  告有一位同学，下课时坐在楼梯的扶手上往下滑。高年级同学看到了，劝他别这么做。", "你觉得那位同学更有可能接受谁的劝告？为什么？", "如果遇到下面这些情况，你会怎样劝他们？"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "下册", "no": 16, "book": "三年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "看图画，写一写", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 28, "chars": 153, "paras": ["请你把上面这幅图画的内容介绍给大家。", "写之前，先仔细观察图画，想一想：◇  图画上有哪些人？他们在干什么？"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "下册", "no": 17, "book": "三年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 29, "chars": 535, "paras": ["说说下面两组词语有什么特点，"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "下册", "no": 19, "book": "三年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "小故事大道理", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 31, "chars": 702, "paras": ["儿童文学家严文井曾说：“寓言是一个魔袋，袋子很小，却能从里面取出很多东西来。”寓言故事一般比较短小，但背后往往藏着深刻的道理。", "你读过吗中国古代寓言凝结着中华民族的智慧。这些寓言故事题材广泛，形式活泼，读起来既轻松有趣，又发人深省。读了下面这则寓言，你明白了什么道理？和同学分享你获得的启示。", "叶公好龙古时候有一位叶公，非常喜欢龙。他穿的衣服上绣着龙，戴的帽子上镶着龙；住的房子也一样，墙壁上画着龙，柱子上雕着龙。", "这些龙张牙舞爪，回旋盘绕，好像在云雾里飞翔。", "天上的真龙听说叶公这么喜欢龙，就决定去拜访他。霎时间，乌云滚滚，雷电交加，真龙到了叶公家里，把头伸进了南窗，把尾巴绕到了北窗。", "叶公见了真龙，吓得脸色发白，浑身发抖，连忙跑走了。原来他喜欢的不是真龙。", "—根据《新序·杂事》相关内容改写。", "相信你可以读更多除了中国的寓言，还可以读一读其他国家的寓言。伊索寓言、拉封丹寓言、克雷洛夫寓言，都在世界上有很大的影响。", "伊索寓言中大多是动物故事，就像一个奇妙的动物王国。漫步其中，我们会看到吃不到葡萄反而说葡萄酸的狐狸，还会遇到用自己的智慧成功逃生的小羊……", "读拉封丹寓言和克雷洛夫寓言时，我们会发现，很多故事都似曾相识，却被赋予了新的意义。老故事，新道理，这也是很多古老的寓言能够代代相传、历久弥新的原因。", "快来打开寓言宝库的大门吧！", "联系生活中的人和事，可以帮助我们更深入地理解故事中的道理。", "读寓言，先要读懂故事内容，再体会故事中的道理。", "看，花儿在悄悄绽放；听，虫儿在窃窃私语……自然界如此奇妙，留心观察，会有新的发现。", "观察自然，探索世界。", "◎  借助关键语句概括一段话的大意。", "◎  做个小实验，把实验过程写清楚。"], "tasks": [], "newchars": ["第三单元"]}, {"grade": "三年级", "term": "下册", "no": 23, "book": "三年级下册", "unit_no": 3, "unit_name": "第三单元", "title": "我做了一项小实验", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 40, "chars": 199, "paras": ["你做过什么小实验？向大家介绍一下。", "写之前，可以先借助图表整理小实验的主要信息。", "写的时候，可以用上“先……接着……然后……最后……”这样的句式，把做小实验的经过写清楚。还可以写一写自己做实验时的心情、实验中有趣的发现等。", "写完后，把自己的习作和同学交换读一读，再评一评：实验过程是否写清楚了？有没有用得不合适的词语？", "习  作实验目的：实验名称：实验准备：实验过程：第一步，第二步，第三步，……", "实验结果："], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "下册", "no": 24, "book": "三年级下册", "unit_no": 3, "unit_name": "第三单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 41, "chars": 710, "paras": ["词句段运用观察时主动思考、提出问题是个好习惯。"], "tasks": [], "newchars": ["第四单元"]}, {"grade": "三年级", "term": "下册", "no": 36, "book": "三年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "奇妙的想象", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 65, "chars": 203, "paras": ["在想象的世界里，什么都可能发生，一切都变得那么奇妙。下面这些题目一定会激发你无穷的遐想。", "选一个题目写一个想象故事，也可以写其他的想象故事。要大胆想象，创造出属于自己的想象世界。", "写完后，可以跟同学交换习作。说说自己最喜欢同学写的什么内容，什么地方需要修改。", "在墙报上开辟一个专栏，如“想象岛”，展示大家的习作。", "贪玩的小水滴水果们的音乐会躲在草丛里的星星手罢工啦小树的心思假如人类可以冬眠滚来滚去的小土豆习  作"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "下册", "no": 37, "book": "三年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "一支铅笔的梦想", "section": "例文", "domain": "writing", "genre": "例文", "author": null, "dynasty": null, "page": 66, "chars": 345, "paras": ["当铅笔有了梦想，它会想做些什么呢？", "豆角、丝瓜和铅笔一样，都是细长的。铅笔想成为“长长的豆角”“嫩嫩的丝瓜”，我觉得这样的想象自然、合理。"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "下册", "no": 38, "book": "三年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "尾巴它有一只猫", "section": "例文", "domain": "writing", "genre": "例文", "author": null, "dynasty": null, "page": 67, "chars": 872, "paras": ["第四个梦想，是来到小溪边。知道我要做什么吗？我要为玩水的鸟当船篙，为过河的蚂蚁当木筏。船上的、岸边的一齐喝彩！哈，多么好玩！多么开心！", "第五个梦想，是跑到运动场上。知道我要做什么吗？我要当一会儿小松鼠的撑竿，当一阵儿小猴子的标枪。挂在脖子上的奖牌亮闪闪的。哈，多么好玩！多么开心！", "谁也不知道，一支铅笔有多少梦想……就像种在稿纸上的字，发多少芽，开多少花，结多少童话。", "铅笔想为小松鼠当撑竿，为小猴子当标枪。", "它为什么会这样想呢？", "猫有尾巴，尾巴怎么能有一只猫呢？", "有一条尾巴，它很自豪地说：“我拥有一只猫！”", "拥有一只猫，这条尾巴真不得了。可是，一条尾巴怎么能拥有一只猫呢？难道，它把猫养在家里，或者把它关在笼子里，或者……哎，真是想不出来。", "“用不着关，”这条尾巴得意地说，“我从出生开始，就拥有这只猫，无论它干什么，都听我的话，都跟在我身边。”", "尾巴那么小，它的猫应该特别特别小。会不会铅笔还会有哪些梦想？仿照课文说一说。", "就是一只跳蚤？", "“跳蚤怎么会是猫呢？”尾巴说，“我这只猫特别乖，我天天骑着它满地跑。”", "尾巴上的跳蚤听见它的话，哈哈大笑：“如果你有一只猫，那你为什么还跟着它到处跑？是猫有你这条尾巴，而不是你这条尾巴有一只猫。”", "尾巴坚持自己的想法：“我就是有一只猫。我跟着它跑是因为我乐意。你看看小孩子，个个当爸爸妈妈的小尾巴，跟着他们跑。难道只能是爸爸妈妈有小孩子，不能是小孩子有爸爸妈妈吗？猫可以有一条尾巴，为什么尾巴就不能有一只猫？”", "另一条尾巴听到了，高兴地说：“哎呀，原来我有一只狗哇，真好！”原来，它是一条狗的尾巴。", "狗生气了吗？没有，因为它也听见了猫尾巴的话。它跟在主人的身后，高兴地想：“对呀，原来我有一个人，真神奇！”", "像这样反方向去想象，尾巴就能有一只猫了。真有意思！", "“尾巴它有一只猫”“喜欢睡觉的风”……你还想到了什么新鲜有趣的说法？展开想象说一说。", "品味多彩童年，感受美好的童心。", "◎  运用多种方法理解难懂的句子。", "◎  写一个身边的人，尝试写出这个人的特点。", "在童年的百花园里，我们看到了真善美。"], "tasks": [], "newchars": ["第六单元"]}, {"grade": "三年级", "term": "下册", "no": 43, "book": "三年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "应该怎样安排座位", "section": "口语交际", "domain": "writing", "genre": "口语交际", "author": null, "dynasty": null, "page": 79,  "unit_name": "第一单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 11, "chars": 546, "paras": ["词句段运用读下面的词语，你想到了什么画面？"], "tasks": [], "newchars": ["第二单元"]}, {"grade": "四年级", "term": "上册", "no": 13, "book": "四年级上册", "unit_no": 2, "unit_name": "第二单元", "title": "我的家人", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 30, "chars": 325, "paras": ["家人与我们朝夕相处，是这个世界上我们最熟悉、最亲近、最信赖的人。你一定很了解自己的家人，他们有什么特点呢？", "习  作可以选择一个家人来写，也可以选择家中的几个人来写，结合具体事例写出家人的特点，注意把印象最深的地方写出来。", "写好了读给同桌听，看看有没有不通顺的句子。回家读给家人听，请他们评评写得像不像。", "我奶奶脾气特别好，总是笑眯眯的。她还特别会做好吃的，我最喜欢吃奶奶做的饭。", "我爸爸是卡车司机，工作很忙。不过，他一有空就给我们讲故事，他很会讲故事。", "我妹妹今年四岁。", "她很淘气，也很聪明。", "我妈妈酷爱运动。跑步、跳绳、打羽毛球……她对各种运动都充满了热情，还经常带我和妹妹一起锻炼身体。", "我姥爷已经退休了，他每天练习书法，一年三百六十五天从不间断，非常有毅力。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 14, "book": "四年级上册", "unit_no": 2, "unit_name": "第二单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 31, "chars": 621, "paras": ["冈—纲（提纲）奏—揍（挨揍）秀—锈（生锈）末—沫（泡沫）宗—综（综合）羊—氧（氧气）长—账（结账）广—矿（矿物）具—俱（俱乐部）识字加油站纲锈揍综账矿俱氧沫阅读时，你会主动提出问题吗？学了本单元，你有哪些体会？"], "tasks": [], "newchars": ["第三单元"]}, {"grade": "四年级", "term": "上册", "no": 21, "book": "四年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "爱护眼睛，保护视力", "section": "口语交际", "domain": "writing", "genre": "口语交际", "author": null, "dynasty": null, "page": 43, "chars": 197, "paras": ["眼睛是心灵的窗户，它很脆弱，容易受到伤害。平时，你注意爱护自己的眼睛吗？有没有不良的用眼习惯？", "让我们开展一次活动。先了解本班同学的视力情况；然后分小组对班里同学的视力情况和影响视力的原因进行分析，并交流如何保护视力；最后，全班讨论怎样才能保护好视力，提出保护视力的建议。", "◎ 小组讨论时，注意说话的音量，避免干扰其他小组。", "◎ 不重复别人说过的话。如果想法接近，可以先表示认同，再继续补充。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 22, "book": "四年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "写观察日记", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 44, "chars": 293, "paras": ["月亮有时圆圆的，有时弯弯的，我要观察月亮变化的过程。", "秋天到了，有的树叶开始变色了，我要记录树叶颜色的变化。", "我在花盆里种了几粒种子，我要观察种子发芽的过程。", "我要观察家里养的小猫的生活习性。", "观察日记，主要记录观察对象的变化，还可以记下观察的过程，以及观察者当时的想法和心情，如果能附上图画或照片就更好了。", "整理观察日记，在小组内分享。评一评，谁观察得细致，内容写得准确、丰富。", "叶圣陶经过一段时间的观察，了解了爬山虎向上爬的秘密；法布尔观察了很久，终于看到了蟋蟀筑巢的全过程；比安基用日记的形式，记下了燕子筑巢及孵蛋的情况。我们也可以选择一个对象进行连续观察，用观察日记记录自己的收获。", "习  作"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 23, "book": "四年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 45, "chars": 787, "paras": ["词句段运用连一连，为下面的动物找到家。", "狗          鼠          牛          猪          马          鱼          鸟          虎塘          洞          穴          圈          窝          棚          巢          厩我发现“鸟窝”也可以叫“鸟巢”。", "你观察过哪些事物？是怎样观察的？学了本单元，你对观察有了哪些新的认识？"], "tasks": [], "newchars": ["第四单元"]}, {"grade": "四年级", "term": "上册", "no": 28, "book": "四年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "过一天", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 56, "chars": 245, "paras": ["我和我们读过很多故事，里面的人物各有特点：有的本领高强、爱憎分明，如哪吒、葫芦娃；有的机智聪明、惩恶扬善，如神笔马良；有的美丽纯洁、温柔善良，如白雪公主。你了解他们吗？喜欢他们吗？你还喜欢哪些人物呢？", "如果有机会和他们中的某一位一起度过一天，你会选择谁？你们会去哪里？会做些什么？会发生什么故事呢？", "把自己的想法和小组同学说一说，再写下来。写完后，听听同学的意见，认真修改，工整地誊写下来，还可以在适当的地方插入自己绘制的图片。", "习  作我想跟你去龙宫看看。", "我想和你去打妖怪。", "跟我去参加运动会吧。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 29, "book": "四年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 57, "chars": 438, "paras": ["花卉玫瑰牡丹花蕾茉莉海棠识字加油站卉瑰玫丹茉莉棠蕾牡我还认识其他花，会写它们的名字。", "你对神话有哪些了解？结合读过的神话，"], "tasks": [], "newchars": ["绘"]}, {"grade": "四年级", "term": "上册", "no": 31, "book": "四年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "很久很久以前", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 59, "chars": 662, "paras": ["你读过吗远古的时候，人们饱受疾病之苦。为了治病救人，神农亲自试吃各种植物，来确定它们的药性。据说他的身体是透明的，吃了植物之后，可以看到植物在他身体里的反应。他试吃的植物太多了，经常中毒，最多的时候，一天之内中毒竟达七十次。幸亏他有神性，才不致死亡。后来，他获得了一根神奇的红色鞭子，无论什么植物，只要用这根鞭子一抽，立刻就能够显示出它的药性。神农根据各种植物的药性来治疗人们的疾病。因此，神农又被称为医药之神。相传我国第一部药学著作《本草经》就是神农所作。", "我们的祖先对世界的许多问题都抱有强烈的好奇心，如，世界是如何起源的，人类是怎样产生的，他们尝试着用神话的方式给出解释，塑造了许多神和英雄，依靠口头讲述使其代代相传。", "神农尝百草是我国著名的神话，展现了先人的开拓精神。让我们阅读更多的中国神话，感受神话永恒的魅力。", "相信你可以读更多世界各地也流传着多姿多彩的神话传说。在这些充满想象的故事中，有许多鲜明的人物形象：古希腊神话中勇敢的大力士赫拉克勒斯，用音乐征服草木万物的俄耳甫斯；永远挂着迷人微笑的北欧光明之神巴德尔，爱恶作剧的火神洛基；还有敢捉弄北风的美洲辛格比……这些人物形象至今仍然熠熠生辉。", "世界神话传说中藏着无穷无尽的奥秘，你读得越多，收获就越多，赶快开始吧！", "远古时候，人们认为神话是真实而神圣的，一定要在严肃的仪式上郑重地讲出来。", "神话通常气魄宏大，读的时候要发挥想象，感受其中的神奇，读后可以与他人交流自己的阅读感受。", "我手写我心，彩笔绘生活。", "第五单元◎ 了解作者是怎样把事情写清楚的。", "◎ 写一件事，把事情写清楚。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 34, "book": "四年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "生活万花筒", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 68, "chars": 203, "paras": ["习  作每天都会发生各种各样的事情，有些是我们亲身经历的，有些是我们看到的，还有些是我们听说的。", "选一件你印象深的事，按一定的顺序把这件事写清楚。可以参考下面的题目，也可以另选要写的内容。", "写之前，仔细想想这件事的起因、经过、结果是怎样的。", "事情起因经过结果写完后，读给同学听，请同学说说这件事是否写清楚了，再参考同学的建议修改。", "捉蚊趣事一件烦心事她收到了礼物爷爷戒烟了照片里的温暖家庭风波教室里的掌声窗外的故事"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 35, "book": "四年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "我家的杏熟了", "section": "例文", "domain": "writing", "genre": "例文", "author": null, "dynasty": null, "page": 69, "chars": 721, "paras": ["我家院子里有一棵大杏树。每年到了麦收时节，树上就结满了金黄的杏。从我家门前路过的人，总要望望那棵杏树，羡慕地说道：“嗬，好杏啊！”", "杏树是奶奶亲手栽的，听奶奶说栽杏树的时候还没有我呢。有一回，我依偎在奶奶的怀里问她：“奶奶，咱们家树上的杏有多少个？”", "“就像天上的星星一样，多得数不清。要不，你数数看。”", "我仰着头数起来，“一、二、三……”，数啊，数啊，数到后来就糊涂了。奶奶忍不住笑了。我不知道奶奶是笑我傻，还是笑杏多。", "这一年，杏又熟了。有一天，奶奶正在做饭，忽然听见有孩子在哭。奶奶急忙走出去，原来是邻居家的小淘淘嘴馋摘杏，不小心从树上摔下来了。和他一起来的小伙伴见了奶奶都低下了头，不敢吱声。我没好气地说：“看我奶奶怎么收拾你们！”", "奶奶走过去扶起小淘淘，给他揉揉腿，看他没伤着，就站起身往屋里走，又回过头来对孩子们说：“你们先别走。”", "开头通过“说杏”“数杏”，介绍了杏好、杏多。", "交代了事情的起因。", "过了一会儿，奶奶拿了一根长竹竿从屋里出来了。她走到树下，挑熟了的杏往下打。她脚底下站不大稳，身子颤颤巍巍的。", "杏一个接一个落在地上。奶奶把它们捡起来，不一会儿就捡了一围裙。奶奶把小淘淘和他的伙伴都叫了过来，一人分给五六个，剩下的几个给了我。", "看他们吃得那样香甜，奶奶嘴角露出了微笑，转过头对我说：“要记住，杏熟了，让乡亲们都尝个鲜，果子大家吃，才真的香甜呢！”", "听了奶奶的话，我点了点头。从那以后，我每年都照着奶奶的嘱咐，把熟透了的金黄金黄的杏分给小伙伴们吃，也送给邻居叔叔婶子们尝鲜。", "课文写了一件什么事？是怎么把这件事写清楚的？", "奶奶“ 打杏”“捡杏”“分杏”的动作、语言写得很清楚。", "结尾交代了这件事对“我”的影响。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 36, "book": "四年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "小木船", "section": "例文", "domain": "writing", "genre": "例文", "author": null, "dynasty": null, "page": 71, "chars": 911, "paras": ["每当我看见珍藏在抽屉里的那只精致的小木船，就想起陈明来。", "上小学一年级的时候，陈明和我是同班同学。", "我们两家离得很近。每天我们一起上学，回家，一起温习功课。我们成了形影不离的好朋友，一直到四年级。", "有一天，发生了一件不愉快的事。我们俩温习完功课，把自己在舰模小组做的小木船拿出来玩。", "我见他那只做得很精致，就拿在手上，翻过来掉过去地看，总舍不得放下。不料我一失手，啪的一声，小木船掉在地上，摔坏了。他一看，急了，哭着要我赔。我上前分辩说：“我不是故意的。”他生气地说：“谁叫你不小心，非赔不可！”还用力推了我一下。我往后一退，正好一脚踩在小木船上，把它踩碎了。这一下，陈明更生气了。他拿起我的小木船，使劲摔在地上，用脚踩了两下，一把抓起书包，头也不回地走了。看着被他踩坏的小木船，我也气得说不出话来。我们的友谊从此破裂了。", "事情是围绕“小木船”来写的。", "简单介绍陈明和“我”是好朋友。", "友谊破裂的过程写得很清楚。", "转眼几个月过去了。有一天放学回家，我走在前面，陈明走在后面。我偷偷地回头看了他一眼，他右手插在裤兜里，裤兜胀得鼓鼓的，不知手里攥着什么。忽然，他几步追上了我，从裤兜里掏出一只精致的小木船来。我惊讶地望着他。他满脸通红，激动地说：“那次是我不好，不该弄坏你的船。明天我家就要搬走了，我做了这只船送给你，留个纪念吧！”说着，他把小木船塞到我手里。想想那天发生的事，本来是我的错，望着他那双热情的眼睛，我一句话也说不出来，只是紧紧地握住他的手。", "陈明跟着爸爸妈妈搬到外地去了。从那以后，我们俩再也没有见过面。我把他送给我的小木船珍藏在抽屉里。一看见这只精致的小木船，我就好像看见陈明站在我的面前。", "“我”和陈明的矛盾持续了很长一段时间，课文只用“转眼几个月过去了”一句话加以交代，你认为这样写有没有把事情写清楚？"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 40, "book": "四年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "我是小小讲解员", "section": "口语交际", "domain": "writing", "genre": "口语交际", "author": null, "dynasty": null, "page": 82, "chars": 401, "paras": ["这段时间，我们对中国的世界文化遗产进行了深入的了解，有了很多收获。现在，假设你在一个展览上担任讲解员，要为大家介绍一项中国的世界文化遗产，应该怎么做呢？", "讲解前，需要对前期收集的相关资料进行整理，确定要讲的内容。怎样整理资料呢？"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 41, "book": "四年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "中国的世界文化遗产", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 83, "chars": 255, "paras": ["中国的世界文化遗产凝结着我国劳动人民的聪明才智，是中国人民的骄傲，更是人类文明的瑰宝。在前面学习的基础上，选择一项中国的世界文化遗产写下来。写的时候注意：◇  将整理后的资料用自己的话写下来，也可以引用别人的话，但要写明资料来源。"], "tasks": [], "newchars": []}, {"gra genre": "习作", "author": null, "dynasty": null, "page": 118, "chars": 251, "paras": ["我的“自画像”假如你们班来了一位新班主任，他想尽快熟悉班里的同学。", "请以“我的‘自画像’”为题，向班主任介绍自己，让他更好地了解你。", "写之前想一想：◇  你的外貌有什么特点？"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "下册", "no": 66, "book": "四年级下册", "unit_no": 8, "unit_name": "第八单元", "title": "习作：故事新编", "section": "阅读", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 134, "chars": 370, "paras": ["故事新编你一定知道《龟兔赛跑》的故事吧？如果让你重新编一个龟兔赛跑的故事，你会怎么编呢？", "先设想一下故事的结局：新编故事是不是特别有趣？我们也来写一写吧！可以新编《龟兔赛跑》，也可以另选一个熟悉的故事，如《狐假虎威》《坐井观天》《狐狸和乌鸦》，创编新故事。", "编完后，可以配上插图，把习作贴在教室的墙报上，大家一起分享这些有趣的故事。", "假如我们选“乌龟又赢了”这个结局，可以想象新的故事情节，如：◇  乌龟和兔子都赢了。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 4, "book": "五年级上册", "unit_no": 1, "unit_name": "第一单元", "title": "制定班级公约", "section": "口语交际", "domain": "writing", "genre": "口语交际", "author": null, "dynasty": null, "page": 9, "chars": 320, "paras": ["俗话说：“没有规矩，不成方圆。”班级公约是同学们共同制定、认可的规则。制定班级公约，可以营造良好的学习环境，建设团结友爱的班集体。", "◎ 发言时要控制时间。", "◎ 讨论后作小结，既总结大家的共同意见，也说明不同意见。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 5, "book": "五年级上册", "unit_no": 1, "unit_name": "第一单元", "title": "我的心爱之物", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 10, "chars": 241, "paras": ["每个人都有自己钟爱的东西，像琦君笔下故乡的桂花，冯骥才眼中可爱的珍珠鸟。你的心爱之物是什么？", "是你最爱的玩具小熊，还是你亲手制作的陶罐？", "是你养了三年的绿毛龟，还是你在海滩上拾到的贝壳？", "是爸爸奖励你的旱冰鞋，还是妈妈在寒冷冬夜为你赶织的围巾？", "是好朋友转学时送你的风铃，还是你参加比赛获得的奖杯？"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 6, "book": "五年级上册", "unit_no": 1, "unit_name": "第一单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 11, "chars": 690, "paras": ["本单元的课文中，作者借助具体事物抒发了真挚的情感或表达了深刻的思考。联系读过的同类文章，如《牛和鹅》，说一说你是怎样体会这类文章表达的思想感情的。"], "tasks": [], "newchars": ["第二单元"]}, {"grade": "五年级", "term": "上册", "no": 11, "book": "五年级上册", "unit_no": 2, "unit_name": "第二单元", "title": "“漫画”老师", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 30, "chars": 233, "paras": ["你喜欢看漫画吗？漫画常常以独特的画风突显人物特点，给人们留下深刻的印象。", "如果要给一位老师画漫画，你会选择谁呢？", "是总爱穿裙子，说话像放连珠炮的语文老师？", "是整天笑眯眯，走路像一阵风的数学老师？", "还是上课时“怪招”迭出，课后和同学们打成一片的体育老师？", "让我们把这些可爱的老师用文字“画”出来吧！", "先想想你的老师在外貌、性格、喜好等方面有什么突出的特点，再选择一两件能突出其特点的事情来写。", "写完后，可以读给你写的老师听，问问他对你的习作有什么意见或建议，再进行修改。", "习  作"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 12, "book": "五年级上册", "unit_no": 2, "unit_name": "第二单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 31, "chars": 705, "paras": ["学习了本单元，你在提高阅读速度方面有哪些收获？和同学一起，整理一份“提高阅读速度方法清单”，再交流运用这些方法时的体会。"], "tasks": [], "newchars": ["第三单元"]}, {"grade": "五年级", "term": "上册", "no": 16, "book": "五年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "讲民间故事", "section": "口语交际", "domain": "writing", "genre": "口语交际", "author": null, "dynasty": null, "page": 45, "chars": 358, "paras": ["民间故事语言平实，情节生动，深受人们的喜爱。除了《猎人海力布》《牛郎织女》，你还知道哪些民间故事？让我们来开个民间故事会吧。", "为了把故事讲得生动、有吸引力，你可以试试下面的方法。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 17, "book": "五年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "故事新编", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 46, "chars": 375, "paras": ["你一定知道《龟兔赛跑》的故事吧？如果让你重新编一个龟兔赛跑的故事，你会怎么编呢？", "先设想一下故事的结局：新编故事是不是特别有趣？我们也来写一写吧！可以新编《龟兔赛跑》，也可以另选一个熟悉的故事，如《狐假虎威》《漏》，创编新故事。", "编完后，把习作誊抄下来，可以配上插图贴在教室的墙报上，大家一起分享这些有趣的故事。", "假如我们选“乌龟又赢了”这个结局，可以想象新的故事情节，如：◇  新增了一段下坡路，乌龟头一缩迅速滚下  （赛道变化）◇  突然下起一场大雨，兔子怕淋雨躲了起来，乌龟冒雨前行（天气变化）◇  河流挡道  撞上树桩  掉进陷阱  （路遇不测）◇  跑反方向  误以为这回比谁跑得慢  （急中出错）◇  路过一片萝卜地，看到了水灵灵的萝卜  （遇到诱惑）◇  乌龟和兔子都赢了。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 18, "book": "五年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": "林杰七夕", "dynasty": null, "page": 47, "chars": 682, "paras": ["回顾本单元课文以及你知道的其他民间故事，说说它们有哪些共同特点。", "词句段运用读一读，体会左右两组词语在表达效果上的不同。它们分别适合在什么情况下使用？选择一两个说一说。", "鼻子都气歪了气急败坏前怕狼后怕虎畏首畏尾盼星星盼月亮望眼欲穿打开天窗说亮话直言不讳吃水不忘挖井人饮水思源民间故事的语言都比较口语化。", "很多民间故事都反映了老百姓对美满家庭的期待，对安居乐业的渴望，如《牛郎织女》《一幅壮锦》。", "民间故事中常有一些不可思议的情节，如，《猎人海力布》中的小白蛇居然是龙王的女儿。", "乞  巧[唐] 林杰七夕今宵看碧霄，牵牛织女渡河桥。", "家家乞巧望秋月，穿尽红丝几万条。", "日积月累仿照下面的例子，把牛郎织女初次见面的情节说得更具体。", "一只狼看见小羊在溪边饮水，想找借口把他吃掉。狼指责小羊把水弄脏了，小羊说自己在下游，不可能弄脏上游的水。狼又说小羊去年骂过他，小羊说那时自己还没有出生。狼恼羞成怒地说：“即使你辩解得再好，我也不会放过你。”于是，他就把小羊吃了。", "狼来到小溪边，看见小羊在那儿喝水。狼非常想吃小羊，就故意找碴儿，说：“你把我喝的水弄脏了！你安的什么心？” 小羊吃了一惊，温和地说：“我怎么会把您喝的水弄脏呢？您站在上游，水是从您那儿流到我这儿来的，不是从我这儿流到您那儿去的。” 狼气冲冲地说：“就算这样吧，你也还是个坏家伙！我听说，去年你在背地里说我的坏话！” 可怜的小羊喊道：“啊，亲爱的狼先生，那是不可能的，去年我还没有出生啊！”狼不想再争辩了，龇着牙，逼近小羊，大声嚷道：“你这个坏蛋！说我坏话的不是你，就是你爸爸，反正都一样。”说着就往小羊身上扑去，吃掉了小羊。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 20, "book": "五年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "从前有座山​", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 49, "chars": 993, "paras": ["从前有座山从前有座山，山里有座庙，庙里有个老和尚在给小和尚讲故事。", "讲的是什么故事呢？", "从前有座山……", "在你很小的时候，爷爷奶奶也许就给你讲过这个故事。像这样耳熟能详的民间故事还有很多，我们一起找来读一读吧。", "你读过吗《田螺姑娘》《梁山伯与祝英台》《八仙过海》……它们都是我国民间故事中的经典篇目。人们将对美好生活的期盼，化成了一个个民间故事。你讲，我听；我讲，他听。就这样口耳相传，直到今天仍旧吸引着我们。", "从前，有个年轻人，独自种着几亩田过活。他每天天还没亮就起床，吃完了早饭，就带了午饭到田里去耕作，直到太阳落山的时候，他才回家自己做晚饭吃。衣服脏了自己洗，鞋袜破了就自己缝缝补补。", "有一天，他到田里去耕作，捡回来一个大田螺。那是一个青艳艳像宝玉一样的田螺，他舍不得吃，就养在灶头旁边的水缸里。水缸里的水变得特别清，看不到一点儿污泥。", "第二天晚上，年轻人从田里耕作回来，一进门，就看见灶上热气腾腾的，屋子里也收拾得干干净净、整整齐齐。他揭开锅盖一看，饭做好了，菜也做好了。他感到很奇怪……", "他把这情形告诉了隔壁的老太太。老太太说：“ 一定是田螺姑娘帮了你的忙。”", "以上是中国民间故事《田螺姑娘》的片段。阅读我国的民间故事，你不仅能领略动人的情节，还能认识许多精彩的人物，如机智的徐文长、聪慧的巧姑。", "相信你可以读更多民间故事存在于世界上的每一个角落。", "欧洲各国的民间故事精彩纷呈。你可以跟随小牧羊人，踏上寻找三只会唱歌的苹果的旅途；你可以听到伊凡与灰额猫、山羊、绵羊在聊天；你还可以看到狡猾又幽默的列那狐是如何捉弄其他动物的，那些故事一定会让你捧腹大笑。", "在遥远的非洲大地，大家会在闲暇的时候，让一个人领唱优美的故事，听众则伴以合唱。鳄鱼幻想着晒太阳就能长出翅膀，大象被人类逼迫着逃离家乡却仍然坚持回乡……这些意味深远的民间故事就这样口耳相传，代代传诵。", "让我们一起阅读这些故事，感受世界各地的别样风情。", "民间故事往往寄托着人们朴素的愿望：正义却弱小的主人公有可能打败强大的对手；心地善良的穷苦人通过努力可以丰衣足食，过上幸福的生活……", "作为一种口头艺术，民间故事一般有特定的主题类型和重复的段落，这是为了方便讲述者记忆，同时加深听众的印象。", "为什么我的眼里常含泪水？", "因为我对这土地爱得深沉……", "—艾青心怀家国天下，感悟责任担当。", "◎  结合资料，深入体会文章表达的思想感情。", "◎  学习列提纲，理清习作思路。"], "tasks": [], "newchars": ["第四单元"]}, {"grade": "五年级", "term": "上册", "no": 28, "book": "五年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "二十年后的家乡", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 62, "chars": 335, "paras": ["每个人都有自己的家乡，那是我们生长的地方。二十年后我们的家乡会是什么样的呢？让我们来一次时空穿越，到二十年后的家乡去看一看。", "首先要大胆想象，二十年后的家乡会发生什么巨变。如，环境有什么变化？人们的工作、生活有什么变化？", "然后参考下面的例子，把想象到的场景或者事件梳理一下，列一个习作提纲，把思路理清楚。", "按照自己编写的习作提纲，分段叙述，把重点部分写具体。", "写完后，跟同学互换习作，提出修改建议，再参考同学的建议认真修改习作。", "习作提纲题目：二十年后的家乡开头：穿越到二十年后，看到了我的家乡。", "中间：1. 环境的变化：山更绿了，水更清了。", "2. 工作的变化：机器人在照料果园。", "3. 生活的变化：遇到老同学开着3D打印的汽车去郊游。", "结尾：表达我对二十年后家乡生活的向往之情。", "习  作"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 29, "book": "五年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 63, "chars": 645, "paras": ["百余年来，中华儿女肩负责任，勇担使命，为祖国的建设和发展作出了卓越贡献，如地质学家李四光、数学家华罗庚、核物理学家邓稼先、杂交水稻育种专家袁隆平、药学家屠呦呦、党的好干部焦裕禄、小岗村“大包干”带头人。查阅这些杰出人物的故事，结合本单元课文说说你对“责任”有哪些新的认识和理解。", "阅读时，遇到理解有困难、想继续了解或需要进一步验证的内容，可以试着查找资料来解决。结合本单元课文的学习，"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 32, "book": "五年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "介绍一种事物", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 71, "chars": 320, "paras": ["可以选择表格中的题目，也可以自拟题目，介绍一种事物。", "写之前，细致观察要写的事物，也可以搜集相关资料，进一步了解这个事物，想清楚从哪几方面来介绍。", "写的时候注意以下几点：◇ 写清楚事物的主要特点。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 33, "book": "五年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "鲸", "section": "例文", "domain": "writing", "genre": "例文", "author": null, "dynasty": null, "page": 72, "chars": 991, "paras": ["不少人看到过象，都说象是很大的动物。其实还有比象大得多的动物，那就是鲸。目前已知最大的鲸重量超过一百七十吨。我国发现过一头近四十吨重的鲸，约十八米长，一条舌头就有十几头大肥猪那么重。它要是张开嘴，人站在它嘴里，举起手来还摸不到它的上腭，四个人围着桌子坐在它的嘴里看书，还显得很宽敞。", "鲸生活在海洋里，因为体形像鱼，许多人管它叫鲸鱼。", "其实它不属于鱼类，而是哺乳动物。在很远的古代，鲸的祖先跟牛羊的祖先一样，生活在陆地上。后来环境发生了变化，鲸的祖先迁徙到靠近陆地的浅海里。又经过了很长很长的时间，它们的前肢和尾巴渐渐变成了鳍，后肢完全退化了，整个身子成了鱼的样子，适应了海洋的生活。", "鲸的种类很多，总的来说可以分为两大类：一类是须鲸，没有牙齿；一类是齿鲸，有锋利的牙齿。", "鲸吃什么呢？须鲸主要吃虾和小鱼。它们在海洋里游的时候，张着大嘴，把许多小鱼小虾连同海水一齐吸进嘴里，然后闭上嘴，把海水从须板中间滤出来，把小鱼小虾吞进肚子里，有的一顿就可以吃两吨多。齿鲸主要以乌贼、鱼类为食，有的还能捕食大鱼和海兽。它们遇到大鱼和海兽，就凶猛地扑上去，用锋利的牙齿撕咬，很快就吃掉了。有一种号称“海中之虎”的虎鲸，常常好几十头结成一群，围住一头三十多吨重的长须鲸，几个小时就能把它吃光。", "通过作比较、列数字，鲸的庞大就具体可感了。", "“近四十吨重”“约十八米长”，表述非常严谨。", "这段话分别介绍了须鲸和齿型和捕食方式。", "鲸跟牛羊一样用肺呼吸，这也说明它不属于鱼类。", "鲸的鼻孔长在脑袋顶上，呼气的时候浮出海面，从鼻孔喷出来的气形成一股水柱，就像花园里的喷泉一样；等肺里吸足了气，再潜入水中。鲸每隔一段时间必须呼吸一次。不同种类的鲸喷出的气形成的水柱也不一样：须鲸的水柱是垂直的，又细又高；齿鲸的水柱是倾斜的，又粗又矮。有经验的人根据水柱的形状，就能判断出鲸的种类和大小。", "鲸每天都要睡觉，睡觉的时候，总是几头聚在一起。", "它们通常会找一个比较安全的地方，头朝里，尾巴向外，围成一圈，静静地浮在海面上。如果听到什么声响，它们立即四散游开。", "鲸是胎生的，幼鲸靠吃母鲸的奶长大，这些特征也说明鲸是哺乳动物。长须鲸刚生下来就有六米多长，一两吨重，两三年就可以长成大鲸。鲸的寿命很长，一般可以活几十年，有的甚至能活近一百年。", "很形象地写出了鲸的呼吸。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 34, "book": "五年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "风向袋的制作", "section": "例文", "domain": "writing", "genre": "例文", "author": null, "dynasty": null, "page": 74, "chars": 649, "paras": ["风无影无形，我们怎样才能知道它是从哪个方向吹来的呢？可以借助一些容易随风飘动的物体，比如风向袋，根据它飘动的方向判断风向。", "制作风向袋可以分为下面几个步骤：第一，准备竹竿、细铁丝、粗铁丝、尖嘴钳、尼龙纱巾（或其他较轻的纺织品）、塑料绳、针线等材料和工具。", "第二，缝制口袋。用尼龙纱巾缝一个圆锥形口袋，袋口直径约10厘米，袋长40~50厘米。用细铁丝做一个和袋口一样大小的圆圈，用针线把细铁丝固定在袋口处，把袋口撑开。", "第三，剪下4根长约10厘米的塑料绳，在袋口边缘分别扎4个小洞。将4根塑料绳的一头分别穿过4个小洞，绑在铁丝圈上，另一头绑在一起，打一个结实的绳结。", "第四，拿一根细铁丝，在离竹竿顶端10厘米处缠2~3圈，不要缠太紧，做一个可以在竹竿上自由滑动的细铁丝圈。离细铁丝圈上下各1~2厘米处，用尖嘴钳把粗铁丝在竹竿上紧紧缠绕3~4圈，这样细铁丝圈就只能在缠紧的粗铁丝圈之间上下滑动。再剪下一根15厘米长的塑料绳，一头绑在之前打好的绳结上，另一头绑在竹竿的细铁丝圈上，把口袋系在竹竿上。", "将竹竿固定在空旷的场地上，在观察前确认东西南北的准确方位。当风向袋随风飘动时，观察它飘动的方向。", "风向袋飘动的反方向就是风向。"], "tasks": [], "newchars": ["第六单元"]}, {"grade": "五年级", "term": "上册", "no": 38, "book": "五年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "父母之爱​", "section": "口语交际", "domain": "writing", "genre": "口语交际", "author": null, "dynasty": null, "page": 87, "chars": 312, "paras": ["◎ 选择恰当的材料支持自己的观点。", "◎ 尊重别人的观点，对别人的发言给予积极回应。", "父母之爱天下所有的父母都爱自己的孩子，从孩子呱呱坠地的那天起，他们就倾注了自己无私的爱。但父母们表达爱的方式不尽相同。", "小勇的学习成绩忽高忽低，考得不好时，爸爸会严厉批评他。批评完之后，爸爸对小勇说：“我们爱你，所以才这么严格要求你。”", "小雅的妈妈每天帮她收拾房间，整理书包，还陪她写作业。有一次，妈妈连续几天不在家，小雅不是忘了带文具盒，就是忘了带作业本，自己的房间也是乱七八糟的。", "小敏的爸爸晚上经常和他一起下象棋，周末还带他出去看电影或爬山。", "你怎么看待以上事例中爸爸妈妈的做法？在生活中遇到类似的事情时，你是怎么想的，又是怎么做的？"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 39, "book": "五年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "我想对您说", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 88, "chars": 385, "paras": ["你和爸爸妈妈可能是无话不说的好朋友，也可能平时你与他们的交流并不多。让我们借这次习作的机会，把平时想对他们说的话写下来，与他们真心“交谈”。", "和他们说些什么呢？"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 40, "book": "五年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 89, "chars": 789, "paras": ["阅读本单元课文时，我们体会到父母子女之间血浓于水的情感。这份情感蕴藏在细节中，需要用心品味。梳理课文中感人至深的细节，"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 47, "book": "五年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "我最喜爱的季节", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 98, "chars": 278, "paras": ["习  作春夏秋冬在我们身边更替，不一样的季节，有不一样的景物。早春的柳芽，盛夏的蝉鸣，深秋的明月，初冬的瑞雪……它们构成了一幅幅自然画卷，形成了一道道独特、迷人的风景，你感受到了吗？", "你最喜爱的是什么季节？把你认为这个季节最美的景物写下来，表达出自己的喜爱之情。", "写之前认真观察自己选择的景物，把观察所得记录下来。可以直接观察景物，也可以借助图片、视频等观察。", "写的时候注意突出景物的特点。可以通过所看、所听、所想等，多角度描写景物，再根据所写景物的特点自拟题目。", "写好后读一读，看看是否写出了这个季节景物的特点，是否写出了自己的喜爱之情，对不满意的地方进行修改。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 48, "book": "五年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 99, "chars": 535, "paras": ["本单元的课文充满了自然生趣，语言也让人回味无穷。仔细品味语言，有助于我们深入理解文章内容，感受语言艺术的魅力。你会用哪些方法品味语言？填写下面的思维导图，再结合课文内容"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 52, "book": "五年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "推荐一本书​", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 111, "chars": 324, "paras": ["习  作推荐一本书读一本好书如同交一个好朋友。把读过的好书推荐给同学，就像把好朋友介绍给他们一样。", "推荐的时候，要介绍这本书的书名、作者、出版社等基本信息。重点写推荐这本书的理由，如，内容新奇有趣，语言优美生动，情节曲折离奇，人物个性鲜明，思想给人启迪。", "写的时候注意以下几个方面：◇ 推荐理由可以只写一点，也可以写几点。注意分段写。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 53, "book": "五年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 112, "chars": 843, "paras": ["举办一次“读书方法分享会”，先说说自己了解到的读书方法，再"], "tasks": [], "newchars": ["书写提示"]}, {"grade": "五年级", "term": "下册", "no": 10, "book": "五年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "习作：那一刻，我长大了", "section": "阅读", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 14, "chars": 298, "paras": ["那一刻，我长大了翻阅影集、日记……回忆自己成长的历程，有没有某一个时刻、某一件事情让你突然觉得自己长大了？"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 16, "book": "五年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "口语交际：怎么表演课本剧", "section": "阅读", "domain": "writing", "genre": "口语交际", "author": null, "dynasty": null, "page": 35, "chars": 359, "paras": ["怎么表演课本剧漫长悠久的岁月，大千世界的风景，性格迥异的人物，各具特色的故事，都可以浓缩在课本剧中。在那里，我们可以尽情展示自己，重现课文中精彩的情节。", "分小组讨论怎么表演课本剧，可以讨论以下内容：选课文分角色怎么演◇ 学过的课文中，哪一篇适合演课本剧。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 17, "book": "五年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "习作：写读后感", "section": "阅读", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 36, "chars": 348, "paras": ["习  作写读后感我们读一篇文章或一本书，往往会有自己的感想。有时一些人物会给你留下很深的印象，如安徒生童话中的小人鱼；有时一些情形会让你受到触动，如《祖父的园子》中“我”跟着祖父学种菜的温馨情景；有时文字中蕴含的道理会让你深受启发，如《铁杵成针》揭示的做事要有恒心的道理。把读一篇文章或一本书的感想写下来，就是读后感。", "选择读过的一篇文章或一本书，写一篇读后感。先简单介绍一下文章或书的内容，可以重点介绍你印象最深的部分。再选择一两处你感触最深的内容，写出自己的感想，感想要真实、具体。可以联系自己的阅读积累和生活经验，也可以引用原文中的个别语句。", "题目可以是“读《×××》有感”或“《×××》读后感”，也可以将它作为副标题，再自拟主标题。写完后读一读，看看有没有把自己的感想表达清楚，再"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 42, "book": "五年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "习作：形形色色的人", "section": "阅读", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 82, "chars": 357, "paras": ["形形色色的人我们每天都会接触到形形色色的人：小区里锻炼身体的爷爷奶奶，学校里的老师、同学，还有上学时遇到的公交车司机、维持秩序的交通警察……选择一个人写下来，运用本单元学过的描写人物的方法，具体地表现人物的特点。", "题目自拟。", "写的时候，要选取典型的事例，如：写完后，"], "tasks": [], "newchars": ["第六单元"]}, {"grade": "五年级", "term": "下册", "no": 46, "book": "五年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "习作：神奇的探险之旅", "section": "阅读", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 89, "chars": 360, "paras": ["准备好了吗？快开始我们的探险之旅吧！", "写的时候要展开丰富合理的想象，把遇到的困境、求生的方法写具体，如果能把心情的变化写出来就更好了。", "写完后，认真修改自己的习作。", "经验丰富的探险爱好者好奇心强、性格活泼的妹妹知识渊博的生物学家胆子大但行事鲁莽的表哥见多识广的向导心细而胆小的同学神奇的探险之旅你喜欢探险吗？你读过有关探险的书吗？这次习作就让我们编一个惊险刺激的探险故事吧。", "你希望和谁一同去探险？从下面两列人物中各选一个，和你一起组成一支探险小队。", "人物你想去哪儿探险？打算带上哪些装备？可能会遇到什么险情？下面的提示供你参考：如果有兴趣，可以续编你的探险故事。", "习  作场景茫茫大漠、热带雨林、海中荒岛、幽深洞穴、南极冰川……", "装备指南针、地图、饮用水、食物、药品、帐篷……", "险情遭遇猛兽、暴雨来袭、突发疾病、断水断粮、落石雪崩……"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 53, "book": "五年级下册", "unit_no": 7, "unit_name": "第七单元", "title": "口语交际：我是小小讲解员", "section": "阅读", "domain": "writing", "genre": "口语交际", "author": null, "dynasty": null, "page": 103, "chars": 369, "paras": ["我是小小讲解员学校来了客人，需要你讲解校园里有代表性的地方；亲友到你家做客，需要你介绍一下周边的环境；暑假开始了，博物馆需要汉字文化讲解员， 社区征集志愿者介绍垃圾分类知识……选择一个情境，做一名小小讲解员。", "先确定好要讲解什么，再搜集相关的资料。如果有条件，可以实地看一看。根据了解到的信息列一个提纲，自己试着讲一讲。还可以做一些小卡片，标注要讲的关键信息。", "怎么作讲解◇ 讲解的时候，条理要清楚，语气、语速要适当，可以用动作、表情辅助讲解。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 54, "book": "五年级下册", "unit_no": 7, "unit_name": "第七单元", "title": "习作：中国的世界文化遗产", "section": "阅读", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 104, "chars": 322, "paras": ["中国的世界文化遗产你游览过宏伟的北京故宫吗？你知道美丽的敦煌莫高窟吗？你对秦始皇陵兵马俑感兴趣吗？这些令中国人骄傲的世界文化遗产，凝结着我们祖先的汗水和智慧。", "从中国的世界文化遗产中，选择一处你感兴趣的介绍给别人。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 59, "book": "五年级下册", "unit_no": 8, "unit_name": "第八单元", "title": "口语交际：我们都来讲笑话", "section": "阅读", "domain": "writing", "genre": "口语交际", "author": null, "dynasty": null, "page": 115, "chars": 236, "paras": ["◎ 避免不良的口语习惯。", "◎ 用心倾听，做一个好的听众。", "我们都来讲笑话笑话给我们带来快乐，让我们都来讲笑话吧。", "收集一些笑话，可以是从报纸、杂志上看到的，也可以是从别人那里听到的。准备的笑话内容要积极向上。", "讲笑话要注意什么呢？"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 60, "book": "五年级下册", "unit_no": 8, "unit_name": "第八单元", "title": "习作：漫画的启示", "section": "阅读", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 116, "chars": 259, "paras": ["漫画的启示漫画往往意味深长，能引发我们的思考。你能读懂下面这两幅漫画吗？从中获得了什么启示？", "这次习作，让我们写一写从漫画中获得的启示。可以从上面两幅漫画中选择一幅来写，也可以写其他漫画。写的时候注意以下几点：写完后，同学互换习作读一读，看看从漫画中获得的启示是不是写清楚了，再根据同学的建议修改。"], "tasks": [], "newchars": ["待业啄木鸟"]}, {"grade": "六年级", "term": "上册", "no": 7, "book": "六年级上册", "unit_no": 1, "unit_name": "第一单元", "title": "变形记", "section": "习作", "domain": "writing", "genre": "古诗", "author": null, "dynasty": null, "page": 10, "chars": 386, "paras": ["本单元课文运用了丰富的联想和想象，读来很有趣味。如果让你来想象自己变成另一种事物，会发生什么呢？", "你可以变得很小，如一只蚂蚁，一棵草，一粒石子；也可以变得很大，如一头大象，一辆汽车，甚至是一个星球。", "变形后，你生活的世界将随之发生改变。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 8, "book": "六年级上册", "unit_no": 1, "unit_name": "第一单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 11, "chars": 618, "paras": ["课文中的大自然有声有色，趣味无穷。从本单元课文或其他描绘自然的诗文中，选择一篇朗读，读出对自然的情感。如果有条件，也可以在班里开展一次朗诵活动。", "阅读的时候想开去，可以深化对文章内容的理解，还可以活跃思维、激发创造力。阅读本单元课文的时候，你想到了什么？"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 13, "book": "六年级上册", "unit_no": 2, "unit_name": "第二单元", "title": "演讲", "section": "口语交际", "domain": "writing", "genre": "口语交际", "author": null, "dynasty": null, "page": 27, "chars": 317, "paras": ["根据演讲的内容拟定一个题目，如“祖国，我为你自豪”“拒食野味，从我做起”“远离垃圾食品，关注身体健康”。", "作演讲需要先写演讲稿。写演讲稿要注意些什么呢？"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 14, "book": "六年级上册", "unit_no": 2, "unit_name": "第二单元", "title": "多彩的活动", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 28, "chars": 228, "paras": ["“祖国在我心中”朗诵会、学校运动会、“六一”儿童节演出，田间劳动、端午节看赛龙舟、看望孤寡老人……这些校内外活动，你参加过哪些？", "习  作选一次活动写下来，和同学分享你的经历。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 15, "book": "六年级上册", "unit_no": 2, "unit_name": "第二单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 29, "chars": 732, "paras": ["新中国成立前后，为了国家的安宁和富强，革命志士们前赴后继、无私无畏，在中国革命史上谱写了壮丽的篇章。把本单元课文题目按事件发生的先后顺序填在时间轴上，也可以补充其他革命题材的作品，和同学一起重温那段可歌可泣的革命岁月。", "本单元的课文写到了大的场面，如狼牙山上的激烈战斗、开国大典中的阅兵式。课文在写这些场面时，运用了点面结合的方法。如，《开国大典》写阅兵式时，既从整体上写了受阅部队经过天安门广场时那种整齐威武的情景，又注意通过细节展现各个方阵的风采。平时的阅读中，你是否读到过这样的场面描写？"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 19, "book": "六年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "让生活更美好", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 46, "chars": 279, "paras": ["结合自己的生活体验，完成这次习作。从上面的“运动”“旅行”等话题中选一个写，也可以写其他话题。写之前想一想它是怎么影响你的生活的，为什么让你觉得生活更美好。写的时候注意把原因写具体。", "如果有条件，开展一次“共享美好生活”主题班会，共同分享各自的心得体会。", "听听音乐，唱唱歌，会让我放松、开心。", "我想到的是微笑。", "爸爸妈妈的微笑，老师的微笑，陌生人的微笑，都让我感到温暖。", "微笑诚信梦想创意科技种花旅行运动你有没有想过，什么让你的生活更美好？", "科技的发展给我们的生活带来了极大便利。现在去爷爷奶奶家，坐高铁比以前快两个小时；妈妈买菜时扫二维码支付，非常方便、快捷。", "习  作"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 20, "book": "六年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 47, "chars": 713, "paras": ["生活中，常常需要根据目的进行阅读。结合本单元的学习，"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 24, "book": "六年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "请你支持我", "section": "口语交际", "domain": "writing", "genre": "口语交际", "author": null, "dynasty": null, "page": 63, "chars": 385, "paras": ["有时候，我们需要说服别人支持我们做一件事情。", "假如现在你要去找老师，希望他同意在班里举办一次“小说推荐”主题活动。想一想：应该怎么跟老师交流呢？"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 25, "book": "六年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "笔尖流出的故事", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 64, "chars": 327, "paras": ["本单元学习的几篇课文都是小说，读起来却像在生活中发生过一样，因为这些虚构的故事都能从生活中找到影子。", "虚构的故事往往情节曲折，有比较鲜明的人物形象，读来比较吸引人。", "下面提供了三组环境和人物，从中选择一组或自己创设一组，展开丰富的想象，创编故事。", "写的时候注意：◇  故事要围绕主要人物展开。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 26, "book": "六年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 65, "chars": 672, "paras": ["桑娜把两个孤儿抱回家，宁可自己受苦也要照顾他们，可见她很善良。", "关注情节借助环境描写把自己想象成小说中的人物感受人物形象古典小说《三国演义》塑造了诸多鲜明的人物形象，其中许多情节对突出人物形象起了很好的作用，如，“长坂桥张飞退曹军”就是一个经典情节。朗读下面的片段，读出张飞的神勇。", "张飞睁圆环眼，隐隐见后军青罗伞盖、旄钺旌旗来到，料得是曹操心疑，亲自来看。飞乃厉声大喝曰：“我乃燕人张翼德也！谁敢与我决一死战？”声如巨雷。曹军闻之，尽皆股栗。", "本单元的三篇小说都写了主人公面临困境时的抉择与表现。"], "tasks": [], "newchars": ["日积月累"]}, {"grade": "六年级", "term": "上册", "no": 28, "book": "六年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "笑与泪，经历与成长", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 67, "chars": 1066, "paras": ["我们从出生起，就踏上了成长之旅。很多作家的作品讲述了我们同龄人的成长故事。他们的生活，有欢笑和喜悦，也有磨难和痛苦。这些或甜或苦的经历，教他们一步步向前，勇敢地面对未来。", "你读过吗《童年》是苏联作家高尔基的小说。故事的主人公阿廖沙在父亲病逝后，随母亲投奔外祖父。外祖父粗野自私，经常毒打孩子，曾把阿廖沙打得失去知觉。除了脾气暴躁的外祖父，这个家庭里还有两个为争夺财产整日争吵、打架的舅舅。阿廖沙经常惊惧不安，还好有慈祥善良的外祖母安慰他、保护他。", "那时我病得很重，刚能勉强起身。我清楚地记得，我病着的时候，开始是父亲开开心心地照顾着我，后来他突然不见了，照顾我的人换成了外祖母，一个很奇怪的人。", "“你从哪儿过来啊？”我问她。", "她回答：“从上面来，从下城来，不是过来，是坐船来！人怎么能自己从水上过来呢，真是个小迷糊！”", "这真可笑，又是上又是下的，让人糊涂。上面，楼上住的是几个染了大胡子的波斯人，而地下室住了一个卖羊皮的黄皮肤卡尔梅克老头。", "下楼梯可以从扶手上滑下去，要是摔倒的话就滚下去，这我一清二楚。", "可是这关水什么事？简直都乱套了。", "“我怎么就迷糊呢？”", "“因为你吵得人迷糊啊。”她说完也笑了起来。", "——选自苏联高尔基的《童年》，黄玫译。", "《童年》以孩子的视角来讲述故事，给这个充满伤痛的故事蒙上了一层天真烂漫的色彩。", "外祖母的爱仿佛黑暗中的明灯，照亮了阿廖沙的心。除了外祖母，善良、乐观、富于同情心的“小茨冈”，忠厚老实的老工人格里高利，献身于科学的知识分子“好事儿”，以及阿廖沙遇到的其他许许多多好人，都让他感受到了人世间的温暖和美好，让他面对苦难依然保持对生活的勇气和信心。", "相信你可以读更多成长的故事各不相同，却同样带给我们感动。", "我们知道小英雄雨来的故事，雨来为掩护交通员被鬼子抓住后机智逃脱了。《小英雄雨来》这本书还写了雨来给八路军送鸡毛信，和小伙伴们制造假地雷迷惑敌人、为八路军站岗放哨……在抗日战争中，雨来不断成长，完成了多项重要任务，最终如愿参加了游击队。", "精彩的成长故事还有很多，让我们找来读一读，"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 31, "book": "六年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "围绕中心意思写", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 77, "chars": 213, "paras": ["习  作课文《盼》围绕“盼”字，写出了“我”的种种表现。选择一个你感受最深的汉字写一篇习作，可以从下面的字里选，也可以选其他的字。可以写生活中发生过的事情，也可以写想象故事。", "想清楚自己要表达的中心意思。注意围绕中心意思，选择合适的材料来写。", "写之前，可以拟个提纲，看看选择的材料是不是能够表达中心意思，想想哪部分内容应该具体写。写完后，请同学读读，看看他能不能体会到你写的中心意思。", "可以用你选的字作为题目，也可以另外拟一个题目。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 32, "book": "六年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "爸爸的计划", "section": "例文", "domain": "writing", "genre": "例文", "author": null, "dynasty": null, "page": 78, "chars": 471, "paras": ["我爸爸是一个工厂的计划科科长，擅长订计划。在家里，他也给我们订了计划。妈妈有学习电子技术的计划，外婆有学习烹调的计划，我有作息计划、复习功课计划，他自己有读书计划、读报计划、做家务计划，每个人还有如何订计划的计划、如何督促各人执行计划的计划……", "爸爸执行计划一丝不苟。比如他的家务计划规定，每天定时开关气窗，他就照章办事，到了关气窗的时间，哪怕外面打雷下雨，雨水打湿了窗帘，打湿了写字台上他正在拟订的计划，他也是先关气窗后关门窗。又如按照他的计划，全家人九点休息，时钟敲过九下，爸爸便大声宣布：“今天各项计划都已胜利完成，最后一项计划开始——睡觉！”", "在爸爸的计划之下，我能有自己的计划吗？", "晚上，爸爸的钥匙响过一连串的“交响乐”后，他便对我说：“烽烽，你要放暑假了，我们订一个暑假计划吧！”", "一到订计划的时候，爸爸便眉飞色舞。“七时起床，八时做语文作业，九时读外语，十时……”他每写上一条，我就像又被猛抽了一下的陀螺，晕头转向。", "罗列爸爸给每个人订的计划，突出了爸爸爱订计划的特点。", "两个典型的事例，让人印象深刻。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 33, "book": "六年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "小站", "section": "例文", "domain": "writing", "genre": "例文", "author": null, "dynasty": null, "page": 79, "chars": 892, "paras": ["望着那长长的计划，我试探地问：“爸爸，这计划中是不是加一条游泳啊什么的……”", "“什么？”爸爸仿佛不认识我似的瞪了我好一会儿，“我订的计划是最最全面的。你看，午睡、吃饭、休息，什么都有了。”于是爸爸又订了一个如何执行计划的计划：作业由他亲自检查，午睡、吃饭由外婆监督。", "订暑假计划这个事例，写得很具体。", "可以从哪些语句看出来？", "“精心设计”体现在哪里？"], "tasks": [], "newchars": ["第六单元"]}, {"grade": "六年级", "term": "上册", "no": 41, "book": "六年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "意见不同怎么办", "section": "口语交际", "domain": "writing", "genre": "古诗", "author": null, "dynasty": null, "page": 93, "chars": 444, "paras": ["对生活中的很多事情，大家的意见会有分歧，需要协商才能解决。如，遇到下面这样的情况，应该怎么办呢？", "事  例有关方面的人爆竹声声辞旧岁，银花朵朵贺新年。噼里啪啦的爆竹、五彩缤纷的烟花，给人们带来浓浓的年味和喜庆气氛， 但也给环保、安全等方面带来很多问题。是否燃放烟花爆竹，一些城市的政策不断摇摆。那么，春节到底该不该燃放烟花爆竹呢？", "普通市民消防队员环卫工人鞭炮厂工人……", "多年前，某市为了拓宽城市道路，砍掉了道路两边生长了几十年的大树。这件事引起了热议。有人认为，为拓宽城市道路，促进经济繁荣，砍树是值得的；有人认为，砍树容易栽树难，应该另想办法发展交通， 不应该砍树。到底是要路还是要树呢？", "司机交通运输局工作人员道路附近居民市政园林局局长……", "分小组，选择一则材料进行讨论。讨论时，小组成员分别选择一个角色，推想这个角色可能的想法，从角色出发阐述对这个问题的看法。听到不同意见，要换位思考，积极沟通。", "◎ 准确把握别人的观点，不曲解，不断章取义。", "◎ 尊重不同意见，讨论问题时态度要平和，以理服人。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 42, "book": "六年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "学写倡议书", "section": "习作", "domain": "writing", "genre": "古诗", "author": null, "dynasty": null, "page": 94, "chars": 506, "paras": ["如果你有一个想法希望得到大家的支持，并一起实施，可以写一份倡议书。如，呼吁同学节约用水、合理使用一次性用品，建议家人朋友低碳出行、杜绝餐饮浪费，倡议居民分类投放垃圾。读读下面的倡议书，"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 43, "book": "六年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 95, "chars": 991, "paras": ["人与自然和谐共生，需要我们从自身做起，从点滴做起。想想自己哪些事情做得比较好，以后还可以做哪些事情，用简洁的语言概括出来，列一个行动清单，"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 49, "book": "六年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "插上科学的翅膀飞", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 106, "chars": 191, "paras": ["习  作想象一下，如果大脑能直接从书上拷贝知识，如果人能在火星上生活，如果你能用时光机穿越时空回到恐龙时代……会发生些什么？", "让我们写一个科幻故事，将头脑中的想象记录下来。", "写之前大胆设想：在你的笔下，人物的生活环境会是怎样的？他们有什么奇特经历，可能运用哪些不可思议的科学技术？放飞想象，让你的故事把读者带进一个神奇的科幻世界。", "写好以后"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 50, "book": "六年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 107, "chars": 957, "paras": ["崇尚真知，勇于探索创新，文明才能不断演进，世界才能更加美好。你也有过探索求知的经历吧？讲给大家听，可以讲有趣的探索故事，也可以讲思考、探索的过程。", "我们学过多种把握文章主要内容的方法，梳理一下，"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 55, "book": "六年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "传承好家风", "section": "习作", "domain": "writing", "genre": "习作", "author": null, "dynasty": null, "page": 123, "chars": 426, "paras": ["从《我的伯父鲁迅先生》中，我们读到了家人眼中的鲁迅、家庭生活中的鲁迅，也看到了这个大家庭的优良家风：重视读书、爱憎分明、乐于助人等。家风是一个家庭的立家之本、幸福之源，也是良好社会风气的重要基石。", "一句话、一件事……点点滴滴都能体现出优良的家风。", "关于你家的家风，你想到了什么？可以和家人交流一下，然后以家风为主题，选择有代表性的事例写下来。题目自拟。", "写完后，读给家人听，参考他们的意见改一改。", "习  作“家和万事兴。”在爸爸的影响下，我知道晚辈要尊敬长辈。每天离家时我会跟爷爷奶奶道别，平时我会注意说话温和、有礼貌，为他们做一些力所能及的事。", "我们家人都很爱整洁。“黎明即起，洒扫庭除，要内外整洁”，这是爷爷常说的一句话。他每天都要扫地擦桌子。我们全家人经常一起大扫除，家里始终都很干净、舒适。", "妈妈经常跟我们说，做事要将心比心，多为他人着想。", "有一回去商场，妈妈给身后的陌生奶奶扶着门，一直等她进门后才松开手。我也会注意从这样的小事做起，多向别人伸出援助之手。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 56, "book": "六年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "语文园地", "section": "习作", "domain": "writing", "genre": "语文园地", "author": null, "dynasty": null, "page": 124, "chars": 680, "paras": ["人物卡片鲁  迅基本信息代表作品名言摘录人物印象……", "深入了解一位作家，可以读他的作品，也可以读别人写他的文章。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 57, "book": "六年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "写字表", "section": "习作", "domain": "writing", "genre": "附录", "author": null, "dynasty": null, "page": 126, "chars": 235, "paras": ["写  字  表勒吟骏鞭裳蹄腐貌拘稍缀窥紫潇雅檐浊拙簇遮恍德暮旷鹊蝉稻律蒙丸崖渡索贯棋悬斩截沸砸雹昂豪迈政府宾宣拂阅率榴辆嗓哑蔽趴伪摧幕搜蔓液缩熄凛搏傻棍裁筹橡雕泰屏禁蹲谜猜尚析效轨谓斑萎燥漠黎疯淌盯肆伍揪呻膛废塌妻娜唉僵淋嘿糟霉嘛惨熬盏豫副倚制插聚愣漆堡枪编篷嫌瓦柜嘻嚷锅酱唇蹦帘裹薄篮渺资滥胁福涯牵莺苔仓聪置悦施谐拦添怖愉蟋蟀郑拜偷租厨毡羞爹猬伶俐搁萍藻漾焰削缕晕骤撕坠剩（共180个字）"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 58, "book": "六年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "词语表", "section": "习作", "domain": "writing", "genre": "附录", "author": null, "dynasty": null, "page": 128, "chars": 905, "paras": ["词  语  表柔美  勾勒  境界  惊叹  低吟  奇丽  骏马回味  洒脱  衣裳  疾驰  静寂  礼貌  拘束回敬宅院  潇洒  幽雅  伏案  轻灵  浑浊  笨拙参差  遮掩  文思  如同  何以  恰如  恍然顺心奋战  险要  沉着  全神贯注  崎岖  横七竖八悬崖  斩钉截铁  热血沸腾  居高临下  粉身碎骨眺望  昂首  豪迈  气壮山河政府  汇集  爆发  排山倒海  庄严  宣告  欢跃雄壮  肃立  飘拂
