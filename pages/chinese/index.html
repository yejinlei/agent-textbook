把尾巴借给我行吗？”老牛说：“不行啊，我要用尾巴赶蝇子呢。”", "小壁虎爬呀爬，爬到房檐下。他看见燕子摆着尾巴，在空中飞来飞去。小壁虎说：“燕子阿姨，您把尾巴借给我行吗？”燕子说：“不行啊，我要用尾巴掌握方向呢。”", "小壁虎借不到尾巴，心里很难过。他爬呀爬，爬回家里找妈妈。", "小壁虎把借尾巴的事告诉了妈妈。妈妈笑着说：“傻孩子，你转过身子看看。”小壁虎转身一看，高兴得叫了起来：“我长出一条新尾巴啦！”", "我还知道其他动物尾巴的用处呢！", "说一说：小壁虎都找谁借过尾巴？结果怎么样？", "分角色"], "tasks": [], "newchars": ["草草行行赶赶找找向向边边过过壁借咬难哪爬您拨赶摆过孩转"]}, {"grade": "二年级", "term": "上册", "no": 1, "book": "二年级上册", "unit_no": 1, "unit_name": "第一单元", "title": "小蝌蚪找妈妈", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 1, "chars": 491, "paras": ["小蝌蚪游哇游，过了几天，长出了两条前腿。他们看见一只乌龟摆动着四条腿在水里游，连忙追上去，叫着：“ 妈妈，妈妈！” 乌龟笑着说：“ 我不是你们的妈妈。你们的妈妈头顶上有两只大眼睛，披着绿衣裳。你们到那边去找吧！”", "小蝌蚪游哇游，过了几天，尾巴变短了。他们游到荷花旁边，看见荷叶上蹲着一只大青蛙，披着碧绿的衣裳，露着雪白的肚皮，鼓着一对大眼睛。", "小蝌蚪游过去，叫着：“ 妈妈，妈妈！”", "青蛙妈妈低头一看，笑着说：“ 好孩子，你们已经长成青蛙了，快跳上来吧！” 他们后腿一蹬，向前一跳，蹦到了荷叶上。", "不知什么时候，小青蛙的尾巴已经不见了。他们跟着妈妈，天天去捉害虫。", "蝌蚪脑袋灰甩活腿教迎嘴龟披蹲肚鼓两两条条那那孩孩成成短短哪哪宽宽分角色"], "tasks": [], "newchars": []}, {"grade": "二年级", "term": "上册", "no": 2, "book": "二年级上册", "unit_no": 1, "unit_name": "第一单元", "title": "我是什么", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 5, "chars": 624, "paras": ["我是什么我会变。太阳一晒，我就变成汽。升到天空，我又变成无数极小极小的点儿②，连成一片，在空中飘浮。有时候我穿着白衣服，有时候我穿着黑衣服，早晨和傍晚我又把红袍披在身上。人们叫我“ 云”。", "我在空中越升越高，体温越来越低，变成了无数小水滴。小水滴聚在一起落下来，人们叫我“ 雨”。有时候我变成小硬球打下来，人们就叫我“ 冰雹”。到了冬天，我变成小花朵飘下来，人们又叫我“ 雪”。", "平常我在池子里睡觉，在小溪里散步，在江河里奔跑，在海洋里跳舞，唱歌，开大会。", "有时候我很温和，有时候我却很暴躁。", "我做过许多好事，灌溉田，发动机器，帮助人们工。我也做过许多坏事，淹没庄稼，冲毁房屋，给人们带来灾害。人们想出种种办法管住我，让我光做好事，不做坏事。", "小朋友，你们猜猜：我是什么？", "升升连连洋洋许许起起海海法法汽越温滴奔海洋发坏没庄稼屋带灾种管"], "tasks": [], "newchars": []}, {"grade": "二年级", "term": "上册", "no": 3, "book": "二年级上册", "unit_no": 1, "unit_name": "第一单元", "title": "植物妈妈有办法", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 8, "chars": 384, "paras": ["孩子如果已经长大，就得告别妈妈，四海为家。", "牛马有脚，鸟有翅膀，植物旅行又用什么办法？", "蒲公英妈妈准备了降落伞，把它送给自己的娃娃。", "只要有风轻轻吹过，孩子们就乘着风纷纷出发。", "苍耳妈妈有个好办法，她给孩子穿上带刺的铠甲。", "只要挂住动物的皮毛，孩子们就能去田野、山洼。", "植物妈妈有办法石榴妈妈的胆子挺大，她不怕小鸟吃掉娃娃。", "孩子们在鸟肚子里睡上一觉，就会钻出来落户安家。", "豌豆妈妈更有办法，她让豆荚晒在太阳底下。", "啪的一声，豆荚炸开，孩子们就蹦着跳着离开妈妈。", "植物妈妈的办法很多很多，不你就仔细观察。", "那里有许许多多的知，粗心的小朋友却得不到它。", "课文介绍了哪几种植物？在课文中画出来，再说说它们是怎么传播种子的。"], "tasks": ["朗读课文。"], "newchars": ["如如已已轻轻胆胆肚肚发发经经别别果"]}, {"grade": "二年级", "term": "上册", "no": 17, "book": "二年级上册", "unit_no": 1, "unit_name": "第一单元", "title": "读读童话故事", "section": "阅读", "domain": "reading", "genre": "童话", "author": null, "dynasty": null, "page": 15, "chars": 173, "paras": ["读读童话故事来吧，插上想象的翅膀，搭上童话王国的列车，看看那里发生了什么。", "每次拿到书，我们可以先看看书的封面，找找书名和作者。看到书名，你也许会好奇这本童话书里讲了什么故事，主人公有怎样的经历。先猜猜看，再打开童话故事书，我们一起来读一读。", "每次读书时我都注意不把书弄脏，读完以后把书收好。", "我喜欢读书。我在作息时间表上列了读书时间，每天读20分钟。"], "tasks": [], "newchars": []}, {"grade": "二年级", "term": "上册", "no": 4, "book": "二年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "彩虹", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 28, "chars": 287, "paras": ["雨停了，天上出现了一座美丽的桥。", "爸爸，您浇花用的那把水壶呢？如果我提着它，走到桥上，把水洒下来，那不就是我在下雨吗？您就不用挑水去浇田了，您高兴吗？", "妈妈，您梳头用的那面镜子呢？如果我拿着它，走到桥上，天上不就多了一个月亮吗？我拿着圆圆的月亮照着您梳头，您高兴吗？", "第三单元·阅读彩虹哥哥，你系在门前树上的秋千呢？如果我把它挂在彩虹桥上，坐着秋千荡来荡去，花裙子飘啊飘的，不就成了一朵彩云吗？你看见了，高兴吗？", "虹浇壶提洒挑镜拿系荡裙丽丽提提挂挂啊啊哥哥秋秋吗吗圆圆"], "tasks": [], "newchars": []}, {"grade": "二年级", "term": "上册", "no": 5, "book": "二年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "去外婆家", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 30, "chars": 336, "paras": ["去外婆家小时候，我最大的趣就是去外婆家。", "外婆的家在山脚下。山上山下宝贝多，有吃的，有玩的，还有看的。", "有时候舅舅从山上干活回来，会带一些山楂、柿子或毛栗子，外婆总要给我留一份。", "天气好的时候，在屋后的山上玩，会看到一只只小山雀在林间欢蹦来跳去，它们是我最喜欢的宝贝。外婆告诉我，从小喂大的山雀不会逃，唧唧一叫，就飞到你手上，唱支小曲给你听。", "每到春天，外婆家屋后的山上，开满了姹紫嫣红的杜鹃花，还有许许多多说不出名的野花。舅妈出门，采几朵野花戴在头上，或者别在衣服上，走起路来香气扑鼻。", "外婆家真有趣！", "说一说外婆家带给“我”哪些乐趣。再"], "tasks": ["朗读课文。"], "newchars": ["婆候趣舅或留份喂逃曲者服扑鼻宝宝玩玩活活曲曲名名香香给给诉诉些些总总"]}, {"grade": "二年级", "term": "上册", "no": 6, "book": "二年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "数星星的孩子", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 32, "chars": 605, "paras": ["数星星的孩子① 本文选自人民教育出版社 《全日制十年制学校小学课本 （试用本）语文第三册》，有改动。", "晚上，满天的星星像无数珍珠撒在碧玉盘里。一个孩子坐在院子里，靠着奶奶，仰起头，指着天空数星星。一颗、两颗…… 一直数到了几百颗。", "奶奶笑着说：“傻孩子，又在数星星了。", "那么多星星，一闪一闪乱动，眼睛都看花了，你能数得清吗？”", "孩子说：“奶奶，能看得见，就能数得清。星星是在动，可不是乱动。您看，这颗星和那颗星，中间总是隔那么远。”", "爷爷走过来，说：“孩子，你看得很仔细。天上的星星是在动，可是看起来它们之间的距离好像是不变的。我们的祖先把它们分成一组一组的，还给起了名。” 爷爷停了停，指着北边的天空，说：“你看，那七颗星，连起来像一把勺子，叫北斗七星。勺口对着的那颗星，就是北极星。北斗七星总是绕着北极星转。” 爷爷说的话是真的吗？这孩子一夜没睡好，几次起来看星星。他看清楚了，北斗七星果然是绕着北极星转动的。", "这个数星星的孩子名叫张衡，是汉朝人。他刻苦钻研天，后来成了著名的天学家。", "珍碧靠仰颗距变祖勺绕转楚汉刻研"], "tasks": [], "newchars": ["晚晚您您数数奶奶张张变变勺勺很很爷爷汉汉"]}, {"grade": "二年级", "term": "上册", "no": 6, "book": "二年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "登鹳雀楼", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "王之涣白", "dynasty": "唐", "page": 39, "chars": 45, "paras": ["登鹳雀楼[唐]王之涣白日依山尽，黄河入海流。", "欲穷千里目，更上一层楼。", "古诗二首第四单元·阅读"], "tasks": [], "newchars": []}, {"grade": "二年级", "term": "上册", "no": 7, "book": "二年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "古诗二首", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "王之涣白", "dynasty": "唐", "page": 39, "chars": 45, "paras": ["登鹳雀楼[唐]王之涣白日依山尽，黄河入海流。", "欲穷千里目，更上一层楼。", "古诗二首第四单元·阅读"], "tasks": [], "newchars": []}, {"grade": "二年级", "term": "上册", "no": 7, "book": "二年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "望庐山瀑布", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "李白日照", "dynasty": "唐", "page": 40, "chars": 179, "paras": ["望庐山瀑布[唐]李白日照香炉生紫烟，遥看瀑布挂前川。", "飞流直下三千尺，疑是银河落九天。", "登唐依尽欲穷层瀑布炉紫烟遥"], "tasks": [], "newchars": []}, {"grade": "二年级", "term": "上册", "no": 8, "book": "二年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "黄山奇石", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 42, "chars": 564, "paras": ["中外闻名的黄山风景区在我国安徽省南部。那里景色秀丽神奇，尤其是那些怪石，有趣极了。", "就说“ 仙桃石”吧，它好像从天上飞下来的一个大桃子，落在山顶的石盘上。", "在一座陡峭的山峰上，有一只“ 猴子”。它两只胳膊抱着腿，一动不动蹲在山头，望着翻滚的云海。这就是有趣的“ 猴子观海”。", "黄山奇石联系生活，我能猜出“陡峭”的意思。", "“ 仙人指路” 就更有趣了！远远望去，那巨石真像一位仙人站在高高的山峰上，伸着手臂指向前方。", "每当太阳升起，有座山峰上的几块巨石，就变成了一只金光闪闪的雄鸡。它伸着脖子，对着天都峰不住啼叫。不用说，这就是著名的“ 金鸡叫天都” 了。", "黄山的奇石还有很多，如“ 天狗望月”“ 狮子抢球”“ 仙女弹琴”。那些叫不出名的奇形怪状的岩石，正等你去给它们起名呢！", "闻景区省秀神仙盘指巨伸都著抢状岩"], "tasks": [], "newchars": []}, {"grade": "二年级", "term": "上册", "no": 9, "book": "二年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "日月潭", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 45, "chars": 392, "paras": ["日月潭① 。", "日月潭是我国台湾省最大的一个湖，它在台湾省中部的山区。那里群山环绕，树木茂盛，周围有许多名胜古迹。", "日月潭很深，湖水碧绿。湖中央有个美丽的小岛，把湖水分成两半：北边像圆圆的太阳，叫日潭；南边像弯弯的月亮，叫月潭。", "清晨，湖面上飘着薄薄的雾。天边的晨星和山上的点点灯光，隐隐约约倒映在湖水中。", "中午，太阳高照，整个日月潭的美景和周围的建筑，都清晰展现在眼前。要是下起蒙蒙细雨，日月潭好像披上轻纱，周围的景物一片朦胧，就像童话中的仙境。", "日月潭风光秀丽，吸引了许许多多的中外游客。", "潭茂盛胜央岛隐约倒映整童吸引客"], "tasks": [], "newchars": []}, {"grade": "二年级", "term": "上册", "no": 10, "book": "二年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "葡萄沟", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 47, "chars": 576, "paras": ["新疆吐鲁番有个方叫葡萄沟，那里盛产水果。五月有桑葚，六月有杏子、无花果，到了七月份，人们最喜爱的葡萄成熟了。", "葡萄种在山坡的梯田上。茂密的枝叶向四面展开，就像搭起了一个个绿色的凉棚。", "葡萄一大串一大串挂在绿叶底下，有红的、白的、紫的、淡绿的，五光十色，美丽极了。要是这时候你到葡萄沟去，热情好客的维吾尔族老乡，准会摘下最甜的葡萄，让你吃个够。", "葡萄沟① 。", "联系上文和生活，我知道了“五光十色”的意思。", "下来的葡萄，有的运到城市去，有的运到晾房里制成葡萄干。晾房修在山坡上，四面墙上有许多小孔，里面钉着许多木架子。成串的葡萄挂在架子上，利用流动的热空气，让水分蒸发掉，就成了葡萄干。这里生产的葡萄干颜色鲜，味道甜，非常有名。", "葡萄沟真是个好方。", "种3 葡萄  好3 客  葡萄干水分为什么说“葡萄沟真是个好地方”？", "读"], "tasks": ["朗读课文，注意下面加点字的读音。"], "newchars": ["葡萄沟坡密枝淡好族够收市干钉分颜味收", "份份枝枝钉钉味味市市孔孔客客城城"]}, {"grade": "二年级", "term": "上册", "no": 11, "book": "二年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "坐井观天", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 54, "chars": 381, "paras": ["青蛙坐在井里。小鸟飞来，落在井沿上。", "青蛙问小鸟：“ 你从哪儿来呀？”", "小鸟回答说：“ 我从天上来，飞了一百多里，口渴了，下来找点儿水喝。”", "青蛙说：“ 朋友，别说大话了！天不过井口那么大，还用飞那么远吗？”", "小鸟说：“ 你弄错了。天无边无，大得很哪！”", "青蛙笑了，说：“ 朋友，我天天坐在井里，一抬头就能看见天。我不会弄错的。”", "坐井观天第五单元·阅读分角色"], "tasks": [], "newchars": ["观观呀呀抬抬能能答答话话观沿渴话弄错抬"]}, {"grade": "二年级", "term": "上册", "no": 12, "book": "二年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "寒号鸟", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 56, "chars": 667, "paras": ["山脚下有一堵石崖，崖上有一道缝，寒号鸟就把这道缝当自己的窝。石崖前面有一条河，河边有一棵大杨树，杨树上住着喜鹊。寒号鸟和喜鹊面对面住着，成了邻居。", "几阵秋风，树叶落尽，冬天要到了。", "有一天，天气晴朗。喜鹊一早飞出去，东寻西找，衔回来一些枯草，就忙着做窝，准备过冬。寒号鸟却只知道出去玩，累了就回来睡觉。喜鹊说：“ 寒号鸟，别睡了。天气暖和，赶做窝。”", "寒号鸟不听劝告，躺在崖缝里对喜鹊说：“ 傻喜鹊，不要吵。太阳高照，正好睡觉。”", "寒号鸟① 本文是民间故事，选作课文时有改动。", "冬天说到就到，寒风呼呼刮着。喜鹊住在温暖的窝里。寒号鸟在崖缝里冻得直打哆嗦，不停叫着：“ 哆啰啰，哆啰啰，寒风冻死我，明天就做窝。”", "第二天清早，风停了，太阳暖暖的，好像又是春天了。喜鹊来到崖缝前劝寒号鸟：“ 趁天晴，快做窝。现在懒惰，将来难过。”", "寒号鸟还是不听劝告，伸伸懒腰，答道：“傻喜鹊，别啰唆。天气暖和，得过且过。”", "寒冬腊月，大雪纷飞。北风像狮子一样狂吼，崖缝里冷得像冰窖。寒号鸟重复着哀号：“ 哆啰啰，哆啰啰，寒风冻死我，明天就做窝。”", "天亮了，太阳出来了，喜鹊在枝头呼唤寒号鸟。可是，寒号鸟已经在夜里冻死了。", "我在生活中也见过像喜鹊或寒号鸟这样的人。", "分角色"], "tasks": [], "newchars": ["号当鹊寻枯却劝刮死将且狂冷重复哀唤阵阵做做冰冰像像冷冷冻冻第第亮亮", "冬天快要到了冬天说到就到寒冬腊月"]}, {"grade": "二年级", "term": "上册", "no": 13, "book": "二年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "我要的是葫芦", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 60, "chars": 442, "paras": ["从前，有个人种了一棵葫芦。细长的葫芦藤上长满了绿叶，还开出了几朵雪白的小花。花谢以后，藤上挂了几个小葫芦。", "多么可爱的小葫芦啊！那个人每天都要去看几次。", "我要的是葫芦① 。", "有一天，他看见叶子上爬着一些蚜虫，心里想，有几个虫子怕什么！他盯着小葫芦自言自说：“ 我的小葫芦，快长啊，快长啊！长得赛过大南瓜才好呢！”", "一个邻居看见了，对他说：“ 你别光盯着葫芦了，叶子上生了蚜虫，快治一治吧！”", "那个人感到很奇怪，说：“ 什么？叶子上的虫还用治？我要的是葫芦。”", "没过几天，叶子上的蚜虫更多了。小葫芦慢慢变黄了，一个一个都落了。", "种种棵棵居居吧吧想想邻邻以以次次奇奇怪怪葫芦谢以盯赛怪慢"], "tasks": [], "newchars": []}, {"grade": "二年级", "term": "上册", "no": 14, "book": "二年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "八角楼上", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 67, "chars": 394, "paras": ["在井冈山艰苦斗争的年代，毛主席住在茅坪村的八角楼。每当夜幕降临的时候，八角楼上的灯就亮了。", "这是个寒冬腊月的深夜，毛主席穿着单军衣，披着薄毯子，坐在竹椅上章。他右手握着笔，左手轻轻拨了拨灯芯，灯光八角楼上① 本文选自人民教育出版社《全日制十年制学校小学课本（试用本）语文第五册》。", "、鸥洋  绘第六单元·阅读楼楼代代利利路路穿穿视视"], "tasks": [], "newchars": ["楼艰斗代临腊军薄章握凝觉油辉革命利"]}, {"grade": "二年级", "term": "上册", "no": 15, "book": "二年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "朱德的扁担", "section": "阅读", "domain": "reading", "genre": "课文", "author": "朱良才", "dynasty": null, "page": 69, "chars": 425, "paras": ["1928 年，朱德同志带领队伍到井冈山，跟毛泽东同志带领的队伍会师了。红军在山上，山下不远处就是敌人。", "红军要巩固井冈山根据，粉碎敌人的围攻，需要储备足够的粮食。井冈山上生产的粮食不多，常常要抽出一些人到山下宁冈的茅坪去挑粮。从井冈山到茅坪，来回有五六十里，山高路陡，非常难走。可是每次挑粮，大家都争着去。", "朱德同志也跟战士们一块儿去挑粮。他穿着草鞋，戴着斗笠，挑起粮食，跟大家一块儿爬山。白天挑粮爬山，晚上还常常整朱德的扁担① 本文作者朱良才（1900—1989），选作课文时有改动。", "夜整夜研究怎样跟敌人打仗。大家看了心疼，就把他那根扁担藏了起来。不料，朱德同志又找来一根扁担，写上“ 朱德的扁担”五个。", "大家见了，越发敬爱朱德同志，不好意思再藏他的扁担了。", "同同志志每每战战士士戴戴非非军军敌敌"], "tasks": [], "newchars": []}, {"grade": "二年级", "term": "上册", "no": 16, "book": "二年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "难忘的泼水节", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 72, "chars": 526, "paras": ["火红火红的凤凰花开了，傣族人民一年一度的泼水节又到了。", "1961 年的泼水节，傣族人民特别高兴，因为敬爱的周恩来总理和他们一起过泼水节。", "那天早晨，人们敲起象脚鼓，从四面八方赶来了。为了欢迎周总理，人们在上撒满了凤凰花的花瓣，好像铺上了鲜红的毯。一条条龙船驶过江面，一串串花炮升上天空。人们欢呼着：“ 周总理来了！”", "周总理身穿对襟白褂、咖啡色长裤，头上包着一条水红色头巾，笑容满面来到人群中。他接过一面象脚鼓，敲起欢的鼓难忘的泼水节① 本文选自人民教育出版社《全日制十年制学校小学课本（试用本）语文第二册》，有改动。", "点，踩着凤凰花铺成的“地毯”，同傣族人民一起跳舞。", "开始泼水了。周总理一手端着盛满清水的银碗，一手拿着柏树枝蘸了水，向人们泼洒，为人们祝福。傣族人民一边欢呼，一边向周总理泼水，祝福他健康长寿。", "清清的水，泼啊，洒啊！周总理和傣族人民笑啊，跳啊，是那么开心！", "多么幸福啊，1961 年的泼水节！", "多么令人难忘啊，1961 年的泼水节！", "泼民度特周恩敲铺龙串容踩始盛碗祝寿难难忘忘裤裤令令理理串串民民因因"], "tasks": [], "newchars": []}, {"grade": "二年级", "term": "上册", "no": 17, "book": "二年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "刘胡兰", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 75, "chars": 618, "paras": ["1947 年1 月12 日，天阴沉沉的，国民党反动派包围了云周西村。由于叛徒的出卖，年轻的共产党员刘胡兰被捕了，关在一座庙里。", "敌人问刘胡兰：“ 现在有人供出你是共产党员！你们村里还有谁是？” 刘胡兰回答：“ 就我一个！” 敌人想收买刘胡兰，对她说：“ 说出来，就给你一份。” 刘胡兰大声回答：“ 给我一个金人，我也不说！” 敌人又威胁她说：“ 不说就打死你！” 刘胡兰愤怒回答：“ 打死也不说！” 刘胡兰像钢铁铸成似的，刘胡兰① 本文选自人民教育出版社《全日制十年制学校小学课本（试用本）语文第三册》，有改动。", "一点儿也不动摇。", "敌人把刘胡兰拉到庙门口的广场上，当着她和乡亲们的面，铡死了被捕的六名革命群众。敌人指着血淋淋的铡刀说：“ 再不说，也铡死你！” 刘胡兰挺起胸膛说：“ 要杀要砍由你们，怕死不当共产党！” 她迎着呼呼的北风，踏着烈士的鲜血，走到铡刀前。刘胡兰光荣牺牲了，当时她还不到十五岁。", "毛主席听到这个消息，亲笔为她题词：“ 生的伟大，死的光荣。”"], "tasks": ["朗读课文。说说从哪些地方可以看出刘胡兰在敌人面前“一点儿也不动摇”。"], "newchars": ["刘兰派由于卖员捕买似踏烈荣岁题反反村村员员被被由由于于声声消消息息岁岁"]}, {"grade": "二年级", "t 您给我买过。”", "爸爸说：“是的，就是平常吃的米糕。你知道这糕是怎么做成的吗？”", "孩子说：“是把大米磨成粉做的，还加了糖。”", "爸爸说：“是啊，大米是用农民种的稻子加工出来的。农民种稻子需要种子、农具、肥料、水……”", "爸爸接着说：“糖呢，是用甘蔗汁或者甜菜汁熬出来的。甘蔗、甜菜也要有人种。熬糖的时候，要有工具，还得有火……就算米糕做好了，还得要人包装、送货、销售，这些又需要很多人的劳动。”", "爸爸拿起面前的糕，说：“你看，一块平平常常的糕，要经过很多很多人的劳动，才能摆在我们面前。”", "孩子听了爸爸的话，仔细想了想，说：“爸爸，这糕的确应该叫‘千人糕’啊！”", "桌桌尝尝劳劳买买甘甘具具汁汁甜甜菜菜应应"], "tasks": [], "newchars": ["糕尝嘛磨粉糖料甘蔗汁熬销售的确应"]}, {"grade": "二年级", "term": "下册", "no": 7, "book": "二年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "我不是最弱小的", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 21, "chars": 615, "paras": ["夏天的一个周末，四岁的萨沙和哥哥托利亚跟父母一起到森林中去玩。森林里的景色是那么美好，空气是那么清新。他们来到林中的一片空地。那里盛开着美丽的铃兰花。", "“看！这儿还有一朵野蔷薇呢！”大家被萨沙的叫声吸引过来。原来有一丛野蔷薇，被铃兰花簇拥着，开出了第一朵粉红色的花。带着露珠的花朵随风舞动，芬芳扑鼻。一家人坐在野蔷薇旁边，聊起天来。", "突然，雷声大作，紧接着下起了雨。妈妈赶紧从背包里拿出雨衣递给身边的托利亚，托利亚又把雨衣给了萨沙。", "萨沙不解地问：“妈妈，您和托利亚都需要雨衣呀，为什么要给我呢？”", "妈妈回答说：“我们应该保护比自己弱小的。”", "我不是最弱小的萨沙又问：“这就是说，我是最弱小的了？”", "“要是你谁也保护不了，那你就是最弱小的。”妈妈说着摸了摸萨沙的头。", "萨沙朝野蔷薇花丛走去。雨水已经打掉了两片野蔷薇花瓣，花儿无力地垂着头，显得更加娇弱。萨沙掀起雨衣，轻轻地遮在野蔷薇花上，问道：“妈妈，现在我还是最弱小的吗？”", "妈妈笑着说：“不，不，你能保护更弱小的，你是勇敢的孩子啦！”", "分角色"], "tasks": [], "newchars": ["弱弱末末勇勇吸吸芳芳母母芬芬递递周周敢敢弱末亚簇拥随芬芳突紧递摸显娇掀"]}, {"grade": "二年级", "term": "下册", "no": 13, "book": "二年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "读读儿童故事", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 28, "chars": 654, "paras": ["故事里的儿童，有的顽皮、可爱，有的懂事、善良；有的过着平淡温馨的生活，有的会有意想不到的奇遇……让我们找一些儿童故事书，一起读一读。", "读书的时候，我们可以先看看书的目录。目录告诉我们书里主要写了什么，要读的内容从哪一页开始。", "一起长大的玩具................... 3抽陀螺................................ 3兔儿爷............................. 6泥泥狗................................11脸谱......................................15快乐鸡毛..................................18曼曼钓鱼..............................22长长的街树..........................30尖尖的草帽............................ 32会飞的枯叶..........................34会走动的红玛瑙....................36放河灯的日子......................38花宴...........................................40夏天的三种快乐..................42根据目录，我可以做好读书计划，今天从第3页读到第5页，明天……", "我选书的时候，会关注目录，先读读感兴趣的内容。"], "tasks": [], "newchars": []}, {"grade": "二年级", "term": "下册", "no": 8, "book": "二年级下册", "unit_no": 4, "unit_name": "第四单元", "title": "彩色的梦", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 42, "chars": 393, "paras": ["我有一大把彩色的梦，有的长，有的圆，有的硬。", "他们躺在铅笔盒里聊天，一打开，就在白纸上跳蹦。", "脚尖滑过的地方，大块的草坪，绿了；大朵的野花，红了；大片的天空，蓝了，蓝—得—透—明！", "第四单元·阅读在葱郁的森林里，雪松们拉着手，请小鸟留下歌声。", "小屋的烟囱上，结一个苹果般的太阳，又大—又红！", "我的彩色铅笔，是大森林的精灵。", "我的彩色梦境，有水果香，有季节风，还有紫葡萄的叮咛，在溪水里流动……", "联系插图和词语“森林”，我能猜到“葱郁”的意思。", "你想用彩色铅笔画些什么？试着仿照第2小节或第3小节，把想画的内容用几句话写下来。"], "tasks": ["朗读课文，边读边想象，体会“我”对彩色梦境的喜爱。"], "newchars": ["梦梦硬硬精精流流盒盒结结灵灵铅铅森森苹苹梦躺聊蹦郁囱般精境叮咛聊"]}, {"grade": "二年级", "term": "下册", "no": 9, "book": "二年级下册", "unit_no": 4, "unit_name": "第四单元", "title": "一匹出色的马", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 45, "chars": 579, "paras": ["一个春天的傍晚，妈妈牵着妹妹，爸爸牵着我，一起到郊外去散步。我们沿着一条小河走。河水碧绿碧绿的，微风吹过，泛起层层波纹。河岸上垂下来的柳叶，拂过妈妈和爸爸的头发，我和妹妹看着都笑了。", "路的一边是田野，葱葱绿绿的，非常可爱，像一片柔软的绿毯。", "春天的郊外，景色异常美丽。我们一边看，一边走，路已经走了不少，却还恋恋不舍，不想回去。", "当我们往回走的时候，妹妹求妈妈抱她：“我很累，走不动了，抱抱我。”", "妈妈摇摇头，回答说：“不行啊，我也很累，抱不动你了。”", "妹妹转过头求爸爸。爸爸不作声，他松开我的① 。", "一匹出色的马联系生活实际，我知道了“波纹”的意思。", "手，从路旁一株柳树下，拾起一根又长又细的枝条，把它递给了妹妹，说：“这是一匹出色的马，你走不动了，就骑着它回家吧。”", "妹妹高兴地跨上“马”，蹦蹦跳跳地奔向前去，不时回头看看我们。等我们回到家时，她站在门口，骄傲地说：“看！我比你们先到家。”", "匹郊微泛波纹异恋舍求株拾骑骄傲匹匹求求波波恋恋妹妹纹纹舍舍奔奔试着有感情地"], "tasks": [], "newchars": []}, {"grade": "二年级", "term": "下册", "no": 10, "book": "二年级下册", "unit_no": 4, "unit_name": "第四单元", "title": "枫树上的喜鹊", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 48, "chars": 671, "paras": ["我们村的渡口旁有一棵枫树，我很喜欢它。它好像一把很大又很高的绿色太阳伞，一直打开着。它的绿荫遮蔽了渡口。枫树上有一个喜鹊窝，我喜欢极了。", "是的，我喜欢站在枫树下，抬头看喜鹊窝。我常常觉得喜鹊会跟我说话，我像童话书里那样，在心中称呼她喜鹊阿姨。", "我真是喜欢极了。上个星期天早上，我正要撑着渡船到对岸的树林里去打柴，发现喜鹊阿姨的窝里已经有了几只小喜鹊。", "我真是像童话书里那样，在心中称呼他们喜鹊弟弟。", "从那天起，我一有空，便来到渡口边，站在枫树① 。", "我能猜出“绿荫”的意思。", "下看望我的喜鹊弟弟。喜鹊弟弟长得真快，好极了。", "我看见喜鹊阿姨站在窝边，一会儿教喜鹊弟弟唱歌，一会儿教他们做游戏，一会儿教他们学自己发明的拼音字母……", "“鹊！鹊！鹊！”喜鹊阿姨教道。", "我知道，这便是a、o、e。", "喜鹊弟弟也跟着学：“鹊，鹊，鹊……”", "今天早上，太阳从渡口对岸的山冈后面升上来了，我看见喜鹊阿姨站在窝边，指着上升的太阳，问喜鹊弟弟：“鹊！鹊鹊鹊？”", "我懂得，她问话的意思是：“看！那是什么？”", "喜鹊弟弟一齐快乐地回答：“ 鹊！鹊鹊！鹊鹊鹊！”", "我懂得，喜鹊弟弟很快给出了答案：“妈妈，那是太阳！太阳升上来了！”", "我真高兴啊！", "旁旁阿阿姨姨便便弟弟教教渡荫蔽阿姨撑便冈懂案"], "tasks": [], "newchars": []}, {"grade": "二年级", "term": "下册", "no": 11, "book": "二年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "寓言二则", "section": "阅读", "domain": "reading", "genre": "寓言", "author": null, "dynasty": null, "page": 55, "chars": 175, "paras": ["亡羊补牢从前有个人，养了几只羊。一天早上，他去放羊，发现羊少了一只。原来羊圈破了个窟窿，夜里狼从窟窿钻进去，把羊叼走了。", "邻居劝他说：“赶紧把羊圈修一修，堵上那个窟窿吧！”", "他说：“羊已经丢了，还修羊圈干什么？”", "第二天早上，他去放羊，发现羊又少了一只。原来狼又从窟窿钻进去，把羊叼走了。", "寓言二则① 本文根据 《战国策·楚策四》相关内容改写。", "第五单元·阅读"], "tasks": [], "newchars": []}, {"grade": "二年级", "term": "下册", "no": 12, "book": "二年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "画杨桃", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 58, "chars": 676, "paras": ["有一次上图画课，老师把两个杨桃摆在讲桌上，要同学们画。我的座位在教室前排靠边的地方，讲桌上那两个杨桃的一端正对着我。", "我看到的杨桃根本不像平时看到的那样，而像是五个角的什么东西。我认认真真地看，老老实实地画，自己觉得画得很准确。", "当我把这幅画交出去的时候，班里几个同学看见了，哈哈大笑起来。", "“杨桃是这个样子的吗？”", "“倒不如说是五角星吧！”", "老师看了看这幅画，到我的座位上坐下来，审视了一下讲桌上的杨桃，然后回到讲桌前，举起我的那页画纸，问大家：“这幅画画得像不像？”", "“不像！”", "“它像什么？”", "“像五角星！”", "老师的神情变得严肃了。半晌，他又问道：“画杨桃画成了五角星，好笑吗？”", "“好——笑！”有几个同学抢着答道，同时发出嘻嘻的笑声。", "于是，老师请这几个同学轮流坐到我的座位上。", "他对第一个坐下的同学说：“现在你看看那杨桃，像你平时看到的杨桃吗？”", "“不……像。”", "“那么，像什么呢？”", "“像……五……五角星。”", "“好，下一个。”", "老师让这几个同学回到自己的座位上，然后和颜悦色地说：“大家发现了吗？看的角度不同，杨桃的样子也就不一样。当我们看见别人把杨桃画成五角星的时候，不要忙着发笑，要看看人家是从什么角度看的。”", "老师的教诲让我终生难忘。", "看到“我”画的杨桃，老师做了什么，同学们的态度发生了什么变化？用自己的话说一说。"], "tasks": ["朗读课文，注意对话的语气。"], "newchars": ["室而幅哈审肃晌嘻悦诲排排实实室室而而举"]}, {"grade": "二年级", "term": "下册", "no": 13, "book": "二年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "小马过河", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 61, "chars": 955, "paras": ["马棚里住着一匹老马和一匹小马。", "有一天，老马对小马说：“你已经长大了，能帮妈妈做点儿事吗？”小马连蹦带跳地说：“怎么不能？", "我很愿意帮您做事。”老马高兴地说：“那好啊，你把这半口袋麦子驮到磨坊去吧。”", "小马驮起口袋，飞快地往磨坊跑去。跑着跑着，一条小河挡住了去路，河水哗哗地流着。小马为难了，心想：我能不能过去呢？如果妈妈在身边，问问她该怎么办，那多好啊！可是他离家已经很远了。", "小马向四周望望，看见一头老牛在河边吃草，小马嗒嗒嗒跑过去，问道：“牛伯伯，请您告诉我，这① 。", "条河，我能蹚过去吗？”", "老牛说：“水很浅，刚没过小腿，能蹚过去。”", "小马听了老牛的话，立刻跑到河边，准备蹚过去。突然，从树上跳下一只松鼠，拦住他大叫：“小马！别过河，别过河，你会淹死的！”小马吃惊地问：“水很深吗？”松鼠认真地说：“深得很哩！昨天，我的一个伙伴就是掉在这条河里淹死的！”", "小马连忙收住脚步，不知道怎么办才好。他叹了口气，说：“唉！还是回家问问妈妈吧！”", "小马甩甩尾巴，跑回家去。妈妈问他：“怎么回来啦？”小马难为情地说：“一条河挡住了去路，我……我过不去。”妈妈说：“那条河不是很浅吗？”", "小马说：“是啊！牛伯伯也这么说。可是松鼠说河水很深，还淹死过他的伙伴呢！”妈妈说：“那么河水到底是深还是浅呢？你仔细想过他们的话吗？”小马低下了头，说：“没……没想过。”妈妈亲切地对小马说：“孩子，光听别人说，自己不动脑筋，不去试试，是不行的。河水是深是浅，你去试一试就知道了。”", "小马跑到河边，刚刚抬起前蹄，松鼠又大叫起来：“怎么？你不要命啦！”小马说：“让我试试吧！”", "他下了河，小心地蹚到了对岸。原来河水既不像老牛说的那样浅，也不像松鼠说的那样深。", "刻刻愿愿麦麦掉掉意意伯伯突突然然棚驮坊挡伯浅刚淹哩叹唉蹄既分角色"], "tasks": [], "newchars": []}, {"grade": "二年级", "term": "下册", "no": 24, "book": "二年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "亡羊补牢", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 55, "chars": 175, "paras": ["亡羊补牢从前有个人，养了几只羊。一天早上，他去放羊，发现羊少了一只。原来羊圈破了个窟窿，夜里狼从窟窿钻进去，把羊叼走了。", "邻居劝他说：“赶紧把羊圈修一修，堵上那个窟窿吧！”", "他说：“羊已经丢了，还修羊圈干什么？”", "第二天早上，他去放羊，发现羊又少了一只。原来狼又从窟窿钻进去，把羊叼走了。", "寓言二则① 本文根据 《战国策·楚策四》相关内容改写。", "第五单元·阅读"], "tasks": [], "newchars": []}, {"grade": "二年级", "term": "下册", "no": 25, "book": "二年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "揠苗助长", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 56, "chars": 435, "paras": ["他很后悔没有听邻居的劝告，心想，现在修还不晚。他赶紧堵上那个窟窿，把羊圈修得结结实实的。", "从此，他的羊再也没丢过。", "揠苗助长古时候有个人，他巴望自己田里的禾苗长得快些，天天到田边去看。可是，一天，两天，三天，禾苗好像一点儿也没有长高。他在田边焦急地转来转去，自言自语地说：“我得想个办法帮它们长。”", "一天，他终于想出了办法，就急忙跑到田里，把禾苗一棵一棵往高里拔。从中午一直忙到太阳落山，弄得筋疲力尽。", "他回到家里，一边大口喘气一边说：“今天可把我累坏了！力气总算没白费，禾苗都长高了一大截。”", "他的儿子不明白是怎么回事，第二天跑到田里一看，禾苗都枯死了。"], "tasks": ["默读课文。说说“亡羊补牢”“揠苗助长”两个成语的意思。"], "newchars": []}, {"grade": "二年级", "term": "下册", "no": 14, "book": "二年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "古诗二首", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "杜甫两个", "dynasty": "唐", "page": 69, "chars": 49, "paras": ["绝  句[唐] 杜甫两个黄鹂鸣翠柳，一行白鹭上青天。", "窗含西岭千秋雪，门泊东吴万里船。", "第六单元·阅读"], "tasks": [], "newchars": []}, {"grade": "二年级", "term": "下册", "no": 15, "book": "二年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "雷雨", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 72, "chars": 403, "paras": ["满天的乌云，黑沉沉地压下来。树上的叶子一动不动，蝉一声也不出。", "忽然一阵大风，吹得树枝乱摆。一只蜘蛛从网上垂下来，逃走了。", "闪电越来越亮，雷声越来越响。", "哗，哗，哗，雨下起来了。", "雨越下越大。往窗外望去，树啊，房子啊，都看不清了。", "渐渐地，渐渐地，雷声小了，雨声也小了。", "天亮起来了。打开窗户，清新的空气迎面扑来。", "雨停了。太阳出来了。一条彩虹挂在天空。蝉叫了。蜘蛛又坐在网上。池塘里水满了，青蛙也叫起来了。", "雷  雨① 本文选自人民教育出版社 《初级小学课本语文第四册》。", "乌乌黑黑沉沉压压响响迎迎新新扑扑压蝉蜘蛛响哗渐"], "tasks": ["背诵课文。"], "newchars": []}, {"grade": "二年级", "term": "下册", "no": 16, "book": "二年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "要是你在野外迷了路", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 74, "chars": 415, "paras": ["可千万别慌张。", "大自然有很多天然的指南针，会帮助你辨别方向。", "太阳是个忠实的向导，它在天空给你指点方向。", "中午的时候它在南边，地上的树影正指着北方。", "北极星是盏指路灯，它永远高挂在北方。", "要是你能认出它，就不会在黑夜里乱闯。", "要是碰上阴雨天，大树也会来帮忙。", "枝叶稠的一面是南方，枝叶稀的一面是北方。", "雪特别怕太阳，沟渠里的积雪会给你指点方向。", "看看哪边雪化得快，哪边化得慢，就可以分辨北方和南方。", "可千万别慌张。", "大自然有很多天然的指南针，需要你细细观察，多多去想。"], "tasks": ["朗读课文。说说课文写了哪几种“天然的指南针”，它们是怎样帮助人们辨别方向的。"], "newchars": ["针针指指帮帮南南忠忠导导特特永永夜夜积积慌针辨忠导盏永闯碰稠稀渠"]}, {"grade": "二年级", "term": "下册", "no": 17, "book": "二年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "太空生活趣事多", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 77, "chars": 590, "paras": ["17 太空生活趣事多航天员乘坐宇宙飞船飞往太空，空间站就是他们在太空的家。在太空中生活，说起来还挺有趣呢！", "在空间站里，站着睡觉和躺着睡觉一样舒服。不过，要想睡个安稳觉，航天员必须钻进固定在舱壁上的睡袋里。不然，一不小心就会飘到别处去。", "在空间站里活动也需要技巧。跟在地面上用腿脚行走不同，航天员在舱体里移动主要靠手臂。为了方便航天员在舱体中活动，舱壁上安装了很多特制的扶手。平时，航天员会依靠这些扶手或其他设施稳定自己的身体。", "在空间站里，是没有办法用普通的杯子喝水的。", "因为水处于失重状态，即使把杯子倒过来，水也不会往下流。航天员要想喝到水，得使用一种带吸管的饮水袋，直接把水挤到嘴里。", "航天员在太空中洗澡可不是一件容易的事，因为从喷头喷出的水总是飘浮在空中。为了解决这个问题，① 。", "科研人员做了一个试验。他们设计了一个密封浴桶，在下边安装吸管，它可以把喷头喷出来的水朝一个方向吸。但洗完澡以后，航天员还要花很长时间清理身体上和浴桶里的水，实在太麻烦了。所以，现在航天员通常只用免洗湿巾擦拭身体，这就简单省事多了。", "你看，在太空中生活，是不是很有趣？"], "tasks": ["朗读课文。说说太空生活有哪些有趣的事情。"], "newchars": ["宇宇浴浴宙宙或或桶桶航航宇宙稳必须固杯重态即使饮挤浴桶简"]}, {"grade": "二年级", "term": "下册", "no": 30, "book": "二年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "绝句", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "杜甫两个", "dynasty": "唐", "page": 69, "chars": 53, "paras": ["绝  句[唐] 杜甫两个黄鹂鸣翠柳，一行白鹭上青天。", "窗含西岭千秋雪，门泊东吴万里船。", "古诗二首第六单元·阅读"], "tasks": [], "newchars": []}, {"grade": "二年级", "term": "下册", "no": 31, "book": "二年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "晓出净慈寺送林子方", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "杨万里毕", "dynasty": "宋", "page": 70, "chars": 141, "paras": ["晓出净慈寺送林子方[宋] 杨万里毕竟西湖六月中，风光不与四时同。", "接天莲叶无穷碧，映日荷花别样红。"], "tasks": ["朗读课文。背诵课文。"], "newchars": []}, {"grade": "二年级", "term": "下册", "no": 18, "book": "二年级下册", "unit_no": 7, "unit_name": "第七单元", "title": "大象的耳朵", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 84, "chars": 507, "paras": ["大象有一对大耳朵，像扇子似的，耷拉着。", "这一天，大象正在路上慢慢地散步，遇到了小兔子。", "小兔子说：“咦，大象啊，你的耳朵怎么耷拉下来了？”", "大象说：“我生来就是这样啊。”", "第七单元·阅读小兔子说：“你看，我的耳朵是竖着的，你的耳朵一定是出毛病了。”", "后来，大象又遇到了小羊。小羊也说：“大象啊，你的耳朵怎么是耷拉着的呢？”", "小鹿、小马，还有小老鼠，见到了大象，都要说他的耳朵。", "大象也不安起来，他自言自语地说：“他们都这么说，是不是我的耳朵真的有毛病啦？我得让我的耳朵竖起来。”", "怎么才能让耳朵竖起来呢？", "每天，大象站着睡觉的时候，就用两根竹竿把耳朵撑起来。", "可是，大象的耳朵眼儿里，经常有小虫子飞进去，还在里面跳舞，吵得他又头痛，又心烦。"], "tasks": ["朗读课文，注意读好疑问的语气。"], "newchars": ["扇扇慢慢遇遇痛痛病病定定睡睡根根耷遇咦竖竿舞痛烦扇"]}, {"grade": "二年级", "term": "下册", "no": 19, "book": "二年级下册", "unit_no": 7, "unit_name": "第七单元", "title": "蜘蛛开店", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 87, "chars": 522, "paras": ["有一只蜘蛛，每天蹲在网上等着小飞虫落在上面，好寂寞，好无聊啊。", "蜘蛛决定开一家商店。卖什么呢？就卖口罩吧，因为口罩织起来很简单。", "于是，蜘蛛在一间小木屋外面挂了一个招牌，上面写着：“口罩编织店，每位顾客只需付一元钱。”", "顾客来了，是一只河马。河马嘴巴那么大，口罩好难织啊，蜘蛛用了一整天的工夫，终于织完了。", "晚上，蜘蛛想：还是卖围巾吧，因为围巾织起来很简单。", "第二天，蜘蛛的招牌换了，上面写着：“围巾编① 。", "织店，每位顾客只需付一元钱。”", "顾客来了，只见身子不见头。", "蜘蛛向上一看，原来是一只长颈鹿。他和大树一样高，脖子特别长，脑袋从树叶间露出来，正对着蜘蛛笑呢。", "蜘蛛织啊织，足足忙了一个星期，才织完那条长长的围巾。", "蜘蛛累得趴倒在地上，心里想：还是卖袜子吧，因为袜子织起来很简单。", "于是，蜘蛛的招牌又换了，上面写着：“袜子编织店，每位顾客只需付一元钱。”", "可是，蜘蛛看到顾客后，却吓得匆忙跑回网上。", "原来那位顾客竟是一条四十二只脚的蜈蚣！", "接下来会发生什么事？展开想象，续编故事，讲给大家听。", "蜘蛛开店卖袜子蜈蚣卖围巾卖口罩河马长颈鹿决决付付终终需 需夫夫期期店店"], "tasks": ["朗读课文。根据示意图讲一讲这个故事。"], "newchars": ["店寂寞罩牌编顾夫完脖趴袜匆蜈蚣"]}, {"grade": "二年级", "term": "下册", "no": 20, "book": "二年级下册", "unit_no": 7, "unit_name": "第七单元", "title": "青蛙卖泥塘", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 90, "chars": 823, "paras": ["青蛙住在烂泥塘里。他觉得这儿不怎么样，想把泥塘卖掉，换一些钱搬到城里住。", "于是青蛙在泥塘边竖起一块牌子，上面写着“卖泥塘”三个字。", "“卖泥塘喽，卖泥塘！”青蛙站在牌子边大声吆喝起来。一头老牛走过来，看了看泥塘，说：“这个水坑坑嘛，在里边打打滚倒挺舒服。不过，要是周围有些草就更好了。”", "老牛不想买泥塘，走了。", "青蛙想，要是在泥塘周围种些草，就能卖出去了。于是他就去采集草籽，播撒在泥塘周围的地上。", "到了春天，泥塘周围长出了绿茵茵的小草。青蛙又站在牌子旁边，大声吆喝起来：“卖泥塘喽，卖泥塘！”一只野鸭飞来了，看了看泥塘，说：“这地方好是好，就是塘里的水太少了。”", "野鸭没有买泥塘，飞走了。", "青蛙想，要是能往泥塘里引些水，就能卖出去了。于是他跑到周围的山里找到泉水，又砍了些竹子，把竹子破开，一根一根接起来，把水引到泥塘里来。", "等泥塘灌足了水以后，青蛙又站在牌子旁，大声吆喝起来：“卖泥塘喽，卖泥塘！”可是泥塘还是没有卖出去。", "小鸟飞来说，这里缺点儿树；蝴蝶飞来说，这里缺点儿花；小兔跑来说，这里还缺条路；小猴跑来说，这儿应该盖所房子；小狐狸说……每次听了小动物的话，青蛙都想：对！对！要是那样的话，泥塘准能卖出去。于是青蛙就照着他们的话去做，栽了树，种了花，修了路，还在泥塘旁边盖了房子……", "“卖泥塘喽，卖泥塘！”有一天，青蛙又站在牌子旁吆喝起来，“多好的地方！有树，有花，有草，有水塘。你可以看蝴蝶在花丛中飞舞，听小鸟在树上唱歌。你可以在水里尽情游泳，躺在草地上晒太阳。", "这儿还有道路通到城里……”青蛙说到这里，突然愣住了，他想：这么好的地方，自己住挺好的，为什么要卖掉呢？", "于是青蛙不再卖泥塘了。", "卖卖倒倒砍砍泳泳搬搬泉泉破破蛙蛙"], "tasks": [], "newchars": ["烂换搬喝坑舒集播茵砍灌缺栽泳愣"]}, {"grade": "二年级", "term": "下册", "no": 21, "book": "二年级下册", "unit_no": 7, "unit_name": "第七单元", "title": "小毛虫", "section": "阅读", "domain": "reading", "genre": "课文", "author": "是意大利的达·芬", "dynasty": null, "page": 94, "chars": 613, "paras": ["一条小毛虫趴在一片叶子上，用新奇的目光打量着周围的一切：大大小小的昆虫又是唱，又是跳，跑的跑，飞的飞……", "到处生机勃勃。只有它，这个可怜的小毛虫，既不会唱，也不会跑，更不会飞。", "小毛虫费了九牛二虎之力，才挪动了一点点。当它笨拙地从一片叶子爬到另一片叶子上时，它觉得自己仿佛周游了整个世界。", "尽管如此，它并不悲观失望，也不羡慕任何人。它懂得：每个人都有自己该做① 本文作者是意大利的达·芬奇，译者张复生，选作课文时有改动。", "的事情。它，一条小小的毛虫，眼前最要紧的是学会抽丝纺织，为自己编织一间牢固的茧屋。", "小毛虫一刻也没有迟疑，尽心竭力地工作着。它织啊，织啊，最后把自己从头到脚裹进了温暖的茧屋里。", "“以后会怎样呢？”它在与世隔绝的茧屋里问。", "“万事万物都有自己的规律！”小毛虫听到一个声音在回答，“你要耐心等待，以后会明白的。”", "时辰到了，它清醒过来，变成了一只飞蛾，再也不是以前那条笨手笨脚的小毛虫了。它灵巧地从茧子里挣脱出来，惊奇地发现自己身上生出了轻盈的翅膀，上面布满色彩斑斓的花纹。它愉快地舞动了一下翅膀，如绒毛一般，从叶子上飘然而起。它飞啊飞，渐渐地消失在蓝色的雾霭之中。", "读一读，记一记。", "生机勃勃  尽心竭力  与世隔绝笨手笨脚  色彩斑斓九牛二虎之力佛佛任任纺纺仿仿并并何何织织迟迟"], "tasks": [], "newchars": ["量昆怜另仿佛尽并任何纺竭规待醒挣愉", "茧屋飞蛾"]}, {"grade": "二年级", "term": "下册", "no": 22, "book": "二年级下册", "unit_no": 8, "unit_name": "第八单元", "title": "羿射九日", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 100, "chars": 694, "paras": ["很久很久以前，在世界最东边的海上，生长着一棵大树叫扶桑。扶桑的枝头站着一个太阳，底下还有九个太阳。每天天快亮时，扶桑枝头的太阳就坐上两轮车，开始从东往西穿过天空。十个太阳每天轮换，给大地万物带来光明和温暖。", "可是，有一天，这十个太阳觉得轮流值日太没意思啦，于是，他们一齐跑了出来，出现在天空中。十个太阳像十个大火球，炙烤着大地。", "22 羿射九日① 本文根据《山海经·海外东经》和《淮南子·本经训》相关内容改写。", "第八单元·阅读禾苗被晒枯了，土地被烤焦了，江河里的水快要蒸干了，连地上的沙石好像都要熔化了。人类的日子非常艰难。", "神箭手羿决心帮助人们脱离苦海。他翻过九十九座高山，跨过九十九条大河，来到东海边。他登上一座大山，搭上神箭，拉开神弓，对准天上的一个太阳，嗖地就是一箭。那个太阳一下子爆裂开，一团团火球到处乱窜，接着，噗噗地掉在地上。", "羿一口气射下了九个太阳，炎热渐渐退去。羿又伸手拔箭，准备射下最后一个太阳。这个太阳害怕极了，慌慌张张地躲进了大海里。", "天上没有了太阳，整个世界一片黑暗。羿想，没有了太阳，就没有了光明和温暖，庄稼不能生长，人类和动物也没法活下去，这样可不行。于是，羿留下了最后一个太阳。", "根据表格里的内容，讲一讲这个故事。", "起因经过结果十个太阳炙烤着大地，人类的日子很艰难。", "羿射下了九个太阳，留下了最后一个。", "大地上重新现出了勃勃生机。", "你觉得故事里哪些内容很神奇？"], "tasks": ["默读课文，不出声，不指读。"], "newchars": ["值值炎炎始始射射换换弓弓此此最最射桑值熔类箭翻跨搭裂窜炎滋润腾"]}, {"grade": "二年级", "term": "下册", "no": 23, "book": "二年级下册", "unit_no": 8, "unit_name": "第八单元", "title": "黄帝的传说", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 103, "chars": 748, "paras": ["黄帝的传说① 本文根据《帝王世纪》和《淮南子·说山训》相关内容改写。", "相传五六千年前，有一个部落的首领名叫轩辕。", "他有很多创造发明，深受人们爱戴。大家推举他统领部落联盟，尊称他为“黄帝”。", "造车那时候，人们出远门都得靠步行，运东西也只能依靠人力，既不方便，又很辛苦。", "有一年夏天，黄帝正在干活，忽然一阵大风刮来，把他头上的草帽吹掉了。草帽是圆的，掉到地上后向前滚出了很远。这件事给了黄帝启发。他想：如果做个架子，再装上像草帽一样能滚动的东西，就可以用来搬运物品了。于是，他号召部落民众，按照设想找来需要的材料，试了一次又一次，终于把车造了出来，样子就像现在的独轮手推车。", "后来，人们在使用过程中不断改进，发明了双轮车，又驯服了牛和马，用它们来代替人拉车，出远门、搬运东西方便多了。", "造船一个秋天的傍晚，黄帝干完了活，同大伙儿坐在河边休息。他看到水面上漂着许多树叶，其中一个叶片上有一只蚂蚁，虽然河水很深，蚂蚁却安安稳稳地在上面爬着。", "黄帝指着那片树叶，高兴地对大家说：“你们看，蚂蚁待在树叶上，就能在河里浮着不沉下去。如果造一个像树叶一样浮在水面的东西，能让人待在上面，我们就可以在水上自由来去了。”大家听了，都觉得有道理。", "第二天，他们找来一根很粗很粗的树干，把它放进河里。可是，树干是圆的，人一爬上去，它就滚动起来，人在上面根本待不住。怎么办呢？他们一起商量，终于想出了办法：把树干中间的一段挖空，人在里面，果然能坐稳了。他们又用木头做了桨，就能 一个安心孵蛋的地方。”", "老屋低头看看，墙壁吱吱呀呀地响：“哦，是老母鸡啊。好吧，我就再站二十几天。”", "二十多天后，老母鸡从门上的破洞里走了出来，九只小鸡从门板下面叽叽叫着钻了出来：“叽叽，谢谢！”", "老屋说：“再见！好了，我到了倒下的时候了！”", "我想老屋可能会不耐烦了。", "一读到这句话，我就知道，一定又有谁来请老屋帮忙了。", "“等等，老屋！”一个小极了的声音在它门前响起，不注意根本听不到，“请再站一会儿吧，我肚子好饿好饿，外面的树被砍光了，我找不到一个安心织网抓虫的地方。”", "老屋低头看看，眼睛眯成一条缝：“哦，是小蜘蛛啊。好吧，我就再站一会儿。”", "小蜘蛛飞快地爬进屋子，在屋梁上织了一张又大又漂亮的网。偶尔有虫子撞到网上，小蜘蛛马上爬过去把虫子吃掉。", "“小蜘蛛，你吃饱了吗？”老屋问。", "“没有，没有！”小蜘蛛一边忙着补网，一边回答，“老屋老屋，我给您讲个故事吧！”", "老屋想，这倒很有意思。于是它就开始听小蜘蛛讲故事。", "小蜘蛛的故事一直没讲完，因此，老屋到现在还站在那儿，边晒太阳，边听小蜘蛛讲故事。", "估计老屋不会倒了。", "老屋可能还会遇到其他需要帮助的小动物。", "我猜到了老屋会怎么回答。", "老屋给你留下了什么样的印象？联系插图和课文内容说一说。", "读课文的过程中，你猜到后面会发生什么了吗？你是怎么猜的？"], "tasks": [], "newchars": ["屋板准备等暴钻哦爬漂晒眯哦喵孵叽缝偶尔"]}, {"grade": "三年级", "term": "上册", "no": 9, "book": "三年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "犟龟", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 32, "chars": 1294, "paras": ["*犟龟这是一个美丽的早晨，阳光灿烂。乌龟陶陶正坐在她那舒适的小洞前，吃着车前草的叶子。她的头顶上，是一棵古老的橄榄树，一对鸽子正在树上谈话：狮王二十八世要举行婚礼了，他邀请所有动物前去参加庆典。狮王的宫殿路途遥远，而庆典不久就要开始，必须马上动身。两只鸽子说完就飞走了。", "陶陶听见鸽子的谈话，陷入了沉思：如果所有动物都被邀请了，当然也包括我，为什么我不去参加这有史以来最热闹的婚礼呢？", "想了整整一天一夜后，陶陶终于拿定主意，第二天一大早便上路了。她一步一步向前爬去，虽然很慢，却一直没有停下。", "路过一片荆棘丛时，陶陶遇到了蜘蛛。得知她要去参加读下面的故事，一边读一边想：接下来可能会发生什么事情？再和同学说说陶陶是一只怎样的乌龟。", "狮王的婚礼，蜘蛛哈哈大笑，巨大的蜘蛛网被笑声震得剧烈地颤动起来。", "“婚礼两周后就要举行了，你可是慢得出奇呀，怎么可能赶得上呢？”陶陶看了看自己的腿—它们虽然短小，却很结实。她满怀信心地说：“我会准时赶到那里的。”", "蜘蛛充满同情地劝她：“陶陶，我的腿不但比你的灵巧，还多一倍呢，连我都觉得路途太遥远，你还是清醒点儿，赶紧回家吧！”", "“很遗憾，我不能这样，我的决定是不可改变的。”陶陶友好地回答，又哼哧哼哧地开始赶路了。", "越过种种障碍，穿过树林和沙地，陶陶日夜不停地赶路。", "有一天，陶陶经过一个池塘，她想停下来喝口水。在一片常春藤的叶子上，一只蜗牛正瞪着双眼打量着她。陶陶客气地跟蜗牛打听去狮王二十八世的宫殿怎么走。", "蜗牛想了好一会儿，才把自己那迷迷糊糊的思绪理清楚。他难过地告诉陶陶：“太糟了！你完全走反了方向。”", "“非常感谢你给我指路！”说完，陶陶慢慢掉头往回走。", "“可是，后天就要举行婚礼了呀！”蜗牛几乎带着哭腔说。", "“只要一步一步坚持走，我会准时赶到的。”陶陶说。", "越过种种障碍，穿过树林和沙地，陶陶日夜不停地赶路。", "后来，她遇到了正躺在石头上打盹儿的壁虎。得知陶陶的来意，壁虎居高临下地打量着她说：“作为狮王王宫的高级官员，我正式通知你，婚礼暂时取消了。由于非常突然的原因，狮王二十八世不得不和老虎开战。你可以回家了。”", "在读课文的过程中你预测了哪些内容？故事还没有结束，你认为后来可能会发生什么事情？你为什么这样想？", "我在故事的很多地方作了预测。当读到蜘蛛劝说陶陶放弃参加狮王二十八世的婚礼时，联系课文题目，我就猜到陶陶不会听劝；读到蜗牛告诉陶陶完全走反了方向时，我根据生活经验预测她一定赶不上婚礼了。", "我发现“越过种种障碍，穿过树林和沙地，陶陶日夜不停地赶路”这句话在文中出现了两次，我预测后面可能还会出现很多障碍。", "《帽子的秘密》《躲猫猫大王》《夏洛的网》《团圆》《柔软的阳光》《小灵通漫游未来》读读下面这些文章的标题和书名，猜猜里面可能写了些什么。", "听老师把故事讲完，看看自己的预测和原文有哪些相同和不同。", "我预测的内容没有原文丰富，有的还与原文不一致，但是我的预测也是有依据的。", "当发现自己的预测和原文的实际内容不同时，我会及时修正自己的想法，接着猜测后面可能发生什么。"], "tasks": [], "newchars": ["陶适谈婚庆典途括史倍几持官"]}, {"grade": "三年级", "term": "上册", "no": 10, "book": "三年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "小狗学叫", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 36, "chars": 1623, "paras": ["从前，有一条不会叫的狗。它不会像狗一样叫，不会像猫一样叫，也不会像牛那样哞哞叫，更不会像马那样嘶鸣。", "它是一只孤零零的小狗，不知道怎么到了一个陌生的地方。", "它并没有发现自己有什么毛病，是别的动物让它知道，不会叫其实是一种很大的缺陷。它们对它说：“你怎么不叫？”", "“我不会……我是外来的……”", "“这算什么回答啊。你难道不知道狗是会叫的？”", "“干吗要叫？”", "“狗会叫，因为它们是狗。它们对过路的陌生人叫，对惹人讨厌的猫叫，对着满月叫。它们高兴的时候叫，紧张的时候叫，发怒的时候也叫。它们白天叫得多，但晚上也叫。”", "“也许是这样，可我……”", "“可你怎么啦？你这只狗可真特别。去，去！总有一天你会上新闻的。”", "读故事，一边读一边预测后面的内容。想一想：故事的结局可能是什么？", "*小狗不知道该怎么回答这些指责。它不会叫，也不知道怎么才能学会。", "“你跟我学。”有一次，一只同情它的小公鸡对它说。那只小公鸡喔喔喔地叫了几声。", "“我觉得很难。”小狗对小公鸡说道。", "“不难，容易极了。你好好听着，看我的嘴，注意观察，学我的样子。”", "小公鸡又喔喔喔地叫起来。", "小狗试着照小公鸡的样子做，但嘴里只发出一种滑稽的咯咯声，吓得旁边的小母鸡都逃走了。", "“ 不要紧，” 小公鸡说道，“第一次能这样就很不错了。你再试试，来！”小狗又试了一次，两次，三次，都没能成功。", "从此，它天天都练习，从早到晚偷偷地练。有时候，为了更自由，它索性到树林里去练。", "一天早晨，它在树林里练习，发出的喔喔喔的叫声是那么逼真，那么好听，那么洪亮。一只狐狸听到了，心里寻思着：公鸡终于来找我了，我得去感谢它的来访。狐狸真的去了，还没忘记带上刀叉和餐巾，因为对狐狸来说，没有比小公鸡更美味可口的午餐了。可以想象，当它看见啼叫的是一只狗而不是小公鸡时，该是多么失望啊！那只狗蹲坐着，一声又一声地喔喔叫着。", "狐狸真想哈哈大笑。它在地上打着滚，捧着肚子，竭力忍着不笑出声来。小狗感到很委屈，低着头，含着泪水默默走开了。", "附近的一只杜鹃看着小狗走过去，很同情它。", "“你怎么啦？”", "“没什么。”", "“那你为什么这样伤心？”", "“唉……没什么好说的……因为我不会叫。”", "“要是就因为这个，那我可以教你。你听我怎么叫，尽可能模仿我。咕咕……咕咕……咕咕……你听明白了吗？”", "“我觉得很容易。”", "“容易极了，我从小就会这样叫。你试试！咕咕……”", "“咕……”小狗学着杜鹃叫，“咕……”", "它那天试了，第二天、第三天又试了。一个星期过后，它已经学得相当不错了。小狗真高兴，心想：我终于会叫我能猜出小狗和狐狸会有怎样的交流。", "了，现在别人再也不能取笑我了。", "就在那几天，人们开始打猎了，树林里来了很多猎人，里面还有百发百中的神枪手。一个猎人经过那里，听见树丛中传来咕咕的叫声，就举枪瞄准，“砰！砰！”连开了两枪。", "幸好没打中。子弹擦过小狗的耳边，就像连环画里画的那样。小狗拔腿就跑。它很诧异：那个猎人准是发疯了，竟然对狗开枪！", "狗跑啊，跑啊……", "第一种结局狗跑啊，跑啊，它跑到了一片草地上，一头小母牛正在那里安详地吃草。", "“你去哪儿啊？”", "“我不知道。”", "“那你就别走了，这里的青草特别鲜嫩。”", "“唉，青草不能医治我的病……”", "“你病啦？”", "“可不是！我不会叫。”", "“可是，这是世界上最容易的事！你听我叫：哞……", "哞……哞……还有比这更好听的叫声吗？”", "第二种结局狗跑啊，跑啊，它碰上了一个农夫。", "第三种结局狗跑啊，跑啊，突然停住了，它听见一种奇怪的叫声：“汪汪，汪汪……”", "这叫声像在对我说什么，它想，尽管我搞不清这是什么动物在叫。", "“汪，汪……”", "故事的几种结局可能是怎样的？说说你的理由。然后听老师读故事的结局，看看和自己的预测有哪些相同和不同。", "你喜欢故事中的哪些内容？"], "tasks": [], "newchars": ["陌吗讨厌访记忍委屈中弹疯局汪搞"]}, {"grade": "三年级", "term": "上册", "no": 11, "book": "三年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "宝葫芦的秘密（节选）", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 46, "chars": 1249, "paras": ["宝葫芦的秘密（节选）我来给你们讲个故事。可是我先得介绍介绍我自己：我姓王，叫王葆。我要讲的，正是我自己的一件事情，是我和宝葫芦的故事。", "你们也许要问：“什么？宝葫芦？就是传说故事里的那种宝葫芦吗？”", "不错，正是那种宝葫芦。", "可是我要声明，我并不是什么神仙，也不是什么妖怪。", "我和你们一样， 是一个平平常常的普通人。你们瞧，我是一个少先队员，我也和你们一样，很爱听故事。", "至于宝葫芦的故事，那我从小就知道了。那是我奶奶讲给我听的。奶奶每逢要求我干什么，就得给我讲个故事。这是我们的规矩。", "“乖小葆，来，奶奶给你洗个脚。”奶奶总是一面撵我，一面招手。", "“我不干，我怕烫。”我总是一面溜开，一面摆手。", "“不烫啊。冷了好一会儿了。”", "“那，我怕冷。”", "奶奶撵上了我，说洗脚水刚好不烫也不冷，非洗不可。", "我只好让步。不过我有一个条件：“你爱洗就让你洗。", "你可得讲个故事。”就这么着，奶奶讲了个宝葫芦的故事。", "“好小葆，别动！”奶奶刚给我洗了脚，忽然又提出一个新的要求来，“让我给你剪一剪……”", "什么！剪脚指甲啊？那不行！我光着脚丫，一下地就跑。可是胳膊给奶奶拽住了。没有办法。", "不过我得提出我的条件：“那，非得讲故事。”于是奶奶又讲了一个—又是宝葫芦的故事。", "我就这么着，从很小的时候起，听奶奶讲故事，一直听到我十来岁。奶奶每次讲的都不一样。上次讲的是张三劈面撞见了一位神仙，得了一个宝葫芦。下次讲的是李四出去远足旅行，一游游到了龙宫，得到了一个宝葫芦。王五呢，他因为是一个好孩子，肯让奶奶给他换衣服，所以得到了一个宝葫芦。至于赵六得的一个宝葫芦—那是掘地掘出来的。", "不管张三也好，李四也好，一得到了这个宝葫芦，可就幸福极了，要什么有什么。张三想：“我要吃水蜜桃。”立刻就有一盘水蜜桃。李四希望有一条大花狗，马上就冒出了那么一条—冲着他摇尾巴，舔他的手。", "后来呢？后来不用说，他们全都过上了好日子。", "我听了这些故事，常常就联系到自己：“我要是有了一个宝葫芦，我该怎么办？我该要些什么？”", "一直到我长大了，有时候还想起它来。我有几次对着一道算术题发愣，不知道要怎么列式子，就由“8”字想到了宝葫芦—假如我有这么一个，那可就省心了。", "我和同学们比赛种向日葵，我家里的那几棵长得又瘦又长，上面顶着一个小脑袋，可怜巴巴的样儿，比谁的也比不上。我就又想到了那个宝贝：“那，我得要一棵最好最好的向日葵，长得不能再棒的向日葵。”可那只不过是幻想罢了。", "可我总还是要想到它。那一天我和科学小组的同学闹翻了，我又想到了它。“要是我有那么一个葫芦，那……”", "王葆为什么特别想要一个宝葫芦？如果你有了宝葫芦，你会用来做什么？", "选   做当王葆真的得到了宝葫芦时，他逐渐认识到靠宝葫芦不劳而获，带给他的不是幸福，而是烦恼。这是怎么回事呢？感兴趣的同学可以读读《宝葫芦的秘密》这本书。", "普少矩丫宫  掘希冲  联系葵瘦罢葫错芦普宫肯冒式怜"], "tasks": ["朗读课文。说说奶奶给王葆讲了关于宝葫芦的哪些故事，宝葫芦有什么神奇之处。"], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 12, "book": "三年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "在牛肚子里旅行", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 49, "chars": 933, "paras": ["有两只小蟋蟀，一只叫青头，另一只叫红头。它们是一对非常要好的朋友。有一天，吃过早饭，青头对红头说：“咱们玩捉迷藏吧！”", "“那让我先藏，你来找。”红头说。", "“好吧！”青头说完，转过身子闭上眼睛。", "红头向周围看了看，悄悄地躲在一个草堆里不作声了。", "“藏好了吗？”青头大声问。", "红头不说话，只露两只眼睛偷偷地看。它心想：我要是一答应，就会被青头发现。", "正在这时，一头大黄牛从红头后面慢慢走过来。红头做梦也没有想到，大黄牛突然低下头来吃草。可怜的红头还没有来得及跳开，就和草一起被大黄牛卷到嘴里了。", "“救命啊！救命啊！”红头拼命地叫起来。", "“你在哪儿？”青头急忙问。", "“我被牛吃了……正在它的嘴里……救命啊！救命啊！”", "青头大吃一惊，它一下子蹦到牛身上，可是那头牛用尾巴轻轻一扫，青头就给摔到地上了。青头不顾疼痛，一骨碌爬起来大声喊：“ 躲过它的牙齿，牛在这时候不会仔细嚼的，它会把你和草一起吞到肚子里去……”", "“那我马上就会死掉。”红头哭起来。它和草已经一起进了牛的肚子。", "青头又跳到牛身上，隔着肚皮和红头说话：“红头！不要怕，你会出来的。我听说牛的胃有四个胃室，前三个主要是储存食物的，第四个才是管消化的！”", "“可是你说这些对我有什么用呢？”红头悲哀地说。", "“当然有用。等一会儿牛休息的时候，它要把刚才吞进去的草重新送回嘴里，然后细嚼慢咽……你是勇敢的蟋蟀，你一定能出来的。”", "“谢谢你！”红头的声音小得几乎听不见了。它咬着牙不让自己失去知觉。", "红头在牛肚子里随着草一起移动，从第一个胃室到了第二个胃室，又从第二个胃室回到了牛嘴里。这一下，红头又看见了光亮。可是，它已经一动也不能动了。", "这时，青头爬到牛鼻子上，用它的身体在牛鼻孔里蹭来蹭去。", "“阿嚏！”牛打了一个喷嚏，红头随着一团草一下子给喷了出来。", "红头看见自己的朋友，高兴得流下了眼泪：“谢谢你……”", "青头笑眯眯地说：“不要哭，就当是一次在牛肚子里的旅行吧！”", "分角色"], "tasks": [], "newchars": ["咬另旅及睛卷命救尾胃齿管刚答应及卷骨碌齿嚼吞胃咽"]}, {"grade": "三年级", "term": "上册", "no": 13, "book": "三年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "一块奶酪", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 52, "chars": 756, "paras": ["蚂蚁队长集合好队伍，向大家宣布：“今天搬运粮食，只许出力，不许偷嘴。谁偷嘴就要处罚谁。”", "一只小蚂蚁在队列里嘀咕：“要是偷嘴的是您呢？”蚂蚁队长说：“照样要受处罚。”", "大家一听，都来劲了，争先恐后赶到运粮地点，抢着抬大的，搬重的，谁也不愿偷懒。", "就在这时，蚂蚁队长发现了一块大奶酪。那块奶酪实在太大了，它左抬抬不起，右搬搬不动，只好叫来七八只小蚂蚁当助手。", "奶酪多诱人啊！抬着它，不要说吃，单是闻闻，都要淌口水。小蚂蚁们嘴叼着它，要做到不趁机舔一下，那要有多大的毅力、多强的纪律性啊！", "蚂蚁队长叼着奶酪的一角往前拽着，也许是用力过猛，一下就把那个角拽掉了。盯着那一点儿掉在地上的奶酪渣，蚂蚁队长想：丢掉，实在太可惜；趁机吃掉它，又要犯不许偷嘴的禁令。怎么办呢？它的心七上八下，只好下令：① 。", "*"], "tasks": [], "newchars": ["宣处恐诱毅强纪性渣犯禁旧聚"]}, {"grade": "三年级", "term": "上册", "no": 14, "book": "三年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "搭船的鸟", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 60, "chars": 450, "paras": ["我和母亲坐着小船，到乡下外祖父家里去。我们坐在船舱里，天下着雨，雨点儿打在船篷上，沙啦沙啦地响。船夫披着蓑衣在船后用力地摇着橹。", "后来雨停了。我看见一只彩色的小鸟站在船头，多么美丽啊！它的羽毛是翠绿的，翅膀带着一些蓝色，比鹦鹉还漂亮。它还有一张红色的长嘴。", "它什么时候飞来的呢？它静悄悄地停在船头不知有多久了。它站在那里做什么呢？难道它要和我们一起坐船到外祖父家里去吗？", "读下面这段话，注意加点的词语，想象翠鸟捕鱼的情景。", "我正想着，它一下子冲3 进水里，不见了。可是，没一会儿，它飞3 起来了，红色的长嘴衔3 着一条小鱼。它站3 在船头，一口把小鱼吞3 了下去。", "我正想着，它一下子冲进水里，不见了。可是，没一会儿，它飞起来了，红色的长嘴衔着一条小鱼。它站在船头，一口把小鱼吞了下去。", "母亲告诉我，这是一只翠鸟。哦，这只翠鸟搭了我们的船，在捕鱼吃呢。"], "tasks": ["默读课文，想想作者对哪些事物作了细致观察，说说你是从哪里看出来的。"], "newchars": ["舱啦鹦鹉衔翠蓝悄吞捕静搭祖亲披摇停羽"]}, {"grade": "三年级", "term": "上册", "no": 15, "book": "三年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "金色的草地", "section": "阅读", "domain": "reading", "genre": "课文", "author": "是苏联的普里什文", "dynasty": null, "page": 62, "chars": 912, "paras": ["我们住在乡下，窗前是一大片草地。草地上长满了蒲公英。当蒲公英盛开的时候，这片草地就变成金色的了。", "我和弟弟常常在草地上玩耍。有一次，弟弟跑在我前面，我装着一本正经的样子，喊：“谢廖沙！”他回过头来，我就使劲一吹，把蒲公英的茸毛吹到他的脸上。弟弟也假装打哈欠，把蒲公英的茸毛朝我脸上吹。就这样，这些并不引人注目的蒲公英，给我们带来了不少快乐。", "有一天，我起得很早去钓鱼，发现草地并不是金色的，而是绿色的。中午回家的时候，我看见草地是金色的。傍晚的时候，草地又变绿了。这是为什么呢？我来到草地上，仔细观察，发现蒲公英的花瓣是合拢的。原来，蒲公英的花就① 本文作者是苏联的普里什文（1873—1954），译者茹香雪，选作课文时有改动。", "像我们的手掌，可以张开、合上。花朵张开时，花瓣是金色的，草地也是金色的；花朵合拢时，金色的花瓣被包住了，草地就变成绿色的了。", "多么可爱的草地！多么有趣的蒲公英！从那时起，蒲公英成了我们最喜爱的一种花。", "仔细读读第3自然段，把下面的内容补充完整，体会作者观察的细致。", "早上，草地，因为蒲公英；中午，草地，因为蒲公英；傍晚，草地，因为蒲公英。", "我们只要稍加留意，就会发现事物是变化着的。如，向日葵会随着太阳转动，含羞草被触碰后会“害羞”地低下头……你留意过哪些事物的变化？"], "tasks": ["朗读课文，一边读一边想象课文描写的情景。"], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 16, "book": "三年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "富饶的西沙群岛", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 70, "chars": 632, "paras": ["西沙群岛位于南海的西北部，是我国海南省三沙市的一部分。那里风景优美，物产丰富，是个可爱的地方。", "西沙群岛一带海水五光十色，瑰丽无比：有深蓝的，淡青的，浅绿的，杏黄的。一块块，一条条，相互交错着。因为海底高低不平，有山崖，有峡谷，海水有深有浅，从海面看，色彩就不同了。", "海底的岩石上生长着各种各样的珊瑚，有的像绽开的花朵，有的像分枝的鹿角。海参到处都是，在海底懒洋洋地蠕动。大龙虾全身披甲，划过来，划过去，样子挺威武。", "富饶的西沙群岛① 本文选自人民教育出版社《十年制学校小学课本（试用本）语文第六册》，有改动。", "鱼成群结队地在珊瑚丛中穿来穿去，好看极了。有的全身布满彩色的条纹；有的头上长着一簇红缨；有的周身像插着好些扇子，游动的时候飘飘摇摇；有的眼睛圆溜溜的，身上长满了刺，鼓起气来像皮球一样圆。各种各样的鱼多得数不清。", "正像人们说的那样，西沙群岛的海里一半是水，一半是鱼。", "西沙群岛也是鸟的天下。岛上有一片片茂密的树林，树林里栖息着各种海鸟。遍地都是鸟蛋。树下堆积着一层厚厚的鸟粪，这是非常宝贵的肥料。", "富饶的西沙群岛，是我们祖祖辈辈生活的地方。随着祖国建设事业的发展，可爱的西沙群岛，必将变得更加美丽，更加富饶。", "摄我发现这段话是围绕第一句话来写的。", "有感情地"], "tasks": [], "newchars": ["饶优崖参懒划威武插栖厚粪辈景淡优浅岩料底划茂布密厚鹿"]}, {"grade": "三年级", "term": "上册", "no": 17, "book": "三年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "海滨小城", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 73, "chars": 684, "paras": ["这是一座海滨小城。人们走到街道尽头，就可以看见浩瀚的大海。天是蓝的，海也是蓝的。海天交界的水平线上，棕色的机帆船和银色的军舰来来往往。天空飞翔着白色的、灰色的海鸥，还飘着跟海鸥一样颜色的云朵。", "早晨，机帆船、军舰、海鸥、云朵，都被朝阳镀上了一层金黄色。帆船上的渔民，军舰上的战士，他们的脸和胳臂也镀上了一层金黄色。", "海边是一片沙滩，沙滩上遍地是各种颜色、各种花纹的贝壳。这里的孩子见得多了，都不去理睬这些贝壳，贝壳只好寂寞地躺在那里。远处响起了汽笛声，那是出海捕鱼的船队回来了。船上满载着银光闪闪的鱼，还有青色的虾和蟹、金黄色的海螺。船队一靠岸，海滩上就喧闹起来。", "小城里每一个庭院都栽了很多树，有桉树、椰子树、橄榄树、凤凰树，还有许多不知名的树。初夏，桉树叶子散发出来的香味，飘得满街满院都是。凤凰树开了花，开得那么热闹，小城好像笼罩在一片片红云中。", "海滨小城① 本文作者林遐（xiá）（1921—1970），选作课文时有改动。", "小城的公园更美。这里栽着许许多多榕树。一棵棵榕树就像一顶顶撑开的绿绒大伞，树叶密不透风，可以遮太阳，挡风雨。树下摆着石凳，每逢休息的日子，石凳上总是坐满了人。", "小城的街道也美。除了沥青的大路，都是用细沙铺成的，踩上去咯吱咯吱地响，好像踩在沙滩上一样。人们把街道打扫得十分干净，甚至连一片落叶都没有。", "这座海滨小城真是又美丽又整洁。", "滨壳帆棕灰跟渔院睬透除踩滨胳臂滩睬载逢"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 18, "book": "三年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "美丽的小兴安岭", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 75, "chars": 755, "paras": ["我国东北的小兴安岭，有数不清的红松、白桦、栎树……几百里连成一片，就像绿色的海洋。", "春天，树木抽出新的枝条，长出嫩绿的叶子。山上的积雪融化了，雪水汇成小溪，淙淙地流着。溪里涨满了春水。", "小鹿在溪边散步，它们有的俯下身子喝水，有的侧着脑袋欣赏自己映在水里的影子。", "夏天，树木长得葱葱茏茏，密密层层的枝叶把森林封得严严实实的，挡住了人们的视线，遮住了蓝蓝的天空。早晨，雾从山谷里升起来，整个森林浸在乳白色的浓雾里。太阳出来了，千万缕耀眼的金光穿过树梢，照射在工人宿舍门前的草地上。草地上盛开着各种各样的野花，红的、白的、黄的、紫的，真像个美丽的大花坛。", "美丽的小兴安岭① 本文选自人民教育出版社《全日制十年制学校小学课本（试用本）语文第六册》，有改动。", "秋天，白桦和栎树的叶子变黄了，松柏显得更苍翠了。", "秋风吹来，落叶在林间飞舞。这时候，森林向人们献出了酸甜可口的山葡萄，又香又脆的榛子，鲜嫩的蘑菇和木耳，还有人参等名贵药材。", "冬天，雪花在空中飞舞。树上积满了白雪。地上的雪厚厚的，又松又软，常常没过膝盖。西北风呼呼地刮过树梢。", "黑熊躲进自己的洞里冬眠。紫貂捕捉野兔当美餐。松鼠靠秋天收藏在树洞里的松子过日子，有时候还到枝头散散步，看看春天是不是快要来临。", "小兴安岭一年四季景色诱人，是一座美丽的大花园，也是一座巨大的宝库。", "封抽挡严坛显药苍软材刮捉兴融侧欣封浸乳梢宿舍药眠有感情地"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 19, "book": "三年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "香港，璀璨的明珠", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 78, "chars": 616, "paras": ["香港，璀璨的明珠*香港位于我国南部，南海之滨，虽然面积不大，却是享誉世界的金融、航运和贸易中心，还是购物、品尝美食和旅游的好去处。", "香港有着繁荣的贸易活动，是一座举世闻名的贸易港城市。世界各地的商人都乐意来这里做生意，来自不同国家和地区的商品，琳琅满目，应有尽有，“万国市场”的名号当之无愧。", "人们爱把香港称作“美食天堂”。名满天下的粤菜、川菜，东南亚各地的风味饮食，欧洲各国的佳肴，一应俱全。游客不仅能大饱口福，还可以在享受美食盛宴的同时，体验香港的多元文化。", "结合课文内容说说你的理解。", "香港还是一个旅游胜地。美不胜收的维多利亚港，让人流连忘返。位于会议展览中心东北侧广场上的金紫荆雕塑，是中外游客必看的标志性景观，这是1997年香港回归祖国时中央政府赠送的礼物。每当夜幕降临，香港便成了灯的海洋。大型灯光音乐汇演“幻彩咏香江”将声和光交织在一起，把香港的夜景映照得绚丽多姿。港湾里闪烁的灯光，像五颜六色的焰火洒落人间。马路上一串串明亮的车灯，如同闪光的长河，奔流不息。高楼大厦的霓虹灯流光溢彩，热情欢迎来自五洲四海的游客。", "在共建“一带一路”和粤港澳大湾区建设的进程中，香港扮演着重要角色。未来，祖国南海之滨的这颗明珠必定更加璀璨夺目。"], "tasks": ["默读课文，找出段落中的关键语句，想想课文围绕香港介绍了哪些内容。为什么香港被誉为“璀璨的明珠”？"], "newchars": ["贸愧仅议政府赠幻焰澳扮角"]}, {"grade": "三年级", "term": "上册", "no": 20, "book": "三年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "古诗三首", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": "唐", "page": 84, "chars": 265, "paras": ["返景入深林，复照青苔上。", "望天门山[唐] 李 白天门中断楚江开，碧水东流至此回。", "两岸青山相对出，孤帆一片日边来。"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 21, "book": "三年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "大自然的声音", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 86, "chars": 858, "paras": ["大自然有许多美妙的声音。", "风，是大自然的音乐家。他会在森林里演奏他的手风琴。当他翻动树叶，树叶便像歌手一样，唱出各种不同的歌曲。不一样的树叶，有不一样的声音；不一样的季节，有不一样的音乐。当微风拂过，那声音轻轻柔柔的，好像呢喃细语，让人感受到大自然的温柔；当狂风吹起，整座森林都激动起来，合奏出一首雄伟的乐曲，那声音充满力量，令人感受到大自然的威力。", "水，也是大自然的音乐家。下雨的时候，他喜欢玩打击乐器。小雨滴敲敲打打，一场热闹的音乐会便开始了。滴滴答答……叮叮咚咚……所有的树林，树林里的每片树叶，所有的房子，房子的屋顶和窗户，都发出不同的声音。当小雨滴汇聚起来，他们便一起唱着歌：小溪淙淙，流向河流；河流潺潺，流向大海；大海哗哗，汹涌澎湃。从一首轻快的山中小曲，唱到波澜壮阔的海洋大合唱。", "动物是大自然的歌手。走在公园里，听听树上叽叽喳喳的鸟叫；坐在一棵树下，听听唧哩哩唧哩哩的虫鸣；在水塘边散步，听听青蛙的歌唱。你知道他们唱的是什么吗？他们的歌声好像告诉我们：“我在歌唱，我很快乐！”", "妙奏呢喃激伟充击器汇哩"], "tasks": [], "newchars": ["柔感妙琴奏充鸣塘威汇器"]}, {"grade": "三年级", "term": "上册", "no": 22, "book": "三年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "读不完的大书", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 89, "chars": 719, "paras": ["我五六岁时，就喜欢到大自然中去寻找好玩的东西。高远的天空，广阔的大地，空中的浮云飞鸟，水里的虾蟹游鱼，地上的走兽昆虫、花草树木……世界万物，不仅好玩，还让人沉思和遐想。", "小麻雀叽叽喳喳、蹦蹦跳跳的，叫人愉悦。老鹰在高空盘旋，展翅滑翔，突然猛扑而下，给人以雄健勇猛的感觉。", "蚂蚁搬家，井然有序，当两军对垒时，那勇敢忠贞的精神，真叫人敬佩。", "植物的开花、结籽，暑寒荣枯，有着不同的趣味。花儿有红的、黄的、紫的、蓝的，有单瓣的、重瓣的，千姿百态。草的叶子各不相同，有长有短，有宽有窄，有的还带着刺。", "我家房子前后栽有各种果树，有梨树、桃树、橘子树、柚子树，在不同的时间里，它们开不同的花，结不同的果。", "刚从树上摘下的果子，味道格外鲜美。", "我最喜爱的，是我家屋后的两丛竹子和一株棕榈。竹子长得快，雨后春笋，一天长几寸，没几天就长得和我一样高了。微风吹来，沙沙的竹叶声，如同温柔的细语。池塘边的棕榈树高大挺拔，大蒲扇似的叶子在风中摇摆，一副超凡脱俗的样子。在秋高气爽的日子里，它倒映在池塘的水中，小鱼在倒影间游玩，又是另一种境界。", "大自然是一本看不完的大画册，是一部永远读不完的大书，里面有无穷的奥秘，有无尽的乐趣。", "课文描写了大自然中哪些“好玩的东西”？"], "tasks": ["朗读课文，感受大自然的乐趣。"], "newchars": ["麻旋序贞姿笋超凡俗奥秘虾仅昆序枯姿荣态梨刺部奥秘"]}, {"grade": "三年级", "term": "上册", "no": 41, "book": "三年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "鹿柴", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "王维空山", "dynasty": "唐", "page": 84, "chars": 269, "paras": ["古诗三首④鹿  柴[唐] 王维空山不见人，但闻人语响。", "返景入深林，复照青苔上。", "望天门山[唐] 李 白天门中断楚江开，碧水东流至此回。", "两岸青山相对出，孤帆一片日边来。"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 42, "book": "三年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "望天门山", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "王维空山", "dynasty": "唐", "page": 84, "chars": 265, "paras": ["古诗三首④鹿  柴[唐] 王维空山不见人，但闻人语响。", "返景入深林，复照青苔上。", "[唐] 李 白天门中断楚江开，碧水东流至此回。", "两岸青山相对出，孤帆一片日边来。"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 43, "book": "三年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "饮湖上初晴后雨", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": null, "page": 85, "chars": 221, "paras": ["有感情地"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 23, "book": "三年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "司马光", "section": "阅读", "domain": "reading", "genre": "文言文", "author": null, "dynasty": null, "page": 96, "chars": 236, "paras": ["跟着老师"], "tasks": [], "newchars": ["司皆弃司弃击登皆持跌司"]}, {"grade": "三年级", "term": "上册", "no": 24, "book": "三年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "一定要争气", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 97, "chars": 961, "paras": ["童第周是我国著名的生物学家，长期从事科学研究，取得了卓著的成就。他出生在浙江省一个偏僻的山村里，小时候家里不富裕，只能一边帮家里做农活，一边跟父亲念点儿书。", "童第周17 岁进入当地的一所中学读书。由于文化基础差，他学习很吃力，第一学期期末考试，平均成绩才45 分。校长要他退学或降级，经过童第周再三恳求，才同意他跟班再试读一个学期。第二学期，童第周更加珍惜这难得的学习机会。早晨天不亮，他就悄悄起床，借着校园的路灯看书。夜里同学们入睡了，他又到路灯下面去看书。", "值班老师发现后，关了路灯，让他进屋睡觉。他趁老师不注意，又溜到厕所外的灯下学习。经过半年的努力，他的各科成绩都赶了上来，几何还考了满分。童第周看着成绩单，心想：一定要争气，我并不比别人笨。别人能办到的事，我经过努力也一定能办到。", "童第周28 岁的时候，得到亲友资助，去比利时留学，跟随欧洲很有名的生物学教授学习。一起学习的还有其他国家的学生。那时的中国贫穷落后，在世界上没有地位，中国学生常常被外国同学瞧不起。童第周暗暗下定决心，一定要为中国人争气。", "那位教授要做一项实验，需要剥离青蛙卵的外膜，这是观察卵细胞形态、结构和发育过程的关键环节。工作的难度很大，不但要有熟练的技巧，还要耐心细致，多年来没人能够做成。童第周不声不响地刻苦钻研，反复实践，终于取得成功。教授兴奋地说：“童第周真行！”", "青蛙卵外膜的成功剥离，震惊了欧洲同行。童第周激动地想：一定要争气，中国人并不比外国人笨。外国人认为很难办到的事，我们中国人经过努力，照样能办到。", "“一定要争气！”这句话一直激励着童第周向科学的高峰不断攀登。", "裕差均资欧洲授项验构耐励念差考试均退努留单度奋"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 25, "book": "三年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "手术台就是阵地", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 100, "chars": 946, "paras": ["1939年春，齐会战斗打响了。气焰嚣张的日军刚刚到齐会一带就挨了当头一棒，被我军消灭了五百多人。", "敌人不断反扑，战斗非常激烈。我军的伤员陆续从火线上抬下来。在离火线不远的一座小庙里，白求恩大夫正在给伤员做手术。他已经两天两夜没休息了，眼球上布满了血丝。", "突然，几发炮弹落在小庙前的空地上。硝烟滚滚，弹片纷飞，小庙被烟雾淹没了。白求恩仍然镇定地站在手术台旁。他接过助手递过来的镊子，敏捷地从伤员的腹腔里取出一块弹片，丢在盘子里。", "敌机不断地在上空吼叫，炮弹不断地在周围爆炸。师卫生部长匆匆赶来，对白求恩说：“师长决定让您和一部分伤员离开这里。”白求恩沉思了一会儿，说：“我同意撤走部分伤员。至于我个人，要和战士们在一起，不能离开。”部长恳求说：“白求恩同志，这儿危险，让您离开这里，是战斗形势的需要哇！”白求恩说：“谢谢师长的关心。可是，手术台是医生的阵地。战士们没有离开他们的阵地，我怎么能离开自己的阵地呢？部长同志，请您转告师长，我是一名八路军战士，不是你们的客人。”白求恩低下头，继续给伤员做手术。", "一连几发炮弹落在小庙的周围。庙的一角落下了许多瓦片。挂在门口的布帘烧着了，火苗向手术台扑过来。助手们赶忙把火扑灭。担架队抬起做过手术的伤员，迅速向后方转移。白求恩仍然争分夺秒地给伤员做手术，做了一个又一个。", "齐会战斗进行了三天三夜，胜利结束了。白求恩大夫在手术台旁，连续工作了六十九个小时。", "棒大血硝危险势瓦帘担迅速夺秒棒伤陆血取盘匆迅医速夺秒"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "上册", "no": 26, "book": "三年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "一个粗瓷大碗", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 103, "chars": 801, "paras": ["中国人民革命军事博物馆里，陈列着一个粗瓷大碗，是赵一曼在东北人民革命军②中担任团政治委员时用过的。这个碗，赵一曼仅仅用过一次，但是抗联的老战士都能认出来。因为这个碗有着一段令人感动的故事。", "有一回，一场袭击日寇的战斗刚刚结束，小通讯员给赵一曼送来一个鼓鼓的挂包。打开一看，是个粗瓷大碗。赵一曼吃饭用的搪瓷缸子早就送给一个新战士了，通讯员一直想给她另找一个碗，好不容易在这次战斗中找到了，就连忙给她送来。", "赵一曼看着这个碗，对通讯员说：“哪里拿来的，请你还到哪里去！”", "“这……这……敌人都被消灭了，往哪里还啊！”通讯带着问题"], "tasks": [], "newchars": ["瓷赵抗束缸还顿灶沾禁锅侦"]}, {"grade": "三年级", "term": "下册", "no": 1, "book": "三年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "古诗三首", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "苏轼竹外", "dynasty": "宋", "page": 2, "chars": 214, "paras": ["惠崇春江晚景[宋] 苏轼竹外桃花三两枝，春江水暖鸭先知。", "蒌蒿满地芦芽短，正是河豚欲上时。    我能猜出“蒌蒿”是一种植物，因为……", "绝  句[唐] 杜甫迟日江山丽，春风花草香。", "泥融飞燕子，沙暖睡鸳鸯。"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "下册", "no": 2, "book": "三年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "绝句", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "苏轼竹外", "dynasty": "宋", "page": 2, "chars": 218, "paras": ["惠崇春江晚景[宋] 苏轼竹外桃花三两枝，春江水暖鸭先知。", "蒌蒿满地芦芽短，正是河豚欲上时。    我能猜出“蒌蒿”是一种植物，因为……", "古诗三首绝  句[唐] 杜甫迟日江山丽，春风花草香。", "泥融飞燕子，沙暖睡鸳鸯。"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "下册", "no": 2, "book": "三年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "燕子", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 4, "chars": 530, "paras": ["一身乌黑的羽毛，一对轻快有力的翅膀，加上剪刀似的尾巴，凑成了那样可爱的活泼的小燕子。", "二三月的春日里，轻风微微地吹拂着，如毛的细雨由天上洒落着，千条万条的柔柳，红的白的黄的花，青的草，绿的叶，都像赶集似的聚拢来，形成了烂漫无比的春天。这时候，那些小燕子，那么伶俐可爱的小燕子，也由南方飞来，加入这光彩夺目的图画中，为春光平添了许多生趣。", "小燕子带了它的剪刀似的尾巴，在阳光满地时，斜飞于旷亮无比的天空，叽的一声，已由这里的稻田上，飞到那边的高柳下了。", "另有几只却在波光粼粼的湖面上横掠着，小燕子的翼尖或剪尾，偶尔沾了一下水面，那小圆晕便一圈一圈地荡漾开去。", "燕  子凑集偶尔沾泼闲纤杆凑伶俐旷横翼漾倦散纤杆痕那边还有飞倦了的几对，闲散地在纤细的电线上休憩qì —嫩蓝的春天，几支木杆，几痕细线连于杆与杆之间，线上停着几个小黑点，那便是燕子。多么有趣的一幅图画呀！"], "tasks": ["朗读课文，边读边想象画面，并读出对燕子的喜爱之情。背诵第1~2自然段。"], "newchars": []}, {"grade": "三年级", "term": "下册", "no": 3, "book": "三年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "惠崇春江晚景", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "苏轼竹外", "dynasty": "宋", "page": 2, "chars": 218, "paras": ["惠崇春江晚景[宋] 苏轼竹外桃花三两枝，春江水暖鸭先知。", "蒌蒿满地芦芽短，正是河豚欲上时。    我能猜出“蒌蒿”是一种植物，因为……", "古诗三首绝  句[唐] 杜甫迟日江山丽，春风花草香。", "泥融飞燕子，沙暖睡鸳鸯。"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "下册", "no": 3, "book": "三年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "荷花", "section": "阅读", "domain": "reading", "genre": "课文", "author": "叶圣陶", "dynasty": null, "page": 6, "chars": 604, "paras": ["清早，我到公园去玩，一进门就闻到一阵清香。我赶紧往荷花池边跑去。", "荷花已经开了不少了。荷叶挨挨挤挤的，像一个个碧绿的大圆盘。白荷花在这些大圆盘之间冒出来。有的才展开两三片花瓣儿。", "有的花瓣儿全展开了，露出嫩黄色的小莲蓬péng②。有的还是花骨朵儿，看起来饱胀得马上要破裂似的。", "这么多的白荷花，一朵有一朵的姿势。看看这一朵，很美；看看那一朵，也很美。如果把眼前的一池荷花看作一大幅活的画，那画家的本领可真了不起。", "我忽然觉得自己仿佛就是一朵荷花，穿着雪白的衣裳，站在阳光里。一阵微风吹过来，我就翩翩起舞，雪白的衣裳① 本文作者叶圣陶（1894—1988），选作课文时有改动。", "“ 挨挨挤挤” 和“冒”用得真好！", "荷  花有感情地"], "tasks": [], "newchars": ["挨蓬胀裳翩蜻蜓胀裂荷微记势紧挨蓬"]}, {"grade": "三年级", "term": "下册", "no": 4, "book": "三年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "三衢道中", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": null, "page": 3, "chars": 168, "paras": ["有感情地"], "tasks": [], "newchars": []}, {"grade": "三年级", "term": "下册", "no": 4, "book": "三年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "昆虫备忘录", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 8, "chars": 838, "paras": ["复  眼我从一本书上知道蜻蜓有复眼，从那以后，就一直在琢磨复眼是怎么回事。“复眼”，想必是好多小眼睛合成一个大眼睛。那它怎么看东西呢？是每个小眼睛都看到一个小形象，合成一个大形象，还是每个小眼睛看到形象的一部分，合成一个完整的形象？总是琢磨不出来。", "凡是有复眼的昆虫，视觉都很灵敏。蜻蜓就有复眼，苍蝇也有。你走近蜻蜓和苍蝇，还有一段距离，它们就发现了，噌cēng—飞了。", "我曾经想过：如果人长了一对复眼……", "还是不要！那成什么样子！", "蜻蜓、瓢虫、蚂蚱……这些昆虫你了解吗？它们身上的秘密你知道多少？"], "tasks": [], "newchars": ["录琢敏款膜瞎益辆蚂斑褐"]}, {"grade": "三年级", "term": "下册", "no": 5, "book": "三年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "守株待兔", "section": "阅读", "domain": "reading", "genre": "文言文", "author": null, "dynasty": null, "page": 16, "chars": 485, "paras": ["宋人有耕者，田中有株。兔走②触株，折颈而死。因释shì ④其耒lěi ⑤而守株，冀jì ⑥复得兔。兔不可复得，而身为宋国笑。", "把课文读通顺，注意把握好停顿。背诵课文。", "借助注释读懂课文，说说那个农夫为什么会被别人笑话。"], "tasks": [], "newchars": ["宋株守待耕颈折释其复耕释冀"]}, {"grade": "三年级", "term": "下册", "no": 6, "book": "三年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "会摇尾巴的狼", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 18, "chars": 780, "paras": ["狼掉进陷阱里，怎么爬也爬不上来。老山羊从这里路过，狼连忙打招呼，说：“好朋友！为了我们的友情，帮帮忙吧！”", "老山羊问：“你是谁？为什么跑到陷阱里去了？”", "狼装出一副又老实又可怜的模样，说：“我，你不认识了吗？", "我是又忠诚又驯良的狗啊！为了救一只掉进陷阱的小鸡，我毫不犹豫地跳了下来，没想到再也爬不上去了。唉！可怜可怜我这善良的狗吧！”", "老山羊看了狼几眼，说：“你不像狗，倒很像狼！”", "狼连忙半闭着眼睛，说：“我是狼狗，所以有点儿像狼。", "我的性情很温和，跟羊特别亲。你只要伸下一条腿来，我就得救了。我一定好好答谢你，给你舔毛，帮你咬虱子……”", "“别再花言巧语了。”老山羊说，“你骗不了我，狗都是老老实实的，不像你这样狡猾。”", "狼着急了，赶忙说：“请您相信，我的的确确是狗。不信，你看我还会摇尾巴。”", "狼把尾巴使劲摇了几下，扑扑扑，把陷阱里的尘土都扬了起来。", "老山羊看到这条硬尾巴，心里完全明白了，说：“你再会摇尾巴，也还是凶恶的狼。你干尽了坏事，谁也不会来救你的。”", "狼终于露出了凶相，咧开嘴，龇着牙，对老山羊恶狠狠地叫嚷：“你这老家伙！不快点儿过来，等我出去就吃掉你！”", "老山羊轻蔑地看了狼一眼，说：“你不会活多久了，猎人会来收拾你的。”说完就走开了。", "分角色"], "tasks": [], "newchars": ["装尘良驯善谢伸凶狠恶猎拾模驯良毫犹豫狡猾凶恶相狠猎"]}, {"grade": "三年级", "term": "下册", "no": 7, "book": "三年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "鹿角和鹿腿", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 21, "chars": 697, "paras": ["丛林中，住着一只漂亮的鹿。", "有一天，鹿口渴了，找到一个池塘，痛痛快快地喝起水来。池水清清的，像一面镜子。鹿忽然发现了自己倒映在水中的影子：“咦，这是我吗？”", "鹿摆摆身子，水中的倒影也跟着摆动起来。他从来没有注意到自己是这么漂亮！他不着急离开了，对着池水欣赏自己的美丽：“啊！我的身段多么匀称，我的角多么精美别致，好像两束美丽的珊瑚！”", "一阵清风吹过，池水泛起了层层波纹。鹿忽然看到了自己的腿，不禁噘起了嘴，皱起了眉头：“唉，这四条腿太细了，怎么配得上这两只美丽的角呢！”", "鹿开始抱怨起自己的腿来。就在他没精打采地准备离开的时候，忽然听到远处传来一阵脚步声。他机灵地支起耳朵，不错，正是脚步声！鹿猛一回头，哎呀，一头狮子正悄悄地向自己逼近。", "鹿不敢犹豫，撒开长腿就跑。有力的长腿在灌木丛中蹦来跳去，不一会儿，就把凶猛的狮子远远地甩在了后面。就在狮子灰心丧气不想再追的时候，鹿的角却被树枝挂住了。", "狮子赶紧抓住这个机会，猛扑过来。眼看就要追上了，鹿用尽全身力气，使劲一扯，才把两只角从树枝中挣脱出来，然后又拼命向前奔去。这次，狮子再也没有追上。", "鹿跑到一条小溪边，停下脚步，一边喘气，一边休息。", "他叹了口气，说：“两只美丽的角差点儿让我送了命，可四条难看的腿却让我狮口逃生！”", "根据下面的提示，用自己的话讲讲这个故事。", "角：美丽  欣赏  差点儿送命腿：难看  抱怨  狮口逃生下面的说法，你赞成哪一种？说说你的理由。"], "tasks": ["朗读课文，注意读出鹿的心情变化。"], "newchars": ["匀渴致称喝束配甩丧追扯叹逃匀称皱配撒扯"]}, {"grade": "三年级", "term": "下册", "no": 8, "book": "三年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "池子与河流", "section": "阅读", "d
