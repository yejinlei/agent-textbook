: "第一单元", "title": "桂花雨​", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 2, "chars": 1342, "paras": ["中秋节前后，正是故乡桂花盛开的时节。", "小时候，我无论对什么花，都不懂得欣赏。父亲总是指指点点地告诉我，这是梅花，那是木兰花……但我除了记些名字外，并不喜欢。我喜欢的是桂花。桂花树的样子笨笨的，不像梅树那样有姿态。不开花时，只见到满树的叶子；开花时，仔细地在树丛里寻找，才能看到那些小花。可是桂花的香气，太迷人了。", "故乡靠海，八月是台风季节。桂花一开，母亲就开始担心了：“ 可别来台风啊！”母亲每天都要在前后院子走一回，嘴里念着：“只要不来台风，我就可以收几大箩。送一箩给胡家老爷爷，送一箩给毛家老婆婆，他们两家糕饼做得多。”", "桂花盛开的时候，不说香飘十里，至少前后左右十几家邻居，没有不浸在桂花香里的。桂花成熟时，就应当“摇”。摇下来的桂花，朵朵完整、新鲜。如果让它开过了，落在泥土里，尤其是被风吹落，比摇下来的香味就差多了。", "摇花对我来说是件大事，我总是缠着母亲问：“ 妈，怎么还不摇桂花呢？”母亲说：“ 还早呢，花开的时间太短，摇不下来的。”", "可是母亲一看天上布满阴云，就知道要来台风了，赶紧叫大家提前摇桂花。这下，我可乐了，帮大人抱着桂花树，使劲地摇。摇哇摇，桂花纷纷落下来，我们满头满身都是桂花。我喊着：“啊！真像① 本文作者琦 （qí）君 （1917—2006），选作课文时有改动。", "桂花雨下雨，好香的雨呀！”", "桂花摇落以后，挑去小枝小叶，晒上几天太阳，收在铁盒子里，可以加在茶叶里泡茶，过年时还可以做糕饼。全年，整个村子都浸在桂花的香气里。", "我念中学的时候，全家到了杭州。杭州有一处小山，全是桂花树，花开时那才是香飘十里。秋天，我常到那儿去赏桂花。回家时，总要捡一大袋桂花给母亲。", "可是母亲说：“ 这里的桂花再香，也比不上家乡院子里的桂花。”", "于是，我又想起了在故乡童年时代的“摇花乐”，还有那摇落的阵阵桂花雨。", "箩  杭糕饼浸婆靠笨欣兰茶有感情地"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 2, "book": "五年级上册", "unit_no": 1, "unit_name": "第一单元", "title": "落花生", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 5, "chars": 745, "paras": ["我们家的后园有半亩空地。母亲说：“ 让它荒着怪可惜的，你们那么爱吃花生，就开辟出来种花生吧。”我们姐弟几个都很高兴，买种，翻地，播种，浇水，没过几个月，居然收获了。", "母亲说：“ 今晚我们过一个收获节，请你们的父亲也来尝尝我们的新花生，好不好？”母亲把花生做成了好几样食品，还吩咐就在后园的茅亭里过这个节。", "那晚的天色不大好，可是父亲也来了，实在很难得。", "父亲说：“你们爱吃花生吗？”", "我们争着回答：“爱！”", "“谁能把花生的好处说出来？”", "姐姐说：“花生的味道很美。”", "哥哥说：“花生可以榨油。”", "我说：“ 花生的价钱便宜，谁都可以买来吃，都喜欢吃。这就是它的好处。”", "父亲说：“ 花生的好处很多，有一样最可贵。它的果实埋在地里，不像桃子、石榴②、苹果那样，把鲜红嫩绿的果实高高地挂在枝上，使人一见就生爱慕之心。你们看它矮矮地长在地上，等到成① 本文作者许地山（1893—1941），选作课文时有改动。", "2 落花生熟了，也不能立刻分辨出来它有没有果实，必须挖起来才知道。”", "我们都说是，母亲也点点头。", "父亲接下去说：“ 所以你们要像花生，它虽然不好看，可是很有用。”", "我说：“ 那么，人要做有用的人，不要做只讲体面，而对别人没有好处的人。”", "父亲说：“对。这是我对你们的希望。”", "我们谈到深夜才散。花生做的食品都吃完了，父亲的话却深深地印在我的心上。", "分角色"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 3, "book": "五年级上册", "unit_no": 1, "unit_name": "第一单元", "title": "珍珠鸟", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 7, "chars": 1104, "paras": ["真好！朋友送我一对珍珠鸟，放在一个简易的竹条编成的笼子里，笼内还有一卷干草，那是小鸟舒适又温暖的巢。", "有人说，这是一种怕人的鸟。", "我把鸟笼挂在窗前。那儿还有一大盆异常茂盛的法国吊兰。我便用吊兰长长的、串生着小绿叶的垂蔓蒙盖在鸟笼上。它们就像躲进深幽的丛林一样安全，从中传出的笛儿般又细又亮的叫声，也就格外轻松自在了。小鸟的影子就在这中间隐约闪动，看不完整，有时连笼子也看不出，却见它们可爱的鲜红小嘴从绿叶中伸出来。", "我很少扒开垂蔓瞧它们，它们便渐渐敢伸出小脑袋瞅瞅我。我们就这样一点点熟悉了。", "三个月后，那一团越发繁茂的垂蔓里边，发出一种尖细又娇嫩的鸣叫。我猜到，是它们有了雏儿。我呢，决不掀开叶片往里看，连添食加水时也不睁大好奇的眼睛去惊动它们。过不多久，忽然有一个更小的脑袋从叶间探出来。哟，雏儿！正是这小家伙！", "它小，就能轻易地由疏格的笼子里钻出来。瞧，多么像它的父母：红嘴红脚，灰蓝色的毛，只是后背还没生出珍珠似的圆圆的白点。它好肥，整个身子好像一个蓬松的球儿。", "起先，这小家伙只在笼子四周活动，随后就在屋里飞来飞去，① 。", "*一会儿落在柜顶上，一会儿神气十足地站在书架上，啄着书脊上那些大文豪的名字，一会儿把灯绳撞得来回摇动，跟着逃到画框上去了。只要大鸟在笼里生气地叫一声，它就立即飞回笼里去。", "我不管它。这样久了，打开窗子，它最多只在窗框上站一会儿，决不飞出去。", "渐渐它胆子大了，就落在我的书桌上。它先是离我较远，见我不去伤害它，便一点点挨近，然后蹦到我的杯子上，俯下头来喝茶，再偏过脸瞧瞧我的反应。我只是微微一笑，依旧写东西。它就放开胆子跑到稿纸上，绕着我的笔尖蹦来蹦去，跳动的小红爪子在纸上发出嚓嚓的响声。", "我不动声色地写，默默享受着这小家伙亲近的情意。这样，它完全放心了，索性用那涂了蜡似的小红嘴，嗒嗒地啄着我颤动的笔尖。我用手抚一抚它细腻的绒毛，它也不怕，反而友好地啄两下我的手指。", "白天，它这样淘气地陪伴我；天色入暮，它就在父母再三的呼唤声中，飞向笼子，扭动滚圆的身子，挤开那些绿叶钻进去。", "有一天，我伏案写作时，它居然落到我的肩上。我手中的笔不觉停了，生怕惊跑它。待一会儿，扭头看，这小家伙竟趴在我的肩头睡着了，银灰色的眼睑盖住眸子，小红爪子刚好被胸脯上长长的绒毛盖住。我轻轻抬一抬肩，它没醒，睡得好熟！还咂咂嘴，难道在做梦？", "我笔尖一动，流泻下一时的感受：信赖，往往创造出美好的境界。", "悉  雏  哟  嚓  嗒  抚  陪  睑  泻"], "tasks": ["默读课文，想想“我”是怎样逐渐得到珍珠鸟的信赖的。课文中有很多地方写出了珍珠鸟的可爱，找出这样的语句，体会“我”和珍珠鸟之间的情意。"], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 4, "book": "五年级上册", "unit_no": 2, "unit_name": "第二单元", "title": "冀中的地道战", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 14, "chars": 1461, "paras": ["1942到1944那几年，日本侵略军在冀中平原上“大扫荡”，还修筑了封锁沟和封锁墙，十里一碉，八里一堡，想搞垮我们的人民武装。", "为了粉碎敌人的“扫荡”，冀中人民在中国共产党的领导下，创造了新的斗争方式，这就是地道战。", "说起地道战，简直是个奇迹。在广阔平原的地底下，挖了不计其数的地道，横的，竖的，直的，弯的，家家相连，村村相通。敌人来了，我们就钻到地道里去，让他们扑个空；敌人走了，我们就从地道里出来，照常种地过日子，有时候还要打击敌人。靠着地道这种坚强的堡垒，冀中平原上的人民坚持了敌后游击战争。", "地道的式样有一百多种。就拿任丘的来说吧，村里的地道挖在街道下面，跟别村相通的地道挖在庄稼地下面。地道有四尺多高，个儿高的人弯着腰可以通过；地道的顶离地面三四尺，不妨碍上面种庄稼。地道里每隔一段距离就有一个大洞，洞顶用木料撑住，很牢靠。大洞四壁又挖了许多小洞，有的住人，有的拴牲口，有的搁东西，有的作厕所。一个大洞容得下一百来人，最大的能容二百多人。洞里经常准备着开水、干粮、被子、灯火，在① 本文作者周而复 （1914—2004），选作课文时有改动。", "用较快的速度"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 5, "book": "五年级上册", "unit_no": 2, "unit_name": "第二单元", "title": "将相和", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 17, "chars": 2443, "paras": ["战国时，秦国很强大，常常进攻别的国家。", "有一回，赵王得了一件无价之宝，叫和氏璧。秦王知道了，就写了一封信给赵王，说是愿意拿十五座城换这块璧。", "赵王接到信后非常着急，立即召集大臣来商议。大家说秦王不过是想把和氏璧骗到手罢了，不能上他的当；可要是不答应，又怕他派兵来进攻。", "正在为难的时候，有人说有个叫蔺相如的人，勇敢机智，也许他能解决这个难题。", "赵王把蔺相如找来，问他该怎么办。", "蔺相如想了一会儿，说：“ 如果秦国提出用城换璧，我国却不答应，那理亏的是我们；如果我们把和氏璧给了秦国，秦国却不给我们十五座城，那理亏的就是他们。我愿意带着和氏璧到秦国去。", "如果秦王真的拿十五座城来换，我就把璧交给他；如果他不肯交出十五座城，我一定把璧完好无缺地送回来。”于是赵王就派蔺相如带着和氏璧去了秦国。", "蔺相如到了秦国，进宫见了秦王，献上和氏璧。秦王双手捧着① 本文根据 《史记·廉颇蔺相如列传》相关内容改写。", "用较快的速度"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 6, "book": "五年级上册", "unit_no": 2, "unit_name": "第二单元", "title": "什么比猎豹的速度更快", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 22, "chars": 1057, "paras": ["借助关键语句，用较快的速度"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 7, "book": "五年级上册", "unit_no": 2, "unit_name": "第二单元", "title": "“诺曼底号”遇难记", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 25, "chars": 1972, "paras": ["1870年3月17日夜晚，哈尔威船长照例走着从南安普敦到根西岛这条航线。大海上夜色正浓，烟雾弥漫。船长站在驾驶室里，小心翼翼地驾驶着他的“诺曼底号”。乘客们都进入了梦乡。", "“诺曼底号”是一艘大轮船，在英吉利海峡也许可以算得上是最漂亮的邮船之一。它装货容量六百吨，船体长二百二十英尺②，宽二十五英尺。海员们都说它很“年轻”，因为它还不满七岁，是1863年造的。", "雾越来越浓了，轮船驶出南安普敦河后，来到茫茫大海上，距离埃居伊山脉估计有十五海里③。轮船缓缓行驶着。这时大约凌晨四点钟。", "周围一片漆黑，船桅的梢尖隐约可辨。", "突然，沉沉夜雾中冒出一枚黑点，它好似一个幽灵，又仿佛一座山峰。只见一个阴森森的往前翘起的船头，突破黑暗，在一片浪花中飞驶过来。那是“玛丽号”，一艘装有螺旋推进器的大轮船，它从敖德萨起航，船上载着五百吨小麦，行驶速度非常快，负载又特别大。它笔直地朝着“诺曼底号”逼了过来。", "带着问题，用较快的速度"], "tasks": [], "newchars": ["峡弥晨剖混哗违喘悲岗宰措犹"]}, {"grade": "五年级", "term": "上册", "no": 8, "book": "五年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "猎人海力布​", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 34, "chars": 1549, "paras": ["在我国的一些地区，流传着一个动人的民间故事。", "从前有一个猎人，名叫海力布。他热心帮助别人，每次打猎回来，总是把猎物分给大家，自己只留下很少的一份。大家都非常尊敬他。", "有一天，海力布到深山去打猎，忽然听见天上有呼救声。他抬头一看，一只老鹰抓着一条小白蛇正从他头上方飞过。他急忙搭箭开弓，对准老鹰射去。老鹰受了伤，丢下小白蛇逃了。", "海力布对小白蛇说：“ 可怜的小东西，快回家去吧！”小白蛇说：“ 敬爱的猎人，您是我的救命恩人，我要报答您。我是龙王的女儿，您跟我回去，我爸爸一定会好好酬谢您。我爸爸的宝库里有许多珍宝，您要什么都可以。如果您都不喜欢，可以要我爸爸含在嘴里的那颗宝石。只要嘴里含着那颗宝石，就能听懂各种动物说的话。”海力布想，珍宝我倒不在乎，能听懂动物的话，对一个猎人来说，实在是太好了。他问小白蛇：“真有这样一颗宝石吗？”小白蛇说：“ 真的。但是动物说什么话，您只能自己知道。如果对别人说了，您就会变成一块石头。”", "海力布点点头，跟着小白蛇到了龙宫。老龙王对海力布十分感激，要重谢他，于是把他领进宝库，让他自己挑选珍宝，爱什么就拿什么。海力布什么珍宝也不要，他对龙王说：“ 如果您真想给我猎人海力布点儿东西作纪念，请把您嘴里含着的那颗宝石送给我吧。”龙王低头想了一会儿，就把嘴里含的宝石吐出来，送给了海力布。", "海力布临走的时候，小白蛇跟了出来，再三叮嘱他说：“ 敬爱的猎人，您要记住，无论动物说了什么话，都不要对别人说。如果说了，您马上就会变成石头，永远不能复活了！”海力布谢过小白蛇，就回家了。", "海力布有了这颗宝石，打猎方便极了。他把宝石含在嘴里，能听懂飞禽走兽的语言，能知道哪座山上有哪些动物。从此以后，他每次打猎回来，分给大家的猎物更多了。这样过了几年。有一天，他正在深山里打猎，忽然听见一群鸟在议论着什么。仔细一听，那只领头的鸟说：“ 咱们赶快飞到别处去吧！今天晚上，这里的大山要崩塌，大地要被洪水淹没，不知道要淹死多少人呢！”", "海力布听到这番话，大吃一惊。他急忙跑回家对大家说：“ 咱们赶快搬到别处去吧！这个地方不能住了！”大家听了感到很奇怪，住得好好的，为什么要搬家呢？尽管海力布焦急地催促大家，可是谁也不相信他。海力布急得掉下了眼泪，说：“ 我可以发誓，我说的话千真万确。相信我的话吧，赶快搬走！再晚就来不及了！”有个老人对海力布说：“ 海力布，你是我们的好邻居，我们知道你从来不说谎话。可是今天你让我们搬家，你总得说清楚哇。咱们在这山下住了好几代啦，老老小小这么多人，搬家可不容易呀！”", "酬  禽  塌"], "tasks": [], "newchars": ["焦禽催嘱叮酬避灾倾涌悔延"]}, {"grade": "五年级", "term": "上册", "no": 9, "book": "五年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "牛郎织女（一）​", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 37, "chars": 2400, "paras": ["古时候有个孩子，爹娘都死了，跟着哥哥嫂子过日子。哥哥嫂子待他很不好，叫他吃剩饭，穿破衣裳，夜里在牛棚里睡。牛棚里没床铺，他就睡在干草上。他每天放牛。那头牛跟他很亲密，用温和的眼神看着他，有时候还伸出舌头舔舔他的手，怪有意思的。哥哥嫂子见着他总是爱理不理的，仿佛他一在眼前，就浑身不舒服。", "两相比较，他也乐得跟牛一块儿出去，一块儿睡。", "他没名字，人家见他每天放牛，就叫他牛郎。", "牛郎照看那头牛挺周到。一来是牛跟他亲密；二来呢，他想，牛那么勤勤恳恳地干活，不好好照看它，怎么对得起它呢？他总是挑很好的草地，让牛吃嫩嫩的青草；家里吃的干草，筛得一点儿土也没有。牛渴了，他就牵着它到小溪的上游，让它喝干净的水。夏天天气热，就在树林里休息；冬天天气冷，就在山坡上晒太阳。他把牛身上刷得干干净净，不沾一点儿草叶、土粒。夏天，一把蒲扇① 本文是民间故事，由叶圣陶（1894—1988）整理，选作课文时有改动。", "牛郎织女（一）不离手，把成群乱转的牛虻都赶跑了。牛棚也打扫得干干净净。在干干净净的地方住，牛舒服，自己也舒服。", "牛郎随口哼几支小曲儿，没人听他的，可是牛摇摇耳朵闭闭眼，好像听得挺有味儿。牛郎心里想什么，嘴里就说出来，没人听他的，可是牛咧开嘴，笑嘻嘻的，好像明白他的意思。他常常把看见的、听见的事告诉牛，有时候跟它商量一些事。牛好像全了解，虽然没说话，可是眉开眼笑的，他也就满意了。自然，有时候他还觉得美中不足，要是牛能说话，把了解的和想说的都一五一十地说出来，那该多好呢。", "一年一年过去，牛郎渐渐长大了。哥哥嫂子想独占爹娘留下来的家产，把他看成眼中钉。一天，哥哥把牛郎叫到跟前，装得很亲热的样子说：“你如今长大了，也该成家立业了。老人家留下一点儿家产，咱们分了吧。一头牛，一辆车，都归你；别的归我。”", "嫂子在旁边，三分像笑七分像发狠，说：“ 我们挑顶有用的东西给你，你知道吗？你要知道好歹，赶紧离开这儿。天还早，能走就走吧。”", "牛郎听哥哥嫂子这么说，想了想，说：“好，我这就走！”他想哥哥嫂子既然这样对待他，他又何必恋恋不舍呢？那辆车不稀罕，幸亏那头老牛归了他，亲密的伙伴还在一块儿，离不离开家有什么关系？", "他就牵着老牛，拉着破车，头也不回，一直往前走，走出村子，走过树林，走到山里。从那以后，他白天上山打柴，柴装满一车，就让老牛拉着，到集市上去换粮食；夜晚就让老牛在车旁边休息，自己睡在车上。过了些日子，他在山前边盖了一间草房，又在草房旁边开辟了一块地，种些庄稼，这就算安了家。", "一天晚上，他走进草房，忽然听见一声“牛郎”，他从没听见过这个声音。是谁叫他呢？回头一看，微弱的星光下，老牛嘴一张一合的，正在说话。", "老牛真会说话了！", "牛郎并不觉得奇怪，像是听惯了它说话似的，就转过身子去听。", "老牛说：“明天黄昏时候，你翻过右边那座山，山那边是一片树林，树林前边是一个湖，那时候会有些仙女在湖里戏水。她们的纱衣放在草地上，你要捡起那件粉红色的纱衣，跑到树林里等着，跟你要纱衣的那个仙女就是你的妻子。这个好机会你可别错过了。”", "“知道了。”牛郎高兴地回答。", "第二天黄昏时候，牛郎翻过右边的那座山，穿过树林，走到湖边。湖面映着晚霞的余光，蓝紫色的波纹晃晃荡荡。他听见有女子的笑声，顺着声音看，果然有好些个女子在湖里戏水。他沿着湖边走，没几步，就看见草地上放着好些纱衣，花花绿绿的，件件都那么漂亮。里头果然有一件粉红色的纱衣，他就拿起来，转身走进树林。", "他静静地等着。过了一会儿，就听见女子们上岸的声音。只听见一个说： “不早了，咱们赶紧回去吧！咱们偷偷地到人间来，要是老人家知道了，不知道要怎么罚咱们呢！”过了一会儿，又听见一个说：“怎么，你们都走啦？难得来一趟，多自在啊，也不多玩一会儿。—哎呀！我的纱衣哪儿去了？谁瞧见了？”", "牛郎听到这儿，从树林里走出来，双手托着纱衣，说：“姑娘，别着急，你的纱衣在这儿。”", "姑娘穿上纱衣，一边梳她长长的黑头发，一边跟牛郎谈话。牛郎把自己的情形一五一十地说了。姑娘听得出了神，又同情他，又爱惜他，就把自己的情形也告诉了他。", "原来姑娘是天上王母娘娘的外孙女，织得一手好彩锦，名字叫织女。每天早晨和傍晚，王母娘娘拿她织的彩锦装饰天空，那就是灿烂的云霞，什么东西也没它美丽。王母娘娘需要的彩锦多，就叫织女成天成夜地织，一会儿也不许休息。织女身子老在机房里，手老在梭子上，劳累不用说，自由也没有了，等于关在监狱里，实在难受。她常常想，人人说天上好，天上好，天上有什么好呢？没有自由，又看不见什么。她总想离开天上，到人间去，哪怕是一天半天呢，也可以见识见识人间的景物。她把这个想法跟别的仙女说了，别的仙女也都说早有这种想法。那天下午，王母娘娘喝千年酿的葡萄酒，多喝了点儿，靠在宝座上直打瞌睡，看样子不见得马上就醒。仙女们见机会难得，就你拉我、我拉你地溜出来，一齐飞到人间。她们飞到湖边，看见湖水清得可爱，就跳下去戏水。织女关在机房里太久了，现在能够在湖水里无拘无束地玩，心里真痛快，想多玩一会儿，没想到就落在了后边。", "牛郎听完织女的话，就说：“ 姑娘，既然天上没什么好，你就不用回去了。你能干活，我也能干活，咱们两个结了婚，一块儿在人间过一辈子吧。”", "织女想了想，说：“你说得很对，咱们结婚，一块儿过日子吧。”", "他们俩手拉着手，穿过树林，翻过山头，回到草房。牛郎把老牛指给织女看，说它就是从小到大相依为命的伴儿。织女拍拍老牛的脖子，用腮帮挨挨它的耳朵，算是跟它行见面礼。老牛眉开眼笑地朝她看，仿佛说：“正是这个新娘子。”", "课文中有些情节写得很简略，发挥想象把下面的情节说得更具体。"], "tasks": ["默读课文，说说牛郎和老牛是怎么相处的，他和织女是怎么认识的。"], "newchars": ["哎纱姑娘婚辈惯棚嫂挺罕幸柴郎嫂"]}, {"grade": "五年级", "term": "上册", "no": 10, "book": "五年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "牛郎织女（二）​", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 42, "chars": 1456, "paras": ["从此牛郎在地里耕种，织女在家里纺织。有时候，织女也帮助牛郎干些地里的活。两个人勤劳节俭，日子过得挺美满。转眼间两三个年头过去了，他们生了一个男孩和一个女孩。到孩子能说话的时候，晚上得空，织女就指着星星，给孩子们讲些天上的故事。天上虽然富丽堂皇，可是没有自由，她不喜欢。她喜欢人间的生活：跟牛郎一块儿干活，她喜欢；逗着兄妹俩玩，她喜欢；看门前小溪的水活泼地流过去，她喜欢；听晓风晚风轻轻地吹过树林，她喜欢。两个孩子听她这么说，就偎在她怀里，叫一声“娘”，回过头来又叫一声“爹”。她乐极了，可是有时候也发愁。愁什么呢？她没告诉牛郎。她是怕外祖母知道她在这儿会来找她。", "一天，牛郎去喂牛，那头衰老的牛又说话了，眼眶里满是眼泪：“我快不行了，不能帮你们下地干活了……我死以后，你把我的皮留着。碰见什么紧急事，你就披上我的皮……”老牛没说完就死了。夫妻两个痛哭了一场，留下老牛的皮，把老牛的尸骨埋在草房后边的山坡上。", "用之前学到的阅读方法，尽可能快地"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 11, "book": "五年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "古诗三首​", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": "宋", "page": 52, "chars": 261, "paras": ["示  儿[宋] 陆 游死去元知万事空，但悲不见九州同。", "王师北定中原日，家祭无忘告乃翁。", "题临安  邸[宋] 林 升山外青山楼外楼，西湖歌舞几时休？", "暖风熏得游人醉，直把杭州作汴州。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 12, "book": "五年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "少年中国说（节选）​", "section": "阅读", "domain": "reading", "genre": "文言文", "author": null, "dynasty": null, "page": 54, "chars": 585, "paras": ["故今日之责任，不在他人，而全在我少年。少年智则国智，少年富则国富，少年强则国强，少年独立则国独立，少年自由则国自由，少年进步则国进步，少年胜于欧洲则国胜于欧洲，少年雄于地球则国雄于地球。", "红日初升，其道大光。河出伏流，一泻汪洋。潜龙腾渊，鳞爪飞扬。乳虎啸谷，百兽震惶。鹰隼试翼，风尘吸张②。", "奇花初胎，矞矞皇皇③。干将发硎，有作其芒④。天戴其苍，地履其黄⑤。纵有千古，横有八荒⑥。前途似海，来日方长。", "美哉⑦，我少年中国，与天不老！壮哉，我中国少年，与国无疆！", "少年中国说（节选）正确、流利地"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 13, "book": "五年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "圆明园的毁灭​", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 56, "chars": 584, "paras": ["圆明园的毁灭是中国文化史上不可估量的损失，也是世界文化史上不可估量的损失！", "圆明园在北京西北部，是一座举世闻名的皇家园林。它由圆明园、绮春园和长春园组成，所以也叫圆明三园。此外，还有许多小园，分布在圆明园东、西、南三面，众星拱月般环绕在圆明园周围。", "圆明园中，有金碧辉煌的殿堂，也有玲珑剔透的亭台楼阁；有象征着热闹街市的“买卖街”，也有象征着田园风光的山乡村野。", "园中许多景物都是仿照各地名胜建造的，如海宁的安澜园、苏州的狮子林、杭州西湖的平湖秋月；还有很多景物是根据古代文人的诗情画意建造的，如蓬岛瑶台、武陵春色。园中不仅有民族建筑，还有西洋景观。漫步园内，有如漫游在天南海北，饱览着中外风景名胜；流连其间，仿佛置身在幻想的境界里。", "圆明园不但建筑宏伟，还收藏着最珍贵的历史文物：上自先秦时代的青铜礼器，下至唐、宋、元、明、清历代的名人书画和各种奇珍异宝。所以，它又是当时世界上最大的博物馆、艺术馆。", "1860年10月6日，英法联军侵入北京，闯进圆明园。他们把园内凡是拿得动的东西，统统掠走；拿不动的，就用大车或牲口搬运；实在运不走的，就任意破坏、毁掉。为了销毁罪证，10月18日和19日，三千多名侵略者奉命在园内放火。大火连烧三天，烟云笼罩了整个北京城。我国这一园林艺术的瑰宝、建筑艺术的精华，就这样化为一片灰烬。"], "tasks": [], "newchars": ["圆明园的毁灭"]}, {"grade": "五年级", "term": "上册", "no": 14, "book": "五年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "梅兰芳蓄须明志​", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 59, "chars": 1128, "paras": ["梅兰芳先生是闻名世界的京剧表演艺术家。他在舞台上唱旦角，为了演出的需要，总是把胡须剃得干干净净的。但他的一生中，有几年却是留着胡须的。", "1937年，日军占领上海，梅兰芳被迫藏身租界，以躲避日本人的纠缠。1938年底，有人邀请他去香港演戏。演出结束后，梅兰芳在香港住了下来，深居简出，不再登台。对于一个视舞台为生活、视艺术为生命的人来说，不能演出，不能创作，无异于虚度生命。到了深夜，梅兰芳关紧门窗，拉上特制的厚窗帘，才能在寓所悄悄地细声吟唱，这对他来说已经很知足了。一个艺术大师就用这种方式坚持着对艺术的追求。", "1941年12月香港沦陷。日本驻港司令官亲自出马，多次逼迫梅兰芳演戏。梅兰芳可以忍受生活的困顿，直面战争的危险，但他难以抵抗来自侵略者随时随地的骚扰。拒绝的借口都用尽了，梅兰芳最后只能蓄须明志，表示对日本帝国主义的抗议，表明不给侵略者演戏的决心。后来，梅兰芳不堪其扰，只好又回到了上海。", "梅兰芳蓄须明志*① 本文作者李大同（1938—2005），选作课文时有改动。", "长期不演戏，没有了经济来源，又要养家，梅兰芳准备卖掉北京的房子。听说梅兰芳要卖房子，很多戏园子老板找上门来说：“梅先生，您何必卖房子，只要您把胡子一剃，一登台，还愁没钱花？”有的甚至说，只要签订演出合同，就预支二十两黄金给梅兰芳。但是，无论戏园子老板开出的条件多么优厚，梅兰芳全都拒绝了。他宁可卖房度日，也决不在日本侵略者的统治下登台演出。", "一次，日本侵略军要庆祝“大东亚圣战”，要求他必须上台演出。梅兰芳斩钉截铁地说：“普通的演出我都不参加，这样的庆祝会当然更不会去了。”但是，拒绝演出总得要想出个办法啊。", "梅兰芳找到一位当医生的好朋友，说明了自己的危险处境，请朋友设法让他生一场“大病”，以摆脱日本人。这个朋友被他的爱国精神感动了，决心帮助他渡过难关，于是给他打了伤寒预防针，人打了这种针就会连日发高烧。", "梅兰芳蓄  剃  租  纠  要  斩  烫  妄日本人不相信梅兰芳病了，专门派了一个军医来检查。日本军医闯进梅兰芳的家，看见他盖着棉被躺在床上，床边桌子上放着很多药。军医用手摸了摸梅兰芳的额头，滚烫滚烫的，看不出破绽，只好认定梅兰芳得了重病，不能登台演出了。日本侵略者的妄想最终没有实现，梅兰芳为此差点儿丢了性命。", "当抗日战争取得胜利的消息传来时，梅兰芳当即剃了胡须，高兴地向大家宣布：“胜利了，我该登台演出了！”前来看他演出的人太多了，很多人没有座位就站着看。", "作为艺术家，梅兰芳先生高超的表演艺术让人喜爱，他的民族气节更令人敬佩！"], "tasks": ["默读课文，说说梅兰芳用了哪些办法拒绝为日本人演戏，在这个过程中经历了哪些危险和困难。再结合资料，和同学交流为什么梅兰芳能成为闻名世界的京剧表演艺术家。"], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 22, "book": "五年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "示儿​", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": "宋", "page": 52, "chars": 261, "paras": ["示  儿[宋] 陆 游死去元知万事空，但悲不见九州同。", "王师北定中原日，家祭无忘告乃翁。", "题临安  邸[宋] 林 升山外青山楼外楼，西湖歌舞几时休？", "暖风熏得游人醉，直把杭州作汴州。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 23, "book": "五年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "题临安邸​", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": "宋", "page": 52, "chars": 261, "paras": ["示  儿[宋] 陆 游死去元知万事空，但悲不见九州同。", "王师北定中原日，家祭无忘告乃翁。", "题临安  邸[宋] 林 升山外青山楼外楼，西湖歌舞几时休？", "暖风熏得游人醉，直把杭州作汴州。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 24, "book": "五年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "己亥杂诗​", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "龚自珍九", "dynasty": "清", "page": 53, "chars": 349, "paras": ["己亥杂诗[清] 龚自珍九州生气恃风雷，万马齐喑究可哀。", "我劝天公重抖擞，不拘一格降人材。", "乃  邸  熏  亥  龚  恃有感情地"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 15, "book": "五年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "太阳​", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 66, "chars": 927, "paras": ["有这么一个传说，古时候，天上有十个太阳，晒得地面寸草不生。人们热得受不了，就找一个箭法很好的人射掉九个，只留下一个，地面上才不那么热了。其实，太阳离我们约有一亿五千万千米远。到太阳上去，如果步行，日夜不停地走，差不多要走三千五百年；就是坐飞机，也要飞二十几年。这么远，箭哪能射得到呢？", "我们看到太阳，觉得它并不大，实际上它大得很，约一百三十万个地球的体积才能抵得上一个太阳。因为太阳离地球太远了，所以看上去只有一个盘子那么大。", "太阳会发光，会发热，是个大火球。太阳的温度很高，表面温度有五千多摄氏度，就是钢铁碰到它，也会变成气体。", "太阳虽然离我们很远很远，但是它和我们的关系非常密切。有了太阳，地球上的庄稼和树木才能发芽，长叶，开花，结果；鸟、兽、虫、鱼才能生存，繁殖。如果没有太阳，地球上就不会有植物，也不会有动物。我们吃的粮食、蔬菜、水果、肉类，穿的棉、麻、毛、丝，都和太阳有密切的关系。埋在地下的煤炭，看起来好像跟太阳没有关系，其实离开太阳也不能形成，因为煤炭是由远古时代的植物埋在地层底下变成的。", "太  阳① 。", "地面上的水被太阳晒着的时候，吸收了热，变成了水蒸气。空气上升时，温度下降，其中的水蒸气凝成了无数的小水滴，飘浮在空中，变成云。云层里的小水滴越聚越多，就变成雨或雪落下来。", "太阳晒着地面，有些地区吸收的热量多，那里的空气就比较热；有些地区吸收的热量少，那里的空气就比较冷。空气有冷有热，才能流动，成为风。", "太阳光有杀菌的作用，我们可以利用它来预防和治疗疾病。", "地球上的光明和温暖都是太阳送来的。如果没有太阳，地球上将到处是黑暗，到处是寒冷，没有风、雪、雨、露，没有草、木、鸟、兽，自然也不会有人。一句话，没有太阳，就没有我们这个美丽可爱的世界。"], "tasks": ["默读课文，想一想：课文从哪些方面介绍了太阳？太阳和人类有什么密切关系？"], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 16, "book": "五年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "金字塔​", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 68, "chars": 1024, "paras": ["约230米胡夫金字塔示意图约146米塔原高约146米，塔基原边长约230米。因年久风化，塔现高约137米，塔基现边长约227米。", "古埃及金字塔是为法老①修建的陵墓，其侧影形似汉字“金”，因此，中国人称之为“金字塔”。古埃及修建了多座金字塔，由于自然风化和人为破坏，多数金字塔变成了一堆沙石，保存较为完整的为数不多。", "最大的金字塔现存最大的金字塔是胡夫金字塔，它建于公元前 2600年左右。", "建成几千年后，世界上才出现比它更高的建筑。", "金字塔塔原高约146米，塔基原边长约230米。因年久风化，塔现高约137米，塔基现边长约227米。", "塔的重量：约600万吨塔基面积：约5.3万平方米塔的体积：约260万立方米胡夫金字塔大概有50层楼高，塔基面积相当于126个篮球场那么大，塔身由约230万个石块堆砌而成，平均每个石块重2.5吨左右。塔内部有墓室，狭长、密闭的甬道将墓室和墓门连接起来。墓室顶上和墓门处的石块重达几十吨。", "建造技术在没有起重机的古埃及，人们是怎样把这些石块堆砌成塔的呢？有一种说法是，建造者先砌好底层，然后紧贴着一个侧面修建起一条和底层同样高度的平缓的斜坡，再借助斜坡将石块拉拽上去砌第二层。石块就这样一层层地堆砌起来，最终成了金字塔。胡夫金字塔的石块和石块之间没有水泥之类的黏着物，却贴合得很紧实。这样高超的建造技术，令人叹为观止。", "课文在介绍金字塔时运用了哪些说明方法？体会它们的表达效果。", "埃  狭  甬  黏狭基堆砌墓埃塔368 米运用《金字塔》中的图文信息，用一段话介绍胡夫金字塔。", "初试身手选择身边的一种事物，试着运用多种方法来说明它的特征。", "这座电视塔高368 米，大约有120 层楼那么高。它的外形像一个待发射的火箭。", "说明性文章通常抓住事物鲜明的特点进行具体说明，以帮助读者认识事物，获取知识。如，《太阳》围绕太阳体积大、温度高等特点来写，让读者对太阳有了更深入的了解。", "为了把事物说得清楚明白，说明性文章往往会使用打比方、列数字、举例子、作比较、画图表等说明方法。如，太阳的温度是很难感知的，但是告诉读者它的“表面温度有五千多摄氏度，就是钢铁碰到它，也会变成气体”，就容易理解了；许多人都不了解胡夫金字塔的大小，但是将其尺寸与常见事物进行比较，并在相应的文字旁边配上示意图，就能让读者形成直观的认识了。", "联系读过的说明性文章，说说这些文章是怎么清楚说明事物特点的。"], "tasks": ["默读课文，说说你了解了金字塔哪些方面的信息。"], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 17, "book": "五年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "慈母情深​", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 76, "chars": 1446, "paras": ["我一直想买一本长篇小说—《青年近卫军》。书价一元多钱。", "母亲还从来没有一次给过我这么多钱。我也从来没有向母亲一次要过这么多钱。", "但我想有一本《青年近卫军》，想得整天失魂落魄。", "我从同学家的收音机里听到过几次《青年近卫军》的连续广播。", "那时我家的破收音机已经卖了，被我和弟弟妹妹们吃进了肚子里。", "在自己对自己的怂恿之下，我来到母亲上班的地方，向母亲要钱。母亲那一年被铁路工厂辞退了，为了每月二十七元的收入，又在一个加工棉胶鞋帮的街道小厂上班。", "那是我第一次到母亲为我们挣钱的那个地方。", "空间非常低矮，低矮得使人感到压抑。不足二百平米的厂房，四壁潮湿颓败。七八十台破缝纫机一行行排列着，七八十个都不算年轻的女人忙碌在自己的缝纫机旁。因为光线阴暗，每个女人的头上方都吊着一只灯泡。正是酷暑炎夏，窗不能开，七八十个女人的身体和七八十只灯泡所散发的热量，使我感到犹如身在蒸笼。", "我呆呆地将那些女人扫视一遍，却发现不了我的母亲。", "七八十台破缝纫机发出的噪声震耳欲聋。", "“你找谁？”一个老头对我大声嚷。", "“找我妈！”", "慈母情深“你妈是谁？”", "我大声说出了母亲的名字。", "“那儿！”", "老头朝最里边的一个角落一指。", "我穿过一排排缝纫机，走到那个角落，看见一个极其瘦弱的脊背弯曲着，头凑到缝纫机板上。周围几只灯泡烤着我的脸。", "“妈—”“妈—”背直起来了，我的母亲。转过身来了，我的母亲。褐色的口罩上方，一双眼神疲惫的眼睛吃惊地望着我，我的母亲的眼睛……", "从这些细节中，我体会到母亲挣钱的艰难。", "母亲大声问：“你来干什么？”", "“我……”", "“有事快说，别耽误妈干活！”", "“我……要钱……”", "我本已不想说出“要钱”两字，可是竟说出来了！", "“要钱干什么？”", "“买书……”", "“多少钱？”", "“一元五角就行……”", "母亲掏衣兜，掏出一卷揉得皱皱的毛票，用皲裂的手指数着。", "旁边一个女人停止踏缝纫机，向母亲探过身，喊：“ 大姐，别给！没你这么当妈的！供他们吃，供他们穿，供他们上学，还供他们看闲书哇！”接着又对我喊：“你看你妈这是在怎么挣钱？你忍心朝你妈要钱买书哇？”", "母亲却已将钱塞在我手里了，大声回答那个女人：“ 谁叫我们是当妈的呀！我挺高兴他爱看书的！”", "母亲说完，立刻又坐了下去，立刻又弯曲了背，立刻又将头俯在缝纫机板上了，立刻又陷入手脚并用的机械忙碌状态……", "那一天我第一次发现，母亲原来是那么瘦小！那一天我第一次觉得自己长大了，应该是一个大人了。", "我鼻子一酸，攥着钱跑了出去……", "那天，我用那一元五角钱给母亲买了一听水果罐头。", "“你这孩子，谁叫你给我买水果罐头的！不是你说买书，妈才舍不得给你这么多钱呢！”"], "tasks": ["默读课文，说说哪些细节让你感受到了“慈母情深”。"], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 18, "book": "五年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "父爱之舟", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 80, "chars": 1835, "paras": ["绘是昨夜梦中的经历吧，我刚刚梦醒！", "朦胧中，父亲和母亲在半夜起来给蚕宝宝添桑叶……每年卖茧子的时候，我总跟在父亲身后，卖了茧子，父亲便给我买枇杷吃……", "我又见到了姑爹那只小渔船。父亲送我离开家乡去报考学校和上学，总是要借用姑爹那只小渔船。他同姑爹一起摇船送我。带了米在船上做饭，晚上就睡在船上，这样可以节省饭钱和旅店钱。我们不肯轻易上岸，花钱住旅店的教训太深了。有一次，父亲同我住了一间最便宜的小客栈，半夜我被臭虫咬醒，身上都是被咬的大红疙瘩。父亲心疼极了，叫来茶房，让他看满床乱爬的臭虫和我身上的疙瘩。茶房说没办法，要么加点儿钱换个较好的房间。父亲动心了，但我年纪虽小却早已深深体会到父亲挣钱的艰难。他平时节省到极点，自己是一分冤枉钱也不肯花的，我反正已被咬了半夜，只剩下后半夜，就不肯再加钱换房间。", "恍恍惚惚我又置身于两年一度的庙会中，能去看看这盛大的节日的确是无比的快乐，我高兴极了。我看各样彩排着的戏人边走边唱，看踩高跷走路，看虾兵、蚌精、牛头、马面……人山人海，卖小吃的挤得密密层层，各式各样的糖果点心、鸡鸭鱼肉都有。我和父亲都饿了，我多馋啊！但不敢，也不忍心叫父亲买。父亲从家里带了粽子，找个偏僻的地方，父子俩坐下吃凉粽子。吃完粽子，父亲觉得我太委屈了，领我到小摊上吃了碗热豆腐脑，我叫他也吃，他就是不吃。卖玩意儿的也不少，彩色的纸风车、布老虎、泥人、竹制的花蛇……虽然不可能花钱买玩意儿，但父亲很理解我那恋恋不舍的心思，回家后他用几片玻璃和彩色纸屑等糊了一个万花筒，这便是我童年唯一的也是最珍贵的玩具了。万花筒里那千变万化的图案花样，是我最早的抽象美的启迪者吧！", "父亲经常说要我念好书，最好将来到外面当个教员，所以我从来不缺课，不逃学。读初小的时候，遇上大雨大雪天，路滑难走，父亲便背着我上学。我背着书包伏在他背上，双手撑起一把结结实实的大黄油布雨伞。他扎紧裤脚，穿一双深筒钉鞋，将棉袍的下半截撩起扎在腰里，腰里那条极长的粉绿色丝绸汗巾可以围腰两三圈，那还是母亲出嫁时的陪嫁呢。", "初小毕业时，我考取了鹅山高小。要住在鹅山当寄宿生，就要缴饭费、宿费、学杂费，书本费也贵了，于是家里粜稻，卖猪，每  绘学期开学要凑一笔不少的钱。钱很紧，但家里愿意把钱都花在我身上。我拿着凑来的钱去缴学费，感到十分心酸。父亲送我到学校，替我铺好床，他回家时，我偷偷哭了。这是我第一次真正心酸的哭，与在家里撒娇的哭、发脾气的哭、打架的哭都大不一样，是人生道路中品尝到的新滋味了。", "我唯一的法宝就是考试，从未落过榜。我又要去报考无锡师范了。", "为了节省路费，父亲又向姑爹借了他家的小渔船，同姑爹两人摇船送我到无锡。时值暑天，为避免炎热，夜晚便开船，父亲和姑爹轮换摇橹，让我在小舱里睡觉。", "但我也睡不好，因为确确实实已意识到考不取的严重性，自然更未能领略到满天星斗、小河里孤舟缓缓夜行的诗画意境。船上备一只泥灶，自己煮饭吃，小船兼作旅店和饭店，节省了食宿费。只是我们的船不敢停到无锡师范附近，怕被别的考生及家长见了嘲笑。", "老天不负苦心人，他的儿子考取了。送我去入学的时候，依旧是那只小船，依旧是姑爹和父亲轮换摇船。不过父亲不摇橹的时候，便抓紧时间为我缝补棉被，因我那长期卧病的母亲未能给我备齐行装。我从舱里往外看，父亲那弯腰低头缝补的背影挡住了我的视线。后来我读到朱自清先生的《背影》时，这个船舱里的背影也就分外明显，永难磨灭了！不仅是背影时时在我眼前显现，鲁迅笔下的乌篷船对我而言也永远是那么亲切。虽然姑爹小船上盖的只是破旧的篷，远比不上绍兴的乌篷船精致，但姑爹的小渔船仍然是那么亲切，那么难忘……我什么时候能够用自己手中的笔，把那只载着父爱的小船画出来就好了！", "……醒来，枕边一片湿。"], "tasks": ["默读课文。说一说：在“我”的梦中出现了哪些难忘的细节？哪个细节给你的印象最深？"], "newchars": ["扎陪嫁毕猪鲁挣省糖委迪缺蚕茧"]}, {"grade": "五年级", "term": "上册", "no": 19, "book": "五年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "航天员写给孩子的信", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 84, "chars": 1428, "paras": ["亲爱的孩子们：此时此刻，妈妈已经在酒泉卫星发射中心的问天阁了。2022年的这个“六一”儿童节，妈妈不能陪伴你们，只能在这个特殊的日子里，给你们写下这封信。再过几天，妈妈就要飞向太空，去执行“神舟十四号”载人飞行任务，要离开半年的时间，真是舍不得你们。", "亲爱的孩子，每次想起你们，妈妈心中就像阳光融化巧克力般甜蜜温暖；每次想起你们，妈妈心中就会泛起阵阵幸福的涟漪。真的谢谢你们来到妈妈的身边！", "亲爱的孩子，原谅妈妈拒绝你们到发射现场送行的请求，因为妈妈爱你们，你们是妈妈的铠甲，也是妈妈的软肋。我是妈妈，也是一名军人。那一刻妈妈是要出征，临危忘身，受命忘家，这是军人的职责。那一刻看到你们，我怕会有太多的牵挂和不舍，我怕我忍不住会哭！", "2022年，“神舟十四号”载人飞船搭载三名航天员奔赴太空执行任务，实现了问天、梦天实验舱与天和核心舱的交会对接，航天员还利用气闸舱和小机械臂进行了出舱活动。刘洋作为此次执行任务的航天员之一，在出征前给自己的孩子写了一封信。读一读这封信，说说哪些地方打动了你。", "*19 航天员写给孩子的信孩子，妈妈有妈妈的梦想和使命，就让妈妈尽可能放下牵挂，奔赴自己的星辰大海吧！妈妈答应你们，等我凯旋的时候，让爸爸带着你们来接我，那时我会张开双臂，把你们紧紧拥入怀中。", "亲爱的孩子，咱们曾经无数次讨论过妈妈执行任务的事，你们总是红了眼眶万般不舍，妈妈何尝不是？妈妈答应过你们，要好好完成任务，在太空建一座大大的房子，装进无数人的梦想；妈妈答应过你们，要为你们拍很多美丽的照片，回来和大家分享；妈妈答应过你们，要把祝福和梦想写进满天繁星……", "孩子，你们答应妈妈的事也一定要记得啊。爷爷奶奶身体不好，爸爸工作繁忙，你们要帮着爸爸分担，多关心爷爷奶奶。姥姥姥爷也上了年纪，他们想念你们，也牵挂妈妈，记得要多给姥姥姥爷打电话，让他们开心。", "亲爱的孩子，人生一定要有梦想，那将是你们生命中的光，即使身处黑暗，即使身处困境也总能看到方向。那束光，将指引你们走出泥淖，走向万丈光芒。", "亲爱的孩子，现在你们尚未明确自己的梦想，这并不可怕，也不必慌张，慢慢成长，终会发现心中的追求。但亲爱的孩子，实现梦想的道路绝不可能一帆风顺，不要怕困难，不要怕挑战，不要怕失败。困难就像纸老虎，你强它就弱，要有勇气打败它。", "孩子们，记得读书、运动，记得守时、自律。养成良好的习惯，它将是你们实现梦想的助手，让你们一生受益无穷。", "亲爱的女儿，你就要上三年级了，那是小学的一个重要转折。", "亲爱的儿子，你即将背上小书包成为小学生了。当年，妈妈见证了姐姐背上小书包第一次走进校门时的灿烂笑容，但很遗憾，这一次妈妈没有办法亲自把你送到学校，见证你背上小书包那一瞬间的成长。你们要知道，虽然你们缺失了一些妈妈的陪伴，但是妈妈对你们的爱如海之深、天之阔，丝毫不会减少。", "妈妈离开家的那天，你俩抱着我，泪水涟涟，舍不得妈妈走。", "妈妈强忍着泪水，又何尝舍得？但我知道你们理解妈妈，爱妈妈，支持妈妈！孩子们，等着妈妈，等着妈妈拥抱完星辰大海再来拥抱你们！", "分别前，你们总是问我：“ 妈妈，我们想你怎么办呢？”孩子们，想妈妈的时候，就抬头看看天空吧。漫天星辰闪烁，那是妈妈在对你们说：“我爱你们！”", "信写至此，夜已深。不禁想起你们睡梦中甜美的面庞，真想再亲亲你们，抱抱你们。", "深深爱着你们的妈妈2022年6月1日于问天阁涟  漪  谅  铠  肋  赴  辰  凯  姥  淖  尚  憾"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 20, "book": "五年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "古诗三首​", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "王维空山", "dynasty": "唐", "page": 92, "chars": 246, "paras": ["山居秋暝[唐] 王维空山新雨后，天气晚来秋。", "明月松间照，清泉石上流。", "竹喧归浣女，莲动下渔舟。", "随意春芳歇，王孙自可留。", "姑苏城外寒山寺，夜半钟声到客船。"], "tasks": [], "newchars": ["古诗三首"]}, {"grade": "五年级", "term": "上册", "no": 21, "book": "五年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "第一场雪​", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 94, "chars": 911, "paras": ["“侵入”这个词让人感受到冷空气来势凶猛。", "十一月十七日，气象台发布了西伯利亚来的寒流即将南下的消息。第二天，强大的冷空气就侵入了胶东半岛。", "前些天还暖和得如同阳春三月，一清早，天气骤然变冷，空中布满了铅色的阴云。中午，凛冽的寒风刮起来了，呼呼地刮了整整一个下午。黄昏时分，风停了，那鹅毛般的大雪就纷纷扬扬地落了下来。这是入冬以来的第一场雪。", "开始下雪时还伴着小雨，不久雨住了，风停了，就只见大片大片的雪花，从彤云密布的天空中飘落下来，地上一会儿就白了。冬天的山村到了夜里格外寂静，只听见雪花簌簌地不断下落。偶尔咯吱一声响，树木的枯枝被积雪压断了。", "大雪整整下了一夜。第二天早晨，天放晴了，太阳出来了。推开门一看，嗬！好大的雪啊！山川、树木、房屋，全都笼罩上了一层白茫茫的厚雪，万里江山变成了粉妆玉砌的世界。落光叶子的柳树上，挂满了毛茸茸、亮晶晶的银条儿；冬夏常青的松树和柏树，堆满了蓬松松、沉甸甸的雪球儿。", "一阵风吹来，树枝轻轻地摇晃，那美丽的银条儿和雪球儿簌簌地落下来，玉屑似的雪末儿随风飘扬，① 本文作者峻青（1923—2019），选作课文时有改动。", "第一场雪"], "tasks": [], "newchars": ["瑞枕虹俗屑茫"]}, {"grade": "五年级", "term": "上册", "no": 22, "book": "五年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "白鹭​", "section": "阅读", "domain": "reading", "genre": "课文", "author": "郭沫若", "dynasty": null, "page": 96, "chars": 592, "paras": ["白  鹭白鹭是一首精巧的诗。", "色素的配合，身段的大小，一切都很适宜。", "白鹤太大而嫌生硬，即使如粉红的朱鹭或灰色的苍鹭，也觉得大了一些，而且太不寻常了。", "然而白鹭却因为它的常见，而被人忘却了它的美。", "那雪白的蓑毛，那全身的流线型结构，那铁色的长喙，那青色的脚，增之一分则嫌长，减之一分则嫌短，素之一忽则嫌白，黛之一忽则嫌黑。", "在清水田里，时有一只两只白鹭站着钓鱼，整个的田便成了一幅嵌在玻璃框里的画。田的大小好像是有心人为白鹭设计的镜匣。", "晴天的清晨，每每看见它孤独地站立于小树的绝顶，看来像是不安稳，而它却很悠然。这是别的① 本文作者郭沫若（1892—1978），选作课文时有改动。", "鸟很难表现的一种嗜好。人们说它是在望哨，可它真是在望哨吗？", "黄昏的空中偶见白鹭的低飞，更是乡居生活中的一种恩惠。那是清澄的形象化，而且具有生命了。", "或许有人会感到美中不足，白鹭不会唱歌。但是白鹭本身不就是一首很优美的歌吗？", "—不，歌未免太铿锵了。", "白鹭实在是一首诗，一首韵在骨子里的散文诗。", "鹭  蓑  嵌  匣  嗜  澄恩韵素朱哨有感情地"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 42, "book": "五年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "山居秋暝​", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "王维空山", "dynasty": "唐", "page": 92, "chars": 246, "paras": ["山居秋暝[唐] 王维空山新雨后，天气晚来秋。", "明月松间照，清泉石上流。", "竹喧归浣女，莲动下渔舟。", "随意春芳歇，王孙自可留。", "姑苏城外寒山寺，夜半钟声到客船。"], "tasks": [], "newchars": ["古诗三首"]}, {"grade": "五年级", "term": "上册", "no": 43, "book": "五年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "枫桥夜泊​", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "王维空山", "dynasty": "唐", "page": 92, "chars": 246, "paras": ["山居秋暝[唐] 王维空山新雨后，天气晚来秋。", "明月松间照，清泉石上流。", "竹喧归浣女，莲动下渔舟。", "随意春芳歇，王孙自可留。", "姑苏城外寒山寺，夜半钟声到客船。"], "tasks": [], "newchars": ["古诗三首"]}, {"grade": "五年级", "term": "上册", "no": 44, "book": "五年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "早春呈水部张十八员外​", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 93, "chars": 250, "paras": ["有感情地"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "上册", "no": 23, "book": "五年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "古人谈读书​", "section": "阅读", "domain": "reading", "genre": "文言文", "author": null, "dynasty": null, "page": 102, "chars": 472, "paras": ["一◎  知之为知之，不知为不知，是知①也。", "◎  敏②而好③学，不耻④下问⑤。", "◎  默而识⑥之，学而不厌⑦，诲⑧人不倦。", "◎  \u0007我非生而知之者，好古，敏⑨以求之者也。", "◎  \u0007吾尝终日不食，终夜不寝，以思，无益，不如学也。", "—《论语》注释① 〔知〕同“智”，智慧。这里读zhì。", "古人谈读书耻  识  吾  论  矣正确、流利地"], "tasks": [], "newchars": ["岂矣吾谓耻"]}, {"grade": "五年级", "term": "上册", "no": 24, "book": "五年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "忆读书", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 104, "chars": 2381, "paras": ["一谈到读书，我的话就多了！", "我会认字后不到几年，就开始读书。倒不是四岁时读母亲教给我的国文教科书，而是七岁时开始自己读“话说天下大势，分久必合，合久必分……”的《三国演义》。", "那时，我的舅父杨子敬先生每天晚饭后，必给我们几个表兄妹讲一段《三国演义》，我听得津津有味，什么“宴桃园豪杰三结义，斩黄巾英雄首立功”，真是好听极了。但是他讲了半个钟头，就停下去干他的公事了。我只好带着对故事下文的无限期待，在母亲的催促下含泪上床。", "此后，我拿起一本《三国演义》，自己一知半解地读了起来，居然越看越明白。虽然字音都读得不对，比如把“凯”念作“岂”，把“诸”念作“者”之类，因为只学过那个字的一半。", "我第一次读《三国演义》，读到关羽死了，哭了一场，便把书丢下了。第二次再读时，到诸葛亮死了，又哭了一场，又把书丢下了。后来忘了是什么时候才把全书读到“分久必合”的结局。", "因为看《三国演义》引起了我对章回小说的兴趣，对于那部述说“官迫民反”的《水浒传》尤其欣赏。那部书里着力描写的人物，如林冲、武松、鲁智深，都有极其鲜明的性格，虽然因为作者要凑成三十六天罡七十二地煞，勉勉强强地凑满了一百零八人的数目，但我觉得比没有人物个性的《荡寇志》要强多了。", "《红楼梦》是我在十二三岁时看的，起初我对它的兴趣并不大，贾宝玉的女声女气、林黛玉的哭哭啼啼都使我厌烦。还是到了中年以后再拿起这部书看时，才尝到“满纸荒唐言，一把辛酸泪”所包含的一个朝代和家庭兴亡盛衰的滋味。", "总而言之，统而言之，我这一辈子读到的中外文艺作品不能算太少。我永远感到读书是我生命中最大的快乐！从读书中我还得到了做人处世要独立思考的大道理，这都是从修身课本中得不到的。", "我自1980 年到日本访问回来后，即因腿伤闭门不出，“行万里路”做不到了，“读万卷书”便是我唯一的消遣。我每天都会得到许多书刊，知道了许多事情，也认识了许多人物。同时，书看多了，我也会挑选、比较。比如说看了精彩的《西游记》就会丢下烦琐的《封神榜》，看了人物栩栩如生的《水浒传》就不会看索然无味的《荡寇志》。对于现代的文艺作品，那些写得朦朦胧胧的、堆砌了许多华丽词句的、无病而呻的文字，我一看就从脑中抹去。", "但是那些满带着真情实感、十分质朴浅显的篇章，哪怕只有几百上千字，也往往使我心动神移，不能自已！", "书看多了，从中也得到了一个体会，物怕比，人怕比，书也怕比，“不比不知道，一比吓一跳”。", "因此，某年的“六一”国际儿童节，有个儿童刊物要我给儿童写几句指导读书的话，我只写了九个字，就是：读书好，多读书，读好书。"], "tasks": ["默读课文，说说作者回忆了自己读书的哪些经历，她认为什么样的书才是好书。"], "newchars": ["宴津凯趣述舅刊遣朴某衰贾勉宴"]}, {"grade": "五年级", "term": "上册", "no": 25, "book": "五年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "走遍天下书为侣", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 109, "chars": 781, "paras": ["如果你独自驾舟环绕世界旅行，如果你只能带一样东西供自己娱乐，你会选择哪一样？一幅美丽的图画，一本有趣的书，一盒扑克牌，一个百音盒，还是一只口琴……", "似乎很难作出选择。", "如果你问到我，我会毫不犹豫地回答：“我会选择一本书。”", "一本书！我听到有人感叹了：如果你坐船周游世界，这一趟下来，你可以把它读上一百遍，最终你能背诵下来。", "对此，我的回答是：是的，我愿意读上一百遍，我愿意读到能背诵的程度。这有什么关系呢？你不会因为以前见过你的朋友就不愿再见到他们了吧？你不会因为熟悉家中的一切就弃家而去吧？你喜爱的书就像一个朋友，就像你的家。你已经见过朋友一百次了，可第一百零一次再见面时，你还会说：“真想不到你懂这个！”你每天都回家，可不管过了多少年，你还会说：“ 我怎么没注意过，灯光照着那个角落，光线怎么那么美！”", "*25 走遍天下书为侣你总能从一本书中发现新东西，不管你看过多少遍。", "所以，我愿意坐在自己的船里，一遍又一遍地读那本书。首先我会思考，故事中的人为什么这样做，作家为什么要写这个故事。", "然后，我会在脑子里继续把这个故事编下去，回过头来品味我最欣赏的一些片段，并问问自己为什么喜欢它们。我还会再读其他部分，并从中找到我以前忽略的东西。做完这些，我会把从书中学到的东西列个单子。最后，我会想象作者是什么样的，他会有怎样的生活经历……这真像与另一个人同船而行。", "一本你喜爱的书就是一位朋友，也是一处你随时想去就去的故地。从某种意义上说，它是你自己的东西，因为世上没有两个人会用同一种方式读同一本书。", "侣  娱  趟"], "tasks": ["默读课文，说说作者独自驾舟环绕世界旅行时，选择带一本书而不是其他物品的理由。作者说“你总能从一本书中发现新东西，不管你看过多少遍”，你认同这个说法吗？结合自己的阅读经历，和同学交流。"], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 1, "book": "五年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "古诗三首", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "范成大昼", "dynasty": "宋", "page": 2, "chars": 242, "paras": ["古诗三首④⑤⑥四时田园杂兴（其三十一）[宋] 范成大昼出耘田夜绩麻，村庄儿女各当家。", "童孙未解供耕织，也傍桑阴学种瓜。", "稚子  弄冰[宋] 杨万里稚子金盆脱晓冰，彩丝穿取当银钲。", "敲成玉磬穿林响，忽作玻璃碎地声。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 2, "book": "五年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "四时田园杂兴（其三十一）", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "范成大昼", "dynasty": "宋", "page": 2, "chars": 230, "paras": ["古诗三首④⑤⑥[宋] 范成大昼出耘田夜绩麻，村庄儿女各当家。", "童孙未解供耕织，也傍桑阴学种瓜。", "稚子  弄冰[宋] 杨万里稚子金盆脱晓冰，彩丝穿取当银钲。", "敲成玉磬穿林响，忽作玻璃碎地声。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 2, "book": "五年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "祖父的园子", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 4, "chars": 2048, "paras": ["我家有一个大花园，这花园里蜜蜂、蝴蝶、蜻蜓、蚂蚱，样样都有。蝴蝶有白蝴蝶、黄蝴蝶。这种蝴蝶小，不太好看。好看的是大红蝴蝶，满身带着金粉。蜻蜓是金的，蚂蚱是绿的。蜜蜂则嗡嗡地飞着，满身绒毛，落到一朵花上，胖乎乎，圆滚滚，就像一个小毛球似的不动了。", "花园里边明晃晃的，红的红，绿的绿，新鲜漂亮。", "据说这花园，从前是一个果园。祖母喜欢养羊，羊把果树给啃了，果树渐渐地都死了。到我有记忆的时候，园子里就只有一棵樱桃树、一棵李子树，因为樱桃和李子都不大结果子，所以觉得它们并不存在。小的时候，只觉得园子里边就有一棵大榆树。这榆树在园子的西北角上，来了风，榆树先呼叫，来了雨，榆树先冒烟。太阳一出来，榆树的叶子就发光了，它们闪烁得和沙滩上的蚌壳一样。", "祖父整天都在园子里，我也跟着他在里面转。祖父戴一顶大草帽，我戴一顶小草帽；祖父栽花，我就栽花；祖父拔草，我就拔草。祖父种小白菜的时候，我就跟在后边，用脚把那下了种的土窝一个一个地溜平。哪里会溜得准，不过是东一脚西一脚地瞎闹。有时不但没有把菜种盖上，反而把它踢飞了。", "祖父铲地，我也铲地。因为我太小，拿不动锄头，祖父就把锄头杆拔下来，让我单拿着那个锄头的“头”来铲。其实哪里是铲，祖父的园子本文选自 《呼兰河传》，作者萧红，选作课文时有改动。", "不过是伏在地上，用锄头乱钩一阵。我认不得哪个是苗，哪个是草，往往把韭菜当作野草割掉，把狗尾草当作谷穗留着。", "祖父发现我铲的那块地还留着一片狗尾草，就问我：“这是什么？”", "我说：“谷子。”", "祖父大笑起来，笑够了，把草拔下来，问我：“你每天吃的就是这个吗？”", "我说：“是的。”", "我看祖父还在笑，就说：“你不信，我到屋里拿来给你看。”", "我跑到屋里拿了一个谷穗，远远地抛给祖父，说：“这不是一样的吗？”", "祖父把我叫过去，慢慢讲给我听，说谷子是有芒针的，狗尾草却没有，只是毛嘟嘟的，很像狗尾巴。", "我并不细看，不过马马虎虎承认下来就是了。一抬头，看见一个黄瓜长大了，我跑过去摘下来，吃黄瓜去了。黄瓜还没有吃完，我又看见一只大蜻蜓从旁边飞过，于是丢下黄瓜又去追蜻蜓了。蜻蜓飞得那么快，哪里会追得上？好在一开始我也没有存心一定要追上，跟着蜻蜓跑了几步就又去做别的了。采一朵倭瓜花，捉一个绿蚂蚱，把蚂蚱腿用线绑上，绑了一会儿，线头上只拴着一条腿，而不见蚂蚱了。", "玩腻了，我又跑到祖父那里乱闹一阵。祖父浇菜，我也过来浇，但不是往菜上浇，而是拿着水瓢，拼尽了力气，把水往天空一扬，大喊着：“下雨啰！下雨啰！”", "太阳在园子里是特别大的，天空是特别高的。太阳光芒四射，亮得使人睁不开眼睛，亮得蚯蚓不敢钻出地面来，蝙蝠不敢从黑暗的地方飞出来。凡是在太阳下的，都是健康的、漂亮的。拍一拍手，仿佛大树都会发出声响；叫一两声，好像对面的土墙都会回答似的。", "花开了，就像睡醒了似的。鸟飞了，就像在天上逛似的。虫子叫了，就像在说话似的。一切都活了，要做什么，就做什么。要怎么样，就怎么样，都是自由的。倭瓜愿意爬上架就爬上架，愿意爬上房就爬上房。黄瓜愿意开一朵花，就开一朵花，愿意结一个瓜，就结一个瓜。若都不愿意，就是一个瓜也不结，一朵花也不开，也没有人问它。玉米愿意长多高就长多高，它若愿意长上天去，也没有人管。蝴蝶随意地飞，一会儿从墙头上飞来一对黄蝴蝶，一会儿又从墙头上飞走一只白蝴蝶。它们是从谁家来的，又要飞到谁家去？太阳也不知道。", "天空蓝悠悠的，又高又远。", "可是白云一来，一大团一大团的，从祖父的头上飘过，好像要压到祖父的草帽了。", "我玩累了，就在房子底下找个阴凉的地方睡着了。不用枕头，不用席子，把草帽遮在脸上就睡了。", "蚱啃樱蚌割嘟倭拴啰逛拔瞎瓢逛锄割拴嗡蚱樱榆蝴铲"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 3, "book": "五年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "稚子弄冰", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "范成大昼", "dynasty": "宋", "page": 2, "chars": 242, "paras": ["古诗三首④⑤⑥四时田园杂兴（其三十一）[宋] 范成大昼出耘田夜绩麻，村庄儿女各当家。", "童孙未解供耕织，也傍桑阴学种瓜。", "稚子  弄冰[宋] 杨万里稚子金盆脱晓冰，彩丝穿取当银钲。", "敲成玉磬穿林响，忽作玻璃碎地声。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 3, "book": "五年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "月是故乡明", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 8, "chars": 1122, "paras": ["*每个人都有个故乡，每个人的故乡都有个月亮。人人都爱自己故乡的月亮。", "但是，如果只有孤零零一个月亮，未免显得有点儿孤单。因此，在中国古代诗文中，总有什么东西给月亮当陪衬，最多的是山和水，比如“山高月小”“三潭印月”，不可胜数。我的故乡是在山东西北部的大平原上。我小的时候，从来没有见过山，也不知山为何物。我曾幻想，山大概是一个圆而粗的柱子吧，顶天立地，好不威风。后来到了济南，才见到山，恍然大悟：山原来是这个样子啊！因此，我在故乡望月，从来不同山联系。像苏东坡说的“月出于东山之上，徘徊于斗牛之间”，完全是我无法想象的。", "至于水，我故乡的小村子里却到处都是。几个大苇坑占了村子面积的一多半。在我这个小孩子眼中，虽不能像洞庭湖“八月湖水平”那样有气派，但也颇有烟波浩渺之势。到了夏天，黄昏后，我躺在坑边场院的地上，数天上的星星。有时候在古柳下面点起篝火，然后上树一摇，成群的知了飞落下来，比白天用嚼烂的麦粒去粘要容易得多。我天天晚上乐此不疲，天天盼望黄昏早早来临。", "到了更晚的时候，我走到坑边，抬头看到晴空一轮明月，清月是故乡明。", "自古以来，月亮常常寄托了中国人的思乡之情。"], "tasks": [], "newchars": ["徘徊渺篝萌澄澈旖旎瑞莱垠顷峨燕缀"]}, {"grade": "五年级", "term": "下册", "no": 4, "book": "五年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "村晚", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "雷震草满", "dynasty": "宋", "page": 3, "chars": 236, "paras": ["村  晚[宋] 雷震草满池塘水满陂，山衔落日浸寒漪。", "牧童归去横牛背，短笛无腔信口吹。", "有感情地"], "tasks": [], "newchars": ["昼耘供稚漪桑耘晓昼"]}, {"grade": "五年级", "term": "下册", "no": 4, "book": "五年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "梅花魂", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 10, "chars": 1232, "paras": ["*故乡的梅花又开了。一年一度，那朵朵冷艳、缕缕幽芳的梅花，总让我想起漂泊他乡、葬身异国的外祖父。", "我出生在东南亚的星岛，从小和外祖父生活在一起。外祖父年轻时读了不少经、史、诗、词，又能书善画，在星岛文坛颇负盛名。我很小的时候，外祖父常常抱着我，坐在花梨木大交椅上，一遍又一遍、不厌其烦地教我读唐诗宋词。每当读到“独在异乡为异客，每逢佳节倍思亲”“春草明年绿，王孙归不归”“自在飞花轻似梦，无边丝雨细如愁”之类的句子，常会有一颗两颗冰凉的泪珠落在我的腮边、手背。这时候，我会拍着手笑起来：“外公哭了！外公哭了！”老人总是摇摇头，长长地叹一口气，说：“莺儿，你还小呢，不懂！”", "外祖父家中有不少古玩，我偶尔摆弄，老人也不甚在意。唯独书房里那一幅老干虬枝的墨梅图，他分外爱惜，家人碰也碰不得。", "我五岁那年，有一回到书房玩耍，不小心在上面留了个脏手印，外祖父顿时拉下脸来。有生以来，我第一次听到他训斥我母亲：“孩子要管教好，这清白的梅花，是能玷污的吗？”训罢，便用刀片轻轻刮去污迹，又用细绸子慢慢抹净。看见慈祥的外祖父大发脾气，我梅花魂。", "心里又害怕又奇怪：一幅画而已，有什么稀罕的呢？", "有一天，母亲忽然跟我说：“莺儿，我们要回中国去！”", "“干吗要回去呢？”", "“那儿才是我们的祖国啊！”", "哦！祖国，就是那拥有长江、黄河、万里长城的地方吗？我欢呼起来，小小的心充满了欢乐。", "可是，我马上想起外祖父，我亲爱的外祖父。我问母亲：“外公走吗？”", "“外公年纪太大了……”", "我跑进外祖父的书房，老人正躺在藤椅上。我说：“外公，您也回祖国去吧！”", "想不到外祖父竟像小孩子一样，呜呜呜地哭了起来……", "离别的前一天早上，外祖父早早地起了床，把我叫到书房里，郑重地递给我一卷白杭绸包着的东西。我打开一看，原来是那幅墨梅图，就说：“外公，这不是您最宝贵的画吗？”", "“是啊，莺儿，你要好好保存！这梅花，是我们中国最有名的花。旁的花，大抵是春暖才开花。她却不一样，愈是寒冷，愈是风欺雪压，花开得愈精神，愈秀气。她是最有品格、最有灵魂、最有骨气的！几千年来，我们中华民族出了许多有气节的人物，他们不管历经多少磨难，不管受到怎样的欺凌，从来都是顶天立地，不肯低头折节。他们就像这梅花一样。一个中国人，无论在怎样的境遇里，总要有梅花的秉性才好！”", "回国的那一天正是元旦，虽然热带是无所谓隆冬的，但腊月天气，毕竟也凉飕飕的。外祖父把我们送到码头。风撩乱了老人平日梳理得整整齐齐的银发，我觉得外祖父一下子衰老了许多。", "船快开了，母亲只好狠下心来，拉着我登上大客轮。想不到眼含泪水的外祖父也随着上了船，递给我一块手绢——雪白的细亚麻布上绣着血色的梅花。", "当年的我，还过于稚嫩，并不懂得，我带走的，岂止是我慈爱的外祖父珍藏的一幅丹青、几朵血梅？我带走的，是身在异国的华侨老人一颗眷恋祖国的赤子心啊！"], "tasks": ["默读课文，说说课文写了外祖父的哪几件事，表现了他怎样的感情，再和同学交流你对题目的理解。"], "newchars": ["腮虬玷郑秉飕码撩绢侨眷"]}, {"grade": "五年级", "term": "下册", "no": 9, "book": "五年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "走进他们的童年岁月", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 13, "chars": 363, "paras": ["童年是纯真、难忘的岁月，每个人都有自己的童年。你知道大人们的童年是什么样的吗？让我们走进他们的童年岁月，了解他们小时候的故事。", "先想一想可以了解谁的童年，如祖父母、外祖父母、父母、邻居，再针对不同的对象，列出问题清单。下面两个问题清单供你参考。", "要认真、耐心地听别人讲话，一边听一边作简要的记录，不要随意打断别人，不明白的地方或感兴趣的内容可以适当追问。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 5, "book": "五年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "草船借箭", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 18, "chars": 1989, "paras": ["周瑜对诸葛亮心怀妒忌。", "有一天，周瑜请诸葛亮商议军事，说：“我们就要跟曹军交战了。水上交战，用什么兵器最好？”诸葛亮说：“用弓箭最好。”周瑜说：“对，先生跟我想的一样。现在军中缺箭，想请先生负责赶造十万支。这是公事，希望先生不要推却。”诸葛亮说：“都督委托，当然照办。不知道这十万支箭什么时候用？”周瑜问：“十天造得好吗？”诸葛亮说：“既然就要交战，十天造好，必然误了大事。”周瑜问：“先生预计几天可以造好？”诸葛亮说：“只要三天。”", "周瑜说：“军情紧急，可不能开玩笑。”诸葛亮说：“怎么敢跟都督开玩笑？我愿意立下军令状，三天造不好，甘受重罚。”周瑜很高兴，叫诸葛亮当面立下军令状，又摆了酒席招待他。诸葛亮说：“今天来不及了。从明天算起，到第三天，请派五百个军士到江边来搬箭。”诸葛亮喝了几杯酒就走了。", "鲁肃对周瑜说：“十万支箭，三天怎么造得成呢？诸葛亮说的是假话吧？”周瑜说：“是他自己说的，我可没逼他。我得吩咐军匠们，叫他们故意迟延，造箭用的材料不给他准备齐全。到时候造不成，定他的罪，他就没话可说了。你去探听探听，看他怎么打算，回来报告我。”", "鲁肃见了诸葛亮。诸葛亮说：“三天之内要造十万支箭，得请你草船借箭本文根据元末明初罗贯中的 《三国演义》第四十六回相关内容改写。", "帮帮我的忙。”鲁肃说：“都是你自找的，我怎么帮得了你的忙？” 诸葛亮说：“你借给我二十条船，每条船上要三十多名军士。船用青布幔子遮起来，还要一千多个草把子，排在船的两边。我自有妙用。第三天管保有十万支箭。不过不能让都督知道。他要是知道了，我的计划就完了。”", "鲁肃答应了。他不知道诸葛亮借船有什么用，回来报告周瑜，果然不提借船的事，只说诸葛亮不用竹子、翎毛、胶漆这些材料。", "周瑜疑惑起来，说：“到了第三天，看他怎么办！”", "鲁肃私自拨了二十条快船，每条船上配三十多名军士，照诸葛亮说的，布置好青布幔子和草把子，等诸葛亮调度。第一天，不见诸葛亮有什么动静；第二天，仍然不见诸葛亮有什么动静；直到第三天四更时候，诸葛亮秘密地把鲁肃请到船里。鲁肃问他：“你叫我来做什么？”诸葛亮说：“请你一起去取箭。”鲁肃问：“哪里去取？”", "诸葛亮说：“不用问，去了就知道。”诸葛亮吩咐把二十条船用绳索连接起来，朝北岸开去。", "这时候大雾漫天，江上的人连面对面都看不清。五更时分，船已经靠近曹军的水寨。诸葛亮下令把船头朝西，船尾朝东，一字摆开，又叫船上的军士一边擂鼓，一边呐喊。鲁肃吃惊地说：“如果曹兵出来，怎么办？”诸葛亮笑着说：“雾这么大，曹操一定不敢派兵出来。我们只管饮酒取乐，雾散了就回去。”", "曹操得知江上的动静后，就下令说：“江上雾很大，敌人忽然来攻，必有埋伏，我们看不清虚实，不要轻易出动。拨水军弓弩手朝他们射箭便是。”然后，他又派人去旱寨调来六千名弓弩手，到江边支援水军。一万多名弓弩手一齐朝江中放箭，箭好像下雨一样。诸葛亮又下令把船掉过来，船头朝东，船尾朝西，仍旧擂鼓呐喊，逼近曹军水寨受箭。", "到雾散时，诸葛亮下令返回。船两边的草把子上都插满了箭。", "诸葛亮吩咐军士们齐声高喊“谢谢曹丞相的箭”。曹操知道上了当，可是诸葛亮那边船轻水急，已经驶出二十多里，要追也来不及了。", "二十条船靠岸的时候，周瑜派来搬箭的五百个军士已经等在江边了。每条船有五六千支箭，二十条船总共有十万多支。鲁肃见了周瑜，告诉他借箭的经过。周瑜大吃一惊，长叹道：“诸葛亮神机妙算，我真比不上他！”", "瑜忌督幔翎寨擂呐弩丞鲁曹忌督委妒漆遮擂呐疑惑寨插"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 6, "book": "五年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "景阳冈", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 22, "chars": 3546, "paras": ["武松在路上行了几日，来到阳谷县地面。此去离县治还远。当日晌午时分，走得肚中饥渴，望见前面有一个酒店，挑着一面招旗在门前，上头写着五个字道：“三碗不过冈。”武松入到里面坐下，把梢棒①倚了，叫道：“主人家，快把酒来吃。”只见店主人把三只碗、一双箸、一碟热菜，放在武松面前，满满筛一碗酒来。武松拿起碗，一饮而尽，叫道：“这酒好生有气力！主人家，有饱肚的买些吃酒。”酒家道：“只有熟牛肉。”武松道：“好的切二三斤来吃酒。”店家去里面切出二斤熟牛肉，做一大盘子将来，放在武松面前，随即再筛一碗酒。武松吃了道：“好酒！”又筛下一碗，恰好吃了三碗酒，再也不来筛。武松敲着桌子叫道：“主人家，怎的不来筛酒？”酒家道：“客官要肉便添来。”武松道：“我也要酒，也再切些肉来。”酒家道：“肉便切来，添与客官吃，酒却不添了。”武松道：“却又作怪。”便问主人家道：“你如何不肯卖酒与我吃？”酒家道：“客官，你须见我门前招旗，上面明明写道‘三碗不过冈’。”", "武松道：“怎地唤做三碗不过冈？”酒家道：“俺家的酒，虽是村酒，却比老酒的滋味。但凡客人来我店中吃了三碗的，便醉了，过不得前面的山冈去。因此唤做‘三碗不过冈’。若是过往客人到此，只吃三碗，更不再问。”武松笑道：“原来恁地。我却吃了三碗，如何不醉？”酒家道：“我这酒叫做‘透瓶香’，又唤做‘出门倒’。初景阳冈本文选自元末明初施耐庵的 《水浒传》第二十三回，选作课文时有删节，题目为编者所加。", "入口时，醇好吃，少刻时便倒。”武松道：“休要胡说。没地①不还你钱，再筛三碗来我吃。”酒家见武松全然不动，又筛三碗。武松吃道：“端的好酒！主人家，我吃一碗，还你一碗钱，只顾筛来。”", "酒家道：“客官休只管要饮，这酒端的要醉倒人，没药医。”武松道：“休得胡说！便是你使蒙汗药在里面，我也有鼻子。”店家被他发话不过，一连又筛了三碗。武松道：“肉便再把二斤来吃。”酒家又切了二斤熟牛肉，再筛了三碗酒。武松吃得口滑，只顾要吃，去身边取出些碎银子，叫道：“主人家，你且来看我银子，还你酒肉钱勾么？”酒家看了道：“有余，还有些贴钱与你。”武松道：“不要你贴钱，只将酒来筛。”酒家道：“客官，你要吃酒时，还有五六碗酒哩，只怕你吃不的了。”武松道：“就有五六碗多时，你尽数筛将来。”酒家道：“你这条长汉，倘或醉倒了时，怎扶的你住？”武松答道：“要你扶的不算好汉。”酒家再筛了六碗酒与武松吃了。绰了梢棒，立起身来道：“我却又不曾醉。”走出门前来，笑道：“却不说‘三碗不过冈’！”手提梢棒便走。", "酒家赶出来叫道：“客官那里去？”武松立住了，问道：“叫我做甚么？我又不少你酒钱，唤我怎地？”酒家叫道：“我是好意。你且回来我家看官司榜文。”武松道：“甚么榜文？”酒家道：“如今前面景阳冈上，有只吊睛白额大虫，晚了出来伤人，坏了三二十条大汉性命。官司如今杖限打猎捕户，擒捉发落。冈子路口两边人民，都有榜文。可教往来客人，结伙成队，于巳、午、未三个时辰过冈，其余寅、卯、申、酉、戌、亥六个时辰，不许过冈。更兼单身客人，不许白日过冈，务要等伴结伙而过。这早晚正是未末申初时分，我见你走都不问人，枉送了自家性命。不如就我此间歇了，等明日慢慢凑的三二十人，一齐好过冈子。”武松听了，笑道：“我是清河县人氏，这条景阳冈上少也走过了一二十遭，几时见说有大虫！你休说这话来吓我！便有大虫，我也不怕。”酒家道：“我是好意救你。你不信时，进来看官司榜文。”武松道：“便真个有虎，老爷也不怕。你留我在家里歇，莫不半夜三更要谋我财，害我性命，却把大虫吓我？”酒家道：“你看么！我是一片好心，反做恶意，倒落得你恁地说。你不信我时，请尊便自行。”", "那酒店里主人摇着头，自进店里去了。这武松提了梢棒，大着步自过景阳冈来。约行了四五里路，来到冈子下，见一大树，刮去了皮，一片白，上写两行字。武松也颇识几字，抬头看时，上面写道：“近因景阳冈大虫伤人，但有过往客商，可于巳、午、未三个时辰，结伙成队过冈。请勿自误。”武松看了，笑道：“这是酒家诡诈，惊吓那等客人，便去那厮家里宿歇。我却怕甚么！”横拖着梢棒，便上冈子来。那时已有申牌时分。这轮红日，厌厌地相傍下山。武松乘着酒兴，只管走上冈子来。走不到半里多路，见一个败落的山神庙。行到庙前，见这庙门上贴着一张印信榜文。武松住了脚读时，上面写道：“阳谷县示：为这景阳冈上新有一只大虫，近来伤害人命。见今杖限各乡里正并猎户人等，打捕未获。如有过往客商人等，可于巳、午、未三个时辰，结伴过冈。其余时分及单身客人，白日不许过冈。恐被伤害性命不便。各宜知悉。”", "武松读了印信榜文，方知端的有虎。欲待发步再回酒店里来，寻思道：“我回去时，须吃他耻笑，不是好汉，难以转去。”存想了一回，说道：“怕甚么！且只顾上去，看怎地！”武松正走，看看酒涌上来，便把毡笠儿背在脊梁上，将梢棒绾在肋下，一步步上那冈子来。回头看这日色时，渐渐地坠下去了。此时正是十月间天气，日短夜长，容易得晚。武松自言自说道：“那得甚么大虫！人自怕了，不敢上山。”武松走了一直，酒力发作，焦热起来，一只手提着梢棒，一只手把胸膛前袒开，踉踉跄跄，直奔过乱树林来。见一块光挞挞大青石，把那梢棒倚在一边，放翻身体，却待要睡，只见发起一阵狂风来。", "那一阵风过处，只听得乱树背后扑地一声响，跳出一只吊睛白额大虫来。武松见了，叫声：“呵呀！”从青石上翻将下来，便拿那条梢棒在手里，闪在青石边。那个大虫又饥又渴，把两只爪在地下略按一按，和身望上一扑，从半空里撺将下来。武松被那一惊，酒都做冷汗出了。说时迟，那时快。武松见大虫扑来，只一闪，闪在大虫背后。那大虫背后看人最难，便把前爪搭在地下，把腰胯一掀，掀将起来。武松只一躲，躲在一边。大虫见掀他不着，吼一声，却似半天里起个霹雳，振得那山冈也动。把这铁棒也似虎尾倒竖起来，只一剪。武松却又闪在一边。原来那大虫拿人，只是一扑，一掀，一剪，三般提不着时，气性先自没了一半。那大虫又剪不着，再吼了一声，一兜兜将回来。武松见那大虫复翻身回来，双手轮①起梢棒，尽平生气力，只一棒，从半空劈将下来。只听得一声响，簌簌地将那树连枝带叶劈脸打将下来。定睛看时，一棒劈不着大虫。原来慌了，正打在枯树上，把那条梢棒折做两截，只拿得一半在手里。那大虫咆哮，性发起来，翻身又只一扑，扑将来。武松又只一跳，却退了十步远。那大虫却好把两只前爪搭在武松面前。武松将半截棒丢在一边，两只手就势把大虫顶花皮揪住，一按按将下来。那只大虫急要挣扎，早没了气力。被武松尽气力纳定，那里肯放半点儿松宽。武松把只脚望大虫面门上、眼睛里只顾乱踢。那大虫咆哮起来，把身底下扒起两堆黄泥，做了一个土坑。武松把那大虫嘴直按下黄泥坑里去。那大虫吃武松奈何得没了些气力。武松把左手紧紧地揪住顶花皮，偷出右手来，提起铁锤般大小拳头，尽平生之力，只顾打。打得五七十拳，那大虫眼里、口里、鼻子里、耳朵里都迸出鲜血来。那武松尽平昔神威，仗胸中武艺，半歇儿把大虫打做一堆，却似躺着一个锦布袋。", "武松放了手，来松树边寻那打折的棒橛，拿在手里，只怕大虫不死，把棒橛又打了一回。那大虫气都没了。武松再寻思道：“我就地拖得这死大虫下冈子去。”就血泊里双手来提时，那里提得动？原来使尽了气力，手脚都疏软②了。", "武松再来青石坐了半歇，寻思道：“天色看看黑了，倘或又跳出一只大虫来时，我却怎地斗得他过？且挣扎下冈子去，明早却来理会。”就石头边寻了毡笠儿，转过乱树林边，一步步挨下冈子来。", "按照故事的发展顺序，把下面的内容补充完整，再说说故事的主要内容。", "喝酒（          ）（          ）（          ）用自己的话详细讲述武松打虎的部分，可以加上适当的语气、表情和动作。", "对课文中的武松，人们有不同的评价。你有什么看法？说说你的理由。"], "tasks": ["默读课文，遇到不懂的词语，如“梢棒、筛酒”，可以猜一猜意思。"], "newchars": ["倚箸碟斤俺绰擒勿笠肋踉跄呵胯霹雳咆哮锤泊榜杖申膛截悉坠兼勿拖碟饥斤俺冈"]}, {"grade": "五年级", "term": "下册", "no": 7, "book": "五年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "猴王出世", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 28, "chars": 1353, "paras": ["*海外有一国土，名曰傲来国。国近大海，海中有一座名山，唤为花果山。那座山正当顶上，有一块仙石。其石有三丈六尺五寸高，有二丈四尺围圆。四面更无树木遮阴，左右倒有芝兰相衬。盖自开辟以来，每受天真地秀，日精月华，感之既久，遂有灵通之意。内育仙胞，一日迸裂，产一石卵，似圆球样大。因见风，化作一个石猴。那猴在山中，却会行走跳跃，食草木，饮涧泉，采山花，觅树果；与狼虫为伴，虎豹为群，獐鹿为友，猕猿为亲；夜宿石崖之下，朝游峰洞之中。", "猴王出世"], "tasks": [], "newchars": ["芝遂迸涧獐猕猿耶挈瞑窍碣楷镌挠劣呵"]}, {"grade": "五年级", "term": "下册", "no": 8, "book": "五年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "红楼春趣", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 31, "chars": 2330, "paras": ["*红楼春趣一语未了，只听窗外竹子上一声响，恰似窗屉子倒了一般，众人吓了一跳。丫鬟们出去瞧时，帘外丫头子们回道：“一个大蝴蝶风筝，挂在竹梢上了。”众丫鬟笑道：“好一个齐整风筝！不知是谁家放的，断了线。咱们拿下他①来。”宝玉等听了，也都出来看时，宝玉笑道：“我认得这风筝，这是大老爷那院里嫣红姑娘放的。拿下来给他送过去罢。”紫鹃笑道：“难道天下没有一样的风筝，单他有这个不成？二爷也太死心眼儿了！我不管，我且拿起来。”探春笑道：“紫鹃也太小器，你们一般有的，这会子拾人走了的，也不嫌个忌讳？”黛玉笑道：“可是呢。把咱们的拿出来，咱们也放放晦气②。”", "丫头们听见放风筝，巴不得一声儿，七手八脚，都忙着拿出来：也有美人儿的，也有沙雁儿的。丫头们搬高墩，捆剪子股儿，一面拨起籰子来。宝钗等立在院门前，命丫头们在院外敞地下放去。宝琴笑道：“你这个不好看，不如三姐姐的一个软翅子大凤凰好。”宝钗回头向翠墨笑道：“你去把你们的拿来也放放。”", "宝玉又兴头起来，也打发个小丫头子家去，说：“把昨日赖大《红楼梦》中的许多故事，在我国广为流传。这篇课文讲述的是宝玉、黛玉等在大观园里放风筝的故事。读读课文，能大致读懂就可以。读后"], "tasks": [], "newchars": ["屉嫣讳黛晦墩钗雯袭垫豁喇"]}, {"grade": "五年级", "term": "下册", "no": 20, "book": "五年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "读古典名著，品百味人生", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 39, "chars": 1032, "paras": ["诸葛亮足智多谋，李逵鲁莽刚猛，孙悟空神通广大，林黛玉多愁善感……", "让我们一起漫步中国古典名著长廊，走近这些人物，品读精彩故事。", "你读过吗漫漫取经路上，有妖魔鬼怪，有刀山火海，也有师徒四人坚定的背影和永不停歇的脚步。让我们随着唐僧、孙悟空、猪八戒和沙僧的脚步，体验《西游记》中险境迭出的取经之旅。三打白骨精、大战红孩儿、女儿国遇险、真假美猴王、三借芭蕉扇……一个个扣人心弦的故事会吸引我们一口气读下去。", "请看第六十一回“猪八戒助力败魔王，孙行者三调芭蕉扇”中，神通广大的孙悟空与同样变化多端的牛魔王斗法的精彩情形。", "这大圣收了金箍棒，捻诀念咒，摇身一变，变作一个海东青，飕的一翅，钻在云眼里，倒飞下来，落在天鹅身上，抱住颈项嗛眼。那牛王也知是孙行者变化，急忙抖抖翅，变作一只黄鹰，返来嗛海东青。行者又变作一个乌凤，专一赶黄鹰。牛王识得，又变作一只白鹤，长唳一声，向南飞去。行者立定，抖抖翎毛，又变作一只丹凤，高鸣一声。那白鹤见凤是鸟王，诸禽不敢妄动，刷的一翅，淬下山崖，将身一变，变作一只香獐，乜乜些些，在崖前吃草。行者认得，也就落下翅来，变作一只饿虎，剪尾跑蹄，要来赶獐作食。魔王慌了手脚，又变作一只金钱花斑的大豹，要伤饿虎。行者见了，迎着风，把头一幌，又变作一只金眼狻猊，声如霹雳，铁额铜头，复转身要食大豹。牛王着了急，又变作一个人熊，放开脚，就来擒那狻猊。行者打个滚，就变作一只赖象，鼻似长蛇，牙如竹笋，撒开鼻子，要去卷那人熊。", "——选自明代吴承恩的《西游记》第六十一回作者用生动的语言将这激烈的场面描写得动人心魄，快翻开《西游记》，看看更多精彩的故事吧！", "相信你可以读更多还有很多中国古典名著等着我们去阅读。", "煮酒论英雄、火烧赤壁、千里走单骑……无论是气势磅礴的战争场面，还是运筹帷幄的谋略，我们都能在《三国演义》中读到，从中领略历史的风云变幻。", "鲁智深倒拔垂杨柳，吴用智取生辰纲，宋江率军三打祝家庄……《水浒传》中到处都是英雄的豪情壮志。", "宝玉和众人结社赋诗，恣意畅快；黛玉葬花，凄美缠绵；湘云醉卧芍药丛，娇憨烂漫……在《红楼梦》里，既有家族盛衰、世事变迁，也有命运沉浮、人情冷暖。", "我很喜欢读回目，只要看一下某一回的标题，就可以猜出它主要讲了什么故事。", "古代长篇小说多是章回体。这些作品里，一回或若干回组成一个相对完整的小故事，连起来就串成了一个长篇故事。", "◎感受汉字的趣味，了解汉字文化。", "◎学习搜集资料的基本方法。", "◎学写简单的研究报告。", "第三单元横竖撇捺有乾坤，一笔一画成文章。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 22, "book": "五年级下册", "unit_no": 3, "unit_name": "第三单元", "title": "汉字真有趣", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 43, "chars": 1789, "paras": ["自由组成小组，讨论可以从哪些方面了解汉字。从下面的内容中选择一项，制订活动计划，根据计划开展活动。“阅读材料”供参考。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 23, "book": "五年级下册", "unit_no": 3, "unit_name": "第三单元", "title": "我爱你，汉字", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 47, "chars": 2360, "paras": ["汉字有着悠久的历史，蕴含着丰富的文化。我们每天都在学习和使用汉字，应该增进对汉字的了解，为汉字的规范使用做一些力所能及的事情。从下面的内容中选择一项开展活动，写一份简单的研究报告。“阅读材料”供参考。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 9, "book": "五年级下册", "unit_no": 4, "unit_name": "第四单元", "title": "古诗三首", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "陆游三万", "dynasty": "宋", "page": 54, "chars": 302, "paras": ["秋夜将晓出篱门迎凉有感[宋] 陆游三万里河东入海，五千仞岳上摩天。", "遗民泪尽胡尘里，南望王师又一年。", "黄沙百战穿金甲，不破楼兰终不还。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 10, "book": "五年级下册", "unit_no": 4, "unit_name": "第四单元", "title": "青山处处埋忠骨", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 56, "chars": 1032, "paras": ["一中南海，毛主席的卧室。", "写字台上，放着那封从朝鲜前线志愿军司令部发来的，由司令员彭德怀拟定的电报。", "我们今日7时已进入防空洞，毛岸英同3个参谋在房子内。11时敌机4架经过时，他们4人已出来。敌机过后，他们4人返回房子内，忽又来敌机4架，投下近百枚燃烧弹，命中房子，当时有二名参谋跑出，毛岸英及高瑞欣未及跑出被烧死。其他无损失。", "从见到这封电报起，毛主席整整一天没说一句话，只是一支接着一支地吸着烟。桌子上的饭菜已经热了几次。岸英是毛主席最心爱的长子，毛主席在他身上倾注了无限的父爱。当年，地下党的同志们冒着生命危险找到了岸英，把他送到毛主席身边。后来岸英去苏联青山处处埋忠骨。", "留学，回国后毛主席又亲自把爱子送到农村锻炼。那一次次的分离，岸英不都平平安安回到自己的身边来了吗？这次怎么会……“岸英！", "岸英！”毛主席用食指按着紧锁的眉头，情不自禁地喃喃着。", "​二秘书走了进来。", "“主席，志愿军司令部来电请示中央军委，是否将岸英的遗骨运回国内。”秘书凑近毛主席，轻声说，“朝鲜方面向主席表示慰问，说岸英同志是为朝鲜人民的解放事业牺牲的，也是朝鲜人民的儿子，请求把岸英安葬在朝鲜。”", "毛主席不由自主地站了起来，仰起头，望着天花板，强忍着心中的悲痛，目光中流露出无限的眷恋。岸英奔赴朝鲜时，他因为工作繁忙，未能见上一面，谁知竟成了永别！“儿子活着不能相见，就让我见见遗骨吧！”毛主席想。然而，他很快打消了这种念头。他若有所"], "tasks": [], "newchars": ["彭拟谋赴殊踌躇黯革", "锻炼眷赴拟彭谋瑞踌殊尊签搞躇革"]}, {"grade": "五年级", "term": "下册", "no": 11, "book": "五年级下册", "unit_no": 4, "unit_name": "第四单元", "title": "军神", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 59, "chars": 1830, "paras": ["军  神重庆临江门外，一个德国人开设的诊所里，医生沃克端坐在桌后。他头也不抬，冷冷地问：“你叫什么名字？”", "“刘大川。”", "“年龄？”", "“二十四岁。”", "“什么病？”", "“土匪打伤了眼睛。”", "沃克医生站起身，熟练地解开病人右眼上的绷带。", "他愣住了，蓝色的眼睛里闪出一丝惊疑。他重新审视着眼前这个人，冷冷地问：“你是干什么的？”", "“邮局职员。”", "“你是军人！”沃克医生一针见血地说，“我当过军医，这么重的伤势，只有军人才能这样从容镇定！”", "病人微微一笑，说：“沃克医生，你说我是军人，我就是军人吧。”", "沃克医生的目光柔和下来，他吩咐护士：“准备手术。”", "沃克医生正在换手术服，护士跑来，低声告诉他病人拒绝使用麻醉剂。沃克医生的眉毛扬了起来，他走进手术室，生气地说：“年轻人，在这儿要听医生的指挥！”", "病人平静地回答：“沃克医生，眼睛离脑子太近，我担心施行麻醉会影响脑神经。而我，今后需要一个非常清醒的大脑！”", "沃克医生再一次愣住了，竟有点儿口吃地说：“你，你能忍受吗？你的右眼需要摘除坏死的眼球，把烂肉和新生的息肉一刀刀割掉！”", "“试试看吧。”", "手术台上，一向从容镇定的沃克医生，这次双手却有些颤抖。", "他额上汗珠滚滚，护士帮他擦了一次又一次。最后他忍不住开口对病人说：“你挺不住可以哼叫。”", "病人一声不吭，他双手紧紧抓住身下的白床单，手背青筋暴起，汗如雨下。他越来越使劲，崭新的白床单居然被抓破了。", "脱去手术服的沃克医生擦着汗走过来，由衷地说：“年轻人，我真担心你会晕过去。”", "病人脸色苍白。他勉力一笑，说：“我一直在数你的刀数。”", "沃克医生吓了一跳，不相信地问：“我割了多少刀？”", "“七十二刀。”", "沃克医生惊呆了，大声嚷道：“你是一个真正的男子汉，一块会说话的钢板！你堪称军神！”", "“你过奖了。”", "沃克医生的脸上浮现出慈祥的神情。他想说什么又忍住了，挥手让护士出去，然后关上手术室的门，注视着病人，说：“告诉我，你的真名叫什么？”", "“刘伯承。”", "沃克医生肃然起敬：“啊，久仰久仰，认识你很荣幸。”刘伯承友好地把手伸了过去。", "沃克医生是怎么发现刘伯承是军人的？后来为什么称他为“军神”？", "从下面的句子中体会刘伯承的内心，再有感情地朗读。"], "tasks": ["朗读课文，注意读出人物说话的语气。"], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 12, "book": "五年级下册", "unit_no": 4, "unit_name": "第四单元", "title": "清贫", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 63, "chars": 1104, "paras": ["*清  贫我从事革命斗争，已经十余年了。在这长期的奋斗中，我一向是过着朴素的生活，从没有奢侈过。经手的款项，总在数百万元；但为革命而筹集的金钱，是一点一滴都用之于革命事业的。这在国方的伟人们①看来，颇似奇迹，或认为夸张；而矜持不苟，舍己为公，却是每个共产党员具备的美德。所以，如果有人问我身边有没有一些积蓄，那我可以告诉你一桩趣事。", "就在我被俘的那一天—一个最不幸的日子，有两个国方兵士，在树林中发现了我，而且猜到了我是什么人，他们满肚子热望在我身上搜出一千或八百大洋，或者搜出一些金镯金戒指一类的东西，发个意外之财。哪知道从我上身摸到下身，从袄领捏到袜底，除了一只时表和一支自来水笔，一个铜板都没有搜出。他们于是被激怒了，猜疑我是把钱藏在哪里，不肯拿出来。他们之中有一个，左手拿着一个木柄榴弹，右手拉出榴弹中的引线，双脚拉开一步，做出要抛掷的姿势，用凶恶的眼光盯着我，威吓地吼道：“赶快将钱拿出来，不然就是一炸弹，把你炸死去！”", "“哼！你不要做出那难看的样子来吧！我确实一个铜板都没有存，想从我这里发洋财，是想错了。”我微笑着，淡淡地说。", "“你骗谁！像你这样当大官的人会没有钱！”拿榴弹的兵士坚决不相信。", "“绝不会没有钱的，一定是藏在哪里，我是老出门的，骗不得我。” 另一个兵士一面说，一面弓着背将我的衣角裤裆过细地捏，总企望着有新的发现。", "“你们要相信我的话，不要瞎忙吧！我不比你们国民党当官，个个都有钱，我今天确实是一个铜板也没有，我们革命不是为着发财！”", "我再次向他们解释。", "等他们确知在我身上搜不出什么的时候，也就停手不搜了；又在我藏躲的地方周围，低头注目搜寻了一番，也毫无所得。他们是多么失望啊！那个持弹欲放的兵士，也将拉着的引线，仍旧塞进榴弹的木柄里， 转过来抢夺我的表和水笔。后来彼此说定表和笔卖出钱来平分，才算无话。他们用怀疑而又惊异的目光，对我自上而下地望了几遍，就同声命令：“走吧！”", "是不是还要问问我家里有没有一些财产？请等一下，让我想一想，啊，记起来了，有的有的，但不算多。去年暑天我穿的几套旧的汗褂裤， 与几双缝上底的线袜，已交给我的妻放在深山坞里保藏着—怕国军①进攻时，被人抢了去，准备今年暑天拿出来再穿；那些就算是我唯一的财产了。但我说出那几件“传世宝”来，岂不要叫那些富翁们齿冷三天？！", "清贫，洁白朴素的生活，正是我们革命者能够战胜许多困难的地方！", "一九三五年五月二十六日写于囚室筹矜俘镯吓裆企彼褂坞① 〔国军〕指国民党的军队。"], "tasks": ["默读课文，说说你从方志敏的自述中体会到他怎样的品质，再和同学交流你对“清贫”的理解。"], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 25, "book": "五年级下册", "unit_no": 4, "unit_name": "第四单元", "title": "从军行", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "陆游三万", "dynasty": "宋", "page": 54, "chars": 303, "paras": ["秋夜将晓出篱门迎凉有感[宋] 陆游三万里河东入海，五千仞岳上摩天。", "遗民泪尽胡尘里，南望王师又一年。", "黄沙百战穿金甲，不破楼兰终不还。"], "tasks": [], "newchars": ["古诗三首"]}, {"grade": "五年级", "term": "下册", "no": 26, "book": "五年级下册", "unit_no": 4, "unit_name": "第四单元", "title": "秋夜将晓出篱门迎凉有感", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "陆游三万", "dynasty": "宋", "page": 54, "chars": 295, "paras": ["[宋] 陆游三万里河东入海，五千仞岳上摩天。", "遗民泪尽胡尘里，南望王师又一年。", "黄沙百战穿金甲，不破楼兰终不还。"], "tasks": [], "newchars": ["古诗三首"]}, {"grade": "五年级", "term": "下册", "no": 27, "book": "五年级下册", "unit_no": 4, "unit_name": "第四单元", "title": "闻官军收河南河北", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": null, "page": 55, "chars": 283, "paras": ["借助注释，说说下面诗句的意思，再想想它们表达了诗人怎样的感情。"], "tasks": [], "newchars": ["岳仞篱摩遗涕巫"]}, {"grade": "五年级", "term": "下册", "no": 32, "book": "五年级下册", "unit_no": 4, "unit_name": "第四单元", "title": "了", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 65, "chars": 378, "paras": ["他生活中，谁陶醉、生气或伤心时的样子让你印象深刻？把题目补充完整，如“他陶醉了”“他生气了”“他伤心了”。回想一下，当时发生了什么事？事情的前因后果是什么？把这件事写下来，特别要把这个人当时的表现写具体，反映出他的内心。", "写好后，"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 13, "book": "五年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "人物描写一组", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 70, "chars": 401, "paras": ["人物描写一组摔  跤“要不—摔跤。”", "“是吗？”小胖墩儿跳起来，立刻退后两步，一闪身脱了单褂儿，叉着腰说，“来吧，是一叉一搂的，还是随便摔？”", "小嘎子在家里跟人摔跤，一向仗着手疾眼快，从不单凭力气，自然不跟他一叉一搂。两人把“枪”和“鞭”放在门墩儿上，各自虎势儿一站，公鸡鹐架似的对起阵来。起初，小嘎子精神抖擞，欺负对手傻大黑粗，动转不灵，围着他猴儿似的蹦来蹦去，总想使巧招，下冷绊子，仿佛很占了上风。可是小胖墩儿也是个摔跤的惯手，塌着腰，合了裆，鼓着眼珠子，不露一点儿破绽。两人走马灯似的转了三四圈，终于三抓两挠，揪在了一起。这一来，小嘎子可上了当：小胖墩儿膀大腰粗，一身牛劲儿，任你怎样推拉拽顶，硬是扳他不动。小嘎子已有些沉不住气，刚想用脚腕子去钩他的腿，不料反给他把脚别住了。小胖墩儿趁势往旁侧里一推，咕咚一声，小嘎子摔了个仰面朝天。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 14, "book": "五年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "刷子李", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 74, "chars": 1651, "paras": ["刷子李专干粉刷这一行。他要是给您刷好一间屋子，屋里什么都不用放，单坐着，就如同神仙一般快活。最让人叫绝的是，他刷浆时必穿一身黑，干完活，身上绝没有一个白点。别不信！他还给自己立下一个规矩，只要身上有白点，白刷不要钱。", "但这是传说，人信也不会全信。行外的没见过的不信，行内的生气愣说不信。", "一年的一天，刷子李收个徒弟叫曹小三。当徒弟的开头都是端茶、点烟、跟在屁股后边提东西。曹小三当然早就听说过师傅那手绝活，一直半信半疑，这回非要亲眼瞧瞧。", "那天，曹小三头一次跟师傅出去干活，到镇南道给姓李的人家新造的楼房刷浆。到了那儿，刷子李跟管事的人一谈，曹小三才知道师傅派头十足。照他的规矩一天只刷一间屋子。这楼房大小九间屋，得刷九天。干活前，他把随身带的一个四四方方的小包袱打开，果然一身黑衣黑裤，一双黑布鞋。穿上这身黑，就好像跟地上一桶白浆较上了劲。", "一间屋子，一个屋顶四面墙，先刷屋顶后刷墙。屋顶尤其难刷，蘸了稀溜溜粉浆的板刷往上一举，谁能一滴不掉？一掉准掉在身上。可刷子李一举刷子，就像没刷子李。", "有蘸浆。但刷子划过屋顶，立时匀匀实实一道白，白得透亮，白得清爽。有人说这蘸浆的手法有高招，有人说这调浆的配料有秘方。", "曹小三哪里看得出来？只见师傅的手臂悠然摆来，悠然摆去，如同伴着鼓点，和着琴音，每一摆刷，那长长的带浆的毛刷便在墙面啪地清脆一响，极是好听。啪啪声里，一道道浆，衔接得天衣无缝，刷过去的墙面，真好比平平整整打开一面雪白的屏障。可是曹小三最关心的还是刷子李身上到底有没有白点。", "刷子李干活还有一个规矩。", "每刷完一面墙，必得在凳子上坐一会儿，抽一袋烟，喝一碗茶，再刷下一面墙。此刻，曹小三借着给师傅倒水点烟的机会，拿目光仔细搜索刷子李的全身。每一面墙刷完，他搜索一遍，居然连一个芝麻大小的粉点也没发现。", "他真觉得这身黑色的衣服有种神圣不可侵犯的威严。", "当刷子李刷完最后一面墙，坐下来，曹小三给他点烟时，竟然瞧见刷子李裤子上出现一个白点，黄豆大小。黑中白，比白中黑更扎眼。完了，师傅露馅儿了，他不是神仙，往日传说中那如山般的形象轰然倒去。他怕师傅难堪，不敢说，也不敢看，可忍不住还要扫一眼。", "这时候，刷子李忽然朝他说话：“小三，你瞧见我裤子上的白点了吧？你以为师傅的能耐有假，名气有诈，是吧？傻小子，你再仔细瞧瞧吧—”说着，刷子李手指捏着裤子轻轻往上一提，那白点即刻没了，再一松手，白点又出现，奇了！他凑上脸用神再瞧，那白点原来是一个小洞！刚才抽烟时不小心烧的。里边的白衬裤打小洞透出来，看上去就跟粉浆落上去的白点一模一样！", "刷子李看着曹小三发怔发傻的模样，笑道：“好好学本事吧！”", "曹小三学徒的头一天，见到听到学到的，恐怕别人一辈子也不一定能明白呢。"], "tasks": ["默读课文，结合课文内容，说说刷子李这个人物的特点。"], "newchars": ["傅袱蘸圣馅诈怔圣犯捏诈傻馅轰堪袱傅障芝浆怔"]}, {"grade": "五年级", "term": "下册", "no": 35, "book": "五年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "摔跤", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 70, "chars": 401, "paras": ["人物描写一组摔  跤“要不—摔跤。”", "“是吗？”小胖墩儿跳起来，立刻退后两步，一闪身脱了单褂儿，叉着腰说，“来吧，是一叉一搂的，还是随便摔？”", "小嘎子在家里跟人摔跤，一向仗着手疾眼快，从不单凭力气，自然不跟他一叉一搂。两人把“枪”和“鞭”放在门墩儿上，各自虎势儿一站，公鸡鹐架似的对起阵来。起初，小嘎子精神抖擞，欺负对手傻大黑粗，动转不灵，围着他猴儿似的蹦来蹦去，总想使巧招，下冷绊子，仿佛很占了上风。可是小胖墩儿也是个摔跤的惯手，塌着腰，合了裆，鼓着眼珠子，不露一点儿破绽。两人走马灯似的转了三四圈，终于三抓两挠，揪在了一起。这一来，小嘎子可上了当：小胖墩儿膀大腰粗，一身牛劲儿，任你怎样推拉拽顶，硬是扳他不动。小嘎子已有些沉不住气，刚想用脚腕子去钩他的腿，不料反给他把脚别住了。小胖墩儿趁势往旁侧里一推，咕咚一声，小嘎子摔了个仰面朝天。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 36, "book": "五年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "他像一棵挺脱的树", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 71, "chars": 472, "paras": ["他的身量与筋肉都发展到年岁前边去了。二十来岁，他已经很大很高，虽然肢体还没被年月铸成一定的格局，可是已经像个成人了—一个脸上身上都带出天真淘气的样子的大人。看着那高等的车夫，他计划着怎样杀进他的腰②去，好更显出他的铁扇面似的胸与直硬的背。扭头看看自己的肩，多么宽，多么威严！杀好了腰，再穿上肥腿的白裤，裤脚用鸡肠子带儿系住，露出那对“出号”的大脚！是的，他无疑可以成为最出色的车夫，傻子似的他自己笑了。", "他没有什么模样，使他可爱的是脸上的精神。头不很大，圆眼，肉鼻子，两条眉很短很粗，头上永远剃得发亮；腮上没有多余的肉，脖子可是几乎与头一边儿粗；脸上永远红扑扑的，特别亮的是颧骨与右耳之间一块不小的疤bā—小时候在树下睡觉，被驴啃了一口。他不甚注意他的模样，他爱自己的脸正如同他爱自己的身体，都那么结实硬棒，他把脸仿佛算在四肢之内，只要硬棒就好。", "是的，到城里以后，他还能头朝下，倒着立半天。这样立着，他觉得，他就很像一棵树，上下没有一个地方不挺脱的。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 37, "book": "五年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "两茎灯草", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 72, "chars": 710, "paras": ["自此，严监生②的病，一日重似一日，再不回头。诸亲六眷都来问候。五个侄子穿梭的③过来陪郎中弄药。到中秋已后，医家都不下药了。把管庄的家人都从乡里叫了上来。病重得一连三天不能说话。晚间挤了一屋的人，桌上点着一盏灯。严监生喉咙里痰响得一进一出，一声不倒一声④的，总不得断气，还把手从被单里拿① 本文选自清代吴敬梓的 《儒林外史》第五、第六回，选作课文时有删节，题目为编者所加。", "举例说说三个片段分别用了哪些描写人物的方法，结合课文中的语句，体会这些方法的表达效果。", "出来，伸着两个指头。大侄子走上前来问道：“二叔，你莫不是还有两个亲人不曾见面？”他就把头摇了两三摇。二侄子走上前来问道：“二叔，莫不是还有两笔银子在那里，不曾吩咐明白？”他把两眼睁的的溜圆①，把头又狠狠摇了几摇，越发指得紧了。奶妈抱着哥子②插口道：“老爷想是因两位舅爷不在跟前，故此记念。”他听了这话，把眼闭着摇头，那手只是指着不动。赵氏慌忙揩揩眼泪，走近上前道：“爷，别人都说的不相干，只有我晓得你的意思！你是为那灯盏里点的是两茎灯草，不放心，恐费了油。我如今挑掉一茎就是了。”说罢，忙走去挑掉一茎。众人看严监生时，点一点头，把手垂下，登时就没了气。", "挠扳腕喉咙监侄剃腮疤仗搂鞭欺跤嘎绊揪扳腕铸颧疤监侄痰揩"], "tasks": ["默读课文，说说三个片段中的人物分别给你留下了什么印象，你是从哪些语句体会到的。"], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 40, "book": "五年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "我的朋友容容", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 78, "chars": 876, "paras": ["我的朋友容容是一个助人为乐的人。", "我订了一份报纸，每天早上，容容总是搬着椅子，爬上去，踮起脚，从大门口的邮箱里取出报纸来，然后爬下椅子，奔来把报纸交给我：“任叔叔，报纸来啦！”", "不知从什么时候开始，这已经成了她的习惯，而且她认为这是一项“权利”，是绝不能让别人侵犯的。", "有一天，我忘了尊重她的权利，自己去把报纸取来了。", "我正在看报，容容走来，她看看我手里的报纸，忽然噘起嘴，挺委屈地走了。过了一会儿，我听到她的哭声和奶奶又骂又哄的声音。起初我没在意，后来忽然感到这似乎跟报纸的事有些关系，过去一打听，果然，她是为了报纸的事在发脾气。", "我连忙把报纸送回大门口去。", "容容就不哭了，又搬着椅子去把报纸取来交给我，才又高兴起来。容容就是这么忠于职守。", "一天我下班回家，容容给我拿来一封信，是我的一个老同学从外地寄来的。容容似乎。", "课文细致地描写了容容的动作，表现了她取报纸的不容易。", "容容一天没有取到报纸就发脾气，这个事例体现了她“忠于职守”。", "对信产生了浓厚的兴趣，等我看完信，她好奇地问：“任叔叔，这是什么？”", "“这是信。”", "“信是什么？”", "“信就是信。譬如说，我有个好朋友，我有话跟他讲，我就可以写一封信寄给他。信封上写个名字，就可以寄了。”", "“那么我也可以寄信给好朋友吗？”", "“当然可以，如果你有好朋友的话。”我笑着说。", "“就拿这样的信封寄吗？”", "“对！”", "“到哪儿去寄呢？”", "“往邮筒里一塞就行。我们大门外边不就有个邮筒吗？”", "“知道啦！知道啦！”她高兴地说。", "不知什么时候，她把我的信封拿去玩了，我也没在意。不料过了一天，邮递员通知我说有一封“欠资待领”的信，叫我到邮局去领。我连忙上邮局付了邮资，领出信来一看，啊，原来又是那位老同学寄来的。这家伙开什么玩笑，信封上贴了张用过的旧邮票。拆开信一看，啊？难道他疯了？信封里连半张纸也没有，却装着一片梧桐树叶。真是奇怪！我把叶子翻来覆去看了半天，怎么也猜不出它藏着什么奥妙。", "我十分纳闷。回到家里，容容却跟在我旁边，老用一种异样的眼光看着我，似乎准备告诉我什么秘密。过了一容容追问“我”的话，显露出她的天真、好奇。"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 41, "book": "五年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "小守门员和他的观众们", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 80, "chars": 881, "paras": ["放学以后，孩子们又来到这片空地。他们分成两拨儿，把书包和帽子堆起来当球门，就摆开阵势赛起来。小弟弟小妹妹被吸引过来了，路过的大个子叔叔也坐到场边，欣赏他们这场球赛。", "看那个留平头的小守门员，他身着深蓝色的运动衣，浅蓝色的短裤，脚穿运动鞋，戴着手套。只见他分腿弯腰，上身前倾，目光警惕地注视着前方，膝盖磕破了也毫不在意，真像个专业的足球守门员！他想着自己可千万不能大意，绝不让对手冲破最后一道防线。站在小守门员身后的，是个腆着肚子的小男孩。他好像是候补的，一心想着快点儿上场，好显一显身手，扑住几个险球。", "比赛进入白热化阶段，小守门员和观众们紧紧盯着球场中的足球。那个戴红帽子的小女孩生怕别人挡住她，往外探着身子。那个扎蝴蝶结的女孩索性站了起来。搂着小弟弟的会儿，她似乎忍不住了，就拉住我，在我耳边轻轻地说：“任叔叔，我告诉你，我给你寄了一封信！真正的信！”", "“什么？”我好奇地问。", "“我今天给你寄了一封信，就用那个信封寄的。里面藏着一片叶子……”", "不等她说完，我就大笑起来，几乎把肚子都笑疼了。", "原来那封“欠资待领”的信就是她寄的啊！", "课文对小守门员穿着的描写，符合他的身份；对他动作、神态的描写，表现出他是个尽责的守门员。", "本文由人民教育出版社小学语文室编写。", "容容的动作、神态和她忍不住告诉“ 我”的话，突显了她的可爱。", "课文描写了观众的外貌、动作或神态，表现了他们不同的特点。", "“红领巾”可能来迟了，他坐在最边上，也全神贯注地注视着局势的发展。不知谁家的漂亮白狗跟主人一块儿来了，它对球赛没兴趣，正卧在场边闭目养神呢。", "那个抱着洋娃娃的小女孩跟别人不大一样，腰挺得直直的，脸上没有什么表情，好像胜负都跟她不相干。旁边的那个戴帽子的小男孩却显得挺紧张，也许是头一回看到这样激烈的球赛。", "那位大个子叔叔始终面带笑容，看得津津有味。孩子们踢得太精彩了，也许勾起了他小时候踢球的美好回忆。"], "tasks": ["默读课文，结合批注，想一想课文是怎么写容容这个人的，这样写有什么好处。", "默读课文，说说课文是怎样通过对小守门员和观众们的外貌、动作或神态的描写，表现出人物的不同特点的。和同学交流，哪个人物给你的印象最深。"], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 15, "book": "五年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "自相矛盾", "section": "阅读", "domain": "reading", "genre": "文言文", "author": null, "dynasty": null, "page": 84, "chars": 272, "paras": ["楚人有鬻②盾与矛者，誉之曰：“吾盾之坚，物莫能陷③也。”又誉其矛曰：“吾矛之利，于物无不陷也。”或④曰：“以子之矛陷子之盾，何如？”其人弗能应也。夫⑤不可陷之盾与无不陷之矛，不可同世而立。", "自相矛盾正确、流利地"], "tasks": [], "newchars": ["吾弗夫誉盾吾矛"]}, {"grade": "五年级", "term": "下册", "no": 16, "book": "五年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "田忌赛马", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 85, "chars": 676, "paras": ["孙膑是齐国大将田忌的门客，田忌对他非常赏识。", "田忌经常同齐威王及贵族们赛马。孙膑看了几场比赛后发现，大家的马脚力相差不多，而且都能分成上、中、下三等。", "一天，孙膑对田忌说：“将军，我有个办法，保证能让您在赛马时获胜。”", "田忌问道：“你是说换几匹更好的马？”", "孙膑说：“一匹也不用换。”", "田忌有些不明白：“那怎么能有赢的把握呢？”", "孙膑胸有成竹地说：“将军请放心，按照我的主意办，一定能让您赢。”", "田忌很信任孙膑，决定全听他的。", "于是，他同齐威王及贵族们约好一起赛马。", "田忌和齐威王的对阵就要开始了。比赛双方摩拳擦掌，跃跃欲试。观众们也兴致勃勃地猜测着比赛结果。就在这时，孙膑把田忌请到一边，悄悄地把办法告诉了他。", "第一场，田忌先用下等马对齐威王的上等马，齐威王的马遥遥领先。田忌输了，但他不动声色，一点儿都不着急。", "田忌赛马本文根据汉代司马迁的 《史记·孙子吴起列传》相关内容改写。", "接着，第二场比赛开始了。田忌用上等马对齐威王的中等马，胜了第二场。田忌微微一笑。", "第三场，田忌用中等马对齐威王的下等马，又胜了一场。田忌满意地笑了。", "比赛结束了。田忌胜两场输一场，赢了齐威王。", "齐威王好奇地问田忌：“你这样安排马的出场顺序，是不是有人给你出谋划策了？”", "田忌如实相告，并引荐了孙膑。后来，齐威王任命孙膑为军师。", "连一连，把齐威王和田忌赛马的对阵图标画出来。说一说：孙膑为什么要让田忌这样安排马的出场顺序？", "策荐荐擦策拳赢上等马中等马下等马齐威王田忌上等马中等马下等马选   做历史上有许多运用谋略取得胜利的故事，找一找相关资料，"], "tasks": ["默读课文，用自己的话讲讲田忌赛马的故事。"], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 17, "book": "五年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "跳水", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 87, "chars": 973, "paras": ["一艘环游世界的帆船正往回航行。", "这一天风平浪静，水手们都在甲板上。", "一只猴子在人群里钻来钻去，模仿人的动作，惹得大家哈哈大笑。它显然知道大家拿它取乐，因而更加放肆起来。", "船长的儿子才十一二岁，他也笑得很开心。猴子忽然跳到他面前，摘下他的帽子戴在自己的头上，很快地爬上了桅杆。水手们又大笑起来，只有那个孩子哭笑不得，眼巴巴地望着猴子坐在桅杆的第一根横木上，摘下帽子来用牙齿咬，用爪子撕，好像故意逗他生气。孩子吓唬它，朝着它大喊大叫。猴子不但不理，还撕得更凶了。", "水手们笑得更欢了，孩子却气得脸都红了。他脱了外套，爬上桅杆去追猴子。他攀着绳子爬到第一根横木上，正要伸手去夺帽子，猴子比他更灵巧，转身抓着桅杆又往上爬。", "“你逃不了！”孩子一边追赶一边喊。猴子还不时回过头来逗孩子生气。爬到了桅杆的顶端，它用后脚钩住绳子，把帽子挂在最高的那根横木的一头，然后坐在桅杆的顶端，扭着身子，龇牙咧嘴做着怪样。横木的一头离桅杆一米多。孩子气极了，他的手放开了绳子和桅杆，张开胳膊，摇摇晃晃地走上横木去取帽子。这时候，甲板上的水手全都吓呆了。孩子只要一失足，直摔到甲板上就没命了。", "跳  水本文作者是俄国的列夫·托尔斯泰，译者吴楙之，选作课文时有改动。", "即使他走到横木那头拿到了帽子，也难以回转身来。有个人吓得大叫了一声。孩子听到叫声往下一望，两条腿不由得发起抖来。", "正在这时候，船长从船舱里出来，手里拿着一支枪。他本来是想打海鸥的，看见儿子在桅杆顶端的横木上，就立刻瞄准儿子，喊道：“向海里跳！快！不跳我就开枪了！”孩子心惊胆战，站在横木上摇摇晃晃的，没听明白他爸爸的话。船长又喊：“向海里跳！", "不然我就开枪了！一！二！”刚喊出“三”，孩子纵身从横木上跳了下来。", "扑通一声，孩子像颗炮弹一样扎进了海里。二十来个勇敢的水手已经跳进了大海：四十秒钟—大家已经觉得时间太长了。等孩子一浮上来，水手们就立刻抓住了他，把他救上了甲板。", "水手拿猴子取乐（                ）（                ）课文多次描写水手们的“笑”，把相关的语句找出来，说说这几次“笑”与故事情节发展的联系。", "在那个危急时刻，船长是怎么想的？他的办法好在哪里？"], "tasks": ["默读课文，想想故事的起因、经过和结果，把下面的内容填写完整，再讲讲这个故事。"], "newchars": ["肆桅撕唬龇咧瞄逗钩龇咧肆航桅撕唬艘舱瞄鸥"]}, {"grade": "五年级", "term": "下册", "no": 18, "book": "五年级下册", "unit_no": 7, "unit_name": "第七单元", "title": "威尼斯的小艇", "section": "阅读", "domain": "reading", "genre": "课文", "author": "是美国的马克·吐", "dynasty": null, "page": 94, "chars": 1511, "paras": ["威尼斯是世界闻名的水上城市，河道纵横交错，小艇成了主要的交通工具。", "我们坐在船舱里，皮垫子软软的像沙发一般。小艇穿过一座座形式不同的石桥。我们打开窗帘，望望耸立在两岸的古建筑，跟来往的船只打招呼，有说不完的情趣。", "船夫的驾驶技术特别好。行船的速度极快，来往船只很多，他操纵自如，毫不手忙脚乱。不管怎么拥挤，他总能左拐右拐地挤过去。遇到极窄的地方，他总能平稳地穿过，而且速度非常快，还能急转弯。两边的建筑飞一般地倒退，我们的眼睛忙极了，不知看哪一处好。", "威尼斯的小艇本文作者是美国的马克·吐温，译者刘正训，选作课文时有改动。", "商人夹了大包的货物，匆匆走下小艇，沿河做生意。青年妇女在小艇里高声谈笑。许多孩子由保姆伴着，坐着小艇到郊外去呼吸新鲜的空气。老人带了全家，坐着小艇上教堂去作祷告。", "半夜，戏院散场了，一大群人拥出来，走上了各自雇好的小艇。簇拥在一起的小艇一会儿就散开了，消失在弯曲的河道中，远处传来一片哗笑和告别的声音。水面上渐渐沉寂，只见月亮的影子在水中摇晃。高大的石头建筑耸立在河边，古老的桥梁横在水上，大大小小的船都停泊在码头上。静寂笼罩着这座水上城市，古老的威尼斯又沉沉地入睡了。", "尼艄翘姆祷雇哗"], "tasks": [], "newchars": []}, {"grade": "五年级", "term": "下册", "no": 19, "book": "五年级下册", "unit_no": 7, "unit_name": "第七单元", "title": "牧场之国", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 97, "chars": 809, "paras": ["荷兰，是水之国，花之国，也是牧场之国。", "一条条运河之间的绿色低地上，黑白花牛，白头黑牛，白腰蓝嘴黑牛，在低头吃草。有的牛背上盖着防潮的毛毡。牛群吃草时非常专注，有时站立不动，仿佛正在思考着什么。牛犊还未长大，却有了端庄的仪态。老牛好似牛群的家长，无比威严。极目远眺，四周全是碧绿的丝绒般的草原和黑白两色的花牛。这就是真正的荷兰。", "这就是真正的荷兰。碧绿色的低地镶嵌在一条条运河之间，成群的骏马，匹匹膘肥体壮。除了深深的野草遮掩着的运河，没有什么能够阻挡它们飞驰到远方。辽阔无垠的原野似乎归它们所有，它们是这个自由王国的主人和公爵。", "在绿色的草原上，白色的绵羊悠然自得。黑色的猪群不停地呼噜着，像是对什么表示赞许。成千上万的小鸡，成群结队的长毛山羊，在见不到一个人影的绿草地上，安闲地欣赏着这属于它们自己的王国。这就是真正的荷兰。", "到了傍晚，才看见有人驾着小船过来，坐上小板凳，给严肃沉默的奶牛挤奶。金色的晚霞铺在西天，远处偶尔传来汽笛声，接着牧场之国本文作者是捷克的卡雷尔·恰佩克，译者万世荣，选作课文时有改动。", "又是一片寂静。在这里，谁都不叫喊吆喝，牛脖子上的铃铛也没有响声，挤奶的人更是默默无言。运河之中，装满奶桶的船只在舒缓平稳地行驶。满载着一罐一罐牛奶的汽车、火车，不停地开往城市。车船过后，一切又恢复了平静。最后一抹晚霞也渐渐消失了，整个天地都暗了下来。狗不叫了，圈里的牛也不再发出哞哞声，马也忘记了踢马房的挡板。沉睡的牲畜，无声的低地，漆黑的夜晚，只有远处的几座灯塔在闪烁着微弱的光。", "这就是真正的荷兰。", "有感情地"], "tasks": [], "newchars": ["毡犊眺膘爵噜吆哞畜绵属凳畜牲恢踢吆铛罐骏眺驰辽仪"]}, {"grade": "五年级", "term": "下册", "no": 20, "book": "五年级下册", "unit_no": 7, "unit_name": "第七单元", "title": "金字塔", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 99, "chars": 506, "paras": ["*金字塔九月的开罗是金色的。", "在金色的夕阳下，金色的田野，金色的沙漠，连尼罗河的河水也泛着金光，而那古老的金字塔啊，简直像是用纯金铸成的。远远望去，它像漂浮在沙海中的三座金山，似乎一切金色的光，都是从它那里放射出来的。你看，天上地下，黄澄澄，金灿灿，一片耀眼的色调，一幅多么开阔而又雄浑的画卷啊！", "从少小时候起，我就听到过许多有关金字塔的传说，向往着它神秘的风采。如今，当我来到金字塔下，望着这人间的奇迹，更禁不住思绪激荡。我不知道“金字塔”这个译名中的“金”，最早是怎么得来的。不管出于什么考虑，我认为都是绝妙的。你看金字塔多像一个“金”的汉字。几千年来，在人们的心目中，它不愧是熠熠发光的珍宝，人类劳动和智慧的结晶，它无疑比金子还要贵重。", "有人说金字塔的白昼和月夜，各有各的情趣，各有各的美，但我觉得最令人难忘的，恐怕还是 性格，各有所长，各有所短。", "大拇指在五指中，形状实在算不上美。身体矮而胖，头大而肥，构造简单，比人家少一个关节。但在五指中，却是最肯吃苦的。例如拉胡琴，总由其他四指按弦，却叫他相帮扶住琴身；水要喷出来，叫他死力抵住；血要流出来，叫他拼命按住；重东西要翻倒去，叫他用劲顶住；要读书了，叫他翻书页；要进门了，叫他揿电铃。讨巧的事，却轮不上他。例如招呼人，都由其他四指上前点头，他只能呆呆站在一旁；给人搔痒，人舒服后，感谢的是其他四指。", "常与大拇指合作的是食指。他的姿态可不如其他三指窈窕，都是直直落落的强硬的线条。他的工作虽不如大拇指吃力，却比大拇指复杂。拿笔的时候，全靠他推动笔杆；遇到危险的事，都要他去试探或冒险；秽物、毒物、烈物，他接触的机会最多；刀伤、烫伤、轧伤、咬伤，他消受的机会最多。他具有大拇指手  指。", "所没有的“机敏”，打电话、扳枪机必须请他，打算盘、拧螺丝、解纽扣等，虽有大拇指相助，终是要他主干的。", "五指中地位最优、相貌最堂皇的，无如中指。他居于中央，左右都有屏障。他个子最高，无名指、食指贴身左右，像关公左右的关平、周仓，左膀右臂，片刻不离。他永远不受外物冲撞，所以曲线优美，处处显示着养尊处优的幸福。每逢做事，名义上他是参加的，实际并不出力。他因为身体最长，取物时，往往最先碰到物，好像取得这物是他一人的功劳。其实，他碰到之后就退在一旁，让大拇指和食指去出力，他只在旁略为扶衬而已。", "无名指和小指，体态秀丽，样子可爱。然而，能力薄弱也无过于他们了。无名指多用于研脂粉、蘸药末、戴戒指。小指的用处则更渺小，只是掏掏耳朵、抹抹鼻涕而已。他们也有被重用的时候。在丝竹管弦上，他们的能力不让于别人。舞蹈演员的手指不是常作兰花状吗？这两根手指正是这朵“兰花”中最优美的两瓣。除了这等享乐的风光事以外，遇到工作，他们只是其他手指的附庸。", "手上的五指，我只觉得姿态与性格，有如上的差异，却无爱憎在其中。手指的全体，同人群的全体一样，五根手指如果能一致团结，成为一个拳头，那就根根有用，根根有力量，不再有什么强弱、美丑之分了。", "课文的语言很风趣，如，“他永远不受外物冲撞，所以曲线优美，处处显示着养尊处优的幸福”。找出类似的语句体会一下，再抄写下来。", "作者笔下的大拇指和食指分别让你想到了生活中的哪些人？"], "tasks": ["默读课文，结合课文内容，说说五根手指各有什么作用。"], "newchars": ["拧螺纽庸憎渺享扣貌仓痒搔秽轧拇拇弦揿搔窈窕秽轧拧纽仓庸憎"]}, {"grade": "五年级", "term": "下册", "no": 23, "book": "五年级下册", "unit_no": 8, "unit_name": "第八单元", "title": "童年的发现", "section": "阅读", "domain": "reading", "genre": "课文", "author": "是苏联的费奥多罗", "dynasty": null, "page": 112, "chars": 1464, "paras": ["本文作者是苏联的费奥多罗夫，译者谷羽，选作课文时有改动。", "我在九岁的时候就发现了有关胚胎发育的规律，这完全是我独立思考的结果。", "听完这句话，你大概忍不住会哈哈大笑，愿意笑你就笑吧，反正笑声不会给你招来祸患。我跟你可不同，事情过去了三年，有一次我想起了自己的发现，情不自禁笑出了声音，竟使我当众受到了惩罚。", "我的发现起始于梦中飞行。每天夜里做梦我都飞，我对飞行是那样迷恋，只要双脚一点，轻轻跃起，就能离开地面飞向空中。后来，我甚至学会了滑翔，在街道上空，在白桦树梢头，在青青的草地和澄澈的湖面上盘旋。我的身体是那样轻盈，可以随心所欲，运转自如，凭着双臂舒展和双腿弹动，似乎想去哪里就能飞到哪里。", "我以为在同学中间只有我一个人具有飞行的天赋。可是，有一天我终于弄明白了，每到夜晚，我的小伙伴们也都会在梦中飞腾。那天，我们几个人决定去见我们的老师，让他来解答这个奇妙的问题。", "人为什么会在梦中飞行？人究竟是从哪里来的？为了弄清楚这些问题，“我”经历了怎样的探究过程？结果怎样？"], "tasks": [], "newchars": ["胚祸患赋痴绞嘿伊娜窘"]}, {"grade": "五年级", "term": "下册", "no": 64, "book": "五年级下册", "unit_no": 8, "unit_name": "第八单元", "title": "词语表", "section": "阅读", "domain": "reading", "genre": "附录", "author": null, "dynasty": nul 城里街旁，尘土纷嚣之间，忽然呈出两片雪白，顿使人眼前一亮，再仔细看，才知是两行丁香花。有的宅院里探出半树银妆，星星般的小花缀满枝头，从墙上窥着行人，惹得人走过了还要回头望。", "城外校园里丁香更多。最好的是图书馆北面的丁香三角地，种有十数棵的白丁香和紫丁香。月光下白的潇洒，紫的朦胧。还有淡淡的幽雅的甜香，非桂非兰，在夜色中也能让人分辨出，这是丁香。", "在我断断续续住了近三十年的斗室外，有三棵白丁香。每到春来，伏案时抬头便看见檐前积雪。雪色映进窗来，香气直透毫端。", "人也似乎轻灵得多，不那么浑浊笨拙了。从外面回来时，最先映入眼帘的，也是那一片莹白，白下面透出参差的绿，然后才见那两扇红窗。我经历过的春光，几乎都是和这几树丁香联系在一起的。那十字小白花，那样小，却不显得单薄。许多小花形成一簇，许多簇花开满一树，遮掩着我的窗，照耀着我的文思和梦想。", "古人诗云：“芭蕉不展丁香结” “丁香空结雨中愁”。在细雨迷蒙中，着了水滴的丁香格外妩媚。花墙边两株紫色的，如同印象派的画，线条模糊了，直向窗前的莹白渗过来。让人觉得，丁香确实该和微雨连在一起。", "只是赏过这么多年的丁香，却一直不解，何以古人发明了丁香结的说法。今年一次春雨，久立窗前，望着斜伸过来的丁香枝条上一柄花蕾。小小的花苞圆圆的，鼓鼓的，恰如衣襟上的盘花扣。我才恍然，果然是丁香结。", "丁香结，这三个字给人许多想象。再联想到那些诗句，真觉得它们负担着解不开的愁怨了。每个人一辈子都有许多不顺心的事，一件完了一件又来。所以丁香结年年都有。结，是解不完的；人生中的问题也是解不完的，不然，岂不太平淡无味了吗？", "缀窥紫潇雅檐浊拙簇遮恍"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 3, "book": "六年级上册", "unit_no": 1, "unit_name": "第一单元", "title": "古诗词三首", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "孟浩然移", "dynasty": "唐", "page": 8, "chars": 147, "paras": ["宿建德江[唐] 孟浩然移舟泊烟渚，日暮客愁新。", "野旷天低树，江清月近人。", "六月二十七日望湖楼①醉书[宋] 苏 轼黑云翻墨未遮山，白雨跳珠乱入船。", "卷地风来忽吹散，望湖楼下水如天。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 4, "book": "六年级上册", "unit_no": 1, "unit_name": "第一单元", "title": "宿建德江", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "孟浩然移", "dynasty": "唐", "page": 8, "chars": 148, "paras": ["[唐] 孟浩然移舟泊烟渚，日暮客愁新。", "野旷天低树，江清月近人。", "六月二十七日望湖楼①醉书[宋] 苏 轼黑云翻墨未遮山，白雨跳珠乱入船。", "卷地风来忽吹散，望湖楼下水如天。", "古诗词三首注释① 〔建德江〕指新安江流经建德 （在今浙江）的一段。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 5, "book": "六年级上册", "unit_no": 1, "unit_name": "第一单元", "title": "六月二十七日望湖楼醉书", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "孟浩然移", "dynasty": "唐", "page": 8, "chars": 152, "paras": ["宿建德江[唐] 孟浩然移舟泊烟渚，日暮客愁新。", "野旷天低树，江清月近人。", "六月二十七日望湖楼①醉书[宋] 苏 轼黑云翻墨未遮山，白雨跳珠乱入船。", "卷地风来忽吹散，望湖楼下水如天。", "古诗词三首注释① 〔建德江〕指新安江流经建德 （在今浙江）的一段。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 6, "book": "六年级上册", "unit_no": 1, "unit_name": "第一单元", "title": "西江月·夜行黄沙道中", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": null, "page": 9, "chars": 311, "paras": ["有感情地"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 4, "book": "六年级上册", "unit_no": 2, "unit_name": "第二单元", "title": "七律·长征", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": null, "page": 14, "chars": 425, "paras": ["红军不怕远征难，万水千山只等闲。", "五岭逶迤腾细浪，乌蒙磅礴走泥丸。", "金沙水拍云崖暖，大渡桥横铁索寒。", "更喜岷山千里雪，三军过后尽开颜。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 5, "book": "六年级上册", "unit_no": 2, "unit_name": "第二单元", "title": "狼牙山五壮士", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 16, "chars": 1357, "paras": ["1941年秋，日寇集中兵力，向我晋察冀根据地大举进犯。当时，七连奉命在狼牙山一带坚持游击战争。经过一个多月英勇奋战，七连决定向龙王庙转移，把掩护群众和连队转移的任务交给了六班。", "为了拖住敌人，七连六班的五个战士一边痛击追上来的敌人，一边有计划地把大批敌人引上了狼牙山。他们利用险要的地形，把冲上来的敌人一次又一次地打了下去。班长马宝玉沉着地指挥战斗，让敌人走近了，才下命令狠狠地打。副班长葛振林打一枪就大吼一声，好像细小的枪口喷不完他的满腔怒火。战士宋学义扔手榴弹总要把胳膊抡一个圈，好使出浑身的力气。胡德林和胡福才这两个小战士把脸绷得紧紧的，全神贯注地瞄准敌人射击。敌人始终不能前进一步。在崎岖的山路上，横七竖八地躺着许多敌人的尸体。", "五位战士胜利地完成了掩护任务，准备转移。面前有两条路：一条通往主力转移的方向，走这条路可以很快追上连队，可是敌人紧跟在身后；另一条通向狼牙山的顶峰棋盘陀，那儿三面都是悬崖绝壁。走哪条路呢？为了不让敌人发现群众和连队主力，班长马宝玉斩钉截铁地说了一声：“走！”带头向棋盘陀走去。战士们热血沸腾，紧跟在班长后面。他们知道班长要把敌人引上绝路。", "五位壮士一面向顶峰攀登，一面依托大树和岩石向敌人射击。", "山路上又留下了许多具敌人的尸体。到了狼牙山峰顶，五位壮士居高临下，继续向紧跟在身后的敌人射击。不少敌人坠落山涧，粉身① 本文作者沈重（zhòng），选作课文时有改动。", "碎骨。班长马宝玉负伤了，子弹都打完了，只有胡福才手里还剩下一颗手榴弹。他刚要拧开盖子，马宝玉抢前一步，夺过手榴弹插在腰间，猛地举起一块大石头，大声喊道：“同志们！用石头砸！”顿时，石头像雹子一样，带着五位壮士的决心，带着中国人民的仇恨，向敌人头上砸去。山坡上传来一阵叽里呱啦的叫声，敌人纷纷滚落深谷。", "又一群敌人扑上来了。马宝玉嗖的一声拔出手榴弹，拧开盖子，用尽全身气力扔向敌人。随着一声巨响，手榴弹在敌群中开了花。", "五位壮士屹立在狼牙山顶峰，眺望着群众和部队主力远去的方  绘向。他们回头望望还在向上爬的敌人，脸上露出胜利的喜悦。班长马宝玉激动地说：“同志们，我们的任务胜利完成了！”说罢，他把那支从敌人手里夺来的枪砸碎了，然后走到悬崖边上，像每次发起冲锋一样，第一个纵身跳下深谷。战士们也昂首挺胸，相继从悬崖往下跳。狼牙山上响起了他们壮烈豪迈的口号声：“打倒日本帝国主义！”", "“中国共产党万岁！”", "这是英雄的中国人民坚强不屈的声音！这声音惊天动地，气壮山河！", "接受任务（                      ）（                      ）（                    ）英勇跳崖"], "tasks": ["朗读课文。根据课文内容填一填，再简要复述课文。"], "newchars": ["贯棋悬斩截沸砸雹昂豪迈"]}, {"grade": "六年级", "term": "上册", "no": 6, "book": "六年级上册", "unit_no": 2, "unit_name": "第二单元", "title": "开国大典", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 19, "chars": 2130, "paras": ["1949年10月1日，中华人民共和国中央人民政府成立，在首都北京举行典礼。参加开国大典的，有中华人民共和国中央人民政府主席、副主席、各位委员，有中国人民政治协商会议全体代表，有工人、农民、学校师生、机关工作人员、城防部队，总数达三十万人。观礼台上还有外宾。", "会场在天安门广场。广场呈丁字形。丁字形一横的北面是一道河，河上并排架着五座白石桥；再北面是城墙，城墙中央高高耸起天安门的城楼。丁字形的一竖向南直伸到中华门。在一横一竖的交点的南面，场中挺立着一根电动旗杆。", "主席台设在天安门城楼上。城楼檐下，八盏大红宫灯分挂两边。靠着城楼左右两边的石栏，八面红旗迎风招展。", "丁字形的广场汇集了从四面八方来的群众队伍。早上六点钟起，就有群众的队伍入场了。人们有的擎着红旗，有的提着红灯。", "进入会场后，按照预定的地点排列。工人队伍中，有从老远的长辛店、丰台、通县来的铁路工人，他们清早到了北京车站，一下火车就直奔会场。郊区的农民是五更天摸着黑起床，步行四五十里路赶来的。到了正午，天安门广场已经成了人的海洋，红旗翻动，像海上的波浪。", "下午三点整，会场上爆发出一阵排山倒海的掌声，中华人民共和国中央人民政府主席毛泽东出现在主席台上，跟群众见面了。", "三十万人的目光一齐投向主席台。", "中央人民政府秘书长林伯渠宣布典礼开始。中央人民政府主席、副主席、各位委员就位。接着，毛泽东主席宣布：“中华人民共和国中央人民政府今天成立了！”", "这庄严的宣告，这雄伟的声音，使全场三十万人一齐欢呼起来。这庄严的宣告，这雄伟的声音，经过无线电广播，传到长城内外，传到大江南北，使全中国人民的心一齐欢跃起来。", "接着，升国旗。毛主席亲自按动连通电动旗杆的电钮，新中国的国旗—五星红旗在雄壮的《义勇军进行曲》中徐徐上升。", "三十万人一齐脱帽肃立，一齐抬起头，瞻仰这鲜红的国旗。五星红旗升起来了，表明中国人民从此站起来了。", "升旗的时候，礼炮响起来。每一响都是五十四门大炮齐发，一共二十八响。起初是全场肃静，只听见炮声和乐曲声，只听见国旗和其他许多旗帜飘拂的声音，到后来，每一声炮响后，全场就响起一阵雷鸣般的掌声。", "接着，毛主席在群众一阵又一阵的掌声中宣读中央人民政府的公告。他用强有力的语调向全世界发出新中国的声音。他读到“选举了毛泽东为中央人民政府主席”这一句的时候，广场上的人们热爱领袖的心情融成一阵热烈的欢呼。观礼台上同时响起一阵掌声。", "毛主席宣读公告完毕，阅兵式开始。中国人民解放军朱德总司令任检阅司令员，聂荣臻将军任阅兵总指挥。朱总司令和聂将军同乘汽车，先检阅部队，然后朱总司令回到主席台，宣读中国人民解放军总部的命令。受检阅的部队就由聂将军率领，在《中国人民解放军进行曲》的乐曲声中，由东往西，缓缓进场。", "开头是海军两个排，雪白的帽子，跟海洋一个颜色的蓝制服。", "接着是步兵一个师，以连为单位，列成方阵，齐步行进。接着是炮兵一个师，野炮、榴弹炮等各式各样的炮，都排成一字形的横列前进。接着是一个战车师，各种装甲车和坦克车两辆或三辆一排，整整齐齐地前进；战士们挺着胸膛站在战车上，像钢铁巨人一样。接着是一个骑兵师，“红马连”一色红马，“白马连”一色白马，六马并行，马腿的动作完全一致。以上这些部队，全都以相等的距离和相同的速度经过主席台前。当战车部队经过的时候，人民空军的飞机也一队队排成人字形，飞过天空。毛主席首先向空中招手。群众看见了，都把头上的帽子、手里的报纸和别的东西抛上天去，欢呼声盖过了飞机的隆隆声。", "两个半钟头的检阅，广场上不断地欢呼，不断地鼓掌，一个高潮接着一个高潮。群众差不多把嗓子都喊哑了，把手掌都拍麻了，还觉得不能够表达自己心里的欢喜和激动。", "阅兵式完毕，已经是傍晚的时候。天安门广场上的灯笼火把全都点起来，一万支礼花陆续射入天空。天上五颜六色的火花结成彩，地上千千万万的灯火一片红。群众游行就在这时候开始。游行队伍分东西两个方向出发，他们擎着灯，舞着火把，高呼：“中国共产党万岁！”“中华人民共和国万岁！”“中央人民政府万岁！”他们一队一队按照次序走，走到正对天安门的白石桥前，就举起灯笼火把，高声欢呼：“毛主席万岁！”“毛主席万岁！”毛主席在城楼上主席台前边，向前探着身子，不断地向群众挥手，不断地高呼：“人民万岁！”“同志们万岁！”", "晚上九点半，游行队伍才完全走出会场。两股“红流”分头向东城、西城的街道流去，光明充满了整个北京城。"], "tasks": ["默读课文，体会新中国成立时人们自豪、激动的心情。想想从群众入场到游行结束，课文写了哪几个场面，连起来简要说说开国大典的过程。"], "newchars": ["政府宾宣拂阅率榴辆嗓哑"]}, {"grade": "六年级", "term": "上册", "no": 7, "book": "六年级上册", "unit_no": 2, "unit_name": "第二单元", "title": "我的战友邱少云", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 24, "chars": 1507, "paras": ["天亮以前，我们在391高地的山坳里，找了一条比较隐蔽的山沟潜伏起来。", "太阳渐渐爬上山头，晒干了我们身上的寒霜，早上冻麻了的腿也开始暖和起来。我们本来打算趁这时候在温暖的阳光下睡一会儿，因为已经熬了整整一夜，而且当天晚上还有激烈的战斗在等着，需要养养精神，好完成晚上的战斗任务，可是我怎么也合不上眼睛。谁能趴在敌人的鼻子底下睡大觉呢？", "我发现这条干涸的小山沟并不十分隐蔽。我们离敌人太近了，前面几十米就是敌人的前沿阵地。我们不但可以看见敌人设置的铁丝网和胸墙，而且可以看见敌人主阵地上的地堡和火力点，甚至连敌人的谈话声都听得见。可以想见，敌人居高临下，发现我们当然更容易。我们必须僵卧着一动不动，一声低低的咳嗽或者轻轻地蜷一下腿，都可能被敌人发觉。", "我们全靠身上的伪装掩护自己。我看了一下前面，班长和几个战士都伏在枯黄的茅草里，身上也披着厚厚的茅草作为伪装，猛一看去，很难发现他们。我又看了看伏在不远处的邱少云，他也全身伪装，隐蔽得更好，相隔这么近，我都几乎找不到他。", "我们的炮兵不断地向敌人阵地上轰击，山顶上不时地腾起一团一团的青烟，敌人阵地前沿的地堡一个接一个地被掀翻了。炮兵的轰击不但摧毁了敌人的一部分工事，便于我们晚上突击，而且把敌① 本文作者李元兴（1930—1967），选作课文时有改动。", "我的战友邱少云人打得躲进隐蔽洞里，保证了潜伏部队的安全。", "看到山顶上敌人被我军炮火轰击的情景，我只盼望快点儿天黑，好痛痛快快地打一仗。看看太阳，却老是停在原来的地方，就像钉住了似的。", "约莫11点钟的时候，突然一发烟幕弹飞来，在附近爆炸了，一排一排的炮弹跟着打过来。显然，狡猾的敌人对他们阵地前沿的安全极不放心，又没有胆量冒着我军的炮火到这一带来搜索，只好把看家本领“火力警戒”拿出来了。", "附近的荒草着火了，火苗子呼呼地蔓延着，烧得枯黄的茅草毕毕剥剥地响。恶毒的敌人竟使用燃烧弹来进行搜索了。", "不一会儿，火已经烧到我面前，火苗子一伸一伸的，烤得我脸上热辣辣地疼。幸而面前有一堆不长草的乱石头挡着，火才没烧到我身上。", "忽然，一阵浓重的棉布焦味钻进我的鼻子，我扭头一看，哎呀！", "火烧到了邱少云身上！他的棉衣已经烧着了，浑身火苗乱窜，看样子是溅上了燃烧弹的油液。趁着风势，一团烈火把他整个包围了。", "这个时候，邱少云如果迅速从火堆里跳出来，就地打几个滚，身上的火是可以扑灭的。卧在他附近的任何一个人，如果跳过去把他拉出来，扯掉他着火的棉衣，也能救出自己的战友。但是这样一来，我们就会被山头上敌人的哨兵发觉，那么不仅是我们这一个班要牺牲在这里，也不仅是埋伏在我们身后的整个潜伏部队要受到重大损失，更严重的是准备了好久的作战计划要完全落空。", "我的心紧缩着，我担心这个年轻的战士会实在忍耐不住突然跳起来，或者突然叫出声来。我几次回过头来，不敢朝他那儿看，不忍看着我的战友被活活烧死，但是我又忍不住不看。我心里像刀绞一般，眼泪模糊了我的眼睛。", "烈火在我的战友邱少云身上烧了半个多钟头才渐渐熄灭。这个伟大的战士，像千斤巨石，伏在那儿纹丝不动，直到牺牲前的最后一息，都没发出哪怕是极轻微的一声呻吟。", "黄昏时，我们勇猛地冲上了敌人的阵地。在391高地上沸腾着激动人心的口号：“为邱少云同志报仇！”", "我当时的感觉，仿佛邱少云同志并没有牺牲，他和我们一起向敌人冲锋！", "我永远忘不了那一天— 1952年10月12日。", "绘"], "tasks": [], "newchars": ["蔽趴伪摧幕搜蔓液缩熄"]}, {"grade": "六年级", "term": "上册", "no": 8, "book": "六年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "竹节人", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 32, "chars": 1701, "paras": ["我们小时候的玩具，都是自己做的，也只能自己做。只要有一个人做了一件新鲜玩意，大家看了有趣，很快就能风靡全班，以至全校。", "有一段时间，我们全迷上了斗竹节人。", "把毛笔杆锯成寸把长的一截，这就是竹节人的脑袋连同身躯了，在上面钻一对小眼，供装手臂用。再锯八截短的，分别当四肢。用一根纳鞋底的线把它们穿在一起，就成了。锯的时候要小心，弄不好一个个崩裂，前功尽弃。", "那一段时间，妈妈怪我总是把毛笔弄丢，而校门口卖毛笔的老头则生意特别好。", "教室里的课桌破旧得看不出年纪，桌面上是一道道豁开的裂缝，像黄河长江，一不小心，铅笔就从裂缝里掉下去了。", "同一篇文章，阅读的目的不同，关注的内容、采用的阅读方法也会有所不同。如果给你以下任务，你会怎么读《竹节人》这篇文章？"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 9, "book": "六年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "宇宙生命之谜", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 36, "chars": 1991, "paras": ["古时候，科学不发达，人们一直向往着“天上的世界”。于是，有了许许多多的故事：嫦娥奔月，仙女下凡，蟠桃盛会……现在，科学发达了，人们知道那都是古人编出来的。但是，地球之外的太空中是否有生命存在，仍然是一个吸引人的问题。", "从理论上说，宇宙是无限的。地球只是太阳系中的一颗行星，而太阳系只是银河系中一个极小的部分，银河系对宇宙来说又是沧海一粟。整个银河系中有几千亿颗恒星，类似太阳系这样的天体系统为数不少，其中肯定有与地球类似的行星。可以猜测，地球绝不是有生命存在的唯一天体。但是，人类至今尚未找到另外一颗存在生命的星球。", "哪些天体上可能有生命存在呢？这个天体又必须具备什么样的条件呢？人们了解了生命起源的过程之后，认为至少应有这样几个条件：一是适合生多年来，人们一直在探索宇宙生命问题。我们常常有这样的疑问：宇宙中，除了地球，其他星球上是否也有生命存在？为了解决这个疑问，有位同学找到了这篇文章。", "浏览了这一段后，发现它对了解地球之外是否有生命没有帮助，不必过多关注。", "每个自然段往往有提示主要意思的语句，阅读时我要注意找出来。", "物生存的温度，一般应在-50150℃之间；二是必要的水分，生命物质诸如蛋白质、核酸的活力都和水紧密相关，没有水，也就没有生命；三是适当成分的大气，虽然已发现少数厌氧菌能在没有氧气的条件下生存，但氧气和二氧化碳对于生命的存在是极为重要的；四是要有足够的光和热，为生命系统提供能源。", "根据这些条件，科学家首先对太阳系除地球以外的其他行星进行了分析。水星离太阳最近，朝向太阳的一面表面温度达到300400℃，不可能存在生命。金星是一颗缺氧、缺水，有着浓厚云层的行星，太阳辐射和云层造成的“温室效应”，使得金星表面温度极高，不可能有生命存在。木星、土星、天王星和海王星离太阳很远，它们的表面温度一般都低于-140℃，因此，也不可能有生命存在。", "太阳系中唯一还可能存在生命的行星是火星。", "火星与地球有不少相似之处：地球自转一圈是23小时56分4秒，火星自转一圈是24小时37分22.6秒；地球自转轴与公转轨道平面有66度34分的倾角，而火星的倾角约66度1分，所以火星和地球昼夜长短相近，而且也有四季更替。更有趣的是，1877年，意大利的一位天文学家观察到火星表面有很多纵横的黑色线条，人们猜测这是火星人开挖的运河。人们还观察到火星表面的颜色随着季节而这一段对解决问题很重要，画出关键词帮我理清了生命存在的条件。", "这段的段首提到了地球外的其他行星。通过提取关键信息，我知道这些星球上是不存在生命的。", "前面排除了那些不具备生命存在条件的行星，这一段提示火星上有可能存在生命，关于火星的内容很重要。", "变化，有人认为这是火星表面植物随着季节的变化而改变了颜色。", "为了揭开火星神秘的面纱，科学家们决定利用探测器对火星作近距离的观测。1971年，美国发射的“水手9号”探测器进入了环绕火星飞行的轨道，给火星拍摄了大量的照片。这些照片表明，意大利天文学家观察到的所谓“运河”，原来是一连串的暗环形山和暗的斑点。通过近距离观测还发现，以前观察到的火星表面上所谓颜色的四季变化，并不是植物的生长和枯萎造成的，而是风把火星表面上的尘土吹来吹去引起的颜色明暗变化。", "科学家们还发现：火星是一个非常干燥的星球，在它的大气中虽然找到了水汽，但含量极少，只有地球上沙漠地区的1% ；火星的大气层非常稀薄，95%是二氧化碳，氧气含量极少；火星表面温度很低；火星的磁场非常弱，太阳风和宇宙射线可以直接轰击火星表面。所有这些因素都说明，在火星上生命难以存在。", "为了对火星作进一步的考察，1975 年，美国发射了两个名叫“海盗号”的探测器。这两个探测器在火星着陆，进行了一系列的分析和测试，得到两个重要结果：一是在火星的土壤中未检测到有机分子；二是在对火星表面取样的培养中，未发现微生物的存在。这证明，在探测器着陆的地区，火星近年来科学家对火星的研究可能有新发现，可以查查相关资料。", "为了了解其他星球是否存在生命，你在阅读时是怎么做的？下面同学的思考给了你哪些启发？", "有的信息可能是不准确的，需要再查查相关资料加以判断。", "与问题相关的内容我会仔细读，必要时会多读几遍。", "有的段落和我想要了解的问题关系不大，就不需要细读。", "如果想探究下面这些问题，你会怎样阅读这篇文章？"], "tasks": [], "newchars": ["谜猜尚析效轨谓斑萎燥漠"]}, {"grade": "六年级", "term": "上册", "no": 10, "book": "六年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "故宫博物院", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 40, "chars": 2407, "paras": ["材料一在北京城的中心，有一座城中之城，这就是紫禁城，如今人们习惯叫它故宫。这是明清两代的皇宫，是我国现存的最大最完整的古代宫殿建筑群，有六百多年的历史了。这座宫殿现在已经成为我国最大的博物院—故宫博物院。", "紫禁城城墙十米多高，有四座城门：南边午门，北边神武门，东西两边分别是东华门、西华门。宫城呈长方形，占地七十二万平方下面有两个任务，"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 11, "book": "六年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "桥", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 50, "chars": 786, "paras": ["11 桥① 。", "黎明的时候，雨突然大了。像泼。像倒。", "山洪咆哮着，像一群受惊的野马，从山谷里狂奔而来，势不可当。", "村庄惊醒了。人们翻身下床，却一脚踩进水里。是谁惊慌地喊了一嗓子，一百多号人你拥我挤地往南跑。近一米高的洪水已经在路面上跳舞了。人们又疯了似的折回来。", "东面、西面没有路。只有北面有座窄窄的木桥。", "死亡在洪水的狞笑声中逼近。", "人们跌跌撞撞地向那木桥拥去。", "木桥前，没腿深的水里，站着他们的党支部书记，那个全村人都拥戴的老汉。", "老汉清瘦的脸上淌着雨水。他不说话，盯着乱哄哄的人们。他像一座山。", "人们停住脚，望着老汉。", "老汉沙哑地喊话：“桥窄！排成一队，不要挤！党员排在后边！”", "有人喊了一声：“党员也是人。”", "老汉冷冷地说：“可以退党，到我这儿报名。”", "竟没人再喊。一百多人很快排成队，依次从老汉身边奔上木桥。", "水渐渐蹿上来，放肆地舔着人们的腰。", "老汉突然冲上前，从队伍里揪出一个小伙子，吼道：“你还算是个党员吗？排到后面去！”老汉凶得像只豹子。", "小伙子瞪了老汉一眼，站到了后面。", "木桥开始发抖，开始痛苦地呻吟。", "水，爬上了老汉的胸膛。最后，只剩下了他和小伙子。", "小伙子推了老汉一把，说：“你先走。”", "老汉吼道：“少废话，快走。”他用力把小伙子推上木桥。", "突然，那木桥轰的一声塌了。小伙子被洪水吞没了。", "老汉似乎要喊什么，猛然间，一个浪头也吞没了他。", "一片白茫茫的世界。", "五天以后，洪水退了。", "一个老太太，被人搀扶着，来这里祭奠。", "她来祭奠两个人。", "她丈夫和她儿子。", "有感情地"], "tasks": [], "newchars": ["黎疯淌盯肆伍揪呻膛废塌"]}, {"grade": "六年级", "term": "上册", "no": 12, "book": "六年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "穷人", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 53, "chars": 1982, "paras": ["渔夫的妻子桑娜坐在火炉旁补一张破帆。屋外寒风呼啸，汹涌澎湃的海浪拍击着海岸，溅起一阵阵浪花。海上正起着风暴，外面又黑又冷，这间渔家的小屋里却温暖而舒适。地扫得干干净净，炉子里的火还没有熄，食具在搁板上闪闪发亮。挂着白色帐子的床上，五个孩子正在海风呼啸声中安静地睡着。丈夫清早驾着小船出海，这时候还没有回来。桑娜听着波涛的轰鸣和狂风的怒吼，感到心惊肉跳。", "古老的钟发哑地敲了十下，十一下……始终不见丈夫回来。桑娜沉思：丈夫不顾惜身体，冒着寒冷和风暴出去打鱼，她自己也从早到晚地干活，还只能勉强填饱肚子。孩子们没有鞋穿，不论冬夏都光着脚跑来跑去；吃的是黑面包，菜只有鱼。不过，孩子们都还健康，没什么可抱怨的。桑娜倾听着风暴的声音。“他现在在哪儿？老天啊，保佑他，救救他，开开恩吧！”她自言自语着。", "睡觉还早。桑娜站起身来，把一块很厚的围巾包在头上，提着马灯走出门去。她想看看灯塔上的灯是不是亮着，丈夫的小船能不12 穷  人能望见。海面上什么也看不见。风掀起她的围巾，卷着被刮断的什么东西敲打着邻居小屋的门。桑娜想起了傍晚就想去探望的那个生病的女邻居。“没有一个人照顾她啊！”桑娜一边想一边敲了敲门。", "她侧着耳朵听，没有人答应。", "“寡妇的日子真困难啊！”桑娜站在门口想，“孩子虽然不算多—只有两个，可是全靠她一个人张罗，如今又加上病。唉，寡妇的日子真难过啊！进去看看吧！”", "桑娜一次又一次地敲门，仍旧没有人答应。", "“喂，西蒙！”桑娜喊了一声，心想，莫不是出什么事了？她猛地推开门。", "屋子里没有生炉子，又潮湿又阴冷。桑娜举起马灯，想看看病人在什么地方。首先投入眼帘的是对着门的一张床，床上仰面躺着她的女邻居。她一动不动。桑娜把马灯举得更近一些，不错，是西蒙。她头往后仰着，冰冷发青的脸上显出死的宁静，一只苍白僵硬的手像要抓住什么似的，从稻草铺上垂下来。就在这死去的母亲旁边，睡着两个很小的孩子，都是卷头发、圆脸蛋，身上盖着旧衣服，蜷缩着身子，两个浅黄头发的小脑袋紧紧地靠在一起。显然，母亲在临死的时候，拿自己的衣服盖在他们身上，还用旧头巾包住他们的小脚。孩子呼吸均匀而平静，睡得正香甜。", "桑娜用头巾裹住睡着的孩子，把他们抱回家里。她的心跳得很厉害，自己也不知道为什么要这样做，但是觉得非这样做不可。她把这两个熟睡的孩子放在床上，让他们同自己的孩子睡在一起，又连忙把帐子拉好。", "桑娜脸色苍白，神情激动。她忐忑不安地想：“他会说什么呢？这是闹着玩的吗？自己的五个孩子已经够他受的了……是他来啦？……不，还没来！……为什么把他们抱过来啊？……他会揍我的！那也活该，我自作自受……嗯，揍我一顿也好！”", "门吱嘎一声，仿佛有人进来了。桑娜一惊，从椅子上站起来。", "“不，没有人！天啊，我为什么要这样做？……如今叫我怎么对他说呢？……”桑娜沉思着，久久地坐在床前。", "门突然开了，一股清新的海风冲进屋子。魁梧黧黑的渔夫拖着湿淋淋的被撕破了的渔网，一边走进来，一边说：“嘿，我回来啦，桑娜！”", "“哦，是你！”桑娜站起来，不敢抬起眼睛看他。", "“瞧，这样的夜晚！真可怕！”", "“是啊，是啊，天气坏透了！哦，鱼打得怎么样？”", "“糟糕，真糟糕！什么也没有打到，还把网给撕破了。倒霉，倒霉！天气可真厉害！我简直记不起几时有过这样的夜晚了，还谈得上什么打鱼！还好，总算活着回来啦。……我不在，你在家里做些什么呢？”", "渔夫说着，把网拖进屋里，坐在炉子旁边。", "“我？”桑娜脸色发白，说，“我嘛……缝缝补补……风吼得这么凶，真叫人害怕。我可替你担心呢！”", "“是啊，是啊，”丈夫喃喃地说，“这天气真是活见鬼！可是有什么办法呢！”", "两个人沉默了一阵。", "“你知道吗？”桑娜说，“咱们的邻居西蒙死了。”", "“哦？什么时候？”", "“我也不知道，大概是昨天。唉！她死得好惨啊！两个孩子都在她身边，睡着了。他们那么小……一个还不会说话，另一个刚会爬……”桑娜沉默了。", "渔夫皱起眉，他的脸变得严肃、忧虑。
