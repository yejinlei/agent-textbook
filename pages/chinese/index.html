                { name: "第二单元", lessons: ["鲁滨逊漂流记（节选）", "骑鹅旅行记（节选）", "汤姆·索亚历险记（节选）", "漫步世界名著花园"] },
                { name: "第三单元", lessons: ["匆匆", "那个星期天", "别了，语文课", "阳光的两种用法"] },
                { name: "第四单元", lessons: ["古诗三首", "十六年前的回忆", "为人民服务", "董存瑞舍身炸暗堡", "马诗", "石灰吟", "竹石"] },
                { name: "第五单元", lessons: ["文言文二则", "真理诞生于一百个问号之后", "表里的生物", "他们那时候多有趣啊", "学弈", "两小儿辩日"] },
                { name: "第六单元", lessons: ["采薇（节选）", "送元二使安西", "春夜喜雨", "早春呈水部张十八员外", "江上渔者", "泊船瓜洲", "游园不值", "卜算子·送鲍浩然之浙东", "浣溪沙", "清平乐", "回忆往事", "依依惜别", "词语表"] },
            ]},
        };

        // 已有独立单课阅读页的课文（一年级上册）
        const READY = ['秋天', '江南', '四季', '小小的船'];
        const READY_BOOK = '一年级上册';

        let currentBook = '';
        let currentUnit = null;

        const gridEl = document.getElementById('book-grid');
        const panelEl = document.getElementById('panel');
        const unitRowEl = document.getElementById('unit-row');
        const lessonAreaEl = document.getElementById('lesson-area');
        const lessonTitleEl = document.getElementById('lesson-title');
        const breadcrumbEl = document.getElementById('breadcrumb');
        const countEl = document.getElementById('lesson-count');
        const searchInput = document.getElementById('search-input');

        function renderGrid() {
            gridEl.innerHTML = BOOKS.map(b => `
                <div class="book-card bg-white rounded-2xl shadow-sm border border-orange-100 p-4 flex flex-col items-center">
                    <img src="${b.cover}" alt="义务教育教科书语文${b.key}" class="book-cover rounded-lg mb-3" loading="lazy">
                    <div class="text-lg font-bold mb-3">${b.key}</div>
                    <button class="btn-read w-full text-white text-lg font-medium py-2.5 rounded-lg transition-colors" onclick="selectBook('${b.key}')">在线阅读</button>
                </div>`).join('');
        }

        function lessonLink(lesson, bookName) {
            const ready = READY.includes(lesson) && bookName === READY_BOOK;
            if (ready) {
                const url = '/agent-textbook/lesson-pages/chinese/' + encodeURIComponent(bookName) + '/' + encodeURIComponent(lesson) + '.html';
                return `<a class="lesson-chip inline-block text-primary border-primary/40" href="${url}" title="打开《${lesson}》单课页">${lesson} <i class="fa fa-book-open text-xs"></i></a>`;
            }
            return `<a class="lesson-chip inline-block" href="reading.html" title="在「课文全文」中查看《${lesson}》">${lesson}</a>`;
        }

        function selectBook(key) {
            currentBook = key; currentUnit = null; searchInput.value = '';
            renderPanel();
        }
        function selectUnit(idx) { currentUnit = idx; renderPanel(); }

        function renderPanel() {
            if (!currentBook) { panelEl.classList.add('hidden'); countEl.textContent = '12 册教材'; return; }
            panelEl.classList.remove('hidden');
            const book = bookData[currentBook];
            breadcrumbEl.innerHTML =
                `<span class="cursor-pointer hover:text-primary" onclick="resetAll()">全部教材</span>` +
                `<i class="fa fa-chevron-right text-gray-400 text-xs mx-1"></i>` +
                `<span class="cursor-pointer hover:text-primary" onclick="selectBook('${currentBook}')">${book.name}</span>` +
                (currentUnit !== null ? `<i class="fa fa-chevron-right text-gray-400 text-xs mx-1"></i><span class="text-primary font-medium">${book.units[currentUnit].name}</span>` : '');
            unitRowEl.innerHTML = book.units.map((u, i) =>
                `<button class="unit-chip ${currentUnit === i ? 'border-primary text-primary' : ''}" onclick="selectUnit(${i})">${u.name}<span class="text-gray-400 text-sm ml-2">${u.lessons.length} 课</span></button>`).join('');
            if (currentUnit === null) {
                lessonTitleEl.textContent = `${book.name} · 全部课文`;
                let html = '';
                book.units.forEach(u => {
                    html += `<div class="w-full mb-1 mt-3 text-gray-500">${u.name}</div>`;
                    html += u.lessons.map(l => lessonLink(l, currentBook)).join('');
                });
                lessonAreaEl.innerHTML = html;
                countEl.textContent = book.units.reduce((s, u) => s + u.lessons.length, 0) + ' 篇课文';
            } else {
                const u = book.units[currentUnit];
                lessonTitleEl.textContent = `${book.name} · ${u.name}`;
                lessonAreaEl.innerHTML = u.lessons.map(l => lessonLink(l, currentBook)).join('');
                countEl.textContent = u.lessons.length + ' 篇课文';
            }
            panelEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function searchKeyword(k) { searchInput.value = k; doSearch(k); }
        function doSearch(keyword) {
            const kw = (keyword || '').trim();
            if (!kw) { currentBook = ''; currentUnit = null; panelEl.classList.add('hidden'); countEl.textContent = '12 册教材'; return; }
            currentBook = ''; currentUnit = null;
            panelEl.classList.remove('hidden');
            breadcrumbEl.innerHTML = `<span class="cursor-pointer hover:text-primary" onclick="resetAll()">全部教材</span><i class="fa fa-chevron-right text-gray-400 text-xs mx-1"></i><span class="text-primary font-medium">搜索：${kw}</span>`;
            unitRowEl.innerHTML = '';
            let total = 0, html = '';
            BOOKS.forEach(b => {
                bookData[b.key].units.forEach(u => {
                    const hits = u.lessons.filter(l => l.includes(kw));
                    if (!hits.length) return;
                    html += `<div class="w-full mb-1 mt-3 text-gray-500">${b.key} · ${u.name}</div>`;
                    html += hits.map(l => lessonLink(l, b.key)).join('');
                    total += hits.length;
                });
            });
            lessonTitleEl.textContent = total ? '搜索结果' : '';
            lessonAreaEl.innerHTML = html || `<span class="text-gray-500">没有找到与「${kw}」匹配的课文。</span>`;
            countEl.textContent = total + ' 篇课文';
            panelEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function resetAll() {
            currentBook = ''; currentUnit = null; searchInput.value = '';
            panelEl.classList.add('hidden'); countEl.textContent = '12 册教材';
            document.getElementById('grid-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        searchInput.addEventListener('input', e => doSearch(e.target.value));
        renderGrid();
    </script>
</body>
</html>
