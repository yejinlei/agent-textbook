想着，就觉得身上痒痒的，低头一看，发现许多小树枝正从我身上冒出来。呀，我真的变成了一棵树！", "你猜，我变的树上会长什么？当然不是苹果啦，梨也不对—对了，鸟窝！", "我变的树上长满了各种形状的鸟窝：三角形的、正方形的，还有长方形的、圆形的、椭圆形的、菱形的……风一吹，它们就在枝头跳起了舞。", "我会请小白兔、小刺猬、小松鼠、小鸭子、小鳄鱼、小狐狸住在里面，如果你喜欢也可以住进来。", "你怎么住进来？别担心，我会弯下腰，让鸟窝离你很近很近，你只需轻轻一跳或者轻轻一爬，就像平时上你的小床那么容易。", "傍晚的时候，妈妈背着一个大包过来了，我的心嗵嗵地① 。", "跳着，震得树上的鸟窝都一动一动的，发出丁零丁零的声音。", "“你好！”妈妈向我点了点头，“请问我可以住在那个三角形的鸟窝里吗？”", "她不知道我变成了树！我有点儿高兴，又有些失望。一些树枝轻轻地垂下，妈妈顺着这些树枝爬了上来，坐在那个三角形的鸟窝里。", "妈妈打开背包，从里面拿出好多东西：巧克力、香肠、面包、花生、牛奶……她把这些好吃的分给小动物们。他们一起在我的鸟窝里津津有味地吃了起来。", "“咕噜噜……”我的肚子里发出一种怪怪的声音，把他们吓了一跳。他们也只是奇怪地互相望了一眼，又继续吃起来。", "“咕噜噜……”我肚子里的声音越来越响了。这时候，我开始想念家里那些香喷喷的饭菜，好像还看见爸爸正在大口大口地啃着一块糖醋排骨。天哪，那可是我最喜欢吃的东西！", "“咦，下雨了。”小狐狸抬头望了望，可天空中一丝乌云都没有。", "“是你的牛奶打翻了吗？”小鳄鱼问小松鼠。", "“你看，这不好好的嘛。”", "“那么，可能是一只虫子撒的尿。”", "“不对，是大树在哭。”小白兔发现了树干上不断往下滴的水珠。", "唉，变成了树真麻烦。他们连水珠是从我的嘴巴里流出来的都不知道。", "“小馋猫，肚子饿了，对吧？英英！”", "妈妈说话了，还对我眨了一下眼睛。", "噢，最了解我的人到底还是妈妈。", "哎呀，她是怎么知道我的秘密的？", "如果你也会变，你想变成什么？变了以后会发生什么奇妙的事？", "初试身手在纸上按出自己的手指印，再把它画成想象中的事物，看谁想得新奇。", "读了本单元这些充满想象力的课文，你有哪些体会？激发了你怎样的想象？"], "tasks": ["默读课文，说说文中哪些想象让你觉得新奇有趣。"], "newchars": ["希容担易震零麻肠烦嗓痒椭菱鳄震零肠啃醋馋"]}, {"grade": "三年级", "term": "下册", "no": 18, "book": "三年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "童年的水墨画", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 70, "chars": 335, "paras": ["溪  边垂柳把溪水当作梳妆的镜子，山溪像绿玉带一样平静。", "人影给溪水染绿了，钓竿上立着一只红蜻蜓。", "忽然扑腾一声人影碎了，草地上蹦跳着鱼儿和笑声。", "江  上像刚下水的鸭群，扇动翅膀拍水戏耍。", "一双双小手拨动着浪花，你拨我溅笑哈哈。", "是哪个“水葫芦”一下钻入水中，出水时只见一阵水花两排银牙。", "童年的水墨画林  中松树刚洗过澡一身清清爽爽，松针上一串串雨珠明明亮亮。", "小蘑菇钻出泥土戴一顶斗笠，像一朵朵山花在树下开放。", "是谁一声欢叫把雨珠抖落，只见松林里一个个斗笠像蘑菇一样。"], "tasks": ["朗读课文。说说你在溪边、江上、林中分别看到了怎样的画面。"], "newchars": ["墨染碎溅垂碎染翅拨膀浪抖"]}, {"grade": "三年级", "term": "下册", "no": 19, "book": "三年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "肥皂泡", "section": "阅读", "domain": "reading", "genre": "课文", "author": "冰心", "dynasty": null, "page": 72, "chars": 874, "paras": ["小的时候，游戏的种类很多，其中我最爱玩的是吹肥皂泡。", "下雨的时节，不能到山上海边去玩，母亲总教我们在廊子上吹肥皂泡。她说阴雨时节天气潮湿，肥皂泡不容易破裂。", "方法是把用剩的碎肥皂放在一只小木碗里，加上点儿水，和弄和弄，使它溶化，然后用一支竹笔套管，蘸上那黏稠的肥皂水，慢慢地吹起，吹成一个轻圆的网球大小的泡儿，① 本文作者冰心（1900—1999），选作课文时有改动。", "再轻轻地一提，那轻圆的球儿便从管上落了下来，软悠悠地在空中飘游。若用扇子在下面轻轻地扇送，有时能飞得很高很高。", "这肥皂泡，吹起来很美丽，五色的浮光，在那轻清透明的球面上乱转。若是扇得好，一个大球会分裂成两三个玲珑娇软的小球，四散分飞。有时吹得太大了，扇得太急了，这脆薄的球，会扯成长圆的形式，颤巍巍的，光影零乱。这时大家都悬着心，仰着头，屏住呼吸，—不久，这光丽的薄球就无声地散裂了，肥皂水落了下来，洒到眼睛里，大家都忽然低了头，揉出了眼泪。", "那一个个轻清脆丽的小球，像一串美丽的梦，是我们自己小心地轻轻吹起的，吹了起来，又轻轻地飞起，是那么圆满，那么自由，那么透明，那么美丽。借着扇子的轻风，把她们一个个送上天去送过海去。到天上，轻轻地挨着明月，渡过天河跟着夕阳西去。或者轻悠悠地飘过大海，飞越山巅，又低低地落下，落到一个熟睡中的婴儿的头发上……目送着她们，我心里充满了快乐、骄傲与希望。", "课文中有一些句子不容易读懂，如，“五色的浮光，在那轻清透明的球面上乱转”。在课文中找一找，结合生活经验说说这些句子的意思。", "读句子，体会丰富的想象，再想一想：这些轻清脆丽的小球，还有哪些美好的去处呢？"], "tasks": ["朗读课文。用自己的话说说“我”吹肥皂泡的过程。"], "newchars": ["皂套若类弄溶泡悠骄傲剩和溶套若悬屏巅婴"]}, {"grade": "三年级", "term": "下册", "no": 20, "book": "三年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "灰雀", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 75, "chars": 621, "paras": ["有一年冬天，列宁在郊外养病。他每天到公园散步。公园里有一棵高大的白桦树，树上有三只灰雀：两只胸脯是粉红的，一只胸脯是深红的。它们在树枝间来回跳动，婉转地歌唱，非常惹人喜爱。列宁每次走到白桦树下，都要停下来，仰望这三只欢快的灰雀，还经常给它们带来面包渣和谷粒。", "一天，列宁又来到公园，走到白桦树下，发现那只胸脯深红的灰雀不见了。他在周围的树林中找遍了，也没有找到。", "这时，列宁看见一个小男孩，就问：“孩子，你看见过一只深红色胸脯的灰雀吗？”", "男孩说：“没……我没看见。”", "列宁说：“一定是飞走了或者是冻死了。天气严寒，它怕冷。”", "那个男孩本来想告诉列宁灰雀没有死，但又不敢讲。", "列宁自言自语地说：“多好的灰雀呀，可惜再也飞不回来了。”", "男孩看看列宁，说：“会飞回来的，一定会飞回来的。", "它还活着。”", "灰   雀列宁问：“会飞回来？”", "“一定会飞回来！”男孩肯定地说。", "第二天，列宁来到白桦树下，果然又看到那只灰雀欢蹦乱跳地在枝头歌唱。那个男孩站在白桦树旁，低着头。", "列宁看看男孩，又看看灰雀，微笑着说：“你好！灰雀，昨天你到哪儿去了？”", "当然，灰雀没有告诉列宁昨天它去哪儿了。列宁也没再问那个男孩，因为他已经知道，男孩是诚实的。", "胸脯婉惹分角色"], "tasks": ["默读课文，想一想：列宁和小男孩在对话的时候，他们各自心里想的是什么？"], "newchars": ["雀粉养惹粒仰遍者惜"]}, {"grade": "三年级", "term": "下册", "no": 21, "book": "三年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "我不能失信", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 77, "chars": 676, "paras": ["一个风和日丽的早晨，宋耀如一家用过早餐，准备到一位朋友家去做客。二女儿宋庆龄特别高兴，她早就盼着到这位伯伯家去了。伯伯家养的鸽子，尖尖的嘴巴，红红的眼睛，漂亮极啦！伯伯还说准备送她一只呢！", "她刚走到门口，突然停住了脚步，皱起了眉头。", "爸爸看见了，奇怪地问：“庆龄，你怎么不走啦？”", "“爸爸，我不能去了！我昨天和小珍约好了，今天她来我们家，我教她叠花篮。”庆龄说。", "“你不是一直想去伯伯家吗？改天再教小珍吧。”爸爸说完，拉起庆龄的手就要走。", "“不行！不行！我走了，小珍来了会扑空的，那多不好啊！”庆龄边说边把手抽回来。", "“那……回来你去小珍家解释一下，表示歉意，改天再孔子说：“人而无信，不知其可也。”在现实生活中，一个人要做到时时处处守信并不容易。"], "tasks": [], "newchars": ["耀示歉诺"]}, {"grade": "三年级", "term": "下册", "no": 22, "book": "三年级下册", "unit_no": 7, "unit_name": "第七单元", "title": "火烧云", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 84, "chars": 764, "paras": ["晚饭过后，火烧云上来了。霞光照得小孩子的脸红红的。", "大白狗变成红的了。红公鸡变成金的了。黑母鸡变成紫檀色的了。喂猪的老头儿在墙根靠着，笑盈盈地看着他的两头小白猪变成小金猪了。他刚想说“你们也变了……”，旁边走来个乘凉的人对他说：“您老人家必要高寿，您老是金胡子了。”", "天上的云从西边一直烧到东边，红彤彤的，好像是天空着了火。", "这地方的火烧云变化极多，一会儿红彤彤的，一会儿金灿灿的，一会儿半紫半黄，一会儿半灰半百合色。葡萄灰、梨黄、茄子紫，这些颜色天空都有。还有些说也说不出来、见也没见过的颜色。", "一会儿，天空出现一匹马，马头向南，马尾向西。马是跪着的，像等人骑上它的背，它才站起来似的。过了两三秒钟，那匹马大起来了，腿伸开了，脖子也长了，尾巴却不见了。看的人正在寻找马尾巴，那匹马变模糊了。", "忽然又来了一条大狗。那条狗十分凶猛，在向前跑，后边似乎还跟着好几条小狗。跑着跑着，小狗不知哪里去了，大狗也不见了。", "接着又来了一头大狮子，跟庙门前的石头狮子一模一样，也那么大，也那样蹲着，很威武很镇静地蹲着。可是一转眼就变了，再也找不着了。", "一时恍恍惚惚的，天空里又像这个又像那个，其实什么也不像，什么也看不清了。必须低下头，揉一揉眼睛，沉静一会儿再看。可是天空偏偏不等待那些爱好它的孩子。一会儿工夫，火烧云就下去了。"], "tasks": ["朗读课文。背诵第3~6自然段。"], "newchars": []}, {"grade": "三年级", "term": "下册", "no": 23, "book": "三年级下册", "unit_no": 7, "unit_name": "第七单元", "title": "暴风雨来临之前", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 87, "chars": 565, "paras": ["空气越来越沉闷，太阳被云遮住了，天空黑了。奇形怪状的乌云从西边的天空蔓延过来，很快就要到村子的上空了，树木和草全都变得昏暗了。", "一切都显得很不安。牛低着头。马摇着尾巴，鼻子不停地呼气，鬃毛摆来摆去。", "乌云气势汹汹地逼近了。很远的地方发出了轻微的响声。一会儿，声音停止了，一切又都沉寂下来，好像在等待什么不平常的情况。平时爱在阳光下唱着歌到处飞来飞去的鸟儿，现在到哪里去了？平时爱在草丛里嗡嗡叫的昆虫，现在又到哪里去了？什么东西都躲起来了，一点儿动静都没有。树枝不摇，树叶也不动了。", "天空划过一道闪电。村子里的人都急急忙忙地收拾东西，要在雷雨以前赶回家。", "新鲜的微风像是最初的报信者，从树林那边轻轻地吹过来，凉凉地吹在急急赶路的人们的脸上。它吹过树叶微微抖动的树梢。地上的尘土被轻轻地吹起来，又悄悄地落到树丛里。", "凉风过去之后，大风跟着来了。它吹进了村子，把村子里的公鸡和母鸡吹得乱跑，把它们的羽毛也吹得乱蓬蓬的。", "大风过去之后，又是一片寂静。", "突然，轰隆隆的雷声震响了天空，它告诉人们，暴风雨来了。", "在暴风雨来临之前，起风前和起风后的景象有什么不同？各有什么特点？", "选   做你见过暴风雨吗？当时的情景是怎样的？"], "tasks": ["默读课文，边读边想象画面。"], "newchars": ["闷蔓延昏汹况报隆临闷越昏况暗报梢隆"]}, {"grade": "三年级", "term": "下册", "no": 24, "book": "三年级下册", "unit_no": 7, "unit_name": "第七单元", "title": "我们奇妙的世界", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 89, "chars": 853, "paras": ["这是一个奇妙的世界，一切看上去都是有生命的。", "你看天空的珍藏—清晨，太阳升起，带来新的一天。开始，天空呈粉红色，慢慢地变成了蔚蓝色，太阳就像一个大火球一样升起来了。", "有时，云彩在蓝色的天空中飞行，如同经过雕饰一样，呈现出各种奇妙的形状，告诉我们许多奇妙的故事……", "当云彩变得又黑又重时，雨点就会噼噼啪啪地降落到大地上。", "雨后，我们会看到地上有许多水洼，就像有趣的镜子，映射着我们的脸。", "一天结束了，落日的余晖不时变幻着颜色，好像有谁在天空涂上了金色、红色和紫色。", "黑夜降临了，我们看见夜空中群星闪烁，就像千千万万支极小的蜡烛在发光。", "再看大地的珍藏—我们能看到植物生长的奇迹—极小的一粒种子种到地里，生根，发芽，不久就开花了，花很漂亮。", "我们能看到各种颜色诱人的水果，圆润的鲜红色的樱桃，深紫色的李子，浅黄色的梨。", "夏日，在大树下乘凉，我们会感叹，大树带来这么多绿荫。", "秋天带着金黄色的光辉神奇地到来了，那时，道路上好像洒满了光芒。蝴蝶张开漂亮的翅膀在空中翩翩起舞。", "鸟儿为了建造它们的房子，衔着泥土振翅飞翔。", "我们领略秋风的劲吹—树枝颤动，树叶飘落。", "冬天，我们看到了房檐上垂下的冰柱，它们好像一把把锋利的刀剑在阳光下闪耀。等到积雪融化时，从房檐上落下的小水滴，就像一颗颗珍珠。", "只要我们仔细地观察、寻找，就能从极普通的事物中找到美—各种形状的卵石，三桅小船的模型，颜色各异的羽毛。", "是的，世界上奇妙的事物是无穷的，只要我们去寻找。", "有感情地"], "tasks": [], "newchars": ["呈蔚雕洼烁蜡烛芒略劲柱剑呈李幻夏芒辉建柱剑"]}, {"grade": "三年级", "term": "下册", "no": 25, "book": "三年级下册", "unit_no": 8, "unit_name": "第八单元", "title": "慢性子裁缝和急性子顾客", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 96, "chars": 1300, "paras": ["故事发生在冬天。裁缝店里走进一位顾客。", "顾客把一卷布料放到桌上，对裁缝说：“我想做件棉袄。我已经跑了三家裁缝店了。第一家说要到秋天才能做好。第二家问我有没有等到夏天的耐心。第三位师傅倒是强些，但他最早也要到开春才能交货。我可等不及，都没让他们做。告诉您，我和别的顾客不一样，我是个性子最急的顾客。请问师傅，您准备让我什么时候来取衣服—秋天？夏天？春天？……”", "“不，”裁缝说，“就在冬天。”", "裁缝又补充一句：“不过，我指的是明年冬天。”", "顾客噌的一下子跳起来：“这么慢啊！”", "裁缝说：“我和别的裁缝不一样，我是个性子最慢的裁缝啊。”", "“那就算啦，我还是去找刚才的师傅吧。”顾客夹起布料就要走。", "“别走，”裁缝把顾客叫住，“我知道您是个急性子。依我看，我做的活儿最适合您这种性子的顾客啦。”", "慢性子裁缝和急性子顾客急性子顾客挺纳闷：“为什么？”", "“照您的性子，您肯定会一拿到衣服就穿在身上，不是吗？”裁缝说。", "顾客说：“那当然。我可不愿意把新衣服藏在箱子里。”", "裁缝说：“那么，您要是在别的季节拿到新棉袄，也肯定会由着性子穿上。可是您无论在秋天、夏天还是春天穿一件棉袄，人家都会笑话您的。我呢，决不会让人笑话您。非但如此，在您穿上我做的美观大方的新棉袄的时候，大家还会围着您直夸奖，甚至羡慕您呢。”", "这位顾客歪着头想了想，不得不承认裁缝说得有道理。", "于是，做衣服的事儿就算说定了。", "不料，这位顾客第二天又跑到裁缝店来，说：“我不做棉袄了！”", "“等到明年冬天，时间实在太长啦。”顾客提出，“把我那棉袄里的棉花拽掉，改成夹袄，让我提前在秋天就能穿上合时的新衣服吧。”", "“不要棉花了，行啊。”裁缝答应了，“为您服务，没说的！”", "顾客满意地走了。可是第三天他又来了。", "“师傅，把我那夹袄的袖子剪去一截儿，改成夏天能穿的短袖衬衫吧，我实在等不及了。”", "裁缝点点头：“剪袖子，只要咔嚓咔嚓两剪子，好办得很，没问题。”", "又过了一天，那顾客再来的时候，裁缝笑着问他：“怎么，您那件短袖衬衫还能改成什么？”", "顾客说：“对不起，麻烦您再给我改成春装吧。袖子嘛，把上次剪下来的再接上去就是啦。”", "裁缝这回摇头了：“接上去的袖子多难看啊。”", "“那您别管，只要能让我早些在春天穿上。您别忘了，我可是个急性子顾客啊。”", "裁缝说：“亲爱的顾客，我要对您负责。我不会让您穿上这么难看的衣裳，这也坏了我的名声啊。”", "顾客泄气了。但裁缝又拍拍他的肩，说：“您放心，凭我的手艺，不用接袖子也能给您做出一件最漂亮的春装。”", "顾客感动极了：“那太谢谢啦。您真的不用接袖子？”", "“根本不用。”裁缝解释说，“因为您的布在我的柜子里搁着，我还没开始裁料呢。”", "顾客惊讶、恼怒地瞪大了眼睛！", "“您可别忘了，”裁缝提醒他说，“我是个慢性子裁缝啊。”", "此时，这位顾客会说些什么呢？", "分角色"], "tasks": ["默读课文，填写下面的表格，再借助表格复述这个故事。"], "newchars": ["夸性承奖顾袖衫衬负泄恼责缝箱夸奖承夹袖衬衫负责讶恼"]}, {"grade": "三年级", "term": "下册", "no": 26, "book": "三年级下册", "unit_no": 8, "unit_name": "第八单元", "title": "漏", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 100, "chars": 1283, "paras": ["从前，有一户人家：一个老公公，一个老婆婆，还喂着一头黑脊背、白胸脯的小胖驴。", "山上住着一只老虎，山下住着一个贼。老虎嘴馋，一心想着吃这头小胖驴；贼手痒，一心想着偷这头小胖驴。", "一天晚上，下着蒙蒙小雨。老虎来了，贼也来了。老虎用爪在墙壁上抓，贼用手在屋顶上挖，不一会儿，墙被老虎抓了个窟窿，屋顶被贼挖了个窟窿。老虎钻进驴圈，贼也正想往下跳。忽然，老公公和老婆婆在里屋说起话来，老虎和贼吓得大气都不敢出了。", "老公公说：“好像有什么声音在响？”", "老婆婆说：“唉！管他狼哩，管他虎哩，我什么都不怕，就怕漏！”", "老虎趴在驴圈里想：“翻山越岭我什么都见过，就是没见过‘漏’，莫非‘漏’比我还厉害？”", "贼蹲在屋顶上想：“走南闯北我什么都听说过，就是没听说过‘漏’，莫非‘漏’比我还厉害？”", "老虎吓得浑身发抖，贼听得腿脚发软。贼心里害怕，脚下一滑，扑通从屋顶的窟窿里跌下来，正巧摔到虎背上。老虎未料到房上会有东西掉下来，心想：“坏事，‘漏’捉我来了！”撒腿就往外跑。", "贼栽得晕头转向，一摸是个毛乎乎的东西，心想：“坏事，‘漏’等着吃我哩！”拼命抱住虎脖子不敢松手。", "老虎驮着贼，贼骑着老虎，跑哇，跑哇，累得老虎筋都快断了，颠得贼骨头架都快散了。跑着跑着，雨大了起来。", "前边有棵歪脖老树，老虎想：“‘漏’真厉害，像胶一样，粘住我了。到树跟前，得把它蹭下来，好逃命。”", "贼也想：“‘漏’真厉害，旋风一样，停都不停，一定是驮到家再吃我。到树跟前，得想法蹿上去，好逃命。”", "到了树跟前，老虎把身子一歪，贼顺势一纵，蹿到树上。老虎一边往前跑一边想：“终于甩掉‘漏’了！”贼一边往上爬一边想：“终于甩掉‘漏’了！”", "雨越下越大。", "老虎被雨一淋，清醒了许多，想想不甘心，还是要回去吃驴，就转身往回走。", "贼被雨一淋，清醒了许多，想想不甘心，还是要回去偷驴，就下树准备往回走。", "老虎走着走着，走到了歪脖老树跟前。贼又冷又饿，正在下树，看见走来一个黑乎乎的东西，心想：“‘漏’又来了，这下我可活不成了！”他赶忙往树梢上爬，总嫌离地太近，紧爬慢爬，咔嚓一声，树枝断了，一个倒栽葱摔了下来，顺着山坡往下滚。", "老虎正走着，见天上掉下个黑乎乎的东西，响声又这么大，心想：“‘漏’又来了，这下我可活不成了！”赶紧逃跑。", "下过雨的山坡又湿又滑，老虎腿一软，顺着山坡往下滚。", "老虎和贼一齐滚下了山坡，浑身沾满泥水，撞在了一块儿。他俩对看了一眼，同时惊恐地大喊：“‘漏’哇—”然后都吓昏了过去。", "天快亮了，小胖驴在驴圈里安安稳稳地吃着干草。", "老公公和老婆婆从炕头上坐了起来。滴答，滴答—他们抬头看看屋顶—唉，说怕漏，偏就又漏雨了！", "脊贼莫晕颠歪胶旋纵嫌"], "tasks": [], "newchars": ["驴胖爪厉莫闯害摸胶歪纵"]}, {"grade": "三年级", "term": "下册", "no": 27, "book": "三年级下册", "unit_no": 8, "unit_name": "第八单元", "title": "枣核", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 104, "chars": 1175, "paras": ["古时候，在山脚下的一个村庄里有一户人家。家里只有夫妻两个人，他们成天盼着要个小孩，常常叹着气说：“咱哪怕有个枣核那么大的孩子也好哇！”没想到说了这个话不久，果然生了一个枣核那么大的孩子。夫妻俩欢喜得很，给孩子起了个名叫“枣核”。", "一年又一年，枣核一点儿也不见长。爹说：“枣核呀，你真叫我白欢喜了一场！”娘说：“枣核呀，你一点儿不见长，我真为你愁得慌！”枣核说：“爹、娘，你们不用愁，别看我人"], "tasks": [], "newchars": ["核妻爹犁聪旱纳搜折困岂涨"]}, {"grade": "四年级", "term": "上册", "no": 1, "book": "四年级上册", "unit_no": 1, "unit_name": "第一单元", "title": "观潮", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 2, "chars": 864, "paras": ["观  潮① 。", "钱塘江大潮，自古以来被称为天下奇观。", "农历八月十八是一年中传统的观潮日。这一天早上，我们来到了海宁市的盐官镇，据说这里是观潮最好的地方。我们随着观潮的人群，登上了海塘大堤。宽阔的钱塘江横卧在眼前。江面很平静，越往东越宽，在雨后的阳光下，笼罩着一层蒙蒙的薄雾。镇海古塔、中山亭和观潮台屹立在江边。", "远处，几座小山在云雾中若隐若现。江潮还没有来，海塘大堤上早已人山人海。大家昂首东望，等着，盼着。", "午后一点左右，从远处传来隆隆的响声，好像闷雷滚动。顿时人声鼎沸，有人告诉我们，潮来了！我们踮着脚往东望去，江面还是风平浪静，看不出有什么变化。过了一会儿，响声越来越大，只见东边水天相接的地方出现了一条白线，人群又沸腾起来。", "那条白线很快地向我们移来，逐渐拉长，变粗，横贯江面。再近些，只见白浪翻滚，形成一堵高高的水墙。浪潮越来越近，犹如千万匹白色战马齐头并进，浩浩荡荡地飞奔而来；那声音如同山崩地裂，好像大地都被震得颤动起来。", "霎时，潮头奔腾西去，可是余波还在漫天卷地般涌来，江面上依旧风号浪吼。过了好久，钱塘江才恢复了平静。", "读这段话，我仿佛看到了潮水来时的样子，听到了潮水奔腾的声音。", "摄钱塘江大潮之所以格外壮观，与当地的特殊地形有关。钱塘江入海的地方叫杭州湾。杭州湾外宽内窄，呈喇叭形，东面的湾口宽达一百千米，而西面海宁市盐官镇附近的江面只有两千余米。同时，江底泥沙淤积，形成庞大的沙坎，从东往西逐渐升高，最高处在盐官镇上游。涨潮时，潮水从湾口涌入，向西奔来，受渐狭江面的约束，以及水下沙坎的影响，潮越来越高，最终形成了壮观的钱塘江涌潮。", "资料袋有感情地"], "tasks": [], "newchars": ["堵浩墙崩霎余据随顿堤逐渐盐薄隆鼎沸浩崩霎余漫吼"]}, {"grade": "四年级", "term": "上册", "no": 2, "book": "四年级上册", "unit_no": 1, "unit_name": "第一单元", "title": "繁星", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 5, "chars": 608, "paras": ["繁  星我爱月夜，但我也爱星天。从前在家乡七八月的夜晚，在庭院里纳凉的时候，我最爱看天上密密麻麻的星星。望着星天，我就会忘记一切，仿佛回到了母亲的怀里似的。", "三年前，在南京我住的地方有一道后门，每晚我打开后门，便看见一个静寂的夜。下面是一片菜园，上面是星群密布的蓝天。星光在我们的肉眼里虽然微小，然而它使我们觉得光明无处不在。那时候我正在读一些关于天文学的书，也认得一些星星，好像它们就是我的朋友，它们常常在和我谈话一样。", "如今在海上，每晚和繁星相对，我把它们认得很熟了。", "我躺在舱面上，仰望天空。深蓝色的天空里，悬着无数半明半昧的星。船在动，星也在动，它们是这样低，真是摇摇欲坠呢！渐渐地我的眼睛模糊了，我好像看见无数萤火虫在我的周围飞舞。海上的夜是柔和的，是静寂的，是梦幻的。我望着那许多认识的星，我仿佛看见它们在对我眨眼，我仿佛听见它们在小声说话。这时我忘记了一切。在星的怀抱中，① 本文作者巴金（1904—2005），选作课文时有改动。", "我微笑着，我沉睡着。我觉得自己是一个小孩子，现在睡在母亲的怀里了。", "昧坠萤繁怀谈寂熟模躺糊舞围有感情地"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 3, "book": "四年级上册", "unit_no": 1, "unit_name": "第一单元", "title": "现代诗二首", "section": "阅读", "domain": "reading", "genre": "现代诗", "author": null, "dynasty": null, "page": 7, "chars": 111, "paras": ["秋晚的江上归巢的鸟儿，尽管是倦了，还驮着斜阳回去。", "双翅一翻，把斜阳掉在江上；头白的芦苇，也妆成一瞬的红颜了。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 4, "book": "四年级上册", "unit_no": 1, "unit_name": "第一单元", "title": "秋晚的江上", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": null, "page": 7, "chars": 111, "paras": ["归巢的鸟儿，尽管是倦了，还驮着斜阳回去。", "双翅一翻，把斜阳掉在江上；头白的芦苇，也妆成一瞬的红颜了。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 5, "book": "四年级上册", "unit_no": 1, "unit_name": "第一单元", "title": "花牛歌", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "徐志摩", "dynasty": null, "page": 8, "chars": 119, "paras": ["巢苇瞬穗罗霸① 本文作者徐志摩（1897—1931）。", "花牛在草地里坐，压扁了一穗剪秋罗luó 。", "花牛在草地里眠，白云霸占了半个天。", "花牛在草地里走，小尾巴甩得滴溜溜。", "花牛在草地里做梦，太阳偷渡了西山的青峰。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 4, "book": "四年级上册", "unit_no": 2, "unit_name": "第二单元", "title": "一个豆荚里的五粒豆", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 14, "chars": 1960, "paras": ["有一个豆荚，里面有五粒豌豆。豆荚和豌豆都是绿的，豌豆就以为整个世界都是绿的。豆荚在生长，豌豆也在生长。太阳在外边照着，把豆荚晒得暖洋洋的。这里既温暖，又舒适；白天明亮，夜间黑暗。豌豆坐在那儿越长越大，它们想，我们得做点儿事情啊。", "“难道我永远就在这儿坐下去吗？”它们中的一个问，“老这样坐下去，我恐怕会变得僵硬起来。我觉得外面似乎发生了一些事情——我有这种预感！”", "许多天过去了。豆荚变黄了，这几粒豌豆也变黄了。", "“整个世界都变黄啦！”它们说。", "忽然，它们觉得豆荚震动了一下。豆荚被摘下，跟许多别的丰满的豆荚在一起，溜到一个衣服口袋里去了。", "“我们不久就要被打开了！”豌豆们说。于是它们就等待这件事情的发生。", "“我倒想要知道，我们之中谁会走得最远！”最小的一粒豌豆说。", "读课文，认真思考， 看看你能提出什么问题。", "一个豆荚里的五粒豆“是的，事情马上就要揭晓了。”最大的那粒豌豆说。", "啪！豆荚裂开来了。那五粒豌豆全都躺在一个孩子的手中。这个孩子紧紧地捏着它们，说可以当作玩具枪的子弹用。他马上把第一粒豌豆装进去，把它射了出去。", "“现在我要飞到广阔的世界里去了！如果你能捉住我，就请来吧！”第一粒豌豆说完就飞走了。", "“我，”第二粒说，“我将直接飞进太阳里去。这才像一粒豌豆呢，而且与我的身份非常相称！”于是，它也飞走了。", "“我们到了哪儿，就在哪儿住下来。”接下来的两粒说，“不过，我们还得向前滚。”在被装进玩具枪之前，它们从小孩的手中滑落到地上，打起滚来。但这两粒豌豆最终还是被装进玩具枪里去了。它们说：“我们才会飞得最远呢！”", "“该怎么样就怎么样吧！”最后的那一粒说。它被射到空中，落到顶楼窗子下面的一块旧板子上，正好钻进一个长满了青苔的裂缝里。青苔把它裹起来，它躺在那儿真可以说成了一个囚犯。", "在这个小小的顶楼里住着一个穷苦的女人。她很强壮，很勤劳，每天擦火炉，劈木柴，干很多苦活，不过还是很穷。她有一个女儿，身体非常虚弱，躺在床上一整年了。小女孩安静地、耐心地整天在家里躺着，而她的母亲每天到外面去挣点儿生活费。", "春天的一个早晨，当母亲准备出去工作的时候，阳光温和地从那个小窗子射进来，一直射到地上。", "小女孩望着最低的那块窗玻璃说：“有个绿东西从窗玻璃旁边探出头来，它是什么呢？”", "母亲向窗边走去，把窗户打开一半。“啊！”她说，“我的天，原来是一粒小豌豆在这里生了根，还长出小叶子来了。", "它是怎么钻进这个缝隙里去的？你现在有一个小花园了！”", "母亲把小女孩的床搬得更靠近窗子，好让她看到这粒正在生长着的豌豆。", "“妈妈，我觉得我好了一些！”晚上，这个小女孩说，“太阳今天在我身上照得怪暖和的。这粒豌豆长得好极了，我也会好起来的。我能爬起来，走到温暖的太阳光中去。”", "“但愿如此。”母亲虽然不太相信，但还是仔细地用一根小棍子把这植物支起来，好使它不至于被风吹断，因为它使女儿对生命产生了希望。她从窗台上牵了一根绳子到窗框的上端去，使这棵豌豆苗可以顺着它向上生长。", "它的确在向上长——人们每天都可以看到它在生长。", "“真的，它现在要开花了！”这个母亲慢慢开始相信，她的孩子会好起来。她记起最近这孩子讲话时，要比以前愉快得多，而且最近几天她也能自己爬起来，坐在床上，用兴奋的眼光望着这一粒豌豆所形成的小花园。一星期以后，小女孩第一次能够坐一整个钟头。她快乐地坐在温暖的太阳光里。窗子打开了，她面前是一朵盛开的、紫色的豌豆花。小女孩低下头来，轻轻地吻了一下它柔嫩的叶子。这一天简直像一个节日。", "其余的几粒豌豆呢？曾经想飞到广阔世界里去的那一粒，它落到了屋顶的水笕①里，被一只鸽子吃掉了。那两粒曾在地上打滚的豌豆也没有走多远，也被鸽子吃掉了。它们还算有些实际的用途。那本来想飞进太阳里去的豌豆，却落到了水沟里，在脏水里躺了好几个星期，而且涨得大大的。", "“我又胖又美！”这粒豌豆说，“我胖得要爆裂开来了。", "我想任何豌豆从来不曾、也永远不会达到这种地步的。我是五粒豌豆中最了不起的一粒。”", "此刻，顶楼窗子旁那个小女孩——她的脸上洋溢着健康的光彩，她的眼睛发着亮光——正注视着豌豆花，快乐地微笑着，心里充满了感激。", "把你读课文时想到的问题写下来。", "小组交流，仿照下面的问题清单整理大家提出的问题，说说你有什么发现。", "小组问题清单◇  课文说被青苔包裹的豌豆像“一个囚犯”，但它却长得很好，为什么？"], "tasks": [], "newchars": ["舒揭适晓滑滚擦曾探沟涨豌僵预揭囚劈框吻脏溢健康"]}, {"grade": "四年级", "term": "上册", "no": 5, "book": "四年级上册", "unit_no": 2, "unit_name": "第二单元", "title": "夜间飞行的秘密", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 19, "chars": 1310, "paras": ["清朗的夜空出现两个亮点，越来越近了，才看清楚是一红一绿的两盏灯。接着传来了隆隆声，这是一架飞机在夜航。", "在漆黑的夜里，飞机是怎么做到安全飞行的呢？要想了解其中的秘密，我们可以从蝙蝠说起。", "蝙蝠能在夜里飞行，还能捕捉飞蛾和蚊子；而且无论怎么飞，从来没见过它跟什么东西相撞，即使一根极细的电线，它也能灵巧地避开。难道它的眼睛特别敏锐，能在漆黑的夜里看清楚所有的东西吗？", "飞机的夜间飞行和蝙蝠有什么关系呢？", "一位同学读了这篇课文，提出了一些问题，写在了旁边和文后。你阅读时提出了哪些问题呢？写下来，"], "tasks": [], "newchars": ["蝙蝠蛾避锐蝇障碍荧屏驾蚊蝇即绳嘴研驾究题驶"]}, {"grade": "四年级", "term": "上册", "no": 6, "book": "四年级上册", "unit_no": 2, "unit_name": "第二单元", "title": "方帽子店", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 23, "chars": 1367, "paras": ["这家帽子店从来没有做过别的帽子。", "他们的橱窗里都是方帽子。第一顶是方的，第二顶是方的，第三顶还是方的……", "问他们为什么只做方帽子，他们总是这样回答：“我们从来都是做方帽子，方帽子才是好帽子，不能改的。”", "做帽子的人做方帽子，买帽子的人买方帽子。我们常常可以看见戴着方帽子的人在马路上走着。他们圆圆的脑袋藏在方帽子里，紧的地方太紧，宽的地方太宽，冬天戴着不太暖，夏天戴着却热得满头汗。舒服吗？真不舒服！", "小孩子们觉得方帽子又奇怪又不舒服，他们想：圆圆的头为什么戴方帽子呢？圆的不行吗？", "这段话的开头已经点明了橱窗里都是方帽子，为什么还要一顶一顶再说一遍呢？", "方帽子戴着不舒服，为什么还要戴？", "一位同学读了下面这篇课文，在旁边和文后写下了自己的问题。读课文，写下你的问题，"], "tasks": [], "newchars": ["橱蕉扣嚷溜筒董", "帽袋脑扣懂璃溜摆筒玻假"]}, {"grade": "四年级", "term": "上册", "no": 7, "book": "四年级上册", "unit_no": 2, "unit_name": "第二单元", "title": "田忌赛马", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 28, "chars": 600, "paras": ["田忌赛马*"], "tasks": [], "newchars": ["忌将获赢拳跃测输谋划策荐"]}, {"grade": "四年级", "term": "上册", "no": 8, "book": "四年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "古诗三首", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "白居易一", "dynasty": "唐", "page": 34, "chars": 179, "paras": ["暮江吟[唐] 白居易一道残阳铺水中，半江瑟瑟半江红。", "可怜九月初三夜，露似真珠月似弓。", "题  西林  壁[宋] 苏轼横看成岭侧成峰，远近高低各不同。", "不识庐山真面目，只缘身在此山中。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 9, "book": "四年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "爬山虎的脚", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 36, "chars": 859, "paras": ["学校操场北边墙上满是爬山虎。我家也有爬山虎，从小院的西墙爬上去，在房顶上占了一大片地方。", "爬山虎刚长出来的叶子是嫩红的，不几天叶子长大，就变成嫩绿的。爬山虎的嫩叶，不大引人注意，引人注意的是长大了的叶子。那些叶子绿得那么新鲜，看着非常舒服。叶尖一顺儿朝下，在墙上铺得那么均匀，没有重叠起来的，也不留一点儿空隙。一阵风拂过，一墙的叶子就漾起波纹，好看得很。", "以前，我只知道这种植物叫爬山虎，可不知道它怎么能爬。今年，我注意了，原来爬山虎是有脚的。爬山虎的脚长在茎上。茎上长叶柄的地方，反面伸出枝状的六七根细丝，这些细丝很像蜗牛的触角。细丝跟新叶子一样，也是嫩红的。这就是爬山虎的脚。", "爬山虎的脚触着墙的时候，六七根细丝的头上就变成小圆片，巴住墙。细丝原先是直的，现在弯曲了，把爬山虎的嫩茎拉一把，使它紧贴在墙上。爬山虎就是这样一脚一脚地往上爬。如果你仔细看那些细小的脚，你会想起图画上蛟龙的爪子。", "爬山虎的脚要是没触着墙，不几天就萎了，后来连痕迹也没有了。触着墙的，细丝和小圆片逐渐变成灰色。不要瞧不起那些灰色的脚，那些脚巴在墙上相当牢固，要是你的手指不费一点儿劲，休想拉下爬山虎的一根茎。", "虎操脚嫩隙柄痕触迹瞧茎柄蜗曲萎"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 10, "book": "四年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "蟋蟀的住宅", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 39, "chars": 1597, "paras": ["居住在草地上的蟋蟀，差不多和蝉一样有名。它的出名不光由于它的唱歌，还由于它的住宅。", "别的昆虫大多在临时的隐蔽所藏身。它们的隐蔽所得来不费功夫，弃去毫不可惜。蟋蟀和它们不同，不肯随遇而安。它常常慎重地选择住址，一定要排水通畅，并且有温和的阳光。它不利用现成的洞穴。它的舒服的住宅是自己一点儿一点儿挖掘的，从大厅一直到卧室。", "蟋蟀怎么会有建筑住宅的才能呢？它有特别好的工具吗？没有。蟋蟀并不是挖掘技术的专家，它的工具是那样柔弱，所以人们对它的劳动成果感到惊奇。", "在儿童时代，我到草地上去捉蟋蟀，把它们养在笼子里，用菜叶喂它们。现在为了研究蟋蟀，我又搜索起它们的巢穴来。", "在朝着阳光的斜坡上，青草丛中隐藏着一条倾斜的隧道，即使有骤雨，这里也立刻就会干的。隧道顺着地势弯弯曲曲，最多九寸深，一指宽，这便是蟋蟀的住宅。出口的地方总有一丛草半掩着，就像一座门。蟋蟀出来吃周围① 本文作者是法国的法布尔（1823—1915），译者王大文，选作课文时有改动。", "蟋蟀的住宅的嫩草，绝不去碰这一丛草。那微斜的门口，经过仔细耙扫，收拾得很平坦。这就是蟋蟀的平台。当四周很安静的时候，蟋蟀就在这平台上弹琴。", "屋子的内部没什么布置，但是墙壁很光滑。主人有的是时间，把粗糙的地方修理平整。大体上讲，住所是很简朴的，清洁、干燥，很卫生。假使我们想到蟋蟀用来挖掘的工具是那样简单，这座住宅真可以算是伟大的工程了。", "蟋蟀盖房子大多是在十月，秋天初寒的时候。它用前足扒土，还用钳子似的大颚搬掉较大的土块。它用强有力的后足踏地。后腿上有两排锯，用它们将泥土推到后面，倾斜地铺开。", "工作做得很快。蟋蟀钻到土底下干活，如果感到疲劳，它就在未完工的家门口休息一会儿，头朝着外面，触须轻微地摆动。不大一会儿，它又进去继续工作。我一连看了两个钟头，看得有些不耐烦了。", "住宅的重要部分快完成了。洞已经挖了有两寸深，够宽敞的了。余下的是长时间的整修，今天做一点儿，明天做一点儿。这个洞可以随天气的变冷和它身体的增长而加深加阔。即使在冬天，只要天气温和，太阳晒到它住宅的门口，还可以看见蟋蟀从里面不断地抛出泥土来。"], "tasks": ["默读课文，说说课文围绕蟋蟀的住宅讲了哪两方面的内容，作者是怎样观察的。"], "newchars": ["蟋蟀宅慎址畅倾骤置糙朴燥", "宅重毫选址择专较修腿增厅"]}, {"grade": "四年级", "term": "上册", "no": 16, "book": "四年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "暮江吟", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "白居易一", "dynasty": "唐", "page": 34, "chars": 183, "paras": ["暮江吟[唐] 白居易一道残阳铺水中，半江瑟瑟半江红。", "可怜九月初三夜，露似真珠月似弓。", "古诗三首题  西林  壁[宋] 苏轼横看成岭侧成峰，远近高低各不同。", "不识庐山真面目，只缘身在此山中。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 17, "book": "四年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "题西林壁", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "白居易一", "dynasty": "唐", "page": 34, "chars": 183, "paras": ["暮江吟[唐] 白居易一道残阳铺水中，半江瑟瑟半江红。", "可怜九月初三夜，露似真珠月似弓。", "古诗三首题  西林  壁[宋] 苏轼横看成岭侧成峰，远近高低各不同。", "不识庐山真面目，只缘身在此山中。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 18, "book": "四年级上册", "unit_no": 3, "unit_name": "第三单元", "title": "雪梅", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "卢钺梅雪", "dynasty": null, "page": 35, "chars": 236, "paras": ["残壁铺横峰侧缘庐输降章评注释① 〔降〕服输。", "雪  梅[宋] 卢钺梅雪争春未肯降，骚人阁笔费评章‌。", "梅须逊雪三分白，雪却输梅一段香。", "《暮江吟》写了哪两个时间段的景色？作者观察了哪些景物？"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 11, "book": "四年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "盘古开天地", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 48, "chars": 690, "paras": ["很久很久以前，天和地还没有分开，宇宙混沌一片，像个大鸡蛋。有个叫盘古的巨人，在混沌之中睡了一万八千年。", "有一天，盘古醒来了，睁眼一看，周围黑乎乎一片，什么也看不见。他一使劲翻身坐了起来，只听咔嚓一声，“大鸡蛋”裂开了一条缝，一丝微光透了进来。巨人见身边有一把斧头，就拿起斧头，对着眼前的黑暗劈过去，只听见一声巨响，“大鸡蛋”碎了。轻而清的东西，缓缓上升，变成了天；重而浊的东西，慢慢下降，变成了地。", "天和地分开后，盘古怕它们还会合在一起，就头顶天，脚踏地，站在天地当中，随着它们的变化而变化。天每天升高一丈，地每天加厚一丈，盘古的身体也跟着长高。", "这样又过了一万八千年，天升得高极了，地变得厚极了。盘古这个巍峨的巨人就像一根柱子，撑在天和地之间，不让它们重新合拢。又不知过了多少年，天和地终于成形了，盘古也精疲力竭，累得倒下了。", "盘古倒下以后，他的身体发生了巨大的变化：他呼出的气息变成了四季的风和飘动的云；他发出的声音化作了隆隆的雷按照故事的发展顺序，说说盘古开天地的过程。", "从课文中找出你认为神奇的地方读一读，边读边想象画面，再说一说你心目中的盘古是什么样的。", "选   做课后收集中国的神话故事读一读，然后讲给同学听。", "声；他的左眼变成了太阳，照耀大地，他的右眼变成了月亮，给夜晚带来光明；他的四肢和躯干变成了大地的四极和五方的名山；他的血液变成了奔流不息的江河；他的汗毛变成了茂盛的花草树木；他的汗水变成了滋润万物的雨露……", "伟大的巨人盘古，用他的整个身体创造了美丽的世界。"], "tasks": [], "newchars": ["醒缓翻踏撑丈疲耀竭肢整斧缓浊丈肢躯液"]}, {"grade": "四年级", "term": "上册", "no": 12, "book": "四年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "精卫填海", "section": "阅读", "domain": "reading", "genre": "文言文", "author": null, "dynasty": null, "page": 50, "chars": 269, "paras": ["炎帝②之少女③，名曰女娃。女娃游于东海，溺nì ④而不返⑤，故⑥为⑦精卫，常衔西山之木石，以堙yīn ⑧于东海。", "正确、流利地"], "tasks": [], "newchars": ["曰溺填曰帝娃衔"]}, {"grade": "四年级", "term": "上册", "no": 13, "book": "四年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "普罗米修斯", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 51, "chars": 1056, "paras": ["很久很久以前，地面上没有火，人们只好吃生的东西，在无边的黑暗中度过一个又一个长夜。就在这时候，有一位名叫普罗米修斯的天神来到了人间，看到人类没有火的悲惨情景，决心冒着危险，到天上去“盗”取火种。", "有一天，当太阳车从天空驰过的时候，普罗米修斯跑到太阳车那里，从喷射着火焰的车轮上，拿了一颗火星，带到人间。自从有了火，人类就开始用它烧熟食物，驱寒取暖，并用火来驱赶危害人类安全的猛兽……", "得知普罗米修斯从天上取走火种的消息，众神的领袖宙斯气急败坏，决定给普罗米修斯以最严厉的惩罚，吩咐火神立即执行。", "火神赫淮斯托斯很敬佩普罗米修斯，悄悄对他说：“只要你向宙斯承认错误，归还火种，我一定请求他饶恕你。”", "普罗米修斯摇摇头，坚定地回答：“为人类造福，有什么错？我可以忍受各种痛苦，但决不会承认错误，更不会归还火种！”", "火神不敢违抗宙斯的命令，只好把普罗米修斯押到高加索山上。普罗米修斯双手和双脚戴着铁环，被死死地锁在高高的悬崖上。他既不能动弹，也不能睡觉，日夜遭受着风吹雨淋的痛苦。尽管如此，普罗米修斯就是不向宙斯屈服。", "狠心的宙斯又派了一只凶恶的鹫鹰，每天站在普罗米修斯的双膝上，用它尖利的嘴巴啄食他的肝脏。白天，他的肝脏被吃光了，可是一到晚上，肝脏又重新长了出来。这样，普罗米修斯所承受的痛苦永远没有了尽头。", "许多年来，普罗米修斯一直被锁在那座可怕的悬崖上。", "有一天，著名的大力士赫拉克勒斯经过高加索山。他看到普罗米修斯被锁在悬崖上，心中愤愤不平，便挽弓搭箭，射死了那只鹫鹰，又用石头砸碎了锁链。普罗米修斯——这位敢于从天上“盗”取火种的英雄，终于获得了自由。", "喷败颗敬忍佩既屈遭肝获脏斯悲惨盗驰佩违锁遭肝脏愤砸"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 14, "book": "四年级上册", "unit_no": 4, "unit_name": "第四单元", "title": "女娲补天", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 54, "chars": 608, "paras": ["《女娲补天》这个神话故事，处处充满着神奇的想象。", "* 女娲补天自从女娲创造了人类，大地上到处欢声笑语，人们过着快乐幸福的生活。", "不料有一年，天地忽然发生了一场大变动。天空塌下来一大块，露出了一个大窟窿，地上也裂开了一道道黑黝黝的深沟。洪水从地下喷涌而出，各种野兽也从山林里跑出来残害人类。人们惊慌失措，四处奔逃，整个世界陷入了一片混乱和恐怖之中。", "女娲看到这情景，难过极了，决心把天和地修补起来，让人类重新过上幸福的生活。", "这可是一项巨大而又艰难的工作。女娲先从各地拣来赤、青、黄、白、黑五种颜色的石头，燃起神火熔炼。随着神火渐渐熄灭，五种颜色的石头被炼成了黏稠的石浆。女娲用这些石浆把天上的大窟窿修补好。从此，天上便有了五① 本文是古代神话，由袁珂整理，选作课文时有改动。", "色的云霞。女娲担心补好的天再塌下来，于是又杀了一只巨鳌，砍下它的四条腿，竖立在大地的四方，把人类头顶上的天空撑起来，这样天就再也没有坍塌的危险了。接着，她奋勇杀死了在中原一带作恶的黑龙，其他野兽知道了，吓得纷纷逃回山林，再不敢到处流窜残害人类了。最后，女娲把芦苇烧成灰，撒到水中，芦灰越积越厚，把喷涌洪水的地缝也堵住了。", "天和地终于恢复了平静，人类获得了新生。人们世世代代怀念着女娲，传颂着她的伟大功绩。"], "tasks": ["默读课文，说说故事的起因、经过和结果。发挥自己的想象，试着把女娲从各地拣来五种颜色石头的过程说清楚、说生动。"], "newchars": ["兽措陷混拣燃炼熄浆杀颂", "绘"]}, {"grade": "四年级", "term": "上册", "no": 15, "book": "四年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "麻雀", "section": "阅读", "domain": "reading", "genre": "课文", "author": "是俄国的屠格涅", "dynasty": null, "page": 62, "chars": 529, "paras": ["麻  雀我打猎回来，走在林荫路上。猎狗跑在我的前面。", "突然，我的猎狗放慢脚步，悄悄地向前走，好像嗅到了前面有什么野物。", "风猛烈地摇撼着路旁的白桦树。", "我顺着林荫路望去，看见一只小麻雀呆呆地站在地上，无可奈何地拍打着小翅膀。它嘴角嫩黄，头上长着绒毛，分明是刚出生不久，从巢里掉下来的。", "猎狗慢慢地走近小麻雀，嗅了嗅，张开大嘴，露出锋利的牙齿。突然，一① 本文作者是俄国的屠格涅（niè）夫（1818—1883），译者巴金，选作课文时有改动。", "只老麻雀从一棵树上飞下来，像一块石头似的落在猎狗面前。它挓挲起全身的羽毛，绝望地尖叫着。", "老麻雀用自己的身躯掩护着小麻雀，想拯救自己的幼儿。可是因为紧张，它浑身发抖，发出嘶哑的声音。它立在那儿，准备牺牲它自己。在它看来，猎狗是个多么庞大的怪物啊！可是它不能安然地站在高高的没有危险的树枝上，一种强大的力量使它飞了下来。", "猎狗愣住了，它可能没料到老麻雀会有这么大的勇气，慢慢地，慢慢地向后退。", "我急忙唤回我的猎狗，带着它走开了。", "课文是怎样把下面的内容写清楚的？找出相关句子读一读。"], "tasks": ["朗读课文。说说课文围绕麻雀写了一件什么事，这件事的起因、经过和结果是怎样的。"], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 16, "book": "四年级上册", "unit_no": 5, "unit_name": "第五单元", "title": "爬天都峰", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 65, "chars": 706, "paras": ["假日里，爸爸带我去黄山，爬天都峰。", "我站在天都峰脚下抬头望：啊，峰顶那么高，在云彩上面哩！我爬得上去吗？再看看笔陡的石级，石级边上的铁链，似乎是从天上挂下来的，真叫人发颤！", "忽然听到背后有人叫我：“小朋友，你也来爬天都峰？”", "我回头一看，是一位白发苍苍的老爷爷，年纪比我爷爷还大哩！我点点头，仰起脸，问：“老爷爷，您也来爬天都峰？”", "老爷爷也点点头，说：“对，咱们一起爬吧！”", "我奋力向峰顶爬去，一会儿攀着铁链上，一会儿手脚并用向上爬，像小猴子一样……", "爬呀爬，我和老爷爷，还有爸爸，终于都爬上了天都峰顶。", "在鲫鱼背前，爸爸给我和老爷爷照了一张相，留作纪念。老爷爷拉拉我的小辫子，笑呵呵地说：“谢谢你啦，小朋友。要不是你的勇气鼓舞我，我还下不了决心哩！现在居然爬上来了！”", "课文写了一件什么事？是按照什么顺序写的？", "“我”开始不敢爬，最后爬上去了。课文是怎么把“我”爬山的过程写清楚的？", "链颤攀辫呵“不，老爷爷，我是看您也要爬天都峰，才有勇气向上爬的！我应该谢谢您！”", "爸爸听了，笑着说：“你们这一老一小真有意思，都会从别人身上汲取力量！”", "初试身手看图并发挥想象，把图片的内容说清楚。", "观察家人炒菜、擦玻璃或者做其他家务的过程，用一段话把这个过程写下来，注意用上表示动作的词语。", "写清楚一件事，要注意哪些问题呢？"], "tasks": [], "newchars": ["哩陡级颤链纪攀呵猴啦鼓"]}, {"grade": "四年级", "term": "上册", "no": 17, "book": "四年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "长城", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 74, "chars": 1007, "paras": ["远看长城，它像一条巨龙，在崇山峻岭之间蜿蜒盘旋。", "从北京德胜门出发一路向北，不过一百多里就来到八达岭长城脚下。这一段长城是明代在古长城基础上扩建的，用巨大的条石和城砖修筑而成，高大坚固。城墙上面铺着方砖，十分平整。城墙顶上外侧建有一排垛子，垛子底部每隔三米左右留有礌石②孔，供投放礌石用。有的垛子上还有瞭望口，方便观察情况。城墙上，隔不多远就有一座方形的敌楼③，是屯兵的堡垒。打仗的时候，敌楼之间可以互相呼应。", "站在长城上，踏着脚下的方砖，扶着墙上的条石，很自然地想起古代修筑长城的劳动人民来。单看这数不清的条石，有的长达三米，重两千多斤。那个时候没有起重机，古人是怎么做的呢？原来这些条石是就地取材，人们用当地的石头一下下凿出来的。城砖每块重几十斤，是在山下烧制好，再用人力和畜力一块块运上来的。长城上的一砖一石都① 本文选自人民教育出版社《全日制十年制学校小学课本（试用本）语文第九册》，有改动。", "长  城耗费了大量的人力和物力，多少劳动人民的血汗和智慧，才凝结成这前不见头、后不见尾的万里长城。", "这样气魄雄伟的工程，在世界历史上是一个伟大的奇迹。", "峻基础扩砖屯兵堡垒仗畜耗峻旋仗慧扶智耗扩筑砖隔"], "tasks": ["默读课文第2自然段，借助下图，说一说长城的构造及各部分的作用。"], "newchars": ["资料卡"]}, {"grade": "四年级", "term": "上册", "no": 18, "book": "四年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "颐和园", "section": "阅读", "domain": "reading", "genre": "课文", "author": "袁鹰", "dynasty": null, "page": 77, "chars": 999, "paras": ["北京的颐和园是个美丽的大公园。", "进了颐和园的大门，绕过大殿，就来到有名的长廊。绿漆的柱子，红漆的栏杆，一眼望不到头。这条长廊有七百多米长，分成二百七十三间。每一间的枋梁上都有五彩的画，画着人物、山水、花鸟等，一万多幅画没有哪两幅是相同的。长廊两旁栽满了花木，这一种花还没谢，那一种花又开了。微风从左边的昆明湖上吹来，使人神清气爽。", "走完长廊，就来到了万寿山脚下。抬头一看，一座八角宝塔形的三层建筑耸立在半山腰上，黄色的琉璃瓦闪闪发光。那就是佛香阁。下面的一排排金碧辉煌的宫殿，就是排云殿。", "登上万寿山，站在佛香阁的前面向下望，颐和园的景色颐和园① 本文作者袁鹰（1924—2023），选作课文时有改动。", "大半收在眼底。葱郁的树丛，掩映着黄的绿的琉璃瓦屋顶和朱红的宫墙。正前面，昆明湖静得像一面镜子，绿得像一块碧玉。游船、画舫在湖面慢慢地滑过，几乎不留一点儿痕迹。向东远眺，隐隐约约可以望见几座古老的城楼和城里的白塔。", "从万寿山下来，就是昆明湖。昆明湖围着长长的堤岸，堤上有好几座式样不同的石桥，两岸栽着数不清的倒垂的杨柳。湖中心有个小岛，远远望去，岛上一片葱绿，树丛中露出宫殿的一角。游人走过长长的石桥，就可以去小岛上玩。", "这座石桥有十七个桥洞，叫十七孔桥。桥栏杆上有上百根石柱，柱子上都雕刻着小狮子。这么多的狮子，姿态不一，没有哪两只是相同的。", "颐和园到处有美丽的景色，说也说不尽，希望你有机会去细细游赏。", "幅绕隐镜煌狮栽腰耸殿漆琉佛煌"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 19, "book": "四年级上册", "unit_no": 6, "unit_name": "第六单元", "title": "秦兵马俑", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 80, "chars": 845, "paras": ["1974年，秦兵马俑在陕西西安的骊山脚下出土，它举世无双，是享誉世界的珍贵历史文物。", "兵马俑规模宏大，气势磅礴，三个俑坑总面积20000多平方米，坑内埋藏有兵马俑7000多件。在三个俑坑中，一号坑最大，东西长230米，南北宽62米，总面积14260平方米，坑里的兵马俑也最多，有6000多件。一号坑上面盖着一座巨大的拱形大厅。走进大厅，站在高处鸟瞰，兵马俑一行行、一列列，十分整齐，排成了一个巨大的长方形军阵，真像是秦始皇当年统率的一支南征北战、所向披靡的大军。", "兵马俑不仅规模宏大，而且类型众多。", "将军俑身材魁梧，头戴鹖冠②，昂首挺胸。那神态自若的样子，一看就知道是久经沙场，重任在肩。", "这句话的作用是什么呢？", "秦兵马俑*武士俑平均身高1.8米，体格健壮，体形匀称。他们有的身穿战袍，有的披挂铠甲，手持兵器，整装待发。", "骑兵俑上身着短甲，下身穿紧口长裤，足蹬短靴，右手执缰绳，左手持弓弩，好像随时准备上马冲杀。", "陶马与真马一般大小，一匹匹形体健壮，肌肉丰满。那跃跃欲试的样子，好像一声令下，就会撒开四蹄，腾空而起，踏上征程。", "每个兵马俑都是极为精美的艺术珍品。仔细端详，他们神态各异：有的颔首低眉，若有所思，好像在考虑如何相互配合，战胜敌手；有的目光炯炯，神态庄重，好像在暗下决心，誓为秦国统一天下作殊死拼搏；有的凝视远方，好像在思念家乡的亲人……走近他们，似乎能感受到轻微的呼吸声。", "秦兵马俑在古今中外的雕塑史上是绝无仅有的。它惟妙惟肖地模拟军阵的排列，生动逼真地再现了秦军雄兵百万、战车千乘的宏伟气势，形象地展示了中华民族的强大力量和英雄气概。1987年，秦始皇陵及兵马俑被联合国教科文组织列入《世界遗产名录》。"], "tasks": ["默读课文，说一说：课文是从哪些方面介绍秦兵马俑的？你印象最深的是哪个方面？有兴趣的同学可以查找资料，进一步了解秦兵马俑。"], "newchars": ["享誉宏皇率着靴誓塑惟肖拟逼"]}, {"grade": "四年级", "term": "上册", "no": 20, "book": "四年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "牛和鹅", "section": "阅读", "domain": "reading", "genre": "课文", "author": "任大霖", "dynasty": null, "page": 88, "chars": 1805, "paras": ["大家都说：牛的眼睛看人，觉得人比牛大，所以牛是怕人的；鹅的眼睛看人，觉得人比鹅小，所以鹅不怕人。", "我们都很相信这句话。", "所以我们看到牛，一点儿不害怕，敢用手拍它的背，摸它的肚子，甚至敢用树枝去触它的屁股呢！可是牛像是无所谓似的，只是眨眨眼，把尾巴甩几甩。有的孩子还敢扳牛角，叫它跪下来，然后骑到牛背上去。我那时虽然不敢这样，可是用拳头捶捶牛背还是敢的。", "我们看到鹅，那就完全两样了：总是远远地站在安全的地方，才敢看它。要是在路上碰到鹅，就得绕个大圈子才敢走过去。", "有一次，我们放学回家，走过池塘边，看见有四只大白鹅在靠近岸边的水里游。我们马上都不说话了，贴着墙壁，悄悄地走过① 本文作者任大霖（lín）（1929—1995），选作课文时有改动。", "事情真的是这样吗？", "“拍、摸、触、扳、骑……”，几个表示动作的词语把“孩子们不怕牛”这个意思写清楚了。", "去。我的心里很害怕，怕它们看见了会追过来。这时，有一个顽皮的孩子故意要引它们来，就吁哩哩哩地叫了一声。鹅听见了，就竖起头来，侧着眼睛看了看，竟爬到岸上，一摇一摆地、神气地朝我们走过来；还伸长脖子，嘎嘎地叫着，扑打着大翅膀，好像在它们眼里根本没有我们这些人似的。", "孩子们惊呼起来，急急逃跑，鹅追得更快了。我吓得脚也软了，更跑不快。这时，带头的那只老公鹅就啪嗒啪嗒地跑了过来，嘎嘎，它赶上了我，嘎嘎，它张开嘴，一口就咬住了我当胸的衣襟，拉住我不放。在忙乱中，我的书包掉了，鞋子也弄脱了。我想，它一定要把我咬死了。我就又哭又叫，可是叫些什么，当时自己也不知道，大概是这样叫吧：“鹅要吃我了！鹅要咬死我了！”", "也许是我的哭叫更惹怒了这只老公鹅。", "它用全身的力量来拖我，啄我，扇动翅膀来扑打我。我几乎被它拖倒了——因为当时我还很小，只不过跟它一样高呢！其他几只鹅在后面嘎嘎大叫着助威。", "逃跑—被鹅咬住—呼救，那种惊慌失措写得很真实。", "就在这时候，池塘里划来了一只小船，捉鱼的金奎叔从船里跳上岸，飞快地走了过来（这些，我都是后来才知道的，当时是完全昏乱了）。金奎叔是个结实的汉子，他的胳膊比我的腿还粗。他一把握住了鹅的长脖子。鹅用脚爪划他，用嘴啄他。可是金奎叔的力气是那么大，他轻轻地把鹅提了起来，然后就像摔一个酒瓶似的，呼的一下，把这只老公鹅甩到了半空中。它张开翅膀，啪啪啪地落到了池塘中。这一下，其余三只鹅也怕了，纷纷张开翅膀，跳进池塘里，向远处游去。", "这一摔是那么痛快，远处的孩子们全笑了起来，我也挂着泪笑了。一切的恐怖，全消失了。因为在金奎叔的手里，鹅是那么弱，那么可笑，它，不过跟一个酒瓶子一样罢了！", "金奎叔帮我穿上鞋，拾起书包，用大手摸摸我的头，说：“鹅有什么可怕的！看把你吓成这样。”", "我说：“因为鹅把我们看得比它小啊！”", "鹅之前多神气，现在多狼狈啊。", "“ 挂着泪笑”，事情的变化对“我”来说太突然了。", "金奎叔说：“让它这样看好了！可是，它要是凭这点来欺负人，那咱们可不答应，就得掐住它的脖子，把它摔到池塘里去。记着，霖哥儿，下次可别怕它们。”", "我记住金奎叔的话，从此不再怕鹅了。", "有什么可怕的！虽然它把我们看得比它小，可我们实在比它强啊！怕它干吗？果然，我不怕它，它也不敢咬我，碰到了，只是嘎嘎叫几声，扇几下翅膀，就摇摇摆摆走开了。", "看到牛，我也不再无缘无故欺负它了。", "我觉得虽然它把我们看得比它大，可我们平白地去欺负它干吗？", "直到现在，我还记着金奎叔的话。", "看来鹅并不可怕！只要不怕它，鹅就不敢欺负人了。", "结合课文中的批注，说说可以从哪些角度作批注。", "一边默读一边画出相关词句，体会“我”见到鹅和被鹅袭击时的心情。"], "tasks": [], "newchars": ["鹅屁股谓捶顽吁膊瓶怖欺掐鹅拳骑竖竟胸拖膊胳握摔鞋"]}, {"grade": "四年级", "term": "上册", "no": 21, "book": "四年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "一只窝囊的大老虎", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 93, "chars": 1603, "paras": ["我念的那所小学每星期六下午全校开周会，会上总有文艺表演。由十二个班级轮流演出，每个学期一个班级至多轮到两次。", "我一直没在台上露过面，看着同班的小朋友在台上又唱又跳，边说边比画，我真个羡慕得要死。我多想在台上露露脸，尝尝大家都看着我、给我鼓掌是什么味道。", "有一回又轮到我们班表演，班主任在分派角色的时候，我殷切期待的目光可能引起了她的注意。分派到最后，她看了我半晌才下决心说：“就这样吧，你扮老虎。”", "这一回我们班演的是《兄妹历险记》，中间有这么一段情节：兄妹俩在森林里迷了路，碰上一只大老虎。我就扮这只大老虎，用不着说话。", "于是开始排练。我套上老虎皮，那是一件画着黑道道的黄布连衣裤，背后拖着一条一只窝囊的大老虎① 本文作者叶至善（1918—2006），选作课文时有改动。", "硬邦邦的尾巴，穿上了手脚都不露。还得套上个纸糊的老虎头，那老虎头也是黄底子上画着黑道道，额头正中还有个“王”字。", "这倒好，脸还是露不成。捧着严严实实的“头盔”，我正发愣。那个演哥哥的小朋友还故意逗我：“你会豁虎跳吗？”", "“不会。”我只好照实回答。", "“不会豁虎跳算什么老虎？”他撇了撇嘴。", "真没想到，事到临头还会出现危机。我看着老师的脸，就怕她改变主意。", "老师真是个通情达理的好老师。她说：“不要紧，扮老虎不一定要豁虎跳。你先四脚着地爬上台，见了他们兄妹俩就站起来，啊呜啊呜叫着，向他们扑过去，他们逃，你就追。等到猎人上场，对你连开两枪，你就躺下来—死掉。记住了吗？”", "“记住了！”我连忙答应。我有充分的自信。", "“现在开始排练。你把老虎头套上。”", "套上老虎头，一股霉糨糊味儿直冲脑门，眼前也一片模糊。亏得眼睛那儿挖了两个小窟窿，要不就什么也看不见了。", "我弯下身子向前爬，老师在一旁不断地提示：“向前爬，再向前爬，快站起来，你没看见他们吗？向他们扑过去！唉，你怎么不叫哇？嗓门要大。别忘了你不是猫，你是一只大老虎！”", "我还以为扮老虎是最容易不过的了，不用说话，不用露脸，没想到也这么难。", "看来老师对我的演技并不满意，她倒没说什么。那个演哥哥的小朋友话可多了，说我这只老虎太窝囊，连豁虎跳也不会，只会在地上爬，还说他从没见过不会豁虎跳的老虎。随他说去吧，我这个配角虽然配不上他，可是老师没撤换我，他也只好将就。", "终于到了星期六，到了下午，到了我们班演出的那个时刻。", "我穿上老虎皮，套上老虎头，紧张地等候在后台的上场口。忽然背后有人轻轻推了我一把。我知道推我的是老师，立刻弯下身子爬上场去，嘴里啊呜啊呜直叫。只听见台下一阵哄堂大笑，笑得我脸上一阵热。我已经明白，我笨拙的表演把全场的老师同学都逗乐了，他们从没见过这样窝囊的老虎。", "我总算一直演到了躺下来死掉。到底怎么演完的，我一点儿也记不起来，只记得耳边的笑声接连不断。等到幕布拉下，我站起来摘下老虎头，满头满脸都是汗珠。", "老师倒没说什么。那个演哥哥的小朋友唉声叹气地对我说：“你一出场就豁几个虎跳，那就强多了。”我没回答他，可是心里想：是啊，要是我会豁虎跳，这场戏就不至于砸锅了。", "后来呢？后来我发誓，今后决不再扮演老虎。可是每回上动物园，我总要去看看老虎，想看看老虎是怎么豁虎跳的。可是老虎在笼子里不是打瞌睡，就是垂头丧气地踱来踱去，从没见过它们豁过什么虎跳。", "为什么不会豁虎跳就不能扮老虎呢？为什么没豁虎跳就会惹起哄堂大笑呢？我至今还不明白。", "从开始对演出充满期待，到最后疑惑不解，“我”的心情有怎样的变化？为什么会有那样的变化？结合课文相关语句，填写下面的表格，再借助表格复述课文。", "“我”的心情原因期待表演想在台上露脸，获得大家的掌声。", "有些担心……", "结合生活经验说一说：“我”的演出窝囊吗？可以怎么开导“我”？", "选   做排练时的情形，“我”记忆很深刻，而表演时“到底怎么演完的，我一点儿也记不起来”。你有过类似的经历吗？写下来"], "tasks": ["默读课文，在不理解的地方作批注，和同学交流。"], "newchars": ["露羡殷逗撇啊霉亏撤哄拙唉技撤哄推堂摘捧练示俩演表"]}, {"grade": "四年级", "term": "上册", "no": 22, "book": "四年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "陀螺", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 98, "chars": 1366, "paras": ["在我的故乡，陀螺不叫陀螺，叫作“冰尜儿”，顾名思义，就是冰上的小家伙。", "做冰尜儿用的是木头，柳木、榆木、松木、枣木、梨木都可以。抽打冰尜儿，当然是在冬季的冰天雪地里，最好的场所是冰面。好的冰尜儿尖部嵌一颗滚珠，转起来能增加许多妩媚。顶不济的，也要钉上一枚铁钉，否则转不了多少圈，尖部就会开裂。无论嵌上滚珠，还是钉上铁钉，冰尜儿都不会裂开，能毫无怨言地让你抽打，在冰面上旋转，舞蹈。", "抽冰尜儿的小伙伴们都爱比个高下。他们往往各站一角，奋力抽转自己的冰尜儿，让它朝对方撞去。这时你看吧，两只旋转① 。", "陀螺*的陀螺奋勇搏斗，旋风般撞向对手，刚一接触，又各自闪向一边，然后重整旗鼓再战——直到其中一方被撞翻才告一段落。赛陀螺每次都是体重个大的一方占上风。因此，只有小陀螺的大多在自家院子里玩，不拿到马路上去应战。况且小陀螺有个难听的绰号叫“角锥”，意思是小且细。抽打“角锥”的大多是拖鼻涕穿开裆裤的，他们的兴趣在于抽鞭子，对陀螺的质量往往不在意。", "我从小就不甘人后，更不愿自己的陀螺像金兵见到岳家军，一战即败。于是四处寻找木头，为削出得心应手的陀螺，就差没把椅子腿拿来“废物利用”了。为此不知挨了多少责骂，可仍然不肯住手。然而一个孩子无论如何是削不出高质量的陀螺的，因此，曾有很长一段时间我的世界堆满乌云，快乐像过冬的燕子一般，飞到一个谁也看不到的地方去了。", "这种懊恼终于引起了长辈的注意。我的叔叔，一位很有童心的年轻民警，答应在我生日那天送我一只陀螺。这消息曾使我一整天处于恍惚的状态，老想象着那只陀螺英武的风姿。", "叔叔的礼物不错！", "这只陀螺不是人工削出来的，而是一位木工在旋床上旋出来的，圆且光滑，如同一枚鸭蛋。虽然它远不如我想象中的那么漂亮，但我极高兴地接受了它。尤其当我看到这枚“鸭蛋”的下端已嵌上一粒大滚珠时，更是手舞足蹈，恨不得马上在马路上一显身手！", "我的陀螺刚一露面，就招来了一顿嘲笑。的确，在各色帅气的陀螺面前，它长得不伦不类，该平的地方不平，该尖的地方不尖，看不出一丝一毫与同伴相斗的能力。这使我士气大减，只是在一旁抽打，不敢向任何人挑战。", "然而世间许多事都是不可预料的，追求“和平”只是我的个人愿望，小伙伴们不甘寂寞，一个大陀螺的主人开始傲慢地向我挑衅。", "大陀螺摇头晃脑，挺着肚皮一次次冲过来，我的“鸭蛋”则不动声色地闪躲。一次次冲击，一次次闪躲，终于无法避开，它们狠狠地撞上了！", "奇怪的是，我的陀螺个头小，却顽强得出奇！明明被撞翻在一边，一扭身又照样旋转起来。它圆头圆脑，好像上下左右都能找到支撑点似的。结果呢，大陀螺在这个始终立于不败之地的对手面前，彻底溃败了。", "这真是个辉煌的时刻！我尝到了胜利的滋味，品到了幸运的甜头。无意中获得的“荣誉”，虽然小如微尘，对好胜的孩子来说，也足以陶醉许久了——直到现在我还能兴致勃勃地写下这些文字，便是一种有力的证明吧！", "我的冰尜儿，木工随便旋出的小木头块，丑小鸭生出的一只丑鸭蛋，在童年的一个冬日里，给了我极大的欢乐和由衷的自豪。", "这真应了一句古话：人不可貌相，海水不可斗量。"], "tasks": ["默读课文，在体会比较深的地方作批注。“我”的心情经历了怎样的变化？找出课文相关语句读一读，和同学交流你的体会。课文以“人不可貌相，海水不可斗量”结尾，说说你对这句话的理解。"], "newchars": ["钉质岳削废骂帅衅扭彻溃豪"]}, {"grade": "四年级", "term": "上册", "no": 23, "book": "四年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "王戎不取道旁李", "section": "阅读", "domain": "reading", "genre": "文言文", "author": null, "dynasty": null, "page": 102, "chars": 236, "paras": ["王戎七岁，尝②与诸小儿游。看道边李树多子折枝③，诸儿竞走④取之，唯wéi⑤戎不动。人问之，答曰：“树在道边而多子，此必苦李。”取之，信然⑥。", "正确、流利地"], "tasks": [], "newchars": ["诸竞唯戎戎诸竞唯", "王戎不取道旁李"]}, {"grade": "四年级", "term": "上册", "no": 24, "book": "四年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "我将无我，不负人民", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 108, "chars": 722, "paras": ["“最后，我有一个很好奇的问题，不知能不能问一下？”", "22日下午，意大利众议院，习近平主席同众议长菲科举行会见。临近结束时，“70后”的菲科突然抛出了这句话。", "全场目光注视着他。", "“您当选中国国家主席的时候，是一种什么样的心情？”", "听到众人的笑声，菲科补充道：“因为我本人当选众议长已经很激动了，而中国这么大，您作为世界上如此重要国家的一位领袖，您是怎么想的？”", "习近平主席的目光沉静而充满力量，他说：“这么大一个国家，责任非常重、工作非常艰巨。我将无我，不负人民。", "我愿意做到一个‘无我’的状态，为中国的发展奉献自己。”", "稍作停顿，他继续讲道：“一个举重运动员，最开始只能举起50公斤的杠铃，经过训练，最后可以举起250公斤。", "我相信可以通过我的努力、通过全中国13亿多人民勠力同心来担起这副重担，把国家建设好。我有这份自信，中国人民有这份自信。”", "菲抛奉亿邀席激抛训勤邀亿奉"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 25, "book": "四年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "为中华之崛起而读书", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 110, "chars": 1900, "paras": ["新学年开始了，修身课上，奉天②东关模范学校的魏校长向学生们提出了一个严肃的问题：“你们为什么而读书？”", "“为家父而读书。”", "“为明理而读书。”", "“为光耀门楣而读书。”有人干脆这样回答。", "有位同学一直默默地坐在那里，若有所思。魏校长注意到了，他打手势让大家安静下来，点名让那位同学回答。那位同学站了起来，清晰而坚定地回答道：“为中华之崛起而读书！”", "魏校长听了为之一振！他怎么也没想到，一个十二三岁的孩子，竟然有如此的抱负和胸怀！他睁大眼睛又追问了一句：“你再说一遍，为什么而读书？”", "“为中华之崛起而读书！”", "魏校长听了，连声赞叹：“好哇！为中华之崛起，有志者当效此生！”", "为中华之崛起而读书青年周恩来这位同学是谁呢？他就是周恩来，后来成为了中华人民共和国的第一任总理。", "周恩来出生于1898年。十二岁那年，他离开家乡江苏淮安，随回家探亲的伯父来到了东北。在奉天上学的时候，伯父告诉他，奉天有些地方被外国人占据了，不要随便去玩，有事也要绕着走，免得惹出麻烦没有地方说理。", "少年周恩来疑惑不解，问道：“被外国人占据？为什么呢？”", "“中华不振哪！”伯父叹了口气，没有再说什么。", "十二岁的周恩来当然不能完全明白伯父的话，但是“中华不振”四个字和伯父沉郁的表情却让他难以忘怀。", "一个星期天，周恩来背着伯父，约了一个同学来到了被外国人占据的地方。这一带果真和别处大不相同：街道上热闹非凡，往来的大多是外国人。", "周恩来和同学一路上左顾右盼，忽然发现巡警局门前围着一群人。他们凑了过去，只见人群中有个女人正在哭诉着什么。一问才知道，这个女人的亲人被外国人的汽车轧死了，她原本指望巡警局给她撑腰，惩处这个外国人，谁知中国巡警不但不惩处肇事的外国人，反而训斥她。围观的中国人都紧握着拳头，但这是在被外国人占据的地盘里，谁又敢怎么样呢？大家只能劝慰这个不幸的女人。", "此时的周恩来才真正体会到“中华不振”这四个字的沉重分量。怎么把祖国和人民从苦难和屈辱中拯救出来呢？这个问题像一团烈火一直燃烧在周恩来心中。所以，当修身课上魏校长提出为什么而读书这个问题时，就有了“为中华之崛起而读书”的响亮回答。", "崛脆肃离默晰凡惩斥燃崛范魏默晰惑轧惩肇斥辱"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 26, "book": "四年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "延安，我把你追寻", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 115, "chars": 396, "paras": ["像翩翩归来的燕子，在追寻昔日的春光；像茁壮成长的小树，在追寻雨露和太阳。", "追寻你，延河叮咚的流水，追寻你，枣园梨花的清香，追寻你，南泥湾开荒的镢头，追寻你，杨家岭讲话的会场。", "一排排高楼大厦像雨后春笋，一件件家用电器满目琳琅；有感情地朗读这首诗。查找资料，了解延河、枣园、南泥湾、杨家岭等地方的光辉历史。想一想：诗中多次提到“追寻”，是在“追寻”什么？为什么今天仍需要“追寻”？"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 27, "book": "四年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "古诗三首", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "王昌龄秦", "dynasty": "唐", "page": 117, "chars": 288, "paras": ["凉州词[唐] 王 翰葡萄美酒夜光杯，欲饮琵琶马上催。", "醉卧沙场君莫笑，古来征战几人回？", "出  塞[唐] 王昌龄秦时明月汉时关，万里长征人未还。", "但使龙城飞将在，不教胡马度阴山‌。", "这里指极精致的酒杯。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 54, "book": "四年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "凉州词", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "王昌龄秦", "dynasty": "唐", "page": 117, "chars": 289, "paras": ["[唐] 王 翰葡萄美酒夜光杯，欲饮琵琶马上催。", "醉卧沙场君莫笑，古来征战几人回？", "出  塞[唐] 王昌龄秦时明月汉时关，万里长征人未还。", "但使龙城飞将在，不教胡马度阴山‌。", "这里指极精致的酒杯。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 55, "book": "四年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "出塞", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "王昌龄秦", "dynasty": "唐", "page": 117, "chars": 292, "paras": ["凉州词[唐] 王 翰葡萄美酒夜光杯，欲饮琵琶马上催。", "醉卧沙场君莫笑，古来征战几人回？", "出  塞[唐] 王昌龄秦时明月汉时关，万里长征人未还。", "但使龙城飞将在，不教胡马度阴山‌。", "这里指极精致的酒杯。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "上册", "no": 56, "book": "四年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "夏日绝句", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "李清照生", "dynasty": "宋", "page": 118, "chars": 282, "paras": ["[宋] 李清照生当作人杰，死亦为鬼雄。", "至今思项羽，不肯过江东。", "有感情地"], "tasks": [], "newchars": ["词萄葡杯塞秦项鬼将杰雄催君征塞秦杰鬼"]}, {"grade": "四年级", "term": "下册", "no": 3, "book": "四年级下册", "unit_no": null, "unit_name": null, "title": "探索科学的奥秘", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 33, "chars": 682, "paras": ["生活中的很多事物和现象都蕴藏着科学的奥秘。为什么铁会生锈？为什么面包放久了会发硬？为什么水能带走脏东西？……你想知道这些问题的答案吗？快来读一读科普作品吧！", "你读过吗科普作品一般会介绍各种各样的科学知识，内容有趣，形式丰富，语言生动，以引人入胜的方式激发读者的好奇和探索。以下是一个科普作品片段，你能回答其中的问题吗？", "你们家里每天总有人生炉子，煮马铃薯。也许你自己就很会生炉子或者煮马铃薯。可是请你解释一下：为什么炉子里的柴会毕剥作响？为什么烟会走烟筒出去，而不向屋里冒？煤油燃烧的时候，从哪里来的烟？为什么烘烤的马铃薯有一层硬皮，煮的却没有？恐怕你不能解释明白吧。或者问你：水为什么能灭火？我的一位熟人回答说：“水能灭火，因为它又湿又冷。”可是煤油也又湿又冷，你倒是试试用煤油来灭火吧！不，你还是不试为好，一试就得报火警了。你看，问题挺简单，可是要回答它却不那么容易。我再给你猜十二个关于最简单事物的谜，你愿意不愿意？", "——作者是苏联的米·伊林，译者董纯才，选用时有改动相信你可以读更多在数学、物理、化学、生物等领域，我国一代又一代科学家把探求真理、献身科学作为毕生追求。他们始终保持对科学的好奇心，在潜心研究科学的同时，也致力于向大众普及科学知识，创作了许多优秀的科普作品，如李四光《看看我们的地球》、高士其《灰尘的旅行》、贾兰坡《人类起源的演化过程》。", "让我们读读这些作品，共同感受科学世界里的那些奥秘。", "阅读科普作品的时候，可能会遇到一些不理解的科技术语。这时要运用在课上学过的方法，试着去理解。", "读完后还可以查一查，书中谈到的一些科学问题，现在有什么新的研究成果。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "下册", "no": 1, "book": "四年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "古诗词三首", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "范成大梅", "dynasty": "宋", "page": 2, "chars": 154, "paras": ["“兴”，这里读xìng。", "四时田园杂兴（其二十五）[宋] 范成大梅子金黄杏子肥，麦花雪白菜花稀。", "日长篱落无人过，惟有蜻蜓蛱蝶飞。", "宿新市徐公店[宋] 杨万里篱落疏疏一径深，树头新绿未成阴。", "儿童急走追黄蝶，飞入菜花无处寻。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "下册", "no": 2, "book": "四年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "乡下人家", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 4, "chars": 897, "paras": ["乡下人家总爱在屋前搭一瓜架，或种南瓜，或种丝瓜，让那些瓜藤攀上棚架，爬上屋檐。当花儿落了的时候，藤上便结出了青的、红的瓜，它们一个个挂在房前，衬着那长长的藤，绿绿的叶。青、红的瓜，碧绿的藤和叶，构成了一道别有风趣的装饰，比那高楼门前蹲着一对石狮子或是竖着两根大旗杆，可爱多了。", "有些人家，还在门前的场地上种几株花，芍药，凤仙，鸡冠花，大丽菊，它们依着时令，顺序开放，朴素中带着几分华丽，显出一派独特的农家风光。还有些人家，在屋后种几十枝竹，绿的叶，青的竿，投下一片浓浓的绿荫。", "几场春雨过后，到那里走走，你常常会看见许多鲜嫩的笋，成群地从土里探出头来。", "鸡，乡下人家照例总要养几只的。从他们的房前屋后走过，你肯定会瞧见一只母鸡，率领一群小鸡，在竹林中觅食；或是瞧见耸着尾巴的雄鸡，在场地上大踏步地走来走去。", "他们的屋后倘若有一条小河，那么在石桥旁边，在绿树荫下，你会见到一群鸭子游戏水中，不时地把头扎到水下去觅食。即使附近的石头上有妇女在捣衣，它们也从不吃惊。", "若是在夏天的傍晚出去散步，你常常会瞧见乡下人家吃晚饭的情景。他们把桌椅饭菜搬到门前，天高地阔地吃起来。天边的红霞，向晚的微风，头上飞过的归巢的鸟儿，都是他们的好友。它们和乡下人家一起，绘成了一幅自然、和谐的田园风景画。", "秋天到了，纺织娘寄住在他们屋前的瓜架上。月明人静的夜里，它们便唱起歌来：“织，织，织，织啊！织，织，织，织啊！”那歌声真好听，赛过催眠曲，让那些辛苦一天的人们，甜甜蜜蜜地进入梦乡。", "乡下人家，不论什么时候，不论什么季节，都有一道独特、迷人的风景。", "试着给每幅画取个名字。", "你对课文描写的哪一处景致最感兴趣？"], "tasks": ["朗读课文，想象画面。如果给课文配画，你觉得可以画几幅？"], "newchars": ["构蹲饰例率凤投序耸倘踏眠绘寄谐", "构冠序朴素率倘附捣绘谐"]}, {"grade": "四年级", "term": "下册", "no": 3, "book": "四年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "天窗", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 7, "chars": 910, "paras": ["乡下的房子只有前面一排木板窗。暖和的晴天，木板窗扇扇打开，光线和空气都有了。", "碰着大风大雨，或者北风呼呼叫的冬天，木板窗只好关起来，屋子里就黑得像地洞似的。", "于是乡下人在屋顶开一个小方洞，装一块玻璃，叫作“天窗”。", "夏天阵雨来了时，孩子们顶喜欢在雨里跑跳，仰着脸看闪电，然而大人们偏就不许。“到屋里来啊！”随着木板窗的关闭，孩子们也就被关在地洞似的屋里了。这时候，小小的天窗是你唯一的慰藉。", "从那小小的玻璃，你会看见雨脚在那里卜落卜落跳，你会看见带子似的闪电一瞥；你想象到这雨，这风，这雷，。", "天  窗这电，怎样猛厉地扫荡了这世界，你想象它们的威力比你在露天真实感到的要大十倍百倍。小小的天窗会使你的想象锐利起来！", "晚上，当你被逼着上床去“休息”的时候，也许你还忘不了月光下的草地河滩。你偷偷地从帐子里伸出头来，仰起了脸。这时候，小小的天窗又是你唯一的慰藉！", "你会从那小玻璃上面的一粒星，一朵云，想象到无数闪闪烁烁可爱的星，无数像山似的、马似的、巨人似的奇幻的云彩；你会从那小玻璃上面掠过的一条黑影，想象到这也许是灰色的蝙蝠，也许是会唱歌的夜莺，也许是霸气十足的猫头鹰……总之，夜的美丽神奇，立刻会在你的想象中展开。", "发明这天窗的大人们，是应得感谢的。因为活泼会想的孩子们知道怎样从“无”中看出“有”，从“虚”中看出“实”，比任何他们看到的都更真切，更阔达，更复杂，更确实！", "文中两次提到小小的天窗是“ 唯一的慰藉”，从中可以体会到课文表达的思想感情。", "滩帐慰卜藉锐烁蝠蝙霸鹰"], "tasks": [], "newchars": ["慰藉卜"]}, {"grade": "四年级", "term": "下册", "no": 4, "book": "四年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "三月桃花水", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 10, "chars": 372, "paras": ["是什么声音，像一串小铃铛，轻轻地走过村边？是什么光芒，像一匹明洁的丝绸，映照着蓝天？", "啊，河流醒来了！三月的桃花水，舞动着绮丽的朝霞，向前流啊。有一千朵桃花，点点洒在河面，有一万个小酒窝，在水中回旋。", "三月的桃花水，是春天的竖琴。", "那忽大忽小的水声，应和着拖拉机的鸣响；那纤细的低语，是在和刚刚从雪被里伸出头来的麦苗谈心；那碰着岸边石块的叮当声，像是大路上车轮滚过的铃声……", "三月的桃花水，是春天的明镜。", "它看见燕子飞过天空，翅膀上裹着白云；它看见垂柳披上了长发，如雾如烟；它看见一群姑娘来到河边，水底立刻浮起一朵朵红莲，她们捧起了水，像抖落一片片花瓣……", "啊，地上草如茵，两岸柳如眉，三月桃花水，叫人多沉醉。", "绮和谈在课文中，作者把春水叫作“桃花水”。有感情地"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "下册", "no": 16, "book": "四年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "四时田园杂兴（其二十五）", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "范成大梅", "dynasty": "宋", "page": 2, "chars": 159, "paras": ["古诗词三首注释① 〔杂兴〕随兴而写的诗。", "“兴”，这里读xìng。", "四时田园杂兴（其二十五）[宋] 范成大梅子金黄杏子肥，麦花雪白菜花稀。", "日长篱落无人过，惟有蜻蜓蛱蝶飞。", "宿新市徐公店[宋] 杨万里篱落 , "怒脂吼晌辣拭划餐渗番挣详埋测刷"], "tasks": [], "newchars": ["琥珀嗡脂拭渗俯扎番埋澎湃"]}, {"grade": "四年级", "term": "下册", "no": 6, "book": "四年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "飞向蓝天的恐龙", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 20, "chars": 1454, "paras": ["说到恐龙，人们往往想到凶猛的霸王龙或者笨重、迟钝的马门溪龙；谈起鸟类，我们头脑中自然会浮现轻灵的鸽子或者五彩斑斓的孔雀。二者似乎毫不相干，但近年来发现的大量化石显示：在中生代时期，恐龙的一支经过漫长的演化，最终变成了凌空翱翔的鸟儿。", "早在19世纪，英国学者赫胥黎就注意到恐龙和鸟类在骨骼结构上有许多相似之处。在研究了大量恐龙和鸟类化石之后，科学家们提出，鸟类不仅和恐龙有亲缘关系，而且很可能就是一种小型恐龙的后裔。根据这一假说，一些与鸟类亲缘关系较近的恐龙应该长有羽毛，但一直没有找到化石证据。20世纪末期，我国科学家在辽宁西部首次发。", "现了保存有羽毛的恐龙化石，顿时使全世界的研究者们欣喜若狂。辽西的发现向世人展示了恐龙长羽毛的证据，给这幅古生物学家们描绘的画卷涂上了点睛之笔。", "恐龙是如何飞向蓝天的呢？让我们穿越时空隧道，访问中生代的地球，看看这一演化过程吧！", "地球上的第一种恐龙大约出现在两亿四千万年前。它和狗一般大小，两条后腿粗壮有力，能够支撑起整个身体。", "数千万年后，它的后代繁衍成一个形态各异的庞大家族。", "有些恐龙像它们的祖先一样用两足奔跑，有些恐龙则用四足行走。有些恐龙身长几十米，重达数十吨；有些恐龙则身材小巧，体重只有几千克。有些恐龙凶猛异常，是茹毛饮血的食肉动物；有些恐龙则温顺可爱，以植物为食。其中，一些猎食性恐龙的身体逐渐变小，越来越像鸟类：骨骼中空，身体轻盈；脑颅膨大，行动敏捷；前肢越来越长，能像鸟翼一样拍打；体表长出美丽的羽毛，不再披着鳞片或鳞甲。它们中的一些种类可能为了躲避敌害或寻找食物而转移到树上生存。这些树栖的恐龙在树木之间跳跃，降落，慢慢具备了滑翔能力，并最终能够主动飞行。不过，另一种看法是，飞行并非始于树栖生活。有些科学家推测，一种生活在地面上的带羽毛的恐龙，在奔跑过程中学会了飞翔。不管怎样，科学家们认为：原本不会飞的恐龙最终变成了天之骄子——鸟类，它们飞向了蓝天，从此开辟了崭新的生活天地。", "亿万年前，一种带羽毛的恐龙脱离同类，飞向蓝天，演化出今天的鸟类大家族。科学家们希望能够全面揭示这一历史进程。随着越来越多相关化石的发现，他们离这一愿望的实现已越来越近了。", "笨鸽钝描隧毫末凌态颅吨辟膨翼肢钝描隧衍吨颅lú 膨捷辟崭"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "下册", "no": 7, "book": "四年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "纳米技术就在我们身边", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 24, "chars": 769, "paras": ["纳米技术是20世纪90年代兴起的高新技术。如果说20世纪是微米的世纪，21世纪必将是纳米的世纪。", "什么是纳米技术呢？这得从纳米说起。纳米是非常非常小的长度单位，1纳米等于十亿分之一米。如果把直径为1纳米的小球放到乒乓球上，就好像把乒乓球放在地球上，可见纳米有多么小。纳米技术的研究对象一般在1纳米到100纳米之间，不仅肉眼根本看不见，就是普通的光学显微镜也无能为力。这种纳米级的物质拥有许多新奇的特性，纳米技术就是研究并利用这些特性造福人类的一门学问。", "纳米技术就在我们身边。冰箱里如果使用一种纳米涂层，就会具有杀菌和除臭功能，能够使蔬菜保鲜期更长。有一种叫作“碳纳米管”的神奇材料，比钢铁结实百倍，而且非常轻，将来我们有可能坐上“碳纳米管天梯”到太空旅行。", "在最先进的隐形战机上，用到一种纳米吸波材料，能够把探测雷达波吸收掉，所以雷达根本看不见它。", "纳米技术可以让人们更加健康。癌症很可怕，但如果在只有几个癌细胞的时候就能发现的话，死亡率会大大降低。利用极其灵敏的纳米检测技术，可以实现疾病的早期检测与预防。未来的纳米机器人甚至可以通过血管直达病灶，杀死癌细胞。生病的时候，需要吃药。现在吃一次药最多管一两天，未来的纳米缓释技术，能够让药物效力缓慢地释放出来，服一次药可以管一周，甚至一个月。", "纳米技术将给人类的生活带来深刻的变化。在不远的将来，我们的衣食住行都会有纳米技术的影子。", "“纳米技术就在我们身边”“纳米技术可以让人们更加健康”，选择其中一句话，结合课文内容和查找的资料，说说你的理解。", "选   做如果让你利用纳米技术，你会把它运用到生活中的哪些地方？发挥想象说一说。"], "tasks": ["朗读课文，把课文中的科技术语读正确。读了课文，你有什么不懂的问题？提出来和同学交流。"], "newchars": ["纳箱拥碳臭蔬钢隐康健需胞灶防疾乒乓拥菌臭蔬碳癌症率疾灶"]}, {"grade": "四年级", "term": "下册", "no": 8, "book": "四年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "千年梦圆在今朝", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 26, "chars": 1183, "paras": ["飞离地球、遨游太空是中华民族很久以来的梦想。在古代就有“嫦娥奔月”的神话，有人飞上天、空中飞车的传说，还有“鲲鹏展翅”“九天揽月”的奇妙想象。富有激情和超凡想象力的炎黄子孙，在千百年的岁月流转之中，不断地尝试实现自己的美好愿望。", "传说，我国明代的官员万户，是世界历史上第一个试验利用火箭上天的人。他把四十七支火箭安装在椅子背后，自己坐在椅子上，手拿两只大风筝，叫人点火发射。随着一声巨响，他消失在了火焰和烟雾中。尽管他的火箭飞行尝试没有成功，但万户仍然被国际航天史学家公认为人类飞行探索的先驱。为了纪念他，国际天文学联合会将月球上的一座环形山命名为“万户”。", "万户那种勇于实践的探索精神，极大地震撼和鼓舞着人们。数百年来，坚定而执着的炎黄子孙，在实现飞天梦*本文由人民教育出版社小学语文室编写。", "的过程中，遭受了无数失败，付出了惨重代价，但是，始终没有放弃飞离地球的努力。", "1949年，中华人民共和国成立，中华民族的历史掀开了崭新的一页，中国的航天事业也呈现出勃勃生机。毛泽东主席在苏联第一颗人造卫星上天之后的第二年——1958年，庄重地表示：“我们也要搞人造卫星。”经过十多年的努力，1970年4月24日，寂寞而辽阔的太空中，第一次响起了中国人的声音，那穿越苍穹的《东方红》乐曲，让海内外华人振奋不已。中国成为世界上第五个能够独立发射卫星的国家。", "在准备发射人造卫星的同时，中国科学家满怀希望地开始了载人航天技术的探索。1992年9月21日，党中央决定实施载人航天工程，一百一十多个单位直接承担了研制、建设和发射任务。经过广大科技人员、工人和解放军官兵十余年的不懈努力，2003年10月15日早晨9时，在酒泉卫星发射中心，随着一声震耳欲聋的巨响，我国自行研制的“神舟五号”飞船被送上太空。火箭宛若一条巨龙，划出一道绚丽的曲线，瞬间便消失在了苍穹之中。10月16日早晨6时23分，飞船在环绕地球十四圈后成功返回着陆场。航天员杨利伟在即将登机返回北京的时候，用三句话概括了他的太空旅行：“飞船运行正常。我自我感觉良好。我为祖国感到骄傲。”", "我国首次载人航天飞行的成功，向全世界宣告：中国已经成为第三个独立掌握载人航天技术的国家。", "“神舟五号”成功发射的第二年，我国正式实施探月工程。2007年10月24日，我国成功发射第一颗月球探测卫星“嫦娥一号”，这是我国航天事业的又一座里程碑。2019年1月3日，“嫦娥四号”探测器实现了人类首次月球背面软着陆，并传回了第一张月背近距离拍摄的清晰的月表形貌图。随后，“嫦娥四号”着陆器与它的月球车“玉兔二号”，顺利进行了互相拍摄，带有五星红旗的着陆器和月球车，在月球背面留下了历史性的珍贵影像。"], "tasks": ["默读课文，说说中华民族千年的飞天梦是怎样逐步实现的。感兴趣的同学，可以查阅资料，了解我国在航天领域的最新成就。"], "newchars": ["鹏揽驱践着党施懈宛碑", "天局提供"]}, {"grade": "四年级", "term": "下册", "no": 14, "book": "四年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "母鸡", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 51, "chars": 943, "paras": ["我一向讨厌母鸡。听吧，它由前院嘎嘎到后院，由后院再嘎嘎到前院，没完没了，并且没有什么理由，讨厌！", "有的时候，它不这样乱叫，而是细声细气的，有什么心事似的，颤颤巍巍的，顺着墙根，或沿着田坝，那么扯长了声如怨如诉，使人心中立刻结起个小疙瘩来。", "它永远不反抗公鸡，有时候却欺侮最忠厚的鸭子。更可恶的是遇到另一只母鸡的时候，它会下毒手，趁其不备，狠狠地咬一口，咬下一撮儿毛来。", "到下蛋的时候，它差不多是发了狂，恨不能让全世界都知道它这点儿成绩；就是聋人也会被它吵得受不了。", "可是，现在我改变了心思，我看见一只孵出一群小雏鸡的母鸡。", "不论是在院里，还是在院外，它总是挺着脖儿，表示出世界上并没有可怕的东西。一只鸟儿飞过，或是什么东西响了一声，它立刻警戒起来：歪着头听；挺着身儿预备作战；看看前，看看后，咕咕地警告鸡雏要马上集合到它身边来。", "母  鸡发现了一点儿可吃的东西，它咕咕地紧叫，啄一啄那个东西，马上便放下，让它的儿女吃。结果，每一只鸡雏的肚子都圆圆地下垂，像刚装了一两个汤圆儿似的，它自己却消瘦了许多。假若有别的大鸡来抢食，它一定出击，把它们赶出老远，连大公鸡也怕它三分。", "它教鸡雏们啄食，掘地，用土洗澡，一天不知教多少次。它还半蹲着，让它们挤在它的翅下、胸下，得一点儿温暖。它若伏在地上，鸡雏们有的便爬到它的背上，啄它的头或别的地方，它一声也不哼。", "在夜间若有什么动静，它便放声啼叫，顶尖锐，顶凄惨，无论多么贪睡的人都得起来看看，是不是有了黄鼠狼。", "它负责，慈爱，勇敢，辛苦，因为它有了一群鸡雏。它伟大，因为它是鸡母亲。一个母亲必定就是一位英雄。", "我不敢再讨厌母鸡了。", "老舍先生用词很严谨，他写母鸡“负责，慈爱，勇敢，辛苦”，母鸡真的就是这样。结合课文内容说一说。", "《猫》和《母鸡》都是老舍先生的作品。比一比，说说两篇课文在表达上有哪些相同和不同之处。", "老舍（1899—1966），原名舒庆春，字舍予，“老舍”是他最常用的笔名。他是杰出的语言大师，被誉为“人民艺术家”。他一生创作了一千多篇（部）作品，有长篇小说《骆驼祥子》、话剧《茶馆》等经典著作。"], "tasks": ["默读课文，画出“我”对母鸡的态度前后变化的句子，说说为什么有这样的变化。"], "newchars": ["讨坝厌绩孵忠毒戒警汤咕歪啼伏掘疙瘩侮恶毒聋啄伏哼啼凄"]}, {"grade": "四年级", "term": "下册", "no": 15, "book": "四年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "白鹅", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 54, "chars": 1900, "paras": ["这白鹅，是一位即将远行的朋友送给我的。我抱着这雪白的“大鸟”回家，放在院子里。它伸长了头颈，左顾右盼，我一看这姿态，想道：“好一个高傲的动物！”", "鹅的高傲，更表现在它的叫声、步态和吃相中。", "鹅的叫声，音调严肃郑重，似厉声呵斥。它的旧主人告诉我：养鹅等于养狗，它也能看守门户。后来我看到果然如此：凡有生客进来，鹅必然厉声叫嚣；甚至篱笆外有人走路，它也要引吭大叫，不亚于狗的狂吠。", "鹅的步态，更是傲慢了。大体上与鸭相似，但鸭的步调急速，有局促不安之相；鹅的步调从容，大模大样的，颇像京剧里的净角出场。它常傲然地站着，看见人走来也毫不相让；有时非但不让，竟伸过颈子来咬你一口。", "这个自然段在文中有什么作用呢？", "白  鹅鹅的吃饭，常常使我们发笑。我们的鹅是吃冷饭的，一日三餐。它需要三样东西下饭：一样是水，一样是泥，一样是草。先吃一口冷饭，再喝一口水，然后再到别处去吃一口泥和草。大约这些泥和草也有各种可口的滋味。这些食料并不奢侈，但它的吃法，三眼一板，一丝不苟。譬如吃了一口饭，倘若水盆放在远处，它一定从容不迫地大踏步走上前去，饮一口水，再大踏步走去吃泥、吃草。吃过泥和草再回来吃饭。", "这样从容不迫地吃饭，必须有一个人在旁侍候，像饭馆里的堂倌一样。因为附近的狗，都知道我们这位鹅老爷的脾气，每逢它吃饭的时候，狗就躲在篱边窥伺。等它吃过一口饭，踏着方步去喝水、吃泥、吃草的当儿，狗就敏捷地跑过来，努力地吃它的饭。鹅老爷偶然早归，伸颈去咬狗，并且厉声叫骂，狗立刻逃往篱边，蹲着静候；看它再吃了一口饭，再走开去喝水、吃泥、吃草的时候，狗又敏捷地跑上来，把它的饭吃完，扬长而去。等到鹅再来"], "tasks": [], "newchars": ["调颇促侍馆添剧譬苟附敏脾捷供昂"]}, {"grade": "四年级", "term": "下册", "no": 5, "book": "四年级下册", "unit_no": 3, "unit_name": "第三单元", "title": "繁星（七一）", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": null, "page": 36, "chars": 106, "paras": ["繁  星（七一）这些事——是永不漫灭的回忆：月明的园中，藤萝的叶下，母亲的膝上。", "本诗作者冰心，选作课文时有改动。", "繁  星（一三一）大海啊！", "哪一颗星没有光？", "哪一朵花没有香？", "哪一次我的思潮里没有你波涛的清响？"], "tasks": [], "newchars": ["短诗三首"]}, {"grade": "四年级", "term": "下册", "no": 6, "book": "四年级下册", "unit_no": 3, "unit_name": "第三单元", "title": "繁星（一三一）", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": null, "page": 36, "chars": 106, "paras": ["繁  星（七一）这些事——是永不漫灭的回忆：月明的园中，藤萝的叶下，母亲的膝上。", "本诗作者冰心，选作课文时有改动。", "繁  星（一三一）大海啊！", "哪一颗星没有光？", "哪一朵花没有香？", "哪一次我的思潮里没有你波涛的清响？"], "tasks": [], "newchars": ["短诗三首"]}, {"grade": "四年级", "term": "下册", "no": 7, "book": "四年级下册", "unit_no": 3, "unit_name": "第三单元", "title": "繁星（一五九）", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": null, "page": 37, "chars": 241, "paras": ["反复"], "tasks": [], "newchars": ["繁灭漫膝藤萝涛躲"]}, {"grade": "四年级", "term": "下册", "no": 9, "book": "四年级下册", "unit_no": 3, "unit_name": "第三单元", "title": "短诗三首", "section": "阅读", "domain": "reading", "genre": "现代诗", "author": null, "dynasty": null, "page": 36, "chars": 102, "paras": ["繁  星（七一）这些事——是永不漫灭的回忆：月明的园中，藤萝的叶下，母亲的膝上。", "本诗作者冰心，选作课文时有改动。", "繁  星（一三一）大海啊！", "哪一颗星没有光？", "哪一朵花没有香？", "哪一次我的思潮里没有你波涛的清响？"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "下册", "no": 10, "book": "四年级下册", "unit_no": 3, "unit_name": "第三单元", "title": "绿", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 38, "chars": 423, "paras": ["好像绿色的墨水瓶倒翻了，到处是绿的……", "到哪儿去找这么多的绿：墨绿、浅绿、嫩绿、翠绿、淡绿、粉绿……", "绿得发黑、绿得出奇。", "刮的风是绿的，下的雨是绿的，流的水是绿的，阳光也是绿的。", "所有的绿集中起来，挤在一起，重叠在一起，静静地交叉在一起。", "本诗作者艾青，选作课文时有改动。", "突然一阵风，好像舞蹈教练在指挥，所有的绿就整齐地按着节拍飘动在一起……", "有感情地"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "下册", "no": 11, "book": "四年级下册", "unit_no": 3, "unit_name": "第三单元", "title": "白桦", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 40, "chars": 388, "paras": ["在我的窗前，有一棵白桦，仿佛涂上银霜，披了一身雪花。", "毛茸茸的枝头，雪绣的花边潇洒，串串花穗齐绽，洁白的流苏如画。", "在朦胧的寂静中玉立着这棵白桦，在灿灿的金晖里闪着晶亮的雪花。", "徉着姗姗来迟的朝霞，它向白雪皑皑的树枝又抹一层银色的光华。", "本诗作者是苏联的叶赛宁，译者顾蕴璞，选作课文时有改动。", "白  桦有感情地"], "tasks": [], "newchars": ["桦茸涂绣潇穗抹胧朦寂霞绣潇绽朦胧晖徜徉"]}, {"grade": "四年级", "term": "下册", "no": 12, "book": "四年级下册", "unit_no": 3, "unit_name": "第三单元", "title": "在天晴了的时候", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 42, "chars": 268, "paras": ["该到小径中去走走：给雨润过的泥路，一定是凉爽又温柔；炫耀着新绿的小草，已一下子洗净了尘垢；不再胆怯的小白菊，慢慢地抬起它们的头，有感情地朗读并背诵课文。结合自己喜欢的诗句，"], "tasks": [], "newchars": ["炫垢怯曝赤携涉晕"]}, {"grade": "四年级", "term": "下册", "no": 12, "book": "四年级下册", "unit_no": 3, "unit_name": "第三单元", "title": "轻叩诗歌大门", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 44, "chars": 329, "paras": ["在本次综合性学习中，我们已经收集、创作了诗歌。让我们继续开展活动，进一步了解诗歌，感受诗歌的魅力。", "合作编小诗集。", "先想想可以编排哪些内容：可以是收集的诗和自己写的诗，还可以是与诗有关的故事或资料。再想想怎么编排：可以从诗人、内容、形式等角度给诗歌分类，可以配上插图，还可以用书法形式展示喜欢的诗。最后，给小诗集取一个好听的名字，制作封面和目录，装订后在班里展示。", "举办诗歌朗诵会。", "先进行小组讨论，如，选哪几首诗歌来朗诵，采用什么形式才能使本组的朗诵更精彩。再全班一起商量怎样开好班级诗歌朗诵会，如，推选谁做主持人，怎样安排节目顺序。根据商量的结果，大家分头准备。在组织活动的过程中，遇到困难可以请教老师。", "◎ 用恰当的语气读出诗歌表达的情感。", "◎ 表情、手势要自然。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "下册", "no": 13, "book": "四年级下册", "unit_no": 4, "unit_name": "第四单元", "title": "猫", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 48, "chars": 1190, "paras": ["猫的性格实在有些古怪。", "说它老实吧，它的确有时候很乖。它会找个暖和的地方，成天睡大觉，无忧无虑，什么事也不过问。可是，它决定要出去玩玩，就会出走一天一夜，任凭谁怎么呼唤，它也不肯回来。说它贪玩吧，的确是啊，要不怎么会一天一夜不回家呢？可是，它听到老鼠的一点儿响动，又是多么尽职。", "它屏息凝视，一连就是几个钟头，非把老鼠等出来不可！", "它要是高兴，能比谁都温柔可亲：用身子蹭你的腿，把脖子伸出来让你给它抓痒，或是在你写作的时候，跳上桌来，在稿纸上踩印几朵小梅花。它还会丰富多腔地叫唤，长短不同，粗细各异，变化多端。在不叫的时候，它还会咕噜咕噜地给自己解闷。这可都凭它的高兴。它若是不高兴啊，无论谁说多少好话，它也一声不出，连半朵小梅花也不肯印在稿纸上！", "它什么都怕，总想藏起来。可是它又那么勇猛，不要说见着小虫和老鼠，就是遇上蛇也敢斗一斗。", "从“ 小梅花”我体会到……", "这种古怪的小动物，真让人觉得可爱。", "满月的小猫们就更好玩了，腿脚还不稳，可是已经学会淘气。妈妈的尾巴，一根鸡毛，都是它们的好玩具，耍个没完没了。一玩起来，它们不知要摔多少跟头，但是跌倒了马上起来，再跑再跌。它们的头撞在门上，桌腿上，和彼此的头上，撞疼了也不哭。它们的胆子越来越大，逐渐开辟新的游戏场所。它们到院子里来了。院中的花草可遭了殃。它们在花盆里摔跤，抱着花枝打秋千，所过之处，枝折花落。你见了，绝不会责打它们，它们是那么生气勃勃，天真可爱！", "举例说说可以从哪些地方看出作者非常喜欢猫，再把你的体会有感情地读出来。", "忧贪虑稿腔职蹭屏勃闷解盆蛇殃遭忧虑职屏蹭稿腔殃折"], "tasks": ["默读课文，说说课文围绕猫的可爱讲了哪几层意思。"], "newchars": []}, {"grade": "四年级", "term": "下册", "no": 16, "book": "四年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "海上日出", "section": "阅读", "domain": "reading", "genre": "文言文", "author": null, "dynasty": null, "page": 64, "chars": 615, "paras": ["为了看日出，我常常早起。那时天还没有大亮，周围非常清静，船上只有机器的响声。", "天空还是一片浅蓝，颜色很浅。转眼间天边出现了一道红霞，慢慢地在扩大它的范围，加强它的亮光。我知道太阳要从天边升起来了，便不转眼地望着那里。", "果然，过了一会儿，在那个地方出现了太阳的小半边脸，红是真红，却没有亮光。太阳好像负着重荷似的一步一步，慢慢地努力上升，到了最后，终于冲破了云霞，完全跳出了海面，颜色红得非常可爱。一刹那间，这个深红的圆东西，忽然发出了夺目的亮光，射得人眼睛发痛，它旁边的云片也突然有了光彩。", "有时太阳走进了云堆中，它的光线却从云里射下来，直射到水面上。这时候要分辨出哪里是水，哪里是天，倒也不容易，因为我就只看见一片灿烂的亮光。", "有时天边有黑云，而且云片很厚，太阳出来，人眼还看不见。然而太阳在黑云里放射的光芒，透过黑云的重围，替黑云镶了一道发光的金边。后来太阳才慢慢地冲出重围，出现在天空，甚至把黑云也染成了紫色或者红色。这时候发亮的不仅是太阳、云和海水，连我自己也成了光亮的了。", "这不是很伟大的奇观吗？", "读句子，注意加点的部分，"], "tasks": ["默读课文，说说海上日出的景象。"], "newchars": ["扩荷刹镶扩努范刹烂镶替仅紫"]}, {"grade": "四年级", "term": "下册", "no": 17, "book": "四年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "记金华的双龙洞", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 66, "chars": 1299, "paras": ["4月14日，我在浙江金华，游北山的双龙洞。", "出金华城大约五公里到罗店，过了罗店就渐渐入山。", "公路盘曲而上。山上开满了映山红，无论花朵还是叶子，都比盆栽的杜鹃显得有精神。油桐也正开花，这儿一丛，那儿一簇，很不少。山上沙土呈粉红色，在别处似乎没有见过。粉红色的山，各色的映山红，再加上或浓或淡的新绿，眼前一片明艳。", "一路迎着溪流。随着山势，溪流时而宽，时而窄，时而缓，时而急，溪声也时时变换调子。入山大约五公里就来到双龙洞口，那溪流就是从洞里出来的。", "在洞口抬头望，山相当高，突兀森郁，很有气势。洞口像桥洞似的，很宽。走进去，仿佛到了个大会堂，周围是石壁，头上是高高的石顶，在那里聚集一千或是八百人开个会，一定不觉得拥挤。泉水靠着洞口的右边往外流。", "这是外洞。", "在外洞找泉水的来路，原来从靠左边的石壁下方的孔隙流出。虽说是孔隙，可也容得下一只小船进出。怎样小的小船呢？两个人并排仰卧，刚合适，再没法容第三个人，是这样小的小船。船两头都系着绳子，管理处的工人先进内洞，在里边拉绳子，船就进去，在外洞的工人拉另一头的绳子，船就出来。我怀着好奇的心情独个儿仰卧在小船里，自以为从后脑到肩背，到臀部，到脚跟，没有一处不贴着船底了，才说一声“行了”，船就慢慢移动。眼前昏暗了，可是还能感觉左右和上方的山石似乎都在朝我挤压过来。我又感觉要是把头稍微抬起一点儿，准会撞破额角，擦伤鼻子。大约行了两三丈的水程吧，就登陆了。这就到了内洞。", "内洞一团漆黑，什么都看不见。工人提着汽油灯，也只能照见小小的一块地方，余外全是昏暗，不知道有多么宽广。工人高高举起汽油灯，逐一指点洞内的景物。先看（摄影）洪兵到的是蜿蜒在洞顶的双龙，一条黄龙，一条青龙。我顺着他的指点看，有点儿像。其他那些石钟乳和石笋，这是什么，那是什么，大都依据形状想象成神仙、动物以及宫室、器用，名目有四十多。这些石钟乳和石笋，形状变化多端，再加上颜色各异，即使不比作什么，也很值得观赏。", "在洞里走了一转，觉得内洞比外洞大得多，大概有十来进房子那么大。泉水靠着右边缓缓地流，声音轻轻的。", "上源在深黑的石洞里。", "我排队等候，又仰卧在小船里，出了洞。", "浙杜罗肩臀鹃郁窄移陆额源乳端笋"], "tasks": [], "newchars": ["浙簇臀漆蜿蜒"]}, {"grade": "四年级", "term": "下册", "no": 38, "book": "四年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "颐和园", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 70, "chars": 767, "paras": ["颐和园北京的颐和园是个美丽的大公园。", "进了颐和园的大门，绕过大殿，就来到有名的长廊。绿漆的柱子，红漆的栏杆，一眼望不到头。这条长廊有七百多米长，分成二百七十三间。", "每一间的横槛上都有五彩的画，画着人物、花草、风景，几千幅画没有哪两幅是相同的。长廊两旁栽满了花木，这一种花还没谢，那一种花又开了。", "微风从左边的昆明湖上吹来，使人神清气爽。", "走完长廊，就来到了万寿山脚下。抬头一看，一座八角宝塔形的三层建筑耸立在半山腰上，黄色的琉璃瓦闪闪发光。那就是佛香阁。下面的一排排金碧辉煌的宫殿，就是排云殿。", "登上万寿山，站在佛香阁的前面向下望，颐和园的景色大半收在眼底。葱郁的树丛，掩映着“来到有名的长廊”，交代了游览的地点。", "“ 走完长廊，就来到了万寿山脚下”，过渡很自然。", "“ 抬头一看”“向下望”，观察不同位置的景物时，视角也有变化。", "湖面静得像一面镜子，游船在湖面慢慢滑过，多美的画面！", "黄的绿的琉璃瓦屋顶和朱红的宫墙。正前面，昆明湖静得像一面镜子，绿得像一块碧玉。游船、画舫在湖面慢慢地滑过，几乎不留一点儿痕迹。", "向东远眺，隐隐约约可以望见几座古老的城楼和城里的白塔。", "从万寿山下来，就是昆明湖。昆明湖围着长长的堤岸，堤上有好几座式样不同的石桥，两岸栽着数不清的倒垂的杨柳。湖中心有个小岛，远远望去，岛上一片葱绿，树丛中露出宫殿的一角。", "游人走过长长的石桥，就可以去小岛上玩。这座石桥有十七个桥洞，叫十七孔桥。桥栏杆上有上百根石柱，柱子上都雕刻着小狮子。这么多的狮子，姿态不一，没有哪两只是相同的。", "颐和园到处有美丽的景色，说也说不尽，希望你有机会去细细游赏。", "长廊（          ）（          ）（          ）"], "tasks": ["默读课文，画出起过渡作用的句子，体会作者是怎样把游览的顺序写清楚的，再把下面的路线图补充完整。"], "newchars": []}, {"grade": "四年级", "term": "下册", "no": 39, "book": "四年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "七月的天山", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 72, "chars": 667, "paras": ["从高耸的雪峰，到峭壁断崖上飞泻下来的雪水，再到山脚下的溪流，写得很有条理。", "七月的新疆，最理想的是骑马上天山。", "进入天山，戈壁滩上的炎暑被远远地抛在后边，迎面送来的雪山寒气，会使你感到像秋天似的凉爽。蓝天衬着高耸的巨大的雪峰，太阳下，雪峰间的云影就像白缎上绣了几朵银灰色的花。", "融化的雪水，从峭壁断崖上飞泻下来，像千百条闪耀的银链，在山脚下汇成冲激的溪流，浪花往上抛，形成千万朵盛开的白莲。每到水势缓慢的洄水涡，都有鱼儿在欢快地跳跃。这个时候，饮马溪边，你骑在马上，可以俯视阳光透射到的清澈的水底。在五彩斑斓的溪水和石子之间，鱼群闪闪的鳞光映着雪水清流，给寂静的天山增添了无限生机。", "再往里走，天山显得越来越美。白皑皑群峰的雪线以下，是蜿蜒无尽的翠绿的原始森林，密密的塔松像撑开的巨伞，重重叠叠的枝丫，漏下斑斑点点细碎的日影。骑马穿行林中，只听见马野花像锦缎，像霞光，像彩虹，真美啊！", "蹄溅起漫流在岩石上的水的声音，使密林显得更加幽静。", "走进天山深处，山色逐渐变得柔嫩，山形也逐渐变得柔美。这里溪流缓慢，萦绕着每一个山脚。在轻轻荡漾着的溪流的两岸，满是高过马头的野花，五彩缤纷，像织不完的锦缎那么绵延不断，像天边的霞光那么灿烂耀眼，像高空的彩虹那么绚丽夺目。马走在花海中，显得格外矫健；人浮在花海上，显得格外精神。在马上你用不着离鞍，只要稍一伸手就可以捧到满怀心爱的鲜花。", "虽然天山这时并不是春天，但是有哪一个春天的花园能比得过这时天山的无边繁花呢？"], "tasks": ["默读课文，说说作者是按怎样的顺序写天山的，你是从哪些语句看出来的。"], "newchars": []}, {"grade": "四年级", "term": "下册", "no": 41, "book": "四年级下册", "unit_no": 5, "unit_name": "第五单元", "title": ".", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 74, "chars": 312, "paras": ["游你游览过哪些地方？哪个地方给你留下的印象最深？", "在横线上填写这个地方的名称，把题目补充完整。按照游览的顺序写写这个地方，把游览的过程写清楚。"], "tasks": [], "newchars": ["第六单元"]}, {"grade": "四年级", "term": "下册", "no": 18, "book": "四年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "文言文二则", "section": "阅读", "domain": "reading", "genre": "文言文", "author": null, "dynasty": null, "page": 76, "chars": 261, "paras": ["铁杵，用来舂米或捣衣的铁棒。", "磨针溪，在象耳山下。世传李太白读书山中，未成，弃去。过是②溪，逢老媪方③磨铁杵。问之，曰：“欲作针。”太白感其意④，还卒业⑤。", "铁杵成针胤恭勤②不倦，博学多通③。家贫不常得油，夏月则练囊④盛数十萤火以照书，以夜继日焉。", "囊萤夜读③ 〔通〕通晓，明白。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "下册", "no": 19, "book": "四年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "小英雄雨来（节选）", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 78, "chars": 3497, "paras": ["一晋察冀边区的北部有一条还乡河，河里长着很多芦苇。", "河边有个小村庄。芦花开的时候，远远望去，黄绿的芦苇上好像盖了一层厚厚的白雪。风一吹，鹅毛般的苇絮就飘飘悠悠地飞起来，把这几十家小房屋都罩在柔软的芦花里。", "因此，这村就叫芦花村。十二岁的雨来就是这村的。", "雨来最喜欢这条紧靠着村边的还乡河。每到夏天，雨来和铁头、三钻儿，还有很多小朋友，好像一群鱼，在河里钻上钻下，藏猫猫，狗刨，立浮，仰浮。雨来仰浮的本领最高，能够脸朝天在水里躺着，不但不沉底，还要把小肚皮露在水面上。", "妈妈不让雨来耍水，怕出危险。有一天，妈妈见雨来从外面进来，光着身子，浑身被太阳晒得黝黑发亮。妈妈知道他又去耍水了，把脸一沉，叫他过来，扭身就到炕上抓笤帚。雨来一看要挨打了，撒腿就往外跑。", "妈妈紧跟着追出来。雨来一边跑一边回头看。糟了！", "眼看要追上了，往哪儿跑呢？铁头正赶着牛从河沿回来，本文选自 《小英雄雨来》，作者管桦，选作课文时有改动。", "远远地向雨来喊：“往河沿跑！往河沿跑！”雨来听出了话里的意思，转身就朝河沿跑。妈妈还是死命追着不放，到底追上了，可是雨来浑身光溜溜的像条小泥鳅，怎么也抓不住。只听见扑通一声，雨来扎进河里不见了。妈妈立在河沿上，望着渐渐扩大的水圈直发愣。", "忽然，远远的水面上露出个小脑袋来。雨来像小鸭子一样抖着头上的水，用手抹一下眼睛和鼻子，嘴里吹着气，望着妈妈笑。", "二秋天。", "爸爸从集上卖苇席回来，同妈妈商量：“看见了区上的工作同志，说是孩子们不上学念书不行，起码要上夜校。", "读完这部分后，我要停下来想一想，这部分主要讲的是什么。", "叫雨来上夜校吧。要不，将来闹个睁眼瞎。”", "夜校就在三钻儿家的豆腐房里，房子很破。教夜课的是东庄学堂里的女老师，穿着青布裤褂，胖胖的，剪着短发。女老师走到黑板前面，屋里嗡嗡嗡嗡说话的声音立刻停止了，只听见哗啦哗啦翻课本的声音。雨来从口袋里掏出课本，这是用土纸油印的，软鼓囊囊的。雨来怕揉坏了，向妈妈要了一块红布，包了个书皮，上面用铅笔歪歪斜斜地写了“雨来”两个字。雨来把书放在腿上，翻开书。", "女老师斜着身子，用手指点着黑板上的字，念着：“我们是中国人，我们爱自己的祖国。”", "大家就随着女老师的手指，齐声轻轻地念起来：“我们——是——中国人，我们——爱——自己的——祖国。”", "三有一天，雨来从夜校回到家，躺在炕上，背诵当天晚上学会的课文。可是背了不到一半，他就睡着了。", "不知什么时候，门吱扭响了一声。雨来睁开眼，看见闪进一个黑影。妈妈划了根火柴，点着灯，一看，原来是爸爸出外卖席子回来了。他肩上披着子弹袋，腰里插着手榴弹，背上还背着一杆长长的步枪。爸爸怎么忽然这样打扮起来了呢？", "爸爸对妈妈说：“鬼子又‘扫荡’了，民兵都到区上集合，要一两个月才能回来。”雨来问爸爸：“爸爸，远不远？”爸爸把手伸进被里，摸着雨来光溜溜的脊背，说：“这哪有准儿呢？说远就远，说近就近。”爸爸又转过脸对妈妈说：“明天你到东庄他姥姥家去一趟，告诉他舅舅，就说区上说的，叫他赶快把村里的民兵带到区上去集合。”妈妈问：“区上在哪儿？”爸爸装了一袋烟，吧嗒吧嗒抽着，说：“叫他们在河北一带村里打听。”", "雨来还想说什么，可是门哐啷响了一下，就听见爸爸走出去的脚步声。不大一会儿，什么也听不见了，只从街上传来一两声狗叫。", "第二天，吃过早饭，妈妈就到东庄去，临走说晚上才能回来。过了晌午，雨来吃了点儿剩饭，因为看家，不能到外面去，就趴在炕上念他那红布包着的识字课本。", "忽然听见街上咕咚咕咚有人跑，把屋子震得好像摇晃起来，窗户纸哗啦哗啦响。", "雨来一骨碌下了炕，把书塞在怀里就往外跑，刚要迈门槛，进来一个人，雨来正撞在这个人的怀里。他抬头一看，是李大叔。李大叔是区上的交通员，常在雨来家落脚。", "随后听见日本鬼子呜哩哇啦地叫。李大叔忙把墙角那盛着一半糠皮的缸搬开。雨来愣住了：“咦！这是什么时候挖的洞呢？”李大叔跳进洞里，说：“把缸搬回原地方，你就快到别的院里去，对谁也不许说。”", "十二岁的雨来使尽气力，才把缸挪回到原地。", "雨来刚到堂屋，见十几把雪亮的刺刀从前门进来，他撒腿就往后院跑。背后咔啦一声枪栓响，有人大声叫道：“站住！”雨来没理他，脚下像踩着风，一直朝后院跑去。只听见子弹向他头上嗖嗖地飞来。可是后院没有门，把雨来急出一身冷汗。靠墙有一棵桃树，雨来抱着树就往上爬。", "鬼子已经追到树底下，伸手抓住雨来的脚，往下一拉，雨来就摔在地上。鬼子把他两只胳膊向背后一拧，捆绑起来，推推搡搡回到屋里。", "四鬼子把前后院都翻遍了。", "屋子里遭了劫难，连枕头都给刺刀挑破了。炕沿上坐着个鬼子军官，两眼红红的，用中国话对雨来说：“小孩，问你话，不许撒谎！”他突然望着雨来的胸脯，张着嘴，眼睛睁得圆圆的。", "雨来低头一看，原来刚才一阵子挣扎，识字课本从怀里露出来了。鬼子一把抓在手里，翻着看了看，问他：“谁给你的？”雨来说：“捡来的！”", "鬼子露出满口金牙，做了个鬼脸，温和地对雨来说：“不要害怕！小孩，皇军是爱护的！”说着，就叫人给他松绑。", "雨来把手放下来，觉得胳膊发麻发痛。扁鼻子军官用手摸着雨来的脑袋，说：“这本书谁给你的，没有关系，我不问了。别的话要统统告诉我！刚才有个人跑进来，看见没有？”雨来用手背抹了一下鼻子，嘟嘟囔囔地说：“我在屋里，什么也没看见。”", "扁鼻子军官把书扔在地上，伸手往皮包里掏。雨来心里想：“掏什么呢？找刀子？鬼子生了气要挖小孩眼睛的！”", "只见他掏出来的却是一把雪白的糖块。", "扁鼻子军官把糖往雨来手里一塞，说：“吃！你吃！你得说出来他在什么地方！”他又伸出那个戴金戒指的手指，说：“这个，金的，也给你！”", "雨来没有接他的糖，也没有回答他。", "旁边一个鬼子嗖地抽出刀来，瞪着眼睛要向雨来头上劈。扁鼻子军官摇摇头。两个人叽叽咕咕说了一阵。那鬼子向雨来横着脖子翻白眼，使劲把刀放回鞘里。", "扁鼻子军官压住肚子里的火气，用手轻轻地拍着雨来的肩膀，说：“我最喜欢小孩。那个人，你看见没有？说啊！”", "雨来摇摇头，说：“我在屋里，什么也没看见。”", "扁鼻子军官的目光立刻变得凶恶可怕，他向前弓着身子，伸出两只大手。啊！那双手就像鹰的爪子，扭着雨来的两只耳朵，向两边拉。雨来疼得直咧嘴。鬼子又抽出一只手来，在雨来的脸上打了两巴掌，又把他脸上的肉揪起一块，咬着牙拧。雨来的脸立刻变成白一块，青一块，紫一块。鬼子又向他胸脯上打了一拳。雨来打个趔趄，后退几步，后脑勺正碰在柜板上，但立刻又被抓过来，肚子撞在炕沿上。", "雨来半天才喘过气来，脑袋里像有一窝蜂，嗡嗡地叫。", "他两眼直冒金星，鼻子流着血。一滴一滴的血滴下来，溅在课本那几行字上：“我们是中国人，我们爱自己的祖国。”", "鬼子打得累了，雨来还是咬着牙，说：“没看见！”", "扁鼻子军官气得暴跳起来，嗷嗷地叫：“枪毙，枪毙！", "拉出去，拉出去！”", "五太阳已经落下去。蓝蓝的天上飘着的浮云像一块一块红绸子，映在还乡河上，像开了一大朵一大朵鸡冠花。苇塘的芦花被风吹起来，在上面飘飘悠悠地飞着。", "芦花村里的人听到河沿上响了几枪。老人们含着泪，说：“雨来是个好孩子！死得可惜！”", "“有志不在年高。”", "芦花村的孩子们，雨来的好朋友铁头和三钻儿几个人，听到枪声都呜呜地哭了。", "六李大叔在地洞里等了好久，不见雨来来搬缸，就往另一个出口走。他试探着推开洞口的石板，扒开苇叶。院子里空空的，一个人影也没有，四处也不见动静。忽然听见街上有人吆喝：“豆腐啦！卖豆腐啦！”", "这是芦花村的暗号，李大叔知道敌人已经走远了。", "可是怎么不见雨来呢？他跑到街上，看见许多人往河沿跑，一打听，才知道雨来被鬼子打死在河里了！", "李大叔脑袋轰的一声，眼泪就流下来了。他一股劲地跟着人们向河沿跑。", "到了河沿，别说尸首，连一滴血也没看见。", "大家呆呆地在河沿上立着。还乡河静静的，河水打着漩涡哗哗地向下流去。虫子在草窝里叫着。不知谁说：“也许鬼子把雨来扔在河里，冲走了！”", "大家就顺着河岸向下找。突然铁头叫起来：“啊！雨来！雨来！”", "在芦苇丛里，水面上露出个小脑袋来。雨来还是像小鸭子一样抖着头上的水，用手抹一下眼睛和鼻子，扒着芦苇，向岸上的人问道：“鬼子走了？”", "李大叔是谁？前面好像提到过，我再看看前面的内容。", "“啊！”大家都高兴得叫起来，“雨来没有死！雨来没有死！”", "原来枪响以前，雨来就趁鬼子不防备，一头扎到河里去了。鬼子慌忙向水里打枪，可是我们的小英雄雨来已经从水底游到远处去了。", "晋炕扭哩胳铅晃兵膊绸劫慌扒尸敌晋絮扭姥吧塞呜哇糠栓捆绑劫毙扒尸为什么说雨来是小英雄？带着这个问题，尝试用较快的速度"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "下册", "no": 20, "book": "四年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "我们家的男子汉", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 87, "chars": 1686, "paras": ["我们家里有一个男子汉，那是姐姐的孩子。姐姐生下他后，就和姐夫到安徽去了，把他留在家中由我们来照看。", "他对食物的兴趣“他吃饭很爽气。”带他的保姆这么说他。确实，他吃饭吃得很好，量很多，范围很广——什么都要吃，而且吃得极有滋味，叫人看了不由得也会嘴馋起来。当然，和所有的孩子一样，他不爱吃青菜。可是我对他说：“不吃青菜会死的。”他便吃了，吃得很多。他不愿死，似乎是深感活着的乐趣的。他对所有的滋味都有兴趣，为了吃一客小笼包子，他可以耐心地等上三刻钟；他会为他喜欢吃的东西编儿歌一样的谜语。当实在不能再吃了的时候，他便吃自己的大拇指，吃得十分专心，以至前边的嘴唇都有些翘了起来。当《少林寺》风靡全国时，他也学会了一套足以乱。", "尝试用较快的速度"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "下册", "no": 21, "book": "四年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "芦花鞋", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 91, "chars": 2201, "paras": ["这里出产一种冬天穿的芦花鞋。", "那鞋的制作工序是：先将上等的芦花采回来，然后将它们均匀地搓进草绳里，再编织成鞋。那鞋很厚实，像暖和和的鸟窝。", "收罢秋庄稼，青铜家就已决定：今年冬闲时，全家人一起动手，编织一百双芦花鞋，然后让青铜背着，到油麻地镇上去卖。", "这是家里的一笔收入，一笔很重要的收入。想到这笔收入，全家人都很兴奋，觉得心里亮堂堂的，未来的日子亮堂堂的。", "青铜拿着一只大布口袋，钻进芦苇荡的深处，挑那些毛茸茸的、蓬松松的、闪着银光的芦花，将它们从穗上捋下来。头年的不要，只采当年的。那芦花很像鸭绒，看着，心里就觉得暖和。妹妹葵花跟着青铜，一起走进芦苇荡。", "本文选自 《青铜葵花》，作者曹文轩，选作课文时有改动。", "*"], "tasks": [], "newchars": ["搓葵祈遗憾污屑"]}, {"grade": "四年级", "term": "下册", "no": 43, "book": "四年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "囊萤夜读", "section": "阅读", "domain": "reading", "genre": "文言文", "author": null, "dynasty": null, "page": 76, "chars": 262, "paras": ["铁杵，用来舂米或捣衣的铁棒。", "磨针溪，在象耳山下。世传李太白读书山中，未成，弃去。过是②溪，逢老媪方③磨铁杵。问之，曰：“欲作针。”太白感其意④，还卒业⑤。", "铁杵成针胤恭勤②不倦，博学多通③。家贫不常得油，夏月则练囊④盛数十萤火以照书，以夜继日焉。", "文言文二则③ 〔通〕通晓，明白。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "下册", "no": 44, "book": "四年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "铁杵成针", "section": "阅读", "domain": "reading", "genre": "文言文", "author": null, "dynasty": null, "page": 76, "chars": 410, "paras": ["铁杵，用来舂米或捣衣的铁棒。", "磨针溪，在象耳山下。世传李太白读书山中，未成，弃去。过是②溪，逢老媪方③磨铁杵。问之，曰：“欲作针。”太白感其意④，还卒业⑤。", "铁杵成针胤恭勤②不倦，博学多通③。家贫不常得油，夏月则练囊④盛数十萤火以照书，以夜继日焉。", "囊萤夜读文言文二则③ 〔通〕通晓，明白。", "囊恭萤勤博逢贫正确、流利地"], "tasks": [], "newchars": ["恭勤焉卒"]}, {"grade": "四年级", "term": "下册", "no": 49, "book": "四年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "朋友相处的秘诀", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 97, "chars": 340, "paras": ["√  1.帮父母分担一些家务事。（小光）√  2.父母生病了，给他们递上一杯热水。（小光）√  3.父母过生日时送上我们的礼物。（小文）（小丽）√  4.提醒父母增减衣服。（小杰）5.给父母准备一件生日礼物。（小丽）和朋友相处，最重要的是什么？有人认为，是彼此信任；有人认为，是愿意分享，不自私……你的看法是什么呢？", "分小组讨论，至少提出三条大家认为最重要的意见。", "怎样才能更好地汇总小组意见呢？下面是某小组在讨论“怎样表达对父母的爱”时作的记录，供参考。", "先记录每个同学的想法，再把相近的整合在一起，然后标记出大多数同学认同的想法。", "◎ 根据讨论的目的，记录重要信息。", "◎ 分类整理小组意见，有条理地汇报。", "将小组意见汇总后，派代表在全班汇报。其他组员可以作补充，尽可能全面地反映小组意见。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "下册", "no": 51, "book": "四年级下册", "unit_no": 6, "unit_name": "第六单元", "title": ".", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 98, "chars": 179, "paras": ["我学会了我们正慢慢长大，学会了做很多事情。你学会的哪件事情让你最有成就感？把它填在横线上，再把学做这件事的经历、体会和同学分享。写之前想一想：◇  你是怎样一步步学会做这件事的？"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "下册", "no": 22, "book": "四年级下册", "unit_no": 7, "unit_name": "第七单元", "title": "古诗三首", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "王昌龄寒", "dynasty": "唐", "page": 102, "chars": 222, "paras": ["芙蓉楼  送辛渐[唐] 王昌龄寒雨连江夜入吴，平明送客楚山孤。", "洛阳亲友如相问，一片冰心在玉壶。", "塞下曲[唐] 卢纶月黑雁飞高，单于夜遁逃。", "欲将轻骑逐，大雪满弓刀。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "下册", "no": 23, "book": "四年级下册", "unit_no": 7, "unit_name": "第七单元", "title": "黄继光", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 104, "chars": 1712, "paras": ["1952年10月，上甘岭战役打响了。这是朝鲜战场上最激烈的一次阵地战。", "黄继光所在的营已经持续战斗了四天四夜，第五天夜晚接到上级的命令，要在黎明之前夺下被敌人占领的597.9高地。", "进攻开始了，大炮在轰鸣。战士们占领了一个又一个山头，就要到达597.9高地的主峰了。突然，敌人一个火力点凶猛地射击起来。战士们屡次突击，都被比雨点还密的枪弹压了回来。", "东方升起了启明星，营参谋长看看表，已经四点多了。如果不很快摧毁这个火力点，在黎明前就攻不下597.9高地的主峰，已经夺得的那些山头就会全部丢失。", "黄继光愤怒地注视着敌人的火力点，他转过身来坚定地对营参谋长说：“参谋长，请把这个任务交给我吧！”营参谋长紧握着黄继光的手，说：“好，我相信你一定能完成这个光荣而艰巨的任务。”", "本文根据石峰、王玉章的 《马特洛索夫式的英雄黄继光》改写，原文刊载于1952年12月21日 《人民日报》。", "黄继光带上两个战士，拿了手雷，喊了一声：“让祖国人民听我们胜利的消息吧！”便向敌人的火力点爬去。", "敌人发现他们了。几发照明弹升上天空，黑夜变成了白天。炮弹在他们周围爆炸。他们冒着浓烟，冒着烈火，匍匐前进。一个战士牺牲了，另一个战士也负伤了。摧毁火力点的重任落在了黄继光一个人的肩上。", "火力点里的敌人把机枪对准黄继光，子弹像冰雹一样射过来。黄继光肩上腿上都负了伤。他用尽全身的力气，更加顽强地向前爬，还有二十米，十米……近了，更近了。", "啊！黄继光突然站起来了！在暴风雨一样的子弹中站起来了！他举起右臂，手雷在探照灯的光亮中闪闪发光。", "轰！敌人的火力点塌了半边，黄继光晕倒了。战士们赶紧冲上去，不料才冲到半路，敌人的机枪又叫起来，战士们被压在山坡上。", "天快亮了，规定的时间马上到了。营参谋长正在着急，只见黄继光又站起来了！他张开双臂，向喷射着火舌的火力点猛扑上去，用自己的胸膛堵住了敌人的枪口。", "“冲啊，为黄继光报仇！”喊声惊天动地。战士们像海涛一样向上冲，占领了597.9 高地，消灭了阵地上的全部敌人。"], "tasks": [], "newchars": ["营弹射荣炸爆"]}, {"grade": "四年级", "term": "下册", "no": 24, "book": "四年级下册", "unit_no": 7, "unit_name": "第七单元", "title": "“诺曼底号”遇难记", "section": "阅读", "domain": "reading", "genre": "课文", "author": "是法国的维克多·", "dynasty": null, "page": 109, "chars": 1515, "paras": ["本文作者是法国的维克多·雨果，译者张汉钧，选作课文时有改动。", "1870年3月17日夜晚，哈尔威船长照例走着从南安普敦到根西岛这条航线。大海上夜色正浓，烟雾弥漫。船长站在驾驶室里，小心翼翼地驾驶着他的“诺曼底号”。乘客们都进入了梦乡。", "“诺曼底号”是一艘大轮船，在英伦海峡也许可以算得上是最漂亮的邮船之一。它装货容量六百吨，船体长二百二十英尺①，宽二十五英尺。海员们都说它很“年轻”，因为它才七岁，是1863年造的。", "雾越来越浓了，轮船驶出南安普敦河后，来到茫茫大海上，距离埃居伊山脉估计有十五海里。轮船缓缓行驶着。", "这时大约凌晨四点钟。", "周围一片漆黑，船桅的梢尖隐约可辨。", "像这类英国船，晚上出航是没有什么可怕的。", "突然，沉沉夜雾中冒出一枚黑点，它好似一个幽灵，又仿佛一座山峰。只见一个阴森森的往前翘起的船头，突破黑暗，在一片浪花中飞驶过来。那是“玛丽号”，一艘“诺曼底号”遇难记装有螺旋推进器的大轮船，它从敖德萨起航，船上载着五百吨小麦，行驶速度非常快，负载又特别大。它笔直地朝着“诺曼底号”逼了过来。", "眼看就要撞船，已经没有任何办法避开它了。一瞬间，大雾中似乎耸起许许多多船只的幻影，人们还没来得及一一看清，就要死到临头，葬身鱼腹了。", "全速前进的“玛丽号”向“诺曼底号”的侧舷撞过去，在它的船身上剖开一个大窟窿。", "由于这一猛撞，“玛丽号”自己也受了伤，终于停了下来。", "“诺曼底号”上有二十八名船员和一名女服务员，还有三十一名乘客，其中十二名是妇女。", "震荡可怕极了。一刹那间，男人、女人、小孩，所有的人都奔到甲板上，人们半裸着身子，奔跑着，尖叫着，哭泣着，惊恐万状，一片混乱。海水哗哗往里灌，汹涌湍急，势不可当。轮机火炉被海浪呛得嘶嘶地直喘粗气。", "船上没有封舱用的防漏隔墙。哈尔威船长站在指挥台上，大声吼喝：“全体安静，注意听命令！把救生艇放下去。妇女先走，其他乘客跟上，船员断后。必须把六十人救出去！”", "实际上一共有六十一人，但是他把自己给忘了。", "船员赶紧解开救生艇的绳索。大家一窝蜂拥了上去，“够了，”船长说，“让每个人都下到小艇上去。奥克勒福大副，你的手枪在吗？”", "“在，船长。”", "“哪个男人胆敢抢在女人前面，你就开枪打死他。”", "大家立时不出声了。没有一个人违抗他的意志，人们感到有一个伟大的灵魂出现在他们的上空。", "“玛丽号”也放下救生艇，赶来搭救由于它肇祸而遇难的人员。", "救援工作进行得井然有序，几乎没有发生什么争执或殴斗。事情总是这样，哪里有可鄙的利己主义，哪里也会有悲壮的舍己救人。", "哈尔威巍然屹立在他的船长岗位上，指挥着，主宰着，领导着大家。他把每件事和每个人都考虑到了，面对惊慌失措的众人，他镇定自若，仿佛他不是给人而是给灾难下达命令，就连失事的船舶似乎也听从他的调遣。", "过了一会儿，他喊道：“把克莱芒救出去！”", "克莱芒是见习水手，还不过是个孩子。", "轮船在深深的海水中慢慢下沉。", "人们尽力加快速度划着小艇，在“诺曼底号”和“玛丽号”之间来回穿梭。", "“快干！”船长又叫道。", "伦剖腹嘶践窟混窿维岗秩宰遣措"], "tasks": [], "newchars": ["弥脉葬剖裸泣汹维秩酣械岗宰遣"]}, {"grade": "四年级", "term": "下册", "no": 25, "book": "四年级下册", "unit_no": 7, "unit_name": "第七单元", "title": "挑山工", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 114, "chars": 1202, "paras": ["在泰山上，随处都可以碰到挑山工。他们肩上搭一根光溜溜的扁担，扁担两头的绳子挂着沉甸甸的货物。登山的时候，他们一条胳膊搭在扁担上，另一条胳膊随着步子有节奏地一甩一甩，使身体保持平衡。他们走的路线是折尺形的，从台阶左侧起步，斜行向上，登上七八级，到了台阶右侧，就转过身子，反方向斜行，到了左侧再转回来。", "每转一次身，扁担换一次肩。这样曲折向上登，才能使挂在扁担前头的东西不碰到台阶，还可以省些力气。担了重物，如果照一般登山的人那样直往上走，膝盖会受不住的。", "但是路线曲折，就会使路程加长。挑山工登山走的路程大约比游人多一倍！", "奇怪的是挑山工花的时间并不比游人多。你轻快地从他们身边走过，以为把他们远远地甩在后边了。你在"], "tasks": [], "newchars": ["泰杖敞拘蕴"]}, {"grade": "四年级", "term": "下册", "no": 54, "book": "四年级下册", "unit_no": 7, "unit_name": "第七单元", "title": "芙蓉楼送辛渐", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "王昌龄寒", "dynasty": "唐", "page": 102, "chars": 226, "paras": ["芙蓉楼  送辛渐[唐] 王昌龄寒雨连江夜入吴，平明送客楚山孤。", "洛阳亲友如相问，一片冰心在玉壶。", "塞下曲[唐] 卢纶月黑雁飞高，单于夜遁逃。", "欲将轻骑逐，大雪满弓刀。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "下册", "no": 55, "book": "四年级下册", "unit_no": 7, "unit_name": "第七单元", "title": "塞下曲", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "王昌龄寒", "dynasty": "唐", "page": 102, "chars": 223, "paras": ["芙蓉楼  送辛渐[唐] 王昌龄寒雨连江夜入吴，平明送客楚山孤。", "洛阳亲友如相问，一片冰心在玉壶。", "[唐] 卢纶月黑雁飞高，单于夜遁逃。", "欲将轻骑逐，大雪满弓刀。"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "下册", "no": 56, "book": "四年级下册", "unit_no": 7, "unit_name": "第七单元", "title": "墨梅", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "王冕我家", "dynasty": "元", "page": 103, "chars": 226, "paras": ["墨  梅[元] 王冕我家洗砚池头树，朵朵花开淡墨痕。", "不要人夸好颜色，只留清气满乾坤。", "芙蓉洛壶雁有感情地"], "tasks": [], "newchars": []}, {"grade": "四年级", "term": "下册", "no": 26, "book": "四年级下册", "unit_no": 8, "unit_name": "第八单元", "title": "宝葫芦的秘密（节选）", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 122, "chars": 1221, "paras": ["我来给你们讲个故事。可是我先得介绍介绍我自己：我姓王，叫王葆。我要讲的，正是我自己的一件事情，是我和宝葫芦的故事。", "你们也许要问：“什么？宝葫芦？就是传说故事里的那种宝葫芦吗？”", "不错，正是那种宝葫芦。", "可是我要声明，我并不是什么神仙，也不是什么妖怪。", "我和你们一样， 是一个平平常常的普通人。你们瞧，我是一个少先队员，我也和你们一样，很爱听故事。", "至于宝葫芦的故事，那我从小就知道了。那是我奶奶讲给我听的。奶奶每逢要求我干什么，就得给我讲个故事。这是我们的规矩。", "“乖小葆，来，奶奶给你洗个脚。”奶奶总是一面撵我，一面招手。", "“我不干，我怕烫。”我总是一面溜开，一面摆手。", "“不烫啊。冷了好一会儿了。”", "“那，我怕冷。”", "奶奶撵上了我，说洗脚水刚好不烫也不冷，非洗不可。", "本文选自 《宝葫芦的秘密》，作者张天翼，选作课文时有改动。", "我只好让步。不过我有一个条件：“你爱洗就让你洗。", "你可得讲个故事。”就这么着，奶奶讲了个宝葫芦的故事。", "“好小葆，别动！”奶奶刚给我洗了脚，忽然又提出一个新的要求来，“让我给你剪一剪……”", "什么！剪脚指甲啊？那不行！我光着脚丫，一下地就跑。可是胳膊给奶奶拽住了。没有办法。", "不过我得提出我的条件：“那，非得讲故事。”于是奶奶又讲了一个——又是宝葫芦的故事。", "我就这么着，从很小的时候起，听奶奶讲故事，一直听到我十来岁。奶奶每次讲的都不一样。上次讲的是张三劈面撞见了一位神仙，得了一个宝葫芦。下次讲的是李四出去远足旅行，一游游到了龙宫，得到了一个宝葫芦。王五呢，他因为是一个好孩子，肯让奶奶给他换衣服，所以得到了一个宝葫芦。至于赵六得的一个宝葫芦——那是掘地掘出来的。", "不管张三也好，李四也好，一得到了这个宝葫芦，可就幸福极了，要什么有什么。张三想：“我要吃水蜜桃。”立刻就有一盘水蜜桃。李四希望有一条大花狗，马上就冒出了那么一条——冲着他摇尾巴，舔他的手。", "后来呢？后来不用说，他们全都过上了好日子。", "我听了这些故事，常常就联系到自己：“我要是有了一个宝葫芦，我该怎么办？我该要些什么？”", "一直到我长大了，有时候还想起它来。我有几次对着一道算术题发愣，不知道要怎么列式子，就由“8”字想到了宝葫芦——假如我有这么一个，那可就省心了。", "我和同学们比赛种向日葵，我家里的那几棵长得又瘦又长，上面顶着一个小脑袋，可怜巴巴的样儿，比谁的也比不上。我就又想到了那个宝贝：“那，我得要一棵最好最好的向日葵，长得不能再棒的向日葵。”可那只不过是幻想罢了。", "可我总还是要想到它。那一天我和科学小组的同学闹翻了，我又想到了它。“要是我有那么一个葫芦，那……”", "妖矩乖撵丫拽冲瘦"], "tasks": [], "newchars": ["介妖绍矩乖撵烫丫福拽舔瘦棒罢葵"]}, {"grade": "四年级", "term": "下册", "no": 27, "book": "四年级下册", "unit_no": 8, "unit_name": "第八单元", "title": "巨人的花园", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 125, "chars": 1655, "paras": ["每天下午，孩子们放学后，总喜欢到巨人的花园里去玩。", "这是一个很可爱的大花园。园里长满了柔嫩的青草，草丛中到处露出星星似的美丽花朵。还有十二棵桃树，春天开出淡红色和珍珠色的鲜花，秋天结出丰硕的果子。小鸟们在树上唱着悦耳的歌，歌声是那么动听，孩子们都停止了游戏来听他们唱歌。“我们在这儿多么快乐！”孩子们欢叫着。", "有一天，巨人回来了。之前，他离家去看朋友，在那里一住就是七年。现在他回到家，看见孩子们正在花园里玩。", "“你们在这儿做什么？”他叱责道。孩子们吓得跑开了。", "“我自己的花园就是我自己的花园，”巨人自言自语道，“这是随便什么人都懂得的。除了我自己以外，我不允许任何人在里面玩。”于是他在花园的四周砌了一道高墙，挂出一块布告牌：禁止入内违者重惩，选作课文时有改动。", "那些可怜的孩子们现在没有地方玩了，只能在高墙外面转来转去，谈论着墙内美丽的花园。“我们从前在那儿是多么快乐啊！”他们都这样说。", "春天来了，乡下到处开着小花，到处有小鸟歌唱。单单在巨人的花园里，仍旧是冬天的景象。小鸟不肯在他的花园里唱歌，因为那里没有孩子们的踪迹；桃树也忘了开花；偶尔有一朵美丽的花从草丛中伸出头来，可是一看见那块布告牌，就马上缩回到地里睡觉去了。高兴的只有雪和霜两位。", "他们嚷道：“春天把这个花园忘记了，我们一年到头都可以住在这儿啦！”雪用他的白色大衣覆盖着青草，霜把所有的树枝涂成了银色。他们还请来北风同住。北风身上裹着皮衣，整天在花园里呼啸着。他说：“这是个好地方，我们一定要请雹来玩一玩。”于是雹也来了。他每天总要在屋顶上闹三个钟头，然后又在花园里绕着圈子用力跑。", "“我不懂为什么春天来得这样迟，”巨人坐在窗前，望着窗外那凄凉的花园，“我盼望天气快点儿变好。”", "可是春天始终没有来，夏天也没有来。秋天给每个花园带来了金色果实，但巨人的花园却什么也没有。", "一天早晨，巨人还在睡觉，忽然听见了动人的音乐。他以为是国王的乐队从门外走过，其实是一只小小的梅花雀在窗外唱歌。他很久没有听见小鸟在花园里唱歌了，觉得这是全世界最动听的音乐。这时，雹停止了疯闹，北风也不再吼叫，一缕阳光从窗外射进来。“春天到底来了。”巨人说。他跳下床往外看。", "他看见一幅奇特的景象。孩子们从墙上一个小洞爬进花园里来了，他们都坐在桃树上面。桃树看见孩子们回来十分高兴，纷纷用花朵把自己装饰起来，还在孩子们头上轻轻地舞动胳膊。小鸟们快乐地飞舞歌唱。花儿们也从绿草丛中伸出头来。这的确是很可爱的景象。只有一个角落还是冬天。", "这是花园里最远的角落，一个小男孩正站在那里。他太小了，手还挨不到树枝，只好在树旁转来转去，哭得很厉害。这棵可怜的树仍然满身盖着雪和霜，北风还在树顶上吼叫。“快爬上来，孩子！”桃树一面对小男孩说，一面尽可能地把树枝垂下去，然而孩子还是太小了。", "巨人看见这个情景，心也软了。他对自己说：“我多么自私啊！现在我明白为什么春天不肯到这儿来了。”他十分后悔自己先前的举动。", "他轻轻地走下楼，静悄悄地打开前门，走进花园里。孩子们看见他，非常害怕，立刻逃走了，花园里又出现了冬天的景象。只有那个小男孩没有
