文言文二则", "section": "阅读", "domain": "reading", "genre": "文言文", "author": null, "dynasty": null, "page": 98, "chars": 359, "paras": ["两小儿辩日孔子东游，见两小儿辩斗②，问其故。", "一儿曰：“我以③日始出时去人近，而日中④时远也。”", "一儿曰：“我以日初出远，而日中时近也。”", "一儿曰：“ 日初出大如车盖⑤，及⑥日中则如盘盂yú ⑦，此不为⑧远者小而近者大 乎？”", "一儿曰：“日初出沧沧凉凉⑨，及其日中如探汤⑩，此不为近者热而远者凉乎？”", "孔子不能决也。", "两小儿笑曰：“孰为汝多知乎？”", "这里比喻天气很热。汤，热水。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 21, "book": "六年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "表里的生物", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 100, "chars": 1416, "paras": ["我小时候住在一座小城里，城里没有工厂，所以也没有机器的声音。我那时以为凡能发出声音的，都是活的生物。早晨有鸟叫得很好听，夜里有狗吠得很怕人，夏天蝉在绿树上叫，秋晚有各种的虫在草丛中唱不同的歌曲。钟楼上的钟不是活的，有时却洪亮地响起来，那是有一个老人在敲；街心有时响着三弦的声音，那是一个盲人在弹。哪里有死的东西会自己走动，并且能自动地发出和谐的声音呢？", "可是父亲怀里的表有时放在桌子上，不但它的秒针会自己走动，而且它坚硬的表盖里还会发出清脆的声音：嘀嗒，嘀嗒……没有一刻的休息，这声音比蝉鸣要柔和些，比虫的歌曲要单调些。", "一天，我对父亲说：“我爱听这表的声音。”", "我一边说一边向着表伸出手去。父亲立刻把我的手拦住了，他说：“只许听，不许动。”", "停了一会儿，他又添上一句：“小孩儿不许动表。”", "他这么说，就更增加了表的神秘。“不许动”，里边该是什么① 本文作者冯至（1905—1993），选作课文时有改动。", "21 表里的生物东西在响呢？我对于它的好奇心一天比一天增加。树上的蝉，草里的虫，都不会轻易被人看见，我想：表里边一定也有一个蝉或虫一类的生物吧，这生物被父亲关在表里，不许小孩子动。", "越不许我动，我越想动，但是我又不敢，因此很痛苦。这样过了许多天。父亲一把表放在桌子上，我的眼睛就再也离不开它。有一次，父亲也许看我的样子太可怜了，也许自己有什么高兴的事，他对我笑着说：“你来，我给你看看表里是什么在响，可是只许看，不许动。”", "没有请求，父亲就自动给我看，我高兴极了，同时我的心也加速跳动。父亲取出一把小刀，把表盖拨开，我的面前立即呈现出一个美丽的世界：蓝色的、红色的小宝石，钉住几个金黄色的齿轮，里边还有一个小尾巴似的东西不停地摆来摆去。这小世界不但被表盖保护着，还被一层玻璃蒙着。我看得入神，唯恐父亲再把这美丽的世界盖上。但是，过了一会儿，父亲还是把表盖上了。父亲的表里边真是好看。", "此后我就常常请求父亲把他的表打开给我看，有时父亲答应我，有时也拒绝我，这要看他高兴不高兴。有一回，父亲又把表打开了，我问：“为什么还蒙着一层玻璃呢？”", "“这就是叫你只许看，不许动。”父亲回答。", "“为什么呢？”我又问。", "“这摆来摆去的是一个小蝎子的尾巴，一动就要蜇你。”", "我吓了一跳，蝎子是多么丑恶而恐怖的东西，为什么把它放在这样一个美丽的世界里呢？但是我也感到愉快，证实我的猜测没有错：表里边有一个活的生物。我继续问：“为什么把那样可怕的东西放在这么好的表里？”", "父亲没有回答。我只想，大半因为它有好听的声音吧。但是一般的蝎子都没有这么好听的声音，也许这里边的蝎子与一般的不同。", "后来我见人就说：“我有蟋蟀在钵子里，蝈蝈在葫芦里，鸟儿在笼子里，父亲却有一个小蝎子在表里。”", "这样的话我不知说了多久，也不知道到什么时候才不说了。", "谐拦添怖愉蟋蟀"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 22, "book": "六年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "他们那时候多有趣啊", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 103, "chars": 1525, "paras": ["那天晚上，玛琪甚至把这件事记在自己的日记里了。在2155年5月17日这一天，她写道：“今天，托米发现了一本真正的书！”", "这是一本很旧的书。玛琪的爷爷有一次告诉过她，当他还是一个小孩子的时候，他的爷爷对他讲，曾经有那么一个时候，所有的故事都是印在纸上的。", "玛琪和托米翻着这本书，书页已经发黄，皱皱巴巴的。他们读到的字全都静止不动，不像他们通常在荧光屏上看到的那样，顺序移动。真是有趣极了，你说是不是？读到后面，再翻回来看前面的一页时，刚刚读过的那些字仍然停留在原地。", "玛琪问：“你在哪儿找到这本书的？”", "“在我们家。”托米指了一下，可并没有抬起头，因为他正在全神贯注地看书。“在顶楼上。”他又说。", "“书里写的什么？”", "“学校。”", "玛琪脸上露出鄙夷不屑的神情：“学校？学校有什么好写的？", "我讨厌学校。”玛琪一向讨厌学校里的机器老师，可现在她比以往快速"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 45, "book": "六年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "两小儿辩日", "section": "阅读", "domain": "reading", "genre": "文言文", "author": null, "dynasty": null, "page": 98, "chars": 354, "paras": ["孔子东游，见两小儿辩斗②，问其故。", "一儿曰：“我以③日始出时去人近，而日中④时远也。”", "一儿曰：“我以日初出远，而日中时近也。”", "一儿曰：“ 日初出大如车盖⑤，及⑥日中则如盘盂yú ⑦，此不为⑧远者小而近者大 乎？”", "一儿曰：“日初出沧沧凉凉⑨，及其日中如探汤⑩，此不为近者热而远者凉乎？”", "孔子不能决也。", "两小儿笑曰：“孰为汝多知乎？”", "这里比喻天气很热。汤，热水。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 46, "book": "六年级上册", "unit_no": 7, "unit_name": "第七单元", "title": "曹冲称象", "section": "阅读", "domain": "reading", "genre": "文言文", "author": null, "dynasty": null, "page": 99, "chars": 391, "paras": ["邓哀王冲字仓舒。少聪察岐嶷nì ②，生五六岁，智意③所及，有若成人之智。时孙权④曾致⑤巨象，太祖⑥欲知其斤重，访⑦之群下，咸⑧莫能出其理⑨。冲曰：“置象大船之上，而刻其水痕所至，称物以载之，则校⑩可知矣。”太祖大悦，即施行焉。", "正确、流利地"], "tasks": [], "newchars": ["仓聪置悦施"]}, {"grade": "六年级", "term": "上册", "no": 23, "book": "六年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "少年闰土", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 110, "chars": 1708, "paras": ["深蓝的天空中挂着一轮金黄的圆月，下面是海边的沙地，都种着一望无际的碧绿的西瓜，其间有一个十一二岁的少年，项带②银圈，手捏一柄钢叉，向一匹猹chá③尽力的刺去，那猹却将身一扭，反从他的胯下逃走了。", "这少年便是闰土。我认识他时，也不过十多岁，离现在将有三十年了；那时我的父亲还在世，家景也好，我正是一个少爷。那23 少年闰土一年，我家是一件大祭祀的值年。这祭祀，说是三十多年才能轮到一回，所以很郑重；正月里供祖像，供品很多，祭器很讲究，拜的人也很多，祭器也很要防偷去。我家只有一个忙月（我们这里给人做工的分三种：整年给一定人家做工的叫长年；按日给人做工的叫短工；自己也种地，只在过年过节以及收租时候来给一定的人家做工的称忙月），忙不过来，他便对父亲说，可以叫他的儿子闰土来管祭器的。", "我的父亲允许了；我也很高兴，因为我早听到闰土这名字，而且知道他和我仿佛年纪，闰月生的，五行缺土，所以他的父亲叫他闰土。他是能装弶捉小鸟雀的。", "我于是日日盼望新年，新年到，闰土也就到了。好容易到了年末，有一日，母亲告诉我，闰土来了，我便飞跑的去看。他正在厨房里，紫色的圆脸，头戴一顶小毡帽，颈上套一个明晃晃的银项圈，这可见他的父亲十分爱他，怕他死去，所以在神佛面前许下愿心，用圈子将他套住了。他见人很怕羞，只是不怕我，没有旁人的时候，便和我说话，于是不到半日，我们便熟识了。", "我们那时候不知道谈些什么，只记得闰土很高兴，说是上城之后，见了许多没有见过的东西。", "第二日，我便要他捕鸟。他说：“这不能。须大雪下了才好。我们沙地上，下了雪，我扫出一块空地来，用短棒支起一个大竹匾，撒下秕谷，看鸟雀来吃时，我远远地将缚在棒上的绳子只一拉，那鸟雀就罩在竹匾下了。什么都有：稻鸡，角鸡，鹁鸪，蓝背……”", "我于是又很盼望下雪。", "闰土又对我说：“现在太冷，你夏天到我们这里来。我们日里到海边检①贝壳去，红的绿的都有，鬼见怕也有，观音手也有。晚上我和爹管西瓜去，你也去。”", "“管贼么？”", "“不是。走路的人口渴了摘一个瓜吃，我们这里是不算偷的。", "要管的是獾猪，刺猬，猹。月亮地下，你听，啦啦的响了，猹在咬瓜了。你便捏了胡叉，轻轻地走去……”", "我那时并不知道这所谓猹的是怎么一件东西——便是现在也没有知道——只是无端的觉得状如小狗而很凶猛。", "“他不咬人么？”", "“有胡叉呢。走到了，看见猹了，你便刺。这畜生很伶俐，倒向你奔来，反从胯下窜了。他的皮毛是油一般的滑……”", "我素不知道天下有这许多新鲜事：海边有如许五色的贝壳；西瓜有这样危险的经历，我先前单知道他在水果店里出卖罢了。", "“我们沙地里，潮汛要来的时候，就有许多跳鱼儿只是跳，都有青蛙似的两个脚……”", "阿！闰土的心里有无穷无尽的希奇②的事，都是我往常的朋友所不知道的。他们不知道一些事，闰土在海边时，他们都和我一样只看见院子里高墙上的四角的天空。", "郑拜偷租厨毡羞爹猬伶俐有感情地"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 24, "book": "六年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "好的故事", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 114, "chars": 1554, "paras": ["灯火渐渐地缩小了，在预告石油②的已经不多；石油又不是老牌，早熏得灯罩很昏暗。鞭爆的繁响在四近，烟草的烟雾在身边：是昏沉的夜。", "我闭了眼睛，向后一仰，靠在椅背上；捏着《初学记》的手搁在膝髁上。", "我在蒙胧③中，看见一个好的故事。", "这故事很美丽，幽雅，有趣。许多美的人和美的事，错综起来像一天云锦，而且万颗奔星似的飞动着，同时又展开去，以至于无穷。", "我仿佛记得曾坐小船经过山阴道④，两岸边的乌桕，新禾，野花，鸡，狗，丛树和枯树，茅屋，塔，伽蓝⑤，农夫和村妇，村女，晒着的衣裳，和尚，蓑笠，天，云，竹，……都倒影在澄碧的小河中，随着每一打桨，各各夹带了闪烁的日光，并水里的萍藻游鱼，一同荡漾。诸影诸物，无不解散，而且摇动，扩大，互相融和；刚一融和，却又退缩，复近于原形。边缘都参差如夏云头，镶着日光，发出水银色焰。凡是我所经过的河，都是如此。", "现在我所见的故事也如此。水中的青天的底子，一切事物统在上面交错，织成一篇，永是生动，永是展开，我看不见这一篇的结束。", "24 好的故事河边枯柳树下的几株瘦削的一丈红，该是村女种的罢①。大红花和斑红花，都在水里面浮动，忽而碎散，拉长了，如缕缕的胭脂水，然而没有晕。茅屋，狗，塔，村女，云，……也都浮动着。大红花一朵朵全被拉长了，这时是泼剌奔迸的红锦带。带织入狗中，狗织入白云中，白云织入村女中……。在一瞬间，他们又将退缩了。但斑红花影也已碎散，伸长，就要织进塔，村女，狗，茅屋，云里去。", "现在我所见的故事清楚起来了，美丽，幽雅，有趣，而且分明。青天上面，有无数美的人和美的事，我一一看见，一一知道。", "我就要凝视他们……。", "我正要凝视他们时，骤然一惊，睁开眼，云锦也已皱蹙cù ②，凌乱，仿佛有谁掷一块大石下河水中，水波陡然起立，将整篇的影子撕成片片了。我无意识地赶忙捏住几乎坠地的《初学记》，眼前还剩着几点虹霓色的碎影。", "我真爱这一篇好的故事，趁碎影还在，我要追回他，完成他，留下他。我抛了书，欠身伸手去取笔，—何尝有一丝碎影，只见昏暗的灯光，我不在小船里了。", "但我总记得见过这一篇好的故事，在昏沉的夜……。", "一九二五年二月二十四日。", "本文写于上个世纪二十年代，语言表达与现在不完全一样，有些词语比较难懂。初读课文时，遇到难懂的词语可以先跳过去。再读课文时，试着联系上下文理解它们的意思。", "“好的故事”其实是一个梦境。你怎样理解这故事的美丽、幽雅、有趣？"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 25, "book": "六年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "我的伯父鲁迅先生", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 117, "chars": 2104, "paras": ["伯父鲁迅先生在世的时候，我年纪还小，根本不知道鲁迅是谁，以为伯父就是伯父，跟任何人的伯父一样。伯父去世了，他的遗体躺在万国殡仪馆的礼堂里，许多人都来追悼他，向他致敬，有的甚至失声痛哭。数不清的挽联挂满了墙壁，大大小小的花圈堆满了整间屋子。送挽联送花圈的有工人，有学生，各色各样的人都有。那时候我有点儿惊异了，为什么伯父得到这么多人的爱戴？我呆呆地望着来来往往吊唁的人，想到我永远见不到伯父的面了，听不到他的声音了，也得不到他的爱抚了，泪珠就一滴一滴地掉下来。", "就在伯父去世那一年的正月里，一个星期六的下午，爸爸妈妈带我到伯父家里去。那时候每到周末，我们姐妹三个轮流跟随着爸爸妈妈到伯父家去团聚。这一天在晚餐桌上，伯父跟我谈起《水浒传》里的故事和人物。不知道伯父怎么会知道我读了《水浒传》，大概是爸爸告诉他的吧。老实说，我读《水浒传》不过囫囵吞枣地看一遍，只注意紧张动人的情节；那些好汉的个性，那些复杂的内容，全搞不清楚，有时候还把这个人做的事情安在那个人身上。伯用较快的速度"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "上册", "no": 26, "book": "六年级上册", "unit_no": 8, "unit_name": "第八单元", "title": "有的人—纪念鲁迅有感", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 121, "chars": 377, "paras": ["有的人活着，他已经死了；有的人死了，他还活着。", "有的人骑在人民头上：“啊，我多伟大！”", "有的人俯下身子给人民当牛马。", "有的人把名字刻入石头，想“不朽”；有的人情愿作野草，等着地下的火烧。", "鲁迅走了，但他给后人留下了很多很多，有怀念，更有深深的思考。《有的人》是诗人臧克家为纪念鲁迅逝世十三周年写的一首诗。有感情地读一读，结合本单元的课文和你查找的资料，说说鲁迅是一个怎样的人。", "*26 有的人—纪念鲁迅有感  绘有的人他活着别人就不能活；有的人他活着为了多数人更好地活。", "骑在人民头上的人民把他摔垮；给人民作牛马的人民永远记住他！", "把名字刻入石头的名字比尸首烂得更早；只要春风吹到的地方到处是青青的野草。", "他活着别人就不能活的人，他的下场可以看到；他活着为了多数人更好地活的人，群众把他抬举得很高，很高。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 1, "book": "六年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "北京的春节", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 2, "chars": 2619, "paras": ["按照北京的老规矩，春节差不多在腊月的初旬就开始了。“腊七腊八，冻死寒鸦”，这是一年里最冷的时候。可是，到了严冬，不久便是春天，所以人们并不因为寒冷而减少过年与迎春的热情。", "在腊八那天，家家都熬腊八粥。这种特制的粥是祭祖祭神的，可是细一想，它倒是农业社会一种自傲的表现—这种粥是用各种米，各种豆，与各种干果（杏仁、核桃仁、瓜子、荔枝肉、莲子、花生米、葡萄干、菱角米……）熬成的。这不是粥，而是小型的农业产品展览会。", "腊八这天还要泡腊八蒜。把蒜瓣放到高醋里，封起来，为过年吃饺子用。到年底，蒜泡得色如翡翠，醋也有了些辣味，色味双北京的春节美，使人忍不住要多吃几个饺子。在北京，过年时，家家吃饺子。", "从腊八起，铺户就加紧上年货，街上增加了货摊子—卖春联的、卖年画的、卖蜜供的、卖水仙花的等等，他们都是只在这个季节才会出现的。这些摊子都让孩子们的心跳得更快一些。在胡同里，吆喝的声音也比平时更多更复杂，其中也有仅在腊月才出现的，像卖松枝的、薏仁米的、年糕的等等。", "孩子们准备过年，第一件事是买杂拌儿。这是用各种干果（花生、胶枣、榛子、栗子等）与蜜饯掺和成的，普通的带皮，高级的没有皮—例如普通的用带皮的榛子，高级的就用榛仁。孩子们喜欢吃这些零七八碎儿，即使没有饺子吃，也必须买杂拌儿。他们的第二件事是买爆竹，特别是男孩子们。恐怕第三件事才是买玩意儿—风筝、空竹、口琴等—和年画。", "孩子们忙乱，大人们也紧张。他们必须预备过年吃的喝的用的一切，也必须赶快给孩子做新鞋新衣，好在新年时显出万象更新的气象。", "腊月二十三过小年，差不多就是过春节的“彩排”。在老年间，这天晚上家家祭灶王，从一擦黑儿，鞭炮就响起来，人们随着鞭炮声把灶王的纸像焚化，美其名曰送灶王上天。在前几天，街上就有好多卖麦芽糖与江米糖的，糖形或为长方块或为大小瓜形。按旧日的说法，用糖粘住灶王的嘴，他到了天上就不会向玉帝报告家中的坏事了。现在，还有卖糖的，但是只由大家享用，并不再粘灶王的嘴了。", "过了二十三，大家就更忙了，春节眨眼就到了啊。在除夕以前，家家必须把春联贴好，必须大扫除一次，名曰扫房。必须把肉、鸡、鱼、青菜、年糕什么的都预备充足，至少足够吃用一个星期的—按老习惯，铺户多数关五天门，到正月初六才开张。假若不预备下几天的吃食，临时不容易补充。", "除夕真热闹。家家赶做年菜，到处是酒肉的香味。老少男女都穿起新衣，门外贴好红红的对联，屋里贴好各色的年画，哪一家都灯火通宵，不许间断，鞭炮声日夜不绝。在外边做事的人，除非万不得已，必定赶回家来，吃团圆饭，祭祖。这一夜，除了很小的孩子，没有什么人睡觉，都要守岁。", "初一的光景与除夕截然不同：除夕，街上挤满了人；初一，铺户都上着板子，门前堆着昨夜燃放的爆竹纸皮，全城都在休息。", "男人们在午前就出动，到亲戚家、朋友家去拜年。女人们在家中接待客人。城内城外有许多寺院开放，任人游览，小贩们在庙外摆摊儿，卖茶、食品和各种玩具。北城外的大钟寺、西城外的白云观、南城的火神庙（厂甸）是最有名的。可是，开庙最初的两三天，并不十分热闹，因为人们正忙着彼此贺年，无暇顾及。到了初五初六，庙会开始风光起来。孩子们特别热心去逛，为的是到城外看看野景，可以骑毛驴，还能买到那些新年特有的玩具。白云观外的广场上有赛轿车赛马的，在老年间，据说还有赛骆驼的。这些比赛并不为争谁第一谁第二，而是在观众面前表演骡马与骑者的美好姿态和娴熟技能。", "多数铺户在初六开张，又放鞭炮，从黎明到清早，全城鞭炮声不绝。虽然开了张，可是除了卖吃食与其他重要日用品的铺子，大家并不很忙，铺中的伙计们还可以轮流去逛庙会、逛天桥和听戏。", "元宵（或汤圆）上市，春节的又一个高潮到了。除夕是热闹的，可是没有月光；元宵节呢，恰好是明月当空。大年初一是体面的，家家门前贴着鲜红的春联，人们穿着新衣裳，可是它还不够美；元宵节，处处悬灯结彩，整条大街像是办喜事，火炽而美丽。有名的老铺都要挂出几百盏灯来：有的一律是玻璃的，有的清一色是牛角的，有的都是纱灯；有的通通彩绘《红楼梦》或《水浒传》故事，有的图案各式各样。这在当年，也就是一种广告。灯一悬起，任何人都可以进到铺中参观，晚间灯中都点上蜡烛，观者就更多。这广告可不庸俗。", "干果店在灯节还要做一批杂拌儿生意，所以每每独出心裁，制成各样的冰灯，或用麦苗做成一两条碧绿的长龙，把顾客招来。", "孩子们买各种花炮燃放，即使不跑到街上去淘气，在家中也照样能有声有光地玩耍。家中也有灯：走马灯、宫灯、各形各色的纸灯，还有纱灯，里面有小铃，到时候就叮叮地响。大家还必须吃元宵啊。这的确是美好快乐的日子。", "一眨眼，到了残灯末庙，学生该去上学，大人又去照常做事，春节在正月十九结束了。腊月和正月，在农村正是大家最闲在的时候。过了灯节，天气转暖，大家就又去忙着干活儿了。北京虽是城市，可是它也跟着农村一齐过年，而且过得分外热闹。"], "tasks": [], "newchars": ["醋饺摊拌筝眨宵燃戚贩彼贺轿骆驼"]}, {"grade": "六年级", "term": "下册", "no": 2, "book": "六年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "腊八粥", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 8, "chars": 1314, "paras": ["初学喊爸爸的小孩子，会出门叫洋车了的大孩子，嘴巴上长了许多白胡子的老孩子，提到腊八粥，谁不是嘴里就立时生出一种甜甜的腻腻的感觉呢。把小米、饭豆、枣、栗、白糖、花生仁合拢来，糊糊涂涂煮成一锅，让它在锅中叹气似的沸腾着，单看它那叹气样儿，闻闻那种香味，就够咽三口以上的唾沫了，何况是，大碗大碗地装着，大匙大匙朝嘴里塞灌呢！", "住方家大院的八儿，今天喜得快要发疯了。他一个人进进出出灶房，看到一大锅粥正在叹气，碗盏都已预备整齐，摆到灶边好久了，但妈妈总是说时候还早。", "他妈妈正拿起一把锅铲在粥里搅和。锅里的粥也像是益发浓稠了。", "“妈，妈，要到什么时候才……”", "“要到夜里！”其实他妈妈所说的夜里，并不是上灯以后。但八儿听了这种松劲的话，眼睛可急红了。锅中的粥，有声无力的叹气还在继续。", "“那我饿了！”八儿要哭的样子。", "“饿了，也得到太阳落下时才准吃。”", "饿了，也得到太阳落下时才准吃。你们想，妈妈的命令，看羊还不够资格的八儿，难道还能设什么法来反抗吗？并且八儿所说的腊八粥。", "饿，也不可靠，不过因为一进灶房，就听到那锅中叹气又像是正在嘟囔的声音，因好奇而急于想尝尝这奇怪的东西罢了。", "“妈，妈，等一下我要吃三碗！我们只准大哥吃一碗。大哥同爹都吃不得甜的，我们俩光吃甜的也行……妈，妈，你吃三碗我也吃三碗，大哥同爹只准各吃一碗，一共八碗，是吗？”", "“是啊！孥孥说得对。”", "“要不然我吃三碗半，你就吃两碗半……”", "“噗。”锅内又叹了声气。八儿回过头来，也不过是看到一股淡淡烟气往上一冲而已！", "锅中的一切，对八儿来说，只能猜想：栗子已稀烂到认不清楚了吧，饭豆会煮得浑身肿胀了吧，花生仁吃来总该是面面的了！枣子必大了三四倍—要是真的干红枣也有那么大，那就妙极了！糖若放多了，它会起锅巴……“妈，妈，你抱我起来看看吧！”于是妈妈就如八儿所求的把他抱了起来。", "“呃！”他惊异得喊起来了，锅中的一切已进了他的眼中。", "这不能不说是奇怪呀，栗子跌进锅里，不久就得粉碎，那是他知道的。他曾见过跌进黄焖鸡锅子里的一群栗子，不久就融掉了。", "饭豆煮得肿胀，那也是往常熬粥时常见的事。花生仁脱了它的红外套，这是不消说的事。锅巴，正是围了锅边成一圈。总之，一切都成了如他所猜的样子了，但他却没想到今日粥的颜色是深褐。", "“怎么，黑的！”八儿同时想起了染缸里的脏水。", "“枣子同赤豆搁多了。”妈妈解释的结果，是拣了一枚大得特别吓人的赤枣给了八儿。", "虽说是枣子同饭豆搁得多了一点儿，但大家都承认味道是比普通的粥要好吃得多了。", "晚饭桌边，靠着妈妈斜立着的八儿，肚子已成了一面小鼓了。", "他身边桌上那两支筷子，很浪漫地摆成一个十字。桌上那大青花碗中的半碗陈腊肉，八儿的爹同妈也都奈何它不来了。", "课文主要写了等粥和喝粥两部分内容，"], "tasks": ["朗读课文，一边读一边想象八儿的馋样儿。"], "newchars": ["腊粥枣咽匙搅肿熬褐缸脏筷陈"]}, {"grade": "六年级", "term": "下册", "no": 3, "book": "六年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "古诗三首", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": "唐", "page": 11, "chars": 374, "paras": ["古诗三首注释① 〔寒食〕寒食节，通常在冬至后的第105天，过去在节日期间不能生火做饭。", "寒  食[唐] 韩 翃春城无处不飞花，寒食东风御柳斜。", "日暮汉宫传蜡烛，轻烟散入五侯家。", "迢迢牵牛星迢迢牵牛星，皎皎河汉女。", "纤纤擢素手，札札弄机杼。", "终日不成章，泣涕零如雨。", "河汉清且浅，相去复几许。", "盈盈一水间，脉脉不得语。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 4, "book": "六年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "寒食", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": "唐", "page": 11, "chars": 374, "paras": ["古诗三首注释① 〔寒食〕寒食节，通常在冬至后的第105天，过去在节日期间不能生火做饭。", "寒  食[唐] 韩 翃春城无处不飞花，寒食东风御柳斜。", "日暮汉宫传蜡烛，轻烟散入五侯家。", "迢迢牵牛星迢迢牵牛星，皎皎河汉女。", "纤纤擢素手，札札弄机杼。", "终日不成章，泣涕零如雨。", "河汉清且浅，相去复几许。", "盈盈一水间，脉脉不得语。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 4, "book": "六年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "藏戏", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 13, "chars": 986, "paras": ["世界上还有几个剧种是戴着面具演出的呢？", "世界上还有几个剧种在演出时是没有舞台的呢？", "世界上还有几个剧种是一部戏可以演出三五天还没有结束的呢？", "还是从西藏僧人唐东杰布的传奇故事讲起吧。", "那时候，雅鲁藏布江上没有一座桥，数不清的牛皮船被掀翻在野马脱缰般的激流中，许多涉水过江的百姓被咆哮的江水吞噬。于是，唐东杰布许下宏愿，发誓架桥，为民造福。一无所有的唐东杰布，招来的只有一阵哄堂大笑。", "于是就有了这样一段传奇。唐东杰布在山南琼结认识了能歌善舞的七兄妹，组成了西藏的第一个藏戏班子，用歌舞说唱的形式，表演历史故事和传说，劝人行善积德，出钱出力，共同修桥。随着雄浑的歌声响彻雪山旷野，有人献出钱财，有人布施铁块，有人送来粮食，更有大批的渔民、工匠、流浪汉跟着他们，从一个架桥工地走到另一个架桥工地。随着铁索桥一座接着一座地架起来，藏戏的种子也随之撒遍了雪域高原。", "*藏  戏不同的地方不仅有不同的节日风俗，还有各具特色的艺术样式。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 5, "book": "六年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "迢迢牵牛星", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": "唐", "page": 11, "chars": 374, "paras": ["古诗三首注释① 〔寒食〕寒食节，通常在冬至后的第105天，过去在节日期间不能生火做饭。", "寒  食[唐] 韩 翃春城无处不飞花，寒食东风御柳斜。", "日暮汉宫传蜡烛，轻烟散入五侯家。", "迢迢牵牛星迢迢牵牛星，皎皎河汉女。", "纤纤擢素手，札札弄机杼。", "终日不成章，泣涕零如雨。", "河汉清且浅，相去复几许。", "盈盈一水间，脉脉不得语。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 6, "book": "六年级下册", "unit_no": 1, "unit_name": "第一单元", "title": "十五夜望月", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": null, "page": 12, "chars": 253, "paras": ["有感情地"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 5, "book": "六年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "鲁滨逊漂流记（节选）", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 20, "chars": 2916, "paras": ["鲁滨逊漂流记（节选）梗  概从前，有一个叫鲁滨逊的英国人，他喜欢航海和冒险，到过世界上很多地方，碰到过许多危险，但他一点儿也不畏惧，希望走遍天涯海角。", "有一次，鲁滨逊乘船前往非洲，途中遇上大风，船严重受损，同伴们在乘小艇逃生时都死在海里，只有他一个人被大浪冲到海岛边。这是一个无名的、没有人居住的荒岛，到处是乱石野草。他又累又饿，心里想：流落到这种地方，怎样活下去呢？", "等到潮水退了，鲁滨逊看到那大船竟然还浮在海面上，离岸并不远。他游到船边，用船上的桅杆、木板制成了木筏，运送从船上带来的物品。在船舱里，鲁滨逊找到很多可以用、可以吃的东西，陆续搬到岸上。没有淹死的一条狗、两只猫陪着他，这使他在凄凉中感到一丝安慰。", "鲁滨逊走遍荒岛，在山坡上选择了一块有水源、可以防御野兽的地方，用木头和船帆搭起一座简陋的帐篷。那儿可以看到海面，他希望瞧见过往的船只，以便请求救援。", "鲁滨逊在岛上定居下来，过着寂寞的生活。船上搬下来的食物越来越少，要想活下去，就得想办法。", "这个部分是全书的内容梗概。", "他每天要么拿着枪，带着狗到森林里去打猎，要么到海边去捕鱼，还把捕到的活山羊畜养起来。后来他竟有了成群的山羊，可以常喝羊奶，吃羊肉。鲁滨逊从船上搬来的东西里还有一些麦子，由于被老鼠啃过了，他就随意把它们丢撒在地上，没想到不久竟长出了嫩芽，后来又结出了穗子。他用这点儿麦种反复种收，到了第四年，终于吃到了自己种的粮食。", "很多年过去了。有一天，鲁滨逊忽然发现海边沙滩上出现了人的脚印。他惊恐万分，猜想这一定是附近的野人留下来的。他担心这些野人会来吃掉他，于是在住所前的空地上密密麻麻地插上树枝作防御，又把羊分在几个地方圈养。他在这种不安的心情下又生活了两年。后来，鲁滨逊再一次看到野人留下的生火的痕迹和满地的人骨，他不由得联想到他们野蛮的宴会。鲁滨逊在恐惧之中开始考虑怎样对付这些可能出现的野人。", "又过了几年，有一天，鲁滨逊看到三十多个野人乘着小木船上了岸。他们拖出两个倒霉的同伴，杀了其中一个人，另一个则挣扎着逃跑。他逃的方向正是鲁滨逊住所的方向。鲁滨逊决心救下这个逃跑的野人，于是开枪打死了追赶他的两个野人。他给救下的野人取名“星期五”。“星期五”很快成了他的好帮手，他们愉快地生活在岛上，扩大了粮食种植面积，又增加了几个羊圈，晒了很多葡萄干。鲁滨逊差不多淡忘了要回到英国、回到文明社会的想法。", "有一天清晨，鲁滨逊被“星期五”喊醒，原来，有一艘英国船只正在附近停泊着。他发现这艘船上发生了叛乱，水手们绑架了船长。", "鲁滨逊和“星期五”救出了船长，船长愉快地答应带他们回英国去。", "在荒岛上度过了二十八年后，鲁滨逊终于回到了英国。", "我现在处在一个令人忧伤的、没有言语交流的生活场景中，也许这种生活在世界上是前所未有的。但我必须接受这种生活，并且一天一天过下去。根据我的估算，我是在9月30日登上了这个荒无人烟的岛。当时刚过秋分，太阳几乎正好在我的头顶上，所以我估计自己是在北纬9度22分的地方。", "在岛上待了十一二天以后，我忽然想到，由于没有本子、笔和墨水，我将没法估算日子，甚至分不清休息日和工作日。为了避免这种情况，我用刀子在一根大木杆上刻了一些字，并把它竖在我第本文选自《鲁滨逊漂流记》，作者是英国的丹尼尔·笛福，译者鹿金，选作课文时有改动。", "节  选一次登岸的地方，上面刻着：“1659年9月30日，我在这里登岸。”在这根方木杆的侧面，我每天用刀子刻一道痕，每第七道刻痕比其他的长一倍，每月第一天的刻痕再长一倍，这样，我就有了日历。", "我几次到船上去，取出了许多东西。有几件虽然不值什么钱，对我来说却很有用，比如笔、墨水，还有纸，在船长、大副、炮手和木匠保管的物品中找到的几个包裹、三四个罗盘、几台数学仪器，还有日晷、望远镜、地图和航海类的书籍。我把它们一股脑堆在一起，以备不时之需。", "还要提到的是，我们的船上有一条狗和两只猫。那两只猫是我带上岸的；至于那条狗，是在我带着第一批货上岸的第二天，它自己从船上跳出来，游上岸到我这儿来的，在以后的许多年里是我可信任的仆役。我不稀罕它给我弄来什么东西，也不稀罕它同我做伴，我只需要它同我聊聊天，但是它却办不到。找到了笔、墨水和纸之后，我尽最大的可能节省使用。只要我还有墨水，就能把事情记得非常准确。但是墨水用完以后，我就办不到了，因为我想尽办法还是制造不出墨水来。", "尽管我收罗了这么多东西，还是缺少许多，比如墨水，还有用来挖土或者运土的铲子、鹤嘴锄、铁锨，以及针线。至于内衣之类，虽然缺乏，但我很快就习惯了。", "没有工具，干什么都困难重重。我几乎花了一年工夫才完全布置好我那个用栅栏围起来的小小的住所。那些尖桩或者圆桩沉得很，我要使出全力才举得起来。我花了好长的时间才砍下那些木材，并且在林子里加工好，再花上更长的时间把它们运回家。也就是说，我需要花两天时间砍成一根木桩并运回来，在第三天才把它打进地里。我最初用一根很沉的木棒打桩，后来想到了用铁撬棒打。尽管如此，打起桩来还是很费劲，而且非常麻烦。", "但是，我既然不得不干这活儿，又有的是时间，有什么必要介意呢？这活儿要是干完了的话，除了在岛上转悠，寻找吃的以外，那我也没有其他的事可干了。", "我现在开始认真考虑我的处境。我一一记下我经历的事情，并不是想把自身的遭遇传给后人看，而是要把一直萦系在我心头、不断折磨着我的想法吐露出来。我的理智现在已经逐渐能够控制我的沮丧心情，我开始尽可能地安慰自己，把我遇到的凶险和幸运作个对比，使自己能够心平气和。我按照商业簿记中借方和贷方的格式，如实记录了我所遇到的幸与不幸：坏处我被抛弃在一座可怕的荒岛上，没有重见天日的希望。", "我被单独剔出来，与世隔绝，受尽苦难。", "我被从人类中分离出来，成为一个孤独的人。", "我没有衣服穿。", "我没有任何防御力量或者手段来抵抗人或野兽的侵袭。", "没有人可以同我说话，或者宽慰我。", "好处但是我还活着，没有像我的伙伴们一样被淹死。", "但是，我也免于死亡，而船上其他人员都已丧命。", "但是，我在这片荒芜的土地上既没有挨饿，也没有奄奄待毙。", "但是，我身处热带，即使有衣服也不用穿。", "但是，在这里我看不见会伤害我的野兽，在非洲海岸上，我却看见过。要是我的船在那儿倾覆，该怎么办呢？", "但是，船漂到了离岸很近的地方，我取出了很多必需品，有些甚至够我用一辈子。", "流落荒岛读节选的片段，说一说：鲁滨逊克服了哪些困难？他的心态发生了什么变化？你觉得鲁滨逊是一个什么样的人？"], "tasks": ["默读梗概，想想这部小说写了鲁滨逊流落荒岛的哪些事，用小标题的方式列出来。"], "newchars": ["惧凄寞宴霉籍聊乏控贷剔毙抵袭覆"]}, {"grade": "六年级", "term": "下册", "no": 6, "book": "六年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "骑鹅旅行记（节选）", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 27, "chars": 3089, "paras": ["男孩简直不敢相信他会变成小狐仙。“这大概是一场梦，一种幻觉吧！”他想，“过一会儿我肯定还会再变成一个人。”", "他站在镜子前面闭上眼睛，过了好几分钟才睁开。当时他估计怪样子肯定消失了。可是怪样子并没有消失，他仍然像刚才一样小。从别的方面看，他和以前完全一样。他那淡黄的头发、鼻子上的雀斑、皮裤和袜子上的补丁都和过去一模一样，只不过变得很小很小罢了。", "他发现，光那样站着等待是无济于事的，一定得想别的办法。", "他觉得最聪明的做法就是去找小狐仙讲和。", "他忽然想起，曾听母亲讲过，小狐仙平时都是住在牛棚里的。", "他立刻决定到那里去看看是否能找到小狐仙。幸好房门半开着，不然他还够不到锁，无法开门呢，而现在他没碰到任何障碍就跑了出去。", "门廊外面的地板上有一只麻雀在跳来跳去。他一看见男孩就叫了起来：“叽叽，叽叽，快看放鹅娃尼尔斯！快看拇指大的小人儿！快看拇指大的小人儿尼尔斯·豪尔耶松！”", "本文选自《骑鹅旅行记》，作者是瑞典的塞尔玛·拉格洛芙，译者高子英、李之义、杨永范，选作课文时有改动。", "《骑鹅旅行记》是享誉世界的儿童文学作品。读读下面这个片段，说说小男孩尼尔斯变成小狐仙之后，他的世界发生了什么变化。作品中还有许多有趣的故事，如“鹤之舞表演大会”“大海中的白银”，猜猜它们又将讲述怎样的神奇。有兴趣的话可以找来原著读一读。", "*院子里的鹅和鸡立即掉过头来盯着男孩，并发出了一阵使人无法忍受的咯咯声。“咯咯里咕，”公鸡叫道，“他活该，咯咯里咕，他扯过我的鸡冠！”", "然而最奇怪的是，男孩竟听懂了他们说的话。他大为吃惊，就一动不动地站在台阶上听了起来。“这可能是因为我变成了小狐仙的缘故吧！”他自语着，“肯定是由于这个原因，我才听懂了他们说的话。”", "那些鸡没完没了地叫着：“他活该！他活该……”他实在无法忍受，捡起一块石头朝他们扔了过去，并骂道：“住嘴！你们这群坏家伙！”", "可是他没有想到，他已不再是原来的样子，鸡根本就不怕他。", "整群鸡都跑到他身边，站在他周围叫着：“咕咕咕，你活该！咕咕咕，你活该！”", "男孩想摆脱他们，但是那些鸡在他后面追着叫着，都快把他的耳朵吵聋了。如果不是家里养的那只猫走了出来，他是怎么也溜不掉的。那些鸡一看见猫便住了嘴，装着聚精会神的样子在地上刨虫子吃。", "男孩马上跑到猫跟前。“ 亲爱的猫咪，”他说，“院子里各个角落和暗洞你不是都很熟悉吗？请你告诉我，在哪里能找到小狐仙？”", "猫没有立刻回答。他坐下来，把尾巴精心地在腿前盘成了一个圆圈，两眼盯着男孩。那是一只大黑猫，脖子下面有个白斑点。他的皮毛平滑，在阳光下闪闪发亮。他的爪子收缩着，灰白的眼睛眯成了一条细缝，样子十分温柔。", "“我知道小狐仙住在什么地方，”他低声说，“但是这并不等于说我愿意告诉你。”", "“亲爱的猫咪，你可得帮我的忙啊！”男孩说，“你没看见他把我变成什么样子了吗？”", "猫稍稍睁了睁眼睛，里面射出了一道寒光。他先得意扬扬地念了一阵经，然后才说：“要我帮你的忙？是不是因为你经常揪我的尾巴？”", "这时男孩恼怒了。他已经完全忘了他现在是多么弱小无力。", "“怎么着？我还要揪你的尾巴！”他说着便向猫扑了过去。", "转眼间，猫摇身一变，男孩几乎不敢相信他还是刚才那个动物。他全身的毛都竖了起来，拱起腰，伸直了腿，四脚抓地，尾巴变得粗而短，两耳朝后，嘴里嘶叫着，瞪大的眼睛冒着火星。", "男孩对猫并不示弱，反而向前逼近了一步。这时猫突然一跃，径直朝他扑了过去，把他扑倒在地，跳到他身上，前爪按住他的胸口，对着他的咽喉张开了大嘴。", "男孩感觉到猫的爪子穿过他的背心和衬衣，刺进了他的皮肤，锋利的犬牙触到了他的咽喉。他拼命地喊着救命。", "可是一个人也没有来。他断定，他死亡的时刻到了。正在这时，他又觉得猫把爪子收了回去，松开了他的喉咙。", "“好了，”猫说，“这回够了，看在女主人的面子上，这次我饶了你。我只想让你知道，咱们俩现在究竟谁厉害。”", "说着，猫就走开了，看上去像他来的时候一样温柔和善。男孩羞得连一句话也说不出来，赶紧溜到牛棚里去找小狐仙了。", "牛棚里只有三头牛。但男孩进去的时候，却是吼声四起，一片混乱，听起来至少是三十头。", "“你过来，”名叫五月玫瑰的牛说，“我给你一蹄子，让你永远不能忘记！”", "“你过来，”名叫金百合的牛说，“我要让你在我的角上跳舞。”", "“你过来，我也叫你尝尝去年夏天你经常用木鞋打我的滋味！”", "名叫星星的牛吼道。", "“你过来，你曾经把马蜂放进我的耳朵，现在我要报仇！”金百合叫着。", "五月玫瑰在她们中间年纪最大、最聪明，现在也最生气。“你过来，”她说，“你做的事都应该遭报应了。你曾多次从你母亲腿下抽走她挤奶时坐的小凳，你多次在你母亲提着奶桶走过时伸脚绊倒她，你多次气得她站在这里流眼泪！”", "男孩想对她们说，过去他对她们不好，现在后悔了，只要告诉他小狐仙在哪里，以后他就再也不捣蛋了。但是牛都不听他说话。", "她们吵闹得非常凶，他真担心哪头牛会挣断缰绳，所以他觉得还是趁早溜掉为妙。", "他垂头丧气地从牛棚里走了出来。院子里不会有人帮他寻找小狐仙，这他是能够理解的。在这种情况下，即使找到小狐仙，可能也没有多大用处。", "他爬到了布满荆棘和黑莓藤蔓的厚石头围墙上，坐在那里环顾着自己的家。那是一座用石头砌墙、木头作支架的白色小房子。其他附属的房屋也很小，耕地窄得几乎连马都无法在上面打滚。可是这地方无论怎么小怎么穷，对他来说已经够好的了。他现在除了在牛棚的地上找个洞以外，再也不能要求更好的住所了。", "这天天气好极了。水渠里流水潺潺，树上嫩芽满枝，小鸟在耳边欢唱。而他却坐在那里十分难过，再也没有什么东西能引起他的兴致。", "他从来没有见过天空像这样蓝。候鸟都回来了。他们从海外飞来，越过了波罗的海直奔斯密格虎克，正向北飞行。鸟的种类很多，但是别的鸟他都不认识，只认识那些排成“人”字形的大雁。", "有几群大雁已经飞了过去。他们飞得很高，但是仍然能够听见他们的叫声：“现在飞向高山，现在飞向高山。”", "当大雁们看到在院子里漫游的家鹅时，就一边朝大地低飞，一边喊着：“跟我们来吧！跟我们来吧！现在飞向高山。”", "家鹅不由得抬起头，听着大雁的叫声。他们回答说：“我们在这里生活得很好！我们在这里生活得很好！”", "如前所说，这天天气格外晴朗，空气清新，春风拂面，这时飞行真是一种享受。随着一群一群的大雁飞过，家鹅越来越动心了。", "他们中间有几只扇着翅膀跃跃欲试，但是一只老母鹅总是说：“别犯傻！你们一定会受冻挨饿的。”", "大雁的呼叫却使一只年轻的雄鹅真的动了心。“再过来一群我就跟着他们飞走。”他说。", "真的又过来一群大雁，他们照样呼唤。那只年轻的雄鹅答道：“等一等！等一等！我就来。”", "他张开翅膀朝天空飞去。但是他没有飞行的习惯，于是又落到了地上。", "大雁们还是听到了他的叫声。他们掉过头来慢慢地朝回飞，看他是不是真要跟着去。", "“等一等！等一等！”他一面叫着一面进行新的尝试。", "男孩坐在围墙上，这一切都听得一清二楚。", "“如果这只大雄鹅飞走，可是一个很大的损失，”他想，“父母从教堂回来时，发现雄鹅不见了，他们会伤心的。”", "当他这样想的时候，他又忘记了他是多么弱小无力。他一下子从墙上跳下来，跑进鹅群里，用双臂抱住了雄鹅的脖子。“你可千万不要飞走啊！”他喊道。", "恰恰就在这一瞬间，雄鹅学会了怎样腾空而起。他来不及抖掉男孩就飞向了天空。", "雄鹅飞得那么快，男孩都感到头晕目眩了。等他想到应该放开雄鹅的脖子时，已经到了高空。如果他现在一松手，肯定会掉到地上摔死。", "要想舒服一点儿，他唯一能做的就是设法爬到鹅背上去。他费了九牛二虎之力总算爬了上去。然而要在翅膀中间光滑的脊背上坐稳，也不是一件容易的事，何况翅膀还在不停地扇动。为了不滑下去，他不得不用两只手紧紧地抓住雄鹅的羽毛。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 7, "book": "六年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "汤姆·索亚历险记（节选）", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 33, "chars": 2069, "paras": ["到了星期二的黄昏，圣彼得斯堡镇仍然笼罩在一片悲伤之中，两个走失的孩子还没有找到。镇上的人们已经为他们作了公开的祈祷，还有许许多多的人私下里为这两个孩子作了祈祷，诚心诚意地祈求他们平平安安，但是依然没有从洞里传来好消息。大多数搜索的人已经放弃了搜寻孩子这件事，回到镇上继续干他们平日的活儿去了，他们认为孩子明摆着是找不回来了。撒切尔太太病得厉害，大部分时间都在说胡话。人们听见她呼喊孩子，看见她每次抬起头侧耳听上好久，然后一边呻吟着一边软弱无力地垂下头去，那情景真是让人心碎。波莉姨妈已经陷入了悲痛和绝望之中，她那满头的灰发几乎全变白了。到了晚上，镇上停止了一切活动，整个小镇被蒙上了悲伤与凄惨的阴影。", "半夜时分，镇上传来了发疯般的钟声。不一会儿，街道上就挤满了衣衫不整却欣喜若狂的人，他们高声喊着：“快来看！找到他俩了！”人们叮叮当当地敲响了铁碗铜盆，嘀嘀嗒嗒的喇叭声与人本文选自《汤姆·索亚历险记》，作者是美国的马克·吐温，译者俞东明、陈海庆，选作课文时有改动。", "汤姆·索亚是美国作家马克·吐温笔下著名的儿童形象。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 18, "book": "六年级下册", "unit_no": 2, "unit_name": "第二单元", "title": "漫步世界名著花园", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 41, "chars": 793, "paras": ["每一本名著都是独一无二的花朵。当你漫步在世界名著花园中，与心仪的书籍不期而遇，一定会惊喜地停下脚步。", "你读过吗有这样一本书，为我们讲述了一个人流落荒岛后的种种际遇。翻开它，你会看到一个人如何在绝境中变成自己的国王，一座岛如何从荒芜之地变成微型的文明社会。二十八年，鲁滨逊凭借自己勇往直前的精神和辛勤的劳动，成就了一段传奇。", "这本书面世后，吸引了不少学者对其进行评论。", "它就是我们学习的课本，我们关于自然科学的一切谈话，都不过是对它的一个注释罢了。", "—[法国]卢梭经典是那些你经常听人家说“我正在重读……”而不是“我正在读……”", "的书。……《鲁滨逊漂流记》无疑是一部值得逐字逐行重读的小说。", "—[意大利]卡尔维诺先大致了解名著的写作背景，能帮助我们理解作品的内容和价值。读的时候如果能做一些读书笔记，收获就更大了。", "有些名著读起来比较难，不像流行读物那样通俗易懂，但想到能成为经典的书不简单，是人类智慧的结晶，你就会让自己沉下心来读，越读越有味。", "相信你可以读更多在这个单元里，我们接触了几本世界名著，它们不仅有引人入胜的情节，还有复杂的内涵，正因为如此，读起来才更有乐趣。《鲁滨逊漂流记》背后鲜明的时代烙印，《骑鹅旅行记》字里行间的怀乡之情，《汤姆·索亚历险记》对自由的向往和对社会的讽刺，都需要我们慢慢去发现，去品味。", "除了这几本名著，小学六年，你一定还读了很多书。在读过的书中，你认为哪些书可以被称作“经典”？你在读这些经典名著时，用过什么读书方法？"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 8, "book": "六年级下册", "unit_no": 3, "unit_name": "第三单元", "title": "匆匆", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 44, "chars": 778, "paras": ["燕子去了，有再来的时候；杨柳枯了，有再青的时候；桃花谢了，有再开的时候。但是，聪明的，你告诉我，我们的日子为什么一去不复返呢？—是有人偷了他们吧：那是谁？又藏在何处呢？", "是他们自己逃走了吧：现在又到了哪里呢？", "我不知道他们给了我多少日子，但我的手确乎是渐渐空虚了。", "在默默里算着，八千多日子已经从我手中溜去，像针尖上一滴水滴在大海里，我的日子滴在时间的流里，没有声音，也没有影子。我不禁头涔涔而泪潸潸了。", "去的尽管去了，来的尽管来着，去来的中间，又怎样地匆匆呢？早上我起来的时候，小屋里射进两三方斜斜的太阳。太阳他有脚啊，轻轻悄悄地挪移了，我也茫茫然跟着旋转。于是—洗手的时候，日子从水盆里过去；吃饭的时候，日子从饭碗里过去；默默时，便从凝然的双眼前过去；我觉察他去得匆匆了，伸出手遮挽时，他又从遮挽着的手边过去；天黑时，我躺在床上，他便伶伶俐俐地从我身上跨过，从我脚边飞去了；等我睁开眼和太阳再见，这算又溜走了一日；我掩着面叹息，但是新来的日子的影儿又开始在叹息里闪过了。", "匆  匆。", "在逃去如飞的日子里，在千门万户的世界里的我能做些什么呢？只有徘徊罢了，只有匆匆罢了。在八千多日的匆匆里，除徘徊外，又剩些什么呢？过去的日子如轻烟，被微风吹散了，如薄雾，被初阳蒸融了。我留着些什么痕迹呢？我何曾留着像游丝样的痕迹呢？我赤裸裸来到这世界，转眼间也将赤裸裸地回去吧？但不能平的，为什么偏要白白走这一遭啊？", "你聪明的，告诉我，我们的日子为什么一去不复返呢？", "有感情地"], "tasks": [], "newchars": ["藏挪徘徊蒸裸"]}, {"grade": "六年级", "term": "下册", "no": 9, "book": "六年级下册", "unit_no": 3, "unit_name": "第三单元", "title": "那个星期天", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 46, "chars": 2169, "paras": ["那个星期天本文选自《务虚笔记》，作者史铁生，选作课文时有改动。", "我还记得我的第一次盼望。那是一个星期天，从早晨到下午，一直到天色昏暗下去。", "那个星期天母亲答应带我出去，去哪儿已经记不清了，可能是动物园，也可能是别的什么地方。总之她很久之前就答应了，就在那个星期天带我出去玩，这不会错。一个人平生第一次盼一个日子，都不会错。而且就在那天早晨，母亲也还是这样答应的：去，当然去。我想到底是让我盼来了。", "起床，刷牙，吃饭，那是个春天的早晨，阳光明媚。走吗？等一会儿，等一会儿再走。我跑出去，站在街门口，等一会儿就等一会儿。我藏在大门后，藏了很久。我知道不会是那么简单的一会儿，我得不出声地多藏一会儿。母亲出来了，可我忘了吓唬她，她手里怎么提着菜篮？您说了去！等等，买完菜，买完菜就去。买完菜马上就去吗？嗯。", "这段时光不好挨。我踏着一块块方砖跳，跳房子，等母亲回来。我看着天看着云彩走，等母亲回来，焦急又兴奋。我蹲在院子的地上，用树枝拨弄着一个蚁穴，爬着去找更多的蚁穴。院子里就我一个孩子，没人跟我玩。我蹲在草丛里翻看一本画报，那是一本看了多少回的电影画报。那上面有一群比我大的女孩子，一个个都非常漂亮。我蹲在草丛里看她们，想象她们的家，想象她们此刻在干什么，想象她们的兄弟姐妹和她们的父母，想象她们的声音。去年的荒草丛里又有了绿色，院子很大，空空落落。", "母亲买菜回来却又翻箱倒柜忙开了。走吧，您不是说买菜回来就走吗？好啦好啦，没看我正忙呢吗？真奇怪，该是我有理的事啊？不是吗，我不是一直在等着，母亲不是答应过了吗？整个上午我就跟在母亲腿底下：去吗？去吧，走吧，怎么还不走啊？走吧……我就这样念念叨叨地追在母亲的腿底下，看她做完一件事又去做一件事。我还没有她的腿高，那两条不停顿的腿至今都在我眼前晃动，它们不停下来，它们好几次绊在我身上，我好几次差点儿绞在它们中间把它们碰倒。", "下午吧，母亲说，下午，睡醒午觉再去。去，母亲说，下午，准去。但这次怨我，怨我自己，我把午觉睡过了头。醒来时我看见母亲在洗衣服。要是那时就走还不晚。我看看天，还不晚。还去吗？去。走吧？洗完衣服。这一次不能原谅。我不知道那堆衣服要洗多久，可母亲应该知道。我蹲在她身边，看着她洗。我一声不吭，盼着。我想我再不离开半步，再不把觉睡过头。我想衣服一洗完我马上拉起她就走，决不许她再耽搁。我看着盆里的衣服和盆外的衣服，我看着太阳，看着光线，我一声不吭。看着盆里揉动的衣服和绽开的泡沫，我感觉到周围的光线渐渐暗下去，渐渐地凉下去沉郁下去，越来越远越来越缥缈，我一声不吭，忽然有点儿明白了。", "我现在还能感觉到那光线漫长而急遽的变化，孤独而惆怅的黄昏的到来，并且听得见母亲咔嚓咔嚓搓衣服的声音，那声音永无休"], "tasks": [], "newchars": ["媚砖叨绊绞耽揉绽沫搓惶吻偎"]}, {"grade": "六年级", "term": "下册", "no": 22, "book": "六年级下册", "unit_no": 3, "unit_name": "第三单元", "title": "别了，语文课", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 51, "chars": 1365, "paras": ["钟声响了，第一堂课是语文。以前我上语文课时总是懒洋洋提不起劲，奇怪，今天我翻开语文书，别有一番滋味，我的脑子也不再胡思乱想，全神贯注地听张先生授课。", "我为什么会忽然喜欢上语文课，觉得张先生每一句话都那么动听？这一堂课好像过得特别快，一下子就听到了下课钟声。", "放学回家，我一口气读完张先生送给我的书。这本书先浅显地介绍中文的发展，然后分述了中文的特点，最后讲述学好中文的方法。我一下子对中文了解了很多很多。我有点儿怪张先生，为什么不早点儿送这本书给我，让我早点儿知道中文的丰富和优美。", "我放下书，走到爸爸跟前，问他：“爸爸，我们将来移民到中美洲，我还有机会学习中文吗？”", "爸爸说： “我正为这件事操心。那边华侨很少，没有为。", "华侨办的学校。到了那边，你就要学习西班牙文。我担心你会渐渐忘记了中文。”", "我听后吓了一跳。我拿起一张报纸，单是大字标题就有不少字不认识，不要说报纸的内文了。我现在念五年级，可是因为我过去不喜欢语文课，实在学得不好，实际上大约只有三四年级的程度。我张皇地拿出语文书，急急温习今天教过的课文，觉得课文内容饶有趣味。我又拿出纸，用笔反复写新学的生字。我一想起自己顶多还有一个月学习中文的时间，心里就难过，真希望把整本语文书一下子全学会。", "我一连两次默书都得到八十分，张先生每次都鼓励我；最近一次默书，我居然一个字也没有错，得到一百分！语文课上，张先生拿出我的默书簿，翻开第一页给大家看，然后又翻到最后一页，高高举起让同学们看。张先生说：“陈小允是我们学习的好榜样。你们看，他学期开始默书总不合格，现在却得了一百分！”", "有谁知道我心里的痛！唉，语文课，在我深深喜欢上你的时候，我就要离开你了，我将要学习另一种完全不同的语言了，想到这里，我噙着泪。坐在我旁边的叶志聪看见，大惊说： “张先生，陈小允哭啦！”", "同学们都奇怪地注视着我。张先生走到我身旁，亲切地抚着我的头，说：“小允，是为你的进步而哭吗？”", "我擦拭着泪水，站起来，呜咽着说：“张先生，我下星期要离开这里了，我们全家移民到中美洲，我……我再没有机会学习中文了。”", "泪水模糊了眼睛，我看不见同学和张先生的反应，只知道全班忽然异样地沉寂。张先生轻抚着我的头，叫我坐下。", "离开这里的日子越来越近了。同学们纷纷在我的纪念册上留言，叮嘱我不要忘记中国，不要忘记中文。", "用几个具体事例写出了“我”对语文课的情感变化，读起来非常真实自然。", "这段独白，更加直接而强烈地表达了心情。", "这天，是我最后一次上语文课了，张先生带来一扎用鸡皮纸封好的包裹，她对全体同学说：“陈小允是最后一天和大家相叙了。我们祝福他在国外健康快乐地成长。我没有什么送给他，只送他一套小学六年级到中学五年级的语文课本，希望他远离祖国后还可以好好自修，不要忘记母语。”", "我接过这套书，心里非常难过。下课后，同学们都围上来，有人送我一本字典，有人送我一本故事书。他们的热情，使我热泪盈眶。", "别了，我亲爱的老师，我亲爱的同学。我一定不会忘记中文，我会把我的默书簿一生一世留在身边，常常翻阅。", "我会激励自己把中文自修好，像这本默书簿的成绩那样。", "写告别语文课，可能有很多事情可写，这里选择了老师和同学留言、送书的事，把气氛与心情突显出来。"], "tasks": ["默读课文，说说“我”对学习语文的情感和态度发生了怎样的变化， 课文是怎样表达的。"], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 23, "book": "六年级下册", "unit_no": 3, "unit_name": "第三单元", "title": "阳光的两种用法", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 54, "chars": 1137, "paras": ["童年的大院里，住的都是引车卖浆者流，生活不大富裕，日子各有各的过法。", "冬天，屋子里冷，特别是晚上睡觉的时候，被窝里冰凉如铁，那时家里连个暖水袋都没有。母亲有主意，中午的时候，她把被子抱到院子里，晾到太阳底下。其实，这样的法子很古老，几乎各家都会这样做。有意思的是，母亲把被子从绳子上取下来，抱回屋里，赶紧就把被子叠好，铺成被窝状，晚上睡觉我钻进去时，被子里还是暖乎乎的，连被套的棉花味道都烤了出来，很香的感觉。母亲对我说：“我这是把老阳儿叠起来了。”母亲一直用老家话，把太阳叫老阳儿。“阳儿”读成“爷儿”音。", "从母亲那里，我总能听到好多新词。把老阳儿叠起来，让我觉得新鲜。太阳也可以如卷尺或纸或布一样，能够折叠自如吗？在母亲那里，可以。阳光便能够从中午最热烈的时候，一直储存到晚上我钻进被窝里，温暖的气息和味道，让我感觉到阳光的另一种形态，如同母亲大手的抚摸，比暖水袋温馨许多。", "街坊毕大妈，靠摆摊儿养活一家老小。她家门口有一口半人多高的大水缸，冬天用它来储存大白菜，夏天它还有特殊的用处。夏天到来时，每天中午，毕大妈都要接满一缸自来水，骄阳似火，毒辣辣地照到下午，晒得缸里的水都有些烫手了。水能够溶解糖，溶解盐，水还能够溶解阳光，这大概是童年时候我最大的发现了。溶解糖的水变甜，溶解盐的水变咸，溶解了阳光的水变暖，变得犹如母亲温暖的怀抱。", "通过讲述母亲把“老阳儿”叠在被子里的事情，作者的情感自然地流露出来。", "毕大妈的孩子多。黄昏，她家的孩子放学了，毕大妈把孩子们都叫过来，一个个排队洗澡。毕大妈用盆舀的就是缸里的水，正温乎，孩子们连玩带洗，大呼小叫，噼里啪啦的，溅起一盆的水花，个个演出一场哪吒闹海。", "那时候，各家都没有现在普及的热水器，洗澡一般都是用火烧热水，像毕大妈这样给孩子洗澡，在我们大院是独一份。母亲对我说：“看人家毕大妈，把老阳儿煮在水里面了！”", "我得佩服母亲用词的准确和生动，一个“煮”字，让太阳成了居家过日子必备的一种物件，柴米油盐酱醋茶，这开门七件事之后，还得加上一件，即母亲说的老阳儿。", "真的，谁家都离不开柴米油盐酱醋茶，但是，谁家又离得开老阳儿呢？如同清风朗月不用一文钱一样，老阳儿也不用花一分钱，对所有人都大方且一视同仁，而柴米油盐酱醋茶却样样都得花钱买才行。不过，如母亲和毕大妈这样将阳光派上如此用法的人家，也不多。这样的用法，需要一点儿智慧和温暖的心，更需要在艰苦日子里磨炼出的一点儿本事。阳光成了居家过日子的一把好手，陪伴着母亲和毕大妈一起，让那些庸常而艰辛的琐碎日子变得有滋有味。", "作者反复提到的“老阳儿”，起到了贯穿全文情感脉络的作用。", "从两家人的生活中，你体会到了怎样的情感？作者是怎样把这种情感表达出来的？"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 10, "book": "六年级下册", "unit_no": 4, "unit_name": "第四单元", "title": "古诗三首", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": "唐", "page": 58, "chars": 198, "paras": ["古诗三首注释① 〔燕山〕燕然山。这里借指边塞。", "马  诗[唐] 李 贺大漠沙如雪，燕山月似钩。", "何当金络脑，快走踏清秋。", "粉骨碎身浑不怕，要留清白在人间。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 11, "book": "六年级下册", "unit_no": 4, "unit_name": "第四单元", "title": "十六年前的回忆", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 60, "chars": 2081, "paras": ["1927年4月28日，我永远忘不了那一天。那是父亲的被难日，离现在已经十六年了。", "那年春天，父亲每天夜里回来得很晚。每天早晨，不知道什么时候他又出去了。有时候他留在家里，埋头整理书籍和文件。我蹲在旁边，看他把书和有字的纸片投到火炉里去。", "我奇怪地问他：“爹，为什么要烧掉呢？怪可惜的。”", "待了一会儿，父亲才回答：“不要了就烧掉。你小孩子家知道什么！”", "父亲一向是慈祥的，从没有骂过我们，更没有打过我们。我总爱向父亲问许多幼稚可笑的问题。他不论多忙，对我的问题总是很感兴趣，总是耐心地讲给我听。这一次不知道为什么，父亲竟这样含糊地回答我。", "后来听母亲说，军阀张作霖要派人来搜查。为了避免党组织被破坏，父亲只好把一些书籍和文件烧掉。才过了两天，果然出事了。工友阎振三一早上街买东西，直到夜里还不见回来。第二天，父亲才知道他被抓到警察厅里去了。我们心里都很不安，为这位工友着急。", "局势越来越严峻，父亲的工作也越来越紧张。他的朋友劝他离开北京，母亲也几次劝他。父亲坚决地对母亲说：“不是常对你说十六年前的回忆。", "吗？我是不能轻易离开北京的。你要知道现在是什么时候，这里的工作多么重要。我哪能离开呢？”母亲只好不再说什么了。", "可怕的一天果然来了。4月6日的早晨，妹妹换上了新夹衣，母亲带她到儿童娱乐场去散步了。父亲在里间屋里写字，我坐在外间的长木椅上看报。短短的一段新闻还没看完，就听见啪，啪……几声尖锐的枪声，接着是一阵纷乱的喊叫。", "“什么？爹！”我瞪着眼睛问父亲。", "“没有什么，不要怕。星儿，跟我到外面看看去。”", "父亲不慌不忙地向外走去。我紧跟在他身后，走出院子，暂时躲在一间僻静的小屋里。", "一会儿，外面传来一阵沉重的皮鞋声。我的心剧烈地跳动起来，用恐惧的眼光瞅了瞅父亲。", "“不要放走一个！”窗外响起粗暴的吼声。穿灰制服和长筒皮靴的宪兵，穿便衣的侦探，穿黑制服的警察，一拥而入，挤满了这间小屋。他们像一群魔鬼似的，把我们包围起来。他们每人拿着一支手枪，枪口对着父亲和我。在军警中间，我发现了前几天被捕的工友阎振三。他的胳膊上拴着绳子，被一个肥胖的便衣侦探拉着。", "那个满脸横肉的便衣侦探指着父亲问阎振三：“你认识他吗？”", "阎振三摇了摇头。他那披散的长头发中间露出一张苍白的脸，显然是受过苦刑了。", "“哼！你不认识？我可认识他。”侦探冷笑着，又吩咐他手下的那一伙，“看好，别让他自杀！”", "他们仔细地把父亲全身搜了一遍。父亲保持着他那惯有的严峻态度，没有向他们讲任何道理。因为他明白，对他们是没有道理可讲的。", "残暴的匪徒把父亲绑起来，拖走了。我也被他们带走了。在高高的砖墙围起来的警察厅的院子里，我看见母亲和妹妹也都被带来了。我们被关在女拘留所里。", "十几天过去了，我们始终没看见父亲。有一天，我们正在啃手里的窝窝头，听见警察喊我们母女的名字，说是提审。", "在法庭上，我们跟父亲见了面。父亲仍旧穿着他那件灰布旧棉袍，可是没戴眼镜。我看到了他那乱蓬蓬的长头发下面的平静而慈祥的脸。", "“爹！”我忍不住喊出声来。母亲哭了，妹妹也跟着哭起来了。", "“不许乱喊！”法官拿起惊堂木重重地在桌子上拍了一下。", "父亲瞅了瞅我们，没有说一句话。他的神情非常安定，非常沉着。他的心被一种伟大的力量占据着。这个力量就是他平日对我们讲的—他对于革命事业的信心。", "“这是我的妻子。”他指着母亲说。接着他又指了一下我和妹妹：“这是我的两个孩子。”", "“她是你最大的孩子吗？”法官指着我问父亲。", "“是的，我是最大的。”我怕父亲说出哥哥来，就这样抢着说了。我不知道当时哪里来的机智和勇敢。", "“不要多嘴！”法官怒气冲冲的，又拿起他面前那块木板狠狠地拍了几下。", "父亲立刻就会意了，接着说：“她是我最大的孩子。我的妻子是个乡下人，我的孩子年纪都还小，她们什么也不懂，一切都跟她们没有关系。”父亲说完了这段话，又望了望我们。", "法官命令把我们押下去。我们就这样跟父亲见了一面，匆匆分别了。想不到这竟是我们最后一次见面。", "28日黄昏，警察叫我们收拾行李出拘留所。", "我们回到家里，天已经全黑了。第二天，舅老爷到街上去买报。他是哭着从街上回来的，手里无力地握着一份报。我看到报上用头号字登着“李大钊等昨已执行绞刑”，立刻感到眼前蒙了一团云雾，昏倒在床上了。母亲伤心过度，昏过去三次，每次都是刚刚叫醒又昏过去了。", "过了好半天，母亲醒过来了，她低声问我：“昨天是几号？记住，昨天是你爹被害的日子。”", "我又哭了，从地上捡起那张报纸，咬紧牙，又勉强看了一遍，低声对母亲说：“妈，昨天是4月28日。”", "稚避峻啪僻瞅靴魔刑哼绑啃袍押执有感情地"], "tasks": ["默读课文，说说课文按照时间顺序写了哪些事情，给你印象最深的是哪件事。"], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 12, "book": "六年级下册", "unit_no": 4, "unit_name": "第四单元", "title": "为人民服务", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 64, "chars": 989, "paras": ["我们的共产党和共产党所领导的八路军、新四军，是革命的队伍。我们这个队伍完全是为着解放人民的，是彻底地为人民的利益工作的。张思德同志就是我们这个队伍中的一个同志。", "人总是要死的，但死的意义有不同。中国古时候有个文学家叫做司马迁的说过：“人固有一死，或重于泰山，或轻于鸿毛。”为人民利益而死，就比泰山还重；替法西斯卖力，替剥削人民和压迫人民的人去死，就比鸿毛还轻。张思德同志是为人民利益而死的，他的死是比泰山还要重的。", "因为我们是为人民服务的，所以，我们如果有缺点，就不怕别人批评指出。不管是什么人，谁向我们指出都行。只要你说得对，我们就改正。你说的办法对人民有好处，我们就照你的办。“精兵简政”这一条意见，就是党外人士李鼎铭先生提出来的；他提得好，对人民有好处，我们就采用了。只要我们为人民的利益坚持好的，为人民的利益改正错的，我们这个队伍就一定会兴旺起来。", "我们都是来自五湖四海，为了一个共同的革命目标，走到一起来了。我们还要和全国大多数人民走这一条路。我们今天已经领导着有九千一百万人口的根据地，但是还不够，还要更大些，才能取得全民族的解放。我们的同志在困难的时候，要看到成绩，要看到光明，要提高我们的勇气。中国人民正在受难，我们有责任解救他为人民服务", "们，我们要努力奋斗。要奋斗就会有牺牲，死人的事是经常发生的。但是我们想到人民的利益，想到大多数人民的痛苦，我们为人民而死，就是死得其所。不过，我们应当尽量地减少那些不必要的牺牲。我们的干部要关心每一个战士，一切革命队伍的人都要互相关心，互相爱护，互相帮助。", "今后我们的队伍里，不管死了谁，不管是炊事员，是战士，只要他是做过一些有益的工作的，我们都要给他送葬，开追悼会。这要成为一个制度。这个方法也要介绍到老百姓那里去。村上的人死了，开个追悼会。用这样的方法，寄托我们的哀思，使整个人民团结起来。", "有感情地"], "tasks": [], "newchars": ["彻迁泰迫批标牺炊葬"]}, {"grade": "六年级", "term": "下册", "no": 13, "book": "六年级下册", "unit_no": 4, "unit_name": "第四单元", "title": "董存瑞舍身炸暗堡", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 66, "chars": 1068, "paras": ["1948年5月25日，攻城的大炮震撼着整个隆化城，解放隆化的战斗打响了。战士们像潮水一般冲向敌军司令部所在地—隆化中学。嗒嗒嗒……从一座桥上，突然喷出几条火舌，封锁了我军前进的道路。那座桥架在隆化中学墙外的一条旱河上。狡猾的敌人在桥的两侧筑了墙，顶上加了盖，构成了一座暗堡。冲锋的部队被压在一个小土坡下面，抬不起头。冲在最前面的一个战士倒下了。", "董存瑞瞪着敌人的暗堡，两眼迸射出仇恨的火花。他跑到连长身边，坚决地说：“连长，我去炸掉它！”", "“连长，我掩护！”战友郅顺义也恳切地说。", "连长和指导员商量了一下，同意了他们的请求。“同志们，扔手榴弹！”连长给战士们下了命令。", "董存瑞抱起炸药包，郅顺义背起两兜手榴弹，同时跃出战壕，冲了上去。他们互相配合，郅顺义扔一阵手榴弹，董存瑞就向前跃进几步；郅顺义再扔一阵，董存瑞再跃进几步。跟在后面的战友把为了民族解放和人民幸福，无数革命先烈浴血奋战，百折不挠，在革命事业的道路上谱写了壮烈的诗篇。董存瑞就是其中的一位。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 26, "book": "六年级下册", "unit_no": 4, "unit_name": "第四单元", "title": "马诗", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": "唐", "page": 58, "chars": 198, "paras": ["古诗三首注释① 〔燕山〕燕然山。这里借指边塞。", "马  诗[唐] 李 贺大漠沙如雪，燕山月似钩。", "何当金络脑，快走踏清秋。", "粉骨碎身浑不怕，要留清白在人间。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 27, "book": "六年级下册", "unit_no": 4, "unit_name": "第四单元", "title": "石灰吟", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": "唐", "page": 58, "chars": 195, "paras": ["古诗三首注释① 〔燕山〕燕然山。这里借指边塞。", "马  诗[唐] 李 贺大漠沙如雪，燕山月似钩。", "何当金络脑，快走踏清秋。", "粉骨碎身浑不怕，要留清白在人间。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 28, "book": "六年级下册", "unit_no": 4, "unit_name": "第四单元", "title": "竹石", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": null, "page": 59, "chars": 182, "paras": ["感情地"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 14, "book": "六年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "文言文二则", "section": "阅读", "domain": "reading", "genre": "文言文", "author": null, "dynasty": null, "page": 80, "chars": 311, "paras": ["文言文二则学  弈弈秋②，通国③之善弈者也。使弈秋诲二人弈，其一人专心致志，惟弈秋之为听④；一人虽听之，一心以为有鸿鹄hú ⑤将至，思援⑥弓缴⑦而射之。虽与之⑧俱学，弗若⑨之矣。", "为⑩是其智弗若与？曰：非然也。", "弈，下棋。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 15, "book": "六年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "真理诞生于一百个问号之后", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 82, "chars": 2760, "paras": ["真理诞生于一百个问号之后有人说过这样一句话：真理诞生于一百个问号之后。其实，这句话本身就是一个真理。", "纵观千百年来的科学技术发展史，那些在科学领域有所建树的人，都善于从细微的、司空见惯的现象中发现问题，不断发问，不断解决疑问，追根求源，最后把“？”拉直变成“！”，找到真理。", "波义耳是17世纪英国著名的化学家。一天，他急匆匆地向自己的实验室走去，路过花圃时，阵阵醉人的香气扑鼻而来，他这才发现花圃里的花已经开了。他摘下几朵紫罗兰插入一个盛水的烧瓶中，然后开始和助手们做实验。不巧的是，盐酸溅到了紫罗兰的花瓣上。爱花的波义耳急忙把冒烟的紫罗兰冲洗了一下，重新插入花瓶中。谁知过了一会儿，溅上盐酸的花瓣竟奇迹般地变红了。波义耳立即敏锐地意识到，紫罗兰中有一种物质遇到盐酸会变红。那么，这种物质到底是什么？别的植物中会不会有同样的物质？别的酸对这种物质会有什么样的反应？这一奇怪的现象以及一连串的问题，促使波义耳进行了许多实验。由此他发现，大部分花草受酸或。", "碱的作用都会改变颜色，其中以从地衣类生物—石蕊中提取的紫色浸出液最明显：它遇酸变成红色，遇碱变成蓝色。利用这一特点，波义耳制成了实验中常用的石蕊试纸，用来检测溶液的酸碱性。从那以后，这种试纸一直被广泛应用于化学实验中。", "这样的事情不止一例。20世纪初的一天，德国地球物理学家魏格纳正无聊地看着墙上的世界地图，突然发现南美洲东海岸的凸出部分与非洲西海岸的凹陷部分，竟然不可思议地互相吻合！魏格纳被自己偶然的发现惊呆了。这不会是一种巧合吧？他将地图上的一块块陆地作了比较，结果发现，从海岸线的情形看，地球上所有的大陆都能较好地吻合在一起。魏格纳开始认真地研究这个有趣的现象，他阅读了大量的相关文献，同时搜集古生物学方面的证据。他注意到，一位名叫米歇尔逊的生物学家发现，在美国东海岸有一种蚯蚓，欧洲西海岸的同纬度地区也有这种蚯蚓，而在美国西海岸却没有这种蚯蚓。魏格纳认为，这种蚯蚓的分布情况正说明，亚欧大陆与美洲大陆本来是连在一起的，否则，蚯蚓即使是插上翅膀也难以飞渡重洋。1915年，魏格纳系统整理了他的“大陆漂移说”，出版了《海陆的起源》一书，在地质学界产生了重大影响。", "更有趣的是一位名叫阿瑟林斯基的俄裔美国睡眠研究专家。一次，他发现儿子在睡觉的时候，眼珠忽然转动起来。他感到很奇怪：为什么睡觉时眼珠会转动？这会不会与做梦有关？会有什么关系呢？阿瑟林斯基带着一连串的疑问，对自己八岁的儿子进行了实验，结果表明：脑电波的变化与做梦有关。接着，他又对二十名成年人进行了反复的观察实验，最后得出结论：睡眠中眼珠快速转动的时候，人的脑电波也会发生较大的变化，这是人最容易做梦的阶段。阿瑟林斯基的研究成果，成为心理学家研究做梦的重要依据。", "在科学史上，这样的事例还有很多，这说明科学并不神秘，真理并不遥远。只要你见微知著，善于发问并不断探索，那么，当你解决了若干个问题之后，就有可能发现真理。", "当然，见微知著、善于发问并不断探索的能力，不是凭空产生的。正像数学家华罗庚说过的，科学的灵感，绝不是坐等可以等来的。如果说科学领域的发现有什么偶然的机遇的话，那么这种“偶然的机遇”只会给那些善于独立思考的人，给那些具有锲而不舍精神的人。", "为了证明自己的观点，作者列举了哪几个事例？每个事例是按照怎样的顺序写的？"], "tasks": ["默读课文，想想“真理诞生于一百个问号之后”这句话的含义，再说说你从中受到了什么启发。"], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 16, "book": "六年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "表里的生物", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 87, "chars": 1393, "paras": ["表里的生物我小时候住在一座小城里，城里没有工厂，所以也没有机器的声音。我那时以为凡能发出声音的，都是活的生物。早晨有鸟叫得很好听，夜里有狗吠得很怕人，夏天蝉在绿树上叫，秋晚有各种的虫在草丛中唱不同的歌曲。钟楼上的钟不是活的，有时却洪亮地响起来，那是有一个老人在敲；街心有时响着三弦的声音，那是一个盲人在弹。哪里有死的东西会自己走动，并且能自动地发出和谐的声音呢？", "可是父亲怀里的表有时放在桌子上，不但它的秒针会自己走动，而且它坚硬的表盖里还会发出清脆的声音：嘀嗒，嘀嗒……没有一刻的休息，这声音比蝉鸣要柔和些，比虫的歌曲要单调些。", "一天，我对父亲说：“我爱听这表的声音。”", "我一边说一边向着表伸出手去。父亲立刻把我的手拦住了，他说：“只许听，不许动。”", "停了一会儿，他又添上一句：“小孩儿不许动表。”", "他这么说，就更增加了表的神秘。“不许动”，里边该是什么东西在响呢？我对于它的好奇心一天比一天增加。树上的蝉，草里的虫，都不会轻易被人看见，我想：表里边一定也有一个蝉或虫一类的生物吧，这生物被父亲关在表里，不许小孩子动。", "越不许我动，我越想动，但是我又不敢，因此很痛苦。这样过了许多天。父亲一把表放在桌子上，我的眼睛就再也离不开它。有一次，父亲也许看我的样子太可怜了，也许自己有什么高兴的事，他对我笑着说：“你来，我给你看看表里是什么在响，可是只许看，不许动。”", "没有请求，父亲就自动给我看，我高兴极了，同时我的心也加速跳动。父亲取出一把小刀，把表盖拨开，我的面前立即呈现出一个美丽的世界：蓝色的、红色的小宝石，钉住几个金黄色的齿轮，里边还有一个小尾巴似的东西不停地摆来摆去。这小世界不但被表盖保护着，还被一层玻璃蒙着。我看得入神，唯恐父亲再把这美丽的世界盖上。但是，过了一会儿，父亲还是把表盖上了。父亲的表里边真是好看。", "此后我就常常请求父亲把他的表打开给我看，有时父亲答应我，有时也拒绝我，这要看他高兴不高兴。有一回，父亲又把表打开了，我问：“为什么还蒙着一层玻璃呢？”", "“这就是叫你只许看，不许动。”父亲回答。", "“为什么呢？”我又问。", "“这摆来摆去的是一个小蝎子的尾巴，一动就要蜇你。”", "我吓了一跳，蝎子是多么丑恶而恐怖的东西，为什么把它放在这样一个美丽的世界里呢？但是我也感到愉快，证实我的猜测没有错：表里边有一个活的生物。我继续问：“为什么把那样可怕的东西放在这么好的表里？”", "父亲没有回答。我只想，大半因为它有好听的声音吧。但是一般的蝎子都没有这么好听的声音，也许这里边的蝎子与一般的不同。", "后来我见人就说：“我有蟋蟀在钵子里，蝈蝈在葫芦里，鸟儿在笼子里，父亲却有一个小蝎子在表里。”", "这样的话我不知说了多久，也不知道到什么时候才不说了。"], "tasks": ["默读课文，联系课题，说说课文写了一件什么事。"], "newchars": ["吠脆拦恶蟋蟀"]}, {"grade": "六年级", "term": "下册", "no": 17, "book": "六年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "他们那时候多有趣啊", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 90, "chars": 1498, "paras": ["那天晚上，玛琪甚至把这件事记在自己的日记里了。在2155年5月17日这一天，她写道：“今天，托米发现了一本真正的书！”", "这是一本很旧的书。玛琪的爷爷有一次告诉过她，当他还是一个小孩子的时候，他的爷爷对他讲，曾经有那么一个时候，所有的故事都是印在纸上的。", "玛琪和托米翻着这本书，书页已经发黄，皱皱巴巴的。他们读到的字全都静止不动，不像他们通常在荧光屏上看到的那样，顺序移动。真是有趣极了，你说是不是？读到后面，再翻回来看前面的一页时，刚刚读过的那些字仍然停留在原地。", "玛琪问：“你在哪儿找到这本书的？”", "“在我们家。”托米指了一下，可并没有抬起头，因为他正在全神贯注地看书。“在顶楼上。”他又说。", "“书里写的什么？”", "“学校。”", "玛琪脸上露出鄙夷不屑的神情：“学校？学校有什么好写的？", "我讨厌学校。”玛琪一向讨厌学校里的机器老师，可现在她比以往任何时候都更憎恶它。那个机器老师一次又一次地给她做地理测本文作者是美国的艾萨克·阿西莫夫，译者高萍，选作课文时有改动。", "用较快的速度默读这篇科幻小说，看看在作者的想象中，未来的上学方式和今天有什么不同。再大胆想象一下，未来的学习生活还有可能是什么样的？", "*验，她一次比一次答得糟，最后她的妈妈发愁地摇了摇头，把教学视察员找了来。", "视察员把机器老师调好以后，拍拍玛琪的脑袋，笑着对她妈妈说：“这不是小姑娘的错，琼斯太太。我认为是这个机器里的地理部分调得太快了一些，这种事是常有的。我把它调慢了，已经适合十岁左右孩子们的水平了。说实在的，她总的学习情况够令人满意了。”说着，他又拍了拍玛琪的脑袋。", "玛琪失望极了，她本来希望他把这个机器老师拿走，他们有一次就把托米的老师搬走了将近一个月之久，因为历史那部分的装置完全显示不出图像了。", "所以她对托米说：“怎么会有人写学校呢？”", "托米非常高傲地瞧了她一眼：“因为那不是我们这种类型的学校，傻瓜。那是几百年前的那种老式学校。”接着他一字一顿地说：“几世纪前。”", "玛琪很难过。“嗯，我不知道古时候他们有什么样的学校。”她从他肩膀后面看了一会儿那本书，开口说，“不管怎么说，他们得有一个老师吧？”", "“当然，他们有个老师，可不是我们这样的老师。是一个真人！”", "“一个真人？真人怎么会是老师呢？”", "“是这样的，他只不过给孩子们讲讲课，留些作业，提提问题。”", "“真人可没那么聪明。”", "“当然聪明啦。我爸爸就和我的机器老师知道得一样多。”", "玛琪不打算争吵下去，便说：“我可不想让一个陌生人到我家里来教我功课。”", "托米尖声大笑。“你不知道的事太多了，玛琪。那些老师才不到你家里来上课呢。他们有一个专门的地方，所有的孩子都到那儿去上学。”", "“所有的孩子都学一样的功课吗？”", "“那当然，如果他们的年龄一样的话。”", "“可我妈妈说，一个老师是需要调整的，好适合他所教的每个孩子的智力。另外，对每个孩子的教法都应该是不同的。”", "“他们那时候恰好不是那么做的。如果你不喜欢书里说的这些事，你就干脆别读这本书。”", "“我没说我不喜欢。”玛琪急忙说。她很想知道那些有趣的学校是怎么回事。", "他们还没看完一半，玛琪的妈妈就喊了起来：“玛琪！该上课了！”", "玛琪叹了口气，去上课了。她脑子里还在想着当她爷爷的爷爷是个小孩子的时候，他们上的那种老式学校。附近所有的孩子都到一处去上学，他们在校园里笑啊，喊啊，他们一起坐在课堂里上课；上完一天的课，就一块儿回家。他们学的功课都一样，这样，在做作业的时候他们就可以互相帮助，有问题还可以互相讨论。", "而且他们的老师是真人……", "机器老师正在屏幕上显现出这样的字：“我们把和这两个分数加在一起……”", "玛琪想，在过去的日子里，那些孩子一定非常热爱他们的学校。她想，他们那时候多有趣啊！"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 35, "book": "六年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "学弈", "section": "阅读", "domain": "reading", "genre": "文言文", "author": null, "dynasty": null, "page": 80, "chars": 311, "paras": ["文言文二则学  弈弈秋②，通国③之善弈者也。使弈秋诲二人弈，其一人专心致志，惟弈秋之为听④；一人虽听之，一心以为有鸿鹄hú ⑤将至，思援⑥弓缴⑦而射之。虽与之⑧俱学，弗若⑨之矣。", "为⑩是其智弗若与？曰：非然也。", "弈，下棋。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 36, "book": "六年级下册", "unit_no": 5, "unit_name": "第五单元", "title": "两小儿辩日", "section": "阅读", "domain": "reading", "genre": "文言文", "author": null, "dynasty": null, "page": 81, "chars": 475, "paras": ["孔子东游，见两小儿辩斗②，问其故。", "一儿曰：“我以③日始出时去人近，而日中④时远也。”", "一儿曰：“我以日初出远，而日中时近也。”", "一儿曰：“日初出大如车盖⑤，及⑥日中则如盘盂yú ⑦，此不为远者小而近者大乎？”", "一儿曰：“日初出沧沧凉凉⑧，及其日中如探汤⑨，此不为近者热而远者凉乎？”", "孔子不能决也。", "两小儿笑曰：“孰shú⑩为汝多知乎？”", "这里比喻天气很热。汤，热水。", "正确、流利地"], "tasks": [], "newchars": ["援俱弗辩"]}, {"grade": "六年级", "term": "下册", "no": 1, "book": "六年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "采薇（节选）", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 111, "chars": 210, "paras": ["采 薇（节选）昔我往矣，杨柳依依。", "今我来思，雨雪霏霏。", "行道迟迟，载渴载饥。", "我心伤悲，莫知我哀！"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 2, "book": "六年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "送元二使安西", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": "唐", "page": 112, "chars": 133, "paras": ["送元二使安西[唐] 王 维渭城朝雨浥轻尘，客舍青青柳色新。", "劝君更尽一杯酒，西出阳关无故人。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 3, "book": "六年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "春夜喜雨", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": "唐", "page": 113, "chars": 170, "paras": ["成都曾经是主持织锦的官员的官署所在地，所以叫“锦官城”。", "春夜喜雨[唐] 杜 甫好雨知时节，当春乃发生。", "随风潜入夜，润物细无声。", "野径云俱黑，江船火独明。", "晓看红湿处，花重锦官城。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 4, "book": "六年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "早春呈水部张十八员外", "section": "阅读", "domain": "reading", "genre": "古诗", "author": null, "dynasty": "唐", "page": 114, "chars": 158, "paras": ["早春呈水部张十八员外[唐] 韩 愈天街小雨润如酥，草色遥看近却无。", "最是一年春好处，绝胜烟柳满皇都。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 5, "book": "六年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "江上渔者", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "范仲淹江", "dynasty": "宋", "page": 115, "chars": 51, "paras": ["江上渔者[宋] 范仲淹江上往来人，但爱鲈鱼美。", "君看一叶舟，出没风波里。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 6, "book": "六年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "泊船瓜洲", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "王安石京", "dynasty": "宋", "page": 116, "chars": 109, "paras": ["泊船瓜洲[宋] 王安石京口瓜洲一水间，钟山只隔数重山。", "春风又绿江南岸，.明月何时照我还。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 7, "book": "六年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "游园不值", "section": "阅读", "domain": "reading", "genre": "古诗", "author": "叶绍翁应", "dynasty": "宋", "page": 117, "chars": 156, "paras": ["值，遇到。", "游园不值[宋] 叶绍翁应怜屐齿印苍苔，小扣柴扉久不开。", "春色满园关不住，一枝红杏出墙来。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 8, "book": "六年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "卜算子·送鲍浩然之浙东", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 118, "chars": 200, "paras": ["卜算子·送鲍浩然之浙东[宋] 王 观水是眼波横③，山是眉峰聚④。欲问行人去那⑤边？眉眼盈盈处⑥。    才始⑦送春归，又送君归去。若到江南赶上春，千万和春住。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 9, "book": "六年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "浣溪沙", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 119, "chars": 240, "paras": ["浣溪沙[宋] 苏 轼游蕲水②清泉寺，寺临兰溪③，溪水西流。", "山下兰芽短浸溪④，松间沙路净无泥。萧萧⑤暮雨子规⑥啼。    谁道人生无再少⑦？门前流水尚能西！休将白发唱黄鸡⑧。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 10, "book": "六年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "清平乐", "section": "阅读", "domain": "reading", "genre": "课文", "author": "黄庭坚春", "dynasty": null, "page": 120, "chars": 117, "paras": ["清平乐[宋] 黄庭坚春归何处？寂寞无行路①。", "若有人知春去处，唤取归来同住。", "春无踪迹谁知？除非问取黄鹂。百啭②无人能解，因风飞过蔷薇。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 44, "book": "六年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "回忆往事", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 98, "chars": 2332, "paras": ["综合性学习：难忘小学生活不久以后，我们就要告别美丽的校园，告别朝夕相处的老师、同学，带着依依不舍的深情，跨入新的学校，开始新的学习生活。", "临近毕业之际，让我们围绕“难忘小学生活”这个主题，开展一次综合性学习活动，向师友、向母校告别。", "在回忆的基础上，采用各种形式，把师生情、同学情以及对母校的感激之情表达出来，并永久珍藏。“阅读材料”供参考。", "填写时间轴借助时间轴回忆六年的小学生活，记录值得我们细细回味的点点滴滴。可以把印象最深的人或事填写在相应的时间点上，还可以把照片贴在旁边。", "分享难忘回忆选取时间轴上有代表性的内容与同学分享，如，令人难忘的集体活动，舍不得的人，有特殊意义的物品，或者一两个关于成长的关键词。", "活动建议制作成长纪念册一起回忆了小学生活之后，用心制作一本成长纪念册，珍藏这段难忘的成长记忆。", "老师领进门1942年正月新春，我不满六周岁，就到邻村小学读书。", "这个小学坐落在关帝庙的后殿，只有一位老师，教四个年级。四个年级四个班，四个班只有四十人。", "老师姓田，十七岁就开始了小学教师生涯，执教四十年，桃李满门，弟子不下三千。", "田老师很有口才，文笔也好。", "开学头一天，我们排队进入教室。每个一年级小学生，配备一个三年级的学兄带笔。田老师先给二年级和四年级学生上课，让三年级的学兄把着一年级学弟的小手，描红摹纸。", "红摹纸上，一首小诗：一去二三里，烟村四五家。", "亭台六七座，八九十枝花。", "轮到给一年级上课时，田老师先把这首诗念一遍，串讲一遍，然后，以这四句诗为内容，编出一段故事，讲得娓娓动听。", "我还记得，故事的大意是：一个小孩儿，牵着妈妈的衣襟儿，去姥姥家，一口气走出了二三里。娘儿俩路过一个小村子，只有四五户人家，正在做午饭，家家冒炊烟。两个人走累了，看见路边有六七座亭子，就走过去歇脚。亭子外边，花开得茂盛，小孩儿越看越喜爱，伸出指头点数，嘴里念叨着“……八枝，九枝，十枝”。他想折下一枝来，戴在耳朵上，把自己打扮得像个迎春小喜神儿。他刚要动手，妈妈喝住他，说：“你折一枝，他折一枝，后边歇脚的人就不能看景了。”小孩儿听了妈妈的话，就缩回了手。后来，花越开越多，数也数不过来了，此地就变成。", "阅读材料一座大花园……", "我听得入迷，恍如身临其境，田老师的话戛然而止，我却仍在发呆，直到三年级的学兄捅了我一下，我才惊醒。", "那时候，田老师每讲一课，都要编一个引人入胜的故事，一、二、三、四年级的课文都是如此。我在田老师门下受业四年，听到上千个故事，有如春雨点点入地。", "从事文学创作需要丰富的想象力，在这方面田老师培育了我，给我开了窍。", "我回家乡去，在村边、河畔、堤坡，遇到田老师拄杖散步，仍然像四十年前的一年级小学生那样，恭恭敬敬地向他行礼。谈起往事，我深深感谢他在我那幼小的心田上，播下了文学的种子。老师摇摇头，说：“这不过是无心插柳柳成荫啊！”", "十年树木，百年树人；插柳之恩，终生难忘。", "作文上的红双圈1972年的5月，我正上高二。学校里举办“红五月”征文比赛，我投了稿，是一篇很长的作文，题目叫“补考”。", "一天上午，我们正在操场劳动，有同学跑过来告诉我：“获奖征文在报栏里贴出来了，有你的！上面打满了红双圈。”那时候，老师们批阅作文，喜欢在认为最好的词句下面画红双圈。我很兴奋，立刻就想去看看，却又矜持，不愿在同学面前显出我的迫不及待。挨到中午，校园里寂静无人时，我像做贼一样地溜到报栏前，傻乎乎地笑着，独自欣赏我的打满了红双圈的作文。我的心怦怦跳着，从头到尾一个个数下来，一共是九十八个红双圈。这就是语文老师给我的评价。", "带着红双圈的作文在报栏里贴了很久。一天，县文化馆的同志来到学校，看见了报栏里的这篇作文，就揭下来带走了。不久，我的作文刊登在了县办刊物上。县办刊物送到扬州地区，被地区刊物选中，第二次发表。几经周转，次年，《补考》竟发表在上海一家出版社的正式刊物上。", "那时，我已经下乡插队。父亲鼓励我：既有一，何不能有二？于是，我就接着“折腾”，陆续发表了很多小说，成了作家。", "没有当年作文上的九十八个红双圈，会有我今天的一切吗？人生有无数条轨道可走，之所以选择了其中的一条，是偶然，更是必然。", "永远感谢我的老师，感谢母校的报栏，感谢挂在我生命之树上的红双圈。", "如何制作成长纪念册一、收集、筛选成长资料选出最能反映你小学生活的有代表性的资料。如：◇有纪念意义的照片◇与成长相关的习作、书法、美术作品等◇各种获奖证书、奖牌（复印件或照片）◇老师和同学的寄语、祝福……", "快速浏览收集到的资料，筛选出可以用来制作成长纪念册的内容。", "二、根据需要，给收集的资料分类想想怎样给收集的资料分类，才能更好地呈现在成长纪念册中。可以采用“编年体”的方式制作成长纪念册，把小学六年的学习生活一年一年地展示出来；也可以采用“栏目式”，按照不同的栏目把内容分成几个部分。", "你也可以按照自己的想法从其他角度进行分类。", "栏目式发展足迹多彩生活才艺集萃班级之最毕业赠言编年体一年级——我上学了二年级——我进步了三年级——我长大了四年级——我学会了五年级——我做到了六年级——我毕业了三、编排成长纪念册一般来说，成长纪念册分为封面、扉页、正文等几个部分。怎样编排成长纪念册呢？", "1．给成长纪念册取一个贴切的名字，设计个性化的封面。", "2．扉页为“卷首语”或“成长感言”，可以自己写，也可以请老师或家长写。", "3．正文内容按照一定顺序编排，呈现的方式多种多样，如，每张照片配以简短、有趣的文字介绍，每个部分加一个合适的小标题。", "有的资料不能直接拿来就用，还需要进行修改。如，有的文章太长，可以从中节选一段最有价值的。", "制作成长纪念册，最好能表现出你的独特个性和创意。"], "tasks": [], "newchars": []}, {"grade": "六年级", "term": "下册", "no": 45, "book": "六年级下册", "unit_no": 6, "unit_name": "第六单元", "title": "依依惜别", "section": "阅读", "domain": "reading", "genre": "课文", "author": null, "dynasty": null, "page": 105, "chars": 2588, "paras": ["在毕业之前，开展以下活动，为自己的小学生活画上一个圆满的句号。“阅读材料”供参考。", "举办毕业联欢会通过文艺表演的形式，表达对师友、对母校的惜别之情。如，把小学生活中令人难忘的事情改编成小品演一演；朗诵临别赠言或与毕业有关的诗歌；以歌舞的形式表达对校园的留恋。", "为了办好联欢会，我们要先作好策划，写一份策划书。根据分工认真准备，以便在联欢会上有精彩的展示。", "毕业联欢会活动策划书活动名称  “再见了，母校”毕业联欢会活动目的感恩母校，感谢师友，告别小学生活活动时间6月29日活动地点阶梯教室活动分工节目统筹：会场布置：道具准备：主持与串词撰写：秩序维护：场地清洁：活动报道：分工职责要明确。", "活动建议活动流程1.  毕业演讲2.  节目表演3.  交换毕业赠言节目单1.  放飞梦想（师生集体诗朗诵）2.  高山流水（古筝独奏）3.  最美好的回忆（歌曲联唱）4.  孔雀舞（民族舞）5.  团结就是力量（游戏）6.  感恩的心（集体歌舞）7.  依依惜别情（诗朗诵）8.  心有灵犀猜成语（游戏）9.  谁是最可爱的人（相声）10. 老师寄语活动流程要清楚。", "可以给老师或同学写一封信，回忆共同度过的美好时光，表达深切的感恩之情。", "可以给母校写一封信，提出中肯的建议，期许美好的未来。", "还可以给自己写一封信，展望将来的自己，放飞纯真的梦想。", "写完之后，把这封信“贮藏”起来，将来某一时刻再“开封”，相信那时候的你读到这封信，一定会有很多感动和怀念。", "本诗作者何其芳。", "我为少男少女们歌唱我为少男少女们歌唱。", "我歌唱早晨，我歌唱希望，我歌唱那些属于未来的事物，我歌唱正在生长的力量。", "我的歌呵，你飞吧，飞到年轻人的心中去找你停留的地方。", "所有使我像草一样颤抖过的快乐或者好的思想，都变成声音飞到四方八面去吧，不管它像一阵微风或者一片阳光。", "轻轻地从我琴弦上失掉了成年的忧伤，我重新变得年轻了，我的血流得很快，对于生活我又充满了梦想，充满了渴望。", "阅读材料聪明在于学习，天才在于积累—华罗庚1956年在北京大学的演讲有的人在工作、学习中缺乏耐性和韧性，他们一旦碰了钉子，走了弯路，就开始怀疑自己是否有研究才能。其实，我可以告诉大家，许多有名的科学家和作家，都是经过很多次失败，走过很多弯路才成功的。有人看见一个作家写出一本好小说，或者看见一个科学家发表几篇有分量的论文，便仰慕不已，很想自己能够信手拈来，妙手成章，一觉醒来，誉满天下。其实，成功的作品和论文只不过是作家、学者们整个创作和研究中的极小部分，甚至数量上还不及失败作品的十分之一。大家看到的只是他们成功的作品，而失败的作品是不会公开发表出来的。", "要知道，一个科学家在攻克科学堡垒的长征中，失败的次数和经验，远比成功的经验要丰富、深刻得多。失败虽然不是什么令人快乐的事情，但也决不应该因此气馁。在进行研究时，研究方向不正确，走了些岔路，白费了许多精力，这也是常有的事。但不要紧，可以再调换方向进行研究。更重要的是要善于吸取失败的教训，总结已有的经验，再继续前进。", "根据我自己的体会，所谓天才，就是坚持不断的努力。有些人也许觉得我在数学方面有什么天分，其实从我身上是找不到这种天分的。我读小学时，因为成绩不好，没有拿到毕业证书，只拿到一张修业证书。初中一年级时，我的数学也是经过补考才及格的。但是说来奇怪，从初中二年级以后，我就发生了一个根本转变，因为我认识到既然我的资质差些，就应该多用点儿时间来学习。别人学一小时，我就学两小时，这样，我的数学成绩得以不断提高。", "一直到现在我也贯彻这个原则：别人看一篇东西要三小时，我就花三个半小时。经过长期积累，就多少可以看出成绩来。并且在基本技巧烂熟之后，往往能够一个钟头就看懂一篇人家看十天半月也解不透的文章。所以，前一段时间的加倍努力，在后一段时间能收到预想不到的效果。", "是的，聪明在于学习，天才在于积累。", "给家乡孩子的信亲爱的同学们：谢谢你们写信给我，一大堆信！我数了数，一共四十封，好像你们都站在我面前，争先恐后，讲个不停，好不热闹！家乡的孩子们，感谢你们给我这个老人带来温暖。", "请原谅我今年不能回家乡，并不是我不愿意看望你们，正相反，我多么想看见你们天真的笑脸，多么想听见你们歌唱般的语声，但是我没有体力和精力支持这样一次长途的旅行，那么就让这封信代替我同你们见面吧。", "不要把我当作什么杰出人物，我只是一个普通人。我写作不是我有才华，而是我有感情，对我的祖国和同胞我有无限的爱，我用作品表达我的这种感情。我今年八十七岁，今天回顾过去，说不上失败，也谈不到成功，我只是老老实实、平平凡凡地走了这一生，我思索，我追求，我终于明白生命的意义在于奉献，而不在于享受。我在回答和平街小学同学们的信中说：“我愿意再活一次，重新学习，重新工作，让我的生命开花结果。”有人问我生命开花是什么意思，我说：“人活着不是为了白吃干饭，我们活着就要给我们生活在其中的社会添上一点光彩。这个我们办得到，因为我们每个人都有更多的爱，更多的同情，更多的精力，更多的时间，比维持我们自己的生存所需要的多得多，只有为别人花费了它们，我们的生命才会开花。一心为自己、一生为自己的人什么也得不到。”", "我和别人一样，也希望看到自己生命的开花。但是我不可能再活一次。过去我浪费了不少的光阴，现在我快走到路的尽头，剩下的日子已经不多了。我十分珍惜这有限的一分一秒。", "亲爱的家乡的孩子们，我真羡慕你们。你们前面有无比宽广的道路，你们心里有那么多美好的事物，爱惜你们可以使用的宝贵时间，好好地学习吧，希望在你们身上。", "我真诚地祝福你们。", "巴金五月十五日。", "毕业赠言给老师六个春秋我们在一起，每一次游戏，每一次辩论……都让我回味无穷。", "它们将化作美好的记忆，珍藏在我心中。", "嘿，同桌，记得你说过，你的梦想是遨游太空。愿
