<html lang="zh-Hans"><head><meta charset="utf-8">

<style>
/* ============ 布局：左筛选栏 + 右内容区 ============ */
.wrap { display:grid; grid-template-columns: 240px 260px 1fr; gap: 20px; }
@media (max-width:1100px){ .wrap { grid-template-columns: 200px 1fr; } .filter-col { grid-column:1/-1; } }
@media (max-width:720px) { .wrap { grid-template-columns: 1fr; } }

.filter-col {
  background:#fff; border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; height:fit-content; position:sticky; top:16px;
  max-height: calc(100vh - 32px); overflow-y:auto;
}
.filter-col h4 {
  font-size:11px; letter-spacing:.08em; color:var(--muted);
  text-transform:uppercase; margin:12px 0 6px; font-weight:700;
}
.filter-col h4:first-child { margin-top:0; }
.filter-col label.chk {
  display:flex; align-items:center; gap:6px;
  padding:2px 0; font-size:13px; color:var(--ink); cursor:pointer;
}
.filter-col label.chk input { width:14px; height:14px; accent-color:var(--c); cursor:pointer; }
.filter-col label.chk .hint { color:var(--muted); font-size:11px; margin-left:auto; }
.filter-col .divider { height:1px; background:var(--line); margin:10px 0; }
.filter-col .actions { display:flex; gap:8px; margin-top:12px; }
.filter-col .actions button {
  flex:1; padding:6px 10px; border-radius:6px;
  border:1px solid var(--line); background:#fff; color:var(--ink);
  font-size:12px; cursor:pointer;
}
.filter-col .actions button:hover { border-color:var(--c); color:var(--c); }

.content-col { min-width:0; }
.toolbar {
  display:flex; align-items:center; gap:10px;
  padding:10px 14px; margin-bottom:12px;
  background:#fff; border:1px solid var(--line); border-radius:10px;
}
.toolbar .count { font-size:13px; color:var(--muted); }
.toolbar .count b { color:var(--c); font-weight:700; font-size:15px; }
.toolbar .sort { margin-left:auto; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
.toolbar select {
  height:28px; padding:0 8px; border-radius:6px;
  border:1px solid var(--line); background:#fff; font-size:12px;
}

/* ============ 书目卡片 ============ */
.grid-books {
  display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap:12px;
}
.book {
  background:#fff; border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; cursor:pointer; position:relative;
  transition: border-color .15s, transform .15s, box-shadow .15s;
}
.book:hover { border-color:var(--c); transform:translateY(-1px); box-shadow:0 4px 12px rgba(30,132,73,.08); }
.book .title { font-size:15px; font-weight:700; color:var(--ink); line-height:1.3; }
.book .author { color:var(--muted); font-size:12px; margin-top:2px; }
.book .meta { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
.book .tag {
  display:inline-block; padding:2px 8px; border-radius:999px;
  background:var(--soft); color:var(--c);
  font-size:11px; font-weight:600;
}
.book .tag.t { background:#fef4e6; color:#8a5b0b; }
.book .tag.l { background:#eef3fb; color:#2a4a85; }
.book .tag.g { background:#f0eafa; color:#5a3a8f; }
.book .stat {
  display:flex; gap:12px; margin-top:8px;
  font-size:11px; color:var(--muted);
}
.book .stat span b { color:var(--ink); font-weight:600; }
.book .arrow {
  position:absolute; top:12px; right:14px;
  color:var(--muted); font-size:16px; transition:transform .15s;
}
.book:hover .arrow { transform:translateX(3px); color:var(--c); }

/* ============ 阅读器 ============ */
.reader {
  background:#fff; border:1px solid var(--line); border-radius:12px;
  padding:24px 28px;
}
.reader .back {
  display:inline-flex; align-items:center; gap:6px;
  font-size:13px; color:var(--muted); cursor:pointer;
  padding:4px 10px; border-radius:6px; border:1px solid var(--line); background:#fff;
  margin-bottom:14px;
}
.reader .back:hover { color:var(--c); border-color:var(--c); }
.reader h2.title {
  font-size:24px; color:var(--ink); margin:0 0 4px;
  line-height:1.25; letter-spacing:-.01em;
}
.reader .author { color:var(--muted); font-size:14px; margin-bottom:14px; }
.reader .facets {
  display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;
}
.reader .facets .tag {
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 10px; border-radius:999px;
  background:var(--soft); color:var(--c);
  font-size:12px; font-weight:600;
}
.reader .facets .tag.k { background:#f5f5f5; color:var(--muted); font-weight:500; }
.reader .unitbox {
  background:#fafaf7; border-left:3px solid var(--c); border-radius:6px;
  padding:10px 14px; margin-bottom:16px; font-size:13px;
}
.reader .unitbox .uh { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
.reader .unitbox .ul { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.reader .unitbox .up {
  padding:2px 8px; border-radius:6px;
  background:#fff; border:1px solid var(--line);
  font-size:12px; color:var(--ink);
}
.reader .unitbox .up b { color:var(--c); }

.reader .body {
  font-family: "Georgia","Times New Roman",serif;
  font-size:16px; line-height:1.75; color:#263238;
  padding-top:8px; border-top:1px solid var(--line); margin-top:8px;
  white-space:pre-wrap;
  max-height:65vh; overflow-y:auto;
}
.reader .body p { margin:0 0 14px; }
.reader .body h3 {
  font-family:inherit; font-size:17px; font-weight:700; color:var(--ink);
  margin:20px 0 8px; padding-bottom:4px;
  border-bottom:1px dashed var(--line);
}
.reader .body .chap {
  font-size:12px; color:var(--muted); text-align:center;
  margin:14px 0; letter-spacing:.1em;
}
.reader .body::-webkit-scrollbar { width:8px; }
.reader .body::-webkit-scrollbar-thumb { background:#e5e1d9; border-radius:4px; }

.reader .loading {
  padding:40px; text-align:center; color:var(--muted); font-size:14px;
}
.reader .error {
  padding:20px; text-align:center; color:#a93226; font-size:13px;
  background:#fdecea; border-radius:8px;
}

/* ============ 空态 ============ */
.empty-state {
  padding:60px 30px; text-align:center; color:var(--muted);
  background:#fff; border:1px dashed var(--line); border-radius:12px;
}
.empty-state .big { font-size:36px; margin-bottom:8px; }
.empty-state p { margin:4px 0; font-size:14px; }
</style>
</head>
