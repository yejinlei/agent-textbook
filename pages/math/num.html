 "answer_latex": "", "difficulty": "基础", "page": "练习十四"}, {"name": "练习十四：人体水分摄入", "stem": "人体每天大约需要摄入2500 mL的水分，其中从食物中获得的约为1200 mL，其余的通过饮水获得。（1）从食物中获得的水分占每日需摄水量的百分之多少？（2）饮水获得的水分占每日需摄水量的百分之多少？", "given": "每日需摄水量2500 mL，食物中获得1200 mL。", "ask": "求食物和饮水分别占每日需摄水量的百分比。", "steps": [{"text": "食物水分占比=1200÷2500×100%", "latex": "1200\\div2500\\times100\\%"}, {"text": "计算1200÷2500", "latex": "1200\\div2500=0.48"}, {"text": "化成百分数", "latex": "0.48=48\\%"}, {"text": "饮水水分=2500-1200", "latex": "2500-1200=1300"}, {"text": "饮水占比=1300÷2500×100%", "latex": "1300\\div2500\\times100\\%"}, {"text": "计算1300÷2500", "latex": "1300\\div2500=0.52"}, {"text": "化成百分数", "latex": "0.52=52\\%"}], "answer": "（1）48%；（2）52%", "answer_latex": "48\\%,52\\%", "difficulty": "基础", "page": "练习十四"}, {"name": "练习十四：合唱团人数", "stem": "某小学有480人，有10%的学生参加了合唱团。参加合唱团的有多少人？", "given": "全校480人，参加合唱团占10%。", "ask": "求参加合唱团人数。", "steps": [{"text": "参加人数=总人数×10%", "latex": "480\\times10\\%"}, {"text": "把10%化成小数", "latex": "10\\%=0.1"}, {"text": "计算480×0.1", "latex": "480\\times0.1=48"}], "answer": "48人", "answer_latex": "48", "difficulty": "基础", "page": "练习十四"}], "kb": {"stage": "5-6", "topic": "数与运算", "standard": {"why": "【三会·数学思维】理解算理：知道“为什么这样算”，而不只是会算", "how": "【运算能力】能正确、合理、简洁地进行运算，说得出每一步在做什么", "traps": "【运算能力·推理意识】辨析易错处，能说出道理", "ideas": "【核心素养表现】数学思想：转化、数形结合、分类、模型等", "links": "【知识的结构化】体会知识间的联系，知道从哪来、往哪去", "life": "【应用意识】从真实情境中发现和提出问题（三会·数学眼光）"}, "why": "出手数不同，比命中数不公平；都化成“占100份中的几份”，即百分数，才能公平比较。", "how": [{"s": "看清谁占谁的百分之几", "note": "百分数是两个量的比较"}, {"s": "列式：部分÷整体", "note": "先求占整体的几分之几"}, {"s": "把分数或小数化成百分数", "note": "统一成百分数便于比较"}, {"s": "除不尽时保留三位小数", "note": "教材规定约等处理"}, {"s": "加百分号并写答语", "note": "结果要用百分数表示"}], "traps": [{"type": "概念", "text": "百分数表示一个数是另一个数的百分之几，不是具体数量"}, {"type": "小数点", "text": "小数化百分数小数点右移两位加%，不是左移"}, {"type": "公式混淆", "text": "命中率=命中数÷出手数×100%，不是出手数÷命中数"}, {"type": "约分通分", "text": "除不尽时保留三位小数，不能随意四舍五入到整数"}], "ideas": ["转化", "模型", "类比"], "links": {"before": "会分数、小数的意义与互化，会求一个数是另一个数的几分之几", "after": "百 定，按照一定的比率把集体或个人收入的一部分缴纳给国家。国家用税收发展科学、技术、教育、文化、卫生、环境保护、社会保障和国防等事业。", "每个公民都有依法纳税的义务。", "我们生活中常接触的税收种类主要有消费税、增值税和个人所得税等几类。应缴纳的税款叫作应纳税额，应纳税额与各种收入（销售额、营业额……）中应纳税部分的比率叫作税率。", "3某小规模纳税企业要按应纳税销售额的3 % 缴纳增值税。该企业10 月份的应纳税销售额是30 万元，10 月份应缴纳增值税多少万元？", "30×3 %=0.9（万元）答：10 月份应缴纳增值税0.9 万元。", "做一做", "李阿姨某月工资中应纳税的部分为2500 元，需要按3 % 的税率缴纳工资薪金个人所得税。该月她应缴工资薪金个人所得税多少元？", "人们常常把节约下来或暂时不用的钱存入银行，我们把这称为储蓄。", "储蓄不仅可以使个人钱财更安全，并增加一些收入，还可以支援国家建设。", "在银行存款的方式有多种，如活期、整存整取、零存整取等。存入银行的钱叫作本金；取款时银行多支付的钱叫作利息；单位时间（如1 年、1 月、1 日等）内利息与本金的比率叫作利率。利息的计算公式是：", "银行的利率有时会随着国家经济的发展而变动。下面是中国人民银行2015 年10 月23 日公布的存款基准利率。", "4王奶奶把5000 元按整存整取存入银行，存二年定期，年利率为2.10 %。到期时连本带息取出，王奶奶可以取出多少钱？", "小明的解法：小丽的解法：", "答：王奶奶可以取出5210 元。", "做一做", "张爷爷把8000 元存入银行，存期为三年定期，年利率为2.75 %。到期支取时，张爷爷可得多少利息？到期时，张爷爷一共能取出多少钱？", "5某品牌的裙子搞促销活动，在A 商场打五五折销售，在B 商场按“每满100 元减50 元”销售。妈妈要买一条该品牌标价230 元的裙子。", "（1）在A、B 两个商场买，各应付多少钱？", "（2）选择哪个商场更省钱？", "阅读与理解“每满100元减50元”就是在总价中取整百元部分，每知道了……个100 元减去50 元；不满要解决的问题是……100元的零头部分不优惠。", "分析与解答在A 商场买，直接用总价乘在B 商场买，先看总价中有几55 % 就能算出实际花费。个100，230 里有2 个100；", "然后从总价中减去2 个50 元。", "=126.5（元）=130（元）回顾与反思看来买230元的东西，每满100元减50元不如打五五折实惠。", "答：在A 商场买应付126.5 元，在B 商场买应付130 元；选择A 商场更省钱。", "做一做", "某品牌的运动鞋搞促销活动，在A 商场按“每满100 元减40 元”销售，在B 商场打六折销售。妈妈准备给小丽买一双该品牌标价120 元的运动鞋，在A、B 两个商场买，相差多少钱？", "练习二", "晚8：00 以后", "（1）打折后，每种面包各多少元？", "（2）晚8：00 以后，玲玲拿了10 元去买面包，她可以怎样买？", "2晓风的爸爸妈妈去买新家具，他们选中了图中的4 种家具。打折后，4 种家具分别应付多少钱？", "3书店的图书凭优惠卡购买可打八折，小明用优惠卡买了一套书，省了9.6元。这套书原价多少钱？", "4某县前年秋粮产量为48 万吨，去年比前年增产二成。去年秋粮产量是多少万吨？", "5某汽车公司2 月份出口汽车1.3 万辆，比上月增长三成。1 月份出口汽车多少万辆？", "6妈妈买了一瓶售价为200 元的化妆品，其中消费税占售价的15 %。妈妈为此支付消费税多少元？", "7小明的爸爸得到一笔3000元的劳务报酬，其中800元是免税的，其余部分要按20 %的税率缴税。这笔劳务报酬一共要缴税多少元？", "8百货大楼搞促销活动，甲品牌鞋每满200 元减100 元，乙品牌鞋“折上折”，就是先打六折，在此基础上再打九五折。如果两个品牌都有一双标价220 元的鞋，买哪个品牌更便宜？", "9爸爸想在网上书店买书，A 店打七折销售，B 店每满69 元减19 元。如果爸爸想买的书标价为80 元，在A、B 两个书店买，各应付多少元？相差多少钱？", "10妈妈有1 万元，有两种理财方式：一种是买三年期国债，年利率3.35 %；", "另一种是买银行一年期理财产品，预期年收益率3.6 %，每年到期后可连本带息继续购买下一年的理财产品。如果理财产品的预期年收益率能够实现，3 年后，两种理财方式的收益相差多少？", "112021 年我国液晶电视机产量为17424.3 万台，比2020 年增长-9.5 %。", "2020 年我国液晶电视机产量为多少万台？（得数保留一位小数。）"
