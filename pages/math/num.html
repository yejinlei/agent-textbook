说下面的百分数表示的意思", "stem": "说说下面的百分数表示的意思。（1）某工厂超额完成生产任务，实际产量是计划产量的112%。（2）人类的泪腺会分泌泪液。泪液中98.2%是水，其余为盐和蛋白质等其他物质。（3）有一台磨粉机产能稳定，磨出的面粉质量是小麦总质量的75%。", "given": "（1）实际产量是计划产量的112%；（2）泪液中98.2%是水；（3）面粉质量是小麦总质量的75%。", "ask": "分别说明这些百分数表示什么意思。", "steps": [{"text": "理解百分数表示一个数是另一个数的百分之多少", "latex": "112\\%"}, {"text": "说明实际产量是计划产量的112%", "latex": "112\\%"}, {"text": "说明泪液中水占98.2%", "latex": "98.2\\%"}, {"text": "说明面粉质量占小麦总质量的75%", "latex": "75\\%"}], "answer": "（1）实际产量是计划产量的112%；（2）泪液中水占98.2%；（3）面粉质量占小麦总质量的75%。", "answer_latex": "", "difficulty": "基础", "page": "做一做"}, {"name": "做一做：小明用绿豆发绿豆芽", "stem": "小明试着用绿豆发绿豆芽，下面是他进行的4次试验情况。（1）想一想：发芽率表示什么意思？（2）把表格补充完整。哪一次的发芽率最高？", "given": "4次试验的种子数、发芽数、发芽率部分数据。", "ask": "（1）发芽率表示什么意思；（2）补充表格并判断哪一次发芽率最高。", "steps": [{"text": "发芽率表示发芽数占种子数的百分之多少", "latex": "发芽率=发芽数\\div种子数\\times100\\%"}, {"text": "根据已知数据计算各次发芽率", "latex": "发芽率=发芽数\\div种子数\\times100\\%"}, {"text": "比较各次发芽率，找出最高的一次", "latex": ""}], "answer": "发芽率表示发芽数占种子数的百分之多少；发芽率最高的一次为发芽率最大的那次。", "answer_latex": "", "difficulty": "基础", "page": "做一做"}, {"name": "做一做：把下面的小数和分数改写成百分数，百分数改写成小数和分数", "stem": "把下面的小数和分数改写成百分数，百分数改写成小数和分数。", "given": "小数、分数、百分数之间的对应关系。", "ask": "完成小数、分数、百分数之间的互化。", "steps": [{"text": "小数化成百分数，小数点向右移动两位并加百分号", "latex": "0.08=8\\%"}, {"text": "百分数化成小数，小数点向左移动两位并去掉百分号", "latex": "32\\%=0.32"}, {"text": "分数化成百分数，先化成小数再化成百分数", "latex": "\\frac{1}{2}=50\\%"}, {"text": "百分数化成分数，先化成小数再化成分数", "latex": "0.5\\%=\\frac{1}{200}"}], "answer": "完成互化。", "answer_latex": "", "difficulty": "基础", "page": "做一做"}, {"name": "练习十四：六年级体育达标率", "stem": "六年级有学生160人，已达到国家体育锻炼标准的有152人。六年级学生的体育达标率是多少？", "given": "六年级学生160人，达标152人。", "ask": "求体育达标率。", "steps": [{"text": "达标率=达标人数÷总人数×100%", "latex": "达标率=152\\div160\\times100\\%"}, {"text": "计算152÷160", "latex": "152\\div160=0.95"}, {"text": "化成百分数", "latex": "0.95=95\\%"}], "answer": "95%", "answer_latex": "95\\%", "difficulty": "基础", "page": "练习十四"}, {"name": "练习十四：六（1）班跳远达标人数", "stem": "六（1）班有40名学生，上学期期末跳远测验有95%的学生达标。达标的学生有多少人？", "given": "六（1）班4 \u0001爸爸要给小雨买一辆自行车，原价280 元，现在打八五折出售。", "买这辆自行车要用多少钱？", "280× 85 %=", "（元）", "答：买这辆自行车要用", "元。", "（2）\u0001一个电水壶原价160 元，现在打九折出售，与原价相比，便宜", "了多少钱？", "160×（1-90 %）=", "=", "（元）", "答：便宜了", "元。", "商店有时会采用打折", "扣销售的方式，降价出售", "商品，俗称“ 打折”。几", "折就表示十分之几，也就", "是百分之几十。例如，打", "九折出售，就是按原价的", "90 % 出售。", "百分数（二）", "折扣", "九折就是原价的", "90 %。", "八五折就是原", "价的……", "原价：80.00", "原价：105.00", "原价：35.00", "现价：", "现价：", "现价：", "六五折", "七折", "八八折", "做一做", "某市2019 年接待旅游总人数约为96 万人次，比上一年增长两成。该市", "2018 年接待旅游总人数约为多少万人次？", "某工厂去年用电350 万千瓦时，今年比去年节电二成五，今年用电", "多少万千瓦时？", "350×（1-25 %）=", "（万千瓦时）", "答：", "。", "农业收成，经常用“成数”来表示。例如，报纸上写着：“今年我省小麦", "比去年增产二成……”。", "成数表示一个数是另一个数的十分之几，通称“几成”。例如：“一成”", "就是十分之一，改写成百分数是10 % ；“二成”就是十分之二，改写成百分", "数是20 % ；“三成五”是十分之三点五，改写成百分数就是35 %。", "现在，成数广泛应用于表示各行各业的发展变化情况。例如，某品牌的汽", "车出口总量比去年增加三成，某铁路货运量比去年增加两成……", "成数", "税收是国家财政收入的主要来源之一。纳税是根据国家税法的有关规", "定，按照一定的比率把集体或个人收入的一部分缴纳给国家。国家用税收", "发展科学、技术、教育、文化、卫生、环境保护、社会保障和国防等事业。", "每个公民都有依法纳税的义务。", "我们生活中常接触的税收种类主要有消费税、增值税和个人所得税等", "几类。应缴纳的税款叫作应纳税额，应纳税额与各种收入（销售额、营业", "额……）中应纳税部分的比率叫作税率。", "税率", "某小规模纳税企业要按应纳税销售额的3 % 缴纳增值税。该企业10 月份", "的应纳税销售额是30 万元，10 月份应缴纳增值税多少万元？", "30×3 %=0.9（万元）", "答：10 月份应缴纳增值税0.9 万元。", "做一做", "李阿姨某月工资中应纳税的部分为2500 元，需要按3 % 的税率缴纳工", "资薪金个人所得税。该月她应缴工资薪金个人所得税多少元？", "人们常常把节约下来或暂时不用的钱存入银行，我们把这称为储蓄。", "储蓄不仅可以使个人钱财更安全，并增加一些收入，还可以支援国家建设。", "在银行存款的方式有多种，如活期、整存整取、零存整取等。存入银行", "的钱叫作本金；取款时银行多支付的钱叫作利息；单位时间（如1 年、1 月、", "1 日等）内利息与本金的比率叫作利率。利息的计算公式是：", "利息= 本金× 利率× 存期", "银行的利率有时会随着国家经济的发展而变动。下面是中国人民银行", "2015 年10 月23 日公布的存款基准利率。", "利率", "王奶奶把5000 元按整存整取存", "入银行，存二年定期，年利率为", "2.10 %。到期时连本带息取出，王", "奶奶可以取出多少钱？", "做一做", "张爷爷把8000 元存入银行，存期为三年定期，年利率为2.75 %。到", "期支取时，张爷爷可得多少利息？到期时，张爷爷一共能取出多少钱？", "类型", "活期", "整存整取", "存期", "—", "三个月", "六个月", "一年", "二年", "三年", "年利率/ %", "0.35", "1.10", "1.30", "1.50", "2.10", "2.75", "小明的解法：", "5000×2.10 % ×2=210（元）", "5000+210=5210（元）", "小丽的解法：", "5000×（1+2.10 %×2）", "=5000×（1+0.042）", "=5000×1.042", "=5210（元）", "答：王奶奶可以取出5210 元。", "某品牌的裙子搞促销活动，在A 商场打五五折销售，在B 商场按“每满", "100 元减50 元”销售。妈妈要买一条该品牌标价230 元的裙子。",
