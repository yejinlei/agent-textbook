你也试着画一画吧。", "求出有几个千、几个百、几个十、几个一，再相加。", "数与从左往右算先乘、除，后加、减先算括号里面的（25+15）÷8=认识分数的认识及简单计算我知道混合运算的顺序了，还知道括号可以改变运算平均分的时候，每一份或顺序。", "几份都可以用分数表示。", "用“等量的等量相等”可以解决很多问题。", "你会用四则运算解决哪些问题？在解决这些问题的时候，你有什么好的方法？", "要找一找数量中有哪些关系，画线段图可以帮助我们思考先求什么，再求什么。", "分析数量之间的关系。", "小明做的朵数小明：", "少的3朵小红做的朵数小军做的是小红的2倍小红：", "小军做的朵数小军：", "？朵列式时，既可以分步计算可以帮助我们解决实际列式，也可以列综合问题，要根据需要选择估算算式。", "还是精确计算。", "这学期学习了一些和图形相关的知识。下面是小红整理的“知识结构图”，你也试着画一画吧。", "图形的认识", "图形的认识与测量", "图形的测量生活中很多地方有面、我认识了直角、锐角线和点，从一个点引出和钝角，图形中可以两条射线得到一个角。", "找到这些角。", "从不同角度观察物体，看长方体的表面可以展到的形状常常是不同的。", "开成一个平面图形。", "常见的量常见的量克（g）千克（kg）吨（t）北京—成都北京—广州北京—三亚 北京—乌鲁木齐", "（1）在（ ）里填上合适的单位。", "1小时飞行约900（  ）。", "最大起飞质量约72（  ）。", "机身全长约39（  ）。", "（2）一架飞机先从北京飞到广州，再飞行690千米到三亚。比从北京直接飞到三亚多飞多少千米？", "（3）一架飞机可载客164人。估一估5架这样的飞机能不能一次运走1000人。", "（4）从北京到三亚乘坐火车大约需要40小时，乘坐飞机大约需要4小时。火车硬卧车厢上铺票价733元，飞机经济舱全价票的价格大约是它的6倍，飞机经济舱全价票大约多少元？", "（1）右面的图形里有几个角？哪几个角是直角？", "（2）画一条直线，使图形内的直角增加到3个。", "连一连。", "下面是用分数砌成的“分数墙”。", "（1）在“分数墙”里你能找到哪些分数？把它们从小到大排列起来。", "（2） 1 里面有几个21 、几个3", "（3）哪几个不同分数相加的和等于1 ？", "（4）请你提出其他数学问题并解答。", "练习十九", "在（ ）里填上适当的数。", "4千米=（）米5 厘米  =（    ）毫米70厘米=（）分米8000千克=（     ）吨在（ ）里填上合适的单位。", "（1）北京到上海的高速铁路长1318（  ）。", "（2）一袋大米重5（  ）。", "（3）一部手机大约厚7（  ）。", "计算下面各题，能口算的口算。", "估一估，连一连，再计算验证。", "从李老师家到学校有4千米，到超市有2500米。从书店到学校有2千米。", "（1）书店到超市的距离是（  ）米。", "（2）李老师每分钟骑行220米，他20分钟能骑到学校吗？", "计算。", "在一分钟跳绳比赛中，小芳跳了160个，比小红多跳8个，小强跳了180个。小强比小红多跳了多少个？", "张阿姨每小时编4个中国结，刘阿姨每小时编3个中国结。她们一起编织一天（按8小时计算），能编完50个中国结吗？", "在科普活动周期间，小亮收集了20个昆虫标本，比小军收集的2倍还多4个。小军收集了多少个昆虫标本？", "计算下面各题。", "用圆规在直线l上作线段CD，使它的长度是线段AB的3倍。", "分别以下面的三个点为顶点，画一个锐角、直角和钝角。", "下面各幅图分别是从哪个位置看到的？把相应的序号填在横线上。", "（上面）（右面）（前面）=（ ）千克=（ ）千克王叔叔和3名同事乘火车出差。", "（1）如果他们往返都买二等座票，2000元够吗？", "（2）请你提出其他数学问题并解答。", "1 ，爸爸的年龄是小红的爷爷今年64岁，小红的年龄是爷爷的84倍。小红和爸爸各是多少岁？", "某垃圾转运站运来厨余垃圾和其他垃圾共90吨，其中其他垃圾2 。经过智能分拣系统进行精细分拣后，其他垃圾中的2拣出回收利用。回收利用的其他垃圾有多少吨？", "王叔叔家和李叔叔家相距18千米，两人同时从家出发，骑自行车相向而行。下图表示的是经过10分钟后他们所在的位置。", "（1）这时王叔叔和李叔叔共走了全程的几分之几？是多少千米？", "（2）照这样计算，再过多少分钟两人能够相遇？在图上画一画，说一说。", "28人去划船。", "（1）如果每条船都坐满，可以怎样租船？", "（2）如果租一条大船40元，租一条小船30元，哪种租船方案最省钱？", "某电动汽车生产厂要完成一批订单，原计划每天组装300台，5天完成。由于客户追加订购量，实际每天比原计划多组装50台，还多用了2天才完成任务。客户追加订购了多少台电动汽车？", "货架上摆放着大、中、小三种规格的牙膏。已知小盒牙膏每盒50克，每层摆放的牙膏总质量相同。大盒、中盒牙膏每盒各多少克？", "数学广角：搭配问题小红一家准备去A市旅游。", "有2班飞机和3班高铁可以到达A市。", "2+3=5。有这么多种选择，太好啦！", "小红带了2件上装，3件下装（每次上装和下装只能各选1件），一共有多少种搭配方法？", "1件上装与1件下装搭配，我来试一试。", "表示上装，表示下装。每件上装分别与3件下装搭配……上装：", "下装：", "我用“上”表示上装，“下”表示下装。", "每件上装分别与3件下装搭配……你会列式计算吗？列式是计算出行方式的数量和服装搭配的数量，思路上有什么不同？", "从家到A 市，有2 班飞搭配服装要分两步，上机和3 班高铁可以选装有2 种选择，下装有择，用加法。", "上装：", "下装：", "生活中还有哪些这样的应用？", "午餐的主食和菜品有不同的搭配……用2、5、7能组成多少个没有重复数字的两位数？", "三年级4个班进行足球比赛。每2个班踢一场，一共要踢多少场？", "这个学期结束了，给自己的表现涂上小红花吧！", "我的小红花喜欢学习数学上课专心听讲，积极思考老师提出的问题积极参与问题讨论并表达观点能认真完成数学作业积极发现并提出数学问题能应用学过的数学知识解决问题敢于挑战比较难的数学任务能合理安排时间学习数学知道自己数学学习上的不足你觉得自己还应在哪些方面更努力些？", "本套教科书（一~ 六年级）由人民教育出版社课程教材研究所小学数学课程教材研究开发中心依据教育部《义务教育数学课程标准（2022年版）》编写。", "本套教科书集中反映了基础教育课程改革的最新成果，总结了上一版《义务教育教科书 数学》的编写经验，凝聚了教育专家、学科专家、教材编写人员、教研人员及一线教师的集体智慧。参加本套教科书统稿的还有李海东、梁秋莲、曹培英，参加本册教科书统稿的还有周小川，参加本册教科书编写和讨论的还有田小勤、杨幸琪、余畅、林宾、周小川、鲍银霞、蔡兴飞等。本套教科书封面设计由中央美术学院设计团队完成，人民教育出版社设计部制作。本册教科书版式设计为中央美术学院何君设计团队，封面插图、内文插图绘制为中央美术学院郑琹语绘制团队。我们感谢所有对教科书的编写、审读、试教、出版等提供过帮助与支持的同仁和社会各界朋友。", "本册教科书出版之前，我们通过多种渠道与教科书选用作品的作者进行了联系，得到了他们的大力支持。新华社、视觉中国和张朝平等为本册教科书提供了图片素材。对此，我们表示衷心的感谢！", "我们真诚地希望广大教师、学生及家长在使用本册教科书过程中提出宝贵的意见和建议。我们将本着精益求精的态度，集思广益，不断修订，努力使教科书日趋完善。", "电  话：010-58758309，58758866电子邮箱：jcfk@pep.com.cn意见反馈平台：jcyjfk.pep.com.cn"], "sections": [{"kind": "正文", "body": ["本学期你学习了哪些知识？把它们整理一下吧。"], "chart": ["七"]}, {"kind": "练习", "body": ["整理复习", "数与运算数与运算本学期我们在表内乘、除法的基础上学习了多位数乘一位数的口算和笔算，初步认识了分数……下面是小丽整理的“知识结构图”，你也试着画一画吧。", "求出有几个千、几个百、几个十、几个一，再相加。", "数与从左往右算先乘、除，后加、减先算括号里面的（25+15）÷8=认识分数的认识及简单计算我知道混合运算的顺序了，还知道括号可以改变运算平均分的时候，每一份或顺序。", "几份都可以用分数表示。", "用“等量的等量相等”可以解决很多问题。", "你会用四则运算解决哪些问题？在解决这些问题的时候，你有什么好的方法？", "要找一找数量中有哪些关系，画线段图可以帮助我们思考先求什么，再求什么。", "分析数量之间的关系。", "小明做的朵数小明：", "少的3朵小红做的朵数小军做的是小红的2倍小红：", "小军做的朵数小军：", "？朵列式时，既可以分步计算可以帮助我们解决实际列式，也可以列综合问题，要根据需要选择估算算式。", "还是精确计算。", "这学期学习了一些和图形相关的知识。下面是小红整理的“知识结构图”，你也试着画一画吧。", "图形的认识", "图形的认识与测量", "图形的测量生活中很多地方有面、我认识了直角、锐角线和点，从一个点引出和钝角，图形中可以两条射线得到一个 一个乘数不变，积变成（  ）。", "看谁算得都对。", "计算下面各题，并验算。", "不计算，直接写出下面两题的得数。", "下面是某水果店上月的进货情况，请在空格内填上适当的数。", "你能用一张长方形纸折出135°的角吗？折一折，画一画，并在右图中标出这个角。", "选择合适的方式画出下面的角，并说一说分别属于哪一种角。", "把符合要求的图形序号填在（  ）里。", "（1）两组对边分别平行，有四个直角。", "（2）只有一组对边平行。", "（3）两组对边分别平行。", "画一个和右面大小相同的梯形，再在里面画一条线段，把它分成一个平行四边形和一个三角形。", "超市开展促销活动，一箱饮料36元，买5箱送1箱。某饭店要购买480箱这种饮料，一共需要多少钱？", "一列火车长415 m，每秒行驶83 m，全车通过一个隧道用时2分钟。这个隧道长多少米？", "截至2021年，我国已公布了五批国家级非物质文化遗产名录（共1557项），其中前三批中的传统音乐与民间文学项目数量如下表。", "各批次项目数量", "（1） 请你查找相关资料完成统计表，并根据数据完成统计图。", "国家级非物质文化遗产名录中传统音乐与民间文学项目数量统计图的项目数量位居世界第一。", "（2） 哪一批国家级非物质文化遗产名录中的传统音乐项目数量最多？哪一批中的民间文学项目数量最少？", "王老师买了29个同样的篮球，付了3600元，售货员找回了一些钱。请你估计一下，王老师买的是下面哪种篮球？实际用了多少钱？找回多少钱？", "数学广角：鸡兔同笼我国古代数学名著《孙子算经》中记载了一道数学趣题—“鸡兔同笼”问题。", "今有雉兔同笼，上有三十五头，下有九十四足，问雉兔各几何？", "这道题的意思是：", "笼子里有若干只鸡和兔。从上面数，有35 个头；", "从下面数，有94只脚。鸡和兔各有几只？", "我们可以先从数量较小的问题来探索解决问题的方法。", "笼子里有若干只鸡和兔。从上面数，有8个头；从下面数，有28只脚。鸡和兔各有几只？", "鸡：", "兔：", "我先画出8只鸡，脚数不够，给1 只鸡添上2按顺序列表试试，看看你能发现什么规律。", "从4只鸡和4只兔开始每减少1 只鸡，增加1 只兔，数，一共有24 只脚，就增加2只脚，现在还差4只把1只鸡换成兔……脚，要增加2只兔……你能用自己喜欢的方法解决《孙子算经》中的“鸡兔同笼”问题吗？", "下面是古人解决“鸡兔同笼”问题的方法，你能看懂吗？", "（1） 假如让鸡抬起1只脚，兔抬起2只脚，还有47只脚。", "（2） 这时，每只鸡1 只脚，每只兔2 只脚。笼子里只要有1 只兔，脚的总数就比头的总数多1。", "（3） 这时脚的总数与头的总数之差47−35=12，就是兔的只数。", "生活中还有类似“鸡兔同笼”的问题吗？", "我国古代数学名著《算法统宗》中记载了一道有趣的“百僧百馍”问题。", "一百馒头一百僧，大和三个更无争。", "小和三人分一个，大小和尚得几丁？", "100个和尚吃100个馒头。大和尚1 人吃3个，小和尚3人吃1个。大、小和尚各多少人？", "这个学期结束了，给自己的表现涂上小红花吧！", "我的小红花喜欢学习数学上课专心听讲，积极思考老师提出的问题积极参与问题讨论并表达观点能认真完成数学作业积极发现并提出数学问题能应用学过的数学知识解决问题敢于挑战比较难的数学任务能合理安排时间学习数学知道自己数学学习上的不足你觉得自己还应在哪些方面更努力些？", "本套教科书（一~ 六年级）由人民教育出版社课程教材研究所小学数学课程教材研究开发中心依据教育部《义务教育数学课程标准（2022年版）》编写。", "本套教科书集中反映了基础教育课程改革的最新成果，总结了上一版《义务教育教科书 数学》的编写经验，凝聚了教育专家、学科专家、教材编写人员、教研人员及一线教师的集体智慧。参加本套教科书统稿的还有李海东、梁秋莲、曹培英，参加本册教科书统稿的还有刘福林，参加本册教科书编写和讨论的还有王宁、王建国、刘福林、孙乐之、李世耀、陈淑娟、邵虹、周冬梅等。本套教科书封面设计由中央美术学院设计团队完成，人民教育出版社设计部制作。本册教科书版式设计为中央美术学院何君设计团队，封面插图、内文插图绘制为中央美术学院郑琹语绘制团队。我们感谢所有对教科书的编写、审读、试教、出版等提供过帮助与支持的同仁和社会各界朋友。", "本册教科书出版之前，我们通过多种渠道与教科书选用作品的作者进行了联系，得到了他们的大力支持。新华社、中国载人航天工程办公室、视觉中国、IC photo为本册教科书提供了图片素材。对此，我们表示衷心的感谢！", "我们真诚地希望广大教师、学生及家长在使用本册教科书过程中提出宝贵的 94"}, {"text": "由第一个方程得 x=35-y，代入第二个方程", "latex": "2(35-y)+4y=94"}, {"text": "化简求解 y", "latex": "70+2y=94"}, {"text": "解得兔的只数", "latex": "y=12"}, {"text": "解得鸡的只数", "latex": "x=23"}], "answer": "鸡23只，兔12只", "answer_latex": "x=23,\\ y=12", "difficulty": "提高", "page": "探究"}, {"name": "鸡兔同笼（孙子算经）", "stem": "笼子里有若干只鸡和兔。从上面数，有35 个头；从下面数，有94只脚。鸡和兔各有几只？", "given": "头共35个，脚共94只", "ask": "鸡和兔各有几只", "steps": [{"text": "设鸡有x只，兔有y只，列头数方程", "latex": "x+y=35"}, {"text": "列脚数方程", "latex": "2x+4y=94"}, {"text": "用假设法：假设全是鸡，脚数为35×2=70", "latex": "35\\times 2=70"}, {"text": "实际脚数比假设多94-70=24只", "latex": "94-70=24"}, {"text": "每把1只鸡换成兔，脚数增加2只，所以兔有24÷2=12只", "latex": "24\\div 2=12"}, {"text": "鸡有35-12=23只", "latex": "35-12=23"}], "answer": "鸡23只，兔12只", "answer_latex": "", "difficulty": "提高", "page": "探究 尝试"}, {"name": "鸡兔同笼（小数量探索）", "stem": "笼子里有若干只鸡和兔。从上面数，有8个头；从下面数，有28只脚。鸡和兔各有几只？", "given": "头共8个，脚共28只", "ask": "鸡和兔各有几只", "steps": [{"text": "假设全是鸡，脚数为8×2=16", "latex": "8\\times 2=16"}, {"text": "实际脚数比假设多28-16=12只", "latex": "28-16=12"}, {"text": "每换1只兔脚数增加2只，兔有12÷2=6只", "latex": "12\\div 2=6"}, {"text": "鸡有8-6=2只", "latex": "8-6=2"}], "answer": "鸡2只，兔6只", "answer_latex": "", "difficulty": "基础", "page": "探究 尝试"}, {"name": "按顺序列表探索规律", "stem": "按顺序列表试试，看看你能发现什么规律。", "given": "鸡兔同笼问题，从4只鸡和4只兔开始数，一共有24只脚", "ask": "发现规律", "steps": [{"text": "从4只鸡4只兔开始，脚数24", "latex": "4\\times 2+4\\times 4=24"}, {"text": "每减少1只鸡增加1只兔，脚数增加2", "latex": "24+2=26"}, {"text": "继续增加直到脚数符合", "latex": ""}], "answer": "每换1只兔脚数增加2", "answer_latex": "", "difficulty": "基础", "page": "反思"}, {"name": "用喜欢的方法解决孙子算经问题", "stem": "你能用自己喜欢的方法解决《孙子算经》中的“鸡兔同笼”问题吗？", "given": "头35，脚94", "ask": "鸡兔各几只", "steps": [{"text": "用抬脚法：鸡抬1只脚，兔抬2只脚，剩47只脚", "latex": "94-35=47"}, {"text": "此时每只鸡1只脚，每只兔2只脚", "latex": ""}, {"text": "脚数与头数之差47-35=12就是兔的只数", "latex": "47-35=12"}, {"text": "鸡有35-12=23只", "latex": "35-12=23"}], "answer": "鸡23只，兔12只", "answer_latex": "", "difficulty": "提高", "page": "反思"}, {"name": "百僧百馍问题", "stem": "一百馒头一百僧，大和三个更无争。小和三人分一个，大小和尚得几丁？100个和尚吃100个馒头。大和尚1 人吃3个，小和尚3人吃1个。大、小和尚各多少人？", "given": "和尚共100人，馒头共100个，大和尚1人吃3个，小和尚3人吃1个", "ask": "大、小和尚各多少人", "steps": [{"text": "设大和尚x人，小和尚y人", "latex": "x+y=100"}, {"text": "列馒头方程", "latex": "3x+\\frac{1}{3}y=100"}, {"text": "假设全是小和尚，馒头数为100÷3≈33.3，不够", "latex": "100\\div 3"}, {"text": "每把3个小和尚换成1个大和尚，馒头数增加3-1=2个", "latex": "3-1=2"}, {"text": "用方程解：由x+y=100得y=100-x，代入3x+(100-x)/3=100", "latex": "3x+\\frac{100-x}{3}=100"}, {"text": "解得x=25，y=75", "latex": "x=25,y=75"}], "answer": "大和尚25人，小和尚75人", "answer_latex": "", "difficulty": "拓展", "page": "反思"}], "kb": {"stage": "3-4", "topic": "数与运算", "standard": {"why": "【三会·数学思维】理解算理：知道“为什么这样算”，而不只是会算", "how": "【运算能力】能正确、合理、简洁地进行运算，说得出每一步在做什么", "traps": "【运算能力·推理意识】辨析易错处，能说出道理", "ideas": "【核心素养表现】数学思想：转化、数形结合、分类、模型等", "links": "【知识的结构化】体会知识间的联系，知道从哪来、往哪去", "life": "【应用意识】从真实情境中发现和提出问题（三会·数学眼光）"}, "why": "把大数拆成数位、把乘法拆成“个位乘+十位乘”，再用常见数量关系把生活问题变成算式，所以这样算。", "how": [{"s": "认计数单位，按数位顺序表读、写、改写大数", "note": "数位决定数字大小"}, {"s": "用“万”“亿”作单位改写或求近似数", "note": "便于比较和估算"}, {"s": "多位数乘两位数：个位乘、十位乘再相加", "note": "体现积的变化规律"}, {"s": "用数量关系列式：总量=分量+分量、总价=单价×数量、路程=速度×时间", "note": "把实际问题转成算式"}, {"s": "用条形统计图看数据多少，用方向看平面图", "note": "数形结合读信息"}], "traps": [{"type": "数位", "text": "数位顺序表从右起个、十、百…，别把“万位”当“万”。"}, {"type": "单位换算", "text": "1万=10000，1亿=100000000，改写时小数点别错位。"}, {"type": "进位退位", "text": "笔算乘法十位乘得的结果要左移一位再相加。"}, {"type": "审题", "text": "求近似数看省略位后一位四舍五入，别直接截断。"}], "ideas": ["转化", "数形结合", "分类"], "links": {"before": "要会这个，前面得先会万以内数的认识、表内乘除法和简单数量关系。", "after": "这个学会后，接着要学小数、分数运算和更复杂的统计与图形。"}}}, {"sid": "d0d6252f-2233-4f66-9ac9-440638d56fec:009", "grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 9, "title": "复习与关联", "domain": "prac", "literacy": ["运算能力"], "life": [{"where": "数水果、排队第几个、看钟表", "ask": "排队时你前面 4 人后面 3 人，一共几人？"}], "points": [], "page_from": 111, "page_to": 125, "text": ["本学期你学习了哪些知识？把它们整理一下。", "整理复习", "数与运算数与运算这学期我们继续探索了小数的乘、除法运算，你有哪些收获？在学习中有哪些感悟？", "的个数相加、减小数加、减法整数加、减法等式的基本性质除数是整数除数是小数小数乘、除法都可以转化成整数乘、除法计算。", "
