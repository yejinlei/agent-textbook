积是多少平方分米？", "17有一栋底面呈长方形的建筑物（如下图），墙角有一根木桩，木桩上拴着一条狗。拴狗的绳子长4 m，这条狗活动区域的面积有多大？", "18（1） 一根绳子长31.4 m，用这根绳子在操场上围出一块地。怎样围面积最大？请你画一画，算一算。", "（2） 为什么草原上蒙古包的底面是圆形的？为什么绝大多数植物的根和茎的横截面是圆形的？根据上面的研究，请你试着从数学的角度解释一下。", "用圆可以设计许多漂亮的图案。下面的图形就是用圆规和直尺一步一步画出来的。", "在画的过程中，你对“圆心确定圆的位置，半径决定圆的大小”有了更深的感受吗？请你试着用圆规和直尺画一画下面的图形。", "整理和复习整理和复习", "本单元学习了哪些知识？你能整理出一个“知识结构图”吗？", "特征：“一中同长”半径决定大小d =2r轴对称图形无数条对称轴周长除以直径所得的值一定你还有哪些收获和感受？", "圆是一种轴对称图形，的长度是直径的2在同一个圆里，半径1 。利用它可以设计很多美丽的图案。于它的直径乘π，一个圆的周长等", "练习十三", "复习巩固复习巩固", "1“中国天眼”是世界上最大的单口径射电望远镜，其上方的圈梁是一个直径为500 m 的圆。工程师沿着圈梁走一圈，大约是多少米？", "2右图中的双面绣作品绣在直径是20 cm的圆面上。", "这个圆的面积是多少？", "3用10 m长的铁条做直径是50 cm的圆形铁环，最多可以做多少个？", "4儿童乐园要修建一个圆形旋转木马游乐设施，圆的直径是8 m，周边还要留出1 m宽的小路，并在外侧围上栏杆。栏杆内的占地面积是多少平方米？", "5已知图中正方形的面积是10 cm2，圆的面积是多少平方厘米？"], "sections": [{"kind": "正文", "body": ["了解负数的历史和在数学中的应用，并向同学们介绍一下。", "我国很早就开始使用负数了……数学家刘徽给出了用算筹区分正、负数的方法——“正算赤、负算黑”，用红色算筹表示正数，用黑色算筹表示负数。"], "chart": ["小讲堂"]}, {"kind": "图", "body": [{"img": "../assets/img/math/845136d4-e27b-4e7e-b9a9-00cadf4f9e20_005_1.jpg"}], "chart": []}, {"kind": "正文", "body": ["有了负数，小的数减大的数的结果就8−10= −2可以表示出来。例如，8−10……20−30= −10", "成长小档案评价一下你在活动中的表现吧！", "你在这个活动中有什么收获？写或者画出来吧。", "能正确地读、写正数和负数；知道0既不是正数，也不是负数；能理解生活中一些负数的含义。", "能在活动中归纳总结出正数和负数可以表示相反意义的量。", "能用负数表示一些日常生活中的实际问题，体会数学与生活的紧密联系。", "能主动展示自己的作品，敢于表达，善于倾听，客观评价。", "1. 圆和扇形的认识1. 圆和扇形的认识圆是常见的图形，生活中的许多物体都是圆形的。", "你能想办法在纸上画一个圆吗？", "在纸上确定一个点将圆规的两脚分开，把有笔芯的脚旋转一周，（如点O）。把有针尖的脚固定在画出来的就是圆。", "点O。", "圆，一中同长也。", "用圆规画圆时要注意什么？", "用圆规画圆时，有针尖的旋转圆规时，两脚间的脚要固定不动。距离不能变。", "认一认。", "圆心：针尖固定的一点，通常用字母O表示。", "半径：连接圆心和圆上任意一点的线段，通d常用字母r表示，半径的长度就是圆规两个脚之r间的距离。", "直径：通过圆心并且两端都在圆上的线段，通常用字母d表示。", "用圆规画几个不同大小的圆，剪下来，沿着直径折一折，画一画，你有什么发现？", "一个圆的半径有无同一个圆所有的半径都相把圆沿任何一条直径数条，直径有……等，所有的直径都相等，对折，两边可以重合。", "直径长度是半径的……"], "chart": ["47", "四", "圆", "48圆", "OOO", "——《墨经》", "O", "49"]}, {"kind": "图", "body": [{"img": "../assets/img/math/845136d4-e27b-4e7e-b9a9-00cadf4f9e20_005_3.jpg"}], "chart": []}, {"kind": "正文", "body": ["在左边以O为圆心画两个不同大小的圆，在右边的不同位置画三个相同大小的圆。", "想一想：圆的大小与什么有关？圆的位置与什么有关？", "圆心确定了，圆的中心位置就确定了。半径决定了……"], "chart": ["O"]}, {"kind": "随堂练", "body": ["做一做", "1用圆规画一个半径是2 cm的圆，并分别用字母O、r、d标出它的圆心、半径和直径。", "2对于第49页中用杯口画出的圆，如何找到圆心？请你想办法找一找。", "如右图，圆上A、B两点之间的部分叫作弧，A读作“弧AB”。一条弧和经过这条弧两端的两条半径半径所围成的图形叫作扇形。O弧像∠AOB这样，顶点在圆心的角叫作圆心角。", "1在同一个圆中画几个不同大小的扇形，你有什么发现？", "B我发现在同一个圆中，AOD扇形的大小与这个扇形的圆心角的大小有关。", "以半圆为弧的圆心角是180°，以41 圆为弧的圆心角是90°。"], "chart": ["50圆", "半径", "B", "C", "AOBOD"]}, {"kind": "随堂练", "body": ["做一做", "1指出下列物体中的扇形。"], "chart": []}, {"kind": "图", "body": [{"img": "../assets/img/math/845136d4-e27b-4e7e-b9a9-00cadf4f9e20_005_7.jpg"}], "chart": []}, {"kind": "正文", "body": ["2先画一个半径是2 cm的圆，再在该圆中画一个圆心角是100°的扇形。"], "chart": ["51"]}, {"kind": "练习", "body": ["练习十"], "chart": []}, {"kind": "练习", "body": ["复习巩固复习巩固", "1按下面的要求，用圆规画圆。", "2填表。（单位：m）3用下面的方法可以测量没有标出圆心的圆的直径。请你试一试。"], "chart": []}, {"kind": "图", "body": [{"img": "../assets/img/math/845136d4-e27b-4e7e-b9a9-00cadf4f9e20_005_11.jpg"}], "chart": []}, {"kind": "正文", "body": ["4根据对称轴画出轴对称图形的另外一半。"], "chart": []}, {"kind": "图", "body": [{"img": "../assets/img/math/845136d4-e27b-4e7e-b9a9-00cadf4f9e20_005_13.jpg"}], "chart": []}, {"kind": "正文", "body": ["对称轴对称轴5下面哪个图形中的角是圆心角？在（    ）里画“”。", "6扇形是轴对称图形吗？", "7学校要建一个直径是10 m 的圆形花坛，你能用什么方法画出这个圆？", "8看图填空。", "9如图，长方形中有三个大小相等的圆，已知这个长方形的长是18 cm，圆的直径是多少？长方形的周长是多少？", "10在下列各图形中，你能分别画出几条对称轴？"], "chart": ["ABABB", "OBOOO", "A", "52圆", "综合运用综合运用", "O"]}, {"kind": "图", "body": [{"img": "../assets/img/math/845136d4-e27b-4e7e-b9a9-00cadf4f9e20_005_15.jpg"}], "chart": []}, {"kind": "正文", "body": ["11想一想：我们已经学过的平面图形中哪些是轴对称图形？哪些图形的对称轴只有一条？哪些不止一条？"], "chart": ["53"]}, {"kind": "拓展", "body": ["12以一个等边三角形的三个顶点为圆心，以这个等边三角形的边长为半径画圆。最终可以画出下面哪种图案？"], "chart": ["拓展提升拓展提升"]}, {"kind": "图", "body": [{"img": "../assets/img/math/845136d4-e27b-4e7e-b9a9-00cadf4f9e20_005_18.jpg"}], "chart": []}, {"kind": "正文", "body": ["生活中的数学", "如果仔细观察，你就会发现：我们周围很多东西的平面轮廓都是圆形的，如车轮、马路上的大多数井盖……这是为什么呢？"], "chart": []}, {"kind": "图", "body": [{"img": "../assets/img/math/845136d4-e27b-4e7e-b9a9-00cadf4f9e20_005_20.jpg"}], "chart": []}, {"kind": "正文", "body": ["车轮平面轮廓采用圆形，利用了同一圆的半径都相等的性质，把车轴装在车轮的圆心上。当车轮在地面上滚动的时候，车轴离地面的距离总是等于车轮的半径，因此只要道路平坦，车子就会平稳地在地面上行驶。试想一下，如果车轮是正方形的，为了保持车辆的平稳行驶，道路应该是什么样子的呢？你还有什么奇思妙想？", "井盖平面轮廓采用圆形的一个原因是圆形井盖怎么放都不会掉到井里，并且能恰好盖住井口，这里利用了同一圆的直径都相等的性质。", "2. 圆的周长2. 圆的周长圆桌和菜板都有点开分别需要多长裂，需要在它们的边的铁皮啊？", "缘箍上一圈铁皮。"], "chart": ["54圆"]}, {"kind": "图", "body": [{"img": "../assets/img/math/845136d4-e27b-4e7e-b9a9-00cadf4f9e20_005_22.jpg"}], "chart": []}, {"kind": "正文", "body": ["可以把圆形物体在直尺上滚一圈，AA量出长度。01cm2345677可以拿卷尺或皮A尺直接绕一圈量；", "也可以先拿绳在圈，再量出绳的长度。01cm234567像这样，围成圆的曲线的长是圆的周长。", "除了上面的方法，还可以怎样求圆的周长呢？", "圆的周长和圆的大小有关系，圆的大小取决于……让我们动手试一试：量出一些大小不同的圆的周长和直径，并用周长除以直径，把结果填入下表中，看看有什么发现。", "物品名称周长直径（结果保留两位小数）一个圆的周长总是它的直径的3倍多一些。", "其实，早就有人研究了圆的周长与直径的关系，发现任意一个圆的周长除以它的直径，所得的结果是一个固定的数，我们把它叫作圆周率，用字母π（pSi）表示。它是一个无限不循环小数，π=3.1415926535……但在实际应用中常常只取它的近似值，例如，π≈3.14。", "如果用C表示圆的周长，就有：", "你知道吗？", "在古代，人们粗略地认为圆周率是3，我国古代数学著作《九章算术》中就有相关记载。", "约1500年前，中国伟大的数学家和天文学家祖冲之计算出圆周率在3.1415926和3.1415927之间，成为世界上第一个把圆周率的值精确到小数点后7位的人。这一成就比国外大约早1000年。现在人们用计算机算出的圆周率，小数点后面已经超过万亿位。", "祖冲之（429—500）1每辆汽车的仪表盘上都可以显示这辆车出厂以来的总里程，这个总里程是由车轮的周长乘转动圈数得到的。一辆汽车的轮子直径是75 cm。轮子转1圈，这辆汽车可以走多远？这辆汽车从出厂起行驶的总里程是4710 km，轮子一共转了多少圈？", "答： 轮子转1圈，这辆汽车可以走2.355m。这辆汽车从出厂起，轮子一共转了2000000圈。"], "chart": ["A", "圆形物体上绕一AA'", "55", "周长÷ 直径", "56圆"]}, {"kind": "随堂练", "body": ["做一做", "1求下面各圆的周长。"], "chart": []}, {"kind": "图", "body": [{"img": "../assets/img/math/845136d4-e27b-4e7e-b9a9-00cadf4f9e20_005_25.jpg"}], "chart": []}, {"kind": "正文", "body": ["的周长是6.28 m。"], "chart": ["2我用皮尺量得圆桌面"]}, {"kind": "图", "body": [{"img": "../assets/img/math/845136d4-e27b-4e7e-b9a9-00cadf4f9e20_005_27.jpg"}], "chart": []}, {"kind": "正文", "body": ["这个圆桌面的直径是多少？"], "chart": ["57"]}, {"kind": "练习", "body": ["练习十一"], "chart": []}, {"kind": "练习", "body": ["复习巩固复习巩固", "1一个圆形喷水池的半径是5 m，它的周长是多少米？", "2在一个圆形亭子里，小丽沿着直径从一端走12步到达另一端，每步长大约是55 cm。这个圆的周长大约是多少米？", "3一个古代建筑中大红圆柱横截面的周长是3.14 m。这个圆柱横截面的直径是多少米？", "4杂技演员表演独轮车走钢丝，车轮的直径为40 cm，要骑过50.24 m长的钢丝，车轮大约要转动多少圈？", "5一只挂钟的分针长20 cm，经过30分钟后，分针的尖端所走的路程是多少厘米？经 术。", "从圆内接正六边形开始，将边数逐次加倍，得到的圆内接正多边形就逐步逼近圆。“割之弥细，所失弥少，割之又割，以至于不可割，则与圆周合体而无所失矣。”2馆藏于故宫博物院的“青玉御题蚕纹璧”（如右图），其形状是一个圆环。外圆直径为26.3 cm，内圆直径为5.4 cm。这个圆环的面积约是多少？（可借助计算器，得数保留一位小数。）先算半径：26.3÷2=13.15（cm）5.4÷2=2.7（cm）小丽这样算：小明这样算：", "3求下面图形的面积。", "这个图形是由一个大半圆挖去一个小半圆，再加一个小半这个图形是由……圆拼接而成的。可以将小半圆可以把上面的半圆绕着大半圆的圆心旋转……平移到下面……"], "chart": ["62圆", "AGD", "EF", "5cm5cm", "B3cmC"]}, {"kind": "随堂练", "body": ["做一做", "求下面各图形中涂色部分的面积。（单位：cm）4许多建筑和物品上都可以见到“外方内圆”和“外圆内方”的设计。你能研究一下这两种设计中正方形和圆面积之间的关系吗？", "这里的“外方内圆”指的是正方形和它内部最大的圆；", "“外圆内方”指的是圆和它内部最大的正方形。", "要研究的是……我们先研究“外方内圆”。圆的半径和正方形的边长都不知道，可以假设圆的半径分别是1 cm、2 cm、3 cm、……、a cm。列表研究圆和正方形的面积。", "“外方内圆”中正方形的边长与圆的直径长度相等。", "圆的半径/cm123……a圆的面积/cm2π4π9π……πa2正方形的面积/cm241636……4a2圆面积是正方形面积的几分之几（用π表示）……“外圆内方”中的正方形可以看作两个三角形，它们的底和高分别是……还可以继续假设圆的半径分别是1 cm、2 cm、圆的半径/cm123……a圆的面积/cm2π4π9π……πa2正方形的面积/cm22818……2a2圆面积是正方形面积的几分之几（用π表示）……我发现“外方内圆”和“外圆内方”中，无论图形有多大，正方形和圆的面积之间倍数关系是一定的。", "答：“外方内圆”中，圆面积是正方形面积的4“外圆内方”中，圆面积是正方形面积的2如果把这两个图形叠在一起，你能发现什么？", "从表中可以知道，大正方形的面积是小正方形的2倍。", "把里面的小正方形旋转一下，就能更明显地看出两个正方形面积之间的倍数关系了。"], "chart": ["1", "4211", "212", "63", "阅读理解", "分析解答", "64圆", "回顾反思"]}, {"kind": "随堂练", "body": ["做一做", "已知图中正方形的面积是20 cm2，圆的面积是多少平方厘米？涂色部分的面积是多少？"], "chart": ["65"]}, {"kind": "练习", "body": ["练习十二"], "chart": []}, {"kind": "练习", "body": ["复习巩固复习巩固", "1把表格补充完整。", "2计算下面各圆的周长和面积。", "3公园草地上一个自动旋转喷灌装置的射程是10 m，它能喷灌的面积是多少？"], "chart": ["圆半径直径面积"]}, {"kind": "图", "body": [{"img": "../assets/img/math/845136d4-e27b-4e7e-b9a9-00cadf4f9e20_005_43.jpg"}], "chart": []}, {"kind": "正文", "body": ["4小刚量得一棵树的树干横截面的周长是125.6 cm。树干的横截面近似于圆，它的面积大约是多少？", "5一个圆形环岛的直径为50 m，中间是一个直径为10 m的圆形花坛，其他地方是草坪。求草坪的占地面积。50 m6下面两个图中，大圆的半径均等于小圆的直径，你能分别求出涂色部分的面积吗？你发现了什么？", "7一枚铜钱形状如右图，圆的直径为28 mm，中间正方形的边长为6 mm。这枚铜钱的面积是多少？", "8在生活中找找圆环形物体，测量所需数据，计算出它的面积。", "圆筒形卫生纸的工件中的金属垫片基横截面是个圆环。本是圆环形的。"], "chart": ["66圆", "综合运用综合运用"]}, {"kind": "图", "body": [{"img": "../assets/img/math/845136d4-e27b-4e7e-b9a9-00cadf4f9e20_005_45.jpg"}], "chart": []}, {"kind": "正文", "body": ["9如右图，一个运动场两端是半圆形，100 m中间是长方形。这个运动场的周长是多少米？面积是  "term": "下册", "book": "六年级下册", "unit_no": 3, "title": "圆柱与圆锥", "domain": "geo", "literacy": ["量感", "几何直观"], "life": [{"where": "铺地砖、刷墙、量菜地", "ask": "教室长 9 米宽 6 米，铺边长 6 分米的地砖要多少块？"}, {"where": "围篱笆、跑一圈、相框边框", "ask": "长方形花坛长 8 米宽 5 米，围一圈要多少米？"}], "points": ["圆柱由上、下底面和侧面3个面围成", "圆柱底面是大小相同的圆，侧面是曲面", "圆柱的高是两个底面之间的距离", "长方形旋转可生成圆柱", "圆柱侧面展开是长方形，长等于底面周长，宽等于高", "圆柱表面积等于侧面积加两个底面积"], "page_from": 20, "page_to": 41, "text": ["3圆柱与圆锥圆柱的认识", "我们学过的正方体和长方体都是由平面围成的立体图形。现在我们再来研究一种立体图形——圆柱。", "上面这些物体的形状有什么共同点？", "上面这些物体的形状都是圆柱体，简称圆柱。", "你还见过哪些圆柱形的物体？", "1观察一个圆柱形的物体，看一看它是由哪几部底面分组成的，有什么特征。", "圆柱是由3个面围成的。圆柱的上、下两个面叫作底面。侧高圆柱周围的面（上、下底面除外）叫作侧面。圆柱的两个底面底面之间的距离叫作高。", "圆柱的底面都是圆，圆柱的侧面并且大小一样。是曲面。", "如右图所示，把一张长方形的硬纸贴在木棒上，快速转动木棒，看看转出来的是什么形状。", "转起来像一个圆柱。", "做一做", "1标明下面圆柱的底面、侧面和高。", "2转动长方形ABCD，生成右面的两个圆柱。说一说它们分别是以长方形的哪条边为轴旋转而成的，底面半径和高分别是多少。", "2（1）\u0001圆柱的侧面展开后是什么形状？把罐头盒的商标纸如下图所示沿高剪开，再展开。", "把\u0001圆柱侧面像上面那样展开后，得到一个长方形。", "（2）\u0001这个长方形的长、宽与圆柱有什么关系？把这个长方形重新包在圆柱上，你能发现什么？", "底面的周长底面的周长圆柱的高我们发现，长方形的长等于圆柱底面的周长，宽等于圆柱的高。", "做一做", "1下面是同一个圆柱的展开图，说一说每个图是怎样展开的。", "2一个圆柱形茶叶筒的侧面贴着商标纸，圆柱底面半径是5 cm，高是20 cm。这张商标纸展开后是一个长方形，它的长和宽各是多少厘米？", "练习三", "1下面哪些图形是圆柱？在（　）里画“”。", "2折一折或卷一卷，想一想：能得到什么立体图形？写在（　）里。", "3下面哪个图形是圆柱的展开图？（单位：cm）4如下图，上排图中切完后的截面或剪完后展开的侧面分别是什么形状？请与下排图连一连。", "5把一张长方形的纸横着或竖着卷起来，可以卷成什么形状？", "圆柱的表面积3在前面的学习中，我们已经知道圆柱的表面是由哪几部分组成的，那怎么求圆柱的表面积呢？", "底面的周长底面高底面的周长圆柱侧面的高", "观察上图，你能发现什么？", "圆柱的表面积   =   圆柱的侧面积   +   两个底面的面积你会计算圆柱的侧面积吗？圆柱的底面积呢？", "计算圆柱的侧面积，实际上就是求上图中长方形的面积。", "圆柱的侧面积= 底面周长× 高如果圆柱的底面半径是r，高是h，那么，可以得到下面的公式。", "圆柱的侧面积=2πrh其中一个底面的面积=πr2", "做一做", "一个圆柱形罐头的侧面贴着商标纸，圆柱底面半径是5 cm，高是10 cm。", "这张商标纸的面积是多少？", "4一顶厨师帽近似圆柱形，高30 cm，帽顶直径20 cm。做这样一顶帽子大约要用多少平方厘米的面料？（得数保留整十数。）求大约要用多少面料，就是求……", "（1）帽子的侧面积：3.14×20×30=1884（cm2）", "（2）帽顶的面积：3.14×（20÷2）2=314（cm2）", "（3）需要用的面料：1884+314=2198 ≈2200（cm2）实际使用的面料要比计算的结果多一些，所以这类问题往往用“进一法”取近似数。", "答：做这样一顶帽子大约要用cm2 的面料。", "做一做", "1求下面各圆柱的侧面积。", "（1）底面周长是1.6 m，高是0.7 m。", "（2）底面半径是3.2 dm，高是5 dm。", "2小亚做了一个笔筒，她想给笔筒的外侧面和外底面贴上彩纸，大约需要用多少彩纸？（得数保留整十数。）13 cm", "练习四", "1求下面各圆柱的表面积。（单位：cm）2一台压 4_5.jpg"}], "chart": []}, {"kind": "正文", "body": ["如右图所示，把一张长方形的硬纸贴在木棒上，快速转动木棒，看看转出来的是什么形状。", "转起来像一个圆柱。"], "chart": []}, {"kind": "随堂练", "body": ["做一做", "1标明下面圆柱的底面、侧面和高。", "2转动长方形ABCD，生成右面的两个圆柱。说一说它们分别是以长方形的哪条边为轴旋转而成的，底面半径和高分别是多少。", "2（1）\u0001圆柱的侧面展开后是什么形状？把罐头盒的商标纸如下图所示沿高剪开，再展开。"], "chart": ["AD", "（1）（2）", "17"]}, {"kind": "图", "body": [{"img": "../assets/img/math/8e650f4c-e616-4699-ac0a-4911b22e2f2e_004_8.jpg"}], "chart": []}, {"kind": "正文", "body": ["把\u0001圆柱侧面像上面那样展开后，得到一个长方形。", "（2）\u0001这个长方形的长、宽与圆柱有什么关系？把这个长方形重新包在圆柱上，你能发现什么？", "底面的周长底面的周长圆柱的高我们发现，长方形的长等于圆柱底面的周长，宽等于圆柱的高。"], "chart": ["底面底面"]}, {"kind": "随堂练", "body": ["做一做", "1下面是同一个圆柱的展开图，说一说每个图是怎样展开的。", "2一个圆柱形茶叶筒的侧面贴着商标纸，圆柱底面半径是5 cm，高是20 cm。这张商标纸展开后是一个长方形，它的长和宽各是多少厘米？"], "chart": ["18"]}, {"kind": "练习", "body": ["练习三", "1下面哪些图形是圆柱？在（　）里画“”。"], "chart": []}, {"kind": "图", "body": [{"img": "../assets/img/math/8e650f4c-e616-4699-ac0a-4911b22e2f2e_004_12.jpg"}], "chart": []}, {"kind": "正文", "body": ["2折一折或卷一卷，想一想：能得到什么立体图形？写在（　）里。", "3下面哪个图形是圆柱的展开图？（单位：cm）4如下图，上排图中切完后的截面或剪完后展开的侧面分别是什么形状？请与下排图连一连。", "5把一张长方形的纸横着或竖着卷起来，可以卷成什么形状？", "圆柱的表面积3在前面的学习中，我们已经知道圆柱的表面是由哪几部分组成的，那怎么求圆柱的表面积呢？", "底面的周长底面高底面的周长圆柱侧面的高"], "chart": ["4", "23", "19", "底面"]}, {"kind": "观察", "body": ["观察上图，你能发现什么？", "圆柱的表面积   =   圆柱的侧面积   +   两个底面的面积你会计算圆柱的侧面积吗？圆柱的底面积呢？", "计算圆柱的侧面积，实际上就是求上图中长方形的面积。", "圆柱的侧面积= 底面周长× 高如果圆柱的底面半径是r，高是h，那么，可以得到下面的公式。", "圆柱的侧面积=2πrh其中一个底面的面积=πr2"], "chart": []}, {"kind": "随堂练", "body": ["做一做", "一个圆柱形罐头的侧面贴着商标纸，圆柱底面半径是5 cm，高是10 cm。", "这张商标纸的面积是多少？", "4一顶厨师帽近似圆柱形，高30 cm，帽顶直径20 cm。做这样一顶帽子大约要用多少平方厘米的面料？（得数保留整十数。）求大约要用多少面料，就是求……"], "chart": ["20"]}, {"kind": "图", "body": [{"img": "../assets/img/math/8e650f4c-e616-4699-ac0a-4911b22e2f2e_004_16.jpg"}], "chart": []}, {"kind": "正文", "body": ["（1）帽子的侧面积：3.14×20×30=1884（cm2）", "（2）帽顶的面积：3.14×（20÷2）2=314（cm2）", "（3）需要用的面料：1884+314=2198 ≈2200（cm2）实际使用的面料要比计算的结果多一些，所以这类问题往往用“进一法”取近似数。", "答：做这样一顶帽子大约要用cm2 的面料。"], "chart": []}, {"kind": "随堂练", "body": ["做一做", "1求下面各圆柱的侧面积。", "（1）底面周长是1.6 m，高是0.7 m。", "（2）底面半径是3.2 dm，高是5 dm。", "2小亚做了一个笔筒，她想给笔筒的外侧面和外底面贴上彩纸，大约需要用多少彩纸？（得数保留整十数。）13 cm"], "chart": ["21"]}, {"kind": "练习", "body": ["练习四", "1求下面各圆柱的表面积。（单位：cm）2一台压路机的前轮是圆柱形，轮宽2 m，直径1.2 m。前轮转动一周，压路的面积是多少平方米？", "3在一个底面直径是1.5 m、高是2.5 m 的圆柱形广告柱子侧面张贴海报，能张贴海报的最大面积是多少？", "4某种饮料罐的形状为圆柱形，底面直径为6 cm，高为12 cm，将24 罐这种饮料按如图所示的方式放入箱内，这个箱子的长、宽、高至少是多少厘米？", "5求下面各图形的表面积。", "6一顶帽子，上面是圆柱形，用黑布做；帽檐20部分是一个圆环，用红布做。做这顶帽子，10哪种颜色的布用得多？（单位：cm）7林叔叔用彩纸做了一个圆柱形的灯笼（如右图）。上下底面的中间分别留出了78.5 cm230 cm的圆孔，他用了多少彩纸？", "8一个圆柱形铁皮水桶（无盖），高12 dm，底面直径是高的     。做这个23水桶大约要用多少铁皮？", "9（1）\u0007要将街心花园的路灯柱刷上白色的油漆（如右图，16 cm圆柱的上、下底面不刷漆），要刷多少平方米？（得12 cm数保留一位小数。）12 cm", "（2）\u0007有30 个这样的路灯柱，如果刷油漆的人工费为每平方米15 元，一共需要人工费多少元？", "10一个圆柱的侧面积是188.4 dm2，底面半径是2 dm。", "它的高是多少？", "11一根圆柱形木料的底面半径是0.5 m，长是2 m。如图12 cm所示，将它截成4 段，这些木料的表面积之和比原木料的表面积增加了多少平方米？", "12一个圆柱的侧面展开图是一个正方形，求这个圆柱的底面直径与高的比。", "圆柱的体积我们会计算长方体和正方体的体积，怎样计算圆柱的体积呢？能不能将圆柱转化成我们学过的立体图形，再计算出它的体积呢？", "5联想到圆的面积计算公式的推导过程，我把圆柱的底面分成许多相等的扇形，把圆柱切开，再像这样拼起来，得到一个近似的长方体。", "分成的扇形越多，拼成的立体图形就越接近长方体。", "把长方体与原来的圆柱比较，你能发现什么？", "这个长方体的底面积等于圆柱的，高等于圆柱的。", "长方体的体积= 底面积× 高圆柱的体积   =×如果用V 表示圆柱的体积，S 表示底面积，h 表示高，那么圆柱的体积计算公式是：", "如果知道圆柱的底面半径r 和高h，你能写出圆柱的体积计算公式吗？"], "chart": ["4", "18", "3815", "40", "22", "10", "23"]}, {"kind": "随堂练", "body": ["做一做", "1一根圆柱形木料，底面积为75 cm2，长为90 cm。它的体积是多少？", "2挖一口圆柱形水井，地面以下的井深为10 m，底面直径为1 m。挖出的土有多少立方米？", "6下图中的杯子能不能装下2 袋这样的牛奶？（数据是从杯子里面测量得到的。）想：要回答这个问题，先要计算出杯子的容积。", "杯子的底面积：3.14×（8÷2）2杯子的容积：50.24×10牛奶的体积：240×2=480（mL）答：杯子能装下2 袋这样的牛奶。"], "chart": ["24", "10 cm牛奶", "240mL"]}, {"kind": "随堂练", "body": ["做一做", "1小明和妈妈出去游玩，带了一个圆柱形保温壶，从里面量底面直径是8 cm，高是15 cm。如果两人游玩期间要喝1 L 水，带这壶水够喝吗？", "2一个圆柱形的水池，从里面量底面半径是5 m，深是3.2 m。这个水池能蓄水多少吨？（1 m3 的水重1 t。）7一个底面内直径是8 cm 的瓶子里，水的高度是7 cm，把瓶盖拧紧，把瓶子倒置、放平，18 cm无水部分是圆柱形，高度是18 cm。这个瓶子的容积是多少？7 cm阅读与理解知道了……要解决的问题是……分析与解答不管是正放还是倒倒置前后，水和无水部分置，瓶子里的容积都的形状发生了变化，但体是由水的体积和无水积都没有变。", "部分的体积组成的。", "瓶子的容积= 水的体积+ 无水部分的体积=7 cm 高的圆柱体积+18 cm 高的圆柱体积回顾与反思我们利用了体积不变的特在五年级计算土豆性，把不规则图形转化成的体积时，也是用规则图形来计算体积。了转化的方法。", "答：这个瓶子的容积是1256 mL。"], "chart": ["25", "26"]}, {"kind": "练习", "body": ["练习五", "1计算下面各圆柱的体积。（单位：cm）2一个圆柱形油桶的底面直径是60 cm，高是90 cm，这个油桶最多可以装多少油？（数据是从油桶里面测量得到的。）3学校建了两个同样大小的圆柱形花坛。花坛的底面内直径是4 m，高是0.8 m。如果里面填土的高度是0.5 m，两个花坛一共需要填土多少立方米？", "4一个圆柱的体积是80 cm3，底面积是16 cm2，它的高是多少厘米？", "5一个圆柱形粮囤，从里面量得底面半径是1 m，高是2 m。如果每立方米玉米约重750 kg，这个粮囤能装多少吨玉米？", "6求下面图形的表面积和体积。（单位：cm）7某公园要修一道围墙，原计划用土石35 m3。", "后来多开了一个厚度为25 cm的月亮门（见右图），减少了土石的用量。现在用了多少2 m立方米土石？", "8明明家里来了两位小客人，妈妈榨了1 L 果6 cm汁。如果用右图中的玻璃杯喝果汁，够明明和客人们每人一杯吗？（数据是从杯子内部11 cm测量得到的。）9两个底面积相等的圆柱，一个高为4.5 dm，体积为81 dm3。另一个高为3 dm，它的体积是多少？", "10一个装水的圆柱形容器的底面内直径是10 cm，一个铁块完全浸没在这个容器的水中，将铁块取出后，水面下降2 cm。这个铁块的体积是多少？", "11一种内直径是1.2 cm 的水龙头，打开后水的流速是20 厘米/ 秒。用一个容积为1 L 的保温壶接水，50 秒能接满吗？", "12下面是一根钢管，求它所用钢材的体积。（单位：cm）13小雨家有6 个从里面量得底面积是30 cm2、高是10 cm 的圆柱形水杯，沏一壶茶水正好能倒满4 杯。有一天来了6 位客人，小雨沏了一壶茶水，将这壶茶水倒入6 个杯中，平均每杯倒多少毫升？", "14右面这个长方形的长是20 cm，宽是10 cm。", "分别以长和宽为轴旋转一周，得到两个圆柱。", "它们的体积各是多少？", "15下面4 个图形的面积都是36 dm2。用这些图形分别卷成圆柱，哪个圆柱的体积最小？哪个圆柱的体积最大？你有什么发现？（单位：dm）你知道吗？", "古希腊的阿基米德是历史上杰出的数学家。按照他的遗愿，人们在他的墓碑上刻了一个“圆柱容球”的几何图形。为什么阿基米德希望在自己的墓碑上刻“圆柱容球”的图形呢？这是r因为他在自己众多的科学发现当中，对“圆柱容球”定理最为满意。", "“圆柱容球”就是把一个球放在一个圆柱形容器中，盖上盖后，球恰好与圆柱的上、下底面及侧面紧密接触。", "当圆柱容球时，球的直径与圆柱的高和底面直径相等。假设圆柱的底面半径为r，那么圆柱的体积V 圆柱=π r2×2r=2π r3。阿基米德发现并证明了球的体积公式是V 球=    πr3，所以V 球=   V 圆柱，即当圆柱容球时，球的体积正4323好是圆柱体积的三分之二。", "阿基米德还发现，当圆柱容球时，球的表面积也是圆柱表面积的三分之二。", "你能表示出球的表面积吗？", "圆锥的认识"], "chart": ["8", "512", "28", "4", "615", "14", "1220", "5", "10", "27", "108", "80", "181296", "2346", "圆柱容球", "2r", "29", "2. 圆锥"]}, {"kind": "图", "body": [{"img": "../assets/img/math/8e650f4c-e616-4699-ac0a-4911b22e2f2e_004_23.jpg"}], "chart": []}, {"kind": "图", "body": [{"img": "../assets/img/math/8e650f4c-e616-4699-ac0a-4911b22e2f2e_004_25.jpg"}], "chart": []}, {"kind": "正文", "body": ["上面这些物体的形状有什么共同点？"], "chart": ["通风孔帽纸杯吊灯"]}, {"kind": "图", "body": [{"img": "../assets/img/math/8e650f4c-e616-4699-ac0a-4911b22e2f2e_004_27.jpg"}], "chart": []}, {"kind": "正文", "body": ["上图中这些物体的形状都是圆锥体，简称圆锥。", "你还见过哪些圆锥形的物体？", "1拿一个圆锥形的物体，观察它有哪些特征。", "圆锥的底面是一个h圆，侧面是曲面。高从圆锥的顶点到底面圆心的距离是圆锥的高。", "怎样测量圆锥的高？拿一个圆锥形物体，试着测量它
