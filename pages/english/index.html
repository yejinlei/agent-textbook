ou want to learn about?", "I want to know about ...", "I want to learn more about ...", "Which museums do you want to visit?"], "turns": [{"s": "Miss White", "speaker": "Miss White", "en": "What do you want to learn about, children?", "zh": "孩子们，你们想学习什么？"}, {"s": "Binbin", "speaker": "Binbin", "en": "I want to know about space and planets.", "zh": "我想知道关于太空和行星的知识。"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "I want to learn more about staying healthy.", "zh": "我想更多地了解如何保持健康。"}, {"s": "Mike", "speaker": "Mike", "en": "I want to know more about Chinese festivals.", "zh": "我想更多地了解中国的节日。"}, {"s": "Miss White", "speaker": "Miss White", "en": "Those are great ideas! What can help you learn about these things?", "zh": "这些都是很棒的想法！什么可以帮助你们学习这些内容？"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "We can read books or use the internet.", "zh": "我们可以读书或使用互联网。"}, {"s": "Mike", "speaker": "Mike", "en": "We can travel to different places.", "zh": "我们可以去不同的地方旅行。"}, {"s": "Miss White", "speaker": "Miss White", "en": "That's right. We can also learn in museums. This week, we're going to plan some museum trips.", "zh": "没错。我们也可以在博物馆里学习。这周，我们要计划一些博物馆之旅。"}, {"s": "Students", "speaker": "Students", "en": "Great!", "zh": "太棒了！"}, {"s": "Miss White", "speaker": "Miss White", "en": "Which museums do you want to visit? How much money do you need? Think about these questions and make a plan.", "zh": "你们想去参观哪些博物馆？需要多少钱？思考这些问题并制定一个计划。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Revision", "title": "Learning in museums", "scene": "Zhang Peng 和 Sarah 讨论博物馆旅行计划", "function": "询问信息", "patterns": ["Do you have a plan for ...?", "I'm going to visit ...", "That's a good idea!", "I have ... yuan."], "turns": [{"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "Do you have a plan for your museum trip?", "zh": "你有博物馆旅行的计划吗？"}, {"s": "Sarah", "speaker": "Sarah", "en": "Yes, I'm going to visit some museums online.", "zh": "是的，我打算在线参观一些博物馆。"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "That's a good idea!", "zh": "这是个好主意！"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "I'm going to visit the China Great Wall Museum.", "zh": "我打算去参观中国长城博物馆。"}, {"s": "Sarah", "speaker": "Sarah", "en": "Wow! But it's very far.", "zh": "哇！但是它很远。"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "I have 100 yuan. The museum is free. But I need to take a bus and buy some food and drink. Before that, I want to look good in my photos.", "zh": "我有100元。博物馆是免费的。但我需要坐公交车并买一些食物和饮料。在那之前，我想在照片里看起来好看。"}, {"s": "Sarah", "speaker": "Sarah", "en": "Ha! Ha! I want to see your photos.", "zh": "哈哈！我想看你的照片。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Revision", "title": "Learning in museums", "scene": "记者采访 Binbin 和 John 关于博物馆参观", "function": "询问信息", "patterns": ["What did you see in the museum?", "Did you see any other interesting things there?", "What did you like about the museum?", "I saw ..."], "turns": [{"s": "Reporter", "speaker": "Reporter", "en": "What did you see in the museum?", "zh": "你们在博物馆里看到了什么？"}, {"s": "Binbin", "speaker": "Binbin", "en": "I saw a big spaceship. I also went into a mini space station.", "zh": "我看到了一艘大宇宙飞船。我还进入了一个迷你空间站。"}, {"s": "Reporter", "speaker": "Reporter", "en": "Did you see any other interesting things there?", "zh": "你们在那里还看到其他有趣的东西吗？"}, {"s": "John", "speaker": "John", "en": "Yes. A robot dressed in a Tang suit. She pasted fu on the door.", "zh": "是的。一个穿着唐装的机器人。她在门上贴了福字。"}, {"s": "Reporter", "speaker": "Reporter", "en": "What did you like about the museum?", "zh": "你们喜欢博物馆的什么？"}, {"s": "John", "speaker": "John", "en": "We watched a short play about Chang'e and Houyi. Then we saw another amazing robot. He gave us a speech.", "zh": "我们看了一出关于嫦娥和后羿的短剧。然后我们看到了另一个神奇的机器人。他给我们做了一场演讲。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Revision", "title": "Learning in museums", "scene": "后羿与玉兔在月宫对话", "function": "问候与介绍", "patterns": ["How did you get to ...?", "What did you do here?", "What did you do on Earth?", "How is ...?"], "turns": [{"s": "Narrator", "speaker": "Narrator", "en": "It was the Mid-Autumn Festival. On the Moon, the Rabbit ran and jumped. Then he saw a big spaceship in the sky!", "zh": "那是中秋节。在月球上，玉兔跑着跳着。然后他看到天空中有一艘大宇宙飞船！"}, {"s": "Chang'e", "speaker": "Chang'e", "en": "How did you get to the Moon?", "zh": "你是怎么到月球的？"}, {"s": "Houyi", "speaker": "Houyi", "en": "A spaceship brought me here. We have great spaceships in China.", "zh": "一艘宇宙飞船把我带到了这里。我们中国有伟大的宇宙飞船。"}, {"s": "Chang'e", "speaker": "Chang'e", "en": "Wow!", "zh": "哇！"}, {"s": "Houyi", "speaker": "Houyi", "en": "Chang'e, you came to the Moon so long ago. What did you do here?", "zh": "嫦娥，你很久以前就来到月球了。你在这里做了什么？"}, {"s": "Chang'e", "speaker": "Chang'e", "en": "Rabbit and I read books and sang folk songs. But I always thought of our days together.", "zh": "我和玉兔读书、唱民歌。但我总是想起我们在一起的日子。"}, {"s": "Houyi", "speaker": "Houyi", "en": "What did you do on Earth…?", "zh": "你在地球上做了什么……？"}, {"s": "Chang'e", "speaker": "Chang'e", "en": "Hello, Rabbit!", "zh": "你好，玉兔！"}, {"s": "Rabbit", "speaker": "Rabbit", "en": "Hi, Houyi! Welcome!", "zh": "嗨，后羿！欢迎！"}, {"s": "Houyi", "speaker": "Houyi", "en": "Thank you. How is Chang'e?", "zh": "谢谢你。嫦娥怎么样？"}, {"s": "Rabbit", "speaker": "Rabbit", "en": "Chang'e is always sad, but she will be happy now. Look, here she comes. It's so good to have family around again!", "zh": "嫦娥总是很伤心，但现在她会开心了。看，她来了。家人再次聚在一起真好！"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Unit 1", "title": "Amazing places", "scene": "Zhang Peng 和 Leo 谈论上周末的活动", "function": "询问信息", "patterns": ["How was your weekend?", "What did you do?", "It's about ... long.", "That sounds interesting."], "turns": [{"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "Hi, Leo! How was your weekend?", "zh": "嗨，Leo！你周末过得怎么样？"}, {"s": "Leo", "speaker": "Leo", "en": "Not too bad, thanks. And you?", "zh": "还不错，谢谢。你呢？"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "It was great! I climbed the Great Wall.", "zh": "太棒了！我爬了长城。"}, {"s": "Leo", "speaker": "Leo", "en": "Wow! The Great Wall is amazing.", "zh": "哇！长城太神奇了。"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "Yes, it is! It's about 21,000 kilometres long. What did you do, Leo?", "zh": "是的！它大约有两万一千公里长。你做了什么，Leo？"}, {"s": "Leo", "speaker": "Leo", "en": "I visited the \"Gingerbread House\" last Saturday.", "zh": "我上周六参观了“姜饼屋”。"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "What did you do there? Eat gingerbread?", "zh": "你在那里做了什么？吃姜饼吗？"}, {"s": "Leo", "speaker": "Leo", "en": "Ha! Ha! No! It's a beautiful train station in New Zealand.", "zh": "哈哈！不！它是新西兰的一个美丽火车站。"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "That sounds interesting. Please send me some pictures.", "zh": "听起来很有趣。请给我发些照片。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Unit 1", "title": "Amazing places", "scene": "Amy、Binbin 和 Sarah 谈论暑假旅行", "function": "询问信息", "patterns": ["Where did you go over the summer holidays?", "What did you do there?", "How was it?", "That sounds great fun!"], "turns": [{"s": "Amy", "speaker": "Amy", "en": "Where did you go over the summer holidays, Binbin?", "zh": "Binbin，你暑假去了哪里？"}, {"s": "Binbin", "speaker": "Binbin", "en": "I went to Xi'an with my family.", "zh": "我和家人去了西安。"}, {"s": "Sarah", "speaker": "Sarah", "en": "I like Xi'an. What did you do there?", "zh": "我喜欢西安。你在那里做了什么？"}, {"s": "Binbin", "speaker": "Binbin", "en": "We ate some famous Xi'an noodles. Then we went to see the Terracotta Warriors.", "zh": "我们吃了一些著名的西安面条。然后我们去看兵马俑。"}, {"s": "Sarah", "speaker": "Sarah", "en": "Wow! I really want to go there! How was it?", "zh": "哇！我真的很想去那里！怎么样？"}, {"s": "Binbin", "speaker": "Binbin", "en": "Amazing! There are over seven thousand clay warriors and horses.", "zh": "太神奇了！有七千多个陶俑和陶马。"}, {"s": "Amy", "speaker": "Amy", "en": "I saw pictures on the internet. What else did you do?", "zh": "我在网上看过照片。你还做了什么？"}, {"s": "Binbin", "speaker": "Binbin", "en": "Well, we walked around the old city and rode bikes on the old city wall.", "zh": "嗯，我们在老城区散步，还在古城墙上骑自行车。"}, {"s": "Amy", "speaker": "Amy", "en": "That sounds great fun!", "zh": "听起来太有趣了！"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Unit 1", "title": "Amazing places", "scene": "谈论假期去了哪里以及做了什么", "function": "询问信息", "patterns": ["Where did you go over the holidays?", "I went to ...", "I ate ..."], "turns": [{"s": "A", "speaker": "A", "en": "Where did you go over the holidays?", "zh": "你假期去了哪里？"}, {"s": "B", "speaker": "B", "en": "I went to Wuhan.", "zh": "我去了武汉。"}, {"s": "B", "speaker": "B", "en": "I ate hot dry noodles.", "zh": "我吃了热干面。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Unit 1", "title": "Amazing places", "scene": "谈论上周末去了附近的村庄", "function": "描述事物", "patterns": ["Last week my family took a trip to ...", "We saw ... and ate ...", "It was warm and sunny."], "turns": [{"s": "A", "speaker": "A", "en": "Last week my family took a trip to a nearby village.", "zh": "上周我家人去了一个附近的村庄旅行。"}, {"s": "A", "speaker": "A", "en": "We saw many ducks and ate fresh fruit there.", "zh": "我们在那里看到了许多鸭子，还吃了新鲜水果。"}, {"s": "A", "speaker": "A", "en": "It was warm and sunny.", "zh": "天气温暖晴朗。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Unit 1", "title": "Amazing places", "scene": "John、Zhang Peng 和 Amy 谈论假期去了哪里以及做了什么", "function": "询问信息", "patterns": ["Where did you go?", "I took a trip to ...", "What did you do there?", "I visited ..."], "turns": [{"s": "John", "speaker": "John", "en": "Zhang Peng, Amy, where did you go?", "zh": "Zhang Peng，Amy，你们去了哪里？"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "I took a trip to Guangzhou.", "zh": "我去了广州旅行。"}, {"s": "Amy", "speaker": "Amy", "en": "What did you do there?", "zh": "你在那里做了什么？"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "...", "zh": "……"}, {"s": "John", "speaker": "John", "en": "I went to Hangzhou and Shaoxing. I visited Lu Xun Native Place. Lu Xun was a famous writer.", "zh": "我去了杭州和绍兴。我参观了鲁迅故里。鲁迅是一位著名的作家。"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "Yes, he was. He wrote a lot of great books.", "zh": "是的，他是。他写了很多很棒的书。"}, {"s": "Amy", "speaker": "Amy", "en": "...", "zh": "……"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Appendix 1", "title": "Songs", "scene": "Unit 1 Travelling around", "function": "描述事物", "patterns": ["I visited ...", "I went to ...", "I saw ...", "I ate ..."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "I visited Beijing,", "zh": "我参观了北京。"}, {"s": "Chant", "speaker": "Chant", "en": "And I learnt about the place.", "zh": "我了解了这个地方。"}, {"s": "Chant", "speaker": "Chant", "en": "I went to Tian'anmen Square,", "zh": "我去了天安门广场，"}, {"s": "Chant", "speaker": "Chant", "en": "And to the Great Wall the next day.", "zh": "第二天去了长城。"}, {"s": "Chant", "speaker": "Chant", "en": "I visited Beijing,", "zh": "我参观了北京，"}, {"s": "Chant", "speaker": "Chant", "en": "And I learnt about its history.", "zh": "我了解了它的历史。"}, {"s": "Chant", "speaker": "Chant", "en": "I took so many pictures,", "zh": "我拍了很多照片，"}, {"s": "Chant", "speaker": "Chant", "en": "And ate new snacks on the street.", "zh": "还在街上吃了新小吃。"}, {"s": "Chant", "speaker": "Chant", "en": "I went to Xi'an next,", "zh": "接下来我去了西安，"}, {"s": "Chant", "speaker": "Chant", "en": "And I saw the old city wall.", "zh": "我看到了古城墙。"}, {"s": "Chant", "speaker": "Chant", "en": "I ate some really tasty noodles,", "zh": "我吃了非常美味的面条，"}, {"s": "Chant", "speaker": "Chant", "en": "And sang a local song.", "zh": "还唱了一首当地歌曲。"}, {"s": "Chant", "speaker": "Chant", "en": "On my trip to Xi'an,", "zh": "在我去西安的旅途中，"}, {"s": "Chant", "speaker": "Chant", "en": "I saw the famous sights.", "zh": "我看到了著名的景点。"}, {"s": "Chant", "speaker": "Chant", "en": "And I climbed up Lishan Mountain.", "zh": "我还爬上了骊山。"}, {"s": "Chant", "speaker": "Chant", "en": "The views were very nice.", "zh": "景色非常美。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Appendix 1", "title": "Songs", "scene": "Unit 2 Getting together", "function": "描述事物", "patterns": ["We have a great time.", "We get together at ...", "We had ...", "We sang ..."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "My family and I, we have a great time.", "zh": "我和我的家人，我们玩得很开心。"}, {"s": "Chant", "speaker": "Chant", "en": "We get together at special events.", "zh": "我们在特别的活动中聚在一起。"}, {"s": "Chant", "speaker": "Chant", "en": "Events are fun. I love every one.", "zh": "活动很有趣，我喜欢每一个。"}, {"s": "Chant", "speaker": "Chant", "en": "Yeah, yeah, yeah! Yeah, yeah, yeah!", "zh": "耶，耶，耶！耶，耶，耶！"}, {"s": "Chant", "speaker": "Chant", "en": "My parents and I, we had a sports day.", "zh": "我和我的父母，我们过了一个运动日。"}, {"s": "Chant", "speaker": "Chant", "en": "There were many fun activities to do.", "zh": "有很多有趣的活动可以做。"}, {"s": "Chant", "speaker": "Chant", "en": "We ran so fast. My brother clapped.", "zh": "我们跑得很快，我哥哥鼓掌。"}, {"s": "Chant", "speaker": "Chant", "en": "Go, go, go! Go, go, go!", "zh": "加油，加油，加油！加油，加油，加油！"}, {"s": "Chant", "speaker": "Chant", "en": "My mother and I, we cleaned up at New Year,", "zh": "我和我的妈妈，我们在新年打扫，"}, {"s": "Chant", "speaker": "Chant", "en": "And pasted fu on our door.", "zh": "还在门上贴了福字。"}, {"s": "Chant", "speaker": "Chant", "en": "We dressed in red. All were fed.", "zh": "我们穿红衣服，大家都吃饱了。"}, {"s": "Chant", "speaker": "Chant", "en": "Yum, yum, yum! Yum, yum, yum!", "zh": "好吃，好吃，好吃！好吃，好吃，好吃！"}, {"s": "Chant", "speaker": "Chant", "en": "My brother and I, we sang some songs,", "zh": "我和我的哥哥，我们唱了一些歌，"}, {"s": "Chant", "speaker": "Chant", "en": "And spoke with all of our relatives.", "zh": "还和所有亲戚说话。"}, {"s": "Chant", "speaker": "Chant", "en": "We counted down, such a big sound.", "zh": "我们倒计时，声音真大。"}, {"s": "Chant", "speaker": "Chant", "en": "3, 2, 1! Fun, fun, fun!", "zh": "3，2，1！有趣，有趣，有趣！"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Appendix 1", "title": "Songs", "scene": "Unit 3 How can we stay healthy?", "function": "感受与情绪", "patterns": ["How can we stay healthy?", "He should ...", "She should ...", "We should ..."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "How can we stay healthy?", "zh": "我们怎样才能保持健康？"}, {"s": "Chant", "speaker": "Chant", "en": "The boy has a runny nose.", "zh": "这个男孩流鼻涕。"}, {"s": "Chant", "speaker": "Chant", "en": "He should see a doctor.", "zh": "他应该去看医生。"}, {"s": "Chant", "speaker": "Chant", "en": "Maybe he knows.", "zh": "也许他知道。"}, {"s": "Chant", "speaker": "Chant", "en": "How can we stay healthy?", "zh": "我们怎样才能保持健康？"}, {"s": "Chant", "speaker": "Chant", "en": "The girl has a little cough.", "zh": "这个女孩有点咳嗽。"}, {"s": "Chant", "speaker": "Chant", "en": "She should get enough sleep.", "zh": "她应该睡足够的觉。"}, {"s": "Chant", "speaker": "Chant", "en": "Let's switch all the lights off.", "zh": "让我们把所有灯关掉。"}, {"s": "Chant", "speaker": "Chant", "en": "How can we stay healthy?", "zh": "我们怎样才能保持健康？"}, {"s": "Chant", "speaker": "Chant", "en": "We shouldn't feel so sad.", "zh": "我们不应该这么难过。"}, {"s": "Chant", "speaker": "Chant", "en": "We should talk about our feelings.", "zh": "我们应该谈谈我们的感受。"}, {"s": "Chant", "speaker": "Chant", "en": "Sharing isn't bad.", "zh": "分享并不坏。"}, {"s": "Chant", "speaker": "Chant", "en": "How can we stay healthy?", "zh": "我们怎样才能保持健康？"}, {"s": "Chant", "speaker": "Chant", "en": "Don't feel lonely or alone.", "zh": "不要感到孤独或孤单。"}, {"s": "Chant", "speaker": "Chant", "en": "Join after-school teams and clubs.", "zh": "加入课后团队和俱乐部。"}, {"s": "Chant", "speaker": "Chant", "en": "Have fun at school and at home.", "zh": "在学校和家里玩得开心。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Appendix 1", "title": "Songs", "scene": "Unit 4 Did they use money well?", "function": "购物与价格", "patterns": ["... bought ...", "Did he use his money well?", "Did she use her money well?", "... has ..."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "Simon bought a new computer.", "zh": "西蒙买了一台新电脑。"}, {"s": "Chant", "speaker": "Chant", "en": "He bought a new computer.", "zh": "他买了一台新电脑。"}, {"s": "Chant", "speaker": "Chant", "en": "It was an inbin。我明天要去科学博物馆。你去吗？"}, {"s": "Mike", "speaker": "Mike", "en": "I'm afraid not, Binbin. I have a bad cold.", "zh": "恐怕不行，Binbin。我得了重感冒。"}, {"s": "Binbin", "speaker": "Binbin", "en": "Oh dear! How do you feel?", "zh": "天哪！你感觉怎么样？"}, {"s": "Mike", "speaker": "Mike", "en": "I feel ill. My head hurts and I have a runny nose.", "zh": "我感觉不舒服。我头疼，还流鼻涕。"}, {"s": "Binbin", "speaker": "Binbin", "en": "I'm sorry to hear that. Maybe you should see a doctor.", "zh": "听到这个我很难过。也许你应该去看医生。"}, {"s": "Mike", "speaker": "Mike", "en": "I know. My mum is going to take me to hospital this afternoon.", "zh": "我知道。今天下午我妈妈要带我去医院。"}, {"s": "Binbin", "speaker": "Binbin", "en": "That's good. Take care and get well soon!", "zh": "那很好。保重，早日康复！"}, {"s": "Mike", "speaker": "Mike", "en": "Thanks.", "zh": "谢谢。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Unit 3", "title": "Healthy life", "scene": "Let's talk: How do we know we are ill?", "function": "询问信息", "patterns": ["What's the matter?", "I have a bad cold.", "I have a runny nose.", "You should ..."], "turns": [{"s": "A", "speaker": "A", "en": "What's the matter?", "zh": "怎么了？"}, {"s": "B", "speaker": "B", "en": "I have a bad cold. And I have a runny nose.", "zh": "我得了重感冒。而且我流鼻涕。"}, {"s": "A", "speaker": "A", "en": "You should ...", "zh": "你应该……"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Unit 3", "title": "Healthy life", "scene": "Miss White and students discuss health.", "function": "描述事物", "patterns": ["What is health?", "How can we live a healthy life?", "We need to eat healthy food.", "We should exercise too."], "turns": [{"s": "Miss White", "speaker": "Miss White", "en": "Class, now we're going to discuss health. First, what is health?", "zh": "同学们，现在我们要讨论健康。首先，什么是健康？"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "Health is having a good body and feeling happy.", "zh": "健康就是身体好并且感到快乐。"}, {"s": "Miss White", "speaker": "Miss White", "en": "Thank you, Chen Jie. So, how can we live a healthy life?", "zh": "谢谢你，Chen Jie。那么，我们怎样才能过上健康的生活？"}, {"s": "Sarah", "speaker": "Sarah", "en": "We need to eat healthy food. We should exercise too.", "zh": "我们需要吃健康的食物。我们也应该锻炼。"}, {"s": "Miss White", "speaker": "Miss White", "en": "That's right. What do you think, Binbin?", "zh": "没错。Binbin，你怎么看？"}, {"s": "Binbin", "speaker": "Binbin", "en": "I think our family and friends are also very important.", "zh": "我认为我们的家人和朋友也非常重要。"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "Yes, it's always good to talk to our family and friends.", "zh": "是的，和家人朋友聊天总是好的。"}, {"s": "Miss White", "speaker": "Miss White", "en": "Good job, everyone!", "zh": "大家做得好！"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Unit 3", "title": "Healthy life", "scene": "Liu Jia and Miss White talk about feelings.", "function": "感受与情绪", "patterns": ["What's the matter?", "I'm feeling down.", "You should think about happy things.", "You can do some exercise."], "turns": [{"s": "Miss White", "speaker": "Miss White", "en": "What's the matter, Liu Jia? You look sad.", "zh": "怎么了，Liu Jia？你看起来很伤心。"}, {"s": "Liu Jia", "speaker": "Liu Jia", "en": "I'm feeling down. My good friend Lucy moved to another city.", "zh": "我感到很沮丧。我的好朋友Lucy搬到了另一个城市。"}, {"s": "Miss White", "speaker": "Miss White", "en": "Think about happy things. Call your friend or send her some emails.", "zh": "想想开心的事。给你的朋友打电话或给她发些邮件。"}, {"s": "Liu Jia", "speaker": "Liu Jia", "en": "I tried that, but I still feel unhappy.", "zh": "我试过了，但我还是感到不开心。"}, {"s": "Miss White", "speaker": "Miss White", "en": "Maybe you can do some exercise. Exercise may cheer you up!", "zh": "也许你可以做些运动。运动可能会让你振作起来！"}, {"s": "Miss White", "speaker": "Miss White", "en": "Join some after-school clubs and make new friends! You can talk and have fun with them.", "zh": "加入一些课外俱乐部，结交新朋友！你可以和他们聊天、一起玩。"}, {"s": "Liu Jia", "speaker": "Liu Jia", "en": "I will try. Thank you, Miss White.", "zh": "我会试试的。谢谢你，White老师。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Unit 4", "title": "Managing money well", "scene": "Mike 和 Matt 谈论 Matt 的零花钱及打算怎么花", "function": "询问信息", "patterns": ["Are you counting your pocket money?", "How are you going to spend it?", "I'm going to buy ...", "I also want to buy ..."], "turns": [{"s": "Mike", "speaker": "Mike", "en": "Are you counting your pocket money, Matt?", "zh": "Matt，你在数你的零花钱吗？"}, {"s": "Matt", "speaker": "Matt", "en": "Yes. I have three hundred and fifty-seven yuan.", "zh": "是的。我有三百五十七元。"}, {"s": "Mike", "speaker": "Mike", "en": "Wow, that's a lot! How are you going to spend it?", "zh": "哇，好多啊！你打算怎么花？"}, {"s": "Matt", "speaker": "Matt", "en": "I'm going to buy a schoolbag.", "zh": "我打算买一个书包。"}, {"s": "Mike", "speaker": "Mike", "en": "Yes, you need a new one.", "zh": "是的，你需要一个新的。"}, {"s": "Matt", "speaker": "Matt", "en": "I also want to buy some animal books.", "zh": "我还想买一些动物书。"}, {"s": "Mike", "speaker": "Mike", "en": "Nice. They're interesting.", "zh": "不错。它们很有趣。"}, {"s": "Matt", "speaker": "Matt", "en": "Maybe I can also buy some ice cream.", "zh": "也许我还可以买一些冰淇淋。"}, {"s": "Mike", "speaker": "Mike", "en": "Sure, but don't eat too much.", "zh": "当然，但别吃太多。"}, {"s": "Matt", "speaker": "Matt", "en": "Don't worry. I won't.", "zh": "别担心。我不会的。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Unit 4", "title": "Managing money well", "scene": "Mum 和 Sarah 谈论 Sarah 的零花钱及购物计划", "function": "询问信息", "patterns": ["How much pocket money do you have?", "What else are you going to buy?", "I'm going to buy ...", "Maybe you can wait for a sale!"], "turns": [{"s": "Mum", "speaker": "Mum", "en": "How much pocket money do you have?", "zh": "你有多少零花钱？"}, {"s": "Sarah", "speaker": "Sarah", "en": "I have one hundred and forty-six yuan.", "zh": "我有一百四十六元。"}, {"s": "Mum", "speaker": "Mum", "en": "What else are you going to buy?", "zh": "你还打算买什么？"}, {"s": "Sarah", "speaker": "Sarah", "en": "A lot. But first I'm going to buy a pair of sunglasses for Grandpa.", "zh": "很多。但首先我打算给爷爷买一副太阳镜。"}, {"s": "Mum", "speaker": "s": "B", "speaker": "B", "en": "I also want to buy some animal books.", "zh": "我还想买一些动物类书籍。"}, {"s": "A", "speaker": "A", "en": "What else are you going to buy?", "zh": "你还打算买什么？"}, {"s": "B", "speaker": "B", "en": "I'm going to buy a pair of sunglasses for Grandpa.", "zh": "我打算给爷爷买一副太阳镜。"}, {"s": "B", "speaker": "B", "en": "I also want to buy a microscope.", "zh": "我还想买一个显微镜。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Appendix 4", "title": "Useful expressions", "scene": "Unit 5 天空与火星", "function": "描述事物", "patterns": ["What can you see ...?", "We can see ...", "Is there any ...?", "Are there any ...?"], "turns": [{"s": "A", "speaker": "A", "en": "What can you see in the sky?", "zh": "你能在天空中看到什么？"}, {"s": "B", "speaker": "B", "en": "We can see the Sun and clouds.", "zh": "我们能看到太阳和云。"}, {"s": "B", "speaker": "B", "en": "At night, we can see the Moon and the stars.", "zh": "在晚上，我们能看到月亮和星星。"}, {"s": "A", "speaker": "A", "en": "Is there any water on Mars?", "zh": "火星上有水吗？"}, {"s": "B", "speaker": "B", "en": "Yes, there is. There is soil too.", "zh": "是，有的。那里还有土壤。"}, {"s": "A", "speaker": "A", "en": "Are there any aliens?", "zh": "那儿有外星生物吗？"}, {"s": "B", "speaker": "B", "en": "I don't think so. They say there aren't any living things.", "zh": "我不这样认为。据说那里没有生物。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Appendix 4", "title": "Useful expressions", "scene": "Unit 6 水与能源", "function": "询问信息", "patterns": ["What do you know about ...?", "What else do you want to know about ...?", "Where does ... come from?", "How can we ...?"], "turns": [{"s": "A", "speaker": "A", "en": "What do you know about it?", "zh": "关于它你知道些什么？"}, {"s": "B", "speaker": "B", "en": "Running water can make electricity.", "zh": "流水可以发电。"}, {"s": "A", "speaker": "A", "en": "What else do you want to know about water?", "zh": "关于水你还想了解些什么？"}, {"s": "B", "speaker": "B", "en": "Where does water come from?", "zh": "水从哪儿来？"}, {"s": "A", "speaker": "A", "en": "What should we do?", "zh": "我们该怎么办？"}, {"s": "A", "speaker": "A", "en": "How can we save energy?", "zh": "我们怎样才能节约能源？"}, {"s": "B", "speaker": "B", "en": "We can take quick showers.", "zh": "我们可以快速淋浴。"}, {"s": "B", "speaker": "B", "en": "We can also use LED lighting.", "zh": "我们还可以使用LED照明。"}, {"s": "B", "speaker": "B", "en": "We should use air conditioners less.", "zh": "我们应该少用空调。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Unit 5", "title": "Exploring space", "scene": "Mr Liu 与孩子们在课堂上讨论天空与外太空", "function": "描述事物", "patterns": ["What can you see in the sky?", "We can see ...", "What can we see from outer space?", "It looks like ..."], "turns": [{"s": "Mr Liu", "speaker": "Mr Liu", "en": "Hi, children. Let's talk about our planet Earth.", "zh": "嗨，孩子们。我们来谈谈我们的地球。"}, {"s": "Mr Liu", "speaker": "Mr Liu", "en": "What can you see in the sky?", "zh": "你们能在天空中看到什么？"}, {"s": "Mike", "speaker": "Mike", "en": "The sky is often blue in the daytime. We can see the Sun and clouds. We can also see birds and planes.", "zh": "白天天空通常是蓝色的。我们可以看到太阳和云。我们还可以看到鸟和飞机。"}, {"s": "Amy", "speaker": "Amy", "en": "At night, we can see the Moon and the stars.", "zh": "晚上，我们可以看到月亮和星星。"}, {"s": "Mr Liu", "speaker": "Mr Liu", "en": "Very good. But what can we see from outer space? Let's look at some photos from a space station.", "zh": "很好。但是从外太空我们可以看到什么？我们来看看一些来自空间站的照片。"}, {"s": "Binbin", "speaker": "Binbin", "en": "Wow! We can see mountains, oceans and clouds.", "zh": "哇！我们可以看到山脉、海洋和云。"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "There are large oceans on Earth. It looks like a big blue marble.", "zh": "地球上有大片海洋。它看起来像一颗巨大的蓝色弹珠。"}, {"s": "Mike", "speaker": "Mike", "en": "It's so beautiful. I want to know more about our Mother Earth!", "zh": "太美了。我想知道更多关于我们的地球母亲的事情！"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Unit 5", "title": "Exploring space", "scene": "Mike、Chen Jie 和 Oliver 讨论关于火星的杂志", "function": "询问信息", "patterns": ["What are you reading about?", "Is there any ...?", "Yes, there is.", "I don't think so."], "turns": [{"s": "Mike", "speaker": "Mike", "en": "Hey, Chen Jie. What are you reading about?", "zh": "嘿，陈杰。你在读什么？"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "Mars.", "zh": "火星。"}, {"s": "Oliver", "speaker": "Oliver", "en": "Mars? What does it say?", "zh": "火星？上面写了什么？"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "It talks about things on Mars.", "zh": "它讲的是火星上的事物。"}, {"s": "Oliver", "speaker": "Oliver", "en": "Wow! Is there any water on Mars?", "zh": "哇！火星上有水吗？"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "Yes, there is. There is soil too.", "zh": "是的，有。也有土壤。"}, {"s": "Oliver", "speaker": "Oliver", "en": "Oh! Are there any aliens?", "zh": "哦！有外星人吗？"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "I don't think so. They say there aren't any living things.", "zh": "我不这么认为。他们说没有任何生物。"}, {"s": "Oliver", "speaker": "Oliver", "en": "I see.", "zh": "我明白了。"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "Look! This is the sunrise on Mars.", "zh": "看！这是火星上的日出。"}, {"s": "Mike", "speaker": "Mike", "en": "How beautiful! I really want to travel to Mars.", "zh": "多美啊！我真的想去火星旅行。"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "Maybe you can go one day. China put a rover on Mars. We learn more about the \"red planet\" every year.", "zh": "也许有一天你可以去。中国在火星上放置了探测器。我们每年都会对“红色星球”了解更多。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Unit 6", "title": "Energy, nature and us", "scene": "Binbin 和 Mike 讨论项目选题", "function": "邀请与建议", "patterns": ["Any ideas about ...?", "Maybe we can ...", "Let's find out more about ...", "Let's go to the library."], "turns": [{"s": "Binbin", "speaker": "Binbin", "en": "Hi, Mike. Any ideas about our project?", "zh": "嗨，Mike。关于我们的项目有什么想法吗？"}, {"s": "Mike", "speaker": "Mike", "en": "Maybe we can talk about water power.", "zh": "也许我们可以谈谈水力发电。"}, {"s": "Binbin", "speaker": "Binbin", "en": "OK. We use water every day. Let's find out more about water power.", "zh": "好的。我们每天都用水。让我们多了解一些水力发电吧。"}, {"s": "Mike", "speaker": "Mike", "en": "What do you know about it?", "zh": "你对它了解多少？"}, {"s": "Binbin", "speaker": "Binbin", "en": "Running water can make electricity. We can get power from the sea too.", "zh": "流动的水可以发电。我们也可以从海里获取能源。"}, {"s": "Mike", "speaker": "Mike", "en": "What else do you want to know about water?", "zh": "关于水你还想知道什么？"}, {"s": "Binbin", "speaker": "Binbin", "en": "Well, where does water come from? How do we make power from water?", "zh": "嗯，水从哪里来？我们怎样用水发电？"}, {"s": "Mike", "speaker": "Mike", "en": "Good questions. Let's go to the library. We can work on it together.", "zh": "好问题。我们去图书馆吧。我们可以一起研究。"}, {"s": "Binbin", "speaker": "Binbin", "en": "Good idea!", "zh": "好主意！"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit": "Unit 6", "title": "Energy, nature and us", "scene": "Mrs Green 与 Binbin、Mike 讨论如何节约能源", "function": "请求与应答", "patterns": ["What should we do?", "We should ...", "How can we ...?", "We can ..."], "turns": [{"s": "Mrs Green", "speaker": "Mrs Green", "en": "We use energy every day. But many resources are running out. What should we do?", "zh": "我们每天都使用能源。但许多资源正在枯竭。我们该怎么办？"}, {"s": "Mike", "speaker": "Mike", "en": "We should save energy.", "zh": "我们应该节约能源。"}, {"s": "Mrs Green", "speaker": "Mrs Green", "en": "Yes, but how can we save energy?", "zh": "是的，但我们怎样才能节约能源？"}, {"s": "Binbin", "speaker": "Binbin", "en": "We can change our energy use.", "zh": "我们可以改变我们的能源使用方式。"}, {"s": "Mrs Green", "speaker": "Mrs Green", "en": "Can you give us an example, Binbin?", "zh": "你能给我们举个例子吗，Binbin？"}, {"s": "Binbin", "speaker": "Binbin", "en": "Sure. We can take quick showers. That will save energy and water.", "zh": "当然。我们可以快速洗澡。这样可以节约能源和水。"}, {"s": "Mike", "speaker": "Mike", "en": "I agree. We can also use LED lighting.", "zh": "我同意。我们还可以使用 LED 照明。"}, {"s": "Binbin", "speaker": "Binbin", "en": "And we should always unplug our computers and TVs.", "zh": "而且我们应该总是拔掉电脑和电视的插头。"}, {"s": "Mrs Green", "speaker": "Mrs Green", "en": "Great! Small changes can make a big difference.", "zh": "太棒了！小小的改变可以带来很大的不同。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Recycle", "title": "Mike's happy days", "scene": "Mike and Bill's game", "function": "描述事物", "patterns": ["It's an elephant. It's big.", "Is this bigger or smaller than the elephant?", "I think it's bigger than the elephant.", "The whale is the biggest, and the tiger is the smallest."], "turns": [{"s": "Bill", "speaker": "Bill", "en": "It's an elephant. It's big.", "zh": "这是一头大象。它很大。"}, {"s": "Bill", "speaker": "Bill", "en": "Guess! Is this bigger or smaller than the elephant?", "zh": "猜猜看！这个比大象大还是小？"}, {"s": "Mike", "speaker": "Mike", "en": "I think it's bigger than the elephant.", "zh": "我觉得它比大象大。"}, {"s": "Bill", "speaker": "Bill", "en": "No, it isn't. It's smaller. Look. It's a tiger.", "zh": "不，不是。它更小。看，这是一只老虎。"}, {"s": "Bill", "speaker": "Bill", "en": "Look. The other card is a whale.", "zh": "看。另一张卡片是一头鲸鱼。"}, {"s": "Mike", "speaker": "Mike", "en": "So the whale is the biggest, and the tiger is the smallest.", "zh": "所以鲸鱼是最大的，老虎是最小的。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Recycle", "title": "Mike's happy days", "scene": "Zip and Zoom's conversation", "function": "询问信息", "patterns": ["I have some good news and some bad news.", "Where are you going?", "Are you going to a new school?", "Will you promise to write to me?"], "turns": [{"s": "Zip", "speaker": "Zip", "en": "I have some good news and some bad news.", "zh": "我有一些好消息和一些坏消息。"}, {"s": "Zoom", "speaker": "Zoom", "en": "What is it?", "zh": "是什么？"}, {"s": "Zip", "speaker": "Zip", "en": "I'm going away for a long time.", "zh": "我要离开很长一段时间。"}, {"s": "Zoom", "speaker": "Zoom", "en": "I'm sorry to hear that.", "zh": "听到这个消息我很难过。"}, {"s": "Zoom", "speaker": "Zoom", "en": "Where are you going?", "zh": "你要去哪里？"}, {"s": "Zip", "speaker": "Zip", "en": "America. My father has a new job there.", "zh": "美国。我父亲在那里有一份新工作。"}, {"s": "Zoom", "speaker": "Zoom", "en": "That is good news for your father. It's sad news for me.", "zh": "这对你的父亲来说是好消息。对我来说是坏消息。"}, {"s": "Zip", "speaker": "Zip", "en": "Me too.", "zh": "我也是。"}, {"s": "Zoom", "speaker": "Zoom", "en": "Are you going to a new school?", "zh": "你要去一所新学校吗？"}, {"s": "Zip", "speaker": "Zip", "en": "I'm going to a new middle school. I'll be in Grade 7.", "zh": "我要去一所新的中学。我将在七年级。"}, {"s": "Zoom", "speaker": "Zoom", "en": "Will you promise to write to me?", "zh": "你答应给我写信吗？"}, {"s": "Zip", "speaker": "Zip", "en": "Of course.", "zh": "当然。"}, {"s": "Zoom", "speaker": "Zoom", "en": "Take care.", "zh": "保重。"}, {"s": "Zip", "speaker": "Zip", "en": "Take care.", "zh": "保重。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 1", "title": "How tall are you?", "scene": "A. 恐龙馆", "function": "描述事物", "patterns": ["How tall is it?", "It’s taller than ...", "I’m taller than ...", "I’m 1.65 metres."], "turns": [{"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "Look! That’s the tallest dinosaur in this hall.", "zh": "看！那是这个大厅里最高的恐龙。"}, {"s": "Mike", "speaker": "Mike", "en": "Yes, it is. How tall is it?", "zh": "是的。它有多高？"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "Maybe 4 metres.", "zh": "大概4米。"}, {"s": "Mike", "speaker": "Mike", "en": "Wow! It’s taller than both of us together.", "zh": "哇！它比我们俩加起来还高。"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "Look! There are more dinosaurs over there!", "zh": "看！那边还有更多恐龙！"}, {"s": "Mike", "speaker": "Mike", "en": "They’re all so big and tall.", "zh": "它们都又大又高。"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "Hey, this dinosaur isn’t tall! I’m taller than this one.", "zh": "嘿，这只恐龙不高！我比它高。"}, {"s": "Mike", "speaker": "Mike", "en": "Oh, yes. How tall are you?", "zh": "哦，是的。你有多高？"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "I’m 1.65 metres.", "zh": "我1.65米。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 1", "title": "How tall are you?", "scene": "A. Let’s talk", "function": "询问信息", "patterns": ["How tall are you?", "I’m 1.61 metres.", "I’m taller.", "You’re older than me."], "turns": [{"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "How tall are you?", "zh": "你有多高？"}, {"s": "John", "speaker": "John", "en": "I’m 1.61 metres.", "zh": "我1.61米。"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "Oh! I’m taller.", "zh": "哦！我更高。"}, {"s": "John", "speaker": "John", "en": "You’re older than me, too.", "zh": "你比我大。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 1", "title": "How tall are you?", "scene": "B. 鞋店", "function": "购物与价格", "patterns": ["What size are your shoes?", "My shoes are size 37.", "How heavy are you?", "I’m 48 kilograms."], "turns": [{"s": "Mike", "speaker": "Mike", "en": "Those shoes in the window are nice! Let’s have a look.", "zh": "橱窗里那些鞋真不错！我们去看看。"}, {"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "What size are your shoes, Mike?", "zh": "迈克，你的鞋多大码？"}, {"s": "Mike", "speaker": "Mike", "en": "Size 7.", "zh": "7码。"}, {"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "Size 7? That’s so small.", "zh": "7码？那太小了。"}, {"s": "Mike", "speaker": "Mike", "en": "In China I wear size 40 shoes.", "zh": "在中国我穿40码的鞋。"}, {"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "Oh! Your feet are bigger than mine. My shoes are size 37.", "zh": "哦！你的脚比我的大。我的鞋是37码。"}, {"s": "Mike", "speaker": "Mike", "en": "Really? You look taller than me.", "zh": "真的吗？你看起来比我高。"}, {"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "But I think you are heavier. How heavy are you?", "zh": "但我觉得你更重。你有多重？"}, {"s": "Mike", "speaker": "Mike", "en": "I’m 48 kilograms.", "zh": "我48公斤。"}, {"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "Yes, you’re heavier. I’m 46 kilograms.", "zh": "是的，你更重。我46公斤。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 1", "title": "How tall are you?", "scene": "B. Let’s talk", "function": "询问信息", "patterns": ["How heavy are you?", "I’m 52 kilograms.", "You’re heavier than me."], "turns": [{"s": "John", "speaker": "John", "en": "How heavy are you, Jim?", "zh": "吉姆，你有多重？"}, {"s": "Jim", "speaker": "Jim", "en": "I’m 52 kilograms.", "zh": "我52公斤。"}, {"s": "John", "speaker": "John", "en": "You’re heavier than me.", "zh": "你比我重。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 1", "title": "How tall are you?", "scene": "C. Story time", "function": "请求与应答", "patterns": ["How tall are you?", "I’m 1.8 metres.", "How heavy are you?", "I’m 86 kilograms."], "turns": [{"s": "Zebra", "speaker": "Zebra", "en": "They need a new goalkeeper.", "zh": "他们需要一名新守门员。"}, {"s": "Deer", "speaker": "Deer", "en": "I’d like to have a try.", "zh": "我想试一试。"}, {"s": "Giraffe", "speaker": "Giraffe", "en": "Me too.", "zh": "我也是。"}, {"s": "Dog", "speaker": "Dog", "en": "I can’t wait.", "zh": "我等不及了。"}, {"s": "Zoom", "speaker": "Zoom", "en": "How tall are you?", "zh": "你有多高？"}, {"s": "Deer", "speaker": "Deer", "en": "I’m 1.8 metres.", "zh": "我1.8米。"}, {"s": "Zip", "speaker": "Zip", "en": "How heavy are you?", "zh": "你有多重？"}, {"s": "Deer", "speaker": "Deer", "en": "I’m 86 kilograms.", "zh": "我86公斤。"}, {"s": "Zip", "speaker": "Zip", "en": "Mr Zebra is 10 centimetres taller than Mr Deer.", "zh": "斑马先生比鹿先生高10厘米。"}, {"s": "Zoom", "speaker": "Zoom", "en": "Yes, and he’s stronger. But he can’t catch the ball!", "zh": "是的，而且他更强壮。但他接不住球！"}, {"s": "Giraffe", "speaker": "Giraffe", "en": "I’m the tallest one.", "zh": "我是最高的。"}, {"s": "Zip", "speaker": "Zip", "en": "Sorry. Your neck is too long. The others can’t reach you.", "zh": "抱歉。你的脖子太长了。其他人够不到你。"}, {"s": "Zip", "speaker": "Zip", "en": "Football needs teamwork.", "zh": "足球需要团队合作。"}, {"s": "Hippo", "speaker": "Hippo", "en": "What’s happening here?", "zh": "这里发生什么了？"}, {"s": "Zip", "speaker": "Zip", "en": "Oh! Here’s the one we want!", "zh": "哦！这就是我们想要的人！"}, {"s": "Zoom", "speaker": "Zoom", "en": "Why? He’s too heavy!", "zh": "为什么？他太重了！"}, {"s": "Zip", "speaker": "Zip", "en": "We need a big guy!", "zh": "我们需要一个大个子！"}, {"s": "Zoom", "speaker": "Zoom", "en": "Oh! He’s almost bigger than the goal!", "zh": "哦！他几乎比球门还大！"}, {"s": "Dog", "speaker": "Dog", "en": "Yes! He’s an excellent goalkeeper.", "zh": "是的！他是一名出色的守门员。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Appendix 1", "title": "Songs in each unit", "scene": "Unit 1 My small cat", "function": "描述事物", "patterns": ["... is smaller than ...", "... is bigger than ...", "He’s smaller and shorter and younger than ...", "He’s bigger and longer and stronger than ..."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "My small cat, my small cat,", "zh": "我的小猫咪，我的小猫咪，"}, {"s": "Chant", "speaker": "Chant", "en": "My small cat is smaller than yours.", "zh": "我的小猫咪比你的小。"}, {"s": "Chant", "speaker": "Chant", "en": "He’s smaller and shorter and younger than yours.", "zh": "它比你的更小、更矮、更年轻。"}, {"s": "Chant", "speaker": "Chant", "en": "My small cat.", "zh": "我的小猫咪。"}, {"s": "Chant", "speaker": "Chant", "en": "My big dog, my big dog,", "zh": "我的大狗狗，我的大狗狗，"}, {"s": "Chant", "speaker": "Chant", "en": "My big dog is bigger than yours.", "zh": "我的大狗狗比你的大。"}, {"s": "Chant", "speaker": "Chant", "en": "He’s bigger and longer and stronger than yours.", "zh": "它比你的更大、更长、更强壮。"}, {"s": "Chant", "speaker": "Chant", "en": "My big dog.", "zh": "我的大狗狗。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Appendix 1", "title": "Songs in each unit", "scene": "Unit 2 Last weekend", "function": "询问信息", "patterns": ["What did you do last weekend?", "What did you do last night?", "I went to the zoo.", "I saw a film and played ping-pong."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "Last weekend I went to the zoo.", "zh": "上周末我去了动物园。"}, {"s": "Chant", "speaker": "Chant", "en": "What did you do last weekend?", "zh": "你上周末做了什么？"}, {"s": "Chant", "speaker": "Chant", "en": "I saw a film and played ping-pong.", "zh": "我看了一场电影，还打了乒乓球。"}, {"s": "Chant", "speaker": "Chant", "en": "What did you do last weekend?", "zh": "你上周末做了什么？"}, {"s": "Chant", "speaker": "Chant", "en": "Last night I watched TV.", "zh": "昨晚我看了电视。"}, {"s": "Chant", "speaker": "Chant", "en": "What did you do last night?", "zh": "你昨晚做了什么？"}, {"s": "Chant", "speaker": "Chant", "en": "I stayed at home and read a book.", "zh": "我待在家里看书。"}, {"s": "Chant", "speaker": "Chant", "en": "What did you do last night?", "zh": "你昨晚做了什么？"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Appendix 1", "title": "Songs in each unit", "scene": "Unit 3 Tell me about your holiday", "function": "询问信息", "patterns": ["Where did you go on your holiday?", "Did you swim? Did you shop?", "What did you do?", "I went swimming in the sea."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "Where did you go on your holiday, holiday, holiday?", "zh": "你假期去了哪里，假期，假期？"}, {"s": "Chant", "speaker": "Chant", "en": "Did you swim? Did you shop?", "zh": "你游泳了吗？你购物了吗？"}, {"s": "Chant", "speaker": "Chant", "en": "What did you do?", "zh": "你做了什么？"}, {"s": "Chant", "speaker": "Chant", "en": "I went swimming in the sea, in the sea, in the sea.", "zh": "我去海里游泳了，海里，海里，海里。"}, {"s": "Chant", "speaker": "Chant", "en": "I went shopping near the sea.", "zh": "我去海边购物了。"}, {"s": "Chant", "speaker": "Chant", "en": "I bought a gift for you.", "zh": "我给你买了一份礼物。"}, {"s": "Chant", "speaker": "Chant", "en": "Where did you go on your holiday, holiday, holiday?", "zh": "你假期去了哪里，假期，假期？"}, {"s": "Chant", "speaker": "Chant", "en": "Did you run? Did you jump?", "zh": "你跑步了吗？你跳跃了吗？"}, {"s": "Chant", "speaker": "Chant", "en": "What did you do?", "zh": "你做了什么？"}, {"s": "Chant", "speaker": "Chant", "en": "I rode a bike in the park, in the park, in the park.", "zh": "我在公园里骑自行车了，公园里，公园里，公园里。"}, {"s": "Chant", "speaker": "Chant", "en": "I didn’t see a big round stone,", "zh": "我没看到一块大圆石头，"}, {"s": "Chant", "speaker": "Chant", "en": "And ouch, I hurt my foot!", "zh": "哎呀，我弄伤了脚！"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Appendix 1", "title": "Songs in each unit", "scene": "Unit 4 Changes in me", "function": "描述事物", "patterns": ["Now I am taller than before.", "Every day I grow bigger.", "Once I was a young boy.", "Now I am a big boy."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "Now I am taller, taller than before.", "zh": "现在我更高了，比以前更高。"}, {"s": "Chant", "speaker": "Chant", "en": "Every day I grow bigger. Every day I grow more.", "zh": "我每天长得更大。我每天长得更多。"}, {"s": "Chant", "speaker": "Chant", "en": "Once I was a young boy, younger than I am today.", "zh": "曾经我是一个小男孩，比今天的我更年轻。"}, {"s": "Chant", "speaker": "Chant", "en": "Now I am a big boy, and I’m bigger every day.", "zh": "现在我是一个大男孩，而且我每天长得更大。"}, {"s": "Chant", "speaker": "Chant", "en": "For school I get up early, earlier than before.", "zh": "为了上学我起得很早，比以前更早。"}, {"s": "Chant", "speaker": "Chant", "en": "Every day I get up early, sometimes at four!", "zh": "我每天起得很早，有时候四点！"}, {"s": "Chant", "speaker": "Chant", "en": "Once I didn’t talk a lot. I wasn’t an active boy,", "zh": "曾经我不怎么说话。我不是一个活跃的男孩，"}, {"s": "Chant", "speaker": "Chant", "en": "But now I talk more than before. I always talk with joy!", "zh": "但现在我比以前说得更多了。我总是开心地说话！"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 2", "title": "Last weekend", "scene": "Mike打电话给爷爷，聊上周末", "function": "问候与介绍", "patterns": ["How was your weekend?", "What did you do?", "I stayed at home.", "Did you do anything else?"], "turns": [{"s": "Mike", "speaker": "Mike", "en": "Hi, Grandpa. How are you? How was your weekend?", "zh": "嗨，爷爷。你好吗？你上周末过得怎么样？"}, {"s": "Grandpa", "speaker": "Grandpa", "en": "I’m fine, Mike. It was good, thank you.", "zh": "我很好，Mike。过得不错，谢谢你。"}, {"s": "Mike", "speaker": "Mike", "en": "What did you do?", "zh": "你做了什么？"}, {"s": "Grandpa", "speaker": "Grandpa", "en": "Well, I stayed at home with your grandma. We drank tea in the afternoon and watched TV.", "zh": "嗯，我和你奶奶待在家里。我们下午喝茶，还看了电视。"}, {"s": "Mike", "speaker": "Mike", "en": "I watched TV, too. I watched some children’s shows on TV.", "zh": "我也看了电视。我看了一些儿童节目。"}, {"s": "Grandpa", "speaker": "Grandpa", "en": "That’s nice. Did you do anything else?", "zh": "那很好。你还做了别的事吗？"}, {"s": "Mike", "speaker": "Mike", "en": "Yes, I cleaned my room and washed my clothes.", "zh": "是的，我打扫了房间，还洗了衣服。"}, {"s": "Grandpa", "speaker": "Grandpa", "en": "You are a good boy!", "zh": "你是个好孩子！"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 2", "title": "Last weekend", "scene": "Let's talk：Mike和Chen Jie聊上周末", "function": "询问信息", "patterns": ["How was your weekend?", "It was fine, thanks.", "What did you do?", "I stayed at home and watched TV."], "turns": [{"s": "Mike", "speaker": "Mike", "en": "How was your weekend?", "zh": "你上周末过得怎么样？"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "It was fine, thanks.", "zh": "还不错，谢谢。"}, {"s": "Mike", "speaker": "Mike", "en": "What did you do?", "zh": "你做了什么？"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "I stayed at home and watched TV.", "zh": "我待在家里看了电视。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 2", "title": "Last weekend", "scene": "John和Amy聊上周末和去书店", "function": "邀请与建议", "patterns": ["Let’s go to the bookstore.", "Was it interesting?", "What did you do last weekend?", "Let’s go by bus."], "turns": [{"s": "John", "speaker": "John", "en": "Hey, Amy. Let’s go to the bookstore. I want to buy the new film magazine.", "zh": "嘿，Amy。我们去书店吧。我想买那本新的电影杂志。"}, {"s": "Amy", "speaker": "Amy", "en": "Oh, I read it last weekend.", "zh": "哦，我上周末读过了。"}, {"s": "John", "speaker": "John", "en": "Was it interesting?", "zh": "有趣吗？"}, {"s": "Amy", "speaker": "Amy", "en": "Yes, it talked about a lot of new films.", "zh": "是的，它讲了很多新电影。"}, {"s": "John", "speaker": "John", "en": "What did you do last weekend? Did you see a film?", "zh": "你上周末做了什么？你看电影了吗？"}, {"s": "Amy", "speaker": "Amy", "en": "No, I had a cold. I stayed at home all weekend and slept.", "zh": "没有，我感冒了。我整个周末都待在家里睡觉。"}, {"s": "Amy", "speaker": "Amy", "en": "Oh, I’m sorry. I’m happy you feel better now.", "zh": "哦，很抱歉。很高兴你现在感觉好些了。"}, {"s": "John", "speaker": "John", "en": "Thanks. Let’s go by bus. It’s faster than walking.", "zh": "谢谢。我们坐公交车去吧。比走路快。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 2", "title": "Last weekend", "scene": "Let's talk：John和Amy聊看电影", "function": "表达喜好", "patterns": ["What did you do last weekend?", "I saw a film.", "Did you like it?", "It was great."], "turns": [{"s": "John", "speaker": "John", "en": "What did you do last weekend?", "zh": "你上周末做了什么？"}, {"s": "Amy", "speaker": "Amy", "en": "I saw a film.", "zh": "我看了一部电影。"}, {"s": "John", "speaker": "John", "en": "Did you like it?", "zh": "你喜欢吗？"}, {"s": "Amy", "speaker": "Amy", "en": "Yes, I did. It was great.", "zh": "是的，我喜欢。太棒了。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 2", "title": "Last weekend", "scene": "Zip和Zoom聊上周末的安排", "function": "时间与日程", "patterns": ["How was your weekend?", "What did you do on Sunday morning?", "I cleaned my room. Then I visited my grandparents.", "That was a busy weekend."], "turns": [{"s": "Zip", "speaker": "Zip", "en": "How was your weekend?", "zh": "你上周末过得怎么样？"}, {"s": "Zoom", "speaker": "Zoom", "en": "It was a busy one.", "zh": "挺忙的。"}, {"s": "Zip", "speaker": "Zip", "en": "What did you do on Sunday morning?", "zh": "你周日上午做了什么？"}, {"s": "Zoom", "speaker": "Zoom", "en": "I cleaned my room. Then I visited my grandparents.", "zh": "我打扫了房间。然后我去看望了爷爷奶奶。"}, {"s": "Zip", "speaker": "Zip", "en": "What did you do on Sunday afternoon?", "zh": "你周日下午做了什么？"}, {"s": "Zoom", "speaker": "Zoom", "en": "I played football. Then I watched TV.", "zh": "我踢了足球。然后看了电视。"}, {"s": "Zip", "speaker": "Zip", "en": "That was a busy weekend.", "zh": "那是个忙碌的周末。"}, {"s": "Zoom", "speaker": "Zoom", "en": "Yes, it was. Now I need another weekend.", "zh": "是的。现在我需要再有一个周末。"}, {"s": "Zip", "speaker": "Zip", "en": "What did you do on Saturday afternoon?", "zh": "你周六下午做了什么？"}, {"s": "Zoom", "speaker": "Zoom", "en": "I did my homework. Then I went fishing.", "zh": "我做了作业。然后去钓鱼了。"}, {"s": "Zip", "speaker": "Zip", "en": "What did you do on Saturday morning?", "zh": "你周六上午做了什么？"}, {"s": "Zoom", "speaker": "Zoom", "en": "I washed my schoolbag. Then I went to the park.", "zh": "我洗了书包。然后去了公园。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 2", "title": "Last weekend", "scene": "Story time：同学关心受伤的同学", "function": "感受与情绪", "patterns": ["What happened?", "Are you all right?", "Can I come and visit you?", "I fell off my bike and hurt my foot."], "turns": [{"s": "A", "speaker": "A", "en": "You didn’t come to school. What happened?", "zh": "你没来上学。发生什么事了？"}, {"s": "B", "speaker": "B", "en": "Oh dear! Are you all right?", "zh": "天哪！你还好吗？"}, {"s": "A", "speaker": "A", "en": "Can I come and visit you?", "zh": "我可以来看你吗？"}, {"s": "B", "speaker": "B", "en": "Yes, I’m OK. Thanks.", "zh": "好的，我没事。谢谢。"}, {"s": "A", "speaker": "A", "en": "I fell off my bike and hurt my foot.", "zh": "我从自行车上摔下来，脚受伤了。"}, {"s": "B", "speaker": "B", "en": "Sure! You can see my photos from the Labour Day holiday.", "zh": "当然！你可以看看我劳动节假期的照片。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 3", "title": "Where did you go?", "scene": "Amy打电话给John，询问假期经历", "function": "询问信息", "patterns": ["What happened?", "Where did you go?", "Did you go to ...?", "I rode a horse."], "turns": [{"s": "Amy", "speaker": "Amy", "en": "What happened?", "zh": "发生什么事了？"}, {"s": "John", "speaker": "John", "en": "I fell off my bike last Saturday and hurt my foot.", "zh": "上周六我从自行车上摔下来，伤了脚。"}, {"s": "Amy", "speaker": "Amy", "en": "That’s too bad! Are you all right?", "zh": "太糟糕了！你还好吗？"}, {"s": "John", "speaker": "John", "en": "I’m OK now. Come and look at my photos from the Labour Day holiday.", "zh": "我现在没事了。来看看我劳动节假期的照片吧。"}, {"s": "Amy", "speaker": "Amy", "en": "Where did you go?", "zh": "你去了哪里？"}, {"s": "John", "speaker": "John", "en": "Mt. Tianshan, Xinjiang. I rode a horse. Look, it’s very small!", "zh": "新疆天山。我骑了马。看，它很小！"}, {"s": "Amy", "speaker": "Amy", "en": "Oh, yes. It looks like a mule! Did you go to Turpan?", "zh": "哦，是的。它看起来像骡子！你去吐鲁番了吗？"}, {"s": "John", "speaker": "John", "en": "Yes, we did. We saw lots of grapes there, but we couldn’t eat them. They won’t be ready till August.", "zh": "是的，我们去了。我们在那里看到了很多葡萄，但不能吃。它们要到八月才成熟。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 3", "title": "Where did you go?", "scene": "Sarah和Wu Binbin询问Amy寒假经历", "function": "询问信息", "patterns": ["Where did you go over the winter holiday?", "How did you go there?", "What did you do there?", "How was the beach?"], "turns": [{"s": "Sarah", "speaker": "Sarah", "en": "Where did you go over the winter holiday?", "zh": "你寒假去了哪里？"}, {"s": "Amy", "speaker": "Amy", "en": "My family and I went to Sanya.", "zh": "我和家人去了三亚。"}, {"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "Really? Did you like it?", "zh": "真的吗？你喜欢那里吗？"}, {"s": "Amy", "speaker": "Amy", "en": "Yes, it was so warm.", "zh": "是的，那里很暖和。"}, {"s": "Sarah", "speaker": "Sarah", "en": "Hainan is far from here. How did you go there?", "zh": "海南离这里很远。你们怎么去的？"}, {"s": "Amy", "speaker": "Amy", "en": "We went there by plane.", "zh": "我们坐飞机去的。"}, {"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "How was the beach? What did you do there?", "zh": "海滩怎么样？你在那里做了什么？"}, {"s": "Amy", "speaker": "Amy", "en": "It was beautiful. I took lots of pictures, and I also went swimming.", "zh": "很美。我拍了很多照片，还去游泳了。"}, {"s": "Sarah", "speaker": "Sarah", "en": "Sounds great! Can I see your pictures sometime?", "zh": "听起来很棒！我什么时候能看看你的照片？"}, {"s": "Amy", "speaker": "Amy", "en": "Sure.", "zh": "当然可以。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 3", "title": "Where did you go?", "scene": "Amy询问Wu Binbin暑假情况", "function": "询问信息", "patterns": ["How was your summer holiday?", "I went swimming every weekend.", "I took lots of pictures."], "turns": [{"s": "Amy", "speaker": "Amy", "en": "How was your summer holiday, Binbin?", "zh": "Binbin，你的暑假过得怎么样？"}, {"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "It was good. I went swimming every weekend and took lots of pictures.", "zh": "很好。我每个周末都去游泳，还拍了很多照片。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 3", "title": "Where did you go?", "scene": "Zoom和Zip谈论Zoom的月球之旅（梦境）", "function": "询问信息", "patterns": ["Where did you go?", "How did you go there?", "What did you see?", "Did you take any pictures?"], "turns": [{"s": "Zoom", "speaker": "Zoom", "en": "Am I now on the moon? I can’t believe it! She must be Chang’e. Oh, there is the rabbit.", "zh": "我现在在月球上吗？我不敢相信！她一定是嫦娥。哦，那是兔子。"}, {"s": "Zip", "speaker": "Zip", "en": "Where did you go?", "zh": "你去了哪里？"}, {"s": "Zoom", "speaker": "Zoom", "en": "I went to the moon.", "zh": "我去了月球。"}, {"s": "Zip", "speaker": "Zip", "en": "How did you go there?", "zh": "你怎么去的？"}, {"s": "Zoom", "speaker": "Zoom", "en": "By spaceship.", "zh": "坐宇宙飞船。"}, {"s": "Zip", "speaker": "Zip", "en": "What did you see?", "zh": "你看到了什么？"}, {"s": "Zoom", "speaker": "Zoom", "en": "I saw Chang’e, the rabbit and the tree.", "zh": "我看到了嫦娥、兔子和树。"}, {"s": "Zip", "speaker": "Zip", "en": "Did you take any pictures?", "zh": "你拍照了吗？"}, {"s": "Zoom", "speaker": "Zoom", "en": "Yes, I did. Oops, where did I put the pictures?", "zh": "是的，我拍了。哎呀，我把照片放哪儿了？"}, {"s": "Zoom", "speaker": "Zoom", "en": "Oh, it was a dream.", "zh": "哦，原来是个梦。"}, {"s": "Zip", "speaker": "Zip", "en": "How was your holiday?", "zh": "你的假期怎么样？"}, {"s": "Zoom", "speaker": "Zoom", "en": "It was fun.", "zh": "很有趣。"}, {"s": "Zoom", "speaker": "Zoom", "en": "It’s time to go.", "zh": "该走了。"}, {"s": "Zip", "speaker": "Zip", "en": "Good! Here comes a spaceship.", "zh": "太好了！宇宙飞船来了。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 3", "title": "Where did you go?", "scene": "Wu Binbin和父亲看旧照片", "function": "描述事物", "patterns": ["You weren’t very big then.", "I didn’t like PE class very much.", "I couldn’t run fast or play basketball well."], "turns": [{"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "Binbin, that’s your father.", "zh": "Binbin，那是你爸爸。"}, {"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "You weren’t very big then, Mr Wu!", "zh": "吴先生，那时候您还不算大！"}, {"s": "Mr Wu", "speaker": "Mr Wu", "en": "No, so I didn’t like PE class very much. I couldn’t run fast or play basketball well.", "zh": "是的，所以我不太喜欢体育课。我跑不快，篮球也打不好。"}, {"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "Wow!", "zh": "哇！"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 4", "title": "Then and now", "scene": "Then and now A", "function": "询问信息", "patterns": ["There was no ... in my old school.", "Tell us about your school, please.", "Could you see ... at night?", "How do you know that?"], "turns": [{"s": "Grandpa", "speaker": "Grandpa", "en": "Wow, a library! There was no library in my old school.", "zh": "哇，一个图书馆！我以前的学校没有图书馆。"}, {"s": "Sarah", "speaker": "Sarah", "en": "Tell us about your school, please.", "zh": "请给我们讲讲你的学校吧。"}, {"s": "Grandpa", "speaker": "Grandpa", "en": "There was only one small building on a hill.", "zh": "山上只有一栋小楼。"}, {"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "Could you see stars at night?", "zh": "你晚上能看到星星吗？"}, {"s": "Grandpa", "speaker": "Grandpa", "en": "Yes, I liked the stars.", "zh": "是的，我喜欢星星。"}, {"s": "Sarah", "speaker": "Sarah", "en": "Me too. One day I’m going to visit the moon.", "zh": "我也是。总有一天我要去月球。"}, {"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "The Americans took about five days to get there in 1969.", "zh": "1969年美国人花了大约五天到达那里。"}, {"s": "Sarah", "speaker": "Sarah", "en": "How do you know that?", "zh": "你怎么知道的？"}, {"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "Easy, I looked it up on the Internet.", "zh": "很简单，我在网上查到的。"}, {"s": "Grandpa", "speaker": "Grandpa", "en": "Ah! There were no computers or Internet in my time.", "zh": "啊！我那个时代没有电脑也没有互联网。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 4", "title": "Then and now", "scene": "Let's talk A", "function": "询问信息", "patterns": ["There was no ... in my school ... years ago.", "Now there’s a new one in our school."], "turns": [{"s": "Wu Binbin’s father", "speaker": "Wu Binbin’s father", "en": "There was no gym in my school thirty years ago.", "zh": "三十年前我的学校没有体育馆。"}, {"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "Now there’s a new one in our school.", "zh": "现在我们学校有一个新的。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 4", "title": "Then and now", "scene": "Then and now B", "function": "描述事物", "patterns": ["Before, I was ... Now, I’m ...", "How about you?", "I was ..., so I couldn’t ...", "Now, I ... every day."], "turns": [{"s": "Chen Jie", "speaker": "Chen Jie", "en": "John, come and look at Mike’s old photos!", "zh": "约翰，来看看迈克的旧照片吧！"}, {"s": "John", "speaker": "John", "en": "That’s funny, Mike! You’re wearing a pink T-shirt.", "zh": "真有趣，迈克！你穿着一件粉色T恤。"}, {"s": "Mike", "speaker": "Mike", "en": "Yes, but I don’t like pink now.", "zh": "是的，但我现在不喜欢粉色了。"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "We are all different now!", "zh": "我们现在都不一样了！"}, {"s": "Mike", "speaker": "Mike", "en": "Right. Before, I was quiet. Now, I’m very active in class. How about you?", "zh": "对。以前我很安静。现在我在课堂上很活跃。你呢？"}, {"s": "John", "speaker": "John", "en": "Well, I was short, so I couldn’t ride my bike well. Now, I go cycling every day. I like it very much.", "zh": "嗯，我以前很矮，所以骑不好自行车。现在我每天都骑车。我非常喜欢。"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "That’s good exercise.", "zh": "那是很好的锻炼。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 4", "title": "Then and now", "scene": "Let's talk B", "function": "感受与情绪", "patterns": ["I didn’t like ... before.", "How about now?", "Now I love to ..., so I like ..."], "turns": [{"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "I didn’t like winter before. I thought it was too cold, and I couldn’t go cycling.", "zh": "我以前不喜欢冬天。我觉得太冷了，而且不能骑车。"}, {"s": "Mike", "speaker": "Mike", "en": "How about now?", "zh": "现在呢？"}, {"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "Now I love to ice-skate, so I like winter.", "zh": "现在我喜欢滑冰，所以我喜欢冬天。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 4", "title": "Then and now", "scene": "What a dream!", "function": "描述事物", "patterns": ["I had an interesting dream last night.", "What did you dream about?", "What happened then?", "What a dream!"], "turns": [{"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "Mum, I had an interesting dream last night.", "zh": "妈妈，我昨晚做了一个有趣的梦。"}, {"s": "Mum", "speaker": "Mum", "en": "What did you dream about?", "zh": "你梦到了什么？"}, {"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "I had a race with Dad and Max, but I couldn’t run fast.", "zh": "我和爸爸还有马克赛跑，但我跑不快。"}, {"s": "Mum", "speaker": "Mum", "en": "What happened then?", "zh": "然后发生了什么？"}, {"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "Robin gave me some water. I drank it and then could run very fast. Suddenly I tripped and fell. Then I woke up.", "zh": "罗宾给了我一些水。我喝了之后就能跑得很快。突然我绊倒摔了一跤。然后我醒了。"}, {"s": "Mum", "speaker": "Mum", "en": "What a dream!", "zh": "真是个梦啊！"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Unit 4", "title": "Then and now", "scene": "Then and now C", "function": "描述事物", "patterns": ["... didn’t ...?", "It’s OK. They didn’t ... either!", "What will ... do?", "Don’t worry. People will help them."], "turns": [{"s": "Zip", "speaker": "Zip", "en": "Oh, cavemen didn’t cook their meat?", "zh": "哦，穴居人不做熟肉吗？"}, {"s": "Zoom", "speaker": "Zoom", "en": "It’s OK. They didn’t do the dishes either!", "zh": "没关系。他们也不洗碗！"}, {"s": "Zip", "speaker": "Zip", "en": "Heal the world!", "zh": "治愈世界！"}, {"s": "Zoom", "speaker": "Zoom", "en": "Make it a better place!", "zh": "让它变得更美好！"}, {"s": "Zip", "speaker": "Zip", "en": "Look! How beautiful the world was! Oh! What will the birds do?", "zh": "看！世界曾经多么美丽！哦！鸟儿会怎么办？"}, {"s": "Zoom", "speaker": "Zoom", "en": "Don’t worry. People will help them.", "zh": "别担心。人们会帮助它们的。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Appendix 4", "title": "Useful expressions", "scene": "Unit 1 恐龙身高与鞋码体重", "function": "询问信息", "patterns": ["That’s the tallest ... in ...", "It’s taller than ...", "How tall are you? I’m ... metres.", "What size are your shoes? My shoes are size ..."], "turns": [{"s": "A", "speaker": "A", "en": "That’s the tallest dinosaur in this hall.", "zh": "那是这个厅里最高的恐龙。"}, {"s": "B", "speaker": "B", "en": "It’s taller than both of us together.", "zh": "它比我俩加起来还高。"}, {"s": "A", "speaker": "A", "en": "How tall are you?", "zh": "你有多高？"}, {"s": "B", "speaker": "B", "en": "I’m 1.65 metres.", "zh": "我身高1.65米。"}, {"s": "A", "speaker": "A", "en": "What size are your shoes, Mike?", "zh": "迈克，你穿多大号的鞋？"}, {"s": "B", "speaker": "B", "en": "Your feet are bigger than mine. My shoes are size 37.", "zh": "你的脚比我的大。我穿37号的鞋。"}, {"s": "A", "speaker": "A", "en": "How heavy are you?", "zh": "你体重多少？"}, {"s": "B", "speaker": "B", "en": "I’m 48 kilograms.", "zh": "我体重48公斤。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Appendix 4", "title": "Useful expressions", "scene": "Unit 2 周末过得怎么样", "function": "询问信息", "patterns": ["How was your weekend? It was good, thank you.", "What did you do? I ...", "Did you do anything else? Yes, I ..."], "turns": [{"s": "A", "speaker": "A", "en": "How was your weekend?", "zh": "你周末过得怎么样？"}, {"s": "B", "speaker": "B", "en": "It was good, thank you.", "zh": "很好，谢谢。"}, {"s": "A", "speaker": "A", "en": "What did you do?", "zh": "你（周末）干什么了？"}, {"s": "B", "speaker": "B", "en": "I stayed at home with your grandma. We drank tea in the afternoon and watched TV.", "zh": "我和你外婆待在家里。我们喝了下午茶，还看了电视。"}, {"s": "A", "speaker": "A", "en": "Did you do anything else?", "zh": "你还做了其他什么事吗？"}, {"s": "B", "speaker": "B", "en": "Yes, I cleaned my room and washed my clothes.", "zh": "是的，我打扫了房间，还洗了衣服。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit": "Appendix 4", "title": "Useful expressions", "scene": "Unit 2 买杂志与上周末", "function": "请求与应答", "patterns": ["I want to buy ...", "What did you do last weekend?", "Did you see a film? No, I ..."], "turns": [{"s
