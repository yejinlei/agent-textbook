opic": "制作颜色翻翻书", "words": ["colour", "choose", "like", "book", "yellow", "red", "blue", "bananas", "ducks", "share"], "comprehension": [], "keypoints": ["I like + 颜色.", "What colours do you like?", "颜色描述事物 Bananas are yellow.", "祈使句 Make / Share"], "writing": "Make your book. Share your book in class."}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 5", "name": "Colour meanings", "genre": "短文", "source": "Start to read", "text": "It's red. Red\ncan say \"No!\"\nIt's green. Green\ncan say \"Go!\"\nIt's blue. Blue can\nsay \"Use again!\"\nIt's yellow. Yellow\ncan say \"Be careful!\"", "zh": "它是红色。红色\n可以说“不！”\n它是绿色。绿色\n可以说“走！”\n它是蓝色。蓝色可以说\n“再用一次！”\n它是黄色。黄色\n可以说“小心！”", "topic": "颜色的含义", "words": ["red", "green", "blue", "yellow", "can", "say", "No", "Go", "Use again", "Be careful"], "comprehension": [], "keypoints": ["It's + 颜色.", "情态动词 can + 动词原形", "颜色含义表达", "祈使句 Be careful!"], "writing": ""}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 5", "name": "I am a sunflower", "genre": "故事", "source": "Let's read", "text": "I am a sunflower. I am\ntall and green.\nNow I am a big\nyellow flower. Bees\ncome. They are\nyellow and black.\nI give them food.\nThen I am green\nand yellow.\nNow it is cold. I am\ngreen and brown.\nI am gone. But my\nchildren grow.", "zh": "我是一朵向日葵。我\n又高又绿。\n现在我是一朵大大的\n黄色花朵。蜜蜂\n来了。它们\n是黄色和黑色的。\n我给它们食物。\n然后我是绿色\n和黄色。\n现在天气冷了。我是\n绿色和棕色。\n我消失了。但我的\n孩子们长大了。", "topic": "向日葵的生长过程", "words": ["sunflower", "tall", "green", "yellow", "flower", "bees", "black", "food", "brown", "grow"], "comprehension": [], "keypoints": ["一般现在时 I am / They are", "颜色词描述事物", "时间顺序词 Now / Then", "主谓宾结构 I give them food"], "writing": ""}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 6", "name": "Start to read", "genre": "故事", "source": "Start to read", "text": "It's Xinxin's birthday soon.\nListen and circle.\n1. How many people are there?\n2. How old is Matt?\n1. How old is Xinxin now?\n2. What time is the party?\n3. What numbers do you see on the card?\n• One.\n• Two.\n• Three.\n• Four.\n• Five.\n• Six.\n• Seven.\n• Eight.\n• Nine.\n• Ten.\n• Three.\n• Four.\n• Five.\n• Six.\n• Five.\n• Seven.\n• 5 p.m.\n• 6 p.m.\nRead the card and circle the numbers.", "zh": "Xinxin的生日快到了。听一听并圈出答案。1. 有多少人？2. Matt几岁？1. Xinxin现在几岁？2. 派对是几点？3. 你在卡片上看到了哪些数字？一、二、三、四、五、六、七、八、九、十、三、四、五、六、五、七、下午5点、下午6点。读卡片并圈出数字。", "topic": "生日与数字", "words": ["birthday", "soon", "listen", "circle", "how many", "how old", "party", "card", "numbers", "read"], "comprehension": [{"q": "How many people are there?", "options": ["One.", "Two.", "Three.", "Four.", "Five.", "Six."], "answer": ""}, {"q": "How old is Matt?", "options": ["Three.", "Four.", "Five.", "Six."], "answer": ""}, {"q": "How old is Xinxin now?", "options": ["Five.", "Six.", "Seven."], "answer": ""}, {"q": "What time is the party?", "options": ["5 p.m.", "6 p.m."], "answer": ""}, {"q": "What numbers do you see on the card?", "options": ["One.", "Two.", "Three.", "Four.", "Five.", "Six."], "answer": ""}], "keypoints": ["how many 句型", "how old 句型", "数字 1-10", "时间表达 p.m."], "writing": "Read the card and circle the numbers."}, {"grade": "三年级", "term": "上册", "book": "三年级上册", "unit": "Unit 6", "name": "Start to read", "genre": "故事", "source": "Start to read", "text": "It's Xinxin's birthday soon.\nListen and circle.\n1. How many people are there?\n2. How old is Matt?\n1. How old is Xinxin now?\n2. What time is the party?\n3. What numbers do you see on the card?\n• One.\n• Two.\n• Three.\n• Four.\n• Five.\n• Six.\n• Seven.\n• Eight.\n• Nine.\n• Ten.\n• Three.\n• Four.\n• Five.\n• Six.\n• Five.\n• Seven.\n• 5 p.m.\n• 6 p.m.\nRead the card and circle the numbers.", "zh": "心心快过生日了。听一听并圈出答案。1. 有多少人？2. 马特几岁？1. 心心现在几岁？2. 派对几点开始？3. 你在卡片上看到了哪些数字？一、二、三、四、五、六、七、八、九、十、三、四、五、六、五、七、下午五点、下午六点。读一读卡片并圈出数字。", "topic": "生日与数字", "words": ["birthday", "soon", "listen", "circle", "how many", "how old", "party", "card", "numbers", "time"], "comprehension": [{"q": "How many people are there?", "options": ["One.", "Two.", "Three.", "Four.", "Five.", "Six."], "answer": ""}, {"q": "How old is Matt?", "options": ["Three.", "Four.", "Five.", "Six."], "answer": ""}, {"q": "How old is Xinxin now?", "options": ["Five.", "Six.", "Seven."], "answer": ""}, {"q": "What time is the party?", "options": ["5 p.m.", "6 p.m."], "answer": ""}, {"q": "What numbers do you see on the card?", "options": ["One.", "Two.", "Three.", "Four.", "Five.", "Six."], "answer": ""}], "keypoints": ["How old are you?", "How many...?", "数字1-10", "时间表达5 p.m./6 p.m."], "writing": ""}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "name": "Reading time", "genre": "故事", "source": "Reading", "text": "Hi! I'm Ra.\nNice to meet you.\nNice to meet you too.\nZoom, look!\nThis book is so cool!\nWow!\nWe're from China.\nHello! I'm Zip.\nWhat's your name?\nWelcome to Russia!\nWhere are you from?\nWhat a trip!\nWhat fun!\nEast or west, home is best!\nBear, who's that?\nThat's my neighbour, Beaver.\nLook! Pandas!\nWe're back in China!", "zh": "嗨！我是Ra。很高兴见到你。我也很高兴见到你。Zoom，看！这本书太酷了！哇！我们来自中国。你好！我是Zip。你叫什么名字？欢迎来到俄罗斯！你从哪里来？多么棒的旅行啊！多么有趣啊！无论东方还是西方，家是最好的地方！Bear，那是谁？那是我的邻居，Beaver。看！熊猫！我们回到中国了！", "topic": "介绍新朋友、国家与旅行", "words": ["neighbour", "Beaver", "pandas", "China", "Russia", "trip", "fun", "East", "west", "home"], "comprehension": [], "keypoints": ["一般现在时", "名词所有格", "感叹句", "be动词am/is/are"], "writing": ""}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "name": "Read and write", "genre": "对话", "source": "Read and write", "text": "After you.\nI'm from Henan, China.\nMy name is Linlin.\nYes.\nSawat di kha! Hello! I'm from Thailand.\nDo you like pineapple rice?\nThank you.\nHi! I'm John.\nWhere are you from?", "zh": "你先请。我来自中国河南。我叫林林。是的。萨瓦迪卡！你好！我来自泰国。你喜欢菠萝饭吗？谢谢。嗨！我是John。你从哪里来？", "topic": "在美食节上认识新朋友", "words": ["After you", "Henan", "China", "Thailand", "pineapple rice", "Thank you", "Where are you from"], "comprehension": [], "keypoints": ["一般现在时", "be动词am/is", "疑问句Where are you from", "礼貌用语After you / Thank you"], "writing": ""}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "name": "Reading time", "genre": "故事", "source": "Reading", "text": "Hi! I'm Ra.\nNice to meet you.\nNice to meet you too.\nZoom, look!\nThis book is so cool!\nWow!\nWe're from China.\nHello! I'm Zip.\nWhat's your name?\nWelcome to Russia!\nWhere are you from?\nWhat a trip!\nWhat fun!\nEast or west,\nhome is best!\nBear, who's that?\nThat's my neighbour, Beaver.\nLook! Pandas!\nWe're back in China!", "zh": "你好！我是Ra。\n很高兴见到你。\n我也很高兴见到你。\nZoom，看！\n这本书太酷了！\n哇！\n我们来自中国。\n你好！我是Zip。\n你叫什么名字？\n欢迎来到俄罗斯！\n你从哪里来？\n多么棒的一次旅行啊！\n多么有趣啊！\n无论东方还是西方，家是最好的地方！\nBear，那是谁？\n那是我的邻居，Beaver。\n看！熊猫！\n我们回到中国了！", "topic": "介绍新朋友、旅行与家乡", "words": ["neighbour", "from", "China", "Russia", "trip", "fun", "home", "pandas", "welcome", "meet"], "comprehension": [], "keypoints": ["一般现在时", "be动词am/is/are", "介词from", "感叹句What a/What fun"], "writing": ""}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 1", "name": "Read and write", "genre": "对话", "source": "Read and write", "text": "After you.\nI'm from Henan, China.\nMy name is Linlin.\nYes.\nSawat di kha! Hello! I'm from Thailand.\nDo you like pineapple rice?\nThank you.\nHi! I'm John.\nWhere are you from?", "zh": "你先请。\n我来自中国河南。\n我叫林林。\n是的。\n萨瓦迪卡！你好！我来自泰国。\n你喜欢菠萝饭吗？\n谢谢。\n你好！我是John。\n你从哪里来？", "topic": "在美食节上认识新朋友", "words": ["from", "China", "Thailand", "pineapple rice", "name", "where", "hello", "thank you", "after you", "sawat di kha"], "comprehension": [], "keypoints": ["一般现在时", "介词from", "疑问句Where are you from?", "礼貌用语After you / Thank you"], "writing": ""}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "name": "Reading time", "genre": "短文", "source": "Reading", "text": "We like fruit. We can have fun with fruit.\nWe can make animals with fruit.\nWe have friends.\nWe can make fruit friends too.\nWe can act as fruit.\nWe can be tall or short.\nWe can be fat or thin.\nWe can also \"write\" with fruit.\nWe can express our ideas in different ways!\nIt is fun!", "zh": "我们喜欢水果。我们可以用水果玩得开心。我们可以用水果做动物。我们有朋友。我们也可以做水果朋友。我们可以扮演水果。我们可以高也可以矮。我们可以胖也可以瘦。我们还可以用水果“写字”。我们可以用不同的方式表达我们的想法！这很有趣！", "topic": "用水果表达想法", "words": ["fruit", "make animals", "act as", "tall", "short", "fat", "thin", "write", "express", "different ways"], "comprehension": [], "keypoints": ["情态动词 can 表能力", "形容词比较 tall/short, fat/thin", "动词短语 make animals, act as", "表达想法 express our ideas"], "writing": ""}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "name": "Read and write", "genre": "短文", "source": "Read and write", "text": "I have a dog. It's thin.\nIt has a long body.\nI like it.\nI often make a card for my dad.\nWhat about you?", "zh": "我有一只狗。它很瘦。它有一个长长的身体。我喜欢它。我经常给我爸爸做一张卡片。你呢？", "topic": "介绍宠物与表达爱意", "words": ["dog", "thin", "long body", "like", "often", "make a card", "for", "dad", "What about you"], "comprehension": [], "keypoints": ["一般现在时", "形容词 thin, long", "动词短语 make a card", "疑问句 What about you?"], "writing": "Think about your pets or friends. Choose some words and talk in pairs."}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "name": "Read and write", "genre": "对话", "source": "Read and write", "text": "Do you have a pet?\nYes, I have a dog. It's thin.\nIt has a long body. I like it.\nDo you listen to your friend with care?\nYes, I do.\nDo you often play together?\n...", "zh": "你有宠物吗？是的，我有一只狗。它很瘦。它有一个长长的身体。我喜欢它。你会用心听朋友说话吗？是的，我会。你们经常一起玩吗？……", "topic": "宠物与朋友相处", "words": ["pet", "dog", "thin", "long body", "listen with care", "play together", "often", "Yes, I do"], "comprehension": [], "keypoints": ["一般疑问句 Do you...?", "回答 Yes, I do. / No, I don't.", "动词短语 listen with care, play together", "频率副词 often"], "writing": ""}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "name": "Reading time", "genre": "短文", "source": "Reading", "text": "We like fruit. We can have fun with fruit.\nWe can make animals with fruit.\nWe have friends.\nWe can make fruit friends too.\nWe can act as fruit.\nWe can be tall or short.\nWe can be fat or thin.\nWe can also \"write\" with fruit.\nWe can express our ideas in different ways!\nIt is fun!", "zh": "我们喜欢水果。我们可以用水果玩得开心。我们可以用水果做动物。我们有朋友。我们也可以做水果朋友。我们可以扮演水果。我们可以高也可以矮。我们可以胖也可以瘦。我们还可以用水果“写字”。我们可以用不同的方式表达我们的想法！这很有趣！", "topic": "用水果表达想法", "words": ["fruit", "make animals", "friends", "act as", "tall", "short", "fat", "thin", "write", "express our ideas"], "comprehension": [], "keypoints": ["情态动词 can 表能力", "形容词比较 tall/short, fat/thin", "动词短语 make animals, act as, express ideas", "一般现在时"], "writing": ""}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 2", "name": "Read and write", "genre": "书信", "source": "Read and write", "text": "I have a dog. It's thin.\nIt has a long body. I like it.\nI often make a card for my dad.\nWhat about you?\nDo you have a pet?\nYes, I have a dog. It's thin.\nIt has a long body. I like it.\nDo you listen to your friend with care?\nYes, I do.\nDo you often play together?\n...", "zh": "我有一只狗。它很瘦。它有一个长长的身体。我喜欢它。我经常给我爸爸做一张卡片。你呢？你有宠物吗？是的，我有一只狗。它很瘦。它有一个长长的身体。我喜欢它。你会用心听你的朋友说话吗？是的，我会。你们经常一起玩吗？……", "topic": "介绍宠物与表达友谊", "words": ["have a dog", "thin", "long body", "make a card", "listen with care", "play together", "share my toys", "sing and dance"], "comprehension": [], "keypoints": ["一般现在时", "there be / have 表拥有", "形容词 thin, long, short", "疑问句 Do you...? 及其回答 Yes, I do. / No, I don't."], "writing": "Think about your pets or friends. Choose some words and talk in pairs."}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "name": "Reading time", "genre": "短文", "source": "Reading", "text": "We learn from Mum and Dad. Polar bears do the same.\nWe play and learn. Lions do the same.\nWe taste food with our tongues. Frogs get food with their tongues.\nWe speak and learn. Ants can't speak. But they can use smell to learn.\nWe draw maps with pencils and paper. Bees can't draw. But they can make a \"map\".\nEagles can see a rabbit from the sky. We can't. But we can use tools to see more!", "zh": "我们从爸爸妈妈那里学习。北极熊也是这样。\n我们边玩边学。狮子也是这样。\n我们用舌头品尝食物。青蛙用舌头获取食物。\n我们说话并学习。蚂蚁不会说话。但它们可以用嗅觉来学习。\n我们用铅笔和纸画地图。蜜蜂不会画。但它们可以制作一张“地图”。\n鹰能从空中看到兔子。我们不能。但我们可以用工具看得更多！", "topic": "人与动物如何学习", "words": ["learn", "taste", "tongues", "speak", "smell", "draw", "maps", "tools", "see", "same"], "comprehension": [], "keypoints": ["一般现在时", "比较结构 do the same", "情态动词 can/can't", "感官动词 taste/speak/smell/see"], "writing": ""}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "name": "Read and write", "genre": "短文", "source": "Read and write", "text": "What helps you learn?\nI can hear with my ears.\nI can see with my eyes.\nI can smell with my nose.\nI can touch with my hands.\nI can use a bag, a book, paper, a pen, a pencil and a ruler to learn.\nCan I use your eraser, please?\nWhat are these? They're grapes.", "zh": "什么帮助你学习？\n我可以用耳朵听。\n我可以用眼睛看。\n我可以用鼻子闻。\n我可以用手触摸。\n我可以用书包、书、纸、钢笔、铅笔和尺子来学习。\n请问我可以用你的橡皮吗？\n这些是什么？它们是葡萄。", "topic": "感官与学习工具", "words": ["hear", "see", "smell", "touch", "ears", "eyes", "nose", "hands", "eraser", "grapes"], "comprehension": [], "keypoints": ["情态动词 can", "感官动词 hear/see/smell/touch", "礼貌请求 Can I use your ..., please?", "指示代词 these/they're"], "writing": "What helps you learn? I can ... with my ... . I can use a ..., a ... and some ... to learn. Can I use your ..., please? What are these? They're ... ."}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "name": "Read and write", "genre": "短文", "source": "Read and write", "text": "I hear birds.\nI smell flowers.\nI feel the sun.\nI taste an apple.\nI touch the grass.\nI see spring.", "zh": "我听到鸟叫。\n我闻到花香。\n我感受到阳光。\n我品尝一个苹果。\n我触摸草地。\n我看到春天。", "topic": "用感官感受春天", "words": ["hear", "smell", "feel", "taste", "touch", "see", "birds", "flowers", "sun", "spring"], "comprehension": [], "keypoints": ["一般现在时", "感官动词 hear/smell/feel/taste/touch/see", "名词单复数", "季节 spring"], "writing": "Look, choose and write. I hear ... . I smell ... . I feel ... . I taste ... . I touch ... . I see ... ."}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "name": "Read and write", "genre": "短文", "source": "Read and write", "text": "I see teachers and students.\nI hear songs.\nI love my school!", "zh": "我看到老师和学生。\n我听到歌声。\n我爱我的学校！", "topic": "我的学校", "words": ["see", "teachers", "students", "hear", "songs", "love", "school"], "comprehension": [], "keypoints": ["一般现在时", "感官动词 see/hear", "名词复数 teachers/students", "表达喜爱 love"], "writing": "What do you see in the picture? Ask and answer. Then read the sentences aloud."}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 3", "name": "Project: Make a sense book", "genre": "说明", "source": "Reading", "text": "This is my sense book. I see ...\nMake your sense book.\nShare your book in class.", "zh": "这是我的感官书。我看到……\n制作你的感官书。\n在课堂上分享你的书。", "topic": "制作感官书", "words": ["sense", "book", "see", "make", "share", "class"], "comprehension": [], "keypoints": ["一般现在时", "感官动词 see", "祈使句 Make/Share", "名词 sense book"], "writing": "Make your sense book. Share your book in class."}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "name": "Reading time", "genre": "对话", "source": "Reading", "text": "What would you like to eat, Zoom?\nVegetables are healthy. I love carrots.\nYou can try!\nHealthy food.\nHow about nuts?\nOK.\nWould you like some meat, Zoom?\nIt's healthy.\nI eat from flowers. They're yummy and healthy too.\nNuts, vegetables, meat, flowers ... What's healthy food?\nEat what's good for you. But you also need to exercise!", "zh": "Zoom，你想吃什么？\n蔬菜很健康。我喜欢胡萝卜。\n你可以试试！\n健康的食物。\n坚果怎么样？\n好的。\nZoom，你想吃点肉吗？\n它很健康。\n我吃的花。它们也很美味又健康。\n坚果、蔬菜、肉、花……什么是健康的食物？\n吃对你有益的食物。但你也需要锻炼！", "topic": "健康食物", "words": ["vegetables", "healthy", "carrots", "nuts", "meat", "flowers", "yummy", "exercise"], "comprehension": [], "keypoints": ["Would you like some...?", "It's healthy.", "They're yummy and healthy too.", "need to exercise"], "writing": ""}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 4", "name": "Read and write", "genre": "对话", "source": "Read and write", "text": "OK.\nHave some vegetables and fruit, John.\nYour plate is not healthy, John.\nWhose plate is healthy? Look and say.", "zh": "好的。\n约翰，吃点蔬菜和水果吧。\n约翰，你的餐盘不健康。\n谁的餐盘是健康的？看一看，说一说。", "topic": "健康餐盘", "words": ["vegetables", "fruit", "plate", "healthy"], "comprehension": [], "keypoints": ["Have some...", "Your plate is not healthy.", "Whose plate is healthy?"], "writing": ""}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "name": "Where is my boat?", "genre": "故事", "source": "其他", "text": "Where is my boat?\nIs it in this box? Wow!\nMy old robot!\nOh no! My robot has one arm, one eye and one foot.\nI need some help.\nHi, Cat! Do you have any old toys? I need an arm for my robot.\nNice!\nThank you.\nI have an old doll's arm.\nHi, Tiger! Do you have any old toys? I need an eye for my robot.\nI have an old car.\nYou can use the light!\nI also need a foot for my robot.\nHow about this?\nThat works!\nLook at my robot now!\nWow!", "zh": "我的船在哪里？\n它在这个盒子里吗？哇！\n我的旧机器人！\n哦不！我的机器人只有一只手臂、一只眼睛和一只脚。\n我需要一些帮助。\n嗨，猫！你有一些旧玩具吗？我需要一只手臂给我的机器人。\n太好了！\n谢谢。\n我有一只旧娃娃的手臂。\n嗨，老虎！你有一些旧玩具吗？我需要一只眼睛给我的机器人。\n我有一辆旧汽车。\n你可以用那个灯！\n我还需要一只脚给我的机器人。\n这个怎么样？\n可以！\n看看我的机器人现在怎么样！\n哇！", "topic": "用旧玩具改造机器人", "words": ["robot", "arm", "eye", "foot", "old", "toys", "doll", "car", "light", "use"], "comprehension": [], "keypoints": ["一般现在时", "have/has", "疑问句Do you have...?", "名词所有格old doll's arm"], "writing": ""}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "name": "Read and write", "genre": "短文", "source": "Read and write", "text": "I have some old cars and boats.\nThey are still good. I put them on the shelves.\nI have some old dolls and animal toys. They are still nice. I put them in a box.\nI have many old books. They are still good. I put them in a box.\nDo you have old things at home?\nYes. I have a                and some                .", "zh": "我有一些旧汽车和旧船。\n它们仍然很好。我把它们放在架子上。\n我有一些旧娃娃和动物玩具。它们仍然很漂亮。我把它们放在一个盒子里。\n我有很多旧书。它们仍然很好。我把它们放在一个盒子里。\n你家里有旧东西吗？\n是的。我有一个……和一些……", "topic": "旧玩具与旧学习用品的存放", "words": ["old", "cars", "boats", "dolls", "toys", "books", "shelves", "box", "put", "still"], "comprehension": [], "keypoints": ["一般现在时", "have/has", "介词in/on", "名词复数"], "writing": "Do you have old things at home?\nYes. I have a                and some                ."}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "name": "Read and match", "genre": "短文", "source": "Read and write", "text": "Where is the ball?\nIs the ruler on the book?\nIt's                the map.\nNo, it's                the book.\nin     on     under", "zh": "球在哪里？\n尺子在书上吗？\n它在……地图……\n不，它在……书……\n在……里  在……上  在……下", "topic": "物品位置", "words": ["ball", "ruler", "book", "map", "in", "on", "under"], "comprehension": [], "keypoints": ["一般现在时", "be动词is", "介词in/on/under", "疑问句Is...?"], "writing": ""}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "name": "I have some old cars and boats.", "genre": "短文", "source": "Read and write", "text": "I have some old cars and boats.\nThey are still good. I put them on the shelves.\nI have some old dolls and animal toys. They are still nice. I put them in a box.\nI have many old books. They are still good. I put them in a box.\nDo you have old things at home?\nYes. I have a                and some               .", "zh": "我有一些旧汽车和旧船。\n它们仍然很好。我把它们放在架子上。\n我有一些旧娃娃和动物玩具。它们仍然很漂亮。我把它们放在一个盒子里。\n我有很多旧书。它们仍然很好。我把它们放在一个盒子里。\n你家里有旧东西吗？\n是的。我有一个……和一些……。", "topic": "旧物存放", "words": ["old", "cars", "boats", "still", "good", "put", "shelves", "dolls", "toys", "books"], "comprehension": [], "keypoints": ["一般现在时", "have/has", "there be 的替代表达", "介词 on/in"], "writing": "Do you have old things at home?\nYes. I have a                and some               ."}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "name": "Where is my boat?", "genre": "故事", "source": "其他", "text": "Where is my boat?\nIs it in this box? Wow!\nMy old robot!\nOh no! My robot has one arm, one eye and one foot.\nI need some help.\nHi, Cat! Do you have any old toys? I need an arm for my robot.\nNice!\nThank you.\nI have an old doll's arm.\nHi, Tiger! Do you have any old toys? I need an eye for my robot.\nI have an old car.\nYou can use the light!\nI also need a foot for my robot.\nHow about this?\nThat works!\nLook at my robot now!\nWow!", "zh": "我的船在哪里？\n它在这个盒子里吗？哇！\n我的旧机器人！\n哦不！我的机器人只有一只手臂、一只眼睛和一只脚。\n我需要一些帮助。\n嗨，猫！你有一些旧玩具吗？我需要一只手臂给我的机器人。\n太好了！\n谢谢。\n我有一只旧娃娃的手臂。\n嗨，老虎！你有一些旧玩具吗？我需要一只眼睛给我的机器人。\n我有一辆旧汽车。\n你可以用那个灯！\n我的机器人还需要一只脚。\n这个怎么样？\n可以！\n看看我的机器人现在！\n哇！", "topic": "旧物改造机器人", "words": ["boat", "box", "robot", "arm", "eye", "foot", "help", "doll", "car", "light"], "comprehension": [], "keypoints": ["一般现在时", "have/has", "疑问句 Do you have...?", "名词单复数"], "writing": ""}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "name": "Project: Reuse some old things", "genre": "说明", "source": "其他", "text": "What old things does Mike have? Listen, circle the words and match.\nStep\nMake new things from the old things in Box 3.\nWhat's this?\nIt's a fish.\nWhat are these?\nThey're boats.\nFind some old things at home.\nStep\nStep\nGroup the old things and put them in different boxes.\nsell\ngive away\nmake\nnew\nthings\nReuse some things at home.\nShare your work in class.", "zh": "迈克有哪些旧东西？听一听，圈出单词并连线。\n步骤\n用3号盒子里的旧东西制作新东西。\n这是什么？\n它是一条鱼。\n这些是什么？\n它们是船。\n在家里找一些旧东西。\n步骤\n步骤\n把旧东西分类并放进不同的盒子里。\n卖掉\n赠送\n制作\n新\n东西\n在家里再利用一些东西。\n在课堂上分享你的作品。", "topic": "旧物再利用项目", "words": ["reuse", "old things", "make", "new things", "sell", "give away", "group", "boxes", "share", "work"], "comprehension": [], "keypoints": ["一般现在时", "祈使句", "名词复数", "动词短语 make/give away/sell"], "writing": "Share your work in class."}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 5", "name": "Self-check", "genre": "其他", "source": "其他", "text": "1. I can talk about old things I have.\n2. I can ask and say where things are.\n3. I can share ideas about reusing things.\n4. I can read and spell words with \"u-e\".", "zh": "1. 我能谈论我拥有的旧东西。\n2. 我能询问和说明物品在哪里。\n3. 我能分享关于再利用物品的想法。\n4. 我能读和拼写含有“u-e”的单词。", "topic": "单元自查", "words": ["talk about", "old things", "where", "share ideas", "reuse", "read", "spell", "u-e"], "comprehension": [], "keypoints": ["一般现在时", "can 表能力", "疑问句 where", "拼读 u-e"], "writing": ""}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "name": "Read and write", "genre": "对话", "source": "Read and write", "text": "How much is the bread?\nIt's twelve yuan.\nTwelve yuan, please.\nOK. I'll take two.\nHow much is it?\nIt's six yuan.", "zh": "面包多少钱？十二元。十二元，请给我。好的，我要两个。多少钱？六元。", "topic": "", "words": ["how much", "bread", "twelve yuan", "please", "take", "six yuan"], "comprehension": [], "keypoints": ["疑问句 How much is...", "价格表达 It's... yuan", "I'll take..."], "writing": "Look, choose and write."}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "name": "Reading time", "genre": "对话", "source": "Reading", "text": "Numbers are useful. And numbers are interesting too.\nA clock has twelve numbers.\nWe use them to tell the time.\nAnd a year has twelve months!\nHow many eggs do we have?\nTwelve.\nIn a mobile phone number, how many numbers are there?\nAnd a football team always has eleven players.\nA player can get a red card!\nThat's true. Then the team only has ten players!\nNo, eleven.\nThat's not true!\nOh, how so?\nTwelve?", "zh": "数字很有用，而且数字也很有趣。一个钟有十二个数字。我们用它们来报时。一年有十二个月！我们有多少个鸡蛋？十二个。在一个手机号码里有多少个数字？一支足球队总是有十一名球员。一名球员可以得到一张红牌！那是真的。那么这支队就只有十名球员了！不，是十一名。那不是真的！哦，怎么会？十二个？", "topic": "", "words": ["numbers", "useful", "interesting", "clock", "twelve", "months", "mobile phone", "football team", "players", "red card"], "comprehension": [], "keypoints": ["一般现在时", "基数词 10-12", "there be 的 has 用法", "疑问句 How many..."], "writing": ""}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "name": "Project: Make and sell fun sandwiches", "genre": "说明", "source": "其他", "text": "Choose healthy food and make your sandwiches.\nSell fun sandwiches.", "zh": "选择健康的食物，制作你的三明治。出售有趣的三明治。", "topic": "", "words": ["choose", "healthy", "food", "make", "sandwiches", "sell", "fun"], "comprehension": [], "keypoints": ["祈使句", "动词 choose/make/sell", "形容词 healthy/fun"], "writing": "Choose healthy food and make your sandwiches. Sell fun sandwiches."}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit": "Unit 6", "name": "Self-assessment", "genre": "说明", "source": "其他", "text": "1. I can use the numbers 11 to 20 to count things.\n2. I can use numbers to buy or sell things.\n3. I can use the numbers 11 to 20 in different places.\n4. I can read and spell words with \"c\", \"g\", \"l\" and \"y\".", "zh": "1. 我可以用 11 到 20 的数字来数东西。2. 我可以用数字来买卖东西。3. 我可以在不同地方使用 11 到 20 的数字。4. 我可以读和拼写含有“c”、“g”、“l”和“y”的单词。", "topic": "", "words": ["numbers", "count", "buy", "sell", "different", "read", "spell", "words"], "comprehension": [], "keypoints": ["情态动词 can", "基数词 11-20", "动词 count/buy/sell"], "writing": ""}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 1", "name": "Reading time", "genre": "故事", "source": "Reading", "text": "My mum is a writer.\nShe writes a lot of good books.\nMum is also a great cook.\nShe can cook great food!\nMum is very busy.\nWe can help her at home.\nWe want to make this.\nBut now we have this!\nMum is still happy! She's a great mum!", "zh": "我的妈妈是一名作家。她写了很多好书。妈妈也是一位很棒的厨师。她会做美味的食物！妈妈很忙。我们可以在家帮她。我们想做这个。但现在我们只有这个！妈妈还是很开心！她是一位很棒的妈妈！", "topic": "家人与家庭帮助", "words": ["writer", "cook", "busy", "help", "happy", "mum", "books", "food", "make", "great"], "comprehension": [], "keypoints": ["一般现在时第三人称单数", "can 表能力", "形容词比较与描述", "家庭话题词汇"], "writing": ""}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 1", "name": "Read and write", "genre": "说明", "source": "Read and write", "text": "What is the job of Chen Jie's father?\nWhat is the job of Chen Jie's mother?\nWhat do you do with your family?\nI often ...\noffice worker\nfarmer\ndoctor\nfactory worker", "zh": "陈杰的父亲是做什么工作的？陈杰的母亲是做什么工作的？你和家人一起做什么？我经常……办公室职员、农民、医生、工厂工人。", "topic": "家人职业与家庭活动", "words": ["job", "father", "mother", "family", "office worker", "farmer", "doctor", "factory worker", "often", "do"], "comprehension": [{"q": "What is the job of Chen Jie's father?", "options": ["office worker", "farmer", "doctor", "factory worker"], "answer": ""}, {"q": "What is the job of Chen Jie's mother?", "options": ["office worker", "farmer", "doctor", "factory worker"], "answer": ""}, {"q": "What do you do with your family?", "options": [], "answer": ""}], "keypoints": ["一般现在时", "职业名词", "What is the job of...?", "I often..."], "writing": "I often ..."}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 1", "name": "Project: Make a poster of a happy family", "genre": "说明", "source": "Read and write", "text": "I have a happy family. My mother is a/an ...\nWe often ... together. My father is a/an ...\nMake a poster of your family.\nShare your poster in class.\nMy mother is a/an .\nWe often together.\nI have a .\nI can look after .\nMy father is a/an .\nWe often together.", "zh": "我有一个幸福的家庭。我的妈妈是一名……我们经常一起……我的爸爸是一名……制作一张关于你家人的海报。在课堂上分享你的海报。我的妈妈是一名……我们经常一起……我有一个……我可以照顾……我的爸爸是一名……我们经常一起……", "topic": "家庭海报与家庭介绍", "words": ["happy family", "mother", "father", "often", "together", "look after", "poster", "share", "class", "make"], "comprehension": [], "keypoints": ["一般现在时", "a/an 用法", "look after", "家庭话题表达"], "writing": "Make a poster of your family. Share your poster in class."}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 1", "name": "每日巧手菜：小猫煎蛋", "genre": "故事", "source": "Reading", "text": "每日巧手菜：小猫煎蛋\nMum is very busy.\nWe can help her at home.\nWe want to make this.\nBut now we have this!\nMum is still happy! She's a great mum!", "zh": "每日巧手菜：小猫煎蛋。妈妈很忙。我们可以在家帮她。我们想做这个。但现在我们只有这个！妈妈还是很开心！她是一位很棒的妈妈！", "topic": "家庭帮助与亲情", "words": ["busy", "help", "home", "make", "happy", "mum", "great", "want", "now", "still"], "comprehension": [], "keypoints": ["一般现在时", "can 表能力", "家庭帮助话题", "情感表达"], "writing": ""}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 1", "name": "Reading time", "genre": "故事", "source": "Reading", "text": "My mum is a writer.\nShe writes a lot of good books.\nMum is also a great cook.\nShe can cook great food!\nMum is very busy.\nWe can help her at home.\nWe want to make this.\nBut now we have this!\nMum is still happy! She's a great mum!", "zh": "我的妈妈是一名作家。她写了很多好书。妈妈也是一位很棒的厨师。她会做美味的食物！妈妈很忙。我们可以在家帮她。我们想做这个。但现在我们只有这个！妈妈还是很开心！她是一位很棒的妈妈！", "topic": "家庭与帮助家人", "words": ["writer", "cook", "busy", "help", "books", "food", "happy", "mum"], "comprehension": [], "keypoints": ["一般现在时第三人称单数", "can 表能力", "职业名词 writer / cook", "形容词 great / busy / happy"], "writing": ""}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 2", "name": "True friends", "genre": "短文", "source": "Read and write", "text": "True friends\n. Tall or\n, strong or not, they help each other.", "zh": "真正的朋友。无论高矮，无论强壮与否，他们都互相帮助。", "topic": "友谊", "words": ["true friends", "tall", "strong", "help each other"], "comprehension": [], "keypoints": ["形容词描述外貌", "一般现在时", "动词短语 help each other"], "writing": ""}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 2", "name": "True friends", "genre": "短文", "source": "其他", "text": "True friends\nTall or short, strong or not, they help each other.\nWho's your best friend?\nLiu Jia. She's tall and ... She has long hair. She often ...\nWho's your best friend?\nChen Jie. She's funny.\nShe often makes me smile.\nHow about you?\nWho's your best friend?\nMy best friend is John. He's very kind.\nHe often helps me with English.", "zh": "真正的朋友\n高或矮，强壮或不强壮，他们互相帮助。\n你最好的朋友是谁？\n刘佳。她又高又……她有长发。她经常……\n你最好的朋友是谁？\n陈洁。她很有趣。\n她经常逗我笑。\n你呢？\n你最好的朋友是谁？\n我最好的朋友是约翰。他很善良。\n他经常帮我学英语。", "topic": "介绍最好的朋友", "words": ["true friends", "best friend", "tall", "short", "strong", "funny", "kind", "helps me with English"], "comprehension": [], "keypoints": ["一般现在时第三人称单数", "形容词描述性格外貌", "often 表频率", "help sb with sth"], "writing": "Who's your best friend? Liu Jia. She's tall and ... She has long hair. She often ..."}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 2", "name": "Liu Jia is my best friend", "genre": "短文", "source": "Read and write", "text": "Liu Jia is tall. She has long hair. She often reads books with me. We like animal books and often share. She likes weiqi, but I like ball games. I often play football and basketball. Liu Jia is kind. She always makes me smile. We are best friends.", "zh": "刘佳个子高。她有长发。她经常和我一起看书。我们喜欢动物类书籍并且经常分享。她喜欢围棋，但我喜欢球类运动。我经常踢足球和打篮球。刘佳很善良。她总是逗我笑。我们是最好的朋友。", "topic": "介绍好朋友刘佳", "words": ["tall", "long hair", "reads books", "share", "weiqi", "ball games", "play football", "kind", "makes me smile", "best friends"], "comprehension": [{"q": "Put the numbers in the correct places. 1. like animal books 2. like ball games 3. like weiqi 4. read books 5. share", "options": [], "answer": ""}], "keypoints": ["一般现在时第三人称单数", "has 表拥有", "often/always 表频率", "but 表转折"], "writing": "What about your best friend? I have a friend. He's/She's ... He/She often ... What's his/her name? His/Her name is ..."}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 2", "name": "Self-check", "genre": "其他", "source": "其他", "text": "1. I can talk about my friends.\n2. I can say what I do with my friends.\n3. I can tell why someone is my friend.\n4. I can read and spell words with \"sh\".", "zh": "1. 我能谈论我的朋友。\n2. 我能说出我和朋友一起做什么。\n3. 我能说出某人为什么是我的朋友。\n4. 我能读和拼写带“sh”的单词。", "topic": "单元自查", "words": ["talk about", "do with", "why", "read and spell"], "comprehension": [], "keypoints": ["can 表能力", "what 引导宾语从句", "why 引导原因", "sh 拼读"], "writing": ""}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 2", "name": "Project: Make a book about your friend", "genre": "其他", "source": "其他", "text": "Project: Make a book about your friend\nHe/She is ...\nkind\nquiet\nshort/tall\nstrong/thin\n...\nHe/She has ...\nlong hair\nshort hair\nbig eyes\nsmall eyes\n...\nHe/She often ...\nreads books\nplays games\nplays football\nhelps me with English\n...", "zh": "项目：做一本关于你朋友的书\n他/她是……\n善良\n安静\n矮/高\n强壮/瘦\n……\n他/她有……\n长发\n短发\n大眼睛\n小眼睛\n……\n他/她经常……\n看书\n玩游戏\n踢足球\n帮我学英语\n……", "topic": "制作朋友手册", "words": ["kind", "quiet", "short", "tall", "strong", "thin", "long hair", "short hair", "big eyes", "small eyes"], "comprehension": [], "keypoints": ["形容词描述性格外貌", "has 表拥有", "often 表频率", "help sb with sth"], "writing": "Project: Make a book about your friend"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 3", "name": "My favourite place is the museum", "genre": "短文", "source": "Read and write", "text": "My favourite place is the museum.\nThere are many old things and photos. I can read stories about them.\nI can \"hear\" them too! There is also a nice shop. People buy gifts and books there.\nThe museum is in a nice park. We often play in the park. I love that museum!", "zh": "我最喜欢的地方是博物馆。那里有许多古老的物品和照片。我可以阅读关于它们的故事。我还能“听到”它们！那里也有一家不错的商店。人们在那里买礼物和书。博物馆在一个漂亮的公园里。我们经常在公园里玩耍。我喜欢那个博物馆！", "topic": "介绍最喜欢的地方——博物馆", "words": ["museum", "old things", "photos", "read stories", "hear", "shop", "gifts", "books", "park", "play"], "comprehension": [{"q": "Tick the reasons why the writer likes the museum.", "options": ["There are old things and photos.", "He can \"hear\" the old things.", "He can do sports.", "There is a nice shop."], "answer": "There are old things and photos.; He can \"hear\" the old things.; There is a nice shop."}], "keypoints": ["there be 句型", "一般现在时", "情态动词 can", "频率副词 often"], "writing": "Write about a place in your community."}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 3", "name": "There is a playground. Children can have fun there.", "genre": "短文", "source": "Read and write", "text": "There is a playground.\nChildren can have fun there.\nThere is a shop in our dream community.\nPeople can go shopping there.", "zh": "有一个操场。孩子们可以在那里玩得开心。在我们梦想的社区里有一家商店。人们可以在那里购物。", "topic": "描述社区里的场所及人们的活动", "words": ["playground", "have fun", "shop", "dream community", "go shopping", "people", "children", "there is", "can"], "comprehension": [], "keypoints": ["there be 句型", "情态动词 can", "一般现在时", "动名词短语作宾语"], "writing": "Write about a place in your community."}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 3", "name": "Hi! I'm Peter. My family moved to Chengdu.", "genre": "日记", "source": "Reading", "text": "Hi! I'm Peter. My family moved to Chengdu.\nThis is my video diary.\nHi! I'm Xiao Lin.\nWhat's your name?\nHi! I'm Peter. I'm from London. It's my first day here.\nNice to meet you!\nYou're a good player.\nThanks. You too.\nWould you like some vegetables?\nYes, please.\nThanks, Xiao Lin.\nThere's a baby panda.\nOh yes! Do you like pandas?\nYes, I do. They're so cute!\nBianlian is great!\nThere are nice people and great places here. I love Chengdu! Bye for now!", "zh": "嗨！我是彼得。我的家人搬到了成都。这是我的视频日记。嗨！我是小林。你叫什么名字？嗨！我是彼得。我来自伦敦。这是我在这里的第一天。很高兴认识你！你是个很好的球员。谢谢。你也是。你想吃些蔬菜吗？好的，请。谢谢，小林。有一只熊猫宝宝。哦，是的！你喜欢熊猫吗？是的，我喜欢。它们太可爱了！变脸很棒！这里有很好的人和很棒的地方。我爱成都！再见！", "topic": "彼得来到成都的第一天，介绍成都的人和地方", "words": ["moved", "video diary", "from", "first day", "player", "vegetables", "baby panda", "cute", "Bianlian", "love"], "comprehension": [], "keypoints": ["一般过去时 moved", "一般现在时", "Would you like...?", "There be 句型"], "writing": ""}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 3", "name": "Project: Make a dream community model", "genre": "剧本", "source": "Short plays", "text": "Binbin and Amy are talking about their dream communities. Listen, tick and match.\nWhat is in your dream community? Talk and draw.\nThis is my dream community.\nThere is ... People often ...\nThere are ... People often ...", "zh": "彬彬和艾米正在谈论他们梦想的社区。听一听，打勾并连线。你的梦想社区里有什么？说一说并画一画。这是我的梦想社区。那里有……人们经常……那里有……人们经常……", "topic": "谈论梦想社区", "words": ["dream community", "talk", "draw", "there is", "there are" , "text": "Liu Jia's father takes us to school every day. Look! He is\ndriving our school bus.\nMiss Lin often helps us. She is helping some students cross\nthe road.\nMr Zhang cleans our school. Look! He is cleaning the\nplayground now.\nMs Lu cooks nice food. She is cooking our lunch now.", "zh": "刘佳的爸爸每天送我们去学校。看！他正在开我们的校车。林老师经常帮助我们。她正在帮一些学生过马路。张先生打扫我们的学校。看！他现在正在打扫操场。陆老师做美味的食物。她现在正在做我们的午餐。", "topic": "社区里重要职业的人", "words": ["driver", "police officer", "cleaner", "cook", "delivery worker", "doctor", "teacher", "driving", "cleaning", "cooking"], "comprehension": [{"q": "Look, choose and write.", "options": [], "answer": ""}, {"q": "These four people do important jobs. Read and choose.", "options": [], "answer": ""}, {"q": "The children are talking about jobs. Listen, tick and match.", "options": [], "answer": ""}], "keypoints": ["现在进行时", "一般现在时", "职业名词", "there be"], "writing": "Project: Make a poster of your school helpers\nMake a poster of your school helpers\nis a/an         .\nHe/She\n.\nLook! He/She is\nnow."}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 4", "name": "Make a poster of your school helpers", "genre": "说明", "source": "Read and write", "text": "Project: Make a poster of your school helpers\nMake a poster of your school helpers\nis a/an         .\nHe/She\n.\nLook! He/She is\nnow.\nMr Zhang is a cleaner.\nHe cleans our school.\nLook! He is cleaning\nthe playground now.\nOur school needs many\nhelpers. Mr Zhang is a cleaner.\nHe cleans our school. He's ...\nMake your poster.\nShare your poster in class.", "zh": "项目：制作一张关于学校帮手的海报。制作一张关于学校帮手的海报。……是……。他/她……。看！他/她现在正在……。张先生是一名清洁工。他打扫我们的学校。看！他现在正在打扫操场。我们学校需要很多帮手。张先生是一名清洁工。他打扫我们的学校。他……制作你的海报。在课堂上分享你的海报。", "topic": "制作学校帮手海报", "words": ["poster", "school helpers", "cleaner", "cleans", "cleaning", "playground", "needs", "make", "share", "class"], "comprehension": [], "keypoints": ["现在进行时", "一般现在时", "职业名词", "there be"], "writing": "Make a poster of your school helpers\nis a/an         .\nHe/She\n.\nLook! He/She is\nnow."}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 4", "name": "We are community helpers", "genre": "短文", "source": "Read and write", "text": "We are community helpers. We\noften help children and old people.\nIn the kindergarten, John and Class\nOne are singing songs together. Zhang\nPeng is telling stories to Class Two.\nIn the old people's home, Chen Jie\nis making the bed. Amy is drawing a\npicture of Ms Xu. They are all happy.\nWe love the people in our community.", "zh": "我们是社区帮手。我们经常帮助老人和孩子。在幼儿园，John和一班同学一起唱歌。张鹏给二班同学讲故事。在敬老院，陈洁在铺床。Amy在给徐老师画画。他们都很开心。我们爱社区里的人们。", "topic": "社区帮手与帮助他人", "words": ["community", "helper", "kindergarten", "singing songs", "telling stories", "making the bed", "drawing a picture", "old people's home", "happy", "love"], "comprehension": [{"q": "Read and match.", "options": [], "answer": ""}, {"q": "Choose a picture and complete the sentences.", "options": [], "answer": ""}], "keypoints": ["现在进行时", "there be", "一般现在时", "职业名词"], "writing": "Choose a picture and complete the sentences.\nbus driver    cleaner    cook    teacher\ncleaning the room    singing songs    telling stories\nJohn is\nwith Class One.\nHe/She is a\n.\nHe/She is\nnow."}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 5", "name": "Dad's postcard to John", "genre": "书信", "source": "Read and write", "text": "Hi, John!\nHow are you? I'm in a big park in Sydney\ntoday. It's hot and sunny here. It's fun to go\nto the park with my new friends. We play\nbasketball together. Their children swim\nin the pool. How about you? Is it cold and\nwindy in Beijing? Can you fly your kite?\nLove,\nDad", "zh": "嗨，约翰！\n你好吗？我今天在悉尼的一个大公园里。\n这里又热又晴朗。和新朋友们一起去公园很有趣。\n我们一起打篮球。他们的孩子在游泳池里游泳。\n你呢？北京又冷又有风吗？你能放风筝吗？\n爱你的，\n爸爸", "topic": "爸爸在悉尼公园的明信片", "words": ["hot", "sunny", "play basketball", "swim", "pool", "cold", "windy", "fly a kite", "How about you"], "comprehension": [{"q": "What's the weather like in Sydney?", "options": ["cloudy", "rainy", "snowy", "sunny", "windy"], "answer": "sunny"}, {"q": "What can John's father do there?", "options": ["fly a kite", "make a snowman", "play basketball", "read books", "see a film"], "answer": "play basketball"}], "keypoints": ["现在进行时", "一般现在时", "疑问句 Is it...? / Can you...?", "天气形容词与活动搭配"], "writing": "Hi, Dad!\nI'm doing fine in Beijing.\nIt's ______ here. I can ______.\nLove,\nJohn"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 5", "name": "What can you do in different weather?", "genre": "说明", "source": "Read and write", "text": "It's cool and cloudy. We can play basketball.\nThere is heavy rain now. We can't play basketball. But we\ncan read some books.\nIt's too hot. We can't play football outside.\nThere is a strong wind. We can't ...", "zh": "天气凉爽多云。我们可以打篮球。\n现在有大雨。我们不能打篮球。但我们\n可以读一些书。\n太热了。我们不能在外面踢足球。\n有强风。我们不能……", "topic": "不同天气下能做什么", "words": ["cool", "cloudy", "heavy rain", "strong wind", "play basketball", "read books", "play football", "can't"], "comprehension": [], "keypoints": ["There is + 天气现象", "can / can't 表能力", "一般现在时", "and / but 连接句"], "writing": "What can you do in different weather? Think, write\nand say."}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 5", "name": "Project: Make a bad weather reminder", "genre": "其他", "source": "其他", "text": "Project: Make a bad weather reminder\nIt's too hot. We can't play football outside.\nThere is a strong wind. We can't ...\nMake a bad weather reminder.\nShare your reminder in class.", "zh": "项目：制作一个恶劣天气提醒\n太热了。我们不能在外面踢足球。\n有强风。我们不能……\n制作一个恶劣天气提醒。\n在课堂上分享你的提醒。", "topic": "制作恶劣天气提醒", "words": ["bad weather", "strong wind", "heavy rain", "heavy snow", "can't", "reminder"], "comprehension": [], "keypoints": ["There is + 天气现象", "can't 表不能", "祈使句", "一般现在时"], "writing": "Make a bad weather reminder.\nShare your reminder in class."}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 5", "name": "Self-check", "genre": "其他", "source": "其他", "text": "1. I can talk
