es, it is.\nZip: Here comes a tiger.\nZoom: Where is it?\nZip: Shh. Be quiet.\nZip: I see two monkeys.\nZoom: Where are they?\nZip: Shh. They're climbing.\nZoom: Wow! They're fast, too.\nZoom: Ah-choo!", "zh": "Zoom：他们在做什么？Zip：他们为什么看着我们？Zoom：我不知道。Zip：看！他们也在拍照。Zoom：真可爱。他们在模仿我们！Zoom：那是谁的尾巴？它跑得真快。是老虎的吗？Zip：是的，是。Zip：一只老虎来了。Zoom：它在哪里？Zip：嘘。安静。Zip：我看到两只猴子。Zoom：它们在哪里？Zip：嘘。它们在爬。Zoom：哇！它们也很快。Zoom：阿嚏！", "topic": "在动物园观察动物", "words": ["taking pictures", "copying", "tail", "running", "tiger", "monkeys", "climbing", "quiet", "fast", "Ah-choo"], "comprehension": [], "keypoints": ["现在进行时 be + doing", "疑问词 why / where / whose", "名词所有格 the tiger's", "祈使句 Be quiet."], "writing": ""}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 6", "name": "Story time", "genre": "对话", "source": "Story time", "text": "Zip: I love the film.\nZoom: Yes. The gorilla is great!\nZip: Wow! The gorilla is eating a banana.\nZoom: It’s so big and strong.\nZip: What’s that noise?\nZoom: I’m eating popcorn.\nZip: It’s so exciting!\nZoom: Yes, it is!\nZip: Look at the sign.\nZoom: Oh, no!\nTiger: Shh! Talk quietly!\nZoom: Sorry!", "zh": "Zip：我喜欢这部电影。\nZoom：是的。那只大猩猩太棒了！\nZip：哇！那只大猩猩正在吃香蕉。\nZoom：它又大又强壮。\nZip：那是什么声音？\nZoom：我在吃爆米花。\nZip：太激动人心了！\nZoom：是的，确实如此！\nZip：看那个标志。\nZoom：哦，不！\nTiger：嘘！小声说话！\nZoom：对不起！", "topic": "在电影院看电影时保持安静", "words": ["gorilla", "banana", "popcorn", "exciting", "sign", "talk quietly", "eating", "big", "strong", "sorry"], "comprehension": [], "keypoints": ["现在进行时", "祈使句", "感叹句", "礼貌用语"], "writing": ""}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 6", "name": "Read and write", "genre": "短文", "source": "Read and write", "text": "Fill in the blanks.\n1. It’s 7:00 a.m. We ______ ______ ______ at 7 o’clock.\n2. I sometimes clean my bike on the weekend. I ______ ______ it now.\n3. It’s 9 p.m. They ______ ______ now, but they often go to bed at 10 p.m.", "zh": "填空。\n1. 现在是早上7点。我们7点______ ______ ______。\n2. 我有时在周末清洗我的自行车。我现在______ ______它。\n3. 现在是晚上9点。他们现在______ ______，但他们经常在晚上10点睡觉。", "topic": "用现在进行时填空描述正在做的事情", "words": ["clean", "bike", "weekend", "now", "go to bed", "sometimes", "often", "have class", "eat dinner", "read a book"], "comprehension": [{"q": "1. It’s 7:00 a.m. We ______ ______ ______ at 7 o’clock.", "options": [], "answer": ""}, {"q": "2. I sometimes clean my bike on the weekend. I ______ ______ it now.", "options": [], "answer": ""}, {"q": "3. It’s 9 p.m. They ______ ______ now, but they often go to bed at 10 p.m.", "options": [], "answer": ""}], "keypoints": ["现在进行时", "一般现在时", "频率副词", "时间表达"], "writing": "Look and write."}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 6", "name": "Recycle 2", "genre": "短文", "source": "Reading", "text": "Mike is at summer camp. What will he do? Listen and match.\nMike’s mum: Be a good boy. _________________________.\nA. Work quietly     B. Keep your room clean\nC. Talk quietly", "zh": "Mike在夏令营。他会做什么？听一听并连线。\nMike的妈妈：做个好孩子。_________________________。\nA. 安静地工作     B. 保持房间整洁\nC. 小声说话", "topic": "夏令营中的行为规范", "words": ["summer camp", "work quietly", "keep your room clean", "talk quietly", "good boy", "listen", "match", "mum", "be", "will"], "comprehension": [{"q": "1. When is the sports day? It is in ___________________.", "options": ["A. June", "B. July", "C. August"], "answer": ""}, {"q": "2. Mike’s mum: Be a good boy. _________________________.", "options": ["A. Work quietly", "B. Keep your room clean", "C. Talk quietly"], "answer": ""}], "keypoints": ["一般将来时", "祈使句", "现在进行时", "夏令营相关词汇"], "writing": ""}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 2", "name": "Mike and Matt are having breakfast", "genre": "对话", "source": "Read and write", "text": "Mike and Matt are having breakfast. Listen and write T (True) or F (False).\n1. Matt knows about mooncakes. (      )\n2. Mike's father bought the mooncakes. (      )", "zh": "迈克和马特正在吃早餐。听录音并写T（对）或F（错）。\n1. 马特了解月饼。（      ）\n2. 迈克的爸爸买了月饼。（      ）", "topic": "中秋节", "words": ["mooncakes", "breakfast", "know about", "bought"], "comprehension": [{"q": "Matt knows about mooncakes.", "options": [], "answer": ""}, {"q": "Mike's father bought the mooncakes.", "options": [], "answer": ""}], "keypoints": ["一般过去时", "一般疑问句", "Did you...? Yes, I did. / No, I didn't."], "writing": ""}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 3", "name": "Liu Jia's letter and story", "genre": "故事", "source": "Read and write", "text": "Liu Jia was crying. So Miss White asked her, \"What's the matter, Liu Jia? You look sad.\"\nLiu Jia answered, \"I'm feeling down. My good friend Lucy moved to another city.\"\nMiss White listened carefully and told Liu Jia, \"Think about happy things. Call your friend or send her some emails.\"\n\"I tried that, but I still feel unhappy,\" said Liu Jia.\nMiss White gave her a glass of water.\n\"Maybe you can do some exercise. Exercise may cheer you up!\"\n\"Join some after-school clubs and make new friends! You can talk and have fun with them,\" added Miss White.\n\"I will try. Thank you, Miss White,\" said Liu Jia.\nDear Miss White,\nI often make video calls with my friend now.\nI also joined a ping-pong club and made some new friends. I feel much better. Thank you so much!\nLiu Jia", "zh": "刘佳在哭。于是怀特老师问她：\"怎么了，刘佳？你看起来很伤心。\"刘佳回答说：\"我感到难过。我最好的朋友露西搬到了另一个城市。\"怀特老师仔细听着，告诉刘佳：\"想想开心的事。给你的朋友打电话或给她发些邮件。\"刘佳说：\"我试过了，但我还是不开心。\"怀特老师给了她一杯水。\"也许你可以做些运动。运动可能会让你振作起来！\"怀特老师补充道：\"加入一些课后俱乐部，结交新朋友！你可以和他们聊天、一起玩。\"刘佳说：\"我会试试的。谢谢你，怀特老师。\"亲爱的怀特老师，我现在经常和朋友视频通话。我还加入了一个乒乓球俱乐部，结交了一些新朋友。我感觉好多了。非常感谢你！刘佳", "topic": "如何保持心理健康", "words": ["feeling down", "moved to", "think about", "call", "send emails", "do some exercise", "cheer up", "join clubs", "make new friends", "have fun"], "comprehension": [{"q": "1. Liu Jia had a runny nose and felt unhappy.", "options": [], "answer": ""}, {"q": "2. Liu Jia shared her feelings with Miss White.", "options": [], "answer": ""}, {"q": "3. Liu Jia often makes video calls with her friend now.", "options": [], "answer": ""}, {"q": "4. Liu Jia called Miss White and thanked her.", "options": [], "answer": ""}, {"q": "Read the text again and fill in the blanks. Problem: Liu Jia's good friend ___ to another city. Solutions: Think about ___. Call her friend or send her emails. Do ___. Join after-school ___ and make ___.", "options": [], "answer": ""}], "keypoints": ["一般过去时", "情态动词 should / can", "建议句型 You should...", "表达感受 feeling down / unhappy"], "writing": "Write some suggestions for the children below.\n1. John has a ___, a ___ and a ___. He should see a doctor.\n2. Binbin ate too much cake. He should ___.\n3. Sarah's mum is tired. She shouldn't ___.\n4. Amy feels sad. She should ___ and join some clubs."}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 4", "name": "Our winner", "genre": "短文", "source": "Read and write", "text": "The winner is my good friend,\nChen Jie. She's a 12-year-old\ngirl from Class One, Grade Six.\n\nChen Jie has her special way to manage money. She writes a\nspending plan every Sunday. Every week, she gets her pocket money.\nShe also gets some money from selling old things. She keeps her\nmoney in three money jars. Jar 1 is money to spend. She uses this\nmoney to buy goods, like books. She also uses it to pay\nfor services, like haircuts. Jar 2 is money to share. She\nuses this money to buy gifts, for example, birthday\ngifts for her family. Jar 3 is money to save. Chen Jie\nputs money there to save up for big things, like a new\nbike. She really manages her money well!", "zh": "获奖者是我好朋友陈洁。她是六年级一班的12岁女孩。\n\n陈洁有她管理金钱的特殊方法。她每个星期天写一份消费计划。每周，她都会得到零花钱。她还通过卖旧物得到一些钱。她把钱放在三个存钱罐里。1号罐是用于消费的钱。她用这笔钱买商品，比如书。她也用它支付服务费用，比如理发。2号罐是用于分享的钱。她用这笔钱买礼物，例如给家人的生日礼物。3号罐是用于储蓄的钱。陈洁把钱放进去，为买大件物品存钱，比如一辆新自行车。她真的把钱管理得很好！", "topic": "管理金钱", "words": ["manage money", "spending plan", "pocket money", "selling old things", "money jars", "money to spend", "money to share", "money to save", "save up", "pay for services"], "comprehension": [{"q": "Does the author know Chen Jie?", "options": [], "answer": ""}, {"q": "How does Chen Jie manage her money? Mark the details in the text.", "options": [], "answer": ""}, {"q": "Which ways of managing money do you use?", "options": [], "answer": ""}, {"q": "Read paragraph 2 again and complete the sentences.\n1. She writes ______.\n2. She gets pocket money and also gets some money from selling old things.\n3. She keeps her money ______.\nChen Jie has ______.", "options": [], "answer": ""}], "keypoints": ["一般现在时第三人称单数", "there be 结构", "不定式 to do 作目的状语", "名词所有格与物主代词"], "writing": "How are you going to manage your money? Write your ideas below.\nIt is important to save and spend money well. Here are my ideas."}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 4", "name": "Reading time", "genre": "说明", "source": "Reading", "text": "A long time ago, people exchanged\ngoods or services. Sometimes it\nwas difficult to get the things they\nwanted.\n\nMetal coins were heavy to carry.\nSo people used paper money.\n\nLater, people used different forms\nof money. But what did the money\nlook like? Look! There was shell\nmoney, knife money, copper coins, ...\n\nWe still use pape", "zh": "很久以前，人们交换商品或服务。有时候，他们很难得到想要的东西。\n\n金属货币太重，难以携带。所以人们使用纸币。\n\n后来，人们使用不同形式的货币。但是货币是什么样子的呢？看！有贝壳币、刀币、铜钱……\n\n我们仍然使用纸", "topic": "货币的历史", "words": ["exchange", "goods", "services", "metal coins", "paper money", "different forms", "shell money", "knife money", "copper coins"], "comprehension": [], "keypoints": ["一般过去时", "there be 结构", "比较级 heavy to carry", "名词复数与形式变化"], "writing": ""}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 5", "name": "In space", "genre": "短文", "source": "Read and write", "text": "Chinese astronauts are called taikonauts. Their life in space is special.\nThe taikonauts get up early in the morning. But getting ready in space is different. They can't use water to wash their faces. So taikonauts have to use a wet cloth. They brush their teeth with a special toothpaste and have to \"eat\" it!\nEach day the taikonauts are very busy. They do a lot of work. For example, they grow vegetables and rice. Sometimes, they also give classes to children and answer questions about space.\nIt is hard work. The taikonauts must stay healthy. Every afternoon they do exercise to keep healthy and strong. But their job is also very interesting. They can see the sunrise and sunset 16 times a day. The view is amazing! There is no other job like this one.", "zh": "中国航天员被称为“太空人”。他们在太空中的生活很特别。\n太空人早上很早起床。但在太空中做准备是不同的。他们不能用水洗脸，所以太空人必须用湿布。他们用一种特殊的牙膏刷牙，而且必须把牙膏“吃”掉！\n太空人每天都很忙。他们做很多工作。例如，他们种植蔬菜和稻米。有时，他们还会给孩子们上课，并回答关于太空的问题。\n这是一项艰苦的工作。太空人必须保持健康。每天下午他们都做运动以保持健康和强壮。但他们的工作也非常有趣。他们一天可以看到16次日出和日落。景色令人惊叹！没有别的工作像这样。", "topic": "中国航天员在太空中的生活", "words": ["taikonaut", "special", "wet cloth", "toothpaste", "vegetables", "rice", "exercise", "sunrise", "sunset", "view"], "comprehension": [{"q": "1. What do taikonauts grow?", "options": [], "answer": "They grow vegetables and rice."}, {"q": "2. What do taikonauts do for children?", "options": [], "answer": "They give classes to children and answer questions about space."}, {"q": "3. Why do taikonauts exercise?", "options": [], "answer": "To keep healthy and strong."}], "keypoints": ["一般现在时第三人称单数", "情态动词 can / have to", "there be 句型", "现在进行时/一般现在时描述日常活动"], "writing": "It is special to be a taikonaut. Early in the morning ___. Every day is busy. They grow ___ and ___. Sometimes, ___. But their job is interesting. And the view is amazing!"}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 6", "name": "Green Energy", "genre": "说明", "source": "Read and write", "text": "Green Energy\nWhat green energy do you know?\nWind power, solar power and water power are types of green energy.\nHow do we use it?\nWe use green energy to light, heat and cool our homes and schools.\nWe also use it to run cars, buses and trains.\nMany resources will run out. How can we save energy?\nWe should follow the \"3R\" rules. We can reduce energy use, reuse things, and recycle old clothes, toys and books.", "zh": "绿色能源\n你知道哪些绿色能源？\n风能、太阳能和水能都是绿色能源的类型。\n我们如何使用它？\n我们用绿色能源来照明、取暖和冷却我们的家与学校。\n我们也用它来驱动汽车、公交车和火车。\n许多资源将会耗尽。我们如何节约能源？\n我们应该遵循“3R”规则。我们可以减少能源使用、重复利用物品，并回收旧衣服、玩具和书籍。", "topic": "绿色能源与节约能源", "words": ["green energy", "wind power", "solar power", "water power", "light", "heat", "cool", "run", "3R rules", "reduce"], "comprehension": [{"q": "What green energy do you know?", "options": [], "answer": "Wind power, solar power and water power."}, {"q": "How do we use green energy?", "options": [], "answer": "We use green energy to light, heat and cool our homes and schools. We also use it to run cars, buses and trains."}, {"q": "How can we save energy?", "options": [], "answer": "We should follow the \"3R\" rules. We can reduce energy use, reuse things, and recycle old clothes, toys and books."}], "keypoints": ["一般现在时", "名词短语列举", "情态动词 should", "祈使句"], "writing": "Search for information about green energy and complete the outline."}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 6", "name": "Letter to the Editor", "genre": "书信", "source": "Read and write", "text": "Dear readers,\nHow can we help Mother Earth? We want good ideas from our readers. Please write to us and share your ideas and tips. Thank you.\nSincerely,\nThe Editor\n\nDear Editor,\nWe are running out of resources, but it is not too late. We can do things to change this. Here are my ideas.\nTips to save energy and resources:\n1.\n2.\n3.\nSincerely,", "zh": "亲爱的读者们，\n我们怎样才能帮助地球母亲？我们希望从读者那里得到好主意。请写信给我们，分享你们的主意和建议。谢谢。\n真诚的，\n编辑\n\n亲爱的编辑，\n我们的资源正在耗尽，但为时不晚。我们可以做一些事情来改变这一点。以下是我的主意。\n节约能源和资源的建议：\n1.\n2.\n3.\n真诚的，", "topic": "给编辑写信分享节约能源的建议", "words": ["Dear readers", "Dear Editor", "Sincerely", "running out of", "resources", "not too late", "change", "tips", "save energy", "share"], "comprehension": [{"q": "Choose the best title for each idea.\nIdea 1 (   )\nA. Do small things to save water.\nIdea 2 (   )\nB. Save and reuse resources.\nIdea 3 (   )\nC. Save electricity.", "options": ["A. Do small things to save water.", "B. Save and reuse resources.", "C. Save electricity."], "answer": ""}, {"q": "Answer the questions at the end of each idea. Then share with the class.", "options": [], "answer": ""}], "keypoints": ["书信格式", "一般现在时", "情态动词 can", "祈使句"], "writing": "Read the letter and write down your ideas.\n1. Green energy\n2. Saving energy\n3."}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit": "Unit 6", "name": "Reading time", "genre": "故事", "source": "Reading", "text": "It was a sunny day. Grandpa, Binbin and Robin played outside.\nT", "zh": "那是一个晴朗的日子。爷爷、彬彬和罗宾在外面玩。\nT", "topic": "户外玩耍", "words": ["sunny day", "Grandpa", "Binbin", "Robin", "played", "outside"], "comprehension": [], "keypoints": ["一般过去时", "there be 句型", "并列主语"], "writing": ""}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Recycle", "name": "Mike's happy days", "genre": "故事", "source": "Story time", "text": "Saturday was a busy day for me.\nIn the morning, I got up early.\nThen I __________________.\nAfter that, I _________________.\nNext, I __________________.\nIn the afternoon, I _______________.\nIn the evening, I ________________.\nFinally, I __________________ at 10 p.m.", "zh": "星期六对我来说是忙碌的一天。早上，我起得很早。然后我……接着我……接下来我……下午，我……晚上，我……最后，我在晚上10点……", "topic": "描述星期六一天的活动", "words": ["busy", "got up early", "Then", "After that", "Next", "In the afternoon", "In the evening", "Finally"], "comprehension": [{"q": "Can you retell what Mike did on Saturday?", "options": [], "answer": ""}], "keypoints": ["一般过去时", "时间顺序词（Then, After that, Next, Finally）", "描述日常活动"], "writing": "Can you retell what Mike did on Saturday?"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Recycle", "name": "Mike's PPT about his school life", "genre": "说明", "source": "Read and write", "text": "I go to school from Monday to Friday.\nMy favourite day is Monday.\nIn English class, I read many English stories, and I like to speak English with my friends.\nOn Monday I have maths, English, music and PE. I like PE best.\nI play the piano or sing songs in music class. This is very noisy and often great fun.\nMaths is my first class. I often answer maths questions. Sometimes they're difficult.\nIn the afternoon I have PE class. I sometimes play football or exercise in the gym. I'm not good at running, but I like football best!", "zh": "我从周一到周五上学。我最喜欢的一天是周一。在英语课上，我读很多英语故事，我喜欢和朋友们说英语。周一我有数学、英语、音乐和体育课。我最喜欢体育。在音乐课上，我弹钢琴或唱歌。这很吵，但常常很有趣。数学是我的第一节课。我经常回答数学问题。有时候它们很难。下午我有体育课。我有时踢足球或在体育馆锻炼。我不擅长跑步，但我最喜欢足球！", "topic": "描述学校生活", "words": ["favourite", "read", "speak", "play the piano", "sing songs", "answer", "exercise", "not good at"], "comprehension": [], "keypoints": ["一般现在时", "描述课程和活动", "like...best"], "writing": ""}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Recycle", "name": "A farewell party", "genre": "邮件", "source": "Read and write", "text": "Dear Friends,\nIt is time to leave our school. We are all going to middle school soon, so we will say goodbye to each other. We are going to have a farewell party. You can bring your friends.\nPlace: Our music room     Time: Friday  3 p.m.\nActivities:\nWe will draw pictures and sing songs. We are going to give prizes for the best pictures. We are going to have cake, candy and juice, too. Yum!\nWe will also give many prizes to our good students. For example, who helped others the most? Who studied hard? Who wrote the best story?\nWe will listen to music, play games and dance. It will be great fun.\nSee you at the party!", "zh": "亲爱的朋友们，是时候离开我们的学校了。我们很快都要上中学了，所以我们将互相道别。我们将举办一个告别派对。你可以带上你的朋友。地点：我们的音乐室 时间：周五下午3点。活动：我们将画画和唱歌。我们将为最好的画颁发奖品。我们还将有蛋糕、糖果和果汁。美味！我们还将给我们的优秀学生颁发许多奖品。例如，谁帮助了别人最多？谁学习最努力？谁写了最好的故事？我们将听音乐、玩游戏和跳舞。这将非常有趣。派对上见！", "topic": "告别派对邀请", "words": ["farewell party", "draw pictures", "sing songs", "give prizes", "helped others", "studied hard", "wrote the best story", "listen to music"], "comprehension": [], "keypoints": ["一般将来时（will, be going to）", "邀请信格式", "描述活动"], "writing": "Write a reply. Are you going to go to the party? What will you do at the party?"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Recycle", "name": "Zip and Zoom", "genre": "对话", "source": "Story time", "text": "Zip: I have some good news and some bad news.\nZoom: What is it?\nZip: I'm going away for a long time.\nZoom: I'm sorry to hear that.\nZoom: Where are you going?\nZip: America. My father has a new job there.\nZoom: That is good news for your father. It's sad news for me.\nZip: Me too.\nZoom: Are you going to a new school?\nZip: I'm going to a new middle school. I'll be in Grade 7.\nZoom: Will you promise to write to me?\nZip: Of course.\nZoom: Take care.\nZip: Take care.", "zh": "Zip：我有一些好消息和一些坏消息。Zoom：是什么？Zip：我要离开很长一段时间。Zoom：听到这个我很难过。Zoom：你要去哪里？Zip：美国。我父亲在那里有一份新工作。Zoom：这对你的父亲是好消息。对我来说是坏消息。Zip：我也是。Zoom：你要去新学校吗？Zip：我要去一所新的中学。我将在七年级。Zoom：你答应给我写信吗？Zip：当然。Zoom：保重。Zip：保重。", "topic": "告别与未来", "words": ["good news", "bad news", "going away", "new job", "new middle school", "Grade 7", "promise", "Take care"], "comprehension": [], "keypoints": ["一般将来时（be going to, will）", "表达情感（sorry, sad）", "道别用语"], "writing": ""}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Recycle", "name": "Mike and his new friends: Part 1", "genre": "说明", "source": "Read and write", "text": "1. Mike likes Monday best. His favourite class is English.\n2. English is his first class on Monday. He reads many English stories, and he likes to speak English with his friends.\n3. In the maths class, Mike often answers very difficult maths questions.\n4. In the PE class, Mike sometimes plays basketball or exercises in the gym. He likes basketball best.", "zh": "1. Mike最喜欢周一。他最喜欢的课是英语。2. 英语是周一的第一节课。他读很多英语故事，喜欢和朋友们说英语。3. 在数学课上，Mike经常回答非常难的数学问题。4. 在体育课上，Mike有时打篮球或在体育馆锻炼。他最喜欢篮球。", "topic": "描述Mike的学校生活", "words": ["likes...best", "favourite", "reads", "speak", "answers", "difficult", "plays basketball", "exercises"], "comprehension": [], "keypoints": ["一般现在时第三人称单数", "like...best", "频率副词（often, sometimes）"], "writing": ""}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Recycle", "name": "Mike and his new friends: Part 2", "genre": "说明", "source": "Read and write", "text": "Bill told his friends about Mike. Read and underline the mistakes.\n1. Bill liked candy.\n2. Bill is taller than before.\n3. Bill will wear a red hat to work.\n4. Bill likes to read storybooks.\n5. Bill was smaller before.\n6. Bill will be thinner than he is now.", "zh": "Bill向他的朋友们讲述了Mike的情况。阅读并划出错误。\n1. Bill喜欢糖果。\n2. Bill比以前更高了。\n3. Bill将戴一顶红帽子去上班。\n4. Bill喜欢读故事书。\n5. Bill以前更小。\n6. Bill将比他现在的样子更瘦。", "topic": "描述Bill的变化", "words": ["liked", "taller", "wear", "storybooks", "smaller", "thinner"], "comprehension": [], "keypoints": ["一般过去时", "比较级（taller, smaller, thinner）", "一般将来时（will）"], "writing": ""}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Recycle", "name": "Mike's surprise", "genre": "说明", "source": "Read and write", "text": "Mike's school sent him an invitation.\ncl\npl        br\nfr         ch              sh         th\nng\nnk\nclock\nbrown bread\ncheese\ncake\nfresh fruit\nmilk\norange juice\ntea bags\nchocolates\nplates\nknives\nforks\nEnglish books\nmaths books\npink party hats\nprizes\npaints\nballoons\nping-pong balls\nclock", "zh": "Mike的学校给他发了一份邀请。cl pl br fr ch sh th ng nk 时钟 棕色面包 奶酪 蛋糕 新鲜水果 牛奶 橙汁 茶包 巧克力 盘子 刀 叉 英语书 数学书 粉色派对帽 奖品 颜料 气球 乒乓球 时钟", "topic": "派对物品清单", "words": ["invitation", "clock", "brown bread", "cheese", "cake", "fresh fruit", "milk", "orange juice", "tea bags", "chocolates"], "comprehension": [], "keypoints": ["名词复数", "物品名称", "清单格式"], "writing": "Now make your own list of things for the party!"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Recycle", "name": "A farewell party", "genre": "说明", "source": "Read and write", "text": "The party is on Friday.\nIt's time to say goodbye.\nWe won't sing any sad songs,\nAnd we'll have lots of fun.\nThe party is on Friday.\nWe'll dance and sing and play.\nDon't be late for the party.\nWe'll have a happy, happy day.", "zh": "派对在周五。是时候说再见了。我们不会唱任何悲伤的歌，我们将有很多乐趣。派对在周五。我们将跳舞、唱歌和玩耍。不要迟到派对。我们将有一个快乐、快乐的一天。", "topic": "派对与告别", "words": ["party", "say goodbye", "sad songs", "lots of fun", "dance", "sing", "play", "happy day"], "comprehension": [], "keypoints": ["一般将来时（will）", "否定句（won't）", "祈使句（Don't be late）"], "writing": ""}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Recycle", "name": "Mike's happy days", "genre": "故事", "source": "Story time", "text": "Saturday was a busy day for me.\nIn the morning, I got up early.\nThen I __________________.\nAfter that, I _________________.\nNext, I __________________.\nIn the afternoon, I _______________.\nIn the evening, I ________________.\nFinally, I __________________ at 10 p.m.", "zh": "星期六对我来说是忙碌的一天。早上，我起得很早。然后我……接着我……接下来我……下午，我……晚上，我……最后，我在晚上10点……", "topic": "描述星期六一天的活动", "words": ["busy", "got up early", "Then", "After that", "Next", "In the afternoon", "In the evening", "Finally"], "comprehension": [{"q": "Can you retell what Mike did on Saturday?", "options": [], "answer": ""}], "keypoints": ["一般过去时", "时间顺序词（Then, After that, Next, Finally）", "描述日常活动"], "writing": "Can you retell what Mike did on Saturday?"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 1", "name": "Little Duck is watching the sun go down", "genre": "故事", "source": "Read and write", "text": "Little Duck is watching the sun\ngo down. It is getting lower and\nlower, but his shadow is getting\nlonger and longer.\n\"Why is that?\" Little Duck asks\nhis friend Old Tree. \"You are\nolder and smarter than me. Tell\nme — why is my shadow longer\nwhen the sun gets lower?\"\nOld Tree says,\n\"That’s easy, Little\nDuck. The sun goes\ndown every day, and\nwe grow older every\nday. Your shadow\ngrows longer because\nyou are growing taller.\nYou are becoming a big\nbeautiful bird!\"\nCan you answer Little\nDuck’s question, Robin?", "zh": "小鸭子看着太阳下山。太阳越来越低，但他的影子却越来越长。\n“为什么呀？”小鸭子问他的朋友老树。“你比我年纪大，也比我聪明。告诉我——为什么太阳越低，我的影子就越长？”\n老树说：“这很简单，小鸭子。太阳每天下山，我们每天变老。你的影子变长是因为你在长高。你正在变成一只又大又漂亮的鸟！”\n你能回答小鸭子的这个问题吗，罗宾？", "topic": "影子变长与成长", "words": ["lower", "longer", "older", "smarter", "taller", "growing", "beautiful", "shadow", "sun", "grow"], "comprehension": [{"q": "1. Choose a title for the story.", "options": ["A. Little Duck’s shadow", "B. Old Tree’s shadow"], "answer": "A"}, {"q": "2. Who is younger?", "options": ["A. The tree.", "B. The duck."], "answer": "B"}, {"q": "3. When is the duck’s shadow longer?", "options": ["A. In the morning.", "B. In the afternoon."], "answer": "B"}], "keypoints": ["比较级 -er 形式", "现在进行时 be + doing", "because 引导原因状语从句", "形容词比较级与变化描述"], "writing": "1. Do you agree with Old Tree? Why?\n2. Can you answer Little Duck’s question? What’s your answer?\n3. Please circle the words with \"-er\". Then talk about the changes in your friends.\nLittle Duck: Old Tree, the sun gets _______, but my shadow gets _______. Why?\nOld Tree: That’s easy. Your shadow gets longer because you are getting _______ and growing _______ every day.\nLittle Duck: So what will happ"}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 1", "name": "Football needs teamwork", "genre": "剧本", "source": "Story time", "text": "Zebra: They need a new\ngoalkeeper.\nDeer: I’d like to have a try.\nGiraffe: Me too.\nDog: I can’t wait.\nZoom: How tall are you?\nDeer: I’m 1.8 metres.\nZip: How heavy are you?\nDeer: I’m 86 kilograms.\nZip: Mr Zebra is 10\ncentimetres taller than\nMr Deer.\nZoom: Yes, and he’s stronger.\nBut he can’t catch the ball!\nGiraffe: I’m the tallest one.\nZip: Sorry. Your neck is\ntoo long. The others\ncan’t reach you.\nFootball needs\nteamwork.\nHippo: What’s happening here?\nZip: Oh! Here’s the one\nwe want!\nZoom: Why? He’s too heavy!\nZip: We need a big guy!\nZoom: Oh! He’s almost bigger\nthan the goal!\nDog: Yes! He’s an excellent\ngoalkeeper.", "zh": "斑马：他们需要一个新守门员。\n鹿：我想试一试。\n长颈鹿：我也是。\n狗：我等不及了。\nZoom：你有多高？\n鹿：我1.8米。\nZip：你有多重？\n鹿：我86公斤。\nZip：斑马先生比鹿先生高10厘米。\nZoom：是的，而且他更强壮。\n但他接不住球！\n长颈鹿：我是最高的。\nZip：抱歉。你的脖子太长了。其他人够不到你。\n足球需要团队合作。\n河马：这里发生什么了？\nZip：哦！这就是我们想要的人！\nZoom：为什么？他太重了！\nZip：我们需要一个大个子！\nZoom：哦！他几乎比球门还大！\n狗：是的！他是个出色的守门员。", "topic": "选守门员与团队合作", "words": ["goalkeeper", "taller", "stronger", "heavier", "bigger", "teamwork", "excellent", "centimetres", "kilograms", "neck"], "comprehension": [], "keypoints": ["比较级 -er 形式", "How tall/heavy are you? 句型", "too + 形容词", "need 与 teamwork 表达"], "writing": ""}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 1", "name": "Wu Binbin and his family are going on a trip to the countryside", "genre": "其他", "source": "Read and write", "text": "Spring is coming! The sky is clearer and the sun is\nbrighter. Can you think of any other changes? Look\nand tick.\nWu Binbin and his family are going on a trip to the\ncountryside. Wu Binbin has a story to tell Robin.", "zh": "春天来了！天空更清澈，太阳更明亮。你能想到其他变化吗？看一看并打勾。\n吴彬彬和他的家人要去乡下旅行。吴彬彬有一个故事要讲给罗宾听。", "topic": "春天的变化与旅行", "words": ["clearer", "brighter", "spring", "countryside", "trip", "changes", "story", "tell", "coming", "sky"], "comprehension": [], "keypoints": ["比较级 -er 形式", "现在进行时 be + doing", "一般将来时 be going to", "描述季节与变化"], "writing": ""}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 1", "name": "Mike and Wu Binbin are talking about the weekend", "genre": "其他", "source": "其他", "text": "Mike and Wu Binbin are talking about the weekend.\nListen and circle.", "zh": "迈克和吴彬彬正在谈论周末。\n听一听并圈出。", "topic": "周末计划", "words": ["weekend", "talking", "listen", "circle", "Mike", "Wu Binbin"], "comprehension": [], "keypoints": ["现在进行时 be + doing", "谈论计划", "听力理解"], "writing": ""}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 2", "name": "Mike and Grandpa", "genre": "对话", "source": "Read and write", "text": "Mike: Hi, Grandpa. How are you? How was your weekend?\nGrandpa: I’m fine, Mike. It was good, thank you.\nMike: What did you do?\nGrandpa: Well, I stayed at home with your grandma. We drank tea in the afternoon and watched TV.\nMike: I watched TV, too. I watched some children’s shows on TV.\nGrandpa: That’s nice. Did you do anything else?\nMike: Yes, I cleaned my room and washed my clothes.\nGrandpa: You are a good boy!", "zh": "迈克：嗨，爷爷。你好吗？你周末过得怎么样？\n爷爷：我很好，迈克。过得不错，谢谢你。\n迈克：你做了什么？\n爷爷：嗯，我和你的奶奶待在家里。我们下午喝茶，还看了电视。\n迈克：我也看了电视。我看了一些儿童节目。\n爷爷：那很好。你还做了别的事吗？\n迈克：是的，我打扫了房间，还洗了衣服。\n爷爷：你是个好孩子！", "topic": "周末活动", "words": ["How was your weekend", "What did you do", "stayed at home", "drank tea", "watched TV", "cleaned my room", "washed my clothes", "anything else"], "comprehension": [{"q": "Sarah and Mike are talking on             .", "options": ["A. Saturday", "B. Sunday"], "answer": ""}, {"q": "Who is Mike going to call?", "options": ["A. His grandparents.", "B. His parents."], "answer": ""}], "keypoints": ["一般过去时", "特殊疑问句 What did you do", "助动词 did 的一般疑问句", "动词过去式"], "writing": ""}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 2", "name": "John and Amy", "genre": "对话", "source": "Read and write", "text": "John: Hey, Amy. Let’s go to the bookstore. I want to buy the new film magazine.\nAmy: Oh, I read it last weekend.\nJohn: Was it interesting?\nAmy: Yes, it talked about a lot of new films.\nWhat did you do last weekend? Did you see a film?\nJohn: No, I had a cold. I stayed at home all weekend and slept.\nAmy: Oh, I’m sorry. I’m happy you feel better now.\nJohn: Thanks. Let’s go by bus. It’s faster than walking.", "zh": "约翰：嘿，艾米。我们去书店吧。我想买那本新的电影杂志。\n艾米：哦，我上周末读过了。\n约翰：有趣吗？\n艾米：是的，它讲了很多新电影。\n你上周末做了什么？你看电影了吗？\n约翰：没有，我感冒了。我整个周末都待在家里睡觉。\n艾米：哦，我很抱歉。很高兴你现在感觉好些了。\n约翰：谢谢。我们坐公交车去吧。比走路快。", "topic": "周末活动与身体状况", "words": ["Let’s go to", "want to buy", "read it", "Was it interesting", "talked about", "had a cold", "stayed at home", "slept", "feel better", "faster than walking"], "comprehension": [{"q": "What did John do last weekend?", "options": ["A. He slept.", "B. He read a new film magazine."], "answer": "A"}, {"q": "Are Wu Binbin and John going to meet Amy together?", "options": ["A. Yes, they are.", "B. No, they aren’t."], "answer": "B"}], "keypoints": ["一般过去时", "一般疑问句 Was it...", "助动词 did 的一般疑问句", "比较级 faster than"], "writing": ""}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 2", "name": "Dear Sir", "genre": "书信", "source": "Read and write", "text": "Dear Sir,\nOur weekend at your hotel was bad. Our room was big but everything was very old. Our friend Robin cleaned our room and fixed a broken chair.\nMy mother wanted to read a book but the lamp was too small.\nMy dad got some hamburgers from the hotel kitchen, but they were cold and tasted bad.\nI wanted to watch TV but the TV didn’t work. The people in Room 301 listened to loud music. I didn’t sleep all night.\nI’m sorry, but we didn’t enjoy our stay very much.\nWu Binbin and family", "zh": "尊敬的先生：\n我们在你们酒店的周末过得很糟糕。我们的房间很大，但一切都非常旧。我们的朋友罗宾打扫了我们的房间，还修好了一把坏椅子。\n我妈妈想看书，但灯太小了。\n我爸爸从酒店厨房拿了一些汉堡，但它们很冷，味道也不好。\n我想看电视，但电视坏了。301 房间的人听了很吵的音乐。我一整晚都没睡。\n很抱歉，我们不太享受这次住宿。\n吴彬彬和家人", "topic": "酒店住宿经历", "words": ["was bad", "was big", "was very old", "cleaned our room", "fixed a broken chair", "wanted to read", "was too small", "got some hamburgers", "tasted bad", "didn’t work"], "comprehension": [], "keypoints": ["一般过去时", "but 连接的转折句", "动词过去式", "否定句 didn’t"], "writing": "Read and finish the letter."}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 2", "name": "Dear Manager", "genre": "书信", "source": "Read and write", "text": "Dear Manager,\nLast weekend, the Wu family were not happy with their room.\nThe people in Room 301 ____________________ all night. It was very noisy. The father ____________________ from the kitchen but ________________________. Also, the mother ____________________ but the lamp ____________________.\nThe TV didn’t work either.\nIt wasn’t a good stay. Maybe we can write an email and say sorry to them.\nMrs Broom", "zh": "尊敬的管理者：\n上周末，吴家对他们的房间不满意。\n301 房间的人整晚 ____________________。非常吵。父亲从厨房 ____________________，但是 ________________________。此外，母亲 ____________________，但灯 ____________________。\n电视也不工作。\n这不是一次愉快的住宿。也许我们可以写一封邮件向他们道歉。\n布卢姆夫人", "topic": "酒店住宿投诉", "words": ["were not happy", "all night", "was very noisy", "from the kitchen", "the lamp", "didn’t work", "a good stay", "write an email", "say sorry"], "comprehension": [], "keypoints": ["一般过去时", "but 连接的转折句", "动词过去式", "否定句 didn’t"], "writing": "Read and finish the letter."}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 2", "name": "Zip and Zoom", "genre": "对话", "source": "Story time", "text": "Zip: How was your weekend?\nZoom: It was a busy one.\nZip: What did you do on Sunday morning?\nZoom: I cleaned my room. Then I visited my grandparents.\nZip: What did you do on Sunday afternoon?\nZoom: I played football. Then I watched TV.\nZip: That was a busy weekend.\nZoom: Yes, it was. Now I need another weekend.\nZip: What did you do on Saturday afternoon?\nZoom: I did my homework. Then I went fishing.\nZip: What did you do on Saturday morning?\nZoom: I washed my schoolbag. Then I went to the park.", "zh": "Zip：你周末过得怎么样？\nZoom：很忙碌。\nZip：你周日早上做了什么？\nZoom：我打扫了房间。然后我去看望了我的祖父母。\nZip：你周日下午做了什么？\nZoom：我踢了足球。然后我看了电视。\nZip：那是个忙碌的周末。\nZoom：是的。现在我需要另一个周末了。\nZip：你周六下午做了什么？\nZoom：我做了作业。然后我去钓鱼了。\nZip：你周六早上做了什么？\nZoom：我洗了书包。然后我去了公园。", "topic": "周末活动", "words": ["How was your weekend", "a busy one", "What did you do", "cleaned my room", "visited my grandparents", "played football", "watched TV", "did my homework", "went fishing", "washed my schoolbag"], "comprehension": [], "keypoints": ["一般过去时", "特殊疑问句 What did you do", "时间状语 on Sunday morning", "连词 Then"], "writing": ""}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 2", "name": "You didn’t come to school", "genre": "对话", "source": "Story time", "text": "You didn’t come to school.\nWhat happened?\nOh dear! Are you all right?\nCan I come and visit you?\nYes, I’m OK. Thanks.\nI fell off my bike and hurt my foot.\nSure! You can see my photos from the Labour Day holiday.", "zh": "你没来上学。\n发生什么事了？\n哦，天哪！你还好吗？\n我可以来看你吗？\n是的，我没事。谢谢。\n我从自行车上摔下来，伤了脚。\n当然可以！你可以看看我劳动节假期的照片。", "topic": "受伤与问候", "words": ["didn’t come to school", "What happened", "Are you all right", "come and visit", "I’m OK", "fell off my bike", "hurt my foot", "photos from", "Labour Day holiday"], "comprehension": [], "keypoints": ["一般过去时", "一般疑问句 Are you all right", "情态动词 can", "动词过去式 fell, hurt"], "writing": ""}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 2", "name": "Mike and Grandpa", "genre": "对话", "source": "Read and write", "text": "Mike: Hi, Grandpa. How are you? How was your weekend?\nGrandpa: I’m fine, Mike. It was good, thank you.\nMike: What did you do?\nGrandpa: Well, I stayed at home with your grandma. We drank tea in the afternoon and watched TV.\nMike: I watched TV, too. I watched some children’s shows on TV.\nGrandpa: That’s nice. Did you do anything else?\nMike: Yes, I cleaned my room and washed my clothes.\nGrandpa: You are a good boy!", "zh": "迈克：嗨，爷爷。你好吗？你周末过得怎么样？\n爷爷：我很好，迈克。过得不错，谢谢你。\n迈克：你做了什么？\n爷爷：嗯，我和你的奶奶待在家里。我们下午喝茶，还看了电视。\n迈克：我也看了电视。我看了一些儿童节目。\n爷爷：那很好。你还做了别的事吗？\n迈克：是的，我打扫了房间，还洗了衣服。\n爷爷：你是个好孩子！", "topic": "周末活动", "words": ["How was your weekend", "What did you do", "stayed at home", "drank tea", "watched TV", "cleaned my room", "washed my clothes", "anything else"], "comprehension": [{"q": "Sarah and Mike are talking on             .", "options": ["A. Saturday", "B. Sunday"], "answer": ""}, {"q": "Who is Mike going to call?", "options": ["A. His grandparents.", "B. His parents."], "answer": ""}], "keypoints": ["一般过去时", "特殊疑问句 What did you do", "助动词 did 的一般疑问句", "动词过去式"], "writing": ""}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 3", "name": "Wu Binbin's diary", "genre": "日记", "source": "Read and write", "text": "Saturday, April 23rd\nToday was a sunny day. In the morning, we rode a bike for three people. Max sat in a basket on the front of the bike.\nThat was fun! We took pictures of the beautiful countryside.\nWe bought some gifts and ate some delicious food.\nIn the afternoon, Mum ate some bad fruit and didn’t feel well. So we stayed in the hotel. Dad and I wanted to make her happy. We dressed up and made a funny play. Robin played the part of a dog. He was so cute. Max liked him so much. He jumped on him and licked him. Of course, Robin didn’t like it.\nWe laughed and laughed.\nIt was a bad day but also a good day!", "zh": "4月23日，星期六\n今天是晴天。早上，我们骑了一辆三人自行车。马克斯坐在自行车前面的篮子里。\n那很有趣！我们拍了美丽乡村的照片。\n我们买了一些礼物，吃了一些美味的食物。\n下午，妈妈吃了一些坏水果，感觉不舒服。所以我们待在酒店里。爸爸和我想让她开心。我们穿上戏服，演了一出有趣的戏。罗宾扮演了一只狗。他太可爱了。马克斯非常喜欢他。他跳到他身上舔他。当然，罗宾不喜欢这样。\n我们笑个不停。\n这是糟糕的一天，但也是美好的一天！", "topic": "难忘的一天", "words": ["rode a bike", "took pictures", "bought gifts", "ate delicious food", "didn’t feel well", "stayed in the hotel", "dressed up", "played the part of", "licked"], "comprehension": [{"q": "What happened to Wu Binbin’s family?", "options": [], "answer": ""}], "keypoints": ["一般过去时", "过去式不规则动词", "连词 so", "感叹句 It was a bad day but also a good day!"], "writing": "Now write about your bad but good day."}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 3", "name": "Zoom and Zip on the moon", "genre": "对话", "source": "Story time", "text": "Zoom: Am I now on the moon? I can’t believe it! She must be Chang’e.\nOh, there is the rabbit.\nZip: Where did you go?\nZoom: I went to the moon.\nZip: How did you go there?\nZoom: By spaceship.\nZip: What did you see?\nZoom: I saw Chang’e, the rabbit and the tree.\nZip: Did you take any pictures?\nZoom: Yes, I did. Oops, where did I put the pictures?\nZoom: Oh, it was a dream.\nZip: How was your holiday?\nZoom: It was fun.\nZoom: It’s time to go.\nGood! Here comes a spaceship.", "zh": "祖姆：我现在在月球上吗？我不敢相信！她一定是嫦娥。\n哦，那里有兔子。\n齐普：你去哪儿了？\n祖姆：我去了月球。\n齐普：你怎么去的？\n祖姆：坐宇宙飞船。\n齐普：你看到了什么？\n祖姆：我看到了嫦娥、兔子和树。\n齐普：你拍照片了吗？\n祖姆：是的，我拍了。哎呀，我把照片放哪儿了？\n祖姆：哦，那是一场梦。\n齐普：你的假期怎么样？\n祖姆：很有趣。\n祖姆：该走了。\n太好了！宇宙飞船来了。", "topic": "月球之旅", "words": ["on the moon", "Chang’e", "spaceship", "take pictures", "it was a dream", "How was your holiday"], "comprehension": [], "keypoints": ["一般过去时", "疑问句 Where did you go?", "情态动词 must", "感叹句 It was fun."], "writing": ""}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit": "Unit 4", "name": "What a dream!", "genre": "故事", "source": "Read and write", "text": "Wu Binbin had a race with his father and Max. There were many people there. His father ran very fast, but Wu Binbin could not.\nThere was nothing he could do. He was so worried. \"I could run fast at school,\" he thought. \"Why am I so slow now?\"\nThen Robin said, \"Drink this!\" and gave Wu Binbin some water. Wu Binbin drank it and suddenly he felt good. He could run fast again.\nThere was a second race. There were many animals in that race.\nWu Binbin ran like a cheetah. He could win the race! But suddenly he tripped and fell. Then he woke up. He was in bed. It was all a dream!", "zh": "吴彬彬和爸爸还有马克赛跑。那里有很多人。爸爸跑得很快，但吴彬彬跑不快。他什么也做不了，非常担心。他想：“我在学校能跑得很快，为什么现在这么慢？”然后罗宾说：“喝这个！”并给了吴彬彬一些水。吴彬彬喝了水，突然感觉很好，又能跑得很快了。第二场比赛开始了，那场比赛里有很多动物。吴彬彬像猎豹一样奔跑，他能赢得比赛！但突然他绊倒摔了一跤。然后他醒了，他在床上。原来这全是一场梦！", "topic": "梦境与比赛", "words": ["race", "worried", "suddenly", "tripped", "woke up", "dream", "cheetah", "could", "ran", "fast"], "comprehension": [{"q": "Wu Binbin had a race with his father and Max. There were many people there. His father ran very fast, but Wu Binbin could not.", "options": [], "answer": ""}, {"q": "There was nothing he could do. He was so worried. \"I could run fast at school,\" he thought. \"Why am I so slow now?\"", "options": [], "answer": ""}, {"q": "Then Robin said, \"Drink this!\" and gave Wu Binbin some water. Wu Binbin drank it and suddenly he felt good. He could run fast again.", "options": [], "answer": ""}, {"q": "There was a second race. There were many animals in that race.", "options": [], "answer": ""}, {"q": "Wu Binbin ran like a cheetah. He could win the race! But suddenly he tripped and fell. Then he woke up. He was in bed. It was all a dream!", "options": [], "answer": ""}], "keypoints": ["  for school", "scene": "Let's talk", "function": "时间与日程", "patterns": ["It's time to go to school.", "John is late.", "What's wrong with John's schedule?"], "turns": [{"s": "A", "speaker": "A", "en": "It's 7:30. It's time to go to school.", "zh": "现在是7点30分。该上学了。"}, {"s": "A", "speaker": "A", "en": "It's 8 o'clock. John is late.", "zh": "现在是8点。约翰迟到了。"}, {"s": "A", "speaker": "A", "en": "It's time to go to school.", "zh": "该上学了。"}, {"s": "A", "speaker": "A", "en": "What's wrong with John's schedule?", "zh": "约翰的时间表有什么问题？"}]}, {"book": "四年级下册", "grade": "四年级", "term": "下册", "unit": "Unit 4", "title": "Going shopping", "scene": "Look and think", "function": "请求与应答", "patterns": ["Can I buy ...?", "You already have too many ...", "Let's buy ...", "Let's go shopping."], "turns": [{"s": "Child", "speaker": "Child", "en": "Look, Mum! Those shorts are nice. Can I buy a pair?", "zh": "看，妈妈！那条短裤很漂亮。我能买一条吗？"}, {"s": "Mum", "speaker": "Mum", "en": "You already have too many shorts. Let's buy trousers.", "zh": "你已经有太多短裤了。我们买条长裤吧。"}, {"s": "Child", "speaker": "Child", "en": "Mum, my trousers are too short. Can I buy a new pair?", "zh": "妈妈，我的长裤太短了。我能买一条新的吗？"}, {"s": "Mum", "speaker": "Mum", "en": "Sure. Let's go to the clothes shop.", "zh": "当然可以。我们去服装店吧。"}, {"s": "Child", "speaker": "Child", "en": "Mum, can I buy a new coat? This one is too small.", "zh": "妈妈，我能买一件新外套吗？这件太小了。"}, {"s": "Mum", "speaker": "Mum", "en": "Sure. You need a new coat. Let's go shopping.", "zh": "当然可以。你需要一件新外套。我们去购物吧。"}, {"s": "Child", "speaker": "Child", "en": "Can I buy a toy car too?", "zh": "我也能买一辆玩具车吗？"}, {"s": "Mum", "speaker": "Mum", "en": "You already have too many toy cars. Let's just buy the coat.", "zh": "你已经有太多玩具车了。我们只买外套吧。"}, {"s": "Child", "speaker": "Child", "en": "OK, Mum.", "zh": "好的，妈妈。"}]}, {"book": "四年级下册", "grade": "四年级", "term": "下册", "unit": "Unit 4", "title": "Going shopping", "scene": "Let's talk (Read and role-play)", "function": "询问信息", "patterns": ["What do we need to buy?", "I need a new one.", "I need a pair of ...", "I need my school uniform."], "turns": [{"s": "A", "speaker": "A", "en": "What do we need to buy?", "zh": "我们需要买什么？"}, {"s": "B", "speaker": "B", "en": "My skirt is too small. I need a new one.", "zh": "我的裙子太小了。我需要一条新的。"}, {"s": "A", "speaker": "A", "en": "That one is nice.", "zh": "那条很漂亮。"}, {"s": "B", "speaker": "B", "en": "I need a pair of shorts and a ...", "zh": "我需要一条短裤和一件……"}, {"s": "A", "speaker": "A", "en": "I need my school uniform.", "zh": "我需要我的校服。"}]}, {"book": "四年级下册", "grade": "四年级", "term": "下册", "unit": "Unit 4", "title": "Going shopping", "scene": "Let's talk (Read and role-play)", "function": "购物与价格", "patterns": ["How much is it?", "It's ... yuan.", "Can I help you?", "Let's take it."], "turns": [{"s": "A", "speaker": "A", "en": "Look! The blue skirt is nice too. It's 79 yuan.", "zh": "看！那条蓝色的裙子也很漂亮。79元。"}, {"s": "B", "speaker": "B", "en": "OK. Let's take it.", "zh": "好的。我们买它吧。"}, {"s": "A", "speaker": "A", "en": "Can I help you?", "zh": "需要帮忙吗？"}, {"s": "B", "speaker": "B", "en": "Yes. I like this pink dress. How much is it?", "zh": "是的。我喜欢这条粉色的连衣裙。多少钱？"}, {"s": "A", "speaker": "A", "en": "It's 180 yuan.", "zh": "180元。"}, {"s": "B", "speaker": "B", "en": "Yes. I like it.", "zh": "是的。我喜欢它。"}, {"s": "A", "speaker": "A", "en": "I'm sorry, dear. That's expensive.", "zh": "对不起，亲爱的。那太贵了。"}, {"s": "B", "speaker": "B", "en": "OK. Let's take it.", "zh": "好的。我们买它吧。"}, {"s": "A", "speaker": "A", "en": "How much is the jacket?", "zh": "这件夹克多少钱？"}, {"s": "B", "speaker": "B", "en": "It's 50 yuan now.", "zh": "现在50元。"}]}, {"book": "四年级下册", "grade": "四年级", "term": "下册", "unit": "Unit 4", "title": "Going shopping", "scene": "Let's talk (Read and role-play)", "function": "购物与价格", "patterns": ["How much are they?", "They're ... yuan.", "Can I help you?", "Do you like ...?"], "turns": [{"s": "A", "speaker": "A", "en": "Yes! They're beautiful.", "zh": "是的！它们很漂亮。"}, {"s": "B", "speaker": "B", "en": "How much are they?", "zh": "它们多少钱？"}, {"s": "A", "speaker": "A", "en": "They're 99 yuan.", "zh": "99元。"}, {"s": "B", "speaker": "B", "en": "They're 20 yuan.", "zh": "20元。"}, {"s": "A", "speaker": "A", "en": "Can I help you?", "zh": "需要帮忙吗？"}, {"s": "B", "speaker": "B", "en": "Yes. I like the blue shorts. How much are they?", "zh": "是的。我喜欢那条蓝色的短裤。它们多少钱？"}, {"s": "A", "speaker": "A", "en": "Do you like the sunglasses?", "zh": "你喜欢这副太阳镜吗？"}, {"s": "B", "speaker": "B", "en": "That's cheap!", "zh": "那很便宜！"}]}, {"book": "四年级下册", "grade": "四年级", "term": "下册", "unit": "Unit 4", "title": "Going shopping", "scene": "Look and role-play", "function": "购物与价格", "patterns": ["How much are ...?", "... yuan now!", "... yuan each!", "Buy two, get one free!"], "turns": [{"s": "A", "speaker": "A", "en": "How much are these shorts and sunglasses?", "zh": "这些短裤和太阳镜多少钱？"}, {"s": "B", "speaker": "B", "en": "Sunglasses: Sixty yuan now!", "zh": "太阳镜：现在60元！"}, {"s": "A", "speaker": "A", "en": "Shorts: Fifteen yuan each!", "zh": "短裤：每条15元！"}, {"s": "B", "speaker": "B", "en": "Many colours! Buy two, get one free!", "zh": "颜色很多！买二送一！"}, {"s": "A", "speaker": "A", "en": "Hats: Large (L) size only, ten yuan!", "zh": "帽子：只有大号（L），10元！"}]}, {"book": "四年级下册", "grade": "四年级", "term": "下册", "unit": "Unit 4", "title": "Going shopping", "scene": "Project: Choose clothes for a singing contest", "function": "购物与价格", "patterns": ["Can we buy ...?", "How much is it?", "It's ... yuan.", "We only have ... yuan each."], "turns": [{"s": "A", "speaker": "A", "en": "I like the shirt with the black tie. Can we buy Set 2?", "zh": "我喜欢那件带黑色领带的衬衫。我们能买第二套吗？"}, {"s": "B", "speaker": "B", "en": "How much is it?", "zh": "多少钱？"}, {"s": "A", "speaker": "A", "en": "It's 60 yuan.", "zh": "60元。"}, {"s": "B", "speaker": "B", "en": "We only have 50 yuan each.", "zh": "我们每人只有50元。"}]}, {"book": "四年级下册", "grade": "四年级", "term": "下册", "unit": "Appendix 4", "title": "Useful expressions", "scene": "Unit 1 课堂与值日", "function": "请求与应答", "patterns": ["Hurry up! Don't be late for class!", "I'm ready. Let's go!", "Who's on duty today?", "I can put back the desks and chairs."], "turns": [{"s": "A", "speaker": "A", "en": "Hurry up! Don't be late for class!", "zh": "快点！上课别迟到！"}, {"s": "B", "speaker": "B", "en": "I'm ready. Let's go!", "zh": "我准备好了。我们走吧！"}, {"s": "A", "speaker": "A", "en": "Who's on duty today?", "zh": "今天谁值日？"}, {"s": "B", "speaker": "B", "en": "I can put back the desks and chairs.", "zh": "我可以把桌椅放回原位。"}, {"s": "A", "speaker": "A", "en": "Excuse me?", "zh": "对不起，请再说一次可以吗？"}]}, {"book": "四年级下册", "grade": "四年级", "term": "下册", "unit": "Appendix 4", "title": "Useful expressions", "scene": "Unit 2 家庭与提醒", "function": "请求与应答", "patterns": ["Can I watch TV?", "You have to do your homework first.", "Don't be so loud!", "Don't touch hot things."], "turns": [{"s": "Child", "speaker": "Child", "en": "Mum, can I watch TV?", "zh": "妈妈，我能看电视吗？"}, {"s": "Mum", "speaker": "Mum", "en": "No. You have to do your homework first.", "zh": "不行。你得先做作业。"}, {"s": "Mum", "speaker": "Mum", "en": "Shh. Don't be so loud!", "zh": "嘘。别这么大声！"}, {"s": "Mum", "speaker": "Mum", "en": "Be careful, Jack. Don't touch hot things.", "zh": "杰克，要小心。别碰烫的东西。"}]}, {"book": "四年级下册", "grade": "四年级", "term": "下册", "unit": "Appendix 4", "title": "Useful expressions", "scene": "Unit 3 时间与日常", "function": "时间与日程", "patterns": ["What time is it?", "It's 5 o'clock.", "It's time for dinner.", "It's time to get up."], "turns": [{"s": "A", "speaker": "A", "en": "What time is it?", "zh": "几点了？"}, {"s": "B", "speaker": "B", "en": "It's 5 o'clock.", "zh": "现在五点了。"}, {"s": "A", "speaker": "A", "en": "Time to go home, kids.", "zh": "孩子们，该回家了。"}, {"s": "A", "speaker": "A", "en": "It's time for dinner.", "zh": "该吃晚饭了。"}, {"s": "A", "speaker": "A", "en": "It's time to get up.", "zh": "该起床了。"}, {"s": "A", "speaker": "A", "en": "Have a nice day!", "zh": "祝你一天愉快！"}]}, {"book": "四年级下册", "grade": "四年级", "term": "下册", "unit": "Appendix 4", "title": "Useful expressions", "scene": "Unit 4 购物", "function": "购物与价格", "patterns": ["Can I buy a new pair?", "Let's go to the clothes shop.", "Can I help you?", "I like this pink dress."], "turns": [{"s": "Child", "speaker": "Child", "en": "Can I buy a new pair?", "zh": "我能买条新的（裤子）吗？"}, {"s": "Mum", "speaker": "Mum", "en": "Sure. Let's go to the clothes shop.", "zh": "当然。我们去服装店吧。"}, {"s": "Mum", "speaker": "Mum", "en": "You already have too many shorts. Let's buy trousers.", "zh": "你已经有很多短裤了。我们买长裤吧。"}, {"s": "Shop assistant", "speaker": "Shop assistant", "en": "Can I help you?", "zh": "要帮忙吗？"}, {"s": "Child", "speaker": "Child", "en": "Yes. I like this pink dress.", "zh": "嗯。我喜欢这件粉色的长裙。"}, {"s": "Mum", "speaker": "Mum", "en": "Let's take it.", "zh": "我们买下它吧。"}]}, {"book": "四年级下册", "grade": "四年级", "term": "下册", "unit": "Appendix 4", "title": "Useful expressions", "scene": "Unit 5 农场与蔬果", "function": "描述事物", "patterns": ["What animals do you have on the farm?", "I have a lot of animals.", "What are these?", "They're tomatoes."], "turns": [{"s": "A", "speaker": "A", "en": "What animals do you have on the farm?", "zh": "您的农场上都养了哪些动物？"}, {"s": "B", "speaker": "B", "en": "I have a lot of animals.", "zh": "我养了很多动物。"}, {"s": "A", "speaker": "A", "en": "What are these?", "zh": "这些是什么？"}, {"s": "B", "speaker": "B", "en": "They're tomatoes.", "zh": "这些是西红柿。"}, {"s": "A", "speaker": "A", "en": "How fresh!", "zh": "真新鲜啊！"}]}, {"book": "四年级下册", "grade": "四年级", "term": "下册", "unit": "Appendix 4", "title": "Useful expressions", "scene": "Unit 6 用餐与礼貌", "function": "请求与应答", "patterns": ["Let's feed the chickens.", "Can you please pass me the vegetables?", "Would you like a knife and fork?", "Don't waste food, please."], "turns": [{"s": "A", "speaker": "A", "en": "Let's feed the chickens.", "zh": "我们喂鸡吧。"}, {"s": "B", "speaker": "B", "en": "Can you please pass me the vegetables?", "zh": "能否请你把蔬菜递给我？"}, {"s": "Mr Wang", "speaker": "Mr Wang", "en": "Mike, Amy, would you like a knife and fork?", "zh": "迈克、埃米，你们需要餐刀和餐叉吗？"}, {"s": "Mike", "speaker": "Mike", "en": "No, thank you, Mr Wang. I can use chopsticks.", "zh": "不用，谢谢您，王先生。我会用筷子。"}, {"s": "Mr Wang", "speaker": "Mr Wang", "en": "Don't waste food, please.", "zh": "请不要浪费食物。"}]}, {"book": "四年级下册", "grade": "四年级", "term": "下册", "unit": "Unit 5", "title": "Farms and us", "scene": "On the farm", "function": "询问信息", "patterns": ["How many ... do you have?", "I have ...", "What animals do you have on the farm?", "They give us ..."], "turns": [{"s": "A", "speaker": "A", "en": "How many cows do you have?", "zh": "你有多少头牛？"}, {"s": "B", "speaker": "B", "en": "I have 20.", "zh": "我有20头。"}, {"s": "A", "speaker": "A", "en": "What animals do you have on the farm?", "zh": "你在农场里有什么动物？"}, {"s": "B", "speaker": "B", "en": "I have a lot of animals. Cows, horses, sheep, pigs and chickens.", "zh": "我有很多动物。牛、马、羊、猪和鸡。"}, {"s": "A", "speaker": "A", "en": "Cows are great. They give us milk.", "zh": "牛很棒。它们给我们牛奶。"}, {"s": "B", "speaker": "B", "en": "Yes. Farm animals give us many things.", "zh": "是的。农场动物给我们很多东西。"}]}, {"book": "四年级下册", "grade": "四年级", "term": "下册", "unit": "Unit 5", "title": "Farms and us", "scene": "Ask and answer", "function": "询问信息", "patterns": ["What farm animals do you know?", "I have a lot of animals.", "There are ..."], "turns": [{"s": "A", "speaker": "A", "en": "What farm animals do you know?", "zh": "你知道哪些农场动物？"}, {"s": "B", "speaker": "B", "en": "I have a lot of animals.", "zh": "我有很多动物。"}, {"s": "A", "speaker": "A", "en": "Yes. There are sheep, cows ...", "zh": "是的。有羊、牛……"}]}, {"book": "四年级下册", "grade": "四年级", "term": "下册", "unit": "Unit 5", "title": "Farms and us", "scene": "Play a guessing game", "function": "描述事物", "patterns": ["What are these?", "What are those?", "They're ..."], "turns": [{"s": "A", "speaker": "A", "en": "What are these?", "zh": "这些是什么？"}, {"s": "B", "speaker": "B", "en": "They're tomatoes.", "zh": "它们是西红柿。"}, {"s": "A", "speaker": "A", "en": "But they're yellow!", "zh": "可是它们是黄色的！"}, {"s": "B", "speaker": "B", rcise.", "zh": "努力学习并锻炼。"}, {"s": "Chant", "speaker": "Chant", "en": "And don't forget to play.", "zh": "别忘了玩耍。"}, {"s": "Chant", "speaker": "Chant", "en": "Hey!", "zh": "嘿！"}, {"s": "Chant", "speaker": "Chant", "en": "Sleep enough.", "zh": "睡足觉。"}, {"s": "Chant", "speaker": "Chant", "en": "Eat good food.", "zh": "吃健康的食物。"}, {"s": "Chant", "speaker": "Chant", "en": "Do it every day.", "zh": "每天都做。"}, {"s": "Chant", "speaker": "Chant", "en": "Study hard and exercise.", "zh": "努力学习并锻炼。"}, {"s": "Chant", "speaker": "Chant", "en": "And don't forget to play.", "zh": "别忘了玩耍。"}, {"s": "Chant", "speaker": "Chant", "en": "Hey!", "zh": "嘿！"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit": "Appendix 1", "title": "Songs", "scene": "Unit 5 Eat and drink", "function": "邀请与建议", "patterns": ["Let's eat ...", "Let's all eat now.", "We can drink some ...", "Let's all drink now."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "Let's eat chicken and rice.", "zh": "我们吃鸡肉和米饭吧。"}, {"s": "Chant", "speaker": "Chant", "en": "Let's eat ice cream and cake.", "zh": "我们吃冰淇淋和蛋糕吧。"}, {"s": "Chant", "speaker": "Chant", "en": "Let's eat noodles and beef.", "zh": "我们吃面条和牛肉吧。"}, {"s": "Chant", "speaker": "Chant", "en": "Let's all eat now.", "zh": "我们现在一起吃吧。"}, {"s": "Chant", "speaker": "Chant", "en": "And we can drink some milk.", "zh": "我们可以喝些牛奶。"}, {"s": "Chant", "speaker": "Chant", "en": "And we can drink some tea.", "zh": "我们可以喝些茶。"}, {"s": "Chant", "speaker": "Chant", "en": "We can drink some water.", "zh": "我们可以喝些水。"}, {"s": "Chant", "speaker": "Chant", "en": "Let's all drink now.", "zh": "我们现在一起喝吧。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit": "Appendix 1", "title": "Songs", "scene": "Unit 6 Beautiful nature", "function": "描述事物", "patterns": ["There is a ...", "There are ...", "... so ...", "Nature has many things to see."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "Up in the mountain,", "zh": "在山上，"}, {"s": "Chant", "speaker": "Chant", "en": "The mountain so high.", "zh": "山那么高。"}, {"s": "Chant", "speaker": "Chant", "en": "There is a waterfall,", "zh": "有一个瀑布，"}, {"s": "Chant", "speaker": "Chant", "en": "Touching the sky.", "zh": "触碰到天空。"}, {"s": "Chant", "speaker": "Chant", "en": "Deep in the forest,", "zh": "在森林深处，"}, {"s": "Chant", "speaker": "Chant", "en": "The forest so low.", "zh": "森林那么低。"}, {"s": "Chant", "speaker": "Chant", "en": "There are flowers,", "zh": "有花朵，"}, {"s": "Chant", "speaker": "Chant", "en": "Starting to grow.", "zh": "开始生长。"}, {"s": "Chant", "speaker": "Chant", "en": "Nature has many things to see.", "zh": "大自然有很多东西可以看。"}, {"s": "Chant", "speaker": "Chant", "en": "There are high mountains, waterfalls and trees!", "zh": "有高山、瀑布和树木！"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit": "Unit 2", "title": "My feelings", "scene": "Chen Jie 与 Mike 讨论学校项目分歧", "function": "感受与情绪", "patterns": ["You look sad. What's the matter?", "I'm so worried!", "Why not do both?", "We can work together."], "turns": [{"s": "Chen Jie", "speaker": "Chen Jie", "en": "Hi, Mike. You look sad. What's the matter?", "zh": "嗨，Mike。你看起来很伤心。怎么了？"}, {"s": "Mike", "speaker": "Mike", "en": "It's about our school project. John wants to go to the children's centre, but I want to clean up the park.", "zh": "是关于我们的学校项目。John 想去儿童中心，但我想去清理公园。"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "I see. So you don't agree with each other?", "zh": "我明白了。所以你们意见不一致？"}, {"s": "Mike", "speaker": "Mike", "en": "That's right. And we have to finish our project by Monday. I'm so worried!", "zh": "没错。而且我们必须在周一前完成项目。我很担心！"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "Why not do both? I can help. We can work together.", "zh": "为什么不两个都做呢？我可以帮忙。我们可以一起合作。"}, {"s": "Mike", "speaker": "Mike", "en": "That's a good idea!", "zh": "这是个好主意！"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit": "Unit 2", "title": "My feelings", "scene": "John 与 Chen Jie 谈论 Fido 的感受", "function": "感受与情绪", "patterns": ["How does Fido feel?", "He's excited. , "speaker": "Miss White", "en": "Right. And if you don't feel well, you should see a doctor.", "zh": "对。如果你感觉不舒服，你应该去看医生。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit": "Unit 4", "title": "Healthy habits", "scene": "Let's talk: How can I stay healthy?", "function": "请求与应答", "patterns": ["How can I stay healthy?", "You should ...", "It's a good habit."], "turns": [{"s": "A", "speaker": "A", "en": "How can I stay healthy?", "zh": "我怎样才能保持健康？"}, {"s": "B", "speaker": "B", "en": "You should get enough sleep. It's a good habit.", "zh": "你应该睡足够的觉。这是一个好习惯。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit": "Unit 4", "title": "Healthy habits", "scene": "Let's talk: Hello, Ms Wang!", "function": "问候与介绍", "patterns": ["Hello, ...!", "Hi, ...", "What healthy habits do you have?", "I ..."], "turns": [{"s": "Mike", "speaker": "Mike", "en": "Hello, Ms Wang!", "zh": "你好，王老师！"}, {"s": "Ms Wang", "speaker": "Ms Wang", "en": "Hi, Mike.", "zh": "嗨，Mike。"}, {"s": "Ms Wang", "speaker": "Ms Wang", "en": "What healthy habits do you have?", "zh": "你有哪些健康的习惯？"}, {"s": "Mike", "speaker": "Mike", "en": "I ...", "zh": "我……"}, {"s": "Mike", "speaker": "Mike", "en": "Eat healthy food.", "zh": "吃健康的食物。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit": "Unit 4", "title": "Healthy habits", "scene": "Listen, write and say: Sarah and Sam are talking at home.", "function": "请求与应答", "patterns": ["Can I ...?", "No, I'm afraid not.", "You shouldn't ... so often.", "What should I do then?"], "turns": [{"s": "Sam", "speaker": "Sam", "en": "Can I watch a TV show now, please?", "zh": "请问我现在可以看个电视节目吗？"}, {"s": "Sarah", "speaker": "Sarah", "en": "No, I'm afraid not.", "zh": "不，恐怕不行。"}, {"s": "Sam", "speaker": "Sam", "en": "Can I play on Mum's phone?", "zh": "我可以在妈妈的手机上玩吗？"}, {"s": "Sarah", "speaker": "Sarah", "en": "No. You shouldn't play on a phone so often.", "zh": "不。你不应该这么频繁地玩手机。"}, {"s": "Sam", "speaker": "Sam", "en": "What should I do then?", "zh": "那我该做什么呢？"}, {"s": " ": "Zoom", "en": "Oh, OK.", "zh": "哦，好的。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit": "Appendix 4", "title": "Useful expressions", "scene": "Unit 2", "function": "询问信息", "patterns": ["What's your favourite day at school?", "What do you have on Wednesdays?", "What do you usually do at the weekend?", "Does your mother work on both Saturdays and Sundays?"], "turns": [{"s": "A", "speaker": "A", "en": "What's your favourite day at school, John?", "zh": "你在学校最喜欢哪一天，约翰？"}, {"s": "B", "speaker": "B", "en": "What do you have on Wednesdays?", "zh": "星期三你有什么课？"}, {"s": "A", "speaker": "A", "en": "I have Chinese, maths, music and PE.", "zh": "我有语文课、数学课、音乐课和体育课。"}, {"s": "A", "speaker": "A", "en": "What do you usually do at the weekend, children?", "zh": "孩子们，周末你们通常做什么？"}, {"s": "B", "speaker": "B", "en": "I often play football. Sometimes I play Chinese chess with my father.", "zh": "我经常踢足球。有时我和爸爸下象棋。"}, {"s": "A", "speaker": "A", "en": "Does your mother work on both Saturdays and Sundays?", "zh": "你妈妈周六周日都工作吗？"}, {"s": "B", "speaker": "B", "en": "Yes, she does.", "zh": "是的，她（周末两天）都工作。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit": "Appendix 4", "title": "Useful expressions", "scene": "Unit 3", "function": "描述事物", "patterns": ["What's he like?", "Is he good at football?", "What can you do for the festival?", "Can you make robots?"], "turns": [{"s": "A", "speaker": "A", "en": "What's he like?", "zh": "他什么样？"}, {"s": "B", "speaker": "B", "en": "He's tall and strong.", "zh": "他又高又壮。"}, {"s": "A", "speaker": "A", "en": "Is he good at football?", "zh": "他擅长踢足球吗？"}, {"s": "B", "speaker": "B", "en": "Yes, I think he is.", "zh": "是的，我想他擅长。"}, {"s": "A", "speaker": "A", "en": "What can you do for the festival?", "zh": "你能为科学艺术节做什么？"}, {"s": "B", "speaker": "B", "en": "I can make a robot.", "zh": "我能制作机器人。"}, {"s": "A", "speaker": "A", "en": "Can you make robots, Sarah?", "zh": "萨拉，你能制作机器人吗？"}, {"s": "B", "speaker": "B", "en": "No, I can't.", "zh": "不，我不能。"}] nction": "请求与应答", "patterns": ["How can we all stay healthy?", "We should ...", "Can I ...?", "You shouldn't ..."], "turns": [{"s": "A", "speaker": "A", "en": "How can we all stay healthy?", "zh": "我们怎样才能保持健康？"}, {"s": "B", "speaker": "B", "en": "We should eat healthy food.", "zh": "我们应该吃健康的食物。"}, {"s": "A", "speaker": "A", "en": "Can I play on Mum's phone?", "zh": "我可以玩玩妈妈的手机吗？"}, {"s": "B", "speaker": "B", "en": "No. You shouldn't play on a phone so often.", "zh": "不行。你不应总是玩手机。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit": "Unit 5", "title": "Food we eat", "scene": "Oliver 在家向妈妈点餐", "function": "请求与应答", "patterns": ["What would you like to eat?", "I'd like ...", "Would you like some ... too?", "Can I have some ...?"], "turns": [{"s": "Oliver", "speaker": "Oliver", "en": "Mum, I'm hungry.", "zh": "妈妈，我饿了。"}, {"s": "Mum", "speaker": "Mum", "en": "What would you like to eat?", "zh": "你想吃什么？"}, {"s": "Oliver", "speaker": "Oliver", "en": "I'd like beef and rice.", "zh": "我想要牛肉和米饭。"}, {"s": "Mum", "speaker": "Mum", "en": "No problem. Would you like some chicken soup too?", "zh": "没问题。你还想要些鸡汤吗？"}, {"s": "Oliver", "speaker": "Oliver", "en": "Yes, please.", "zh": "好的，谢谢。"}, {"s": "Mum", "speaker": "Mum", "en": "You should also have some salad. Vegetables are good for you.", "zh": "你也应该吃点沙拉。蔬菜对你有好处。"}, {"s": "Oliver", "speaker": "Oliver", "en": "OK. Can I have some ice cream, please?", "zh": "好的。我可以吃点冰淇淋吗？"}, {"s": "Mum", "speaker": "Mum", "en": "Yes, but just a little.", "zh": "可以，但只能吃一点。"}, {"s": "Oliver", "speaker": "Oliver", "en": "OK. Thanks, Mum.", "zh": "好的。谢谢妈妈。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit": "Unit 5", "title": "Food we eat", "scene": "Zhang Peng 和 Amy 点餐", "function": "请求与应答", "patterns": ["What would you like to eat?", "I'd like ..."], "turns": [{"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "What would you like to eat?", "zh": "你想吃什么？"}, {"s": "Amy", "speaker": "Amy", "en": "I'd like a hamburger and some ice cream.", "zh": "我想要一个汉堡和一些冰淇淋。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit": "Unit 5", "title": "Food we eat", "scene": "Mrs Green 和 Binbin 谈论椰子", "function": "询问信息", "patterns": ["What's your favourite fruit?", "Why do you like ...?", "Where does ... come from?", "It comes from ..."], "turns": [{"s": "Mrs Green", "speaker": "Mrs Green", "en": "What's your favourite fruit, Binbin?", "zh": "Binbin，你最喜欢的水果是什么？"}, {"s": "Binbin", "speaker": "Binbin", "en": "Coconuts are my favourite.", "zh": "椰子是我最喜欢的。"}, {"s": "Mrs Green", "speaker": "Mrs Green", "en": "Why do you like coconuts?", "zh": "你为什么喜欢椰子？"}, {"s": "Binbin", "speaker": "Binbin", "en": "Because coconut water is nice. And it's healthy.", "zh": "因为椰子水很好喝，而且很健康。"}, {"s": "Mrs Green", "speaker": "Mrs Green", "en": "We can also cook delicious meals with coconut.", "zh": "我们还可以用椰子做美味的饭菜。"}, {"s": "Binbin", "speaker": "Binbin", "en": "Yes! And some people make houses with coconut tree leaves.", "zh": "是的！而且有些人用椰子树叶盖房子。"}, {"s": "Mrs Green", "speaker": "Mrs Green", "en": "That's interesting. Where does your coconut come from?", "zh": "真有趣。你的椰子是从哪里来的？"}, {"s": "Binbin", "speaker": "Binbin", "en": "Hainan! There are many coconut trees there.", "zh": "海南！那里有很多椰子树。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit": "Unit 5", "title": "Food we eat", "scene": "询问椰子水的价格和产地", "function": "购物与价格", "patterns": ["How much is ...?", "It's ... yuan.", "Where does it come from?", "It comes from ..."], "turns": [{"s": "A", "speaker": "A", "en": "How much is the coconut water?", "zh": "椰子水多少钱？"}, {"s": "B", "speaker": "B", "en": "It's 16 yuan.", "zh": "16元。"}, {"s": "A", "speaker": "A", "en": "Where does it come from?", "zh": "它来自哪里？"}, {"s": "B", "speaker": "B", "en": "It comes from Hainan.", "zh": "它来自海南。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit": "Unit 5", "title": "Food we eat", "scene": "Zip 谈论茶的产地", "function": "询问信息", "patterns": ["What would you like to eat?", "Where does your ... come from?", "Most of my ... comes from ..."], "turns": [{"s": "A", "speaker": "A", "en": "What would you like to eat?", "zh": "你想吃什么？"}, {"s": "B", "speaker": "B", "en": "Where does your tea come from, Zip?", "zh": "Zip，你的茶来自哪里？"}, {"s": "Zip", "speaker": "Zip", "en": "Most of my tea comes from China!", "zh": "我的茶大部分来自中国！"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit": "Unit 6", "title": "Nature and us", "scene": "Mike's family are in a nature park. They are talking with Mr Liu, the tour guide.", "function": "询问信息", "patterns": ["Is there a ...?", "Yes, there is.", "Are there any ...?", "Yes, there are."], "turns": [{"s": "Mike's dad", "speaker": "Mike's dad", "en": "Wow! That lake is really lovely!", "zh": "哇！那个湖真可爱！"}, {"s": "Mr Liu", "speaker": "Mr Liu", "en": "Yes. There are also many rivers in the nature park.", "zh": "是的。自然公园里还有许多河流。"}, {"s": "Mike's dad", "speaker": "Mike's dad", "en": "Is there a waterfall in the forest?", "zh": "森林里有瀑布吗？"}, {"s": "Mr Liu", "speaker": "Mr Liu", "en": "Yes, there is. You'll see a beautiful one today!", "zh": "是的，有。你今天会看到一个美丽的瀑布！"}, {"s": "Mike", "speaker": "Mike", "en": "Great! Are there any famous mountains in the nature park?", "zh": "太棒了！自然公园里有著名的山吗？"}, {"s": "Mr Liu", "speaker": "Mr Liu", "en": "Yes, there are. We'll visit one tomorrow. There are many flowers too. And there are rabbits!", "zh": "是的，有。我们明天会去参观一座。还有许多花。还有兔子！"}, {"s": "Mike", "speaker": "Mike", "en": "That's great!", "zh": "那太棒了！"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit": "Unit 6", "title": "Nature and us", "scene": "Mike and his dad are talking about the weather.", "function": "时间与日程", "patterns": ["There will be ...", "I'll ...", "You can ...", "It'll be ..."], "turns": [{"s": "Mr Liu", "speaker": "Mr Liu", "en": "I'm sorry. The wind is very strong outside. We can't go on our trip this morning.", "zh": "对不起。外面风很大。今天上午我们不能去旅行了。"}, {"s": "Mike's mum", "speaker": "Mike's mum", "en": "I agree. Strong winds are often dangerous.", "zh": "我同意。大风通常很危险。"}, {"s": "Mike's dad", "speaker": "Mike's dad", "en": "There will be heavy rain in the afternoon too. Mike, stay in the hotel with Mum and close the windows. I'll go to buy some umbrellas and raincoats.", "zh": "下午也会有大雨。Mike，和妈妈待在酒店里，关上窗户。我去买些雨伞和雨衣。"}, {"s": "Mike's mum", "speaker": "Mike's mum", "en": "There is a small shop in the hotel. You can buy them there.", "zh": "酒店里有个小商店。你可以在那里买。"}, {"s": "Mike's dad", "speaker": "Mike's dad", "en": "OK.", "zh": "好的。"}, {"s": "Mr Liu", "speaker": "Mr Liu", "en": "Please don't worry! It'll be a fine day tomorrow.", "zh": "请不要担心！明天会是好天气。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit": "Unit 6", "title": "Nature and us", "scene": "Mike and Mr Liu are talking about bad weather in different seasons.", "function": "描述事物", "patterns": ["Is there any ...?", "Yes. There is ...", "Sometimes there are ...", "Be careful of ..."], "turns": [{"s": "Mike", "speaker": "Mike", "en": "Is there any bad weather here in summer?", "zh": "夏天这里有恶劣天气吗？"}, {"s": "Mr Liu", "speaker": "Mr Liu", "en": "Yes. There is heavy rain. Sometimes there are floods.", "zh": "是的。有大雨。有时还有洪水。"}, {"s": "Mike", "speaker": "Mike", "en": "Autumn is windy. Be careful of fires.", "zh": "秋天风大。小心火灾。"}, {"s": "Mr Liu", "speaker": "Mr Liu", "en": "Sometimes there is heavy snow in winter. It is very cold.", "zh": "冬天有时有大雪。非常冷。"}]}, {"book": "五年级下册", "grade": "五年级", "term": "下册", "unit": "Unit 1", "title": "My day", "scene": "A Let's talk", "function": "询问信息", "patterns": ["When do you finish class in the morning?", "We finish class at 1 o’clock.", "When do you go back to school after lunch?", "When do you usually eat dinner in Spain?"], "turns": [{"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "When do you finish class in the morning?", "zh": "你早上什么时候下课？"}, {"s": "Pedro", "speaker": "Pedro", "en": "We finish class at 1 o’clock. Then we eat lunch at home.", "zh": "我们1点下课。然后我们在家吃午饭。"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "Wow! When do you go back to school after lunch?", "zh": "哇！午饭后你们什么时候回学校？"}, {"s": "Pedro", "speaker": "Pedro", "en": "At 2:30. Classes start at 3 o’clock.", "zh": "2点半。3点开始上课。"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "When do you usually eat dinner in Spain?", "zh": "在西班牙你们通常什么时候吃晚饭？"}, {"s": "Pedro", "speaker": "Pedro", "en": "Usually at 9:30 or 10 o’clock.", "zh": "通常9点半或10点。"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "Wow! That’s too late!", "zh": "哇！那太晚了！"}]}, {"book": "五年级下册", "grade": "五年级", "term": "下册", "unit": "Unit 1", "title": "My day", "scene": "A Let's try", "function": "询问信息", "patterns": ["When do you get up?", "I get up at 6:00 a.m.", "When do you go to bed?", "At 6 o’clock in the morning."], "turns": [{"s": "A", "speaker": "A", "en": "When do you get up?", "zh": "你什么时候起床？"}, {"s": "B", "speaker": "B", "en": "I get up at 6:00 a.m.", "zh": "我早上6点起床。"}, {"s": "A", "speaker": "A", "en": "When do you go to bed?", "zh": "你什么时候睡觉？"}, {"s": "B", "speaker": "B", "en": "At 6 o’clock in the morning.", "zh": "早上6点。"}, {"s": "B", "speaker": "B", "en": "I work at night.", "zh": "我晚上工作。"}]}, {"book": "五年级下册", "grade": "五年级", "term": "下册", "unit": "Unit 1", "title": "My day", "scene": "B Let's talk", "function": "询问信息", "patterns": ["Why are you shopping today?", "So what do you do on the weekend?", "I often watch TV and play ping-pong with my father.", "I usually wash my clothes."], "turns": [{"s": "Shopkeeper", "speaker": "Shopkeeper", "en": "Why are you shopping today?", "zh": "你今天为什么来购物？"}, {"s": "Sarah", "speaker": "Sarah", "en": "My mum worked last night. So I’m shopping today.", "zh": "我妈妈昨晚工作了。所以我今天来购物。"}, {"s": "Shopkeeper", "speaker": "Shopkeeper", "en": "Good girl! So what do you do on the weekend?", "zh": "好孩子！那你周末做什么？"}, {"s": "Sarah", "speaker": "Sarah", "en": "I often watch TV and play ping-pong with my father.", "zh": "我经常看电视，和爸爸打乒乓球。"}, {"s": "Shopkeeper", "speaker": "Shopkeeper", "en": "That sounds like a lot of fun.", "zh": "听起来很有趣。"},
