\nI make snowmen with friends,\nWear warm coats and gloves.\nThen spring comes again.", "zh": "春天是绿色的。\n它充满生机。\n我常去散步，\n还放风筝。\n夏天是蓝色的。\n我玩游戏、唱歌，\n穿连衣裙和T恤。\n白天很长。\n秋天是橙色的。\n我喜欢落叶。\n我穿毛衣和衬衫，\n还吃月饼。\n冬天是白色的。\n我和朋友堆雪人，\n穿暖和的大衣和手套。\n然后春天又来了。", "topic": "四季的颜色、活动与穿着", "words": ["spring", "summer", "autumn", "winter", "fly a kite", "make snowmen", "falling leaves", "mooncakes", "coats", "gloves"], "comprehension": [{"q": "1. Summer is blue. (     )", "options": [], "answer": "F"}, {"q": "2. I play games and sing songs. (     )", "options": [], "answer": "F"}, {"q": "3. I like the falling leaves. (     )", "options": [], "answer": "F"}, {"q": "4. Spring comes after winter. (     )", "options": [], "answer": "F"}], "keypoints": ["一般现在时", "季节与颜色搭配", "like + 名词/动名词", "can + 动词原形"], "writing": "Which season do you like? Why?\nI like ___.\nI can ___.\n___ is it? Whose ___"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 6", "name": "Colourful seasons, colourful life!", "genre": "诗歌", "source": "Read and write", "text": "Spring is green.\nIt's full of life.\nI take many walks,\nAnd fly my kite.\nSummer is blue.\nI play games and sing songs,\nWear dresses and T-shirts.\nThe days are so long.\nAutumn is orange.\nI like the falling leaves.\nI wear sweaters and shirts,\nAnd enjoy mooncakes.\nWinter is white.\nI make snowmen with friends,\nWear warm coats and gloves.\nThen spring comes again.", "zh": "春天是绿色的。\n它充满生机。\n我常去散步，\n还放风筝。\n夏天是蓝色的。\n我玩游戏、唱歌，\n穿连衣裙和T恤。\n白天很长。\n秋天是橙色的。\n我喜欢落叶。\n我穿毛衣和衬衫，\n还吃月饼。\n冬天是白色的。\n我和朋友堆雪人，\n穿暖和的外套和手套。\n然后春天又来了。", "topic": "四季的颜色、活动与穿着", "words": ["spring", "summer", "autumn", "winter", "fly a kite", "make snowmen", "falling leaves", "mooncakes", "coats", "gloves"], "comprehension": [{"q": "1. Summer is blue. (     )", "options": [], "answer": "F"}, {"q": "2. I play games and sing songs. (     )", "options": [], "answer": "F"}, {"q": "3. I like the falling leaves. (     )", "options": [], "answer": "F"}, {"q": "4. Spring comes after winter. (     )", "options": [], "answer": "F"}], "keypoints": ["一般现在时", "季节与颜色搭配", "like + 名词/动名词", "whose 所有格"], "writing": "Which season do you like? Why?\nI like ___.\nI can ___.\n___ is it? Whose"}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 6", "name": "Reading time", "genre": "对话", "source": "Reading", "text": "Welcome! Merry Christmas!\nWhere is your coat?\nIt's very cold outside.\nI don't have a coat,\nbut I have a warm sweater.\nThank you!\nI put on my shorts and\nT-shirt and go to the beach.\nWhat do you usually\ndo on Christmas Day?\nYou can go to the beach\non Christmas Day?\nYes, but it's cool at night.\nI need to wear a sweater.\nBrrr! It's cold and snowy.\nYou need a warm hat.\nYes, I have one.\nThank you.\nOK. Let's go.\nOh look! It's a snowman.\nYes, it looks like you.\nHe looks cold.\nHe needs a warm hat.\nHa! Ha! Snowmen\nlove cold weather.", "zh": "欢迎！圣诞快乐！\n你的外套在哪里？\n外面很冷。\n我没有外套，\n但我有一件暖和的毛衣。\n谢谢！\n我穿上短裤和T恤去海滩。\n你通常在圣诞节做什么？\n你圣诞节可以去海滩？\n是的，但晚上有点凉。\n我需要穿一件毛衣。\n好冷啊！又冷又下雪。\n你需要一顶暖和的帽子。\n是的，我有。\n谢谢。\n好的，我们走吧。\n哦，看！是个雪人。\n是的，它看起来像你。\n它看起来很冷。\n它需要一顶暖和的帽子。\n哈哈！雪人\n喜欢寒冷的天气。", "topic": "圣诞节、天气与穿着", "words": ["Merry Christmas", "coat", "sweater", "shorts", "T-shirt", "beach", "snowy", "hat", "snowman", "cold weather"], "comprehension": [], "keypoints": ["一般现在时", "need to + 动词原形", "let's + 动词原形", "looks like"], "writing": ""}, {"grade": "四年级", "term": "上册", "book": "四年级上册", "unit": "Unit 6", "name": "Project: Make a travel card", "genre": "说明", "source": "Reading", "text": "I like spring. It's warm and windy.\nI can go to the park and fly kites.\nI can wear my pink sweater and ...\nWe can\ngo to Haikou\nin winter.\nI can eat\nseafood.\nI can\nswim in\nthe sea.\nYes, it's\nwarm there.", "zh": "我喜欢春天。它温暖又多风。\n我可以去公园放风筝。\n我可以穿我的粉色毛衣……\n我们冬天\n可以去海口。\n我可以吃\n海鲜。\n我可以\n在海里游泳。\n是的，那里很暖和。", "topic": "最喜欢的季节与旅行计划", "words": ["spring", "warm", "windy", "fly kites", "sweater", "Haikou", "seafood", "swim", "sea", "warm"], "comprehension": [], "keypoints": ["一般现在时", "can + 动词原形", "季节与天气形容词", "地点与活动搭配"], "writing": "Make a travel card. Then share it in class.\nI like ___.\nIt's ___.\nI can go to ___.\nI can wear ___.\nI can eat ___."}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 1", "name": "Helping hands in class", "genre": "短文", "source": "Read and write", "text": "Helping hands in class\nWe have some class rules. We put up our hands to speak. We turn off the lights after school. When we don't understand, we say, \"Excuse me?\"\nWe also have some jobs. Some of us make wall newspapers. Some of us keep our classroom clean and tidy. Some hand out the workbooks. We all help make our classroom great!", "zh": "课堂上的帮手\n我们有一些课堂规则。我们举手发言。放学后我们关灯。当我们不明白时，我们说：\"打扰一下？\"\n我们还有一些任务。我们中的一些人制作墙报。一些人保持教室干净整洁。一些人分发练习本。我们都帮助让我们的教室变得很棒！", "topic": "课堂规则与班级任务", "words": ["class rules", "put up one's hands", "turn off the lights", "Excuse me", "wall newspapers", "keep clean and tidy", "hand out", "workbooks", "make great", "after school"], "comprehension": [{"q": "Tick the class rules in the text.", "options": ["Turn off the lights after school.", "Put up your hand to speak.", "Keep the classroom clean.", "Say \"Excuse me?\"", "Close the windows.", "Don't eat in class."], "answer": "Turn off the lights after school. / Put up your hand to speak. / Keep the classroom clean. / Say \"Excuse me?\""}], "keypoints": ["一般现在时", "祈使句", "否定祈使句 Don't...", "some of us"], "writing": "Look and write.\nDon't be late.\nDon't eat in class.\nTurn off the lights after school.\nPut up your hand to speak."}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 1", "name": "Project: Make signs for class rules", "genre": "剧本", "source": "其他", "text": "Look at this sign.\nWhat rule is it?\nKeep the classroom clean.\nYes, you're right! Let's put it on the wall.\nOK.\nLet's put them on the classroom wall.\nStep 3\nStep 4\nMake some signs for your class rules.\nShare your signs in class.\nStep 1\nDon't              Please\nStep 2\nLet's make some signs.\nOK.", "zh": "看这个标志。\n这是什么规则？\n保持教室干净。\n是的，你说得对！我们把它贴在墙上吧。\n好的。\n我们把它们贴在教室的墙上吧。\n第三步\n第四步\n为你的课堂规则制作一些标志。\n在课堂上分享你的标志。\n第一步\n不要…… 请……\n第二步\n我们来制作一些标志吧。\n好的。", "topic": "制作课堂规则标志", "words": ["sign", "class rules", "keep the classroom clean", "put on the wall", "make signs", "share in class", "Don't", "Please", "Let's", "on the wall"], "comprehension": [], "keypoints": ["祈使句", "Let's...", "否定祈使句 Don't...", "一般现在时"], "writing": "Make some signs for your class rules.\nShare your signs in class."}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 2", "name": "Rules at home", "genre": "短文", "source": "Read and write", "text": "Rules at home.\nThey keep us safe.\nDon't run! Don't bounce the balls!\nListen to what Mum and Dad say.\nRules at home.\nThey make us happy.\nDon't make a mess! Think of others!\nUse nice words and speak kindly.", "zh": "家里的规矩。\n它们让我们安全。\n不要跑！不要弹球！\n听爸爸妈妈的话。\n家里的规矩。\n它们让我们快乐。\n不要弄得一团糟！为他人着想！\n用友善的话，温和地说话。", "topic": "家庭规矩", "words": ["rules", "safe", "bounce", "mess", "others", "kindly", "listen", "think of others"], "comprehension": [], "keypoints": ["祈使句", "否定祈使句", "一般现在时", "形容词作表语"], "writing": ""}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 3", "name": "Reading time", "genre": "故事", "source": "其他", "text": "Sam, time for bed.\nHurry up, Sam!\nYour music class will begin soon.\nCan I go to bed late tonight? It's Friday.\nOK, but not too late.\nIt's 10 o'clock now. Go to bed, Sam!\nOK, Mum.\nOK, Mum.\n4 Oh no! I'm in the wrong class!\nThis is Sarah's class code.\nSarah, what time is it?\nWhat's that noise?\nIt's my watch alarm.\nIt's 8:20. Time for my music class.\nMum, it's 1 o'clock now.\nThe film is at 2 o'clock.\nWe should go soon.\nI see. What time is it now?\nWow! You plan things well now.\nIt's 9 o'clock.\nOh, it's time to go to bed.", "zh": "萨姆，该睡觉了。\n快点，萨姆！\n你的音乐课马上就要开始了。\n今晚我能晚点睡吗？今天是星期五。\n可以，但不要太晚。\n现在十点了。去睡觉吧，萨姆！\n好的，妈妈。\n好的，妈妈。\n4 哦，不！我上错课了！\n这是莎拉的课程代码。\n莎拉，现在几点了？\n那是什么声音？\n是我的手表闹钟。\n现在8点20分。该上我的音乐课了。\n妈妈，现在1点了。\n电影2点开始。\n我们应该快点走了。\n我明白了。现在几点了？\n哇！你现在计划事情很周全了。\n现在9点了。\n哦，该睡觉了。", "topic": "时间管理与作息", "words": ["time for", "go to bed", "music class", "begin", "alarm", "plan", "schedule", "class code", "watch", "Friday"], "comprehension": [], "keypoints": ["It's time for...", "It's time to...", "一般现在时", "时间表达"], "writing": ""}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 3", "name": "Read and write", "genre": "说明", "source": "Read and write", "text": "Make your weekend schedule.\nStep 1\nChoose a way to keep to your schedule.\nStep 2\nThis is my weekend schedule. I ...\nAt 3:50, it's time to do sports.\nMy friend often calls me at ...\nTime\n7:40 a.m.\na.m.\n3:50 p.m.\np.m.\nActivity\nget up\ndo sports\nWhat time is it?\nOh, it's time to do sports.", "zh": "制作你的周末作息表。\n第一步\n选择一种坚持作息表的方法。\n第二步\n这是我的周末作息表。我……\n在3点50分，该做运动了。\n我的朋友经常在……给我打电话。\n时间\n上午7:40\n上午\n下午3:50\n下午\n活动\n起床\n做运动\n现在几点了？\n哦，该做运动了。", "topic": "制作周末作息表", "words": ["schedule", "weekend", "keep to", "activity", "get up", "do sports", "call", "time", "often", "step"], "comprehension": [], "keypoints": ["It's time to...", "一般现在时", "时间表达", "祈使句"], "writing": "Make your weekend schedule."}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 3", "name": "Project: Make a weekend schedule", "genre": "说明", "source": "Read and write", "text": "Project: Make a weekend schedule\n• get up\n• go to bed\n• have breakfast\n• play football\n• play maths games\n• read English storybooks\nHow can we keep to our schedule?\nAsk friends to help.\nOften check the schedule.", "zh": "项目：制作周末作息表\n• 起床\n• 睡觉\n• 吃早餐\n• 踢足球\n• 玩数学游戏\n• 读英语故事书\n我们怎样才能坚持作息表？\n请朋友帮忙。\n经常检查作息表。", "topic": "周末作息表项目", "words": ["schedule", "weekend", "get up", "go to bed", "have breakfast", "play football", "play maths games", "read English storybooks", "keep to", "check"], "comprehension": [], "keypoints": ["祈使句", "动词短语", "一般现在时", "时间表达"], "writing": "Make your weekend schedule."}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 3", "name": "Reading time", "genre": "故事", "source": "其他", "text": "Sam, time for bed.\nHurry up, Sam!\nYour music class will begin soon.\nCan I go to bed late tonight? It's Friday.\nOK, but not too late.\nIt's 10 o'clock now. Go to bed, Sam!\nOK, Mum.\nOK, Mum.\n4 Oh no! I'm in the wrong class!\nThis is Sarah's class code.\nSarah, what time is it?\nWhat's that noise?\nIt's my watch alarm.\nIt's 8:20. Time for my music class.\nMum, it's 1 o'clock now.\nThe film is at 2 o'clock.\nWe should go soon.\nI see. What time is it now?\nWow! You plan things well now.\nIt's 9 o'clock.\nOh, it's time to go to bed.", "zh": "萨姆，该睡觉了。\n快点，萨姆！\n你的音乐课马上就要开始了。\n今晚我能晚点睡吗？今天是星期五。\n可以，但不要太晚。\n现在十点了。去睡觉吧，萨姆！\n好的，妈妈。\n好的，妈妈。\n4 哦，不！我上错课了！\n这是莎拉的课程代码。\n莎拉，现在几点了？\n那是什么声音？\n是我的手表闹钟。\n现在8点20分。该上我的音乐课了。\n妈妈，现在1点了。\n电影2点开始。\n我们应该快点走了。\n我明白了。现在几点了？\n哇！你现在计划事情很周全了。\n现在9点了。\n哦，该睡觉了。", "topic": "时间管理与作息", "words": ["time for", "go to bed", "music class", "begin", "alarm", "plan", "schedule", "class code", "watch", "Friday"], "comprehension": [], "keypoints": ["It's time for...", "It's time to...", "一般现在时", "时间表达"], "writing": ""}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 4", "name": "A girl buys a pretty skirt", "genre": "故事", "source": "其他", "text": "A girl buys a pretty skirt.\nShe sees a bird—it's hurt.\nFirst she thinks, then helps the bird.\nNow the girl needs a new skirt!", "zh": "一个女孩买了一条漂亮的裙子。她看到一只鸟——它受伤了。她先思考，然后帮助了这只鸟。现在这个女孩需要一条新裙子了！", "topic": "", "words": ["skirt", "bird", "hurt", "girl", "shirt", "nurse", "fur", "turn"], "comprehension": [{"q": "The ___ is dirty.", "options": [], "answer": ""}, {"q": "The ___ gets a new skirt.", "options": [], "answer": ""}], "keypoints": ["ir/ur 拼读", "一般现在时", "第三人称单数", "动词过去式"], "writing": ""}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 4", "name": "Dear Mike", "genre": "书信", "source": "Read and write", "text": "Dear Mike,\nHere's your shopping list.\nDon't buy socks! You have a lot of socks!\nMum\nSunglasses\nBuy a nice and cheap pair.\nShorts\nBuy two pairs. Try them on first.\nA hat\nFind your size. You can choose any colour.", "zh": "亲爱的迈克，这是你的购物清单。别买袜子！你有很多袜子了！妈妈。太阳镜：买一副漂亮又便宜的。短裤：买两条，先试穿。一顶帽子：找到你的尺码，你可以选任何颜色。", "topic": "", "words": ["shopping list", "socks", "sunglasses", "shorts", "hat", "cheap", "size", "colour"], "comprehension": [{"q": "Think of one thing you have and write about it.\nThe shorts are ten yuan.", "options": [], "answer": ""}], "keypoints": ["祈使句", "购物清单", "价格表达", "名词复数"], "writing": "Think of one thing you have and write about it."}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 4", "name": "Dad, I love the red bike", "genre": "故事", "source": "其他", "text": "Dad, I love the red bike.\nCan I save up my money and buy it?\nYes. That's a great idea, Ben.\nMum, Dad! I can buy the red bike soon.\nOh no! The red bike is not here.\nI'm sorry.\nTwo months later\nWow! It's the red bike!\nYou work hard and often help Mum and me. This is our special gift for you.\nThank you so much, Dad!\nI will, Dad. Thanks.\nI still have all this money.\nPlease take it!\nNo. It's your money. Save it for a rainy day.", "zh": "爸爸，我喜欢这辆红色的自行车。我可以攒钱买它吗？是的，这是个好主意，本。妈妈，爸爸！我很快就能买这辆红色的自行车了。哦不！红色的自行车不在这儿了。对不起。两个月后。哇！是这辆红色的自行车！你努力工作，经常帮助妈妈和我。这是我们的特别礼物送给你。非常感谢你，爸爸！我会的，爸爸。谢谢。我还有这些钱。请收下吧！不。这是你的钱。留着以备不时之需。", "topic": "", "words": ["bike", "save up", "money", "work hard", "help", "gift", "rainy day"], "comprehension": [], "keypoints": ["一般将来时", "情态动词 can", "祈使句", "一般现在时"], "writing": ""}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 6", "name": "Reading time", "genre": "说明", "source": "Reading", "text": "There are many farms around us. Let's look at some of them. They can show us new ways to grow food.\nLook! On this farm there is a robot farmer. It is planting potatoes.\nThose robots are picking tomatoes very quickly.\nThis robot does the work of bees. It helps plants grow fruit.\nThis farm is very big and high. It grows many vegetables without soil.\nWe have many farms, but there are so many people in the world. Don't waste your food. Help save food for others.\nI can do a lot of work on the farm!", "zh": "我们周围有很多农场。让我们看看其中一些。它们能向我们展示种植食物的新方式。\n看！在这个农场里有一个机器人农民。它正在种土豆。\n那些机器人正在非常快地摘西红柿。\n这个机器人做着蜜蜂的工作。它帮助植物结果实。\n这个农场非常大而且很高。它不用土壤就能种很多蔬菜。\n我们有很多农场，但世界上有如此多的人。不要浪费你的食物。帮助为别人节约食物。\n我能在农场做很多工作！", "topic": "现代农场与节约粮食", "words": ["farm", "robot", "plant", "pick", "grow", "vegetables", "soil", "waste", "save", "food"], "comprehension": [], "keypoints": ["现在进行时", "there be 句型", "祈使句", "动名词作宾语"], "writing": ""}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit": "Unit 6", "name": "Read and write", "genre": "短文", "source": "Read and write", "text": "Where do you get your tomatoes?\nIn a supermarket? At a farm? Chen Jie grows them by herself. She has a small \"garden\" at home. Spring is a good time to plant tomatoes.\nChen Jie waters the tomato plants every week. In summer, Chen Jie picks the tomatoes. She makes a salad and eats it with her family. It's so delicious!", "zh": "你的西红柿是从哪里来的？\n在超市？在农场？陈洁自己种它们。她家里有一个小“花园”。春天是种西红柿的好时候。\n陈洁每周给西红柿植株浇水。夏天，陈洁摘西红柿。她做一份沙拉，和家人一起吃。真好吃！", "topic": "在家种西红柿", "words": ["tomatoes", "garden", "plant", "water", "pick", "salad", "delicious", "by herself", "every week", "summer"], "comprehension": [{"q": "Find these actions in the text and underline them.", "options": [], "answer": ""}], "keypoints": ["一般现在时第三人称单数", "频率副词 every week", "介词短语 in summer", "by oneself"], "writing": "Let's set the table."}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Revision", "name": "New Year's party", "genre": "对话", "source": "Read and write", "text": "Miss White:  Children, New Year's Day\nis coming. Let's have a\nclass party. What can\nyou do for the party?\nZhang Peng:  I can draw pictures.\nBinbin:  I can choose the music\nfor the party.\nAmy:  Let's play the piano\ntogether, John.\nJohn:  Great idea!\nMiss White:  Wonderful!\nChen Jie:  Oliver and I are in the\nCooking Club. We can\nmake some food for the\nparty.\nMike:  Sarah, Liu Jia and I are\nin the Drama Club. We\ncan put on a play.\nBinbin:  I want to tell a story.\nMiss White:  It's time for English class.\nLet's talk about it later.", "zh": "怀特老师：孩子们，元旦快到了。我们办一个班级派对吧。你们能为派对做些什么？\n张鹏：我会画画。\n彬彬：我可以为派对挑选音乐。\n艾米：约翰，我们一起弹钢琴吧。\n约翰：好主意！\n怀特老师：太棒了！\n陈洁：奥利弗和我在烹饪俱乐部。我们可以为派对做一些食物。\n迈克：莎拉、刘佳和我在戏剧俱乐部。我们可以演一出戏。\n彬彬：我想讲一个故事。\n怀特老师：该上英语课了。我们以后再谈。", "topic": "班级新年派对准备", "words": ["New Year's Day", "class party", "draw pictures", "choose the music", "play the piano", "Cooking Club", "make some food", "Drama Club", "put on a play", "tell a story"], "comprehension": [{"q": "Who goes to the Music Club", "options": [], "answer": ""}, {"q": "has piano lessons", "options": [], "answer": ""}, {"q": "goes to the Robot Club", "options": [], "answer": ""}, {"q": "Tuesdays and Thursdays", "options": [], "answer": ""}, {"q": "Day(s) for shopping:", "options": [], "answer": ""}, {"q": "Day(s) for piano practice:", "options": [], "answer": ""}, {"q": "What do they agree?", "options": [], "answer": ""}, {"q": "When does Chen Jie go to the Music Club?", "options": [], "answer": "She goes to the Music Club on ..."}], "keypoints": ["can 表能力", "Let's 提建议", "一般现在时", "be in the ... Club"], "writing": "Read aloud and act it out."}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Revision", "name": "Miss White's note", "genre": "书信", "source": "Read and write", "text": "Dear students,\nOur New Year's party is next Monday. I can see you are all\nvery excited. I am too. I have some tips for you:\n1. Plan your time well.\nYou need to prepare for the party. There will also be tests\non Wednesday and Friday. You are very hard-working, but don't\nforget to rest.\n2. Stay healthy.\nIt is flu season. You should get enough sleep. You should also\neat healthy food and drink enough water.\n3. Don't be afraid to ask for help.\nIf you have any problems, don't worry. Everyone has problems.\nYou can always talk to your parents, and you can ask me for help\ntoo.\nYours,\nMiss White", "zh": "亲爱的同学们：\n我们的新年派对在下周一。我能看出你们都很兴奋。我也是。我给你们一些建议：\n1. 合理安排时间。\n你需要为派对做准备。周三和周五还有考试。你们很努力，但别忘了休息。\n2. 保持健康。\n现在是流感季节。你应该睡足觉。你也应该吃健康的食物、喝足够的水。\n3. 不要害怕寻求帮助。\n如果你有任何问题，别担心。每个人都有问题。你总是可以和父母谈谈，也可以向我求助。\n你的，\n怀特老师", "topic": "新年派对前的建议", "words": ["New Year's party", "next Monday", "excited", "tips", "Plan your time well", "prepare for", "hard-working", "Stay healthy", "flu season", "ask for help"], "comprehension": [{"q": "Amy likes to eat a lot of cake and ice cream.", "options": [], "answer": ""}, {"q": "Binbin is afraid people will not like his story.", "options": [], "answer": ""}, {"q": "Mike and Sarah have different ideas about their play.", "options": [], "answer": ""}], "keypoints": ["should 表建议", "there will be 一般将来时", "祈使句", "书信格式"], "writing": "Dear\n,\nI can see you\n. Here are my tips:\n1.\n2.\n3.\nTake care,\nRead and write.\nChoose a problem and write a note."}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Revision", "name": "Bingo", "genre": "其他", "source": "Read and write", "text": "Date: 1 January\nTime: 2:00 p.m.\nPlace:\nActivities\nFood and drink\nFour in a row?\nSay \"Bingo!\"\n1.\n2.\n3.\nRead and group the words.\nChoose 16 words from above and write them in the boxes below.\nWrite a different word in each box.\nListen and cross out the words you hear.\nautumn  beef  book  coat  day  draw  goat  know  lie\nnight\nplay  rain\nright  see\nslow\ntalk\ntea\ntoo\nplay the piano,\nPlay Bingo.\nMake a poster.", "zh": "日期：1月1日\n时间：下午2点\n地点：\n活动\n食物和饮料\n连成一行？\n喊“宾果！”\n1.\n2.\n3.\n读一读并给单词分类。\n从上面选16个单词，写在下面的方框里。\n每个方框写一个不同的单词。\n听一听，划掉你听到的单词。\n秋天 牛肉 书 外套 白天 画 山羊 知道 躺\n夜晚\n玩 雨\n右边 看见\n慢\n谈话\n茶\n也\n弹钢琴，\n玩宾果游戏。\n做一张海报。", "topic": "宾果游戏与单词分类", "words": ["autumn", "beef", "book", "coat", "day", "draw", "goat", "know", "lie", "night"], "comprehension": [], "keypoints": ["元音字母组合发音", "单词分类", "祈使句", "日期与时间表达"], "writing": "Make a poster."}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Revision", "name": "Students in the Drama Club", "genre": "剧本", "source": "Short plays", "text": "Students in the Drama Club are practising.\n■ What do you see in the pictures?\n■ What bad weather can you name?\n■ What should people do in bad weather?\nScene 1: Plants are wonderful!\nScene 2: Nature is beautiful!\nScene 3: Nature is powerful!", "zh": "戏剧俱乐部的学生们正在排练。\n■ 你在图片里看到了什么？\n■ 你能说出哪些恶劣天气？\n■ 在恶劣天气里人们应该做什么？\n第一幕：植物真奇妙！\n第二幕：大自然真美丽！\n第三幕：大自然真强大！", "topic": "戏剧俱乐部排练", "words": ["Drama Club", "practising", "bad weather", "Plants are wonderful", "Nature is beautiful", "Nature is powerful"], "comprehension": [{"q": "What do you see in the pictures?", "options": [], "answer": ""}, {"q": "What bad weather can you name?", "options": [], "answer": ""}, {"q": "What should people do in bad weather?", "options": [], "answer": ""}], "keypoints": ["现在进行时", "should 表建议", "感叹句", "剧本场景"], "writing": ""}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Revision", "name": "Binbin's story", "genre": "故事", "source": "Short plays", "text": "What would\nyou like to eat?\nMy seeds can fly.\nI have a long,\nstraight stem.\nBill is a good boy,\nbut he ...…\nOliver and Chen Jie are doing\na survey.\n■ What food are they talking\nabout?\nBinbin is practising his story.\n■ What is Bill like?\n■ How do Bill and his pets feel in each\npicture?\nDoes every plant\nhave leaves?\nLook, think and talk.", "zh": "你想吃什么？\n我的种子会飞。\n我有一根长长的、直直的茎。\n比尔是个好孩子，\n但是他……\n奥利弗和陈洁正在做调查。\n■ 他们在谈论什么食物？\n彬彬正在练习他的故事。\n■ 比尔是什么样的人？\n■ 在每张图片里，比尔和他的宠物感觉如何？\n每种植物都有叶子吗？\n看一看，想一想，说一说。", "topic": "彬彬的故事与植物调查", "words": ["seeds", "fly", "stem", "a good boy", "doing a survey", "practising", "What is Bill like", "feel", "every plant", "have leaves"], "comprehension": [{"q": "What food are they talking about?", "options": [], "answer": ""}, {"q": "What is Bill like?", "options": [], "answer": ""}, {"q": "How do Bill and his pets feel in each picture?", "options": [], "answer": ""}, {"q": "Does every plant have leaves?", "options": [], "answer": ""}], "keypoints": ["would like to", "现在进行时", "一般现在时疑问句", "形容词描述"], "writing": "Look, think and talk."}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Revision", "name": "Bill's story", "genre": "故事", "source": "Short plays", "text": "Bill is a good boy,\nbut he ...…", "zh": "比尔是个好孩子，\n但是他……", "topic": "比尔的故事", "words": ["a good boy", "but"], "comprehension": [], "keypoints": ["but 表转折", "一般现在时", "形容词描述"], "writing": ""}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 1", "name": "The Magic Teacher", "genre": "说明", "source": "Read and write", "text": "Everyone can draw pictures. But can you make your pictures come to life? Mr Zhang will draw a lovely rabbit, and it will come to life in front of your eyes!\nJumping rope is easy and fun. Meet the jumping stars: John and Amy. They are wonderful jumpers!\nBinbin loves music. He can play the piano and the pipa! Come and listen!\nRobin is a clever robot. He is good at playing Chinese chess. Can you play Chinese chess? Come and play with him!", "zh": "每个人都会画画。但是你能让你的画活过来吗？张老师会画一只可爱的兔子，它会在你眼前活过来！\n跳绳既简单又有趣。认识一下跳绳明星：约翰和艾米。他们是出色的跳绳者！\n彬彬热爱音乐。他会弹钢琴和琵琶！来听一听吧！\n罗宾是一个聪明的机器人。他擅长下中国象棋。你会下中国象棋吗？来和他一起下吧！", "topic": "才艺表演者介绍", "words": ["come to life", "wonderful", "love", "play the piano", "play the pipa", "clever", "be good at", "play Chinese chess", "jump rope", "draw"], "comprehension": [{"q": "Read and complete the mind map. Then introduce the performers.", "options": [], "answer": ""}, {"q": "Add a performer to the talent show and write about him/her.", "options": [], "answer": ""}], "keypoints": ["一般现在时", "can/can't 表能力", "be good at doing", "现在进行时/将来含义的 will"], "writing": "Add a performer to the talent show and write about him/her."}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 1", "name": "Reading time", "genre": "对话", "source": "Reading", "text": "We have a new student in our class today. Her name's Grace.\nGrace is so lovely and friendly.\nIs she strong? Can she play football?\nYes. I like her.\nI don't know.\nBut she can't play football with us. What a pity!\nClass, this is Grace.\nHi, everyone. Nice to meet you all!\nGreat! We need a poster for the match.\nCan you draw, Grace?\nYes, I can draw really well.\nYes. The poster is great!\nThank you for your help, Grace.\nYou're welcome.\nHey, everyone! Our football match is next week.\nWhat a goal!\nWe won! Hooray!\nHooray!", "zh": "今天我们班来了一位新同学。她叫格蕾丝。\n格蕾丝非常可爱又友好。\n她强壮吗？她会踢足球吗？\n是的。我喜欢她。\n我不知道。\n但她不能和我们一起踢足球。真遗憾！\n同学们，这是格蕾丝。\n大家好。很高兴见到你们！\n太好了！我们需要为比赛做一张海报。\n格蕾丝，你会画画吗？\n是的，我画得非常好。\n是的。这张海报很棒！\n谢谢你的帮助，格蕾丝。\n不客气。\n嘿，大家！我们的足球赛下周举行。\n好球！\n我们赢了！万岁！\n万岁！", "topic": "新同学与足球比赛", "words": ["new student", "lovely", "friendly", "strong", "play football", "What a pity", "poster", "draw", "really well", "Hooray"], "comprehension": [], "keypoints": ["一般现在时", "can/can't 表能力", "感叹句 What a pity! / What a goal!", "be good at / really well 程度副词"], "writing": ""}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 2", "name": "Jim's email and Mike's reply", "genre": "邮件", "source": "Read and write", "text": "Dear Mike,\nI am happy at school. I have many friends. I play with them in the playground, and we share ideas in class. We laugh and study together all day. I enjoy school.\nBut my family just moved to a new home. I have no friends there. I feel sad. I don't want to tell my parents. I don't want them to feel bad.\nWhat can I do? Can you help me?\nYours,\nJim\nDear Jim,\nDon't feel sad. You can . You can also . It is OK to feel bad sometimes. It is always good to share your feelings.\nYours,\nMike", "zh": "亲爱的迈克：\n我在学校很开心。我有很多朋友。我和他们在操场上玩，我们在课堂上分享想法。我们整天一起笑、一起学习。我喜欢学校。\n但是我的家人刚搬到一个新家。我在那里没有朋友。我感到难过。我不想告诉我的父母。我不想让他们感到难过。\n我该怎么办？你能帮我吗？\n你的，\n吉姆\n亲爱的吉姆：\n别难过。你可以……你也可以……有时候感到难过也没关系。分享你的感受总是好的。\n你的，\n迈克", "topic": "感受与求助", "words": ["happy", "sad", "share ideas", "feel bad", "enjoy", "playground", "friends", "feelings", "help", "share your feelings"], "comprehension": [{"q": "Read and fill in the table. Place: At school / At home; Jim is happy. Feeling; Reason", "options": [], "answer": ""}, {"q": "What can Jim do? Read and complete Mike's reply.", "options": [], "answer": ""}], "keypoints": ["一般现在时", "情态动词 can", "表达感受的形容词", "提建议句型 You can..."], "writing": "What can Jim do? Read and complete Mike's reply."}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 2", "name": "Benjy and the snow", "genre": "故事", "source": "其他", "text": "Me too. Let's go out and play.\nIt's snowing. I'm so excited!\nBenjy looks worried.\nThis is his first snow!\nCome on, Benjy! Don't be afraid. It's important to try new things!\nBenjy doesn't look happy.\nHe's cold.\nHe needs to exercise.\nLet's play with him.\nGood idea!\nHe's happy now. I think he likes the snow.\nYes, he's not afraid now.\nBenjy, come inside.\nDon't worry, Benjy. We can play in the snow again tomorrow!\nHe looks sad. He still wants to play outside.", "zh": "我也是。我们出去玩吧。\n下雪了。我太兴奋了！\n本吉看起来很担心。\n这是他第一次见到雪！\n加油，本吉！别害怕。尝试新事物很重要！\n本吉看起来不开心。\n他很冷。\n他需要运动。\n我们和他一起玩吧。\n好主意！\n他现在开心了。我觉得他喜欢雪。\n是的，他现在不害怕了。\n本吉，进来吧。\n别担心，本吉。我们明天还可以再在雪里玩！\n他看起来很伤心。他还是想出去玩。", "topic": "感受与鼓励", "words": ["excited", "worried", "afraid", "try new things", "exercise", "happy", "sad", "play in the snow", "Don't worry", "come inside"], "comprehension": [], "keypoints": ["一般现在时", "系动词 look + 形容词", "提建议句型 Let's...", "情态动词 can"], "writing": ""}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 3", "name": "Eric and Li Xia's letters to Miss White", "genre": "书信", "source": "Read and write", "text": "Dear Miss White,\nOn Monday, Tuesday and Friday evenings, I play football. I often watch TV on Wednesdays and Thursdays.\nOn Saturdays and Sundays, I play basketball and go running. I am so busy. I don't have much time to study.\nEric\n\nDear Miss White,\nI play ping-pong with Binbin on Mondays and Thursdays. On Tuesdays, I cook dinner because my mother works on Tuesday nights. On Wednesdays and Fridays, I usually read books. At the weekend, I often play with my friends in the park or visit my grandparents. I am busy, but I always do my homework on time!\nLi Xia", "zh": "亲爱的怀特老师：\n周一、周二和周五晚上，我踢足球。周三和周四我经常看电视。\n周六和周日，我打篮球和跑步。我太忙了，没有多少时间学习。\n埃里克\n\n亲爱的怀特老师：\n周一和周四我和彬彬打乒乓球。周二我做饭，因为我妈妈周二晚上上班。周三和周五，我通常看书。周末，我经常和朋友们在公园里玩或去看望我的祖父母。我很忙，但我总是按时完成作业！\n李晓", "topic": "课后活动与工作与娱乐的平衡", "words": ["play football", "watch TV", "play basketball", "go running", "play ping-pong", "cook dinner", "read books", "visit grandparents", "do homework", "on time"], "comprehension": [{"q": "Match Miss White's comments to the answers above.", "options": [], "answer": ""}], "keypoints": ["一般现在时", "频率副词 often/usually", "时间状语 on Mondays/At the weekend", "书信格式 Dear..."], "writing": "What do you do after school? Write your answer."}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 3", "name": "Ron's timetable", "genre": "说明", "source": "Read and write", "text": "1. is Ron's favourite day. He has , English, and PE.\n2. Ron usually visits his grandparents on .\n3. Ron does his homework on Sunday mornings. He and in the afternoon.\n4. Ron doesn't at the weekend.", "zh": "1. 是罗恩最喜欢的一天。他有……、英语和体育课。\n2. 罗恩通常在……去看望他的祖父母。\n3. 罗恩在周日早上做作业。下午他……和……。\n4. 罗恩周末不……。", "topic": "罗恩的日程安排", "words": ["favourite day", "visit grandparents", "do homework", "at the weekend", "have classes"], "comprehension": [{"q": "1. ___ is Ron's favourite day. He has ___, English, and PE.", "options": [], "answer": ""}, {"q": "2. Ron usually visits his grandparents on ___.", "options": [], "answer": ""}, {"q": "3. Ron does his homework on Sunday mornings. He ___ and ___ in the afternoon.", "options": [], "answer": ""}, {"q": "4. Ron doesn't ___ at the weekend.", "options": [], "answer": ""}], "keypoints": ["一般现在时", "频率副词 usually", "时间状语 on Sunday mornings/at the weekend", "否定句 doesn't"], "writing": "What do you do on different days? Talk and write."}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "name": "Oliver is at home now", "genre": "对话", "source": "Read and write", "text": "Oliver is at home now. Listen and tick.\n1. How is Oliver feeling now?\n2. What would Oliver like to drink?\nOliver:  Mum, I'm hungry.\nMum:  What would you like to eat?\nOliver:  I'd like beef and rice.\nMum:  No problem. Would you like some\nchicken soup too?\nOliver:  Yes, please.\nMum:  You should also have some salad.\nVegetables are good for you.\nOliver:  OK. Can I have some ice cream, please?\nMum:  Yes, but just a little.\nOliver:  OK. Thanks, Mum.", "zh": "奥利弗现在在家。听一听并打勾。\n1. 奥利弗现在感觉怎么样？\n2. 奥利弗想喝什么？\n奥利弗：妈妈，我饿了。\n妈妈：你想吃什么？\n奥利弗：我想要牛肉和米饭。\n妈妈：没问题。你还想喝些鸡汤吗？\n奥利弗：好的，谢谢。\n妈妈：你也应该吃点沙拉。蔬菜对你有好处。\n奥利弗：好的。我可以吃些冰淇淋吗？\n妈妈：可以，但只能吃一点。\n奥利弗：好的。谢谢妈妈。", "topic": "点餐与饮食建议", "words": ["hungry", "beef", "rice", "chicken soup", "salad", "vegetables", "ice cream", "would like", "can I have", "should"], "comprehension": [{"q": "How is Oliver feeling now?", "options": [], "answer": ""}, {"q": "What would Oliver like to drink?", "options": [], "answer": ""}], "keypoints": ["would like", "can I have some...", "should", "一般现在时"], "writing": ""}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "name": "Mrs Green and Binbin talk about coconuts", "genre": "对话", "source": "Read and write", "text": "Mrs Green:  What's your favourite fruit, Binbin?\nBinbin:  Coconuts are my favourite.\nMrs Green:  Why do you like coconuts?\nBinbin:  Because coconut water is nice.\nAnd it's healthy.\nMrs Green:  We can also cook delicious meals\nwith coconut.\nBinbin:  Yes! And some people make houses\nwith coconut tree leaves.\nMrs Green:  That's interesting. Where does your coconut come from?\nBinbin:  Hainan! There are many coconut trees there.", "zh": "格林夫人：彬彬，你最喜欢的水果是什么？\n彬彬：椰子是我最喜欢的。\n格林夫人：你为什么喜欢椰子？\n彬彬：因为椰子水很好喝。而且它很健康。\n格林夫人：我们还可以用椰子做美味的饭菜。\n彬彬：是的！而且有些人用椰子树叶盖房子。\n格林夫人：那很有趣。你的椰子来自哪里？\n彬彬：海南！那里有很多椰子树。", "topic": "水果与产地", "words": ["favourite", "coconut", "coconut water", "healthy", "delicious", "meals", "coconut tree leaves", "come from", "Hainan", "there are"], "comprehension": [{"q": "What are they talking about?", "options": ["A. Drinks.", "B. Food.", "C. People."], "answer": "B"}, {"q": "Which drink comes from Yunnan?", "options": ["A. Water.", "B. Tea.", "C. Apple juice."], "answer": "B"}], "keypoints": ["favourite", "come from", "there are", "一般现在时"], "writing": ""}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "name": "The history of tea", "genre": "短文", "source": "Reading", "text": "At first, people didn't drink tea. But they did eat tea leaves!\nThe history of tea\nLater, more people began to drink tea. There were many\ndifferent kinds of tea. People put tea leaves in hot water to\nmake a drink.\nTea was first popular in China. Then it travelled to Japan\nand other countries. In the 1700s, tea became popular in the UK.\nHow can I make a\ngood cup of tea?\nWater is very\nimportant.\nIn China, some people like to cook chicken and eggs with\ntea leaves. They make cakes and ice cream with tea too!\nNow, tea is popular all over the world. There is green tea,\nblack tea, flower tea …... There really is a tea for everyone!\nWhat would you\nlike to eat?\nWhere does your\ntea come from, Zip?\nMost of my tea\ncomes from China！", "zh": "起初，人们不喝茶。但他们确实吃茶叶！\n茶的历史\n后来，越来越多的人开始喝茶。有许多不同种类的茶。人们把茶叶放进热水里做成饮料。\n茶最早在中国流行。然后它传到日本和其他国家。在18世纪，茶在英国变得流行。\n我怎样才能泡一杯好茶？\n水非常重要。\n在中国，有些人喜欢用茶叶煮鸡肉和鸡蛋。他们还用茶做蛋糕和冰淇淋！\n现在，茶在全世界都很流行。有绿茶、红茶、花茶……真的有一种茶适合每个人！\n你想吃什么？\n你的茶来自哪里，Zip？\n我的大部分茶来自中国！", "topic": "茶的历史与种类", "words": ["tea", "tea leaves", "kinds", "hot water", "popular", "travelled", "green tea", "black tea", "flower tea", "come from"], "comprehension": [], "keypoints": ["一般过去时", "there is/are", "come from", "被动语态"], "writing": ""}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "name": "The lotus plant", "genre": "说明", "source": "Read and write", "text": "Lotus flowers are very\nbeautiful. They have many\ncolours. Lotus plants grow\nin lakes around the world. It\nis also a great plant to eat.\n•\nLotus seeds are small\nand round. We can cook\nand eat them in different\nways.\n•\nWe eat lotus roots. The\nbig brown and yellow\nroots are delicious.\nThere are many ways\nto cook them.\n•\nLotus leaves are big,\nround and green. We can\neat the young leaves.\nWe can also cook rice in\nthe leaves.\n•\nThe lotus plant\nThe part of the plant\nWhat it looks like\nHow people use it\nThe lotus plant\nRead and answer.\nRead and say.\nRead and fill in the table.", "zh": "莲花非常美丽。它们有许多颜色。莲植物生长在世界各地的湖泊中。它也是一种很棒的食用植物。\n•\n莲子小而圆。我们可以用不同的方式烹饪和食用它们。\n•\n我们吃莲藕。那些又大又棕黄的根很美味。有很多烹饪它们的方法。\n•\n莲叶又大又圆又绿。我们可以吃嫩叶。我们还可以用叶子煮饭。\n•\n莲植物\n植物的部分\n它看起来怎么样\n人们如何使用它\n莲植物\n阅读并回答。\n阅读并说。\n阅读并填表。", "topic": "莲植物的各部分与用途", "words": ["lotus", "lotus flowers", "lotus seeds", "lotus roots", "lotus leaves", "grow", "cook", "delicious", "young leaves", "around the world"], "comprehension": [{"q": "Where does the lotus plant often grow?", "options": [], "answer": ""}, {"q": "What parts of the lotus plant can we eat?", "options": [], "answer": ""}, {"q": "What can people do with lotus leaves?", "options": [], "answer": ""}], "keypoints": ["一般现在时", "there are", "can", "被动语态"], "writing": "Choose a plant you want to talk about."}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "name": "See how a carrot grows", "genre": "说明", "source": "Read and write", "text": "First, we plant the\nin spring or autumn.\nThen a\nwill grow from the seed.\nNext, the\nwill grow big and strong.\nWe eat this part of a carrot.\nFinally, we will pull up the carrot by the\nand\n.\nSee how a carrot grows. Complete the sentences\nand talk.\nPrepare for a presentation.", "zh": "首先，我们在春天或秋天种下____。\n然后，____会从种子中长出。\n接着，____会长得又大又壮。\n我们吃胡萝卜的这个部分。\n最后，我们会通过____和____把胡萝卜拔出来。\n看看胡萝卜是如何生长的。完成句子并谈论。\n准备一个展示。", "topic": "胡萝卜的生长过程", "words": ["plant", "seed", "spring", "autumn", "grow", "big and strong", "pull up", "carrot", "stem", "leaves"], "comprehension": [], "keypoints": ["一般现在时", "一般将来时", "顺序词 first/then/next/finally", "被动语态"], "writing": "Choose a plant you want to talk about."}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 5", "name": "What to eat / What to drink", "genre": "图表说明", "source": "Read and write", "text": "What to eat\nWhat to drink\nName\nrice,\n, carrots\nBinbin\ntea\nChen Jie\n, a vegetable salad\nMike\nChoose a plant you want to talk about.", "zh": "吃什么\n喝什么\n姓名\n米饭、____、胡萝卜\n彬彬\n茶\n陈杰\n____、一份蔬菜沙拉\n迈克\n选择一个你想谈论的植物。", "topic": "饮食记录表", "words": ["rice", "carrots", "tea", "vegetable salad", "name", "eat", "drink", "choose", "plant", "talk about"], "comprehension": [], "keypoints": ["名词复数", "一般现在时", "there be", "被动语态"], "writing": "Choose a plant you want to talk about."}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 6", "name": "Welcome to River Nature Park", "genre": "说明", "source": "Read and write", "text": "Welcome to River Nature Park\nThere are many rivers and big trees here.\nThere are a lot of fish in the rivers. You can go boating on the river with your friends.\nThere is heavy rain in summer. Sometimes there are floods too. Check the weather report before you go.", "zh": "欢迎来到河流自然公园。这里有许多河流和大树。河里有很多鱼。你可以和朋友们一起在河里划船。夏天有暴雨，有时还会有洪水。出发前请查看天气预报。", "topic": "", "words": ["river", "tree", "fish", "go boating", "heavy rain", "flood", "weather report", "check"], "comprehension": [{"q": "There are many rivers and big trees here.", "options": [], "answer": ""}, {"q": "There are a lot of fish in the rivers. You can go boating on the river with your friends.", "options": [], "answer": ""}, {"q": "There is heavy rain in summer. Sometimes there are floods too. Check the weather report before you go.", "options": [], "answer": ""}], "keypoints": ["there be 句型", "一般现在时", "情态动词 can", "祈使句"], "writing": "Read and introduce these nature parks to your class."}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 6", "name": "Welcome to Mountain Nature Park", "genre": "说明", "source": "Read and write", "text": "Welcome to Mountain Nature Park\nThere are many mountains, and there is a big forest. It is a great place to hike or walk your dog.\nThere is often heavy fog on spring mornings. Don't go into the forest then. In autumn, it is often windy. Be careful of fires.", "zh": "欢迎来到山地自然公园。这里有许多山，还有一片大森林。这是一个徒步或遛狗的好地方。春天早晨经常有大雾。那时不要进入森林。秋天经常刮风。小心火灾。", "topic": "", "words": ["mountain", "forest", "hike", "walk your dog", "heavy fog", "windy", "be careful of", "fire"], "comprehension": [{"q": "There are many mountains, and there is a big forest. It is a great place to hike or walk your dog.", "options": [], "answer": ""}, {"q": "There is often heavy fog on spring mornings. Don't go into the forest then. In autumn, it is often windy. Be careful of fires.", "options": [], "answer": ""}], "keypoints": ["there be 句型", "一般现在时", "祈使句", "季节与天气词汇"], "writing": "Read and introduce these nature parks to your class."}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit": "Unit 6", "name": "Welcome to Waterfall Nature Park", "genre": "说明", "source": "Read and write", "text": "Welcome to Waterfall Nature Park\nThere is a big waterfall here. You can take pictures of your family near the waterfall.\nIt is very cold in winter. Sometimes there is heavy snow. Check the weather report before you go.", "zh": "欢迎来到瀑布自然公园。这里有一个大瀑布。你可以在瀑布附近给家人拍照。冬天非常冷。有时会有大雪。出发前请查看天气预报。", "topic": "", "words": ["waterfall", "take pictures", "family", "cold", "heavy snow", "weather report", "check"], "comprehension": [{"q": "There is a big waterfall here. You can take pictures of your family near the waterfall.", "options": [], "answer": ""}, {"q": "It is very cold in winter. Sometimes there is heavy snow. Check the weather report before you go.", "options": [], "answer": ""}], "keypoints": ["there be 句型", "一般现在时", "情态动词 can", "祈使句"], "writing": "Read and introduce these nature parks to your class."}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 1", "name": "Robinson's letter", "genre": "书信", "source": "Read and write", "text": "My name is Robinson. I live on an island. I always get up early every day. I wash my face, and then I eat breakfast. Sometimes I clean my cave, too.\nI often go swimming in the water. In the afternoon, I play sports with my friend. His name is Friday.\nFriday is good at sports. He often wins.", "zh": "我叫鲁滨逊。我住在一个岛上。我每天总是很早起床。我洗脸，然后吃早餐。有时我也打扫我的山洞。\n我经常在水里游泳。下午，我和我的朋友一起做运动。他的名字叫星期五。\n星期五擅长运动。他经常赢。", "topic": "介绍自己的日常活动", "words": ["live", "island", "get up", "wash my face", "eat breakfast", "clean", "cave", "go swimming", "play sports", "good at"], "comprehension": [{"q": "Robinson and Friday always get up late in the morning.", "options": [], "answer": ""}, {"q": "Robinson only cleans his cave on Fridays.", "options": [], "answer": ""}, {"q": "Robinson and Friday play sports together in the afternoon.", "options": [], "answer": ""}], "keypoints": ["一般现在时", "频率副词 always/often/sometimes", "时间状语 in the afternoon", "介词短语 with my friend"], "writing": "Write a letter to Robinson. Tell him what you often do every day."}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 2", "name": "The Four Seasons", "genre": "诗歌", "source": "Let's read", "text": "Spring is green with flowers and songs.\nSummer is hot and the days are long.\nAutumn is golden and farmers are busy.\nWinter is white and the year is gone.", "zh": "春天是绿色的，有花和歌声。\n夏天很热，白天很长。\n秋天是金色的，农民们很忙。\n冬天是白色的，一年过去了。", "topic": "四季", "words": ["spring", "summer", "autumn", "winter", "green", "hot", "golden", "white", "flowers", "farmers"], "comprehension": [{"q": "The last \"fall\" means ______.", "options": ["A. autumn", "B. pretty", "C. cute", "D. cool"], "answer": "A"}, {"q": "Which season does Robin like?", "options": ["A. Spring.", "B. Autumn.", "C. Summer.", "D. All the four seasons."], "answer": "D"}], "keypoints": ["一般现在时", "季节名词", "形容词描述天气", "because 引导原因"], "writing": "I like _______ best because __________________________."}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 2", "name": "Robin's favourite seasons", "genre": "故事", "source": "Let's read", "text": "Look at the green trees and pink flowers.\nThe weather is hot, hot, hot!\nWhat lovely colours! The leaves fall and fall and fall. I love fall!\nThere is lots of snow. It is white everywhere.\nI like spring because there are beautiful flowers everywhere.\nWow! I want to paint a picture, too!\nI like winter because I can play in the snow.\nI like summer, but I can't swim.\nRobin likes them all!", "zh": "看那些绿色的树和粉色的花。\n天气很热，很热，很热！\n多么可爱的颜色啊！树叶落啊落啊落。我爱秋天！\n有很多雪。到处都是白色的。\n我喜欢春天，因为到处都有美丽的花。\n哇！我也想画一幅画！\n我喜欢冬天，因为我可以玩雪。\n我喜欢夏天，但我不会游泳。\nRobin 喜欢它们全部！", "topic": "四季与喜好", "words": ["green", "pink", "flowers", "hot", "leaves", "fall", "snow", "white", "beautiful", "play in the snow"], "comprehension": [], "keypoints": ["there be 句型", "because 引导原因", "一般现在时", "情态动词 can"], "writing": ""}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 2", "name": "Read and write dialogue", "genre": "对话", "source": "Read and write", "text": "Boy: _____________________?\nGirl: ___________.\nBoy: Do you like summer?\nGirl: No, I don't. It's too hot.\nBoy: _________________________?\nGirl: ___________. The colours are beautiful. I can pick fresh apples.", "zh": "男孩：_______________________？\n女孩：___________。\n男孩：你喜欢夏天吗？\n女孩：不，我不喜欢。太热了。\n男孩：___________________________？\n女孩：___________。颜色很美。我可以摘新鲜苹果。", "topic": "最喜欢的季节", "words": ["season", "like", "summer", "hot", "colours", "beautiful", "pick", "fresh", "apples", "best"], "comprehension": [{"q": "Read and tick.", "options": [], "answer": ""}], "keypoints": ["特殊疑问句 Which season", "一般疑问句 Do you like...", "because 引导原因", "can 表能力"], "writing": "Which season do you like best? Why? Complete the sentence."}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 2", "name": "Story time: Koala's Christmas", "genre": "剧本", "source": "Story time", "text": "Zip & Zoom: Welcome!\nKoala: Thank you. Merry Christmas!\nZip & Zoom: Merry Christmas!\nZoom: What do you usually do on Christmas Day?\nKoala: I usually go to the beach and swim in the sea!\nZoom: You swim in winter?!\nKoala: Christmas is in summer in Australia, so we never have snow for Christmas.\nZoom: Which season do you like best?\nKoala: Summer. I like sunny days.\nKoala: Wow! A white Christmas!\nZoom: Let's make a snowman.\nZip & Koala: Great!\nZip: Say \"cheese\"!\nKoala: Cheese!", "zh": "Zip 和 Zoom：欢迎！\n考拉：谢谢。圣诞快乐！\nZip 和 Zoom：圣诞快乐！\nZoom：你通常在圣诞节做什么？\n考拉：我通常去海滩，在海里游泳！\nZoom：你在冬天游泳？！\n考拉：在澳大利亚，圣诞节是在夏天，所以我们圣诞节从不下雪。\nZoom：你最喜欢哪个季节？\n考拉：夏天。我喜欢晴朗的日子。\n考拉：哇！一个白色的圣诞节！\nZoom：我们堆个雪人吧。\nZip 和考拉：太好了！\nZip：说\"cheese\"！\n考拉：Cheese！", "topic": "圣诞节与季节", "words": ["Christmas", "usually", "beach", "swim", "summer", "Australia", "snow", "season", "sunny", "snowman"], "comprehension": [], "keypoints": ["一般现在时", "usually 表频率", "because/so 表因果", "Which season 特殊疑问句"], "writing": ""}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 2", "name": "Story time: Festivals and vacation", "genre": "对话", "source": "Story time", "text": "When is Tree Planting Day?\nThat's very kind of you.\nWhen is Dragon Boat Festival?\nWhen is the summer vacation?\nIt's in March.\nIt's usually in June.\nMy mum will make zongzi then. I hope you can come and share some with us.", "zh": "植树节是什么时候？\n你真好。\n端午节是什么时候？\n暑假是什么时候？\n它在三月。\n它通常在六月。\n那时我妈妈会做粽子。我希望你能来和我们一起分享一些。", "topic": "节日与假期", "words": ["Tree Planting Day", "Dragon Boat Festival", "summer vacation", "March", "June", "zongzi", "make", "share", "kind", "hope"], "comprehension": [], "keypoints": ["When 特殊疑问句", "一般将来时 will", "月份名词", "hope 表希望"], "writing": ""}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 3", "name": "My school calendar", "genre": "对话", "source": "Read and write", "text": "Mike: We have a few fun things in spring.\nAfter the sports meet, we have an English party.\nZhang Peng: When is the party?\nMike: It’s in April. We have a school trip, too.\nZhang Peng: When is that?\nMike: It’s in May.\nZhang Peng: Cool!", "zh": "迈克：春天我们有一些有趣的活动。运动会之后，我们有一个英语派对。张鹏：派对是什么时候？迈克：在四月。我们还有一个学校旅行。张鹏：那是什么时候？迈克：在五月。张鹏：太酷了！", "topic": "学校日历与春季活动", "words": ["school trip", "sports meet", "English party", "singing contest", "Chinese/maths/... test", "in April", "in May", "fun things", "spring", "calendar"], "comprehension": [{"q": "1. ( × ) Tree Planting Day is in February.", "options": [], "answer": "×"}, {"q": "2. (      ) Winter vacation is in February and March.", "options": [], "answer": ""}, {"q": "3. (      ) Mother’s Day is in May.", "options": [], "answer": ""}, {"q": "4. (      ) The sports meet is in April.", "options": [], "answer": ""}, {"q": "5. (      ) Children’s Day is in January.", "options": [], "answer": ""}], "keypoints": ["一般现在时", "时间介词 in + 月份", "when 引导的特殊疑问句", "将来时 will"], "writing": "Write and talk."}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 3", "name": "A birthday party", "genre": "对话", "source": "Read and write", "text": "Oliver: I like autumn. I really like the colours.\nChen Jie: I like autumn, too. We usually have a school trip in autumn.\nOliver: Great! When is the trip this year?\nChen Jie: It’s in October. We’ll go to the Great Wall.\nOliver: Cool! I love the Great Wall!", "zh": "奥利弗：我喜欢秋天。我真的很喜欢那些颜色。陈杰：我也喜欢秋天。我们通常在秋天有一次学校旅行。奥利弗：太好了！今年旅行是什么时候？陈杰：在十月。我们将去长城。奥利弗：太酷了！我喜欢长城！", "topic": "秋天与学校旅行", "words": ["autumn", "colours", "school trip", "in October", "Great Wall", "usually", "will go", "like", "too", "really"], "comprehension": [{"q": "What will Oliver have? Listen and tick.", "options": [], "answer": ""}], "keypoints": ["一般现在时", "将来时 will", "时间介词 in + 月份", "usually 表频率"], "writing": "What will you do for your mum on Mother’s Day?"}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 3", "name": "English Party", "genre": "通知", "source": "Read and write", "text": "WHEN:  April 12th, 7 p.m.\nWHERE:  Gym\nWHAT:  You will play games. You will read riddles.\nYou will act out stories.\nYou will meet Robin the Robot.\nHe is a great English teacher!\nRSVP:  Will you come to the party?\nPlease send an email by March 23rd.", "zh": "时间：4月12日，晚上7点。地点：体育馆。内容：你们将玩游戏。你们将读谜语。你们将表演故事。你们将见到机器人罗宾。他是一位很棒的英语老师！请回复：你会来参加派对吗？请在3月23日前发送电子邮件。", "topic": "英语派对通知", "words": ["English party", "play games", "read riddles", "act out stories", "meet", "RSVP", "send an email", "by March 23rd", "Gym", "April 12th"], "comprehension": [{"q": "1. (      ) The English party is on March 23rd.", "options": [], "answer": ""}, {"q": "2. (      ) The party will start at 7 p.m.", "options": [], "answer": ""}, {"q": "3. (      ) You’ll dance at the party.", "options": [], "answer": ""}, {"q": "4. (      ) You’ll meet a great English teacher at the party.", "options": [], "answer": ""}], "keypoints": ["将来时 will", "时间介词 on + 日期", "通知类语篇格式", "祈使句"], "writing": "What will you do if you have a birthday party? Write three sentences."}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 3", "name": "Zoom and Zip’s summer vacation plan", "genre": "对话", "source": "Story time", "text": "Zoom: Look at my summer vacation plan!\nZip: It’s April now. The summer vacation is still three months away.\nZoom: Early planning is always good.\nZip: What will you do there?\nZoom: We’ll go to Grape Valley. The grapes there are very sweet! Grapes are my favourite fruit!\nZip: You have a great plan, but what will you do this weekend?\nZoom: This weekend?\nZip: There will be a maths test next Monday. So please study hard.\nZoom: Oh my goodness! I forgot!\nZoom: In August, I’ll go to Huangshan Mountain. The trees there are very famous. The clouds are beautiful!\nZip: Sounds great!\nZoom: In July I’ll visit my grandparents. They live in Xinjiang.", "zh": "祖姆：看看我的暑假计划！齐普：现在是四月。暑假还有三个月。祖姆：早计划总是好的。齐普：你在那里会做什么？祖姆：我们将去葡萄谷。那里的葡萄很甜！葡萄是我最喜欢的水果！齐普：你有一个很棒的计划，但这个周末你会做什么？祖姆：这个周末？齐普：下周一将有一次数学考试。所以请努力学习。祖姆：天哪！我忘了！祖姆：在八月，我将去黄山。那里的树很有名。云很美！齐普：听起来很棒！祖姆：在七月我将去看望我的祖父母。他们住在新疆。", "topic": "暑假计划", "words": ["summer vacation", "Grape Valley", "grapes", "favourite fruit", "maths test", "study hard", "Huangshan Mountain", "grandparents", "Xinjiang", "will go"], "comprehension": [{"q": "1. What will the students do in May?", "options": [], "answer": ""}, {"q": "2. What will they do in December?", "options": [], "answer": ""}], "keypoints": ["将来时 will", "时间介词 in + 月份", "there be 将来时 there will be", "一般现在时"], "writing": ""}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "name": "When is the art show?", "genre": "对话", "source": "Read and write", "text": "Mr Jones: There are some other special days in May.\nZhang Peng: What are they?\nMr Jones: The school art show and the reading festival.\nZhang Peng: When is the art show?\nMr Jones: It’s on May 1st.\nZhang Peng: It’s Labour Day. When is the reading festival?\nMr Jones: It’s on May 5th.\nZhang Peng: Wow! May is fun!", "zh": "琼斯先生：五月还有一些其他特殊的日子。\n张鹏：它们是什么？\n琼斯先生：学校艺术展和读书节。\n张鹏：艺术展是什么时候？\n琼斯先生：在5月1日。\n张鹏：那是劳动节。读书节是什么时候？\n琼斯先生：在5月5日。\n张鹏：哇！五月真有趣！", "topic": "五月的特殊日子", "words": ["art show", "reading festival", "Labour Day", "May", "special days", "on May 1st", "on May 5th"], "comprehension": [], "keypoints": ["一般现在时", "时间介词on", "特殊日子的表达", "there be句型"], "writing": ""}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "name": "Two new kittens", "genre": "日记", "source": "Read and write", "text": "April 15th\nMy cat has two new kittens. They are pink because they are very young. They still can’t see.\nApril 21st\nThe kittens are six days old. They make noises when they are hungry. They have white fur now. They are cute.\nApril 26th\nTheir eyes are open! They are blue.\nMay 3rd\nThe kittens can walk now. They can play with Robin!", "zh": "4月15日\n我的猫有了两只新小猫。它们是粉红色的，因为它们非常小。它们仍然看不见。\n4月21日\n小猫六天大了。它们饿的时候会发出声音。它们现在有白色的毛。它们很可爱。\n4月26日\n它们的眼睛睁开了！它们是蓝色的。\n5月3日\n小猫现在会走路了。它们可以和罗宾一起玩！", "topic": "小猫的成长日记", "words": ["kittens", "pink", "young", "can’t see", "make noises", "hungry", "white fur", "eyes are open", "can walk", "play with"], "comprehension": [{"q": "1. Their eyes are open on April 26th.", "options": [], "answer": ""}, {"q": "2. __________________________", "options": [], "answer": ""}, {"q": "3. __________________________", "options": [], "answer": ""}], "keypoints": ["一般现在时", "情态动词can/can’t", "时间状语", "there be句型"], "writing": "Now write two sentences about the kittens."}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "name": "Zoom practises his song", "genre": "剧本", "source": "Story time", "text": "Music teacher: The singing test will be on May 4th.\nZoom: I can’t sing well.\nZip: Don’t worry. Practice makes perfect.\nZip: Will you come to the party? Today is Rabbit’s birthday.\nZoom: Sorry, I can’t. I want to practise my song.\nRabbit: Will you play football with me after lunch?\nZoom: Sorry, I can’t. I want to practise the song.\nCat: Let’s watch TV together. The show is very funny!\nZoom: Sorry. I need more practice.\nMusic teacher: Good job, Zoom.\nZoom: Thank you, Miss Bird.\nCat: I’ll go swimming tonight. Will you go?\nZoom: Of course!", "zh": "音乐老师：歌唱测试将在5月4日进行。\nZoom：我唱得不好。\nZip：别担心。熟能生巧。\nZip：你会来参加派对吗？今天是兔子的生日。\nZoom：对不起，我不能。我想练习我的歌。\nRabbit：午饭后你愿意和我一起踢足球吗？\nZoom：对不起，我不能。我想练习这首歌。\nCat：我们一起看电视吧。这个节目很有趣！\nZoom：对不起。我需要更多的练习。\n音乐老师：干得好，Zoom。\nZoom：谢谢你，Bird老师。\nCat：我今晚要去游泳。你会去吗？\nZoom：当然！", "topic": "Zoom练习唱歌", "words": ["singing test", "can’t sing well", "practice makes perfect", "practise", "play football", "watch TV", "need more practice", "go swimming", "will you", "of course"], "comprehension": [], "keypoints": ["一般将来时will", "情态动词can/can’t", "祈使句", "一般现在时"], "writing": ""}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "name": "Whose dog is this?", "genre": "对话", "source": "Story time", "text": "Wow! What a beautiful painting! Is it yours?\nOh, it’s mine. He’s sleeping. He’s very tired.\nHey! Whose dog is this?\nNo. It’s his.", "zh": "哇！多么美丽的画啊！它是你的吗？\n哦，是我的。他在睡觉。他很累。\n嘿！这是谁的狗？\n不。是他的。", "topic": "画中的狗", "words": ["painting", "yours", "mine", "sleeping", "tired", "whose", "his"], "comprehension": [], "keypoints": ["物主代词yours/mine/his", "现在进行时", "感叹句", "一般现在时"], "writing": ""}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "name": "Chen Jie and Mike talk about birthdays", "genre": "对话", "source": "Let's read", "text": "Chen Jie: When is your birthday?\nMike: My birthday is on April 4th.\nChen Jie: That’s my mother’s birthday, too!\nMike: Cool! What will you do for your mum?\nChen Jie: I’ll cook noodles for her.\nMike: Chinese noodles are delicious!\nChen Jie: Please come then. We can have a birthday party for both of you!", "zh": "陈杰：你的生日是什么时候？\nMike：我的生日在4月4日。\n陈杰：那也是我妈妈的生日！\nMike：酷！你会为你妈妈做什么？\n陈杰：我会为她煮面条。\nMike：中国面条很好吃！\n陈杰：那就请来吧。我们可以为你俩举办一个生日派对！", "topic": "生日与计划", "words": ["birthday", "on April 4th", "mother’s birthday", "will do", "cook noodles", "delicious", "come", "have a birthday party", "both of you"], "comprehension": [], "keypoints": ["一般将来时will", "时间介词on", "物主代词mother’s", "情态动词can"], "writing": ""}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "name": "When is your birthday?", "genre": "对话", "source": "Let's read", "text": "When is your birthday?\nThat’s New Year’s Day!\nMy birthday is on January 1st.", "zh": "你的生日是什么时候？\n那是新年！\n我的生日在1月1日。", "topic": "生日与新年", "words": ["birthday", "New Year’s Day", "on January 1st"], "comprehension": [], "keypoints": ["一般现在时", "时间介词on", "特殊日子的表达"], "writing": ""}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit": "Unit 4", "name": "When is Grandpa’s birthday?", "genre": "对话", "source": "Let's read", "text": "When is Grandpa’s birthday?\nIt’s on October 12th.\nWhen is your birthday?\nMy birthday is on March 21st.", "zh": "爷爷的生日是什么时候？\n在10月12日。\n你的生日是什么时候？\n我的生日在3月21日。", "topic": "生日日期", "words": ["Grandpa’s birthday", "on October 12th", "your birthday", "on March 21st"], "comprehension": [], "keypoints": ["一般现在时", "时间介词on", "物主代词Grandpa’s"], "writing": ""}, {"grade": "五年级", "term"
