u.，对方回答 You're welcome.；想帮忙时说 Let me help.。", "category": "句型", "tense": "", "examples": [{"en": "After you!", "zh": "你先请！"}, {"en": "Thank you.", "zh": "谢谢你。"}, {"en": "You're welcome.", "zh": "不客气。"}, {"en": "Let me help.", "zh": "让我来帮忙。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 1, "unit": "Meeting new people", "point": "问候与回应", "pattern": "Nice to meet you. / Nice to meet you too. / Nice to see you. / Nice to see you too.", "rule": "第一次见面用 Nice to meet you.，对方回应 Nice to meet you too.；再次见面用 Nice to see you.。", "category": "句型", "tense": "", "examples": [{"en": "Nice to meet you.", "zh": "很高兴认识你。"}, {"en": "Nice to meet you too.", "zh": "我也很高兴认识你。"}, {"en": "Nice to see you.", "zh": "很高兴见到你。"}, {"en": "Nice to see you too.", "zh": "我也很高兴见到你。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 1, "unit": "Meeting new people", "point": "一般现在时（介绍身份与状态）", "pattern": "... is ... / ... are ...", "rule": "介绍人是谁、来自哪里、是什么身份时，用 is 或 are 连接。", "category": "时态", "tense": "一般现在时", "examples": [{"en": "We are friends.", "zh": "我们是朋友。"}, {"en": "The man is my neighbour.", "zh": "那个男人是我的邻居。"}, {"en": "Miss White is my English teacher.", "zh": "怀特老师是我的英语老师。"}, {"en": "We're from China.", "zh": "我们来自中国。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 2, "unit": "Expressing yourself", "point": "描述动物/物品特征（It has...）", "pattern": "It has a/an ... and ...", "rule": "用 It has 来说一个动物或物品有什么身体部位或特征，后面接名词短语。", "category": "句型", "tense": "一般现在时", "examples": [{"en": "It has a long tail and big ears.", "zh": "它有一条长尾巴和大耳朵。"}, {"en": "It has a long body and short legs.", "zh": "它有一个长身体和短腿。"}, {"en": "It has long ears and a short tail.", "zh": "它有长耳朵和短尾巴。"}, {"en": "It has a long body.", "zh": "它有一个长身体。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 2, "unit": "Expressing yourself", "point": "一般疑问句 Do you...? 及回答 Yes, I do. / No, I don't.", "pattern": "Do you ...? Yes, I do. / No, I don't.", "rule": "用 Do you 开头问对方是否做某事，回答用 Yes, I do. 或 No, I don't.。", "category": "疑问句", "tense": "一般现在时", "examples": [{"en": "Do you like dogs? Yes, I do.", "zh": "你喜欢狗吗？是的，我喜欢。"}, {"en": "Do you often say that to your mum? Yes, I do.", "zh": "你经常对你妈妈说那句话吗？是的，我经常说。"}, {"en": "Do you often do this, John? No, I don't.", "zh": "你经常这样做吗，约翰？不，我不经常做。"}, {"en": "Do you have a pet? Yes, I have a dog.", "zh": "你有宠物吗？是的，我有一只狗。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 2, "unit": "Expressing yourself", "point": "情态动词 can 表能力", "pattern": "We/They/You can ...", "rule": "用 can 表示某人或某物能够做某事，后面接动词原形。", "category": "情态动词", "tense": "", "examples": [{"en": "They can help us too.", "zh": "它们也能帮助我们。"}, {"en": "We can make animals with fruit.", "zh": "我们可以用水果做动物。"}, {"en": "We can be tall or short.", "zh": "我们可以高也可以矮。"}, {"en": "We can express our ideas in different ways!", "zh": "我们可以用不同的方式表达我们的想法！"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 2, "unit": "Expressing yourself", "point": "祈使句 Let's ...", "pattern": "Let's ...", "rule": "用 Let's 开头提出一起做某事的建议，后面接动词原形。", "category": "句型", "tense": "", "examples": [{"en": "Let's make a card.", "zh": "让我们做一张卡片吧。"}, {"en": "Let's sing and dance.", "zh": "让我们唱歌跳舞吧。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 2, "unit": "Expressing yourself", "point": "形容词描述外貌（long, short, fat, thin, slow, big）", "pattern": "It is/He is/She is ...", "rule": "用 is 后面接形容词来描述人或动物的样子。", "category": "形容词副词", "tense": "一般现在时", "examples": [{"en": "He's old and fat, and he's also very slow.", "zh": "他又老又胖，而且非常慢。"}, {"en": "It's thin.", "zh": "它很瘦。"}, {"en": "We can be fat or thin.", "zh": "我们可以胖也可以瘦。"}, {"en": "We can be tall or short.", "zh": "我们可以高也可以矮。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 2, "unit": "Expressing yourself", "point": "like 表喜好", "pattern": "I/He/She likes ...", "rule": "用 like 表示喜欢某物，第三人称单数用 likes。", "category": "句型", "tense": "一般现在时", "examples": [{"en": "I love my rabbit.", "zh": "我爱我的兔子。"}, {"en": "I like it.", "zh": "我喜欢它。"}, {"en": "He likes to run.", "zh": "他喜欢跑步。"}, {"en": "She likes to jump.", "zh": "她喜欢跳。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 2, "unit": "My words and actions", "point": "一般现在时描述特征", "pattern": "It is/has ...", "rule": "用 is 或 has 来说一个东西长什么样、有什么。", "category": "时态", "tense": "一般现在时", "examples": [{"en": "It's orange. It has a long tail and big ears.", "zh": "它是橙色的。它有一条长尾巴和大耳朵。"}, {"en": "Your dog is cute. It has a long body and short legs.", "zh": "你的狗很可爱。它身体长，腿短。"}, {"en": "I have a cat. He's old and fat, and he's also very slow.", "zh": "我有一只猫。它又老又胖，而且很慢。"}, {"en": "I love my rabbit. It has long ears and a short tail.", "zh": "我爱我的兔子。它有长耳朵和短尾巴。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 2, "unit": "My words and actions", "point": "一般现在时描述人", "pattern": "He/She is ... He/She has ...", "rule": "用 is 或 has 来说一个人长什么样、有什么。", "category": "时态", "tense": "一般现在时", "examples": [{"en": "I have a good friend. His name is ...", "zh": "我有一个好朋友。他的名字是……"}, {"en": "He/She is ... He/She has ...", "zh": "他/她……他/她有……"}, {"en": "I have a dog. It's thin. It has a long body. I like it.", "zh": "我有一只狗。它很瘦。它身体很长。我喜欢它。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 2, "unit": "My words and actions", "point": "一般现在时描述动作", "pattern": "We ...", "rule": "用动词原形来说我们做什么。", "category": "时态", "tense": "一般现在时", "examples": [{"en": "We sing and dance.", "zh": "我们唱歌跳舞。"}, {"en": "We talk.", "zh": "我们说话。"}, {"en": "We dance.", "zh": "我们跳舞。"}, {"en": "We sing.", "zh": "我们唱歌。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 2, "unit": "My words and actions", "point": "一般现在时描述喜好", "pattern": "I love ...", "rule": "用 love 来说我喜欢什么。", "category": "时态", "tense": "一般现在时", "examples": [{"en": "I love my rabbit.", "zh": "我爱我的兔子。"}, {"en": "I love my dog.", "zh": "我爱我的狗。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 2, "unit": "My words and actions", "point": "一般现在时描述能力", "pattern": "We can ...", "rule": "用 can 来说我们能做什么。", "category": "时态", "tense": "一般现在时", "examples": [{"en": "We can make animals with fruit.", "zh": "我们可以用水果做动物。"}, {"en": "We can be tall or short.", "zh": "我们可以高也可以矮。"}, {"en": "We can be fat or thin.", "zh": "我们可以胖也可以瘦。"}, {"en": "We can also \"write\" with fruit.", "zh": "我们还可以用水果“写字”。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 2, "unit": "My words and actions", "point": "一般现在时描述习惯", "pattern": "I often ...", "rule": "用 often 来说我经常做什么。", "category": "时态", "tense": "一般现在时", "examples": [{"en": "I often make a card for my dad.", "zh": "我经常给我爸爸做卡片。"}, {"en": "I often make her gifts.", "zh": "我经常给她做礼物。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 3, "unit": "Learning better", "point": "询问与回答物品名称（单数）", "pattern": "What's this? It's a ...", "rule": "用 What's this? 问“这是什么”，用 It's a ... 回答，后面接一个单数物品。", "category": "疑问句", "tense": "", "examples": [{"en": "What's this?", "zh": "这是什么？"}, {"en": "It's a pencil.", "zh": "它是一支铅笔。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 3, "unit": "Learning better", "point": "询问与回答物品名称（复数）", "pattern": "What are these? They're ...", "rule": "用 What are these? 问“这些是什么”，用 They're ... 回答，后面接复数名词。", "category": "疑问句", "tense": "", "examples": [{"en": "What are these?", "zh": "这些是什么？"}, {"en": "They're grapes.", "zh": "它们是葡萄。"}, {"en": "They're rabbits.", "zh": "它们是兔子。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 3, "unit": "Learning better", "point": "礼貌借用物品", "pattern": "Can I use your ..., please?", "rule": "用 Can I use your ..., please? 礼貌地借别人的东西，回答可以用 Sure. / No problem. 等。", "category": "情态动词", "tense": "", "examples": [{"en": "Can I use your pen?", "zh": "我能用一下你的钢笔吗？"}, {"en": "No problem.", "zh": "没问题。"}, {"en": "Excuse me. Can I use your eraser, please?", "zh": "打扰一下，我能用一下你的橡皮吗？"}, {"en": "Sure. Here you are.", "zh": "当然可以。给你。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 3, "unit": "Learning better", "point": "用感官描述学习", "pattern": "I ... with my ...", "rule": "用 I ... with my ... 说明“我用……来……”，后面接感官动词和身体部位。", "category": "句型", "tense": "一般现在时", "examples": [{"en": "I hear with my ears.", "zh": "我用耳朵听。"}, {"en": "I see with my eyes.", "zh": "我用眼睛看。"}, {"en": "I smell with my nose.", "zh": "我用鼻子闻。"}, {"en": "I taste with my tongue.", "zh": "我用舌头尝。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 3, "unit": "Learning better", "point": "祈使句（学习指令）", "pattern": "... with your ...", "rule": "用动词开头说“用你的……做……”，如 Write with your pencil. 表示学习动作。", "category": "句型", "tense": "", "examples": [{"en": "Write with your pencil.", "zh": "用你的铅笔写。"}, {"en": "Draw a line with your ruler.", "zh": "用你的尺子画一条线。"}, {"en": "Put the pen in your pencil box.", "zh": "把钢笔放进你的铅笔盒里。"}, {"en": "Put everything in your bag.", "zh": "把所有东西放进你的书包里。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 3, "unit": "Learning better", "point": "情态动词 can 表能力", "pattern": "I can ...", "rule": "用 I can ... 表示“我能……”，后面接动词原形。", "category": "情态动词", "tense": "", "examples": [{"en": "I can use paper, pencils, books and computers to learn.", "zh": "我能用纸、铅笔、书和电脑来学习。"}, {"en": "I can ask others politely to share school things.", "zh": "我能礼貌地请别人分享学习用品。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 3, "unit": "Tools and senses for learning", "point": "询问与回答物品（What's this? / What are these?）", "pattern": "What's this? It's a ... / What are these? They're ...", "rule": "用 What's this? 问单数物品，用 It's a ... 回答；用 What are these? 问复数物品，用 They're ... 回答。", "category": "疑问句", "tense": "", "examples": [{"en": "What's this? It's a pencil.", "zh": "这是什么？它是一支铅笔。"}, {"en": "What are these? They're grapes.", "zh": "这些是什么？它们是葡萄。"}, {"en": "What are these? They're rabbits.", "zh": "这些是什么？它们是兔子。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 3, "unit": "Tools and senses for learning", "point": "礼貌借用物品（Can I use your ..., please?）", "pattern": "Can I use your ..., please? Sure. / No problem. / Here you are.", "rule": "用 Can I use your ..., please? 礼貌地借东西，对方可以用 Sure.、No problem. 或 Here you are. 回答。", "category": "情态动词", "tense": "", "examples": [{"en": "Can I use your pen? No problem.", "zh": "我能用一下你的钢笔吗？没问题。"}, {"en": "Excuse me. Can I use your eraser, please? Sure. Here you are.", "zh": "打扰一下，我能用一下你的橡皮吗？当然，给你。"}, {"en": "I can't find my ruler. Can I use your ruler, Zhang Peng? Sure. Here you are.", "zh": "我找不到我的尺子了。张鹏，我能用一下你的尺子吗？当然，给你。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 3, "unit": "Tools and senses for learning", "point": "用感官描述学习（I see/hear/smell/taste/touch with ...）", "pattern": "I see/hear/smell/taste/touch with my eyes/ears/nose/tongue/hands.", "rule": "用 I + 感官动词 + with my + 身体部位，说明我用什么器官来学习。", "category": "句型", "tense": "一般现在时", "examples": [{"en": "I hear with my ears.", "zh": "我用耳朵听。"}, {"en": "I see with my eyes.", "zh": "我用眼睛看。"}, {"en": "I smell with my nose.", "zh": "我用鼻子闻。"}, {"en": "I taste with my tongue.", "zh": "我用舌头尝。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 3, "unit": "Tools and senses for learning", "point": "用工具学习（I use ... / I can use ... to learn）", "pattern": "I use ... / I can use ... to learn.", "rule": "用 I use ... 或 I can use ... to learn 说明我用什么工具来学习。", "category": "句型", "tense": "一般现在时", "examples": [{"en": "I use rulers and crayons.", "zh": "我用尺子和蜡笔。"}, {"en": "I use pencils and pens.", "zh": "我用铅笔和钢笔。"}, {"en": "I can use paper, pencils, books and computers to learn.", "zh": "我可以用纸、铅笔、书和电脑来学习。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 3, "unit": "Tools and senses for learning", "point": "祈使句（Read/Write/Put/Draw ...）", "pattern": "Read/Write/Put/Draw ...", "rule": "用动词原形开头，告诉别人做什么，比如 Read your book. 或 Put the pen in your pencil box.", "category": "句型", "tense": "一般现在时", "examples": [{"en": "Read your book.", "zh": "读你的书。"}, {"en": "Write on your paper.", "zh": "在你的纸上写。"}, {"en": "Write with your pencil.", "zh": "用你的铅笔写。"}, {"en": "Put the pen in your pencil box.", "zh": "把钢笔放进铅笔盒里。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 3, "unit": "Tools and senses for learning", "point": "i-e 拼读规则（Let's spell）", "pattern": "...i-e (like, bike, fine, size)", "rule": "字母 i 在词尾前加 e 时，通常发长音 /aɪ/，如 like、bike、fine、size。", "category": "其他", "tense": "", "examples": [{"en": "Let's make a kite.", "zh": "我们来做一只风筝吧。"}, {"en": "Write number nine.", "zh": "写数字九。"}, {"en": "The kite is nice!", "zh": "这只风筝真漂亮！"}, {"en": "High five! High five!", "zh": "击掌！击掌！"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 4, "unit": "Healthy food", "point": "询问想要什么食物", "pattern": "Would you like some ...?", "rule": "用 Would you like some ...? 来问别人要不要吃点东西，some 后面可以接可数名词复数或不可数名词。", "category": "句型", "tense": "", "examples": [{"en": "Would you like some bread?", "zh": "你想要一些面包吗？"}, {"en": "Would you like some rice and meat?", "zh": "你想要一些米饭和肉吗？"}, {"en": "Would you like some noodles?", "zh": "你想要一些面条吗？"}, {"en": "Would you like some meat, Zoom?", "zh": "Zoom，你想要一些肉吗？"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 4, "unit": "Healthy food", "point": "表达想要某物", "pattern": "I'd like some ...", "rule": "用 I'd like some ... 来表示自己想要一些东西，some 后面可以接可数名词复数或不可数名词。", "category": "句型", "tense": "", "examples": [{"en": "I'd like some bread and eggs, please.", "zh": "我想要一些面包和鸡蛋，谢谢。"}, {"en": "I'd like some juice and noodles.", "zh": "我想要一些果汁和面条。"}, {"en": "I'd like some milk and bread.", "zh": "我想要一些牛奶和面包。"}, {"en": "I'd like some bread, eggs and cake.", "zh": "我想要一些面包、鸡蛋和蛋糕。"}]}, {"grade": "三年级", "term": "下册", "book": "三年级下册", "unit_no": 4, "unit": "Healthy food", "point": "肯定回答与感谢", "pattern": "Yes, please. / Thanks. / Thank you.", "rule": "别人问你要不要某物时，想要就说 Yes, please. 然后说 Thanks. 或 Thank you. 表示感谢。", "category": "句型", "tense": "", "examples": [{"en": "Yes, please.", "zh": "好的，请给我。"}, {"en": "Thanks.", "zh": "谢谢。"}, {"en": "Thank you.", "zh": "谢谢你。"}, {"en": "Thanks, Mum.", "zh": "谢谢，妈妈。"}]}, {"grade": "三年级", "term": " k": "四年级下册", "unit_no": null, "unit": "A great weekend plan", "point": "建议句型 Let's ...", "pattern": "Let's + 动词原形 ...", "rule": "用 Let's 开头，后面加动词原形，表示“我们一起做某事”。", "category": "句型", "tense": "", "examples": [{"en": "Let's take a farm trip this weekend.", "zh": "这个周末我们去农场旅行吧。"}, {"en": "Let's go to the park on the hill.", "zh": "我们去山上的公园吧。"}, {"en": "Let's get ready.", "zh": "我们准备一下吧。"}, {"en": "Let's make a salad.", "zh": "我们做一份沙拉吧。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": null, "unit": "A great weekend plan", "point": "询问天气 What's the weather like?", "pattern": "What's the weather like ...? It's + 天气形容词.", "rule": "用 What's the weather like 询问天气，回答用 It's 加天气形容词。", "category": "疑问句", "tense": "", "examples": [{"en": "What's the weather like this weekend?", "zh": "这个周末天气怎么样？"}, {"en": "It's cloudy but warm.", "zh": "多云但暖和。"}, {"en": "It's sunny today.", "zh": "今天晴朗。"}, {"en": "It's raining.", "zh": "正在下雨。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": null, "unit": "A great weekend plan", "point": "情态动词 can 表能力/许可", "pattern": "Can I ...? / We can ...", "rule": "Can 后面加动词原形，用来询问或表示可以做某事。", "category": "情态动词", "tense": "", "examples": [{"en": "Can I wear a skirt and a T-shirt?", "zh": "我可以穿裙子和T恤吗？"}, {"en": "We can have a picnic.", "zh": "我们可以野餐。"}, {"en": "Can I help you?", "zh": "我能帮你吗？"}, {"en": "Can we go to the second floor?", "zh": "我们能去二楼吗？"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": null, "unit": "A great weekend plan", "point": "would like 表想要", "pattern": "I'd like to + 动词原形 ... / I'd like some ...", "rule": "I'd like 表示“我想要”，后面可接 to 加动词原形，或接 some 加名词。", "category": "句型", "tense": "", "examples": [{"en": "I'd like to wear my shorts.", "zh": "我想穿我的短裤。"}, {"en": "Yes, I'd like some apples.", "zh": "是的，我想要一些苹果。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": null, "unit": "A great weekend plan", "point": "There be 句型", "pattern": "There is/are + 名词 ...", "rule": "There is 用于单数或不可数名词，There are 用于复数名词，表示“有……”。", "category": "There be", "tense": "", "examples": [{"en": "There are so many old cars here!", "zh": "这里有很多老式汽车！"}, {"en": "There are cucumbers here, and corn there.", "zh": "这里有黄瓜，那里有玉米。"}, {"en": "There are also big tall firs.", "zh": "还有高大挺拔的云杉。"}, {"en": "There are stairs here, and chairs there.", "zh": "这里有楼梯，那里有椅子。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": null, "unit": "A great weekend plan", "point": "祈使句表规则/禁止", "pattern": "Don't + 动词原形 ... / 动词原形 + ...", "rule": "用 Don't 加动词原形表示“不要做某事”，直接用动词原形开头表示“要做某事”。", "category": "句型", "tense": "", "examples": [{"en": "Don't be loud.", "zh": "不要大声喧哗。"}, {"en": "Don't climb the fence.", "zh": "不要爬栅栏。"}, {"en": "Don't eat fruit on trees.", "zh": "不要摘树上的水果。"}, {"en": "Don't touch the horses.", "zh": "不要摸马。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": null, "unit": "A great weekend plan", "point": "一般将来时 will", "pattern": "We'll + 动词原形 ...", "rule": "will 缩写为 'll，后面加动词原形，表示将来要做的事。", "category": "时态", "tense": "一般将来时", "examples": [{"en": "We'll milk the cows later.", "zh": "我们稍后再挤牛奶。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": null, "unit": "Songs", "point": "询问学校规则", "pattern": "What class rules does your school have?", "rule": "用这个句型来问别人学校有什么规则。", "category": "疑问句", "tense": "一般现在时", "examples": [{"en": "What class rules does your school have?", "zh": "你们学校有什么班级规则？"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": null, "unit": "Songs", "point": "祈使句（肯定）", "pattern": "...!", "rule": "用动词原形开头，表示命令或建议，比如“举手”“整理房间”。", "category": "句型", "tense": "", "examples": [{"en": "Put up your hand!", "zh": "请举手！"}, {"en": "Tidy your room.", "zh": "整理你的房间。"}, {"en": "Clean the dishes.", "zh": "洗碗。"}, {"en": "Listen to your parents too.", "zh": "也要听父母的话。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": null, "unit": "Songs", "point": "祈使句（否定）", "pattern": "Don't ...!", "rule": "用 Don't 加动词原形，表示不要做某事。", "category": "句型", "tense": "", "examples": [{"en": "Don't be late!", "zh": "不要迟到！"}, {"en": "Don't eat in class!", "zh": "不要在课堂上吃东西！"}, {"en": "Don't say bad words.", "zh": "不要说脏话。"}, {"en": "Don't make a mess.", "zh": "不要弄得一团糟。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": null, "unit": "Songs", "point": "There be 句型", "pattern": "There is/are ...", "rule": "用 There is 或 There are 来说明某处有某物。", "category": "There be", "tense": "一般现在时", "examples": [{"en": "There are lots of rules at home.", "zh": "家里有很多规则。"}, {"en": "There are lots of things to do.", "zh": "有很多事情要做。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": null, "unit": "Songs", "point": "询问时间", "pattern": "What time is it now?", "rule": "用这个句型来问现在几点了。", "category": "疑问句", "tense": "一般现在时", "examples": [{"en": "What time is it now?", "zh": "现在几点了？"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": null, "unit": "Songs", "point": "It's time for ...", "pattern": "It's time for ...", "rule": "用这个句型来说明该做某事了。", "category": "句型", "tense": "一般现在时", "examples": [{"en": "It's time for breakfast.", "zh": "该吃早饭了。"}, {"en": "It's time for Chinese.", "zh": "该上语文课了。"}, {"en": "It's time for English.", "zh": "该上英语课了。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": null, "unit": "Songs", "point": "询问价格", "pattern": "How much is/are ...?", "rule": "用 How much 来问某物多少钱。", "category": "疑问句", "tense": "一般现在时", "examples": [{"en": "How much are the red shoes in the window?", "zh": "橱窗里的红鞋子多少钱？"}, {"en": "How much is the blue hat in the window?", "zh": "橱窗里的蓝帽子多少钱？"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": null, "unit": "Songs", "point": "询问数量", "pattern": "How many ... do you have?", "rule": "用 How many 来问有多少个某物。", "category": "疑问句", "tense": "一般现在时", "examples": [{"en": "How many cows do you have on the farm?", "zh": "你农场里有多少头牛？"}, {"en": "How many trees do you have on the farm?", "zh": "你农场里有多少棵树？"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": null, "unit": "Songs", "point": "一般现在时（第三人称单数）", "pattern": "He/She + 动词三单形式", "rule": "当主语是 He 或 She 时，动词要加 s 或 es。", "category": "时态", "tense": "一般现在时", "examples": [{"en": "He works hard.", "zh": "他工作很努力。"}, {"en": "He milks cows, and he plants his fruit.", "zh": "他挤牛奶，也种他的水果。"}, {"en": "She feeds the pigs, and she plants her fruit.", "zh": "她喂猪，也种她的水果。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": null, "unit": "Useful expressions", "point": "祈使句（命令/建议）", "pattern": "动词原形 + ... / Don't + 动词原形 + ...", "rule": "用动词原形开头表示命令或建议，否定形式在动词前加 Don't。", "category": "句型", "tense": "", "examples": [{"en": "Hurry up! Don't be late for class!", "zh": "快点！上课别迟到！"}, {"en": "Shh. Don't be so loud!", "zh": "嘘。别这么大声！"}, {"en": "Be careful, Jack. Don't touch hot things.", "zh": "杰克，要小心。别碰烫的东西。"}, {"en": "Don't waste food, please.", "zh": "请不要浪费食物。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": null, "unit": "Useful expressions", "point": "情态动词 can 表能力或请求", "pattern": "Can + 主语 + 动词原形 + ...? / I can + 动词原形 + ...", "rule": "用 can 表示“能、会”，疑问句把 can 放在主语前面。", "category": "情态动词", "tense": "", "examples": [{"en": "I can put back the desks and chairs.", "zh": "我可以把桌椅放回原位。"}, {"en": "Mum, can I watch TV?", "zh": "妈妈，我能看电视吗？"}, {"en": "Can I buy a new pair?", "zh": "我能买条新的（裤子）吗？"}, {"en": "I can use chopsticks.", "zh": "我会用筷子。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": null, "unit": "Useful expressions", "point": "have to 表必须", "pattern": "主语 + have to + 动词原形 + ...", "rule": "have to 表示“必须、得”，后面接动词原形。", "category": "情态动词", "tense": "", "examples": [{"en": "You have to do your homework first.", "zh": "你得先做作业。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": null, "unit": "Useful expressions", "point": "询问时间", "pattern": "What time is it? / It's ... o'clock.", "rule": "用 What time is it? 问现在几点，回答用 It's + 时间。", "category": "疑问句", "tense": "一般现在时", "examples": [{"en": "What time is it?", "zh": "几点了？"}, {"en": "It's 5 o'clock.", "zh": "现在五点了。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": null, "unit": "Useful expressions", "point": "It's time to/for ... 表该做某事了", "pattern": "It's time to + 动词原形 + ... / It's time for + 名词 + ...", "rule": "It's time to 后面接动词原形，It's time for 后面接名词，表示“该……了”。", "category": "句型", "tense": "一般现在时", "examples": [{"en": "Time to go home, kids.", "zh": "孩子们，该回家了。"}, {"en": "It's time for dinner.", "zh": "该吃晚饭了。"}, {"en": "It's time to get up.", "zh": "该起床了。"}]}, {"grade": "四年级", "term": "下册", "book": "四年级下册", "unit_no": null, "unit": "Useful expressions", "point": "一般现在时（have/has 表拥有）", "pattern": "主语 + have/has + 名词 + ...", "rule": "用 have 或 has 表示“有”，第三人称单数用 has。", "category": "时态", "tense": "一般现在时", "examples": [{"en": "I have a lot of animals.", "zh": "我养了很多动物。"}, {"en": "You already have too many shorts.", "zh": "你已经有很多短裤了。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 1, "unit": "Different friends", "point": "询问外貌与性格", "pattern": "What's he/she like? He/She's ...", "rule": "用 What's he/she like? 问别人长什么样、性格怎么样，回答用 He/She's + 形容词。", "category": "疑问句", "tense": "", "examples": [{"en": "What's he like?", "zh": "他是什么样的人？"}, {"en": "He's tall and strong.", "zh": "他又高又壮。"}, {"en": "What's Chen Jie like?", "zh": "陈洁是什么样的人？"}, {"en": "She's lovely.", "zh": "她很可爱。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 1, "unit": "Different friends", "point": "描述能力", "pattern": "He/She can ... / He/She can't ...", "rule": "用 can 表示会做某事，can't 表示不会做某事，后面直接加动词原形。", "category": "情态动词", "tense": "", "examples": [{"en": "He can run very fast.", "zh": "他跑得很快。"}, {"en": "Oliver can't speak Chinese.", "zh": "奥利弗不会说中文。"}, {"en": "Can you make robots, Sarah?", "zh": "莎拉，你会做机器人吗？"}, {"en": "No, I can't.", "zh": "不，我不会。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 1, "unit": "Different friends", "point": "询问擅长", "pattern": "Is he/she good at ...? Yes, he/she is. / No, he/she isn't.", "rule": "用 Is he/she good at ...? 问某人是否擅长某事，回答用 Yes, he/she is. 或 No, he/she isn't.。", "category": "疑问句", "tense": "", "examples": [{"en": "Is he good at football?", "zh": "他擅长足球吗？"}, {"en": "Yes, I think he is.", "zh": "是的，我觉得他是。"}, {"en": "Is she hard-working?", "zh": "她很努力吗？"}, {"en": "Yes, she is.", "zh": "是的，她是。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 1, "unit": "Different friends", "point": "描述外貌特征", "pattern": "He/She has ...", "rule": "用 has 表示某人拥有某种外貌特征，如 has short hair。", "category": "句型", "tense": "", "examples": [{"en": "She has ...", "zh": "她有……"}, {"en": "The dog has a short tail.", "zh": "这只狗有一条短尾巴。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 1, "unit": "Different friends", "point": "一般现在时描述习惯", "pattern": "He/She + 动词三单 ...", "rule": "用一般现在时描述某人经常做的事，动词要用第三人称单数形式。", "category": "时态", "tense": "一般现在时", "examples": [{"en": "She loves going to school.", "zh": "她喜欢去上学。"}, {"en": "She helps a lot at home.", "zh": "她在家帮很多忙。"}, {"en": "The dog likes to play in the rain.", "zh": "这只狗喜欢在雨中玩耍。"}, {"en": "He waits for the boy to come and play.", "zh": "他等男孩来一起玩。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 1, "unit": "Different friends", "point": "询问能做什么", "pattern": "What can you do? I can ...", "rule": "用 What can you do? 问别人会做什么，回答用 I can + 动词原形。", "category": "疑问句", "tense": "", "examples": [{"en": "What can you do for the festival?", "zh": "你能为节日做什么？"}, {"en": "I can make a robot.", "zh": "我会做一个机器人。"}, {"en": "What can you do?", "zh": "你会做什么？"}, {"en": "I can dance.", "zh": "我会跳舞。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 2, "unit": "My feelings", "point": "询问与表达情绪", "pattern": "How do you feel? / How does ... feel? / I'm ... / He's ... / She's ...", "rule": "用 How do/does 问别人感觉，用 I'm/He's/She's 加情绪形容词回答。", "category": "疑问句", "tense": "一般现在时", "examples": [{"en": "How do you feel today?", "zh": "你今天感觉怎么样？"}, {"en": "He's excited.", "zh": "他很兴奋。"}, {"en": "Mike is angry.", "zh": "迈克很生气。"}, {"en": "Mike is sad.", "zh": "迈克很难过。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 2, "unit": "My feelings", "point": "询问原因与安慰", "pattern": "What's the matter? / You look ... / I'm sorry. / Don't worry.", "rule": "用 What's the matter? 问怎么了，用 You look + 情绪词 描述对方样子，再用 I'm sorry 或 Don't worry 安慰。", "category": "句型", "tense": "一般现在时", "examples": [{"en": "You look sad. What's the matter?", "zh": "你看起来很伤心。怎么了？"}, {"en": "I'm sorry.", "zh": "我很抱歉。"}, {"en": "Don't worry.", "zh": "别担心。"}, {"en": "You look worried.", "zh": "你看起来很担心。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 2, "unit": "My feelings", "point": "表达担忧与困难", "pattern": "I'm so worried! / I can't ... / It's about ...", "rule": "用 I'm so worried! 表达担心，用 I can't 说不能做某事，用 It's about 说明事情原因。", "category": "句型", "tense": "一般现在时", "examples": [{"en": "I'm so worried!", "zh": "我太担心了！"}, {"en": "I can't find my hat.", "zh": "我找不到我的帽子了。"}, {"en": "I can't play football.", "zh": "我不能踢足球。"}, {"en": "It's about our school project.", "zh": "这是关于我们学校项目的事。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 2, "unit": "My feelings", "point": "提出建议", "pattern": "Why not ...? / You can ... / Let's ...", "rule": "用 Why not 或 You can 或 Let's 提出建议，后面接动词原形。", "category": "句型", "tense": "一般现在时", "examples": [{"en": "Why not do both?", "zh": "为什么不两个都做呢？"}, {"en": "You can talk to him now.", "zh": "你现在可以和他谈谈。"}, {"en": "Let's do both projects!", "zh": "我们两个项目都做吧！"}, {"en": "Let's look for it.", "zh": "我们去找找它吧。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 2, "unit": "My feelings", "point": "表达同意与不同意", "pattern": "I agree with ... / I don't agree with ... / We don't agree with each other.", "rule": "用 agree with 表示同意某人，加 don't 表示不同意，用 each other 表示彼此。", "category": "句型", "tense": "一般现在时", "examples": [{"en": "So you don't agree with each other?", "zh": "所以你们彼此不同意？"}, {"en": "My brother doesn't agree with me.", "zh": "我哥哥不同意我。"}, {"en": "We don't agree with each other.", "zh": "我们彼此意见不同。"}, {"en": " s": [{"en": "You should eat healthy food.", "zh": "你应该吃健康的食物。"}, {"en": "You should exercise every day.", "zh": "你应该每天锻炼。"}, {"en": "You should get enough sleep.", "zh": "你应该睡足够的觉。"}, {"en": "You should brush your teeth twice a day.", "zh": "你应该每天刷两次牙。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 4, "unit": "Healthy habits", "point": "shouldn't 表不建议", "pattern": "You shouldn't ... (so often)", "rule": "用 shouldn't 告诉别人不应该做什么，表示不建议。", "category": "情态动词", "tense": "", "examples": [{"en": "You shouldn't play on a phone so often.", "zh": "你不应该这么频繁地玩手机。"}, {"en": "You shouldn't check your phone so often.", "zh": "你不应该这么频繁地看手机。"}, {"en": "You shouldn't eat too much honey, Zoom.", "zh": "Zoom，你不应该吃太多蜂蜜。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 4, "unit": "Healthy habits", "point": "can 表请求", "pattern": "Can I ...?", "rule": "用 Can I ...? 向别人请求做某事。", "category": "情态动词", "tense": "", "examples": [{"en": "Can I watch a TV show now, please?", "zh": "请问我现在可以看电视节目吗？"}, {"en": "Can I play on Mum's phone?", "zh": "我可以在妈妈的手机上玩吗？"}, {"en": "Can I watch TV?", "zh": "我可以看电视吗？"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 4, "unit": "Healthy habits", "point": "can't 表否定回答", "pattern": "No, you can't.", "rule": "用 No, you can't. 回答别人不能做某事。", "category": "情态动词", "tense": "", "examples": [{"en": "No, you can't.", "zh": "不，你不能。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 4, "unit": "Healthy habits", "point": "have to 表必须", "pattern": "... has to ...", "rule": "用 has to 表示某人必须做某事。", "category": "情态动词", "tense": "", "examples": [{"en": "He has to stay at home.", "zh": "他必须待在家里。"}, {"en": "Sarah has to do her homework.", "zh": "Sarah 必须做作业。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 4, "unit": "Healthy habits", "point": "一般现在时（频率副词）", "pattern": "I ... every day / often / usually / sometimes", "rule": "用一般现在时描述经常做的习惯，可加 every day、often、usually、sometimes 等词。", "category": "时态", "tense": "一般现在时", "examples": [{"en": "I eat them every day.", "zh": "我每天吃它们。"}, {"en": "I usually sleep about ten hours a day.", "zh": "我通常每天睡大约十个小时。"}, {"en": "I play with my friends every day.", "zh": "我每天和朋友们一起玩。"}, {"en": "We often play football together.", "zh": "我们经常一起踢足球。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 4, "unit": "Healthy habits", "point": "一般现在时（否定）", "pattern": "I don't ...", "rule": "用 don't 表示一般现在时的否定，说明不常做某事。", "category": "时态", "tense": "一般现在时", "examples": [{"en": "I don't often eat green vegetables.", "zh": "我不常吃绿色蔬菜。"}, {"en": "I don't spend too much time on it.", "zh": "我不在上面花太多时间。"}, {"en": "I don't exercise often.", "zh": "我不经常锻炼。"}, {"en": "I don't always eat three meals a day.", "zh": "我不总是每天吃三餐。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 4, "unit": "Healthy habits", "point": "How can ...? 询问方法", "pattern": "How can I ...?", "rule": "用 How can I ...? 询问自己可以怎么做。", "category": "疑问句", "tense": "", "examples": [{"en": "How can I stay healthy?", "zh": "我怎样才能保持健康？"}, {"en": "How can I take care of my teeth?", "zh": "我怎样才能照顾我的牙齿？"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 4, "unit": "Healthy habits", "point": "There is 句型", "pattern": "There is ... on the ...", "rule": "用 There is ... 表示某处有某物。", "category": "There be", "tense": "", "examples": [{"en": "There is ... on the ...", "zh": "在……上有……"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 5, "unit": "Food we eat", "point": "询问想吃什么/喝什么", "pattern": "What would you like to eat/drink?", "rule": "用这个句型问别人想吃或喝什么。", "category": "句型", "tense": "", "examples": [{"en": "What would you like to eat?", "zh": "你想吃什么？"}, {"en": "What would you like to drink?", "zh": "你想喝什么？"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 5, "unit": "Food we eat", "point": "表达想要某物", "pattern": "I'd like ...", "rule": "用 I'd like 后面加食物或饮料，表示“我想要……”。", "category": "句型", "tense": "", "examples": [{"en": "I'd like beef and rice.", "zh": "我想要牛肉和米饭  park.", "zh": "自然公园里有很多动物。"}, {"en": "There is a big forest in the park.", "zh": "公园里有一片大森林。"}, {"en": "There are also many rivers in the nature park.", "zh": "自然公园里还有很多河流。"}, {"en": "There is a small shop in the hotel.", "zh": "酒店里有一家小商店。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 6, "unit": "Nature and us", "point": "一般疑问句 Are there...? / Is there...?", "pattern": "Are there any ...? / Is there a ...?", "rule": "用 Are there 或 Is there 开头提问，回答用 Yes, there are/is. 或 No, there aren't/isn't.。", "category": "疑问句", "tense": "", "examples": [{"en": "Are there any mountains in the nature park?", "zh": "自然公园里有山吗？"}, {"en": "Yes, there are.", "zh": "是的，有。"}, {"en": "Is there a waterfall in the forest?", "zh": "森林里有瀑布吗？"}, {"en": "Yes, there is.", "zh": "是的，有。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 6, "unit": "Nature and us", "point": "一般将来时 will", "pattern": "There will be ... / I will ...", "rule": "用 will 表示将来会发生的事，There will be 表示“将会有……”。", "category": "时态", "tense": "一般将来时", "examples": [{"en": "There will be heavy rain in the afternoon too.", "zh": "下午也会有大雨。"}, {"en": "There will be rain this afternoon.", "zh": "今天下午会有雨。"}, {"en": "Tomorrow, it will be cloudy.", "zh": "明天将会多云。"}, {"en": "I'll go to buy some umbrellas and raincoats.", "zh": "我会去买一些雨伞和雨衣。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 6, "unit": "Nature and us", "point": "情态动词 should", "pattern": "You should ... / Don't ...", "rule": "用 should 表示“应该做某事”，Don't 表示“不要做某事”。", "category": "情态动词", "tense": "", "examples": [{"en": "Be careful of bad weather.", "zh": "小心恶劣天气。"}, {"en": "Don't go hiking in bad weather!", "zh": "不要在恶劣天气里去徒步！"}, {"en": "You should wear good hiking shoes.", "zh": "你应该穿好的徒步鞋。"}, {"en": "Tell people about your trip.", "zh": "告诉别人你的行程。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": 6, "unit": "Nature and us", "point": "一般现在时（描述自然与天气）", "pattern": "There is/are ... / It is ...", "rule": "用一般现在时描述自然和天气的常态，如 int": "have to 表示‘必须/得’", "pattern": "We have to ... by ...", "rule": "have to 后面接动词原形，表示不得不做某事。", "category": "情态动词", "tense": "", "examples": [{"en": "We have to finish our project by Monday.", "zh": "我们得在星期一之前完成项目。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": null, "unit": "Useful expressions", "point": "询问最喜欢的日子", "pattern": "What's your favourite day at school?", "rule": "用 What's your favourite... 来问对方最喜欢什么。", "category": "疑问句", "tense": "", "examples": [{"en": "What's your favourite day at school, John?", "zh": "你在学校最喜欢哪一天，约翰？"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": null, "unit": "Useful expressions", "point": "询问课程安排（一般现在时）", "pattern": "What do you have on ...? I have ...", "rule": "用 What do you have 问有什么课，回答用 I have 加课程名。", "category": "时态", "tense": "一般现在时", "examples": [{"en": "What do you have on Wednesdays?", "zh": "星期三你有什么课？"}, {"en": "I have Chinese, maths, music and PE.", "zh": "我有语文课、数学课、音乐课和体育课。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": null, "unit": "Useful expressions", "point": "频率副词 + 一般现在时", "pattern": "I often ... . Sometimes I ...", "rule": "often 表示经常，sometimes 表示有时，后面接动词原形。", "category": "时态", "tense": "一般现在时", "examples": [{"en": "I often play football.", "zh": "我经常踢足球。"}, {"en": "Sometimes I play Chinese chess with my father.", "zh": "有时我和爸爸下象棋。"}]}, {"grade": "五年级", "term": "上册", "book": "五年级上册", "unit_no": null, "unit": "Useful expressions", "point": "第三人称单数一般疑问句", "pattern": "Does ... work on ...? Yes, she does. / No, she doesn't.", "rule": "主语是第三人称单数时，用 Does 开头提问，回答用 does/doesn't。", "category": "疑问句", "tense": "一般现在时", "examples": [{"en": "Does your mother work on both Saturdays and Sundays?", "zh": "你妈妈周六周日都工作吗？"}, {"en": "Yes, she does.", "zh": "是的，她（周末两天）都工作。"}]}, {"grade": "五年级", "term": "下册", "book": "五年级下册", "unit_no": 1, "unit": "My day", "point": "询问时间（When 疑问句）", "pattern": "When do you ...?", "rule": "用 When do you 加动词原形来问别人什么时候做某事，回答用 at 加时间。", "category": "en": "He'll meet a friend.", "zh": "他将会见一个朋友。"}, {"en": "He'll answer a call.", "zh": "他将会接一个电话。"}, {"en": "He'll have a class.", "zh": "他将会上一节课。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 1, "unit": "Amazing places", "point": "情态动词 should", "pattern": "主语 + should + 动词原形", "rule": "用 should 表示建议，比如 You should go there! 表示你应该去那里！", "category": "情态动词", "tense": "", "examples": [{"en": "You should go there!", "zh": "你应该去那里！"}, {"en": "You should visit there!", "zh": "你应该去那里参观！"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 2, "unit": "Getting together", "point": "一般过去时（Did 引导的一般疑问句）", "pattern": "Did + 主语 + 动词原形 + ...? Yes, 主语 + did. / No, 主语 + didn't.", "rule": "用 Did 开头问过去做过的事，回答用 Yes, ... did. 或 No, ... didn't.", "category": "时态", "tense": "一般过去时", "examples": [{"en": "Did you eat mooncakes?", "zh": "你们吃月饼了吗？"}, {"en": "No, we didn't.", "zh": "没有，我们没有。"}, {"en": "Did you count down to 12 o'clock?", "zh": "你们倒计时到12点了吗？"}, {"en": "Yes, we did.", "zh": "是的，我们倒计时了。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 2, "unit": "Getting together", "point": "一般过去时（What did ... do? 询问过去做的事）", "pattern": "What did + 主语 + do (+ 时间/地点)?", "rule": "用 What did ... do? 问别人过去做了什么。", "category": "疑问句", "tense": "一般过去时", "examples": [{"en": "What did you do?", "zh": "你做了什么？"}, {"en": "What did you do for the Spring Festival?", "zh": "你为春节做了什么？"}, {"en": "What did Binbin do last weekend?", "zh": "彬彬上周末做了什么？"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 2, "unit": "Getting together", "point": "一般过去时（How was ...? 询问过去感受）", "pattern": "How was + 名词/活动? It was + 形容词.", "rule": "用 How was ...? 问过去某事怎么样，回答用 It was + 形容词。", "category": "疑问句", "tense": "一般过去时", "examples": [{"en": "How was your Mid-Autumn Festival holiday, Binbin?", "zh": "彬彬，你的中秋假期怎么样？"}, {"en": "It was great!", "zh": "太棒了！"}, {"en": "How was your weekend, Amy?", "zh": "艾米，你周末过得怎么样？"}, {"en": "It was great.", "zh": "太棒了。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 2, "unit": "Getting together", "point": "一般过去时（What did you like about it? 询问喜欢的方面）", "pattern": "What did you like about it? I liked + 名词/动名词.", "rule": "用 What did you like about it? 问对方喜欢某事的哪方面，回答用 I liked ...。", "category": "疑问句", "tense": "一般过去时", "examples": [{"en": "What did you like about it?", "zh": "你喜欢它哪方面？"}, {"en": "I liked watching the runners.", "zh": "我喜欢看跑步的人。"}, {"en": "We shared ideas and talked about different books.", "zh": "我们分享想法并谈论不同的书。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 2, "unit": "Getting together", "point": "一般过去时（动词过去式变化）", "pattern": "动词原形 → 过去式（如 clean→cleaned, go→went, do→did, see→saw）", "rule": "讲过去的事时，动词要变成过去式，有的加 -ed，有的要变特殊形式。", "category": "时态", "tense": "一般过去时", "examples": [{"en": "My dad and I cleaned the house.", "zh": "我爸爸和我打扫了房子。"}, {"en": "Xinxin and I pasted fu on the door.", "zh": "欣欣和我在门上贴了福字。"}, {"en": "My mother and I went to a marathon on Sunday.", "zh": "我和妈妈周日去了一场马拉松。"}, {"en": "I saw the race.", "zh": "我看了比赛。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 2, "unit": "Getting together", "point": "情态动词 can 表将来意愿", "pattern": "Can I + 动词原形 + ...? Sure. / Yes, you can.", "rule": "用 Can I ...? 请求许可或表达想一起做某事，回答用 Sure 或 Yes, you can。", "category": "情态动词", "tense": "", "examples": [{"en": "Can I join you next year?", "zh": "明年我能和你们一起吗？"}, {"en": "Sure. You can also join us for the Spring Festival.", "zh": "当然可以。你也可以和我们一起过春节。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 3, "unit": "Healthy life", "point": "询问身体状况", "pattern": "How do you feel? / How does ... feel? / What's the matter?", "rule": "用 How do you feel? 或 What's the matter? 来问别人身体或心情怎么样。", "category": "疑问句", "tense": "一般现在时", "examples": [{"en": "How do you feel?", "zh": "你感觉怎么样？"}, {"en": "How does Mike feel?", "zh": "迈克感觉怎么样？"}, {"en": "What's the matter?", "zh": "怎么了？"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 3, "unit": "Healthy life", "point": "描述生病症状", "pattern": "I have a ... / My ... hurts / I feel ...", "rule": "用 I have a ... 说有什么病，用 My ... hurts 说哪里疼，用 I feel ... 说感觉如何。", "category": "句型", "tense": "一般现在时", "examples": [{"en": "I have a bad cold.", "zh": "我得了重感冒。"}, {"en": "My head hurts and I have a runny nose.", "zh": "我头疼，还流鼻涕。"}, {"en": "I feel ill.", "zh": "我感觉不舒服。"}, {"en": "He has a fever.", "zh": "他发烧了。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 3, "unit": "Healthy life", "point": "提出建议", "pattern": "You should ... / You need to ... / You can ...", "rule": "用 should, need to 或 can 来给别人提建议，后面加动词原形。", "category": "情态动词", "tense": "一般现在时", "examples": [{"en": "You should drink some water and have a rest.", "zh": "你应该喝点水，休息一下。"}, {"en": "Maybe you should see a doctor.", "zh": "也许你应该去看医生。"}, {"en": "We need to eat healthy food.", "zh": "我们需要吃健康的食物。"}, {"en": "I can exercise often.", "zh": "我可以经常锻炼。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 3, "unit": "Healthy life", "point": "一般将来时（be going to）", "pattern": "I'm going to ... / ... is going to ...", "rule": "用 be going to 加动词原形，表示打算或计划做某事。", "category": "时态", "tense": "be going to", "examples": [{"en": "I'm going to the science museum tomorrow.", "zh": "我明天要去科学博物馆。"}, {"en": "My mum is going to take me to hospital this afternoon.", "zh": "今天下午我妈妈要带我去医院。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 3, "unit": "Healthy life", "point": "一般过去时", "pattern": "... was/were ... / ... moved ... / ... asked ...", "rule": "用动词的过去式或 was/were 来说过去发生的事情。", "category": "时态", "tense": "一般过去时", "examples": [{"en": "Liu Jia was crying.", "zh": "刘佳在哭。"}, {"en": "My good friend Lucy moved to another city.", "zh": "我好朋友露西搬到了另一个城市。"}, {"en": "Miss White asked her, \"What's the matter, Liu Jia?\"", "zh": "怀特老师问她：“刘佳，怎么了？”"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 3, "unit": "Healthy life", "point": "现在进行时", "pattern": "I'm feeling ... / ... are doing ...", "rule": "用 be 加动词的 -ing 形式，表示正在发生的动作或状态。", "category": "时态", "tense": "现在进行时", "examples": [{"en": "I'm not feeling well.", "zh": "我感觉不太好。"}, {"en": "I'm feeling down.", "zh": "我感到很沮丧。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 4, "unit": "Managing money well", "point": "be going to 表示计划/打算", "pattern": "I'm going to ... / She is going to ... / He is going to ...", "rule": "用 am/is/are going to 加动词原形，表示打算做某事。", "category": "句型", "tense": "be going to", "examples": [{"en": "I'm going to buy a schoolbag.", "zh": "我打算买一个书包。"}, {"en": "She is going to buy a new schoolbag.", "zh": "她打算买一个新书包。"}, {"en": "Mike is going to save up for a computer.", "zh": "迈克打算攒钱买一台电脑。"}, {"en": "I'm going to buy ... And I also want to buy ...", "zh": "我打算买……我还想买……"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 4, "unit": "Managing money well", "point": "want to do 表示想要做某事", "pattern": "I want to ... / She wants to ...", "rule": "用 want to 加动词原形，表示想要做某事。", "category": "句型", "tense": "", "examples": [{"en": "I also want to buy some animal books.", "zh": "我还想买一些动物书。"}, {"en": "She wants to buy a new schoolbag.", "zh": "她想买一个新书包。"}, {"en": "He also wants to buy a robot show ticket.", "zh": "他还想买一张机器人展的票。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 4, "unit": "Managing money well", "point": "need 表示需要", "pattern": "I need ... / I need to ...", "rule": "need 后面可以直接加名词，也可以用 need to 加动词原形。", "category": "句型", "tense": "", "examples": [{"en": "Yes, you need a new one.", "zh": "是的，你需要一个新的。"}, {"en": "I need (to) ...", "zh": "我需要……"}, {"en": "I need some ...", "zh": "我需要一些……"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 4, "unit": "Managing money well", "point": "一般现在时（第三人称单数）", "pattern": "She writes ... / She gets ... / She keeps ...", "rule": "主语是 he/she/it 时，动词要加 s 或 es。", "category": "时态", "tense": "一般现在时", "examples": [{"en": "She writes a spending plan every Sunday.", "zh": "她每个星期天写一份消费计划。"}, {"en": "Every week, she gets her pocket money.", "zh": "每周  there any aliens?", "zh": "有外星人吗？"}, {"en": "Is there any life on the Sun?", "zh": "太阳上有生命吗？"}, {"en": "Are there any ... around the Sun?", "zh": "太阳周围有……吗？"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 6, "unit": "Energy, nature and us", "point": "情态动词 should 表建议", "pattern": "We should ...", "rule": "用 should 加动词原形，表示“我们应该做某事”，用来提出建议。", "category": "情态动词", "tense": "", "examples": [{"en": "We should save energy.", "zh": "我们应该节约能源。"}, {"en": "We should always unplug our computers and TVs.", "zh": "我们应该总是拔掉电脑和电视的插头。"}, {"en": "We should follow the \"3R\" rules.", "zh": "我们应该遵守“3R”规则。"}, {"en": "We should use air conditioners less.", "zh": "我们应该少用空调。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 6, "unit": "Energy, nature and us", "point": "情态动词 can 表能力或建议", "pattern": "We can ...", "rule": "用 can 加动词原形，表示“我们可以做某事”，用来提出可行的做法。", "category": "情态动词", "tense": "", "examples": [{"en": "We can take quick showers.", "zh": "我们可以快速洗澡。"}, {"en": "We can also use LED lighting.", "zh": "我们也可以使用LED照明。"}, {"en": "We can go by bus or walk to ...", "zh": "我们可以坐公交车或步行去……"}, {"en": "We can reuse old bottles.", "zh": "我们可以重复使用旧瓶子。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 6, "unit": "Energy, nature and us", "point": "一般现在时（第三人称单数）", "pattern": "... does ...? / ... does ...", "rule": "主语是第三人称单数时，疑问句用 does 开头，动词用原形。", "category": "时态", "tense": "一般现在时", "examples": [{"en": "What does Binbin want to know about it?", "zh": "彬彬想知道关于它的什么？"}, {"en": "How much fresh water does Earth have?", "zh": "地球有多少淡水？"}, {"en": "Does water have a smell?", "zh": "水有气味吗？"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 6, "unit": "Energy, nature and us", "point": "一般现在时（复数主语）", "pattern": "We use ... / They are ...", "rule": "主语是 we/they 等复数时，动词用原形，表示经常或一般的情况。", "category": "时态", "tense": "一般现在时", "examples": [{"en": "We use electricity to run a car, light a bulb, heat a room and cool a house.", "zh": "我们用电力来开车、点亮灯泡、加热房间和冷却房屋。"}, {"en": "We use green energy to light, heat and cool our homes and schools.", "zh": "我们用绿色能源来照明、加热和冷却我们的家和学校。"}, {"en": "We also use it to run cars, buses and trains.", "zh": "我们也用它来运行汽车、公交车和火车。"}, {"en": "We use energy every day.", "zh": "我们每天都使用能源。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 6, "unit": "Energy, nature and us", "point": "一般过去时", "pattern": "... was/were ... / ... did ...", "rule": "用 was/were 或动词过去式表示过去发生的事情。", "category": "时态", "tense": "一般过去时", "examples": [{"en": "What was the class about?", "zh": "那节课是关于什么的？"}, {"en": "What did I learn?", "zh": "我学到了什么？"}, {"en": "What did they choose for their project?", "zh": "他们为项目选择了什么？"}, {"en": "It was a sunny day.", "zh": "那是一个晴朗的日子。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": 6, "unit": "Energy, nature and us", "point": "There be 句型", "pattern": "There is/are ...", "rule": "用 There is/are 表示“有……”，is 用于单数，are 用于复数。", "category": "There be", "tense": "", "examples": [{"en": "There are many resources running out.", "zh": "有许多资源正在耗尽。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": null, "unit": "Learning in museums", "point": "be going to 表示计划/打算", "pattern": "I'm going to ... / We're going to ...", "rule": "用 am/is/are going to 加动词原形，表示已经计划好的事情。", "category": "句型", "tense": "be going to", "examples": [{"en": "I'm going to visit the China Great Wall Museum.", "zh": "我打算去参观中国长城博物馆。"}, {"en": "We're going to plan some museum trips.", "zh": "我们打算计划一些博物馆之旅。"}, {"en": "Yes, I'm going to visit some museums online.", "zh": "是的，我打算在网上参观一些博物馆。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": null, "unit": "Learning in museums", "point": "一般现在时（want to do）", "pattern": "I want to ... / We want to ...", "rule": "用 want to 加动词原形，表示想要做某事。", "category": "句型", "tense": "一般现在时", "examples": [{"en": "I want to know about space and planets.", "zh": "我想知道关于太空和行星的事情。"}, {"en": "I want to learn more about staying healthy.", "zh": "我想更多地了解如何保持健康。"}, {"en": "I want to know more about Chinese festivals.", "zh": "我想更多地了解中国的节日。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": null, "unit": "Learning in museums", "point": "情态动词 can 表能力", "pattern": "We can ... / I can ...", "rule": "用 can 加动词原形，表示能够做某事。", "category": "情态动词", "tense": "", "examples": [{"en": "We can read books or use the internet.", "zh": "我们可以读书或使用互联网。"}, {"en": "We can travel to different places.", "zh": "我们可以去不同的地方旅行。"}, {"en": "We can also learn in museums.", "zh": "我们也可以去博物馆学习。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": null, "unit": "Learning in museums", "point": "一般过去时（did / saw / went）", "pattern": "What did you ...? / I saw ... / I went ...", "rule": "用 did 提问，回答用动词过去式，表示过去发生的事情。", "category": "时态", "tense": "一般过去时", "examples": [{"en": "What did you see in the museum?", "zh": "你在博物馆里看到了什么？"}, {"en": "I saw a big spaceship.", "zh": "我看到了一艘大宇宙飞船。"}, {"en": "I also went into a mini space station.", "zh": "我还进入了一个迷你空间站。"}, {"en": "Did you see any other interesting things there?", "zh": "你在那里还看到其他有趣的东西吗？"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": null, "unit": "Learning in museums", "point": "一般过去时（was / were）", "pattern": "It was ... / We were ...", "rule": "用 was/were 表示过去的时间或状态。", "category": "时态", "tense": "一般过去时", "examples": [{"en": "It was the Mid-Autumn Festival.", "zh": "那是中秋节。"}, {"en": "Chang'e is always sad, but she will be happy now.", "zh": "嫦娥总是很伤心，但现在她会开心了。"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": null, "unit": "Learning in museums", "point": "There be 句型", "pattern": "Is/Are there ...?", "rule": "用 Is there 或 Are there 提问，表示某处有没有某物。", "category": "There be", "tense": "", "examples": [{"en": "Is/Are there ...?", "zh": "有……吗？"}]}, {"grade": "六年级", "term": "上册", "book": "六年级上册", "unit_no": null, "unit": "Songs", "point": "一般过去时", "pattern": "主语 + 动词过去式 + ...", "rule": "描述过去发生的事情，动词要用过去式。", "category": "时态", "tense": "一般过去时", "examples": [{"en": "I visited Beijing.", d）", "rule": "有些动词变过去式时不按规则加 -ed，要单独记住它们的过去式形式。", "category": "时态", "tense": "一般过去时", "examples": [{"en": "go → went", "zh": "去 → 去了"}, {"en": "have (has) → had", "zh": "有 → 有（过去）"}, {"en": "be (am, is, are) → was, were", "zh": "是 → 是（过去）"}, {"en": "write → wrote", "zh": "写 → 写了"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": 1, "unit": "How tall are you?", "point": "询问身高", "pattern": "How tall are you? / How tall is it?", "rule": "用 How tall 来问人或物有多高，回答用 I’m ... metres 或 It’s ... metres。", "category": "疑问句", "tense": "一般现在时", "examples": [{"en": "How tall are you?", "zh": "你有多高？"}, {"en": "I’m 1.65 metres.", "zh": "我1.65米高。"}, {"en": "How tall is it?", "zh": "它有多高？"}, {"en": "Maybe 4 metres.", "zh": "大概4米。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": 1, "unit": "How tall are you?", "point": "询问体重", "pattern": "How heavy are you? / How heavy is it?", "rule": "用 How heavy 来问人或物有多重，回答用 I’m ... kilograms 或 It’s ... tons。", "category": "疑问句", "tense": "一般现在时", "examples": [{"en": "How heavy are you?", "zh": "你有多重？"}, {"en": "I’m 48 kilograms.", "zh": "我48公斤。"}, {"en": "How heavy is it?", "zh": "它有多重？"}, {"en": "It’s five tons.", "zh": "它有5吨重。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": 1, "unit": "How tall are you?", "point": "询问鞋码", "pattern": "What size are your shoes?", "rule": "用 What size 来问鞋子的尺码，回答用 My shoes are size ... 或 Size ...。", "category": "疑问句", "tense": "一般现在时", "examples": [{"en": "What size are your shoes?", "zh": "你的鞋多大码？"}, {"en": "My shoes are size 35.", "zh": "我的鞋是35码。"}, {"en": "Size 7.", "zh": "7码。"}, {"en": "In China I wear size 40 shoes.", "zh": "在中国我穿40码的鞋。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": 1, "unit": "How tall are you?", "point": "形容词比较级", "pattern": "... is/are + 比较级 + than ...", "rule": "用形容词的比较级加 than 来比较两个人或物，比如 taller than, heavier than, older than。", "category": "形容词副词", "tense": "一般现在时", "examples": [{"en": "It’s taller than both of us together.", "zh": ]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": null, "unit": "Irregular verbs", "point": "不规则动词的过去式", "pattern": "动词原形 → 过去式（如 go → went, have → had）", "rule": "有些动词变过去式时不按规则加 -ed，要单独记住它们的过去式形式。", "category": "时态", "tense": "一般过去时", "examples": [{"en": "go → went", "zh": "去 → 去了"}, {"en": "have (has) → had", "zh": "有 → 有（过去）"}, {"en": "be (am, is, are) → was, were", "zh": "是 → 是（过去）"}, {"en": "learn → learnt, learned", "zh": "学习 → 学习了"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": null, "unit": "Mike's happy days", "point": "现在进行时", "pattern": "Subject + is/are + V-ing", "rule": "用 is/are 加动词的 -ing 形式，表示正在发生的动作。", "category": "时态", "tense": "现在进行时", "examples": [{"en": "Bill is playing ping-pong.", "zh": "比尔正在打乒乓球。"}, {"en": "These people are having fun on the farm.", "zh": "这些人在农场玩得很开心。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": null, "unit": "Mike's happy days", "point": "一般过去时", "pattern": "Subject + V-ed / irregular past form", "rule": "用动词的过去式表示过去发生的事情。", "category": "时态", "tense": "一般过去时", "examples": [{"en": "Saturday was a busy day for me.", "zh": "星期六对我来说是忙碌的一天。"}, {"en": "In the morning, I got up early.", "zh": "早上，我起得很早。"}, {"en": "What did Mike do on the farm?", "zh": "迈克在农场做了什么？"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": null, "unit": "Mike's happy days", "point": "一般将来时（will）", "pattern": "Subject + will + V", "rule": "用 will 加动词原形表示将来要做的事。", "category": "时态", "tense": "一般将来时", "examples": [{"en": "Bill will wear a red hat to work.", "zh": "比尔上班时会戴一顶红帽子。"}, {"en": "We will draw pictures and sing songs.", "zh": "我们会画画和唱歌。"}, {"en": "We will also give many prizes to our good students.", "zh": "我们还会给优秀学生们发很多奖品。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": null, "unit": "Mike's happy days", "point": "一般将来时（be going to）", "pattern": "Subject + am/is/are + going to + V", "rule": "用 am/is/are going to 加动词原形表示计划或打算做某事。", "category": "时态", "tense": "be going to", "examples": [{"en": "I am going to ... on ...", "zh": "我打算在……做……"}, {"en": "We are going to have a farewell party.", "zh": "我们要举办一场告别派对。"}, {"en": "We are going to give prizes for the best pictures.", "zh": "我们会为最好的画颁发奖品。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": null, "unit": "Mike's happy days", "point": "比较级与最高级", "pattern": "A is bigger/smaller than B; A is the biggest/smallest", "rule": "用比较级加 than 表示两者比较，用 the 加最高级表示三者及以上比较。", "category": "形容词副词", "tense": "", "examples": [{"en": "Is this bigger or smaller than the elephant?", "zh": "这个比大象大还是小？"}, {"en": "I think it’s bigger than the elephant.", "zh": "我觉得它比大象大。"}, {"en": "So the whale is the biggest, and the tiger is the smallest.", "zh": "所以鲸鱼是最大的，老虎是最小的。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": null, "unit": "Mike's happy days", "point": "There be 句型", "pattern": "There is/are ...", "rule": "用 There is/are 表示某处有某物。", "category": "There be", "tense": "", "examples": [{"en": "There are three pictures.", "zh": "有三张图片。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": null, "unit": "Proverbs", "point": "一般过去时（did 疑问句与回答）", "pattern": "Did you ...? Yes, we did. / No, we didn't.", "rule": "用 Did 开头问过去做过的事，回答用 Yes, ... did. 或 No, ... didn't.", "category": "时态", "tense": "一般过去时", "examples": [{"en": "Did you go to Turpan?", "zh": "你们去吐鲁番了吗？"}, {"en": "Yes, we did.", "zh": "是的，去了。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": null, "unit": "Proverbs", "point": "一般过去时（where 疑问句）", "pattern": "Where did you go?", "rule": "用 Where did you go? 问过去去了哪里。", "category": "疑问句", "tense": "一般过去时", "examples": [{"en": "Where did you go?", "zh": "你去哪儿了？"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": null, "unit": "Proverbs", "point": "一般过去时（how 疑问句与交通方式）", "pattern": "How did you go there? We went there by ...", "rule": "用 How did you go there? 问过去怎么去的，回答用 went ... by + 交通工具。", "category": "疑问句", "tense": "一般过去时", "examples": [{"en": "How did you go there?", "zh": "你们怎么去的？"}, {"en": "We went there by plane.", "zh": "我们坐飞机去的。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": null, "unit": "Proverbs", "point": "There be 句型（过去时）", "pattern": "There was/were no ...", "rule": "用 There was/were no ... 表示过去没有某物。", "category": "There be", "tense": "一般过去时", "examples": [{"en": "There was no library in my old school.", "zh": "我以前的学校里没有图书馆。"}, {"en": "There were no computers or Internet in my time.", "zh": "我那时候没有电脑也没有网络。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": null, "unit": "Proverbs", "point": "一般过去时（was/were 描述过去状态）", "pattern": "I was ...", "rule": "用 I was ... 描述过去是什么样。", "category": "时态", "tense": "一般过去时", "examples": [{"en": "Before, I was quiet.", "zh": "以前我很安静。"}, {"en": "I was short, so I couldn't ride my bike well.", "zh": "我以前个子小，自行车骑得不好。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": null, "unit": "Proverbs", "point": "情态动词 couldn't（过去不能）", "pattern": "I couldn't ...", "rule": "用 couldn't 表示过去不能做某事。", "category": "情态动词", "tense": "一般过去时", "examples": [{"en": "I was short, so I couldn't ride my bike well.", "zh": "我以前个子小，自行车骑得不好。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": null, "unit": "Short plays", "point": "询问与回答去向", "pattern": "Where are you going? / I'm going to ...", "rule": "用 Where are you going? 问别人要去哪里，回答用 I'm going to + 地点。", "category": "疑问句", "tense": "", "examples": [{"en": "Wolf: Where are you going?", "zh": "狼：你要去哪里？"}, {"en": "Little Red-Cap: I'm going to my grandmother's house.", "zh": "小红帽：我要去我奶奶家。"}]}, {"grade": "六年级", "term": "下册", "book": "六年级下册", "unit_no": null, "unit": "Short plays", "point": "询问与回答某物用途", "pattern": "What for? / I am going to ... with it/them.", "rule": "用 What for? 问用途，回答用 I am going to + 动词 + with it/them 表示打算用某物做某事。", "category": "疑问句", "tense": "", "examples": [{"en": "Straw-seller: Sure. What for?", "zh": "稻草卖家：当然。用来做什么？"}, {"en": "Pete: I am going to build a house with it.", "zh"
