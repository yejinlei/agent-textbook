的学校项目。John 想去儿童中心，但我想去清理公园。"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "I see. So you don't agree with each other?", "zh": "我明白了。所以你们意见不一致？"}, {"s": "Mike", "speaker": "Mike", "en": "That's right. And we have to finish our project by Monday. I'm so worried!", "zh": "没错。而且我们必须在周一前完成项目。我很担心！"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "Why not do both? I can help. We can work together.", "zh": "为什么不两个都做呢？我可以帮忙。我们可以一起合作。"}, {"s": "Mike", "speaker": "Mike", "en": "That's a good idea!", "zh": "这是个好主意！"}], "topic": "My feelings", "theme": "人与自我"}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 2, "unit": "My feelings", "title": "My feelings", "scene": "John 与 Chen Jie 谈论 Fido 的感受", "function": "感受与情绪", "patterns": ["How does Fido feel?", "He's excited."], "turns": [{"s": "John", "speaker": "John", "en": "Mike is back home. How does Fido feel?", "zh": "Mike 回家了。Fido 感觉怎么样？"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "He's excited.", "zh": "他很兴奋。"}], "topic": "My feelings", "theme": "人与自我"}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 2, "unit": "My feelings", "title": "My feelings", "scene": "Oliver 与 Amy 讨论项目困难", "function": "感受与情绪", "patterns": ["Our project is so hard.", "We can ask Miss White for help."], "turns": [{"s": "Oliver", "speaker": "Oliver", "en": "Our project is so hard.", "zh": "我们的项目太难了。"}, {"s": "Amy", "speaker": "Amy", "en": "We can ask Miss White for help.", "zh": "我们可以向 White 老师求助。"}], "topic": "My feelings", "theme": "人与自我"}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 2, "unit": "My feelings", "title": "My feelings", "scene": "Miss White 与 John 讨论项目分歧", "function": "感受与情绪", "patterns": ["What's the matter, John? You look worried.", "It's important to listen to each other.", "I'm afraid he's angry with me.", "Let's do both projects!"], "turns": [{"s": "Miss White", "speaker": "Miss White", "en": "What's the matter, John? You look worried.", "zh": "怎么了，John？你看起来很担心。"}, {"s": "John", "speaker" : "Benjy，进来吧。"}, {"s": "A", "speaker": "A", "en": "Don't worry, Benjy. We can play in the snow again tomorrow!", "zh": "别担心，Benjy。我们明天可以再在雪地里玩！"}, {"s": "A", "speaker": "A", "en": "He looks sad. He still wants to play outside.", "zh": "他看起来很伤心。他还是想出去玩。"}], "topic": "My feelings", "theme": "人与自我"}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 3, "unit": "Work and play", "title": "Work and play", "scene": "John 和爷爷谈论最喜欢的上学日", "function": "询问信息", "patterns": ["What's your favourite day at school?", "What do you have on ...?", "I have ...", "Is ... your favourite subject?"], "turns": [{"s": "Grandpa", "speaker": "Grandpa", "en": "What's your favourite day at school, John?", "zh": "约翰，你最喜欢上学的一天是哪天？"}, {"s": "John", "speaker": "John", "en": "Wednesday.", "zh": "星期三。"}, {"s": "Grandpa", "speaker": "Grandpa", "en": "What do you have on Wednesdays?", "zh": "你星期三有什么课？"}, {"s": "John", "speaker": "John", "en": "I have Chinese, maths, music and PE.", "zh": "我有语文、数学、音乐和体育课。"}, {"s": "Grandpa", "speaker": "Grandpa", "en": "Maths is not easy.", "zh": "数学不容易。"}, {"s": "John", "speaker": "John", "en": "No, but I really like my maths teacher!", "zh": "是的，但我真的很喜欢我的数学老师！"}, {"s": "Grandpa", "speaker": "Grandpa", "en": "That's good. Is music your favourite subject?", "zh": "那很好。音乐是你最喜欢的科目吗？"}, {"s": "John", "speaker": "John", "en": "Yes. I really like singing. And I like PE too.", "zh": "是的。我真的很喜欢唱歌。我也喜欢体育课。"}, {"s": "Grandpa", "speaker": "Grandpa", "en": "Great! Wednesday is your favourite day.", "zh": "太好了！星期三是你最喜欢的一天。"}, {"s": "John", "speaker": "John", "en": "But I like Tuesdays and Fridays.", "zh": "但我喜欢星期二和星期五。"}, {"s": "Grandpa", "speaker": "Grandpa", "en": "Why, Grandpa?", "zh": "为什么，爷爷？"}, {"s": "John", "speaker": "John", "en": "Because I have my taijiquan class!", "zh": "因为我有太极拳课！"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 3, "unit": "Work and play", "title": "Work and play", "scene": "Robin 和 Binbin 谈论最喜欢的上学日", "function": "询问信息", "patterns": ["What's your favourite day at school?", "It's ...", "What do you have on ...?", "I have ..."], "turns": [{"s": "Robin", "speaker": "Robin", "en": "What's your favourite day at school?", "zh": "你最喜欢上学的一天是哪天？"}, {"s": "Binbin", "speaker": "Binbin", "en": "It's Tuesday.", "zh": "是星期二。"}, {"s": "Robin", "speaker": "Robin", "en": "What do you have on Tuesdays?", "zh": "你星期二有什么课？"}, {"s": "Binbin", "speaker": "Binbin", "en": "I have maths, Chinese, art and English.", "zh": "我有数学、语文、美术和英语课。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 3, "unit": "Work and play", "title": "Work and play", "scene": "Miss White 和学生们谈论周末活动", "function": "询问信息", "patterns": ["What do you usually do at the weekend?", "I often ...", "I usually ...", "Does ... work on both Saturdays and Sundays?"], "turns": [{"s": "Miss White", "speaker": "Miss White", "en": "What do you usually do at the weekend, children?", "zh": "孩子们，你们周末通常做什么？"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "I often play football. Sometimes I play Chinese chess with my father.", "zh": "我经常踢足球。有时我和爸爸下中国象棋。"}, {"s": "Miss White", "speaker": "Miss White", "en": "That's nice.", "zh": "那很好。"}, {"s": "Sarah", "speaker": "Sarah", "en": "My mother works at the weekend, so I often cook lunch for my family.", "zh": "我妈妈周末上班，所以我经常为家人做午饭。"}, {"s": "Miss White", "speaker": "Miss White", "en": "Good girl! Does your mother work on both Saturdays and Sundays?", "zh": "好女孩！你妈妈星期六和星期日都上班吗？"}, {"s": "Sarah", "speaker": "Sarah", "en": "Yes, she does.", "zh": "是的，她上班。"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "I do my homework on Saturdays. And I usually have pipa lessons on Sundays.", "zh": "我星期六做作业。我通常星期日有琵琶课。"}, {"s": "Miss White", "speaker": "Miss White", "en": "Great! Have a nice weekend, everyone!", "zh": "太好了！大家周末愉快！"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 4, "unit": "Healthy habits", "title": "Healthy habits", "scene": "Mike's mother and Miss White are talking on the phone.", "function": "询问信息", "patterns": ["How can we all stay healthy?", "We should ...", "You should see a doctor."], "turns": [{"s": "Miss White", "speaker": "Miss White", "en": "Mike has a cold today, children.", "zh": "孩子们，Mike今天感冒了。"}, {"s": "Miss White", "speaker": "Miss White", "en": "He has to stay at home.", "zh": "他得待在家里。"}, {"s": "Binbin", "speaker": "Binbin", "en": "Oh no! It's flu season now.", "zh": "哦不！现在是流感季节。"}, {"s": "Miss White", "speaker": "Miss White", "en": "That's right. How can we all stay healthy?", "zh": "没错。我们怎样才能保持健康？"}, {"s": "Amy", "speaker": "Amy", "en": "We should eat healthy food.", "zh": "我们应该吃健康的食物。"}, {"s": "Miss White", "speaker": "Miss White", "en": "Good. And what else?", "zh": "很好。还有什么呢？"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "We should exercise every day.", "zh": "我们应该每天锻炼。"}, {"s": "Miss White", "speaker": "Miss White", "en": "Yes, but please drink enough water.", "zh": "是的，但请喝足够的水。"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "We should also get enough sleep, Miss White.", "zh": "我们也应该睡足够的觉，White老师。"}, {"s": "Miss White", "speaker": "Miss White", "en": "Right. And if you don't feel well, you should see a doctor.", "zh": "对。如果你感觉不舒服，你应该去看医生。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 4, "unit": "Healthy habits", "title": "Healthy habits", "scene": "Let's talk: How can I stay healthy?", "function": "请求与应答", "patterns": ["How can I stay healthy?", "You should ...", "It's a good habit."], "turns": [{"s": "A", "speaker": "A", "en": "How can I stay healthy?", "zh": "我怎样才能保持健康？"}, {"s": "B", "speaker": "B", "en": "You should get enough sleep. It's a good habit.", "zh": "你应该睡足够的觉。这是一个好习惯。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 4, "unit": "Healthy habits", "title": "Healthy habits", "scene": "Let's talk: Hello, Ms Wang!", "function": "问候与介绍", "patterns": ["Hello, ...!", "Hi, ...", "What healthy habits do you have?", "I ..."], "turns": [{"s": "Mike", "speaker": "Mike", "en": "Hello, Ms Wang!", "zh": "你好，王老师！"}, {"s": "Ms Wang", "speaker": "Ms Wang", "en": "Hi, Mike.", "zh": "嗨，Mike。"}, {"s": "Ms Wang", "speaker": "Ms Wang", "en": "What healthy habits do you have?", "zh": "你有哪些健康的习惯？"}, {"s": "Mike", "speaker": "Mike", "en": "I ...", "zh": "我……"}, {"s": "Mike", "speaker": "Mike", "en": "Eat healthy food.", "zh": "吃健康的食物。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 4, "unit": "Healthy habits", "title": "Healthy habits", "scene": "Listen, write and say: Sarah and Sam are talking at home.", "function": "请求与应答", "patterns": ["Can I ...?", "No, I'm afraid not.", "You shouldn't ... so often.", "What should I do then?"], "turns": [{"s": "Sam", "speaker": "Sam", "en": "Can I watch a TV show now, please?", "zh": "请问我现在可以看个电视节目吗？"}, {"s": "Sarah", "speaker": "Sarah", "en": "No, I'm afraid not.", "zh": "不，恐怕不行。"}, {"s": "Sam", "speaker": "Sam", "en": "Can I play on Mum's phone?", "zh": "我可以在妈妈的手机上玩吗？"}, {"s": "Sarah", "speaker": "Sarah", "en": "No. You shouldn't play on a phone so often.", "zh": "不。你不应该这么频繁地玩手机。"}, {"s": "Sam", "speaker": "Sam", "en": "What should I do then?", "zh": "那我该做什么呢？"}, {"s": "Sarah", "speaker": "Sarah", "en": "You should rest your eyes. Let's take a walk.", "zh": "你应该让眼睛休息一下。我们去散个步吧。"}, {"s": "Sam", "speaker": "Sam", "en": "That's no fun.", "zh": "那不好玩。"}, {"s": "Sarah", "speaker": "Sarah", "en": "OK. Let's play in the garden then. It's a nice day.", "zh": "好吧。那我们去花园里玩吧。今天天气不错。"}, {"s": "Sam", "speaker": "Sam", "en": "Great!", "zh": "太好了！"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 4, "unit": "Healthy habits", "title": "Healthy habits", "scene": "Let's talk: How can I take care of my teeth?", "function": "询问信息", "patterns": ["How can I take care of my teeth?", "You should ...", "You shouldn't ... so often.", "Don't ..."], "turns": [{"s": "Sam", "speaker": "Sam", "en": "How can I take care of my teeth?", "zh": "我怎样才能保护我的牙齿？"}, {"s": "Sarah", "speaker": "Sarah", "en": "You should eat less candy.", "zh": "你应该少吃糖果。"}, {"s": "Sarah", "speaker": "Sarah", "en": "You shouldn't check your phone so often.", "zh": "你不应该这么频繁地看手机。"}, {"s": "Sam", "speaker": "Sam", "en": "I can't see clearly.", "zh": "我看不太清楚。"}, {"s": "Sam", "speaker": "Sam", "en": "I have a bad tooth.", "zh": "我有一颗坏牙。"}, {"s": "Sam", "speaker": "Sam", "en": "My eyes are tired.", "zh": "我的眼睛很疲劳。"}, {"s": "Sarah", "speaker": "Sarah", "en": "You should rest your eyes.", "zh": "你应该让眼睛休息一下。"}, {"s": "Sarah", "speaker": "Sarah", "en": "You should brush your teeth twice a day.", "zh": "你应该每天刷两次牙。"}, {"s": "Sarah", "speaker": "Sarah", "en": "You should eat less candy.", "zh": "你应该少吃糖果。"}, {"s": "Sarah", "speaker": "Sarah", "en": "Don't check your phone in bed.", "zh": "不要在床上看手机。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 4, "unit": "Healthy habits", "title": "Healthy habits", "scene": "Reading time: Zoom and the speaker", "function": "请求与应答", "patterns": ["You shouldn't ...", "It's not good for ...", "Oh, OK."], "turns": [{"s": "Speaker", "speaker": "Speaker", "en": "You shouldn't eat too much honey, Zoom. It's not good for your teeth.", "zh": "Zoom，你不应该吃太多蜂蜜。这对你的牙齿不好。"}, {"s": "Zoom", "speaker": "Zoom", "en": "Oh, OK.", "zh": "哦，好的。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 5, "unit": "Food we eat", "title": "Food we eat", "scene": "Oliver 在家向妈妈点餐", "function": "请求与应答", "patterns": ["What would you like to eat?", "I'd like ...", "Would you like some ... too?", "Can I have some ...?"], "turns": [{"s": "Oliver", "speaker": "Oliver", "en": "Mum, I'm hungry.", "zh": "妈妈，我饿了。"}, {"s": "Mum", "speaker": "Mum", "en": "What would you like to eat?", "zh": "你想吃什么？"}, {"s": "Oliver", "speaker": "Oliver", "en": "I'd like beef and rice.", "zh": "我想要牛肉和米饭。"}, {"s": "Mum", "speaker": "Mum", "en": "No problem. Would you like some chicken soup too?", "zh": "没问题。你还想要些鸡汤吗？"}, {"s": "Oliver", "speaker": "Oliver", "en": "Yes, please.", "zh": "好的，谢谢。"}, {"s": "Mum", "speaker": "Mum", "en": "You should also have some salad. Vegetables are good for you.", "zh": "你也应该吃点沙拉。蔬菜对你有好处。"}, {"s": "Oliver", "speaker": "Oliver", "en": "OK. Can I have some ice cream, please?", "zh": "好的。我可以吃点冰淇淋吗？"}, {"s": "Mum", "speaker": "Mum", "en": "Yes, but just a little.", "zh": "可以，但只能吃一点。"}, {"s": "Oliver", "speaker": "Oliver", "en": "OK. Thanks, Mum.", "zh": "好的。谢谢妈妈。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 5, "unit": "Food we eat", "title": "Food we eat", "scene": "Zhang Peng 和 Amy 点餐", "function": "请求与应答", "patterns": ["What would you like to eat?", "I'd like ..."], "turns": [{"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "What would you like to eat?", "zh": "你想吃什么？"}, {"s": "Amy", "speaker": "Amy", "en": "I'd like a hamburger and some ice cream.", "zh": "我想要一个汉堡和一些冰淇淋。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 5, "unit": "Food we eat", "title": "Food we eat", "scene": "Mrs Green 和 Binbin 谈论椰子", "function": "询问信息", "patterns": ["What's your favourite fruit?", "Why do you like ...?", "Where does ... come from?", "It comes from ..."], "turns": [{"s": "Mrs Green", "speaker": "Mrs Green", "en": "What's your favourite fruit, Binbin?", "zh": "Binbin，你最喜欢的水果是什么？"}, {"s": "Binbin", "speaker": "Binbin", "en": "Coconuts are my favourite.", "zh": "椰子是我最喜欢的。"}, {"s": "Mrs Green", "speaker": "Mrs Green", "en": "Why do you like coconuts?", "zh": "你为什么喜欢椰子？"}, {"s": "Binbin", "speaker": "Binbin", "en": "Because coconut water is nice. And it's healthy.", "zh": "因为椰子水很好喝，而且很健康。"}, {"s": "Mrs Green", "speaker": "Mrs Green", "en": "We can also cook delicious meals with coconut.", "zh": "我们还可以用椰子做美味的饭菜。"}, {"s": "Binbin", "speaker": "Binbin", "en": "Yes! And some people make houses with coconut tree leaves.", "zh": "是的！而且有些人用椰子树叶盖房子。"}, {"s": "Mrs Green", "speaker": "Mrs Green", "en": "That's interesting. Where does your coconut come from?", "zh": "真有趣。你的椰子是从哪里来的？"}, {"s": "Binbin", "speaker": "Binbin", "en": "Hainan! There are many coconut trees there.", "zh": "海南！那里有很多椰子树。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 5, "unit": "Food we eat", "title": "Food we eat", "scene": "询问椰子水的价格和产地", "function": "购物与价格", "patterns": ["How much is ...?", "It's ... yuan.", "Where does it come from?", "It comes from ..."], "turns": [{"s": "A", "speaker": "A", "en": "How much is the coconut water?", "zh": "椰子水多少钱？"}, {"s": "B", "speaker": "B", "en": "It's 16 yuan.", "zh": "16元。"}, {"s": "A", "speaker": "A", "en": "Where does it come from?", "zh": "它来自哪里？"}, {"s": "B", "speaker": "B", "en": "It comes from Hainan.", "zh": "它来自海南。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 5, "unit": "Food we eat", "title": "Food we eat", "scene": "Zip 谈论茶的产地", "function": "询问信息", "patterns": ["What would you like to eat?", "Where does your ... come from?", "Most of my ... comes from ..."], "turns": [{"s": "A", "speaker": "A", "en": "What would you like to eat?", "zh": "你想吃什么？"}, {"s": "B", "speaker": "B", "en": "Where does your tea come from, Zip?", "zh": "Zip，你的茶来自哪里？"}, {"s": "Zip", "speaker": "Zip", "en": "Most of my tea comes from China!", "zh": "我的茶大部分来自中国！"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 6, "unit": "Nature and us", "title": "Nature and us", "scene": "Mike's family are in a nature park. They are talking with Mr Liu, the tour guide.", "function": "询问信息", "patterns": ["Is there a ...?", "Yes, there is.", "Are there any ...?", "Yes, there are."], "turns": [{"s": "Mike's dad", "speaker": "Mike's dad", "en": "Wow! That lake is really lovely!", "zh": "哇！那个湖真可爱！"}, {"s": "Mr Liu", "speaker": "Mr Liu", "en": "Yes. There are also many rivers in the nature park.", "zh": "是的。自然公园里还有许多河流。"}, {"s": "Mike's dad", "speaker": "Mike's dad", "en": "Is there a waterfall in the forest?", "zh": "森林里有瀑布吗？"}, {"s": "Mr Liu", "speaker": "Mr Liu", "en": "Yes, there is. You'll see a beautiful one today!", "zh": "是的，有。你今天会看到一个美丽的瀑布！"}, {"s": "Mike", "speaker": "Mike", "en": "Great! Are there any famous mountains in the nature park?", "zh": "太棒了！自然公园里有著名的山吗？"}, {"s": "Mr Liu", "speaker": "Mr Liu", "en": "Yes, there are. We'll visit one tomorrow. There are many flowers too. And there are rabbits!", "zh": "是的，有。我们明天会去参观一座。还有许多花。还有兔子！"}, {"s": "Mike", "speaker": "Mike", "en": "That's great!", "zh": "那太棒了！"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 6, "unit": "Nature and us", "title": "Nature and us", "scene": "Mike and his dad are talking about the weather.", "function": "时间与日程", "patterns": ["There will be ...", "I'll ...", "You can ...", "It'll be ..."], "turns": [{"s": "Mr Liu", "speaker": "Mr Liu", "en": "I'm sorry. The wind is very strong outside. We can't go on our trip this morning.", "zh": "对不起。外面风很大。今天上午我们不能去旅行了。"}, {"s": "Mike's mum", "speaker": "Mike's mum", "en": "I agree. Strong winds are often dangerous.", "zh": "我同意。大风通常很危险。"}, {"s": "Mike's dad", "speaker": "Mike's dad", "en": "There will be heavy rain in the afternoon too. Mike, stay in the hotel with Mum and close the windows. I'll go to buy some umbrellas and raincoats.", "zh": "下午也会有大雨。Mike，和妈妈待在酒店里，关上窗户。我去买些雨伞和雨衣。"}, {"s": "Mike's mum", "speaker": "Mike's mum", "en": "There is a small shop in the hotel. You can buy them there.", "zh": "酒店里有个小商店。你可以在那里买。"}, {"s": "Mike's dad", "speaker": "Mike's dad", "en": "OK.", "zh": "好的。"}, {"s": "Mr Liu", "speaker": "Mr Liu", "en": "Please don't worry! It'll be a fine day tomorrow.", "zh": "请不要担心！明天会是好天气。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 6, "unit": "Nature and us", "title": "Nature and us", "scene": "Mike and Mr Liu are talking about bad weather in different seasons.", "function": "描述事物", "patterns": ["Is there any ...?", "Yes. There is ...", "Sometimes there are ...", "Be careful of ..."], "turns": [{"s": "Mike", "speaker": "Mike", "en": "Is there any bad weather here in summer?", "zh": "夏天这里有恶劣天气吗？"}, {"s": "Mr Liu", "speaker": "Mr Liu", "en": "Yes. There is heavy rain. Sometimes there are floods.", "zh": "是的。有大雨。有时还有洪水。"}, {"s": "Mike", "speaker": "Mike", "en": "Autumn is windy. Be careful of fires.", "zh": "秋天风大。小心火灾。"}, {"s": "Mr Liu", "speaker": "Mr Liu", "en": "Sometimes there is heavy snow in winter. It is very cold.", "zh": "冬天有时有大雪。非常冷。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": null, "unit": "New Year's party", "title": "New Year's party", "scene": "New Year's party planning", "function": "请求与应答", "patterns": ["What can you do for the party?", "I can ...", "Let's ... together.", "We can ..."], "turns": [{"s": "Miss White", "speaker": "Miss White", "en": "Children, New Year's Day is coming. Let's have a class party. What can you do for the party?", "zh": "孩子们，新年快到了。我们办一个班级派对吧。你们能为派对做些什么？"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "I can draw pictures.", "zh": "我会画画。"}, {"s": "Binbin", "speaker": "Binbin", "en": "I can choose the music for the party.", "zh": "我可以为派对选音乐。"}, {"s": "Amy", "speaker": "Amy", "en": "Let's play the piano together, John.", "zh": "我们一起弹钢琴吧，John。"}, {"s": "John", "speaker": "John", "en": "Great idea!", "zh": "好主意！"}, {"s": "Miss White", "speaker": "Miss White", "en": "Wonderful!", "zh": "太棒了！"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "Oliver and I are in the Cooking Club. We can make some food for the party.", "zh": "Oliver 和我在烹饪俱乐部。我们可以为派对做一些食物。"}, {"s": "Mike", "speaker": "Mike", "en": "Sarah, Liu Jia and I are in the Drama Club. We can put on a play.", "zh": "Sarah、刘佳和我在戏剧俱乐部。我们可以演一出戏。"}, {"s": "Binbin", "speaker": "Binbin", "en": "I want to tell a story.", "zh": "我想讲一个故事。"}, {"s": "Miss White", "speaker": "Miss White", "en": "It's time for English class. Let's talk about it later.", "zh": "该上英语课了。我们以后再聊。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": null, "unit": "Songs", "title": "Songs", "scene": "Unit 1 My friends", "function": "描述事物", "patterns": ["My best friend is ...", "I think he's different.", "There is no doubt.", "He's so different. Yes, he is."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "My best friend is clever.", "zh": "我最好的朋友很聪明。"}, {"s": "Chant", "speaker": "Chant", "en": "Let me say it aloud.", "zh": "让我大声说出来。"}, {"s": "Chant", "speaker": "Chant", "en": "I think he's different.", "zh": "我觉得他很特别。"}, {"s": "Chant", "speaker": "Chant", "en": "There is no doubt.", "zh": "毫无疑问。"}, {"s": "Chant", "speaker": "Chant", "en": "He plays me the pipa. He plays very loud.", "zh": "他给我弹琵琶，弹得很响。"}, {"s": "Chant", "speaker": "Chant", "en": "He's so different. Yes, he is.", "zh": "他很特别。是的，他是。"}, {"s": "Chant", "speaker": "Chant", "en": "My good friend is so lovely.", "zh": "我的好朋友很可爱。"}, {"s": "Chant", "speaker": "Chant", "en": "Let me say it aloud.", "zh": "让我大声说出来。"}, {"s": "Chant", "speaker": "Chant", "en": "I think she's different.", "zh": "我觉得她很特别。"}, {"s": "Chant", "speaker": "Chant", "en": "There is no doubt.", "zh": "毫无疑问。"}, {"s": "Chant", "speaker": "Chant", "en": "She helps many people. I'm so proud.", "zh": "她帮助很多人，我很自豪。"}, {"s": "Chant", "speaker": "Chant", "en": "She's so different. Yes, she is.", "zh": "她很特别。是的，她是。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": null, "unit": "Songs", "title": "Songs", "scene": "Unit 2 My friend Sam is angry", "function": "感受与情绪", "patterns": ["My friend Sam is ...", "Yes, he is, he is.", "He's having a ... day.", "My friend Sam's ... is ..."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "My friend Sam is angry.", "zh": "我的朋友萨姆很生气。"}, {"s": "Chant", "speaker": "Chant", "en": "Yes, he is, he is.", "zh": "是的，他是，他是。"}, {"s": "Chant", "speaker": "Chant", "en": "My friend Sam is sad. Oh yes, he is.", "zh": "我的朋友萨姆很难过。哦是的，他是。"}, {"s": "Chant", "speaker": "Chant", "en": "My friend Sam's dog is sick.", "zh": "萨姆的狗生病了。"}, {"s": "Chant", "speaker": "Chant", "en": "His dad's away.", "zh": "他爸爸不在家。"}, {"s": "Chant", "speaker": "Chant", "en": "He's having a horrible day.", "zh": "他今天过得很糟糕。"}, {"s": "Chant", "speaker": "Chant", "en": "My friend Sam's so unhappy.", "zh": "我的朋友萨姆很不开心。"}, {"s": "Chant", "speaker": "Chant", "en": "Yes, he is, he is.", "zh": "是的，他是，他是。"}, {"s": "Chant", "speaker": "Chant", "en": "My friend Sam is happy again.", "zh": "我的朋友萨姆又开心了。"}, {"s": "Chant", "speaker": "Chant", "en": "Yes, he is, he is.", "zh": "是的，他是，他是。"}, {"s": "Chant", "speaker": "Chant", "en": "My friend Sam's excited. Oh yes, he is.", "zh": "我的朋友萨姆很兴奋。哦是的，他是。"}, {"s": "Chant", "speaker": "Chant", "en": "My friend Sam's dog is well.", "zh": "萨姆的狗好了。"}, {"s": "Chant", "speaker": "Chant", "en": "His dad's come home to play.", "zh": "他爸爸回家陪他玩了。"}, {"s": "Chant", "speaker": "Chant", "en": "He's having a great day.", "zh": "他今天过得很棒。"}, {"s": "Chant", "speaker": "Chant", "en": "Sam is very happy.", "zh": "萨姆非常开心。"}, {"s": "Chant", "speaker": "Chant", "en": "Yes, he is, he is.", "zh": "是的，他是，他是。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": null, "unit": "Songs", "title": "Songs", "scene": "Unit 3 Going to school", "function": "其他", "patterns": ["Go, go, go to school.", "It's a place to ...", "There's so much to ...", "We're happy every day."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "Go, go, go to school.", "zh": "走，走，去上学。"}, {"s": "Chant", "speaker": "Chant", "en": "It's a place to learn.", "zh": "那是学习的地方。"}, {"s": "Chant", "speaker": "Chant", "en": "Study English, read and write.", "zh": "学英语，读和写。"}, {"s": "Chant", "speaker": "Chant", "en": "There's so much to learn.", "zh": "有很多东西要学。"}, {"s": "Chant", "speaker": "Chant", "en": "Go, go, go to school.", "zh": "走，走，去上学。"}, {"s": "Chant", "speaker": "Chant", "en": "It's a place to play.", "zh": "那是玩耍的地方。"}, {"s": "Chant", "speaker": "Chant", "en": "See your friends, and do some sports.", "zh": "见见朋友，做做运动。"}, {"s": "Chant", "speaker": "Chant", "en": "We're happy every day.", "zh": "我们每天都开心。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": null, "unit": "Songs", "title": "Songs", "scene": "Unit 4 Good habits", "function": "其他", "patterns": ["Do it every day.", "Study hard and exercise.", "And don't forget to play.", "Brush your teeth."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "Brush your teeth.", "zh": "刷牙。"}, {"s": "Chant", "speaker": "Chant", "en": "Wash your face.", "zh": "洗脸。"}, {"s": "Chant", "speaker": "Chant", "en": "Do it every day.", "zh": "每天都做。"}, {"s": "Chant", "speaker": "Chant", "en": "Study hard and exercise.", "zh": "努力学习并锻炼。"}, {"s": "Chant", "speaker": "Chant", "en": "And don't forget to play.", "zh": "别忘了玩耍。"}, {"s": "Chant", "speaker": "Chant", "en": "Hey!", "zh": "嘿！"}, {"s": "Chant", "speaker": "Chant", "en": "Sleep enough.", "zh": "睡足觉。"}, {"s": "Chant", "speaker": "Chant", "en": "Eat good food.", "zh": "吃健康的食物。"}, {"s": "Chant", "speaker": "Chant", "en": "Do it every day.", "zh": "每天都做。"}, {"s": "Chant", "speaker": "Chant", "en": "Study hard and exercise.", "zh": "努力学习并锻炼。"}, {"s": "Chant", "speaker": "Chant", "en": "And don't forget to play.", "zh": "别忘了玩耍。"}, {"s": "Chant", "speaker": "Chant", "en": "Hey!", "zh": "嘿！"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": null, "unit": "Songs", "title": "Songs", "scene": "Unit 5 Eat and drink", "function": "邀请与建议", "patterns": ["Let's eat ...", "Let's all eat now.", "We can drink some ...", "Let's all drink now."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "Let's eat chicken and rice.", "zh": "我们吃鸡肉和米饭吧。"}, {"s": "Chant", "speaker": "Chant", "en": "Let's eat ice cream and cake.", "zh": "我们吃冰淇淋和蛋糕吧。"}, {"s": "Chant", "speaker": "Chant", "en": "Let's eat noodles and beef.", "zh": "我们吃面条和牛肉吧。"}, {"s": "Chant", "speaker": "Chant", "en": "Let's all eat now.", "zh": "我们现在一起吃吧。"}, {"s": "Chant", "speaker": "Chant", "en": "And we can drink some milk.", "zh": "我们可以喝些牛奶。"}, {"s": "Chant", "speaker": "Chant", "en": "And we can drink some tea.", "zh": "我们可以喝些茶。"}, {"s": "Chant", "speaker": "Chant", "en": "We can drink some water.", "zh": "我们可以喝些水。"}, {"s": "Chant", "speaker": "Chant", "en": "Let's all drink now.", "zh": "我们现在一起喝吧。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": null, "unit": "Songs", "title": "Songs", "scene": "Unit 6 Beautiful nature", "function": "描述事物", "patterns": ["There is a ...", "There are ...", "... so ...", "Nature has many things to see."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "Up in the mountain,", "zh": "在山上，"}, {"s": "Chant", "speaker": "Chant", "en": "The mountain so high.", "zh": "山那么高。"}, {"s": "Chant", "speaker": "Chant", "en": "There is a waterfall,", "zh": "有一个瀑布，"}, {"s": "Chant", "speaker": "Chant", "en": "Touching the sky.", "zh": "触碰到天空。"}, {"s": "Chant", "speaker": "Chant", "en": "Deep in the forest,", "zh": "在森林深处，"}, {"s": "Chant", "speaker": "Chant", "en": "The forest so low.", "zh": "森林那么低。"}, {"s": "Chant", "speaker": "Chant", "en": "There are flowers,", "zh": "有花朵，"}, {"s": "Chant", "speaker": "Chant", "en": "Starting to grow.", "zh": "开始生长。"}, {"s": "Chant", "speaker": "Chant", "en": "Nature has many things to see.", "zh": "大自然有很多东西可以看。"}, {"s": "Chant", "speaker": "Chant", "en": "There are high mountains, waterfalls and trees!", "zh": "有高山、瀑布和树木！"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": null, "unit": "Useful expressions", "title": "Useful expressions", "scene": "Unit 2", "function": "询问信息", "patterns": ["What's your favourite day at school?", "What do you have on Wednesdays?", "What do you usually do at the weekend?", "Does your mother work on both Saturdays and Sundays?"], "turns": [{"s": "A", "speaker": "A", "en": "What's your favourite day at school, John?", "zh": "你在学校最喜欢哪一天，约翰？"}, {"s": "B", "speaker": "B", "en": "What do you have on Wednesdays?", "zh": "星期三你有什么课？"}, {"s": "A", "speaker": "A", "en": "I have Chinese, maths, music and PE.", "zh": "我有语文课、数学课、音乐课和体育课。"}, {"s": "A", "speaker": "A", "en": "What do you usually do at the weekend, children?", "zh": "孩子们，周末你们通常做什么？"}, {"s": "B", "speaker": "B", "en": "I often play football. Sometimes I play Chinese chess with my father.", "zh": "我经常踢足球。有时我和爸爸下象棋。"}, {"s": "A", "speaker": "A", "en": "Does your mother work on both Saturdays and Sundays?", "zh": "你妈妈周六周日都工作吗？"}, {"s": "B", "speaker": "B", "en": "Yes, she does.", "zh": "是的，她（周末两天）都工作。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": null, "unit": "Useful expressions", "title": "Useful expressions", "scene": "Unit 3", "function": "描述事物", "patterns": ["What's he like?", "Is he good at football?", "What can you do for the festival?", "Can you make robots?"], "turns": [{"s": "A", "speaker": "A", "en": "What's he like?", "zh": "他什么样？"}, {"s": "B", "speaker": "B", "en": "He's tall and strong.", "zh": "他又高又壮。"}, {"s": "A", "speaker": "A", "en": "Is he good at football?", "zh": "他擅长踢足球吗？"}, {"s": "B", "speaker": "B", "en": "Yes, I think he is.", "zh": "是的，我想他擅长。"}, {"s": "A", "speaker": "A", "en": "What can you do for the festival?", "zh": "你能为科学艺术节做什么？"}, {"s": "B", "speaker": "B", "en": "I can make a robot.", "zh": "我能制作机器人。"}, {"s": "A", "speaker": "A", "en": "Can you make robots, Sarah?", "zh": "萨拉，你能制作机器人吗？"}, {"s": "B", "speaker": "B", "en": "No, I can't.", "zh": "不，我不能。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": null, "unit": "Useful expressions", "title": "Useful expressions", "scene": "Unit 1", "function": "邀请与建议", "patterns": ["Why not do both?", "It's important to listen to each other.", "I need to talk to ..."], "turns": [{"s": "A", "speaker": "A", "en": "Why not do both?", "zh": "为什么不两个活动都做呢？"}, {"s": "B", "speaker": "B", "en": "It's important to listen to each other.", "zh": "听取彼此的想法很重要。"}, {"s": "A", "speaker": "A", "en": "Yes, Miss White. I need to talk to Mike.", "zh": "是的，怀特老师。我需要和迈克谈谈。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": null, "unit": "Useful expressions", "title": "Useful expressions", "scene": "Appendix 4", "function": "购物与价格", "patterns": ["What would you like to eat?", "I'd like ...", "Would you like some ... too?", "Where does your ... come from?"], "turns": [{"s": "A", "speaker": "A", "en": "What would you like to eat?", "zh": "你想吃些什么？"}, {"s": "B", "speaker": "B", "en": "I'd like beef and rice.", "zh": "我想吃牛肉和米饭。"}, {"s": "A", "speaker": "A", "en": "Would you like some chicken soup too?", "zh": "你还想喝鸡汤吗？"}, {"s": "B", "speaker": "B", "en": "Yes, please.", "zh": "是的，请（给我鸡汤）。"}, {"s": "A", "speaker": "A", "en": "Where does your coconut come from?", "zh": "你的椰子是哪里的？"}, {"s": "B", "speaker": "B", "en": "Hainan!", "zh": "海南！"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": null, "unit": "Useful expressions", "title": "Useful expressions", "scene": "Unit 6", "function": "询问信息", "patterns": ["Is there a ...?", "Are there any ...?", "Yes, there is.", "Yes, there are."], "turns": [{"s": "A", "speaker": "A", "en": "Is there a waterfall in the forest?", "zh": "森林里有瀑布吗？"}, {"s": "B", "speaker": "B", "en": "Yes, there is.", "zh": "是的，这里有。"}, {"s": "A", "speaker": "A", "en": "Are there any famous mountains in the nature park?", "zh": "自然公园有名山吗？"}, {"s": "B", "speaker": "B", "en": "Yes, there are.", "zh": "是的，这里有。"}]}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": null, "unit": "Useful expressions", "title": "Useful expressions", "scene": "Unit 4", "function": "请求与应答", "patterns": ["How can we all stay healthy?", "We should ...", "Can I ...?", "You shouldn't ..."], "turns": [{"s": "A", "speaker": "A", "en": "How can we all stay healthy?", "zh": "我们怎样才能保持健康？"}, {"s": "B", "speaker": "B", "en": "We should eat healthy food.", "zh": "我们应该吃健康的食物。"}, {"s": "A", "speaker": "A", "en": "Can I play on Mum's phone?", "zh": "我可以玩玩妈妈的手机吗？"}, {"s": "B", "speaker": "B", "en": "No. You shouldn't play on a phone so often.", "zh": "不行。你不应总是玩手机。"}]}, {"book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 1, "unit": "My day", "title": "My day", "scene": "A Let's talk", "function": "询问信息", "patterns": ["When do you finish class in the morning?", "We finish class at 1 o’clock.", "When do you go back to school after lunch?", "When do you usually eat dinner in Spain?"], "turns": [{"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "When do you finish class in the morning?", "zh": "你早上什么时候下课？"}, {"s": "Pedro", "speaker": "Pedro", "en": "We finish class at 1 o’clock. Then we eat lunch at home.", "zh": "我们1点下课。然后我们在家吃午饭。"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "Wow! When do you go back to school after lunch?", "zh": "哇！午饭后你们什么时候回学校？"}, {"s": "Pedro", "speaker": "Pedro", "en": "At 2:30. Classes start at 3 o’clock.", "zh": "2点半。3点开始上课。"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "When do you usually eat dinner in Spain?", "zh": "在西班牙你们通常什么时候吃晚饭？"}, {"s": "Pedro", "speaker": "Pedro", "en": "Usually at 9:30 or 10 o’clock.", "zh": "通常9点半或10点。"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "Wow! That’s too late!", "zh": "哇！那太晚了！"}], "topic": "My day", "theme": "人与自我"}, {"book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 1, "unit": "My day", "title": "My day", "scene": "A Let's try", "function": "询问信息", "patterns": ["When do you get up?", "I get up at 6:00 a.m.", "When do you go to bed?", "At 6 o’clock in the morning."], "turns": [{"s": "A", "speaker": "A", "en": "When do you get up?", "zh": "你什么时候起床？"}, {"s": "B", "speaker": "B", "en": "I get up at 6:00 a.m.", "zh": "我早上6点起床。"}, {"s": "A", "speaker": "A", "en": "When do you go to bed?", "zh": "你什么时候睡觉？"}, {"s": "B", "speaker": "B", "en": "At 6 o’clock in the morning.", "zh": "早上6点。"}, {"s": "B", "speaker": "B", "en": "I work at night.", "zh": "我晚上工作。"}], "topic": "My day", "theme": "人与自我"}, {"book": "五年级下册", "grade": "五年级", "term": "下册", "unit_no": 1, "unit": "My day", "title": "My day", "scene": "B Let's talk", "function": "询问信息", "patterns": ["Why are you shopping today?", "So what do you do on the weekend?", "I often watch TV and play ping-pong with my father.", "I usually wash my clothes."], "turns": [{"s": "Shopkeeper", "speaker": "Shopkeeper", "en": "Why are you shopping toda ood. Take care and get well soon!", "zh": "那很好。保重，早日康复！"}, {"s": "Mike", "speaker": "Mike", "en": "Thanks.", "zh": "谢谢。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 3, "unit": "Healthy life", "title": "Healthy life", "scene": "Let's talk: How do we know we are ill?", "function": "询问信息", "patterns": ["What's the matter?", "I have a bad cold.", "I have a runny nose.", "You should ..."], "turns": [{"s": "A", "speaker": "A", "en": "What's the matter?", "zh": "怎么了？"}, {"s": "B", "speaker": "B", "en": "I have a bad cold. And I have a runny nose.", "zh": "我得了重感冒。而且我流鼻涕。"}, {"s": "A", "speaker": "A", "en": "You should ...", "zh": "你应该……"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 3, "unit": "Healthy life", "title": "Healthy life", "scene": "Miss White and students discuss health.", "function": "描述事物", "patterns": ["What is health?", "How can we live a healthy life?", "We need to eat healthy food.", "We should exercise too."], "turns": [{"s": "Miss White", "speaker": "Miss White", "en": "Class, now we're going to discuss health. First, what is health?", "zh": "同学们，现在我们要讨论健康。首先，什么是健康？"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "Health is having a good body and feeling happy.", "zh": "健康就是身体好并且感到快乐。"}, {"s": "Miss White", "speaker": "Miss White", "en": "Thank you, Chen Jie. So, how can we live a healthy life?", "zh": "谢谢你，Chen Jie。那么，我们怎样才能过上健康的生活？"}, {"s": "Sarah", "speaker": "Sarah", "en": "We need to eat healthy food. We should exercise too.", "zh": "我们需要吃健康的食物。我们也应该锻炼。"}, {"s": "Miss White", "speaker": "Miss White", "en": "That's right. What do you think, Binbin?", "zh": "没错。Binbin，你怎么看？"}, {"s": "Binbin", "speaker": "Binbin", "en": "I think our family and friends are also very important.", "zh": "我认为我们的家人和朋友也非常重要。"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "Yes, it's always good to talk to our family and friends.", "zh": "是的，和家人朋友聊天总是好的。"}, {"s": "Miss White", "speaker": "Miss White", "en": "Good job, everyone!", "zh": "大家做得好！"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 3, "unit": "Healthy life", "title": "Healthy life", "scene": "Liu Jia and Miss White talk about feelings.", "function": "感受与情绪", "patterns": ["What's the matter?", "I'm feeling down.", "You should think about happy things.", "You can do some exercise."], "turns": [{"s": "Miss White", "speaker": "Miss White", "en": "What's the matter, Liu Jia? You look sad.", "zh": "怎么了，Liu Jia？你看起来很伤心。"}, {"s": "Liu Jia", "speaker": "Liu Jia", "en": "I'm feeling down. My good friend Lucy moved to another city.", "zh": "我感到很沮丧。我的好朋友Lucy搬到了另一个城市。"}, {"s": "Miss White", "speaker": "Miss White", "en": "Think about happy things. Call your friend or send her some emails.", "zh": "想想开心的事。给你的朋友打电话或给她发些邮件。"}, {"s": "Liu Jia", "speaker": "Liu Jia", "en": "I tried that, but I still feel unhappy.", "zh": "我试过了，但我还是感到不开心。"}, {"s": "Miss White", "speaker": "Miss White", "en": "Maybe you can do some exercise. Exercise may cheer you up!", "zh": "也许你可以做些运动。运动可能会让你振作起来！"}, {"s": "Miss White", "speaker": "Miss White", "en": "Join some after-school clubs and make new friends! You can talk and have fun with them.", "zh": "加入一些课外俱乐部，结交新朋友！你可以和他们聊天、一起玩。"}, {"s": "Liu Jia", "speaker": "Liu Jia", "en": "I will try. Thank you, Miss White.", "zh": "我会试试的。谢谢你，White老师。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 4, "unit": "Managing money well", "title": "Managing money well", "scene": "Mike 和 Matt 谈论 Matt 的零花钱及打算怎么花", "function": "询问信息", "patterns": ["Are you counting your pocket money?", "How are you going to spend it?", "I'm going to buy ...", "I also want to buy ..."], "turns": [{"s": "Mike", "speaker": "Mike", "en": "Are you counting your pocket money, Matt?", "zh": "Matt，你在数你的零花钱吗？"}, {"s": "Matt", "speaker": "Matt", "en": "Yes. I have three hundred and fifty-seven yuan.", "zh": "是的。我有三百五十七元。"}, {"s": "Mike", "speaker": "Mike", "en": "Wow, that's a lot! How are you going to spend it?", "zh": "哇，好多啊！你打算怎么花？"}, {"s": "Matt", "speaker": "Matt", "en": "I'm going to buy a schoolbag.", "zh": "我打算买一个书包。"}, {"s": "Mike", "speaker": "Mike", "en": "Yes, you need a new one.", "zh": "是的，你需要一个新的。"}, {"s": "Matt", "speaker": "Matt", "en": "I also want to buy some animal books.", "zh": "我还想买一些动物书。"}, {"s": "Mike", "speaker": "Mike", "en": "Nice. They're interesting.", "zh": "不错。它们很有趣。"}, {"s": "Matt", "speaker": "Matt", "en": "Maybe I can also buy some ice cream.", "zh": "也许我还可以买一些冰淇淋。"}, {"s": "Mike", "speaker": "Mike", "en": "Sure, but don't eat too much.", "zh": "当然，但别吃太多。"}, {"s": "Matt", "speaker": "Matt", "en": "Don't worry. I won't.", "zh": "别担心。我不会的。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 4, "unit": "Managing money well", "title": "Managing money well", "scene": "Mum 和 Sarah 谈论 Sarah 的零花钱及购物计划", "function": "询问信息", "patterns": ["How much pocket money do you have?", "What else are you going to buy?", "I'm going to buy ...", "Maybe you can wait for a sale!"], "turns": [{"s": "Mum", "speaker": "Mum", "en": "How much pocket money do you have?", "zh": "你有多少零花钱？"}, {"s": "Sarah", "speaker": "Sarah", "en": "I have one hundred and forty-six yuan.", "zh": "我有一百四十六元。"}, {"s": "Mum", "speaker": "Mum", "en": "What else are you going to buy?", "zh": "你还打算买什么？"}, {"s": "Sarah", "speaker": "Sarah", "en": "A lot. But first I'm going to buy a pair of sunglasses for Grandpa.", "zh": "很多。但首先我打算给爷爷买一副太阳镜。"}, {"s": "Mum", "speaker": "Mum", "en": "That's so nice of you!", "zh": "你真好！"}, {"s": "Sarah", "speaker": "Sarah", "en": "I also want to buy a microscope.", "zh": "我还想买一台显微镜。"}, {"s": "Mum", "speaker": "Mum", "en": "Good idea! But microscopes are expensive.", "zh": "好主意！但显微镜很贵。"}, {"s": "Sarah", "speaker": "Sarah", "en": "I have some lucky money from the Spring Festival, but I still need to save more.", "zh": "我有春节的一些压岁钱，但我还需要再存一些。"}, {"s": "Mum", "speaker": "Mum", "en": "Maybe you can wait for a sale!", "zh": "也许你可以等打折！"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 5, "unit": "Exploring space", "title": "Exploring space", "scene": "Mr Liu 与孩子们在课堂上讨论天空与外太空", "function": "描述事物", "patterns": ["What can you see in the sky?", "We can see ...", "What can we see from outer space?", "It looks like ..."], "turns": [{"s": "Mr Liu", "speaker": "Mr Liu", "en": "Hi, children. Let's talk about our planet Earth.", "zh": "嗨，孩子们。我们来谈谈我们的地球。"}, {"s": "Mr Liu", "speaker": "Mr Liu", "en": "What can you see in the sky?", "zh": "你们能在天空中看到什么？"}, {"s": "Mike", "speaker": "Mike", "en": "The sky is often blue in the daytime. We can see the Sun and clouds. We can also see birds and planes.", "zh": "白天天空通常是蓝色的。我们可以看到太阳和云。我们还可以看到鸟和飞机。"}, {"s": "Amy", "speaker": "Amy", "en": "At night, we can see the Moon and the stars.", "zh": "晚上，我们可以看到月亮和星星。"}, {"s": "Mr Liu", "speaker": "Mr Liu", "en": "Very good. But what can we see from outer space? Let's look at some photos from a space station.", "zh": "很好。但是从外太空我们可以看到什么？我们来看看一些来自空间站的照片。"}, {"s": "Binbin", "speaker": "Binbin", "en": "Wow! We can see mountains, oceans and clouds.", "zh": "哇！我们可以看到山脉、海洋和云。"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "There are large oceans on Earth. It looks like a big blue marble.", "zh": "地球上有大片海洋。它看起来像一颗巨大的蓝色弹珠。"}, {"s": "Mike", "speaker": "Mike", "en": "It's so beautiful. I want to know more about our Mother Earth!", "zh": "太美了。我想知道更多关于我们的地球母亲的事情！"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 5, "unit": "Exploring space", "title": "Exploring space", "scene": "Mike、Chen Jie 和 Oliver 讨论关于火星的杂志", "function": "询问信息", "patterns": ["What are you reading about?", "Is there any ...?", "Yes, there is.", "I don't think so."], "turns": [{"s": "Mike", "speaker": "Mike", "en": "Hey, Chen Jie. What are you reading about?", "zh": "嘿，陈杰。你在读什么？"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "Mars.", "zh": "火星。"}, {"s": "Oliver", "speaker": "Oliver", "en": "Mars? What does it say?", "zh": "火星？上面写了什么？"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "It talks about things on Mars.", "zh": "它讲的是火星上的事物。"}, {"s": "Oliver", "speaker": "Oliver", "en": "Wow! Is there any water on Mars?", "zh": "哇！火星上有水吗？"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "Yes, there is. There is soil too.", "zh": "是的，有。也有土壤。"}, {"s": "Oliver", "speaker": "Oliver", "en": "Oh! Are there any aliens?", "zh": "哦！有外星人吗？"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "I don't think so. They say there aren't any living things.", "zh": "我不这么认为。他们说没有任何生物。"}, {"s": "Oliver", "speaker": "Oliver", "en": "I see.", "zh": "我明白了。"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "Look! This is the sunrise on Mars.", "zh": "看！这是火星上的日出。"}, {"s": "Mike", "speaker": "Mike", "en": "How beautiful! I really want to travel to Mars.", "zh": "多美啊！我真的想去火星旅行。"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "Maybe you can go one day. China put a rover on Mars. We learn more about the \"red planet\" every year.", "zh": "也许有一天你可以去。中国在火星上放置了探测器。我们每年都会对“红色星球”了解更多。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 6, "unit": "Energy, nature and us", "title": "Energy, nature and us", "scene": "Binbin 和 Mike 讨论项目选题", "function": "邀请与建议", "patterns": ["Any ideas about ...?", "Maybe we can ...", "Let's find out more about ...", "Let's go to the library."], "turns": [{"s": "Binbin", "speaker": "Binbin", "en": "Hi, Mike. Any ideas about our project?", "zh": "嗨，Mike。关于我们的项目有什么想法吗？"}, {"s": "Mike", "speaker": "Mike", "en": "Maybe we can talk about water power.", "zh": "也许我们可以谈谈水力发电。"}, {"s": "Binbin", "speaker": "Binbin", "en": "OK. We use water every day. Let's find out more about water power.", "zh": "好的。我们每天都用水。让我们多了解一些水力发电吧。"}, {"s": "Mike", "speaker": "Mike", "en": "What do you know about it?", "zh": "你对它了解多少？"}, {"s": "Binbin", "speaker": "Binbin", "en": "Running water can make electricity. We can get power from the sea too.", "zh": "流动的水可以发电。我们也可以从海里获取能源。"}, {"s": "Mike", "speaker": "Mike", "en": "What else do you want to know about water?", "zh": "关于水你还想知道什么？"}, {"s": "Binbin", "speaker": "Binbin", "en": "Well, where does water come from? How do we make power from water?", "zh": "嗯，水从哪里来？我们怎样用水发电？"}, {"s": "Mike", "speaker": "Mike", "en": "Good questions. Let's go to the library. We can work on it together.", "zh": "好问题。我们去图书馆吧。我们可以一起研究。"}, {"s": "Binbin", "speaker": "Binbin", "en": "Good idea!", "zh": "好主意！"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": 6, "unit": "Energy, nature and us", "title": "Energy, nature and us", "scene": "Mrs Green 与 Binbin、Mike 讨论如何节约能源", "function": "请求与应答", "patterns": ["What should we do?", "We should ...", "How can we ...?", "We can ..."], "turns": [{"s": "Mrs Green", "speaker": "Mrs Green", "en": "We use energy every day. But many resources are running out. What should we do?", "zh": "我们每天都使用能源。但许多资源正在枯竭。我们该怎么办？"}, {"s": "Mike", "speaker": "Mike", "en": "We should save energy.", "zh": "我们应该节约能源。"}, {"s": "Mrs Green", "speaker": "Mrs Green", "en": "Yes, but how can we save energy?", "zh": "是的，但我们怎样才能节约能源？"}, {"s": "Binbin", "speaker": "Binbin", "en": "We can change our energy use.", "zh": "我们可以改变我们的能源使用方式。"}, {"s": "Mrs Green", "speaker": "Mrs Green", "en": "Can you give us an example, Binbin?", "zh": "你能给我们举个例子吗，Binbin？"}, {"s": "Binbin", "speaker": "Binbin", "en": "Sure. We can take quick showers. That will save energy and water.", "zh": "当然。我们可以快速洗澡。这样可以节约能源和水。"}, {"s": "Mike", "speaker": "Mike", "en": "I agree. We can also use LED lighting.", "zh": "我同意。我们还可以使用 LED 照明。"}, {"s": "Binbin", "speaker": "Binbin", "en": "And we should always unplug our computers and TVs.", "zh": "而且我们应该总是拔掉电脑和电视的插头。"}, {"s": "Mrs Green", "speaker": "Mrs Green", "en": "Great! Small changes can make a big difference.", "zh": "太棒了！小小的改变可以带来很大的不同。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": null, "unit": "Learning in museums", "title": "Learning in museums", "scene": "Miss White 与学生们讨论学习博物馆", "function": "询问信息", "patterns": ["What do you want to learn about?", "I want to know about ...", "I want to learn more about ...", "Which museums do you want to visit?"], "turns": [{"s": "Miss White", "speaker": "Miss White", "en": "What do you want to learn about, children?", "zh": "孩子们，你们想学习什么？"}, {"s": "Binbin", "speaker": "Binbin", "en": "I want to know about space and planets.", "zh": "我想知道关于太空和行星的知识。"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "I want to learn more about staying healthy.", "zh": "我想更多地了解如何保持健康。"}, {"s": "Mike", "speaker": "Mike", "en": "I want to know more about Chinese festivals.", "zh": "我想更多地了解中国的节日。"}, {"s": "Miss White", "speaker": "Miss White", "en": "Those are great ideas! What can help you learn about these things?", "zh": "这些都是很棒的想法！什么可以帮助你们学习这些内容？"}, {"s": "Chen Jie", "speaker": "Chen Jie", "en": "We can read books or use the internet.", "zh": "我们可以读书或使用互联网。"}, {"s": "Mike", "speaker": "Mike", "en": "We can travel to different places.", "zh": "我们可以去不同的地方旅行。"}, {"s": "Miss White", "speaker": "Miss White", "en": "That's right. We can also learn in museums. This week, we're going to plan some museum trips.", "zh": "没错。我们也可以在博物馆里学习。这周，我们要计划一些博物馆之旅。"}, {"s": "Students", "speaker": "Students", "en": "Great!", "zh": "太棒了！"}, {"s": "Miss White", "speaker": "Miss White", "en": "Which museums do you want to visit? How much money do you need? Think about these questions and make a plan.", "zh": "你们想去参观哪些博物馆？需要多少钱？思考这些问题并制定一个计划。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": null, "unit": "Learning in museums", "title": "Learning in museums", "scene": "Zhang Peng 和 Sarah 讨论博物馆旅行计划", "function": "询问信息", "patterns": ["Do you have a plan for ...?", "I'm going to visit ...", "That's a good idea!", "I have ... yuan."], "turns": [{"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "Do you have a plan for your museum trip?", "zh": "你有博物馆旅行的计划吗？"}, {"s": "Sarah", "speaker": "Sarah", "en": "Yes, I'm going to visit some museums online.", "zh": "是的，我打算在线参观一些博物馆。"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "That's a good idea!", "zh": "这是个好主意！"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "I'm going to visit the China Great Wall Museum.", "zh": "我打算去参观中国长城博物馆。"}, {"s": "Sarah", "speaker": "Sarah", "en": "Wow! But it's very far.", "zh": "哇！但是它很远。"}, {"s": "Zhang Peng", "speaker": "Zhang Peng", "en": "I have 100 yuan. The museum is free. But I need to take a bus and buy some food and drink. Before that, I want to look good in my photos.", "zh": "我有100元。博物馆是免费的。但我需要坐公交车并买一些食物和饮料。在那之前，我想在照片里看起来好看。"}, {"s": "Sarah", "speaker": "Sarah", "en": "Ha! Ha! I want to see your photos.", "zh": "哈哈！我想看你的照片。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": null, "unit": "Learning in museums", "title": "Learning in museums", "scene": "记者采访 Binbin 和 John 关于博物馆参观", "function": "询问信息", "patterns": ["What did you see in the museum?", "Did you see any other interesting things there?", "What did you like about the museum?", "I saw ..."], "turns": [{"s": "Reporter", "speaker": "Reporter", "en": "What did you see in the museum?", "zh": "你们在博物馆里看到了什么？"}, {"s": "Binbin", "speaker": "Binbin", "en": "I saw a big spaceship. I also went into a mini space station.", "zh": "我看到了一艘大宇宙飞船。我还进入了一个迷你空间站。"}, {"s": "Reporter", "speaker": "Reporter", "en": "Did you see any other interesting things there?", "zh": "你们在那里还看到其他有趣的东西吗？"}, {"s": "John", "speaker": "John", "en": "Yes. A robot dressed in a Tang suit. She pasted fu on the door.", "zh": "是的。一个穿着唐装的机器人。她在门上贴了福字。"}, {"s": "Reporter", "speaker": "Reporter", "en": "What did you like about the museum?", "zh": "你们喜欢博物馆的什么？"}, {"s": "John", "speaker": "John", "en": "We watched a short play about Chang'e and Houyi. Then we saw another amazing robot. He gave us a speech.", "zh": "我们看了一出关于嫦娥和后羿的短剧。然后我们看到了另一个神奇的机器人。他给我们做了一场演讲。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": null, "unit": "Learning in museums", "title": "Learning in museums", "scene": "后羿与玉兔在月宫对话", "function": "问候与介绍", "patterns": ["How did you get to ...?", "What did you do here?", "What did you do on Earth?", "How is ...?"], "turns": [{"s": "Narrator", "speaker": "Narrator", "en": "It was the Mid-Autumn Festival. On the Moon, the Rabbit ran and jumped. Then he saw a big spaceship in the sky!", "zh": "那是中秋节。在月球上，玉兔跑着跳着。然后他看到天空中有一艘大宇宙飞船！"}, {"s": "Chang'e", "speaker": "Chang'e", "en": "How did you get to the Moon?", "zh": "你是怎么到月球的？"}, {"s": "Houyi", "speaker": "Houyi", "en": "A spaceship brought me here. We have great spaceships in China.", "zh": "一艘宇宙飞船把我带到了这里。我们中国有伟大的宇宙飞船。"}, {"s": "Chang'e", "speaker": "Chang'e", "en": "Wow!", "zh": "哇！"}, {"s": "Houyi", "speaker": "Houyi", "en": "Chang'e, you came to the Moon so long ago. What did you do here?", "zh": "嫦娥，你很久以前就来到月球了。你在这里做了什么？"}, {"s": "Chang'e", "speaker": "Chang'e", "en": "Rabbit and I read books and sang folk songs. But I always thought of our days together.", "zh": "我和玉兔读书、唱民歌。但我总是想起我们在一起的日子。"}, {"s": "Houyi", "speaker": "Houyi", "en": "What did you do on Earth…?", "zh": "你在地球上做了什么……？"}, {"s": "Chang'e", "speaker": "Chang'e", "en": "Hello, Rabbit!", "zh": "你好，玉兔！"}, {"s": "Rabbit", "speaker": "Rabbit", "en": "Hi, Houyi! Welcome!", "zh": "嗨，后羿！欢迎！"}, {"s": "Houyi", "speaker": "Houyi", "en": "Thank you. How is Chang'e?", "zh": "谢谢你。嫦娥怎么样？"}, {"s": "Rabbit", "speaker": "Rabbit", "en": "Chang'e is always sad, but she will be happy now. Look, here she comes. It's so good to have family around again!", "zh": "嫦娥总是很伤心，但现在她会开心了。看，她来了。家人再次聚在一起真好！"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": null, "unit": "Songs", "title": "Songs", "scene": "Unit 1 Travelling around", "function": "描述事物", "patterns": ["I visited ...", "I went to ...", "I saw ...", "I ate ..."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "I visited Beijing,", "zh": "我参观了北京。"}, {"s": "Chant", "speaker": "Chant", "en": "And I learnt about the place.", "zh": "我了解了这个地方。"}, {"s": "Chant", "speaker": "Chant", "en": "I went to Tian'anmen Square,", "zh": "我去了天安门广场，"}, {"s": "Chant", "speaker": "Chant", "en": "And to the Great Wall the next day.", "zh": "第二天去了长城。"}, {"s": "Chant", "speaker": "Chant", "en": "I visited Beijing,", "zh": "我参观了北京，"}, {"s": "Chant", "speaker": "Chant", "en": "And I learnt about its history.", "zh": "我了解了它的历史。"}, {"s": "Chant", "speaker": "Chant", "en": "I took so many pictures,", "zh": "我拍了很多照片，"}, {"s": "Chant", "speaker": "Chant", "en": "And ate new snacks on the street.", "zh": "还在街上吃了新小吃。"}, {"s": "Chant", "speaker": "Chant", "en": "I went to Xi'an next,", "zh": "接下来我去了西安，"}, {"s": "Chant", "speaker": "Chant", "en": "And I saw the old city wall.", "zh": "我看到了古城墙。"}, {"s": "Chant", "speaker": "Chant", "en": "I ate some really tasty noodles,", "zh": "我吃了非常美味的面条，"}, {"s": "Chant", "speaker": "Chant", "en": "And sang a local song.", "zh": "还唱了一首当地歌曲。"}, {"s": "Chant", "speaker": "Chant", "en": "On my trip to Xi'an,", "zh": "在我去西安的旅途中，"}, {"s": "Chant", "speaker": "Chant", "en": "I saw the famous sights.", "zh": "我看到了著名的景点。"}, {"s": "Chant", "speaker": "Chant", "en": "And I climbed up Lishan Mountain.", "zh": "我还爬上了骊山。"}, {"s": "Chant", "speaker": "Chant", "en": "The views were very nice.", "zh": "景色非常美。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": null, "unit": "Songs", "title": "Songs", "scene": "Unit 2 Getting together", "function": "描述事物", "patterns": ["We have a great time.", "We get together at ...", "We had ...", "We sang ..."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "My family and I, we have a great time.", "zh": "我和我的家人，我们玩得很开心。"}, {"s": "Chant", "speaker": "Chant", "en": "We get together at special events.", "zh": "我们在特别的活动中聚在一起。"}, {"s": "Chant", "speaker": "Chant", "en": "Events are fun. I love every one.", "zh": "活动很有趣，我喜欢每一个。"}, {"s": "Chant", "speaker": "Chant", "en": "Yeah, yeah, yeah! Yeah, yeah, yeah!", "zh": "耶，耶，耶！耶，耶，耶！"}, {"s": "Chant", "speaker": "Chant", "en": "My parents and I, we had a sports day.", "zh": "我和我的父母，我们过了一个运动日。"}, {"s": "Chant", "speaker": "Chant", "en": ant", "en": "Let's switch all the lights off.", "zh": "让我们把所有灯关掉。"}, {"s": "Chant", "speaker": "Chant", "en": "How can we stay healthy?", "zh": "我们怎样才能保持健康？"}, {"s": "Chant", "speaker": "Chant", "en": "We shouldn't feel so sad.", "zh": "我们不应该这么难过。"}, {"s": "Chant", "speaker": "Chant", "en": "We should talk about our feelings.", "zh": "我们应该谈谈我们的感受。"}, {"s": "Chant", "speaker": "Chant", "en": "Sharing isn't bad.", "zh": "分享并不坏。"}, {"s": "Chant", "speaker": "Chant", "en": "How can we stay healthy?", "zh": "我们怎样才能保持健康？"}, {"s": "Chant", "speaker": "Chant", "en": "Don't feel lonely or alone.", "zh": "不要感到孤独或孤单。"}, {"s": "Chant", "speaker": "Chant", "en": "Join after-school teams and clubs.", "zh": "加入课后团队和俱乐部。"}, {"s": "Chant", "speaker": "Chant", "en": "Have fun at school and at home.", "zh": "在学校和家里玩得开心。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": null, "unit": "Songs", "title": "Songs", "scene": "Unit 4 Did they use money well?", "function": "购物与价格", "patterns": ["... bought ...", "Did he use his money well?", "Did she use her money well?", "... has ..."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "Simon bought a new computer.", "zh": "西蒙买了一台新电脑。"}, {"s": "Chant", "speaker": "Chant", "en": "He bought a new computer.", "zh": "他买了一台新电脑。"}, {"s": "Chant", "speaker": "Chant", "en": "It was an expensive computer.", "zh": "那是一台昂贵的电脑。"}, {"s": "Chant", "speaker": "Chant", "en": "Did he use his money well?", "zh": "他钱花得合理吗？"}, {"s": "Chant", "speaker": "Chant", "en": "Mary bought two schoolbags.", "zh": "玛丽买了两个书包。"}, {"s": "Chant", "speaker": "Chant", "en": "She bought two schoolbags.", "zh": "她买了两个书包。"}, {"s": "Chant", "speaker": "Chant", "en": "Now Mary has three schoolbags.", "zh": "现在玛丽有三个书包。"}, {"s": "Chant", "speaker": "Chant", "en": "Did she use her money well?", "zh": "她钱花得合理吗？"}, {"s": "Chant", "speaker": "Chant", "en": "Anna's got a bank account.", "zh": "安娜有一个银行账户。"}, {"s": "Chant", "speaker": "Chant", "en": "She's got a bank account.", "zh": "她有一个银行账户。"}, {"s": "Chant", "speaker": "Chant", "en": "The bank gives Anna money.", "zh": "银行给安娜钱。"}, {"s": "Chant", "speaker": "Chant", "en": "Did she use her money well?", "zh": "她钱花得合理吗？"}, {"s": "Chant", "speaker": "Chant", "en": "David bought a red bike.", "zh": "大卫买了一辆红色自行车。"}, {"s": "Chant", "speaker": "Chant", "en": "He bought a red bike.", "zh": "他买了一辆红色自行车。"}, {"s": "Chant", "speaker": "Chant", "en": "David can't ride a bike.", "zh": "大卫不会骑自行车。"}, {"s": "Chant", "speaker": "Chant", "en": "Did he use his money well?", "zh": "他钱花得合理吗？"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": null, "unit": "Songs", "title": "Songs", "scene": "Unit 5 In space", "function": "描述事物", "patterns": ["We live on ...", "It's a ...", "We go round ...", "Space is so ..."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "We live on Earth.", "zh": "我们住在地球上。"}, {"s": "Chant", "speaker": "Chant", "en": "It's a planet in space.", "zh": "它是太空中的一个行星。"}, {"s": "Chant", "speaker": "Chant", "en": "We go round the Sun.", "zh": "我们绕着太阳转。"}, {"s": "Chant", "speaker": "Chant", "en": "We have our place.", "zh": "我们有自己的位置。"}, {"s": "Chant", "speaker": "Chant", "en": "Space is so big,", "zh": "太空如此之大，"}, {"s": "Chant", "speaker": "Chant", "en": "But you can see,", "zh": "但你可以看到，"}, {"s": "Chant", "speaker": "Chant", "en": "So many stars, so very far,", "zh": "那么多星星，那么遥远，"}, {"s": "Chant", "speaker": "Chant", "en": "Through a telescope with me.", "zh": "通过望远镜和我一起看。"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": null, "unit": "Songs", "title": "Songs", "scene": "Unit 6 Helping our planet", "function": "邀请与建议", "patterns": ["We need to ...", "Do you know?", "We can help ...", "We need to use ..."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "We need to use more solar power,", "zh": "我们需要使用更多的太阳能，"}, {"s": "Chant", "speaker": "Chant", "en": "Do you know?", "zh": "你知道吗？"}, {"s": "Chant", "speaker": "Chant", "en": "We need to use more water power,", n", "speaker": "Binbin", "en": "I went to Xi'an with my family.", "zh": "我和家人去西安了。"}, {"s": "A", "speaker": "A", "en": "What did you do there?", "zh": "你们在那儿做了些什么？"}, {"s": "Binbin", "speaker": "Binbin", "en": "We went to see the Terracotta Warriors.", "zh": "我们去看兵马俑了。"}, {"s": "A", "speaker": "A", "en": "What else did you do?", "zh": "你们还做什么了？"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": null, "unit": "Useful expressions", "title": "Useful expressions", "scene": "Unit 2 中秋假期", "function": "询问信息", "patterns": ["How was your ... holiday?", "Did you ...?", "Yes, we did. / No, we didn't.", "What did you like about it?"], "turns": [{"s": "A", "speaker": "A", "en": "How was your Mid-Autumn Festival holiday, Binbin?", "zh": "你中秋假期过得怎么样，斌斌？"}, {"s": "Binbin", "speaker": "Binbin", "en": "It was great!", "zh": "非常棒！"}, {"s": "A", "speaker": "A", "en": "Did you take a trip?", "zh": "你们去旅行了吗？"}, {"s": "Binbin", "speaker": "Binbin", "en": "No, we didn't.", "zh": "不，我们没有。"}, {"s": "A", "speaker": "A", "en": "Did you eat mooncakes?", "zh": "你们吃月饼了吗？"}, {"s": "Binbin", "speaker": "Binbin", "en": "Yes, we did.", "zh": "是的，我们吃了。"}, {"s": "A", "speaker": "A", "en": "My mother and I went to a marathon on Sunday.", "zh": "我和妈妈上周日去看了一场马拉松比赛。"}, {"s": "A", "speaker": "A", "en": "What did you like about it?", "zh": "你喜欢它哪一点？"}, {"s": "Binbin", "speaker": "Binbin", "en": "I liked watching the runners.", "zh": "我喜欢看参赛者（跑步）。"}, {"s": "A", "speaker": "A", "en": "What did you do last weekend?", "zh": "你上周末做什么了？"}]}, {"book": "六年级上册", "grade": "六年级", "term": "上册", "unit_no": null, "unit": "Useful expressions", "title": "Useful expressions", "scene": "Unit 3 健康与感受", "function": "感受与情绪", "patterns": ["How do you feel?", "I feel ...", "Maybe you should ...", "How can we ...?"], "turns": [{"s": "A", "speaker": "A", "en": "How do you feel?", "zh": "你感觉怎么样？"}, {"s": "B", "speaker": "B", "en": "I feel ill. My head hurts and I have a runny nose.", "zh": "我感觉不舒服。我头痛还流鼻涕。"}, {"s": "A", : "Mr Zebra is 10 centimetres taller than Mr Deer.", "zh": "斑马先生比鹿先生高10厘米。"}, {"s": "Zoom", "speaker": "Zoom", "en": "Yes, and he’s stronger. But he can’t catch the ball!", "zh": "是的，而且他更强壮。但他接不住球！"}, {"s": "Giraffe", "speaker": "Giraffe", "en": "I’m the tallest one.", "zh": "我是最高的。"}, {"s": "Zip", "speaker": "Zip", "en": "Sorry. Your neck is too long. The others can’t reach you.", "zh": "抱歉。你的脖子太长了。其他人够不到你。"}, {"s": "Zip", "speaker": "Zip", "en": "Football needs teamwork.", "zh": "足球需要团队合作。"}, {"s": "Hippo", "speaker": "Hippo", "en": "What’s happening here?", "zh": "这里发生什么了？"}, {"s": "Zip", "speaker": "Zip", "en": "Oh! Here’s the one we want!", "zh": "哦！这就是我们想要的人！"}, {"s": "Zoom", "speaker": "Zoom", "en": "Why? He’s too heavy!", "zh": "为什么？他太重了！"}, {"s": "Zip", "speaker": "Zip", "en": "We need a big guy!", "zh": "我们需要一个大个子！"}, {"s": "Zoom", "speaker": "Zoom", "en": "Oh! He’s almost bigger than the goal!", "zh": "哦！他几乎比球门还大！"}, {"s": "Dog", "speaker": "Dog", "en": "Yes! He’s an excellent goalkeeper.", "zh": "是的！他是一名出色的守门员。"}], "topic": "How tall are you?", "theme": "人与自我"}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": 2, "unit": "Last weekend", "title": "Last weekend", "scene": "Mike打电话给爷爷，聊上周末", "function": "问候与介绍", "patterns": ["How was your weekend?", "What did you do?", "I stayed at home.", "Did you do anything else?"], "turns": [{"s": "Mike", "speaker": "Mike", "en": "Hi, Grandpa. How are you? How was your weekend?", "zh": "嗨，爷爷。你好吗？你上周末过得怎么样？"}, {"s": "Grandpa", "speaker": "Grandpa", "en": "I’m fine, Mike. It was good, thank you.", "zh": "我很好，Mike。过得不错，谢谢你。"}, {"s": "Mike", "speaker": "Mike", "en": "What did you do?", "zh": "你做了什么？"}, {"s": "Grandpa", "speaker": "Grandpa", "en": "Well, I stayed at home with your grandma. We drank tea in the afternoon and watched TV.", "zh": "嗯，我和你奶奶待在家里。我们下午喝茶，还看了电视。"}, {"s": "Mike", "speaker": "Mike", "en": "I watched TV, too. I watched some children’s shows on TV.", "zh": "我也看了电视。我看了一些儿童节目。"}, {"s": "Grandpa", , "zh": "哦，很抱歉。很高兴你现在感觉好些了。"}, {"s": "John", "speaker": "John", "en": "Thanks. Let’s go by bus. It’s faster than walking.", "zh": "谢谢。我们坐公交车去吧。比走路快。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": 2, "unit": "Last weekend", "title": "Last weekend", "scene": "Let's talk：John和Amy聊看电影", "function": "表达喜好", "patterns": ["What did you do last weekend?", "I saw a film.", "Did you like it?", "It was great."], "turns": [{"s": "John", "speaker": "John", "en": "What did you do last weekend?", "zh": "你上周末做了什么？"}, {"s": "Amy", "speaker": "Amy", "en": "I saw a film.", "zh": "我看了一部电影。"}, {"s": "John", "speaker": "John", "en": "Did you like it?", "zh": "你喜欢吗？"}, {"s": "Amy", "speaker": "Amy", "en": "Yes, I did. It was great.", "zh": "是的，我喜欢。太棒了。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": 2, "unit": "Last weekend", "title": "Last weekend", "scene": "Zip和Zoom聊上周末的安排", "function": "时间与日程", "patterns": ["How was your weekend?", "What did you do on Sunday morning?", "I cleaned my room. Then I visited my grandparents.", "That was a busy weekend."], "turns": [{"s": "Zip", "speaker": "Zip", "en": "How was your weekend?", "zh": "你上周末过得怎么样？"}, {"s": "Zoom", "speaker": "Zoom", "en": "It was a busy one.", "zh": "挺忙的。"}, {"s": "Zip", "speaker": "Zip", "en": "What did you do on Sunday morning?", "zh": "你周日上午做了什么？"}, {"s": "Zoom", "speaker": "Zoom", "en": "I cleaned my room. Then I visited my grandparents.", "zh": "我打扫了房间。然后我去看望了爷爷奶奶。"}, {"s": "Zip", "speaker": "Zip", "en": "What did you do on Sunday afternoon?", "zh": "你周日下午做了什么？"}, {"s": "Zoom", "speaker": "Zoom", "en": "I played football. Then I watched TV.", "zh": "我踢了足球。然后看了电视。"}, {"s": "Zip", "speaker": "Zip", "en": "That was a busy weekend.", "zh": "那是个忙碌的周末。"}, {"s": "Zoom", "speaker": "Zoom", "en": "Yes, it was. Now I need another weekend.", "zh": "是的。现在我需要再有一个周末。"}, {"s": "Zip", "speaker": "Zip", "en": "What did you do on Saturday afternoon?", "zh": "你周六下午做了什么？"}, {"s": "Zoom", "speaker": "Zoom", "en": "I did my homework. Then I went fishing.", "zh": "我做了作业。然后去钓鱼了。"}, {"s": "Zip", "speaker": "Zip", "en": "What did you do on Saturday morning?", "zh": "你周六上午做了什么？"}, {"s": "Zoom", "speaker": "Zoom", "en": "I washed my schoolbag. Then I went to the park.", "zh": "我洗了书包。然后去了公园。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": 2, "unit": "Last weekend", "title": "Last weekend", "scene": "Story time：同学关心受伤的同学", "function": "感受与情绪", "patterns": ["What happened?", "Are you all right?", "Can I come and visit you?", "I fell off my bike and hurt my foot."], "turns": [{"s": "A", "speaker": "A", "en": "You didn’t come to school. What happened?", "zh": "你没来上学。发生什么事了？"}, {"s": "B", "speaker": "B", "en": "Oh dear! Are you all right?", "zh": "天哪！你还好吗？"}, {"s": "A", "speaker": "A", "en": "Can I come and visit you?", "zh": "我可以来看你吗？"}, {"s": "B", "speaker": "B", "en": "Yes, I’m OK. Thanks.", "zh": "好的，我没事。谢谢。"}, {"s": "A", "speaker": "A", "en": "I fell off my bike and hurt my foot.", "zh": "我从自行车上摔下来，脚受伤了。"}, {"s": "B", "speaker": "B", "en": "Sure! You can see my photos from the Labour Day holiday.", "zh": "当然！你可以看看我劳动节假期的照片。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": 3, "unit": "Where did you go?", "title": "Where did you go?", "scene": "Amy打电话给John，询问假期经历", "function": "询问信息", "patterns": ["What happened?", "Where did you go?", "Did you go to ...?", "I rode a horse."], "turns": [{"s": "Amy", "speaker": "Amy", "en": "What happened?", "zh": "发生什么事了？"}, {"s": "John", "speaker": "John", "en": "I fell off my bike last Saturday and hurt my foot.", "zh": "上周六我从自行车上摔下来，伤了脚。"}, {"s": "Amy", "speaker": "Amy", "en": "That’s too bad! Are you all right?", "zh": "太糟糕了！你还好吗？"}, {"s": "John", "speaker": "John", "en": "I’m OK now. Come and look at my photos from the Labour Day holiday.", "zh": "我现在没事了。来看看我劳动节假期的照片吧。"}, {"s": "Amy", "speaker": "Amy", "en": "Where did you go?", "zh": "你去了哪里？"}, {"s": "John", "speaker": "John", "en": "Mt. Tianshan, Xinjiang. I rode a horse. Look, it’s very small!", "zh": "新疆天山。我骑了马。看，它很小！"}, {"s": "Amy", "speaker": "Amy", "en": "Oh, yes. It looks like a mule! Did you go to Turpan?", "zh": "哦，是的。它看起来像骡子！你去吐鲁番了吗？"}, {"s": "John", "speaker": "John", "en": "Yes, we did. We saw lots of grapes there, but we couldn’t eat them. They won’t be ready till August.", "zh": "是的，我们去了。我们在那里看到了很多葡萄，但不能吃。它们要到八月才成熟。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": 3, "unit": "Where did you go?", "title": "Where did you go?", "scene": "Sarah和Wu Binbin询问Amy寒假经历", "function": "询问信息", "patterns": ["Where did you go over the winter holiday?", "How did you go there?", "What did you do there?", "How was the beach?"], "turns": [{"s": "Sarah", "speaker": "Sarah", "en": "Where did you go over the winter holiday?", "zh": "你寒假去了哪里？"}, {"s": "Amy", "speaker": "Amy", "en": "My family and I went to Sanya.", "zh": "我和家人去了三亚。"}, {"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "Really? Did you like it?", "zh": "真的吗？你喜欢那里吗？"}, {"s": "Amy", "speaker": "Amy", "en": "Yes, it was so warm.", "zh": "是的，那里很暖和。"}, {"s": "Sarah", "speaker": "Sarah", "en": "Hainan is far from here. How did you go there?", "zh": "海南离这里很远。你们怎么去的？"}, {"s": "Amy", "speaker": "Amy", "en": "We went there by plane.", "zh": "我们坐飞机去的。"}, {"s": "Wu Binbin", "speaker": "Wu Binbin", "en": "How was the beach? What did you do there?", "zh": "海滩怎么样？你在那里做了什么？"}, {"s": "Amy", "speaker": "Amy", "en": "It was beautiful. I took lots of pictures, and I also went swimming.", "zh": "很美。我拍了很多照片，还去游泳了。"}, {"s": "Sarah", "speaker": "Sarah", "en": "Sounds great! Can I see your pictures sometime?", "zh": "听起来很棒！我什么时候能看看你的照片？"}, {"s": "Amy", "speaker": "Amy", "en": "Sure.", "zh": "当然可以。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": 3, "unit": "Where did you go?", "title": "Where did you go?", "scene": "Amy询问Wu Binbin暑假情况", "function": "询问信息", "patterns": ["How was your summer holiday?", "I went swimming every weekend.", "I took lots of pictures."], ": "Zip", "speaker": "Zip", "en": "Look! How beautiful the world was! Oh! What will the birds do?", "zh": "看！世界曾经多么美丽！哦！鸟儿会怎么办？"}, {"s": "Zoom", "speaker": "Zoom", "en": "Don’t worry. People will help them.", "zh": "别担心。人们会帮助它们的。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": null, "unit": "Mike's happy days", "title": "Mike's happy days", "scene": "Mike and Bill's game", "function": "描述事物", "patterns": ["It's an elephant. It's big.", "Is this bigger or smaller than the elephant?", "I think it's bigger than the elephant.", "The whale is the biggest, and the tiger is the smallest."], "turns": [{"s": "Bill", "speaker": "Bill", "en": "It's an elephant. It's big.", "zh": "这是一头大象。它很大。"}, {"s": "Bill", "speaker": "Bill", "en": "Guess! Is this bigger or smaller than the elephant?", "zh": "猜猜看！这个比大象大还是小？"}, {"s": "Mike", "speaker": "Mike", "en": "I think it's bigger than the elephant.", "zh": "我觉得它比大象大。"}, {"s": "Bill", "speaker": "Bill", "en": "No, it isn't. It's smaller. Look. It's a tiger.", "zh": "不，不是。它更小。看，这是一只老虎。"}, {"s": "Bill", "speaker": "Bill", "en": "Look. The other card is a whale.", "zh": "看。另一张卡片是一头鲸鱼。"}, {"s": "Mike", "speaker": "Mike", "en": "So the whale is the biggest, and the tiger is the smallest.", "zh": "所以鲸鱼是最大的，老虎是最小的。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": null, "unit": "Mike's happy days", "title": "Mike's happy days", "scene": "Zip and Zoom's conversation", "function": "询问信息", "patterns": ["I have some good news and some bad news.", "Where are you going?", "Are you going to a new school?", "Will you promise to write to me?"], "turns": [{"s": "Zip", "speaker": "Zip", "en": "I have some good news and some bad news.", "zh": "我有一些好消息和一些坏消息。"}, {"s": "Zoom", "speaker": "Zoom", "en": "What is it?", "zh": "是什么？"}, {"s": "Zip", "speaker": "Zip", "en": "I'm going away for a long time.", "zh": "我要离开很长一段时间。"}, {"s": "Zoom", "speaker": "Zoom", "en": "I'm sorry to hear that.", "zh": "听到这个消息我很难过。"}, {"s": "Zoom", "spea id you go on your holiday?", "Did you swim? Did you shop?", "What did you do?", "I went swimming in the sea."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "Where did you go on your holiday, holiday, holiday?", "zh": "你假期去了哪里，假期，假期？"}, {"s": "Chant", "speaker": "Chant", "en": "Did you swim? Did you shop?", "zh": "你游泳了吗？你购物了吗？"}, {"s": "Chant", "speaker": "Chant", "en": "What did you do?", "zh": "你做了什么？"}, {"s": "Chant", "speaker": "Chant", "en": "I went swimming in the sea, in the sea, in the sea.", "zh": "我去海里游泳了，海里，海里，海里。"}, {"s": "Chant", "speaker": "Chant", "en": "I went shopping near the sea.", "zh": "我去海边购物了。"}, {"s": "Chant", "speaker": "Chant", "en": "I bought a gift for you.", "zh": "我给你买了一份礼物。"}, {"s": "Chant", "speaker": "Chant", "en": "Where did you go on your holiday, holiday, holiday?", "zh": "你假期去了哪里，假期，假期？"}, {"s": "Chant", "speaker": "Chant", "en": "Did you run? Did you jump?", "zh": "你跑步了吗？你跳跃了吗？"}, {"s": "Chant", "speaker": "Chant", "en": "What did you do?", "zh": "你做了什么？"}, {"s": "Chant", "speaker": "Chant", "en": "I rode a bike in the park, in the park, in the park.", "zh": "我在公园里骑自行车了，公园里，公园里，公园里。"}, {"s": "Chant", "speaker": "Chant", "en": "I didn’t see a big round stone,", "zh": "我没看到一块大圆石头，"}, {"s": "Chant", "speaker": "Chant", "en": "And ouch, I hurt my foot!", "zh": "哎呀，我弄伤了脚！"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": null, "unit": "Songs in each unit", "title": "Songs in each unit", "scene": "Unit 4 Changes in me", "function": "描述事物", "patterns": ["Now I am taller than before.", "Every day I grow bigger.", "Once I was a young boy.", "Now I am a big boy."], "turns": [{"s": "Chant", "speaker": "Chant", "en": "Now I am taller, taller than before.", "zh": "现在我更高了，比以前更高。"}, {"s": "Chant", "speaker": "Chant", "en": "Every day I grow bigger. Every day I grow more.", "zh": "我每天长得更大。我每天长得更多。"}, {"s": "Chant", "speaker": "Chant", "en": "Once I was a young boy, younger than I am today.", "zh": "曾经我是一个小男孩，比今天的我更年轻。"}, {"s": "Chant", "speaker": "Chant", "en": "Now I am a big boy, and I’m bigger every day.", "zh": "现在我是一个大男孩，而且我每天长得更大。"}, {"s": "Chant", "speaker": "Chant", "en": "For school I get up early, earlier than before.", "zh": "为了上学我起得很早，比以前更早。"}, {"s": "Chant", "speaker": "Chant", "en": "Every day I get up early, sometimes at four!", "zh": "我每天起得很早，有时候四点！"}, {"s": "Chant", "speaker": "Chant", "en": "Once I didn’t talk a lot. I wasn’t an active boy,", "zh": "曾经我不怎么说话。我不是一个活跃的男孩，"}, {"s": "Chant", "speaker": "Chant", "en": "But now I talk more than before. I always talk with joy!", "zh": "但现在我比以前说得更多了。我总是开心地说话！"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": null, "unit": "Useful expressions", "title": "Useful expressions", "scene": "Unit 1 恐龙身高与鞋码体重", "function": "询问信息", "patterns": ["That’s the tallest ... in ...", "It’s taller than ...", "How tall are you? I’m ... metres.", "What size are your shoes? My shoes are size ..."], "turns": [{"s": "A", "speaker": "A", "en": "That’s the tallest dinosaur in this hall.", "zh": "那是这个厅里最高的恐龙。"}, {"s": "B", "speaker": "B", "en": "It’s taller than both of us together.", "zh": "它比我俩加起来还高。"}, {"s": "A", "speaker": "A", "en": "How tall are you?", "zh": "你有多高？"}, {"s": "B", "speaker": "B", "en": "I’m 1.65 metres.", "zh": "我身高1.65米。"}, {"s": "A", "speaker": "A", "en": "What size are your shoes, Mike?", "zh": "迈克，你穿多大号的鞋？"}, {"s": "B", "speaker": "B", "en": "Your feet are bigger than mine. My shoes are size 37.", "zh": "你的脚比我的大。我穿37号的鞋。"}, {"s": "A", "speaker": "A", "en": "How heavy are you?", "zh": "你体重多少？"}, {"s": "B", "speaker": "B", "en": "I’m 48 kilograms.", "zh": "我体重48公斤。"}]}, {"book": "六年级下册", "grade": "六年级", "term": "下册", "unit_no": null, "unit": "Useful expressions", "title": "Useful expressions", "scene": "Unit 2 周末过得怎么样", "function": "询问信息", "patterns": ["How was your weekend? It was good, thank you.", "What did you do? I ...", "Did you do anything else? Yes, I ..."], "turns": [{"s": "A", "speaker": "A", "en": "How w er family. Candy and cake are yummy, | but don't eat too much!", "zh": "语调"}, {"book": "四年级下册", "grade": "四年级", "term": "下册", "unit_no": null, "unit": "", "en": "Read and circle. Then listen and check. Whose sweater is this? It's your dad's. Can I buy a new pair? Sure. Don't run in the living room. Miss you! Who's your best friend? Is this your sister? Do you often say that to your mum? Don't be so loud! Can I help you? How fresh!", "zh": "仅供个人学习使用，未经授权不得另做他用"}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 1, "unit": "Different friends", "en": "Why not do both?", "zh": "为什么不两个活动都做呢？"}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 1, "unit": "Different friends", "en": "It's important to listen to each other.", "zh": "听取彼此的想法很重要。"}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 1, "unit": "Different friends", "en": "Yes, Miss White. I need to talk to Mike.", "zh": "是的，怀特老师。我需要和迈克谈谈。"}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 2, "unit": "My feelings", "en": "What’s your favourite day at school, John?", "zh": "你在学校最喜欢哪一天，约翰？"}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 2, "unit": "My feelings", "en": "What do you have on Wednesdays?", "zh": "星期三你有什么课？"}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 2, "unit": "My feelings", "en": "I have Chinese, maths, music and PE.", "zh": "我有语文课、数学课、音乐课和体育课。"}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 2, "unit": "My feelings", "en": "What do you usually do at the weekend, children?", "zh": "孩子们，周末你们通常做什么？"}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 2, "unit": "My feelings", "en": "I often play football. Sometimes I play Chinese chess with my father.", "zh": "我经常踢足球。有时我和爸爸下象棋。"}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 2, "unit": "My feelings", "en": "Does your mother work on both Saturdays and Sundays?", "zh": "你妈妈周六周日都工作吗？"}, {"book": "五年级上册", "grade": "五年级", "term": "上册", "unit_no": 2, "u
