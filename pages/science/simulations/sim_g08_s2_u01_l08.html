<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【凤仙花的一生】真实验微仿真 - 四年级科学</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --green: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        header {
            width: 100%;
            max-width: 980px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        header h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
        .badge { background: rgba(16, 185, 129, 0.15); color: var(--green); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 0.88rem; }
        .layout {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }
        .canvas-box {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #020617;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 620px;
            height: 420px;
            touch-action: none;
        }
        .controls {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inquiry {
            background: rgba(16, 185, 129, 0.08);
            border-left: 3px solid var(--green);
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.82rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .c-group { display: flex; flex-direction: column; gap: 6px; }
        .c-group label { font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; }
        .c-group input[type=range] { accent-color: var(--green); cursor: pointer; }
        .btn {
            background: var(--green);
            color: #0f172a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-sec { background: #334155; color: #f8fafc; }
        .telemetry {
            background: #090d16;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #334155;
            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: var(--green);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>🔬 凤仙花的一生 <span class="badge">四年级下册 · 植物的生长变化</span></h2>
            <p>教科版科学原书植物生长实验真拟真 · 拒绝伪仿真</p>
        </div>
        <a href="virtual_microscope.html" class="master-lab-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 14px rgba(245, 158, 11, 0.4); margin-left: 10px;" title="进入全景开放式大师级科学综合实验室">🏆 进入大师级实验室 · 植物器官解剖与维管束实验室 →</a>
        <a href="index.html" class="back-link">← 返回实验大厅</a>
    </header>
    <div class="layout">
        <div class="canvas-box">
            <canvas id="simCanvas" width="620" height="420"></canvas>
            <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted);">
                <span>💡 原生植物解剖与生长物理引擎</span>
                <span>🎧 Web Audio 拟真音效</span>
            </div>
        </div>
        <div class="controls">
            <div class="inquiry"><strong>🎯 探究任务</strong>：凤仙花全生命周期成长延时沙盒：拖动 90 天成长时间轴，动态呈现种子发芽、幼苗长高、枝繁叶茂、繁花似锦到结出种子的完整生命周期！</div>
            
        <div class="c-group">
            <label><span>植物生命周期时间轴</span><span id="dayDisp">第 30 天 (快速生长期)</span></label>
            <input type="range" id="daySlider" min="1" max="90" value="30">
        </div>
        <div class="telemetry" id="telem">
            [生命阶段] 茎秆拔节生长，真叶茂盛展开！<br>
            [株高记录] 28.5 cm<br>
            [植物一生] 经历种子萌发、幼苗生长、开花、传粉、结果至植株枯萎全过程！
        </div>
    
        </div>
    </div>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function playTone(freq=440, type='sine', dur=0.2, vol=0.1) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        
        const slider = document.getElementById('daySlider');
        const disp = document.getElementById('dayDisp');
        const telem = document.getElementById('telem');

        slider.addEventListener('input', () => {
            const d = parseInt(slider.value);
            let stage = "种子萌发";
            if(d > 10 && d <= 35) stage = "幼苗拔节旺长期";
            else if(d > 35 && d <= 65) stage = "繁花盛开期";
            else if(d > 65) stage = "果实成熟衰老期";
            disp.textContent = `第 ${d} 天 (${stage})`;

            const height = Math.min(65, (d * 0.75)).toFixed(1);
            telem.innerHTML = `[生命阶段] ${stage}<br>[株高累计] ${height} cm<br>[发育里程碑] ${d>60?'花谢结出果实，收获新一代种子！':(d>35?'开出红色鲜花吸引昆虫传粉！':'光合作用旺盛积累有机养料！')}`;
        });
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;
            const d = parseInt(slider.value);

            // Soil ground
            ctx.fillStyle = '#78350f';
            ctx.fillRect(0, 340, w, 80);

            // Plant stem height based on days
            const stemH = Math.min(240, d * 2.8);
            ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(w/2, 340);
            ctx.lineTo(w/2, 340 - stemH);
            ctx.stroke();

            // Leaves growing with days
            const leafCount = Math.min(10, Math.floor(d / 8));
            ctx.fillStyle = '#4ade80';
            for(let i=0; i<leafCount; i++) {
                const ly = 320 - i * 22;
                ctx.beginPath();
                ctx.ellipse(w/2 - 25, ly, 22, 10, -Math.PI/6, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(w/2 + 25, ly, 22, 10, Math.PI/6, 0, Math.PI*2);
                ctx.fill();
            }

            // Flowers if d > 40
            if(d > 40 && d < 75) {
                ctx.fillStyle = '#ec4899';
                ctx.beginPath(); ctx.arc(w/2, 340 - stemH, 16, 0, Math.PI*2); ctx.fill();
            }
            // Seed Pods if d >= 70
            if(d >= 70) {
                ctx.fillStyle = '#a16207';
                ctx.beginPath(); ctx.ellipse(w/2, 340 - stemH + 20, 15, 8, 0, 0, Math.PI*2); ctx.fill();
            }

            requestAnimationFrame(render);
        }
        render();
    
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
