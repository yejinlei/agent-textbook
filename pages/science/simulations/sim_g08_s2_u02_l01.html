<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【电和我们的生活】真实验微仿真 - 四年级科学</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --green: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        header {
            width: 100%;
            max-width: 980px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        header h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
        .badge { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 0.88rem; }
        .layout {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }
        .canvas-box {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #020617;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 620px;
            height: 420px;
            touch-action: none;
        }
        .controls {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inquiry {
            background: rgba(56, 189, 248, 0.08);
            border-left: 3px solid var(--accent);
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.82rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .c-group { display: flex; flex-direction: column; gap: 6px; }
        .c-group label { font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; }
        .c-group input[type=range] { accent-color: var(--accent); cursor: pointer; }
        .btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-sec { background: #334155; color: #f8fafc; }
        .telemetry {
            background: #090d16;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #334155;
            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: var(--accent);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>🔬 电和我们的生活 <span class="badge">四年级下册 · 电路单元</span></h2>
            <p>教科版科学原书电路真实验 · 拒绝伪仿真</p>
        </div>
        <a href="circuit_sandbox.html" class="master-lab-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 14px rgba(245, 158, 11, 0.4); margin-left: 10px;" title="进入全景开放式大师级科学综合实验室">🏆 进入大师级实验室 · 大师级闭合回路电子沙盒 →</a>
        <a href="index.html" class="back-link">← 返回实验大厅</a>
    </header>
    <div class="layout">
        <div class="canvas-box">
            <canvas id="simCanvas" width="620" height="420"></canvas>
            <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted);">
                <span>💡 原生真实闭合回路与电子流动画</span>
                <span>🎧 Web Audio 拟真通电/短路警报音效</span>
            </div>
        </div>
        <div class="controls">
            <div class="inquiry"><strong>🎯 探究任务</strong>：安全用电与电压梯度交互认知：对比 1.5V 干电池（安全可触摸）、36V 人体安全电压极限与 220V 高危家庭交流电，掌握防触电核心安全法则！</div>
            
        <div class="c-group">
            <button class="btn" id="btn15V">🔋 1.5 V 实验干电池 (安全)</button>
            <button class="btn btn-sec" id="btn36V">⚠️ 36 V 人体安全电压极限</button>
            <button class="btn btn-sec" id="btn220V" style="background:#e11d48; color:#fff;">⚡ 220 V 家用交流电 (绝对禁止触碰)</button>
        </div>
        <div class="telemetry" id="telem">
            [当前电源] 1.5 V 碱性干电池<br>
            [安全性评估] ✅ 绝对安全！可直接用手触摸导线连接小灯泡！<br>
            [安全用电守则] 绝不能用插座里的 220V 交流电做实验！湿手绝不碰开关！
        </div>
    
        </div>
    </div>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function playTone(freq=440, type='sine', dur=0.2, vol=0.1) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function playClick() { playTone(800, 'square', 0.04, 0.08); }
        
        let volt = 1.5;
        const telem = document.getElementById('telem');

        document.getElementById('btn15V').addEventListener('click', () => {
            volt = 1.5;
            playTone(440, 'sine', 0.15);
            telem.innerHTML = '[当前电源] 1.5 V 干电池<br>[安全评估] ✅ 安全！我们科学课做实验只能使用干电池！';
        });
        document.getElementById('btn36V').addEventListener('click', () => {
            volt = 36;
            playTone(300, 'triangle', 0.2);
            telem.innerHTML = '[当前电源] 36 V 安全极限<br>[安全评估] ⚠️ 干燥环境下的人体安全电压阈值，潮湿环境下会急剧降低！';
        });
        document.getElementById('btn220V').addEventListener('click', () => {
            volt = 220;
            playTone(150, 'sawtooth', 0.5, 0.25);
            telem.innerHTML = '⚡ [严重警告！] 220 V 强电！可瞬间击穿人体产生致命电击！绝不能用插座电源做任何手工实验！';
        });
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;

            // Voltage Gauge Meter
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(w/2, 220, 110, Math.PI, 0); ctx.stroke();

            // Safe vs Danger zones
            ctx.strokeStyle = '#10b981'; ctx.lineWidth = 12; // Green safe
            ctx.beginPath(); ctx.arc(w/2, 220, 100, Math.PI, Math.PI + 0.4); ctx.stroke();
            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 12; // Red danger
            ctx.beginPath(); ctx.arc(w/2, 220, 100, Math.PI + 0.4, 0); ctx.stroke();

            // Needle
            const maxV = 240;
            const needleAng = Math.PI + (volt / maxV) * Math.PI;
            ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(w/2, 220); ctx.lineTo(w/2 + Math.cos(needleAng)*85, 220 + Math.sin(needleAng)*85); ctx.stroke();

            // Value text
            ctx.fillStyle = volt > 50 ? '#ef4444' : '#10b981'; ctx.font = '32px monospace';
            ctx.fillText(volt + ' V', w/2 - 40, 270);

            requestAnimationFrame(render);
        }
        render();
    
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
