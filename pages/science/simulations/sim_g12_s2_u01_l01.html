    <script>
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        function playTone(freq, duration, type='sine') {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const telem = document.getElementById('telem');
        const controlsContainer = document.getElementById('controlsContainer');
        const activeMode = "housing_systems";

        
const state = {
    windLevel: 1, // 1~3 级风扇
    quakeIntensity: 0, // 0~3 级震动
    topLoadBooks: 2, // 顶端载荷书本数 1~8
    trussType: 'triangle', // triangle(稳定), rectangle(易变形)
    towerTiltAngle: 0,
    towerCollapsed: false
};

    const systems = [
        { t: '1. 承重梁柱结构', d: '钢筋混凝土框架结构\n地基桩基承载房屋荷载', c: '#f59e0b', x: 80, y: 80 },
        { t: '2. 给水排水系统', d: '冷热水市政管道加压\n污废水分流重力排放', c: '#38bdf8', x: 280, y: 80 },
        { t: '3. 强电弱电系统', d: '220V配电箱空开回路\n光纤网络与安防门禁', c: '#a855f7', x: 480, y: 80 },
        { t: '4. 供暖通风系统', d: '地暖壁挂炉中央空调\n新风循环换气除湿', c: '#f43f5e', x: 80, y: 220 },
        { t: '5. 采光隔音系统', d: '双层中空Low-E玻璃\n自然日照朝向与隔热', c: '#10b981', x: 280, y: 220 },
        { t: '6. 燃气安全系统', d: '天然气管道自动切断阀\n可燃气体泄漏报警探测', c: '#eab308', x: 480, y: 220 }
    ];

    systems.forEach(s => {
        ctx.fillStyle = '#1e293b'; ctx.fillRect(s.x, s.y, 160, 115);
        ctx.strokeStyle = s.c; ctx.lineWidth = 2; ctx.strokeRect(s.x, s.y, 160, 115);

        ctx.fillStyle = s.c; ctx.font = 'bold 13px sans-serif';
        ctx.fillText(s.t, s.x + 80, s.y + 26);

        ctx.fillStyle = '#cbd5e1'; ctx.font = '11px sans-serif';

        lines.forEach((l, i) => ctx.fillText(l, s.x + 80, s.y + 55 + i * 20));

    ctx.fillStyle = '#38bdf8'; ctx.font = '13px sans-serif';
    ctx.fillText('工程结论: 住房是由供水、供暖、采光、电路等多个相互协调的子系统构成的复杂有机工程', cx, 395);
}

function setupControls() {
    let html = '';
    if (activeMode === 'tower_testing' || activeMode === 'tower_design_truss') {
        html += `
            <div class="ctrl-group">
                <div class="ctrl-label"><span>结构基础形式</span><span class="val">${state.trussType==='triangle'?'全三角桁架 (极其稳固)':'普通四边形 (易受力形变)'}</span></div>
                <div class="btn-grid">
                    <button class="btn btn-green" id="btnTriangle">🔺 三角形桁架 (增加斜撑)</button>
                    <button class="btn btn-rose" id="btnRect">⏹️ 纯矩形框架 (易偏斜坍塌)</button>
                </div>
            </div>
            <div class="ctrl-group">
                <div class="ctrl-label"><span>抗风能力测试 (风力等级)</span><span class="val" id="wVal">${state.windLevel} 级</span></div>
                <input type="range" id="windSlider" min="0" max="3" value="${state.windLevel}">
            </div>
            <div class="ctrl-group">
                <div class="ctrl-label"><span>抗压承重载荷 (书本数量)</span><span class="val" id="loadVal">${state.topLoadBooks} 本</span></div>
                <input type="range" id="loadSlider" min="1" max="8" value="${state.topLoadBooks}">
            </div>
            <div class="btn-grid" style="margin-top:6px;">
                <button class="btn btn-rose" id="btnSimEarthquake">⚡ 启动底部地震波模拟</button>
                <button class="btn" id="btnResetTower">🔄 扶正复位塔台</button>
            </div>
        `;
    } else {
        html += `
            <div class="ctrl-group">
                <div class="ctrl-label"><span>工程系统结构与管网</span></div>
                <div class="btn-grid">
                    <button class="btn btn-primary" id="btnWaterPipe">💧 供排水管网系统</button>
                    <button class="btn btn-green" id="btnPowerGrid">⚡ 强弱电电力布线</button>
                </div>
            </div>
        `;
    }

    controlsContainer.innerHTML = html;
    bindU1Events();
}

function bindU1Events() {
    const btnTriangle = document.getElementById('btnTriangle');
    if (btnTriangle) btnTriangle.onclick = () => { state.trussType = 'triangle'; state.towerCollapsed = false; setupControls(); playTone(880, 0.2); };
    const btnRect = document.getElementById('btnRect');
    if (btnRect) btnRect.onclick = () => { state.trussType = 'rectangle'; setupControls(); playTone(400, 0.2); };

    const windSlider = document.getElementById('windSlider');
    if (windSlider) {
        windSlider.addEventListener('input', (e) => {
            state.windLevel = parseInt(e.target.value);
            document.getElementById('wVal').innerText = state.windLevel + ' 级';
            checkTowerStability();
        });
    }
    const loadSlider = document.getElementById('loadSlider');
    if (loadSlider) {
        loadSlider.addEventListener('input', (e) => {
            state.topLoadBooks = parseInt(e.target.value);
            document.getElementById('loadVal').innerText = state.topLoadBooks + ' 本';
            checkTowerStability();
        });
    }

    const btnSimEarthquake = document.getElementById('btnSimEarthquake');
    if (btnSimEarthquake) btnSimEarthquake.onclick = () => {
        state.quakeIntensity = 2;
        checkTowerStability();
        playTone(150, 0.4, 'sawtooth');
    };
    const btnResetTower = document.getElementById('btnResetTower');
    if (btnResetTower) btnResetTower.onclick = () => {
        state.towerCollapsed = false;
        state.windLevel = 1;
        state.quakeIntensity = 0;
        state.topLoadBooks = 2;
        setupControls();
        playTone(600, 0.1);
    };

    const btnWaterPipe = document.getElementById('btnWaterPipe');
    if (btnWaterPipe) btnWaterPipe.onclick = () => { playTone(600, 0.1); };
    const btnPowerGrid = document.getElementById('btnPowerGrid');
    if (btnPowerGrid) btnPowerGrid.onclick = () => { playTone(700, 0.1); };
}

function checkTowerStability() {
    if (state.trussType === 'rectangle') {
        if (state.windLevel >= 2 || state.topLoadBooks >= 5 || state.quakeIntensity > 0) {
            state.towerCollapsed = true;
            playTone(180, 0.4, 'sawtooth');
        }
    } else {
        // Triangle truss is very strong
        if (state.windLevel >= 3 && state.topLoadBooks >= 7 && state.quakeIntensity >= 2) {
            state.towerCollapsed = true;
        } else {
            state.towerCollapsed = false;
        }
    }
}

        
function draw() {
    ctx.clearRect(0, 0, 720, 450);

    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, 720, 450);

    if (activeMode === 'housing_systems') {
        drawHousingSystems();
        updateTelemetry();
        requestAnimationFrame(draw);
        return;
    } else if (activeMode === 'engineering_process') {
        drawEngineeringProcess();
        updateTelemetry();
        requestAnimationFrame(draw);
        return;
    } else if (activeMode === 'tower_project') {
        drawTowerProject();
        updateTelemetry();
        requestAnimationFrame(draw);
        return;
    } else if (activeMode === 'tower_building') {
        drawTowerBuilding();
        updateTelemetry();
        requestAnimationFrame(draw);
        return;
    } else if (activeMode === 'tower_optimization') {
        drawTowerOptimization();
        updateTelemetry();
        requestAnimationFrame(draw);
        return;
    }

    const cx = 360;

    // Ground platform (Shaker table)
    const shakeOffset = state.quakeIntensity > 0 ? (Math.random() - 0.5) * 8 : 0;
    ctx.fillStyle = '#334155';
    ctx.fillRect(180 + shakeOffset, 360, 360, 40);

    // Tower Structure (Height 200px, 3 tiered levels)
    ctx.save();
    ctx.translate(cx + shakeOffset, 360);

    if (state.towerCollapsed) {
        ctx.rotate(0.35); // Fallen
    } else {
        // Slight wind sway
        const windLean = (state.windLevel * 0.02) * (state.trussType === 'rectangle' ? 2.5 : 0.8);
        ctx.rotate(windLean);
    }

    // Straw columns
    ctx.strokeStyle = state.trussType === 'triangle' ? '#38bdf8' : '#f59e0b';
    ctx.lineWidth = 4;

    // 4 Corner Legs
    ctx.beginPath();
    ctx.moveTo(-60, 0); ctx.lineTo(-25, -200);
    ctx.moveTo(60, 0); ctx.lineTo(25, -200);
    ctx.stroke();

    // Horizontal collars at 3 heights
    for (let h = 1; h <= 3; h++) {
        const y = -h * 65;
        const w = 60 - h * 11;
        ctx.beginPath();
        ctx.moveTo(-w, y); ctx.lineTo(w, y);
        ctx.stroke();

        // Diagonal trusses (Triangle struts)
        if (state.trussType === 'triangle') {
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 2;
            const prevY = -(h - 1) * 65;
            const prevW = 60 - (h - 1) * 11;
            ctx.beginPath();
            ctx.moveTo(-prevW, prevY); ctx.lineTo(w, y);
            ctx.moveTo(prevW, prevY); ctx.lineTo(-w, y);
            ctx.stroke();
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 4;
        }
    }

    // Top Platform Load (Books stacked on top)
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(-30, -205, 60, 6);
    ctx.fillStyle = '#f43f5e';
    for (let b = 0; b < state.topLoadBooks; b++) {
        ctx.fillRect(-25, -212 - b * 9, 50, 8);
    }

    ctx.restore();

    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    if (state.towerCollapsed) {
        ctx.fillText('⚠️ 塔台失稳倒塌! 结构缺少三角形支撑，抗压/抗风能力不足!', cx, 40);
    } else {
        ctx.fillText(`塔台工程模型性能测试: 承重 ${state.topLoadBooks} 本书 | 抗风 ${state.windLevel} 级 【${state.trussType==='triangle'?'全三角稳定结构':'普通四边形易形变'}】`, cx, 40);
        ctx.fillStyle = '#10b981';
        ctx.font = '14px sans-serif';
        ctx.fillText('工程设计准则: 镂空结构减小风阻、上小下大降低重心、大量三角形桁架确保稳固!', cx, 75);
    }

    updateTelemetry();
    requestAnimationFrame(draw);
}

        
function updateTelemetry() {
    let txt = `[工程结构数据就绪] 模式: ${activeMode} | `;
    txt += `基础结构: ${state.trussType} | 顶部载荷: ${state.topLoadBooks}本 | 状态: ${state.towerCollapsed?'坍塌':'稳固贴合'}`;
    telem.innerText = txt;
}


        setupControls();
        draw();
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
