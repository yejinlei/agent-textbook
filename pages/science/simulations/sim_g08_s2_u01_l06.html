<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【果实和种子】真实验微仿真 - 四年级科学</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --green: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        header {
            width: 100%;
            max-width: 980px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        header h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
        .badge { background: rgba(16, 185, 129, 0.15); color: var(--green); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 0.88rem; }
        .layout {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }
        .canvas-box {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #020617;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 620px;
            height: 420px;
            touch-action: none;
        }
        .controls {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inquiry {
            background: rgba(16, 185, 129, 0.08);
            border-left: 3px solid var(--green);
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.82rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .c-group { display: flex; flex-direction: column; gap: 6px; }
        .c-group label { font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; }
        .c-group input[type=range] { accent-color: var(--green); cursor: pointer; }
        .btn {
            background: var(--green);
            color: #0f172a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-sec { background: #334155; color: #f8fafc; }
        .telemetry {
            background: #090d16;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #334155;
            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: var(--green);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>🔬 果实和种子 <span class="badge">四年级下册 · 植物的生长变化</span></h2>
            <p>教科版科学原书植物生长实验真拟真 · 拒绝伪仿真</p>
        </div>
        <a href="virtual_microscope.html" class="master-lab-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 14px rgba(245, 158, 11, 0.4); margin-left: 10px;" title="进入全景开放式大师级科学综合实验室">🏆 进入大师级实验室 · 植物器官解剖与维管束实验室 →</a>
        <a href="index.html" class="back-link">← 返回实验大厅</a>
    </header>
    <div class="layout">
        <div class="canvas-box">
            <canvas id="simCanvas" width="620" height="420"></canvas>
            <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted);">
                <span>💡 原生植物解剖与生长物理引擎</span>
                <span>🎧 Web Audio 拟真音效</span>
            </div>
        </div>
        <div class="controls">
            <div class="inquiry"><strong>🎯 探究任务</strong>：果实形成与种子成熟解剖：观察传粉受精后花瓣凋谢，雌蕊子房日渐膨大为绿色的纺锤形果荚，成熟后内部孕育 15~20 粒圆溜溜的黑褐色种子！</div>
            
        <div class="c-group">
            <label><span>果实生长天数 (天)</span><span id="dayDisp">第 15 天 (幼果)</span></label>
            <input type="range" id="daySlider" min="5" max="30" value="15">
        </div>
        <div class="c-group">
            <button class="btn" id="btnSlicePod">🔪 切开果荚观察内部种子排列</button>
        </div>
        <div class="telemetry" id="telem">
            [果实发育] 幼果期：子房迅速细胞分裂膨大！<br>
            [种子形成] 胚珠受精发育成为种子！
        </div>
    
        </div>
    </div>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function playTone(freq=440, type='sine', dur=0.2, vol=0.1) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        
        let isSliced = false;
        const slider = document.getElementById('daySlider');
        const disp = document.getElementById('dayDisp');
        const telem = document.getElementById('telem');

        slider.addEventListener('input', () => {
            const d = parseInt(slider.value);
            disp.textContent = `第 ${d} 天 (${d>22?'成熟期':'生长期'})`;
            isSliced = false;
        });
        document.getElementById('btnSlicePod').addEventListener('click', () => {
            isSliced = true;
            playTone(550, 'triangle', 0.2);
            telem.innerHTML = '[切开果实] 凤仙花果实是典型的蒴果！内部有 5 个心皮室，整齐排列着 18 粒黑褐色种子！';
        });
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;
            const d = parseInt(slider.value);
            const podSize = 25 + d * 2;

            if(!isSliced) {
                // Whole Balsam Pod (Spindle shaped)
                ctx.fillStyle = d > 24 ? '#a16207' : '#65a30d';
                ctx.beginPath();
                ctx.ellipse(w/2, 200, podSize, podSize*0.4, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.strokeStyle = '#3f6212'; ctx.lineWidth = 3; ctx.stroke();
            } else {
                // Sliced open showing seeds inside
                ctx.fillStyle = 'rgba(101, 163, 13, 0.4)';
                ctx.strokeStyle = '#65a30d'; ctx.lineWidth = 4;
                ctx.strokeRect(w/2 - 120, 150, 240, 100);

                // Seeds inside
                ctx.fillStyle = '#1c1917';
                for(let i=0; i<16; i++) {
                    const sx = w/2 - 90 + (i%8)*24;
                    const sy = 175 + Math.floor(i/8)*35;
                    ctx.beginPath(); ctx.arc(sx, sy, 7, 0, Math.PI*2); ctx.fill();
                }
                ctx.fillStyle = '#f8fafc'; ctx.font = '12px sans-serif';
                ctx.fillText('成熟种子 (约 16 粒)', w/2 - 50, 280);
            }
            requestAnimationFrame(render);
        }
        render();
    
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
