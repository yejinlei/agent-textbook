<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科学微仿真测试模板</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-cyan: #38bdf8;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --panel-border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            margin-bottom: 16px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 16px;
        }
        .canvas-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #020617;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 580px;
            height: 380px;
        }
        .control-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .control-group label {
            font-size: 0.85rem;
            color: var(--text-sub);
        }
        .btn {
            background: var(--accent-cyan);
            color: #0f172a;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }
        .data-panel {
            background: #090d16;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
            border: 1px solid #334155;
            color: var(--accent-cyan);
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>🔬 科学探究微仿真</h2>
            <p style="color:var(--text-sub); font-size:0.85rem;">测试验证模块</p>
        </div>
        <a href="index.html" style="color:var(--accent-cyan); text-decoration:none; font-size:0.9rem;">← 返回实验大厅</a>
    </header>
    <div class="container">
        <div class="canvas-card">
            <canvas id="simCanvas" width="580" height="380"></canvas>
        </div>
        <div class="control-card">
            <h3>控制与参数</h3>
            <div class="control-group">
                <label>参数强度: <span id="valDisplay">50</span></label>
                <input type="range" id="paramSlider" min="10" max="100" value="50">
            </div>
            <button class="btn" id="actionBtn">▶ 启动探究</button>
            <div class="data-panel" id="telemetry">
                状态: 待机就绪<br>
                物理量测: 0.00
            </div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function playBeep(freq=440) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } catch(e){}
        }
        let running = false;
        let t = 0;
        document.getElementById('actionBtn').addEventListener('click', () => {
            running = !running;
            document.getElementById('actionBtn').textContent = running ? '⏸ 暂停' : '▶ 启动探究';
            playBeep(running ? 520 : 330);
        });
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            if(running) t += 0.05;
            const val = parseFloat(document.getElementById('paramSlider').value);
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(canvas.width/2 + Math.sin(t)*(val), canvas.height/2, 20, 0, Math.PI*2);
            ctx.fill();
            document.getElementById('telemetry').innerHTML = `状态: ${running?'运行中':'已暂停'}<br>位移: ${(Math.sin(t)*val).toFixed(2)} px`;
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
