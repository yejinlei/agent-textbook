    <script>
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        function playTone(freq, duration, type='sine') {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const telem = document.getElementById('telem');
        const controlsContainer = document.getElementById('controlsContainer');
        const activeMode = "polaris";

        
const state = {
    timeOfDay: 12, // 6 ~ 18 时
    compassAngle: 0,
    needleAngle: 0,
    hasMagnetized: false,
    beidouRotate: 0
};

function setupControls() {
    let html = '';
    if (activeMode === 'sun_shadow') {
        html += `
            <div class="ctrl-group">
                <div class="ctrl-label"><span>太阳位置时间 (时)</span><span class="val" id="tVal">${state.timeOfDay}:00</span></div>

                <button class="btn btn-primary" id="btnEvening">🌇 傍晚 17:00 (日落西，影朝东)</button>
            </div>
        `;
    } else if (activeMode === 'diy_compass' || activeMode === 'magnet_direction') {
        html += `
            <div class="ctrl-group">
                <div class="ctrl-label"><span>缝衣针磁化操作</span><span class="val">${state.hasMagnetized?'已磁化':'未磁化'}</span></div>
                <div class="btn-grid">
                    <button class="btn btn-primary" id="btnStroke">🧲 用条形磁铁单向摩擦20次</button>

            </div>

    } else if (activeMode === 'polaris') {
        html += `
            <div class="ctrl-group">

                <div class="btn-grid">
                    <button class="btn btn-green" id="btnFindPolaris">✨ 沿勺口延长5倍寻找北极星</button>
                    <button class="btn" id="btnRotateSky">🌌 转动星空</button>
                </div>
            </div>
        `;
    } else if (activeMode === 'compass_use') {
        html += `
            <div class="ctrl-group">
                <div class="ctrl-label"><span>现代地质罗盘瞄准镜与方位角测定</span><span class="val" id="cAngleVal">${state.compassAngle}°</span></div>
                <input type="range" id="compassSlider" min="0" max="359" value="${state.compassAngle}">
            </div>
            <div class="btn-grid">
                <button class="btn btn-primary" id="btnAlignCompass">🧭 瞄准目标点测定方位角</button>
            </div>
        `;
    } else if (activeMode === 'campus_map') {
        html += `
            <div class="ctrl-group">
                <div class="ctrl-label"><span>校园平面图方向标探秘 (上北下南左西右东)</span></div>
                <div class="btn-grid">
                    <button class="btn btn-primary" id="btnMapLibrary">🏢 探访图书馆 (操场以东)</button>
                    <button class="btn btn-green" id="btnMapBuilding">🏫 探访教学楼 (操场以北)</button>
                    <button class="btn btn-rose" id="btnMapGate">🚪 探访校门 (操场以南)</button>
                </div>
            </div>
        `;
    } else if (activeMode === 'tools_history') {
        html += `
            <div class="ctrl-group">
                <div class="ctrl-label"><span>人类定向工具演进史 (司南->罗盘->北斗卫星)</span></div>
                <div class="btn-grid">
                    <button class="btn btn-primary" id="btnSinan">🥄 战国·司南</button>
                    <button class="btn btn-green" id="btnWaterFish">🐟 宋代·水浮指南鱼</button>
                    <button class="btn btn-rose" id="btnBDS">🛰️ 现代·北斗卫星导航</button>
                </div>
            </div>
        `;
    } else {
        html += `
            <div class="ctrl-group">
                <div class="ctrl-label"><span>转动罗盘方位刻度盘</span><span class="val" id="cAngleVal">${state.compassAngle}°</span></div>
                <input type="range" id="compassSlider" min="0" max="359" value="${state.compassAngle}">
            </div>

    controlsContainer.innerHTML = html;
    bindU1Events();

function bindU1Events() {
    const timeSlider = document.getElementById('timeSlider');
    if (timeSlider) {
        timeSlider.addEventListener('input', (e) => {
            state.timeOfDay = parseInt(e.target.value);
            document.getElementById('tVal').innerText = state.timeOfDay + ':00';
            playTone(400 + state.timeOfDay * 20, 0.05);
        });
    }
    const btnMorning = document.getElementById('btnMorning');
    if (btnMorning) btnMorning.onclick = () => { state.timeOfDay = 8; setupControls(); playTone(600, 0.1); };
    const btnNoon = document.getElementById('btnNoon');
    if (btnNoon) btnNoon.onclick = () => { state.timeOfDay = 12; setupControls(); playTone(800, 0.1); };
    const btnEvening = document.getElementById('btnEvening');
    if (btnEvening) btnEvening.onclick = () => { state.timeOfDay = 17; setupControls(); playTone(500, 0.1); };

    const btnStroke = document.getElementById('btnStroke');
    if (btnStroke) btnStroke.onclick = () => { state.hasMagnetized = true; playTone(880, 0.2); setupControls(); };
    const btnFloat = document.getElementById('btnFloat');
    if (btnFloat) btnFloat.onclick = () => { state.needleAngle = 0; playTone(600, 0.2); };

    const compassSlider = document.getElementById('compassSlider');
    if (compassSlider) {
        compassSlider.addEventListener('input', (e) => {
            state.compassAngle = parseInt(e.target.value);
            document.getElementById('cAngleVal').innerText = state.compassAngle + '°';
        });
    }
    const btnAlignCompass = document.getElementById('btnAlignCompass');
    if (btnAlignCompass) btnAlignCompass.onclick = () => { state.compassAngle = 0; setupControls(); playTone(900, 0.2); };

    const btnFindPolaris = document.getElementById('btnFindPolaris');
    if (btnFindPolaris) btnFindPolaris.onclick = () => { playTone(1200, 0.3); };
    const btnRotateSky = document.getElementById('btnRotateSky');
    if (btnRotateSky) btnRotateSky.onclick = () => { state.beidouRotate += 0.2; playTone(500, 0.1); };
}

        
function draw() {
    ctx.clearRect(0, 0, 720, 450);

    if (activeMode === 'sun_shadow') {
        drawSunShadow();
    } else if (activeMode === 'diy_compass' || activeMode === 'magnet_direction') {
        drawDiyCompass();
    } else if (activeMode === 'polaris') {
        drawPolarisScene();
    } else if (activeMode === 'nature_clues') {
        drawNatureScene();
    } else if (activeMode === 'compass_use') {
        drawCompassUse();
    } else if (activeMode === 'campus_map') {
        drawCampusMap();
    } else if (activeMode === 'tools_history') {
        drawToolsHistory();
    } else {
        drawCompassScene();
    }
    updateTelemetry();
    requestAnimationFrame(draw);
}

function drawSunShadow() {
    const cx = 360;
    // Ground
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 0, 720, 450);
    ctx.fillStyle = '#166534';
    ctx.fillRect(0, 320, 720, 130);

    // Sun movement arc: 6:00 (East x=100) -> 12:00 (South cx=360, y=80) -> 18:00 (West x=620)
    const prog = (state.timeOfDay - 6) / 12;
    const sunX = 100 + prog * 520;
    const sunY = 300 - Math.sin(prog * Math.PI) * 220;

    // Sun
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.arc(sunX, sunY, 26, 0, Math.PI * 2);
    ctx.fill();

    // Pole in center of ground
    ctx.fillStyle = '#cbd5e1';
    ctx.fillRect(cx - 4, 260, 8, 60);

    // Shadow cast on ground (opposite to sun)
    const shadowLen = (state.timeOfDay - 12) * 22; // negative morning, positive evening
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.beginPath();
    ctx.ellipse(cx - shadowLen, 325, Math.abs(shadowLen) * 0.7 + 10, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Compass labels
    ctx.fillStyle = '#94a3b8';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText('东 (East) 日出', 60, 310);
    ctx.fillText('西 (West) 日落', 660, 310);
    ctx.fillText('南 (South)', cx, 60);

    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    const dirTxt = state.timeOfDay < 12 ? '清晨: 太阳在东，影子指向西' : state.timeOfDay === 12 ? '正午: 太阳在正南，影子指向正北' : '傍晚: 太阳在西，影子指向东';
    ctx.fillText(`${state.timeOfDay}:00 太阳视运动与日影规律 【${dirTxt}】`, cx, 30);
}

function drawDiyCompass() {
    const cx = 360;
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, 720, 450);

    // Water Bowl
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.arc(cx, 230, 140, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 4;
    ctx.stroke();

    // Water inside
    ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
    ctx.beginPath();
    ctx.arc(cx, 230, 130, 0, Math.PI * 2);
    ctx.fill();

    // Floating foam pad
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(cx, 230, 45, 0, Math.PI * 2);
    ctx.fill();

    // Magnetized needle
    ctx.save();
    ctx.translate(cx, 230);
    if (!state.hasMagnetized) {
        ctx.rotate(0.8); // random angle
    } else {
        ctx.rotate(0); // pointing North!
    }

    // North end (Red)
    ctx.fillStyle = '#f43f5e';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(8, 0);
    ctx.lineTo(0, -70);
    ctx.lineTo(-8, 0);
    ctx.closePath();
    ctx.fill();

    // South end (Blue/Silver)
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(8, 0);
    ctx.lineTo(0, 70);
    ctx.lineTo(-8, 0);
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    if (state.hasMagnetized) {
        ctx.fillText('✅ 钢针已磁化: 水面自由旋转静止后，红色针尖准确指向北极(N)', cx, 50);
    } else {
        ctx.fillText('⚠️ 钢针未磁化: 请点击操作用磁铁单向摩擦20次赋予磁性', cx, 50);
    }
}

function drawPolarisScene() {
    const cx = 360;
    const cy = 230;
    ctx.fillStyle = '#020617';
    ctx.fillRect(0, 0, 720, 450);

    // North Star (Polaris) - Fixed at Center Top
    ctx.fillStyle = '#f8fafc';
    ctx.beginPath();
    ctx.arc(cx, 100, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText('✨ 北极星 (正北恒星)', cx + 15, 105);

    // Big Dipper (7 stars)
    ctx.save();
    ctx.translate(cx, 100);
    ctx.rotate(state.beidouRotate);

    const stars = [
        {x: 40, y: 150},  // 天枢 (Pointer 1)
        {x: 60, y: 190},  // 天璇 (Pointer 2)
        {x: 110, y: 200}, // 天玑
        {x: 100, y: 160}, // 天权
        {x: 150, y: 140}, // 玉衡
        {x: 190, y: 125}, // 开阳
        {x: 230, y: 135}  // 摇光 (勺柄)
    ];

    // Draw constellation lines
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(stars[0].x, stars[0].y);
    stars.forEach(s => ctx.lineTo(s.x, s.y));
    ctx.stroke();

    // 5x extension line from Pointer stars to Polaris
    ctx.strokeStyle = '#f59e0b';
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(stars[1].x, stars[1].y);
    ctx.lineTo(stars[0].x, stars[0].y);
    ctx.lineTo(0, 0); // connects to Polaris!
    ctx.stroke();
    ctx.setLineDash([]);

    // Stars
    ctx.fillStyle = '#f8fafc';
    stars.forEach((s, idx) => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, idx < 2 ? 6 : 4, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.restore();

    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('夜间寻星法: 找到北斗七星勺口两星(天璇向天枢)，延长5倍距离即为北极星(正北)', cx, 40);
}

function drawNatureScene() {
    const cx = 360;
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, 720, 450);

    // Big Tree
    ctx.fillStyle = '#d97706';
    ctx.fillRect(cx - 20, 220, 40, 160);

    // Foliage (South dense, North sparse)
    // Left: North (sparse), Right: South (dense)
    ctx.fillStyle = '#15803d';
    // North sparse foliage
    ctx.beginPath();
    ctx.arc(cx - 60, 180, 50, 0, Math.PI * 2);
    ctx.fill();

    // South luxuriant foliage
    ctx.fillStyle = '#16a34a';
    ctx.beginPath();
    ctx.arc(cx + 70, 160, 85, 0, Math.PI * 2);

    // Moss on North bark
    ctx.fillStyle = '#84cc16';
    ctx.fillRect(cx - 22, 250, 6, 80);

    ctx.font = 'bold 15px sans-serif';

    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('大自然的天然指南针: 观察植物生长向阳性与树轮疏密', cx, 40);
}


function drawCompassUse() {
    const cx = 360;
    const cy = 230;
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, 720, 450);

    // Transparent Baseplate
    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(cx - 160, cy - 140, 320, 280, 16);
    ctx.fill();
    ctx.stroke();

    // Sighting Wire and Direction of Travel Arrow
    ctx.strokeStyle = '#f43f5e';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 140);
    ctx.lineTo(cx, cy - 80);
    ctx.stroke();

    ctx.fillStyle = '#f43f5e';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 140);
    ctx.lineTo(cx - 10, cy - 120);
    ctx.lineTo(cx + 10, cy - 120);
    ctx.closePath();
    ctx.fill();

    // Rotating Azimuth Ring
    ctx.save();
    ctx.translate(cx, cy + 20);
    ctx.rotate(state.compassAngle * Math.PI / 180);

    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.arc(0, 0, 95, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Azimuth ticks & degrees
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    for (let deg = 0; deg < 360; deg += 30) {
        const rad = (deg - 90) * Math.PI / 180;
        const tx = Math.cos(rad) * 75;
        const ty = Math.sin(rad) * 75;
        ctx.fillText(deg + '°', tx, ty + 4);
    }
    ctx.fillStyle = '#f43f5e';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText('N', 0, -80);
    ctx.fillStyle = '#38bdf8';
    ctx.fillText('S', 0, 85);
    ctx.fillText('E', 80, 5);
    ctx.fillText('W', -80, 5);
    ctx.restore();

    // Magnetic Needle (Always points Geographic North)
    ctx.save();
    ctx.translate(cx, cy + 20);
    ctx.fillStyle = '#f43f5e';
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(8, 0); ctx.lineTo(0, -65); ctx.lineTo(-8, 0);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(8, 0); ctx.lineTo(0, 65); ctx.lineTo(-8, 0);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`专业户外罗盘使用法: 将前进方向对准目标，旋转刻度盘使底盘N与磁针红尖重合 (当前刻度: ${state.compassAngle}°)`, cx, 40);
}

function drawToolsHistory() {

        { t: '3. 明清·航海罗盘', d: '磁针与方位盘一体化\n郑和下西洋跨洋导航', c: '#38bdf8', x: 370 },

function drawCompassScene() {
    const cx = 360;
    const cy = 230;
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, 720, 450);

    // Outer Dial
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(state.compassAngle * Math.PI / 180);

    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.arc(0, 0, 130, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.fillStyle = '#cbd5e1';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('N (北)', 0, -100);
    ctx.fillText('S (南)', 0, 115);
    ctx.fillText('E (东)', 105, 5);
    ctx.fillText('W (西)', -105, 5);

    ctx.restore();

    // Magnetic Needle (Always points North = 0)
    ctx.fillStyle = '#f43f5e';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + 10, cy);
    ctx.lineTo(cx, cy - 85);
    ctx.lineTo(cx - 10, cy);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + 10, cy);
    ctx.lineTo(cx, cy + 85);
    ctx.lineTo(cx - 10, cy);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    const isAligned = Math.abs(state.compassAngle) < 3;
    ctx.fillText(isAligned ? '✅ 罗盘刻度已与磁针重合: 正确测定方位!' : '转动罗盘底盘，使底盘的“北(N)”与磁针红尖重合', cx, 40);
}

        
function updateTelemetry() {
    let txt = `[方向观测数据就绪] 模式: ${activeMode} | `;
    if (activeMode === 'sun_shadow') {
        txt += `时间: ${state.timeOfDay}:00 | 影子指向: ${state.timeOfDay<12?'西':'东'}`;
    } else if (activeMode === 'diy_compass') {
        txt += `磁化状态: ${state.hasMagnetized?'已磁化':'未磁化'} | 指向: 北极(N)`;
    } else {
        txt += `底盘偏角: ${state.compassAngle}° | 磁偏角校正: 正常`;
    }
    telem.innerText = txt;
}
