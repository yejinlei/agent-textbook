<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【岩石、土壤和我们】真实验微仿真 - 四年级科学</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #f59e0b;
            --green: #10b981;
            --cyan: #38bdf8;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        header {
            width: 100%;
            max-width: 980px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        header h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
        .badge { background: rgba(245, 158, 11, 0.15); color: var(--accent); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; }
        .back-link { color: var(--cyan); text-decoration: none; font-size: 0.88rem; }
        .layout {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }
        .canvas-box {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #020617;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 620px;
            height: 420px;
            touch-action: none;
        }
        .controls {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inquiry {
            background: rgba(245, 158, 11, 0.08);
            border-left: 3px solid var(--accent);
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.82rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .c-group { display: flex; flex-direction: column; gap: 6px; }
        .c-group label { font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; }
        .c-group input[type=range] { accent-color: var(--accent); cursor: pointer; }
        .btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-sec { background: #334155; color: #f8fafc; }
        .telemetry {
            background: #090d16;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #334155;
            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: var(--accent);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>🔬 岩石、土壤和我们 <span class="badge">四年级下册 · 岩石与土壤</span></h2>
            <p>教科版科学原书地质与土壤实验真拟真 · 拒绝伪仿真</p>
        </div>
        <a href="mineral_soil_lab.html" class="master-lab-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 14px rgba(245, 158, 11, 0.4); margin-left: 10px;" title="进入全景开放式大师级科学综合实验室">🏆 进入大师级实验室 · 矿物晶体与土壤成分实验室 →</a>
        <a href="index.html" class="back-link">← 返回实验大厅</a>
    </header>
    <div class="layout">
        <div class="canvas-box">
            <canvas id="simCanvas" width="620" height="420"></canvas>
            <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted);">
                <span>💡 原生岩土物理与矿物学仿真</span>
                <span>🎧 Web Audio 拟真刻画/水流/滴答声效</span>
            </div>
        </div>
        <div class="controls">
            <div class="inquiry"><strong>🎯 探究任务</strong>：水土流失降雨冲刷对比模拟：模拟强降雨冲刷裸露荒坡与草皮梯田，观察植被根系固土减缓暴雨冲刷、防止泥石流塌方的巨大生态屏障作用！</div>
            
        <div class="c-group">
            <button class="btn" id="btnStartRain">🌧️ 开启强降雨冲刷山坡 (持续 5 秒)</button>
        </div>
        <div class="telemetry" id="telem">
            [生态对照组] 左侧：裸露荒坡 / 右侧：长满草皮梯田<br>
            [大概念] 植物根系如巨网紧抓土壤，落叶增加有机质，是保护水土资源的生命绿盾！
        </div>
    
        </div>
    </div>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function playTone(freq=440, type='sine', dur=0.2, vol=0.1) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function playScratch() {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const dur = 0.15;
                const bufferSize = audioCtx.sampleRate * dur;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.4;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                noise.connect(gain); gain.connect(audioCtx.destination);
                noise.start();
            } catch(e){}
        }
        
        let isRaining = false;
        let rainDrops = [];
        let soilErosionLeft = 0;
        const telem = document.getElementById('telem');

        document.getElementById('btnStartRain').addEventListener('click', () => {
            isRaining = true;
            playTone(300, 'triangle', 0.5);
            let timer = setInterval(() => {
                soilErosionLeft += 2.5;
                if(soilErosionLeft >= 60) {
                    clearInterval(timer); isRaining = false;
                    telem.innerHTML = '🌊 [暴雨冲刷结果]<br>• 裸露山坡：泥沙俱下，水质混浊泛黄，形成严重水土流失！<br>• 植被山坡：草皮阻挡水流，出水口汇出清澈泉水！土壤安然无恙！';
                }
            }, 100);
        });
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;

            // Left: Bare slope
            ctx.fillStyle = '#78350f';
            ctx.beginPath();
            ctx.moveTo(40, 160 + soilErosionLeft);
            ctx.lineTo(260, 320);
            ctx.lineTo(40, 320);
            ctx.fill();
            ctx.fillStyle = '#ef4444'; ctx.font = '14px sans-serif';
            ctx.fillText('裸露荒坡 (水土流失)', 60, 350);

            // Right: Vegetated slope
            ctx.fillStyle = '#78350f';
            ctx.beginPath();
            ctx.moveTo(340, 160); ctx.lineTo(560, 320); ctx.lineTo(340, 320); ctx.fill();
            // Grass green layer on top
            ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 8;
            ctx.beginPath(); ctx.moveTo(340, 160); ctx.lineTo(560, 320); ctx.stroke();
            ctx.fillStyle = '#22c55e'; ctx.font = '14px sans-serif';
            ctx.fillText('植被草皮坡 (保持水土)', 360, 350);

            // Rain particles
            if(isRaining) {
                ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1.5;
                for(let i=0; i<25; i++) {
                    const rx = Math.random() * w;
                    const ry = Math.random() * 200;
                    ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 3, ry + 15); ctx.stroke();
                }
            }

            requestAnimationFrame(render);
        }
        render();
    
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
