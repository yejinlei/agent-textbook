<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【电路中的开关】真实验微仿真 - 四年级科学</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --green: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        header {
            width: 100%;
            max-width: 980px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        header h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
        .badge { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 0.88rem; }
        .layout {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }
        .canvas-box {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #020617;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 620px;
            height: 420px;
            touch-action: none;
        }
        .controls {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inquiry {
            background: rgba(56, 189, 248, 0.08);
            border-left: 3px solid var(--accent);
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.82rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .c-group { display: flex; flex-direction: column; gap: 6px; }
        .c-group label { font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; }
        .c-group input[type=range] { accent-color: var(--accent); cursor: pointer; }
        .btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-sec { background: #334155; color: #f8fafc; }
        .telemetry {
            background: #090d16;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #334155;
            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: var(--accent);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>🔬 电路中的开关 <span class="badge">四年级下册 · 电路单元</span></h2>
            <p>教科版科学原书电路真实验 · 拒绝伪仿真</p>
        </div>
        <a href="circuit_sandbox.html" class="master-lab-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 14px rgba(245, 158, 11, 0.4); margin-left: 10px;" title="进入全景开放式大师级科学综合实验室">🏆 进入大师级实验室 · 大师级闭合回路电子沙盒 →</a>
        <a href="index.html" class="back-link">← 返回实验大厅</a>
    </header>
    <div class="layout">
        <div class="canvas-box">
            <canvas id="simCanvas" width="620" height="420"></canvas>
            <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted);">
                <span>💡 原生真实闭合回路与电子流动画</span>
                <span>🎧 Web Audio 拟真通电/短路警报音效</span>
            </div>
        </div>
        <div class="controls">
            <div class="inquiry"><strong>🎯 探究任务</strong>：单刀双掷开关控制红绿灯模拟：拨动开关闸刀切换接通红灯回路与绿灯回路，体验交通信号灯电路控制逻辑！</div>
            
        <div class="c-group">
            <button class="btn" id="btnToggleSPDT">🚦 切换开关闸刀方向 (红灯 / 绿灯)</button>
        </div>
        <div class="telemetry" id="telem">
            [开关状态] 闸刀接入红灯回路<br>
            [红灯状态] 🔴 红灯高亮！车辆行人请止步！<br>
            [绿灯状态] ⚪ 熄灭断路<br>
            [开关原理] 通过机械开合灵活重定向电流路径！
        </div>
    
        </div>
    </div>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function playTone(freq=440, type='sine', dur=0.2, vol=0.1) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function playClick() { playTone(800, 'square', 0.04, 0.08); }
        
        let lightRed = true;
        const telem = document.getElementById('telem');

        document.getElementById('btnToggleSPDT').addEventListener('click', () => {
            lightRed = !lightRed;
            playClick();
            playTone(lightRed ? 350 : 550, 'sine', 0.2);
            telem.innerHTML = lightRed ?
                '[开关状态] 接通上触点<br>[交通信号] 🔴 红灯亮起！(车辆行人停止通行)' :
                '[开关状态] 接通下触点<br>[交通信号] 🟢 绿灯亮起！(准许安全通行)';
        });
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;

            // Traffic Light Box on right
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(440, 120, 70, 160);
            ctx.strokeStyle = '#475569'; ctx.lineWidth = 3;
            ctx.strokeRect(440, 120, 70, 160);

            // Red Lamp
            ctx.fillStyle = lightRed ? '#ef4444' : '#450a0a';
            ctx.beginPath(); ctx.arc(475, 160, 22, 0, Math.PI*2); ctx.fill();
            if(lightRed) { ctx.strokeStyle = '#fca5a5'; ctx.lineWidth = 4; ctx.stroke(); }

            // Green Lamp
            ctx.fillStyle = !lightRed ? '#10b981' : '#064e3b';
            ctx.beginPath(); ctx.arc(475, 235, 22, 0, Math.PI*2); ctx.fill();
            if(!lightRed) { ctx.strokeStyle = '#6ee7b7'; ctx.lineWidth = 4; ctx.stroke(); }

            // SPDT Switch on left
            ctx.fillStyle = '#cbd5e1';
            ctx.beginPath(); ctx.arc(160, 200, 6, 0, Math.PI*2); ctx.fill(); // Pole
            ctx.beginPath(); ctx.arc(240, 160, 6, 0, Math.PI*2); ctx.fill(); // Throw 1 (Red)
            ctx.beginPath(); ctx.arc(240, 240, 6, 0, Math.PI*2); ctx.fill(); // Throw 2 (Green)

            // Switch Blade
            ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(160, 200);
            ctx.lineTo(240, lightRed ? 160 : 240);
            ctx.stroke();

            requestAnimationFrame(render);
        }
        render();
    
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
