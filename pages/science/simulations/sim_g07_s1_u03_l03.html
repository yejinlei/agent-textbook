<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【声音的高低】真实验微仿真 - 四年级科学</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --green: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        header {
            width: 100%;
            max-width: 980px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        header h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
        .badge { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 0.88rem; }
        .layout {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }
        .canvas-box {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #020617;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 620px;
            height: 420px;
            touch-action: none;
        }
        .controls {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inquiry {
            background: rgba(56, 189, 248, 0.08);
            border-left: 3px solid var(--accent);
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.82rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .c-group { display: flex; flex-direction: column; gap: 6px; }
        .c-group label { font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; }
        .c-group input[type=range] { accent-color: var(--accent); cursor: pointer; }
        .btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-sec { background: #334155; color: #f8fafc; }
        .telemetry {
            background: #090d16;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #334155;
            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: var(--accent);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>🔬 声音的高低 <span class="badge">四年级上册 · 声音单元</span></h2>
            <p>教科版科学原书真实声学物理实验 · 拒绝伪仿真</p>
        </div>
        <a href="acoustics_oscilloscope.html" class="master-lab-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 14px rgba(245, 158, 11, 0.4); margin-left: 10px;" title="进入全景开放式大师级科学综合实验室">🏆 进入大师级实验室 · 双通道声波示波器与音调实验室 →</a>
        <a href="index.html" class="back-link">← 返回实验大厅</a>
    </header>
    <div class="layout">
        <div class="canvas-box">
            <canvas id="simCanvas" width="620" height="420"></canvas>
            <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted);">
                <span>💡 原生真实声学振动与物理波形仿真</span>
                <span>🎧 Web Audio 真实音调与频谱生成</span>
            </div>
        </div>
        <div class="controls">
            <div class="inquiry"><strong>🎯 探究任务</strong>：钢尺伸出桌面长度与音调高低实验：伸出 5cm 钢尺振动飞快发出 650Hz 清脆高音；伸出 20cm 钢尺慢条斯理振动发出 130Hz 低沉低音！</div>
            
        <div class="c-group">
            <label><span>钢尺伸出桌面长度 (cm)</span><span id="lenDisp">10 cm</span></label>
            <input type="range" id="lenSlider" min="5" max="25" value="10">
        </div>
        <div class="c-group">
            <button class="btn" id="btnPluckRuler">📐 拨动钢尺端头发声</button>
        </div>
        <div class="telemetry" id="telem">
            [钢尺伸出长度] 10 cm<br>
            [振动快慢] 较快 (约 440 Hz)<br>
            [音调高低] 中高音 (A4 音准)<br>
            [大概念] 伸出越短，振动越快，音调越高！伸出越长，振动越慢，音调越低！
        </div>
    
        </div>
    </div>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function playTone(freq=440, type='sine', dur=0.3, vol=0.1) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        
        let vibrating = false;
        let t = 0;
        let vibeAmp = 0;
        const slider = document.getElementById('lenSlider');
        const disp = document.getElementById('lenDisp');
        const telem = document.getElementById('telem');

        slider.addEventListener('input', () => {
            disp.textContent = slider.value + ' cm';
        });
        document.getElementById('btnPluckRuler').addEventListener('click', () => {
            const l = parseFloat(slider.value);
            const freq = Math.round(700 - l * 23); // 5cm -> 585Hz, 25cm -> 125Hz
            vibeAmp = 35;
            playTone(freq, 'sine', 0.8, 0.15);
            telem.innerHTML = `[钢尺伸出长度] ${l} cm<br>[振动频率] ${freq} Hz (${l<12?'极快 (高音)':'沉稳缓慢 (低音)'})<br>[音调判定] ${l<10?'高音 (尖锐高昂)':(l>18?'低音 (低沉沉重)':'中音')}<br>[结论] 音调完全取决于振动频率快慢！`;
        });
        function render() {
            t += 0.1;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;
            const l = parseFloat(slider.value);

            // Table top
            ctx.fillStyle = '#475569';
            ctx.fillRect(60, 240, 200, 120);

            // Steel ruler clamped to desk
            const deskEdge = 260;
            const rulerExtend = l * 10;
            const tipVibe = Math.sin(t * (30 - l)) * vibeAmp;

            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(80, 230, deskEdge - 80, 10); // on desk part

            // Extending vibrating part
            ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(deskEdge, 235);
            ctx.quadraticCurveTo(deskEdge + rulerExtend/2, 235 + tipVibe/2, deskEdge + rulerExtend, 235 + tipVibe);
            ctx.stroke();

            // Hand pressing clamp
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(160, 205, 50, 25);
            ctx.fillStyle = '#0f172a'; ctx.font = '11px sans-serif';
            ctx.fillText('手掌按压', 165, 222);

            vibeAmp *= 0.96;
            requestAnimationFrame(render);
        }
        render();
    
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
