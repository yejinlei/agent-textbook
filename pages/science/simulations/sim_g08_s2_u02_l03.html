<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【简易电路】真实验微仿真 - 四年级科学</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --green: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        header {
            width: 100%;
            max-width: 980px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        header h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
        .badge { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 0.88rem; }
        .layout {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }
        .canvas-box {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #020617;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 620px;
            height: 420px;
            touch-action: none;
        }
        .controls {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inquiry {
            background: rgba(56, 189, 248, 0.08);
            border-left: 3px solid var(--accent);
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.82rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .c-group { display: flex; flex-direction: column; gap: 6px; }
        .c-group label { font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; }
        .c-group input[type=range] { accent-color: var(--accent); cursor: pointer; }
        .btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-sec { background: #334155; color: #f8fafc; }
        .telemetry {
            background: #090d16;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #334155;
            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: var(--accent);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>🔬 简易电路 <span class="badge">四年级下册 · 电路单元</span></h2>
            <p>教科版科学原书电路真实验 · 拒绝伪仿真</p>
        </div>
        <a href="circuit_sandbox.html" class="master-lab-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 14px rgba(245, 158, 11, 0.4); margin-left: 10px;" title="进入全景开放式大师级科学综合实验室">🏆 进入大师级实验室 · 大师级闭合回路电子沙盒 →</a>
        <a href="index.html" class="back-link">← 返回实验大厅</a>
    </header>
    <div class="layout">
        <div class="canvas-box">
            <canvas id="simCanvas" width="620" height="420"></canvas>
            <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted);">
                <span>💡 原生真实闭合回路与电子流动画</span>
                <span>🎧 Web Audio 拟真通电/短路警报音效</span>
            </div>
        </div>
        <div class="controls">
            <div class="inquiry"><strong>🎯 探究任务</strong>：标准简易电路组装：电池盒、小灯座、闸刀开关串联连接！点击闭合闸刀开关，观察黄色流动电子与小灯泡点亮！</div>
            
        <div class="c-group">
            <button class="btn" id="btnToggleSwitch">🔘 切换闸刀开关 (闭合 / 断开)</button>
        </div>
        <div class="telemetry" id="telem">
            [开关状态] 开关已断开 (断路)<br>
            [回路电流] 0.00 A<br>
            [用电规范] 电路中必须有开关作为电源通断控制元件！
        </div>
    
        </div>
    </div>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function playTone(freq=440, type='sine', dur=0.2, vol=0.1) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function playClick() { playTone(800, 'square', 0.04, 0.08); }
        
        let switchClosed = false;
        let t = 0;
        const telem = document.getElementById('telem');

        document.getElementById('btnToggleSwitch').addEventListener('click', () => {
            switchClosed = !switchClosed;
            playClick();
            if(switchClosed) playTone(440, 'sine', 0.2);
            telem.innerHTML = switchClosed ?
                '💡 [开关已闭合] 通路形成！自由电子定向高速漂移，小灯泡持续发光！电流 0.25 A' :
                '🔌 [开关已断开] 回路断开，自由电子停止定向移动，小灯泡熄灭。';
        });
        function render() {
            t += 0.05;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;

            // Wire Rectangle Path
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 4;
            ctx.strokeRect(100, 120, 420, 180);

            // Battery Holder at Top Center
            ctx.fillStyle = '#334155';
            ctx.fillRect(w/2 - 40, 105, 80, 30);
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(w/2 - 30, 112, 60, 16);

            // Bulb Socket at Right Center
            ctx.fillStyle = '#475569';
            ctx.fillRect(505, 190, 30, 40);
            ctx.fillStyle = switchClosed ? '#fde047' : '#94a3b8';
            ctx.beginPath(); ctx.arc(520, 175, 18, 0, Math.PI*2); ctx.fill();

            // Knife Switch at Bottom Center
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(w/2 - 45, 290, 90, 20); // base
            ctx.fillStyle = '#cbd5e1';
            ctx.beginPath(); ctx.arc(w/2 - 25, 300, 5, 0, Math.PI*2); ctx.fill(); // Contact 1
            ctx.beginPath(); ctx.arc(w/2 + 25, 300, 5, 0, Math.PI*2); ctx.fill(); // Contact 2

            // Switch Blade
            ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(w/2 - 25, 300);
            ctx.lineTo(w/2 + (switchClosed ? 25 : 15), switchClosed ? 300 : 275);
            ctx.stroke();

            // Flowing Electrons
            if(switchClosed) {
                ctx.fillStyle = '#fef08a';
                for(let i=0; i<16; i++) {
                    const progress = (t * 60 + i * 40) % 1200;
                    let ex = 100, ey = 120;
                    if(progress < 420) { ex = 100 + progress; ey = 120; }
                    else if(progress < 600) { ex = 520; ey = 120 + (progress - 420); }
                    else if(progress < 1020) { ex = 520 - (progress - 600); ey = 300; }
                    else { ex = 100; ey = 300 - (progress - 1020); }
                    ctx.beginPath(); ctx.arc(ex, ey, 3.5, 0, Math.PI*2); ctx.fill();
                }
            }

            requestAnimationFrame(render);
        }
        render();
    
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
