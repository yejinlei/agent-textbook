            border: 1px solid #334155;
            width: 100%;

            height: 420px;
            touch-action: none;
        }
        .controls {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inquiry {
            background: rgba(16, 185, 129, 0.08);
            border-left: 3px solid var(--green);
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;

        .c-group { display: flex; flex-direction: column; gap: 6px; }

        .btn {

            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: var(--green);
            line-height: 1.6;
        }

</head>
<body>
    <header>
        <div>
            <h2>🔬 胃和小肠里的消化 <span class="badge">四年级上册 · 呼吸与消化</span></h2>

    <div class="layout">
        <div class="canvas-box">
            <canvas id="simCanvas" width="620" height="420"></canvas>
            <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted);">
                <span>💡 人体生理器官动态解剖交互</span>
                <span>🎧 Web Audio 拟真呼吸/心跳/水泡声效</span>
            </div>
        </div>
        <div class="controls">
            <div class="inquiry"><strong>🎯 探究任务</strong>：模拟胃酸研磨与小肠绒毛微观吸收：胃壁强力蠕动研磨食糜并分泌胃蛋白酶，小肠绒毛增大数十倍表面积吸收葡萄糖与氨基酸！</div>
            
        <div class="c-group">
            <button class="btn" id="btnStomachChurn">🫃 胃部机械蠕动研磨 (强酸环境 pH 2)</button>
            <button class="btn btn-sec" id="btnIntestineAbsorb">🔬 放大观察小肠绒毛微观吸收</button>
        </div>
        <div class="telemetry" id="telem">
            [胃内环境] 胃壁肌肉平滑收缩，胃酸杀菌并水解蛋白质！<br>
            [小肠环境] 全身最重要的营养吸收器官，肠绒毛展开表面积达 200 平方米！
        </div>
    
        </div>
    </div>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function playTone(freq=440, type='sine', dur=0.15, vol=0.08) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function playBreath(isInhale=true) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const dur = 0.6;
                const bufferSize = audioCtx.sampleRate * dur;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(isInhale ? 400 : 250, audioCtx.currentTime);
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start();
            } catch(e){}
        }
        function playHeartbeat() {
            playTone(80, 'sine', 0.12, 0.15);
            setTimeout(() => playTone(65, 'sine', 0.12, 0.12), 160);
        }
        
        let view = 'stomach';
        let t = 0;
        const telem = document.getElementById('telem');

        document.getElementById('btnStomachChurn').addEventListener('click', () => {
            view = 'stomach';
            playTone(160, 'triangle', 0.3);
            telem.innerHTML = '[胃部研磨] 蠕动将食物研磨成食糜，胃蛋白酶初步消化肉类！';
        });
        document.getElementById('btnIntestineAbsorb').addEventListener('click', () => {
            view = 'villi';
            playTone(520, 'sine', 0.2);
            telem.innerHTML = '[小肠绒毛微观] 密布的微绒毛与毛细血管正在贪婪吸收葡萄糖与氨基酸分子！';
        });
        function render() {
            t += 0.04;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;

            if(view === 'stomach') {
                // Stomach organ contracting
                const churn = Math.sin(t*2) * 12;
                ctx.fillStyle = 'rgba(239, 68, 68, 0.4)';
                ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.ellipse(w/2, h/2, 110 + churn, 70 - churn, Math.PI/6, 0, Math.PI*2);
                ctx.fill(); ctx.stroke();

                // Chyme particles bouncing
                ctx.fillStyle = '#f59e0b';
                for(let i=0; i<30; i++) {
                    const px = w/2 + Math.sin(i*13 + t*5) * 60;
                    const py = h/2 + Math.cos(i*17 + t*5) * 40;
                    ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI*2); ctx.fill();
                }
                ctx.fillStyle = '#f8fafc'; ctx.font = '14px sans-serif';
                ctx.fillText('胃壁研磨蠕动', w/2 - 40, h/2 - 90);
            } else {
                // Microscopic Intestinal Villi
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, w, h);
                ctx.strokeStyle = '#10b981'; ctx.lineWidth = 5;

                for(let vx=60; vx<w-60; vx+=50) {
                    // Draw villus finger-like projection
                    ctx.fillStyle = 'rgba(16, 185, 129, 0.3)';
                    ctx.beginPath();
                    ctx.moveTo(vx - 18, 360);
                    ctx.lineTo(vx - 18, 140);
                    ctx.arc(vx, 140, 18, Math.PI, 0);
                    ctx.lineTo(vx + 18, 360);
                    ctx.fill(); ctx.stroke();

                    // Capillary loop inside
                    ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(vx, 360); ctx.lineTo(vx, 150); ctx.stroke();
                }
                // Absorbing nutrient molecules
                ctx.fillStyle = '#fde047';
                for(let j=0; j<25; j++) {
                    const nx = 60 + ((j*23 + t*40) % (w-120));
                    const ny = 100 + ((j*17) % 60);
                    ctx.beginPath(); ctx.arc(nx, ny, 3.5, 0, Math.PI*2); ctx.fill();
                }
            }
            requestAnimationFrame(render);
        }
        render();
    
    </script>
