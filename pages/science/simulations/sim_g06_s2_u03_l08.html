    <script>
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        function playTone(freq, duration, type='sine') {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

function bindU3Events() {
    const moonDaySlider = document.getElementById('moonDaySlider');

            state.moonPhaseDay = parseInt(e.target.value);
            document.getElementById('dayVal').innerText = '农历 ' + state.moonPhaseDay + ' 日';
            playTone(400 + state.moonPhaseDay * 15, 0.05);
        });
    }
    const btnNewMoon = document.getElementById('btnNewMoon');
    if (btnNewMoon) btnNewMoon.onclick = () => { state.moonPhaseDay = 1; setupControls(); playTone(300, 0.1); };
    const btnFirstQuarter = document.getElementById('btnFirstQuarter');
    if (btnFirstQuarter) btnFirstQuarter.onclick = () => { state.moonPhaseDay = 8; setupControls(); playTone(500, 0.1); };
    const btnFullMoon = document.getElementById('btnFullMoon');
    if (btnFullMoon) btnFullMoon.onclick = () => { state.moonPhaseDay = 15; setupControls(); playTone(880, 0.2); };
    const btnLastQuarter = document.getElementById('btnLastQuarter');
    if (btnLastQuarter) btnLastQuarter.onclick = () => { state.moonPhaseDay = 23; setupControls(); playTone(600, 0.1); };

    const dropHSlider = document.getElementById('dropHSlider');
    if (dropHSlider) {
        dropHSlider.addEventListener('input', (e) => {
            state.dropHeight = parseInt(e.target.value);
            document.getElementById('hVal').innerText = state.dropHeight + ' cm';
        });
    }
    const btnImpact = document.getElementById('btnImpact');
    if (btnImpact) btnImpact.onclick = () => {
        state.craterDiameter = Math.round(25 + state.dropHeight * 0.8);
        playTone(150, 0.3, 'sawtooth');
    };
    const btnSmooth = document.getElementById('btnSmooth');
    if (btnSmooth) btnSmooth.onclick = () => { state.craterDiameter = 0; playTone(400, 0.1); };

    const shipSlider = document.getElementById('shipSlider');
    if (shipSlider) {
        shipSlider.addEventListener('input', (e) => {
            state.shipDistance = parseInt(e.target.value);
            document.getElementById('distVal').innerText = state.shipDistance + ' km';
        });
    }
    const btnSailOut = document.getElementById('btnSailOut');
    if (btnSailOut) btnSailOut.onclick = () => { state.shipDistance = 80; setupControls(); playTone(500, 0.1); };
    const btnSailIn = document.getElementById('btnSailIn');
    if (btnSailIn) btnSailIn.onclick = () => { state.shipDistance = 15; setupControls(); playTone(700, 0.1); };

    const sdSlider = document.getElementById('sdSlider');

}

        
function draw() {
    ctx.clearRect(0, 0, 720, 450);
    ctx.fillStyle = '#020617';
    ctx.fillRect(0, 0, 720, 450);

    if (activeMode === 'sun_moon_size') {
        drawSunMoonPerspective();
    } else if (activeMode === 'shadow_secret') {
        drawShadowSecret();
    } else if (activeMode === 'moon_phases') {
        drawMoonPhases();
    } else if (activeMode === 'crater_impact') {
        drawCraterImpact();
    } else if (activeMode === 'earth_sphere') {
        drawEarthSphere();
    } else if (activeMode === 'water_planet') {
        drawWaterPlanetGrid();
    } else if (activeMode === 'three_bodies') {
        drawThreeBodiesOrbit();
    } else if (activeMode === 'sundial_shadow') {
        drawSundialScene();
    } else {
        drawSundialScene();
    }

    updateTelemetry();
    requestAnimationFrame(draw);
}

function drawMoonPhases() {
    const cx = 360;
    const cy = 210;

    // Outer Space with Moon
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    let phaseName = '新月';
    if (state.moonPhaseDay >= 2 && state.moonPhaseDay <= 6) phaseName = '蛾眉月';
    else if (state.moonPhaseDay >= 7 && state.moonPhaseDay <= 9) phaseName = '上弦月 (西半边亮)';
    else if (state.moonPhaseDay >= 10 && state.moonPhaseDay <= 13) phaseName = '凸月';
    else if (state.moonPhaseDay >= 14 && state.moonPhaseDay <= 17) phaseName = '满月 (望)';
    else if (state.moonPhaseDay >= 18 && state.moonPhaseDay <= 21) phaseName = '凸月 (下凸)';
    else if (state.moonPhaseDay >= 22 && state.moonPhaseDay <= 24) phaseName = '下弦月 (东半边亮)';
    else if (state.moonPhaseDay >= 25 && state.moonPhaseDay <= 29) phaseName = '残月';
    ctx.fillText(`农历 ${state.moonPhaseDay} 日月相: 【${phaseName}】`, cx, 40);

    // Dark Moon Sphere
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.arc(cx, cy, 110, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Illumination calculation
    const phaseAngle = ((state.moonPhaseDay - 1) / 29.5) * Math.PI * 2;
    const lightK = Math.cos(phaseAngle);

    // Lit area
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    if (state.moonPhaseDay <= 15) {
        ctx.arc(cx, cy, 110, -Math.PI / 2, Math.PI / 2, false);
        ctx.ellipse(cx, cy, Math.abs(lightK) * 110, 110, 0, Math.PI / 2, -Math.PI / 2, lightK > 0);
    } else {
        ctx.arc(cx, cy, 110, Math.PI / 2, -Math.PI / 2, false);
        ctx.ellipse(cx, cy, Math.abs(lightK) * 110, 110, 0, -Math.PI / 2, Math.PI / 2, lightK > 0);
    }
    ctx.fill();

    ctx.fillStyle = '#94a3b8';
    ctx.font = '14px sans-serif';
    ctx.fillText('🌍 地球观察者视角 (亮面朝向太阳反射光路)', cx, 360);
}

function drawCraterImpact() {
    const cx = 360;
    ctx.fillStyle = '#334155';
    ctx.fillRect(160, 240, 400, 130);

    ctx.fillStyle = '#e2e8f0';
    ctx.fillRect(170, 250, 380, 110);

    ctx.fillStyle = '#f43f5e';
    const ballY = 240 - state.dropHeight * 2.5;
    ctx.beginPath();
    ctx.arc(cx, ballY, 12, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#38bdf8';
    ctx.beginPath();
    ctx.moveTo(cx - 50, 240);
    ctx.lineTo(cx - 50, ballY);
    ctx.stroke();
    ctx.fillStyle = '#38bdf8';
    ctx.font = '12px sans-serif';
    ctx.fillText(`${state.dropHeight} cm`, cx - 95, (240 + ballY) / 2);

    if (state.craterDiameter > 0) {
        ctx.fillStyle = '#94a3b8';
        ctx.beginPath();
        ctx.ellipse(cx, 260, state.craterDiameter / 2, state.craterDiameter / 4, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#f8fafc';
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 8; i++) {
            const a = i * Math.PI / 4;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(a) * (state.craterDiameter / 2), 260 + Math.sin(a) * (state.craterDiameter / 4));
            ctx.lineTo(cx + Math.cos(a) * (state.craterDiameter / 2 + 30), 260 + Math.sin(a) * (state.craterDiameter / 4 + 15));
            ctx.stroke();
        }

        ctx.fillStyle = '#10b981';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`撞击坑深度与直径: ${state.craterDiameter} mm (高度越大，势能越大，撞击坑越大越深)`, cx, 405);
    }

    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('月球环形山成因模拟实验 (陨石撞击学说)', cx, 40);
}

function drawEarthSphere() {
    const cx = 360;
    ctx.fillStyle = '#0284c7';
    ctx.beginPath();
    ctx.arc(cx, 1200, 1000, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(180, 200, 8, 25);
    ctx.fillText('👀 观察者', 170, 190);

    const sx = 250 + state.shipDistance * 3.2;
    const curveDrop = Math.pow(state.shipDistance / 10, 2) * 2.2;
    const sy = 200 + curveDrop;

    if (curveDrop < 40) {
        ctx.fillStyle = '#d97706';
        ctx.fillRect(sx, sy, 35, 15);
    }
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(sx + 15, sy + 15);
    ctx.lineTo(sx + 15, sy - 30);
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(sx + 15, sy - 28);
    ctx.lineTo(sx + 30, sy - 10);
    ctx.lineTo(sx + 15, sy - 5);
    ctx.fill();

    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    const obsTxt = curveDrop > 25 ? '远航帆船船身已被地球曲面遮挡，仅可见桅杆顶端 (证明地球是球体!)' : '近距离时，可完整看到帆船船身与桅杆';
    ctx.fillText(`帆船远航海平线实验 【${obsTxt}】`, cx, 40);
}


function drawSunMoonPerspective() {
    const cx = 360;
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🔭 仰望星空: 太阳直径是月球的 400 倍，但日地距离也是月地距离的 400 倍 (透视近大远小)', cx, 40);

    // Left: Giant Sun in background
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.arc(140, 230, 90, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText('☀️ 太阳 (远 1.5亿km)', 140, 345);
    ctx.font = '12px sans-serif';
    ctx.fillText('直径 1,392,000 km', 140, 365);

    // Right: Small Moon closer
    ctx.fillStyle = '#cbd5e1';
    ctx.beginPath();
    ctx.arc(360, 230, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText('🌙 月球 (近 38万km)', 360, 280);
    ctx.font = '12px sans-serif';
    ctx.fillText('直径 3,474 km', 360, 300);

    // Human observer on right
    ctx.fillStyle = '#10b981';
    ctx.beginPath();
    ctx.arc(600, 230, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillText('👀 地球人眼', 600, 270);

    // Perspective sight lines from eye
    ctx.strokeStyle = '#f43f5e';
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(600, 230); ctx.lineTo(140, 230 - 90);
    ctx.moveTo(600, 230); ctx.lineTo(140, 230 + 90);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#f59e0b';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('结论: 视角大小完全相同 (约 0.5° 视直径)，因此在地球上看去太阳和月球几乎一样大!', cx, 410);
}

function drawShadowSecret() {
    const cx = 360;
    const cy = 230;
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';

    ctx.fillRect(100, cy - 25, 70, 50);
    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.moveTo(170, cy - 35); ctx.lineTo(200, cy - 45); ctx.lineTo(200, cy + 45); ctx.lineTo(170, cy + 35);
    ctx.fill();
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('🔦 光源 (手电筒)', 140, cy + 65);

    // Light beam cone
    ctx.fillStyle = 'rgba(254, 240, 138, 0.25)';

}

function drawWaterPlanetGrid() {
    const cx = 360;
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🌊 地球——水的星球: 10×10 百格网格法测定地球水陆面积比例', cx, 40);

    const startX = cx - 150;
    const startY = 80;
    const cellSize = 30;

    // 100 cells: 71 water (blue), 29 land (green)
    for (let row = 0; row < 10; row++) {
        for (let col = 0; col < 10; col++) {
            const idx = row * 10 + col;
            const isWater = idx < 71;
            ctx.fillStyle = isWater ? '#0284c7' : '#15803d';
            ctx.fillRect(startX + col * cellSize, startY + row * cellSize, cellSize - 2, cellSize - 2);
        }
    }

    // Legend on the right
    ctx.fillStyle = '#0284c7';
    ctx.fillRect(cx + 180, 120, 25, 25);
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('海洋面积: 约 71% (71格)', cx + 215, 138);

    ctx.fillStyle = '#15803d';
    ctx.fillRect(cx + 180, 170, 25, 25);
    ctx.fillStyle = '#f8fafc';
    ctx.fillText('陆地面积: 约 29% (29格)', cx + 215, 188);

    ctx.fillStyle = '#38bdf8';
    ctx.font = '13px sans-serif';
    ctx.fillText('全球海洋面积约 3.61亿平方千米', cx + 180, 230);
    ctx.fillText('陆地面积约 1.49亿平方千米', cx + 180, 255);
    ctx.fillText('地球被称为“蓝色水球”', cx + 180, 280);
}

function drawThreeBodiesOrbit() {
    const cx = 360;
    const cy = 230;
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🌍 太阳、地球和月球: 天体公转自转系统与日食、月食成因', cx, 40);

    // Sun at center
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.arc(cx - 150, cy, 40, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('☀️ 太阳', cx - 150, cy + 55);

    // Earth Orbit (ellipse around sun)
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.ellipse(cx - 150, cy, 260, 120, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Earth Position
    const ex = cx + 110;
    const ey = cy;
    ctx.fillStyle = '#0284c7';
    ctx.beginPath();
    ctx.arc(ex, ey, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#38bdf8';
    ctx.fillText('🌍 地球 (自转+公转)', ex, ey + 38);

    // Moon Orbit around Earth
    ctx.strokeStyle = 'rgba(248, 250, 252, 0.4)';
    ctx.beginPath();
    ctx.arc(ex, ey, 55, 0, Math.PI * 2);
    ctx.stroke();

    // Moon Position
    const mx = ex + 55;
    const my = ey;
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(mx, my, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#facc15';
    ctx.fillText('🌙 月球', mx, my - 12);

    ctx.fillStyle = '#cbd5e1';
    ctx.font = '13px sans-serif';
    ctx.fillText('日食: 月球处于日地之间，挡住太阳光 | 月食: 地球处于日月之间，地影遮蔽月球', cx, 410);
}

function drawSundialScene() {
    const cx = 360;
    const cy = 230;

    ctx.fillStyle = '#334155';
    ctx.beginPath();
    ctx.ellipse(cx, cy, 140, 70, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx, cy - 80);
    ctx.stroke();

    const prog = (state.sundialHour - 6) / 12;
    const shadowX = cx + (prog - 0.5) * 220;
    const shadowY = cy - 35 + Math.abs(prog - 0.5) * 30;

    ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(shadowX, shadowY);
    ctx.stroke();

    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`${state.sundialHour}:00 阳光下日晷影长与方位变化规律`, cx, 40);
    ctx.fillStyle = '#38bdf8';
    ctx.font = '14px sans-serif';
    ctx.fillText('日出晷针影朝西偏长 -> 正午影朝北最短 -> 傍晚影朝东偏长', cx, 80);
}

        
function updateTelemetry() {
    let txt = `[天体观测数据就绪] 模式: ${activeMode} | `;
    if (activeMode === 'moon_phases') {
        txt += `农历: ${state.moonPhaseDay}日 | 月相周期: 29.5天 | 亮面走向: ${state.moonPhaseDay<=15?'自右向左(西亮)':'自左向右(东亮)'}`;
    } else if (activeMode === 'crater_impact') {
        txt += `撞击球高度: ${state.dropHeight}cm | 环形坑直径: ${state.craterDiameter}mm`;
    } else if (activeMode === 'earth_sphere') {
        txt += `帆船距离: ${state.shipDistance}km | 曲面遮挡: ${state.shipDistance>50?'遮挡船身':'清晰可见'}`;
    } else {
        txt += `时刻: ${state.sundialHour}:00 | 影子长度: ${Math.abs(state.sundialHour-12)*10 + 20}mm`;
    }
    telem.innerText = txt;
}
