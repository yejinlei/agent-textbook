<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【食物在身体里的旅行】真实验微仿真 - 四年级科学</title>
    <style>
        :root {
            --bg: #0b1120;
            --panel: #1e293b;
            --border: #334155;
            --accent: #38bdf8;
            --green: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --purple: #a855f7;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .header h1 { font-size: 1.3rem; display: flex; align-items: center; gap: 8px; font-weight: 700; color: #f8fafc; }
        .badge { background: #0369a1; color: #e0f2fe; font-size: 0.75rem; padding: 4px 10px; border-radius: 9999px; font-weight: 600; margin-left: 10px; }
        .master-lab-btn { background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 14px rgba(245, 158, 11, 0.4); }
        .main-stage {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 16px;
        }
        .canvas-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        canvas {
            background: #020617;
            border-radius: 8px;
            border: 1px solid #1e293b;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 720px;
            aspect-ratio: 16 / 10;
        }
        .controls-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn {
            background: #334155;
            color: var(--text);
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:hover { background: #475569; }
        .btn-primary { background: var(--accent); color: #0b1120; font-weight: 600; }
        .btn-rose { background: var(--rose); color: white; }
        .btn-green { background: var(--green); color: white; }
        .telemetry {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 10px;
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 0.78rem;
            color: #38bdf8;
            line-height: 1.5;
            min-height: 90px;
        }
        .notes-card {
            grid-column: 1 / -1;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-top: 12px;
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🍎 <span>7. 食物在身体里的旅行</span></h1>
        <span class="badge">四年级上册·第二单元《呼吸与消化》</span>
        <a href="g1s1_reaction_time.html" class="master-lab-btn">🏆 进入大师级实验室 · 呼吸消化与生理动力学实验室 →</a>
    </div>

    <div class="main-stage">
        <div class="canvas-card">
            <canvas id="simCanvas" width="720" height="450"></canvas>
        </div>

        <div class="controls-card">
            <div class="card-title">⚙️ 消化漫游与器官动力控制</div>
            <div class="btn-grid">
                <button class="btn btn-primary" id="btnBiteApple">🍎 咬一口苹果 (入嘴)</button>
                <button class="btn btn-green" id="btnFastForward">⚡ 消化加速快进</button>
            </div>
            <div class="btn-grid">
                <button class="btn" id="btnFocusStomach">🫀 聚焦胃研磨</button>
                <button class="btn" id="btnFocusIntestine">🧬 聚焦小肠绒毛</button>
            </div>
            <button class="btn btn-rose" id="btnResetTravel" style="width:100%;">🔄 重置消化漫游</button>

            <div class="card-title" style="margin-top:4px;">📊 消化生理指标与微观状态</div>
            <div class="telemetry" id="telem">
                [等待摄食] 点击上方【咬一口苹果】，开启人体 9 米消化道全景生命漫游！
            </div>
        </div>

        <div class="notes-card">
            <strong>🎯 探究目标与原书要点：</strong><br>
            人体消化器官包括口腔、食道、胃、小肠、大肠。食物在口腔经牙齿咀嚼与唾液初步水解，经食道平滑肌蠕动推入胃；在胃内停留 2~4 小时经强酸与酶研磨成食糜；在长达 5~6 米的小肠中完成绝大部分营养物质与水分的分解吸收，微绒毛将养分输送入血液；残渣进入大肠回收水分形成粪便排出。
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const telem = document.getElementById('telem');

        const state = {
            step: 0, // 0: ready, 1: mouth, 2: esophagus, 3: stomach, 4: small_intestine, 5: large_intestine, 6: done
            bolusY: 0,
            bolusX: 0,
            bolusSize: 14,
            bolusColor: '#ef4444',
            foodName: '苹果块',
            particles: [],
            gastricJuiceWave: 0,
            speed: 1.0,
            viewMode: 'full' // full, stomach, villi
        };

        function reset() {
            state.step = 0;
            state.bolusX = 360;
            state.bolusY = 70;
            state.bolusSize = 14;
            state.bolusColor = '#ef4444';
            state.foodName = '新鲜苹果块';
            state.particles = [];
            state.speed = 1.0;
            state.viewMode = 'full';
            telem.innerHTML = '[已就绪] 点击【咬一口苹果】，开启人体消化系统全景动态漫游！';
        }

        document.getElementById('btnBiteApple').onclick = () => {
            reset();
            state.step = 1;
            state.bolusX = 360; state.bolusY = 85;
            telem.innerHTML = '👄 [1. 口腔初步消化] 门齿切断、臼齿磨碎苹果，唾液淀粉酶开始水解淀粉为麦芽糖！';
            if (window.MSIS) window.MSIS.AudioFX.play('click');
        };

        document.getElementById('btnFastForward').onclick = () => {
            state.speed = state.speed === 1.0 ? 3.0 : 1.0;
            if (window.MSIS) window.MSIS.AudioFX.play('click');
        };

        document.getElementById('btnFocusStomach').onclick = () => {
            state.viewMode = state.viewMode === 'stomach' ? 'full' : 'stomach';
            if (window.MSIS) window.MSIS.AudioFX.play('click');
        };

        document.getElementById('btnFocusIntestine').onclick = () => {
            state.viewMode = state.viewMode === 'villi' ? 'full' : 'villi';
            if (window.MSIS) window.MSIS.AudioFX.play('click');
        };

        document.getElementById('btnResetTravel').onclick = reset;

        function drawHumanSilhouette(cx, cy) {
            ctx.save();
            ctx.fillStyle = 'rgba(30, 41, 59, 0.45)';
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 2;

            // Head & Neck outline
            ctx.beginPath();
            ctx.arc(cx, 85, 42, -Math.PI*0.8, -Math.PI*0.2); // Head crown
            ctx.quadraticCurveTo(cx + 44, 110, cx + 22, 135); // Right neck
            ctx.lineTo(cx + 120, 155); // Right shoulder
            ctx.lineTo(cx + 115, 380); // Right torso
            ctx.lineTo(cx - 115, 380); // Left torso
            ctx.lineTo(cx - 120, 155); // Left shoulder
            ctx.lineTo(cx - 22, 135); // Left neck
            ctx.quadraticCurveTo(cx - 44, 110, cx - 35, 85);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            ctx.restore();
        }

        function drawDigestiveOrgans(cx, cy) {
            ctx.save();

            // 1. Mouth / Oral Cavity
            ctx.fillStyle = 'rgba(244, 63, 94, 0.4)';
            ctx.beginPath();
            ctx.ellipse(cx, 85, 20, 12, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 1.5; ctx.stroke();

            // 2. Esophagus (食道 25cm 管壁)
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 14; ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(cx, 97);
            ctx.lineTo(cx, 190);
            ctx.stroke();

            ctx.strokeStyle = '#f87171'; ctx.lineWidth = 8;
            ctx.beginPath(); ctx.moveTo(cx, 97); ctx.lineTo(cx, 190); ctx.stroke();

            // 3. Stomach (J形膨大胃囊)
            ctx.fillStyle = 'rgba(234, 88, 12, 0.5)';
            ctx.strokeStyle = '#f97316'; ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(cx - 4, 188); // Cardia (贲门)
            ctx.bezierCurveTo(cx - 65, 195, cx - 85, 245, cx - 45, 265); // Greater curvature
            ctx.bezierCurveTo(cx - 15, 275, cx + 15, 260, cx + 18, 238); // Pylorus (幽门)
            ctx.bezierCurveTo(cx + 10, 225, cx - 5, 220, cx - 4, 188); // Lesser curvature
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            // Gastric juice waves inside stomach
            state.gastricJuiceWave += 0.05;
            ctx.fillStyle = 'rgba(250, 204, 21, 0.35)';
            ctx.beginPath();
            ctx.moveTo(cx - 60, 245);
            ctx.quadraticCurveTo(cx - 35 + Math.sin(state.gastricJuiceWave)*10, 235, cx + 10, 245);
            ctx.lineTo(cx - 45, 265);
            ctx.closePath();
            ctx.fill();

            // 4. Large Intestine / Colon (结肠袋外框)
            ctx.strokeStyle = '#78350f'; ctx.lineWidth = 16; ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(cx + 65, 360); // Cecum
            ctx.lineTo(cx + 65, 275); // Ascending
            ctx.lineTo(cx - 65, 275); // Transverse
            ctx.lineTo(cx - 65, 360); // Descending
            ctx.lineTo(cx - 25, 395); // Sigmoid to rectum
            ctx.stroke();

            ctx.strokeStyle = '#ca8a04'; ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(cx + 65, 360); ctx.lineTo(cx + 65, 275); ctx.lineTo(cx - 65, 275); ctx.lineTo(cx - 65, 360); ctx.lineTo(cx - 25, 395);
            ctx.stroke();

            // 5. Small Intestine (密集盘曲回肠 5~6米)
            ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 6; ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(cx + 18, 240); // Duodenum connection
            for (let i = 0; i < 9; i++) {
                const sx = cx - 45 + (i % 2 === 0 ? 0 : 90);
                const sy = 295 + i * 8;
                ctx.quadraticCurveTo(cx + (i%2===0?40:-40), sy - 4, sx, sy);
            }
            ctx.stroke();

            // Anatomical Labels
            ctx.fillStyle = '#94a3b8'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
            ctx.fillText('← 口腔 (牙齿咀嚼/唾液淀粉酶)', cx + 28, 88);
            ctx.fillText('← 食道 (平滑肌节律蠕动)', cx + 12, 145);
            ctx.fillText('胃 (强酸盐酸+胃蛋白酶) →', cx - 180, 230);
            ctx.fillText('小肠 (5~6m盘曲·微绒毛全营养吸收) →', cx - 215, 320);
            ctx.fillText('← 大肠 (结肠袋·吸收水分形成残渣)', cx + 78, 320);

            ctx.restore();
        }

        function updateSimulation() {
            const stepSpeed = 1.2 * state.speed;

            if (state.step === 1) { // In mouth
                state.bolusSize = 13;
                state.bolusColor = '#ef4444';
                // Move down into esophagus
                state.bolusY += 0.8 * stepSpeed;
                if (state.bolusY >= 105) {
                    state.step = 2;
                    telem.innerHTML = '🥖 [2. 食道蠕动推进] 长约 25cm，食管壁肌肉像波浪一样交替收缩舒张，自动将食团挤压送入胃中！';
                }
            } else if (state.step === 2) { // Esophagus
                state.bolusY += 1.5 * stepSpeed;
                state.bolusX = 360 + Math.sin(state.bolusY * 0.1) * 3; // peristalsis wobble
                if (state.bolusY >= 195) {
                    state.step = 3;
                    state.bolusColor = '#f59e0b'; // Acid turns yellow chyme
                    telem.innerHTML = '🫀 [3. 胃囊强力研磨] 胃液pH达1.5~2.0强酸杀菌，蠕动将食物研磨成浓稠食糜（停留约 2~4 小时）！';
                    if (window.MSIS) window.MSIS.AudioFX.play('water');
                }
            } else if (state.step === 3) { // Stomach grinding
                state.bolusX -= 0.6 * stepSpeed;
                state.bolusY += 0.8 * stepSpeed;
                state.bolusSize = Math.max(8, state.bolusSize - 0.03); // getting digested
                if (state.bolusX <= 315) {
                    state.step = 4;
                    state.bolusColor = '#eab308';
                    telem.innerHTML = '🧬 [4. 小肠黄金吸收站] 胰液、胆汁与肠液协同！数百万根微绒毛将水解后的氨基酸、葡萄糖吸收入血液！';
                }
            } else if (state.step === 4) { // Small intestine
                state.bolusY += 0.9 * stepSpeed;
                state.bolusX = 360 + Math.sin(state.bolusY * 0.25) * 35;
                state.bolusSize = Math.max(6, state.bolusSize - 0.02);

                // Emit golden nutrient absorption sparkles
                if (Math.random() < 0.4) {
                    state.particles.push({
                        x: state.bolusX, y: state.bolusY,
                        vx: (Math.random() - 0.5) * 3,
                        vy: (Math.random() - 0.5) * 3,
                        alpha: 1.0, color: '#facc15'
                    });
                }

                if (state.bolusY >= 360) {
                    state.step = 5;
                    state.bolusColor = '#78350f'; // residue
                    telem.innerHTML = '💩 [5. 大肠回收与成形] 大肠长约 1.5 米，吸收残余水分与无机盐，未消化的植物纤维等残渣变成粪便！';
                }
            } else if (state.step === 5) { // Large intestine
                if (state.bolusX < 425 && state.bolusY >= 350) state.bolusX += 1.2 * stepSpeed;
                else if (state.bolusX >= 420 && state.bolusY > 275) state.bolusY -= 1.2 * stepSpeed;
                else if (state.bolusY <= 280 && state.bolusX > 295) state.bolusX -= 1.2 * stepSpeed;
                else if (state.bolusX <= 300 && state.bolusY < 390) state.bolusY += 1.2 * stepSpeed;
                else {
                    state.step = 6;
                    telem.innerHTML = '🎉 [6. 消化旅行圆满完成] 食物完成了在人体 9 米消化管道的全部历程，营养全部供人体生长运动！';
                    if (window.MSIS) window.MSIS.ParticleEngine.emitConfetti();
                }
            }

            // Update nutrient particles
            for (let i = state.particles.length - 1; i >= 0; i--) {
                const p = state.particles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.03;
                if (p.alpha <= 0) state.particles.splice(i, 1);
            }
        }

        function drawBolusAndNutrients() {
            // Draw absorbed nutrient particles
            for (let p of state.particles) {
                ctx.save();
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }

            // Draw Bolus
            if (state.step >= 1 && state.step <= 6) {
                ctx.save();
                ctx.fillStyle = state.bolusColor;
                ctx.beginPath();
                ctx.arc(state.bolusX, state.bolusY, state.bolusSize, 0, Math.PI*2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();

                // Glow ring
                ctx.strokeStyle = state.bolusColor;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(state.bolusX, state.bolusY, state.bolusSize + 4, 0, Math.PI*2);
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawMicroVilliView() {
            ctx.save();
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(80, 60, 560, 330);
            ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 2;
            ctx.strokeRect(80, 60, 560, 330);

            ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('🔬 小肠内壁微观绒毛放大 1000 倍结构透视图', 360, 90);

            // Draw villi fingers
            const villiColors = ['#fda4af', '#fb7185', '#f43f5e'];
            for (let v = 0; v < 11; v++) {
                const vx = 115 + v * 48;
                ctx.fillStyle = villiColors[v % 3];
                ctx.beginPath();
                ctx.roundRect(vx, 150, 32, 190, 16);
                ctx.fill();

                // Capillary net inside villus (微血管网)
                ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(vx + 10, 330); ctx.lineTo(vx + 10, 170);
                ctx.quadraticCurveTo(vx + 16, 158, vx + 22, 170);
                ctx.lineTo(vx + 22, 330);
                ctx.stroke();
            }

            // Floating nutrient molecules (氨基酸与葡萄糖)
            ctx.fillStyle = '#facc15';
            for (let i = 0; i < 30; i++) {
                const nx = 100 + (i * 19) % 520;
                const ny = 110 + Math.sin(performance.now()*0.003 + i)*20;
                ctx.beginPath(); ctx.arc(nx, ny, 4, 0, Math.PI*2); ctx.fill();
            }

            ctx.fillStyle = '#94a3b8'; ctx.font = '12px sans-serif';
            ctx.fillText('黄色光斑: 经胰酶彻底水解的葡萄糖与氨基酸分子', 360, 360);
            ctx.fillText('绒毛内毛细血管网高效吸收养分，迅速泵送至全身各大细胞！', 360, 380);

            ctx.restore();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = 360, cy = 225;

            if (state.viewMode === 'villi') {
                drawMicroVilliView();
            } else {
                drawHumanSilhouette(cx, cy);
                drawDigestiveOrgans(cx, cy);
                updateSimulation();
                drawBolusAndNutrients();
            }

            requestAnimationFrame(render);
        }

        render();
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
