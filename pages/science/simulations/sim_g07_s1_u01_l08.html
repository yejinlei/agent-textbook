<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【自制打气筒】真实验微仿真 - 四年级科学</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --green: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        header {
            width: 100%;
            max-width: 980px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        header h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
        .badge { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 0.88rem; }
        .layout {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }
        .canvas-box {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #020617;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 620px;
            height: 420px;
            touch-action: none;
        }
        .controls {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inquiry {
            background: rgba(56, 189, 248, 0.08);
            border-left: 3px solid var(--accent);
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.82rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .c-group { display: flex; flex-direction: column; gap: 6px; }
        .c-group label { font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; }
        .c-group input[type=range] { accent-color: var(--accent); cursor: pointer; }
        .btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-sec { background: #334155; color: #f8fafc; }
        .telemetry {
            background: #090d16;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #334155;
            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: var(--accent);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>🔬 自制打气筒 <span class="badge">四年级上册 · 空气单元</span></h2>
            <p>教科版科学原书实验真拟真 · 拒绝伪仿真</p>
        </div>
        <a href="meteorology_atmosphere_lab.html" class="master-lab-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 14px rgba(245, 158, 11, 0.4); margin-left: 10px;" title="进入全景开放式大师级科学综合实验室">🏆 进入大师级实验室 · 马德堡半球与托里拆利气压实验室 →</a>
        <a href="index.html" class="back-link">← 返回实验大厅</a>
    </header>
    <div class="layout">
        <div class="canvas-box">
            <canvas id="simCanvas" width="620" height="420"></canvas>
            <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted);">
                <span>💡 原生真实物理碰撞与流体仿真</span>
                <span>🎧 Web Audio 拟真气流/水流声效</span>
            </div>
        </div>
        <div class="controls">
            <div class="inquiry"><strong>🎯 探究任务</strong>：自制双单向阀门打气筒：向上拉活塞时进气阀开/排气阀闭吸气；向下推活塞时进气阀闭/排气阀开将压缩空气打入足球！</div>
            
        <div class="c-group">
            <label><span>活塞位移行程</span><span id="pistonDisp">向上抽气中</span></label>
            <input type="range" id="pistonSlider" min="0" max="100" value="0">
        </div>
        <div class="c-group">
            <button class="btn" id="btnAutoPump">⚙️ 连续往复打气测试</button>
        </div>
        <div class="telemetry" id="telem">
            [气阀工作状态] 活塞下推：进气单向阀闭合，排气单向阀开启！<br>
            [足球内气压] 1.80 bar (高压饱满)<br>
            [单向阀原理解析] 阀片单侧受力导向流动，防止压缩气体倒流！
        </div>
    
        </div>
    </div>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function playTone(freq=440, type='sine', dur=0.15, vol=0.08) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function playGurgle() {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                osc.start(); osc.stop(audioCtx.currentTime + 0.12);
            } catch(e){}
        }
        function playHiss(dur=0.3) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const bufferSize = audioCtx.sampleRate * dur;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                noise.connect(gain); gain.connect(audioCtx.destination);
                noise.start();
            } catch(e){}
        }
        
        let isAuto = false;
        let tVal = 0;
        const slider = document.getElementById('pistonSlider');
        const telem = document.getElementById('telem');

        document.getElementById('btnAutoPump').addEventListener('click', () => {
            isAuto = !isAuto;
            playTone(isAuto ? 500 : 300, 'square', 0.15);
        });
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;

            if(isAuto) {
                tVal += 0.05;
                slider.value = ((Math.sin(tVal) + 1)/2 * 100);
            }
            const pVal = parseFloat(slider.value); // 0 (top) to 100 (bottom)
            const pushingDown = Math.sin(tVal) > 0;

            // Pump Cylinder
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 4;
            ctx.strokeRect(180, 100, 120, 240);

            // Piston inside
            const pistonY = 110 + pVal * 1.8;
            ctx.fillStyle = '#475569';
            ctx.fillRect(182, pistonY, 116, 20); // Head
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(235, 40, 10, pistonY - 40); // Rod
            ctx.fillRect(205, 30, 70, 12); // Handle

            // Top Intake Valve
            const inOpen = !pushingDown;
            ctx.fillStyle = inOpen ? '#10b981' : '#ef4444';
            ctx.fillRect(160, 120, 20, 10);
            ctx.fillStyle = '#f8fafc'; ctx.font = '10px sans-serif';
            ctx.fillText(inOpen ? '进气阀开' : '进气阀关', 110, 128);

            // Bottom Exhaust Valve connected to ball
            const exOpen = pushingDown;
            ctx.fillStyle = exOpen ? '#10b981' : '#ef4444';
            ctx.fillRect(300, 310, 20, 10);
            ctx.fillStyle = '#f8fafc';
            ctx.fillText(exOpen ? '排气阀开' : '排气阀关', 325, 318);

            // Hose & Football
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(320, 315); ctx.lineTo(440, 315); ctx.stroke();

            ctx.fillStyle = '#ea580c';
            ctx.beginPath(); ctx.arc(480, 315, 35, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#f8fafc'; ctx.stroke();

            requestAnimationFrame(render);
        }
        render();
    
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
