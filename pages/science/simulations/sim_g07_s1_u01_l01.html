<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【感受空气】真实验微仿真 - 四年级科学</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --green: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        header {
            width: 100%;
            max-width: 980px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        header h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
        .badge { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 0.88rem; }
        .layout {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }
        .canvas-box {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #020617;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 620px;
            height: 420px;
            touch-action: none;
        }
        .controls {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inquiry {
            background: rgba(56, 189, 248, 0.08);
            border-left: 3px solid var(--accent);
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.82rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .c-group { display: flex; flex-direction: column; gap: 6px; }
        .c-group label { font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; }
        .c-group input[type=range] { accent-color: var(--accent); cursor: pointer; }
        .btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-sec { background: #334155; color: #f8fafc; }
        .telemetry {
            background: #090d16;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #334155;
            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: var(--accent);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>🔬 感受空气 <span class="badge">四年级上册 · 空气单元</span></h2>
            <p>教科版科学原书实验真拟真 · 拒绝伪仿真</p>
        </div>
        <a href="meteorology_atmosphere_lab.html" class="master-lab-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 14px rgba(245, 158, 11, 0.4); margin-left: 10px;" title="进入全景开放式大师级科学综合实验室">🏆 进入大师级实验室 · 马德堡半球与托里拆利气压实验室 →</a>
        <a href="index.html" class="back-link">← 返回实验大厅</a>
    </header>
    <div class="layout">
        <div class="canvas-box">
            <canvas id="simCanvas" width="620" height="420"></canvas>
            <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted);">
                <span>💡 原生真实物理碰撞与流体仿真</span>
                <span>🎧 Web Audio 拟真气流/水流声效</span>
            </div>
        </div>
        <div class="controls">
            <div class="inquiry"><strong>🎯 探究任务</strong>：感知并对比空气与水、木块的物理特性：观察透明塑料袋收集空气，用手按压袋子体会空气的柔软弹性与流动性！</div>
            
        <div class="c-group">
            <label><span>按压力度 (N)</span><span id="pressDisp">30</span></label>
            <input type="range" id="pressSlider" min="0" max="100" value="30">
        </div>
        <div class="c-group">
            <button class="btn" id="btnBag">🎈 扎紧塑料袋充气体验</button>
            <button class="btn btn-sec" id="btnRelease">💨 扎破小孔放气感受气流</button>
        </div>
        <div class="telemetry" id="telem">
            [状态] 塑料袋已装满空气<br>
            [微观状态] 气体分子自由高速扩散<br>
            [手部触感] 柔软且富有反弹阻力
        </div>
    
        </div>
    </div>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function playTone(freq=440, type='sine', dur=0.15, vol=0.08) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function playGurgle() {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                osc.start(); osc.stop(audioCtx.currentTime + 0.12);
            } catch(e){}
        }
        function playHiss(dur=0.3) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const bufferSize = audioCtx.sampleRate * dur;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                noise.connect(gain); gain.connect(audioCtx.destination);
                noise.start();
            } catch(e){}
        }
        
        let isFull = true;
        let airFlow = false;
        let t = 0;
        const slider = document.getElementById('pressSlider');
        const pressDisp = document.getElementById('pressDisp');
        const telem = document.getElementById('telem');
        slider.addEventListener('input', () => {
            pressDisp.textContent = slider.value;
            playTone(200 + parseFloat(slider.value)*3, 'sine', 0.05);
        });
        document.getElementById('btnBag').addEventListener('click', () => {
            isFull = true; airFlow = false;
            playTone(440, 'triangle', 0.15);
            telem.innerHTML = '[状态] 重新扎紧塑料袋装满空气<br>[气压测试] 密闭空气柱形成，抗压反弹！';
        });
        document.getElementById('btnRelease').addEventListener('click', () => {
            if(isFull) {
                airFlow = true;
                playHiss(0.8);
                telem.innerHTML = '[状态] 释放小孔！高速气流喷出<br>[触感] 手背感受到清凉的空气流动！';
                setTimeout(() => { isFull = false; airFlow = false; }, 1200);
            }
        });
        function render() {
            t += 0.03;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;
            // Draw Hand pressing bag
            const press = parseFloat(slider.value);
            const bagR = isFull ? (130 - press * 0.4) : 40;
            // Plastic bag
            ctx.fillStyle = isFull ? 'rgba(56, 189, 248, 0.18)' : 'rgba(148, 163, 184, 0.1)';
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(w/2, h/2 + 30, bagR * 1.3, bagR, 0, 0, Math.PI*2);
            ctx.fill(); ctx.stroke();

            // Air molecules inside
            if(isFull) {
                ctx.fillStyle = '#67e8f9';
                for(let i=0; i<40; i++) {
                    const mx = w/2 + Math.cos(i*137.5 + t*2) * (bagR * 0.8 * Math.sqrt(i/40));
                    const my = h/2 + 30 + Math.sin(i*137.5 + t*2) * (bagR * 0.6 * Math.sqrt(i/40));
                    ctx.beginPath(); ctx.arc(mx, my, 3, 0, Math.PI*2); ctx.fill();
                }
            }
            // Air flowing jet
            if(airFlow) {
                ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 2;
                for(let j=0; j<5; j++) {
                    ctx.beginPath();
                    ctx.moveTo(w/2 + bagR*1.3, h/2 + 30 - 10 + j*5);
                    ctx.lineTo(w/2 + bagR*1.3 + 60 + Math.sin(t*10 + j)*20, h/2 + 30 - 10 + j*5);
                    ctx.stroke();
                }
            }
            // Hand pushing down
            if(isFull && press > 10) {
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(w/2 - 40, h/2 + 30 - bagR - 20, 80, 20);
                ctx.fillStyle = '#0f172a'; ctx.font = '12px sans-serif';
                ctx.fillText('手掌按压', w/2 - 24, h/2 + 30 - bagR - 6);
            }
            requestAnimationFrame(render);
        }
        render();
    
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
