<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【认识几种常见的岩石】真实验微仿真 - 四年级科学</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #f59e0b;
            --green: #10b981;
            --cyan: #38bdf8;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        header {
            width: 100%;
            max-width: 980px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        header h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
        .badge { background: rgba(245, 158, 11, 0.15); color: var(--accent); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; }
        .back-link { color: var(--cyan); text-decoration: none; font-size: 0.88rem; }
        .layout {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }
        .canvas-box {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #020617;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 620px;
            height: 420px;
            touch-action: none;
        }
        .controls {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inquiry {
            background: rgba(245, 158, 11, 0.08);
            border-left: 3px solid var(--accent);
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.82rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .c-group { display: flex; flex-direction: column; gap: 6px; }
        .c-group label { font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; }
        .c-group input[type=range] { accent-color: var(--accent); cursor: pointer; }
        .btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-sec { background: #334155; color: #f8fafc; }
        .telemetry {
            background: #090d16;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #334155;
            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: var(--accent);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>🔬 认识几种常见的岩石 <span class="badge">四年级下册 · 岩石与土壤</span></h2>
            <p>教科版科学原书地质与土壤实验真拟真 · 拒绝伪仿真</p>
        </div>
        <a href="mineral_soil_lab.html" class="master-lab-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 14px rgba(245, 158, 11, 0.4); margin-left: 10px;" title="进入全景开放式大师级科学综合实验室">🏆 进入大师级实验室 · 矿物晶体与土壤成分实验室 →</a>
        <a href="index.html" class="back-link">← 返回实验大厅</a>
    </header>
    <div class="layout">
        <div class="canvas-box">
            <canvas id="simCanvas" width="620" height="420"></canvas>
            <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted);">
                <span>💡 原生岩土物理与矿物学仿真</span>
                <span>🎧 Web Audio 拟真刻画/水流/滴答声效</span>
            </div>
        </div>
        <div class="controls">
            <div class="inquiry"><strong>🎯 探究任务</strong>：花岗岩、砂岩、大理岩手持放大镜观察与稀盐酸滴定实验：观察花岗岩黑白红三色斑晶，砂岩细砂颗粒层理，大理岩遇酸剧烈冒二氧化碳气泡！</div>
            
        <div class="c-group">
            <button class="btn" id="btnGranite">🪨 1. 花岗岩 (火成岩/斑粒状)</button>
            <button class="btn btn-sec" id="btnSandstone">🪨 2. 砂岩 (沉积岩/砂粒层理)</button>
            <button class="btn btn-sec" id="btnMarble">🪨 3. 大理岩 (变质岩/滴酸冒泡)</button>
        </div>
        <div class="telemetry" id="telem">
            [当前样本] 请选择一种岩石放入载物台！<br>
            [三大类岩] 地球上的岩石分为岩浆岩、沉积岩和变质岩三大类！
        </div>
    
        </div>
    </div>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function playTone(freq=440, type='sine', dur=0.2, vol=0.1) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function playScratch() {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const dur = 0.15;
                const bufferSize = audioCtx.sampleRate * dur;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.4;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                noise.connect(gain); gain.connect(audioCtx.destination);
                noise.start();
            } catch(e){}
        }
        
        let rockType = 'granite';
        let effervescing = false;
        const telem = document.getElementById('telem');

        document.getElementById('btnGranite').addEventListener('click', () => {
            rockType = 'granite'; effervescing = false;
            playTone(300, 'triangle', 0.2);
            telem.innerHTML = '🪨 [花岗岩] 粗粒花斑状构造！肉眼清晰可见黑色云母、肉红色长石与透明石英！质地极坚硬！';
        });
        document.getElementById('btnSandstone').addEventListener('click', () => {
            rockType = 'sandstone'; effervescing = false;
            playTone(400, 'sine', 0.2);
            telem.innerHTML = '🪨 [砂岩] 具有明显碎屑砂粒结构与层理条纹！摸上去手感粗糙如细砂纸！';
        });
        document.getElementById('btnMarble').addEventListener('click', () => {
            rockType = 'marble'; effervescing = true;
            playTone(550, 'sine', 0.3);
            telem.innerHTML = '🪨 [大理岩] 晶莹半透明粒状！碳酸钙含量高，滴入稀盐酸瞬间剧烈冒出 CO2 二氧化碳白色泡沫！';
        });
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;

            // Specimen Table
            ctx.fillStyle = '#334155';
            ctx.fillRect(w/2 - 120, 100, 240, 220);
            ctx.strokeStyle = '#64748b'; ctx.lineWidth = 4;
            ctx.strokeRect(w/2 - 120, 100, 240, 220);

            // Rock specimen circle
            if(rockType === 'granite') {
                ctx.fillStyle = '#f8fafc';
                ctx.beginPath(); ctx.arc(w/2, 210, 80, 0, Math.PI*2); ctx.fill();
                // Pink feldspar patches
                ctx.fillStyle = '#fda4af';
                for(let i=0; i<15; i++) {
                    ctx.beginPath(); ctx.arc(w/2 - 50 + (i%5)*25, 170 + Math.floor(i/5)*25, 12, 0, Math.PI*2); ctx.fill();
                }
                // Black mica dots
                ctx.fillStyle = '#0f172a';
                for(let j=0; j<25; j++) {
                    ctx.beginPath(); ctx.arc(w/2 - 60 + (j%6)*22, 160 + Math.floor(j/6)*22, 4, 0, Math.PI*2); ctx.fill();
                }
            } else if(rockType === 'sandstone') {
                ctx.fillStyle = '#d97706';
                ctx.beginPath(); ctx.arc(w/2, 210, 80, 0, Math.PI*2); ctx.fill();
                // Sand grains texture
                ctx.fillStyle = '#fef3c7';
                for(let i=0; i<60; i++) {
                    ctx.fillRect(w/2 - 60 + (i%8)*16, 150 + Math.floor(i/8)*16, 3, 3);
                }
            } else { // Marble
                ctx.fillStyle = '#f1f5f9';
                ctx.beginPath(); ctx.arc(w/2, 210, 80, 0, Math.PI*2); ctx.fill();
                // Veins
                ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(w/2 - 60, 160); ctx.lineTo(w/2 + 50, 240); ctx.stroke();
                // Effervescence bubbles
                if(effervescing) {
                    ctx.fillStyle = '#38bdf8';
                    for(let b=0; b<20; b++) {
                        ctx.beginPath(); ctx.arc(w/2 - 30 + Math.random()*60, 190 + Math.random()*40, 5, 0, Math.PI*2); ctx.fill();
                    }
                }
            }

            requestAnimationFrame(render);
        }
        render();
    
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
