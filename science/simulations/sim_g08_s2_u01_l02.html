<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【种植凤仙花】真实验微仿真 - 四年级科学</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --green: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        header {
            width: 100%;
            max-width: 980px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        header h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
        .badge { background: rgba(16, 185, 129, 0.15); color: var(--green); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 0.88rem; }
        .layout {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }
        .canvas-box {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #020617;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 620px;
            height: 420px;
            touch-action: none;
        }
        .controls {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inquiry {
            background: rgba(16, 185, 129, 0.08);
            border-left: 3px solid var(--green);
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.82rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .c-group { display: flex; flex-direction: column; gap: 6px; }
        .c-group label { font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; }
        .c-group input[type=range] { accent-color: var(--green); cursor: pointer; }
        .btn {
            background: var(--green);
            color: #0f172a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-sec { background: #334155; color: #f8fafc; }
        .telemetry {
            background: #090d16;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #334155;
            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: var(--green);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>🔬 种植凤仙花 <span class="badge">四年级下册 · 植物的生长变化</span></h2>
            <p>教科版科学原书植物生长实验真拟真 · 拒绝伪仿真</p>
        </div>
        <a href="virtual_microscope.html" class="master-lab-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 14px rgba(245, 158, 11, 0.4); margin-left: 10px;" title="进入全景开放式大师级科学综合实验室">🏆 进入大师级实验室 · 植物器官解剖与维管束实验室 →</a>
        <a href="index.html" class="back-link">← 返回实验大厅</a>
    </header>
    <div class="layout">
        <div class="canvas-box">
            <canvas id="simCanvas" width="620" height="420"></canvas>
            <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted);">
                <span>💡 原生植物解剖与生长物理引擎</span>
                <span>🎧 Web Audio 拟真音效</span>
            </div>
        </div>
        <div class="controls">
            <div class="inquiry"><strong>🎯 探究任务</strong>：凤仙花播种与萌发环境探究：播种深度约 1cm，适度浇水保持湿润，在 20°C 适宜温箱中种子吸胀破皮、胚芽拱破泥土幼苗出土！</div>
            
        <div class="c-group">
            <label><span>土壤湿度 (%)</span><span id="moistDisp">60%</span></label>
            <input type="range" id="moistSlider" min="0" max="100" value="60">
        </div>
        <div class="c-group">
            <button class="btn" id="btnWaterPot">💧 适量浇水并置于温室</button>
        </div>
        <div class="telemetry" id="telem">
            [播种状态] 凤仙花种子埋入土下 1 cm<br>
            [萌发条件] 水分、适宜温度(20°C)与充足空气就绪！<br>
            [生长进展] 胚根率先突破种皮向下扎根！
        </div>
    
        </div>
    </div>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function playTone(freq=440, type='sine', dur=0.2, vol=0.1) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        
        let sproutProgress = 0;
        let watering = false;
        const slider = document.getElementById('moistSlider');
        const disp = document.getElementById('moistDisp');
        const telem = document.getElementById('telem');

        slider.addEventListener('input', () => { disp.textContent = slider.value + '%'; });
        document.getElementById('btnWaterPot').addEventListener('click', () => {
            watering = true;
            playTone(520, 'triangle', 0.3);
            let timer = setInterval(() => {
                sproutProgress += 1;
                if(sproutProgress >= 100) clearInterval(timer);
                telem.innerHTML = `[萌发生长] 第 ${(sproutProgress/15).toFixed(0)} 天：幼苗破土而出！子叶展开，第一对真叶长出！`;
            }, 50);
        });
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;

            // Flowerpot
            ctx.fillStyle = '#b45309';
            ctx.beginPath();
            ctx.moveTo(w/2 - 90, 240); ctx.lineTo(w/2 + 90, 240);
            ctx.lineTo(w/2 + 70, 380); ctx.lineTo(w/2 - 70, 380);
            ctx.fill();

            // Soil
            ctx.fillStyle = '#3f220d';
            ctx.fillRect(w/2 - 85, 240, 170, 40);

            // Seed & Sprout
            const sY = 270;
            if(sproutProgress < 20) {
                // Seed under soil
                ctx.fillStyle = '#854d0e';
                ctx.beginPath(); ctx.arc(w/2, sY, 6, 0, Math.PI*2); ctx.fill();
            } else {
                // Stem growing up
                const stemH = (sproutProgress / 100) * 80;
                ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(w/2, sY);
                ctx.lineTo(w/2, sY - stemH);
                ctx.stroke();

                // Two Cotyledon Leaves opening above soil
                if(sY - stemH < 240) {
                    ctx.fillStyle = '#4ade80';
                    ctx.beginPath(); ctx.ellipse(w/2 - 15, sY - stemH, 14, 8, -Math.PI/6, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(w/2 + 15, sY - stemH, 14, 8, Math.PI/6, 0, Math.PI*2); ctx.fill();
                }
            }
            requestAnimationFrame(render);
        }
        render();
    
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
