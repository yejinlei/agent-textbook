<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【种子里孕育着新生命】真实验微仿真 - 四年级科学</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --green: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        header {
            width: 100%;
            max-width: 980px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        header h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
        .badge { background: rgba(16, 185, 129, 0.15); color: var(--green); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 0.88rem; }
        .layout {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }
        .canvas-box {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #020617;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 620px;
            height: 420px;
            touch-action: none;
        }
        .controls {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inquiry {
            background: rgba(16, 185, 129, 0.08);
            border-left: 3px solid var(--green);
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.82rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .c-group { display: flex; flex-direction: column; gap: 6px; }
        .c-group label { font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; }
        .c-group input[type=range] { accent-color: var(--green); cursor: pointer; }
        .btn {
            background: var(--green);
            color: #0f172a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-sec { background: #334155; color: #f8fafc; }
        .telemetry {
            background: #090d16;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #334155;
            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: var(--green);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>🔬 种子里孕育着新生命 <span class="badge">四年级下册 · 植物的生长变化</span></h2>
            <p>教科版科学原书植物生长实验真拟真 · 拒绝伪仿真</p>
        </div>
        <a href="virtual_microscope.html" class="master-lab-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 14px rgba(245, 158, 11, 0.4); margin-left: 10px;" title="进入全景开放式大师级科学综合实验室">🏆 进入大师级实验室 · 植物器官解剖与维管束实验室 →</a>
        <a href="index.html" class="back-link">← 返回实验大厅</a>
    </header>
    <div class="layout">
        <div class="canvas-box">
            <canvas id="simCanvas" width="620" height="420"></canvas>
            <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted);">
                <span>💡 原生植物解剖与生长物理引擎</span>
                <span>🎧 Web Audio 拟真音效</span>
            </div>
        </div>
        <div class="controls">
            <div class="inquiry"><strong>🎯 探究任务</strong>：大豆与凤仙花种子精细解剖实验：剥开种皮（保护作用），轻轻分开两片肥厚的子叶（储藏营养），观察胚芽（发育成茎和叶）与胚根（发育成根）的精妙构造！</div>
            
        <div class="c-group">
            <button class="btn" id="btnPeel">🔬 1. 剥离外层种皮 (保护组织)</button>
            <button class="btn btn-sec" id="btnSplitCotyledon">🌱 2. 掰开两片子叶 (储藏养料)</button>
            <button class="btn btn-sec" id="btnZoomEmbryo">🔍 3. 放大观察胚芽与胚根</button>
        </div>
        <div class="telemetry" id="telem">
            [种子状态] 完整干硬菜豆种子<br>
            [外部结构] 具有保护作用的坚韧种皮与种脐<br>
            [大概念] 种子是新生命的幼体，胚是种子的核心生命部分！
        </div>
    
        </div>
    </div>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function playTone(freq=440, type='sine', dur=0.2, vol=0.1) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        
        let step = 0;
        const telem = document.getElementById('telem');

        document.getElementById('btnPeel').addEventListener('click', () => {
            step = 1;
            playTone(400, 'triangle', 0.2);
            telem.innerHTML = '[剥开种皮] 露出内部两瓣肥厚的肉质子叶！种皮保护着幼嫩的胚！';
        });
        document.getElementById('btnSplitCotyledon').addEventListener('click', () => {
            step = 2;
            playTone(500, 'sine', 0.2);
            telem.innerHTML = '[掰开子叶] 在两片子叶连接处清晰看到小小的胚芽、胚轴与胚根！';
        });
        document.getElementById('btnZoomEmbryo').addEventListener('click', () => {
            step = 3;
            playTone(620, 'sine', 0.3);
            telem.innerHTML = '🔍 [高倍特写] 胚根向下长成主根，胚芽向上破土长出第一对真叶！子叶消耗养分后脱落！';
        });

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;

            if(step === 0) {
                // Whole bean
                ctx.fillStyle = '#854d0e';
                ctx.beginPath();
                ctx.ellipse(w/2, h/2, 90, 60, Math.PI/12, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#fef08a'; // hilum
                ctx.beginPath(); ctx.ellipse(w/2 - 10, h/2 - 50, 15, 6, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif';
                ctx.fillText('种皮与种脐', w/2 - 35, h/2 + 80);
            } else if(step === 1) {
                // Peeled cotyledon
                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                ctx.ellipse(w/2, h/2, 85, 55, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.strokeStyle = '#ca8a04'; ctx.lineWidth = 3; ctx.stroke();
                ctx.fillStyle = '#854d0e'; // peeled skin on side
                ctx.strokeRect(w/2 + 110, h/2 - 40, 40, 70);
                ctx.fillStyle = '#f8fafc'; ctx.font = '12px sans-serif';
                ctx.fillText('剥下的种皮', w/2 + 105, h/2 + 50);
            } else {
                // Two split cotyledons with embryo in between
                ctx.fillStyle = '#fef08a';
                ctx.beginPath(); ctx.ellipse(w/2 - 70, h/2, 60, 45, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(w/2 + 70, h/2, 60, 45, 0, 0, Math.PI*2); ctx.fill();

                // Embryo (Embryo bud + radicle)
                ctx.fillStyle = '#22c55e';
                ctx.beginPath();
                ctx.moveTo(w/2 - 10, h/2 - 20); // bud
                ctx.quadraticCurveTo(w/2, h/2, w/2 - 10, h/2 + 30); // radicle
                ctx.lineTo(w/2 + 5, h/2 + 30);
                ctx.quadraticCurveTo(w/2 + 10, h/2, w/2 + 10, h/2 - 20);
                ctx.fill();

                ctx.fillStyle = '#38bdf8'; ctx.font = '12px sans-serif';
                ctx.fillText('← 胚芽 (长茎叶)', w/2 + 20, h/2 - 15);
                ctx.fillText('← 胚根 (长主根)', w/2 + 20, h/2 + 30);
                ctx.fillText('子叶 (营养仓库)', w/2 - 120, h/2 + 70);
            }
            requestAnimationFrame(render);
        }
        render();
    
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
