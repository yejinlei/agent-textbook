    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --green: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        header {
            width: 100%;
            max-width: 980px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        header h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
        .badge { background: rgba(16, 185, 129, 0.15); color: var(--green); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 0.88rem; }
        .layout {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }
        .canvas-box {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #020617;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 620px;
            height: 420px;
            touch-action: none;
        }
        .controls {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inquiry {
            background: rgba(16, 185, 129, 0.08);
            border-left: 3px solid var(--green);
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.82rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .c-group { display: flex; flex-direction: column; gap: 6px; }
        .c-group label { font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; }
        .c-group input[type=range] { accent-color: var(--green); cursor: pointer; }
        .btn {
            background: var(--green);
            color: #0f172a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-sec { background: #334155; color: #f8fafc; }
        .telemetry {
            background: #090d16;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #334155;
            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: var(--green);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>🔬 种子长出了根 <span class="badge">四年级下册 · 植物的生长变化</span></h2>
            <p>教科版科学原书植物生长实验真拟真 · 拒绝伪仿真</p>
        </div>
        <a href="virtual_microscope.html" class="master-lab-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 14px rgba(245, 158, 11, 0.4); margin-left: 10px;" title="进入全景开放式大师级科学综合实验室">🏆 进入大师级实验室 · 植物器官解剖与维管束实验室 →</a>
        <a href="index.html" class="back-link">← 返回实验大厅</a>
    </header>
    <div class="layout">
        <div class="canvas-box">
            <canvas id="simCanvas" width="620" height="420"></canvas>
            <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted);">
                <span>💡 原生植物解剖与生长物理引擎</span>
                <span>🎧 Web Audio 拟真音效</span>
            </div>
        </div>
        <div class="controls">
            <div class="inquiry"><strong>🎯 探究任务</strong>：根的向地性实验：把透明种植杯横放甚至倒放，观察种子生长的根无论初始朝向何方，总是顽强向下弯曲生长扎入泥土！</div>
            
        <div class="c-group">
            <button class="btn" id="btnRotateCup">🔄 旋转倾斜种植杯 (横放/倒置)</button>
        </div>
        <div class="telemetry" id="telem">
            [种植杯方向] 竖直正常放置<br>
            [根的生长方向] ⬇️ 向下扎入土壤 (植物向地性)<br>
            [科学真相] 植物根尖生长素受重力影响分布不均，驱动根部始终向地生长！
        </div>
    
        </div>
    </div>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function playTone(freq=440, type='sine', dur=0.2, vol=0.1) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        
        let cupAngle = 0;
        let t = 0;
        const telem = document.getElementById('telem');

        document.getElementById('btnRotateCup').addEventListener('click', () => {
            cupAngle = (cupAngle + Math.PI/2) % (Math.PI*2);
            playTone(450, 'sine', 0.2);
            const deg = Math.round(cupAngle * 180 / Math.PI);
            telem.innerHTML = `[杯体倾角] 旋转至 ${deg}°！<br>[根的自适应] 根尖在重力感应细胞驱动下，强行急转弯继续垂直向下生长！`;
        });
        function render() {
            t += 0.05;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;

            // Transparent Beaker
            ctx.save();
            ctx.translate(w/2, 220);
            ctx.rotate(cupAngle);

            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 4;
            ctx.strokeRect(-60, -90, 120, 180);
            ctx.fillStyle = 'rgba(120, 53, 15, 0.5)';
            ctx.fillRect(-58, -40, 116, 128); // Soil

            // Seed in center
            ctx.fillStyle = '#fef08a';
            ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fill();

            ctx.restore();

            // Root ALWAYS grows towards true downward gravity!
            ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(w/2, 220);
            ctx.quadraticCurveTo(w/2 + 5, 260, w/2, 330);
            ctx.stroke();

            // Root hairs
            for(let y=260; y<330; y+=12) {
                ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(w/2 - 12, y); ctx.lineTo(w/2 + 12, y); ctx.stroke();
            }

            requestAnimationFrame(render);
        }
        render();
    
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
