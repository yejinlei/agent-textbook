<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【凤仙花开花了】真实验微仿真 - 四年级科学</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --green: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        header {
            width: 100%;
            max-width: 980px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        header h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
        .badge { background: rgba(16, 185, 129, 0.15); color: var(--green); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 0.88rem; }
        .layout {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }
        .canvas-box {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #020617;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 620px;
            height: 420px;
            touch-action: none;
        }
        .controls {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inquiry {
            background: rgba(16, 185, 129, 0.08);
            border-left: 3px solid var(--green);
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.82rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .c-group { display: flex; flex-direction: column; gap: 6px; }
        .c-group label { font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; }
        .c-group input[type=range] { accent-color: var(--green); cursor: pointer; }
        .btn {
            background: var(--green);
            color: #0f172a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-sec { background: #334155; color: #f8fafc; }
        .telemetry {
            background: #090d16;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #334155;
            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: var(--green);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>🔬 凤仙花开花了 <span class="badge">四年级下册 · 植物的生长变化</span></h2>
            <p>教科版科学原书植物生长实验真拟真 · 拒绝伪仿真</p>
        </div>
        <a href="virtual_microscope.html" class="master-lab-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 14px rgba(245, 158, 11, 0.4); margin-left: 10px;" title="进入全景开放式大师级科学综合实验室">🏆 进入大师级实验室 · 植物器官解剖与维管束实验室 →</a>
        <a href="index.html" class="back-link">← 返回实验大厅</a>
    </header>
    <div class="layout">
        <div class="canvas-box">
            <canvas id="simCanvas" width="620" height="420"></canvas>
            <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted);">
                <span>💡 原生植物解剖与生长物理引擎</span>
                <span>🎧 Web Audio 拟真音效</span>
            </div>
        </div>
        <div class="controls">
            <div class="inquiry"><strong>🎯 探究任务</strong>：花朵四大部分精密解剖：用镊子由外向内依次剥离萼片(保护)、花瓣(吸引昆虫)、雄蕊(产生花粉)与雌蕊(柱头黏附花粉传粉受精)！</div>
            
        <div class="c-group">
            <button class="btn" id="btnDissectSepal">🌸 1. 剥离花萼 (绿色小片)</button>
            <button class="btn btn-sec" id="btnDissectPetal">🌸 2. 剥除花瓣 (鲜艳花冠)</button>
            <button class="btn btn-sec" id="btnDissectStamen">🌸 3. 观察雄蕊 (花药花粉)</button>
            <button class="btn btn-sec" id="btnDissectPistil">🌸 4. 显微特写雌蕊 (子房胚珠)</button>
        </div>
        <div class="telemetry" id="telem">
            [当前结构] 完整完全花 (凤仙花)<br>
            [四层结构] 萼片、花瓣、雄蕊、雌蕊完备！<br>
            [科学真相] 雄蕊产生花粉，雌蕊柱头受精后子房发育成为果实！
        </div>
    
        </div>
    </div>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function playTone(freq=440, type='sine', dur=0.2, vol=0.1) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        
        let stage = 0;
        const telem = document.getElementById('telem');

        document.getElementById('btnDissectSepal').addEventListener('click', () => { stage = 1; playTone(400, 'triangle', 0.2); telem.innerHTML = '[剥离花萼] 绿色萼片包裹保护幼嫩花蕾！'; });
        document.getElementById('btnDissectPetal').addEventListener('click', () => { stage = 2; playTone(480, 'sine', 0.2); telem.innerHTML = '[剥离花瓣] 鲜艳花瓣能吸引蜜蜂蝴蝶传粉！'; });
        document.getElementById('btnDissectStamen').addEventListener('click', () => { stage = 3; playTone(560, 'sine', 0.2); telem.innerHTML = '[雄蕊特写] 花丝顶端的花药上布满金黄色花粉颗粒！'; });
        document.getElementById('btnDissectPistil').addEventListener('click', () => { stage = 4; playTone(650, 'sine', 0.3); telem.innerHTML = '🔬 [雌蕊核心] 柱头分泌粘液黏附花粉，膨大的子房内孕育着胚珠受精成为种子！'; });

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;

            if(stage < 2) {
                // Whole flower petals
                ctx.fillStyle = '#ec4899';
                for(let a=0; a<5; a++) {
                    const ang = (a * Math.PI*2) / 5;
                    ctx.beginPath();
                    ctx.ellipse(w/2 + Math.cos(ang)*45, 200 + Math.sin(ang)*45, 35, 25, ang, 0, Math.PI*2);
                    ctx.fill();
                }
            }

            // Stamens
            if(stage < 3) {
                ctx.strokeStyle = '#fef08a'; ctx.lineWidth = 2;
                for(let s=0; s<5; s++) {
                    const sAng = (s * Math.PI*2) / 5;
                    ctx.beginPath(); ctx.moveTo(w/2, 200); ctx.lineTo(w/2 + Math.cos(sAng)*25, 200 + Math.sin(sAng)*25); ctx.stroke();
                    ctx.fillStyle = '#eab308';
                    ctx.beginPath(); ctx.arc(w/2 + Math.cos(sAng)*25, 200 + Math.sin(sAng)*25, 4, 0, Math.PI*2); ctx.fill();
                }
            }

            // Central Pistil
            ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(w/2, 200); ctx.lineTo(w/2, 170); ctx.stroke();
            // Stigma
            ctx.fillStyle = '#15803d';
            ctx.beginPath(); ctx.arc(w/2, 168, 6, 0, Math.PI*2); ctx.fill();
            // Ovary base
            ctx.beginPath(); ctx.ellipse(w/2, 205, 10, 14, 0, 0, Math.PI*2); ctx.fill();

            requestAnimationFrame(render);
        }
        render();
    
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
