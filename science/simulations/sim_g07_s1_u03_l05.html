<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【设计我们的乐器】真实验微仿真 - 四年级科学</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --green: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        header {
            width: 100%;
            max-width: 980px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        header h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
        .badge { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 0.88rem; }
        .layout {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }
        .canvas-box {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #020617;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 620px;
            height: 420px;
            touch-action: none;
        }
        .controls {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inquiry {
            background: rgba(56, 189, 248, 0.08);
            border-left: 3px solid var(--accent);
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.82rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .c-group { display: flex; flex-direction: column; gap: 6px; }
        .c-group label { font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; }
        .c-group input[type=range] { accent-color: var(--accent); cursor: pointer; }
        .btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-sec { background: #334155; color: #f8fafc; }
        .telemetry {
            background: #090d16;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #334155;
            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: var(--accent);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>🔬 设计我们的乐器 <span class="badge">四年级上册 · 声音单元</span></h2>
            <p>教科版科学原书真实声学物理实验 · 拒绝伪仿真</p>
        </div>
        <a href="acoustics_oscilloscope.html" class="master-lab-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 14px rgba(245, 158, 11, 0.4); margin-left: 10px;" title="进入全景开放式大师级科学综合实验室">🏆 进入大师级实验室 · 双通道声波示波器与音调实验室 →</a>
        <a href="index.html" class="back-link">← 返回实验大厅</a>
    </header>
    <div class="layout">
        <div class="canvas-box">
            <canvas id="simCanvas" width="620" height="420"></canvas>
            <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted);">
                <span>💡 原生真实声学振动与物理波形仿真</span>
                <span>🎧 Web Audio 真实音调与频谱生成</span>
            </div>
        </div>
        <div class="controls">
            <div class="inquiry"><strong>🎯 探究任务</strong>：8 管水试管琴设计：往相同试管中注入不同深度的水，敲击试管调配出 1 2 3 4 5 6 7 i 标准自然音阶，探究空气柱与水柱发声差异！</div>
            
        <div class="c-group">
            <p style="font-size:0.85rem; color:#cbd5e1;">点击下方试管，敲击奏响 8 度自然音阶：</p>
        </div>
        <div class="c-group" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:6px;">
            <button class="btn btn-sec" onclick="hitTube(0)">1 (Do)</button>
            <button class="btn btn-sec" onclick="hitTube(1)">2 (Re)</button>
            <button class="btn btn-sec" onclick="hitTube(2)">3 (Mi)</button>
            <button class="btn btn-sec" onclick="hitTube(3)">4 (Fa)</button>
            <button class="btn btn-sec" onclick="hitTube(4)">5 (Sol)</button>
            <button class="btn btn-sec" onclick="hitTube(5)">6 (La)</button>
            <button class="btn btn-sec" onclick="hitTube(6)">7 (Ti)</button>
            <button class="btn" onclick="hitTube(7)">i (高音Do)</button>
        </div>
        <div class="telemetry" id="telem">
            [当前敲击] 点击试管奏响自然音阶！<br>
            [调音规律] 水越多水柱越重，敲击振动越慢，音调越低！
        </div>
    
        </div>
    </div>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function playTone(freq=440, type='sine', dur=0.3, vol=0.1) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        
        const notes = [
            {n:"1 (Do)", f: 261.63, w: 20},
            {n:"2 (Re)", f: 293.66, w: 35},
            {n:"3 (Mi)", f: 329.63, w: 50},
            {n:"4 (Fa)", f: 349.23, w: 65},
            {n:"5 (Sol)", f: 392.00, w: 80},
            {n:"6 (La)", f: 440.00, w: 95},
            {n:"7 (Ti)", f: 493.88, w: 110},
            {n:"i (高Do)", f: 523.25, w: 125}
        ];
        let activeTube = -1;
        const telem = document.getElementById('telem');

        window.hitTube = function(idx) {
            activeTube = idx;
            const n = notes[idx];
            playTone(n.f, 'triangle', 0.5, 0.15);
            telem.innerHTML = `[敲击音符] ${n.n} | 频率 ${n.f.toFixed(1)} Hz<br>[水位高度] ${n.w} mm (水柱振动控制音准)`;
            setTimeout(() => { activeTube = -1; }, 300);
        };
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;

            for(let i=0; i<8; i++) {
                const tx = 75 + i * 60;
                const ty = 120;
                const waterH = notes[i].w * 1.4;

                // Tube
                ctx.strokeStyle = activeTube === i ? '#38bdf8' : '#94a3b8';
                ctx.lineWidth = activeTube === i ? 4 : 2;
                ctx.strokeRect(tx, ty, 35, 200);

                // Water inside
                ctx.fillStyle = 'rgba(56, 189, 248, 0.6)';
                ctx.fillRect(tx + 2, ty + 200 - waterH, 31, waterH);

                // Note label
                ctx.fillStyle = '#f8fafc'; ctx.font = '14px sans-serif';
                ctx.fillText(notes[i].n.split(' ')[0], tx + 12, ty + 230);
            }
            requestAnimationFrame(render);
        }
        render();
    
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
