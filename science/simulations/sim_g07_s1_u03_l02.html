<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【声音的强弱】真实验微仿真 - 四年级科学</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --green: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        header {
            width: 100%;
            max-width: 980px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        header h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
        .badge { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 0.88rem; }
        .layout {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }
        .canvas-box {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #020617;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 620px;
            height: 420px;
            touch-action: none;
        }
        .controls {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inquiry {
            background: rgba(56, 189, 248, 0.08);
            border-left: 3px solid var(--accent);
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.82rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .c-group { display: flex; flex-direction: column; gap: 6px; }
        .c-group label { font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; }
        .c-group input[type=range] { accent-color: var(--accent); cursor: pointer; }
        .btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-sec { background: #334155; color: #f8fafc; }
        .telemetry {
            background: #090d16;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #334155;
            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: var(--accent);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>🔬 声音的强弱 <span class="badge">四年级上册 · 声音单元</span></h2>
            <p>教科版科学原书真实声学物理实验 · 拒绝伪仿真</p>
        </div>
        <a href="acoustics_oscilloscope.html" class="master-lab-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 14px rgba(245, 158, 11, 0.4); margin-left: 10px;" title="进入全景开放式大师级科学综合实验室">🏆 进入大师级实验室 · 双通道声波示波器与音调实验室 →</a>
        <a href="index.html" class="back-link">← 返回实验大厅</a>
    </header>
    <div class="layout">
        <div class="canvas-box">
            <canvas id="simCanvas" width="620" height="420"></canvas>
            <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted);">
                <span>💡 原生真实声学振动与物理波形仿真</span>
                <span>🎧 Web Audio 真实音调与频谱生成</span>
            </div>
        </div>
        <div class="controls">
            <div class="inquiry"><strong>🎯 探究任务</strong>：敲击力度与声音强弱（响度）探究：轻敲 vs 重击，观察尺子和鼓面的振动幅度变化，示波器波形高度拉伸，测定分贝 dB 跃升！</div>
            
        <div class="c-group">
            <label><span>敲击作用力 (N)</span><span id="forceDisp">20 (轻击)</span></label>
            <input type="range" id="forceSlider" min="5" max="80" value="20">
        </div>
        <div class="c-group">
            <button class="btn" id="btnStrike">🔨 击打鼓面发声</button>
        </div>
        <div class="telemetry" id="telem">
            [声音强弱] 45 dB (轻柔微弱)<br>
            [振幅大小] 2.1 mm (小振幅)<br>
            [规律总结] 敲击力度越大，物体振动幅度越大，声音越强！
        </div>
    
        </div>
    </div>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function playTone(freq=440, type='sine', dur=0.3, vol=0.1) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        
        let amp = 10;
        let t = 0;
        const slider = document.getElementById('forceSlider');
        const disp = document.getElementById('forceDisp');
        const telem = document.getElementById('telem');

        slider.addEventListener('input', () => {
            const f = parseFloat(slider.value);
            disp.textContent = f > 50 ? `${f} N (重击大声)` : `${f} N (轻敲小声)`;
        });
        document.getElementById('btnStrike').addEventListener('click', () => {
            const f = parseFloat(slider.value);
            amp = f * 0.8;
            const dB = (35 + f * 0.7).toFixed(0);
            playTone(220, 'triangle', 0.8, Math.min(0.4, f*0.005));
            telem.innerHTML = `[声音强弱] ${dB} dB (${f>50?'🔊 震耳欲聋 响度极大':'🔉 轻柔柔和'})<br>[振幅大小] ${(f*0.12).toFixed(1)} mm<br>[物理结论] 响度直接取决于物体的机械振动幅度！`;
        });
        function render() {
            t += 0.05;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;

            // Oscilloscope Waveform showing amplitude
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3;
            ctx.beginPath();
            for(let x=40; x<w-40; x++) {
                const y = 140 + Math.sin(x*0.06 - t*8) * amp;
                if(x===40) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // Decibel meter display
            ctx.fillStyle = '#090d16';
            ctx.fillRect(w/2 - 80, 260, 160, 100);
            ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2;
            ctx.strokeRect(w/2 - 80, 260, 160, 100);

            ctx.fillStyle = '#10b981'; ctx.font = '24px monospace';
            const dBVal = (35 + (amp/0.8)*0.7).toFixed(0);
            ctx.fillText(dBVal + ' dB', w/2 - 40, 315);
            ctx.fillStyle = '#94a3b8'; ctx.font = '12px sans-serif';
            ctx.fillText('实时噪音计读数', w/2 - 44, 345);

            amp = Math.max(8, amp * 0.985); // decay
            requestAnimationFrame(render);
        }
        render();
    
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
