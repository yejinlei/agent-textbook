    <script>
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        function playTone(freq, duration, type='sine') {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const telem = document.getElementById('telem');
        const controlsContainer = document.getElementById('controlsContainer');
        const activeMode = "baking_soda_vinegar";

        
const state = {
    vinegarReacting: activeMode === 'baking_soda_vinegar',
    gasBubbleCount: 30,
    ironNailCopperPlated: activeMode === 'copper_sulfate_iron',
    candleBurning: activeMode === 'candle_combustion',
    matchExtinguished: false
};

function setupControls() {
    let html = '';
    if (activeMode === 'baking_soda_vinegar') {
        html += `
            <div class="ctrl-group">
                <div class="ctrl-label"><span>小苏打与白醋剧烈反应</span></div>
                <div class="btn-grid">
                    <button class="btn btn-green" id="btnPourVinegar">🧪 倒入白醋 (剧烈冒出CO₂气泡)</button>
                    <button class="btn btn-rose" id="btnTestFlame">🔥 放入燃烧火柴 (检验熄灭)</button>
                </div>
            </div>
            <div class="btn-grid" style="margin-top:6px;">
                <button class="btn" id="btnResetGas">🔄 重新配置反应杯</button>
            </div>
        `;
    } else if (activeMode === 'copper_sulfate_iron') {
        html += `
            <div class="ctrl-group">
                <div class="ctrl-label"><span>硫酸铜溶液与铁钉置换反应</span><span class="val">${state.ironNailCopperPlated?'表面析出红铜，溶液变浅绿':'铁钉尚未浸入'}</span></div>
                <div class="btn-grid">
                    <button class="btn btn-primary" id="btnDipNail">🔩 将洁净铁钉浸入蓝色硫酸铜溶液</button>
                    <button class="btn btn-rose" id="btnResetCu">🔄 重置硫酸铜溶液</button>
                </div>
            </div>
        `;
    } else {
        html += `
            <div class="ctrl-group">
                <div class="ctrl-label"><span>物质变化本质探究</span></div>
                <div class="btn-grid">
                    <button class="btn btn-primary" id="btnPhys">🧊 物理变化 (仅形态/状态改变)</button>
                    <button class="btn btn-rose" id="btnChem">🔥 化学变化 (生成了新物质!)</button>
                </div>
            </div>
        `;
    }

    controlsContainer.innerHTML = html;
    bindU4Events();
}

function bindU4Events() {
    const btnPourVinegar = document.getElementById('btnPourVinegar');
    if (btnPourVinegar) btnPourVinegar.onclick = () => {
        state.vinegarReacting = true;
        playTone(300, 0.4, 'sawtooth');
    };
    const btnTestFlame = document.getElementById('btnTestFlame');
    if (btnTestFlame) btnTestFlame.onclick = () => {
        state.matchExtinguished = true;
        playTone(200, 0.2);
    };
    const btnResetGas = document.getElementById('btnResetGas');
    if (btnResetGas) btnResetGas.onclick = () => {
        state.vinegarReacting = false;
        state.matchExtinguished = false;
        setupControls();
        playTone(400, 0.1);
    };

    const btnDipNail = document.getElementById('btnDipNail');
    if (btnDipNail) btnDipNail.onclick = () => {
        state.ironNailCopperPlated = true;
        setupControls();
        playTone(750, 0.2);
    };
    const btnResetCu = document.getElementById('btnResetCu');
    if (btnResetCu) btnResetCu.onclick = () => {
        state.ironNailCopperPlated = false;
        setupControls();
        playTone(300, 0.1);
    };

    const btnPhys = document.getElementById('btnPhys');
    if (btnPhys) btnPhys.onclick = () => { playTone(600, 0.1); };
    const btnChem = document.getElementById('btnChem');
    if (btnChem) btnChem.onclick = () => { playTone(880, 0.2); };
}

        
function draw() {
    ctx.clearRect(0, 0, 720, 450);

    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, 720, 450);

    if (activeMode === 'baking_soda_vinegar') {
        drawBakingSodaVinegar();
    } else if (activeMode === 'copper_sulfate_iron') {
        drawCopperSulfate();
    } else if (activeMode === 'physical_vs_chemical') {
        drawPhysicalVsChemical();
    } else if (activeMode === 'reaction_phenomena') {
        drawReactionPhenomena();
    } else if (activeMode === 'photosynthesis_earth') {
        drawPhotosynthesisEarth();
    } else if (activeMode === 'digestion_chemistry') {
        drawDigestionChemistry();
    } else {
        drawChemicalOverview();
    }

    updateTelemetry();
    requestAnimationFrame(draw);
}


function drawPhysicalVsChemical() {
    const cx = 360;
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🍳 厨房里的物质与变化: 物理变化(无新物质生成) vs 化学变化(产生新物质)', cx, 40);

    // Left: Physical Changes
    ctx.fillStyle = '#1e293b'; ctx.fillRect(80, 80, 260, 270);
    ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.strokeRect(80, 80, 260, 270);
    ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 16px sans-serif';
    ctx.fillText('物理变化 (形态/状态改变)', 210, 115);
    ctx.fillStyle = '#cbd5e1'; ctx.font = '13px sans-serif';
    ctx.fillText('• 水结成冰 / 冰融化为水', 210, 160);
    ctx.fillText('• 研磨折断粉碎食盐颗粒', 210, 195);
    ctx.fillText('• 易拉罐压扁 / 玻璃打碎', 210, 230);
    ctx.fillStyle = '#10b981';
    ctx.fillText('分子种类不变·可逆', 210, 280);

    // Right: Chemical Changes
    ctx.fillStyle = '#1e293b'; ctx.fillRect(380, 80, 260, 270);
    ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 2; ctx.strokeRect(380, 80, 260, 270);
    ctx.fillStyle = '#f43f5e'; ctx.font = 'bold 16px sans-serif';
    ctx.fillText('化学变化 (有新物质生成!)', 510, 115);
    ctx.fillStyle = '#cbd5e1'; ctx.font = '13px sans-serif';
    ctx.fillText('• 燃气灶蓝火燃烧 (释放CO2+水)', 510, 160);
    ctx.fillText('• 铁锅潮湿生锈 (生成铁锈)', 510, 195);
    ctx.fillText('• 酵母菌发酵面粉 (产生气泡膨胀)', 510, 230);
    ctx.fillStyle = '#f43f5e';
    ctx.fillText('生成新物质·化学键重组', 510, 280);

    ctx.fillStyle = '#f8fafc'; ctx.font = '13px sans-serif';
    ctx.fillText('判断本质依据: 是否产生了新物质 (如发光发热、产生气体、改变颜色、析出沉淀)', cx, 395);
}

function drawReactionPhenomena() {

    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('✨ 变化中伴随的现象: 化学变化四大特征现象 (发光发热/气体/变色/沉淀)', cx, 40);

    const phenomena = [
        { t: '1. 发光发热', d: '蜡烛燃烧·剧烈放热\n放出明亮火光', c: '#f59e0b', x: 60 },
        { t: '2. 产生气体', d: '小苏打遇白醋\n剧烈冒出二氧化碳气泡', c: '#38bdf8', x: 215 },
        { t: '3. 改变颜色', d: '铁钉浸入硫酸铜溶液\n铁钉表面镀上一层紫红铜', c: '#f43f5e', x: 370 },
        { t: '4. 产生沉淀', d: '澄清石灰水通入CO2\n变浑浊析出碳酸钙沉淀', c: '#10b981', x: 525 }
    ];

    phenomena.forEach(p => {
        ctx.fillStyle = '#1e293b'; ctx.fillRect(p.x, 80, 140, 270);
        ctx.strokeStyle = p.c; ctx.lineWidth = 2; ctx.strokeRect(p.x, 80, 140, 270);

        ctx.fillStyle = p.c; ctx.font = 'bold 14px sans-serif';
        ctx.fillText(p.t, p.x + 70, 115);

        ctx.fillStyle = '#cbd5e1'; ctx.font = '12px sans-serif';
        const lines = p.d.split('\n');
        lines.forEach((l, i) => ctx.fillText(l, p.x + 70, 160 + i * 24));

        ctx.fillStyle = '#334155'; ctx.fillRect(p.x + 10, 290, 120, 36);
        ctx.fillStyle = p.c; ctx.font = 'bold 12px sans-serif';

}

function drawBakingSodaVinegar() {
    const cx = 360;
    // Glass Beaker
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3;
    ctx.strokeRect(cx - 70, 180, 140, 180);

    // Liquid inside
    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.fillRect(cx - 68, 250, 136, 108);

    // Sodium Bicarbonate solid powder at bottom
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cx - 50, 345, 100, 12);

    // Gas Bubbles (CO2 effervescence)
    if (state.vinegarReacting) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 35; i++) {
            const bx = cx - 55 + (i * 19) % 110;
            const by = 260 + (i * 23 + (Date.now() * 0.08) % 80) % 90;
            ctx.beginPath();
            ctx.arc(bx, by, 3 + (i % 3) * 2, 0, Math.PI * 2);
            ctx.stroke();
        }

        // CO2 gas overflowing rim
        ctx.fillStyle = 'rgba(203, 213, 225, 0.3)';
        ctx.beginPath();
        ctx.arc(cx, 175, 45, 0, Math.PI * 2);
        ctx.fill();
    }

    // Match flame test
    if (state.matchExtinguished) {
        // Smoke & extinguished match
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx, 160); ctx.lineTo(cx, 130); ctx.stroke();
        ctx.fillStyle = '#475569';
        ctx.beginPath(); ctx.arc(cx, 160, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#f43f5e';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText('火柴伸入瞬间熄灭! (二氧化碳不支持燃烧且比空气重)', cx + 15, 140);
    }

    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('小苏打与白醋反应实验: 产生大量二氧化碳气体 (生成新物质的化学变化)', cx, 40);
}

function drawCopperSulfate() {
    const cx = 360;
    // Beaker with Copper Sulfate solution
    // Blue solution initially, turns light green (FeSO4) after displacement
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3;
    ctx.strokeRect(cx - 70, 180, 140, 180);

    ctx.fillStyle = state.ironNailCopperPlated ? 'rgba(52, 211, 153, 0.45)' : 'rgba(2, 132, 199, 0.55)';
    ctx.fillRect(cx - 68, 220, 136, 138);

    // Iron Nail immersed
    const nailX = cx;
    const nailY = 240;

    // Nail shaft
    ctx.fillStyle = state.ironNailCopperPlated ? '#dc2626' : '#94a3b8'; // Red copper plated!
    ctx.fillRect(nailX - 5, nailY, 10, 90);
    // Nail head
    ctx.fillRect(nailX - 12, nailY, 24, 6);

    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    if (state.ironNailCopperPlated) {
        ctx.fillText('美丽的化学变化: 铁钉表面附着红色单质铜，溶液由天蓝色变为浅绿色!', cx, 40);
        ctx.fillStyle = '#f59e0b';
        ctx.font = 'bold 15px monospace';
        ctx.fillText('化学反应方程式: Fe + CuSO₄ ➔ FeSO₄ + Cu (置换反应)', cx, 80);
    } else {
        ctx.fillText('硫酸铜溶液与铁钉置换实验 (准备就绪，请点击浸入铁钉)', cx, 40);
    }
}

function drawChemicalOverview() {
    const cx = 360;
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('化学变化的核心特征: 生成了新物质，并常伴随发光发热、变色、沉淀与产气', cx, 40);

    const cards = [
        {title: '🧊 物理变化', desc: '水结冰、铁丝弯折、白糖溶解 (无新物质)', color: '#38bdf8'},
        {title: '🔥 化学变化', desc: '小苏打反应、蜡烛燃烧、铁钉生锈 (有新物质)', color: '#f43f5e'}
    ];

    cards.forEach((c, idx) => {
        const x = 120 + idx * 260;
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(x, 150, 220, 160);
        ctx.strokeStyle = c.color;
        ctx.lineWidth = 3;
        ctx.strokeRect(x, 150, 220, 160);

        ctx.fillStyle = c.color;
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(c.title, x + 110, 200);

        ctx.fillStyle = '#cbd5e1';
        ctx.font = '13px sans-serif';
        ctx.fillText(c.desc, x + 110, 250);
    });
}

        
function updateTelemetry() {
    let txt = `[化学物质反应数据就绪] 模式: ${activeMode} | `;
    if (activeMode === 'baking_soda_vinegar') {
        txt += `反应状态: ${state.vinegarReacting?'剧烈生成CO2':'未反应'} | 火焰: ${state.matchExtinguished?'已熄灭':'正常'}`;
    } else if (activeMode === 'copper_sulfate_iron') {
        txt += `置换反应: ${state.ironNailCopperPlated?'完成 (析出红色单质铜)':'未开始'}`;
    } else {
        txt += `物质变化分类: 生成新物质判定标准`;
    }
    telem.innerText = txt;
}


        setupControls();
        draw();
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
