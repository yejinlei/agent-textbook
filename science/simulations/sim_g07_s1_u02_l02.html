<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【认识呼吸器官】真实验微仿真 - 四年级科学</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --green: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        header {
            width: 100%;
            max-width: 980px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        header h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
        .badge { background: rgba(16, 185, 129, 0.15); color: var(--green); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 0.88rem; }
        .layout {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }
        .canvas-box {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #020617;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 620px;
            height: 420px;
            touch-action: none;
        }
        .controls {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inquiry {
            background: rgba(16, 185, 129, 0.08);
            border-left: 3px solid var(--green);
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.82rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .c-group { display: flex; flex-direction: column; gap: 6px; }
        .c-group label { font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; }
        .c-group input[type=range] { accent-color: var(--green); cursor: pointer; }
        .btn {
            background: var(--green);
            color: #0f172a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-sec { background: #334155; color: #f8fafc; }
        .telemetry {
            background: #090d16;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #334155;
            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: var(--green);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>🔬 认识呼吸器官 <span class="badge">四年级上册 · 呼吸与消化</span></h2>
            <p>教科版科学原书人体生理真实验 · 拒绝伪仿真</p>
        </div>
        <a href="g1s1_reaction_time.html" class="master-lab-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 14px rgba(245, 158, 11, 0.4); margin-left: 10px;" title="进入全景开放式大师级科学综合实验室">🏆 进入大师级实验室 · 呼吸消化与生理动力学实验室 →</a>
        <a href="index.html" class="back-link">← 返回实验大厅</a>
    </header>
    <div class="layout">
        <div class="canvas-box">
            <canvas id="simCanvas" width="620" height="420"></canvas>
            <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted);">
                <span>💡 人体生理器官动态解剖交互</span>
                <span>🎧 Web Audio 拟真呼吸/心跳/水泡声效</span>
            </div>
        </div>
        <div class="controls">
            <div class="inquiry"><strong>🎯 探究任务</strong>：玻璃钟罩+气球肺+橡胶膜膈肌物理模型：向下拉动底部膈肌，观察胸腔容积变大、气压降低，两个气球肺瞬间膨胀吸气！</div>
            
        <div class="c-group">
            <label><span>膈肌下拉幅度 (模拟吸气)</span><span id="diaphragmDisp">0</span></label>
            <input type="range" id="diaphragmSlider" min="0" max="60" value="0">
        </div>
        <div class="telemetry" id="telem">
            [膈肌状态] 舒张拱起 (呼气初态)<br>
            [胸腔容积] 缩小，内部气压等于外界气压<br>
            [气球肺] 瘪缩状态
        </div>
    
        </div>
    </div>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function playTone(freq=440, type='sine', dur=0.15, vol=0.08) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function playBreath(isInhale=true) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const dur = 0.6;
                const bufferSize = audioCtx.sampleRate * dur;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(isInhale ? 400 : 250, audioCtx.currentTime);
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start();
            } catch(e){}
        }
        function playHeartbeat() {
            playTone(80, 'sine', 0.12, 0.15);
            setTimeout(() => playTone(65, 'sine', 0.12, 0.12), 160);
        }
        
        const slider = document.getElementById('diaphragmSlider');
        const disp = document.getElementById('diaphragmDisp');
        const telem = document.getElementById('telem');
        slider.addEventListener('input', () => {
            const v = parseFloat(slider.value);
            disp.textContent = v;
            if(v > 30) playBreath(true);
            const lungVol = (100 + v * 2.5).toFixed(0);
            telem.innerHTML = `[膈肌状态] ${v>20 ? '收缩下降 (主动吸气中)' : '舒张上升 (呼气中)'}<br>[胸腔气压] ${v>20 ? '负压产生 (-15 hPa)' : '恢复常压'}<br>[气球肺容积] 膨胀至 ${lungVol} mL！外界空气主动压入肺部！`;
        });
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;
            const pull = parseFloat(slider.value);

            // Glass Bell Jar
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(w/2 - 80, 300); ctx.lineTo(w/2 - 80, 140);
            ctx.quadraticCurveTo(w/2 - 80, 80, w/2, 80);
            ctx.quadraticCurveTo(w/2 + 80, 80, w/2 + 80, 140);
            ctx.lineTo(w/2 + 80, 300);
            ctx.stroke();

            // Y-shaped glass tube (Trachea)
            ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(w/2, 50); ctx.lineTo(w/2, 130); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(w/2, 130); ctx.lineTo(w/2 - 30, 160); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(w/2, 130); ctx.lineTo(w/2 + 30, 160); ctx.stroke();

            // Two Rubber Balloons (Lungs)
            const balloonR = 18 + pull * 0.45;
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath(); ctx.arc(w/2 - 30, 180 + pull*0.1, balloonR, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(w/2 + 30, 180 + pull*0.1, balloonR, 0, Math.PI*2); ctx.fill();

            // Rubber Diaphragm at bottom
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.moveTo(w/2 - 80, 300);
            ctx.quadraticCurveTo(w/2, 300 + pull * 1.3, w/2 + 80, 300);
            ctx.lineTo(w/2 + 80, 310);
            ctx.quadraticCurveTo(w/2, 310 + pull * 1.3, w/2 - 80, 310);
            ctx.closePath();
            ctx.fill();

            // Handle to pull
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(w/2 - 8, 305 + pull * 1.3, 16, 25);

            requestAnimationFrame(render);
        }
        render();
    
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
