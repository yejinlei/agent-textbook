<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>【我们的呼吸与消化】真实验微仿真 - 四年级科学</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --green: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        header {
            width: 100%;
            max-width: 980px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        header h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
        .badge { background: rgba(16, 185, 129, 0.15); color: var(--green); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 0.88rem; }
        .layout {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }
        .canvas-box {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #020617;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 620px;
            height: 420px;
            touch-action: none;
        }
        .controls {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inquiry {
            background: rgba(16, 185, 129, 0.08);
            border-left: 3px solid var(--green);
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.82rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .c-group { display: flex; flex-direction: column; gap: 6px; }
        .c-group label { font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; }
        .c-group input[type=range] { accent-color: var(--green); cursor: pointer; }
        .btn {
            background: var(--green);
            color: #0f172a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-sec { background: #334155; color: #f8fafc; }
        .telemetry {
            background: #090d16;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #334155;
            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: var(--green);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>🔬 我们的呼吸与消化 <span class="badge">四年级上册 · 呼吸与消化</span></h2>
            <p>教科版科学原书人体生理真实验 · 拒绝伪仿真</p>
        </div>
        <a href="g1s1_reaction_time.html" class="master-lab-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 14px rgba(245, 158, 11, 0.4); margin-left: 10px;" title="进入全景开放式大师级科学综合实验室">🏆 进入大师级实验室 · 呼吸消化与生理动力学实验室 →</a>
        <a href="index.html" class="back-link">← 返回实验大厅</a>
    </header>
    <div class="layout">
        <div class="canvas-box">
            <canvas id="simCanvas" width="620" height="420"></canvas>
            <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted);">
                <span>💡 人体生理器官动态解剖交互</span>
                <span>🎧 Web Audio 拟真呼吸/心跳/水泡声效</span>
            </div>
        </div>
        <div class="controls">
            <div class="inquiry"><strong>🎯 探究任务</strong>：人体躯干双系统透视交互：切换观察气体在鼻腔、气管、肺部的交换，与食物在口腔、食道、胃、肠道的消化吸收通道！</div>
            
        <div class="c-group">
            <button class="btn" id="btnRespMode">🫁 激活呼吸通道 (氧气/二氧化碳流)</button>
            <button class="btn btn-sec" id="btnDigestMode">🍔 激活消化通道 (食团下咽推进)</button>
        </div>
        <div class="telemetry" id="telem">
            [当前通道] 呼吸系统模式<br>
            [氧气流向] 鼻腔 → 咽喉 → 气管 → 支气管 → 肺泡毛细血管<br>
            [生命协同] 呼吸提供氧气氧化分解食物释放能量，维持生命！
        </div>
    
        </div>
    </div>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function playTone(freq=440, type='sine', dur=0.15, vol=0.08) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function playBreath(isInhale=true) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const dur = 0.6;
                const bufferSize = audioCtx.sampleRate * dur;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(isInhale ? 400 : 250, audioCtx.currentTime);
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start();
            } catch(e){}
        }
        function playHeartbeat() {
            playTone(80, 'sine', 0.12, 0.15);
            setTimeout(() => playTone(65, 'sine', 0.12, 0.12), 160);
        }
        
        let mode = 'resp';
        let t = 0;
        const telem = document.getElementById('telem');
        document.getElementById('btnRespMode').addEventListener('click', () => {
            mode = 'resp';
            playBreath(true);
            telem.innerHTML = '[当前通道] 呼吸系统<br>[器官组成] 鼻腔、咽、喉、气管、支气管、肺<br>[气体交换] 肺泡内氧气进入血液，排出二氧化碳！';
        });
        document.getElementById('btnDigestMode').addEventListener('click', () => {
            mode = 'digest';
            playTone(320, 'triangle', 0.2);
            telem.innerHTML = '[当前通道] 消化系统<br>[器官组成] 口腔、食道、胃、小肠、大肠、肛门<br>[功能] 磨碎食物、水解营养、吸收进入血液！';
        });
        function render() {
            t += 0.04;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;

            // Torso outline
            ctx.strokeStyle = '#475569'; ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(w/2, 60, 30, 0, Math.PI*2); // Head
            ctx.moveTo(w/2 - 70, 130); ctx.lineTo(w/2 - 70, 380); ctx.lineTo(w/2 + 70, 380); ctx.lineTo(w/2 + 70, 130);
            ctx.stroke();

            if(mode === 'resp') {
                // Trachea & Lungs
                ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 6;
                ctx.beginPath(); ctx.moveTo(w/2, 90); ctx.lineTo(w/2, 160); ctx.stroke();
                // Bronchi
                ctx.beginPath(); ctx.moveTo(w/2, 160); ctx.lineTo(w/2 - 35, 185); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(w/2, 160); ctx.lineTo(w/2 + 35, 185); ctx.stroke();

                // Left & Right Lungs (expanding with t)
                const lungScale = 1.0 + Math.sin(t) * 0.12;
                ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
                ctx.beginPath(); ctx.ellipse(w/2 - 40, 205, 28 * lungScale, 45 * lungScale, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(w/2 + 40, 205, 28 * lungScale, 45 * lungScale, 0, 0, Math.PI*2); ctx.fill();

                // Air particles flowing
                ctx.fillStyle = '#f8fafc';
                const flowY = 90 + ((t * 40) % 110);
                ctx.beginPath(); ctx.arc(w/2, flowY, 4, 0, Math.PI*2); ctx.fill();
            } else {
                // Digestive tract
                ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 6;
                ctx.beginPath(); ctx.moveTo(w/2, 85); ctx.lineTo(w/2, 180); ctx.stroke(); // Esophagus

                // Stomach
                ctx.fillStyle = 'rgba(245, 158, 11, 0.4)';
                ctx.beginPath(); ctx.arc(w/2 - 20, 220, 32, 0, Math.PI*2); ctx.fill();

                // Small Intestine (coiled)
                ctx.strokeStyle = '#10b981'; ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(w/2, 280, 25, 0, Math.PI*2);
                ctx.arc(w/2, 290, 18, 0, Math.PI*2);
                ctx.stroke();

                // Food bolus moving
                const foodY = 85 + ((t * 30) % 200);
                ctx.fillStyle = '#ef4444';
                ctx.beginPath(); ctx.arc(w/2 - (foodY > 180 ? 15 : 0), foodY, 7, 0, Math.PI*2); ctx.fill();
            }
            requestAnimationFrame(render);
        }
        render();
    
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
