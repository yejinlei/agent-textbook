<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【里面是怎样连接的】真实验微仿真 - 四年级科学</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --green: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        header {
            width: 100%;
            max-width: 980px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        header h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
        .badge { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 0.88rem; }
        .layout {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }
        .canvas-box {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #020617;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 620px;
            height: 420px;
            touch-action: none;
        }
        .controls {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .inquiry {
            background: rgba(56, 189, 248, 0.08);
            border-left: 3px solid var(--accent);
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.82rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .c-group { display: flex; flex-direction: column; gap: 6px; }
        .c-group label { font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; }
        .c-group input[type=range] { accent-color: var(--accent); cursor: pointer; }
        .btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-sec { background: #334155; color: #f8fafc; }
        .telemetry {
            background: #090d16;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #334155;
            font-family: ui-monospace, monospace;
            font-size: 0.82rem;
            color: var(--accent);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h2>🔬 里面是怎样连接的 <span class="badge">四年级下册 · 电路单元</span></h2>
            <p>教科版科学原书电路真实验 · 拒绝伪仿真</p>
        </div>
        <a href="circuit_sandbox.html" class="master-lab-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 700; font-size: 0.8rem; padding: 6px 14px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 14px rgba(245, 158, 11, 0.4); margin-left: 10px;" title="进入全景开放式大师级科学综合实验室">🏆 进入大师级实验室 · 大师级闭合回路电子沙盒 →</a>
        <a href="index.html" class="back-link">← 返回实验大厅</a>
    </header>
    <div class="layout">
        <div class="canvas-box">
            <canvas id="simCanvas" width="620" height="420"></canvas>
            <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted);">
                <span>💡 原生真实闭合回路与电子流动画</span>
                <span>🎧 Web Audio 拟真通电/短路警报音效</span>
            </div>
        </div>
        <div class="controls">
            <div class="inquiry"><strong>🎯 探究任务</strong>：4 接线柱暗盒电路探秘游戏：用电路检测器依次接触接线柱 1-2, 1-3, 1-4, 2-3, 2-4, 3-4，根据检测灯亮灭推断暗盒内部隐藏的导线连接方式！</div>
            
        <div class="c-group">
            <p style="font-size:0.85rem; color:#cbd5e1;">选择检测两个接线柱之间的通断：</p>
        </div>
        <div class="c-group" style="display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
            <button class="btn btn-sec" onclick="probe(1, 2)">测试 1 - 2</button>
            <button class="btn btn-sec" onclick="probe(1, 3)">测试 1 - 3</button>
            <button class="btn btn-sec" onclick="probe(1, 4)">测试 1 - 4</button>
            <button class="btn btn-sec" onclick="probe(2, 3)">测试 2 - 3</button>
            <button class="btn btn-sec" onclick="probe(2, 4)">测试 2 - 4</button>
            <button class="btn btn-sec" onclick="probe(3, 4)">测试 3 - 4</button>
        </div>
        <div class="telemetry" id="telem">
            [暗盒探秘] 4 个接线柱隐藏在盒子表面<br>
            [规律推测] 检测灯亮代表内部有导线直连通路！
        </div>
    
        </div>
    </div>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function playTone(freq=440, type='sine', dur=0.2, vol=0.1) {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }
        function playClick() { playTone(800, 'square', 0.04, 0.08); }
        
        // Hidden internal wires: 1-2 is connected, 3-4 is connected
        const telem = document.getElementById('telem');

        window.probe = function(p1, p2) {
            const isConn = (p1===1 && p2===2) || (p1===3 && p2===4);
            if(isConn) {
                playTone(550, 'sine', 0.25);
                telem.innerHTML = `💡 [检测探针接通 ${p1} - ${p2}] 检测灯泡发亮！<br>[推理结论] 接线柱 ${p1} 与 ${p2} 之间存在内部导线连接通路！`;
            } else {
                playTone(200, 'triangle', 0.1);
                telem.innerHTML = `🔌 [检测探针接通 ${p1} - ${p2}] 检测灯泡不亮。<br>[推理结论] 接线柱 ${p1} 与 ${p2} 之间断路无直连导线。`;
            }
        };
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;

            // Black box
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(w/2 - 120, 100, 240, 200);
            ctx.strokeStyle = '#64748b'; ctx.lineWidth = 4;
            ctx.strokeRect(w/2 - 120, 100, 240, 200);

            // 4 Terminals
            const terminals = [
                {x: w/2 - 60, y: 150, id: 1},
                {x: w/2 + 60, y: 150, id: 2},
                {x: w/2 - 60, y: 240, id: 3},
                {x: w/2 + 60, y: 240, id: 4}
            ];
            for(let t of terminals) {
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath(); ctx.arc(t.x, t.y, 14, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#0f172a'; ctx.font = '14px bold sans-serif';
                ctx.fillText(t.id, t.x - 4, t.y + 5);
            }

            requestAnimationFrame(render);
        }
        render();
    
    </script>
    <script src="master_science_suite.js"></script>
</body>
</html>
