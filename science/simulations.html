domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g08_s2_u01_l08.html", "code": "g08_s2_u01_l08", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "植物的每一处器官形态均是自然选择的精妙杰作——扁平叶片最大化受光面积，维管束导管利用水分子毛细吸力将矿物质逆重力泵送百米树梢，根系向地性确保了机械固定与深层水源汲取。", "misconception": ""}, "figures": ["p19.webp", "p20.webp", "p21.webp"], "raw_text": "### [第 19 页]\n\n![第 19 页教学插图与实验活动](figures/p19.png)\n\n## 8. 凤仙花的一生\n\n\n凤仙花的一生经过长达几个月的种植活动，我们亲历了栽培、管理的过程，观察、记录了凤仙花一生的生长变化。整理并分析我们收集的信息，我们有哪些新的收获呢？\n1. 展示并交流我们种植的凤仙花或其他植物的生长变化记录表。\n2. 将我们记录的不同时期凤仙花的图片，按生长变化的顺序排列起来。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿生物工程（太空诱变育种与人工合成淀粉）**：中国空间站已成功开展水稻从种子到种子的全生命周期空间培养；中科院科研人员更在全球首次实现了从二氧化碳到淀粉的无细胞人工化学全合成，极大拓宽了光合作用的理论边界！\n- 🧠 **跨学科大概念（结构与功能相适应）**：植物的每一处器官形态均是自然选择的精妙杰作——扁平叶片最大化受光面积，维管束导管利用水分子毛细吸力将矿物质逆重力泵送百米树梢，根系向地性确保了机械固定与深层水源汲取。\n- ⚠️ 许多小学生认为“植物生长所需要的泥土全部被植物‘吃’进了肚子里”。**科学真相**：经典的凡·海尔蒙特柳树实验表明，植物增重的绝大部分干物质并非来自土壤，而是通过光合作用“抓取”空气中的二氧化碳分子同化而成的有机碳链！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g08_s2_u01_l08.html)\n\n\n### [第 20 页]\n\n![第 20 页教学插图与实验活动](figures/p20.png)\n\n3. 根据我们的记录，完成下表。计算凤仙花从播下种子到结出新的种子需要多长时间。\n播种子叶出土长出花蕾开花结果果实开裂植物枯死月日月日月日月日月日月日月日__天 __天 __天 __天 __天 __天 __天从播下种子到结出新的种子共__天\n4. 根据记录的不同阶段凤仙花植株的高度，制作凤仙花高度变化统计图，分析凤仙花高度生长变化的规律。\n1. 凤仙花生长的过程中，哪些现象可以说明水、阳光、空气、温度等影响植物的生长？\n2. 成熟的凤仙花植株包括哪几部分？每部分有什么作用？\n3. 凤仙花的生命周期是多长时间？运用我们的观察记录说明凤仙花生长变化的规律。\n1. 做一个凤仙花模型。\n2. 了解更多植物的生长变化，与凤仙花相比有什么相同和不同？\n如果我们种植了其他植物，也可以用这样的方法进行整理！\n\n### [第 21 页]\n\n![第 21 页教学插图与实验活动](figures/p21.png)\n\n电路很久以前，人们就开始了对电的探索。爱迪生在前人研究的基础上，于1879年通过技术改进制成了长寿命白炽灯，并在1882年建立了最早的商用电力系统，揭开了电气时代的序幕。\n电能让电器运转，这里面的奥秘是什么呢？\n让我们了解电路，进行更多有趣的探索吧！"}, {"id": "sci_08_u02_l01", "lesson_idx": 133, "book": "四年级下册", "vol_dir": "08_四年级下册", "unit_no": 2, "unit_title": "第二单元电路", "lesson_no": 1, "title": "电和我们的生活", "page": 22, "domain": "physics_em", "domain_cn": "综合科学探究", "sim_file": "sim_g08_s2_u02_l01.html", "code": "g08_s2_u02_l01", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。", "misconception": ""}, "figures": ["p22.webp", "p23.webp"], "raw_text": "### [第 22 页]\n\n![第 22 页教学插图与实验活动](figures/p22.png)\n\n## 1. 电和我们的生活\n\n\n电和我们的生活通电后，电器就能工作，为我们的生活、学习和工作带来方便。\n我们对电有哪些了解？知道哪些有关电的知识？我们是怎样知道这些知识的？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **国家重大电力装备（特高压直流输电与常温超导研究）**：我国特高压输电技术世界领先，±1100千伏昌吉-古泉特高压工程跨越数千公里输送清洁能源；而在前沿物理实验室中，高温超导磁悬浮列车试验线已突破时速600公里，实现零接触低阻抗飞驰！\n- 🧠 **跨学科大概念（闭合回路与能量转换）**：电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。\n- ⚠️ 很多孩子认为“电线里的电像水管里的水一样从电池正极流到负极，流完电池就空了”。**科学真相**：导线金属内部早已有海量的自由电子；闭合开关瞬间，电场以光速在回路中建立，整个回路中的电子几乎同时开始定向微观漂移，消耗的是电池的化学势能而非‘电子本身’！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g08_s2_u02_l01.html)\n\n\n### [第 23 页]\n\n![第 23 页教学插图与实验活动](figures/p23.png)\n\n用电安全提示 1 用讨论的方式记录我们对电的认识。\n1. 墙壁插座内的电，关于电的知识（班级记录表）是发电厂通过电网输送到各家各户的，一旦触及能日期：\n引发事故、致人死亡，所我们已经知道的我们还想知道的以千万不能直接触摸！\n2. 不能用插座中的电做任何实验！在本单元的学习中，我们只用干电池来做实验。\n3. 不要靠近变压器 2 生活中使用的电都是由电源提供的，以及断开或裸露的电线。\n当看到断开或裸露的电像电灯、电视机等是由发电厂供电；而像手线时，要马上报告家长、机、石英钟等则是由电池供电。调查家中使老师或有关人员。\n用的电器。这些电器用的电来自哪里？通电\n4. 遇到紧急情况，拨打急救电话1 2 0、后能做什么？\n报警电话110。\n家用电器记录（班级记录表）日期：\n电器名称电源电器的作用电灯电厂照明洗衣机电厂洗衣服当心触电手机电池打电话、上网设想一下，如果没有电，我们的生活会变成什么样子？"}, {"id": "sci_08_u02_l02", "lesson_idx": 134, "book": "四年级下册", "vol_dir": "08_四年级下册", "unit_no": 2, "unit_title": "第二单元电路", "lesson_no": 2, "title": "点亮小灯泡", "page": 24, "domain": "physics_em", "domain_cn": "综合科学探究", "sim_file": "sim_g08_s2_u02_l02.html", "code": "g08_s2_u02_l02", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。", "misconception": ""}, "figures": ["p24.webp", "p25.webp"], "raw_text": "### [第 24 页]\n\n![第 24 页教学插图与实验活动](figures/p24.png)\n\n## 2. 点亮小灯泡\n\n\n点亮小灯泡打开手电筒的开关，小灯泡就亮了，它是怎样亮起来的？\n如果有导线和电池，你能让小灯泡亮起来吗？用示意图表达你的想法。\n玻璃泡灯丝\n1. 观察小灯泡。找一找小灯泡的金属架连接点发光部位在哪里；想一想小灯泡的各部分有什么作用。连接点\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **国家重大电力装备（特高压直流输电与常温超导研究）**：我国特高压输电技术世界领先，±1100千伏昌吉-古泉特高压工程跨越数千公里输送清洁能源；而在前沿物理实验室中，高温超导磁悬浮列车试验线已突破时速600公里，实现零接触低阻抗飞驰！\n- 🧠 **跨学科大概念（闭合回路与能量转换）**：电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。\n- ⚠️ 很多孩子认为“电线里的电像水管里的水一样从电池正极流到负极，流完电池就空了”。**科学真相**：导线金属内部早已有海量的自由电子；闭合开关瞬间，电场以光速在回路中建立，整个回路中的电子几乎同时开始定向微观漂移，消耗的是电池的化学势能而非‘电子本身’！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g08_s2_u02_l02.html)\n\n\n### [第 25 页]\n\n![第 25 页教学插图与实验活动](figures/p25.png)\n\n2. 用一段导线和一节电池让小灯泡亮起来，并记录有哪些连接能点亮小灯泡，哪些连接不能点亮小灯泡。\n安全提示干电池的金属铜帽端是正极，另一端是负极。\n当导线直接与电池的正、负极相连，而没有经过小灯泡时，就会造成短路。短路时，电池中的电会很快消耗完，并且电池还会在一瞬间发热变烫，甚至可能爆炸。\n所以，在实验中，要避免出现短路。\n1. 展示我们的实验记录，交流哪些连接能点亮小灯泡，哪些连接不能点亮小灯泡。\n2. 分析那些能点亮小灯泡的连接，你认为电池和小灯泡怎样连接，小灯泡才能亮起来？\n观察右面四幅连接图，哪些能够点亮小灯泡，哪些不能点亮小灯泡？\n3. 你认为小灯泡是如何亮起来的？"}, {"id": "sci_08_u02_l03", "lesson_idx": 135, "book": "四年级下册", "vol_dir": "08_四年级下册", "unit_no": 2, "unit_title": "第二单元电路", "lesson_no": 3, "title": "简易电路", "page": 26, "domain": "physics_em", "domain_cn": "综合科学探究", "sim_file": "sim_g08_s2_u02_l03.html", "code": "g08_s2_u02_l03", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。", "misconception": ""}, "figures": ["p26.webp", "p27.webp", "p28.webp"], "raw_text": "### [第 26 页]\n\n![第 26 页教学插图与实验活动](figures/p26.png)\n\n## 3. 简易电路\n\n\n简易电路回顾我们是怎样点亮小灯泡的，小灯泡和电池的连接点在哪里，电流是如何通过小灯泡的。由此，我们可以进一步思考电路是由什么组成的。我们能组装一个电路吗？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **国家重大电力装备（特高压直流输电与常温超导研究）**：我国特高压输电技术世界领先，±1100千伏昌吉-古泉特高压工程跨越数千公里输送清洁能源；而在前沿物理实验室中，高温超导磁悬浮列车试验线已突破时速600公里，实现零接触低阻抗飞驰！\n- 🧠 **跨学科大概念（闭合回路与能量转换）**：电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。\n- ⚠️ 很多孩子认为“电线里的电像水管里的水一样从电池正极流到负极，流完电池就空了”。**科学真相**：导线金属内部早已有海量的自由电子；闭合开关瞬间，电场以光速在回路中建立，整个回路中的电子几乎同时开始定向微观漂移，消耗的是电池的化学势能而非‘电子本身’！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g08_s2_u02_l03.html)\n\n\n### [第 27 页]\n\n![第 27 页教学插图与实验活动](figures/p27.png)\n\n1. 组装一个电路。\n● ● 为了发现电路更多的秘密，我们使用电池盒和灯座把电池和小灯泡固定下来，再进行观察。\n● ● 在电池盒的两端各连接一根导线，把电池安装在电池盒里。用连接电池盒的两根导线的另一端接触小灯泡，确定能使小灯泡亮起来。\n● ● 把小灯泡安装在灯座上，再用导线把它和电池连接起来，使小灯泡亮起来。\n\n### [第 28 页]\n\n![第 28 页教学插图与实验活动](figures/p28.png)\n\n2. 在电路中安装开关。\n把开关连接到电路里，观察开关是怎样控制电路中电流的通与断的。\n3. 画电路连接图。\n1. 在电路中，电是持续流动的，你认为电流动的路径是怎样的？把你的想法用箭头在连接图中表示出来。\n2. 我们已经发现电路是一个闭合的回路，在电路中哪些电器元件是必备的？如果我们将小灯泡换成小风扇或小电动机，会有什么现象？"}, {"id": "sci_08_u02_l04", "lesson_idx": 136, "book": "四年级下册", "vol_dir": "08_四年级下册", "unit_no": 2, "unit_title": "第二单元电路", "lesson_no": 4, "title": "电路出故障了", "page": 29, "domain": "physics_em", "domain_cn": "综合科学探究", "sim_file": "sim_g08_s2_u02_l04.html", "code": "g08_s2_u02_l04", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。", "misconception": ""}, "figures": ["p29.webp", "p30.webp"], "raw_text": "### [第 29 页]\n\n![第 29 页教学插图与实验活动](figures/p29.png)\n\n## 4. 电路出故障了\n\n\n电路出故障了电流从电池的一端经导线流出，通过小灯泡，回到电池的另一端，形成一个完整的回路，小灯泡就会亮起来。\n如果小灯泡不亮，一定是电路出故障了，怎样找到和排除电路的故障呢？\n1. 电路的故障可能有哪些？如何进行检测？\n把我们的想法都记录下来。\n电路故障检测记录表（班级记录表）日期：\n可能出现的故障检测部件排除故障的方法小灯泡坏了小灯泡与灯座接触不良电池没有电了\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **国家重大电力装备（特高压直流输电与常温超导研究）**：我国特高压输电技术世界领先，±1100千伏昌吉-古泉特高压工程跨越数千公里输送清洁能源；而在前沿物理实验室中，高温超导磁悬浮列车试验线已突破时速600公里，实现零接触低阻抗飞驰！\n- 🧠 **跨学科大概念（闭合回路与能量转换）**：电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。\n- ⚠️ 很多孩子认为“电线里的电像水管里的水一样从电池正极流到负极，流完电池就空了”。**科学真相**：导线金属内部早已有海量的自由电子；闭合开关瞬间，电场以光速在回路中建立，整个回路中的电子几乎同时开始定向微观漂移，消耗的是电池的化学势能而非‘电子本身’！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g08_s2_u02_l04.html)\n\n\n### [第 30 页]\n\n![第 30 页教学插图与实验活动](figures/p30.png)\n\n2. 做一个电路检测器。\n把简易电路中的开关拆除后，就形成了一个电路检测器。\n每次检测前，先将两个检测头互相接触一下，看看小灯泡能否亮起来。不能用电路检测器检测家用电器的电路。\n3. 每个小组检测一个有故障的电路，找出故障原因并排除。同时，将“电路故障检测记录表”补充完整。\n交流检测情况。电路中的哪一部分出了故障，你是怎么知道的？又是怎么排除的？"}, {"id": "sci_08_u02_l05", "lesson_idx": 137, "book": "四年级下册", "vol_dir": "08_四年级下册", "unit_no": 2, "unit_title": "第二单元电路", "lesson_no": 5, "title": "里面是怎样连接的", "page": 31, "domain": "physics_em", "domain_cn": "综合科学探究", "sim_file": "sim_g08_s2_u02_l05.html", "code": "g08_s2_u02_l05", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p31.webp", "p32.webp"], "raw_text": "### [第 31 页]\n\n![第 31 页教学插图与实验活动](figures/p31.png)\n\n## 5. 里面是怎样连接的\n\n\n里面是怎样连接的在一个真正的电路中，各个部件都是以不同的方式连接的。\n如果看不到电路，我们能知道各个部件是怎样连接的吗？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g08_s2_u02_l05.html)\n\n\n### [第 32 页]\n\n![第 32 页教学插图与实验活动](figures/p32.png)\n\n检测一个打不开的接线盒，并推测它的内部是怎样连接的。\n1. 用电路检测器检测接线柱之间是通路还是检测电路前，先将电路检测器的断路，记录检测结果。两个检测头接触一下，以检测它能否\n2. 推测接线盒内部是怎样连接的，说说推测正常工作；为保证的依据是什么。检测的准确性，需检测两次。\n1. 下表是一个接线盒的检测记录，你能用示意图说明接线盒内部是怎样连接的吗？\n通路   断路   \n2. 如果是5个或6个接线柱的接线盒，怎样才能毫无遗漏地检测任意两个接线柱之间的通断情况？"}, {"id": "sci_08_u02_l06", "lesson_idx": 138, "book": "四年级下册", "vol_dir": "08_四年级下册", "unit_no": 2, "unit_title": "第二单元电路", "lesson_no": 6, "title": "导体和绝缘体", "page": 33, "domain": "physics_em", "domain_cn": "综合科学探究", "sim_file": "sim_g08_s2_u02_l06.html", "code": "g08_s2_u02_l06", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p33.webp", "p34.webp", "p35.webp"], "raw_text": "### [第 33 页]\n\n![第 33 页教学插图与实验活动](figures/p33.png)\n\n## 6. 导体和绝缘体\n\n\n导体和绝缘体在连接电路时，我们为什么要把导线两端的塑料包皮剥开？\n哪些物体容易让电流通过，哪些物体不容易让电流通过？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g08_s2_u02_l06.html)\n\n\n### [第 34 页]\n\n![第 34 页教学插图与实验活动](figures/p34.png)\n\n我们可以借助电路检测器来检测物体的导电性。\n选取身边的20种物体，用电路检测器分别检测它们的导电性，并记录下来。\n1. 先检查电路检测器能否正常工作。\n2. 预测被检测物体能否使小灯泡亮起来。\n3. 用电路检测器的两个检测头接触物体的两端，检测物体的导电性，做好记录，并与预测进行比较。\n4. 将能使小灯泡亮起来的物体放在一边，不能使小灯泡亮起来的放在另一边。仔细观察这些物体，你能发现它们有什么异同吗？\n\n### [第 35 页]\n\n![第 35 页教学插图与实验活动](figures/p35.png)\n\n1. 整理检测记录。在检测的物体中，哪些能使小灯泡亮起来，哪些不能使小灯泡亮起来？我们对物体导电性的预测与实际的检测结果相同吗？我们检测的结果都一样吗？\n2. 我们通常将那些容易导电的物体称为导体，将不容易导电的物体称为绝缘体。在检测的物体中，哪些是导体，哪些是绝缘体？\n3. 下图中这些物品的哪些部分是用导体材料制成的，哪些部分是用绝缘材料制成的？为什么这样选用材料？\n安全提示在潮湿的空气中或较强电流下，人体、自然界中的水和大地等都将成为导体。如果我们触及了家中使用的电路，电流就会通过人体而危及生命。所以，我们要保护好电器的绝缘部分，不能触摸导体部分，还要注意不要把水溅到电器上。"}, {"id": "sci_08_u02_l07", "lesson_idx": 139, "book": "四年级下册", "vol_dir": "08_四年级下册", "unit_no": 2, "unit_title": "第二单元电路", "lesson_no": 7, "title": "电路中的开关", "page": 36, "domain": "physics_em", "domain_cn": "综合科学探究", "sim_file": "sim_g08_s2_u02_l07.html", "code": "g08_s2_u02_l07", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。", "misconception": ""}, "figures": ["p36.webp", "p37.webp", "p38.webp"], "raw_text": "### [第 36 页]\n\n![第 36 页教学插图与实验活动](figures/p36.png)\n\n## 7. 电路中的开关\n\n\n电路中的开关生活中，我们能安全、方便地使用各种电器，是因为有一个重要的元件控制着电流的通和断，这个元件就是开关。\n电路中的开关怎样控制电流的通与断？\n1. 观察小开关。这个开关的制作使用了哪些材料，这些材料有什么作用？把这个小开关连接到电路里，观察开关是怎样控制电流的通与断的。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **国家重大电力装备（特高压直流输电与常温超导研究）**：我国特高压输电技术世界领先，±1100千伏昌吉-古泉特高压工程跨越数千公里输送清洁能源；而在前沿物理实验室中，高温超导磁悬浮列车试验线已突破时速600公里，实现零接触低阻抗飞驰！\n- 🧠 **跨学科大概念（闭合回路与能量转换）**：电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。\n- ⚠️ 很多孩子认为“电线里的电像水管里的水一样从电池正极流到负极，流完电池就空了”。**科学真相**：导线金属内部早已有海量的自由电子；闭合开关瞬间，电场以光速在回路中建立，整个回路中的电子几乎同时开始定向微观漂移，消耗的是电池的化学势能而非‘电子本身’！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g08_s2_u02_l07.html)\n\n\n### [第 37 页]\n\n![第 37 页教学插图与实验活动](figures/p37.png)\n\n2. 观察生活中常见的开关。想一想这些开关是怎样控制电路中电流的通与断的。\n电磁炉电风扇电灯\n3. 做个回形针开关。\n像图中那样，用小木板、回形针和图钉做一个简易小开关。\n● ● 把回形针伸开放在木板上，用笔在伸开的回形针两端各描一个点作为标记。\n● ● 先把一枚图钉固定在木板的一个描点上，再用图钉把回形针大的一端固定在木板的另外一个描点上。\n● ● 把回形针开关连接到电路中，看看它能不能控制小灯泡的亮与不亮。\n电路断开电路接通\n\n### [第 38 页]\n\n![第 38 页教学插图与实验活动](figures/p38.png)\n\n1. 回形针开关是怎样控制电流的通与断的？\n2. 你还能用其他的材料和方法做一个小开关吗？你是怎样制作的，你的小开关有什么特点？\n将红色、绿色玻璃纸分别包在小灯泡外面，并将它们与电池、导线、回形针开关连接起来，做成红绿灯。试着用我们制作的回形针开关控制这组红绿灯。\n如果想在红灯变绿灯、绿灯变红灯的中间再亮起一盏黄灯，应该怎么办？"}, {"id": "sci_08_u02_l08", "lesson_idx": 140, "book": "四年级下册", "vol_dir": "08_四年级下册", "unit_no": 2, "unit_title": "第二单元电路", "lesson_no": 8, "title": "模拟安装照明电路", "page": 39, "domain": "physics_em", "domain_cn": "综合科学探究", "sim_file": "sim_g08_s2_u02_l08.html", "code": "g08_s2_u02_l08", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。", "misconception": ""}, "figures": ["p39.webp", "p40.webp", "p41.webp"], "raw_text": "### [第 39 页]\n\n![第 39 页教学插图与实验活动](figures/p39.png)\n\n## 8. 模拟安装照明电路\n\n\n模拟安装照明电路通过本单元的学习，我们知道了怎样连接一个电路，怎样用开关控制电流的通和断。\n现在你能用学到的知识，模拟安装一个房间的照明电路吗？\n1. 小组合作，设计一个房间的照明电路。\n● ● 在纸上画出房间的平面图，标出书桌、床、窗户的位置。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **国家重大电力装备（特高压直流输电与常温超导研究）**：我国特高压输电技术世界领先，±1100千伏昌吉-古泉特高压工程跨越数千公里输送清洁能源；而在前沿物理实验室中，高温超导磁悬浮列车试验线已突破时速600公里，实现零接触低阻抗飞驰！\n- 🧠 **跨学科大概念（闭合回路与能量转换）**：电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。\n- ⚠️ 很多孩子认为“电线里的电像水管里的水一样从电池正极流到负极，流完电池就空了”。**科学真相**：导线金属内部早已有海量的自由电子；闭合开关瞬间，电场以光速在回路中建立，整个回路中的电子几乎同时开始定向微观漂移，消耗的是电池的化学势能而非‘电子本身’！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g08_s2_u02_l08.html)\n\n\n### [第 40 页]\n\n![第 40 页教学插图与实验活动](figures/p40.png)\n\n● ● 房间需安装两盏电灯（照明灯和阅读灯），并由两个开关分别控制。在房间平面图上标出电灯、开关的位置。\n2. 班级交流，阐明小组设计的合理性，并倾听他人意见，修正和优化小组的设计方案。\n3. 模拟安装照明电路。\n● ● 画出小组设计的电路图：电池（房间电源）、两个小灯泡（两盏电灯）、两个开关各在什么位置？怎样组成一个电路？\n● ● 按照电路图组装电路。\n● ● 检测电路。检查电流能否顺利通过小灯泡、开关能否控制小灯泡的亮与灭、是否有使电源短路的错误连接。\n4. 与其他小组进行分享。\n\n### [第 41 页]\n\n![第 41 页教学插图与实验活动](figures/p41.png)\n\n岩石与土壤岩石与土壤是地球的重要资源，和我们的生活息息相关。你想知道很久以前地球上发生过的事情吗？岩石与土壤能够给我们提供重要的线索。\n岩石是由什么组成的？有什么特点？土壤里面有什么？它与植物的生长有哪些关系？\n让我们在这个单元里探索这些问题吧！"}, {"id": "sci_08_u03_l01", "lesson_idx": 141, "book": "四年级下册", "vol_dir": "08_四年级下册", "unit_no": 3, "unit_title": "第三单元岩石与土壤", "lesson_no": 1, "title": "岩石与土壤的故事", "page": 42, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g08_s2_u03_l01.html", "code": "g08_s2_u03_l01", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。", "misconception": ""}, "figures": ["p42.webp", "p43.webp"], "raw_text": "### [第 42 页]\n\n![第 42 页教学插图与实验活动](figures/p42.png)\n\n## 1. 岩石与土壤的故事\n\n\n岩石与土壤的故事地球的表面被坚硬的岩石包裹着，不仅包括我们看到的陆地，还包括海洋的底部。陆地上的岩石有的被土壤覆盖着，有的直接裸露出来。\n你观察过岩石和土壤吗？\n知道人们为什么一直在对岩石和土壤进行研究吗？\n石灰岩铁矿石\n1. 观察并描述我们采集到的岩石和土壤。水晶土壤\n2. 说说我们可以从哪里找到岩石和土壤，它们都有什么用途。\n3. 了解岩石和土壤背后的故事。\n岩石和土壤是自然界中天然存在的物质，它们的形成有的需要几百万年甚至更长的时间，所以在每一块岩石和每一方土壤上都留下了大自然的痕迹。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿地球科学（深地探测与“奋斗者”号深潜）**：我国“深地一号”油气钻井已穿透地下万米白垩系地层，结合地震波断层成像技术，科学家如同给地球做“超声波CT”，实时洞察地壳构造板块运动与深部地幔热柱对流！\n- 🧠 **跨学科大概念（稳定与变化 / 因果机制）**：地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。\n- ⚠️ 小学生常认为“岩石是永恒不变、坚不可摧的”。**科学真相**：在水、大气、温度变化以及植物根系分泌酸的作用下，岩石在持续发生物理风化与化学侵蚀，并在地质循环中重熔为岩浆或沉积为土壤，地表始终在缓慢而剧烈地重塑。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g08_s2_u03_l01.html)\n\n\n### [第 43 页]\n\n![第 43 页教学插图与实验活动](figures/p43.png)\n\n岩石中动植物的痕迹表明过去有哪些生物存在过。\n岩石的化学成分地球的年龄约可以告诉我们它是45.6亿年，们的形成年代。就是用这种方在喜马拉雅山发现法测定的。了菊石化石，说明几亿年前这里曾经是海洋。\n土壤剖面我们还知道哪些关于岩石和土壤的故事？与同学们分享一下。\n表层土\n4. 整理我们知道的岩石和土壤的知识。\n下层土基岩碎屑关于岩石和土壤：我们知道什么基岩（班级记录表）日期：\n土壤的形成是一个极其漫长的我们知道的岩石：我们知道的土壤：\n过程。例如，要形成12厘米厚的土壤，可能需要几百到数万年的时间。\n1. 你认为岩石和土壤各有什么特点？我们可以从哪里发现它们？调查一下当地\n2. 我们可以从岩石和土壤中知道什么？有什么岩石，土壤\n3. 你知道岩石和土壤各有哪些用途？是什么样的。"}, {"id": "sci_08_u03_l02", "lesson_idx": 142, "book": "四年级下册", "vol_dir": "08_四年级下册", "unit_no": 3, "unit_title": "第三单元岩石与土壤", "lesson_no": 2, "title": "认识几种常见的岩石", "page": 44, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g08_s2_u03_l02.html", "code": "g08_s2_u03_l02", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。", "misconception": ""}, "figures": ["p44.webp", "p45.webp", "p46.webp"], "raw_text": "### [第 44 页]\n\n![第 44 页教学插图与实验活动](figures/p44.png)\n\n## 2. 认识几种常见的岩石\n\n\n认识几种常见的岩石岩石的种类繁多，它们的性质也多种多样。让我们了解一下几种常见的岩石有什么特征。放大镜\n1. 观察下面三种常见的岩石标本。先用手电筒肉眼观察，再用放大镜观察，并描述它们的特征。小刀铜钥匙花岗岩砂岩大理岩\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿地球科学（深地探测与“奋斗者”号深潜）**：我国“深地一号”油气钻井已穿透地下万米白垩系地层，结合地震波断层成像技术，科学家如同给地球做“超声波CT”，实时洞察地壳构造板块运动与深部地幔热柱对流！\n- 🧠 **跨学科大概念（稳定与变化 / 因果机制）**：地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。\n- ⚠️ 小学生常认为“岩石是永恒不变、坚不可摧的”。**科学真相**：在水、大气、温度变化以及植物根系分泌酸的作用下，岩石在持续发生物理风化与化学侵蚀，并在地质循环中重熔为岩浆或沉积为土壤，地表始终在缓慢而剧烈地重塑。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g08_s2_u03_l02.html)\n\n\n### [第 45 页]\n\n![第 45 页教学插图与实验活动](figures/p45.png)\n\n2. 更细致地观察这三种岩石标本。科学词汇科学家在野外观察岩石时还采用了一些更为颜色条纹细致的观察方法，对认识岩石的特征很重要。气味颗粒软硬光滑● ● 仔细观察这三种岩石标本是否有条纹、层粗糙轻重次，是否有斑点、小孔。\n有斑点的岩石有小孔的岩石有条纹的岩石有层次的岩石● ● 用放大镜观察这三种岩石标本，它们是由颗粒组成的吗？颗粒大小一样吗？可以看出是由一种物质还是多种物质组成的吗？\n颗粒小的岩石颗粒中等的岩石颗粒大的岩石● ● 用手分别触摸这三种岩石标本的表面，感觉是粗糙的还是光滑的？软：能用指甲刻画出痕迹。\n● ● 用手电筒照射这三种岩石，看一看它较软：不能用指甲刻画出痕迹，们有没有光泽。但能用铜钥匙刻画出痕迹。\n● ● 分别用指甲、铜钥匙、小刀刻画岩石，结较硬：不能果会有什么不同？说明什么？用铜钥匙刻画出痕迹，但能用小刀刻画出痕迹。\n硬：用铜钥匙、小刀都不能刻画出痕迹。\n用指甲刻画用铜钥匙刻画用小刀刻画\n\n### [第 46 页]\n\n![第 46 页教学插图与实验活动](figures/p46.png)\n\n3. 将你的观察结果记录在下面的表格中。\n岩石观察记录表日期：\n有无层次、组成岩石的颗粒名称颜色软硬光滑光泽小孔、斑特征点、条纹大小颜色种类花岗岩砂岩大理岩\n1. 交流我们的观察结果，花岗岩、砂岩、大理岩各有哪些特征？\n2. 我们如何去观察、描述一种未知的岩石？\n分别用小钢锉在岩石的一角锉出粉末，让粉末散落在白纸（接颜色深的粉末）或黑纸（接颜色浅的粉末）上，观察岩石的内部物质是否一样。"}, {"id": "sci_08_u03_l03", "lesson_idx": 143, "book": "四年级下册", "vol_dir": "08_四年级下册", "unit_no": 3, "unit_title": "第三单元岩石与土壤", "lesson_no": 3, "title": "岩石的组成", "page": 47, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g08_s2_u03_l03.html", "code": "g08_s2_u03_l03", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。", "misconception": ""}, "figures": ["p47.webp", "p48.webp", "p49.webp"], "raw_text": "### [第 47 页]\n\n![第 47 页教学插图与实验活动](figures/p47.png)\n\n## 3. 岩石的组成\n\n\n岩石的组成所有的岩石都是由矿物组成的，有些岩石由多种矿物组成，有些仅由一种矿物组成。研究岩石的一种方法就是寻找岩石中的矿物。矿物是什么样的？有哪些方法可以帮助我们识别矿物呢？科学词汇形状透明\n1. 观察花岗岩的组成。\n先用肉眼观察，再用放大镜观察，并对花岗岩的组成进行描述。\n2. 观察下列三种矿物。花岗岩颜色、光泽、硬度、条纹都是重要的线索哟！\n石英长石云母\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿地球科学（深地探测与“奋斗者”号深潜）**：我国“深地一号”油气钻井已穿透地下万米白垩系地层，结合地震波断层成像技术，科学家如同给地球做“超声波CT”，实时洞察地壳构造板块运动与深部地幔热柱对流！\n- 🧠 **跨学科大概念（稳定与变化 / 因果机制）**：地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。\n- ⚠️ 小学生常认为“岩石是永恒不变、坚不可摧的”。**科学真相**：在水、大气、温度变化以及植物根系分泌酸的作用下，岩石在持续发生物理风化与化学侵蚀，并在地质循环中重熔为岩浆或沉积为土壤，地表始终在缓慢而剧烈地重塑。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g08_s2_u03_l03.html)\n\n\n### [第 48 页]\n\n![第 48 页教学插图与实验活动](figures/p48.png)\n\n1. 矿物的颜色和条痕。\n观察这三种矿物的颜色，然后分别将它们放在白色的无釉瓷板上摩擦，瓷板上留下的痕迹就是矿物的条痕。矿物外表的颜色和条痕的颜色一样吗？\n2. 矿物的透明度和光泽。\n可以通过观察矿物碎片●对透明度的观察。● 的边缘是否能看见其他物体来衡量矿物的透明度，一般观察透过三种矿物碎片的边缘，把矿物分为透明、半透明、是否能看见其他物体。不透明三种。\n金属反光丝绸的反最强！\n光呢？\n●对光泽的观察。●泥土反继续借助其他物体的反光特性，光弱。\n采用比较的方法来观察、描述这三种矿物的光泽。玻璃反光比金属弱，比泥土强。\n矿物观察记录表日期：\n石英长石云母将观察结果记录在左颜色边的表格内。\n条痕透明度此外，硬度、形状也光泽……是观察矿物的重要线索。\n\n### [第 49 页]\n\n![第 49 页教学插图与实验活动](figures/p49.png)\n\n3. 将花岗岩的颗粒分别与这三种矿这透明的很物进行比较，辨别出这些颗粒中像石英。\n哪些是石英，哪些是长石，哪些是云母。\n这黑色发光的很像云母这浅色的是不的碎片。是长石呢？\n4. 更多的矿物。\n硫黄石墨岩盐方铅矿石膏\n1. 对于矿物，我们可以用什么方法去观察？组成花岗岩的三种矿物具有什么特征？\n得到标本后，可先记下标\n2. 对于岩石和矿物，我们有哪些本的名称等相关信息，用软纸新的认识？或毛巾包好带回来。\n如果得到的是不知名的矿\n3. 岩石和矿物有什么相同和不同物和岩石，可以先记录下它们之处？的采集地、采集时间等相关信息，并给它们编上号。\n我们可以根据前面学到的知识，对照岩石和矿物的标本图鉴，识别自己采集的标本，采集岩石和矿物，做好记录。也可以请教老师或专业人士。"}, {"id": "sci_08_u03_l04", "lesson_idx": 144, "book": "四年级下册", "vol_dir": "08_四年级下册", "unit_no": 3, "unit_title": "第三单元岩石与土壤", "lesson_no": 4, "title": "制作岩石和矿物标本", "page": 50, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g08_s2_u03_l04.html", "code": "g08_s2_u03_l04", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。", "misconception": ""}, "figures": ["p50.webp", "p51.webp"], "raw_text": "### [第 50 页]\n\n![第 50 页教学插图与实验活动](figures/p50.png)\n\n## 4. 制作岩石和矿物标本\n\n\n制作岩石和矿物标本搜集岩石和矿物，将它们做成标本保存起来，既能丰富知识、开阔眼界，还能增加生活情趣，是一件非常有意义和有趣味的事情。\n要擦拭干净哟！\n1. 需要准备的材料（见右图）。\n2. 给采集到的岩石和矿物编号。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿地球科学（深地探测与“奋斗者”号深潜）**：我国“深地一号”油气钻井已穿透地下万米白垩系地层，结合地震波断层成像技术，科学家如同给地球做“超声波CT”，实时洞察地壳构造板块运动与深部地幔热柱对流！\n- 🧠 **跨学科大概念（稳定与变化 / 因果机制）**：地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。\n- ⚠️ 小学生常认为“岩石是永恒不变、坚不可摧的”。**科学真相**：在水、大气、温度变化以及植物根系分泌酸的作用下，岩石在持续发生物理风化与化学侵蚀，并在地质循环中重熔为岩浆或沉积为土壤，地表始终在缓慢而剧烈地重塑。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g08_s2_u03_l04.html)\n\n\n### [第 51 页]\n\n![第 51 页教学插图与实验活动](figures/p51.png)\n\n3. 观察每一块已编号的岩石和矿物，对照岩石和矿物的标本图鉴，识别采集到的标本。\n4. 为岩石和矿物添加标签。\n5. 将岩石和矿物按照编号顺序放置在小盒的格内，标签对应放好。\n6. 展示制作完成的标本并交流。\n1. 制作岩石、矿物标本的方法是怎样的？\n采集更多\n2. 通过制作标本，你对研究岩石和矿物又的岩石和矿有哪些新的认识？物，不断充实\n3. 要想制作一盒精美的岩石和矿物标本，你的标本盒。\n你认为该怎样做？"}, {"id": "sci_08_u03_l05", "lesson_idx": 145, "book": "四年级下册", "vol_dir": "08_四年级下册", "unit_no": 3, "unit_title": "第三单元岩石与土壤", "lesson_no": 5, "title": "岩石、沙和黏土", "page": 52, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g08_s2_u03_l05.html", "code": "g08_s2_u03_l05", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。", "misconception": ""}, "figures": ["p52.webp", "p53.webp"], "raw_text": "### [第 52 页]\n\n![第 52 页教学插图与实验活动](figures/p52.png)\n\n## 5. 岩石、沙和黏土\n\n\n岩石、沙和黏土由于太阳、风、水、地震和火山等的作用，自然界中许多大块的岩石可能碎裂，形成较小的颗粒、沙和黏土。我们在哪里能找到岩石、沙和黏土？它们又有什么不同？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿地球科学（深地探测与“奋斗者”号深潜）**：我国“深地一号”油气钻井已穿透地下万米白垩系地层，结合地震波断层成像技术，科学家如同给地球做“超声波CT”，实时洞察地壳构造板块运动与深部地幔热柱对流！\n- 🧠 **跨学科大概念（稳定与变化 / 因果机制）**：地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。\n- ⚠️ 小学生常认为“岩石是永恒不变、坚不可摧的”。**科学真相**：在水、大气、温度变化以及植物根系分泌酸的作用下，岩石在持续发生物理风化与化学侵蚀，并在地质循环中重熔为岩浆或沉积为土壤，地表始终在缓慢而剧烈地重塑。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g08_s2_u03_l05.html)\n\n\n### [第 53 页]\n\n![第 53 页教学插图与实验活动](figures/p53.png)\n\n1. 说一说我们从什么地方可以找到岩石、沙和黏土。在班级记录表上记录下来。\n2. 比较岩石、沙和黏土。\n把岩石、沙和黏土放在白分别闻一闻岩石、沙和黏用手触摸岩石、沙和黏土，纸上，先用肉眼观察，再土，感觉有什么不同感觉有什么不同用放大镜观察对岩石、沙、黏土的认识（班级记录表）日期：\n岩石沙黏土发现试着分别把潮湿的沙和黏用手指分别蘸少量潮湿的地土团成小球，观察经过多沙和黏土，在白纸上涂痕长时间它们能平摊在纸上特征\n1. 经过观察，你知道了岩石、沙和黏土各有什么特征？\n2. 通过观察，你推测大自然中的岩石会如何变化？"}, {"id": "sci_08_u03_l06", "lesson_idx": 146, "book": "四年级下册", "vol_dir": "08_四年级下册", "unit_no": 3, "unit_title": "第三单元岩石与土壤", "lesson_no": 6, "title": "观察土壤", "page": 54, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g08_s2_u03_l06.html", "code": "g08_s2_u03_l06", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。", "misconception": ""}, "figures": ["p54.webp", "p55.webp"], "raw_text": "### [第 54 页]\n\n![第 54 页教学插图与实验活动](figures/p54.png)\n\n## 6. 观察土壤\n\n\n观察土壤土壤对我们人类非常重要，我们吃的许多食物都来自在土壤中生长的植物。土壤里面有什么呢？\n1. 说说我们对土壤组成的猜测。\n2. 采集并观察、描述土壤。\n● ● 在校园或田野里挖一块土壤，用塑料袋装好，带回教室。\n● ● 把土壤倒在一张白纸上，先用肉眼观察土壤里有什么，再借助放大镜观察。\n我看见了小有许多捻不碎的草和小虫。小石子和沙。\n土壤还是有土壤摸起来气味的呢！湿湿的。\n触摸过土壤的手一定要洗干净。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿地球科学（深地探测与“奋斗者”号深潜）**：我国“深地一号”油气钻井已穿透地下万米白垩系地层，结合地震波断层成像技术，科学家如同给地球做“超声波CT”，实时洞察地壳构造板块运动与深部地幔热柱对流！\n- 🧠 **跨学科大概念（稳定与变化 / 因果机制）**：地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。\n- ⚠️ 小学生常认为“岩石是永恒不变、坚不可摧的”。**科学真相**：在水、大气、温度变化以及植物根系分泌酸的作用下，岩石在持续发生物理风化与化学侵蚀，并在地质循环中重熔为岩浆或沉积为土壤，地表始终在缓慢而剧烈地重塑。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g08_s2_u03_l06.html)\n\n\n### [第 55 页]\n\n![第 55 页教学插图与实验活动](figures/p55.png)\n\n● ● 把土壤晾干、捻碎，用牙签把土壤颗粒分开，借助放大镜仔细观察颗粒的大小，并描述。\n根据颗粒大小，可以对土壤的微粒进行分类。最大的土壤颗粒是沙砾（小石子），其次是沙，接着是比沙还小的粉沙，最小的土壤微粒是黏土。沙砾直径大于2毫米，黏土的微粒很小，甚至用肉眼都没有办法看清楚。\n● ● 把水倒进盛有土壤的玻璃杯里，用小棒搅拌后静置，观察整个过程中出现的现象，并记录下来。\n搅拌产生气泡静置后分层\n1. 在水倒入土壤的整个实验土壤观察记录过程中，有什么现象发生？日期：\n这些现象说明了什么？观察方法我的发现\n2. 根据观察和实验，你认为看褐色、有叶、根、虫子、小石子闻土壤是由什么组成的？摸、捻\n3. 你对土壤有哪些新认识？倒入水观察植物生长繁茂的地方，这里的土壤有什么特点？"}, {"id": "sci_08_u03_l07", "lesson_idx": 147, "book": "四年级下册", "vol_dir": "08_四年级下册", "unit_no": 3, "unit_title": "第三单元岩石与土壤", "lesson_no": 7, "title": "比较不同的土壤", "page": 56, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g08_s2_u03_l07.html", "code": "g08_s2_u03_l07", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。", "misconception": ""}, "figures": ["p56.webp", "p57.webp"], "raw_text": "### [第 56 页]\n\n![第 56 页教学插图与实验活动](figures/p56.png)\n\n## 7. 比较不同的土壤\n\n\n比较不同的土壤我们知道了土壤里面有沙砾、沙、黏土、腐殖质、水和空气。那不同的土壤之间有哪些差别呢？\n下面是成分含量不同的三种土壤，分别给它们标注记号。\n1. 号土壤 2号土壤 3号土壤\n1. 先用肉眼观察，再用放大镜观察这三种土壤，比较相同和不同。\n我的观察记录日期：\n1. 号土壤颗粒较大，摸起来比较硬、扎手。\n2. 号土壤颗粒最小，摸起来非常滑腻。\n3. 号土壤颗粒大小不均……\n2. 比较这三种土壤的黏性。\n用手分别团揉潮湿的这三种土壤，看哪一种能够团成小球。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿地球科学（深地探测与“奋斗者”号深潜）**：我国“深地一号”油气钻井已穿透地下万米白垩系地层，结合地震波断层成像技术，科学家如同给地球做“超声波CT”，实时洞察地壳构造板块运动与深部地幔热柱对流！\n- 🧠 **跨学科大概念（稳定与变化 / 因果机制）**：地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。\n- ⚠️ 小学生常认为“岩石是永恒不变、坚不可摧的”。**科学真相**：在水、大气、温度变化以及植物根系分泌酸的作用下，岩石在持续发生物理风化与化学侵蚀，并在地质循环中重熔为岩浆或沉积为土壤，地表始终在缓慢而剧烈地重塑。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g08_s2_u03_l07.html)\n\n\n### [第 57 页]\n\n![第 57 页教学插图与实验活动](figures/p57.png)\n\n3. 比较这三种土壤的渗水性。\n● ● 预测哪种土壤渗出的水最多。\n● ● 将三种土壤分别装入漏斗，到达同一高度。\n● ● 将等量的水分别缓慢地倒入三个漏斗中。\n● ● 观察当水流过三种土壤时发生的现象。\n用空塑料瓶制作漏斗并展开实验我的观察记录日期：1. 交流我们的观察结\n1. 号土壤2号土壤3号土壤果，三种土壤有什么不同？\n观察到的各有什么特点？\n现象黏性 2 . 结合观察实验结渗水性果，说说三种土壤对植物的生长有什么不同的影响。\n查阅资料，举例说说三种土壤分别适合哪些植物生长。\n黏粒黏粒沙粒黏粒沙粒沙粒沙质土壤土黏质土"}, {"id": "sci_08_u03_l08", "lesson_idx": 148, "book": "四年级下册", "vol_dir": "08_四年级下册", "unit_no": 3, "unit_title": "第三单元岩石与土壤", "lesson_no": 8, "title": "岩石 学探究", "sim_file": "sim_g09_s1_u01_l02.html", "code": "g09_s1_u01_l02", "sections": {"focus": "个凸透镜的放大倍数是有限的，怎样才能把物体的图像放得更大呢？", "exploration": "我们把两个凸透镜组合起来，试一试效果如何。\n1. 用一个放大镜观察叶片，有什么发现？", "discussion": "怎样组合凸透镜才能把物体的图像放得更大更清晰？\n用组合凸透镜观察，有什么新发现？如果使用放大倍数更大的放大镜来组合，你认为会有更多的新发现吗？\n资料列文虎克与显微镜生物学家列文虎克于1632年出生在荷兰，因家境贫寒，16. 岁就开始在一家杂货铺当学徒。他一有空，就到隔壁眼镜匠那里学习磨制玻璃片的技术。一天，他终于磨制出一个能将物体的图像放大许多倍的镜片。在他的镜片下，鸡的绒毛变得像树枝一样粗，跳蚤和蚂蚁的腿变得粗壮面强健，他几乎不敢相信自己的眼晴。为了提高放大倍数，列文虎克研制出了更精密的镜片。他把镜片嵌在装置上，把观察的物体放在合适的位置，再用螺旋杆调节观察距离，制成了可以放大近300倍的显微镜。\n教育科学列文虎克设计制作的显微镜", "expansion": "我们制作的组合凸透镜，相当于一个简易的显微镜。如果用3个或更多个凸透镜组合，能把图像放得更大吗？请你试一试。", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p06.webp", "p07.webp", "p08.webp", "p09.webp"], "raw_text": "### [第 6 页]\n\n![第 6 页教学插图与实验活动](figures/p06.png)\n\n## 2. 怎样放得更大\n\n\n怎样放得更大为了更好地看清楚微小物体，我们需要把物体的图像放得更大。\n\n#### 🎯 聚焦个凸透镜的放大倍数是有限的，怎样才能把物体的图像放得更大呢？\n\n#### 🔬 探索我们把两个凸透镜组合起来，试一试效果如何。\n1. 用一个放大镜观察叶片，有什么发现？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g09_s1_u01_l02.html)\n\n\n### [第 7 页]\n\n![第 7 页教学插图与实验活动](figures/p07.png)\n\n再增加一个放大镜，和第一个放第一个大镜平行并重叠放置，然后上下移动放大镜第二个放大镜，我们有什么发现？\n第二个放大镜\n3. 用装置固定住上下叠放的凸透镜，当图像放到最大并且清晰时，测量两个凸透镜之间的距离。\n用组合凸透镜观察叶片、花粉、土壤、文字等，又有什么新发现？\n叶片花粉（百合）\n\n### [第 8 页]\n\n![第 8 页教学插图与实验活动](figures/p08.png)\n\n槐是豆部组织划分别：文总务[科学]1.维的客观规理体系，2法不土壤文字\n\n#### 📝 记录单组合凸透镜下的新发现日期：\n物体组合凸透镜下的新发现花粉土壤文字用组合凸透镜观察河水，有什么发现？\n\n### [第 9 页]\n\n![第 9 页教学插图与实验活动](figures/p09.png)\n\n#### 💬 研讨怎样组合凸透镜才能把物体的图像放得更大更清晰？\n用组合凸透镜观察，有什么新发现？如果使用放大倍数更大的放大镜来组合，你认为会有更多的新发现吗？\n资料列文虎克与显微镜生物学家列文虎克于1632年出生在荷兰，因家境贫寒，16. 岁就开始在一家杂货铺当学徒。他一有空，就到隔壁眼镜匠那里学习磨制玻璃片的技术。一天，他终于磨制出一个能将物体的图像放大许多倍的镜片。在他的镜片下，鸡的绒毛变得像树枝一样粗，跳蚤和蚂蚁的腿变得粗壮面强健，他几乎不敢相信自己的眼晴。为了提高放大倍数，列文虎克研制出了更精密的镜片。他把镜片嵌在装置上，把观察的物体放在合适的位置，再用螺旋杆调节观察距离，制成了可以放大近300倍的显微镜。\n教育科学列文虎克设计制作的显微镜\n\n#### 🚀 拓展我们制作的组合凸透镜，相当于一个简易的显微镜。如果用3个或更多个凸透镜组合，能把图像放得更大吗？请你试一试。"}, {"id": "sci_09_u01_l03", "lesson_idx": 151, "book": "五年级上册", "vol_dir": "09_五年级上册", "unit_no": 1, "unit_title": "第一单元微小世界", "lesson_no": 3, "title": "用简易显微镜观察", "page": 10, "domain": "physics_optics", "domain_cn": "综合科学探究", "sim_file": "sim_g09_s1_u01_l03.html", "code": "g09_s1_u01_l03", "sections": {"focus": "利用手持式简易显微镜观察，会有哪些新发现？\n教育科学出版站", "exploration": "手柄观察手持式简易显微镜的结构，只有学会正调焦环学习它的使用方法。\n确使用工具，才资料能更好地探索未显微镜中靠近眼晴的透镜叫“目知世界。\n物镜镜”，靠近物体的透镜叫“物镜”。\nLED光源手持式简易显微镜", "discussion": "用手持式简易显微镜观察物体，有哪些新发现？\n与放大镜相比，在手持式简易显微镜下观察物体，观察视野有什么变化？", "expansion": "利用手持式简易显微镜，继续观察周围的物体，发现更多的信息。例如，能否比较出头发、蛛丝和棉丝的不同结构？\n头发（100倍）蛛丝（100倍）棉丝（100倍）", "frontier": "", "big_concept": "光在同种均匀介质中沿直线传播，在不同介质界面遵循反射定律（∠i = ∠r）与折射定律（Snell定律），是物质微观能级跃迁释放的电磁波。", "misconception": ""}, "figures": ["p10.webp", "p11.webp", "p12.webp", "p13.webp"], "raw_text": "### [第 10 页]\n\n![第 10 页教学插图与实验活动](figures/p10.png)\n\n## 3. 用简易显微镜观察\n\n\n用简易显微镜观察为了研究物体更细微的结构，人们使用显微镜进行观察。我们用手持式简易显微镜来试一试蚂蚁\n\n#### 🎯 聚焦利用手持式简易显微镜观察，会有哪些新发现？\n教育科学出版站\n\n#### 🔬 探索手柄观察手持式简易显微镜的结构，只有学会正调焦环学习它的使用方法。\n确使用工具，才资料能更好地探索未显微镜中靠近眼晴的透镜叫“目知世界。\n物镜镜”，靠近物体的透镜叫“物镜”。\nLED光源手持式简易显微镜\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **尖端光电科技（空间激光通信与超精密光刻机）**：我国“墨子号”量子科学实验卫星实现了千公里级星地量子纠缠分发与保密通信；而在超精密芯片制造中，极紫外光（EUV，波长13.5纳米）通过超光滑多层反射镜阵列精确聚焦刻蚀纳米级晶体管线路！\n- 🧠 **跨学科大概念（波粒二象性与波动几何学）**：光在同种均匀介质中沿直线传播，在不同介质界面遵循反射定律（∠i = ∠r）与折射定律（Snell定律），是物质微观能级跃迁释放的电磁波。\n- ⚠️ 常见认知迷思：“人在镜子里看到的像是一个真实存在的发光物体”。**科学真相**：平面镜成像属于虚像，是由镜面反射的漫反射发散光线被人眼反向延长线相交在大脑中汇聚而成的视觉暂留感知，镜子后方并不存在实际光线会聚点！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g09_s1_u01_l03.html)\n\n\n### [第 11 页]\n\n![第 11 页教学插图与实验活动](figures/p11.png)\n\n手持式简易显微镜使用步骤打开电源。\n把物镜对准物体。\n调焦。\n从目镜观察并记录。\n叶片（100倍）用不同工具对比观察。\n花粉（百合，100倍）用肉眼、放大镜和手持式简易显微镜对比观察一些物体，把我们的发现用图画和文字记录下来。\n昆虫足的观察结果肉眼观察日期：\n用放大镜观察用手持式简易显微镜观察X月日蝴蝶翅（100倍）能大致看到能将肉眼看到整体形状的图像放得更图像非常大且非常清晰。\n大、更清晰昆虫足上很小的刚毛都看得特别清晰土壤（100倍）\n\n### [第 12 页]\n\n![第 12 页教学插图与实验活动](figures/p12.png)\n\n#### 📝 记录单的观察结果日期：\n肉眼观察用放大镜观察用手持式简易显微镜观察用手持式简易显微镜观察更多物体。\n餐巾纸（100倍）霉菌（100倍）蚊子翅（100倍）砂粒（100倍）文字（100倍）河水（100倍）\n\n### [第 13 页]\n\n![第 13 页教学插图与实验活动](figures/p13.png)\n\n#### 📝 记录单手持式简易显微镜下的观察结果日期：\n名称名称\n\n#### 💬 研讨用手持式简易显微镜观察物体，有哪些新发现？\n与放大镜相比，在手持式简易显微镜下观察物体，观察视野有什么变化？\n\n#### 🚀 拓展利用手持式简易显微镜，继续观察周围的物体，发现更多的信息。例如，能否比较出头发、蛛丝和棉丝的不同结构？\n头发（100倍）蛛丝（100倍）棉丝（100倍）"}, {"id": "sci_09_u01_l04", "lesson_idx": 152, "book": "五年级上册", "vol_dir": "09_五年级上册", "unit_no": 1, "unit_title": "第一单元微小世界", "lesson_no": 4, "title": "用光学显微镜观察", "page": 14, "domain": "physics_optics", "domain_cn": "综合科学探究", "sim_file": "sim_g09_s1_u01_l04.html", "code": "g09_s1_u01_l04", "sections": {"focus": "丝状绿藻在光学显微镜下观察，我们会有哪些新的发现呢？", "exploration": "光学显微镜是一种精密的仪器，有规范的操作要求，让我们先来学习如何正确使用光学显微镜。\n目镜①安放调节旋钮物镜②对光载物台反光镜③装片科子日海光学显微镜的使用方法和步骤ES在桌面上向着光安放显微镜。\n②将物镜转到镜筒下，调节反光镜，从目镜中能看见亮的光圈。\n③把玻片标本安放在载物台上。\n5. 观察、记录④慢慢转动调节旋钮，直到能看清楚图像。\n③边观察边记录。", "discussion": "比较光学显微镜下的图像与手持式简易显微镜下的图像，两者有什么不同？\n我们使用光学显微镜观察了蛛丝根据蛛丝的结构特点，推测它有什么功能。\n教育科子出", "expansion": "素描在科学发展中的作用在中外科学发展的早期，素描是生物学家、地质学家的主要记录方法。\n不同于美术素描反映作者的情感喜好，科学素描强调对客观事物本质属性的反映。明代医学家李时珍（1518一1593）的《本草纲目》中就有1100多幅中草药素描图。", "frontier": "", "big_concept": "光在同种均匀介质中沿直线传播，在不同介质界面遵循反射定律（∠i = ∠r）与折射定律（Snell定律），是物质微观能级跃迁释放的电磁波。", "misconception": ""}, "figures": ["p14.webp", "p15.webp", "p16.webp", "p17.webp"], "raw_text": "### [第 14 页]\n\n![第 14 页教学插图与实验活动](figures/p14.png)\n\n## 4. 用光学显微镜观察\n\n\n用光学显微镜观察硅藻我们已经用放大镜和简易显微镜观察了一些物体，发现了不少平常看不见的现象科学研究无止境，研究人员使用放大倍数更大的光学显微镜可以发现更多信息\n\n#### 🎯 聚焦丝状绿藻在光学显微镜下观察，我们会有哪些新的发现呢？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **尖端光电科技（空间激光通信与超精密光刻机）**：我国“墨子号”量子科学实验卫星实现了千公里级星地量子纠缠分发与保密通信；而在超精密芯片制造中，极紫外光（EUV，波长13.5纳米）通过超光滑多层反射镜阵列精确聚焦刻蚀纳米级晶体管线路！\n- 🧠 **跨学科大概念（波粒二象性与波动几何学）**：光在同种均匀介质中沿直线传播，在不同介质界面遵循反射定律（∠i = ∠r）与折射定律（Snell定律），是物质微观能级跃迁释放的电磁波。\n- ⚠️ 常见认知迷思：“人在镜子里看到的像是一个真实存在的发光物体”。**科学真相**：平面镜成像属于虚像，是由镜面反射的漫反射发散光线被人眼反向延长线相交在大脑中汇聚而成的视觉暂留感知，镜子后方并不存在实际光线会聚点！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g09_s1_u01_l04.html)\n\n\n### [第 15 页]\n\n![第 15 页教学插图与实验活动](figures/p15.png)\n\n#### 🔬 探索光学显微镜是一种精密的仪器，有规范的操作要求，让我们先来学习如何正确使用光学显微镜。\n目镜①安放调节旋钮物镜②对光载物台反光镜③装片科子日海光学显微镜的使用方法和步骤ES在桌面上向着光安放显微镜。\n②将物镜转到镜筒下，调节反光镜，从目镜中能看见亮的光圈。\n③把玻片标本安放在载物台上。\n5. 观察、记录④慢慢转动调节旋钮，直到能看清楚图像。\n③边观察边记录。\n\n### [第 16 页]\n\n![第 16 页教学插图与实验活动](figures/p16.png)\n\n用光学显微镜观察微小的物体，用图画和文字记录自已的发现。\n叶片（400倍）花粉（百合，400倍）蝴蝶翅（400倍）蚊子翅（400倍）蛛丝（400倍）承头发（400倍）棉丝（400倍）霉菌（400倍）\n\n### [第 17 页]\n\n![第 17 页教学插图与实验活动](figures/p17.png)\n\n提示要将放大\n\n#### 📝 记录单倍数记录下来。\n光学显微镜下的观察发现日期：\n名称名称放大倍数放大倍数\n\n#### 💬 研讨比较光学显微镜下的图像与手持式简易显微镜下的图像，两者有什么不同？\n我们使用光学显微镜观察了蛛丝根据蛛丝的结构特点，推测它有什么功能。\n教育科子出\n\n#### 🚀 拓展素描在科学发展中的作用在中外科学发展的早期，素描是生物学家、地质学家的主要记录方法。\n不同于美术素描反映作者的情感喜好，科学素描强调对客观事物本质属性的反映。明代医学家李时珍（1518一1593）的《本草纲目》中就有1100多幅中草药素描图。"}, {"id": "sci_09_u01_l05", "lesson_idx": 153, "book": "五年级上册", "vol_dir": "09_五年级上册", "unit_no": 1, "unit_title": "第一单元微小世界", "lesson_no": 5, "title": "观察细胞", "page": 18, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g09_s1_u01_l05.html", "code": "g09_s1_u01_l05", "sections": {"focus": "显微镜下的自从罗伯特·胡克发现了细胞之后，其他科学家通过软木薄片不断观察，又发现了许多生物细胞。所有的细胞都长得一样吗？它们有什么特点？\n教育科学中服社点是什么？", "exploration": "观察洋葱表皮细胞，用图画记录它的特点。\n细胞的英文名叫“cell”，意为小隔间、小房间，还真是很形象的名字啊！\n光学显微镜下的洋葱表皮细胞", "discussion": "动物细胞和植物细胞，有什么相同之处？\n通过显微镜观察，生物与非生物在微观结构上有什么区别？", "expansion": "自然界中大多数生物体都是由多细胞构成的，但也有一些生物只有一个细胞，被称为单细胞生物。比如草履虫、变形虫、喇叭虫、眼虫、太阳虫等，都是单细胞生物。\n木子出变形虫眼虫", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p18.webp", "p19.webp", "p20.webp", "p21.webp"], "raw_text": "### [第 18 页]\n\n![第 18 页教学插图与实验活动](figures/p18.png)\n\n## 5. 观察细胞\n\n\n观察细胞胡克设计、1665. 年，英国科学家罗伯特·胡克有一个非常了不起的发现，他用自制的显微镜观察一块软木薄片的结构，发现它们看上去像一间间长方形的小房间，就把它们命名为“细胞”\n\n#### 🎯 聚焦显微镜下的自从罗伯特·胡克发现了细胞之后，其他科学家通过软木薄片不断观察，又发现了许多生物细胞。所有的细胞都长得一样吗？它们有什么特点？\n教育科学中服社点是什么？\n\n#### 🔬 探索观察洋葱表皮细胞，用图画记录它的特点。\n细胞的英文名叫“cell”，意为小隔间、小房间，还真是很形象的名字啊！\n光学显微镜下的洋葱表皮细胞\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g09_s1_u01_l05.html)\n\n\n### [第 19 页]\n\n![第 19 页教学插图与实验活动](figures/p19.png)\n\n资料光学显微镜下的洋葱表皮细胞细胞是生物体基本的结构和功能单位。\n日期：____月____日放大倍数：400倍观察更多的生物细胞，用图画描述它们的形态。\n\n#### 📝 记录单光学显微镜下的细胞观察结果日期：\n名称名称放大倍数放大倍数\n\n### [第 20 页]\n\n![第 20 页教学插图与实验活动](figures/p20.png)\n\n植物根尖细胞人体神经细胞植物细胞中的叶绿体细胞与桃子在结构上有教京科些相似。\n人的口腔上皮细胞桃的切面资料在罗伯特·胡克首次发现细胞后，许多科学家在显微镜下观察了植物的茎、芽和果实，以及血液和低等动物等，发现它们都具有细胞结构。\n\n### [第 21 页]\n\n![第 21 页教学插图与实验活动](figures/p21.png)\n\n观察非生物。\n它们有没：\n有细胞结构？\n显微镜下的食盐晶体（400倍）显微镜下的土壤颗粒（400倍）\n\n#### 💬 研讨动物细胞和植物细胞，有什么相同之处？\n通过显微镜观察，生物与非生物在微观结构上有什么区别？\n\n#### 🚀 拓展自然界中大多数生物体都是由多细胞构成的，但也有一些生物只有一个细胞，被称为单细胞生物。比如草履虫、变形虫、喇叭虫、眼虫、太阳虫等，都是单细胞生物。\n木子出变形虫眼虫"}, {"id": "sci_09_u01_l06", "lesson_idx": 154, "book": "五年级上册", "vol_dir": "09_五年级上册", "unit_no": 1, "unit_title": "第一单元微小世界", "lesson_no": 6, "title": "观察水中的微小生物", "page": 22, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g09_s1_u01_l06.html", "code": "g09_s1_u01_l06", "sections": {"focus": "0. 安全提醒野外考察要在成人陪同要观察水中是否有微小的生物，我们可以采用什么方法？\n下进行。\n教育科", "exploration": "让我们在光学显微镜下观察水中有没有微小的生物。\n1. 用滴管吸取河水或鱼缸里的水，滴一滴在载玻片上，然后盖上盖玻片，放在显微镜下观察。", "discussion": "我们观察到的水中微小物体都是生物吗？我们是根据什么作出判断的？\n看上去非常干净的河水，能直接饮用吗？说一说理由。\n我们已经知道水中有很多微生物，空气中和土壤中有微生物吗？说一说理由。", "expansion": "为了观察更小的物体，人们又研制出电子显微镜等更先进的观察仪器。电子显微镜可以将物体的图像放大几百万倍。显微镜的发明，把人类带人了一个崭新的微观世界。\n电子显微镜下的草莓花粉电子显微镜下的曲霉菌", "frontier": "", "big_concept": "生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。", "misconception": ""}, "figures": ["p22.webp", "p23.webp", "p24.webp", "p25.webp"], "raw_text": "### [第 22 页]\n\n![第 22 页教学插图与实验活动](figures/p22.png)\n\n## 6. 观察水中的微小生物\n\n\n观察水中的微小生物科学小组到野外考察，从小河里采集了河水。有人说，河水很清澈，可以喝；有人说，里面有微小生物，不能喝。\n\n#### 🎯 聚焦\n\n0. 安全提醒野外考察要在成人陪同要观察水中是否有微小的生物，我们可以采用什么方法？\n下进行。\n教育科\n\n#### 🔬 探索让我们在光学显微镜下观察水中有没有微小的生物。\n1. 用滴管吸取河水或鱼缸里的水，滴一滴在载玻片上，然后盖上盖玻片，放在显微镜下观察。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿古生物学与生态基因库（国家基因库与恐龙羽毛演化）**：我国热河生物群带羽毛恐龙（如中华龙鸟）化石的发现，无可辩驳地确立了“现代鸟类是由兽脚类恐龙演化而来”的里程碑定论；高通量基因测序技术更重构了全球物种生命树与食物网脆弱度阈值。\n- 🧠 **跨学科大概念（尺度与比例 / 生态位）**：生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。\n- ⚠️ 很多同学误以为“凶猛的肉食动物消灭弱小食草动物对大自然有害”。**科学真相**：顶级捕食者能控制食草动物种群数量以防止过度啃食植被草原（营养级联效应），捕食体弱病体反而促进了种群基因库的健康优化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g09_s1_u01_l06.html)\n\n\n### [第 23 页]\n\n![第 23 页教学插图与实验活动](figures/p23.png)\n\n烧杯吸水纸滴管镊子滴一滴清水载玻片盖玻片（下面有垫纸）资料玻片标本是细微的生物体或从生物体上切取微小的薄片，经过一定处理封存在盖玻片与载玻片之间制成的标本。\n盖上盖玻片把我们观察到的微小生物画下来，并查阅资料，了解它们的种类以及它们的生活和繁殖方式。\n\n#### 📝 记录单吸去多余水分水中的微小生物观察提示如果显微镜下的微小生物运动迅速，不便于观察，我们可以名称名称先在载玻片上放少量放大倍数放大倍数脱脂棉，再在上面滴一滴水，盖上盖玻片。\n\n### [第 24 页]\n\n![第 24 页教学插图与实验活动](figures/p24.png)\n\n喇叭虫衣藻草履虫轮虫钟形虫\n\n### [第 25 页]\n\n![第 25 页教学插图与实验活动](figures/p25.png)\n\n#### 💬 研讨我们观察到的水中微小物体都是生物吗？我们是根据什么作出判断的？\n看上去非常干净的河水，能直接饮用吗？说一说理由。\n我们已经知道水中有很多微生物，空气中和土壤中有微生物吗？说一说理由。\n\n#### 🚀 拓展为了观察更小的物体，人们又研制出电子显微镜等更先进的观察仪器。电子显微镜可以将物体的图像放大几百万倍。显微镜的发明，把人类带人了一个崭新的微观世界。\n电子显微镜下的草莓花粉电子显微镜下的曲霉菌"}, {"id": "sci_09_u01_l07", "lesson_idx": 155, "book": "五年级上册", "vol_dir": "09_五年级上册", "unit_no": 1, "unit_title": "第一单元微小世界", "lesson_no": 7, "title": "微生物与人类", "page": 26, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g09_s1_u01_l07.html", "code": "g09_s1_u01_l07", "sections": {"focus": "微生物与我们人类有怎样的联系？\n冠状病毒", "exploration": "微生物与食品。\n交流讨论：人们是如何利用微生物制造食品的，又是如何防止微生物对食物的破坏作用的？\n腐乳面包酒酿泡菜酸奶有些微生物如酵母菌能帮助我们生产食物，但有些微生物如靠菌会引起霉变。\n霉变的食物对身体有害，保持干燥、低温可发念的橘教育学出散社以防霉。\n查阅资料，了解微生物在环境保护上的应用。\n人们利用一些微生物处理厨余垃圾、枯枝落叶，制造堆肥，净化污水。\n堆肥", "discussion": "有些微生物会引发传染病，我们应该如何预防传染病？\n分餐吃饭、使用公筷有哪些好处？\n你知道哪些消毒杀菌方法？哪种方法适合餐具消毒？说一说理由。", "expansion": "育粮据本单元的学习，思考事物之间的相互作用，制作一张微生物与动植物及人类的关系图。\n曲霉苗", "frontier": "", "big_concept": "生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。", "misconception": ""}, "figures": ["p26.webp", "p27.webp", "p28.webp", "p29.webp", "p30.webp", "p31.webp", "p32.webp", "p33.webp"], "raw_text": "### [第 26 页]\n\n![第 26 页教学插图与实验活动](figures/p26.png)\n\n## 7. 微生物与人类\n\n\n微生物与人类我们的周国活跃着许许多多的微生物，它们与我们的生活密切相关。\n\n#### 🎯 聚焦微生物与我们人类有怎样的联系？\n冠状病毒\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿古生物学与生态基因库（国家基因库与恐龙羽毛演化）**：我国热河生物群带羽毛恐龙（如中华龙鸟）化石的发现，无可辩驳地确立了“现代鸟类是由兽脚类恐龙演化而来”的里程碑定论；高通量基因测序技术更重构了全球物种生命树与食物网脆弱度阈值。\n- 🧠 **跨学科大概念（尺度与比例 / 生态位）**：生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。\n- ⚠️ 很多同学误以为“凶猛的肉食动物消灭弱小食草动物对大自然有害”。**科学真相**：顶级捕食者能控制食草动物种群数量以防止过度啃食植被草原（营养级联效应），捕食体弱病体反而促进了种群基因库的健康优化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g09_s1_u01_l07.html)\n\n\n### [第 27 页]\n\n![第 27 页教学插图与实验活动](figures/p27.png)\n\n#### 🔬 探索微生物与食品。\n交流讨论：人们是如何利用微生物制造食品的，又是如何防止微生物对食物的破坏作用的？\n腐乳面包酒酿泡菜酸奶有些微生物如酵母菌能帮助我们生产食物，但有些微生物如靠菌会引起霉变。\n霉变的食物对身体有害，保持干燥、低温可发念的橘教育学出散社以防霉。\n查阅资料，了解微生物在环境保护上的应用。\n人们利用一些微生物处理厨余垃圾、枯枝落叶，制造堆肥，净化污水。\n堆肥\n\n### [第 28 页]\n\n![第 28 页教学插图与实验活动](figures/p28.png)\n\n阅读资料，思考微生物与医学的关系。\n微生物与人类健康过去，伤寒、鼠疫、霍乱等传染病四处肆虐，人类对此束手无策。\n随着显微镜的发明和不断改进，科学家发现这些疾病的元凶原来是细菌和病毒，并研制出许多对付细菌、病毒的药物，使许多传染病得到逼制。\n病毒是比细菌更小的微生物，沙门氏菌绝大多数要在电子显微镜下才能看到。病毒没有细胞结构，不能独立生存，必须寄生在其他生物的细胞内，一旦离开活细胞就很容易死亡。\n伤寒杆菌0. 安全提醒在医院传染病区，有害生物制品的生产、储运、使用等地方常见到“当心感染”的标志，要尽量远离或注意防护。\n出人类利用某种特殊的微生物及其代谢产物制成各种疫苗，对预防、控制传染病的发生和流行发挥了巨大的注射疫苗作用。\n\n### [第 29 页]\n\n![第 29 页教学插图与实验活动](figures/p29.png)\n\n班级记录单微生物和人类的关系日期：\n微生物的利用微生物的防治\n\n#### 💬 研讨有些微生物会引发传染病，我们应该如何预防传染病？\n分餐吃饭、使用公筷有哪些好处？\n你知道哪些消毒杀菌方法？哪种方法适合餐具消毒？说一说理由。\n\n#### 🚀 拓展育粮据本单元的学习，思考事物之间的相互作用，制作一张微生物与动植物及人类的关系图。\n曲霉苗\n\n### [第 30 页]\n\n![第 30 页教学插图与实验活动](figures/p30.png)\n\n#### 📋 单元小结工具的发展与对微小世界的认识眼睛放大镜光学显微镜电子显微镜一般物体微小物体细胞细胞的精细结构和病毒随着观察工具的不断发展，人类观察到了仅凭肉眼看不到的物体和结构，对微观世界的了解越来越深人。显微镜的发明，使人类在生命科学、医学、农业、环境科学、材料科学等领域都取得了重大的成果，推进了社会文明的进程。\n教有术子出我的收获评价内容评价等级怎样改进呢？\n我认识到观察工具的重要作用我能正确使用显微镜进行观察我能观察到水中的微小生物并记录我对微小世界的事物感兴趣我能运用本单元所学的知识解决日常生活中的问题\n\n### [第 31 页]\n\n![第 31 页教学插图与实验活动](figures/p31.png)\n\n#### 📖 科学阅读病毒、细菌与传染病的预防病毒、细菌个体非常小，具有“隐身超能力”，需要用显微镜来观察。病毒没有细胞结构，需要寄生在活细胞内。细菌有完整的细胞结构，空气、水、土壤和生物体内都能找到细菌。\n传染病是由病毒、细菌、真菌、寄生虫等引起的，能在人与人之间或人与动物之间传播的疾病。要控制传染病的传播，一是控制传染源，二是切断传播途径，三是保护易感染者。日常生活中，为预防传染病，我们要增强卫生意识，勤洗手，常锻炼；做到室人工减毒内常通风，多消毒；传染病发生时，科学戴口罩，少聚集。\n古今中外，传染病都曾给人类带来巨大的灾难，疫苗的发明是一个里程碑式的突破。接种疫苗后，人体接触到没有伤害能力的免疫制剂会激活免疫系统，当这种病原体再次入侵人疫苗体时，拥有“记忆能力”的免疫系统则会迅速识别并清除病原体。如研发、接种狂犬疫苗就成为预防和控制狂犬病毒最有效的干预措施注射疫苗免疫激活免疫系统\n\n### [第 32 页]\n\n![第 32 页教学插图与实验活动](figures/p32.png)\n\n天花病毒天花是由天花病毒感染人引起的一种烈性传染病，传染性强，被感染的患者在痊愈后脸上会留有麻子，“天花”由此得名。\n感染天花后，无特效药可治，染病后死亡率高。在人类历史上，天花曾经夺去了无数人的生命，给人类带来巨大的灾难。人类一直在想办法预防天花的感染。中国历史上的名医孙思邈，用取自天花患者口疮中的脓液，敷在皮肤上来预防天花。到明代以后，这种人痘接种法盛行起来。1796年，英国乡村医生爱德华·詹纳发明了牛痘接种法，它危险性小、效果好，可以很好地预防天花病毒的感染。从此，天花逐渐被人类控制。\n1967. 年，人类开始进行最后一次大规模消灭天花的活动。到1980年5月，世界卫生组织宣布人类成功消灭天花。天花成为最早被彻底消灭的人类传染病，也是迄今为止唯一被人类消灭的传染病。\n现今，天花病毒只在美国和俄罗斯的实验室中保留了样本，以供科学研究之用。\n天花病毒\n\n### [第 33 页]\n\n![第 33 页教学插图与实验活动](figures/p33.png)\n\n第二单元工具与技术在不同的生活和工作场景中，会用到各种各样的工具：有的很简单，有的很复杂；有的应用广泛，有的应用于有限的领域；有的很古老，有的才发明不久。\n这些工具各应用了什么技术？工具和技术有什么联系？工具和技术的发展对人类产生了哪些重要的影响？"}, {"id": "sci_09_u02_l01", "lesson_idx": 156, "book": "五年级上册", "vol_dir": "09_五年级上册", "unit_no": 2, "unit_title": "第二单元工具与技术", "lesson_no": 1, "title": "各种各样的工具", "page": 34, "domain": "general_science", "domain_cn": "综合科学探究", "sim_file": "sim_g09_s1_u02_l01.html", "code": "g09_s1_u02_l01", "sections": {"focus": "这么多工具都有什么用处？不同的工具有什么不同的作用？", "exploration": "观察、比较古代和现代的一些常用工具，说一说它们的发展变化。\n毛笔钢笔签字笔和笔芯", "discussion": "举例说明从古至今的工具有了怎样的发展，不同的运输工具适用于哪些不同的场景？\n运送物体时，背篓、扁担、手推车各有什么优缺点？\n独轮车由哪些部分组成？每个部分各有什么作用？", "expansion": "独轮车是手推车的一种，常见的手推车还有超市购物车、婴儿车、折叠手推车、轮椅等。观察下面几种手推车，比较它们有什么相同和不同，以及这些不同设计的用意。\n清科大社超市购物车折叠手推车轮椅", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p34.webp", "p35.webp", "p36.webp", "p37.webp"], "raw_text": "### [第 34 页]\n\n![第 34 页教学插图与实验活动](figures/p34.png)\n\n## 1. 各种各样的工具\n\n\n各种各样的工具从古至今，人们的生活离不开工具各种工具的使用让生活变得更方便。\n\n#### 🎯 聚焦这么多工具都有什么用处？不同的工具有什么不同的作用？\n\n#### 🔬 探索观察、比较古代和现代的一些常用工具，说一说它们的发展变化。\n毛笔钢笔签字笔和笔芯\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g09_s1_u02_l01.html)\n\n\n### [第 35 页]\n\n![第 35 页教学插图与实验活动](figures/p35.png)\n\n背篓扁担独轮车厢式货车\n1. 用下面的工具将多本书从教室前面运送到教室后面，体验不同运输工具的使用效果。\n提示医输重物助，放有种不要运超过自已承受范围的重物。\n背篓扁担四轮平板手推车\n\n### [第 36 页]\n\n![第 36 页教学插图与实验活动](figures/p36.png)\n\n可根据自\n\n#### 📝 记录单己的关注点增加评价点。\n体验不同的运输工具日期：\n工具材料制造成本使用效果适用场景背篓扁担四轮平板手推车\n3. 独轮车是一种从古至今都在使用的运输工具。仔细观察独轮车的构造，说一说各部分的作用。\n子发扶手车轮车身支架\n\n### [第 37 页]\n\n![第 37 页教学插图与实验活动](figures/p37.png)\n\n#### 💬 研讨举例说明从古至今的工具有了怎样的发展，不同的运输工具适用于哪些不同的场景？\n运送物体时，背篓、扁担、手推车各有什么优缺点？\n独轮车由哪些部分组成？每个部分各有什么作用？\n\n#### 🚀 拓展独轮车是手推车的一种，常见的手推车还有超市购物车、婴儿车、折叠手推车、轮椅等。观察下面几种手推车，比较它们有什么相同和不同，以及这些不同设计的用意。\n清科大社超市购物车折叠手推车轮椅"}, {"id": "sci_09_u02_l02", "lesson_idx": 157, "book": "五年级上册", "vol_dir": "09_五年级上册", "unit_no": 2, "unit_title": "第二单元工具与技术", "lesson_no": 2, "title": "独轮车省力的秘密", "page": 38, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g09_s1_u02_l02.html", "code": "g09_s1_u02_l02", "sections": {"focus": "独轮车可以帮助我们更省力地搬运重物，是因为独轮车运用了杠杆技术。\n我们使用过杠杆类工具吗？杠杆有什么作用？", "exploration": "认识杠杆。\n大石头小石头在一根棍子下面放一个支撑物，就能用它撬起重物了。人们把这样的工具叫撬杠。撬杠是一种杠杆类工具。\n阻力点支点用力点资料杠杆上有三个重要的位置：\n·支点：支撑着杠杆，是杠杆能围绕着转动的固定点。\n·用力点：在杠杆上用力使杠杆转动的位置，通常是扶手位置。\n·阻力点：杠杆中阻碍杠杆转动的力的位置。\n寻找独轮车里的杠杆。\n做模拟独轮车搬运重物的实验，体验杠杆的作用并记录。\n直尺、石块、橡皮分别模拟了什么？\n宏版直尺石块橡皮用直尺抬起石块，保持橡皮和石块的位置不变，变换手指用力的位置，感受用力大小的不同并记录。", "discussion": "独轮车省力的秘密是什么？\n生活中的杠杆类工具还有哪些作用？", "expansion": "我们的身体也有很多地方运用了杠杆原理。比如人的手臂绕肘关节运肽二头肌动，可以看作由手臂肌肉和骨骼组成的杠杆在转动。肘关节是支点，二动力头肌提供动力，重物对手施加阻力。\n阻力你还能举出更多的例子吗？\n射关节（支点）", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p38.webp", "p39.webp", "p40.webp", "p41.webp"], "raw_text": "### [第 38 页]\n\n![第 38 页教学插图与实验活动](figures/p38.png)\n\n## 2. 独轮车省力的秘密\n\n\n独轮车省力的秘密过去运输工具不发达，人们常使用独轮车搬运重物不过，直到今天，我们仍能在工地、矿场，农田等场地请见到独轮车的身影\n\n#### 🎯 聚焦独轮车可以帮助我们更省力地搬运重物，是因为独轮车运用了杠杆技术。\n我们使用过杠杆类工具吗？杠杆有什么作用？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g09_s1_u02_l02.html)\n\n\n### [第 39 页]\n\n![第 39 页教学插图与实验活动](figures/p39.png)\n\n#### 🔬 探索认识杠杆。\n大石头小石头在一根棍子下面放一个支撑物，就能用它撬起重物了。人们把这样的工具叫撬杠。撬杠是一种杠杆类工具。\n阻力点支点用力点资料杠杆上有三个重要的位置：\n·支点：支撑着杠杆，是杠杆能围绕着转动的固定点。\n·用力点：在杠杆上用力使杠杆转动的位置，通常是扶手位置。\n·阻力点：杠杆中阻碍杠杆转动的力的位置。\n寻找独轮车里的杠杆。\n做模拟独轮车搬运重物的实验，体验杠杆的作用并记录。\n直尺、石块、橡皮分别模拟了什么？\n宏版直尺石块橡皮用直尺抬起石块，保持橡皮和石块的位置不变，变换手指用力的位置，感受用力大小的不同并记录。\n\n### [第 40 页]\n\n![第 40 页教学插图与实验活动](figures/p40.png)\n\n#### 📝 记录单独轮车搬运重物模拟实验（一）日期：\n用力的位置感受到的用力大小保持石块和手指用力的位置不变，调整橡皮的位置，感受用力大小发生的变化并记录。\n\n#### 📝 记录单科学宏独轮车搬运重物模拟实验（二）日期：\n橡皮的位置感受到的用力大小\n\n### [第 41 页]\n\n![第 41 页教学插图与实验活动](figures/p41.png)\n\n寻找生活中的杠杆类工具。\n说一说我们都使用过哪些杠杆类工具，这些工具使用起来有什么好处。\n资料\n\n#### 📝 记录单杠杆类工具种类丰富，结构多样。\n生活中的杠杆类工具用力点、支点和阻力点位置不同，功能也不同。\n日期：\n工具名称使用起来的好处\n\n#### 💬 研讨独轮车省力的秘密是什么？\n生活中的杠杆类工具还有哪些作用？\n\n#### 🚀 拓展我们的身体也有很多地方运用了杠杆原理。比如人的手臂绕肘关节运肽二头肌动，可以看作由手臂肌肉和骨骼组成的杠杆在转动。肘关节是支点，二动力头肌提供动力，重物对手施加阻力。\n阻力你还能举出更多的例子吗？\n射关节（支点）"}, {"id": "sci_09_u02_l03", "lesson_idx": 158, "book": "五年级上册", "vol_dir": "09_五年级上册", "unit_no": 2, "unit_title": "第二单元工具与技术", "lesson_no": 3, "title": "制作独轮车", "page": 42, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g09_s1_u02_l03.html", "code": "g09_s1_u02_l03", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！ ", "lesson_no": 5, "title": "妙用滑轮", "page": 50, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g09_s1_u02_l05.html", "code": "g09_s1_u02_l05", "sections": {"focus": "滑轮是如何将重物运送到更高处的？", "exploration": "观察下面的图片，认识几种滑轮。", "discussion": "分别使用定滑轮和动滑轮提升重物，有什么不同的效果？\n生活中，定滑轮和动滑轮各有哪些实际的应用？", "expansion": "生活中常常能看到人们将多个滑定滑轮轮组合在一起使用、例如起重机、消防车电梯等。你还知道生活中哪些地方会将滑轮组合使用吗？\n起重机动滑轮消防车电梯", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p50.webp", "p51.webp", "p52.webp", "p53.webp"], "raw_text": "### [第 50 页]\n\n![第 50 页教学插图与实验活动](figures/p50.png)\n\n## 5. 妙用滑轮\n\n\n妙用滑轮运用斜面往往需要较大场地，然而有时要直上直下地将重物运到高处，这时可以用滑轮将重物甚至整个手推车吊升上去。\n\n#### 🎯 聚焦滑轮是如何将重物运送到更高处的？\n\n#### 🔬 探索观察下面的图片，认识几种滑轮。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g09_s1_u02_l05.html)\n\n\n### [第 51 页]\n\n![第 51 页教学插图与实验活动](figures/p51.png)\n\n1. 用定滑轮提升重物。\n资料安装一个定滑轮，边缘有凹槽，可绕中利用定滑轮提升重物并心轴转动的轮子叫滑轮。\n记录。\n像旗杆顶部的滑轮那样，固定在一个位置转动而不移动的滑轮叫定滑轮。\n定滑轮有什么作用呢？\n左边的钩码模拟重物，右边的钩码模拟人力。\n\n#### 📝 记录单教出定滑轮模拟实验日期：\n左边原有达到平衡时右边所需钩码数/个实验次数钩码数/个猜测实验结果第1次第2次第3次我的发现：\n\n### [第 52 页]\n\n![第 52 页教学插图与实验活动](figures/p52.png)\n\n3. 体验动滑轮的作用。\n资料组装一个动滑轮装置，用它提升像塔吊的吊钩一样，可以随重物。\n重物一起移动的滑轮叫动滑轮。\n感觉比定动滑轮有滑轮省力。\n什么作用呢？\n做实验验证利用动滑轮提升重物是否省力。\n北商科景子①测量直接提升重物时②测量用动滑轮提升重橡皮筋的长度。\n物时橡皮筋的长度。\n\n### [第 53 页]\n\n![第 53 页教学插图与实验活动](figures/p53.png)\n\n#### 📝 记录单动滑轮模拟实验日期：\n实验次数直接提升重物时橡皮筋的使用动滑轮提升重物时橡皮筋的长度/厘米长度/厘米第1次第2次第3次我的发现：\n\n#### 💬 研讨分别使用定滑轮和动滑轮提升重物，有什么不同的效果？\n生活中，定滑轮和动滑轮各有哪些实际的应用？\n\n#### 🚀 拓展生活中常常能看到人们将多个滑定滑轮轮组合在一起使用、例如起重机、消防车电梯等。你还知道生活中哪些地方会将滑轮组合使用吗？\n起重机动滑轮消 制技术技术应用空间电源真空镀膜技术与储能技术中国空间站\n\n#### 💬 研讨工具和技术之间有什么联系？\n同一种技术可以应用在不同工具上吗？请举例说明。\n\n### [第 61 页]\n\n![第 61 页教学插图与实验活动](figures/p61.png)\n\n#### 🚀 拓展印刷术的出现使书籍快速且大批量的印制成为可能。通过阅读书籍获取知识成为人类文明传承和发展的重要方式，也促使人们创造出更多新的工具和技术。\n你还知道哪些推动社会发展的重要工具和技术？\n印刷术是我国古代四大发明雕版印刷人甚之花芳草鲜机制林夹岸数百行忘路之囊活字印刷科学生激光印刷不断发展的印刷技术\n\n### [第 62 页]\n\n![第 62 页教学插图与实验活动](figures/p62.png)\n\n#### 📋 单元小结社会发展共同推动工具相互促进技术简单机械杠杆斜面滑轮轮轴省力或方便人们在生产生活中常常会使用杠杆、斜面、滑轮、轮轴等简单机械来提高工作效率使用简单机械可以省力或便捷：随着社会的发展，人们还会根据不同的需求制造和改进各种各样的工具。工具和技本的发展是相革促进的，同时，它们不酬迭代文共同推动着社会的发展。\n我的收获怎样改进呢？\n评价内容评价等级我能举出杠杆、斜面、滑轮、轮轴在生活中应用的例子通过模拟实验，我知道了杠杆、斜面、滑轮和轮轴的作用效果我参与了设计和制作独轮车模型，并根据测试结果进行改进我更关注工具和技术对社会发展的作用了\n\n### [第 63 页]\n\n![第 63 页教学插图与实验活动](figures/p63.png)\n\n#### 📖 科学阅读我国农具的发展我国是一个历史悠久的国家，几千年来，劳动人民凭借着勤劳和智慧，创造和改进了多种多样的农具。\n在原始农业时代，农业生产的产量很低，采集和狩猎仍占主要地位。古人最开始使用简融的石头、木头等作为采集、狩猎的工具，后来渐渐穿孔石斧用木棒、石块以及野兽骨、蚌壳等创造出一些最原始的农具。人们用粗糙的石斧或其他砍砸工具砍倒树木并焚烧成灰；用尖头的木棒进行松土、播种；庄稼成熟时，用石镰、蚌镰来收取谷穗。\n随着磨制技术的发展，人们创造并改进了农具，石镰使得生产工具更锐利。镰刀的出现与使用，使人们从徒手摘穗发展到使用工具割穗的阶段，大大提高了收割的效率与质量。\n春秋战国时期，我国劳动人民已经掌握了蚌镰——用蚌壳磨制的镰刀炼铁术。冶铁业的发展使生产大量铁制农具成为可能。铁制农具有锄、铲、镰、斧等，应用于农业生产的各个环节，如垦地、翻土开沟、整地、除草与收获等。铁制农具更加坚固耐用，使用寿命更长，能够在大规模耕作中发挥更大的作用。它的身现，使得农民的劳动和生产效率都得到了提高，耕作方式发生了巨大的变化。\n铁制农具的改进和大量使用，促进了耕地工具一一犁的发展，也使牛耕的中国耕地工具一—型使用逐渐普遍起来。牲口耕地不仅耕地较深，而且使人从耕田的劳作中解放出来。起初的牛耕是以二牛三人的方式为主，到了西汉末期，二牛一人式的耕地法开始出现，推动了耕地技术的进一步发展。\n\n### [第 64 页]\n\n![第 64 页教学插图与实验活动](figures/p64.png)\n\n现如今，科学技术发展迅速，我国农业生产也在积极引人先进的科学技术。\n各类农业机械设备的引人可以在降低农民劳动强度的同时大幅度提升农业生产效率，有助于农业经济的高质量发展，为农业生产的产业化、现代化奠定坚实的基础。\n我国农具的演变与发展是一个不断探索、改进和创新的过程，不仅推动了我国农业的发展和进步，更反映出了我国劳动人民的智慧和创造力。\n无人机喷洒农药三教育科兰大型联合收割机\n\n### [第 65 页]\n\n![第 65 页教学插图与实验活动](figures/p65.png)\n\n第三单元运动和力球开展科学考察，这是了不起的科技成就。\n如果我们想自己制作一辆月球小车”，就需要研究小车的结构和所受的力。比如，“月球小车有怎样的结构？小车的运动受哪些力的影响？我们设计“月球小车”应当考虑哪些因素？"}, {"id": "sci_09_u03_l01", "lesson_idx": 163, "book": "五年级上册", "vol_dir": "09_五年级上册", "unit_no": 3, "unit_title": "第三单元运动和力", "lesson_no": 1, "title": "拆解我的小车模型", "page": 66, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g09_s1_u03_l01.html", "code": "g09_s1_u03_l0 运动和力", "lesson_no": 2, "title": "用重物驱动小车", "page": 70, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g09_s1_u03_l02.html", "code": "g09_s1_u03_l02", "sections": {"focus": "#### 🔬 探索资料用小车做实验，让它运动起来。\n重力是地球对地球上的一切物体我们有哪些方法让小车运动起施加的吸引力。它无须接触物体就能来？如果只有垫圈和绳子，我们能让对物体施加引力。在重力的作用下，小车动起来吗？\n苹果会掉落到地面，抛向空中的小球也会落回地面。物体的质量越大，所受的重力越大。", "exploration": "资料用小车做实验，让它运动起来。\n重力是地球对地球上的一切物体我们有哪些方法让小车运动起施加的吸引力。它无须接触物体就能来？如果只有垫圈和绳子，我们能让对物体施加引力。在重力的作用下，小车动起来吗？\n苹果会掉落到地面，抛向空中的小球也会落回地面。物体的质量越大，所受的重力越大。", "discussion": "驱动小车运动的力是怎样产生的？小车运动快慢与力的大小有什么关系？\n在重复实验中，测量数据的差异是怎样造成的？\n除了用“·”符号的数量表示小车运动快慢之外，我们还有其他表示方法吗？", "expansion": "挑战任务：控制小车的运动快慢我们能控制小车的运动快慢吗？比如：让小车在3秒内运动1米。\n我认为可以通过科学家是如何控改变小车的重量来控制小车的运动快慢制月球小车的运动快慢的？\n载们也可以通过教育科学出服社改变垫图的数量来控制小车的通动快慢。", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p70.webp", "p71.webp", "p72.webp", "p73.webp"], "raw_text": "### [第 70 页]\n\n![第 70 页教学插图与实验活动](figures/p70.png)\n\n## 2. 用重物驱动小车\n\n\n用重物驱动小车上由静到动，缓慢下行，登陆月球表面，开始执行巡视探测任务。\n\n#### 🎯 聚焦\n\n#### 🔬 探索资料用小车做实验，让它运动起来。\n重力是地球对地球上的一切物体我们有哪些方法让小车运动起施加的吸引力。它无须接触物体就能来？如果只有垫圈和绳子，我们能让对物体施加引力。在重力的作用下，小车动起来吗？\n苹果会掉落到地面，抛向空中的小球也会落回地面。物体的质量越大，所受的重力越大。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g09_s1_u03_l02.html)\n\n\n### [第 71 页]\n\n![第 71 页教学插图与实验活动](figures/p71.png)\n\n拉小车的绳子多长比较合适？\n垫圈细绳拉动小车的力是怎样产生的？\n金属框架四轮小车研究垫圈数量与小车运动变化的关系。\n为了研究垫圈数量与小车运动变化的关系，我们需要制订一个实验方案。\n改变垫图数量进行测量、比较，要测量多次，然后求平均值。\n用手或指板指住小车，可以让它停止。\n提示·标明小车运动的起点和终点。\n·从挂一个垫图开始，逐个增加垫图数量，直到小车可以动起来。\n·继续增加垫图，观察小车的运动有什么变化。\n·记录每次实验中垫图的数量和小车从起点到终点的运动时间。\n\n### [第 72 页]\n\n![第 72 页教学插图与实验活动](figures/p72.png)\n\n#### 📝 记录单垫圈数量与小车运动变化的关系日期：\n从起点到终点的平均运动运动快慢垫圈数量运动时间时间（用●数量表示）第1次：\n第2次：\n第3次：\n这是第一组同学的记录单，请对它进行数据分析。\n垫圈数量与小车运动变化的关系日期：月×日望图数量从起点到线点的平均运动运动时间运动快慢区时间（用数量表示）第次：2秒\n1. 个第2次：1.8秒\n1.87秒对比第二列第次：1.8秒时间数据，找出它第1次：1.6秒们的变化趋势。\n达组数据的差2个第2次：\n1.6秒\n1.57秒异较大，可能的原第了次：\n1.5秒因是什么？\n第1：\n1.3秒\n3. 个第2次：1.5秒\n1.30秒第次：\n1.14少第1次：1秒\n4. 个第2次：0.9秒0.97秒第1次：秒\n\n### [第 73 页]\n\n![第 73 页教学插图与实验活动](figures/p73.png)\n\n#### 💬 研讨驱动小车运动的力是怎样产生的？小车运动快慢与力的大小有什么关系？\n在重复实验中，测量数据的差异是怎样造成的？\n除了用“·”符号的数量表示小车运动快慢之外，我们还有其他表示方法吗？\n\n#### 🚀 拓展挑战任务：控制小车的运动快慢我们能控制小车的运动快慢吗？比如：让小车在3秒内运动1米。\n我认为可以通过科学家是如何控改变小车的重量来控制小车的运动快慢制月球小车的运动快慢的？\n载们也可以通过教育科学出服社改变垫图的数量来控制小车的通动快慢。"}, {"id": "sci_09_u03_l03", "lesson_idx": 165, "book": "五年级上册", "vol_dir": "09_五年级上册", "unit_no": 3, "unit_title": "第三单元运动和力", "lesson_no": 3, "title": "用弹力驱动小车", "page": 74, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g09_s1_u03_l03.html", "code": "g09_s1_u03_l03", "sections": {"focus": "弹力是如何产生的？我们的小车能用弹力来驱动吗？", "exploration": "故育科学女观察、感受弹力。\n资料一般情况下，物体在受到外力作用时，形状或多或少会发生改变，这时物体会产生一个要恢复原来形状的力，这个力叫弹力。", "discussion": "橡皮筋在车轴上缠绕的圈数与小车行驶的距离有什么关系？所有小组的实验数据都支持这个结论吗？\n不同小组的数据有哪些相同和不同？如果有差异，造成差异的原因可能是什么？\n驱动车轮转动的力来自哪里？除了重力和弹力，还有哪些力可以驱动小车？", "expansion": "普通小车的车轮上都装有轮胎，这样可以减小车身震动。而“玉兔”号月球车却没有安装轮胎。搜集资料，了解“玉兔”号月球车车轮的设计秘密。", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p74.webp", "p75.webp", "p76.webp", "p77.webp"], "raw_text": "### [第 74 页]\n\n![第 74 页教学插图与实验活动](figures/p74.png)\n\n## 3. 用弹力驱动小车\n\n\n用弹力驱动小车自古以来，人们利用各种力为我们的生产、生活带来便利，弹力就是其中\n\n#### 🎯 聚焦弹力是如何产生的？我们的小车能用弹力来驱动吗？\n\n#### 🔬 探索故育科学女观察、感受弹力。\n资料一般情况下，物体在受到外力作用时，形状或多或少会发生改变，这时物体会产生一个要恢复原来形状的力，这个力叫弹力。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g09_s1_u03_l03.html)\n\n\n### [第 75 页]\n\n![第 75 页教学插图与实验活动](figures/p75.png)\n\n1. 用弹力来驱动小车。\n将橡皮筋一端固定在车架上，另一端缠绕在车轴上。试一试，能用它驱动小车吗？\n3. 研究弹力大小对运动距离的影响。\n●在车轴上缠绕不同的圈数来改变弹力的大小，其他条件保持不变。\n·确定小车运动的起点和终点的标记方法。\n这是一个对比实验，我们要做好条件的控制。\n起点终点行驶距离我们可以把车头放在车头前方所在位起跑线上，运动停止后车置为起点头所在的位置为终点\n\n### [第 76 页]\n\n![第 76 页教学插图与实验活动](figures/p76.png)\n\n记录、整理小组的实验数据，并对数据进行分析。\n对比“测量距离”这列数据，进行分析。\n\n#### 📝 记录单小车行驶距离与橡皮筋缠绕圈数的关系日期：\n橡皮筋缠绕实验次数从起点到终点的距离/厘米小车行驶距离的圈数测量距离处理结果（远、中等、近）我的发现：橡皮筋缠绕图数越多，被挂仲的长度越所产生的弹力越小车行驶的距离越数据处理有多种方法，可以取平均值，也可以取最大值等。\n小车行驶距离日期：____月____日我们还可以直接运动方向在纸带上贴圆点来表第一姐第二组第三组第四组第五组示小车运动的距离观察不同颜色圆点的分布规律。\n注：红点表示橡皮筋缠绕3圈，绿点表示橡皮筋缠绕4图，蓝点表示橡皮筋缠绕5圈。\n\n### [第 77 页]\n\n![第 77 页教学插图与实验活动](figures/p77.png)\n\n#### 💬 研讨橡皮筋在车轴上缠绕的圈数与小车行驶的距离有什么关系？所有小组的实验数据都支持这个结论吗？\n不同小组的数据有哪些相同和不同？如果有差异，造成差异的原因可能是什么？\n驱动车轮转动的力来自哪里？除了重力和弹力，还有哪些力可以驱动小车？\n\n#### 🚀 拓展普通小车的车轮上都装有轮胎，这样可以减小车身震动。而“玉兔”号月球车却没有安装轮胎。搜集资料，了解“玉兔”号月球车车轮的设计秘密。"}, {"id": "sci_09_u03_l04", "lesson_idx": 166, "book": "五年级上册", "vol_dir": "09_五年级上册", "unit_no": 3, "unit_title": "第三单元运动和力", "lesson_no": 4, "title": "测量力的大小", "page": 78, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g09_s1_u03_l04.html", "code": "g09_s1_u03_l04", "sections": {"focus": "提环我们测量过长度、质量、温度，那么怎样测量力的大小呢？\n教育术子出弹簧", "exploration": "指针认识弹簧测力计。\n刻度观察弹簧测力计的结构，回顾之前学习的弹力，想一想测力计各部分有什么作用。\n挂钩弹簧测力计", "discussion": "分析实验数据，我们还有什么发现？\n如果将弹簧测力计中的弹簧换成橡皮筋，还可以用来测量力的大小吗？\n生活中哪些地方还用到了弹力？这些弹力是怎样产生的？", "expansion": "“玉兔”号月球车的重量“玉兔”号月球车的设计质量为137千克，它在地球上的重量约1343牛。\n而当月球车登上月球时，它的质量不变而重量却大大减小，只有约222牛。查阅资料，了解更多关于月球上物体重量减小的原因。\n日常生活中对物体“重量”的描述实际是指“质量”，用“千克”来表示，而在科学上重量是指重力，用“牛”（N）来表示。\n在地球上，我在月球上，我的的重量是1343牛。\n重量只有222牛。\n斗学出", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p78.webp", "p79.webp", "p80.webp", "p81.webp"], "raw_text": "### [第 78 页]\n\n![第 78 页教学插图与实验活动](figures/p78.png)\n\n## 4. 测量力的大小\n\n\n测量力的大小有的物体很重，有的物体很轻；有时力很大，有时力很小力的大小是可以测量的\n\n#### 🎯 聚焦提环我们测量过长度、质量、温度，那么怎样测量力的大小呢？\n教育术子出弹簧\n\n#### 🔬 探索指针认识弹簧测力计。\n刻度观察弹簧测力计的结构，回顾之前学习的弹力，想一想测力计各部分有什么作用。\n挂钩弹簧测力计\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g09_s1_u03_l04.html)\n\n\n### [第 79 页]\n\n![第 79 页教学插图与实验活动](figures/p79.png)\n\n弹簧与橡皮筋的特点很像。\n拉力越大，弹簧伸得越长，指针示数也就越大。\n注意不能用力过大，以免超过测力计的测量范围。\n资料力的单位是牛顿，简称牛，用符号\"N”表示。它是以英国著名物理学家牛顿的名字命名的。\n用弹簧测力计测量重力的大小。\n用手拉一拉弹簧测力计，分别使指针指到1N、2N、5N，感受弹簧带来的不同大小的力。\n最好先据一掂，用弹簧测力计测量不同物体的轻重：\n估测一下，看一看自已的结测准不准弱\n\n### [第 80 页]\n\n![第 80 页教学插图与实验活动](figures/p80.png)\n\n#### 📝 记录单用弹簧测力计测量物体重力日期：\n物体名称估计的重力/牛实测的重力/牛测量拉力的大小。\n水平拉动一个物体，测量拉动它的力至少是多少。\n教怡\n\n#### 💬 研讨分析实验数据，我们还有什么发现？\n如果将弹簧测力计中的弹簧换成橡皮筋，还可以用来测量力的大小吗？\n生活中哪些地方还用到了弹力？这些弹力是怎样产生的？\n\n### [第 81 页]\n\n![第 81 页教学插图与实验活动](figures/p81.png)\n\n#### 🚀 拓展\n\n“玉兔”号月球车的重量“玉兔”号月球车的设计质量为137千克，它在地球上的重量约1343牛。\n而当月球车登上月球时，它的质量不变而重量却大大减小，只有约222牛。查阅资料，了解更多关于月球上物体重量减小的原因。\n日常生活中对物体“重量”的描述实际是指“质量”，用“千克”来表示，而在科学上重量是指重力，用“牛”（N）来表示。\n在地球上，我在月球上，我的的重量是1343牛。\n重量只有222牛。\n斗学出"}, {"id": "sci_09_u03_l05", "lesson_idx": 167, "book": "五年级上册", "vol_dir": "09_五年级上册", "unit_no": 3, "unit_title": "第三单元运动和力", "lesson_no": 5, "title": "摩擦力的比较", "page": 82, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g09_s1_u03_l05.html", "code": "g09_s1_u03_l05", "sections": {"focus": "资料一个物体在另一个物体的表面运动或有借助摩擦力，可以让小车停止运动。摩擦力是产生运动的趋势时，两怎样产生的？什么因素会影响摩擦力的大小？\n个物体的接触面会发生教育种学摩擦，物体会受到一种阻碍运动的力，这种力", "exploration" ", "sim_file": "sim_g09_s1_u03_l06.html", "code": "g09_s1_u03_l06", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。", "misconception": ""}, "figures": ["p86.webp", "p87.webp", "p88.webp", "p89.webp"], "raw_text": "### [第 86 页]\n\n![第 86 页教学插图与实验活动](figures/p86.png)\n\n## 6. 制作“月球小车”\n\n\n制作“月球小车我们已经学习了运动和力的有关知识，下面就开始制作我们的“月球小车”吧！\n明确任务通过研究，我们知道了小车的运动受多种力的影响。现在需要综合前面所学的知识，设计并制作我们的“月教球小车”。\n价格要在真实调查的基础上确定。这任务里的“100元”只是设计和制作一辆“月球小车”，该小车模型能载一个虚拟数据。\n重1块橡皮，穿过凹凸不平的沙地（模拟月球表面）。\n材料价格不超100元；\n质量不大于100克；\n能载重1块橡皮，在10秒内通过测试沙坑。\n备注：任务中的数据指标可以根据学校的具体情况进行调整。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿空间探索（中国探月与深空探测工程）**：从“嫦娥六号”实现人类首次月背采样返回，到“祝融号”火星车巡视火星乌托邦平原，航天科学家利用精密轨道力学与光谱分析，正在解开太阳系演化与地月系统的终极奥秘！\n- 🧠 **跨学科大概念（系统与模型 / CER 推理）**：天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。\n- ⚠️ 很多同学误以为“月相变化是地球的影子挡住了月亮”。**科学真相**：地球影子挡住月球的现象是罕见的“月食”；而平时的初一到十五月相变化，纯粹是因为月球绕地球公转时，我们在地球上看到的月球被太阳照亮的半球面角度不同！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g09_s1_u03_l06.html)\n\n\n### [第 87 页]\n\n![第 87 页教学插图与实验活动](figures/p87.png)\n\n备选材料与工具完成一项工程任务的基本步骤明确任务制订方案实施方案明确任务的具体要求讨论可能遇到的问题根据方案，团队协作，和解决办法，制订对材料进行加工、是什么最优方案制作和组装展示与交流测试与改进根塘任务要求进行测展示作品，交流经验，试，反思方案和实施评价并改进作品过程中的问题，进一步调整、改进制订方案根据任务，讨论、设计并确定“月球小车”的设计方案，合理选择所需材料。\n\n### [第 88 页]\n\n![第 88 页教学插图与实验活动](figures/p88.png)\n\n如果能标注一下主要部件的尺寸就更好了。\n“月球小车”设计图从多个角度画日期：X月×日出小车设计图，可以更全面地反映它太阳能析（小号）的结构。\n支撑杆轮（四个）完成设计后，小组合作，选择材料制造自己的“月球小车”，按照“月球小车”组装说明的指引进行组装。\n材料清单日期：____月____日价格需要的材价格材料名称性能及质量\n1. 元料及数量小计能量：5；长方：质量：25克/版太阳能电池A太阳能电池B能量：3：正方形：质量：20克/对尺寸：大；质量：10克/对车轮A+车轴A尺寸：中；质量：8克/对车轮B+车轴B标准配置；质量：10克车身支架规格：大，转速快；质量：20克小电动机A规格：小，转速慢；质量：15克小电动机B标准配置；质量：2克齿轮螺丝、螺丝刀、全卖使用扎带等工具总质量：\n总价：\n合计备注：此表仅供参考，以老师提供的实际材料为准。\n\n### [第 89 页]\n\n![第 89 页教学插图与实验活动](figures/p89.png)\n\n实施方案为什么不用重力和弹力驱动“月球小车”组装说明小车？\n1. 做车架。用扎带连接起车架，将齿轮安装在车轴上，并与车身连接。\n2. 安装轮子和小电动机。\n将轮子连接到车轴上，用扎带将小电动机固定在车身上。\n3. 固定太阳能电池。用螺丝刀将太阳能电池支架固定在车身\n4. 连接太阳能电池和小电动机。将太阳能电池的两根导线分别与小电动机上的导线连接起来，并安装绝缘套。"}, {"id": "sci_09_u03_l07", "lesson_idx": 169, "book": "五年级上册", "vol_dir": "09_五年级上册", "unit_no": 3, "unit_title": "第三单元运动和力", "lesson_no": 7, "title": "评价“月球小车”", "page": 90, "domain": "astronomy", "domain_cn": "综合科学探究", "sim_file": "sim_g09_s1_u03_l07.html", "code": "g09_s1_u03_l07", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。", "misconception": ""}, "figures": ["p90.webp", "p91.webp", "p92.webp", "p93.webp", "p94.webp", "p95.webp", "p96.webp", "p97.webp"], "raw_text": "### [第 90 页]\n\n![第 90 页教学插图与实验活动](figures/p90.png)\n\n## 7. 评价“月球小车”\n\n\n评价“月球小车我们合作完成了“月球小车”的制作，它的性能究竞怎样？是否符合目标任务的要求？我们来对其进行测试和评价。\n测试和改进检查作品与设计方案是否一致。\n设计评价表并进行测试。\n评价表可以帮助我们有序地测试。测试时做好记录，以便和其他同学交流。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿空间探索（中国探月与深空探测工程）**：从“嫦娥六号”实现人类首次月背采样返回，到“祝融号”火星车巡视火星乌托邦平原，航天科学家利用精密轨道力学与光谱分析，正在解开太阳系演化与地月系统的终极奥秘！\n- 🧠 **跨学科大概念（系统与模型 / CER 推理）**：天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。\n- ⚠️ 很多同学误以为“月相变化是地球的影子挡住了月亮”。**科学真相**：地球影子挡住月球的现象是罕见的“月食”；而平时的初一到十五月相变化，纯粹是因为月球绕地球公转时，我们在地球上看到的月球被太阳照亮的半球面角度不同！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g09_s1_u03_l07.html)\n\n\n### [第 91 页]\n\n![第 91 页教学插图与实验活动](figures/p91.png)\n\n“月球小车”评价表评价项目任务要求星级标准评价结果符合要求小车自重☆☆文不符合要求符合要求小车价格☆☆文不符合要求10. 秒钟内通过小车载重过沙坑10. 秒钟以上通过不能通过好团队合作一般好小车外观装饰一般合计颗星备注：此表仅供参考，同学们可以协商制订评价表评价结果的星级标准可以由全班讨论决定。\n根据任务要求，开展测试活动测重量测试小车载重过沙坑\n\n### [第 92 页]\n\n![第 92 页教学插图与实验活动](figures/p92.png)\n\n#### 📝 记录单发现的问题与解决方案日期：\n发现的问题可能的原因解决方案小车不能走直线车轴不正调正小车不能爬出沙坑在测试活动过程中进行调整和改进。\n版调整车轴位置以调整小车行驶路线调整太阳能板角度以加大动力\n\n### [第 93 页]\n\n![第 93 页教学插图与实验活动](figures/p93.png)\n\n展示和交流这是我们小组的记录表。\n发现的问题与解决方案我们小组的小车作品。\n发现的问题日期：____月____日小车不能走直线可能的原因车轴不正解决方案调正小车不能爬出沙坑动力不足更换马达车轮打滑马达不转动更换车轮角度没调好调整角度，对准太阳通过交流，我们可测试我们的“月球小车以学习到更多，比如：\n知道完成同一项任务可以有多个方案：知道怎样评价H月球小车”的性能；还知道许多因素会影响测试结果。\n与“玉兔”号月球车相比，我们制造的“月球小车”还很简陋，我们将继续努力，勇于探索。\n\n### [第 94 页]\n\n![第 94 页教学插图与实验活动](figures/p94.png)\n\n#### 📋 单元小结重力骨弹力可以改变物体力运动状态快慢摩擦力方向借助小车模型，我们可以研究物体的运动和力的关系。物体的运动状态，如动静、快慢、方向等，在重力、摩擦力、弹力等力的作用下可以发生改变。\n总之，方是改变物体运动状态的原因。而且运动和力都可以被测量，通过测量可以更准确地了解运动和力的关系。\n子出我的收获怎样改进呢？\n评价内容评价等级我参加了许多有趣的运动和力的实验研究我知道运动和力的关系，并知道如何测量它们我制作了一辆能完成挑战任务的“月球小车”我在与同学合作中积极分享自己的想法，受到大家肯定\n\n### [第 95 页]\n\n![第 95 页教学插图与实验活动](figures/p95.png)\n\n#### 📖 科学阅读\n\n“玉兔”号月球车是怎样设计与研制出来的二号分别于2013年12月、2019年1月登陆月球，它们为我国探月研究探测采集了大量的数据。其实，它们的个头都不大，质量约140千克，有1.5米左右的可收折的太阳翼，6个轮子，周身银光闪闪。\n个头不大的“玉兔”实际上功能强大。它们为什么被设计成现在的模样，又是怎样被研制出来的呢？\n探月任务决定了“玉兔”号的模样。月球车要承担月面勘查的任务，科研人员就设计了多双“眼晴”，包括全景相机、导航相机、避障相机等；为了看得更远和进行月地通信，就设计了桅杆来转“眼晴”和天线，还安装了与地面\n\n### [第 96 页]\n\n![第 96 页教学插图与实验活动](figures/p96.png)\n\n联系的通信天线；为了探测月壤成分，就在车上安装了机械臂。\n月面环境的特殊性和复杂性决定了月球车的设备材料必须具有特殊性能。\n月球车向阳的3个轮子，被照射的时候温度最高达100多摄氏度，另外3个被遮挡的轮子的温度只有零下十几摄氏度，一米多一点的间距，轮子温差却极大。所以，轮子的材料要耐高温、抗低温。太阳翼设计更独特，月昼时它张开翼面可以吸收太阳能，为月球车提供电能；月夜时，它会合起来充当“被子”，为装在“腹部”的仪器设备保温；中午阳光强烈、温度太高时，太阳翼还能立起来当遮阳板。\n月尘很细，带有静电。月尘的直径不足1毫米，有的甚至只有几微米，月尘扬起后，会长时间悬浮在半空中落不下来。正因为这样，月尘很容易附着在设备表面或被吸入设备，影响设备正常运转，因此开发防月尘的密封圈就变得格外重要。研制人员足足花费了两年时间研究材料配方，对每一种配方都进行了压缩变形、耐寒系数、耐热老化等多项测试，最终才确定下来。\n月球表面崎岖不平且月壤疏松。为了保证月球车的行驶和越障能力，科研人员采取了独特的悬架设计、六轮独立驱动、四轮独立转向的构型方案，确保“玉免”能爬坡越障，即使行进间某个轮子被卡住，其他独立驱动的车轮也能帮助月球车摆脱陷阱，继续工作。\n攻坚之路，何其艰难。科研人员在研究过程中突破了多项关键技术，包括月面巡视技术、月夜生存技术、测控通信技术、综合电子技术等，每一项技术“玉免”号月球车上天之前，科研人员做了大量的验证试验及仅移动分系统模拟月壤场地试验，行驶里程累计超过20千米，总爬坡次数超过700次，总越障次数700余次。为了找到合适的测试场所，科研人员经过1.8万千米的奔波，最终才选定了库姆塔格沙漠与罗布泊交界处的阿奇克谷地。在这个最像月球的谷地长期进行反复仿真测试，确保了月球车具有高可靠性。\n正是因为有了这一个个貌似枯燥的研制数据，一个个不断优化的设计方案，数和性能，确保了“玉免”号在巡月勘测中的优异表现。\n\n### [第 97 页]\n\n![第 97 页教学插图与实验活动](figures/p97.png)\n\n第四单元地球表面的变化教育科联大敬社当我们坐上高铁或飞机从北京向西前行，一路上会看到黄土高原和镶嵌其中的黄河，再向西还可以看到沙漠、戈壁；如果向北，我们可以看到长白山顶的天池火山口湖；如果向南，我们会看到平原、高山、丘陵、峡谷、盆地，还有婉蜓其中横贯东西的长江。我们一定会惊叹祖国山河的壮美，也一定会思考：是什么神奇的力量塑造了地球表面的这些地形地貌？"}, {"id": "sci_09_u04_l01", "lesson_idx": 170, "book": "五年级上册", "vol_dir": "09_五年级上册", "unit_no": 4, "unit_title": "第四单元地球表面的变化", "lesson_no": 1, "title": "地球的表面", "page": 98, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g09_s1_u04_l01.html", "code": "g09_s1_u04_l01", "sections": {"focus": "地球的表面是什么样的？地球表面的形态以前就是这样的吗？它受哪些因素影响变成了现在的样貌？\n地形图是认识地形的重", "exploration": "要工具，它晨示了地球表面的海陆分布和高低起伏的状况。暖色调代表海拔高，冷观察世界地形图，描述地球表面的样子。\n色调代表海拔低", "discussion": "通过读图，说一说地球表面有哪些地形地貌。\n地球表面地形地貌的形成可能与哪些因素有关？我们是如何作出推测的？", "expansion": "将我们关于地球表面地形地貌形成的推测用示意图的方法表达出来，我的推测姓名：小司我们的推测堰发中是否正确呢？\n我的推测岩浆姓名：小雪堰发后育科出岩浆", "frontier": "", "big_concept": "地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。", "misconception": ""}, "figures": ["p98.webp", "p99.webp", "p100.webp", "p101.webp"], "raw_text": "### [第 98 页]\n\n![第 98 页教学插图与实验活动](figures/p98.png)\n\n## 1. 地球的表面\n\n\n地球的表面地球常被称为蓝色星球，大约71%的面积被海洋覆盖，其余部分为高低起伏、形态多样的陆地。\n\n#### 🎯 聚焦地球的表面是什么样的？地球表面的形态以前就是这样的吗？它受哪些因素影响变成了现在的样貌？\n地形图是认识地形的重\n\n#### 🔬 探索要工具，它晨示了地球表面的海陆分布和高低起伏的状况。暖色调代表海拔高，冷观察世界地形图，描述地球表面的样子。\n色调代表海拔低\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿地球科学（深地探测与“奋斗者”号深潜）**：我国“深地一号”油气钻井已穿透地下万米白垩系地层，结合地震波断层成像技术，科学家如同给地球做“超声波CT”，实时洞察地壳构造板块运动与深部地幔热柱对流！\n- 🧠 **跨学科大概念（稳定与变化 / 因果机制）**：地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。\n- ⚠️ 小学生常认为“岩石是永恒不变、坚不可摧的”。**科学真相**：在水、大气、温度变化以及植物根系分泌酸的作用下，岩石在持续发生物理风化与化学侵蚀，并在地质循环中重熔为岩浆或沉积为土壤，地表始终在缓慢而剧烈地重塑。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g09_s1_u04_l01.html)\n\n\n### [第 99 页]\n\n![第 99 页教学插图与实验活动](figures/p99.png)\n\n观察中国地形图，我们的家乡看一看不同区域的地形在哪里？地形是有什么特点。\n什么样的？\n推测影响地球表面形态和变化的因素。\n观察下面几幅图片呈现出的地形地貌，描述它们的特点。\n④黄土高原上的沟擎黄河入海口的沙洲\n\n### [第 100 页]\n\n![第 100 页教学插图与实验活动](figures/p100.png)\n\n下面是一幅地球上部圈层结构示意图，它能帮助我们推测影响地形地貌形成的因素有哪些吗？\n大气圈生物圈岩石圈地球上部圈层结构示意图\n\n#### 📝 记录单地形地貌特点与成因推测日期：\n图片编号地形地特点推测主要形成原因\n\n### [第 101 页]\n\n![第 101 页教学插图与实验活动](figures/p101.png)\n\n#### 💬 研讨通过读图，说一说地球表面有哪些地形地貌。\n地球表面地形地貌的形成可能与哪些因素有关？我们是如何作出推测的？\n\n#### 🚀 拓展将我们关于地球表面地形地貌形成的推测用示意图的方法表达出来，我的推测姓名：小司我们的推测堰发中是否正确呢？\n我的推测岩浆姓名：小雪堰发后育科出岩浆"}, {"id": "sci_09_u04_l02", "lesson_idx": 171, "book": "五年级上册", "vol_dir": "09_五年级上册", "unit_no": 4, "unit_title": "第四单元地球表面的变化", "lesson_no": 2, "title": "火山喷发对地表的作用", "page": 102, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g09_s1_u04_l02.html", "code": "g09_s1_u04_l02", "sections": {"focus": "来？会对地表产生什么影响？", "exploration": "了解火山喷发的情景及其给地表带来的改变。\n了解火山喷发的情景。", "discussion": "火山喷发会给地表带来什么样的改变？改变的过程有什么特点？\n火山喷发是怎样形成的？结合模拟实验所观察到的现象来解释。\n根据火山喷出的岩浆流体，我们推测地球内部可能是什么样的状态？", "expansion": "尽可能按照地球内部圈层的厚度比例，用橡皮泥或其他材料制作地球内部圈层结构模型。", "frontier": "", "big_concept": "地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。", "misconception": ""}, "figures": ["p102.webp", "p103.webp", "p104.webp", "p105.webp"], "raw_text": "### [第 102 页]\n\n![第 102 页教学插图与实验活动](figures/p102.png)\n\n## 2. 火山喷发对地表的作用\n\n\n火山喷发对地表的作用火山喷发是地球上的一种自然现象\n\n#### 🎯 聚焦来？会对地表产生什么影响？\n\n#### 🔬 探索了解火山喷发的情景及其给地表带来的改变。\n了解火山喷发的情景。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿地球科学（深地探测与“奋斗者”号深潜）**：我国“深地一号”油气钻井已穿透地下万米白垩系地层，结合地震波断层成像技术，科学家如同给地球做“超声波CT”，实时洞察地壳构造板块运动与深部地幔热柱对流！\n- 🧠 **跨学科大概念（稳定与变化 / 因果机制）**：地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。\n- ⚠️ 小学生常认为“岩石是永恒不变、坚不可摧的”。**科学真相**：在水、大气、温度变化以及植物根系分泌酸的作用下，岩石在持续发生物理风化与化学侵蚀，并在地质循环中重熔为岩浆或沉积为土壤，地表始终在缓慢而剧烈地重塑。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g09_s1_u04_l02.html)\n\n\n### [第 103 页]\n\n![第 103 页教学插图与实验活动](figures/p103.png)\n\n2022. 年1月14、15两日，位于南太平洋岛国汤加的洪阿哈阿帕伊岛火山连续发生猛烈喷发，海面大面积“炸开”，巨大波纹向外迅速扩散，喷发的大片火山灰以及气体像蘑菇云一样，从太平洋海域升起，喷发高度超过30千米。此次火山喷发引发海啸，造成该国通信中断、道路受损、多处出现海水倒灌等严重灾害，经分析可能是30年来全球规模最汤加火山喷发大的一次海底火山喷发，了解火山喷发后给地表带来的改变。\n云南腾冲火山群是我国保存最完长白山天池是一个火山口湖，由整、最年轻的火山群之一，该火山群火山喷发形成，熔岩堆积在火山口周现存90余座火山锥，其中火山喷发口围，形成了屹立在四周的山峰，而火保存完好、观赏价值较高的火山锥有山口处呈盆状凹陷，时间一长，积水25. 座。这里的地质现象非常丰富，典成湖。\n型的有火山锥、温泉，火山口湖等。\n育\n2. 探究火山喷发的成因。\n说一说火山喷发是怎样形成的。\n一地壳阅读地球内部结构的相关资料，为我们的猜测找到依据。\n地慢地核搜集资料会对我们的猜测有帮助哟！\n\n### [第 104 页]\n\n![第 104 页教学插图与实验活动](figures/p104.png)\n\n地球内部是怎样的结构和状态？用图画或文字表达我们的猜测。\n\n#### 📝 记录单地球内部的结构和状态日期：\n实验步骤·做“火山喷发”模拟实验，检验在罐头盒内放入一些土豆泥，堆我们的猜测。\n成小山的形状，并从顶部向下竖直挖一个有深度的小洞。\n向小洞内倒入一定量的番茄酱（适当稀释），然后用一层薄薄实验材料也可用的土豆泥封住洞口。\n玉米面、甜面酱代替。开动脑筋设计模将罐头盒放在铁架台上，用酒精拟实验吧！\n灯加热底部，观察“火山”喷发\n\n### [第 105 页]\n\n![第 105 页教学插图与实验活动](figures/p105.png)\n\n通过模拟实验，结合对真实火山喷发图像的观察，推断火山喷发的原因。\n\n#### 📝 记录单对火山喷发原因的认识日期：\n\n#### 💬 研讨火山喷发会给地表带来什么样的改变？改变的过程有什么特点？\n火山喷发是怎样形成的？结合模拟实验所观察到的现象来解释。\n根据火山喷出的岩浆流体，我们推测地球内部可能是什么样的状态？\n\n#### 🚀 拓展尽可能按照地球内部圈层的厚度比例，用橡皮泥或其他材料制作地球内部圈层结构模型。"}, {"id": "sci_09_u04_l03", "lesson_idx": 172, "book": "五年级上册", "vol_dir": "09_五年级上册", "unit_no": 4, "unit_title": "第四单元地球表面的变化", "lesson_no": 3, "title": "地震对地表的作用", "page": 106, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g09_s1_u04_l03.html", "code": "g09_s1_u04_l03", "sections": {"focus": "我们已经了解了火山喷发的原因，那地震又是怎样形成的？它给地表带来的影响有哪些？", "exploration": "阅读地震发生时的图片和文字资料，描述地震时的情景及对地表的改变。\n1976. 年7月28日，河北省唐山市发生了里氏7.8级地震。地震使地面出现了裂缝、塌陷，铁轨也扭曲变形。", "discussion": "地震是怎样发生的？会给地表带来哪些改变？\n我们所掌握的事实，能为先前对岩层弯曲原因的猜测提供依据吗？", "expansion": "地震成因由地下深处岩层错动、破裂引起的地震，被称为构造地震。构造地震是种活动频繁、影响范围大、破坏力强的地震。除此之外，还有由火山喷发时岩浆活动或气体爆炸引起的火山地震，由地下岩洞或矿井顶部塌陷引起的陷落地震，以及由水库蓄水等引发的诱发地震。", "frontier": "", "big_concept": "地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。", "misconception": ""}, "figures": ["p106.webp", "p107.webp", "p108.webp", "p109.webp"], "raw_text": "### [第 106 页]\n\n![第 106 页教学插图与实验活动](figures/p106.png)\n\n## 3. 地震对地表的作用\n\n\n地震对地表的作用地震也是地球上的一种自然现象，常会带来灾害性的后果\n\n#### 🎯 聚焦我们已经了解了火山喷发的原因，那地震又是怎样形成的？它给地表带来的影响有哪些？\n\n#### 🔬 探索阅读地震发生时的图片和文字资料，描述地震时的情景及对地表的改变。\n1976. 年7月28日，河北省唐山市发生了里氏7.8级地震。地震使地面出现了裂缝、塌陷，铁轨也扭曲变形。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿地球科学（深地探测与“奋斗者”号深潜）**：我国“深地一号”油气钻井已穿透地下万米白垩系地层，结合地震波断层成像技术，科学家如同给地球做“超声波CT”，实时洞察地壳构造板块运动与深部地幔热柱对流！\n- 🧠 **跨学科大概念（稳定与变化 / 因果机制）**：地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。\n- ⚠️ 小学生常认为“岩石是永恒不变、坚不可摧的”。**科学真相**：在水、大气、温度变化以及植物根系分泌酸的作用下，岩石在持续发生物理风化与化学侵蚀，并在地质循环中重熔为岩浆或沉积为土壤，地表始终在缓慢而剧烈地重塑。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g09_s1_u04_l03.html)\n\n\n### [第 107 页]\n\n![第 107 页教学插图与实验活动](figures/p107.png)\n\n2008. 年5月12日，四川省汶川县发生了里氏8级地震，地震使大量房屋倒塌，城镇变成了一片废墟。地震还使山体滑坡，河道阻塞，形成了堰塞潮。\n探究地震的成因。\n读地震的相关资料，联系火山成因知识，交流我们对地震成因的猜测，然后用模拟实验检验我们的猜测。\n模拟实验一。\n实验步骤将彩泥压成薄片，叠放在一起，平放在桌上。\n也可以用不同用双手从彩泥的两端向中间用力挤压。\n颜色的毛中做这个观察平整叠放的彩泥发生的变化。与真实实验！\n的岩层比较，我们能想到什么？\n\n### [第 108 页]\n\n![第 108 页教学插图与实验活动](figures/p108.png)\n\n彩泥模拟双手挤压的力的是什么？\n模拟的是什么？\n挤压岩层发生弯曲模拟实验二。\n实验步骤用手提住一次性本筷（或泡沫塑料板的两端，独散社持续用力，直至水筷断裂。\n观察木筷断裂时的现象。\n握住木筷的双手有什么感觉？与真实的岩层比较，我们能得到什么启发？\n岩层断裂错动\n\n### [第 109 页]\n\n![第 109 页教学插图与实验活动](figures/p109.png)\n\n●根据实验现象，\n\n#### 📝 记录单结合对真实岩层的观察，试着对地震的成对地震成因的认识因作出解释。\n日期：\n\n#### 💬 研讨地震是怎样发生的？会给地表带来哪些改变？\n我们所掌握的事实，能为先前对岩层弯曲原因的猜测提供依据吗？\n\n#### 🚀 拓展地震成因由地下深处岩层错动、破裂引起的地震，被称为构造地震。构造地震是种活动频繁、影响范围大、破坏力强的地震。除此之外，还有由火山喷发时岩浆活动或气体爆炸引起的火山地震，由地下岩洞或矿井顶部塌陷引起的陷落地震，以及由水库蓄水等引发的诱发地震。"}, {"id": "sci_09_u04_l04", "lesson_idx": 173, "book": "五年级上册", "vol_dir": "09_五年级上册", "unit_no": 4, "unit_title": "第四单元地球表面的变化", "lesson_no": 4, "title": "地球表面的岩石", "page": 110, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g09_s1_u04_l04.html", "code": "g09_s1_u04_l04", "sections": {"focus": "岩石是什么样子的？常见岩石的表面特征有哪些？应该怎样描述它们？", "exploration": "育交流我们对岩石的认识。\n岩石是什它们摸起来是粗么颜色的？\n糙的还是光滑的？", "discussion": "我们应该从哪几个方面观察、描述一种岩石的特征？\n花岗岩、砂岩、大理岩各有什么特征？\n根据三种常见岩石标本的特点，说一说三种岩石在建筑中分别有什么不同的用途。", "expansion": "花岗岩片麻岩乘集地：黄山采集地：乌兰察布收集更多种类的岩乘集者：XXX采集者：XXX石，制成岩石标本。\n2. 石灰岩是一种沉积岩，它是烧制石灰和水泥的主要原料，炼铁和炼钢也需要它。石灰岩被侵蚀可以形成溶洞等地貌。\n各种各样的石灰岩", "frontier": "", "big_concept": "地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。", "misconception": ""}, "figures": ["p110.webp", "p111.webp", "p112.webp", "p113.webp"], "raw_text": "### [第 110 页]\n\n![第 110 页教学插图与实验活动](figures/p110.png)\n\n## 4. 地球表面的岩石\n\n\n地球表面的岩石地球表面被坚硬的岩石圈包裹着，不仅包括我们看到的陆地，还包括海洋的底部。\n\n#### 🎯 聚焦岩石是什么样子的？常见岩石的表面特征有哪些？应该怎样描述它们？\n\n#### 🔬 探索育交流我们对岩石的认识。\n岩石是什它们摸起来是粗么颜色的？\n糙的还是光滑的？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿地球科学（深地探测与“奋斗者”号深潜）**：我国“深地一号”油气钻井已穿透地下万米白垩系地层，结合地震波断层成像技术，科学家如同给地球做“超声波CT”，实时洞察地壳构造板块运动与深部地幔热柱对流！\n- 🧠 **跨学科大概念（稳定与变化 / 因果机制）**：地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿 \n\n![第 114 页教学插图与实验活动](figures/p114.png)\n\n## 5. 岩石的类别与变化\n\n\n岩石的类别与变化地球上大部分岩石埋藏在地表之下，但有些地方能看到裸露在外的各种形态的岩石\n\n#### 🎯 聚焦岩石可以分为哪几类？不同岩石的形成原因一样吗？\n自然环境中岩石的模样会改变吗？\n\n#### 🔬 探索认识岩石的分类和它们的形成阅读资料，将获取的信息填写在记录单中。\n岩石记录了地球演化的历史。地质学家将岩石分为三大类：岩浆岩、沉积岩和变质岩。岩浆冷却结晶形成岩浆岩；岩浆岩和变质岩受到风化、侵蚀作用而形成松散的沉积物，再经过成岩作用形成沉积岩；岩浆岩或沉积岩因外在温度、压力的改变而成为变质岩。同样的，沉积岩和变质岩也可能因深埋熔化，再重新冷却结晶变成岩浆岩。花岗岩、砂岩和大理岩，就是这三类岩石的典型代表。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿地球科学（深地探测与“奋斗者”号深潜）**：我国“深地一号”油气钻井已穿透地下万米白垩系地层，结合地震波断层成像技术，科学家如同给地球做“超声波CT”，实时洞察地壳构造板块运动与深部地幔热柱对流！\n- 🧠 **跨学科大概念（稳定与变化 / 因果机制）**：地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。\n- ⚠️ 小学生常认为“岩石是永恒不变、坚不可摧的”。**科学真相**：在水、大气、温度变化以及植物根系分泌酸的作用下，岩石在持续发生物理风化与化学侵蚀，并在地质循环中重熔为岩浆或沉积为土壤，地表始终在缓慢而剧烈地重塑。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g09_s1_u04_l05.html)\n\n\n### [第 115 页]\n\n![第 115 页教学插图与实验活动](figures/p115.png)\n\n资料几乎所有的化石都风化和侵蚀是在沉积岩中发现的。\n冷却化石是曾在地球上生活的古生物的遗存、印痕岩浆岩或残迹。化石为我们提供了生物起源和物种进化最直接的证据。\n岩浆温高压沉积物压实和固结熔化变质岩沉积岩菊石化石高温高压\n\n#### 📝 记录单我对岩石成因的认识日期：\n岩石类别成因（可以用图示表达）举例\n2. 思考岩石变化与哪些自然因素有关。\n观察下页图片中岩石的结构，想一想，裸露在大自然中的岩石会受到哪些因素的影响？\n\n### [第 116 页]\n\n![第 116 页教学插图与实验活动](figures/p116.png)\n\n有些自然现象是在长时间作用下形成的！\n水在岩石缝中结冰\n3. 研究温度对岩石变化的影响。\n将烧热的岩石立即放人冷水中，反复几次，观察岩石的变化并记录实验现象。\n提示注意安全，戴好护目镜教育科攀出②放冷水中冷却③观察水底是否有岩石碎渣\n\n### [第 117 页]\n\n![第 117 页教学插图与实验活动](figures/p117.png)\n\n#### 📝 记录单岩石加热实验日期：\n实验操作岩石的样子加热前第一次加热后第二次加热后第三次加热后大自然中真实的情况比实验复杂得\n\n#### 💬 研讨多，我们的实验仅仅是简单模拟。\n岩石可以分为哪几类？上节课的三个岩石标本分别属于哪一类？举例说说岩石是怎样形成的。\n地球表面的岩石变化受哪些因素影响？举例说明。\n安全提醒\n\n#### 🚀 拓展注意用火安全。\n制作化石①准备不同颜色的陶泥，压成饼状。\n②依次叠放，按压成层。\n③将标本放置在泥饼上，轻压。\n④在标本上再叠放几层泥饼。\n③用擀面杖压实。\n用酒精灯加热，观察陶泥的变化。"}, {"id": "sci_09_u04_l06", "lesson_idx": 175, "book": "五年级上册", "vol_dir": "09_五年级上册", "unit_no": 4, "unit_title": "第四单元地球表面的变化", "lesson_no": 6, "title": "水对地表的作用", "page": 118, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g09_s1_u04_l06.html", "code": "g09_s1_u04_l06", "sections": {"focus": "流水会给地表带来怎样的改变？会形成什么样的独特地貌呢？", "exploration": "地表流水主要来自大认识流水给地表带来的变化。\n气降水，流水汇聚就会形成说一说我们见过的流水改变地表
