: "12_六年级下册", "unit_no": 2, "unit_title": "生物的多样性", "page_start": 20, "page_end": 39, "md_file": "P20_生物的多样性.md", "lessons_count": 7}, {"book": "六年级下册", "vol_dir": "12_六年级下册", "unit_no": 3, "unit_title": "宇宙", "page_start": 40, "page_end": 57, "md_file": "P40_宇宙.md", "lessons_count": 7}, {"book": "六年级下册", "vol_dir": "12_六年级下册", "unit_no": 4, "unit_title": "物质的变化", "page_start": 58, "page_end": 76, "md_file": "P58_物质的变化.md", "lessons_count": 7}], "lessons": [{"id": "sci_01_u01_l01", "lesson_idx": 1, "book": "一年级上册", "vol_dir": "01_一年级上册", "unit_no": 1, "unit_title": "第一单元 周围的植物", "lesson_no": 1, "title": "我们知道的植物", "page": 2, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g01_s1_u01_l01.html", "code": "g01_s1_u01_l01", "sections": {"focus": "我们周围有哪些植物？", "exploration": "**1. 说说我们知道的植物**\n\n- 郁郁葱葱的高大树木\n- 随风摇曳的青翠小草\n- 金灿灿盛开的向日葵\n\n**2. 找一找图中的植物**\n\n- 找一找水池边的垂柳\n- 找一找草地上整齐的绿篱\n\n---", "discussion": "1. 图中的大树和小草有什么相同和不同？\n2. 植物有什么共同特点？（植物都有根、茎、叶，都会慢慢长大，生长都需要水分和阳光）。", "expansion": "- 在花盆里种下一粒植物的种子，每天给它浇水，观察它的生长。\n\n---", "frontier": "中国科学院天津工业生物技术研究所已在国际上首次实现了从二氧化碳到淀粉的人工全合成（不依赖植物种植），这一突破模拟并超越了绿色植物亿万年演化出的光合作用机理！", "big_concept": "植物也是生命体！虽然它们不像动物那样奔跑，但植物体内有复杂的维管束运输系统，植物细胞通过细胞壁维持形态，通过叶绿体捕获太阳光能转化为化学能。", "misconception": "很多小朋友认为“只有会叫、会跑的动物才是生物，植物不会动所以不算生命”。**科学真相**：植物具有新陈代谢、应激反应（如向光性）、细胞分裂生长与繁衍后代的能力，是地球生态系统中最重要的“生产者”！\n\n---"}, "figures": ["p02.webp", "p03.webp", "p04.webp"], "raw_text": "### [第 2 页]\n\n![第 2 页教学插图与实验活动](figures/p02.png)\n\n## 1. 我们知道的植物\n\n公园里有很多植物。\n\n#### 🎯 聚焦\n\n我们周围有哪些植物？\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g01_s1_u01_l01.html)\n\n- 🌐 **前沿科技链接（人工光合作用）**：中国科学院天津工业生物技术研究所已在国际上首次实现了从二氧化碳到淀粉的人工全合成（不依赖植物种植），这一突破模拟并超越了绿色植物亿万年演化出的光合作用机理！\n- 🧠 **跨学科大概念（系统与生命）**：植物也是生命体！虽然它们不像动物那样奔跑，但植物体内有复杂的维管束运输系统，植物细胞通过细胞壁维持形态，通过叶绿体捕获太阳光能转化为化学能。\n- ⚠️ **前概念迷思纠偏**：很多小朋友认为“只有会叫、会跑的动物才是生物，植物不会动所以不算生命”。**科学真相**：植物具有新陈代谢、应激反应（如向光性）、细胞分裂生长与繁衍后代的能力，是地球生态系统中最重要的“生产者”！\n\n---\n\n### [第 3 页]\n\n![第 3 页教学插图与实验活动](figures/p03.png)\n\n#### 🔬 探索\n\n**1. 说说我们知道的植物**\n\n- 郁郁葱葱的高大树木\n- 随风摇曳的青翠小草\n- 金灿灿盛开的向日葵\n\n**2. 找一找图中的植物**\n\n- 找一找水池边的垂柳\n- 找一找草地上整齐的绿篱\n\n---\n\n### [第 4 页]\n\n![第 4 页教学插图与实验活动](figures/p04.png)\n\n**3. 把我们知道的植物画下来**\n\n#### 💬 研讨\n\n1. 图中的大树和小草有什么相同和不同？\n2. 植物有什么共同特点？（植物都有根、茎、叶，都会慢慢长大，生长都需要水分和阳光）。\n\n#### 🚀 拓展\n\n- 在花盆里种下一粒植物的种子，每天给它浇水，观察它的生长。\n\n---"}, {"id": "sci_01_u01_l02", "lesson_idx": 2, "book": "一年级上册", "vol_dir": "01_一年级上册", "unit_no": 1, "unit_title": "第一单元 周围的植物", "lesson_no": 2, "title": "观察植物", "page": 5, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g01_s1_u01_l02.html", "code": "g01_s1_u01_l02", "sections": {"focus": "植物有什么特点呢？", "exploration": "**1. 选择一株植物，我们一起来观察并描述它的特点**\n\n- **感官观察提示**：看一看、摸一摸、闻一闻。\n  - **看**：看植物的颜色、大小、形状。\n  - **摸**：摸叶片的软硬和光滑粗糙度。\n  - **闻**：闻一闻叶片和花朵是否有气味。\n- **植物观察示例**：\n  - **薄荷**：散发清凉特殊的香气。\n  - **绿萝**：叶片碧绿、摸起来软软的。\n  - **菊花**：枝叶茂密、散发特有的植物清香。\n\n---", "discussion": "1. 我们应该怎样描述一株植物？（从颜色、高矮、叶片形状、气味等多个方面描述）。\n2. 我们种的植物长得怎么样了？", "expansion": "- 找一找，仙人掌有什么特别的地方？（仙人掌叶退化成刺状，茎肥厚多汁，能适应干旱缺水环境）。\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p05.webp", "p06.webp", "p07.webp"], "raw_text": "### [第 5 页]\n\n![第 5 页教学插图与实验活动](figures/p05.png)\n\n## 2. 观察植物\n\n校园里有很多植物，它们和我们一起生长。\n\n#### 🎯 聚焦\n\n植物有什么特点呢？\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g01_s1_u01_l02.html)\n\n- 🔬 **前沿科学（显微解剖与仿生学）**：科学家利用超高分辨率电子显微镜观察植物表皮，发现荷叶表面具有纳米级的微双重乳突结构，具有不沾水、不沾尘的超疏水自清洁功能（荷叶效应），人类据此研发出纳米自洁防水面料！\n- 💡 **科学思维方法（多感官精细化测量）**：观察不仅是用眼睛“看”，科学家使用标尺测定叶长叶宽比例，用比色卡精准记录花青素变化，用嗅觉色谱仪分析植物挥发的芳香烃分子（用于驱虫与信息警报）。\n\n---\n\n### [第 6 页]\n\n![第 6 页教学插图与实验活动](figures/p06.png)\n\n#### 🔬 探索\n\n**1. 选择一株植物，我们一起来观察并描述它的特点**\n\n- **感官观察提示**：看一看、摸一摸、闻一闻。\n  - **看**：看植物的颜色、大小、形状。\n  - **摸**：摸叶片的软硬和光滑粗糙度。\n  - **闻**：闻一闻叶片和花朵是否有气味。\n- **植物观察示例**：\n  - **薄荷**：散发清凉特殊的香气。\n  - **绿萝**：叶片碧绿、摸起来软软的。\n  - **菊花**：枝叶茂密、散发特有的植物清香。\n\n---\n\n### [第 7 页]\n\n![第 7 页教学插图与实验活动](figures/p07.png)\n\n**2. 我们来做一个猜植物的游戏**\n\n- **蒙眼猜植物**：用眼罩蒙住眼睛，只通过用手摸叶片形状、用鼻子闻气味，猜出眼前放的是哪一盆植物（也可以做其他猜植物的游戏）。\n\n#### 💬 研讨\n\n1. 我们应该怎样描述一株植物？（从颜色、高矮、叶片形状、气味等多个方面描述）。\n2. 我们种的植物长得怎么样了？\n\n#### 🚀 拓展\n\n- 找一找，仙人掌有什么特别的地方？（仙人掌叶退化成刺状，茎肥厚多汁，能适应干旱缺水环境）。\n\n---"}, {"id": "sci_01_u01_l03", "lesson_idx": 3, "book": "一年级上册", "vol_dir": "01_一年级上册", "unit_no": 1, "unit_title": "第一单元 周围的植物", "lesson_no": 3, "title": "植物长在哪里", "page": 8, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g01_s1_u01_l03.html", "code": "g01_s1_u01_l03", "sections": {"focus": "我们把植物种在哪里？", "exploration": "**1. 我们来观察这些植物长在哪里**\n\n- 绝大多数陆生植物生长在土壤里。\n\n---", "discussion": "1. 大自然中，生长植物的地方有什么共同特点？（都有水、光照、空气和支撑环境）。\n2. 胡萝卜与荷花相比，它们有什么不同？（胡萝卜生长在陆地疏松土壤中，荷花扎根于池塘淤泥水体中）。", "expansion": "- 把绿豆分别“种”在土壤和餐巾纸上，每天观察它们的发芽生长，记得定时浇水。\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p08.webp", "p09.webp", "p10.webp", "p11.webp"], "raw_text": "### [第 8 页]\n\n![第 8 页教学插图与实验活动](figures/p08.png)\n\n## 3. 植物长在哪里\n\n田野里生长着许多植物。\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g01_s1_u01_l03.html)\n\n- 🏜️ **极端环境植物生存智慧**：仙人掌为了适应沙漠极度干旱，叶片演化为细针以减少水分蒸发，膨大的茎部如同海绵水塔；而热带雨林的附生兰花演化出气生根，直接从潮湿空气中抓取水汽！\n- 🌍 **大概念模型（生物与环境的协同演化）**：环境塑造生物形态。土壤的酸碱度（pH）、含水量与光照强度，决定了当地植被的群落分布与垂直分层结构。\n\n---\n\n### [第 9 页]\n\n![第 9 页教学插图与实验活动](figures/p09.png)\n\n#### 🎯 聚焦\n\n我们把植物种在哪里？\n\n#### 🔬 探索\n\n**1. 我们来观察这些植物长在哪里**\n\n- 绝大多数陆生植物生长在土壤里。\n\n---\n\n### [第 10 页]\n\n![第 10 页教学插图与实验活动](figures/p10.png)\n\n**2. 观察植物在土壤里是怎样生长的**\n\n- 土壤为植物提供了水分和养分，根牢牢扎在泥土中固定植株。\n- 土壤里还生活着许多小动物（如蚯蚓），松动土壤帮助植物呼吸。\n\n**3. 植物还能生长在什么地方？**\n\n- **生长在水里**：如水中亭亭玉立的荷花、浮萍。\n- **无土栽培**：植物根系直接浸泡在配制好的营养液中生长。\n\n---\n\n### [第 11 页]\n\n![第 11 页教学插图与实验活动](figures/p11.png)\n\n#### 💬 研讨\n\n1. 大自然中，生长植物的地方有什么共同特点？（都有水、光照、空气和支撑环境）。\n2. 胡萝卜与荷花相比，它们有什么不同？（胡萝卜生长在陆地疏松土壤中，荷花扎根于池塘淤泥水体中）。\n\n#### 🚀 拓展\n\n- 把绿豆分别“种”在土壤和餐巾纸上，每天观察它们的发芽生长，记得定时浇水。\n\n---"}, {"id": "sci_01_u01_l04", "lesson_idx": 4, "book": "一年级上册", "vol_dir": "01_一年级上册", "unit_no": 1, "unit_title": "第一单元 周围的植物", "lesson_no": 4, "title": "给植物画张“像”", "page": 12, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g01_s1_u01_l04.html", "code": "g01_s1_u01_l04", "sections": {"focus": "怎样画植物才真实？", "exploration": "**1. 观察植物的主要特点**\n\n- 观察吊兰：具有长长的、垂挂下来的细长叶片。\n\n**2. 我们给植物画张“像”**\n\n- **画“像”的要求**：\n  - ① 写出它的名称。\n  - ② 画出它长在哪里（花盆、土壤中）。\n  - ③ 画出它的样子和特有特征。\n\n---", "discussion": "1. 我们画出这棵植物的特点了吗？别人能认出来吗？\n2. 我们家里种了哪些植物？应该怎样爱护它们？", "expansion": "- 继续观察并记录自己种的植物，看看它们发生了哪些变化？\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p12.webp", "p13.webp", "p14.webp"], "raw_text": "### [第 12 页]\n\n![第 12 页教学插图与实验活动](figures/p12.png)\n\n## 4. 给植物画张“像”\n\n面对金黄灿烂的向日葵花田，人们经常给植物拍照或画像。\n\n#### 🎯 聚焦\n\n怎样画植物才真实？\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g01_s1_u01_l04.html)\n\n- 🍂 **微观生理学（叶绿素与落叶机理）**：为什么秋天树叶会变黄变红？叶片中含有叶绿素、类胡萝卜素和花青素。气温下降、日照缩短时，植物为了保留养分，叶柄基部产生离层阻断水分输送，叶绿素迅速分解，原本被掩盖的类胡萝卜素（黄）与花青素（红）便显现出来！\n- 📐 **几何结构与功能相适应**：植物叶片扁平且相互错开排列（叶镶嵌现象），这是为了以最小的空间占用，实现最大面积的阳光捕获（光拦截率最大化）。\n\n---\n\n### [第 13 页]\n\n![第 13 页教学插图与实验活动](figures/p13.png)\n\n#### 🔬 探索\n\n**1. 观察植物的主要特点**\n\n- 观察吊兰：具有长长的、垂挂下来的细长叶片。\n\n**2. 我们给植物画张“像”**\n\n- **画“像”的要求**：\n  - ① 写出它的名称。\n  - ② 画出它长在哪里（花盆、土壤中）。\n  - ③ 画出它的样子和特有特征。\n\n---\n\n### [第 14 页]\n\n![第 14 页教学插图与实验活动](figures/p14.png)\n\n#### 📝 记录单：植物画像记录\n\n- **植物名称**：绿萝（或吊兰、月季）\n- **记录日期**：____月____日\n- **记录框**：按照原样画出植物的茎长、叶片形状与盆栽特征。\n\n#### 💬 研讨\n\n1. 我们画出这棵植物的特点了吗？别人能认出来吗？\n2. 我们家里种了哪些植物？应该怎样爱护它们？\n\n#### 🚀 拓展\n\n- 继续观察并记录自己种的植物，看看它们发生了哪些变化？\n\n---"}, {"id": "sci_01_u01_l05", "lesson_idx": 5, "book": "一年级上册", "vol_dir": "01_一年级上册", "unit_no": 1, "unit_title": "第一单元 周围的植物", "lesson_no": 5, "title": "植物的变化", "page": 15, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g01_s1_u01_l05.html", "code": "g01_s1_u01_l05", "sections": {"focus": "我们种的植物发生了哪些变化？", "exploration": "**1. 观察我们种的植物**\n\n- 月季枝头长出了很多小花苞。\n- 水培绿豆苗根须伸长、茎干长高。", "discussion": "1. 植物在生长过程中会发生哪些变化？（长高、出芽、长叶、开花、颜色加深）。\n2. 我们是怎样照顾自己的植物的？（定期浇水、放在阳光充足通风处）。\n\n---", "expansion": "收集其他资料\n\n- **一棵大树的四季变化**：\n  - **春**：冬眠萌动，枝条抽出嫩绿的新芽。\n  - **夏**：枝繁叶茂，树冠宛如一把翠绿的巨伞。\n  - **秋**：树叶逐渐变黄变红，秋风吹拂落叶纷飞。\n  - **冬**：叶片落尽，露出遒劲的枝干在寒冬蓄力。\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p15.webp", "p16.webp", "p17.webp"], "raw_text": "### [第 15 页]\n\n![第 15 页教学插图与实验活动](figures/p15.png)\n\n## 5. 植物的变化\n\n“我种的绿豆变成了小苗，大蒜长出了叶片。”\n\n#### 🎯 聚焦\n\n我们种的植物发生了哪些变化？\n\n#### 🔬 探索\n\n**1. 观察我们种的植物**\n\n- 月季枝头长出了很多小花苞。\n- 水培绿豆苗根须伸长、茎干长高。\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g01_s1_u01_l05.html)\n\n- ⏳ **植物生物钟与光周期现象**：植物能精准“感知”时间。科学家发现植物细胞内有一种光敏色素（Phytochrome），如同植物的“光开关”，根据每日日照长短（光周期）精准决定是在春季抽薹开花，还是在秋季落叶休眠。\n- 📊 **科学记录单演进（从图画到量化曲线）**：从达尔文对植物向光弯曲的延时草图，到现代科学家使用延时摄影与高光谱成像仪，科学记录的核心是捕捉“在时间维度上的不可逆演化”。\n\n---\n\n### [第 16 页]\n\n![第 16 页教学插图与实验活动](figures/p16.png)\n\n**2. 展示我们的观察记录**\n\n- **绿豆苗的连续变化**：\n  - 发芽后第 1 天：种子吸水膨大破皮，露出嫩芽。\n  - 发芽后第 3 天：嫩芽向上挺拔，长出细嫩叶片。\n  - 发芽后第 5 天：长成青翠的小苗，叶片完全展开。\n- **大蒜的连续变化**：\n  - 发芽后第 1 天：蒜瓣顶端微泛青绿。\n  - 发芽后第 3 天：抽出一寸嫩绿的蒜苗。\n  - 发芽后第 5 天：蒜苗粗壮长高，分出双叶。\n\n#### 💬 研讨\n\n1. 植物在生长过程中会发生哪些变化？（长高、出芽、长叶、开花、颜色加深）。\n2. 我们是怎样照顾自己的植物的？（定期浇水、放在阳光充足通风处）。\n\n---\n\n### [第 17 页]\n\n![第 17 页教学插图与实验活动](figures/p17.png)\n\n#### 📝 班级记录单：植物的变化和需要\n\n- **日期**：____月____日\n- **植物的变化**：会长大、会长叶、会开花结果。\n- **植物的需要**：需要浇水、需要阳光、需要空气……\n\n#### 🚀 拓展：收集其他资料\n\n- **一棵大树的四季变化**：\n  - **春**：冬眠萌动，枝条抽出嫩绿的新芽。\n  - **夏**：枝繁叶茂，树冠宛如一把翠绿的巨伞。\n  - **秋**：树叶逐渐变黄变红，秋风吹拂落叶纷飞。\n  - **冬**：叶片落尽，露出遒劲的枝干在寒冬蓄力。\n\n---"}, {"id": "sci_01_u01_l06", "lesson_idx": 6, "book": "一年级上册", "vol_dir": "01_一年级上册", "unit_no": 1, "unit_title": "第一单元 周围的植物", "lesson_no": 6, "title": "校园里的植物", "page": 18, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g01_s1_u01_l06.html", "code": "g01_s1_u01_l06", "sections": {"focus": "校园里有哪些植物？\n\n> 💡 **文明观察提示**：观察时要爱护植物，不拔起、不采摘、不伤害植物！", "exploration": "**1. 观察、认识校园里的植物**\n\n- **准备工作**：带好记录夹、纸和笔。\n- ⚠️ **安全提醒**：观察时不要靠近池塘和电线！\n\n**2. 把找到的植物用图画记录在表格中**", "discussion": "1. 我们观察、认识了校园里的哪些植物？\n2. 我们有哪些新发现？遇到了哪些新问题？", "expansion": "- 和家人一起到菜市场或田野里，认识常见的蔬菜、水果。\n\n---", "frontier": "", "big_concept": "植物的每一处器官形态均是自然选择的精妙杰作——扁平叶片最大化受光面积，维管束导管利用水分子毛细吸力将矿物质逆重力泵送百米树梢，根系向地性确保了机械固定与深层水源汲取。", "misconception": ""}, "figures": ["p18.webp", "p19.webp", "p20.webp", "p21.webp"], "raw_text": "### [第 18 页]\n\n![第 18 页教学插图与实验活动](figures/p18.png)\n\n## 6. 校园里的植物\n\n校园里有很多植物，有的是高大的树木，有的是矮小的花草。\n\n#### 🎯 聚焦\n\n校园里有哪些植物？\n\n> 💡 **文明观察提示**：观察时要爱护植物，不拔起、不采摘、不伤害植物！\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿生物工程（太空诱变育种与人工合成淀粉）**：中国空间站已成功开展水稻从种子到种子的全生命周期空间培养；中科院科研人员更在全球首次实现了从二氧化碳到淀粉的无细胞人工化学全合成，极大拓宽了光合作用的理论边界！\n- 🧠 **跨学科大概念（结构与功能相适应）**：植物的每一处器官形态均是自然选择的精妙杰作——扁平叶片最大化受光面积，维管束导管利用水分子毛细吸力将矿物质逆重力泵送百米树梢，根系向地性确保了机械固定与深层水源汲取。\n- ⚠️ 许多小学生认为“植物生长所需要的泥土全部被植物‘吃’进了肚子里”。**科学真相**：经典的凡·海尔蒙特柳树实验表明，植物增重的绝大部分干物质并非来自土壤，而是通过光合作用“抓取”空气中的二氧化碳分子同化而成的有机碳链！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g01_s1_u01_l06.html)\n\n---\n\n### [第 19 页]\n\n![第 19 页教学插图与实验活动](figures/p19.png)\n\n#### 🔬 探索\n\n**1. 观察、认识校园里的植物**\n\n- **准备工作**：带好记录夹、纸和笔。\n- ⚠️ **安全提醒**：观察时不要靠近池塘和电线！\n\n**2. 把找到的植物用图画记录在表格中**\n\n#### 📝 记录单：校园里的植物\n\n- **日期**：____月____日\n\n| 序号 | 我找到的植物图画 | 植物名称（如桂花、香樟、三叶草） |\n| :---: | :--- | :--- |\n| **①** | ____________________ | ____________________ |\n| **②** | ____________________ | ____________________ |\n| **③** | ____________________ | ____________________ |\n\n- **统计**：我认识校园里的（ ____ ）种植物。\n\n**3. 交流我们的发现**。\n\n---\n\n### [第 20 页]\n\n![第 20 页教学插图与实验活动](figures/p20.png)\n\n#### 💬 研讨\n\n1. 我们观察、认识了校园里的哪些植物？\n2. 我们有哪些新发现？遇到了哪些新问题？\n\n#### 🚀 拓展\n\n- 和家人一起到菜市场或田野里，认识常见的蔬菜、水果。\n\n---\n\n### [第 21 页]\n\n![第 21 页教学插图与实验活动](figures/p21.png)"}, {"id": "sci_01_u02_l01", "lesson_idx": 7, "book": "一年级上册", "vol_dir": "01_一年级上册", "unit_no": 2, "unit_title": "第二单元 我们自己", "lesson_no": 1, "title": "我们的身体", "page": 26, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g01_s1_u02_l01.html", "code": "g01_s1_u02_l01", "sections": {"focus": "我们的身体包括哪些部分？", "exploration": "**1. 做一做，认识我们的身体**\n\n- **听一听**：\n  - 贴在肚子上：“我听到咕噜的声音。”\n  - 贴在背部：“我听到呼吸的声音。”\n- **看一看**：让光透过手指，观察皮肤与血肉透光。\n- **摸一摸**：用手捏一捏手指、手臂，摸里面的骨头。\n\n**2. 观察我们的身体，用画图的方式记录下来**\n\n- **左右对称观察**：用纸板挡住身体的一半，观察发现——“被遮住的一半和露出的一半是一样的。”（人体外形具有左右对称性）\n- **主要部位标注**：\n  - **头**\n  - **颈**\n  - **躯干**\n  - **四肢**\n\n---", "discussion": "1. 我们的身体从上到下有哪几部分？\n2. 与小猫、小狗相比，我们的身体有什么不同？", "expansion": "- 想知道我们身体内部是什么样的吗？\n- **科学建议**：阅读科普书是一种很好的方法。\n\n---", "frontier": "", "big_concept": "人体外表呈现奇妙的“两侧轴对称”，这赋予了我们稳定的双眼立体视觉、双耳声源定位以及奔跑时的动态平衡。", "misconception": "“手和脚属于不同的系统吗？”科学真相：手和脚都属于人体的“四肢”，其底层骨骼构造（上肢与下肢的长骨、关节与韧带）遵循相同的解剖演化蓝图。\n\n---"}, "figures": ["p26.webp", "p27.webp", "p28.webp"], "raw_text": "### [第 26 页]\n\n![第 26 页教学插图与实验活动](figures/p26.png)\n\n## 1. 我们的身体\n\n我们在锻炼身体。\n\n#### 🎯 聚焦\n\n我们的身体包括哪些部分？\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g01_s1_u02_l01.html)\n- 🤖 **前沿科技（仿生人形机器人与外骨骼）**：科学家通过研究人体头、颈、躯干和四肢的铰链关节与肌肉动力学，研发出了医疗康复外骨骼与具身智能人形机器人（如特斯拉擎天柱、波士顿动力），模拟人类双足直立行走与双手灵巧抓握！\n- 🧠 **跨学科大概念（结构与对称性）**：人体外表呈现奇妙的“两侧轴对称”，这赋予了我们稳定的双眼立体视觉、双耳声源定位以及奔跑时的动态平衡。\n- ⚠️ **前概念迷思纠偏**：“手和脚属于不同的系统吗？”科学真相：手和脚都属于人体的“四肢”，其底层骨骼构造（上肢与下肢的长骨、关节与韧带）遵循相同的解剖演化蓝图。\n\n---\n\n### [第 27 页]\n\n![第 27 页教学插图与实验活动](figures/p27.png)\n\n#### 🔬 探索\n\n**1. 做一做，认识我们的身体**\n\n- **听一听**：\n  - 贴在肚子上：“我听到咕噜的声音。”\n  - 贴在背部：“我听到呼吸的声音。”\n- **看一看**：让光透过手指，观察皮肤与血肉透光。\n- **摸一摸**：用手捏一捏手指、手臂，摸里面的骨头。\n\n**2. 观察我们的身体，用画图的方式记录下来**\n\n- **左右对称观察**：用纸板挡住身体的一半，观察发现——“被遮住的一半和露出的一半是一样的。”（人体外形具有左右对称性）\n- **主要部位标注**：\n  - **头**\n  - **颈**\n  - **躯干**\n  - **四肢**\n\n---\n\n### [第 28 页]\n\n![第 28 页教学插图与实验活动](figures/p28.png)\n\n#### 📝 记录单：我的身体\n\n- **日期**：____月____日\n- **记录方式**：画出自己的身体轮廓，并用箭头标出主要部位。\n- **身体四个主要组成部分**：\n  - 顶部：**头**\n  - 连接部：**颈**\n  - 中部：**躯干**\n  - 运动部位：**四肢**（左手、右手、左腿、右腿）\n\n#### 💬 研讨\n\n1. 我们的身体从上到下有哪几部分？\n2. 与小猫、小狗相比，我们的身体有什么不同？\n\n#### 🚀 拓展\n\n- 想知道我们身体内部是什么样的吗？\n- **科学建议**：阅读科普书是一种很好的方法。\n\n---"}, {"id": "sci_01_u02_l02", "lesson_idx": 8, "book": "一年级上册", "vol_dir": "01_一年级上册", "unit_no": 2, "unit_title": "第二单元 我们自己", "lesson_no": 2, "title": "发现生长", "page": 29, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g01_s1_u02_l02.html", "code": "g01_s1_u02_l02", "sections": {"focus": "有哪些事物能证明我们在长大呢？", "exploration": "**1. 找出能证明我们在长大的事物**\n\n- **穿过的衣服变小了**：婴儿连体衣 ➔ 幼儿运动服 ➔ 小学生校服（“我那时还不会走路。”）\n- **从小到大的照片**：婴儿期爬行 ➔ 幼儿期学步 ➔ 小学生背上书包奔跑\n- **牙齿的变化**：乳牙脱落换牙 ➔ 恒牙长出整齐排列\n\n---", "discussion": "1. 我们找到的哪些事物，可以证明我们在长大？\n2. 我们怎样证明小猫、小狗在长大？", "expansion": "- 画一画动物或植物生长变化的证据。\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p29.webp", "p30.webp", "p31.webp"], "raw_text": "### [第 29 页]\n\n![第 29 页教学插图与实验活动](figures/p29.png)\n\n## 2. 发现生长\n\n我们在不知不觉中就长大了。\n\n#### 🎯 聚焦\n\n有哪些事物能证明我们在长大呢？\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g01_s1_u02_l02.html)\n- 🧬 **发育生物学（DNA与细胞生长）**：人体为什么会“长高”？这是因为骨骼两端的“骨骺软骨板”在生长激素刺激下，软骨细胞不断分裂、骨化，使长骨持续延长，这一切受到细胞核内遗传密码（DNA）的精密调控。\n- 📊 **医学前沿（儿童生长曲线与百分位）**：世界卫生组织（WHO）制定了标准的儿童年龄-身高-体重百分位曲线图，科学家用统计分布监控营养状况与发育节律。\n\n---\n\n### [第 30 页]\n\n![第 30 页教学插图与实验活动](figures/p30.png)\n\n#### 🔬 探索\n\n**1. 找出能证明我们在长大的事物**\n\n- **穿过的衣服变小了**：婴儿连体衣 ➔ 幼儿运动服 ➔ 小学生校服（“我那时还不会走路。”）\n- **从小到大的照片**：婴儿期爬行 ➔ 幼儿期学步 ➔ 小学生背上书包奔跑\n- **牙齿的变化**：乳牙脱落换牙 ➔ 恒牙长出整齐排列\n\n---\n\n### [第 31 页]\n\n![第 31 页教学插图与实验活动](figures/p31.png)\n\n**2. 选一个证据画下来**\n\n#### 📝 记录单：长大的证据\n\n- **日期**：____月____日\n- **记录方式**：画出自己长大的证据。\n- **参考证据示例**：\n  - **证据一（身高增长）**：在墙壁/门框上测量身高，刻度线越来越高（长高了）。\n  - **证据二（力量增强）**：3 岁时力气小，6 岁时能提起更重的物品（长大更有力气了）。\n\n#### 💬 研讨\n\n1. 我们找到的哪些事物，可以证明我们在长大？\n2. 我们怎样证明小猫、小狗在长大？\n\n#### 🚀 拓展\n\n- 画一画动物或植物生长变化的证据。\n\n---"}, {"id": "sci_01_u02_l03", "lesson_idx": 9, "book": "一年级上册", "vol_dir": "01_一年级上册", "unit_no": 2, "unit_title": "第二单元 我们自己", "lesson_no": 3, "title": "游戏中的观察", "page": 32, "domain": "general_science", "domain_cn": "综合科学探究", "sim_file": "sim_g01_s1_u02_l03.html", "code": "g01_s1_u02_l03", "sections": {"focus": "我们在游戏中会用到哪些感觉器官？", "exploration": "试一试，用下面三种方法玩“抓尺子”游戏。\n\n> **提示**：每人做 5 次及以上，看一看有几次能抓住尺子。\n\n1. **方法一：蒙住眼睛抓**（纯凭手感摸）。\n2. **方法二：蒙住眼睛，听口令抓**（对方喊“放！”的瞬间抓，使用听觉器官）。\n3. **方法三：睁着眼睛，听口令抓**（眼看尺子下落并听口令，视觉+听觉协同）。\n\n---", "discussion": "1. 在游戏中，我们用到了哪些感觉器官？\n2. 哪种方法抓尺子比较容易，为什么？（方法三最容易，因为眼睛和耳朵多种感官协同配合，反应更快）。", "expansion": "- 玩一玩其他游戏（如“翻拍手游戏”），说一说感觉器官是怎样帮助我们的。\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p32.webp", "p33.webp", "p34.webp"], "raw_text": "### [第 32 页]\n\n![第 32 页教学插图与实验活动](figures/p32.png)\n\n## 3. 游戏中的观察\n\n在草地上玩“老鹰捉小鸡”和“抓人”游戏：\n- “看，他在那里！”\n- “听，她过来啦！”\n- “哈哈，我抓到你啦！”\n\n#### 🎯 聚焦\n\n我们在游戏中会用到哪些感觉器官？\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g01_s1_u02_l03.html)\n- ⚡ **神经科学（反射弧与反应时）**：当我们抓尺子时，眼睛接收视觉光信号 $\to$ 视神经传导至大脑皮层 $\to$ 脊髓运动神经元发送神经冲动 $\to$ 手指屈肌收缩。整个神经电信号传导一般需要 0.15~0.25 秒，通过长期体育锻炼可以缩短神经突触延搁！\n\n---\n\n### [第 33 页]\n\n![第 33 页教学插图与实验活动](figures/p33.png)\n\n#### 🔬 探索\n\n试一试，用下面三种方法玩“抓尺子”游戏。\n\n> **提示**：每人做 5 次及以上，看一看有几次能抓住尺子。\n\n1. **方法一：蒙住眼睛抓**（纯凭手感摸）。\n2. **方法二：蒙住眼睛，听口令抓**（对方喊“放！”的瞬间抓，使用听觉器官）。\n3. **方法三：睁着眼睛，听口令抓**（眼看尺子下落并听口令，视觉+听觉协同）。\n\n---\n\n### [第 34 页]\n\n![第 34 页教学插图与实验活动](figures/p34.png)\n\n#### 📝 记录单：我抓住的次数\n\n- **日期**：____月____日\n- **活动说明**：记录用每种方法抓住尺子的次数。\n\n| 使用的方法 | 方法一（蒙眼抓） | 方法二（蒙眼听口令） | 方法三（睁眼听口令） |\n| :--- | :---: | :---: | :---: |\n| **抓住的次数** | ____ 次 | ____ 次 | ____ 次 |\n\n#### 💬 研讨\n\n1. 在游戏中，我们用到了哪些感觉器官？\n2. 哪种方法抓尺子比较容易，为什么？（方法三最容易，因为眼睛和耳朵多种感官协同配合，反应更快）。\n\n#### 🚀 拓展\n\n- 玩一玩其他游戏（如“翻拍手游戏”），说一说感觉器官是怎样帮助我们的。\n\n---"}, {"id": "sci_01_u02_l04", "lesson_idx": 10, "book": "一年级上册", "vol_dir": "01_一年级上册", "unit_no": 2, "unit_title": "第二单元 我们自己", "lesson_no": 4, "title": "气味告诉我们", "page": 35, "domain": "general_science", "domain_cn": "综合科学探究", "sim_file": "sim_g01_s1_u02_l04.html", "code": "g01_s1_u02_l04", "sections": {"focus": "鼻子能够让我们区分不同的物品吗？", "exploration": "1. **闻一闻这些物品的气味**：\n   - 花椒（辛香味）\n   - 大蒜（刺激性蒜味）\n   - 棉花（无明显气味，空白对照）\n   - 洋葱（呛鼻辣味）\n2. **把这些物品分别装到布袋里，封住口，打乱顺序**。\n3. **我们能闻出布袋里装的是什么吗？**（同伴之间相互递布袋闻嗅测试）。\n\n---", "discussion": "1. 通过闻气味，我们都判断对了吗？\n2. 如果可以再选择一种感觉器官帮忙，除了眼睛，我们会选择哪种？说一说理由。（例如：选择用手摸一摸颗粒和质感，触觉辅助辨识）。", "expansion": "- 与家长一起做游戏，闭眼尝一尝几种水果切片，判断是什么水果。（舌头味觉器官）。\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p35.webp", "p36.webp", "p37.webp"], "raw_text": "### [第 35 页]\n\n![第 35 页教学插图与实验活动](figures/p35.png)\n\n## 4. 气味告诉我们\n\n闻到餐桌上丰盛的美食：\n- “好香呀！这是食物发出的气味。”\n\n#### 🎯 聚焦\n\n鼻子能够让我们区分不同的物品吗？\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g01_s1_u02_l04.html)\n- 📡 **仿生雷达与双耳声差效应**：我们闭上眼睛也能听出声音在左还是在右，这是因为声波到达双耳存在微小的“时间差（ITD）”和“强度差（IID）”，大脑脑干神经核据此精准计算出声源空间坐标！\n\n---\n\n### [第 36 页]\n\n![第 36 页教学插图与实验活动](figures/p36.png)\n\n#### 🔬 探索\n\n1. **闻一闻这些物品的气味**：\n   - 花椒（辛香味）\n   - 大蒜（刺激性蒜味）\n   - 棉花（无明显气味，空白对照）\n   - 洋葱（呛鼻辣味）\n2. **把这些物品分别装到布袋里，封住口，打乱顺序**。\n3. **我们能闻出布袋里装的是什么吗？**（同伴之间相互递布袋闻嗅测试）。\n\n---\n\n### [第 37 页]\n\n![第 37 页教学插图与实验活动](figures/p37.png)\n\n#### 📝 记录单：我能闻出来\n\n- **日期**：____月____日\n\n| 布袋编号 | 我的观察（闻出的物品） | 正确结果（揭晓答案） |\n| :---: | :---: | :---: |\n| **1** | ____________ | ____________ |\n| **2** | ____________ | ____________ |\n| **3** | ____________ | ____________ |\n| **4** | ____________ | ____________ |\n\n#### 💬 研讨\n\n1. 通过闻气味，我们都判断对了吗？\n2. 如果可以再选择一种感觉器官帮忙，除了眼睛，我们会选择哪种？说一说理由。（例如：选择用手摸一摸颗粒和质感，触觉辅助辨识）。\n\n#### 🚀 拓展\n\n- 与家长一起做游戏，闭眼尝一尝几种水果切片，判断是什么水果。（舌头味觉器官）。\n\n---"}, {"id": "sci_01_u02_l05", "lesson_idx": 11, "book": "一年级上册", "vol_dir": "01_一年级上册", "unit_no": 2, "unit_title": "第二单元 我们自己", "lesson_no": 5, "title": "通过感官来发现", "page": 38, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g01_s1_u02_l05.html", "code": "g01_s1_u02_l05", "sections": {"focus": "当我们观察时，各种感官分别能告诉我们什么信息？", "exploration": "1. **到校园中，用多种感觉器官观察花园或者绿地**。\n2. **整理我们的观察记录，并画下来**。", "discussion": "1. 我们观察到了哪些信息？\n2. 反复观察会得到更多信息吗？", "expansion": "保护我们的感觉器官\n\n感觉器官很容易受到伤害，我们要注视保护它们：\n\n- **眼睛的保护**：\n  - 不要看强光\n  - 不随意揉眼睛\n  - 多做户外运动\n- **鼻子的保护**：\n  - 不用力擤鼻\n  - 不随意抠鼻孔\n  - 保持鼻腔清洁\n- **耳朵的保护**：\n  - 保持耳道干燥\n  - 不随意掏耳朵\n  - 不长时间戴耳机\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p38.webp", "p39.webp", "p40.webp"], "raw_text": "### [第 38 页]\n\n![第 38 页教学插图与实验活动](figures/p38.png)\n\n## 5. 通过感官来发现\n\n我们用眼睛、耳朵、鼻子、舌头和皮肤等感觉器官进行观察。\n- **眼睛看**：阅读书本、观察花纹与颜色。\n- **耳朵听**：侧耳倾听鸟鸣与脚步声。\n- **手摸、鼻闻**：手摸苹果表皮光滑度，鼻子闻苹果清香。\n- **舌尝**：品尝食物的味道。\n\n> ⚠️ **安全提醒**：不要随意闻或尝陌生的物品！\n\n#### 🎯 聚焦\n\n当我们观察时，各种感官分别能告诉我们什么信息？\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g01_s1_u02_l05.html)\n- 🔬 **触觉感受器与电子皮肤**：人体指尖每平方厘米密布着数百个触觉感受器（麦斯纳小体、帕西尼小体）。现代仿生科学家正在开发具有高灵敏压电传感的“电子人工皮肤”，让义肢截肢患者重新感知温度和粗糙度。\n\n---\n\n### [第 39 页]\n\n![第 39 页教学插图与实验活动](figures/p39.png)\n\n#### 🔬 探索\n\n1. **到校园中，用多种感觉器官观察花园或者绿地**。\n2. **整理我们的观察记录，并画下来**。\n\n#### 📝 记录单：校园观察记录\n\n- **日期**：____月____日\n- **活动要求**：把看到的、听到的或闻到的，选择两种画下来。\n\n---\n\n### [第 40 页]\n\n![第 40 页教学插图与实验活动](figures/p40.png)\n\n#### 💬 研讨\n\n1. 我们观察到了哪些信息？\n2. 反复观察会得到更多信息吗？\n\n#### 🚀 拓展：保护我们的感觉器官\n\n感觉器官很容易受到伤害，我们要注视保护它们：\n\n- **眼睛的保护**：\n  - 不要看强光\n  - 不随意揉眼睛\n  - 多做户外运动\n- **鼻子的保护**：\n  - 不用力擤鼻\n  - 不随意抠鼻孔\n  - 保持鼻腔清洁\n- **耳朵的保护**：\n  - 保持耳道干燥\n  - 不随意掏耳朵\n  - 不长时间戴耳机\n\n---"}, {"id": "sci_01_u02_l06", "lesson_idx": 12, "book": "一年级上册", "vol_dir": "01_一年级上册", "unit_no": 2, "unit_title": "第二单元 我们自己", "lesson_no": 6, "title": "观察与比较", "page": 41, "domain": "general_science", "domain_cn": "综合科学探究", "sim_file": "sim_g01_s1_u02_l06.html", "code": "g01_s1_u02_l06", "sections": {"focus": "怎样做到不用品尝，就可以知道水里酱油的多少呢？", "exploration": "1. **按照颜色深浅，给这三杯酱油水排序**。（从浅到深排序）。", "discussion": "1. 我们是怎样比较酱油水颜色深浅的？（用眼睛看颜色的深浅透明度）。\n2. 在配制酱油水的过程中，我们使用了哪些感觉器官？（眼睛观察颜色、手指控制滴管）。", "expansion": "- 配制一杯酱油水，让它排在 1 号杯和 3 号杯之间。（思考：滴入的酱油滴数介于两者之间即可）。\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p41.webp", "p42.webp", "p43.webp"], "raw_text": "### [第 41 页]\n\n![第 41 页教学插图与实验活动](figures/p41.png)\n\n## 6. 观察与比较\n\n在菜汤里放适量的酱油，可以使味道更鲜美。\n\n#### 🎯 聚焦\n\n怎样做到不用品尝，就可以知道水里酱油的多少呢？\n\n#### 🔬 探索\n\n1. **按照颜色深浅，给这三杯酱油水排序**。（从浅到深排序）。\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g01_s1_u02_l06.html)\n- 🌐 **多模态感知融合（Sensor Fusion）**：人类感知世界并非单一器官工作，而是大脑多模态信息融合的结果。自动驾驶汽车也是如此：同时配备激光雷达（眼睛）、超声波传感器（耳朵）和惯性导航（内耳前庭），综合决策行驶安全。\n\n---\n\n### [第 42 页]\n\n![第 42 页教学插图与实验活动](figures/p42.png)\n\n2. **根据排序，给杯子编号**。\n3. **我们也试着配制出三杯颜色深浅不同的酱油水**。\n\n#### 📝 记录单：我的配制方法\n\n- **日期**：____月____日\n- **实验材料**：3 个杯子、滴管、水、酱油（也可以用其他实验材料）。\n- **配制步骤记录**：\n  - 1 号杯（颜色最浅）：倒入清水，加入少量酱油（如 1 滴）。\n  - 2 号杯（颜色居中）：倒入清水，加入中量酱油（如 5 滴）。\n  - 3 号杯（颜色最深）：倒入清水，加入较多酱油（如 15 滴）。\n\n---\n\n### [第 43 页]\n\n![第 43 页教学插图与实验活动](figures/p43.png)\n\n#### 💬 研讨\n\n1. 我们是怎样比较酱油水颜色深浅的？（用眼睛看颜色的深浅透明度）。\n2. 在配制酱油水的过程中，我们使用了哪些感觉器官？（眼睛观察颜色、手指控制滴管）。\n\n#### 🚀 拓展\n\n- 配制一杯酱油水，让它排在 1 号杯和 3 号杯之间。（思考：滴入的酱油滴数介于两者之间即可）。\n\n---"}, {"id": "sci_01_u02_l07", "lesson_idx": 13, "book": "一年级上册", "vol_dir": "01_一年级上册", "unit_no": 2, "unit_title": "第二单元 我们自己", "lesson_no": 7, "title": "做个“时间胶囊”", "page": 44, "domain": "general_science", "domain_cn": "综合科学探究", "sim_file": "sim_g01_s1_u02_l07.html", "code": "g01_s1_u02_l07", "sections": {"focus": "做个“时间胶囊”，把我们的身体信息装进去，到六年级时再打开。", "exploration": "", "discussion": "1. **六年级的时候，我们会是什么样呢？**\n   - “像六年级的姐姐一样高。”\n   - “像六年级的哥哥一样有力量。”\n2. **在这个“时间胶囊”里，我们需要装进哪些信息？**\n   - （胶囊里通常装的是药。“时间胶囊”里装的是成长信息。）\n3. **我们要注视什么才能健康长大？**\n   - 均衡膳食营养、充足睡眠、积极参加体育锻炼。\n   - 定期测量身高、体重。\n\n---", "expansion": "- 整理我们在本单元的记录，把它们编成一本小册子保存起来。\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p44.webp", "p45.webp", "p46.webp", "p47.webp"], "raw_text": "### [第 44 页]\n\n![第 44 页教学插图与实验活动](figures/p44.png)\n\n## 7. 做个“时间胶囊”\n\n“长大后就可以放风筝了！”\n\n#### 🎯 任务\n\n做个“时间胶囊”，把我们的身体信息装进去，到六年级时再打开。\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g01_s1_u02_l07.html)\n- 🔭 **工具是人类感官的延伸**：人类肉眼看不见纳米级病毒，显微镜成为“眼睛的延伸”；听不到极微弱的心音，听诊器与超声探头成为“耳朵的延伸”。科学仪器极大拓展了人类认知的边界！\n\n---\n\n### [第 45 页]\n\n![第 45 页教学插图与实验活动](figures/p45.png)\n\n#### 💬 研讨\n\n1. **六年级的时候，我们会是什么样呢？**\n   - “像六年级的姐姐一样高。”\n   - “像六年级的哥哥一样有力量。”\n2. **在这个“时间胶囊”里，我们需要装进哪些信息？**\n   - （胶囊里通常装的是药。“时间胶囊”里装的是成长信息。）\n3. **我们要注视什么才能健康长大？**\n   - 均衡膳食营养、充足睡眠、积极参加体育锻炼。\n   - 定期测量身高、体重。\n\n---\n\n### [第 46 页]\n\n![第 46 页教学插图与实验活动](figures/p46.png)\n\n#### 🛠️ 制作\n\n做个“时间胶囊”，装进我们现在的身体信息和推测的六年级时的身体信息，封存起来。\n\n#### 📝 “时间胶囊”里的身体信息\n\n- **日期**：____月____日\n- **记录指标对比**：\n  - **现在的我（一年级）**：\n    - 身高：____ 厘米（示例：119 厘米）\n    - 体重：____ 千克（示例：20 千克）\n    - 50米跑成绩：____ 秒（示例：10.1 秒）\n    - 1分钟跳绳：____ 个（示例：128 个）\n  - **六年级的我（我的推测）**：\n    - 推测身高：____ 厘米（示例：148 厘米）\n    - 推测体重：____ 千克（示例：41 千克）\n    - 推测50米跑：____ 秒（示例：8.8 秒）\n    - 推测1分钟跳绳：____ 个（示例：180 个）\n\n> **提示**：也可以用透明小塑料瓶代替胶囊密封存放。\n\n#### 🚀 拓展\n\n- 整理我们在本单元的记录，把它们编成一本小册子保存起来。\n\n---\n\n### [第 47 页]\n\n![第 47 页教学插图与实验活动](figures/p47.png)"}, {"id": "sci_02_u01_l01", "lesson_idx": 14, "book": "一年级下册", "vol_dir": "02_一年级下册", "unit_no": 1, "unit_title": "第一单元 身边的物体", "lesson_no": 1, "title": "观察物体的特征", "page": 2, "domain": "general_science", "domain_cn": "综合科学探究", "sim_file": "sim_g02_s2_u01_l01.html", "code": "g02_s2_u01_l01", "sections": {"focus": "我们怎样观察和描述这 9 个物体的特征呢？", "exploration": "> 💡 **科学词汇**：**特征**\n\n**1. 从上一页 9 个物体中选择一个进行观察并描述**。\n\n**2. 和其他物体比一比，观察它的更多特征**：\n- **从哪些方面比较？**\n  - **看一看**：比颜色、大小、形状。\n  - **摸一摸**：比软硬、厚薄、表面光滑还是粗糙。\n  - **掂一掂**：比轻重。\n  - **闻一闻**：闻一闻有没有气味。\n- **对话辩析**：\n  - 同学甲：“这个玩具很漂亮。”\n  - 同学乙：“漂亮是个人的喜好，**漂亮不是物体的科学特征**。”\n\n**3. 把观察到的物体的特征圈出来**。\n> 提示：颜色、形状、大小、软硬、轻重等，都是物体的特征。\n\n---", "discussion": "1. 我们是怎样观察这些物体的？（综合运用眼看、手摸、手掂、鼻闻等多感官进行比较）。\n2. 我们用了哪些词语描述物体的特征？（颜色、形状、软硬、轻重、厚薄、粗糙与光滑）。", "expansion": "猜一猜\n\n我们可以通过哪些特征猜到这个物体呢？\n\n> **谜面**：  \n> 圆圆身体皮儿薄，  \n> 光光滑滑身体轻。  \n> 桌面弹它蹦三尺，  \n> 往左往右撞不坏。  \n>  \n> （**谜底**：**乒乓球**）\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p02.webp", "p03.webp", "p04.webp"], "raw_text": "### [第 2 页]\n\n![第 2 页教学插图与实验活动](figures/p02.png)\n\n## 1. 观察物体的特征\n\n身边的物体各有各的特征。\n\n**观察桌面上的 9 个常见物体**：\n1. 小木块\n2. 作业本\n3. 红砖\n4. 塑料笔筒\n5. 乒乓球\n6. 圆柱橡皮\n7. 长条橡皮\n8. 钢尺\n9. 塑料尺\n\n#### 🎯 聚焦\n\n我们怎样观察和描述这 9 个物体的特征呢？\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g02_s2_u01_l01.html)\n- 🧱 **凝聚态物理（物质宏观属性分类）**：科学家通过颜色、硬度、弹性、导热性等物理参数表征物质。固体分子紧密排列振动，具有固定形状；液体分子可相互滑动，具有流动性。\n\n---\n\n### [第 3 页]\n\n![第 3 页教学插图与实验活动](figures/p03.png)\n\n#### 🔬 探索\n\n> 💡 **科学词汇**：**特征**\n\n**1. 从上一页 9 个物体中选择一个进行观察并描述**。\n\n**2. 和其他物体比一比，观察它的更多特征**：\n- **从哪些方面比较？**\n  - **看一看**：比颜色、大小、形状。\n  - **摸一摸**：比软硬、厚薄、表面光滑还是粗糙。\n  - **掂一掂**：比轻重。\n  - **闻一闻**：闻一闻有没有气味。\n- **对话辩析**：\n  - 同学甲：“这个玩具很漂亮。”\n  - 同学乙：“漂亮是个人的喜好，**漂亮不是物体的科学特征**。”\n\n**3. 把观察到的物体的特征圈出来**。\n> 提示：颜色、形状、大小、软硬、轻重等，都是物体的特征。\n\n---\n\n### [第 4 页]\n\n![第 4 页教学插图与实验活动](figures/p04.png)\n\n#### 📝 记录单：描述物体的特征\n\n- **观察物体**：____________\n- **记录日期**：____月____日\n- **我发现，它具有以下特征（请在符合的选项上打“✓”或圈出）**：\n  - **颜色**：[ ] 有颜色  /  [ ] 无颜色\n  - **形状**：[ ] 方的  /  [ ] 圆的  /  [ ] 长条形\n  - **软硬**：[ ] 较软  /  [ ] 较硬\n  - **厚薄**：[ ] 较厚  /  [ ] 较薄\n  - **表面**：[ ] 光滑  /  [ ] 粗糙\n  - **其他特征**：________________________\n\n#### 💬 研讨\n\n1. 我们是怎样观察这些物体的？（综合运用眼看、手摸、手掂、鼻闻等多感官进行比较）。\n2. 我们用了哪些词语描述物体的特征？（颜色、形状、软硬、轻重、厚薄、粗糙与光滑）。\n\n#### 🚀 拓展：猜一猜\n\n我们可以通过哪些特征猜到这个物体呢？\n\n> **谜面**：  \n> 圆圆身体皮儿薄，  \n> 光光滑滑身体轻。  \n> 桌面弹它蹦三尺，  \n> 往左往右撞不坏。  \n>  \n> （**谜底**：**乒乓球**）\n\n---"}, {"id": "sci_02_u01_l02", "lesson_idx": 15, "book": "一年级下册", "vol_dir": "02_一年级下册", "unit_no": 1, "unit_title": "第一单元 身边的物体", "lesson_no": 2, "title": "给物体分类", "page": 5, "domain": "general_science", "domain_cn": "综合科学探究", "sim_file": "sim_g02_s2_u01_l02.html", "code": "g02_s2_u01_l02", "sections": {"focus": "我们怎样对身边的物体进行分类呢？", "exploration": "> 💡 **科学词汇**：**分类**\n\n把前面观察过的 9 个物体分成两类。\n\n**1. 给每个物体编号**（写上数字 1~9 号卡片）。\n- *思考*：“编号有什么好处？”——编号便于记录，条理清晰，不易混淆。\n\n**2. 选择一个特征，对物体进行分类**。\n- *提示*：“观察同学的分类结果，猜一猜是按照什么特征分类的。”\n- *规则*：“必须严格按照选定的特征标准进行分类哟！”\n\n**3. 尝试按其他特征进行分类，并记录下来**。\n\n---", "discussion": "1. 我们可以根据物体的哪些特征分类？（形状、轻重、颜色、材质、软硬、是否容易滚动等）。\n2. 根据同一个特征分类，分类的结果会有不同吗？（单一明确的标准下，分类结果应该一致；分类标准不同，分组结果截然不同）。", "expansion": "- 看一看体育器材室里的器材是怎样分类摆放的。（大球类如篮球足球、小球类如羽毛球乒乓球、绳类如跳绳、垫类如体操垫）。\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p05.webp", "p06.webp", "p07.webp"], "raw_text": "### [第 5 页]\n\n![第 5 页教学插图与实验活动](figures/p05.png)\n\n## 2. 给物体分类\n\n市场里的蔬菜通常是分类摆放的（如黄瓜归一类、西红柿归一类、苦瓜归一类）。\n\n#### 🎯 聚焦\n\n我们怎样对身边的物体进行分类呢？\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g02_s2_u01_l02.html)\n- 🗂️ **信息科学（分类学与数据库算法）**：分类是科学研究的第一步。从林奈生物双名法分类，到现代人工智能将海量图像按特征向量聚类（Clustering），严谨的“单一分类标准”是科学逻辑的基石。\n\n---\n\n### [第 6 页]\n\n![第 6 页教学插图与实验活动](figures/p06.png)\n\n#### 🔬 探索\n\n> 💡 **科学词汇**：**分类**\n\n把前面观察过的 9 个物体分成两类。\n\n**1. 给每个物体编号**（写上数字 1~9 号卡片）。\n- *思考*：“编号有什么好处？”——编号便于记录，条理清晰，不易混淆。\n\n**2. 选择一个特征，对物体进行分类**。\n- *提示*：“观察同学的分类结果，猜一猜是按照什么特征分类的。”\n- *规则*：“必须严格按照选定的特征标准进行分类哟！”\n\n**3. 尝试按其他特征进行分类，并记录下来**。\n\n---\n\n### [第 7 页]\n\n![第 7 页教学插图与实验活动](figures/p07.png)\n\n#### 📝 记录单：给物体分类\n\n- **记录日期**：____月____日\n- **记录要求**：把同一类物体的编号填在同一个分类圈中。\n\n| 序号 | 我选择的分类特征标准 | 分类结果（第一组） | 分类结果（第二组） |\n| :---: | :--- | :--- | :--- |\n| **1** | **形状**（方形 vs 球形/圆柱） | 编号：[ 1, 2, 3, 7 ] | 编号：[ 5, 6, 8, 9 ] |\n| **2** | **材质**（木质/纸质 vs 塑料/金属） | 编号：[ ____________ ] | 编号：[ ____________ ] |\n| **3** | **软硬**（较软 vs 较硬） | 编号：[ ____________ ] | 编号：[ ____________ ] |\n\n#### 💬 研讨\n\n1. 我们可以根据物体的哪些特征分类？（形状、轻重、颜色、材质、软硬、是否容易滚动等）。\n2. 根据同一个特征分类，分类的结果会有不同吗？（单一明确的标准下，分类结果应该一致；分类标准不同，分组结果截然不同）。\n\n#### 🚀 拓展\n\n- 看一看体育器材室里的器材是怎样分类摆放的。（大球类如篮球足球、小球类如羽毛球乒乓球、绳类如跳绳、垫类如体操垫）。\n\n---"}, {"id": "sci_02_u01_l03", "lesson_idx": 16, "book": "一年级下册", "vol_dir": "02_一年级下册", "unit_no": 1, "unit_title": "第一单元 身边的物体", "lesson_no": 3, "title": "比较物体的轻重", "page": 8, "domain": "general_science", "domain_cn": "综合科学探究", "sim_file": "sim_g02_s2_u01_l03.html", "code": "g02_s2_u01_l03", "sections": {"focus": "我们怎样比较不同物体的轻重呢？", "exploration": "用不同的方法，将下列物体按轻重排序，将三次排序的结果记录下来。", "discussion": "1. 用三种方法得到的三次排序结果，哪一次更准确？（天平称一称最准确，能客观反映重力差，排除了体积视觉误导和手感主观误差）。\n2. 木块是较轻还是较重，怎样描述呢？（轻重是相对的：木块比乒乓球重，但比玻璃球轻）。", "expansion": "- 纸杯与塑料杯：两个杯子的形状、大小十分相似，哪个轻哪个重？怎样判断？（放入简易天平两端托盘中称一称即可分出轻重）。\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p08.webp", "p09.webp", "p10.webp"], "raw_text": "### [第 8 页]\n\n![第 8 页教学插图与实验活动](figures/p08.png)\n\n## 3. 比较物体的轻重\n\n用简易天平可以准确比较物体的轻重。\n\n#### 🎯 聚焦\n\n我们怎样比较不同物体的轻重呢？\n\n#### 🔬 探索\n\n用不同的方法，将下列物体按轻重排序，将三次排序的结果记录下来。\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g02_s2_u01_l03.html)\n- ⚖️ **质量与重力的本质区别**：物体的“轻重”在物理学中称为“质量”（物体含有物质的多少）。天平测的是质量，无论把天平带到地球还是月球，等臂天平的平衡状态永远不变！\n\n---\n\n### [第 9 页]\n\n![第 9 页教学插图与实验活动](figures/p09.png)\n\n**实验测试的 4 种物体**：\n- 玻璃球（体积小，密度大）\n- 乒乓球（体积大，内部空心，质量轻）\n- 空盒子（纸质大体积，空心）\n- 小木块（实心木质）\n\n**三种比较轻重的方法**：\n1. **猜一猜**：通过肉眼观察外观和大小进行直觉猜测。\n2. **掂一掂**：左右两手分别托住两个物体，用肌肉感受下压力量。\n3. **称一称**：使用简易天平，两端托盘各放一个物体，下沉的一端更重。\n\n---\n\n### [第 10 页]\n\n![第 10 页教学插图与实验活动](figures/p10.png)\n\n#### 📝 记录单：按轻重排序\n\n- **记录日期**：____月____日\n- **说明**：按从轻到重的顺序排列（填序号 1~4，1 最轻，4 最重）。\n\n| 物体名称 | 方法一：猜一猜 | 方法二：掂一掂 | 方法三：称一称（天平） |\n| :--- | :---: | :---: | :---: |\n| **玻璃球** | ____ | ____ | ____ |\n| **乒乓球** | ____ | ____ | ____ |\n| **空盒子** | ____ | ____ | ____ |\n| **小木块** | ____ | ____ | ____ |\n\n#### 💬 研讨\n\n1. 用三种方法得到的三次排序结果，哪一次更准确？（天平称一称最准确，能客观反映重力差，排除了体积视觉误导和手感主观误差）。\n2. 木块是较轻还是较重，怎样描述呢？（轻重是相对的：木块比乒乓球重，但比玻璃球轻）。\n\n#### 🚀 拓展\n\n- 纸杯与塑料杯：两个杯子的形状、大小十分相似，哪个轻哪个重？怎样判断？（放入简易天平两端托盘中称一称即可分出轻重）。\n\n---"}, {"id": "sci_02_u01_l04", "lesson_idx": 17, "book": "一年级下册", "vol_dir": "02_一年级下册", "unit_no": 1, "unit_title": "第一单元 身边的物体", "lesson_no": 4, "title": "认识物体的形状", "page": 11, "domain": "general_science", "domain_cn": "综合科学探究", "sim_file": "sim_g02_s2_u01_l04.html", "code": "g02_s2_u01_l04", "sections": {"focus": "生活中哪些形状的物体容易滚动？哪些容易稳定摆放？", "exploration": "> 💡 **科学词汇**：**稳定** · **滚动**\n\n1. **观察物体的形状**（从不同的面观察：立方体、球体、圆柱体、六棱柱等）。\n2. **在斜面上做滚动实验，并记录下来**（搭设平缓斜面，轻放物体观察是滑动还是滚动）。", "discussion": "1. 哪些形状的物体容易滚动？（球形、圆柱形等带有圆弧外表的物体容易滚动）。\n2. 怎样把物体稳定地摆放？（把面积较大、平整的底面朝下放置，物体最稳定）。", "expansion": "生活中的稳定收纳设计\n\n- 工具箱：内部开凿与螺丝刀、钳子外形一致的凹槽卡扣，紧凑稳定。\n- 鸡蛋托盘：底部设计贴合鸡蛋圆弧的深凹穴，防止脆弱的鸡蛋滚动碰撞破碎。\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p11.webp", "p12.webp", "p13.webp"], "raw_text": "### [第 11 页]\n\n![第 11 页教学插图与实验活动](figures/p11.png)\n\n## 4. 认识物体的形状\n\n轻轻踢一下草地上的足球，它就骨碌碌开始滚动了。\n\n#### 🎯 聚焦\n\n生活中哪些形状的物体容易滚动？哪些容易稳定摆放？\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g02_s2_u01_l04.html)\n- 💎 **密度大概念（Density）**：为什么体积很小的铁块比很大的海绵还要重？这是因为铁的分子排列极其致密（密度达 $7.8\text{ g/cm}^3$），而海绵充满微孔空气（密度不到 $0.05\text{ g/cm}^3$）。\n\n---\n\n### [第 12 页]\n\n![第 12 页教学插图与实验活动](figures/p12.png)\n\n#### 🔬 探索\n\n> 💡 **科学词汇**：**稳定** · **滚动**\n\n1. **观察物体的形状**（从不同的面观察：立方体、球体、圆柱体、六棱柱等）。\n2. **在斜面上做滚动实验，并记录下来**（搭设平缓斜面，轻放物体观察是滑动还是滚动）。\n\n#### 📝 班级记录单：物体的滚动实验结果\n\n- **日期**：____月____日\n\n| 容易滚动的物体（具有圆弧曲面） | 不容易滚动的物体（具有平整平面） |\n| :--- | :--- |\n| - 乒乓球（球形，向任意方向滚）<br>- 圆柱体（侧放时容易滚动）<br>- 玻璃球 | - 立方体积木（平面贴合斜面，静止或滑动）<br>- 橡皮擦<br>- 盒盖 |\n\n---\n\n### [第 13 页]\n\n![第 13 页教学插图与实验活动](figures/p13.png)\n\n3. **和同桌一起把物体叠放起来**。\n- *讨论*：“哪种形状的物体容易叠放？”（具有平面的物体容易叠放，球形物体极不稳定无法叠放）。\n\n#### 💬 研讨\n\n1. 哪些形状的物体容易滚动？（球形、圆柱形等带有圆弧外表的物体容易滚动）。\n2. 怎样把物体稳定地摆放？（把面积较大、平整的底面朝下放置，物体最稳定）。\n\n#### 🚀 拓展：生活中的稳定收纳设计\n\n- 工具箱：内部开凿与螺丝刀、钳子外形一致的凹槽卡扣，紧凑稳定。\n- 鸡蛋托盘：底部设计贴合鸡蛋圆弧的深凹穴，防止脆弱的鸡蛋滚动碰撞破碎。\n\n---"}, {"id": "sci_02_u01_l05", "lesson_idx": 18, "book": "一年级下册", "vol_dir": "02_一年级下册", "unit_no": 1, "unit_title": "第一单元 身边的物体", "lesson_no": 5, "title": "观察一杯水", "page": 14, "domain": "chemistry", "domain_cn": "物质变化与化学", "sim_file": "sim_g02_s2_u01_l05.html", "code": "g02_s2_u01_l05", "sections": {"focus": "我们的生活和水密切相关，水是什么样子的？它有什么特征呢？", "exploration": "> ⚠️ **安全提醒**：科学课上，不要随便用舌头去尝未知液体！\n\n观察一杯水，描述并记录它的特征：\n\n1. **观察水的颜色**：把一杯清水和一杯白色牛奶放在一起比一比 ➔ 水是**没有颜色、透明的**。\n2. **闻一闻水的气味**：用手轻轻在杯口煽动闻气味，和带香气的洗发水比一比 ➔ 水是**没有气味的**。\n3. **观察水的形状**：把水倒入不同形状的容器中（圆形杯、方形盒、心形皿） ➔ 水**没有固定形状**。\n\n> 💡 **科学词汇**：**流动**\n\n---", "discussion": "1. 我们可以从哪些方面描述水的特征？（颜色、气味、透明度、形状、流动性等）。\n2. 鱼缸里的水静止后，水面还会像波浪那样弯曲吗？（静止后水面始终保持水平，称为“水平面”）。", "expansion": "- 往两个相同的杯子中，倒入同样多的水和食用油，它们一样重吗？（用简易天平称一称，水比油更重，说明同体积下水比油密度大）。\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p14.webp", "p15.webp", "p16.webp"], "raw_text": "### [第 14 页]\n\n![第 14 页教学插图与实验活动](figures/p14.png)\n\n## 5. 观察一杯水\n\n大自然中有很多水（奔腾的瀑布、江河湖海），水与身边其他固体物体有很大的不同。\n\n#### 🎯 聚焦\n\n我们的生活和水密切相关，水是什么样子的？它有什么特征呢？\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g02_s2_u01_l05.html)\n- 🌊 **流变学与流体黏度（Viscosity）**：胶水之所以流得比水慢，是因为胶水分子链较长（如聚乙烯醇），分子间的内摩擦阻力大。科学家根据黏度调配汽车机油与飞机液压油。\n\n---\n\n### [第 15 页]\n\n![第 15 页教学插图与实验活动](figures/p15.png)\n\n#### 🔬 探索\n\n> ⚠️ **安全提醒**：科学课上，不要随便用舌头去尝未知液体！\n\n观察一杯水，描述并记录它的特征：\n\n1. **观察水的颜色**：把一杯清水和一杯白色牛奶放在一起比一比 ➔ 水是**没有颜色、透明的**。\n2. **闻一闻水的气味**：用手轻轻在杯口煽动闻气味，和带香气的洗发水比一比 ➔ 水是**没有气味的**。\n3. **观察水的形状**：把水倒入不同形状的容器中（圆形杯、方形盒、心形皿） ➔ 水**没有固定形状**。\n\n> 💡 **科学词汇**：**流动**\n\n---\n\n### [第 16 页]\n\n![第 16 页教学插图与实验活动](figures/p16.png)\n\n#### 📝 班级记录单：水的特征\n\n- **日期**：____月____日\n- **核心特征归纳**：\n  1. **颜色**：无色、透明\n  2. **气味**：无气味\n  3. **形状**：无固定形状，会流动\n\n#### 💬 研讨\n\n1. 我们可以从哪些方面描述水的特征？（颜色、气味、透明度、形状、流动性等）。\n2. 鱼缸里的水静止后，水面还会像波浪那样弯曲吗？（静止后水面始终保持水平，称为“水平面”）。\n\n#### 🚀 拓展\n\n- 往两个相同的杯子中，倒入同样多的水和食用油，它们一样重吗？（用简易天平称一称，水比油更重，说明同体积下水比油密度大）。\n\n---"}, {"id": "sci_02_u01_l06", "lesson_idx": 19, "book": "一年级下册", "vol_dir": "02_一年级下册", "unit_no": 1, "unit_title": "第一单元 身边的物体", "lesson_no": 6, "title": "哪个流动得快", "page": 17, "domain": "general_science", "domain_cn": "综合科学探究", "sim_file": "sim_g02_s2_u01_l06.html", "code": "g02_s2_u01_l06", "sections": {"focus": "如果让水和食用油流动起来，哪个流动得更快一些？", "exploration": "**1. 比较水和食用油的手感**：\n- 用手指分别蘸一蘸水和油 ➔ 水感觉清爽易挥发，食用油感觉黏稠滑腻。\n\n**2. 观察并记录水和食用油的流动比赛**：\n- **公平实验要求**：\n  - ① 在倾斜塑料板顶端画一条起跑线。\n  - ② 用滴管分别吸取相同大小的一滴水和一滴油。\n  - ③ **同时滴下，不要“抢跑”**！\n  - ④ **流动的时间要一样**，时间到立刻将斜板放平。", "discussion": "1. 用手感受水和食用油，有什么不同？（水稀滑、流动快；油黏手、流动慢）。\n2. 水和食用油哪个流得快，我们是怎样判断的？（相同时间内水在斜板上流下的距离更长，所以水流动得更快）。", "expansion": "流动的水在生活中的应用\n\n- **农田水车灌溉**：利用奔腾流水的冲力推动木质水车轮叶旋转，把低处河水提送到高处农田。\n- **水力发电**：利用落差水流的巨大动力推动水轮发电机产生清洁电能。\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p17.webp", "p18.webp", "p19.webp"], "raw_text": "### [第 17 页]\n\n![第 17 页教学插图与实验活动](figures/p17.png)\n\n## 6. 哪个流动得快\n\n水和食用油都是可以流动的液体。\n\n#### 🎯 聚焦\n\n如果让水和食用油流动起来，哪个流动得更快一些？\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g02_s2_u01_l06.html)\n- ⛰️ **水力学与重力势能转化**：水往低处流是由于地球重力场的作用。重力势能转化为动能，水流冲刷侵蚀河床，形成了地球上千姿百态的峡谷、瀑布与冲积平原。\n\n---\n\n### [第 18 页]\n\n![第 18 页教学插图与实验活动](figures/p18.png)\n\n#### 🔬 探索\n\n**1. 比较水和食用油的手感**：\n- 用手指分别蘸一蘸水和油 ➔ 水感觉清爽易挥发，食用油感觉黏稠滑腻。\n\n**2. 观察并记录水和食用油的流动比赛**：\n- **公平实验要求**：\n  - ① 在倾斜塑料板顶端画一条起跑线。\n  - ② 用滴管分别吸取相同大小的一滴水和一滴油。\n  - ③ **同时滴下，不要“抢跑”**！\n  - ④ **流动的时间要一样**，时间到立刻将斜板放平。\n\n#### 📝 班级记录单：画出水和食用油的流动长度\n\n- **日期**：____月____日\n\n```\n起跑线 --------------------------------------------------\n水     ●━━━━━━━━━━━━━━━━━━━━━━━━━━━━━▶ (流得快，流经距离长)\n食用油 ●━━━━━━━━━━▶ (黏稠阻力大，流得慢，流经距离短)\n```\n\n---\n\n### [第 19 页]\n\n![第 19 页教学插图与实验活动](figures/p19.png)\n\n#### 💬 研讨\n\n1. 用手感受水和食用油，有什么不同？（水稀滑、流动快；油黏手、流动慢）。\n2. 水和食用油哪个流得快，我们是怎样判断的？（相同时间内水在斜板上流下的距离更长，所以水流动得更快）。\n\n#### 🚀 拓展：流动的水在生活中的应用\n\n- **农田水车灌溉**：利用奔腾流水的冲力推动木质水车轮叶旋转，把低处河水提送到高处农田。\n- **水力发电**：利用落差水流的巨大动力推动水轮发电机产生清洁电能。\n\n---"}, {"id": "sci_02_u01_l07", "lesson_idx": 20, "book": "一年级下册", "vol_dir": "02_一年级下册", "unit_no": 1, "unit_title": "第一单元 身边的物体", "lesson_no": 7, "title": "它们去哪里了", "page": 20, "domain": "general_science", "domain_cn": "综合科学探究", "sim_file": "sim_g02_s2_u01_l07.html", "code": "g02_s2_u01_l07", "sections": {"focus": "在水中，它们会发生什么变化？", "exploration": "> 💡 **科学词汇**：**溶解**\n\n**1. 观察并描述下面三种物体**：\n- 食盐：白色细小结晶颗粒。\n- 红糖：红褐色块状/粗颗粒。\n- 小石子：坚硬粗糙的灰色小块。\n\n**2. 分别把它们放入水杯中，观察并用图画记录**：\n- ① **放入前**：先仔细观察物体的形态。\n- ② **放入后**：先不要搅拌，静静观察变化。\n- ③ **搅拌**：用玻璃棒或小勺顺时针轻轻搅拌。\n- ④ **搅拌后**：再观察水中的变化与杯底残留。\n\n---", "discussion": "1. 把食盐、红糖、小石子分别放入水中后，你观察到了什么现象？（食盐和红糖慢慢化在水里消失不见了，水变了颜色或味道；小石子依然留在水底）。\n2. 食盐和红糖真的“消失”了吗？（没有真正消失，而是分散成了我们肉眼看不见的极微小微粒，均匀存在于整杯水中）。", "expansion": "油能溶解在水里吗？\n\n- 在一杯水中加入几滴食用油，观察有什么特别的现象：\n  - 食用油完全浮在水面上，不溶于水。\n  - 用筷子剧烈搅拌后，油被打碎成小油滴悬浮在水中；静置一段时间后，所有小油滴重新聚集浮上水面，水油依然彻底分层。\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p20.webp", "p21.webp", "p22.webp", "p23.webp"], "raw_text": "### [第 20 页]\n\n![第 20 页教学插图与实验活动](figures/p20.png)\n\n## 7. 它们去哪里了\n\n将食盐、红糖、小石子分别放入水中，仔细观察。\n\n#### 🎯 聚焦\n\n在水中，它们会发生什么变化？\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g02_s2_u01_l07.html)\n- 💧 **水是生命之源（特殊物理化学性质）**：水是无色无味透明的液体，具有极高的比热容（能调节全球气候）和反常膨胀特性（冰的密度比水小，结冰浮在水面，保护水底鱼类安全过冬）。\n\n---\n\n### [第 21 页]\n\n![第 21 页教学插图与实验活动](figures/p21.png)\n\n#### 🔬 探索\n\n> 💡 **科学词汇**：**溶解**\n\n**1. 观察并描述下面三种物体**：\n- 食盐：白色细小结晶颗粒。\n- 红糖：红褐色块状/粗颗粒。\n- 小石子：坚硬粗糙的灰色小块。\n\n**2. 分别把它们放入水杯中，观察并用图画记录**：\n- ① **放入前**：先仔细观察物体的形态。\n- ② **放入后**：先不要搅拌，静静观察变化。\n- ③ **搅拌**：用玻璃棒或小勺顺时针轻轻搅拌。\n- ④ **搅拌后**：再观察水中的变化与杯底残留。\n\n---\n\n### [第 22 页]\n\n![第 22 页教学插图与实验活动](figures/p22.png)\n\n#### 📝 记录单：三种物体放入水中前后的现象\n\n- **日期**：____月____日\n\n| 物体名称 | 放入前（颗粒外观） | 放入后（刚入水未搅拌） | 搅拌后（充分搅拌静置） | 最终结论 |\n| :--- | :--- | :--- | :--- | :---: |\n| **食盐** | 白色微小晶体 | 沉在杯底，部分边缘开始模糊 | 晶体颗粒全部消失，水完全清亮透明 | **溶解** |\n| **红糖** | 红褐色粗颗粒 | 杯底泛出红褐色带，缓缓扩散 | 颗粒完全消失，整杯水变成均匀红褐色透明液体 | **溶解** |\n| **小石子** | 坚硬灰色石头颗粒 | 沉在水底无变化 | 依然静静躺在杯底，大小无变化，水依然无色 | **不溶解** |\n\n#### 💬 研讨\n\n1. 把食盐、红糖、小石子分别放入水中后，你观察到了什么现象？（食盐和红糖慢慢化在水里消失不见了，水变了颜色或味道；小石子依然留在水底）。\n2. 食盐和红糖真的“消失”了吗？（没有真正消失，而是分散成了我们肉眼看不见的极微小微粒，均匀存在于整杯水中）。\n\n#### 🚀 拓展：油能溶解在水里吗？\n\n- 在一杯水中加入几滴食用油，观察有什么特别的现象：\n  - 食用油完全浮在水面上，不溶于水。\n  - 用筷子剧烈搅拌后，油被打碎成小油滴悬浮在水中；静置一段时间后，所有小油滴重新聚集浮上水面，水油依然彻底分层。\n\n---\n\n### [第 23 页]\n\n![第 23 页教学插图与实验活动](figures/p23.png)"}, {"id": "sci_02_u02_l01", "lesson_idx": 21, "book": "一年级下册", "vol_dir": "02_一年级下册", "unit_no": 2, "unit_title": "第二单元 常见的动物", "lesson_no": 1, "title": "我们周围的动物", "page": 28, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g02_s2_u02_l01.html", "code": "g02_s2_u02_l01", "sections": {"focus": "我们的周围生活着哪些动物？", "exploration": "到校园或田野里寻找动物，用图画记录下来。\n\n> 💡 **提示**：不惊动、不伤害动物，不损坏它们的“家”。", "discussion": "1. 我们找到了哪些动物？\n2. 选择一种动物，说一说它的特点。\n\n---", "expansion": "自然界有多种多样的动物：\n\n- **虎鲸**：生活在辽阔的海洋中；\n- **大熊猫**：生活在茂密的高山竹林；\n- **斑马**：奔跑在辽阔的非洲大草原；\n- **蚰蜒**：生活在阴暗潮湿的环境；\n- **中华虎凤蝶**：珍稀的美丽蝴蝶；\n- **巨蜥**：大型爬行动物；\n- **弹涂鱼**：能在滩涂上跳跃生活的小鱼；\n- **鸵鸟**：陆地上体型最大的鸟类。\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p28.webp", "p29.webp", "p30.webp", "p31.webp"], "raw_text": "### [第 28 页]\n\n![第 28 页教学插图与实验活动](figures/p28.png)\n\n## 1. 我们周围的动物\n\n\n# 1 我们周围的动物\n\n如果我们仔细观察，就会发现周围有许多动物。\n\n> 🐾 **图示常见动物**：麻雀、蝴蝶、鱼、狗、蜗牛、蚂蚁、蚯蚓、鼠妇。\n\n#### 🎯 聚焦\n\n我们的周围生活着哪些动物？\n\n#### 🔬 探索\n\n到校园或田野里寻找动物，用图画记录下来。\n\n> 💡 **提示**：不惊动、不伤害动物，不损坏它们的“家”。\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g02_s2_u02_l01.html)\n- 🌍 **生物多样性与生态位（Ecological Niche）**：麻雀在空中捕食、蚯蚓在土壤疏松泥土、蜗牛在阴湿处分解腐殖质。不同的动物占据不同的“生态位”，彼此制约依存，维持地球生命网的稳定运转。\n\n---\n\n### [第 29 页]\n\n![第 29 页教学插图与实验活动](figures/p29.png)\n\n> ⚠️ **安全提醒**：不要被动物伤到。\n\n#### 🌿 校园实地寻访动物\n- 观察地点与场景：\n  - 大树上寻找停歇的小鸟与树干上的小虫；\n  - 观察草坪与灌木丛中的昆虫与飞舞的蝴蝶；\n  - 翻开落叶堆或石块寻找小动物；\n  - 在花坛周围仔细寻找。\n\n> 💬 **探究对话**：“记下它们生活的地方。”\n\n---\n\n### [第 30 页]\n\n![第 30 页教学插图与实验活动](figures/p30.png)\n\n#### 📝 记录单：校园里的动物\n\n**日期**：______\n\n| 序号 | 观察到的动物（画图或记录） | 生活的地点 |\n| :---: | :--- | :--- |\n| **①** | 蜗牛（示例） | 潮湿的草丛/石缝 |\n| **②** | | |\n| **③** | | |\n| **④** | | |\n| **⑤** | | |\n| **⑥** | | |\n| **⑦** | | |\n| **⑧** | | |\n| **⑨** | | |\n\n- **统计**：我在校园里找到了（ &nbsp;&nbsp;&nbsp;&nbsp; ）种动物。\n\n#### 💬 研讨\n\n1. 我们找到了哪些动物？\n2. 选择一种动物，说一说它的特点。\n\n---\n\n### [第 31 页]\n\n![第 31 页教学插图与实验活动](figures/p31.png)\n\n#### 🚀 拓展\n\n自然界有多种多样的动物：\n\n- **虎鲸**：生活在辽阔的海洋中；\n- **大熊猫**：生活在茂密的高山竹林；\n- **斑马**：奔跑在辽阔的非洲大草原；\n- **蚰蜒**：生活在阴暗潮湿的环境；\n- **中华虎凤蝶**：珍稀的美丽蝴蝶；\n- **巨蜥**：大型爬行动物；\n- **弹涂鱼**：能在滩涂上跳跃生活的小鱼；\n- **鸵鸟**：陆地上体型最大的鸟类。\n\n---"}, {"id": "sci_02_u02_l02", "lesson_idx": 22, "book": "一年级下册", "vol_dir": "02_一年级下册", "unit_no": 2, "unit_title": "第二单元 常见的动物", "lesson_no": 2, "title": "观察一种动物", "page": 32, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g02_s2_u02_l02.html", "code": "g02_s2_u02_l02", "sections": {"focus": "蜗牛是什么样的，有什么特点？", "exploration": "1. **观察蜗牛的身体，并把它画下来**。\n   - 💡 **提示**：使用放大镜时，不碰到观察物体。\n   - 💬 **探究建议**：“放大镜不要碰到蜗牛。”", "discussion": "1. 蜗牛的身体有哪些特点？我们能模仿它的动作吗？\n2. 蜗牛遇到危险时，有什么反应？它有哪些本领？", "expansion": "**观察和蜗牛一样身体很软的动物**：\n- **螺**：生活在水或潮湿环境中，有坚硬的螺壳；\n- **蛞蝓**（鼻涕虫）：体表柔软光滑，无外壳；\n- **蛤**：双壳类软体动物，生活在水中或泥沙中。\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p32.webp", "p33.webp", "p34.webp"], "raw_text": "### [第 32 页]\n\n![第 32 页教学插图与实验活动](figures/p32.png)\n\n## 2. 观察一种动物\n\n\n# 2 观察一种动物\n\n蜗牛是一种常见的小动物，它经常在草丛中活动。\n\n#### 🎯 聚焦\n\n蜗牛是什么样的，有什么特点？\n\n#### 🔬 探索\n\n1. **观察蜗牛的身体，并把它画下来**。\n   - 💡 **提示**：使用放大镜时，不碰到观察物体。\n   - 💬 **探究建议**：“放大镜不要碰到蜗牛。”\n\n#### 📝 记录单：我观察的蜗牛\n\n**日期**：______\n\n```\n┌──────────────────────────────────────────────┐\n│                                              │\n│               【 我观察的蜗牛 】             │\n│                                              │\n│                                              │\n│                                              │\n└──────────────────────────────────────────────┘\n```\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g02_s2_u02_l02.html)\n- 🐌 **软体动物仿生（腹足爬行机器人）**：蜗牛腹足分泌的黏液具有特殊的“非牛顿流体”特性——爬行时受剪切力变稀润滑，静止时变稠粘附，甚至能在锋利的剃须刀片上安全爬过！工程师据此研发生化黏合剂与管道爬行机器人。\n\n---\n\n### [第 33 页]\n\n![第 33 页教学插图与实验活动](figures/p33.png)\n\n#### 🔍 蜗牛身体构造与引线标注\n\n- **眼**：长在长触角的顶端；\n- **触角**：共有两对触角（前短后长）；\n- **口**：头部下方，用于摄取食物；\n- **壳**：背在背上的螺旋形硬壳，保护柔软的身体；\n- **腹足**：宽大扁平的腹部肌肉，用于爬行。\n\n> 📖 **科学词汇**：**腹足**\n\n#### 🔬 探究活动继续\n\n2. **观察蜗牛的反应**：\n   - 它吃菜叶吗？\n   - 用棉签轻轻触碰蜗牛的身体，观察它的反应。\n   - 它能听到我们的声音吗？\n3. **观察蜗牛的运动**：\n   - 观察蜗牛在玻璃板上的爬行波纹；\n   - 观察蜗牛在树枝上的攀爬；\n   - 思考：蜗牛有腿吗？它是怎样前进的？\n\n---\n\n### [第 34 页]\n\n![第 34 页教学插图与实验活动](figures/p34.png)\n\n#### 💬 研讨\n\n1. 蜗牛的身体有哪些特点？我们能模仿它的动作吗？\n2. 蜗牛遇到危险时，有什么反应？它有哪些本领？\n\n#### 📋 班级记录单：蜗牛身体的特点\n\n**日期**：______\n\n- 有触角（两对，长触角顶端有眼）\n- 有壳（螺旋状保护壳）\n- 有腹足（依靠腹足肌肉波状蠕动爬行，分泌黏液）\n- 遇到刺激或危险会把身体缩进壳内\n\n#### 🚀 拓展\n\n**观察和蜗牛一样身体很软的动物**：\n- **螺**：生活在水或潮湿环境中，有坚硬的螺壳；\n- **蛞蝓**（鼻涕虫）：体表柔软光滑，无外壳；\n- **蛤**：双壳类软体动物，生活在水中或泥沙中。\n\n---"}, {"id": "sci_02_u02_l03", "lesson_idx": 23, "book": "一年级下册", "vol_dir": "02_一年级下册", "unit_no": 2, "unit_title": "第二单元 常见的动物", "lesson_no": 3, "title": "给蜗牛建个“家”", "page": 35, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g02_s2_u02_l03.html", "code": "g02_s2_u02_l03", "sections": {"focus": "如果要给蜗牛建个家，应该怎样做？\n\n> 📖 **科学词汇**：**生活环境**", "exploration": "1. 说一说蜗牛的家应该是什么样的。", "discussion": "1. 蜗牛的生活需要什么？（需要食物、水分、空气、适宜的栖息空间）\n2. 要照顾好蜗牛，我们应该怎样做？", "expansion": "饲养蜗牛要注意什么？\n\n- **清理腐烂的菜叶**：保持饲养盒内清洁卫生；\n- **注意通风透气**：确保有充足的新鲜空气；\n- **不让太阳直射**：避免环境过热或干燥，保持阴凉潮湿。\n\n> 💡 **提示**：观察完毕后，把蜗牛送回原来的家。\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p35.webp", "p36.webp", "p37.webp"], "raw_text": "### [第 35 页]\n\n![第 35 页教学插图与实验活动](figures/p35.png)\n\n## 3. 给蜗牛建个“家”\n\n\n# 3 给蜗牛建个“家”\n\n家是动物生活的地方。\n\n#### 🎯 聚焦\n\n如果要给蜗牛建个家，应该怎样做？\n\n> 📖 **科学词汇**：**生活环境**\n\n#### 🔬 探索\n\n1. 说一说蜗牛的家应该是什么样的。\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g02_s2_u02_l03.html)\n- 🏡 **微生态系统与适宜生境搭建**：建立蜗牛饲养箱实质上是在构建一个微缩的人工生态系统（人工生物圈）。必须精确保持阴凉遮光、充足空气流通、湿润但无积水土壤，才能满足变温无脊椎动物的代谢需求。\n\n---\n\n### [第 36 页]\n\n![第 36 页教学插图与实验活动](figures/p36.png)\n\n#### 📋 班级记录单：蜗牛的家\n\n**日期**：______\n\n- 能让蜗牛四处爬\n- 有吃的东西（新鲜菜叶等）\n- 要保持潮湿\n- 能让蜗牛休息，又不能让它们爬出去\n- ……\n\n#### 🧱 适宜建造蜗牛家的材料\n- 干苔藓、落叶（保持水分与隐蔽）\n- 细树枝（供蜗牛攀爬）\n- 湿润土壤（提供适宜湿度）\n\n#### 🔬 动手实践\n\n2. **先画一画蜗牛的家，然后选择合适的材料建个家**。\n3. **把蜗牛放入新家，观察它们的活动**。\n\n---\n\n### [第 37 页]\n\n![第 37 页教学插图与实验活动](figures/p37.png)\n\n#### 💬 研讨\n\n1. 蜗牛的生活需要什么？（需要食物、水分、空气、适宜的栖息空间）\n2. 要照顾好蜗牛，我们应该怎样做？\n\n#### 🚀 拓展：饲养蜗牛要注意什么？\n\n- **清理腐烂的菜叶**：保持饲养盒内清洁卫生；\n- **注意通风透气**：确保有充足的新鲜空气；\n- **不让太阳直射**：避免环境过热或干燥，保持阴凉潮湿。\n\n> 💡 **提示**：观察完毕后，把蜗牛送回原来的家。\n\n---"}, {"id": "sci_02_u02_l04", "lesson_idx": 24, "book": "一年级下册", "vol_dir": "02_一年级下册", "unit_no": 2, "unit_title": "第二单元 常见的动物", "lesson_no": 4, "title": "水中的动物", "page": 38, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g02_s2_u02_l04.html", "code": "g02_s2_u02_l04", "sections": {"focus": "鱼的身体有什么特点？", "exploration": "1. **观察鱼的身体特点，画一画鱼的身体**。\n   - 观察鱼的头部、躯干和尾部；\n   - 识别鱼鳍（背鳍、胸鳍、腹鳍、臀鳍、尾鳍）和鱼鳞；\n   - 💬 *探究建议：“也可以观察金鱼或其他鱼类。”*", "discussion": "1. 我们观察的鱼有什么特点？我们会模仿它的动作吗？\n2. 鱼在水中靠什么运动？靠什么呼吸？\n   - 运动依靠：尾部摆动和鱼鳍的协调动作；\n   - 呼吸依靠：鱼鳃（在水中吸收溶解氧）。", "expansion": "**它们也是鱼类**：\n- **带鱼**：体形侧扁狭长如带；\n- **鲨鱼**：海洋中游速极快的大型软骨鱼类；\n- **泥鳅**：生活在水底淤泥中的小型鱼类；\n- **海马**：头部似马、直立游动的特殊鱼类；\n- **飞鱼**：胸鳍发达、能在水面滑翔的鱼类。\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p38.webp", "p39.webp", "p40.webp"], "raw_text": "### [第 38 页]\n\n![第 38 页教学插图与实验活动](figures/p38.png)\n\n## 4. 水中的动物\n\n\n# 4 水中的动物\n\n水中生活着很多动物，其中鱼是我们非常熟悉的一类。\n\n#### 🎯 聚焦\n\n鱼的身体有什么特点？\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g02_s2_u02_l04.html)\n- 🐟 **流体动力学与鱼鳍仿生潜航器**：鱼类的纺锤形流线型身体能将水阻力降至最低；尾鳍提供推进动力，背鳍和胸鳍控制航向与俯仰平衡。科学家根据鱼体流体力学研发了超静音仿生机器鱼。\n\n---\n\n### [第 39 页]\n\n![第 39 页教学插图与实验活动](figures/p39.png)\n\n#### 🔬 探索\n\n1. **观察鱼的身体特点，画一画鱼的身体**。\n   - 观察鱼的头部、躯干和尾部；\n   - 识别鱼鳍（背鳍、胸鳍、腹鳍、臀鳍、尾鳍）和鱼鳞；\n   - 💬 *探究建议：“也可以观察金鱼或其他鱼类。”*\n\n#### 📝 记录单：鱼的身体\n\n**日期**：______\n\n```\n┌──────────────────────────────────────────────┐\n│                                              │\n│                【 鱼的身体 】                │\n│                                              │\n│                                              │\n│                                              │\n└──────────────────────────────────────────────┘\n```\n\n2. **观察鱼是怎样运动的**。\n   - 💬 *思考问题：“鱼没有腿，靠什么运动呢？”*\n\n---\n\n### [第 40 页]\n\n![第 40 页教学插图与实验活动](figures/p40.png)\n\n#### 🔬 探索（续）\n\n3. **观察鱼的呼吸**：\n   - 观察鱼嘴的张合与鱼鳃盖的开闭节奏；\n   - 观察水从鱼口流入，由鳃部排出的过程。\n\n#### 💬 研讨\n\n1. 我们观察的鱼有什么特点？我们会模仿它的动作吗？\n2. 鱼在水中靠什么运动？靠什么呼吸？\n   - 运动依靠：尾部摆动和鱼鳍的协调动作；\n   - 呼吸依靠：鱼鳃（在水中吸收溶解氧）。\n\n#### 🚀 拓展\n\n**它们也是鱼类**：\n- **带鱼**：体形侧扁狭长如带；\n- **鲨鱼**：海洋中游速极快的大型软骨鱼类；\n- **泥鳅**：生活在水底淤泥中的小型鱼类；\n- **海马**：头部似马、直立游动的特殊鱼类；\n- **飞鱼**：胸鳍发达、能在水面滑翔的鱼类。\n\n---"}, {"id": "sci_02_u02_l05", "lesson_idx": 25, "book": "一年级下册", "vol_dir": "02_一年级下册", "unit_no": 2, "unit_title": "第二单元 常见的动物", "lesson_no": 5, "title": "它们吃什么", "page": 41, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g02_s2_u02_l05.html", "code": "g02_s2_u02_l05", "sections": {"focus": "动物吃什么？它们是怎样吃的呢？", "exploration": "1. **说一说蜗牛和小鱼是怎样吃食物的**。\n   - 蜗牛吃食物：用齿舌刮食嫩叶；\n   - 小鱼吃食物：用嘴快速吸入或吞食水中的食物碎片。", "discussion": "1. 蚂蚁是用眼睛发现食物的吗？（蚂蚁主要依靠触角感知气味来寻找食物）\n2. 蚂蚁还有哪些有趣的行为？（相互碰触角传递信息、排队搬运食物、分工合作）", "expansion": "**观察其他动物吃什么**：\n- **蝴蝶**：吸食花蜜；\n- **大熊猫**：主要吃竹子；\n- **乌龟**：吃小鱼、小虾和虫子；\n- **莺**：捕捉枝头上的小昆虫。\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p41.webp", "p42.webp", "p43.webp"], "raw_text": "### [第 41 页]\n\n![第 41 页教学插图与实验活动](figures/p41.png)\n\n## 5. 它们吃什么\n\n\n# 5 它们吃什么\n\n动物和我们一样，都要吃食物。\n\n> 🪶 **自然图景**：大白鹭在水边敏捷捕鱼。\n\n#### 🎯 聚焦\n\n动物吃什么？它们是怎样吃的呢？\n\n#### 🔬 探索\n\n1. **说一说蜗牛和小鱼是怎样吃食物的**。\n   - 蜗牛吃食物：用齿舌刮食嫩叶；\n   - 小鱼吃食物：用嘴快速吸入或吞食水中的食物碎片。\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g02_s2_u02_l05.html)\n- 🌿 **生态系统能量流动与食物链（Food Chain）**：大熊猫吃竹子（植食动物/初级消费者）、大白鹭捕鱼（肉食动物/次级消费者）。所有动物的食物能量，最终都溯源自太阳光能通过植物光合作用固定下来的化学能！\n\n---\n\n### [第 42 页]\n\n![第 42 页教学插图与实验活动](figures/p42.png)\n\n#### 🔬 探索（续）\n\n2. **观察蚂蚁对食物的反应**。\n   - 💬 *探究操作：“把食物悄悄放在蚂蚁面前。”*\n   - 观察蚂蚁用触角触碰食物、辨别食物的过程。\n3. **观察蚂蚁怎样搬运食物**。\n   - 观察单只蚂蚁搬动碎屑；\n   - 观察多只蚂蚁齐心协力抬动较大食物的过程。\n\n---\n\n### [第 43 页]\n\n![第 43 页教学插图与实验活动](figures/p43.png)\n\n#### 💬 研讨\n\n1. 蚂蚁是用眼睛发现食物的吗？（蚂蚁主要依靠触角感知气味来寻找食物）\n2. 蚂蚁还有哪些有趣的行为？（相互碰触角传递信息、排队搬运食物、分工合作）\n\n#### 🚀 拓展\n\n**观察其他动物吃什么**：\n- **蝴蝶**：吸食花蜜；\n- **大熊猫**：主要吃竹子；\n- **乌龟**：吃小鱼、小虾和虫子；\n- **莺**：捕捉枝头上的小昆虫。\n\n---"}, {"id": "sci_02_u02_l06", "lesson_idx": 26, "book": "一年级下册", "vol_dir": "02_一年级下册", "unit_no": 2, "unit_title": "第二单元 常见的动物", "lesson_no": 6, "title": "动物联欢会", "page": 44, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g02_s2_u02_l06.html", "code": "g02_s2_u02_l06", "sections": {"focus": "", "exploration": "", "discussion": "1. 我们的表演符合动物的特点吗？\n2. 我们还可以创作哪些符合动物特点的节目？\n3. **动物、植物和我们有哪些相同的地方？**", "expansion": "把我们的节目表演给家人看。\n\n---", "frontier": "", "big_concept": "", "misconception": ""}, "figures": ["p44.webp", "p45.webp", "p46.webp", "p47.webp", "p48.webp", "p49.webp", "p50.webp"], "raw_text": "### [第 44 页]\n\n![第 44 页教学插图与实验活动](figures/p44.png)\n\n## 6. 动物联欢会\n\n\n# 6 动物联欢会\n\n我们班要开一次模拟动物的联欢会。\n\n#### 🎭 任务\n\n每名同学扮演一种动物去参加动物联欢会。\n#### 🚀 科学家视角 · 深度课外拓展\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g02_s2_u02_l06.html)\n- 🎭 **动物行为学（行为谱与语言通信）**：动物通过叫声（声通信）、身体姿态（视觉通信）、信息素气味（化学通信）和轻触（触觉通信）进行复杂的社交互动，展示了地球生命演化高度的智慧与协同。\n\n---\n\n### [第 45 页]\n\n![第 45 页教学插图与实验活动](figures/p45.png)\n\n#### 🛠️ 制作\n\n1. **确定自己扮演哪种动物，熟悉它的“语言”和动作特点**。\n2. **制作动物头饰**（如画出蜗牛、小兔、小鸟等头饰并佩戴）。\n\n#### 🌟 体验\n\n创作节目并进行表演（模仿动物叫声、走动、觅食动作）。\n\n---\n\n### [第 46 页]\n\n![第 46 页教学插图与实验活动](figures/p46.png)\n\n#### 💬 交流\n\n1. 我们的表演符合动物的特点吗？\n2. 我们还可以创作哪些符合动物特点的节目？\n3. **动物、植物和我们有哪些相同的地方？**\n\n#### 📝 记录单：动物、植物和我们的相同之处\n\n**日期**：______\n\n```\n           ┌──────────────────────┬──────────────────────┐\n           │                      │                      │\n           │     动物和植物       │        我们          │\n           │                      │                      │\n           │  • 会生长变化        │  • 都是生命          │\n           │  • 需要水分和空气    │  • 会呼吸、需要营养  │\n           │  • 经历生老病死      │  • 适应自然环境      │\n           │                      │                      │\n           └──────────────────────┴──────────────────────┘\n```\n\n> 📖 **科学词汇**：**生物**\n\n#### 🚀 拓展\n\n把我们的节目表演给家人看。\n\n---\n\n### [第 47 页]\n\n![第 47 页教学插图与实验活动](figures/p47.png)\n\n# 单元小结\n\n```mermaid\ngraph TD\n    A[\"常见的动物\"] --> B[\"种类多样\"]\n    A --> C[\"共同行为\"]\n    \n    B --> B1[\"蜗牛\"]\n    B --> B2[\"蚂蚁\"]\n    B --> B3[\"鲫鱼\"]\n    B --> B4[\"狗\"]\n    B --> B5[\"麻雀 ...\"]\n    \n    C --> C1[\"进食\"]\n    C --> C2[\"运动 ...\"]\n```\n\n> 🌟 **核心总结**：我们的周围有丰富多样的动物。动物和植物一样，都有生命，都是我们的朋友。\n\n#### 📋 我的收获\n\n| 我能做到 | 能做到的打“√” |\n| :--- | :---: |\n| 认识很多常见的动物 | |\n| 会用多种方法观察动物 | |\n| 会爱护周围的动物 | |\n| 知道动物和植物都是生物 | |\n\n> 💡 *思考：“怎样改进呢？”*\n\n---\n\n### [第 48 页]\n\n![第 48 页教学插图与实验活动](figures/p48.png)\n\n# 科学阅读\n\n### 动物，我们的朋友\n\n- **导盲犬**：能帮助盲人安全地走路、乘车和传递物品。\n- **蚯蚓**：能使土壤疏松，利于植物的生长。\n- **蜣螂**：以粪便为食，它是大自然的“清洁工”。\n- **蜜蜂**：能传粉，利于果实的形成。\n\n---\n\n### [第 49 页]\n\n![第 49 页教学插图与实验活动](figures/p49.png)\n\n### 我们要保护动物\n\n保护动物生活的环境，就可以保护动物。\n\n- 保护野生白鹤的栖息湿地；\n- 关爱与救助珍稀野生动物幼崽。\n\n> 💬 **倡议**：“保护濒危动物是我们共同的责任。”\n\n---\n\n### [第 50 页]\n\n![第 50 页教学插图与实验活动](figures/p50.png)\n\n# 后记\n\n本套科学教科书由出版社根据《义务教育科学课程标准（2022年版）》组织编写。编写团队由科研院所和高校的科学家、教育教学专家以及全国各地的优秀科学教师、教研员组成，周忠和院士与张红霞教授共同担任主编。\n\n编写过程中，我们得到了诸多科学家、教研员和一线教师的支持与帮助。李金华、张智慧、李博强、杨顺华、魏科、石承民、李实、张金海等为教科书编写提供了专业审查和咨询意见，高伟组织并参与编写了“制作天文望远镜”等单元。此外，还有很多单位、专家和同仁为我们提供了审读、插图、资料等方面的支持和帮助。他们的参与为确保教科书内容的科学性、适切性提供了重要支撑，在此一并表示诚挚谢意！\n\n我们真诚地欢迎广大师生和社会各界人士对教科书提出宝贵意见，帮助我们共同打造培根铸魂、启智增慧的精品教材。\n\n- **电话**：010-64989521 / 010-64989523\n- **电子邮箱**：science@esph.com.cn\n- **出版单位**：出版社"}, {"id": "sci_03_u01_l01", "lesson_idx": 27, "book": "二年级上册", "vol_dir": "03_二年级上册", "unit_no": 1, "unit_title": "第一单元造房子", "lesson_no": 1, "title": "动物的“家”", "page": 2, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g03_s1_u01_l01.html", "code": "g03_s1_u01_l01", "sections": {"focus": "动物的家是什么样的？！\n它们用", "exploration": "观察各种动物的家，说一说它们是什么样的。", "discussion": "与我们自己的家相比，动物建家的材料有什么特点？\n如果人们也用这些材料来建房子会怎样？", "expansion": "查阅资料或参观博物馆，认识远古时代人类的房屋。\n育科学地穴泥屋树屋", "frontier": "", "big_concept": "生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。", "misconception": ""}, "figures": ["p02.webp", "p03.webp", "p04.webp"], "raw_text": "### [第 2 页]\n\n![第 2 页教学插图与实验活动](figures/p02.png)\n\n## 1. 动物的“家”\n\n\n动物的“家中华攀雀的巢小鸟待在自己家里\n\n#### 🎯 聚焦动物的家是什么样的？！\n它们用\n\n#### 💡 科学词汇哪些材料建造自己的家材料\n\n#### 🔬 探索观察各种动物的家，说一说它们是什么样的。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿古生物学与生态基因库（国家基因库与恐龙羽毛演化）**：我国热河生物群带羽毛恐龙（如中华龙鸟）化石的发现，无可辩驳地确立了“现代鸟类是由兽脚类恐龙演化而来”的里程碑定论；高通量基因测序技术更重构了全球物种生命树与食物网脆弱度阈值。\n- 🧠 **跨学科大概念（尺度与比例 / 生态位）**：生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。\n- ⚠️ 很多同学误以为“凶猛的肉食动物消灭弱小食草动物对大自然有害”。**科学真相**：顶级捕食者能控制食草动物种群数量以防止过度啃食植被草原（营养级联效应），捕食体弱病体反而促进了种群基因库的健康优化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g03_s1_u01_l01.html)\n\n\n### [第 3 页]\n\n![第 3 页教学插图与实验活动](figures/p03.png)\n\n鸟巢蚁巢蟹洞松鼠窝选择几种动物的家，说一\n\n#### 💡 科学词汇说它们用了哪些材料。\n自然物干草燕子衔的泥这些来自大自然燕子用泥和干草燕子的巢的、没有经过加工的等建造它的巢。\n材料是“自然物”\n\n### [第 4 页]\n\n![第 4 页教学插图与实验活动](figures/p04.png)\n\n#### 💬 研讨与我们自己的家相比，动物建家的材料有什么特点？\n如果人们也用这些材料来建房子会怎样？\n\n#### 🚀 拓展查阅资料或参观博物馆，认识远古时代人类的房屋。\n育科学地穴泥屋树屋"}, {"id": "sci_03_u01_l02", "lesson_idx": 28, "book": "二年级上册", "vol_dir": "03_二年级上册", "unit_no": 1, "unit_title": "第一单元造房子", "lesson_no": 2, "title": "我们的家", "page": 5, "domain": "chemistry", "domain_cn": "物质变化与化学", "sim_file": "sim_g03_s1_u01_l02.html", "code": "g03_s1_u01_l02", "sections": {"focus": "我们的房屋是用哪些材料建造的？这些材料有什么特点", "exploration": "说一说人们是用哪些材料建造房子的。\n木屋", "discussion": "人们用多种材料建造房子，这有什么好处？\n如果要造大门，用金属和用木头有什么区别？", "expansion": "常见的金属有铜、铁、铝人们还会把不同金属熔在学出起制造出合金。\n不锈钢杯铜铁铝", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p05.webp", "p06.webp", "p07.webp", "p08.webp"], "raw_text": "### [第 5 页]\n\n![第 5 页教学插图与实验活动](figures/p05.png)\n\n## 2. 我们的家\n\n\n我们的家们会用更多的材料\n\n#### 🎯 聚焦我们的房屋是用哪些材料建造的？这些材料有什么特点\n\n#### 🔬 探索说一说人们是用哪些材料建造房子的。\n木屋\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g03_s1_u01_l02.html)\n\n\n### [第 6 页]\n\n![第 6 页教学插图与实验活动](figures/p06.png)\n\n土坯屋石墙房屋钢筋混凝土房屋砖瓦房屋盖房子观察并比较建造房子的材料会用到多种材料。\n版祛木砖玻璃要\n\n### [第 7 页]\n\n![第 7 页教学插图与实验活动](figures/p07.png)\n\n选择金属和另一种材料进行比较并记录。\n看一看掂一掂弯一弯用指甲刻画\n\n#### 📝 记录单日期：\n材料金属另一种材料（特点\n\n### [第 8 页]\n\n![第 8 页教学插图与实验活动](figures/p08.png)\n\n#### 💬 研讨人们用多种材料建造房子，这有什么好处？\n如果要造大门，用金属和用木头有什么区别？\n\n#### 💡 科学词汇人造物\n\n#### 🚀 拓展常见的金属有铜、铁、铝人们还会把不同金属熔在学出起制造出合金。\n不锈钢杯铜铁铝"}, {"id": "sci_03_u01_l03", "lesson_idx": 29, "book": "二年级上册", "vol_dir": "03_二年级上册", "unit_no": 1, "unit_title": "第一单元造房子", "lesson_no": 3, "title": "家里的物品", "page": 9, "domain": "chemistry", "domain_cn": "物质变化与化学", "sim_file": "sim_g03_s1_u01_l03.html", "code": "g03_s1_u01_l03", "sections": {"focus": "我们家里有很多物品，它们是用什么材料做的？", "exploration": "观察家里的物品。\n为方便记录，可以先给它们编号。\n金属可以造房子，也可以做勺子、杯子。\n资料常见材料类别有金属、塑料、玻璃、布、纸、木、陶瓷等。\n按材料类别给家", "discussion": "我们的分类和其他同学的分类有什么不同？\n哪些材料既可以用来造房子，也可以用来制造常用餐具？", "expansion": "收集身边的各种废旧材料，为建造我们的小房子作准备。", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p09.webp", "p10.webp", "p11.webp"], "raw_text": "### [第 9 页]\n\n![第 9 页教学插图与实验活动](figures/p09.png)\n\n## 3. 家里的物品\n\n\n家里的物品随着材料的改进，我们的家变得越来越丰富多彩。\n的\n\n#### 🎯 聚焦我们家里有很多物品，它们是用什么材料做的？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g03_s1_u01_l03.html)\n\n\n### [第 10 页]\n\n![第 10 页教学插图与实验活动](figures/p10.png)\n\n#### 🔬 探索观察家里的物品。\n为方便记录，可以先给它们编号。\n金属可以造房子，也可以做勺子、杯子。\n资料常见材料类别有金属、塑料、玻璃、布、纸、木、陶瓷等。\n按材料类别给家\n\n### [第 11 页]\n\n![第 11 页教学插图与实验活动](figures/p11.png)\n\n有些物品组合了几\n\n#### 📝 记录单种材料。\n给家里的物品分类日期：\n布材料金属塑料玻璃陶瓷物品号码\n\n#### 💬 研讨我们的分类和其他同学的分类有什么不同？\n哪些材料既可以用来造房子，也可以用来制造常用餐具？\n\n#### 🚀 拓展收集身边的各种废旧材料，为建造我们的小房子作准备。"}, {"id": "sci_03_u01_l04", "lesson_idx": 30, "book": "二年级上册", "vol_dir": "03_二年级上册", "unit_no": 1, "unit_title": "第一单元造房子", "lesson_no": 4, "title": "设计小房子", "page": 12, "domain": "chemistry", "domain_cn": "物质变化与化学", "sim_file": "sim_g03_s1_u01_l04.html", "code": "g03_s1_u01_l04", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "根据房子设计图，补充所需要的材料。", "frontier": "", "big_concept": "明确需求与限制 → 科学原理建模 → 方案设计与原型制作 → 极限工况测试评估 → 迭代优化改进。三角形结构具有极高的几何几何稳定性，因其三边长度一旦固定，内角不可变形。", "misconception": ""}, "figures": ["p12.webp", "p13.webp", "p14.webp"], "raw_text": "### [第 12 页]\n\n![第 12 页教学插图与实验活动](figures/p12.png)\n\n## 4. 设计小房子\n\n\n设计小房子我们可以用废纸箱来造个小房子明确任务用至少两种材料，建一座比较稳固、明亮、通风的小房子可以捏橡皮泥小人作为住户。\n房子不能太矮了，否则住户进不去。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **现代大工程方法论（数字化BIM与大跨度空间桁架结构）**：从大兴国际机场流线型钢网架屋顶，到千米跨径悬索桥（如张靖皋长江大桥），现代工程师借助拓扑优化算法与有限元力学计算，实现轻量化与超高结构承载稳定性的极限平衡！\n- 🧠 **跨学科大概念（工程设计闭环流程）**：明确需求与限制 → 科学原理建模 → 方案设计与原型制作 → 极限工况测试评估 → 迭代优化改进。三角形结构具有极高的几何几何稳定性，因其三边长度一旦固定，内角不可变形。\n- ⚠️ 直觉错误：“建造高楼或大桥，只要用最沉、最厚的材料就一定最稳固”。**科学真相**：盲目增加结构自重反而会加剧基座剪切应变与地震共振破坏！现代工程追求‘高强轻质’与‘三角形铰接桁架’受力分解，以柔克刚消解动态荷载。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g03_s1_u01_l04.html)\n\n\n### [第 13 页]\n\n![第 13 页教学插图与实验活动](figures/p13.png)\n\n设计方案整理我们收集的材料。\n金属条讨论：我们计划建造怎样的房子？选用哪些材料来建造？\n纸箱四四方方，可以把盖子改成屋和房子的形状很像顶，挖出门和窗的位置\n\n### [第 14 页]\n\n![第 14 页教学插图与实验活动](figures/p14.png)\n\n画设计图。\n什么材料可以观窗户可以让房间适合做窗户？\n察下我们教门开在更明亮，空气更新鲜室的窗户。\n哪里？窗户开几扇？\n房子设计图日期：X月×日\n\n#### 📝 记录单\n\nt心房子设计图房子设计图日期：X月x日日期：\n有种学出\n\n#### 🚀 拓展根据房子设计图，补充所需要的材料。"}, {"id": "sci_03_u01_l05", "lesson_idx": 31, "book": "二年级上册", "vol_dir": "03_二年级上册", "unit_no": 1, "unit_title": "第一单元造房子", "lesson_no": 5, "title": "建造小房子", "page": 15, "domain": "chemistry", "domain_cn": "物质变化与化学", "sim_file": "sim_g03_s1_u01_l05.html", "code": "g03_s1_u01_l05", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "在我们的小房子里，再添置一些物品，如床、桌子、凳子等。\n用木材或金属做地板铺上地毯，踩肩科学院子的栅栏。\n上去会更软、更舒服", "frontier": "", "big_concept": "明确需求与限制 → 科学原理建模 → 方案设计与原型制作 → 极限工况测试评估 → 迭代优化改进。三角形结构具有极高的几何几何稳定性，因其三边长度一旦固定，内角不可变形。", "misconception": ""}, "figures": ["p15.webp", "p16.webp", "p17.webp"], "raw_text": "### [第 15 页]\n\n![第 15 页教学插图与实验活动](figures/p15.png)\n\n## 5. 建造小房子\n\n\n建造小房子设计图对建造房子很重要任务依照设计图，建造我们的小房子。\n制作搭好框架。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **现代大工程方法论（数字化BIM与大跨度空间桁架结构）**：从大兴国际机场流线型钢网架屋顶，到千米跨径悬索桥（如张靖皋长江大桥），现代工程师借助拓扑优化算法与有限元力学计算，实现轻量化与超高结构承载稳定性的极限平衡！\n- 🧠 **跨学科大概念（工程设计闭环流程）**：明确需求与限制 → 科学原理建模 → 方案设计与原型制作 → 极限工况测试评估 → 迭代优化改进。三角形结构具有极高的几何几何稳定性，因其三边长度一旦固定，内角不可变形。\n- ⚠️ 直觉错误：“建造高楼或大桥，只要用最沉、最厚的材料就一定最稳固”。**科学真相**：盲目增加结构自重反而会加剧基座剪切应变与地震共振破坏！现代工程追求‘高强轻质’与‘三角形铰接桁架’受力分解，以柔克刚消解动态荷载。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g03_s1_u01_l05.html)\n\n\n### [第 16 页]\n\n![第 16 页教学插图与实验活动](figures/p16.png)\n\n标出门、窗的位置和大小。\n用橡皮泥小人比照一下门的大小。\n0. 安全提醒制作门和窗。\n用安全剪刀和儿童安全刻刀剪、刻、划的时候，另一只手不要靠太近资料SPH①照图拿好②上下移动大③沿着画剪刀。\n拇指，让剪刀口好的线剪。\n开合。\n\n### [第 17 页]\n\n![第 17 页教学插图与实验活动](figures/p17.png)\n\n交流哪里一样？哪里做了修改？\n将我们做的房子与设计图进行对照、研讨。\n设计图我们做的房子\n\n#### 🚀 拓展在我们的小房子里，再添置一些物品，如床、桌子、凳子等。\n用木材或金属做地板铺上地毯，踩肩科学院子的栅栏。\n上去会更软、更舒服"}, {"id": "sci_03_u01_l06", "lesson_idx": 32, "book": "二年级上册", "vol_dir": "03_二年级上册", "unit_no": 1, "unit_title": "第一单元造房子", "lesson_no": 6, "title": "“小房子”展示会", "page": 18, "domain": "chemistry", "domain_cn": "物质变化与化学", "sim_file": "sim_g03_s1_u01_l06.html", "code": "g03_s1_u01_l06", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "如果我们要养几盆植物，应该放在房间的什么位置比较合适？\n教育科生", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p18.webp", "p19.webp", "p20.webp", "p21.webp", "p22.webp", "p23.webp", "p24.webp", "p25.webp"], "raw_text": "### [第 18 页]\n\n![第 18 页教学插图与实验活动](figures/p18.png)\n\n## 6. “小房子”展示会\n\n\n小房子”展示会这是我们的小房子展示会出展示介绍向同学介绍自己的小房子，说一说各部分用了什么材料。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g03_s1_u01_l06.html)\n\n\n### [第 19 页]\n\n![第 19 页教学插图与实验活动](figures/p19.png)\n\n窗户是用透明这样房间塑料薄膜做的。\n会比较明亮。\n相互评价造房子是有标准的，对照下面的标准，做到的请打我们的房子”评价表评价标准自我评价他人评价\n1. 用了两种以上的材料\n2. 房子稳固，不容易变形\n3. 有足够大的门、窗\n4. 房间比较明亮\n5. 节约材料\n\n### [第 20 页]\n\n![第 20 页教学插图与实验活动](figures/p20.png)\n\n反思改进与其他组相比，我们的房子所用的材料是否合理？\n同学的哪些想法让我们受到启发？\n在合作中，我为小组做了什么？\n\n#### 🚀 拓展如果我们要养几盆植物，应该放在房间的什么位置比较合适？\n教育科生\n\n### [第 21 页]\n\n![第 21 页教学插图与实验活动](figures/p21.png)\n\n#### 📋 单元小结砖玻璃建造材料泥土金属塑料木生活用品陶瓷布动物和早期的人类用草、木、泥等自然物来建造家。\n随着材料不断更新，今天的人们使用更多的材料建造了各种各样的房子子出服社我的收获我能做到能做到的打认识了一些常见的材料怎样改进呢？\n用废旧物品造一座小房子知道与同学合作可以让房子造得更好\n\n### [第 22 页]\n\n![第 22 页教学插图与实验活动](figures/p22.png)\n\n#### 📖 科学阅读各种各样的房屋在世界各地，人们用各种各样的材料，建造了各种各样的房屋。\n屋在古代或当代一些原始部落，人们用泥巴和树枝了筑墙，用茅草盖顶，建造凉爽又透气的茅屋。\n帐篷在草原，人们为了游牧方便，建造了各种帐篷。它们可以快速搭建和拆除\n\n### [第 23 页]\n\n![第 23 页教学插图与实验活动](figures/p23.png)\n\n屋品区在寒冷的极地地贝b人们就地取材建造了独特的冰屋土楼在江西、福建等地人们用木材、泥土和砖瓦建造了独特的土楼竹楼在云南地人民利用竹子建造了部于空的竹楼利保持通风干燥\n\n### [第 24 页]\n\n![第 24 页教学插图与实验活动](figures/p24.png)\n\n密湖在黄高原地人们直接在黄土坡上挖出窑洞用来居住，冬暖夏凉。\n住宅楼在城市，人们用钢筋水泥建造各种住宅楼和高楼大厦你想象一下，请在未来，人们会用社公样的材料建造房子？\n高楼大厦\n\n### [第 25 页]\n\n![第 25 页教学插图与实验活动](figures/p25.png)\n\n第二单元地球家园教京ESP我们居住的地球神奇又美丽！这里有鸟儿歌唱，百花开放。太阳带来光和热，还有月亮、星星将地球周围的夜空点亮。我们的地球家园还有哪些美妙的自然现象？"}, {"id": "sci_03_u02_l01", "lesson_idx": 33, "book": "二年级上册", "vol_dir": "03_二年级上册", "unit_no": 2, "unit_title": "第二单元地球家园", "lesson_no": 1, "title": "地球家园有什么", "page": 26, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g03_s1_u02_l01.html", "code": "g03_s1_u02_l01", "sections": {"focus": "地球很大很大，有许多我们没有去过的地方。你知道地球上有什么吗？", "exploration": "在地球仪上我们能发现什么？找一找我国在哪里。\n仔细观察一些景物图片，说一说，图片里有什么？哪些是我们熟悉的？\n用图片向同学介绍地球家园里的景物，尝试讲述相关的小故事。", "discussion": "地球家园有什么？应该怎样描述地球家园？\n关于地球家园，我们还想了解什么？", "expansion": "说一说我们家乡的景色。这三张图片里，人们分别在做什么？", "frontier": "", "big_concept": "地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。", "misconception": ""}, "figures": ["p26.webp", "p27.webp", "p28.webp"], "raw_text": "### [第 26 页]\n\n![第 26 页教学插图与实验活动](figures/p26.png)\n\n## 1. 地球家园有什么\n\n\n地球家园有什么这是从太空中看到的地球，是人类和动植物共同生活的家园\n\n#### 🎯 聚焦地球很大很大，有许多我们没有去过的地方。你知道地球上有什么吗？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿地球科学（深地探测与“奋斗者”号深潜）**：我国“深地一号”油气钻井已穿透地下万米白垩系地层，结合地震波断层成像技术，科学家如同给地球做“超声波CT”，实时洞察地壳构造板块运动与深部地幔热柱对流！\n- 🧠 **跨学科大概念（稳定与变化 / 因果机制）**：地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。\n- ⚠️ 小学生常认为“岩石是永恒不变、坚不可摧的”。**科学真相**：在水、大气、温度变化以及植物根系分泌酸的作用下，岩石在持续发生物理风化与化学侵蚀，并在地质循环中重熔为岩浆或沉积为土壤，地表始终在缓慢而剧烈地重塑。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g03_s1_u02_l01.html)\n\n\n### [第 27 页]\n\n![第 27 页教学插图与实验活动](figures/p27.png)\n\n#### 🔬 探索在地球仪上我们能发现什么？找一找我国在哪里。\n仔细观察一些景物图片，说一说，图片里有什么？哪些是我们熟悉的？\n用图片向同学介绍地球家园里的景物，尝试讲述相关的小故事。\n\n### [第 28 页]\n\n![第 28 页教学插图与实验活动](figures/p28.png)\n\n#### 💬 研讨地球家园有什么？应该怎样描述地球家园？\n关于地球家园，我们还想了解什么？\n\n#### 🚀 拓展说一说我们家乡的景色。这三张图片里，人们分别在做什么？"}, {"id": "sci_03_u02_l02", "lesson_idx": 34, "book": "二年级上册", "vol_dir": "03_二年级上册", "unit_no": 2, "unit_title": "第二单元地球家园", "lesson_no": 2, "title": "我们的校园", "page": 29, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g03_s1_u02_l02.html", "code": "g03_s1_u02_l02", "sections": {"focus": "家校园是地球园的一部分，怎样用“观察笔记”的方式把它记录下来呢？\n教育科学抄#店", "exploration": "说一说，观察笔记应该记录什么？怎样记录？\n我的校园观察笔记日期：____月____日太阳只记自然现象要亲自观察。\n松大色的鸟人在校园中选一个区域，观察并记录这个区域的自然现象提示记录内容应该是自己真实观察到的，而不是想象或听说的。", "discussion": "校园里有哪些然现象？我们观察到的自然现象可以分为几类？\n社为什么要在观察笔记上注明日期？", "expansion": "比较大家的记录有什么不同。比较之后，再去观察一次，并修订、完善自己的记录。", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p29.webp", "p30.webp", "p31.webp"], "raw_text": "### [第 29 页]\n\n![第 29 页教学插图与实验活动](figures/p29.png)\n\n## 2. 我们的校园\n\n\n我们的校园很大校园里有房屋和操场还树小草小鸟\n\n#### 🎯 聚焦家校园是地球园的一部分，怎样用“观察笔记”的方式把它记录下来呢？\n教育科学抄#店\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g03_s1_u02_l02.html)\n\n\n### [第 30 页]\n\n![第 30 页教学插图与实验活动](figures/p30.png)\n\n#### 🔬 探索说一说，观察笔记应该记录什么？怎样记录？\n我的校园观察笔记日期：____月____日太阳只记自然现象要亲自观察。\n松大色的鸟人在校园中选一个区域，观察并记录这个区域的自然现象提示记录内容应该是自己真实观察到的，而不是想象或听说的。\n\n### [第 31 页]\n\n![第 31 页教学插图与实验活动](figures/p31.png)\n\n#### 📝 记录单我的校园观察笔记日期：\n\n#### 💬 研讨校园里有哪些然现象？我们观察到的自然现象可以分为几类？\n社为什么要在观察笔记上注明日期？\n\n#### 🚀 拓展比较大家的记录有什么不同。比较之后，再去观察一次，并修订、完善自己的记录。"}, {"id": "sci_03_u02_l03", "lesson_idx": 35, "book": "二年级上册", "vol_dir": "03_二年级上册", "unit_no": 2, "unit_title": "第二单元地球家园", "lesson_no": 3, "title": "我们周围的空气", "page": 32, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g03_s1_u02_l03.html", "code": "g03_s1_u02_l03", "sections": {"focus": "气看不见、摸不着。\n空它还有什么特征？", "exploration": "在校园里，利用塑料袋收集一些空气", "discussion": "地球家园很大，所有地方都有空气吗？\n除了在校园，我们还可以在哪里收集空气？\n与水相比，空气有什么不同？与小木块相比，空气又有什么不同？", "expansion": "焚烧秸杆空气无色、无味、草原透明。\n清新的空气令人舒适我们闻到异如果味眼目晴有刺激感空气可能被污染说一公园说哪些地方空气清雾霆天气新哪些地方空气被污染了？", "frontier": "", "big_concept": "天气变化的根本动力来自太阳辐射能量在地表的非均匀分布。赤道与极地的温差驱动了大气环流与气压梯度力，促使冷暖空气对流、水汽相变凝结成云致雨。", "misconception": ""}, "figures": ["p32.webp", "p33.webp", "p34.webp"], "raw_text": "### [第 32 页]\n\n![第 32 页教学插图与实验活动](figures/p32.png)\n\n## 3. 我们周围的空气\n\n\n我们周围的空气我们的围可气充满了空物啪的和动植不开生存鼎离空\n\n#### 🎯 聚焦气看不见、摸不着。\n空它还有什么特征？\n\n#### 🔬 探索在校园里，利用塑料袋收集一些空气\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **重大气象工程（“风云”气象卫星与数值天气预报）**：我国新一代“风云四号”高轨气象卫星搭载多通道扫描辐射计与干涉式大气垂直探测仪，能在万米高空以秒级精度捕捉强对流云系演变，驱动超级计算机每秒百亿亿次流体力学方程解算！\n- 🧠 **跨学科大概念（能量与系统流动）**：天气变化的根本动力来自太阳辐射能量在地表的非均匀分布。赤道与极地的温差驱动了大气环流与气压梯度力，促使冷暖空气对流、水汽相变凝结成云致雨。\n- ⚠️ 常见认知误区：“空气没有重量、看不见摸不着所以不算物质”。**科学真相**：空气主要由氮气和氧气分子组成，1立方米空气在标准状态下质量约为1.29千克！不仅真实占据空间，并且产生的巨大大气压强支撑着地球生命与天气变化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g03_s1_u02_l03.html)\n\n\n### [第 33 页]\n\n![第 33 页教学插图与实验活动](figures/p33.png)\n\n在走廊收集在教室收集在操场收集用收集到的空气，与水比一比，描述并记录空气的特征。\n看空气闻气味感受空气\n\n#### 📝 记录单与水相比空气的特征日期：\n气水空看得见摸得着\n\n### [第 34 页]\n\n![第 34 页教学插图与实验活动](figures/p34.png)\n\n#### 💬 研讨地球家园很大，所有地方都有空气吗？\n除了在校园，我们还可以在哪里收集空气？\n与水相比，空气有什么不同？与小木块相比，空气又有什么不同？\n\n#### 🚀 拓展焚烧秸杆空气无色、无味、草原透明。\n清新的空气令人舒适我们闻到异如果味眼目晴有刺激感空气可能被污染说一公园说哪些地方空气清雾霆天气新哪些地方空气被污染了？"}, {"id": "sci_03_u02_l04", "lesson_idx": 36, "book": "二年级上册", "vol_dir": "03_二年级上册", "unit_no": 2, "unit_title": "第二单元地球家园", "lesson_no": 4, "title": "不同的天气", "page": 35, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g03_s1_u02_l04.html", "code": "g03_s1_u02_l04", "sections": {"focus": "天气会有哪些变化？不同的天气又有什么特点呢？\n育", "exploration": "说一说我们知道的天气。\n怎样区分不同的天气？\n雨阴晴", "discussion": "你喜欢哪种天气？说一说你的理由。\n雨、雪、风等天气对我们的影响和对动物的影响一样吗？\n不同天气对植物都是有利的吗？说一说你的想法。\n!9 (Z uq<\n燕子低飞", "expansion": "晒秋查阅资料，了解雷雨天应该注意什么。", "frontier": "", "big_concept": "天气变化的根本动力来自太阳辐射能量在地表的非均匀分布。赤道与极地的温差驱动了大气环流与气压梯度力，促使冷暖空气对流、水汽相变凝结成云致雨。", "misconception": ""}, "figures": ["p35.webp", "p36.webp", "p37.webp"], "raw_text": "### [第 35 页]\n\n![第 35 页教学插图与实验活动](figures/p35.png)\n\n## 4. 不同的天气\n\n\n不同的天气雨后，天气会变得凉爽，小朋友和小动物都会出来玩耍\n\n#### 🎯 聚焦天气会有哪些变化？不同的天气又有什么特点呢？\n育\n\n#### 🔬 探索说一说我们知道的天气。\n怎样区分不同的天气？\n雨阴晴\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **重大气象工程（“风云”气象卫星与数值天气预报）**：我国新一代“风云四号”高轨气象卫星搭载多通道扫描辐射计与干涉式大气垂直探测仪，能在万米高空以秒级精度捕捉强对流云系演变，驱动超级计算机每秒百亿亿次流体力学方程解算！\n- 🧠 **跨学科大概念（能量与系统流动）**：天气变化的根本动力来自太阳辐射能量在地表的非均匀分布。赤道与极地的温差驱动了大气环流与气压梯度力，促使冷暖空气对流、水汽相变凝结成云致雨。\n- ⚠️ 常见认知误区：“空气没有重量、看不见摸不着所以不算物质”。**科学真相**：空气主要由氮气和氧气分子组成，1立方米空气在标准状态下质量约为1.29千克！不仅真实占据空间，并且产生的巨大大气压强支撑着地球生命与天气变化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g03_s1_u02_l04.html)\n\n\n### [第 36 页]\n\n![第 36 页教学插图与实验活动](figures/p36.png)\n\n说一说各种天气对我们的生活以及对动植物的影响。\n放风筝今天是什么天气？\n雨后蚯蚓描述天气的特点并记录提示记录天气现象出下来。\n现的具体时间和地点。\n\n#### 📝 记录单天气的特点地点：校园日期：____月____日天气的特点地点：\n日期：\n风很大，树枝推动得厉害教有抑树\n\n### [第 37 页]\n\n![第 37 页教学插图与实验活动](figures/p37.png)\n\n#### 💬 研讨你喜欢哪种天气？说一说你的理由。\n雨、雪、风等天气对我们的影响和对动物的影响一样吗？\n不同天气对植物都是有利的吗？说一说你的想法。\n!9 (Z uq<\n燕子低飞\n\n#### 🚀 拓展晒秋查阅资料，了解雷雨天应该注意什么。"}, {"id": "sci_03_u02_l05", "lesson_idx": 37, "book": "二年级上册", "vol_dir": "03_二年级上册", "unit_no": 2, "unit_title": "第二单元地球家园", "lesson_no": 5, "title": "不同的季节", "page": 38, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g03_s1_u02_l05.html", "code": "g03_s1_u02_l05", "sections": {"focus": "在不同的季节，我们的地球家园发生了哪些变化？", "exploration": "现在是什么季节？我们观察到了什么现象？\n交流一下，我们身边的动植物在其他季节有什么不同？\n春冬选择合适的卡片，放进“季节盒子中秋冬", "discussion": "在不同的季节，我们看到的现象有什么不同？\n不同的季节对我们的 **前沿空间探索（中国探月与深空探测工程）**：从“嫦娥六号”实现人类首次月背采样返回，到“祝融号”火星车巡视火星乌托邦平原，航天科学家利用精密轨道力学与光谱分析，正在解开太阳系演化与地月系统的终极奥秘！\n- 🧠 **跨学科大概念（系统与模型 / CER 推理）**：天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。\n- ⚠️ 很多同学误以为“月相变化是地球的影子挡住了月亮”。**科学真相**：地球影子挡住月球的现象是罕见的“月食”；而平时的初一到十五月相变化，纯粹是因为月球绕地球公转时，我们在地球上看到的月球被太阳照亮的半球面角度不同！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g03_s1_u02_l06.html)\n\n\n### [第 42 页]\n\n![第 42 页教学插图与实验活动](figures/p42.png)\n\n北寻找东、南、西、北的规律西东面向东，向右转是南，再向右转是西...资料早晨起来，面向太阳前面是东，后面是西，左面是北，右面是南。\n\n#### 📝 记录单记录一社太阳位置观察笔记天中太阳日期：\n的位置。\n在空白处的合适位置画上太阳。\n\n### [第 43 页]\n\n![第 43 页教学插图与实验活动](figures/p43.png)\n\n#### 💬 研讨一天中，太阳在天空中的位置是怎样变化的？\n我们怎样通过一天中太阳位置的变化来辨认方向？\n\n#### 🚀 拓展太阳能够发光发热举例说一说太阳对动植物和我们生活的影响早晨的牵牛花中午阳光照射下的牵牛花"}, {"id": "sci_03_u02_l07", "lesson_idx": 39, "book": "二年级上册", "vol_dir": "03_二年级上册", "unit_no": 2, "unit_title": "第二单元地球家园", "lesson_no": 7, "title": "夜晚的月亮", "page": 44, "domain": "astronomy", "domain_cn": "综合科学探究", "sim_file": "sim_g03_s1_u02_l07.html", "code": "g03_s1_u02_l07", "sections": {"focus": "太阳看起来是圆的，我们看到的月亮形状是什么样的？", "exploration": "说一说我们看到过哪几种月亮形状连续几天对月亮形状进行实际观察，并记录下来。\n涂阴影记录", "discussion": "我们每天都能看见月亮吗？\n月亮的形状每天都相同吗？\n月亮给我们的生活带来了什么？\n教有", "expansion": "查阅资料，了解我国有哪些关于月亮的神话传说。\n思考这些神话传说是真的吗。", "frontier": "", "big_concept": "天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。", "misconception": ""}, "figures": ["p44.webp", "p45.webp", "p46.webp", "p47.webp", "p48.webp", "p49.webp", "p50.webp"], "raw_text": "### [第 44 页]\n\n![第 44 页教学插图与实验活动](figures/p44.png)\n\n## 7. 夜晚的月亮\n\n\n夜晚的月亮夜晚我们常常能看到月亮\n\n#### 🎯 聚焦太阳看起来是圆的，我们看到的月亮形状是什么样的？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿空间探索（中国探月与深空探测工程）**：从“嫦娥六号”实现人类首次月背采样返回，到“祝融号”火星车巡视火星乌托邦平原，航天科学家利用精密轨道力学与光谱分析，正在解开太阳系演化与地月系统的终极奥秘！\n- 🧠 **跨学科大概念（系统与模型 / CER 推理）**：天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。\n- ⚠️ 很多同学误以为“月相变化是地球的影子挡住了月亮”。**科学真相**：地球影子挡住月球的现象是罕见的“月食”；而平时的初一到十五月相变化，纯粹是因为月球绕地球公转时，我们在地球上看到的月球被太阳照亮的半球面角度不同！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g03_s1_u02_l07.html)\n\n\n### [第 45 页]\n\n![第 45 页教学插图与实验活动](figures/p45.png)\n\n#### 🔬 探索说一说我们看到过哪几种月亮形状连续几天对月亮形状进行实际观察，并记录下来。\n涂阴影记录\n\n### [第 46 页]\n\n![第 46 页教学插图与实验活动](figures/p46.png)\n\n提示不要忘记写上观察的日期。\n剪纸片记录\n\n#### 💬 研讨我们每天都能看见月亮吗？\n月亮的形状每天都相同吗？\n月亮给我们的生活带来了什么？\n教有\n\n#### 🚀 拓展查阅资料，了解我国有哪些关于月亮的神话传说。\n思考这些神话传说是真的吗。\n\n### [第 47 页]\n\n![第 47 页教学插图与实验活动](figures/p47.png)\n\n#### 📋 单元小结植物的家地球与生物动物的家地球阴晴雨雪风天气与季节家园春夏秋冬太阳东升西落太阳和月亮月亮圆缺变化地球是我们和动植物共同生活的地方，让我们亲近然走进保护我们的地球家园。\n我的收获我能做到能做到的打能描述天气、季节、太阳位置和月亮形状的变化能用图画和文字真实地记录百怎样改进呢？\n自然现象更加喜欢观察地球家园里的一草\n\n### [第 48 页]\n\n![第 48 页教学插图与实验活动](figures/p48.png)\n\n#### 📖 科学阅读菊花秋天开放的秘密夏天，菊花枝繁叶茂，却不会开花。相反，一到秋天，哪怕很瘦弱的花枝也会开出一两朵菊花。这是什么原因呢？\n原来，菊花是典型的短日照植物，靠辨别黑夜的长度来开花。秋天来了，日照缩短到一定程度的时候，菊花就会开花。掌管这一切的，是一种叫作开花素的物质。当叶子“看见”太阳光变化的时候，在叶片中合成的开花素会被送到枝头的花芽，花芽收到指令之后就慢慢开花。\n许多植物开花都受阳光的“指挥”\n\n### [第 49 页]\n\n![第 49 页教学插图与实验活动](figures/p49.png)\n\n蓑羽鹤喜马拉雅山脉绵延2400多千米，它的9000. 米，是世界主峰珠穆朗玛峰的海拔将近最高峰。\n由于喜马拉雅山脉十分险峻，有人认为它是鸟类无法飞越的山。但是，蓑羽鹤每年秋季都会成群结队地飞越喜马拉雅山脉，到达温暖的地区过冬蓑羽鹤\n\n### [第 50 页]\n\n![第 50 页教学插图与实验活动](figures/p50.png)\n\n后记本套科学教科书由根据《义务教育科学课程标准（2022年版）》组织编写。编写团队由科研院所和高校的科学家、教育教学专家以及全国各地的优秀科学教师、教研员组成，周忠和院士与张红霞教授共同担任主编。\n编写过程中，我们得到了诸多科学家、教研员和一线教师的支持与帮助。\n李金华、张智慧、李博强、杨顺华、魏科、石承民、李实、张金海等为教科书编写提供了专业审查和咨询意见，高伟组织并参与编写了“制作天文望远镜”等单元。此外，还有很多单位、专家和同仁为我们提供了审读、插图、资料等方面的支持和帮助。他们的参与为确保教科书内容的科学性、适切性提供了重要支撑，在此一并表示诚挚谢意！\n我们真诚地欢迎广大师生和社会各界人士对教科书提出宝贵意见，帮助我们共同打造培根铸魂、启智增慧的精品教材。子出片反不土电子邮箱：science@esph.com.cn"}, {"id": "sci_04_u01_l01", "lesson_idx": 40, "book": "二年级下册", "vol_dir": "04_二年级下册", "unit_no": 1, "unit_title": "第一单元探秘恐龙", "lesson_no": 1, "title": "恐龙的故事", "page": 2, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g04_s2_u01_l01.html", "code": "g04_s2_u01_l01", "sections": {"focus": "学出恐龙有什么特点呢？", "exploration": "说一说我们知道的恐龙和它们的特点。\n给恐龙分类。", "discussion": "我们知道恐龙有哪些特点？\n出我们用了哪些分类标准？", "expansion": "阅读有关恐龙的书籍，我们对恐龙会知道得更多，也会知道它们去了哪里。", "frontier": "", "big_concept": "生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。", "misconception": ""}, "figures": ["p02.webp", "p03.webp", "p04.webp"], "raw_text": "### [第 2 页]\n\n![第 2 页教学插图与实验活动](figures/p02.png)\n\n## 1. 恐龙的故事\n\n\n恐龙的故事恐龙是曾经生活在地球上的动物，但我们现在只能看到各种各样“复原的恐龙\n\n#### 🎯 聚焦学出恐龙有什么特点呢？\n\n#### 🔬 探索说一说我们知道的恐龙和它们的特点。\n给恐龙分类。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿古生物学与生态基因库（国家基因库与恐龙羽毛演化）**：我国热河生物群带羽毛恐龙（如中华龙鸟）化石的发现，无可辩驳地确立了“现代鸟类是由兽脚类恐龙演化而来”的里程碑定论；高通量基因测序技术更重构了全球物种生命树与食物网脆弱度阈值。\n- 🧠 **跨学科大概念（尺度与比例 / 生态位）**：生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。\n- ⚠️ 很多同学误以为“凶猛的肉食动物消灭弱小食草动物对大自然有害”。**科学真相**：顶级捕食者能控制食草动物种群数量以防止过度啃食植被草原（营养级联效应），捕食体弱病体反而促进了种群基因库的健康优化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g04_s2_u01_l01.html)\n\n\n### [第 3 页]\n\n![第 3 页教学插图与实验活动](figures/p03.png)\n\n确定一种分类标准，将上面六种恐龙分为两类，按照颈的长短，我将恐龙分成了两类。\n并填写在记录单中。\n我按照是不是四肢行走分类。\n\n### [第 4 页]\n\n![第 4 页教学插图与实验活动](figures/p04.png)\n\n#### 📝 记录单给恐龙分类日期：\n分类方法1：\n分类方法2：\n\n#### 💬 研讨我们知道恐龙有哪些特点？\n出我们用了哪些分类标准？\n\n#### 🚀 拓展阅读有关恐龙的书籍，我们对恐龙会知道得更多，也会知道它们去了哪里。"}, {"id": "sci_04_u01_l02", "lesson_idx": 41, "book": "二年级下册", "vol_dir": "04_二年级下册", "unit_no": 1, "unit_title": "第一单元探秘恐龙", "lesson_no": 2, "title": "挖掘恐龙“化石”", "page": 5, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g04_s2_u01_l02.html", "code": "g04_s2_u01_l02", "sections": {"focus": "博物馆里的恐龙骨骼化石是怎样得到的呢？\n我们能使用工具模拟挖掘恐龙“化石”吗？", "exploration": "科学星认识基本工具资料放大镜喷水壶护目镜安全使用锤子使用前，检查锤子是否牢固·使用时，锤头对准物体敲打，力量先小后大。\n·使用后，将锤子放回原处。\n锤子凿子刷子", "discussion": "挖掘时，我们为何选择不同的工具？\n挖掘时，怎样做才不易对“化石”造成损坏？\n想一想，在哪里可能挖到真正的恐龙化石？", "expansion": "挖掘查阅资料，了解恐龙化石是怎样来到博物馆的。\n修理复原陈列", "frontier": "", "big_concept": "生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。", "misconception": ""}, "figures": ["p05.webp", "p06.webp", "p07.webp", "p08.webp"], "raw_text": "### [第 5 页]\n\n![第 5 页教学插图与实验活动](figures/p05.png)\n\n## 2. 挖掘恐龙“化石”\
