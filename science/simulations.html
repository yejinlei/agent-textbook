, "big_concept": "电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。", "misconception": ""}, "figures": ["p28.webp", "p29.webp", "p30.webp"], "raw_text": "### [第 28 页]\n\n![第 28 页教学插图与实验活动](figures/p28.png)\n\n## 1. 磁铁能吸引什么\n\n\n磁铁能吸引什么生活中很多地方都有磁铁\n\n#### 🎯 聚焦我们见过哪些磁铁？\n它们能吸引什么物体？\n\n#### 🔬 探索观察三种磁铁，说一说我们的想法。\n条形磁铁蹄形磁铁环形磁铁\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **国家重大电力装备（特高压直流输电与常温超导研究）**：我国特高压输电技术世界领先，±1100千伏昌吉-古泉特高压工程跨越数千公里输送清洁能源；而在前沿物理实验室中，高温超导磁悬浮列车试验线已突破时速600公里，实现零接触低阻抗飞驰！\n- 🧠 **跨学科大概念（闭合回路与能量转换）**：电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。\n- ⚠️ 很多孩子认为“电线里的电像水管里的水一样从电池正极流到负极，流完电池就空了”。**科学真相**：导线金属内部早已有海量的自由电子；闭合开关瞬间，电场以光速在回路中建立，整个回路中的电子几乎同时开始定向微观漂移，消耗的是电池的化学势能而非‘电子本身’！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g04_s2_u02_l01.html)\n\n\n### [第 29 页]\n\n![第 29 页教学插图与实验活动](figures/p29.png)\n\n生活中哪些物体能被磁铁吸引？先观察，再猜一猜，然后用磁铁测试，并将物体分成两类。\n\n#### 📝 记录单磁铁能吸引哪些物体日期：\n方法能被磁铁吸引不能被磁铁吸引猜测测试我的发现：\n\n### [第 30 页]\n\n![第 30 页教学插图与实验活动](figures/p30.png)\n\n探究用磁铁找一找，教室里哪些物体是用铁一类材料做的？\n\n#### 💬 研讨生活中有哪些不同形状的磁铁？\n磁铁能吸引什么材料做的物体？\n\n#### 🚀 拓展除了铁之外磁铁还能有些硬币吸引由镍等金中含有镍！\n属材料制成的物体。"}, {"id": "sci_04_u02_l02", "lesson_idx": 48, "book": "二年级下册", "vol_dir": "04_二年级下册", "unit_no": 2, "unit_title": "第二单元玩磁铁", "lesson_no": 2, "title": "比较力量的大小", "page": 31, "domain": "physics_em", "domain_cn": "综合科学探究", "sim_file": "sim_g04_s2_u02_l02.html", "code": "g04_s2_u02_l02", "sections": {"focus": "不同磁铁吸引物体的力量一样大吗？，怎样比较？", "exploration": "不同磁铁吸引大头针或垫圈的力量一样大吗？怎样比较？", "discussion": "有哪些方法可以比较磁铁吸引物体的力量大小？\n弹簧被磁铁吸引时，发生了什么变化？", "expansion": "不要玩此类磁铁，它吸引物体时会产生很大的力量，容易使人受伤。\n钦铁硼磁铁", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p31.webp", "p32.webp", "p33.webp"], "raw_text": "### [第 31 页]\n\n![第 31 页教学插图与实验活动](figures/p31.png)\n\n## 2. 比较力量的大小\n\n\n比较力量的大小小小的磁铁能吸起这么多回形针，力量真不小啊！\n\n#### 🎯 聚焦不同磁铁吸引物体的力量一样大吗？，怎样比较？\n\n#### 🔬 探索不同磁铁吸引大头针或垫圈的力量一样大吗？怎样比较？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g04_s2_u02_l02.html)\n\n\n### [第 32 页]\n\n![第 32 页教学插图与实验活动](figures/p32.png)\n\n#### 📝 记录单比较不同磁铁吸引物体的力量日期：\n不同磁铁大头针数量垫圈数量\n1. 号\n2. 号还有别的比较方法吗？\n用不同的力去按压或拉伸弹簧，它的形状发生了怎样的变化？\n按压弹簧拉伸弹簧\n\n### [第 33 页]\n\n![第 33 页教学插图与实验活动](figures/p33.png)\n\n你能想办法比较不同磁铁吸引弹簧的力量大小吗？\n\n#### 💬 研讨有哪些方法可以比较磁铁吸引物体的力量大小？\n弹簧被磁铁吸引时，发生了什么变化？\n\n#### 🚀 拓展不要玩此类磁铁，它吸引物体时会产生很大的力量，容易使人受伤。\n钦铁硼磁铁"}, {"id": "sci_04_u02_l03", "lesson_idx": 49, "book": "二年级下册", "vol_dir": "04_二年级下册", "unit_no": 2, "unit_title": "第二单元玩磁铁", "lesson_no": 3, "title": "让小车动起来", "page": 34, "domain": "physics_em", "domain_cn": "综合科学探究", "sim_file": "sim_g04_s2_u02_l03.html", "code": "g04_s2_u02_l03", "sections": {"focus": "我们有多少种方法让这辆小车动起来？\n教育科学出", "exploration": "拉力拉动小车。\n我们还见过哪些拉力现象？", "discussion": "举例说一说生活中的拉力和推力。\n磁铁吸引物体的力量与拉力、推力有什么不同？", "expansion": "玩“蝴蝶飞”游戏。\n磁铁不能接触“蝴蝶”。", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p34.webp", "p35.webp", "p36.webp"], "raw_text": "### [第 34 页]\n\n![第 34 页教学插图与实验活动](figures/p34.png)\n\n## 3. 让小车动起来\n\n\n让小车动起来j品这是一辆铁架四轮小车，让它运动起来的方法有很多\n\n#### 🎯 聚焦我们有多少种方法让这辆小车动起来？\n教育科学出\n\n#### 💡 科学词汇\n\n#### 🔬 探索拉力拉动小车。\n我们还见过哪些拉力现象？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g04_s2_u02_l03.html)\n\n\n### [第 35 页]\n\n![第 35 页教学插图与实验活动](figures/p35.png)\n\n推动小车。\n\n#### 💡 科学词汇我们还见过哪些推力现象？\n推力推动小车推开门不接触小车，能让小车动起来吗？\n\n### [第 36 页]\n\n![第 36 页教学插图与实验活动](figures/p36.png)\n\n#### 💬 研讨举例说一说生活中的拉力和推力。\n磁铁吸引物体的力量与拉力、推力有什么不同？\n\n#### 🚀 拓展玩“蝴蝶飞”游戏。\n磁铁不能接触“蝴蝶”。"}, {"id": "sci_04_u02_l04", "lesson_idx": 50, "book": "二年级下册", "vol_dir": "04_二年级下册", "unit_no": 2, "unit_title": "第二单元玩磁铁", "lesson_no": 4, "title": "隔物吸铁", "page": 37, "domain": "physics_em", "domain_cn": "综合科学探究", "sim_file": "sim_g04_s2_u02_l04.html", "code": "g04_s2_u02_l04", "sections": {"focus": "磁铁能隔着纸吸引铁做的回形针，隔着其他物体也可以吗？", "exploration": "磁铁能隔着哪些物体吸引回形针？先猜测，再用磁铁检测，将物体分成两类。\n班级记录单磁铁隔物吸引回形针实验社日期：\n方法能吸引不能吸引猜测检测我们的发现：", "discussion": "磁铁能隔着怎样的物体吸铁？\n磁铁能隔着水等液体吸铁吗？", "expansion": "用磁铁玩“回形针走迷宫”游戏。", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p37.webp", "p38.webp", "p39.webp"], "raw_text": "### [第 37 页]\n\n![第 37 页教学插图与实验活动](figures/p37.png)\n\n## 4. 隔物吸铁\n\n\n隔物吸铁小鸭孕游同学们在玩鸭泳游戏原来小子身上铁做的回形针！\n\n#### 🎯 聚焦磁铁能隔着纸吸引铁做的回形针，隔着其他物体也可以吗？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g04_s2_u02_l04.html)\n\n\n### [第 38 页]\n\n![第 38 页教学插图与实验活动](figures/p38.png)\n\n#### 🔬 探索磁铁能隔着哪些物体吸引回形针？先猜测，再用磁铁检测，将物体分成两类。\n班级记录单磁铁隔物吸引回形针实验社日期：\n方法能吸引不能吸引猜测检测我们的发现：\n\n### [第 39 页]\n\n![第 39 页教学插图与实验活动](figures/p39.png)\n\n磁铁能吸引水中的回形针吗？\n\n#### 💬 研讨磁铁能隔着怎样的物体吸铁？\n磁铁能隔着水等液体吸铁吗？\n\n#### 🚀 拓展用磁铁玩“回形针走迷宫”游戏。"}, {"id": "sci_04_u02_l05", "lesson_idx": 51, "book": "二年级下册", "vol_dir": "04_二年级下册", "unit_no": 2, "unit_title": "第二单元玩磁铁", "lesson_no": 5, "title": "设计钓鱼玩具", "page": 40, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g04_s2_u02_l05.html", "code": "g04_s2_u02_l05", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。", "misconception": ""}, "figures": ["p40.webp", "p41.webp", "p42.webp"], "raw_text": "### [第 40 页]\n\n![第 40 页教学插图与实验活动](figures/p40.png)\n\n## 5. 设计钓鱼玩具\n\n\n设计钓鱼玩具存鱼细心具观察钓鱼中的我里面藏着们的老朋友明确任务让我们来设计并制作个能钓起很多鱼的玩具吧！\n言用提供的材料设计并制作钓鱼玩具。\n钓鱼线长度至少半米。\n半分钟内至少钓起5条鱼。\n与同学合作完成。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿古生物学与生态基因库（国家基因库与恐龙羽毛演化）**：我国热河生物群带羽毛恐龙（如中华龙鸟）化石的发现，无可辩驳地确立了“现代鸟类是由兽脚类恐龙演化而来”的里程碑定论；高通量基因测序技术更重构了全球物种生命树与食物网脆弱度阈值。\n- 🧠 **跨学科大概念（尺度与比例 / 生态位）**：生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。\n- ⚠️ 很多同学误以为“凶猛的肉食动物消灭弱小食草动物对大自然有害”。**科学真相**：顶级捕食者能控制食草动物种群数量以防止过度啃食植被草原（营养级联效应），捕食体弱病体反而促进了种群基因库的健康优化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g04_s2_u02_l05.html)\n\n\n### [第 41 页]\n\n![第 41 页教学插图与实验活动](figures/p41.png)\n\n体验试一试，用普通钧钩能在半分钟内钓起5条鱼吗？\n设计方案利用下列材料和工具，我们可以怎样设计？\n把回形针别把磁铁粘小鱼和有几种方法呢？\n在小鱼上，用磁在小鱼上，用钓钩都用上铁做钓钩。\n回形针做钓钩。\n磁铁。\n\n### [第 42 页]\n\n![第 42 页教学插图与实验活动](figures/p42.png)\n\n把我们的想法画下来吧！\n\n#### 📝 记录单钓鱼玩具设计图日期：\n木棒回形针小鱼磁铁棉线听一听其他小组的想法，继续修改我们的设计图。"}, {"id": "sci_04_u02_l06", "lesson_idx": 52, "book": "二年级下册", "vol_dir": "04_二年级下册", "unit_no": 2, "unit_title": "第二单元玩磁铁", "lesson_no": 6, "title": "我们来钓鱼", "page": 43, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g04_s2_u02_l06.html", "code": "g04_s2_u02_l06", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。", "misconception": ""}, "figures": ["p43.webp", "p44.webp", "p45.webp", "p46.webp", "p47.webp", "p48.webp", "p49.webp", "p50.webp", "p51.webp"], "raw_text": "### [第 43 页]\n\n![第 43 页教学插图与实验活动](figures/p43.png)\n\n## 6. 我们来钓鱼\n\n\n我们来钓鱼实施方案根据设计图，制作钓鱼玩具测试评价子出用我们制作的钓鱼玩具来钓鱼。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿古生物学与生态基因库（国家基因库与恐龙羽毛演化）**：我国热河生物群带羽毛恐龙（如中华龙鸟）化石的发现，无可辩驳地确立了“现代鸟类是由兽脚类恐龙演化而来”的里程碑定论；高通量基因测序技术更重构了全球物种生命树与食物网脆弱度阈值。\n- 🧠 **跨学科大概念（尺度与比例 / 生态位）**：生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。\n- ⚠️ 很多同学误以为“凶猛的肉食动物消灭弱小食草动物对大自然有害”。**科学真相**：顶级捕食者能控制食草动物种群数量以防止过度啃食植被草原（营养级联效应），捕食体弱病体反而促进了种群基因库的健康优化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g04_s2_u02_l06.html)\n\n\n### [第 44 页]\n\n![第 44 页教学插图与实验活动](figures/p44.png)\n\n钓鱼玩具评价表项目要求完成度\n1. 用提供的材料设计并制作钓鱼玩具\n2. 钧鱼线长度至少半米\n3. 半分钟内至少钓起5条鱼：与同学合作完成反思改进哪\n3. 个组钓起的鱼比较多？讨论其中的原因用了两块磁铁后，把磁铁粘在鱼身力量更大了！\n上，钓鱼更方便！\n\n### [第 45 页]\n\n![第 45 页教学插图与实验活动](figures/p45.png)\n\n怎样改进我们的钓鱼玩具？先讨论，再设计、制作、测试。\n如果鱼离我们更远，应该怎样改进？\n要钧更大的鱼，应该怎样改进？\n教育耕学出钓钩不接触鱼，能钓起能一次钓起鱼吗？\n两条鱼吗？\n\n### [第 46 页]\n\n![第 46 页教学插图与实验活动](figures/p46.png)\n\n#### 📋 单元小结有不同的形状可以吸引铁、镍等材料磁铁能隔物吸铁、镍等材料能使弹簧变形能推动或拉动小车小小磁铁形状多，隔物能吸铁和镍，推拉小车很厉害，钓起鱼来真痛快。\n我的收获社我能做到能做到的打认识三种不同形状的磁铁怎样改进呢？\n知道生活中很多地方都有磁铁积极参与设计并制作磁铁钓鱼玩具\n\n### [第 47 页]\n\n![第 47 页教学插图与实验活动](figures/p47.png)\n\n#### 📖 科学阅读磁铁用处大生活中有很多地方用到了磁铁，如门吸、冰箱密封条、手包扣、喇叭等物品。\n磁铁让我们的生活更方便。\n冰箱密封条门吸手包扣喇叭\n\n### [第 48 页]\n\n![第 48 页教学插图与实验活动](figures/p48.png)\n\n我们已经知道磁铁有很多用途，但它也有捣乱的时候。不能用强磁铁去靠近一些物、如手机、计算机、磁卡、手表等。\n半趣计算机手表手机\n\n### [第 49 页]\n\n![第 49 页教学插图与实验活动](figures/p49.png)\n\n磁铁从哪里来在古代，人们在开采铁矿时发现了一些神奇的石头，它们能吸铁，这些能吸铁的石头就是天然磁石。\n现在，人们不用寻找天然磁石了，而是在工厂里把材料做成各种形状，例如条形、环形、蹄形等，再用机器把这些材料磁化成磁铁。我们上课时用的磁铁都是工厂里制作出来的，它们吸引物体时的力量比天然磁石大多了！\n出不同形状的磁铁天然磁石\n\n### [第 50 页]\n\n![第 50 页教学插图与实验活动](figures/p50.png)\n\n后记本套科学教科书由根据《义务教育科学课程标准（2022年版）》组织编写。编写团队由科研院所和高校的科学家、教育教学专家以及全国各地的优秀科学教师、教研员组成，周忠和院士与张红霞教授共同担任主编。\n编写过程中，我们得到了诸多科学家、教研员和一线教师的支持与帮助。\n李金华、张智慧、李博强、杨顺华、魏科、石承民、李实、张金海等为教科书编写提供了专业审查和咨询意见，高伟组织并参与编写了“制作天文望远镜”等单元。此外，还有很多单位、专家和同仁为我们提供了审读、插图、资料等方面的支持和帮助。他们的参与为确保教科书内容的科学性、适切性提供了重要支撑，在此一并表示诚挚谢意！\n我们真诚地欢迎广大师生和社会各界人士对教科书提出宝贵意见，帮助我们共同打造培根铸魂、启智增慧的精品教材。子出片反不电子邮箱：science@esph.com.cn\n\n### [第 51 页]\n\n![第 51 页教学插图与实验活动](figures/p51.png)\n\n教育科美女。班级姓名学号"}, {"id": "sci_05_u01_l01", "lesson_idx": 53, "book": "三年级上册", "vol_dir": "05_三年级上册", "unit_no": 1, "unit_title": "第一单元天气", "lesson_no": 1, "title": "我们关心天气", "page": 2, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g05_s1_u01_l01.html", "code": "g05_s1_u01_l01", "sections": {"focus": "我们已经知道了阴、晴、雨、雪等天气现象，还感受到了天气的变化。\n关于天气，我们还知道些什么？", "exploration": "1. 我们常用哪些词和句来描述天气？\n班级记录单描述天气的词和句日期：\n类型词、句表示冷热炎热、寒冷表示刮风表示阴晴表示雨雪", "discussion": "1. 我们可以从哪几个方面观察、记录天气？\n2. 大气圈里有哪些天气现象？说一说我们对大气圈的认识。\n拓拓展展在本单元的学习中，我们将要做多次天气观测记录。", "expansion": "", "frontier": "", "big_concept": "天气变化的根本动力来自太阳辐射能量在地表的非均匀分布。赤道与极地的温差驱动了大气环流与气压梯度力，促使冷暖空气对流、水汽相变凝结成云致雨。", "misconception": ""}, "figures": ["p02.webp", "p03.webp", "p04.webp"], "raw_text": "### [第 2 页]\n\n![第 2 页教学插图与实验活动](figures/p02.png)\n\n## 1. 我们关心天气\n\n\n我们关心天气刚才还下着雨，一转眼，雨过天晴，一道彩虹出现在天空中。\n\n#### 🎯 聚焦我们已经知道了阴、晴、雨、雪等天气现象，还感受到了天气的变化。\n关于天气，我们还知道些什么？\n\n#### 🔬 探索\n\n1. 我们常用哪些词和句来描述天气？\n班级记录单描述天气的词和句日期：\n类型词、句表示冷热炎热、寒冷表示刮风表示阴晴表示雨雪\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **重大气象工程（“风云”气象卫星与数值天气预报）**：我国新一代“风云四号”高轨气象卫星搭载多通道扫描辐射计与干涉式大气垂直探测仪，能在万米高空以秒级精度捕捉强对流云系演变，驱动超级计算机每秒百亿亿次流体力学方程解算！\n- 🧠 **跨学科大概念（能量与系统流动）**：天气变化的根本动力来自太阳辐射能量在地表的非均匀分布。赤道与极地的温差驱动了大气环流与气压梯度力，促使冷暖空气对流、水汽相变凝结成云致雨。\n- ⚠️ 常见认知误区：“空气没有重量、看不见摸不着所以不算物质”。**科学真相**：空气主要由氮气和氧气分子组成，1立方米空气在标准状态下质量约为1.29千克！不仅真实占据空间，并且产生的巨大大气压强支撑着地球生命与天气变化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g05_s1_u01_l01.html)\n\n\n### [第 3 页]\n\n![第 3 页教学插图与实验活动](figures/p03.png)\n\n2. 观察今天的天气，用简单的图画、词句记录下来。\n\n#### 📝 记录单天气观察记录地点：日期：\n3. 阅读资料，与同学分享你的收获。\n地球被一层厚厚的大气包围着，大气中含有氮气、氧气、水汽等，我们称它为大气圈。其中，靠近地面的大气经常发生水平运动和垂直运动，于是在这里会发生风、云、雨、雪等天气现象。\n太阳冷云上升雨雪大水平运动气流气下沉风沉下圈气流热流气地面大气圈示意图\n\n### [第 4 页]\n\n![第 4 页教学插图与实验活动](figures/p04.png)\n\n#### 💬 研讨\n\n1. 我们可以从哪几个方面观察、记录天气？\n2. 大气圈里有哪些天气现象？说一说我们对大气圈的认识。\n拓拓展展在本单元的学习中，我们将要做多次天气观测记录。\n\n#### 📝 记录单天气观测记录地点：日期：地点：日期：\n地点：日期：地点：日期：\n地点：日期：地点：日期：\n地点：日期：地点：日期："}, {"id": "sci_05_u01_l02", "lesson_idx": 54, "book": "三年级上册", "vol_dir": "05_三年级上册", "unit_no": 1, "unit_title": "第一单元天气", "lesson_ , "title": "测量气温", "page": 8, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g05_s1_u01_l03.html", "code": "g05_s1_u01_l03", "sections": {"focus": "怎样利用气温计测量一天中气温的变化呢？气温变化有规律吗？", "exploration": "1. 了解气温计的使用方法。\n测量气温时，要把气温计放在百叶箱里，百叶箱放置在通风良好、不受阻挡的草坪上，气温计离地面 1.5 米。\n没有百叶箱时，我们用简易的方法。", "discussion": "1. 我的记录和同学的记录相同吗？为什么要严格按照气温计的使用方法测量气温？\n2. 室外一天中的气温是怎样变化的？\n3. 将多个涂色后的气温计模型图按照时间顺序连续排列，这样描述气温有什么优点？\n拓拓展展一天中什么时候气温最低？从放学后到睡觉前，继续每隔 2 小时测一次室外同一地点的气温，同时通过查阅天气资料，了解当地一天中气温的最低点。", "expansion": "", "frontier": "", "big_concept": "天气变化的根本动力来自太阳辐射能量在地表的非均匀分布。赤道与极地的温差驱动了大气环流与气压梯度力，促使冷暖空气对流、水汽相变凝结成云致雨。", "misconception": ""}, "figures": ["p08.webp", "p09.webp", "p10.webp"], "raw_text": "### [第 8 页]\n\n![第 8 页教学插图与实验活动](figures/p08.png)\n\n## 3. 测量气温\n\n\n测量气温早晨，太阳还没升起，感觉比较凉爽甚至寒冷；\n中午，太阳当空照，天气变得暖和甚至炎热。\n\n#### 🎯 聚焦怎样利用气温计测量一天中气温的变化呢？气温变化有规律吗？\n\n#### 🔬 探索\n\n1. 了解气温计的使用方法。\n测量气温时，要把气温计放在百叶箱里，百叶箱放置在通风良好、不受阻挡的草坪上，气温计离地面 1.5 米。\n没有百叶箱时，我们用简易的方法。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **重大气象工程（“风云”气象卫星与数值天气预报）**：我国新一代“风云四号”高轨气象卫星搭载多通道扫描辐射计与干涉式大气垂直探测仪，能在万米高空以秒级精度捕捉强对流云系演变，驱动超级计算机每秒百亿亿次流体力学方程解算！\n- 🧠 **跨学科大概念（能量与系统流动）**：天气变化的根本动力来自太阳辐射能量在地表的非均匀分布。赤道与极地的温差驱动了大气环流与气压梯度力，促使冷暖空气对流、水汽相变凝结成云致雨。\n- ⚠️ 常见认知误区：“空气没有重量、看不见摸不着所以不算物质”。**科学真相**：空气主要由氮气和氧气分子组成，1立方米空气在标准状态下质量约为1.29千克！不仅真实占据空间，并且产生的巨大大气压强支撑着地球生命与天气变化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g05_s1_u01_l03.html)\n\n\n### [第 9 页]\n\n![第 9 页教学插图与实验活动](figures/p09.png)\n\n提示使用气温计时应注意：\n①手持气温计，不要触碰玻璃泡；\n②放在阳光照射不到且空气流通的地方；\n③放在距离地面约1.5米的高度，保持干燥；\n④液柱高度稳定后再读数；\n⑤读数时视线和液柱顶端保持齐平。\n2. 选择一天中的5 个时间点，测量室外同一地点的气温并记录。\n\n#### 📝 记录单一天的气温地点：日期：\n时间 8 点 10 点 12 点 14 点 16 点气温\n3. 根据记录的数据绘制气温变化示意图。\n根据我们的测量结果，在气温计模型图上涂色，表示液柱高度。试着把液柱顶端连一连，有什么发现？\n8. 点 10 点 12 点 14 点 16 点\n\n### [第 10 页]\n\n![第 10 页教学插图与实验活动](figures/p10.png)\n\n#### 💬 研讨\n\n1. 我的记录和同学的记录相同吗？为什么要严格按照气温计的使用方法测量气温？\n2. 室外一天中的气温是怎样变化的？\n3. 将多个涂色后的气温计模型图按照时间顺序连续排列，这样描述气温有什么优点？\n拓拓展展一天中什么时候气温最低？从放学后到睡觉前，继续每隔 2 小时测一次室外同一地点的气温，同时通过查阅天气资料，了解当地一天中气温的最低点。"}, {"id": "sci_05_u01_l04", "lesson_idx": 56, "book": "三年级上册", "vol_dir": "05_三年级上册", "unit_no": 1, "unit_title": "第一单元天气", "lesson_no": 4, "title": "测量降水量", "page": 11, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g05_s1_u01_l04.html", "code": "g05_s1_u01_l04", "sections": {"focus": "下了一场雨，这是小雨还是大雨？怎么测量呢？\n探索资料降水量是指一定时间内，降落在怎样测量降水量？一定面积地面上的水层深度。\n我们可以把雨水有时是毛毛细雨，收集起来进行测量。需要统一有时是倾盆大雨。测量标准。", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "天气变化的根本动力来自太阳辐射能量在地表的非均匀分布。赤道与极地的温差驱动了大气环流与气压梯度力，促使冷暖空气对流、水汽相变凝结成云致雨。", "misconception": ""}, "figures": ["p11.webp", "p12.webp", "p13.webp"], "raw_text": "### [第 11 页]\n\n![第 11 页教学插图与实验活动](figures/p11.png)\n\n## 4. 测量降水量\n\n\n测量降水量我们出行前，常会关注是否下雨，便于我们准备合适的衣物和雨具。\n\n#### 🎯 聚焦下了一场雨，这是小雨还是大雨？怎么测量呢？\n探索资料降水量是指一定时间内，降落在怎样测量降水量？一定面积地面上的水层深度。\n我们可以把雨水有时是毛毛细雨，收集起来进行测量。需要统一有时是倾盆大雨。测量标准。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **重大气象工程（“风云”气象卫星与数值天气预报）**：我国新一代“风云四号”高轨气象卫星搭载多通道扫描辐射计与干涉式大气垂直探测仪，能在万米高空以秒级精度捕捉强对流云系演变，驱动超级计算机每秒百亿亿次流体力学方程解算！\n- 🧠 **跨学科大概念（能量与系统流动）**：天气变化的根本动力来自太阳辐射能量在地表的非均匀分布。赤道与极地的温差驱动了大气环流与气压梯度力，促使冷暖空气对流、水汽相变凝结成云致雨。\n- ⚠️ 常见认知误区：“空气没有重量、看不见摸不着所以不算物质”。**科学真相**：空气主要由氮气和氧气分子组成，1立方米空气在标准状态下质量约为1.29千克！不仅真实占据空间，并且产生的巨大大气压强支撑着地球生命与天气变化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g05_s1_u01_l04.html)\n\n\n### [第 12 页]\n\n![第 12 页教学插图与实验活动](figures/p12.png)\n\n1. 制作测量降水量的简易工具—雨量器。\n选一个直筒透明杯在杯子外壁贴上刻度刻度条外贴上透明把雨量器放在雨中，条，注意“0”刻度胶带，用于防水就可以测量降水量了的位置（以毫米为单位）\n2. 用喷壶做模拟降雨实记录单验，用雨量器测量降水量模拟降雨实验并记录。\n日期：\n次数降水量/ 毫米第1 次第2 次第3 次\n\n### [第 13 页]\n\n![第 13 页教学插图与实验活动](figures/p13.png)\n\n3. 用自制的雨量器在下雨时测量降水量，并对照“24 小时降水量等级标准”确定降水量等级。\n特大暴250. 雨研讨 200大暴\n1. 用自制雨量器测量降水量时，要注意什么？150 雨\n2. 下雪也属于降水，怎样测量下雪天的降水量？\n暴雨拓拓展展 50大雨10. 中雨暴雨预警 0 小雨气象部门在暴雨到来之前，会发出预警。暴雨 24 小时降水量等级标准预警分四级，分别用蓝色、黄色、橙色、红色表示，（单位：毫米）其中，红色预警等级最高。收到暴雨预警，我们尽量不要外出，做好安全防护。\n查阅资料，了解不同预警等级暴雨的降水量。\n蓝色预警黄色预警橙色预警红色预警"}, {"id": "sci_05_u01_l05", "lesson_idx": 57, "book": "三年级上册", "vol_dir": "05_三年级上册", "unit_no": 1, "unit_title": "第一单元天气", "lesson_no": 5, "title": "观测风", "page": 14, "d 页教学插图与实验活动](figures/p27.png)\n\n#### 📖 科学阅读天气预报是怎样制作出来的我们可以通过广播、电视等媒体了解未来天气。你知道天气预报是怎样制作出来的吗？\n在天气预报正式发布之前，要经历收集数据、科学计算、气象预报员作出预报、天气会商等几个阶段。\n收集数据借助卫星、气象雷达、地面观测站、探空气球等观测仪器收集最新的天气观测数据。\n科学计算气象中心的超级计算机对收集到的观测数据进行复杂的科学计算。\n气象预报员作出预报气象预报员综合观测数据和计算机分析气象雷达结果，并考虑当地的天气和气候特点，作出未来几天的天气预报。\n天气会商计算出的数据并不一定准确，需要进行探空气球一定的人工修正。一般天气预报在发布之前会经过气象预报员的讨论，这称作天气会商。\n发布天气预报天气预报制作完成之后，通过电视、广播、报纸、网站、公共显示屏等向社会发布和传播。\n\n### [第 28 页]\n\n![第 28 页教学插图与实验活动](figures/p28.png)\n\n天气对农业的影响谚语“靠天吃饭”生动地说明了天气对农业生产至关重要。\n自古以来，农民都期盼风调雨顺，盼望有好收成。\n天气对农业有哪些影响？\n适量的雨水有利于农作物生长，连日大雨或特大暴雨会使庄稼受淹，久不降雨则会造成干旱。\n适宜的气温和光照有利于农作物的光合作用；过高的气温会使秧苗受伤，影响农作物农作物受旱农作物受淹的产量和品质；低温霜冻又会冻伤农作物。\n冰雹、龙卷风等天气会使农作物减产甚至绝产。\n随着农业科技的进步，我们有了更多应对灾害天气的办高温使农作物受伤低温冻伤农作物法，如利用各种灌溉技术解决干旱问题、搭建大棚解决农作物冻伤问题等。\n冰雹毁坏农作物大风使农作物倒伏\n\n### [第 29 页]\n\n![第 29 页教学插图与实验活动](figures/p29.png)\n\n第二单元水水是常见的可以流动的物体。\n在自然界中，水不断变化，有时候变成云，有时候变成雨，有时候变成冰和雪，这些变化是怎样发生的呢？"}, {"id": "sci_05_u02_l01", "lesson_idx": 61, "book": "三年级上册", "vol_dir": "05_三年级上册", "unit_no": 2, "unit_title": "第二单元水", "lesson_no": 1, "title": "水到哪里去了", "page": 30, "domain": "chemistry", "domain_cn": "物质变化与化学", "sim_file": "sim_g05_s1_u02_l01.html", "code": "g05_s1_u02_l01", "sections": {"focus": "这些水到哪里去了呢？", "exploration": "1. 列举生活中水“消失”的现象。\n湿衣服晾干了黑板上的水迹消失了\n2. 在玻璃片和植物叶片上涂少量水，观察水迹我们将这种水消失的现有哪些变化，用图画记录并解释。象叫蒸发。", "discussion": "1. 玻璃片和植物叶片上的水蒸发后到哪里去了？\n2. 实验中原本干燥的大杯子内部出现水了吗？这些水是怎样来的？\n拓拓展展水是一种液体，可以流动，会随着容器形状改变自己的形状，还会蒸发。\n很多液体也会像水一样蒸发，变成看不见的气体，比如医用酒精。把一些医用酒精涂到手背上，观察发生的变化，并和水的变化进行比较。想一想，生活中还有哪些类似的现象？", "expansion": "", "frontier": "", "big_concept": "无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！", "misconception": ""}, "figures": ["p30.webp", "p31.webp", "p32.webp"], "raw_text": "### [第 30 页]\n\n![第 30 页教学插图与实验活动](figures/p30.png)\n\n## 1. 水到哪里去了\n\n\n水到哪里去了秋天，在晴朗的早晨，植物的叶片上会出现露珠。过一段时间，这些露珠就消失不见了。\n\n#### 🎯 聚焦这些水到哪里去了呢？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿化学与材料科学（高性能碳纤维与海水淡化反渗透膜）**：我国自主研发的T1000级超高强度碳纤维被称为‘新材料之王’，比铝还轻但强度比钢高数倍；先进聚酰胺反渗透膜孔径仅0.1纳米，高压迫使水分子穿透而将水合盐离子拦截，实现苦咸海水向纯净饮用水的瞬间转化！\n- 🧠 **跨学科大概念（物质形态与质量守恒定律）**：无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！\n- ⚠️ 常见前概念误区：“水蒸发或者蜡烛烧完了，物质就彻底消失了”。**科学真相**：物质绝不会凭空消失！蒸发的水分子逸散到了广袤的大气中形成看不见的水汽；蜡烛燃烧生成的二氧化碳气体和水蒸气扩散到了空气中，封闭体系称重会发现总质量分毫不差！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g05_s1_u02_l01.html)\n\n\n### [第 31 页]\n\n![第 31 页教学插图与实验活动](figures/p31.png)\n\n#### 🔬 探索\n\n1. 列举生活中水“消失”的现象。\n湿衣服晾干了黑板上的水迹消失了\n2. 在玻璃片和植物叶片上涂少量水，观察水迹我们将这种水消失的现有哪些变化，用图画记录并解释。象叫蒸发。\n\n#### 📝 记录单用图画记录并解释水消失的现象日期：\n观察对象用图画记录我们的解释玻璃片上的水迹植物叶片上的水迹\n\n### [第 32 页]\n\n![第 32 页教学插图与实验活动](figures/p32.png)\n\n3. 用实验证明我们的解释。\n干燥的取一小杯温水，用干燥透明的大杯子大杯子罩住它，观察有什么现象发生。\n温水\n\n#### 💬 研讨\n\n1. 玻璃片和植物叶片上的水蒸发后到哪里去了？\n2. 实验中原本干燥的大杯子内部出现水了吗？这些水是怎样来的？\n拓拓展展水是一种液体，可以流动，会随着容器形状改变自己的形状，还会蒸发。\n很多液体也会像水一样蒸发，变成看不见的气体，比如医用酒精。把一些医用酒精涂到手背上，观察发生的变化，并和水的变化进行比较。想一想，生活中还有哪些类似的现象？"}, {"id": "sci_05_u02_l02", "lesson_idx": 62, "book": "三年级上册", "vol_dir": "05_三年级上册", "unit_no": 2, "unit_title": "第二单元水", "lesson_no": 2, "title": "水珠从哪里来", "page": 33, "domain": "chemistry", "domain_cn": "物质变化与化学", "sim_file": "sim_g05_s1_u02_l02.html", "code": "g05_s1_u02_l02", "sections": {"focus": "这些水珠来自哪里呢？", "exploration": "1. 说一说我们的想法。\n2. 通过下面三组实验，观察、对比两个杯子外壁的变化并记录。", "discussion": "1. 杯子外壁的水珠来自哪里？生活中有什么现象可以证明这一点？\n2. 杯子外壁上水珠的出现和什么有关？\n拓拓展展说一说生活中还有哪些地方会有出现水珠的现象，并试着解释一下。", "expansion": "", "frontier": "", "big_concept": "无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！", "misconception": ""}, "figures": ["p33.webp", "p34.webp", "p35.webp"], "raw_text": "### [第 33 页]\n\n![第 33 页教学插图与实验活动](figures/p33.png)\n\n## 2. 水珠从哪里来\n\n\n水珠从哪里来从冰箱取出的冰镇饮料，放在室温环境中，罐身很快会出现很多水珠。\n\n#### 🎯 聚焦这些水珠来自哪里呢？\n\n#### 🔬 探索\n\n1. 说一说我们的想法。\n2. 通过下面三组实验，观察、对比两个杯子外壁的变化并记录。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿化学与材料科学（高性能碳纤维与海水淡化反渗透膜）**：我国自主研发的T1000级超高强度碳纤维被称为‘新材料之王’，比铝还轻但强度比钢高数倍；先进聚酰胺反渗透膜孔径仅0.1纳米，高压迫使水分子穿透而将水合盐离子拦截，实现苦咸海水向纯净饮用水的瞬间转化！\n- 🧠 **跨学科大概念（物质形态与质量守恒定律）**：无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！\n- ⚠️ 常见前概念误区：“水蒸发或者蜡烛烧完了，物质就彻底消失了”。**科学真相**：物质绝不会凭空消失！蒸发的水分子逸散到了广袤的大气中形成看不见的水汽；蜡烛燃烧生成的二氧化碳气体和水蒸气扩散到了空气中，封闭体系称重会发现总质量分毫不差！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g05_s1_u02_l02.html)\n\n\n### [第 34 页]\n\n![第 34 页教学插图与实验活动](figures/p34.png)\n\n盖紧玻璃片，观察杯子外壁是否有水珠。\n玻璃片敞开盖紧是杯内的水蒸发后跑到外面了吗？\n冰水混合加入色素，观察杯子外壁上水珠的颜色。\n不加色素加色素是杯内的水渗出到外壁上了吗？\n冰水混合有颜色的冰水混合将一个杯子冷冻后拿出并迅速擦干，观察外壁是否有水珠。\n有冰水无冰水是有冰水的原因吗？\n冷冻后擦冰水混合干的杯子\n\n### [第 35 页]\n\n![第 35 页教学插图与实验活动](figures/p35.png)\n\n#### 📝 记录单两个杯子外壁的变化日期：\n实验方法杯子外壁出现的现象\n\n#### 💬 研讨\n\n1. 杯子外壁的水珠来自哪里？生活中有什么现象可以证明这一点？\n2. 杯子外壁上水珠的出现和什么有关？\n拓拓展展说一说生活中还有哪些地方会有出现水珠的现象，并试着解释一下。"}, {"id": "sci_05_u02_l03", "lesson_idx": 63, "book": "三年级上册", "vol_dir": "05_三年级上册", "unit_no": 2, "unit_title": "第二单元水", "lesson_no": 3, "title": "水沸腾了", "page": 36, "domain": "chemistry", "domain_cn": "物质变化与化学", "sim_file": "sim_g05_s1_u02_l03.html", "code": "g05_s1_u02_l03", "sections": {"focus": "水在加热到沸腾的过程中为什么会产生“白气”？“白气”是什么？\n探索资料酒精灯的火焰分为外焰、内焰和焰心，外\n1. 用酒精灯加热焰的温度最高，内焰次烧杯内的水。之，焰心最低，通常用外焰进行加热。\n外焰内焰焰心灯芯酒精", "exploration": "", "discussion": "1. 水从常温到沸腾过程中的温度变化有什么规律吗？温度为多少的时候会出现沸腾现象？\n2. 沸腾时产生的大量“白气”是什么？\n拓拓展展用烧水壶烧水，水沸腾时会向外喷出大量水蒸气，甚至可以将水壶盖子掀开。瓦特就利用这种原理改良了蒸汽机，改良后的蒸汽机成为早期工业生产的主要动力机器。查阅资料，了解发明和改良蒸汽机的故事。", "expansion": "", "frontier": "", "big_concept": "无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！", "misconception": ""}, "figures": ["p36.webp", "p37.webp", "p38.webp"], "raw_text": "### [第 36 页]\n\n![第 36 页教学插图与实验活动](figures/p36.png)\n\n## 3. 水沸腾了\n\n\n水沸腾了炉火上的水过一段时间就沸腾了，冒出大量的“白气”。\n\n#### 🎯 聚焦水在加热到沸腾的过程中为什么会产生“白气”？“白气”是什么？\n探索资料酒精灯的火焰分为外焰、内焰和焰心，外\n1. 用酒精灯加热焰的温度最高，内焰次烧杯内的水。之，焰心最低，通常用外焰进行加热。\n外焰内焰焰心灯芯酒精\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿化学与材料科学（高性能碳纤维与海水淡化反渗透膜）**：我国自主研发的T1000级超高强度碳纤维被称为‘新材料之王’，比铝还轻但强度比钢高数倍；先进聚酰胺反渗透膜孔径仅0.1纳米，高压迫使水分子穿透而将水合盐离子拦截，实现苦咸海水向纯净饮用水的瞬间转化！\n- 🧠 **跨学科大概念（物质形态与质量守恒定律）**：无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！\n- ⚠️ 常见前概念误区：“水蒸发或者蜡烛烧完了，物质就彻底消失了”。**科学真相**：物质绝不会凭空消失！蒸发的水分子逸散到了广袤的大气中形成看不见的水汽；蜡烛燃烧生成的二氧化碳气体和水蒸气扩散到了空气中，封闭体系称重会发现总质量分毫不差！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g05_s1_u02_l03.html)\n\n\n### [第 37 页]\n\n![第 37 页教学插图与实验活动](figures/p37.png)\n\n2. 观察并记录水在加热过程中的变化。\n用酒精灯加热时的注意事项观察水从常温到沸腾过程中的各种加热过程中不要触碰容现象并记录。器，加热结束时，也不测量并记录水从常温到沸腾过程中要马上触碰器材，以免烫伤。\n温度的变化。不能用燃烧的酒精灯去点燃另一盏酒精灯。\n读数时眼睛要平视 ×温度计不要熄灭酒精灯时，应用灯触碰容器帽盖灭，不可用嘴吹灭。\n安全提醒实验时戴上护目镜，以免液体飞溅到眼中。\n\n### [第 38 页]\n\n![第 38 页教学插图与实验活动](figures/p38.png)\n\n#### 📝 记录单水在加热过程中的温度变化及杯中出现的现象日期：\n时间观察项目初始时 1 分钟 2 分钟 3 分钟 4 分钟 5 分钟 6 分钟……温度/℃出现的现象\n\n#### 💬 研讨\n\n1. 水从常温到沸腾过程中的温度变化有什么规律吗？温度为多少的时候会出现沸腾现象？\n2. 沸腾时产生的大量“白气”是什么？\n拓拓展展用烧水壶烧水，水沸腾时会向外喷出大量水蒸气，甚至可以将水壶盖子掀开。瓦特就利用这种原理改良了蒸汽机，改良后的蒸汽机成为早期工业生产的主要动力机器。查阅资料，了解发明和改良蒸汽机的故事。"}, {"id": "sci_05_u02_l04", "lesson_idx": 64, "book": "三年级上册", "vol_dir": "05_三年级上册", "unit_no": 2, "unit_title": "第二单元水", "lesson_no": 4, "title": "水结冰了", "page": 39, "domain": "chemistry", "domain_cn": "物质变化与化学", "sim_file": "sim_g05_s1_u02_l04.html", "code": "g05_s1_u02_l04", "sections": {"focus": "湖水是怎样结冰的呢？\n深冬时，鸭子只能站在冰面上行走。", "exploration": "提示碎冰加盐后可\n1. 说一说我们对结冰现象的看法。以让周围的温度降\n2. 观察并记录水结冰过程中的各种变化。得更低，这样可以加快试管中水的结冰速度。\n往碎冰中加一些盐并搅拌均匀温度计加盐后的碎冰试管中加少量水将试管放入碎冰中用温度计测量试管内水温的变化", "discussion": "1. 水在什么温度条件下会结冰？\n2. 水结冰的过程中有哪些变化？\n拓拓展展把温度计的玻璃泡包在手心里，红色液柱就会上升；将温度计放入冷水中，红色液柱就会下降。这是一种“热胀冷缩”的现象，生活中还有哪些地方也有这样的现象呢？\n瘪了的乒乓球放到热水里会瘪了的自己复原。\n乒乓球热水复原的乒乓球资料科学家发现，当温度降到4℃以下时，水会呈现出“热缩冷胀”，即温度降低，体积增加。", "expansion": "", "frontier": "", "big_concept": "无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！", "misconception": ""}, "figures": ["p39.webp", "p40.webp", "p41.webp"], "raw_text": "### [第 39 页]\n\n![第 39 页教学插图与实验活动](figures/p39.png)\n\n## 4. 水结冰了\n\n\n水结冰了初冬时节，一群鸭子在湖面上游来游去。\n\n#### 🎯 聚焦湖水是怎样结冰的呢？\n深冬时，鸭子只能站在冰面上行走。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿化学与材料科学（高性能碳纤维与海水淡化反渗透膜）**：我国自主研发的T1000级超高强度碳纤维被称为‘新材料之王’，比铝还轻但强度比钢高数倍；先进聚酰胺反渗透膜孔径仅0.1纳米，高压迫使水分子穿透而将水合盐离子拦截，实现苦咸海水向纯净饮用水的瞬间转化！\n- 🧠 **跨学科大概念（物质形态与质量守恒定律）**：无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！\n- ⚠️ 常见前概念误区：“水蒸发或者蜡烛烧完了，物质就彻底消失了”。**科学真相**：物质绝不会凭空消失！蒸发的水分子逸散到了广袤的大气中形成看不见的水汽；蜡烛燃烧生成的二氧化碳气体和水蒸气扩散到了空气中，封闭体系称重会发现总质量分毫不差！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g05_s1_u02_l04.html)\n\n\n### [第 40 页]\n\n![第 40 页教学插图与实验活动](figures/p40.png)\n\n#### 🔬 探索提示碎冰加盐后可\n1. 说一说我们对结冰现象的看法。以让周围的温度降\n2. 观察并记录水结冰过程中的各种变化。得更低，这样可以加快试管中水的结冰速度。\n往碎冰中加一些盐并搅拌均匀温度计加盐后的碎冰试管中加少量水将试管放入碎冰中用温度计测量试管内水温的变化\n\n#### 📝 记录单水在结冰过程中的温度变化及杯中出现的现象日期：\n观察项目 1 分钟 2 分钟 3 分钟 4 分钟 5 分钟 6 分钟……温度/℃出现的现象\n\n### [第 41 页]\n\n![第 41 页教学插图与实验活动](figures/p41.png)\n\n3. 观察并比较水水冰和冰有哪些相同点与不同点。\n\n#### 💬 研讨\n\n1. 水在什么温度条件下会结冰？\n2. 水结冰的过程中有哪些变化？\n拓拓展展把温度计的玻璃泡包在手心里，红色液柱就会上升；将温度计放入冷水中，红色液柱就会下降。这是一种“热胀冷缩”的现象，生活中还有哪些地方也有这样的现象呢？\n瘪了的乒乓球放到热水里会瘪了的自己复原。\n乒乓球热水复原的乒乓球资料科学家发现，当温度降到4℃以下时，水会呈现出“热缩冷胀”，即温度降低，体积增加。"}, {"id": "sci_05_u02_l05", "lesson_idx": 65, "book": "三年级上册", "vol_dir": "05_三年级上册", "unit_no": 2, "unit_title": "第二单元水", "lesson_no": 5, "title": "冰熔化了", "page": 42, "domain": "chemistry", "domain_cn": "物质变化与化学", "sim_file": "sim_g05_s1_u02_l05.html", "code": "g05_s1_u02_l05", "sections": {"focus": "如果给冰加热，会看到什么现象？", "exploration": "1. 说一说我们平时见过的冰熔化的现象。冰块的形状发\n2. 尝试用三种不同的方法让冰块熔化，观生了什么变化？水出现在哪里？\n察并记录冰熔化过程中出现的现象。\n把冰块敲碎用吸管对着冰块吹气用手焐冰块", "discussion": "1. 根据我们的实验，你认为哪种方法使冰熔化最快？冰熔化成水的原因是什么？\n2. 水、冰和水蒸气有哪些相同点和不同点？你认为它们是同一种物质吗？\n拓拓展展长柄金属勺蜡加热蜡，蜡也会从固体状态变成液体状态，冷却后又会变成固体状态。这种现象与冰熔化成水相比，有什么相同点和不同点？", "expansion": "", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p42.webp", "p43.webp", "p44.webp"], "raw_text": "### [第 42 页]\n\n![第 42 页教学插图与实验活动](figures/p42.png)\n\n## 5. 冰熔化了\n\n\n冰熔化了在我国北方的冬天，你会看到屋檐垂下的冰凌在阳光下慢慢熔化。\n\n#### 🎯 聚焦如果给冰加热，会看到什么现象？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g05_s1_u02_l05.html)\n\n\n### [第 43 页]\n\n![第 43 页教学插图与实验活动](figures/p43.png)\n\n#### 🔬 探索\n\n1. 说一说我们平时见过的冰熔化的现象。冰块的形状发\n2. 尝试用三种不同的方法让冰块熔化，观生了什么变化？水出现在哪里？\n察并记录冰熔化过程中出现的现象。\n把冰块敲碎用吸管对着冰块吹气用手焐冰块\n\n#### 📝 记录单冰熔化过程中出现的现象日期：\n方法过程中出现的现象敲碎刚开始冰块变为碎冰，然后有一些水出现……用吸管吹用手焐\n\n### [第 44 页]\n\n![第 44 页教学插图与实验活动](figures/p44.png)\n\n3. 比较水、冰和水蒸气的相同点和不同点，并用箭头和文字标出它们的转化关系。\n资料水通常情况下，液体状态的水加热到100℃时会沸腾，加速变成水蒸气；\n温度下降到0℃时会水蒸气冰变成固体。\n\n#### 💬 研讨\n\n1. 根据我们的实验，你认为哪种方法使冰熔化最快？冰熔化成水的原因是什么？\n2. 水、冰和水蒸气有哪些相同点和不同点？你认为它们是同一种物质吗？\n拓拓展展长柄金属勺蜡加热蜡，蜡也会从固体状态变成液体状态，冷却后又会变成固体状态。这种现象与冰熔化成水相比，有什么相同点和不同点？"}, {"id": "sci_05_u02_l06", "lesson_idx": 66, "book": "三年级上册", "vol_dir": "05_三年级上册", "unit_no": 2, "unit_title": "第二单元水", "lesson_no": 6, "title": "水能溶解多少物质", "page": 45, "domain": "chemistry", "domain_cn": "物质变化与化学", "sim_file": "sim_g05_s1_u02_l06.html", "code": "g05_s1_u02_l06", "sections": {"focus": "一杯水能溶解多少食盐或小苏打？它们在水中的溶解能力一样吗？", "exploration": "1. 说一说我们用什么办法来比较食盐和小苏打在水中的溶解能力。\n看它们在水里最多能溶解多少。怎样比较它在同样多们溶解的多少呢？\n的水里加食盐称重量？\n和小苏打。\n小苏打食盐", "discussion": "1 50毫升水中溶解了多少份食盐或小苏打？它们的溶解能力相同吗？\n2. 在实验过程中，为什么要一份一份地加入食盐或小苏打？为什么要等前一份食盐或小苏打溶解完再加入下一份？\n拓拓展展用温水重复上面的实验，看一看食盐和小苏打的溶解能力有什么变化。", "expansion": "", "frontier": "", "big_concept": "无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！", "misconception": ""}, "figures": ["p45.webp", "p46.webp", "p47.webp"], "raw_text": "### [第 45 页]\n\n![第 45 页教学插图与实验活动](figures/p45.png)\n\n## 6. 水能溶解多少物质\n\n\n水能溶解多少物质在生活中，我们经常把食盐或小苏打加入水中溶解。\n\n#### 🎯 聚焦一杯水能溶解多少食盐或小苏打？它们在水中的溶解能力一样吗？\n\n#### 🔬 探索\n\n1. 说一说我们用什么办法来比较食盐和小苏打在水中的溶解能力。\n看它们在水里最多能溶解多少。怎样比较它在同样多们溶解的多少呢？\n的水里加食盐称重量？\n和小苏打。\n小苏打食盐\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿化学与材料科学（高性能碳纤维与海水淡化反渗透膜）**：我国自主研发的T1000级超高强度碳纤维被称为‘新材料之王’，比铝还轻但强度比钢高数倍；先进聚酰胺反渗透膜孔径仅0.1纳米，高压迫使水分子穿透而将水合盐离子拦截，实现苦咸海水向纯净饮用水的瞬间转化！\n- 🧠 **跨学科大概念（物质形态与质量守恒定律）**：无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！\n- ⚠️ 常见前概念误区：“水蒸发或者蜡烛烧完了，物质就彻底消失了”。**科学真相**：物质绝不会凭空消失！蒸发的水分子逸散到了广袤的大气中形成看不见的水汽；蜡烛燃烧生成的二氧化碳气体和水蒸气扩散到了空气中，封闭体系称重会发现总质量分毫不差！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g05_s1_u02_l06.html)\n\n\n### [第 46 页]\n\n![第 46 页教学插图与实验活动](figures/p46.png)\n\n2. 阅读下面的实验方案并实践操作，比较食盐和小苏打在水中的溶解能力，观察并记录。\n实验方案日期：\n研究的问题50. 毫升水能溶解多少食盐和小苏打？\n材料准备\n1. 两个200 毫升的烧杯，各装50 毫升常温清水。\n2. 食盐和小苏打若干。\n3. 小勺、搅拌棒。\n实验方法\n1. 分别取20 克食盐和小苏打，把它们平均分成10 等份。\n2. 在各装有50毫升水的两个烧杯中分别加入一份食盐和一份小苏打。\n加入后用搅拌棒充分搅拌，仔细观察，直到完全溶解。\n3. 一份一份地加入食盐和小苏打，直到前一份完全溶解后再加下一份，搅拌至完全溶解。\n4. 重复以上步骤，直到烧杯底部出现不溶解的颗粒。\n5. 记录50 毫升水最多能溶解的食盐和小苏打的份数。比较水溶解食盐和小苏打的能力。\n食盐小苏打50. 毫升水\n\n### [第 47 页]\n\n![第 47 页教学插图与实验活动](figures/p47.png)\n\n#### 📝 记录单在50 毫升水中食盐和小苏打的最多溶解量日期：\n加入的量（以份数计）观察项目\n1. 份 2 份 3 份 4 份 5 份 6 份 7 份 8 份 9 份 10 份食盐是否溶解小苏打是否溶解\n\n#### 💬 研讨\n\n1 50毫升水中溶解了多少份食盐或小苏打？它们的溶解能力相同吗？\n2. 在实验过程中，为什么要一份一份地加入食盐或小苏打？为什么要等前一份食盐或小苏打溶解完再加入下一份？\n拓拓展展用温水重复上面的实验，看一看食盐和小苏打的溶解能力有什么变化。"}, {"id": "sci_05_u02_l07", "lesson_idx": 67, "book": "三年级上册", "vol_dir": "05_三年级上册", "unit_no": 2, "unit_title": "第二单元水", "lesson_no": 7, "title": "加快溶解", "page": 48, "domain": "chemistry", "domain_cn": "物质变化与化学", "sim_file": "sim_g05_s1_u02_l07.html", "code": "g05_s1_u02_l07", "sections": {"focus": "我们有什么方法可以加快食盐在水中的溶解呢？", "exploration": "1. 说一说我们的想法。\n2. 通过实验，探索搅拌与溶解快慢的关系并记录。\n在两个烧杯中分别加入 100 毫升的常温水。\n同时在水中放入适量且同样多的食盐。\n一杯搅拌，一杯静止，观察并记录食盐完全溶解所需的时间。", "discussion": "1. 影响食盐溶解快慢的因素有哪些？我们是怎么知道的？\n2. 为什么实验中要用“相同质量的食盐”和“一样多的水”？\n拓拓展展试一试，将食盐或糖这样能溶解的物质研磨得很细，再放入水中，与不研磨的大颗粒盐粒或糖粒相比较，哪种溶解得更快呢？这个实验的步骤是什么？需要注意什么？\n研钵大颗粒的盐细颗粒的盐", "expansion": "", "frontier": "", "big_concept": "无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！", "misconception": ""}, "figures": ["p48.webp", "p49.webp", "p50.webp"], "raw_text": "### [第 48 页]\n\n![第 48 页教学插图与实验活动](figures/p48.png)\n\n## 7. 加快溶解\n\n\n加快溶解在水中加入食盐，为了让食盐快点溶解，我们会想一些办法。\n\n#### 🎯 聚焦我们有什么方法可以加快食盐在水中的溶解呢？\n\n#### 🔬 探索\n\n1. 说一说我们的想法。\n2. 通过实验，探索搅拌与溶解快慢的关系并记录。\n在两个烧杯中分别加入 100 毫升的常温水。\n同时在水中放入适量且同样多的食盐。\n一杯搅拌，一杯静止，观察并记录食盐完全溶解所需的时间。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿化学与材料科学（高性能碳纤维与海水淡化反渗透膜）**：我国自主研发的T1000级超高强度碳纤维被称为‘新材料之王’，比铝还轻但强度比钢高数倍；先进聚酰胺反渗透膜孔径仅0.1纳米，高压迫使水分子穿透而将水合盐离子拦截，实现苦咸海水向纯净饮用水的瞬间转化！\n- 🧠 **跨学科大概念（物质形态与质量守恒定律）**：无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！\n- ⚠️ 常见前概念误区：“水蒸发或者蜡烛烧完了，物质就彻底消失了”。**科学真相**：物质绝不会凭空消失！蒸发的水分子逸散到了广袤的大气中形成看不见的水汽；蜡烛燃烧生成的二氧化碳气体和水蒸气扩散到了空气中，封闭体系称重会发现总质量分毫不差！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g05_s1_u02_l07.html)\n\n\n### [第 49 页]\n\n![第 49 页教学插图与实验活动](figures/p49.png)\n\n哪一杯里的同时加入相同食盐先溶解完？\n质量的食盐\n\n#### 📝 记录单搅拌对食盐溶解快慢的影响日期：\n搅拌溶解不搅拌溶解所需时间所需时间一样多的同温度的水搅拌不搅拌\n3. 探索温度与溶解快慢的关系并记录。\n我们可以参考上一个实验的方法哟！\n同时加入相同记录单质量的食盐温度对食盐溶解快慢的影响日期：\n冷水中溶解热水中溶解所需时间所需时间一样多的水冷水热水\n\n### [第 50 页]\n\n![第 50 页教学插图与实验活动](figures/p50.png)\n\n#### 💬 研讨\n\n1. 影响食盐溶解快慢的因素有哪些？我们是怎么知道的？\n2. 为什么实验中要用“相同质量的食盐”和“一样多的水”？\n拓拓展展试一试，将食盐或糖这样能溶解的物质研磨得很细，再放入水中，与不研磨的大颗粒盐粒或糖粒相比较，哪种溶解得更快呢？这个实验的步骤是什么？需要注意什么？\n研钵大颗粒的盐细颗粒的盐"}, {"id": "sci_05_u02_l08", "lesson_idx": 68, "book": "三年级上册", "vol_dir": "05_三年级上册", "unit_no": 2, "unit_title": "第二单元水", "lesson_no": 8, "title": "用水分离", "page": 51, "domain": "chemistry", "domain_cn": "物质变化与化学", "sim_file": "sim_g05_s1_u02_l08.html", "code": "g05_s1_u02_l08", "sections": {"focus": "粗盐中含有不少沙子。如何利用水能溶解食盐和蒸发的性质，把沙子和食盐分离开来呢？", "exploration": "", "discussion": "1. 在分离过程中，沙子和食盐发生了什么变化？\n2. 水在分离过程中起到了什么作用？\n3. 如果不用酒精灯加热，分离实验最终会完成吗？\n拓拓展展生活中的污水混入了很多有害物质。净化污水污水需要分离水中的杂质。右图是一个简单的净化污水砂砾装置示意图。请试着制作粗沙一个类似的装置，用它来细沙棉花过滤污水，并对比污水过滤前后的变化。细纱布过滤后的水", "expansion": "", "frontier": "", "big_concept": "无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！", "misconception": ""}, "figures": ["p51.webp", "p52.webp", "p53.webp", "p54.webp", "p55.webp", "p56.webp", "p57.webp"], "raw_text": "### [第 51 页]\n\n![第 51 页教学插图与实验活动](figures/p51.png)\n\n## 8. 用水分离\n\n\n用水分离水不仅能溶解物质，还能分离物质。用海水晒制食盐，水分蒸发后，粗盐就出现了。\n\n#### 🎯 聚焦粗盐中含有不少沙子。如何利用水能溶解食盐和蒸发的性质，把沙子和食盐分离开来呢？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿化学与材料科学（高性能碳纤维与海水淡化反渗透膜）**：我国自主研发的T1000级超高强度碳纤维被称为‘新材料之王’，比铝还轻但强度比钢高数倍；先进聚酰胺反渗透膜孔径仅0.1纳米，高压迫使水分子穿透而将水合盐离子拦截，实现苦咸海水向纯净饮用水的瞬间转化！\n- 🧠 **跨学科大概念（物质形态与质量守恒定律）**：无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！\n- ⚠️ 常见前概念误区：“水蒸发或者蜡烛烧完了，物质就彻底消失了”。**科学真相**：物质绝不会凭空消失！蒸发的水分子逸散到了广袤的大气中形成看不见的水汽；蜡烛燃烧生成的二氧化碳气体和水蒸气扩散到了空气中，封闭体系称重会发现总质量分毫不差！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g05_s1_u02_l08.html)\n\n\n### [第 52 页]\n\n![第 52 页教学插图与实验活动](figures/p52.png)\n\n探索科学词汇溶液过滤\n1. 说一说分离沙子和食盐的方法。\n2. 实施模拟分离活动，评估分离效果。\n先把食盐与少量沙子进行混合，调制成“粗盐”。\n第一步：溶解。\n将“粗盐”放入水中，用玻璃棒搅拌。\n第二步：过滤。\n利用漏斗和滤纸，对“粗盐”溶液进行过滤。\n第三步：蒸发。\n利用酒精灯加热过滤后的溶液，将水分慢慢蒸干。\n安全提醒• 加热过程中不要触碰容器，以免烫伤。\n• 蒸发皿中的液体快要变干时应停止加热，利用余热蒸干水分，否则会出现迸溅。\n\n### [第 53 页]\n\n![第 53 页教学插图与实验活动](figures/p53.png)\n\n第四步：比较。\n观察、比较“粗盐”和分离后得到的盐。\n粗盐分离后得到的盐\n\n#### 💬 研讨\n\n1. 在分离过程中，沙子和食盐发生了什么变化？\n2. 水在分离过程中起到了什么作用？\n3. 如果不用酒精灯加热，分离实验最终会完成吗？\n拓拓展展生活中的污水混入了很多有害物质。净化污水污水需要分离水中的杂质。右图是一个简单的净化污水砂砾装置示意图。请试着制作粗沙一个类似的装置，用它来细沙棉花过滤污水，并对比污水过滤前后的变化。细纱布过滤后的水\n\n### [第 54 页]\n\n![第 54 页教学插图与实验活动](figures/p54.png)\n\n#### 📋 单元小结水（液体）分离溶解水蒸气冰（气体）（固体）一些物质通过实验我们证明了液态的水能变成固态的冰和气态的水蒸气，也能变回液态的水。水还有溶解其他物质的特性，一些物质与水混合，有的容易溶解，有的不容易溶解。水不仅可以溶解其他物质，利用水还可以将其他物质分离出来。物质总是不断变化着，物质还会相互作用。\n我的收获怎样改进呢？\n评价内容评价等级我能用温度计测量水的温度变化 ☆☆☆我能根据观察的现象推测水的变化过程 ☆☆☆我能设计公平实验证明不同物质在水中的溶解量不同 ☆☆☆我知道怎样可以将混合在一起的沙子和食盐分离开 ☆☆☆\n\n### [第 55 页]\n\n![第 55 页教学插图与实验活动](figures/p55.png)\n\n#### 📖 科学阅读\n\n“亚洲水塔”中水的变化我国的青藏高原及周边地区，平均海拔超过 4 000 米，具有南极、北极之外最大的冰储量。高原之上的湖泊面积约占我国湖泊总面积的一半，是长江、黄河、雅鲁藏布江等亚洲十多条主要河流的发源地，长江源头—唐古拉山的各拉丹冬峰，有“亚洲水塔”之称。这里的冰川融水是长江最初的水源黄河源头—卡日曲，这里的冰雪融水是黄河最初的水源\n\n### [第 56 页]\n\n![第 56 页教学插图与实验活动](figures/p56.png)\n\n在这个庞大的“亚洲水塔”中，水在固态、液态和气态三种状态间不断变化。首先是固态水，主要有冰川、积雪等。其次是液态水，主要以河流和湖泊的形式存在，很多河流和湖泊的水需要冰川融水来补充。最后是气态水，主要是地表水和海水蒸发，通过季风输送到青藏高原上空形成大量水汽，然后再通过降雪和降雨的方式变成固态和液态水。这样就形成了水的固、液、气三态循环变化。\n“亚洲水塔”为世界近 40 % 的人口的生产生活提供水源，非常重要。我国科学家团队正在监测青藏高原“亚洲水塔”的动态变化，为保护“亚洲水塔”提供科技支撑。\n我国青藏科考队在青藏高原钻取冰芯，探索青藏高原的气候变化\n\n### [第 57 页]\n\n![第 57 页教学插图与实验活动](figures/p57.png)\n\n第三单元物体的运动河水流淌，鸟儿飞翔，运动员奔跑，车辆行驶，火箭升空……这些运动各不相同。那么，怎样描述这些运动？运动有哪些形式？怎样比较运动的快慢？"}, {"id": "sci_05_u03_l01", "lesson_idx": 69, "book": "三年级上册", "vol_dir": "05_三年级上册", "unit_no": 3, "unit_title": "第三单元物体的运动", "lesson_no": 1, "title": "运动和位置", "page": 58, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g05_s1_u03_l01.html", "code": "g05_s1_u03_l01", "sections": {"focus": "我们站在地面观察物体时，怎样判断物体是运动的还是静止的？怎样准确地描述物体的位置？", "exploration": "1. 在学校操场上，什么是运动的？什资料么是静止的？判断的依据是什么？我们一般把大地看作静止的，将其他物体跟大地相\n2. 下列情形中，什么是运动的？什么比，就能判断出它们是静止是静止的？判断的依据是什么？的还是运动的。", "discussion": "1. 怎样判断物体是运动的还是静止的？\n2. 在“蒙眼抓人”游戏中，只知道方向不知道距离或只知道距离不知道方向，能抓到人吗？\n3. 怎样描述物体的位置？\n拓拓展展乘坐公共汽车时，我和同学坐前后排，位置没有变化。但地面上的同学却说我们的位置和公共汽车一起在变化。这是怎么回事呢？", "expansion": "", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p58.webp", "p59.webp", "p60.webp"], "raw_text": "### [第 58 页]\n\n![第 58 页教学插图与实验活动](figures/p58.png)\n\n## 1. 运动和位置\n\n\n运动和位置学校操场上，有运动的同学，也有一些静止的人和物体。\n\n#### 🎯 聚焦我们站在地面观察物体时，怎样判断物体是运动的还是静止的？怎样准确地描述物体的位置？\n\n#### 🔬 探索\n\n1. 在学校操场上，什么是运动的？什资料么是静止的？判断的依据是什么？我们一般把大地看作静止的，将其他物体跟大地相\n2. 下列情形中，什么是运动的？什么比，就能判断出它们是静止是静止的？判断的依据是什么？的还是运动的。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g05_s1_u03_l01.html)\n\n\n### [第 59 页]\n\n![第 59 页教学插图与实验活动](figures/p59.png)\n\n乘坐公共汽车升国旗\n3. 在教室里，你的前、后、左、右各是谁？他们和你的距离有多远？请描述他们所处的位置。\n小建在我右边距离可以用米、一米处。厘米等来表示，也可以用步数等来估计。\n方向可以用前、后、左、右、上、下等来表示。\n\n### [第 60 页]\n\n![第 60 页教学插图与实验活动](figures/p60.png)\n\n4. 根据同学的描述，玩“蒙眼抓人”游戏。\n小建就在你前面五步远的地方。\n\n#### 💬 研讨\n\n1. 怎样判断物体是运动的还是静止的？\n2. 在“蒙眼抓人”游戏中，只知道方向不知道距离或只知道距离不知道方向，能抓到人吗？\n3. 怎样描述物体的位置？\n拓拓展展乘坐公共汽车时，我和同学坐前后排，位置没有变化。但地面上的同学却说我们的位置和公共汽车一起在变化。这是怎么回事呢？"}, {"id": "sci_05_u03_l02", "lesson_idx": 70, "book": "三年级上册", "vol_dir": "05_三年级上册", "unit_no": 3, "unit_title": "第三单元物体的运动", "lesson_no": 2, "title": "各种各样的运动", "page": 61, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g05_s1_u03_l02.html", "code": "g05_s1_u03_l02", "sections": {"focus": "生活中有哪些物体在运动？它们是怎样运动的？", "exploration": "", "discussion": "1. 物体的运动路线有哪些？\n2. 比较两次观察，在物体上贴圆点的方法能更好地观察物体的运动吗？\n拓拓展展在玩具车的车身和车轮上各贴一个圆点，当它向前运动时，这两个圆点的运动路线一样吗？画一画。", "expansion": "", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p61.webp", "p62.webp", "p63.webp"], "raw_text": "### [第 61 页]\n\n![第 61 页教学插图与实验活动](figures/p61.png)\n\n## 2. 各种各样的运动\n\n\n各种各样的运动如果我们注意观察，就会发现我们周围很多物体都在运动。\n\n#### 🎯 聚焦生活中有哪些物体在运动？它们是怎样运动的？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g05_s1_u03_l02.html)\n\n\n### [第 62 页]\n\n![第 62 页教学插图与实验活动](figures/p62.png)\n\n探索记录单各种物体的运动\n1. 让物体运动起来，观察日期：\n并记录它们是怎样运动的。物体图画记录玩具小车钢尺指尖陀螺玩具木马悠悠球\n2. 在物体上贴上有颜色的圆点，让它们运动起来，观察并用图画的形式记录圆点的运动路线。\n\n### [第 63 页]\n\n![第 63 页教学插图与实验活动](figures/p63.png)\n\n#### 📝 记录单物体上圆点的运动路线日期：\n\n#### 💬 研讨\n\n1. 物体的运动路线有哪些？\n2. 比较两次观察，在物体上贴圆点的方法能更好地观察物体的运动吗？\n拓拓展展在玩具车的车身和车轮上各贴一个圆点，当它向前运动时，这两个圆点的运动路线一样吗？画一画。"}, {"id": "sci_05_u03_l03", "lesson_idx": 71, "book": "三年级上册", "vol_dir": "05_三年级上册", "unit_no": 3, "unit_title": "第三单元物体的运动", "lesson_no": 3, "title": "直线运动和曲线运动", "page": 64, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g05_s1_u03_l03.html", "code": "g05_s1_u03_l03", "sections": {"focus": "这些汽车的运动路线有什么不同？怎样描述这种不同？", "exploration": "1. 观察并描述这些物体的运动路线。", "discussion": "1. 根据运动路线的不同，物体的运动可以分为哪两种方式？\n2. 沿桌面推出的小球，运动方式有什么变化？\n拓拓展展判断生活中更多物体的运动方式。", "expansion": "", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p64.webp", "p65.webp", "p66.webp"], "raw_text": "### [第 64 页]\n\n![第 64 页教学插图与实验活动](figures/p64.png)\n\n## 3. 直线运动和曲线运动\n\n\n直线运动和曲线运动在公路上，有的汽车在直行，有的汽车在转弯。\n\n#### 🎯 聚焦这些汽车的运动路线有什么不同？怎样描述这种不同？\n\n#### 🔬 探索\n\n1. 观察并描述这些物体的运动路线。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g05_s1_u03_l03.html)\n\n\n### [第 65 页]\n\n![第 65 页教学插图与实验活动](figures/p65.png)\n\n2. 做击球实验。先尝试在桌面上用蓝色球击中红科学词汇色球，再分别利用直线轨道和曲线轨道击球。画一直线运动画，比较两种轨道中蓝色球的运动路线有什么不同。\n曲线运动蓝色球在很难击中啊……做直线运动。\n\n#### 📝 记录单蓝色球在做曲线运动。两种轨道中蓝色球的运动路线日期：\n3. 用手将小球沿着桌面推出。\n它的运动路线是怎样的？先画出自己的想法，再做实验检验。\n重复多次实验。\n\n### [第 66 页]\n\n![第 66 页教学插图与实验活动](figures/p66.png)\n\n#### 📝 记录单沿桌面推出的小球的运动路线日期：\n起点起点我的猜测实验记录\n\n#### 💬 研讨\n\n1. 根据运动路线的不同，物体的运动可以分为哪两种方式？\n2. 沿桌面推出的小球，运动方式有什么变化？\n拓拓展展判断生活中更多物体的运动方式。"}, {"id": "sci_05_u03_l04", "lesson_idx": 72, "book": "三年级上册", "vol_dir": "05_三年级上册", "unit_no": 3, "unit_title": "第三单元物体的运动", "lesson_no": 4, "title": "相同距离比快慢", "page": 67, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g05_s1_u03_l04.html", "code": "g05_s1_u03_l04", "sections": {"focus": "", "exploration": "1. 动物王国正在举行 100 米跑步比赛。根据下面的图表，按照运动的快慢给动物排列名次。\n动物赛跑动物奔跑100 米需要的时间名次猎豹 1 5 秒兔子 2 9 秒羚羊 3 6 秒斑马 4 8 秒大象 5 12 秒黑熊 6 10 秒", "discussion": "1. 怎样比较两个不同小球运动的快慢？\n2. 在生活中，运动相同距离时怎样比较物体运动的快慢？\n拓拓展展体育课上要举行50 米赛跑，有几种方法比较同学们跑的快慢？", "expansion": "", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p67.webp", "p68.webp", "p69.webp"], "raw_text": "### [第 67 页]\n\n![第 67 页教学插图与实验活动](figures/p67.png)\n\n## 4. 相同距离比快慢\n\n\n相同距离比快慢同学们在赛跑，有的人聚焦跑得快，有的人跑得慢。\n运动距离相同时，怎样比较运动的快慢呢？\n\n#### 🔬 探索\n\n1. 动物王国正在举行 100 米跑步比赛。根据下面的图表，按照运动的快慢给动物排列名次。\n动物赛跑动物奔跑100 米需要的时间名次猎豹 1 5 秒兔子 2 9 秒羚羊 3 6 秒斑马 4 8 秒大象 5 12 秒黑熊 6 10 秒\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g05_s1_u03_l04.html)\n\n\n### [第 68 页]\n\n![第 68 页教学插图与实验活动](figures/p68.png)\n\n2. 在两条一样长的轨道上，让两个不同的小球运动起来，比较它们运动的快慢。\n谁先到终点谁就快！\n3. 如果只有一条轨道，怎样比较两个提示不同小球运动的快慢？可以用秒表测量不同小球运动相同距离所花的时间。每名同学滚两个不同的小球，测量时间并记录下来。\n先后滚动两个不同的小要分工合作哟！\n球到终点。\n操作员发令员记录员计时员\n\n### [第 69 页]\n\n![第 69 页教学插图与实验活动](figures/p69.png)\n\n#### 📝 记录单相同距离小球运动的时间日期：\n测量结果/ 秒小球编号同学1 同学2 同学3 同学4小球1小球2\n\n#### 💬 研讨\n\n1. 怎样比较两个不同小球运动的快慢？\n2. 在生活中，运动相同距离时怎样比较物体运动的快慢？\n拓拓展展体育课上要举行50 米赛跑，有几种方法比较同学们跑的快慢？"}, {"id": "sci_05_u03_l05", "lesson_idx": 73, "book": "三年级上册", "vol_dir": "05_三年级上册", "unit_no": 3, "unit_title": "第三单元物体的运动", "lesson_no": 5, "title": "相同时间比快慢", "page": 70, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g05_s1_u03_l05.html", "code": "g05_s1_u03_l05", "sections": {"focus": "如果运动时间是相同的，怎样比较不同物体的快慢？\n高速列车和汽车此时看起来齐头并进，但用不了多久，高速列车就会把汽车远远地甩在后面。", "exploration": "1. 按照运动的快慢，给下面 6 种交通工具排序。\n交通工具比赛各种交通工具通常情况下1 小时内可行驶的距离名次喷气式客机 900 千米汽车 90 千米汽艇 200 千米轮船 40 千米自行车 15 千米高速列车 350 千米\n2. 两名同学听到“开始”口令后从相同起点同时出发，沿直线向相反方向行走，听到“停止”口令后同时停止运动。分别用软尺测量两名同学运动的距离，记录下来并比较行走的快慢。\n用脚跟接脚尖的方法来行走。", "discussion": "1. 在实验中，怎样比较两名同学运动的快慢？\n2. 相同时间内，怎样比较物体运动的快慢？\n拓拓展展体育课上的“追及跑”游戏两名同学一前一后站在同一条跑道上，根据口令同时起跑和停止，其他同学测量并记录运动距离，比较他们运动的快慢。\n资料科学词汇利用物体运动的时间和距离，能比较它们运动的快慢，即速度的大小。速度", "expansion": "", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p70.webp", "p71.webp", "p72.webp"], "raw_text": "### [第 70 页]\n\n![第 70 页教学插图与实验活动](figures/p70.png)\n\n## 5. 相同时间比快慢\n\n\n相同时间比快慢\n\n#### 🎯 聚焦如果运动时间是相同的，怎样比较不同物体的快慢？\n高速列车和汽车此时看起来齐头并进，但用不了多久，高速列车就会把汽车远远地甩在后面。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g05_s1_u03_l05.html)\n\n\n### [第 71 页]\n\n![第 71 页教学插图与实验活动](figures/p71.png)\n\n#### 🔬 探索\n\n1. 按照运动的快慢，给下面 6 种交通工具排序。\n交通工具比赛各种交通工具通常情况下1 小时内可行驶的距离名次喷气式客机 900 千米汽车 90 千米汽艇 200 千米轮船 40 千米自行车 15 千米高速列车 350 千米\n2. 两名同学听到“开始”口令后从相同起点同时出发，沿直线向相反方向行走，听到“停止”口令后同时停止运动。分别用软尺测量两名同学运动的距离，记录下来并比较行走的快慢。\n用脚跟接脚尖的方法来行走。\n\n### [第 72 页]\n\n![第 72 页教学插图与实验活动](figures/p72.png)\n\n#### 📝 记录单相同时间两名同学的运动距离日期：\n姓名相同的时间/ 秒运动的距离/ 厘米同学同学我的发现：\n\n#### 💬 研讨\n\n1. 在实验中，怎样比较两名同学运动的快慢？\n2. 相同时间内，怎样比较物体运动的快慢？\n拓拓展展体育课上的“追及跑”游戏两名同学一前一后站在同一条跑道上，根据口令同时起跑和停止，其他同学测量并记录运动距离，比较他们运动的快慢。\n资料科学词汇利用物体运动的时间和距离，能比较它们运动的快慢，即速度的大小。速度"}, {"id": "sci_05_u03_l06", "lesson_idx": 74, "book": "三年级上册", "vol_dir": "05_三年级上册", "unit_no": 3, "unit_title": "第三单元物体的运动", "lesson_no": 6, "title": "运动和能量", "page": 73, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g05_s1_u03_l06.html", "code": "g05_s1_u03_l06", "sections": {"focus": "#### 💡 科学词汇运动的足球为什么会把球网顶起来？能量", "exploration": "1. 搭建能调节坡度的斜面。从三个不同坡度的斜面顶端释放小球，在末端用手掌挡住小球，手的感觉有什么不同？\n小球从不同坡度的斜面顶端释放小球", "discussion": "1. 我们有哪些证据说明运动的小球有能量？\n2. 小球从不同坡度的斜面滚下，撞击木块的能量一样吗？\n3. 其他运动的物体有能量吗？我们的证据是什么？\n拓拓展展在日常生活中，有许多现象可以说明运动的物体具有能量。\n运动员跳远雨点落地子弹击穿苹果汽车受撞击变形强风吹动树木水流推动水车", "expansion": "", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p73.webp", "p74.webp", "p75.webp"], "raw_text": "### [第 73 页]\n\n![第 73 页教学插图与实验活动](figures/p73.png)\n\n## 6. 运动和能量\n\n\n运动和能量足球运动员大力射门，运动的足球把球网顶了起来。\n\n#### 🎯 聚焦\n\n#### 💡 科学词汇运动的足球为什么会把球网顶起来？能量\n\n#### 🔬 探索\n\n1. 搭建能调节坡度的斜面。从三个不同坡度的斜面顶端释放小球，在末端用手掌挡住小球，手的感觉有什么不同？\n小球从不同坡度的斜面顶端释放小球\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g05_s1_u03_l06.html)\n\n\n### [第 74 页]\n\n![第 74 页教学插图与实验活动](figures/p74.png)\n\n2. 从三个不同坡度的斜面顶端释放小球，提示每次都要从斜面的同让小球滚下后撞击水平面上的木块。测量、一位置释放小球。\n记录木块每次被撞击后滑行的距离。在木块的起始位置摆放小旗或做记号进行标记。\n小球木块木板\n\n#### 📝 记录单小球撞击木块实验日期：\n坡度示意图木块滑行距离/ 厘米坡度小坡度中等坡度大我的发现：\n\n### [第 75 页]\n\n![第 75 页教学插图与实验活动](figures/p75.png)\n\n#### 💬 研讨\n\n1. 我们有哪些证据说明运动的小球有能量？\n2. 小球从不同坡度的斜面滚下，撞击木块的能量一样吗？\n3. 其他运动的物体有能量吗？我们的证据是什么？\n拓拓展展在日常生活中，有许多现象可以说明运动的物体具有能量。\n运动员跳远雨点落地子弹击穿苹果汽车受撞击变形强风吹动树木水流推动水车"}, {"id": "sci_05_u03_l07", "lesson_idx": 75, "book": "三年级上册", "vol_dir": "05_三年级上册", "unit_no": 3, "unit_title": "第三单元物体的运动", "lesson_no": 7, "title": "设计和制作“过山车”", "page": 76, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g05_s1_u03_l07.html", "code": "g05_s1_u03_l07", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p76.webp", "p77.webp", "p78.webp"], "raw_text": "### [第 76 页]\n\n![第 76 页教学插图与实验活动](figures/p76.png)\n\n## 7. 设计和制作“过山车”\n\n\n设计和制作“过山车”游乐园中的过山车真好玩！\n让我们来设计并制作一座自己的“过山车”吧。\n明确任务用现有的材料，设计并制作一座“过山车”，让小球能从高处自动滚完全部轨道。\n轨道总长在2 米以上。\n有直线轨道和曲线轨道。\n小球能滚完全部轨道，不能脱轨。\n与同学合作完成。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g05_s1_u03_l07.html)\n\n\n### [第 77 页]\n\n![第 77 页教学插图与实验活动](figures/p77.png)\n\n也可以选用身边的材料。\n塑料套件轨道的长度可以用软尺和细绳来测量。\n卡纸套件制订方案任选一种设计方法。\n方法1：用绳子摆出“过山车”的轨道路线。\n\n### [第 78 页]\n\n![第 78 页教学插图与实验活动](figures/p78.png)\n\n方法2：在纸上设计“过山车”的轨道路线。\n我们的“过山车”设计图月× 日提示日期：________ 在交叉重叠的地方，可以用实线表示上方的轨道，起点虚线表示下方的轨道。\n重叠部分重叠部分重叠部分终点实施方案根据设计图，制作我们的“过山车”。"}, {"id": "sci_05_u03_l08", "lesson_idx": 76, "book": "三年级上册", "vol_dir": "05_三年级上册", "unit_no": 3, "unit_title": "第三单元物体的运动", "lesson_no": 8, "title": "测试“过山车”", "page": 79, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g05_s1_u03_l08.html", "code": "g05_s1_u03_l08", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p79.webp", "p80.webp", "p81.webp", "p82.webp", "p83.webp", "p84.webp", "p85.webp", "p86.webp", "p87.webp"], "raw_text": "### [第 79 页]\n\n![第 79 页教学插图与实验活动](figures/p79.png)\n\n## 8. 测试“过山车”\n\n\n测试“过山车”我们的“过山车”做好了！\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g05_s1_u03_l08.html)\n\n\n### [第 80 页]\n\n![第 80 页教学插图与实验活动](figures/p80.png)\n\n交流评估完成度最\n1. 我们用小球代替小车，评价我们的“过山车”。好计为3 颗星。\n我们的“过山车”评价表项目要求完成度\n1. 轨道总长在2 米以上 ☆☆☆\n2. 有直线轨道和曲线轨道 ☆☆☆\n3. 小球能滚完全部轨道，不能脱轨 ☆☆☆\n4. 与同学合作完成 ☆☆☆\n2. 以起点为中心，描述小球停止时的位置。\n3. 让小球从高处滚落，观察并描述它的运动方式和速度变化。\n\n### [第 81 页]\n\n![第 81 页教学插图与实验活动](figures/p81.png)\n\n4. 利用秒表、软尺、细绳、小木块等，比较不同“过山车”上小球运动的快慢，以及到达终点时的能量大小。\n改进完善如果要让小球运动得更快、到达终点时能量更大，可以怎样改进“过山车”？\n\n### [第 82 页]\n\n![第 82 页教学插图与实验活动](figures/p82.png)\n\n#### 📋 单元小结直线运动曲线运动运动方式运动物体方向运动物物体的具有能量体位置运动能量距离能量有大有小运动的快慢相同距离相同时间比时间比距离我们周围有各种物体。有的物体静止，有的物体运动，但都可以用方向和距离准确地描述它们的位置；运动的物体有快有慢，但都可以比较和测量；运动的物体都具有能量，能量有大有小。\n我的收获怎样改进呢？\n评价内容评价等级我学会用方向和距离来描述物体的位置 ☆☆☆我会画图记录物体的运动方式 ☆☆☆我会比较和测量运动物体的快慢 ☆☆☆我通过做实验知道了运动物体具有能量 ☆☆☆我参与了“过山车”的设计、制作和测试 ☆☆☆\n\n### [第 83 页]\n\n![第 83 页教学插图与实验活动](figures/p83.png)\n\n#### 📖 科学阅读刻舟求剑你听过“刻舟求剑”的故事吗？为什么那个古人捞不到宝剑呢？当宝剑在船上时，它跟着船一起运动，位置与船保持一致；当宝剑掉入江中后，它不再与船一起运动，船的位置改变了，而宝剑掉到江底后位置就不再改变，那个古人自然也就无法从船舷标记的位置找到宝剑了。\n智能的导航软件你看到过爸爸妈妈使用手机导航吗？应用了北斗导航的手机软件能直观、便捷地指引人们到达目的地，因此得到了广泛应用。人们在行走、骑车、驾驶时都可以使用导航引路。导航时，软件通常用一个箭头来表示用户所在的位置，随着用户的移动，这个箭头也会在软件内的地图上移动起来。\n其实导航软件是通过卫星和计算机，快速计算我们所在的位置与目的地之间的方向关系和距离大小，并在地图上呈现出来，从而实现导航功能。\n\n### [第 84 页]\n\n![第 84 页教学插图与实验活动](figures/p84.png)\n\n高空坠物近年来，高空坠物伤人事件时有发生。为什么高空坠物会伤人呢？这是因为楼层越高，坠物落地时的速度越快，能量也就越大。\n据测算，将一个几十克的坚硬物体从 4 楼抛下，会把人的头顶砸出个肿包；从 18 楼抛下，能砸破人的头骨；而从 30 楼抛下，冲击力足以致人死亡。高空坠物危害极大，我们一定不能高空抛物！\n条形磁铁与小钢珠一个小钢珠在桌面上做直线运动，但如果像左图中那样，在桌上放一个条形磁铁，那么小钢珠的运动方式会从直线运动变为曲线运动。这是为什么呢？因为磁铁有磁性，能够在一定距离内吸引小钢珠。当小钢珠距离磁铁较远时，会继续做直线运动；当小钢珠距离磁铁较近时，受到的吸引力变大，就会改变运动路线，变成曲线运动了。\n\n### [第 85 页]\n\n![第 85 页教学插图与实验活动](figures/p85.png)\n\n万里穿针——太空中的“追及跑”同学们在体育课上一定玩过“追及跑”，但飞船和目标飞行器想在太空中玩“追及跑”，然后实现对接，是非常困难的。\n“神舟”八号飞船和“天宫”一号目标飞行器的飞行速度为每秒7 800 米左右，这个速度是手枪子弹飞行速度的20 余倍。想象一下，两个飞得比子弹还快20 倍的物体互相接近，不但不能发生碰撞，还要准确地对接在一起，这是多难的一件事啊！不过，再难也难不倒我国的航天人员。2011 年11 月3 日，“神舟”八号飞船和“天宫”一号目标飞行器在太空顺利完成首次空间交会对接！\n\n### [第 86 页]\n\n![第 86 页教学插图与实验活动](figures/p86.png)\n\n后记本套科学教科书由根据《义务教育科学课程标准（2022年版）》组织编写。编写团队由科研院所和高校的科学家、教育教学专家以及全国各地的优秀科学教师、教研员组成，周忠和院士与张红霞教授共同担任主编。\n编写过程中，我们得到了诸多科学家、教研员和一线教师的支持与帮助。\n李金华、张智慧、李博强、杨顺华、魏科、石承民、李实、张金海等为教科书编写提供了专业审查和咨询意见，高伟组织并参与编写了“制作天文望远镜”等单元。此外，还有很多单位、专家和同仁为我们提供了审读、插图、资料等方面的支持和帮助。他们的参与为确保教科书内容的科学性、适切性提供了重要支撑，在此一并表示诚挚谢意！\n我们真诚地欢迎广大师生和社会各界人士对教科书提出宝贵意见，帮助我们共同打造培根铸魂、启智增慧的精品教材。\n电子邮箱：science@esph.com.cn\n\n### [第 87 页]\n\n![第 87 页教学插图与实验活动](figures/p87.png)\n\n班级姓名学号"}, {"id": "sci_06_u01_l01", "lesson_idx": 77, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 1, "unit_title": "第一单元辨别方向", "lesson_no": 1, "title": "根据太阳辨别方向", "page": 2, "domain": "astronomy", "domain_cn": "综合科学探究", "sim_file": "sim_g06_s2_u01_l01.html", "code": "g06_s2_u01_l01", "sections": {"focus": "生活中，人们常用“东南西北”来表示方向，这四个方向是怎样确定的呢？", "exploration": "阅读下面的资料并讨论，古人是如何确定方向的？\n古人观察发现，太阳总是从一个方向升起，从另一个方向落下。于是，人们把这个规律作为确定方向的标准：将太阳升起的方向定为“东”；太阳落下的方向定甲骨文中的“东南西北”为“西”；面朝东方，向右转就是南；面朝西方，向右转就是北。", "discussion": "模拟实验中的直杆影子变化代表了什么？\n利用“太阳下直杆影子的变化”辨别方向，存在哪些不足？", "expansion": "太阳在操场上尝试用“太阳下直杆影子的变直杆化”辨别方向。用长短东（2）东西（1）西不同的直杆实验，哪种北更便于测量？\n正午后实验的示意图大约20分钟后，晴天正午后，在操将直杆影子顶点标场上立一根直杆，将直为“2”。连接“1”和杆影子项点标为“1”。\n“2”，从“1”指向“2”的方向大致为东方。", "frontier": "", "big_concept": "天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。", "misconception": ""}, "figures": ["p02.webp", "p03.webp", "p04.webp"], "raw_text": "### [第 2 页]\n\n![第 2 页教学插图与实验活动](figures/p02.png)\n\n## 1. 根据太阳辨别方向\n\n\n根据太阳辨别方向每天，太阳有规律地升起和落下。\n\n#### 🎯 聚焦生活中，人们常用“东南西北”来表示方向，这四个方向是怎样确定的呢？\n\n#### 🔬 探索阅读下面的资料并讨论，古人是如何确定方向的？\n古人观察发现，太阳总是从一个方向升起，从另一个方向落下。于是，人们把这个规律作为确定方向的标准：将太阳升起的方向定为“东”；太阳落下的方向定甲骨文中的“东南西北”为“西”；面朝东方，向右转就是南；面朝西方，向右转就是北。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿空间探索（中国探月与深空探测工程）**：从“嫦娥六号”实现人类首次月背采样返回，到“祝融号”火星车巡视火星乌托邦平原，航天科学家利用精密轨道力学与光谱分析，正在解开太阳系演化与地月系统的终极奥秘！\n- 🧠 **跨学科大概念（系统与模型 / CER 推理）**：天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。\n- ⚠️ 很多同学误以为“月相变化是地球的影子挡住了月亮”。**科学真相**：地球影子挡住月球的现象是罕见的“月食”；而平时的初一到十五月相变化，纯粹是因为月球绕地球公转时，我们在地球上看到的月球被太阳照亮的半球面角度不同！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u01_l01.html)\n\n\n### [第 3 页]\n\n![第 3 页教学插图与实验活动](figures/p03.png)\n\n回忆我们在二年级学习过的“一天中，太阳在天空中的位置是怎样变化的”。说一说，太阳东升西落，阳光下物体的影子方向是怎样变化的？\n用手电筒模拟太阳，做“太模拟实验的步骤将直杆垂直放置。让“太阳”阳下直杆影子的变化”模拟实沿着轨道运动。\n验，观察直杆影子的变化规律，上午，让“太阳”停在东边任意并以此辨别方向。\n一点（如A点），在此时直杆影子顶点处做个记号，标上“1”下午，让“太阳”停在西边任意一点（如B点），在此时直杆影子顶点处做个记号，标上“2”连接“1”和“2”。\n在轨道上移动“太阳”时，应该注意什么？\n连接“1”和“2”，若按照太阳从“1”指向“2”的方东升西落的规律，向大致为什么方向？\n在轨道上任选两垂直于连线的方向大点做模拟实验，结致又是什么方向？\n果还符合这样的.规律吗？\n\n### [第 4 页]\n\n![第 4 页教学插图与实验活动](figures/p04.png)\n\n#### 💬 研讨模拟实验中的直杆影子变化代表了什么？\n利用“太阳下直杆影子的变化”辨别方向，存在哪些不足？\n\n#### 🚀 拓展太阳在操场上尝试用“太阳下直杆影子的变直杆化”辨别方向。用长短东（2）东西（1）西不同的直杆实验，哪种北更便于测量？\n正午后实验的示意图大约20分钟后，晴天正午后，在操将直杆影子顶点标场上立一根直杆，将直为“2”。连接“1”和杆影子项点标为“1”。\n“2”，从“1”指向“2”的方向大致为东方。"}, {"id": "sci_06_u01_l02", "lesson_idx": 78, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 1, "unit_title": "第一单元辨别方向", "lesson_no": 2, "title": "利用自然物辨别方向", "page": 5, "domain": "general_science", "domain_cn": "综合科学探究", "sim_file": "sim_g06_s2_u01_l02.html", "code": "g06_s2_u01_l02", "sections": {"focus": "除了北极星，还有哪些自然物可以帮助我们辨别方向？", "exploration": "通过观察积雪融化程度来辨别方向出ES在冬季，我国北方经常会下雪。太阳出来后，屋顶上的雪会慢慢融化。屋顶上不同方向的雪融化程度一样吗？这能否帮助我们辨别方向？", "discussion": "为什么可以利用这些自然物辨别方向？\n利用自然物辨别方向，存在哪些不足？", "expansion": "如果在森林里迷了路，我们可以怎样辨别方向", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p05.webp", "p06.webp", "p07.webp"], "raw_text": "### [第 5 页]\n\n![第 5 页教学插图与实验活动](figures/p05.png)\n\n## 2. 利用自然物辨别方向\n\n\n利用自然物辨别方向在晴朗的夜晚，找到北极星，就能找到北方。\n\n#### 🎯 聚焦除了北极星，还有哪些自然物可以帮助我们辨别方向？\n\n#### 🔬 探索通过观察积雪融化程度来辨别方向出ES在冬季，我国北方经常会下雪。太阳出来后，屋顶上的雪会慢慢融化。屋顶上不同方向的雪融化程度一样吗？这能否帮助我们辨别方向？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u01_l02.html)\n\n\n### [第 6 页]\n\n![第 6 页教学插图与实验活动](figures/p06.png)\n\n通过观察生物的生长与分布特点来辨别方向。\n太阳有规律地运动，影响着地球上的众多生物，使它们有着各自不同的生长与分布特点。我们能借助这些规律来辨别方向吗？\n疏疏密树木的年轮旷野上的树木资料喜阳的树木一般是向阳面的树叶较多，背阳面的树叶较少。有些植物不喜欢阳光暴晒，如苔藓等，大多生长在阴暗潮湿处。我们可以根据这些现象辨别南北方向。\n岩石上的苔藓\n\n### [第 7 页]\n\n![第 7 页教学插图与实验活动](figures/p07.png)\n\n在校园中辨别方向。\n根据校园中生物生长的特征，辨西北东北别校园的南北方向。\n明确了校园的南北方向后，再确定校园的东西方向，并进一步标出校园的东南、东北、西南、西北方向。\n西南东南确定上面的方向后，就可以判断南学校的大门朝哪个方向，班级的教室八个方向门朝哪个方向。\n\n#### 💬 研讨为什么可以利用这些自然物辨别方向？\n利用自然物辨别方向，存在哪些不足？\n\n#### 🚀 拓展如果在森林里迷了路，我们可以怎样辨别方向"}, {"id": "sci_06_u01_l03", "lesson_idx": 79, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 1, "unit_title": "第一单元辨别方向", "lesson_no": 3, "title": "利用磁铁辨别方向", "page": 8, "domain": "physics_em", "domain_cn": "综合科学探究", "sim_file": "sim_g06_s2_u01_l03.html", "code": "g06_s2_u01_l03", "sections": {"focus": "磁石的发现，为快速辨别方向带来了新方法。怎样用磁石辨别方向？\n教育科学出敬社为了实验操作", "exploration": "方便，常用条形磁铁代替磁石进行模拟实验。\n用条形磁铁指示方向。\n把条形磁铁用白纸包起来，尝试利用它指示方向。\n条形磁铁", "discussion": "要怎样放置磁铁，它才可以准确指示方向？\n用磁铁辨别方向时，若不小心靠近铁栏杆或其他磁铁，会有什么现象？这对磁铁准确指示方向有影响吗？\n公版", "expansion": "除了用细线悬挂磁铁和让磁铁漂浮在水面上外，还有什么方法可以让磁铁水平自由旋转？", "frontier": "", "big_concept": "电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。", "misconception": ""}, "figures": ["p08.webp", "p09.webp", "p10.webp"], "raw_text": "### [第 8 页]\n\n![第 8 页教学插图与实验活动](figures/p08.png)\n\n## 3. 利用磁铁辨别方向\n\n\n利用磁铁辨别方向在两千五百多年前，我国古代人民发现了一种能吸引铁的特殊石头，即磁石。\n\n#### 🎯 聚焦磁石的发现，为快速辨别方向带来了新方法。怎样用磁石辨别方向？\n教育科学出敬社为了实验操作\n\n#### 🔬 探索方便，常用条形磁铁代替磁石进行模拟实验。\n用条形磁铁指示方向。\n把条形磁铁用白纸包起来，尝试利用它指示方向。\n条形磁铁\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **国家重大电力装备（特高压直流输电与常温超导研究）**：我国特高压输电技术世界领先，±1100千伏昌吉-古泉特高压工程跨越数千公里输送清洁能源；而在前沿物理实验室中，高温超导磁悬浮列车试验线已突破时速600公里，实现零接触低阻抗飞驰！\n- 🧠 **跨学科大概念（闭合回路与能量转换）**：电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。\n- ⚠️ 很多孩子认为“电线里的电像水管里的水一样从电池正极流到负极，流完电池就空了”。**科学真相**：导线金属内部早已有海量的自由电子；闭合开关瞬间，电场以光速在回路中建立，整个回路中的电子几乎同时开始定向微观漂移，消耗的是电池的化学势能而非‘电子本身’！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u01_l03.html)\n\n\n### [第 9 页]\n\n![第 9 页教学插图与实验活动](figures/p09.png)\n\n磁铁能指示要让磁铁能够水平自方向吗？我们怎由旋转，才能辨别方向。\n有什么办法能让磁样知道呢？\n铁水平自由转动呢？\n用条形磁铁指示方向用细线悬挂磁铁，或者想办法让磁铁漂浮在水面上，让磁铁可以水平自由旋转。\n我们的磁磁铁停止转动后，观察它的两铁哪端是南极，端各指示什么方向。\n哪端是北极？\n多试几次，看结果是否一样。\n与其他小组的结果进行比较。\n放个资料人们发现，自由旋转的磁铁停止转动后，总是指向南北，于是就把磁铁指向南方的一端叫作南极（S），指向北方的一端叫将磁铁放在很轻的小碗中，作北极（N）。\n用细线悬挂磁铁让小碗浮在水面上\n\n### [第 10 页]\n\n![第 10 页教学插图与实验活动](figures/p10.png)\n\n用磁铁辨别方向。\n利用标好南北极的磁铁，到走廊、操场等教室外的场所辨别方向。\n用细绳把磁铁悬挂在铁架子上，磁铁能正确指示方向吗？\n\n#### 💬 研讨要怎样放置磁铁，它才可以准确指示方向？\n用磁铁辨别方向时，若不小心靠近铁栏杆或其他磁铁，会有什么现象？这对磁铁准确指示方向有影响吗？\n公版\n\n#### 🚀 拓展除了用细线悬挂磁铁和让磁铁漂浮在水面上外，还有什么方法可以让磁铁水平自由旋转？"}, {"id": "sci_06_u01_l04", "lesson_idx": 80, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 1, "unit_title": "第一单元辨别方向", "lesson_no": 4, "title": "磁极与方向", "page": 11, "domain": "physics_em", "domain_cn": "综合科学探究", "sim_file": "sim_g06_s2_u01_l04.html", "code": "g06_s2_u01_l04", "sections": {"focus": "磁铁和磁铁靠近会产生什么现象？悬挂起来的磁铁为什么能较稳定地指示方向？\n教育科", "exploration": "提示如果两根磁铁相互吸引，可用用两根磁铁做实验，认识磁铁的南北极。\n“→→”表示；\n将标注了南北极的两根磁铁相互靠近，观察如果两根磁铁相互排斥，可用现象并记录。\n“→”表示。", "discussion": "京科兰大悬挂起来的条形磁铁可以稳定地指示方向，是什么在吸引它？\n生活中，人们在哪些地方运用了磁极的相互作用？", "expansion": "用一块蹄形磁铁试一试，看一看它是否也能指示方向。", "frontier": "", "big_concept": "电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。", "misconception": ""}, "figures": ["p11.webp", "p12.webp", "p13.webp"], "raw_text": "### [第 11 页]\n\n![第 11 页教学插图与实验活动](figures/p11.png)\n\n## 4. 磁极与方向\n\n\n磁极与方向用磁铁辨别方向时，附近的其他磁铁会影响其指向的准确性。\n\n#### 🎯 聚焦磁铁和磁铁靠近会产生什么现象？悬挂起来的磁铁为什么能较稳定地指示方向？\n教育科\n\n#### 🔬 探索提示如果两根磁铁相互吸引，可用用两根磁铁做实验，认识磁铁的南北极。\n“→→”表示；\n将标注了南北极的两根磁铁相互靠近，观察如果两根磁铁相互排斥，可用现象并记录。\n“→”表示。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **国家重大电力装备（特高压直流输电与常温超导研究）**：我国特高压输电技术世界领先，±1100千伏昌吉-古泉特高压工程跨越数千公里输送清洁能源；而在前沿物理实验室中，高温超导磁悬浮列车试验线已突破时速600公里，实现零接触低阻抗飞驰！\n- 🧠 **跨学科大概念（闭合回路与能量转换）**：电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。\n- ⚠️ 很多孩子认为“电线里的电像水管里的水一样从电池正极流到负极，流完电池就空了”。**科学真相**：导线金属内部早已有海量的自由电子；闭合开关瞬间，电场以光速在回路中建立，整个回路中的电子几乎同时开始定向微观漂移，消耗的是电池的化学势能而非‘电子本身’！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u01_l04.html)\n\n\n### [第 12 页]\n\n![第 12 页教学插图与实验活动](figures/p12.png)\n\n#### 📝 记录单磁铁南北极的相互作用日期：\n相互吸引的两个不同形状的磁磁极是相同的磁极还铁相互靠近都有这是不同的磁极？\n样的现象吗？\n育阅读资料，认识地球的南北极。\n四百多年前，有一位科学家猜想地球像一块巨大的磁铁，也有南北极，所以才能吸引磁铁的两极。后来他的猜想得到了证实。\n人们将地球磁场叫“地磁场”，并测得地球磁场的两极就在地球的地理南极和北极附近。\n\n### [第 13 页]\n\n![第 13 页教学插图与实验活动](figures/p13.png)\n\n提示地磁的南极其实是在地球的地理北极附近。\n磁铁的南地理北极极为什么总是指向南方？\n是什么在吸引着它？\n地理南极\n\n#### 💬 研讨京科兰大悬挂起来的条形磁铁可以稳定地指示方向，是什么在吸引它？\n生活中，人们在哪些地方运用了磁极的相互作用？\n\n#### 🚀 拓展用一块蹄形磁铁试一试，看一看它是否也能指示方向。"}, {"id": "sci_06_u01_l05", "lesson_idx": 81, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 1, "unit_title": "第一单元辨别方向", "lesson_no": 5, "title": "制作小磁针", "page": 14, "domain": "physics_em", "domain_cn": "综合科学探究", "sim_file": "sim_g06_s2_u01_l05.html", "code": "g06_s2_u01_l05", "sections": {"focus": "自己制作的磁针，它能指示南北方向吗？", "exploration": "与同学讨论，如果想要获得一根有磁性的针，有什么办法？\n把针放在磁铁铁被磁铁吸过上多吸几次？\n可能会有磁性。\n将大磁铁磨成小磁针？", "discussion": "磁铁的磁性强弱与磁针的磁性强弱有什么关系？\n摩擦次数和方向与磁针的磁性强弱有什么关系？\n磁化后的针头和针尾分别是哪一极？可以怎样判断？\n教育科出", "expansion": "查阅资料，了解古人还有哪些磁化的方法。\n光《武经总要》中记录的人工磁化方法", "frontier": "", "big_concept": "电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。", "misconception": ""}, "figures": ["p14.webp", "p15.webp", "p16.webp"], "raw_text": "### [第 14 页]\n\n![第 14 页教学插图与实验活动](figures/p14.png)\n\n## 5. 制作小磁针\n\n\n制作小磁针我们发现，被磁铁吸引过的回形针会带一些磁性，也可以吸引一些回形针。\n\n#### 🎯 聚焦自己制作的磁针，它能指示南北方向吗？\n\n#### 🔬 探索与同学讨论，如果想要获得一根有磁性的针，有什么办法？\n把针放在磁铁铁被磁铁吸过上多吸几次？\n可能会有磁性。\n将大磁铁磨成小磁针？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **国家重大电力装备（特高压直流输电与常温超导研究）**：我国特高压输电技术世界领先，±1100千伏昌吉-古泉特高压工程跨越数千公里输送清洁能源；而在前沿物理实验室中，高温超导磁悬浮列车试验线已突破时速600公里，实现零接触低阻抗飞驰！\n- 🧠 **跨学科大概念（闭合回路与能量转换）**：电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。\n- ⚠️ 很多孩子认为“电线里的电像水管里的水一样从电池正极流到负极，流完电池就空了”。**科学真相**：导线金属内部早已有海量的自由电子；闭合开关瞬间，电场以光速在回路中建立，整个回路中的电子几乎同时开始定向微观漂移，消耗的是电池的化学势能而非‘电子本身’！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u01_l05.html)\n\n\n### [第 15 页]\n\n![第 15 页教学插图与实验活动](figures/p15.png)\n\n资料磁化是让没有磁性的物体获得磁性的过程。在宋代，人们就已经掌握了多种人工磁化的方法，使铁制品获得磁性。比如，在《梦溪笔谈》中有记载：“方家以磁石磨针锋，则能指南。”《梦溪笔谈》利用人工磁化的方法，用磁铁摩擦针，尝试做一枚磁针。\n用同一根磁铁磁性强弱不同的部位分别摩擦针，观察、比较针获得的磁性强弱。\n怎样摩擦能使针获得更如何检测磁强的磁性？\n针磁性的强弱？\n磁性弱磁性强探究摩擦次数与方向对磁化效果的影响。\n0. 安全提醒制作磁针要小心，防止针扎手沿一个方向摩擦\n3. 次浴一个方向摩擦15. 次手按住针头，用磁铁的北极，从针头往针尾方向摩擦。\n改变摩擦的次数，比较磁化效果\n\n### [第 16 页]\n\n![第 16 页教学插图与实验活动](figures/p16.png)\n\n来回摩擦浩着一个方向摩擦改变摩擦的方向，比较磁化效果用磁针吸引大头针或回形针，比较不同摩擦次数和方向制作的磁针的磁性强弱。\n\n#### 💬 研讨磁铁的磁性强弱与磁针的磁性强弱有什么关系？\n摩擦次数和方向与磁针的磁性强弱有什么关系？\n磁化后的针头和针尾分别是哪一极？可以怎样判断？\n教育科出\n\n#### 🚀 拓展查阅资料，了解古人还有哪些磁化的方法。\n光《武经总要》中记录的人工磁化方法"}, {"id": "sci_06_u01_l06", "lesson_idx": 82, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 1, "unit_title": "第一单元辨别方向", "lesson_no": 6, "title": "设计指南针", "page": 17, "domain": "physics_em", "domain_cn": "综合科学探究", "sim_file": "sim_g06_s2_u01_l06.html", "code": "g06_s2_u01_l06", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "根据制订的自制指南针设计方案，搜集并整理制作指南针所需的材料。", "frontier": "", "big_concept": "电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。", "misconception": ""}, "figures": ["p17.webp", "p18.webp", "p19.webp"], "raw_text": "### [第 17 页]\n\n![第 17 页教学插图与实验活动](figures/p17.png)\n\n## 6. 设计指南针\n\n\n设计指南针我国明代航海家、外交家郑和率领200多艘船组成的船队，赴周边国家进行文化交流，船上的指南针发挥了重要作用明确任务利用身边的材料，尝试设计一个小巧且指向准确的指南针。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **国家重大电力装备（特高压直流输电与常温超导研究）**：我国特高压输电技术世界领先，±1100千伏昌吉-古泉特高压工程跨越数千公里输送清洁能源；而在前沿物理实验室中，高温超导磁悬浮列车试验线已突破时速600公里，实现零接触低阻抗飞驰！\n- 🧠 **跨学科大概念（闭合回路与能量转换）**：电荷在电势差（电压）的驱动下沿闭合回路定向漂移形成电流。电流通过灯丝或电阻时，电势能转化为电子与晶格原子剧烈碰撞的热动能与光辐射能。\n- ⚠️ 很多孩子认为“电线里的电像水管里的水一样从电池正极流到负极，流完电池就空了”。**科学真相**：导线金属内部早已有海量的自由电子；闭合开关瞬间，电场以光速在回路中建立，整个回路中的电子几乎同时开始定向微观漂移，消耗的是电池的化学势能而非‘电子本身’！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u01_l06.html)\n\n\n### [第 18 页]\n\n![第 18 页教学插图与实验活动](figures/p18.png)\n\n制订方案讨论并确定自制指南针的评价标准。\n制作的材灵活旋转很重我们可以从料和价格需要要！指南针要指得哪些方面评价指考虑吗？\n准才行！\n南针的好坏呢？\n自制指南针的评价标准磁针旋转灵敏，表盘有8个方向。\n制作材料易得、价格低廉。\n轻巧简便。\n外观美观。\n\n### [第 19 页]\n\n![第 19 页教学插图与实验活动](figures/p19.png)\n\n小组制订指南针设计方案。\n有哪些方法可以让磁针灵活转动呢？需要什么材料？\n如何才能让指南针指示的方向更加精准？\n记录我们小组的设计方案。\n
