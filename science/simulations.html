了什么问题？又是怎样解决的？\n\n### [第 26 页]\n\n![第 26 页教学插图与实验活动](figures/p26.png)\n\n#### 📋 单元小结确定方向研究磁铁太阳磁铁辨别方向太阳方位变化导致利用磁铁制作指南针物体具有某些特征每天，太阳东升西落，有规律地运动着，同时也影响着地球上的物体。仔细观察这些物体的变化特征可以用来辨别方向。为了更准确、更方便地辨别方向，人们发明了指南针。指南针能指示南北是因为地球是个“大磁铁”，由于磁极的相互作用，指南针的磁极会分别指向南北。\n育我的收获怎样改进呢？\n评价内容评价等级我了解多种辨别方向的方法，如利用太阳、自然物、指南针等我能根据观察到的现象，深入分析、推理辨别正确的方向我能利用一定的材料，设计、制作并改进指南针我对如何辨别方向有浓厚的探究兴趣，主动发现问题，并寻求解决的方法\n\n### [第 27 页]\n\n![第 27 页教学插图与实验活动](figures/p27.png)\n\n#### 📖 科学阅读认识地球磁场指南针之所以能指示南北，是因为看不见、摸不着的地球磁场的存在。地球磁场是什么？它是怎样产生的？它对包括人类在内的地球生命有什么作用呢？\n地球磁场的起源是地球物理学的基本问题之一。自英国的吉尔伯特提出“地球是一个巨大的磁石”开始，有关地球磁场起源的推测已有400多年的历史，但至今仍未获得圆满解决。目前，普遍认为是由地核内液态铁镍合金地球磁场基本特征示意图（高温导致）的流动ES地球磁场强度非常微弱，仅为一般永磁铁磁场强度的万分之一。即便如此，地球磁场对地球上的生命繁衍和人类发展产生了重要影响。\n太阳风是从太阳上层大气喷射出的带电粒子流，连续不断地吹向地球。极光就是它在地球大气层中的踪迹。不过，地球周围虽然被太阳风包围，但绝大部分都被地球的磁场给推开了。地球磁场成为保护地球的一道天然屏障。如果地球磁场消失，将会给人类和地\n\n### [第 28 页]\n\n![第 28 页教学插图与实验活动](figures/p28.png)\n\n球上所有生命带来严重后果。例如，指南针失灵、一些动物无法迁徙、宇宙射线直接到达地球表面、大范围停电和卫星损坏、地球大气层剥离，等等。\n地球磁场抵抗太阳风、保护地球示意图地球磁场具有重要的国防和科学用途，包括地磁辅助及匹配导航、地磁定向、地震监测及预报、地磁发电、地磁探矿等。\n地球磁场无形且神秘，随着人类对地球磁场的研究不断深人，相信会有更多的地磁应用不断被开发出来，造福地球上的生命。\n\n### [第 29 页]\n\n![第 29 页教学插图与实验活动](figures/p29.png)\n\n第二单元动物的一生戴胜春天来了，万物复苏。冬季里“消失”的鱼儿、鸟儿以及蝴蝶、蜜蜂等动物又出现在水里、树上、花丛中…动物们是从哪里来的？它们的一生要经历怎样的过程？让我们亲自饲养一种小动物，探究其中的奥秘吧！"}, {"id": "sci_06_u02_l01", "lesson_idx": 85, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 2, "unit_title": "第二单元动物的一生", "lesson_no": 1, "title": "不同种类的动物", "page": 30, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g06_s2_u02_l01.html", "code": "g06_s2_u02_l01", "sections": {"focus": "常见的动物可以分为哪些种类？分类的依据是什么？", "exploration": "教说一说我们已经知道的动物种类，列鸟类举其中几种。\n昆虫动物鱼类鲤鱼", "discussion": "我们还知道哪些动物是脊椎动物？\n根据食性，可以将动物分为哪些类型？不同食性的动物，它们的牙齿有什么特点？\n根据运动方式，可以将动物分为哪些类型？它们各有什么特点？\n教有术子出", "expansion": "参观动物园，调查动物园中有哪些场馆。说一说动物园是如何对动物分类的。\n了解动物园中有哪些珍稀动物，其中哪些生活在我们的家乡？我们应该如何保护它们？", "frontier": "", "big_concept": "生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。", "misconception": ""}, "figures": ["p30.webp", "p31.webp", "p32.webp"], "raw_text": "### [第 30 页]\n\n![第 30 页教学插图与实验活动](figures/p30.png)\n\n## 1. 不同种类的动物\n\n\n不同种类的动物我们周围生活着许多动物，它们分别属于不同的种类。\n\n#### 🎯 聚焦常见的动物可以分为哪些种类？分类的依据是什么？\n\n#### 🔬 探索教说一说我们已经知道的动物种类，列鸟类举其中几种。\n昆虫动物鱼类鲤鱼\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿古生物学与生态基因库（国家基因库与恐龙羽毛演化）**：我国热河生物群带羽毛恐龙（如中华龙鸟）化石的发现，无可辩驳地确立了“现代鸟类是由兽脚类恐龙演化而来”的里程碑定论；高通量基因测序技术更重构了全球物种生命树与食物网脆弱度阈值。\n- 🧠 **跨学科大概念（尺度与比例 / 生态位）**：生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。\n- ⚠️ 很多同学误以为“凶猛的肉食动物消灭弱小食草动物对大自然有害”。**科学真相**：顶级捕食者能控制食草动物种群数量以防止过度啃食植被草原（营养级联效应），捕食体弱病体反而促进了种群基因库的健康优化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u02_l01.html)\n\n\n### [第 31 页]\n\n![第 31 页教学插图与实验活动](figures/p31.png)\n\n观察、比较动物的骨骼。\n观察一条鱼的骨骼，描述它的主要鱼的身体里有特征。\n一条长长的、一节一节连起来的骨骼，这是鱼的脊柱。\n券柱鱼的骨骼观察鸡、兔子等动物的骨骼，并与鱼的骨骼比较，看一看有什么相同的地方。\n鸡的骨骼脊柱资料科学家经常用分艺出版类的方法认识多种多样的动物！他们根据动物身体内是否有脊柱，将其分为脊椎动物和无脊椎动物。鱼类、鸟类、哺乳类等是脊椎动物；\n昆虫等是无脊椎动物。\n兔子的骨骼摸一摸我们的身体，人类的骨骼有这样的特征吗？\n\n### [第 32 页]\n\n![第 32 页教学插图与实验活动](figures/p32.png)\n\n常见的动物还有哪些不同特征？尝试用新的依据对动物进行分类。\n我们的新依据：它们的食性不同。\n味雀老虎蝴蝶我们的新依据：它们的运动方式不同。\n大熊猫\n\n#### 💬 研讨我们还知道哪些动物是脊椎动物？\n根据食性，可以将动物分为哪些类型？不同食性的动物，它们的牙齿有什么特点？\n根据运动方式，可以将动物分为哪些类型？它们各有什么特点？\n教有术子出\n\n#### 🚀 拓展参观动物园，调查动物园中有哪些场馆。说一说动物园是如何对动物分类的。\n了解动物园中有哪些珍稀动物，其中哪些生活在我们的家乡？我们应该如何保护它们？"}, {"id": "sci_06_u02_l02", "lesson_idx": 86, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 2, "unit_title": "第二单元动物的一生", "lesson_no": 2, "title": "动物的繁殖", "page": 33, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g06_s2_u02_l02.html", "code": "g06_s2_u02_l02", "sections": {"focus": "动物有哪些繁殖方式？不同的繁殖方式有什么特点？", "exploration": "育科认识动物的繁殖方式。\n选择我们熟悉的5种动物，用观察或查阅资料猫的方法，了解它们是怎样繁殖后代的。\n鸽子大熊猫蛙", "discussion": "胎生动物与卵生动物各有什么特点？\n动物筑巢与繁殖后代有关吗？说一说你的理由。", "expansion": "查阅资料，了解更多动物的繁殖行为。\n雀开屏织雀筑巢靖蜓点水", "frontier": "", "big_concept": "生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。", "misconception": ""}, "figures": ["p33.webp", "p34.webp", "p35.webp"], "raw_text": "### [第 33 页]\n\n![第 33 页教学插图与实验活动](figures/p33.png)\n\n## 2. 动物的繁殖\n\n\n动物的繁殖动物生小宝宝的方式不同。小鸡是鸡蛋孵化来的，小猫是猫妈妈直接生出来的。像鸡生蛋、猫生小猫的现象叫作动物的繁殖。\n\n#### 🎯 聚焦动物有哪些繁殖方式？不同的繁殖方式有什么特点？\n\n#### 🔬 探索育科认识动物的繁殖方式。\n选择我们熟悉的5种动物，用观察或查阅资料猫的方法，了解它们是怎样繁殖后代的。\n鸽子大熊猫蛙\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿古生物学与生态基因库（国家基因库与恐龙羽毛演化）**：我国热河生物群带羽毛恐龙（如中华龙鸟）化石的发现，无可辩驳地确立了“现代鸟类是由兽脚类恐龙演化而来”的里程碑定论；高通量基因测序技术更重构了全球物种生命树与食物网脆弱度阈值。\n- 🧠 **跨学科大概念（尺度与比例 / 生态位）**：生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。\n- ⚠️ 很多同学误以为“凶猛的肉食动物消灭弱小食草动物对大自然有害”。**科学真相**：顶级捕食者能控制食草动物种群数量以防止过度啃食植被草原（营养级联效应），捕食体弱病体反而促进了种群基因库的健康优化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u02_l02.html)\n\n\n### [第 34 页]\n\n![第 34 页教学插图与实验活动](figures/p34.png)\n\n根据我们的调查，\n\n#### 📝 记录单描述动物的繁殖特点，动物的繁殖特点与方式依据特点给动物的繁日期：\n殖方式分类。\n动物名称繁殖特点繁殖方式资料猫像金鱼、鸡那样产卵繁殖后代的方式叫卵生，像狗、猫那样直接生小动物的方式叫胎生。根据繁殖方式，动物分为卵生动物和胎生动物等。\n孵卵了解动物的繁殖行为。\n调查母鸡产卵前后的行为。说一说母鸡的哪些行为与繁殖后代有关。\n教出腹社公鸡和母鸡·选择一种胎生动物，调查它们的哪些行为与繁殖后代有关。\n哺乳\n\n### [第 35 页]\n\n![第 35 页教学插图与实验活动](figures/p35.png)\n\n#### 💬 研讨胎生动物与卵生动物各有什么特点？\n动物筑巢与繁殖后代有关吗？说一说你的理由。\n\n#### 🚀 拓展查阅资料，了解更多动物的繁殖行为。\n雀开屏织雀筑巢靖蜓点水"}, {"id": "sci_06_u02_l03", "lesson_idx": 87, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 2, "unit_title": "第二单元动物的一生", "lesson_no": 3, "title": "迎接蚕宝宝的到来", "page": 36, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g06_s2_u02_l03.html", "code": "g06_s2_u02_l03", "sections": {"focus": "蚕卵孵化和蚕的健康生长需要什么条件？", "exploration": "给蚕宝宝建造教府科学什么样的“家”便于我们观察呢？\n为蚕宝宝建个“家”请教有经验的人或查阅资料，了解要让蚕卵顺利孵化、蚕健康生长应该满足什么条件。\n根据调查结果，选取合适的材料，为蚕宝宝建一个舒适的“家”。", "discussion": "提示课后注意观所有的蚕卵都一样吗？猜测一下，它们都察蚕卵的变化。别忘了记录蚕卵孵化能孵化出蚕吗？\n的日期和委刚出生在给蚕宝宝建“家”时，我们是否考虑了的样子。\n温度、湿度等条件？用什么方法可以检验温度、湿度是否会影响卵的孵化？\n教有科学", "expansion": "鱼卵收集更多动物卵的图片，了解它们的形态特征和所处的环境。\n蚂蚁卵龟卵", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p36.webp", "p37.webp", "p38.webp"], "raw_text": "### [第 36 页]\n\n![第 36 页教学插图与实验活动](figures/p36.png)\n\n## 3. 迎接蚕宝宝的到来\n\n\n迎接蚕宝宝的到来蚕是卵生动物，我们的祖先很早就开始养蚕了。我们也来学习如何养蚕，探究动物一生的生长变化。\n\n#### 🎯 聚焦蚕卵孵化和蚕的健康生长需要什么条件？\n\n#### 🔬 探索给蚕宝宝建造教府科学什么样的“家”便于我们观察呢？\n为蚕宝宝建个“家”请教有经验的人或查阅资料，了解要让蚕卵顺利孵化、蚕健康生长应该满足什么条件。\n根据调查结果，选取合适的材料，为蚕宝宝建一个舒适的“家”。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u02_l03.html)\n\n\n### [第 37 页]\n\n![第 37 页教学插图与实验活动](figures/p37.png)\n\n制订观察计划。\n“蚕的一生”观察计划养蚕是个长日期：\n期活动，要坚持饲养地点：教室。\n写观察日记。\n食物：桑叶。\n观察记录方法：填写记录表、写观察日记、拍视频、拍照、画图等。\n观察记录内容：\n也可以用照片蚕的生长变化记录表和视频记录不同时日期它的特点期蚕的样子。\n（用图画记录）体长/毫米生长需要其他发现科兰大观察蚕卵的外部形态特征，将观察的结果用图画或文字记录下来。\n蚕卵这么小，怎样测量它的大小和轻重呢？\n\n### [第 38 页]\n\n![第 38 页教学插图与实验活动](figures/p38.png)\n\n#### 📝 记录单蚕卵的形态特征日期：\n用图画记录用文字描述大小：\n形状：\n颜色：\n轻重：\n其他：\n\n#### 💬 研讨提示课后注意观所有的蚕卵都一样吗？猜测一下，它们都察蚕卵的变化。别忘了记录蚕卵孵化能孵化出蚕吗？\n的日期和委刚出生在给蚕宝宝建“家”时，我们是否考虑了的样子。\n温度、湿度等条件？用什么方法可以检验温度、湿度是否会影响卵的孵化？\n教有科学\n\n#### 🚀 拓展鱼卵收集更多动物卵的图片，了解它们的形态特征和所处的环境。\n蚂蚁卵龟卵"}, {"id": "sci_06_u02_l04", "lesson_idx": 88, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 2, "unit_title": "第二单元动物的一生", "lesson_no": 4, "title": "幼蚕在生长", "page": 39, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g06_s2_u02_l04.html", "code": "g06_s2_u02_l04", "sections": {"focus": "幼蚕身体的外部形态和结构是怎样的？\n它们是如何生长的？", "exploration": "头胸观察并描述幼蚕的外部形态和结构。\n购足足", "discussion": "提示在蚕房中搭些小架子或者用硬纸片做些小格蚕最喜欢吃什么食物？你还知道哪子，为蚕结茧作准备。\n注意观察蚕吐丝的过程，些动物的食物喜好？\n用视频、文字或图画记录幼蚕的身体有哪些结构？它们分别下来。\n要坚持记录委发生的有什么功能？\n新变化！\n我们还知道哪些动物生长过程中也有蜕皮现象？", "expansion": "了解周围的小动物，它们生长需要什么？它们的幼年时期是什么样的？\n蝴蝶的幼虫社蛙的幼体（蝌蚪）蜻蜓的幼虫", "frontier": "", "big_concept": "植物的每一处器官形态均是自然选择的精妙杰作——扁平叶片最大化受光面积，维管束导管利用水分子毛细吸力将矿物质逆重力泵送百米树梢，根系向地性确保了机械固定与深层水源汲取。", "misconception": ""}, "figures": ["p39.webp", "p40.webp", "p41.webp"], "raw_text": "### [第 39 页]\n\n![第 39 页教学插图与实验活动](figures/p39.png)\n\n## 4. 幼蚕在生长\n\n\n幼蚕在生长刚出生的蚕长得像蚂蚁一样，叫蚁蚕蚁蚕皮后，它们慢慢变得又白又胖。它们都是幼蚕。\n\n#### 🎯 聚焦幼蚕身体的外部形态和结构是怎样的？\n它们是如何生长的？\n\n#### 🔬 探索头胸观察并描述幼蚕的外部形态和结构。\n购足足\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿生物工程（太空诱变育种与人工合成淀粉）**：中国空间站已成功开展水稻从种子到种子的全生命周期空间培养；中科院科研人员更在全球首次实现了从二氧化碳到淀粉的无细胞人工化学全合成，极大拓宽了光合作用的理论边界！\n- 🧠 **跨学科大概念（结构与功能相适应）**：植物的每一处器官形态均是自然选择的精妙杰作——扁平叶片最大化受光面积，维管束导管利用水分子毛细吸力将矿物质逆重力泵送百米树梢，根系向地性确保了机械固定与深层水源汲取。\n- ⚠️ 许多小学生认为“植物生长所需要的泥土全部被植物‘吃’进了肚子里”。**科学真相**：经典的凡·海尔蒙特柳树实验表明，植物增重的绝大部分干物质并非来自土壤，而是通过光合作用“抓取”空气中的二氧化碳分子同化而成的有机碳链！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u02_l04.html)\n\n\n### [第 40 页]\n\n![第 40 页教学插图与实验活动](figures/p40.png)\n\n测量幼蚕身体的长度。\n观察蚕的生活，交流观察到的现象。\n资料用棉签轻轻触碰幼蚕生长到一蚕怎样吃东委身体的各个部分，定阶段，会长出新皮西？怎样运动？\n它会有什么反应？\n换下旧皮，这种现象叫蜕皮。蚕蜕皮前不吃也不动，好像睡着了一样，称作“眠”。\n发现不吃也不动的蚕，不要轻易将它扔掉哟！\n挑选几只幼蚕，分别提供桑叶、榆树叶、莴苣叶等植物的叶子或其他食物，观察幼蚕的行为。\n\n### [第 41 页]\n\n![第 41 页教学插图与实验活动](figures/p41.png)\n\n#### 💬 研讨提示在蚕房中搭些小架子或者用硬纸片做些小格蚕最喜欢吃什么食物？你还知道哪子，为蚕结茧作准备。\n注意观察蚕吐丝的过程，些动物的食物喜好？\n用视频、文字或图画记录幼蚕的身体有哪些结构？它们分别下来。\n要坚持记录委发生的有什么功能？\n新变化！\n我们还知道哪些动物生长过程中也有蜕皮现象？\n\n#### 🚀 拓展了解周围的小动物，它们生长需要什么？它们的幼年时期是什么样的？\n蝴蝶的幼虫社蛙的幼体（蝌蚪）蜻蜓的幼虫"}, {"id": "sci_06_u02_l05", "lesson_idx": 89, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 2, "unit_title": "第二单元动物的一生", "lesson_no": 5, "title": "蚕变了新模样", "page": 42, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g06_s2_u02_l05.html", "code": "g06_s2_u02_l05", "sections": {"focus": "蚕为什么要将自己包裹在茧中？茧中的蚕变成了什么样子？它们还活着吗？", "exploration": "蚕在吐丝的时候，头部有哪些典型的动作！\n交流我们看到的蚕吐丝结茧的过程。", "discussion": "“春蚕到死丝方尽”，蚕吐完丝会死吗？根据观察，说一说理由。\n蚕结茧对蚕来说有什么意义？我们还能说出其他也会吐丝结茧、化蛹的动物吗？", "expansion": "传统的丝工我们的祖先很早就开始养蚕、巢艺要将委茧放在热丝、制作丝绸制品。挑选一些蚕茧，水中浸池。有什么办法不伤害蚕同分组开展抽蚕丝活动。测量一下，一时也能抽丝吗？\n个蚕茧能抽出多长的蚕丝？\n学生操作丝", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p42.webp", "p43.webp", "p44.webp"], "raw_text": "### [第 42 页]\n\n![第 42 页教学插图与实验活动](figures/p42.png)\n\n## 5. 蚕变了新模样\n\n\n蚕变了新模样又过了一段时间，蚕是动着脑袋开始吐丝了，身体慢慢地被蚕丝包裹起来。\n\n#### 🎯 聚焦蚕为什么要将自己包裹在茧中？茧中的蚕变成了什么样子？它们还活着吗？\n\n#### 🔬 探索蚕在吐丝的时候，头部有哪些典型的动作！\n交流我们看到的蚕吐丝结茧的过程。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u02_l05.html)\n\n\n### [第 43 页]\n\n![第 43 页教学插图与实验活动](figures/p43.png)\n\n取出一个蚕茧，仔细观察，推测蚕茧中是否还有蚕。如果有，你认为它还活着吗？依据是什么？\n剪开这个蚕茧，观察茧中蚕的样子并用图画记录下来。\n为了保护蚕蛹，我们想办法将剪下的半茧贴回去。\n观察、比较蚕的幼虫和蚕蛹的外部形态，它们有什么相同和不同？\n眼育科学幺版限体节气门体节气门足\n\n### [第 44 页]\n\n![第 44 页教学插图与实验活动](figures/p44.png)\n\n#### 💬 研讨\n\n“春蚕到死丝方尽”，蚕吐完丝会死吗？根据观察，说一说理由。\n蚕结茧对蚕来说有什么意义？我们还能说出其他也会吐丝结茧、化蛹的动物吗？\n\n#### 🚀 拓展传统的丝工我们的祖先很早就开始养蚕、巢艺要将委茧放在热丝、制作丝绸制品。挑选一些蚕茧，水中浸池。有什么办法不伤害蚕同分组开展抽蚕丝活动。测量一下，一时也能抽丝吗？\n个蚕茧能抽出多长的蚕丝？\n学生操作丝"}, {"id": "sci_06_u02_l06", "lesson_idx": 90, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 2, "unit_title": "第二单元动物的一生", "lesson_no": 6, "title": "茧中钻出了蚕蛾", "page": 45, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g06_s2_u02_l06.html", "code": "g06_s2_u02_l06", "sections": {"focus": "蚕蛾真的是由蛹发育而来的吗？蛾与蝶有什么相同和不同？\n被剪开蚕茧的蚕蛹变成蚕蛾了吗？", "exploration": "盲科交流这段时间我们的新发现。\n蚕蛾破茧而出死亡产卯交尾", "discussion": "蚕蛾的哪些行为与繁殖后代有关？\n它们是昆蚕和蝴蝶是昆虫，我们周围还有哪虫吗？\n些常见的小动物也是昆虫？\n蚊子蜘蛛蚂蚁虾娱蚣靖蜓", "expansion": "育科学出斯社ES像蚕一样，动物的生长和繁殖都需要一定的条件。\n查阅资料，了解鸡蛋孵化需要的环境条件，并尝试用鸡蛋孵化小鸡，观察小鸡的生命过程。", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p45.webp", "p46.webp", "p47.webp"], "raw_text": "### [第 45 页]\n\n![第 45 页教学插图与实验活动](figures/p45.png)\n\n## 6. 茧中钻出了蚕蛾\n\n\n茧中钻出了蚕蛾结茧一段时间后，蚕茧上的一个地方开始逐渐变薄，不久钻出了一只蚕蛾。\n\n#### 🎯 聚焦蚕蛾真的是由蛹发育而来的吗？蛾与蝶有什么相同和不同？\n被剪开蚕茧的蚕蛹变成蚕蛾了吗？\n\n#### 🔬 探索盲科交流这段时间我们的新发现。\n蚕蛾破茧而出死亡产卯交尾\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u02_l06.html)\n\n\n### [第 46 页]\n\n![第 46 页教学插图与实验活动](figures/p46.png)\n\n观察蚕蛾的外部形态特征。比较蚕蛾与资料蚕蛹，推测蚕蛾身体的各部分可能是由蚕蛹蛾和蝶都是由蛹发育来的，这个过程的哪些部分发育来的。\n叫“羽化”。\n头购腹观察、比较蚕蛾和蝴蝶，说一说它们的相同与不同。\n科学出社\n\n#### 📝 记录单\n\nES蚕蛾和蝴蝶的相同与不同像和蝶这日期：\n样，身体分为头、胸、腹三部分，头部长有触角、胸部蚕蛾蝴蝶长有三对足的动物是昆虫。\n\n### [第 47 页]\n\n![第 47 页教学插图与实验活动](figures/p47.png)\n\n#### 💬 研讨蚕蛾的哪些行为与繁殖后代有关？\n它们是昆蚕和蝴蝶是昆虫，我们周围还有哪虫吗？\n些常见的小动物也是昆虫？\n蚊子蜘蛛蚂蚁虾娱蚣靖蜓\n\n#### 🚀 拓展育科学出斯社ES像蚕一样，动物的生长和繁殖都需要一定的条件。\n查阅资料，了解鸡蛋孵化需要的环境条件，并尝试用鸡蛋孵化小鸡，观察小鸡的生命过程。"}, {"id": "sci_06_u02_l07", "lesson_idx": 91, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 2, "unit_title": "第二单元动物的一生", "lesson_no": 7, "title": "昆虫的一生", "page": 48, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g06_s2_u02_l07.html", "code": "g06_s2_u02_l07", "sections": {"focus": "蚕一生的生长发育过程是怎样的？其他昆虫的一生又是怎样的呢？", "exploration": "方种学出整理我们的记录，将不同阶段蚕的图片，按生长变化顺序排列。\n死亡", "discussion": "长京科兰出自然环境下蚕一般在春天孵化，所以被称为春蚕。我们可以在秋季和冬季养蚕吗？说一说理由。\n根据昆虫一生的形态特点，如果要避免家中蚊子、苍蝇、米象等昆虫的滋生，我们怎样做最有效？", "expansion": "课后写一篇短文，讲述我们养蚕过程中最难忘的故事。", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p48.webp", "p49.webp", "p50.webp"], "raw_text": "### [第 48 页]\n\n![第 48 页教学插图与实验活动](figures/p48.png)\n\n## 7. 昆虫的一生\n\n\n昆虫的一生交配、产卵后的蚕蛾死了。它们完成了自己的一生。和许多动物一样，它们产的卵将会孵化出更多的蚕，开启新一代的生命历程。\n\n#### 🎯 聚焦蚕一生的生长发育过程是怎样的？其他昆虫的一生又是怎样的呢？\n\n#### 🔬 探索方种学出整理我们的记录，将不同阶段蚕的图片，按生长变化顺序排列。\n死亡\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u02_l07.html)\n\n\n### [第 49 页]\n\n![第 49 页教学插图与实验活动](figures/p49.png)\n\n阅读资料，选择代表4个阶段的4张图片，用箭头呈现蚕的生命周期现象。\n蚕的一生都会经历卵、幼虫、蛹、成虫四个阶段，成虫产幼虫卵这就是蚕卵后会衰老死亡，产生命周期的主下的卵又开始新的生要阶段。\n命历程。这一现象叫生命周期现象。\n蛹成虫（蛾）\n1. 算一算，蚕的一生大约是多长时间？每个阶段大约经历了多长时间？\n班级记录单蚕的各阶段经历了多少天出日期：\n从委卯变成委（蚕卵孵化期）从委变成委炳（幼虫期）从蚕蛹变成蚕藏（蛹期）从委藏出现到死亡（成虫期）蚕的一生经历的时间\n\n### [第 50 页]\n\n![第 50 页教学插图与实验活动](figures/p50.png)\n\n收集资料，了解更多昆虫的生命周期现象，描述它们与蚕的一生有什么相同和不同。\n\n#### 📝 记录单了解昆虫的一生日期：\n昆虫卵幼虫蛹成虫莱粉蝶靖蜓\n\n#### 💬 研讨长京科兰出自然环境下蚕一般在春天孵化，所以被称为春蚕。我们可以在秋季和冬季养蚕吗？说一说理由。\n根据昆虫一生的形态特点，如果要避免家中蚊子、苍蝇、米象等昆虫的滋生，我们怎样做最有效？\n\n#### 🚀 拓展课后写一篇短文，讲述我们养蚕过程中最难忘的故事。"}, {"id": "sci_06_u02_l08", "lesson_idx": 92, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 2, "unit_title": "第二单元动物的一生", "lesson_no": 8, "title": "动物的生命周期", "page": 51, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g06_s2_u02_l08.html", "code": "g06_s2_u02_l08", "sections": {"focus": "除昆虫之外，其他种类动物的生命周期又是怎样的呢？\n教育科子公散社", "exploration": "查阅资料，了解其他动卵幼鱼物的生命周期。\n成鱼鱼的生命周期", "discussion": "以一种动物为例，说一说它生存需要什么。它的身体有哪些结构？这些结构在它的生命过程中起什么作用？\n不同种类动物的生长发育过程有哪些共同特征？\n徽育", "expansion": "为了生存和繁殖后代，动物的外部形态和行为会随着环境的变化而变化。比如，冬季来临，大雁南飞、兔子换毛、蛇冬眠等。\n做个科学小报，介绍动物的一生和它们的生存需求以及我们应该怎样保护它们。", "frontier": "", "big_concept": "生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。", "misconception": ""}, "figures": ["p51.webp", "p52.webp", "p53.webp", "p54.webp", "p55.webp", "p56.webp", "p57.webp"], "raw_text": "### [第 51 页]\n\n![第 51 页教学插图与实验活动](figures/p51.png)\n\n## 8. 动物的生命周期\n\n\n动物的生命周期鸡、蚕、靖蜓等动鸡蛋物的一生都经历了从出生到死亡的过程。自然孵化界中的所有动物包括我们自己，都会经历从出生到死亡的过程。\n成鸡小鸡\n\n#### 🎯 聚焦除昆虫之外，其他种类动物的生命周期又是怎样的呢？\n教育科子公散社\n\n#### 🔬 探索查阅资料，了解其他动卵幼鱼物的生命周期。\n成鱼鱼的生命周期\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿古生物学与生态基因库（国家基因库与恐龙羽毛演化）**：我国热河生物群带羽毛恐龙（如中华龙鸟）化石的发现，无可辩驳地确立了“现代鸟类是由兽脚类恐龙演化而来”的里程碑定论；高通量基因测序技术更重构了全球物种生命树与食物网脆弱度阈值。\n- 🧠 **跨学科大概念（尺度与比例 / 生态位）**：生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。\n- ⚠️ 很多同学误以为“凶猛的肉食动物消灭弱小食草动物对大自然有害”。**科学真相**：顶级捕食者能控制食草动物种群数量以防止过度啃食植被草原（营养级联效应），捕食体弱病体反而促进了种群基因库的健康优化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u02_l08.html)\n\n\n### [第 52 页]\n\n![第 52 页教学插图与实验活动](figures/p52.png)\n\n成蛙蚌幼蛙长出四条腿的蝌蚌长出两条疑的蝌斗蛙的生命周期比较不同种类动物的生命周期，找出它们的共同特征，并将我们的发现记录下来。\n\n#### 📝 记录单不同种类动物生命周期的共同特征日期：\n种类动物名称生命周期共同特征了解我们人类的一生。\n\n### [第 53 页]\n\n![第 53 页教学插图与实验活动](figures/p53.png)\n\n在妈妈肚子里的时候，我们叫胎儿。\n观察周围不同年龄的人，说一说我们人类的生命周期，推测我们未来可能发生哪些变化。\n\n#### 💬 研讨以一种动物为例，说一说它生存需要什么。它的身体有哪些结构？这些结构在它的生命过程中起什么作用？\n不同种类动物的生长发育过程有哪些共同特征？\n徽育\n\n#### 🚀 拓展为了生存和繁殖后代，动物的外部形态和行为会随着环境的变化而变化。比如，冬季来临，大雁南飞、兔子换毛、蛇冬眠等。\n做个科学小报，介绍动物的一生和它们的生存需求以及我们应该怎样保护它们。\n\n### [第 54 页]\n\n![第 54 页教学插图与实验活动](figures/p54.png)\n\n#### 📋 单元小结食物温度空气水阳光卵生存、生长需要昆虫幼虫鱼类蝇以蚕为例生长动物种类变化鸟类成虫（交配产卵）哺乳类繁殖袁老死亡方式胎生卵生其他千姿百态的动物可以分为昆虫、鱼类、鸟类、哺乳类等不同的类别。所有动物都有生存和繁殖的需求，动物生存都需要食物、空气、水和适宜的温度等，而它们的繁殖方式各异，常见的有卵生和胎生两种。动物的一生都会经历出生、生长发育、繁殖和死亡的过程。这样的生命过程一代一代循环往复，使种群得以延续，地球生机勃勃。\n我的收获怎样改进呢？\n评价内容评价等级我学会饲养小动物的方法我通过养蚕知道动物生存需要的条件我能从多方面比较动物，概括动物的共同特征我的观察记录反映了蚕完整的生命周期我更加珍爱小动物，喜欢观察它们的行为\n\n### [第 55 页]\n\n![第 55 页教学插图与实验活动](figures/p55.png)\n\n#### 📖 科学阅读动物的冬眠科学家通常把动物处于一种不吃、不喝、不动，且体温和新陈代谢率明显下降的状态，叫作蛰伏。一般地，我们把发生在冬季的蛰伏叫冬眠，发生在夏季的叫夏眠。冬眠是很多动物熬过严寒的生活方式，在它们的一生中至关重要。\n以蛙、蟾蜍、蝶螈为代表的两栖动物，以蛇、龟、鳄鱼、蜥蜴为代表的爬行动物，属于变温动物。在环境温度下降到只有几摄氏度，甚至零摄氏度以下的时候，它们的体温也会随之下降，进人冬眠。\n鸟类是恒温动物，冬眠种类极少。1949年，动物学家才首次发现冬眠的鸟类一弱夜鹰。\n除了熊、蝙蝠、刺猬外，还有很多鼠类会冬眠。蝙蝠保持着冬眠时间最长的纪录。\n冬眠的机理目前还不十分清楚，但很多冬眠动物在同体型的近缘物种中寿命更长。例如同体型冬眠的菊头蝠和不冬眠的老鼠相比，前者可以活到30多岁，后者却只能活到三四岁。科学家还在努力揭示其中的奥秘。\n刺猬\n\n### [第 56 页]\n\n![第 56 页教学插图与实验活动](figures/p56.png)\n\n它的近亲是“马”还是“鹿”你见过这种动物吗？\n观察它的外部形态，你认为它和哪种动物的亲缘关系更近一些？有人说它是斑马的亲戚，也有人说它的祖先应该是鹿，还有人说它是斑马和长颈鹿交配产生的后代。\n它到底是怎样一种动物呢？这种动物叫霍加霍加狼和长颈鹿，生活在非洲热带雨林中，是一种古老的哺乳动物。它看上去更像一匹马，尤其是前腿和后半身长有斑马样的花纹，人们刚发现它的时候，将其错误地归为马类。后来经过进一步考查，发现按照亲缘关系分，它实际上和长颈鹿更加接近，并且雄性霍加疲的头上还长着小小的鹿角。因此，人们大胆地猜测，现在的长颈鹿，可能数万年前脖子没变长的时候就是长成霍加彼这个样子的。\n霍加被生性胆小，警觉性很高，它每次只睡5分钟，其他时间都处于戒备状态。它的舌头是蓝色的，脚上能分泌出黑乎乎的像沥青一样的黏液，这种黏液会发出特殊的气味，用来标记自已的地盘和走过的路。霍加疲的寿命一般能达到20岁，有记录的“寿星”寿命达到了33岁。\n霍加疲有非洲独角兽之称，是一种珍稀动物，目前被列为“濒危”物种。\n\n### [第 57 页]\n\n![第 57 页教学插图与实验活动](figures/p57.png)\n\n第三单元只有一个地球通知\n4. 月22日是世界地球日，请少先队员们制作一张地球科普海报。大队部将评选优秀作品。\nxx学核大队部xx年×居×日我们生活在地球上，我们只有一个地球。\n地球是一颗什么样的星球？\n与其他星球相比，它有什么特别之处？\n太阳、月球对地球又有什么影响？\n对以上问题的探索，会加深我们对地球的认识，对我们制作地球科普海报有很大的帮助"}, {"id": "sci_06_u03_l01", "lesson_idx": 93, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 3, "unit_title": "第三单元只有一个地球", "lesson_no": 1, "title": "地球是我们的家园", "page": 58, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g06_s2_u03_l01.html", "code": "g06_s2_u03_l01", "sections": {"focus": "我们如何设计一张地球科普海报呢？", "exploration": "有的主题反映了地球的环境问题，搜集有关世界地球日主题的资料。\n有的主题反映了人类和地球的关系。\n世界地球日主题珍惜地球资源转变发展方式—促进生态文明共建美丽中国珍惜地球资源转变发展方式一节约集约利用国土资源共同保护自然生态空间珍惜地球资源转变发展方式—提高资源利用效益节约集约利用资源倡导绿色简约生活节约集约利用资源倡导绿色简约生活讲好我们的地球故事珍惜自然资源呵护美丽国土——讲好我们的地球故事珍爱美丽地球守护自然资源珍爱地球人与自然和谐共生\n2. 回顾以前的学习并整理资料：讨论如何让海报突出科学特色，弘版个表现地球的特点。\n地球和其他星球相我知道地球上有许多动物比，有什么特别之处？\n和植物。", "discussion": "要制作一张科普海报，我们应注意什么？\n为了保护地球，我们应该了解哪些内容？", "expansion": "为了制作好科生命之源表面温度普海报，我们要准备一些材料，如纸、图片、彩笔等；还可以利用课余时间和高年大气层我和我的地惑生命级的同学交流，学习他们的经验。\n高年级同学制作的海报", "frontier": "", "big_concept": "地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。", "misconception": ""}, "figures": ["p58.webp", "p59.webp", "p60.webp"], "raw_text": "### [第 58 页]\n\n![第 58 页教学插图与实验活动](figures/p58.png)\n\n## 1. 地球是我们的家园\n\n\n地球是我们的家园世界地球日是为保护和改善地球环境而设立的节日。我们应当为保护地球贡献一份力量。\n\n#### 🎯 聚焦我们如何设计一张地球科普海报呢？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿地球科学（深地探测与“奋斗者”号深潜）**：我国“深地一号”油气钻井已穿透地下万米白垩系地层，结合地震波断层成像技术，科学家如同给地球做“超声波CT”，实时洞察地壳构造板块运动与深部地幔热柱对流！\n- 🧠 **跨学科大概念（稳定与变化 / 因果机制）**：地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。\n- ⚠️ 小学生常认为“岩石是永恒不变、坚不可摧的”。**科学真相**：在水、大气、温度变化以及植物根系分泌酸的作用下，岩石在持续发生物理风化与化学侵蚀，并在地质循环中重熔为岩浆或沉积为土壤，地表始终在缓慢而剧烈地重塑。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u03_l01.html)\n\n\n### [第 59 页]\n\n![第 59 页教学插图与实验活动](figures/p59.png)\n\n#### 🔬 探索有的主题反映了地球的环境问题，搜集有关世界地球日主题的资料。\n有的主题反映了人类和地球的关系。\n世界地球日主题珍惜地球资源转变发展方式—促进生态文明共建美丽中国珍惜地球资源转变发展方式一节约集约利用国土资源共同保护自然生态空间珍惜地球资源转变发展方式—提高资源利用效益节约集约利用资源倡导绿色简约生活节约集约利用资源倡导绿色简约生活讲好我们的地球故事珍惜自然资源呵护美丽国土——讲好我们的地球故事珍爱美丽地球守护自然资源珍爱地球人与自然和谐共生\n2. 回顾以前的学习并整理资料：讨论如何让海报突出科学特色，弘版个表现地球的特点。\n地球和其他星球相我知道地球上有许多动物比，有什么特别之处？\n和植物。\n\n### [第 60 页]\n\n![第 60 页教学插图与实验活动](figures/p60.png)\n\n开展研究。\n地球小档案为了保护地球，首先要了·球体。\n解地球。我们可以利用搜集的·太阳系的行星之一。\n资料，给地球建立小档案；还·地表由陆地和海洋组成。\n大气圈包裹着地球。\n可以制作模型，在观察与比较中·生活着许多生物。\n认识地球。\n·地表平均温度约15°℃。\n\n#### 💬 研讨要制作一张科普海报，我们应注意什么？\n为了保护地球，我们应该了解哪些内容？\n\n#### 🚀 拓展为了制作好科生命之源表面温度普海报，我们要准备一些材料，如纸、图片、彩笔等；还可以利用课余时间和高年大气层我和我的地惑生命级的同学交流，学习他们的经验。\n高年级同学制作的海报"}, {"id": "sci_06_u03_l02", "lesson_idx": 94, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 3, "unit_title": "第三单元只有一个地球", "lesson_no": 2, "title": "水的星球", "page": 61, "domain": "astronomy", "domain_cn": "综合科学探究", "sim_file": "sim_g06_s2_u03_l02.html", "code": "g06_s2_u03_l02", "sections": {"focus": "地球上分布着哪些水体？地球上海洋和陆地的面积哪个更大呢？", "exploration": "云（天空中的液态水或国态水）认识地球上不同形态的水体。\n地球上分布着不同类型的水体。常见的有江、河、湖、海，还有冰川（地表固态水）地下水等。\n海水（地表液态水）", "discussion": "通过观察，我们发现地球表面海洋和陆地的面积哪个更大？\n这与我们以前的想法相同吗？\n举例说一说地球上丰富的液态水对生物的好处。\n说一说节约水资源的重要性。\n地球上所", "expansion": "有的水虽然海洋覆盖了约71%的地球表面，但与整个地球体积相比，水的体积还是很小，可供人们饮用的淡水资源就更少了。\n抽干水后的地球出咸水淡水地表可用淡水地球上水资源的大致比例", "frontier": "", "big_concept": "天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。", "misconception": ""}, "figures": ["p61.webp", "p62.webp", "p63.webp"], "raw_text": "### [第 61 页]\n\n![第 61 页教学插图与实验活动](figures/p61.png)\n\n## 2. 水的星球\n\n\n水的星球汪洋大海、五湖四海等词语说明地球上分布着许多的水。\n\n#### 🎯 聚焦地球上分布着哪些水体？地球上海洋和陆地的面积哪个更大呢？\n\n#### 🔬 探索云（天空中的液态水或国态水）认识地球上不同形态的水体。\n地球上分布着不同类型的水体。常见的有江、河、湖、海，还有冰川（地表固态水）地下水等。\n海水（地表液态水）\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿空间探索（中国探月与深空探测工程）**：从“嫦娥六号”实现人类首次月背采样返回，到“祝融号”火星车巡视火星乌托邦平原，航天科学家利用精密轨道力学与光谱分析，正在解开太阳系演化与地月系统的终极奥秘！\n- 🧠 **跨学科大概念（系统与模型 / CER 推理）**：天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。\n- ⚠️ 很多同学误以为“月相变化是地球的影子挡住了月亮”。**科学真相**：地球影子挡住月球的现象是罕见的“月食”；而平时的初一到十五月相变化，纯粹是因为月球绕地球公转时，我们在地球上看到的月球被太阳照亮的半球面角度不同！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u03_l02.html)\n\n\n### [第 62 页]\n\n![第 62 页教学插图与实验活动](figures/p62.png)\n\n观察地球仪上水域的分布。\n在地球仪上，\n\n#### 📝 记录单我们能观察到哪些地球表面的水域分布不同的水体类型？\n日期：\n比一比海洋观察要点观察结果和陆地面积的大水体类型小。我们可以从下海洋面积面两种方法中任选陆地面积一种。\n方法一面积大数格子：将透明方格小以方格数多少计算。\n计算纸覆盖在世界地图上，数出海洋和陆地所占的格子数，然后比较。\n方法二数十指：多次抛接地球仪，统计和比较十指接触“海洋”写“陆地”的次数。\n\n### [第 63 页]\n\n![第 63 页教学插图与实验活动](figures/p63.png)\n\n#### 💬 研讨通过观察，我们发现地球表面海洋和陆地的面积哪个更大？\n这与我们以前的想法相同吗？\n举例说一说地球上丰富的液态水对生物的好处。\n说一说节约水资源的重要性。\n地球上所\n\n#### 🚀 拓展有的水虽然海洋覆盖了约71%的地球表面，但与整个地球体积相比，水的体积还是很小，可供人们饮用的淡水资源就更少了。\n抽干水后的地球出咸水淡水地表可用淡水地球上水资源的大致比例"}, {"id": "sci_06_u03_l03", "lesson_idx": 95, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 3, "unit_title": "第三单元只有一个地球", "lesson_no": 3, "title": "地球的卫星", "page": 64, "domain": "astronomy", "domain_cn": "综合科学探究", "sim_file": "sim_g06_s2_u03_l03.html", "code": "g06_s2_u03_l03", "sections": {"focus": "月球的表面有什么特点？和地球相比，月球是一颗什么样的星球？", "exploration": "了解人类对月球的探索历程2004. 年，我国开展了“嫦娥工程”探月计划并1969. 年，美国于2013年将°玉“阿波罗”11号兔”号月球车送1609. 年，意大利科搭载航天员登陆抵月球表面学家伽利略用望远月球古人对月球进行镜对月球进行观察观察和猜想", "discussion": "通过观察月球照片和查找资料，我们知道了月球表面的哪些特点？\n和月球相比，地球有什么显著的优点？它对地球上的生命有什么意义？", "expansion": "地球和月球的比较借助一些图片，可以帮助我们更好地比较地球和月球。\n大小对比地球上月球上\n1. 个地球81. 个月球月球引力约为地球的言鲁到人的弹跳高度对比", "frontier": "", "big_concept": "天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。", "misconception": ""}, "figures": ["p64.webp", "p65.webp", "p66.webp"], "raw_text": "### [第 64 页]\n\n![第 64 页教学插图与实验活动](figures/p64.png)\n\n## 3. 地球的卫星\n\n\n地球的卫星月球是地球唯一的天然卫星。\n我们曾经观察过月相，通过肉眼能观察到月球表面有明有暗。\n\n#### 🎯 聚焦月球的表面有什么特点？和地球相比，月球是一颗什么样的星球？\n\n#### 🔬 探索了解人类对月球的探索历程2004. 年，我国开展了“嫦娥工程”探月计划并1969. 年，美国于2013年将°玉“阿波罗”11号兔”号月球车送1609. 年，意大利科搭载航天员登陆抵月球表面学家伽利略用望远月球古人对月球进行镜对月球进行观察观察和猜想\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿空间探索（中国探月与深空探测工程）**：从“嫦娥六号”实现人类首次月背采样返回，到“祝融号”火星车巡视火星乌托邦平原，航天科学家利用精密轨道力学与光谱分析，正在解开太阳系演化与地月系统的终极奥秘！\n- 🧠 **跨学科大概念（系统与模型 / CER 推理）**：天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。\n- ⚠️ 很多同学误以为“月相变化是地球的影子挡住了月亮”。**科学真相**：地球影子挡住月球的现象是罕见的“月食”；而平时的初一到十五月相变化，纯粹是因为月球绕地球公转时，我们在地球上看到的月球被太阳照亮的半球面角度不同！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u03_l03.html)\n\n\n### [第 65 页]\n\n![第 65 页教学插图与实验活动](figures/p65.png)\n\n观察月球图片。比较月球的正面和背月球小档案面，我们观察到了什么？\n球体。\n·地球的卫星。\n·表面没有液体水覆盖。\n没有大气层。\n·未发现生物。\n·昼夜温差大，白天可以月球的正面月球的背面高于120℃，夜间可以低于-180℃。\n搜集月球资料，做成一些卡片。\n资料月海不是海一开始，人们用肉眼遥望月球时，可以隐约看到月球上存在一些暗色区域。后来，人们较为清晰地观察到它们实际上是月球表面的黑色斑块，并误以为它们是地势低注的海洋。而之后的研究证明，月球上并没有海洋，但“月海”的名字却沿用至今。绝大多数月海分布在月球正面。\n\n### [第 66 页]\n\n![第 66 页教学插图与实验活动](figures/p66.png)\n\n比较地球和月球的特点并记录。\n\n#### 📝 记录单比较地球和月球日期：\n地球月球\n\n#### 💬 研讨通过观察月球照片和查找资料，我们知道了月球表面的哪些特点？\n和月球相比，地球有什么显著的优点？它对地球上的生命有什么意义？\n\n#### 🚀 拓展地球和月球的比较借助一些图片，可以帮助我们更好地比较地球和月球。\n大小对比地球上月球上\n1. 个地球81. 个月球月球引力约为地球的言鲁到人的弹跳高度对比"}, {"id": "sci_06_u03_l04", "lesson_idx": 96, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 3, "unit_title": "第三单元只有一个地球", "lesson_no": 4, "title": "我们来造“环形山”", "page": 67, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g06_s2_u03_l04.html", "code": "g06_s2_u03_l04", "sections": {"focus": "环形山的特点是什么？我们能模拟制造出“环形山”吗？", "exploration": "育科观察环形山的照片，说一说环形山有哪些特点。\n资料环形山大多数是圆形的，大小和深浅不同，有的直径不足一千米，有的直径达到几百千米。环形山有单个的，也有几个挤叠在一起的，还有大环套小环的。", "discussion": "我们是如何制造“环形山”的？不同大小的球模拟的是什么？\n我们制造的“环形山”与月球照片上的环形山有什么不同？\n分析一下可能的原因。", "expansion": "地球上的“环形山”地球上也有“环形山”，它们是由陨石撞击形成的陨石坑。大多数陨石坑都无法保持它原来的模样。借助俯视图，我们可以观察到最原始的撞痕。\n爱教育科学发陨石坑", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p67.webp", "p68.webp", "p69.webp"], "raw_text": "### [第 67 页]\n\n![第 67 页教学插图与实验活动](figures/p67.png)\n\n## 4. 我们来造“环形山”\n\n\n我们来造“环形山”我们已经观察了月球的图片，发现月球与地球有许多的不同，其中之一是月球表面有许多环形山。\n\n#### 🎯 聚焦环形山的特点是什么？我们能模拟制造出“环形山”吗？\n\n#### 🔬 探索育科观察环形山的照片，说一说环形山有哪些特点。\n资料环形山大多数是圆形的，大小和深浅不同，有的直径不足一千米，有的直径达到几百千米。环形山有单个的，也有几个挤叠在一起的，还有大环套小环的。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u03_l04.html)\n\n\n### [第 68 页]\n\n![第 68 页教学插图与实验活动](figures/p68.png)\n\n模拟制造“环形山”。\n将细沙平铺在水槽里模拟月壤，然后用大小不同的球撞击细沙。\n水槽和细沙试着制造出大小、深浅不同和重叠的“环形山”。\n大小不同的球\n\n#### 📝 记录单模拟制造“环形山”数言科学散社画出我们制造出的“环形山”的样子：\n继续比较月球和地球的特点，补充在上一课的记录中。\n\n### [第 69 页]\n\n![第 69 页教学插图与实验活动](figures/p69.png)\n\n#### 💬 研讨我们是如何制造“环形山”的？不同大小的球模拟的是什么？\n我们制造的“环形山”与月球照片上的环形山有什么不同？\n分析一下可能的原因。\n\n#### 🚀 拓展地球上的“环形山”地球上也有“环形山”，它们是由陨石撞击形成的陨石坑。大多数陨石坑都无法保持它原来的模样。借助俯视图，我们可以观察到最原始的撞痕。\n爱教育科学发陨石坑"}, {"id": "sci_06_u03_l05", "lesson_idx": 97, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 3, "unit_title": "第三单元只有一个地球", "lesson_no": 5, "title": "发光发热的太阳", "page": 70, "domain": "astronomy", "domain_cn": "综合科学探究", "sim_file": "sim_g06_s2_u03_l05.html", "code": "g06_s2_u03_l05", "sections": {"focus": "太阳和我们的生活有什么关系？\n太阳是一颗什么样的星球？\n太阳小档案", "exploration": "·球体。\n·太阳系的中心天体。\n搜集并了解有关太阳的图文资料，建”·距地球最近的恒星。\n立太阳小档案。义·表面温度约6000°℃·直径约为地球的109倍，体积约为地球的130万倍。", "discussion": "太阳是一颗什么样的星球？说一说我们的新认识。\n假如没有了太阳，地球将会有哪些变化？说出观点和依据。\n太阳能取之不尽，用之不竭。你知道哪些利用太阳能改善我们生活的例子？", "expansion": "用红外测温仪测量地表温度，观察阳光对地球表面温度的影响。\n测量向阳处和背阴处的地表温度", "frontier": "", "big_concept": "天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。", "misconception": ""}, "figures": ["p70.webp", "p71.webp", "p72.webp"], "raw_text": "### [第 70 页]\n\n![第 70 页教学插图与实验活动](figures/p70.png)\n\n## 5. 发光发热的太阳\n\n\n发光发热的太阳夸父逐日、羿射九日是我国古代有关太阳的神话故事。自古以来，太阳和人类的关系就十分密切。\n\n#### 🎯 聚焦太阳和我们的生活有什么关系？\n太阳是一颗什么样的星球？\n太阳小档案\n\n#### 🔬 探索\n\n·球体。\n·太阳系的中心天体。\n搜集并了解有关太阳的图文资料，建”·距地球最近的恒星。\n立太阳小档案。义·表面温度约6000°℃·直径约为地球的109倍，体积约为地球的130万倍。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿空间探索（中国探月与深空探测工程）**：从“嫦娥六号”实现人类首次月背采样返回，到“祝融号”火星车巡视火星乌托邦平原，航天科学家利用精密轨道力学与光谱分析，正在解开太阳系演化与地月系统的终极奥秘！\n- 🧠 **跨学科大概念（系统与模型 / CER 推理）**：天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。\n- ⚠️ 很多同学误以为“月相变化是地球的影子挡住了月亮”。**科学真相**：地球影子挡住月球的现象是罕见的“月食”；而平时的初一到十五月相变化，纯粹是因为月球绕地球公转时，我们在地球上看到的月球被太阳照亮的半球面角度不同！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u03_l05.html)\n\n\n### [第 71 页]\n\n![第 71 页教学插图与实验活动](figures/p71.png)\n\n认识光源。判断下面哪些物体是光源。\n太阳月球电灯镜子资料像太阳、电灯等本身能发光的物体是光源。月球、镜子等本身不能发光，而是反射其他物体的光，不是光源。\n向阳处了解太阳和我们的关系。\n太阳光照射到地球上，给地球带来光明和温暖。太阳是地球重要的能量来源，它影响着植物的生长、水循环、大气运动等。\n背阴处比较阳光照射对水蒸发的影响比较太阳和地球，记录在下图中。\n\n#### 📝 记录单教出比较太阳和地球日期：\n地球太阳水的星球有生命高温会发光不会发光韧在太阳系里行星有六气都是球体设生命光源鞋色恒星有卫星\n\n### [第 72 页]\n\n![第 72 页教学插图与实验活动](figures/p72.png)\n\n#### 💬 研讨太阳是一颗什么样的星球？说一说我们的新认识。\n假如没有了太阳，地球将会有哪些变化？说出观点和依据。\n太阳能取之不尽，用之不竭。你知道哪些利用太阳能改善我们生活的例子？\n\n#### 🚀 拓展用红外测温仪测量地表温度，观察阳光对地球表面温度的影响。\n测量向阳处和背阴处的地表温度"}, {"id": "sci_06_u03_l06", "lesson_idx": 98, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 3, "unit_title": "第三单元只有一个地球", "lesson_no": 6, "title": "一天中影子的变化", "page": 73, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g06_s2_u03_l06.html", "code": "g06_s2_u03_l06", "sections": {"focus": "影子是怎样形成的？一天中，阳光下物体影子的变化有什么规律？", "exploration": "手电筒木圆柱研究影子的产生。\n利用图中的材料做实验。想一想，产生影子需要什么条件？", "discussion": "影子的产生需要什么条件？\n物体影子的变化与一天中时间的变化有什么样的关系？", "expansion": "日暑是我国古代人民利用影子与时间的关系制造的一种计量时间的仪器。\n对比一下，我们制作的观测工具和日有哪些相同和不同？", "frontier": "", "big_concept": "光在同种均匀介质中沿直线传播，在不同介质界面遵循反射定律（∠i = ∠r）与折射定律（Snell定律），是物质微观能级跃迁释放的电磁波。", "misconception": ""}, "figures": ["p73.webp", "p74.webp", "p75.webp"], "raw_text": "### [第 73 页]\n\n![第 73 页教学插图与实验活动](figures/p73.png)\n\n## 6. 一天中影子的变化\n\n\n一天中影子的变化形影不离、如影随形等成语反映了物体和影子的关系。\n生活中，我们还玩过踩影子、手影等游戏。\n\n#### 🎯 聚焦影子是怎样形成的？一天中，阳光下物体影子的变化有什么规律？\n\n#### 🔬 探索手电筒木圆柱研究影子的产生。\n利用图中的材料做实验。想一想，产生影子需要什么条件？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **尖端光电科技（空间激光通信与超精密光刻机）**：我国“墨子号”量子科学实验卫星实现了千公里级星地量子纠缠分发与保密通信；而在超精密芯片制造中，极紫外光（EUV，波长13.5纳米）通过超光滑多层反射镜阵列精确聚焦刻蚀纳米级晶体管线路！\n- 🧠 **跨学科大概念（波粒二象性与波动几何学）**：光在同种均匀介质中沿直线传播，在不同介质界面遵循反射定律（∠i = ∠r）与折射定律（Snell定律），是物质微观能级跃迁释放的电磁波。\n- ⚠️ 常见认知迷思：“人在镜子里看到的像是一个真实存在的发光物体”。**科学真相**：平面镜成像属于虚像，是由镜面反射的漫反射发散光线被人眼反向延长线相交在大脑中汇聚而成的视觉暂留感知，镜子后方并不存在实际光线会聚点！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u03_l06.html)\n\n\n### [第 74 页]\n\n![第 74 页教学插图与实验活动](figures/p74.png)\n\n制作一个简易的观测工具，研究阳光下物体影子的变化规律。\n在一个平板上，贴上画有同心圆的观察纸，在纸板上标注方向。\n北将纸板对准方向，平放在地面。\n在纸板的中心，竖直地立上短木杆。\n每隔一段时间观察和记录一次影子西东的位置与长短。每次记录时，要标上观察的时间。\n分析记录的内容，寻找影子变化的南规律。\n同心圆观察纸我们还可以用指南针来确定方向。\n对准方向，平放纸板在纸板的中心立上短木杆在纸板上描绘影子\n\n### [第 75 页]\n\n![第 75 页教学插图与实验活动](figures/p75.png)\n\n北影子与光照的方向有什么关系？\n东南物体影子随时间变化的观察记录\n\n#### 💬 研讨影子的产生需要什么条件？\n物体影子的变化与一天中时间的变化有什么样的关系？\n\n#### 🚀 拓展日暑是我国古代人民利用影子与时间的关系制造的一种计量时间的仪器。\n对比一下，我们制作的观测工具和日有哪些相同和不同？"}, {"id": "sci_06_u03_l07", "lesson_idx": 99, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 3, "unit_title": "第三单元只有一个地球", "lesson_no": 7, "title": "地球的“兄弟姐妹”", "page": 76, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g06_s2_u03_l07.html", "code": "g06_s2_u03_l07", "sections": {"focus": "#### 💡 科学词汇行星太阳系还有哪些行星？它们各有什么特点呢？\n教有，八颗行星的大小", "exploration": "行星赤道直径/干米水星了解行星的大小。\n金星太阳系有八颗行星，地球是其地球火星中一颗，它还有七个“兄弟姐妹”。\n木星请按照行星的大小给它们土星排序。\n天王星海王星", "discussion": "通过搜集资料，我们知道地球和太阳系的其他行星相比有什么主要特点？地球有哪些适宜生命生存的条件？\n通过制作模型，我们对太阳系的八颗行星有什么新的认识？", "expansion": "木星小档案·气态行星，主要是氢气，它是超大“氢气球”。\n继续搜集行星的有关·太阳系中体积最大的行星，大约可以装下资料，选择感兴趣的内1300. 个地球。\n有大红斑，是超大的“风暴漩涡”容，为行星建立小档案。\n*.....", "frontier": "", "big_concept": "地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。", "misconception": ""}, "figures": ["p76.webp", "p77.webp", "p78.webp"], "raw_text": "### [第 76 页]\n\n![第 76 页教学插图与实验活动](figures/p76.png)\n\n## 7. 地球的“兄弟姐妹”\n\n\n地球的“兄弟姐妹”除地球外，还有水星、火星、木星等行星围绕太阳转动，这些行星就像地球的“兄弟姐妹”一样。\n本图不代表天体大小和距离的实际比例关系。\n\n#### 🎯 聚焦\n\n#### 💡 科学词汇行星太阳系还有哪些行星？它们各有什么特点呢？\n教有，八颗行星的大小\n\n#### 🔬 探索行星赤道直径/干米水星了解行星的大小。\n金星太阳系有八颗行星，地球是其地球火星中一颗，它还有七个“兄弟姐妹”。\n木星请按照行星的大小给它们土星排序。\n天王星海王星\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿地球科学（深地探测与“奋斗者”号深潜）**：我国“深地一号”油气钻井已穿透地下万米白垩系地层，结合地震波断层成像技术，科学家如同给地球做“超声波CT”，实时洞察地壳构造板块运动与深部地幔热柱对流！\n- 🧠 **跨学科大概念（稳定与变化 / 因果机制）**：地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。\n- ⚠️ 小学生常认为“岩石是永恒不变、坚不可摧的”。**科学真相**：在水、大气、温度变化以及植物根系分泌酸的作用下，岩石在持续发生物理风化与化学侵蚀，并在地质循环中重熔为岩浆或沉积为土壤，地表始终在缓慢而剧烈地重塑。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u03_l07.html)\n\n\n### [第 77 页]\n\n![第 77 页教学插图与实验活动](figures/p77.png)\n\n根据地球的特点，如表面温度、大气、卫星数等，搜集其他行星的有关资料并记录。\n\n#### 📝 记录单行星小资料日期：\n行星表面平均温度卫星数其他水星金星地球火星\n-55°℃\n木星\n-140°℃\n教土星\n-140℃\n出天王星\n-220°℃\n海王星\n-214℃\n\n### [第 78 页]\n\n![第 78 页教学插图与实验活动](figures/p78.png)\n\n制作星球模型。\n利用彩泥、超轻黏土、纸板、彩笔或其他材料来制作我们的星球模型。\n\n#### 💬 研讨通过搜集资料，我们知道地球和太阳系的其他行星相比有什么主要特点？地球有哪些适宜生命生存的条件？\n通过制作模型，我们对太阳系的八颗行星有什么新的认识？\n\n#### 🚀 拓展木星小档案·气态行星，主要是氢气，它是超大“氢气球”。\n继续搜集行星的有关·太阳系中体积最大的行星，大约可以装下资料，选择感兴趣的内1300. 个地球。\n有大红斑，是超大的“风暴漩涡”容，为行星建立小档案。\n*....."}, {"id": "sci_06_u03_l08", "lesson_idx": 100, "book": "三年级下册", "vol_dir": "06_三年级下册", "unit_no": 3, "unit_title": "第三单元只有一个地球", "lesson_no": 8, "title": "制作地球科普海报", "page": 79, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g06_s2_u03_l08.html", "code": "g06_s2_u03_l08", "sections": {"focus": "提示我们如何描述地球通过前面的学习，我们知道地球有许多特点，可以根据这些特点确定海报的主题和呢？如何设计和制作一张内容。如“多彩的地球”，用色彩来突出地地球科普海报呢？\n球是一个有生命的星球；又如“珍稀的水星球”，突出表现水对地球的重要作用。", "exploration": "各类水的形态确定内容。\n水水里的讨论并确定我们要表植物达的主题和主要内容，搜水在地球上的水里的集与主题相关的图文资料。\n面积动物", "discussion": "", "expansion": "欣赏同学们完成的海报，我们从中受到什么启发？\n出", "frontier": "", "big_concept": "地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。", "misconception": ""}, "figures": ["p79.webp", "p80.webp", "p81.webp", "p82.webp", "p83.webp", "p84.webp", "p85.webp", "p86.webp", "p87.webp"], "raw_text": "### [第 79 页]\n\n![第 79 页教学插图与实验活动](figures/p79.png)\n\n## 8. 制作地球科普海报\n\n\n制作地球科普海报我们已经了解地球和其他与地球关系紧密的星球，这对我们设计地球科普海报有不少帮助。\n\n#### 🎯 聚焦提示我们如何描述地球通过前面的学习，我们知道地球有许多特点，可以根据这些特点确定海报的主题和呢？如何设计和制作一张内容。如“多彩的地球”，用色彩来突出地地球科普海报呢？\n球是一个有生命的星球；又如“珍稀的水星球”，突出表现水对地球的重要作用。\n\n#### 🔬 探索各类水的形态确定内容。\n水水里的讨论并确定我们要表植物达的主题和主要内容，搜水在地球上的水里的集与主题相关的图文资料。\n面积动物\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿地球科学（深地探测与“奋斗者”号深潜）**：我国“深地一号”油气钻井已穿透地下万米白垩系地层，结合地震波断层成像技术，科学家如同给地球做“超声波CT”，实时洞察地壳构造板块运动与深部地幔热柱对流！\n- 🧠 **跨学科大概念（稳定与变化 / 因果机制）**：地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。\n- ⚠️ 小学生常认为“岩石是永恒不变、坚不可摧的”。**科学真相**：在水、大气、温度变化以及植物根系分泌酸的作用下，岩石在持续发生物理风化与化学侵蚀，并在地质循环中重熔为岩浆或沉积为土壤，地表始终在缓慢而剧烈地重塑。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g06_s2_u03_l08.html)\n\n\n### [第 80 页]\n\n![第 80 页教学插图与实验活动](figures/p80.png)\n\n讨论交流网络搜索设计版面。\n查阅书籍根据主题、资料、视觉效果等，综合考虑海报版面设计。\n教京科学出收社制作、装饰：\n认真检查相关数据的准确性。\n\n### [第 81 页]\n\n![第 81 页教学插图与实验活动](figures/p81.png)\n\n展示交流。\n\n#### 🚀 拓展欣赏同学们完成的海报，我们从中受到什么启发？\n出\n\n### [第 82 页]\n\n![第 82 页教学插图与实验活动](figures/p82.png)\n\n#### 📋 单元小结\n\n·月球是地球的卫星·表面有月海、环形山提供光和热·太阳是恒星·发光发热·体积巨大·地球是太阳系的一颗行星·表面有丰富的液态水·海洋面积比陆地面积大很多·有适宜生物生存的水、大气和温度等环境条件我们只有一个地球。与其他星球相比，地球上的水、大气、岩石、土壤等组成的独特环境，孕育和呵护着地球上的生命。在太阳系中，地球是唯一一颗有生命的行星。但地球并不孤单，太阳为地球送来光和热，月球围绕着地球运动，而且还有太阳系的七个“兄弟姐妹与它相伴。我们要保护好地球。\n我的收获怎样改进呢？\n评价内容评价等级我知道地球、太阳和月球的大小与位置我知道阳光下物体影子从早到晚的变化我体会到与同学合作有利于更好地开展观察和制作活动我的科普海报很受同学欢迎\n\n### [第 83 页]\n\n![第 83 页教学插图与实验活动](figures/p83.png)\n\n#### 📖 科学阅读我们改变着地球近两百年来，人类快速地改变着地球。\n随着人口的快速增长，人类需要从地球上获取更多的资源以满足生活所需，比如砍伐森林中的树木，用来盖房子；征用更多的土地，用来建设城市和道路；捕捞更多的鱼类，用来维持生长的消耗。同时，随着人类生存空间不断扩大，植物和动物的生存空间被压缩得越来越小。人类活动还导致空气、湖泊、海洋等受到严重污染，并影响全球变暖、极端天气气候事件等。\n全球变暖导致北极冰盖变小极端天气导致江河断流、湖泊干涸\n\n### [第 84 页]\n\n![第 84 页教学插图与实验活动](figures/p84.png)\n\n庆幸的是，人类已经意识到这些问题并正在采取行动，比如设立海洋和陆地生态保护区、利用太阳能和风力发电、有效处理垃圾等，缓和地球面临的危机。\n生态保护区过度开发和捕捞等不合理的人类活动已经危及陆地和海洋生态的平衡。因此，人们开始相互约定，划设保护区，在保护区内不可以开采、捕捞。这样一来，动物们就得到喘息的机会，在不受干扰的环境下繁殖生长。\n太阳能发电太阳照射到地面的能量是取之不尽的。\n这些能量也可以用太阳能板转换为电能。太阳能板可以装在屋顶上，或是集中在开阔平坦的地区，构成庞大的太阳能发电厂。\n风力发电用巨大的风车可以把风能转变为电能。这种做法不会污染空气。巨大的风力发电机通常架设在风力较大的地方，比如靠海的区域、山顶上或沙漠中。\n垃圾处理果皮等厨余垃圾很容易被土壤里的微生物分解，回到大自然的循环里，但塑料要花几百年的时间才能被分解！所以塑料垃圾必须回收，经过处理再利用。\n\n### [第 85 页]\n\n![第 85 页教学插图与实验活动](figures/p85.png)\n\n持续探索地球地球是我们唯一的家园。我们对地球了解得很清楚了吗？不，还早呢。比如，还有一些动物和植物没有被发现，地球内部的动态还不清楚，地球的历史还未被完全了解。科学家每天都在探索和研究地球，争取发现地球更多的秘密。\n奋斗春深海科学研究火山研究\n\n### [第 86 页]\n\n![第 86 页教学插图与实验活动](figures/p86.png)\n\n后记本套科学教科书由根据《义务教育科学课程标准（2022年版）》组织编写。编写团队由科研院所和高校的科学家、教育教学专家以及全国各地的优秀科学教师、教研员组成，周忠和院士与张红霞教授共同担任主编。\n编写过程中，我们得到了诸多科学家、教研员和一线教师的支持与帮助。\n李金华、张智慧、李博强、杨顺华、魏科、石承民、李实、张金海等为教科书编写提供了专业审查和咨询意见，高伟组织并参与编写了“制作天文望远镜”等单元。此外，还有很多单位、专家和同仁为我们提供了审读、插图、资料等方面的支持和帮助。他们的参与为确保教科书内容的科学性、适切性提供了重要支撑，在此一并表示诚挚谢意！\n我们真诚地欢迎广大师生和社会各界人士对教科书提出宝贵意见，帮助我们共同打造培根铸魂、启智增慧的精品教材。子出片反不土电子邮箱：science@esph.com.cn\n\n### [第 87 页]\n\n![第 87 页教学插图与实验活动](figures/p87.png)\n\n教育科学云。班级，姓名学号"}, {"id": "sci_07_u01_l01", "lesson_idx": 101, "book": "四年级上册", "vol_dir": "07_四年级上册", "unit_no": 1, "unit_title": "第一单元空气", "lesson_no": 1, "title": "感受空气", "page": 2, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g07_s1_u01_l01.html", "code": "g07_s1_u01_l01", "sections": {"focus": "空气无色无味，我们如何学出找到空气存在的证据呢？", "exploration": "寻找空气存在的证据。\n用塑料袋装一袋空气，用手按一按，我们有什么发现？\n我们已经知道空气无色无味，它还有什么性质呢？\n空瓶子里有空气吗？将其倾斜放人水中，观察有什么现象发生。\n将更多的物体放人水中，看一看哪些物体中有空气。说一说我们的理由空瓶子放入水中，产生了气泡粉笔放入水中，产生橡皮放入水中，表面了气泡有少量气泡", "discussion": "空气存在的证据我们看不到空气，用日期：\n哪些方法可以证明空气的存在？这些方法中哪些更有说\n1. 可在任何地方收集到空气。\n服力？为什么？\n2. 空瓶子放入水中，产生了气泡。\n空气和水有什么不同？\n3.", "expansion": "土壤中有空气吗？想办法做实验检验我们的猜测。", "frontier": "", "big_concept": "天气变化的根本动力来自太阳辐射能量在地表的非均匀分布。赤道与极地的温差驱动了大气环流与气压梯度力，促使冷暖空气对流、水汽相变凝结成云致雨。", "misconception": ""}, "figures": ["p02.webp", "p03.webp", "p04.webp"], "raw_text": "### [第 2 页]\n\n![第 2 页教学插图与实验活动](figures/p02.png)\n\n## 1. 感受空气\n\n\n感受空气开窗通风时，风会吹动窗帘，让我们感觉到空气流进了室内。\n\n#### 🎯 聚焦空气无色无味，我们如何学出找到空气存在的证据呢？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **重大气象工程（“风云”气象卫星与数值天气预报）**：我国新一代“风云四号”高轨气象卫星搭载多通道扫描辐射计与干涉式大气垂直探测仪，能在万米高空以秒级精度捕捉强对流云系演变，驱动超级计算机每秒百亿亿次流体力学方程解算！\n- 🧠 **跨学科大概念（能量与系统流动）**：天气变化的根本动力来自太阳辐射能量在地表的非均匀分布。赤道与极地的温差驱动了大气环流与气压梯度力，促使冷暖空气对流、水汽相变凝结成云致雨。\n- ⚠️ 常见认知误区：“空气没有重量、看不见摸不着所以不算物质”。**科学真相**：空气主要由氮气和氧气分子组成，1立方米空气在标准状态下质量约为1.29千克！不仅真实占据空间，并且产生的巨大大气压强支撑着地球生命与天气变化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g07_s1_u01_l01.html)\n\n\n### [第 3 页]\n\n![第 3 页教学插图与实验活动](figures/p03.png)\n\n#### 🔬 探索寻找空气存在的证据。\n用塑料袋装一袋空气，用手按一按，我们有什么发现？\n我们已经知道空气无色无味，它还有什么性质呢？\n空瓶子里有空气吗？将其倾斜放人水中，观察有什么现象发生。\n将更多的物体放人水中，看一看哪些物体中有空气。说一说我们的理由空瓶子放入水中，产生了气泡粉笔放入水中，产生橡皮放入水中，表面了气泡有少量气泡\n\n### [第 4 页]\n\n![第 4 页教学插图与实验活动](figures/p04.png)\n\n风就是快速流动的空气。通过被风吹动的物体寻找空气存在的证据。\n比较空气和水。\n拿两个塑料袋，一个装空气，一个装水，然后用压一压、掂一掂的方法比较空水空气气和水有什么相同和不同，空气有哪些性质？\n班级记录单\n\n#### 💬 研讨空气存在的证据我们看不到空气，用日期：\n哪些方法可以证明空气的存在？这些方法中哪些更有说\n1. 可在任何地方收集到空气。\n服力？为什么？\n2. 空瓶子放入水中，产生了气泡。\n空气和水有什么不同？\n3.\n\n#### 🚀 拓展土壤中有空气吗？想办法做实验检验我们的猜测。"}, {"id": "sci_07_u01_l02", "lesson_idx": 102, "book": "四年级上册", "vol_dir": "07_四年级上册", "unit_no": 1, "unit_title": "第一单元空气", "lesson_no": 2, "title": "空气能占据空间吗", "page": 5, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g07_s1_u01_l02.html", "code": "g07_s1_u01_l02", "sections": {"focus": "瓶口竖直向下压人水中时，水能够进入瓶内吗？\n为了方便观察瓶内水面的变化，可以", "exploration": "在瓶内放一个小球漂育科浮在水面上。\nES剪掉空塑料瓶的下半部分，将上半部分竖直压人水中，水会进入瓶子里吗？用这个实验来检验我们的推测。", "discussion": "瓶中水位的变化是怎样产生的？\n空气能占据空间吗？还有其他方法可以证明空气的这一性质吗？\n有", "expansion": "小挑战有半瓶水、一块橡皮泥和两根吸管。在不倾斜瓶子的情况下，我们能利用空气将水从瓶中挤出来吗？", "frontier": "", "big_concept": "天气变化的根本动力来自太阳辐射能量在地表的非均匀分布。赤道与极地的温差驱动了大气环流与气压梯度力，促使冷暖空气对流、水汽相变凝结成云致雨。", "misconception": ""}, "figures": ["p05.webp", "p06.webp", "p07.webp"], "raw_text": "### [第 5 页]\n\n![第 5 页教学插图与实验活动](figures/p05.png)\n\n## 2. 空气能占据空间吗\n\n\n空气能占据空间吗把空的塑料瓶倾斜压入水中，瓶口有气泡冒出，水会进入瓶内。\n\n#### 🎯 聚焦瓶口竖直向下压人水中时，水能够进入瓶内吗？\n为了方便观察瓶内水面的变化，可以\n\n#### 🔬 探索在瓶内放一个小球漂育科浮在水面上。\nES剪掉空塑料瓶的下半部分，将上半部分竖直压人水中，水会进入瓶子里吗？用这个实验来检验我们的推测。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **重大气象工程（“风云”气象卫星与数值天气预报）**：我国新一代“风云四号”高轨气象卫星搭载多通道扫描辐射计与干涉式大气垂直探测仪，能在万米高空以秒级精度捕捉强对流云系演变，驱动超级计算机每秒百亿亿次流体力学方程解算！\n- 🧠 **跨学科大概念（能量与系统流动）**：天气变化的根本动力来自太阳辐射能量在地表的非均匀分布。赤道与极地的温差驱动了大气环流与气压梯度力，促使冷暖空气对流、水汽相变凝结成云致雨。\n- ⚠️ 常见认知误区：“空气没有重量、看不见摸不着所以不算物质”。**科学真相**：空气主要由氮气和氧气分子组成，1立方米空气在标准状态下质量约为1.29千克！不仅真实占据空间，并且产生的巨大大气压强支撑着地球生命与天气变化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g07_s1_u01_l02.html)\n\n\n### [第 6 页]\n\n![第 6 页教学插图与实验活动](figures/p06.png)\n\n拧紧瓶盖，慢慢将塑料瓶的上半部分压入水中，观察小球的位置并记录。\n拧开瓶盖，把空气放出来，观察小球的位置有什么变化并记录。\n向瓶中注人空气，瓶中的水位会发生什么变化？观察现象并记录。\n教育开资料这里的“水位”指的是容器中水面距离容器底部的高度。无论装水的容器怎样倾斜，我们看到的水面在水静止不动时总是平直的。我们把这条平直线叫作“水平线”。\n\n### [第 7 页]\n\n![第 7 页教学插图与实验活动] 流动产生力量的例子，与风的利用有什么相同点？\n教育科学出\n\n#### 🚀 拓展自制空气炮取一个纸箱，在其中一个面上挖一个圆洞，用胶带将其他几个面和边缘处密封。在距纸箱1米远处叠放纸杯塔，将圆洞对准纸杯塔，双手用力拍打纸箱两侧，观察纸杯塔的状态。"}, {"id": "sci_07_u01_l06", "lesson_idx": 106, "book": "四年级上册", "vol_dir": "07_四年级上册", "unit_no": 1, "unit_title": "第一单元空气", "lesson_no": 6, "title": "我们来做“热气球”", "page": 17, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g07_s1_u01_l06.html", "code": "g07_s1_u01_l06", "sections": {"focus": "热气球是如何实现上升和下降的呢？", "exploration": "方科学长Es模拟制作热气球，探索其中的原因。\n准备一个较大的塑料袋、一个纸筒和一支蜡烛。", "discussion": "我们可以怎样解释热气球上升或下降的原因？怎样进一步检验我们的想法？\n怎样能让热气球在空中停留更长时间？", "expansion": "0. 安全提醒孔明灯存在火灾隐患。\n查阅资料，了解孔明灯，说一说当心火灾孔明灯能留在空中较长时间的原因。", "frontier": "", "big_concept": "天气变化的根本动力来自太阳辐射能量在地表的非均匀分布。赤道与极地的温差驱动了大气环流与气压梯度力，促使冷暖空气对流、水汽相变凝结成云致雨。", "misconception": ""}, "figures": ["p17.webp", "p18.webp", "p19.webp"], "raw_text": "### [第 17 页]\n\n![第 17 页教学插图与实验活动](figures/p17.png)\n\n## 6. 我们来做“热气球”\n\n\n我们来做“热气球人们可以乘坐热气球到高空欣赏祖国的大好河山，\n\n#### 🎯 聚焦热气球是如何实现上升和下降的呢？\n\n#### 🔬 探索方科学长Es模拟制作热气球，探索其中的原因。\n准备一个较大的塑料袋、一个纸筒和一支蜡烛。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **重大气象工程（“风云”气象卫星与数值天气预报）**：我国新一代“风云四号”高轨气象卫星搭载多通道扫描辐射计与干涉式大气垂直探测仪，能在万米高空以秒级精度捕捉强对流云系演变，驱动超级计算机每秒百亿亿次流体力学方程解算！\n- 🧠 **跨学科大概念（能量与系统流动）**：天气变化的根本动力来自太阳辐射能量在地表的非均匀分布。赤道与极地的温差驱动了大气环流与气压梯度力，促使冷暖空气对流、水汽相变凝结成云致雨。\n- ⚠️ 常见认知误区：“空气没有重量、看不见摸不着所以不算物质”。**科学真相**：空气主要由氮气和氧气分子组成，1立方米空气在标准状态下质量约为1.29千克！不仅真实占据空间，并且产生的巨大大气压强支撑着地球生命与天气变化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g07_s1_u01_l06.html)\n\n\n### [第 18 页]\n\n![第 18 页教学插图与实验活动](figures/p18.png)\n\n点燃蜡烛，用纸筒罩住蜡烛，再用塑料袋罩住纸筒，加热袋中的空气。\n为什么要用纸筒罩住蜡烛呢？\n用手扶着袋子的外壁，当感到袋子快要上升的时候，松开双手，观察并描述袋子状态的变化。\n\n#### 📝 记录单是什么原因让塑袋子的变化我们可以用料袋飞起来又降下日期：\n手摸一摸袋子去呢？\n有什么感觉？\n\n### [第 19 页]\n\n![第 19 页教学插图与实验活动](figures/p19.png)\n\n#### 💬 研讨我们可以怎样解释热气球上升或下降的原因？怎样进一步检验我们的想法？\n怎样能让热气球在空中停留更长时间？\n\n#### 🚀 拓展\n\n0. 安全提醒孔明灯存在火灾隐患。\n查阅资料，了解孔明灯，说一说当心火灾孔明灯能留在空中较长时间的原因。"}, {"id": "sci_07_u01_l07", "lesson_idx": 107, "book": "四年级上册", "vol_dir": "07_四年级上册", "unit_no": 1, "unit_title": "第一单元空气", "lesson_no": tle": "第一单元空气", "lesson_no": 8, "title": "自制打气筒", "page": 23, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g07_s1_u01_l08.html", "code": "g07_s1_u01_l08", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p23.webp", "p24.webp", "p25.webp", "p26.webp", "p27.webp", "p28.webp", "p29.webp"], "raw_text": "### [第 23 页]\n\n![第 23 页教学插图与实验活动](figures/p23.png)\n\n## 8. 自制打气筒\n\n\n自制打气筒很多庆典活动会用到大量气球，如果没有打气筒，靠人用嘴吹气球将是一件很辛苦的事明确任务用身边的材料制作一个简易的打气筒，能方便快捷地给气球充气。\n要把气球ES要用什么用气球和塑充满气还要解材料呢？\n料瓶试一试。\n决什么问题？\n挤压时松开手\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g07_s1_u01_l08.html)\n\n\n### [第 24 页]\n\n![第 24 页教学插图与实验活动](figures/p24.png)\n\n设计制作每完成一步，测试一准备好材料，尝试按下列流程制作。\n下打气效果。思考：下①在塑料瓶的瓶盖上打个小孔。\n步要解决什么问题？\n②剪一块长条形的气球皮。\n③用胶带将气球皮固定在瓶盖上，盖住小孔。\n④在瓶身上打一个小孔。\n5. 将气球套在瓶口处，挤压时，手指堵住瓶身上的小孔；松手时，手指从小孔上移开。\n气球皮要期紧！\n学出\n\n### [第 25 页]\n\n![第 25 页教学插图与实验活动](figures/p25.png)\n\n展示交流用图画表示自制打气筒给气球充气时空气流动的过程，与同学分享。\n\n#### 📝 记录单空气的流动过程日期：\n堵住打开挤压：\n空气进入气球空气进入瓶子闭紧松手：\n评估改进多次使用后，自制打气筒的瓶身容易有没有柔韧变形，打气效率降低。\n性更好一些的瓶ES使用自制打气子呢？\n筒的过程中，我们发现还有哪些需要改进的问题？\n试着提出几个解决方案。\n\n### [第 26 页]\n\n![第 26 页教学插图与实验活动](figures/p26.png)\n\n#### 📋 单元小结会流动占据的空间会变化空气能占据空间有质量空气很重要，动物、植物和人类都需要它。空气无色、无味。\n我们虽然看不到空气，但能通过设计各种实验，感受到它会流动、占据空间、有质量等性质，从而证明它的存在。\n我的收获怎样改进呢？\n评价内容评价等级我能利用观察到的现象说明空气的存在我知道空气能占据空间我能通过比较分析空气和水的不同我体会到了制作一个好用的打气筒需要不断改进和完善\n\n### [第 27 页]\n\n![第 27 页教学插图与实验活动](figures/p27.png)\n\n#### 📖 科学阅读降落伞与空气空气虽然看不到，但在我们生活的世界里，它和很多物质一样，有质量，有体积，是实实在在存在的。我们可以通过空气对其他物体产生的影响来观察和认识它，比如空气可以阻碍物体降落。降落伞就是利用空气的这一性质制成的。\nES2021年5月15日在经历296天太空之旅后，我国首次火各，是判是各一回，升落在火星北半球的乌托邦平原。在着陆过程中，降落伞发挥了重要作用。火星大气会阻挡降落伞下落，这样就起到了减速的作用。\n中国空间站的航天员在从太空返回地球时，也要利用降落伞减速才能成功着陆。因为火星的大气和地球不同，所以在火星上为航天器减速的降落伞和地球上的降落伞也有所不同。\n\n### [第 28 页]\n\n![第 28 页教学插图与实验活动](figures/p28.png)\n\n但是，在月球上让探测器降落减速的过程中，降落伞就起不到什么作用了。这是因为月球表面没有大气，无法产生空气阻力使探测器减速。因此月球探测器着陆不需要降落伞，而是通过发动机助推来实现。\n火星车与着陆平台除了航天器着陆过程中会用到降落伞外，很多喷气式战斗机在着陆时也会用到类似降落伞的减速伞，也是利用空气阻力让飞机快速减速的。\n子公版个战斗机着陆时打开减速伞\n\n### [第 29 页]\n\n![第 29 页教学插图与实验活动](figures/p29.png)\n\n第二单元呼吸与消化人的身体就像一部复杂而精妙的机器，需要动力才能完成各项生命活动。人体机器”的动力来自空气和食物。它们通过呼吸与消化帮助我们维持生命活动。人体哪些器官参与呼吸和消化？我们应该如何保护这些器官？"}, {"id": "sci_07_u02_l01", "lesson_idx": 109, "book": "四年级上册", "vol_dir": "07_四年级上册", "unit_no": 2, "unit_title": "第二单元呼吸与消化", "lesson_no": 1, "title": "我们的呼吸与消化", "page": 30, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g07_s1_u02_l01.html", "code": "g07_s1_u02_l01", "sections": {"focus": "深呼吸、吞咽..我们还有过哪些与呼吸和消化有关的生活体验？\n教育科义出", "exploration": "你经历过憋气、深呼吸吗？\n你体验过呼吸困难吗？说一说经历这些的时候，身体会有什么感受。", "discussion": "我们有过哪些跟呼吸与消化有关的生活体验？身体有什么不同的感受？\n我们想研究关于呼吸与消化的哪些问题？\n班级记录单想研究的关于呼吸与消化的问题日期：\n想研究的呼吸问题想研究的消化问题呼吸对人体有什么用？\n胃是怎样消化食物的？\n空气是怎样进入我们的人体器官怎样把食物变成身体的？\n大小便？\n教育种学出", "expansion": "学习并收集呼吸与消化的相关资料，为在学校或社区开展预防呼吸道和消化道疾病的科普活动做好准备。活动方式可以是制作宣讲手册或画册，也可以是创作绘本或展演科普剧。", "frontier": "", "big_concept": "人体是由神经系统、循环系统、运动系统协同组成的超高精度自适应控制系统。感受器感知刺激产生神经冲动，传入中枢神经系统决策，再由传出神经驱动效应器肌肉收缩产生反应动作。", "misconception": ""}, "figures": ["p30.webp", "p31.webp", "p32.webp"], "raw_text": "### [第 30 页]\n\n![第 30 页教学插图与实验活动](figures/p30.png)\n\n## 1. 我们的呼吸与消化\n\n\n我们的呼吸与消化我们每天都要进食，每时每刻都在呼吸。食物和空气帮助我们维持生命活动。\n\n#### 🎯 聚焦深呼吸、吞咽..我们还有过哪些与呼吸和消化有关的生活体验？\n教育科义出\n\n#### 🔬 探索你经历过憋气、深呼吸吗？\n你体验过呼吸困难吗？说一说经历这些的时候，身体会有什么感受。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿仿生医工（神经脑机接口与仿生眼）**：我国科学家在超高密度柔性微电极阵列脑机接口领域取得核心突破，通过解码运动皮层神经突触毫秒级电脉冲信号，使瘫痪患者能够意念控制外骨骼假肢灵巧抓握！\n- 🧠 **跨学科大概念（系统控制与反馈机制）**：人体是由神经系统、循环系统、运动系统协同组成的超高精度自适应控制系统。感受器感知刺激产生神经冲动，传入中枢神经系统决策，再由传出神经驱动效应器肌肉收缩产生反应动作。\n- ⚠️ 小学生常认为“我们是用眼睛看东西、用耳朵听声音”。**科学真相**：眼睛和耳朵仅仅是光学和声学信号转换器（将光子与声压振动转换为神经电脉冲）；真正进行图像重构、特征识别与意义解析的是大脑皮层的视觉中枢和听觉中枢！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g07_s1_u02_l01.html)\n\n\n### [第 31 页]\n\n![第 31 页教学插图与实验活动](figures/p31.png)\n\n关于食物消化，我们有哪些生活体验？和同学交流。\n肚子饿时，人会感觉没有力气，有时有时候吃得太候肚子会咕咕叫。\n多还会肚子胀。\n关于呼吸与消化，我们还知道什么？整理我们知道的相关知识。\n呼一吸算食物消化要一次呼吸经过胃和肠道食物消化吸收人用鼻子呼吸呼吸消化后产生的废物会被排出去\n\n### [第 32 页]\n\n![第 32 页教学插图与实验活动](figures/p32.png)\n\n#### 💬 研讨我们有过哪些跟呼吸与消化有关的生活体验？身体有什么不同的感受？\n我们想研究关于呼吸与消化的哪些问题？\n班级记录单想研究的关于呼吸与消化的问题日期：\n想研究的呼吸问题想研究的消化问题呼吸对人体有什么用？\n胃是怎样消化食物的？\n空气是怎样进入我们的人体器官怎样把食物变成身体的？\n大小便？\n教育种学出\n\n#### 🚀 拓展学习并收集呼吸与消化的相关资料，为在学校或社区开展预防呼吸道和消化道疾病的科普活动做好准备。活动方式可以是制作宣讲手册或画册，也可以是创作绘本或展演科普剧。"}, {"id": "sci_07_u02_l02", "lesson_idx": 110, "book": "四年级上册", "vol_dir": "07_四年级上册", "unit_no": 2, "unit_title": "第二单元呼吸与消化", "lesson_no": 2, "title": "认识呼吸器官", "page": 33, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g07_s1_u02_l02.html", "code": "g07_s1_u02_l02", "sections": {"focus": "我们身体里的哪些器官参与呼吸？呼吸是一个怎样的过程呢？", "exploration": "深吸一口气，再慢慢呼出。重复几次，充分体验呼吸的过程。\n与同伴分享自己的发现，猜测身体里有哪些器官参与呼吸。", "discussion": "空气从鼻腔进去之后到哪里去了？参与呼吸的器官有哪些？\n呼吸器官模型的各部分分别模拟人体中哪个呼吸器官？", "expansion": "呼吸是动物与外界进行气体交换以维持生命的重要活动。动物的呼吸器官有鳃、肺等。查阅资料，了解更多动物的呼吸器官。", "frontier": "", "big_concept": "人体是由神经系统、循环系统、运动系统协同组成的超高精度自适应控制系统。感受器感知刺激产生神经冲动，传入中枢神经系统决策，再由传出神经驱动效应器肌肉收缩产生反应动作。", "misconception": ""}, "figures": ["p33.webp", "p34.webp", "p35.webp"], "raw_text": "### [第 33 页]\n\n![第 33 页教学插图与实验活动](figures/p33.png)\n\n## 2. 认识呼吸器官\n\n\n认识呼吸器官我们已经知道鱼是用呼吸的，蚕是用气门呼吸的。\n\n#### 🎯 聚焦我们身体里的哪些器官参与呼吸？呼吸是一个怎样的过程呢？\n\n#### 🔬 探索深吸一口气，再慢慢呼出。重复几次，充分体验呼吸的过程。\n与同伴分享自己的发现，猜测身体里有哪些器官参与呼吸。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿仿生医工（神经脑机接口与仿生眼）**：我国科学家在超高密度柔性微电极阵列脑机接口领域取得核心突破，通过解码运动皮层神经突触毫秒级电脉冲信号，使瘫痪患者能够意念控制外骨骼假肢灵巧抓握！\n- 🧠 **跨学科大概念（系统控制与反馈机制）**：人体是由神经系统、循环系统、运动系统协同组成的超高精度自适应控制系统。感受器感知刺激产生神经冲动，传入中枢神经系统决策，再由传出神经驱动效应器肌肉收缩产生反应动作。\n- ⚠️ 小学生常认为“我们是用眼睛看东西、用耳朵听声音”。**科学真相**：眼睛和耳朵仅仅是光学和声学信号转换器（将光子与声压振动转换为神经电脉冲）；真正进行图像重构、特征识别与意义解析的是大脑皮层的视觉中枢和听觉中枢！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g07_s1_u02_l02.html)\n\n\n### [第 34 页]\n\n![第 34 页教学插图与实验活动](figures/p34.png)\n\n呼吸时 化日期：\n咀嚼次数一次五次十次现象用镜子观察自己的牙齿，门齿不同类型或者同学之间互相观察彼此的犬齿的牙齿分别有几颗？\n牙齿。\n白齿）观察、比较口腔中不同位置的牙齿，根据牙齿形状的不白齿同，给它们分类。\n犬齿门齿）讨论不同类型的牙齿分别在牙齿的排列分布图食物消化过程中起着什么作用。\n门齿白齿大齿牙齿剖面图查阅相关资料，了解牙齿、舌、唾液在食物消化过程中分别起到什么作用，并用模型或角色扮演的方式展示。\n“门齿”可以“犬齿”可“白齿”可切断饼干等食物。\n以撕裂食物。\n以研磨食物。\n白板、塑料袋代表牙齿\n\n### [第 44 页]\n\n![第 44 页教学插图与实验活动](figures/p44.png)\n\n#### 💬 研讨食物在口腔中发生了什么变化？经历了哪些过程？\n在食物消化过程中，牙齿、舌、唾液分别起什么作用？\n\n#### 🚀 拓展牙齿是我们身体重要的咀嚼器官，保护好牙齿对我们一生的健康很有意义。用正确的方式刷牙有利于保护牙齿。查阅资料，了解保护牙齿还应该注意什么。\n在预防消化道注意刷疾病科普材料中增牙时间不少加新内容。\n于3分钟。\n社外侧上牙：顺着牙缝向下刷咬合面：来回刷内侧：顺着牙缝下牙向上、上牙向下刷正确的刷牙方法"}, {"id": "sci_07_u02_l06", "lesson_idx": 114, "book": "四年级上册", "vol_dir": "07_四年级上册", "unit_no": 2, "unit_title": "第二单元呼吸与消化", "lesson_no": 6, "title": "胃和小肠里的消化", "page": 45, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g07_s1_u02_l06.html", "code": "g07_s1_u02_l06", "sections": {"focus": "胃和小肠是人体重要的消", "exploration": "根据自己的已有认识，在记录单中画出胃和小肠的位置及形状，并推测食物在里面会发生怎样的变化。", "discussion": "京科艺", "expansion": "在食物消化过程中，胃和小肠是怎样观察牛、鸡等分工合作的？\n动物胃和小肠的图胃和小肠的结构与它们在食物消化中片，思考这些动物的作用有什么联系？\n胃和小肠的形态特如果最初进入胃的食物不是小块且柔征与它们吃的食物软的，会给胃带来什么影响？这与口腔的有什么关系。\n工作有什么关系？", "frontier": "", "big_concept": "人体是由神经系统、循环系统、运动系统协同组成的超高精度自适应控制系统。感受器感知刺激产生神经冲动，传入中枢神经系统决策，再由传出神经驱动效应器肌肉收缩产生反应动作。", "misconception": ""}, "figures": ["p45.webp", "p46.webp", "p47.webp"], "raw_text": "### [第 45 页]\n\n![第 45 页教学插图与实验活动](figures/p45.png)\n\n## 6. 胃和小肠里的消化\n\n\n胃和小肠里的消化食物被口腔初步消化后，就会进入人体的胃和小肠等消化器官。\n\n#### 🎯 聚焦胃和小肠是人体重要的消\n\n#### 📝 记录单化器官。食物在胃和小肠里会发生怎样的变化？\n育科学出社胃和小肠\n\n#### 🔬 探索根据自己的已有认识，在记录单中画出胃和小肠的位置及形状，并推测食物在里面会发生怎样的变化。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿仿生医工（神经脑机接口与仿生眼）**：我国科学家在超高密度柔性微电极阵列脑机接口领域取得核心突破，通过解码运动皮层神经突触毫秒级电脉冲信号，使瘫痪患者能够意念控制外骨骼假肢灵巧抓握！\n- 🧠 **跨学科大概念（系统控制与反馈机制）**：人体是由神经系统、循环系统、运动系统协同组成的超高精度自适应控制系统。感受器感知刺激产生神经冲动，传入中枢神经系统决策，再由传出神经驱动效应器肌肉收缩产生反应动作。\n- ⚠️ 小学生常认为“我们是用眼睛看东西、用耳朵听声音”。**科学真相**：眼睛和耳朵仅仅是光学和声学信号转换器（将光子与声压振动转换为神经电脉冲）；真正进行图像重构、特征识别与意义解析的是大脑皮层的视觉中枢和听觉中枢！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g07_s1_u02_l06.html)\n\n\n### [第 46 页]\n\n![第 46 页教学插图与实验活动](figures/p46.png)\n\n模拟胃的工作。在一个塑料袋里装人水、一小块馒头和煮熟的蔬菜，反复揉挤这个袋子。里面的食物变成什么样子了？\n制作小肠模型。\n将一块长约50厘米、宽约6厘米、单面有绒毛的布料卷成细长的管状，固定好。\n将6块布料卷连接起来，弯曲成一个小肠模型。\n观察制作好的小肠模型，推测食物在小肠里会小肠模型发生什么变化。\n阅读资料，认识食物在胃和小肠里的消化。\n版礼胃的主要作用是暂时储存食物，通过胃端动和分泌胃液对食物进行消化，并将初步消化的食糜缓慢运输到小肠。\n胃小肠是食物消化与营养吸收的主要场所。人体的小肠长3～5米，有很多皱褶，能和食物充分接触，还可以分泌一些物质，起到消化食物和吸收营养的作用。\n小肠\n\n### [第 47 页]\n\n![第 47 页教学插图与实验活动](figures/p47.png)\n\n#### 📝 记录单食物在胃和小肠里的消化日期：\n器官我的学习与研究模拟胃的工作，我发现食物的变化：\n我推测胃的工作是为了：\n制作小肠模型，我发现小肠的特点：\n小肠我推测小肠的工作是为了：\n\n#### 💬 研讨京科艺\n\n#### 🚀 拓展在食物消化过程中，胃和小肠是怎样观察牛、鸡等分工合作的？\n动物胃和小肠的图胃和小肠的结构与它们在食物消化中片，思考这些动物的作用有什么联系？\n胃和小肠的形态特如果最初进入胃的食物不是小块且柔征与它们吃的食物软的，会给胃带来什么影响？这与口腔的有什么关系。\n工作有什么关系？"}, {"id": "sci_07_u02_l07", "lesson_idx": 115, "book": "四年级上册", "vol_dir": "07_四年级上册", "unit_no": 2, "unit_title": "第二单元呼吸与消化", "lesson_no": 7, "title": "食物在身体里的旅行", "page": 48, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g07_s1_u02_l07.html", "code": "g07_s1_u02_l07", "sections": {"focus": "食物在人的身体里经历了怎样的旅行路线？小肠之后还有什么消化器官？食物每到一个消化器官会发生怎样的变化？", "exploration": "#### 📝 记录单食物在人体里的旅行图根据我们的猜想，试着将日期：\n食物在人体里旅行时经过的消化器官画在人体轮廊图中。\n口腔和胃之间是由什么连接的？\n观察下图，与自己画的“食物在人体里的旅行图”比较，修正我们画的图，并将呼吸器官画在相应的位置。\n食管是连接口腔与胃的器官。\n教育科学出鹃社胃大肠小肠资料人体消化器官包括口腔、食管、胃、小肠和大肠等。\n人体消化系统示意图", "discussion": "食物在身体中的旅行要经过哪些器官？它们是如何合作完成食物消化的？\n②回顾本单元的学习内容，推测一下：食物的消化过程与呼吸有什么联系吗？\n山版个我们跳绳时，身体有哪些器官在参与这个活动？", "expansion": "调查一下，生活中有哪些与呼吸器官和消化器官有关的常见疾病？我们应该怎样预防？", "frontier": "", "big_concept": "生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。", "misconception": ""}, "figures": ["p48.webp", "p49.webp", "p50.webp"], "raw_text": "### [第 48 页]\n\n![第 48 页教学插图与实验活动](figures/p48.png)\n\n## 7. 食物在身体里的旅行\n\n\n食物在身体里的旅行食物进入人体，经消化器官消化和吸收营养后，给人体提供能量，然后人体将剩余的废物排出体外，就这样食物完成了一次旅行。\n教育科\n\n#### 🎯 聚焦食物在人的身体里经历了怎样的旅行路线？小肠之后还有什么消化器官？食物每到一个消化器官会发生怎样的变化？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿古生物学与生态基因库（国家基因库与恐龙羽毛演化）**：我国热河生物群带羽毛恐龙（如中华龙鸟）化石的发现，无可辩驳地确立了“现代鸟类是由兽脚类恐龙演化而来”的里程碑定论；高通量基因测序技术更重构了全球物种生命树与食物网脆弱度阈值。\n- 🧠 **跨学科大概念（尺度与比例 / 生态位）**：生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。\n- ⚠️ 很多同学误以为“凶猛的肉食动物消灭弱小食草动物对大自然有害”。**科学真相**：顶级捕食者能控制食草动物种群数量以防止过度啃食植被草原（营养级联效应），捕食体弱病体反而促进了种群基因库的健康优化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g07_s1_u02_l07.html)\n\n\n### [第 49 页]\n\n![第 49 页教学插图与实验活动](figures/p49.png)\n\n#### 🔬 探索\n\n#### 📝 记录单食物在人体里的旅行图根据我们的猜想，试着将日期：\n食物在人体里旅行时经过的消化器官画在人体轮廊图中。\n口腔和胃之间是由什么连接的？\n观察下图，与自己画的“食物在人体里的旅行图”比较，修正我们画的图，并将呼吸器官画在相应的位置。\n食管是连接口腔与胃的器官。\n教育科学出鹃社胃大肠小肠资料人体消化器官包括口腔、食管、胃、小肠和大肠等。\n人体消化系统示意图\n\n### [第 50 页]\n\n![第 50 页教学插图与实验活动](figures/p50.png)\n\n观察下图，思考气管与食管之间是什么关系。\n气管食管资料食管在气管的后面，都与口腔相连，它们的共同通道是咽。家长和老师时常提醒我们“吃饭时不要说话”就是为了避免食物误人气管。\n\n#### 💬 研讨食物在身体中的旅行要经过哪些器官？它们是如何合作完成食物消化的？\n②回顾本单元的学习内容，推测一下：食物的消化过程与呼吸有什么联系吗？\n山版个我们跳绳时，身体有哪些器官在参与这个活动？\n\n#### 🚀 拓展调查一下，生活中有哪些与呼吸器官和消化器官有关的常见疾病？我们应该怎样预防？"}, {"id": "sci_07_u02_l08", "lesson_idx": 116, "book": "四年级上册", "vol_dir": "07_四年级上册", "unit_no": 2, "unit_title": "第二单元呼吸与消化", "lesson_no": 8, "title": "呵护我们的器官", "page": 51, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g07_s1_u02_l08.html", "code": "g07_s1_u02_l08", "sections": {"focus": "我们应该如何呵护身体里的各种器官以保持身体健康呢？\n子弘版个", "exploration": "调查呼吸器官和消化器官的常见疾病。\n回顾一下，自己有过这些病症吗？\n调查、记录小组内同学曾经有过的这些病症。\n统计全班同学近几个月出现的病症类型及患病的人数和次数。", "discussion": "资料空气中的一些细菌、病毒呼吸道与消化道疾病对健康通过呼吸器官进人人体，引发疾病，如流感等。为有效预防呼吸道有什么影响？我们该如何预防这传染病，我们要增强体质，做好些疾病？\n个人防护，学会科学佩戴口罩，勤洗手，常通风。\n为了呵护身体的各种器官，我们还要注意饮食健康，养成我们要改掉哪些不良生活习惯？\n饭前便后勤洗手的习惯。如果我们吃了变质的、不洁净的食物，容易引发胃肠道疾病。", "expansion": "现在我们已经准备了充足的资料，与同伴合作开展一次预防呼吸道或消化道疾病的科普活动吧！\n珍爱生命，要杜立科·从良好的生活习惯做疑员科普宣讲健康吗", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p51.webp", "p52.webp", "p53.webp", "p54.webp", "p55.webp", "p56.webp", "p57.webp"], "raw_text": "### [第 51 页]\n\n![第 51 页教学插图与实验活动](figures/p51.png)\n\n## 8. 呵护我们的器官\n\n\n呵护我们的器官我们曾有过牙疼、鼻塞、咳嗽、腹泻的经历，这些跟呼吸器官和消化器官的健康紧密相关。\n\n#### 🎯 聚焦我们应该如何呵护身体里的各种器官以保持身体健康呢？\n子弘版个\n\n#### 🔬 探索调查呼吸器官和消化器官的常见疾病。\n回顾一下，自己有过这些病症吗？\n调查、记录小组内同学曾经有过的这些病症。\n统计全班同学近几个月出现的病症类型及患病的人数和次数。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g07_s1_u02_l08.html)\n\n\n### [第 52 页]\n\n![第 52 页教学插图与实验活动](figures/p52.png)\n\n提示表中可用计数的方法统计，没有\n\n#### 📝 记录单得过的计0次，偶尔有的计1次，经常有常见病症调查表的计2次。\n日期：\n病症姓名咳嗽肚子疼鼻塞或流涕牙疼小组总数资料\n2. 使用镜子、棉签等工具观察自己的鼻鼻腔是空气的“加工厂”，具有调节吸人腔，推测鼻腔在呼吸中的作用，思考鼻塞对的空气温度和湿度的功呼吸的影响。\n教育科能，密密的毛还可以减少尘埃等有害物质的吸人。鼻腔黏膜比较娇嫩，平时要注意保护，不随便挖鼻孔、不用力换鼻涕。\n\n### [第 53 页]\n\n![第 53 页教学插图与实验活动](figures/p53.png)\n\n根据调查与分析结果，讨论如何养成良好的生活习惯，保护呼吸器官与消化器官。\n\n#### 💬 研讨资料空气中的一些细菌、病毒呼吸道与消化道疾病对健康通过呼吸器官进人人体，引发疾病，如流感等。为有效预防呼吸道有什么影响？我们该如何预防这传染病，我们要增强体质，做好些疾病？\n个人防护，学会科学佩戴口罩，勤洗手，常通风。\n为了呵护身体的各种器官，我们还要注意饮食健康，养成我们要改掉哪些不良生活习惯？\n饭前便后勤洗手的习惯。如果我们吃了变质的、不洁净的食物，容易引发胃肠道疾病。\n\n#### 🚀 拓展现在我们已经准备了充足的资料，与同伴合作开展一次预防呼吸道或消化道疾病的科普活动吧！\n珍爱生命，要杜立科·从良好的生活习惯做疑员科普宣讲健康吗\n\n### [第 54 页]\n\n![第 54 页教学插图与实验活动](figures/p54.png)\n\n#### 📋 单元小结鼻腔气管肺呼吸器官消化器官牙齿口腔食管胃小肠大肠动物的生存需要能量，人体是吸收与转化能量的一部机器，而我们的呼吸器官与消化器官是这部机器的重要部件人体利用它们与外界进行气体与能量的交换，以维持我们的生命活动。\n我的收获怎样改进呢？\n评价内容评价等级我能描述参与呼吸与消化的器官我感受到用模型可以更好地认识呼吸器官与消化器官我知道要养成良好的生活习惯，保护呼吸器官与消化器官\n\n### [第 55 页]\n\n![第 55 页教学插图与实验活动](figures/p55.png)\n\n#### 📖 科学阅读相互协作的人体器官人体是一个系统。人的一切活动都要依靠各个器官的协同工作才能完成。\n人体各器官的结构和功能各不相同，它们在进行各种生命活动时，并不是孤立的，而是密切配合的。例如，当我们剧烈运动时，不但全身骨骼和肌肉的活动加强了，呼吸也加深加快了，可以吸人更多的氧气，呼出更多的二氧化碳；同时心跳加强加快，促进血液更快地循环，输送给骨骼、肌肉更多的养分和氧气，运走更多的废物。\n人体各器官的协调活动，充分体现出人体是一个统一的整体。\n人体部分器官的联系消化\n\n### [第 56 页]\n\n![第 56 页教学插图与实验活动](figures/p56.png)\n\n健康呼吸呼吸是维持生命的重要生理活动，它与健康息息相关，正确的呼吸方式有助于人的健康。\n我们通常用鼻子呼吸。如果长期用嘴呼吸不利于健康，比如会导致下巴后缩，引发面部发育不良等。平时，我们要经常进行深呼吸来改善肺部功能。在运动的过程中，深呼吸有助于调节氧气供应，预防出现氧气供应不足而导致的眩晕、恶心等症状。深呼吸还有助于调节情绪，比如缓解紧张。\n呼吸是人体与外界进行气体交换的生命活动。因此，我们要关注周围环境的空气质量，比如室内要经常通风；远离二手烟，防止因被动吸烟而伤害呼吸道；在呼吸道疾病高发的季节，去人群聚集的场所要戴口罩。\n\n### [第 57 页]\n\n![第 57 页教学插图与实验活动](figures/p57.png)\n\n第三单元声音我们的世界有各种各样的声音，风声、水声、雨声、雷声，狮吼、虎啸、鸟语、虫鸣，还有人类演奏出的美妙音乐声。声音是怎样产生的？它们为什么如此多样？我们是怎样听到声音的？声音有哪些奥秘呢？"}, {"id": "sci_07_u03_l01", "lesson_idx": 117, "book": "四年级上册", "vol_dir": "07_四年级上册", "unit_no": 3, "unit_title": "第三单元声音", "lesson_no": 1, "title": "声音是怎样产生的", "page": 58, "domain": "physics_sound", "domain_cn": "综合科学探究", "sim_file": "sim_g07_s1_u03_l01.html", "code": "g07_s1_u03_l01", "sections": {"focus": "声音是怎样产生的？", "exploration": "认谷种各维的声谐育听一听周围的声音，说一说它们是由什么物体发出的。\n观察发声物体。\n想办法让橡皮筋发出声音，观察发声前和发声时橡皮筋的状态有什么不同，并将我们看到的现象画出来。", "discussion": "声音都是由物体振动产生的。你同意这个观点吗？说一说理由出我们能找到一个不振动就能发声的物体吗？", "expansion": "查阅资料，了解蟋等动物发声时是否也伴随振动现象。\n它们身体的哪部分在振动呢？", "frontier": "", "big_concept": "声波是机械振动在弹性介质中传递的纵波。音调决定于振动频率（赫兹Hz），响度决定于振幅能量大小，音色则决定于基频与各次谐波傅里叶叠加的波形轮廓。", "misconception": ""}, "figures": ["p58.webp", "p59.webp", "p60.webp"], "raw_text": "### [第 58 页]\n\n![第 58 页教学插图与实验活动](figures/p58.png)\n\n## 1. 声音是怎样产生的\n\n\n声音是怎样产生的我们生活在充满声音的世界，我们自己也能制造出各种声音\n\n#### 🎯 聚焦声音是怎样产生的？\n\n#### 🔬 探索认谷种各维的声谐育听一听周围的声音，说一说它们是由什么物体发出的。\n观察发声物体。\n想办法让橡皮筋发出声音，观察发声前和发声时橡皮筋的状态有什么不同，并将我们看到的现象画出来。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **重大声学工程（超静音潜艇与医疗聚焦超声刀）**：高强度聚焦超声（HIFU）技术将超声波束穿透人体正常组织在肿瘤靶区聚焦形成高温凝固区，实现不开刀灭活癌细胞；超静音消声瓦与主动降噪技术则实现了声波相位抵消对抗。\n- 🧠 **跨学科大概念（振动与波动传播）**：声波是机械振动在弹性介质中传递的纵波。音调决定于振动频率（赫兹Hz），响度决定于振幅能量大小，音色则决定于基频与各次谐波傅里叶叠加的波形轮廓。\n- ⚠️ 学生直觉错误：“声音可以在真空中传播，就像光一样”。**科学真相**：光是电磁波可以在真空中飞奔；而声音是机械波，必须依赖物质分子（固体、液体或气体）作为振动传递的介质。月球上宇航员面对面说话也必须依赖无线电通信！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g07_s1_u03_l01.html)\n\n\n### [第 59 页]\n\n![第 59 页教学插图与实验活动](figures/p59.png)\n\n#### 📝 记录单橡皮筋的状态日期：\n发声前发声时让更多的物体发出声音。\n用不同的物体制造声音，观察这些物体发声时伴随什么现象。用手摸一摸这些发声的物体，我们有什么感觉？\n资料振动是物体往复教育科学出运动的状态。\n发声时摸一摸喉呢。\n\n### [第 60 页]\n\n![第 60 页教学插图与实验活动](figures/p60.png)\n\n#### 📝 记录单物体发声时伴随的现象日期：\n发声的物体使其发声的方法现象小鼓音叉喉呢让物体停止发声。\n想办法让正在发声的物体停止发声，说一说我们的做法。再观察物体的状态有什么变化。\n\n#### 💬 研讨声音都是由物体振动产生的。你同意这个观点吗？说一说理由出我们能找到一个不振动就能发声的物体吗？\n\n#### 🚀 拓展查阅资料，了解蟋等动物发声时是否也伴随振动现象。\n它们身体的哪部分在振动呢？"}, {"id": "sci_07_u03_l02", "lesson_idx": 118, "book": "四年级上册", "vol_dir": "07_四年级上册", "unit_no": 3, "unit_title": "第三单元声音", "lesson_no": 2, "title": "声音的强弱", "page": 61, "domain": "physics_sound", "domain_cn": "综合科学探究", "sim_file": "sim_g07_s1_u03_l02.html", "code": "g07_s1_u03_l02", "sections": {"focus": "音量就是声音的大小。我们平常所说的声音大小、轻重等都指的是声音的强弱。强弱不同的声音是怎样产生的？", "exploration": "试着让同一个物体发出强弱不同的声音。", "discussion": "声音强弱不同时，发声物体的振动有什么不同？\n我们怎样描述振动的幅度大小和声音强弱的关系？可以怎样解释自然界中各种不同强弱的声音呢？", "expansion": "生活中不同场所对声音强弱的需求不同。调查哪些场所需要", "frontier": "", "big_concept": "声波是机械振动在弹性介质中传递的纵波。音调决定于振动频率（赫兹Hz），响度决定于振幅能量大小，音色则决定于基频与各次谐波傅里叶叠加的波形轮廓。", "misconception": ""}, "figures": ["p61.webp", "p62.webp", "p63.webp"], "raw_text": "### [第 61 页]\n\n![第 61 页教学插图与实验活动](figures/p61.png)\n\n## 2. 声音的强弱\n\n\n声音的强弱电视声音小的时候，我们会调大音量数育\n\n#### 🎯 聚焦音量就是声音的大小。我们平常所说的声音大小、轻重等都指的是声音的强弱。强弱不同的声音是怎样产生的？\n\n#### 🔬 探索试着让同一个物体发出强弱不同的声音。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **重大声学工程（超静音潜艇与医疗聚焦超声刀）**：高强度聚焦超声（HIFU）技术将超声波束穿透人体正常组织在肿瘤靶区聚焦形成高温凝固区，实现不开刀灭活癌细胞；超静音消声瓦与主动降噪技术则实现了声波相位抵消对抗。\n- 🧠 **跨学科大概念（振动与波动传播）**：声波是机械振动在弹性介质中传递的纵波。音调决定于振动频率（赫兹Hz），响度决定于振幅能量大小，音色则决定于基频与各次谐波傅里叶叠加的波形轮廓。\n- ⚠️ 学生直觉错误：“声音可以在真空中传播，就像光一样”。**科学真相**：光是电磁波可以在真空中飞奔；而声音是机械波，必须依赖物质分子（固体、液体或气体）作为振动传递的介质。月球上宇航员面对面说话也必须依赖无线电通信！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g07_s1_u03_l02.html)\n\n\n### [第 62 页]\n\n![第 62 页教学插图与实验活动](figures/p62.png)\n\n探究声音的强弱变化。\n将钢尺一端压在桌面上，用不同的力度拨动它伸出桌面的另一端，观察钢尺的振动有什么不同。\n振动的幅度用不同大小的力击鼓面，观察鼓面的变化。\n提示可以在鼓面上放一些小而轻的物体，借助它们进行学用不同大小的力敲击音叉，想办法观察音叉的变化。\n\n### [第 63 页]\n\n![第 63 页教学插图与实验活动](figures/p63.png)\n\n用线吊一个小球，让小球刚好接触到音叉。\n\n#### 💬 研讨声音强弱不同时，发声物体的振动有什么不同？\n我们怎样描述振动的幅度大小和声音强弱的关系？可以怎样解释自然界中各种不同强弱的声音呢？\n\n#### 🚀 拓展生活中不同场所对声音强弱的需求不同。调查哪些场所需要"}, {"id": "sci_07_u03_l03", "lesson_idx": 119, "book": "四年级上册", "vol_dir": "07_四年级上册", "unit_no": 3, "unit_title": "第三单元声音", "lesson_no": 3, "title": "声音的高低", "page": 64, "domain": "physics_sound", "domain_cn": "综合科学探究", "sim_file": "sim_g07_s1_u03_l03.html", "code": "g07_s1_u03_l03", "sections": {"focus": "除了铝片琴外，其他物体和动物也会发出高低不同的声音。声音的高低究竞是怎样产生的？", "exploration": "敲击铝片琴。\n仔细听不同铝片发出的声音高低有什么不同，推测声音的高低与什么有关。\n怎样才能更清楚地看拨动钢尺。\n到尺子振动的快慢呢？\n把钢尺的一端压在桌面上，改变尺子伸出桌面的长度，拨动尺子使其发声。观察尺子发声高低和振动快慢，并将观察结果记录下来。\n振动快慢可", "discussion": "声音高低与什么有关？\n我们还在哪里听到过声音高低的变化？自然界中哪些动物或物体发出的声音较高，哪些较低？", "expansion": "故育在相同的试管中，装人不同量的水，敲击试管口，观察声音的高低有什么不同，思考声音的变化与水的多少有什么关系。", "frontier": "", "big_concept": "声波是机械振动在弹性介质中传递的纵波。音调决定于振动频率（赫兹Hz），响度决定于振幅能量大小，音色则决定于基频与各次谐波傅里叶叠加的波形轮廓。", "misconception": ""}, "figures": ["p64.webp", "p65.webp", "p66.webp"], "raw_text": "### [第 64 页]\n\n![第 64 页教学插图与实验活动](figures/p64.png)\n\n## 3. 声音的高低\n\n\n声音的高低声音除了有强弱的变化外，也有高低的变化。音乐课上，我们把声音的高低叫音调。敲击铝片琴，会产生高低不同的声音。\n\n#### 🎯 聚焦除了铝片琴外，其他物体和动物也会发出高低不同的声音。声音的高低究竞是怎样产生的？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **重大声学工程（超静音潜艇与医疗聚焦超声刀）**：高强度聚焦超声（HIFU）技术将超声波束穿透人体正常组织在肿瘤靶区聚焦形成高温凝固区，实现不开刀灭活癌细胞；超静音消声瓦与主动降噪技术则实现了声波相位抵消对抗。\n- 🧠 **跨学科大概念（振动与波动传播）**：声波是机械振动在弹性介质中传递的纵波。音调决定于振动频率（赫兹Hz），响度决定于振幅能量大小，音色则决定于基频与各次谐波傅里叶叠加的波形轮廓。\n- ⚠️ 学生直觉错误：“声音可以在真空中传播，就像光一样”。**科学真相**：光是电磁波可以在真空中飞奔；而声音是机械波，必须依赖物质分子（固体、液体或气体）作为振动传递的介质。月球上宇航员面对面说话也必须依赖无线电通信！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g07_s1_u03_l03.html)\n\n\n### [第 65 页]\n\n![第 65 页教学插图与实验活动](figures/p65.png)\n\n#### 🔬 探索敲击铝片琴。\n仔细听不同铝片发出的声音高低有什么不同，推测声音的高低与什么有关。\n怎样才能更清楚地看拨动钢尺。\n到尺子振动的快慢呢？\n把钢尺的一端压在桌面上，改变尺子伸出桌面的长度，拨动尺子使其发声。观察尺子发声高低和振动快慢，并将观察结果记录下来。\n振动快慢可\n\n#### 📝 记录单以分为快、较快、慢三级。\n钢尺声音的变化日期：\n伸出桌面的长度声音高低学出振动快慢较长中等较短我的发现：\n敲击金属管。\n敲击不同的金属管，观察不同金属管发声的规律。\n\n### [第 66 页]\n\n![第 66 页教学插图与实验活动](figures/p66.png)\n\n金属管可以是粗对比不同金属细不同，也可以是长管发出的声音，我短或材料不同。\n们有什么发现？\n粗细不同的金属管\n\n#### 💬 研讨声音高低与什么有关？\n我们还在哪里听到过声音高低的变化？自然界中哪些动物或物体发出的声音较高，哪些较低？\n\n#### 🚀 拓展故育在相同的试管中，装人不同量的水，敲击试管口，观察声音的高低有什么不同，思考声音的变化与水的多少有什么关系。"}, {"id": "sci_07_u03_l04", "lesson_idx": 120, "book": "四年级上册", "vol_dir": "07_四年级上册", "unit_no": 3, "unit_title": "第三单元声音", "lesson_no": 4, "title": "乐器的声音变化", "page": 67, "domain": "physics_sound", "domain_cn": "综合科学探究", "sim_file": "sim_g07_s1_u03_l04.html", "code": "g07_s1_u03_l04", "sections": {"focus": "乐器的声音变化是怎样实现的？", "exploration": "#### 📝 w_text": "### [第 70 页]\n\n![第 70 页教学插图与实验活动](figures/p70.png)\n\n## 5. 设计我们的乐器\n\n\n设计我们的乐器我们可以用身边的材料设计并制作一个既简单又能演奏的乐器！\n明确任务这段旋律有，利用身边的材料制作乐器并个音：1、23用其演奏一段旋律。\n闪闪亮晶晶，满天都是小星\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **重大声学工程（超静音潜艇与医疗聚焦超声刀）**：高强度聚焦超声（HIFU）技术将超声波束穿透人体正常组织在肿瘤靶区聚焦形成高温凝固区，实现不开刀灭活癌细胞；超静音消声瓦与主动降噪技术则实现了声波相位抵消对抗。\n- 🧠 **跨学科大概念（振动与波动传播）**：声波是机械振动在弹性介质中传递的纵波。音调决定于振动频率（赫兹Hz），响度决定于振幅能量大小，音色则决定于基频与各次谐波傅里叶叠加的波形轮廓。\n- ⚠️ 学生直觉错误：“声音可以在真空中传播，就像光一样”。**科学真相**：光是电磁波可以在真空中飞奔；而声音是机械波，必须依赖物质分子（固体、液体或气体）作为振动传递的介质。月球上宇航员面对面说话也必须依赖无线电通信！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g07_s1_u03_l05.html)\n\n\n### [第 71 页]\n\n![第 71 页教学插图与实验活动](figures/p71.png)\n\n怎样来评价我们的乐器做得怎么样呢？我们来商量一个标准。\n我们的乐器评价标准日期：________月X日评价等级评价内容合格良好优秀有1～3个音达到4个音达到5个音音的数量音调不准有1～2个音调不准音调准确音准情况外观结构做工粗糙做工一般做工精细设计方案乐器设计方案应包含的内容：\n将我们的方案以设计图的形乐器的发声方式。\n式呈现出来。\n音调变化的方式。\n制作乐器所需的材料。\n“我们的乐器”设计图\n\n#### 📝 记录单日期：____月____日我们的乐器”设计图①乐器的发声方式：拨动橡皮筋H日期：\n②音调变化的方式：改变橡皮筋的松紧程度。\n③制作乐器所需的材料：\n橡皮筋、纸盒。\n橡皮筋一纸盒\n\n### [第 72 页]\n\n![第 72 页教学插图与实验活动](figures/p72.png)\n\n实施计划选择材料把材料加工成将加工后的材料需要的样子进行组装和装饰选择材料需要考虑如何才能更有效地哪些因素？\n完成乐器制作？\n比较一下自己制作的乐器和购买的乐器之间有什么差别。\n育科"}, {"id": "sci_07_u03_l06", "lesson_idx": 122, "book": "四年级上册", "vol_dir": "07_四年级上册", "unit_no": 3, "unit_title": "第三单元声音", "lesson_no": 6, "title": "改进我们的乐器", "page": 73, "domain": "physics_sound", "domain_cn": "综合科学探究", "sim_file": "sim_g07_s1_u03_l06.html", "code": "g07_s1_u03_l06", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "声波是机械振动在弹性介质中传递的纵波。音调决定于振动频率（赫兹Hz），响度决定于振幅能量大小，音色则决定于基频与各次谐波傅里叶叠加的波形轮廓。", "misconception": ""}, "figures": ["p73.webp", "p74.webp", "p75.webp"], "raw_text": "### [第 73 页]\n\n![第 73 页教学插图与实验活动](figures/p73.png)\n\n## 6. 改进我们的乐器\n\n\n改进我们的乐器改进我们的乐器，让它可以演奏一段简单的旋律。\n测试与改进尝试用我们制作的乐器演奏一段简单的旋律，看能否达到任务要求，并查找乐器存在的问题。\n教出\n\n#### 📝 记录单测试我们的乐器日期：\n存在的问题可能的原因解决的方法\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **重大声学工程（超静音潜艇与医疗聚焦超声刀）**：高强度聚焦超声（HIFU）技术将超声波束穿透人体正常组织在肿瘤靶区聚焦形成高温凝固区，实现不开刀灭活癌细胞；超静音消声瓦与主动降噪技术则实现了声波相位抵消对抗。\n- 🧠 **跨学科大概念（振动与波动传播）**：声波是机械振动在弹性介质中传递的纵波。音调决定于振动频率（赫兹Hz），响度决定于振幅能量大小，音色则决定于基频与各次谐波傅里叶叠加的波形轮廓。\n- ⚠️ 学生直觉错误：“声音可以在真空中传播，就像光一样”。**科学真相**：光是电磁波可以在真空中飞奔；而声音是机械波，必须依赖物质分子（固体、液体或气体）作为振动传递的介质。月球上宇航员面对面说话也必须依赖无线电通信！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g07_s1_u03_l06.html)\n\n\n### [第 74 页]\n\n![第 74 页教学插图与实验活动](figures/p74.png)\n\n针对存在的问题，改进乐器，并再次进行测试，直到达到任务要求。\n展示评价利用自制乐器练习一小段旋律，然后开展一次班级演奏展示活动。评一评我们制作的乐器。\n我们的乐器评价表评价等级子出评价内容评价结果合格良好优秀外观结构做工粗糙做工一般做工精细音准情况音调不准有1～2个音调不准音调准确音的数量有1～3个音达到4个音达到5个音\n\n### [第 75 页]\n\n![第 75 页教学插图与实验活动](figures/p75.png)\n\n举办班级音乐会，用我们制作的各种乐器合奏一段旋律。"}, {"id": "sci_07_u03_l07", "lesson_idx": 123, "book": "四年级上册", "vol_dir": "07_四年级上册", "unit_no": 3, "unit_title": "第三单元声音", "lesson_no": 7, "title": "声音的传播", "page": 76, "domain": "physics_sound", "domain_cn": "综合科学探究", "sim_file": "sim_g07_s1_u03_l07.html", "code": "g07_s1_u03_l07", "sections": {"focus": "声音是怎样从一个地方传到另一个地方的？", "exploration": "把耳朵贴在桌子的一端，听一听其他同学在桌子另一端轻轻抓挠桌面的声音。这样听到的声音与耳朵不贴在桌面上有什么不同？记录听到的声音特点。", "discussion": "声音是怎样从一个地方传到另一个地方的？声音在传播的过程中借助了什么物质？在不同物质中的传播有什么不同？\n声音传播的方向是怎样的？我们是如何知道的？", "expansion": "自制一个简易土电话，试一试声音能否通过细线传播。改变土电话两端的位置高低、“电线”的松紧程度，比较一下，什么情况下声音的传播效果好？什么情况下声音的传播效果不好？\n育科", "frontier": "", "big_concept": "声波是机械振动在弹性介质中传递的纵波。音调决定于振动频率（赫兹Hz），响度决定于振幅能量大小，音色则决定于基频与各次谐波傅里叶叠加的波形轮廓。", "misconception": ""}, "figures": ["p76.webp", "p77.webp", "p78.webp"], "raw_text": "### [第 76 页]\n\n![第 76 页教学插图与实验活动](figures/p76.png)\n\n## 7. 声音的传播\n\n\n声音的传播鼓是一种乐器，种类多种多样。但无论是哪种鼓，只要我们敲击鼓面，鼓面就会振动，我们就听到了鼓声。\n\n#### 🎯 聚焦声音是怎样从一个地方传到另一个地方的？\n\n#### 🔬 探索把耳朵贴在桌子的一端，听一听其他同学在桌子另一端轻轻抓挠桌面的声音。这样听到的声音与耳朵不贴在桌面上有什么不同？记录听到的声音特点。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **重大声学工程（超静音潜艇与医疗聚焦超声刀）**：高强度聚焦超声（HIFU）技术将超声波束穿透人体正常组织在肿瘤靶区聚焦形成高温凝固区，实现不开刀灭活癌细胞；超静音消声瓦与主动降噪技术则实现了声波相位抵消对抗。\n- 🧠 **跨学科大概念（振动与波动传播）**：声波是机械振动在弹性介质中传递的纵波。音调决定于振动频率（赫兹Hz），响度决定于振幅能量大小，音色则决定于基频与各次谐波傅里叶叠加的波形轮廓。\n- ⚠️ 学生直觉错误：“声音可以在真空中传播，就像光一样”。**科学真相**：光是电磁波可以在真空中飞奔；而声音是机械波，必须依赖物质分子（固体、液体或气体）作为振动传递的介质。月球上宇航员面对面说话也必须依赖无线电通信！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g07_s1_u03_l07.html)\n\n\n### [第 77 页]\n\n![第 77 页教学插图与实验活动](figures/p77.png)\n\n用击打后的音叉轻轻触及水面，观察并记录水面的变化。再将音叉浸入水中，我们能听到音叉发出的声音吗？水是怎样传播声音的？\n慢慢抽出玻璃罩内的空气，闹钟的声音有什么变化？怎样解释这种现象？声音的传播与空气有关系吗？\n\n#### 📝 记录单教育出声音的传播日期：\n听到的声音传播声音的物质抓桌面的声音音叉在水中发出的声音阔钟的声音\n\n### [第 78 页]\n\n![第 78 页教学插图与实验活动](figures/p78.png)\n\n#### 💬 研讨声音是怎样从一个地方传到另一个地方的？声音在传播的过程中借助了什么物质？在不同物质中的传播有什么不同？\n声音传播的方向是怎样的？我们是如何知道的？\n\n#### 🚀 拓展自制一个简易土电话，试一试声音能否通过细线传播。改变土电话两端的位置高低、“电线”的松紧程度，比较一下，什么情况下声音的传播效果好？什么情况下声音的传播效果不好？\n育科"}, {"id": "sci_07_u03_l08", "lesson_idx": 124, "book": "四年级上册", "vol_dir": "07_四年级上册", "unit_no": 3, "unit_title": "第三单元声音", "lesson_no": 8, "title": "保护听力", "page": 79, "domain": "physics_sound", "domain_cn": "综合科学探究", "sim_file": "sim_g07_s1_u03_l08.html", "code": "g07_s1_u03_l08", "sections": {"focus": "生活中，我们应该怎样保护听力？\n资料", "exploration": "人耳的外耳道就像一个隧道，声音通过借助人耳结构示意图，观察耳朵的结这条隧道到达鼓膜。鼓构，推测各部位的功能并记录。\n膜很薄而且有弹性，即使是轻微的声音，都会使它产生振动。\n耳郭。\n耳蜗外耳道鼓膜人耳结构示意图", "discussion": "声音强弱与鼓膜振动有什么联系？声音过强会对鼓膜造成什么影响呢？\n为什么鼓膜穿孔会影响听力？\n我们应该怎样保护听力？", "expansion": "在公共场所要轻声说话。\n人长期处于大音量环境中，听力会受到伤害。音量大小的测量单位叫“分贝”，相应的测量仪器叫分贝仪。尝试用分贝仪测量我们说话时的音量。\n分贝仪", "frontier": "", "big_concept": "声波是机械振动在弹性介质中传递的纵波。音调决定于振动频率（赫兹Hz），响度决定于振幅能量大小，音色则决定于基频与各次谐波傅里叶叠加的波形轮廓。", "misconception": ""}, "figures": ["p79.webp", "p80.webp", "p81.webp", "p82.webp", "p83.webp", "p84.webp", "p85.webp", "p86.webp", "p87.webp"], "raw_text": "### [第 79 页]\n\n![第 79 页教学插图与实验活动](figures/p79.png)\n\n## 8. 保护听力\n\n\n保护听力射击运动员比赛时通常会戴耳罩，目的是保护运动员的听力。\n\n#### 🎯 聚焦生活中，我们应该怎样保护听力？\n资料\n\n#### 🔬 探索人耳的外耳道就像一个隧道，声音通过借助人耳结构示意图，观察耳朵的结这条隧道到达鼓膜。鼓构，推测各部位的功能并记录。\n膜很薄而且有弹性，即使是轻微的声音，都会使它产生振动。\n耳郭。\n耳蜗外耳道鼓膜人耳结构示意图\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **重大声学工程（超静音潜艇与医疗聚焦超声刀）**：高强度聚焦超声（HIFU）技术将超声波束穿透人体正常组织在肿瘤靶区聚焦形成高温凝固区，实现不开刀灭活癌细胞；超静音消声瓦与主动降噪技术则实现了声波相位抵消对抗。\n- 🧠 **跨学科大概念（振动与波动传播）**：声波是机械振动在弹性介质中传递的纵波。音调决定于振动频率（赫兹Hz），响度决定于振幅能量大小，音色则决定于基频与各次谐波傅里叶叠加的波形轮廓。\n- ⚠️ 学生直觉错误：“声音可以在真空中传播，就像光一样”。**科学真相**：光是电磁波可以在真空中飞奔；而声音是机械波，必须依赖物质分子（固体、液体或气体）作为振动传递的介质。月球上宇航员面对面说话也必须依赖无线电通信！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g07_s1_u03_l08.html)\n\n\n### [第 80 页]\n\n![第 80 页教学插图与实验活动](figures/p80.png)\n\n#### 📝 记录单人耳的结构和功能日期：\n人耳的结构特点功能耳郭外耳道鼓膜耳蜗鼓膜模拟实验。\n在杯口蒙一层气球皮，用橡皮筋固定并使气球皮绷紧，模拟鼓膜。在“鼓膜”上放少量细沙或碎纸屑，用音叉或其他能发声的物体，在离“鼓膜”远近相同的地方制造强弱不同的声音，观察“鼓膜”的变化。\n科出\n\n### [第 81 页]\n\n![第 81 页教学插图与实验活动](figures/p81.png)\n\n用针刺破“鼓膜”，模拟鼓膜穿孔，重复刚才的实验。\n\n#### 📝 记录单鼓膜模拟实验日期：\n模拟方法鼓膜振动情况轻敲音叉重敲音叉用针刺破“鼓膜”\n\n#### 💬 研讨声音强弱与鼓膜振动有什么联系？声音过强会对鼓膜造成什么影响呢？\n为什么鼓膜穿孔会影响听力？\n我们应该怎样保护听力？\n\n#### 🚀 拓展在公共场所要轻声说话。\n人长期处于大音量环境中，听力会受到伤害。音量大小的测量单位叫“分贝”，相应的测量仪器叫分贝仪。尝试用分贝仪测量我们说话时的音量。\n分贝仪\n\n### [第 82 页]\n\n![第 82 页教学插图与实验活动](figures/p82.png)\n\n#### 📋 单元小结声音的产生物体振动声音的声音特征高、低、强、弱方向：四面八方声音的传播传播物质：固体液体、气体事物之间的联系产生了事物的变化。物体的振动产生声音，声音也需要借助物体的振动来传播。振动的变化会引起声音的变化。振动幅度发生变化时、声音就会有强弱变化：振动快慢变化时，声音就会有高低变化。乐器就是根据声音变化的规律制成的。\n声音可以在固体、液体、气体中传播，因为它们都可以振动。\n我的收获怎样改进呢？\n评价内容评价等级我观察到物体发声时在振动我知道声音可以在固体、液体和气体中传播我知道物体振动不同时，发出声音的高、低、强、弱不同我和同学合作完成了小乐器的设计与制作\n\n### [第 83 页]\n\n![第 83 页教学插图与实验活动](figures/p83.png)\n\n#### 📖 科学阅读听不见的声音声音是靠物体振动产生的。振动快慢不同，产生的声音高低也不相同。振动越快，声音的音调就会越高；振动越慢，声音的音调就会越低。如果物体的振动超出一定的范围，就会产生一些人耳听不到的声音。\n这些听不到的声音是怎么回事呢？这和我们听到声音的方式有关系。人的耳朵之所以能听到声音，是因为物体的振动通过各种方式传到耳朵里，引起耳朵里的鼓膜振动，听小骨可将振动传达到内耳，并刺激听觉神经产生信号。大脑接收到信号后，我们就感受到了声音。当物体振动超过每秒20000次，或者低于每秒20. 次，都不能引起人类鼓膜的振动，人就听不到这个声音。但是，有些动物因为身体结构不同，能听到这些人耳不能听到的声音，比如海豚、蝙蝠、大象等。\n海豚\n\n### [第 84 页]\n\n![第 84 页教学插图与实验活动](figures/p84.png)\n\n科学家把每秒振动高于20000次的声音叫“超声波”，每秒振动低于20次的声音叫“次声波”。超声波方向比较集中，碰到物体容易被反射，而次声波传播距离比较远。超声波在医学诊断、工业勘探、清洗焊接等方面都有用武之地，次声波则可以帮助我们预测地质灾害或用于军事侦察等。人虽然听不到超声波和次声波，但是，一定强度的超声波和次声波会对人体产生一些影响，如使人头晕、恶心、呕吐、丧失平衡感，甚至内脏出血。\n教超声检查仪器学出生活中的声音变化用暖水瓶接开水时，我们经常根据声音的变化来判断水是不是快接满了，这样可以避免水溢出来。原来，随着水位的升高，暖水瓶中的空气在变少，空气的振动也在发生变化，声音就会从“沉闷”变得“明亮”。就像吹奏不同长度的排箫管时，发出的声音高低不同。\n\n### [第 85 页]\n\n![第 85 页教学插图与实验活动](figures/p85.png)\n\n海螺里的声音有人说，把捡到的海螺壳放到耳边，可以听到大海的声音，这是真的吗？如果有海螺，你可以试试看，确实会听到一些像海浪的声音。\n不过，这并非大海的声音。将手做成勺子形状，放在耳朵边，也能听到类似的声音。原来，海螺壳和勺子形状的手会放大周围空气流动的声音，就算是在很安静的房间里，空气也不是完全静止的，我们同样可以听到类似的声音。\n试一试还有哪些物品放在耳朵边也能让我们听到这样的声音。\n\n### [第 86 页]\n\n![第 86 页教学插图与实验活动](figures/p86.png)\n\n后记本套科学教科书由根据《义务教育科学课程标准（2022年版）》组织编写。编写团队由科研院所和高校的科学家、教育教学专家以及全国各地的优秀科学教师、教研员组成，周忠和院士与张红霞教授共同担任主编。\n编写过程中，我们得到了诸多科学家、教研员和一线教师的支持与帮助。\n李金华、张智慧、李博强、杨顺华、魏科、石承民、李实、张金海等为教科书编写提供了专业审查和咨询意见，高伟组织并参与编写了“制作天文望远镜”等单元。此外，还有很多单位、专家和同仁为我们提供了审读、插图、资料等方面的支持和帮助。他们的参与为确保教科书内容的科学性、适切性提供了重要支撑，在此一并表示诚挚谢意！\n我们真诚地欢迎广大师生和社会各界人士对教科书提出宝贵意见，帮助我们共同打造培根铸魂、启智增慧的精品教材。子出片反不土电子邮箱：science@esph.com.cn\n\n### [第 87 页]\n\n![第 87 页教学插图与实验活动](figures/p87.png)\n\n教育科学中。班级姓名学号"}, {"id": "sci_08_u01_l01", "lesson_idx": 125, "book": "四年级下册", "vol_dir": "08_四年级下册", "unit_no": 1, "unit_title": "第一单元植物的生长变化", "lesson_no": 1, "title": "种子里孕育着新生命", "page": 2, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g08_s2_u01_l01.html", "code": "g08_s2_u01_l01", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "植物的每一处器官形态均是自然选择的精妙杰作——扁平叶片最大化受光面积，维管束导管利用水分子毛细吸力将矿物质逆重力泵送百米树梢，根系向地性确保了机械固定与深层水源汲取。", "misconception": ""}, "figures": ["p02.webp", "p03.webp"], "raw_text": "### [第 2 页]\n\n![第 2 页教学插图与实验活动](figures/p02.png)\n\n## 1. 种子里孕育着新生命\n\n\n种子里孕育着新生命绿色开花植物几乎都是从种子开始新生命的。\n种子有什么特征呢？\n1. 收集各种植物的种综合运用感官并用比较的方法能观察到种子，观察并描述它们子更多的特征。\n的外部特征。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿生物工程（太空诱变育种与人工合成淀粉）**：中国空间站已成功开展水稻从种子到种子的全生命周期空间培养；中科院科研人员更在全球首次实现了从二氧化碳到淀粉的无细胞人工化学全合成，极大拓宽了光合作用的理论边界！\n- 🧠 **跨学科大概念（结构与功能相适应）**：植物的每一处器官形态均是自然选择的精妙杰作——扁平叶片最大化受光面积，维管束导管利用水分子毛细吸力将矿物质逆重力泵送百米树梢，根系向地性确保了机械固定与深层水源汲取。\n- ⚠️ 许多小学生认为“植物生长所需要的泥土全部被植物‘吃’进了肚子里”。**科学真相**：经典的凡·海尔蒙特柳树实验表明，植物增重的绝大部分干物质并非来自土壤，而是通过光合作用“抓取”空气中的二氧化碳分子同化而成的有机碳链！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g08_s2_u01_l01.html)\n\n\n### [第 3 页]\n\n![第 3 页教学插图与实验活动](figures/p03.png)\n\n2. 猜测种子的内部结构是怎样的，将我们的想法画下来。\n3. 取一粒干的蚕豆和用水浸泡一天的蚕豆，观察它们的外部形态和内部结构有什么不同。\n轻轻地剥去种皮，将“豆瓣”分开。\n\n#### 💡 科学词汇种子种皮胚胚根胚芽子叶将我们的观察结果记录下来。\n4. 观察更多植物种子的内部结构。\n1. 不同植物种子的外部形态有什么不同之处？\n2. 不同植物种子的内部结构有什么相同之处？\n3. 种子的哪一部分有可能发育成植物？\n寻找不同植物的种子，做一幅种子贴画。"}, {"id": "sci_08_u01_l02", "lesson_idx": 126, "book": "四年级下册", "vol_dir": "08_四年级下册", "unit_no": 1, "unit_title": "第一单元植物的生长变化", "lesson_no": 2, "title": "种植凤仙花", "page": 4, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g08_s2_u01_l02.html", "code": "g08_s2_u01_l02", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "植物的每一处器官形态均是自然选择的精妙杰作——扁平叶片最大化受光面积，维管束导管利用水分子毛细吸力将矿物质逆重力泵送百米树梢，根系向地性确保了机械固定与深层水源汲取。", "misconception": ""}, "figures": ["p04.webp", "p05.webp", "p06.webp"], "raw_text": "### [第 4 页]\n\n![第 4 页教学插图与实验活动](figures/p04.png)\n\n## 2. 种植凤仙花\n\n\n种植凤仙花我们种下一些种子，它们都能长成一株植物吗？种子萌发和植物生长需要什么条件？\n怎样做才能更好地记录植物一生的生长变化过程呢？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿生物工程（太空诱变育种与人工合成淀粉）**：中国空间站已成功开展水稻从种子到种子的全生命周期空间培养；中科院科研人员更在全球首次实现了从二氧化碳到淀粉的无细胞人工化学全合成，极大拓宽了光合作用的理论边界！\n- 🧠 **跨学科大概念（结构与功能相适应）**：植物的每一处器官形态均是自然选择的精妙杰作——扁平叶片最大化受光面积，维管束导管利用水分子毛细吸力将矿物质逆重力泵送百米树梢，根系向地性确保了机械固定与深层水源汲取。\n- ⚠️ 许多小学生认为“植物生长所需要的泥土全部被植物‘吃’进了肚子里”。**科学真相**：经典的凡·海尔蒙特柳树实验表明，植物增重的绝大部分干物质并非来自土壤，而是通过光合作用“抓取”空气中的二氧化碳分子同化而成的有机碳链！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g08_s2_u01_l02.html)\n\n\n### [第 5 页]\n\n![第 5 页教学插图与实验活动](figures/p05.png)\n\n1. 挑选饱满、没有受过伤的凤仙花种子，种到花盆或校园的花池中。\n1. 准备好花盆和土，先把一块小石头放在花盆的出水孔上，然后放入多半盆土。\n3. 往花盆中浇\n2. 用手指在土中按2～3个洞，深度约 1 厘米，一些水，直到每个洞里放一粒凤仙花种子，再用土盖住洞口。土壤湿润，然后将它放在温暖的地方。\n2. 想办法观察种子在土壤中会发生什么变化。\n做一个可以观察的种植杯吧！\n卫生纸土壤\n\n#### 💡 科学词汇透明杯播种种子萌发种子生长条件浇适量的水观察计划\n\n### [第 6 页]\n\n![第 6 页教学插图与实验活动](figures/p06.png)\n\n3. 小组讨论，共同做一个植物生长变化的观察计划。\n可以这样做！\n植物生长变化观察计划植物名称：\n栽培时间：年月—年月栽培地点：\n栽培方法：\n观察记录方法：填写记录表、写观察日记、拍照、画图、使用测量纸带……观察记录内容：\n凤仙花的生长变化记录表日期植株高度叶的数量它的样子我们的我们为植物（厘米）（片）新发现做的事情月日月日月日\n1. 为什么要选择饱满的、没有受过伤的种子播种？\n2. 需要提供什么条件，种子才能顺利萌发？我们的依据是什么？\n3. 怎样才能做好观察记录，了解植物一生的生长变化？\n选带芽眼的土豆块、红薯块或天竺葵的枝条种到花盆里，观察它们的生长变化。"}, {"id": "sci_08_u01_l03", "lesson_idx": 127, "book": "四年级下册", "vol_dir": "08_四年级下册", "unit_no": 1, "unit_title": "第一单元植物的生长变化", "lesson_no": 3, "title": "种子长出了根", "page": 7, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g08_s2_u01_l03.html", "code": "g08_s g)\n\n## 4. 茎和叶\n\n\n茎和叶破土而出的凤仙花，茎越长越高，叶也越来越多。茎和叶对植物生存分别有什么作用呢？\n1. 从小组成员栽培的凤仙花中选择生长状况最好的一株，观察它的形态特征。\n1. 测量凤仙花植株的高度。\n2. 数一数一株凤仙花上叶片的数量。\n3. 从不同角度观察凤仙花叶在茎上的分布情况。\n4. 画出凤仙花叶在茎上分布的样子。\n我看到的凤仙花\n\n#### 💡 科学词汇茎叶运输蒸腾从侧面看从上面看纵切横切\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿生物工程（太空诱变育种与人工合成淀粉）**：中国空间站已成功开展水稻从种子到种子的全生命周期空间培养；中科院科研人员更在全球首次实现了从二氧化碳到淀粉的无细胞人工化学全合成，极大拓宽了光合作用的理论边界！\n- 🧠 **跨学科大概念（结构与功能相适应）**：植物的每一处器官形态均是自然选择的精妙杰作——扁平叶片最大化受光面积，维管束导管利用水分子毛细吸力将矿物质逆重力泵送百米树梢，根系向地性确保了机械固定与深层水源汲取。\n- ⚠️ 许多小学生认为“植物生长所需要的泥土全部被植物‘吃’进了肚子里”。**科学真相**：经典的凡·海尔蒙特柳树实验表明，植物增重的绝大部分干物质并非来自土壤，而是通过光合作用“抓取”空气中的二氧化碳分子同化而成的有机碳链！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g08_s2_u01_l04.html)\n\n\n### [第 11 页]\n\n![第 11 页教学插图与实验活动](figures/p11.png)\n\n2. 推测茎和叶分别有什么作用。\n3. 想办法证明我们的想法是否正确。我们分组收集证据吧！\n茎的运输作用\n1. 取一段凤仙花的茎和装有红色水的杯子。\n2. 将凤仙花的茎放入杯中。\n3. 观察凤仙花茎的变化。\n再将凤仙花的茎观察凤仙花横切开，观察茎的茎有什么将凤仙花的茎纵的横切面。\n变化。切开，观察茎的纵切面。\n叶吸收阳光及蒸腾水分的作用\n1. 在凤仙花植株上选一片叶子，将这片叶子用黑色纸遮住，使它见不到阳光。3天后，观察被遮住光的这片叶子会发生什么现象。\n2. 选择一种叶片较大的植物，在叶子上套上一个干燥的塑料袋，观察塑料袋内壁上有什么变化。\n\n### [第 12 页]\n\n![第 12 页教学插图与实验活动](figures/p12.png)\n\n1. 植物的叶子平展且在茎上交叉生长有什么好处？\n2. 植物茎、叶对植物生存有什么作用？\n3. 根据植物根、茎、叶的特征，推测适合植物生活的环境。\n不同形态的叶收集更多奇特的茎和叶的图片，了解这些植物分别生活在什么样的环境中。\n仙人球香蕉水稻松树不同形态的茎西瓜矮牵牛向日葵土豆葡萄"}, {"id": "sci_08_u01_l05", "lesson_idx": 129, "book": "四年级下册", "vol_dir": "08_四年级下册", "unit_no": 1, "unit_title": "第一单元植物的生长变化", "lesson_no": 5, "title": "凤仙花开花了", "page": 13, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g08_s2_u01_l05.html", "code": "g08_s2_u01_l05", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "植物的每一处器官形态均是自然选择的精妙杰作——扁平叶片最大化受光面积，维管束导管利用水分子毛细吸力将矿物质逆重力泵送百米树梢，根系向地性确保了机械固定与深层水源汲取。", "misconception": ""}, "figures": ["p13.webp", "p14.webp"], "raw_text": "### [第 13 页]\n\n![第 13 页教学插图与实验活动](figures/p13.png)\n\n## 5. 凤仙花开花了\n\n\n凤仙花开花了现在凤仙花植株已经花满枝头了！凤仙花的花是什么样的？它经历了怎样的花开花谢过程呢？\n1. 观察花的结构。\n摘一朵盛开的凤仙花或其他植物的花，观察它是由哪几部分组成的。\n用镊子细心地从外到内将花的各部分撕下来，将它们分类排列在纸上。\n分类摆放更容易看出花的结构特点！\n花萼花瓣\n\n#### 💡 科学
