\n\n### [第 95 页]\n\n![第 95 页教学插图与实验活动](figures/p95.png)\n\n#### 📖 科学阅读为什么会“坐地日行八万里”“坐地日行八万里，巡天遥看一千河。”真的可以做到吗？\n我们已经知道地球自转一周需要24个小时，地球赤道周长约为40000千米，也就是说，如果你在地球的赤道上，一天就可以运动约80000里。所以可以“坐地日行八万里”。\n有人可能表示反对，如果人们不是在赤道上，那么一天就不能够运动八万里了吗？是的，离赤道越远，运动的距离越短，如果坐在北极点或南极点上，则运动的距离为零。\n其实，地球除了自转外，还在不停地围绕太阳公转，速度是每秒30千米。算一算，地球一天在公转轨道上前进了多少千米？\n地球除了自转和公转外，还被太阳带领着围绕银河系的中心高速运动，速度约为每秒220千米。再计算一下，以这个速度地球一天绕银河系中心又前进了多少千米？\n以这么快的速度转动，为什么我们没有感觉呢？因为地球就像一艘开得十分平稳的大船，宇宙空间又没有大风大浪，我们就像小蚂蚁住在船舱里一样，所以就没有什么感觉。\n地求公转通度鑫药30千米/秒太阳公转速度约220千米/秒地球赤道处的自转速度约466米/秒\n\n### [第 96 页]\n\n![第 96 页教学插图与实验活动](figures/p96.png)\n\n北极星是静止不动的吗北极星其实是一颗不太亮的星星，它是小熊座的一颗恒星，天文学家也称它为小熊座a（读音：阿尔法）星。由于它总在北方天空，位于地球自转轴北极所指的延长线上，人们都习惯用它来辨识方向，所以称它为北极星。\n北极星永远都不动吗？或者说地球自转轴北端始终都指向它吗？\n其实，在约5000年前（即大约公元前3000年），北极星是现在的北极星现在的北天极指天龙座的一颗星，处于地轴北仙王座极所指的方向。由于地球的地轴右枢倾斜方向会缓慢地发生变化，因公元前此，地轴所指向的北极方向也会公元7000年3000. 年天龙座发生变化。现在我们看到的北极北黄极星，它接替了天龙座的那颗星。\n天津四即使现在，北极星也与地轴北极公元14000年所指位置有一点差异，但我们的天座肉眼很难发现这个差异带来的变织女星化，所以看起来北极星的位置没有发生改变。\n如果你能活到公元7000年，你会明显地看到北极星的位置变了，因为那时候，北极星的“位置”又将交给另一颗星了。\n出\n\n### [第 97 页]\n\n![第 97 页教学插图与实验活动](figures/p97.png)\n\n离上课还有多长时间？看一下钟第四单元表不就知道了！可要是没有钟表呢？想象一下，如果有一天全世界的钟表都坏计量时间了，世界会变成什么样？人类曾经经历过一段没有钟表的时期。那么，人类是怎样逐步认识时间的？后来又是怎样发明了计量时间的钟表呢？\n精确地计量时间很重要，它能够使我们的生活有条不。然而，人类的好奇心远不止于自身和当下，为了更好地认识自然界的变化和发展规律，我们还需要了解亿万年前的生物，了解百万年前的祖先。那么，科学家们又是怎样找到这么久远的计时工具的呢？"}, {"id": "sci_11_u04_l01", "lesson_idx": 226, "book": "六年级上册", "vol_dir": "11_六年级上册", "unit_no": 4, "unit_title": "第四单元计量时间", "lesson_no": 1, "title": "时间在流逝", "page": 98, "domain": "general_science", "domain_cn": "综合科学探究", "sim_file": "sim_g11_s1_u04_l01.html", "code": "g11_s1_u04_l01", "sections": {"focus": "道几点了或过了多长时间。\n在古代，人们并没有我们今天使用的钟表，他们是怎样安排生活和劳作的呢？", "exploration": "在没有计时工具的情况下，哪些自然现象可以帮助人们判断时间？\n太阳高悬头顶，是一天中的正午当太阳升起时，教太阳落山后，夜幕天就开始了降临了杜资料在远古时代，人类依靠太阳计时。日出而作，日夜空中，有明月照落而息，昼夜交亮大地替自然面然成了人们使用的时间单位——日。", "discussion": "古人曾用过哪些方法计时？这些方法有什么优缺点？\n燃香的上段与下段在燃烧时间上相同吗？这会带来什么问题？\n学出③时间流逝有什么特点？", "expansion": "与燃香一样，蜡烛也可以用来计时。蜡烛计时有什么缺点？什么方法可以使蜡烛燃烧得更稳定呢？", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p98.webp", "p99.webp", "p100.webp", "p101.webp"], "raw_text": "### [第 98 页]\n\n![第 98 页教学插图与实验活动](figures/p98.png)\n\n## 1. 时间在流逝\n\n\n时间在流逝科学出社当我们吃饭、睡觉、学习、运动的时候，时间在一分一秒地流逝。我们只需看一眼钟表就知\n\n#### 🎯 聚焦道几点了或过了多长时间。\n在古代，人们并没有我们今天使用的钟表，他们是怎样安排生活和劳作的呢？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g11_s1_u04_l01.html)\n\n\n### [第 99 页]\n\n![第 99 页教学插图与实验活动](figures/p99.png)\n\n#### 🔬 探索在没有计时工具的情况下，哪些自然现象可以帮助人们判断时间？\n太阳高悬头顶，是一天中的正午当太阳升起时，教太阳落山后，夜幕天就开始了降临了杜资料在远古时代，人类依靠太阳计时。日出而作，日夜空中，有明月照落而息，昼夜交亮大地替自然面然成了人们使用的时间单位——日。\n\n### [第 100 页]\n\n![第 100 页教学插图与实验活动](figures/p100.png)\n\n搜集、阅读资料，交流古人利用太阳进行计时的方法和实例。\n东汉铜圭表北京故宫的日暑资料日暑是利用一天中日影方向有规律的变化来划分并测定时刻的工具，根据两个时刻之间的间隔，可以计算出时间长度。主表是根据日影的长短测定节气和一年时间长短的仪器。\n教育种子出古人曾用燃香来帮助计时，我们也来观察研究“一灶香”的时间。\n取一支约20厘米长的细香，分为十等份并做标记。\n燃香并记录香燃烧到十分之一、十分之二、十分之三处的时刻，推测燃烧完一烂香所需的时间。\n\n### [第 101 页]\n\n![第 101 页教学插图与实验活动](figures/p101.png)\n\n#### 📝 记录单\n\n“一烂香”的时间日期：\n燃香长度所需时间/秒十分之一十分之二十分之三推测“一姓香”的时间：\n1. 感受一分钟有多长，用词语来描述我们对这一分钟的主观感受。与同学交流，说一说一分钟能做些什么。\n\n#### 💬 研讨古人曾用过哪些方法计时？这些方法有什么优缺点？\n燃香的上段与下段在燃烧时间上相同吗？这会带来什么问题？\n学出③时间流逝有什么特点？\n\n#### 🚀 拓展与燃香一样，蜡烛也可以用来计时。蜡烛计时有什么缺点？什么方法可以使蜡烛燃烧得更稳定呢？"}, {"id": "sci_11_u04_l02", "lesson_idx": 227, "book": "六年级上册", "vol_dir": "11_六年级上册", "unit_no": 4, "unit_title": "第四单元计量时间", "lesson_no": 2, "title": "用水计量时间", "page": 102, "domain": "chemistry", "domain_cn": "物质变化与化学", "sim_file": "sim_g11_s1_u04_l02.html", "code": "g11_s1_u04_l02", "sections": {"focus": "古人是怎样设计水钟的呢？\n元代铜壶滴漏", "exploration": "0. 安全提醒使用剪刀、扎孔器时请注意安全。\n观察水流速度。\n取一个透明塑料瓶，将其底部去掉，倒过来盛水，在瓶盖上扎一个直径约2毫米的小孔，让水可以从小孔中缓缓流出。仔细观察水流速度是否保持均匀。\n测量水流速度。\n往刚才的瓶中倒人200毫升水，让水从瓶盖的小孔中流出，用烧杯接住流出的水。测量烧杯内的水积聚到50毫升用了多长时间。\n预测一下、当烧杯中的水积聚到100毫升、150毫升时、分别需要多长时间然后进行实际测量并记录观测结果。", "discussion": "塑料瓶中水流出的速度是均匀的吗？用流水可以帮助我们计时吗？\n怎样能让水匀速地往下流？\n用四层铜壶滴漏与用一个四倍大的铜壶滴漏来计时，哪个更准确？\n育科学", "expansion": "医生给病人输液的时候，药液滴下的速度是匀速的，这是怎样做到的？", "frontier": "", "big_concept": "无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！", "misconception": ""}, "figures": ["p102.webp", "p103.webp", "p104.webp", "p105.webp"], "raw_text": "### [第 102 页]\n\n![第 102 页教学插图与实验活动](figures/p102.png)\n\n## 2. 用水计量时间\n\n\n用水计量时间我们已经知道日影、燃香、蜡烛可用来计时。\n除此之外，人们还发明了用水计时的方法。用水计时的工具叫作水钟。\n\n#### 🎯 聚焦古人是怎样设计水钟的呢？\n元代铜壶滴漏\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿化学与材料科学（高性能碳纤维与海水淡化反渗透膜）**：我国自主研发的T1000级超高强度碳纤维被称为‘新材料之王’，比铝还轻但强度比钢高数倍；先进聚酰胺反渗透膜孔径仅0.1纳米，高压迫使水分子穿透而将水合盐离子拦截，实现苦咸海水向纯净饮用水的瞬间转化！\n- 🧠 **跨学科大概念（物质形态与质量守恒定律）**：无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！\n- ⚠️ 常见前概念误区：“水蒸发或者蜡烛烧完了，物质就彻底消失了”。**科学真相**：物质绝不会凭空消失！蒸发的水分子逸散到了广袤的大气中形成看不见的水汽；蜡烛燃烧生成的二氧化碳气体和水蒸气扩散到了空气中，封闭体系称重会发现总质量分毫不差！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g11_s1_u04_l02.html)\n\n\n### [第 103 页]\n\n![第 103 页教学插图与实验活动](figures/p103.png)\n\n#### 🔬 探索\n\n0. 安全提醒使用剪刀、扎孔器时请注意安全。\n观察水流速度。\n取一个透明塑料瓶，将其底部去掉，倒过来盛水，在瓶盖上扎一个直径约2毫米的小孔，让水可以从小孔中缓缓流出。仔细观察水流速度是否保持均匀。\n测量水流速度。\n往刚才的瓶中倒人200毫升水，让水从瓶盖的小孔中流出，用烧杯接住流出的水。测量烧杯内的水积聚到50毫升用了多长时间。\n预测一下、当烧杯中的水积聚到100毫升、150毫升时、分别需要多长时间然后进行实际测量并记录观测结果。\n\n### [第 104 页]\n\n![第 104 页教学插图与实验活动](figures/p104.png)\n\n#### 📝 记录单测量水流速度日期：\n需要的时间/秒烧杯内的水量推测时间实际时间50. 毫升100. 毫升150. 毫升思考怎样才能让每次流把流出的水可以在瓶口出50毫升水量的用时相同。\n倒回去重流。\n流水时不断从上将烧杯内的水全部重面加水。\n新倒回瓶子中，让水从小孔中流出，用烧杯接住从瓶中流出的水，测量烧杯内的水再次积聚到50毫升用了多长时间。\n重复多次实验，观察测量结果是否相同。\n弹簧止水夹为了控制水流的断和开，可夹上或取下止水夹。\n\n### [第 105 页]\n\n![第 105 页教学插图与实验活动](figures/p105.png)\n\n#### 📝 记录单测量水流速度日期：\n需要的时间/秒烧杯内的水量第一次第二次第三次50. 毫升观察古代的水钟，思考古人设计四层铜壶滴漏来计时的原因。\n\n#### 💬 研讨塑料瓶中水流出的速度是均匀的吗？用流水可以帮助我们计时吗？\n怎样能让水匀速地往下流？\n用四层铜壶滴漏与用一个四倍大的铜壶滴漏来计时，哪个更准确？\n育科学\n\n#### 🚀 拓展医生给病人输液的时候，药液滴下的速度是匀速的，这是怎样做到的？"}, {"id": "sci_11_u04_l03", "lesson_idx": 228, "book": "六年级上册", "vol_dir": "11_六年级上册", "unit_no": 4 ，将其放人水中，也可出以用来计时。（观察小孔沉水碗的结构。思考它是如何设计的，以及这种设计应用了哪些科学知识。\n小孔沉水碗小孔沉水碗计时装置"}, {"id": "sci_11_u04_l04", "lesson_idx": 229, "book": "六年级上册", "vol_dir": "11_六年级上册", "unit_no": 4, "unit_title": "第四单元计量时间", "lesson_no": 4, "title": "改进水钟", "page": 110, "domain": "chemistry", "domain_cn": "物质变化与化学", "sim_file": "sim_g11_s1_u04_l04.html", "code": "g11_s1_u04_l04", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "除了水，还可以用哪些能流动的物体来制作计时工具？\n学生作品6沙漏", "frontier": "", "big_concept": "无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！", "misconception": ""}, "figures": ["p110.webp", "p111.webp", "p112.webp", "p113.webp"], "raw_text": "### [第 110 页]\n\n![第 110 页教学插图与实验活动](figures/p110.png)\n\n## 4. 改进水钟\n\n\n改进水钟进水口→古人使用的这种改进后的水钟可以使水滴匀速滴漏，计时准确且读数方便。\n评估与改进古代水钟原理示意图观察古代水钟原理示意图，思考它是怎样使水滴匀速滴漏的，又是怎样做到方便读数的。我们可以从中获得哪些启发？\n2. 展示我们制作的水钟并交流测试使用效果。\n我们的水钟不足之处是需要向泄水杯我们的水钟主中不断加水，且受水要优点是材料简单、杯上的刻度过密，读制作方便。\n数不方便。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿化学与材料科学（高性能碳纤维与海水淡化反渗透膜）**：我国自主研发的T1000级超高强度碳纤维被称为‘新材料之王’，比铝还轻但强度比钢高数倍；先进聚酰胺反渗透膜孔径仅0.1纳米，高压迫使水分子穿透而将水合盐离子拦截，实现苦咸海水向纯净饮用水的瞬间转化！\n- 🧠 **跨学科大概念（物质形态与质量守恒定律）**：无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！\n- ⚠️ 常见前概念误区：“水蒸发或者蜡烛烧完了，物质就彻底消失了”。**科学真相**：物质绝不会凭空消失！蒸发的水分子逸散到了广袤的大气中形成看不见的水汽；蜡烛燃烧生成的二氧化碳气体和水蒸气扩散到了空气中，封闭体系称重会发现总质量分毫不差！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g11_s1_u04_l04.html)\n\n\n### [第 111 页]\n\n![第 111 页教学插图与实验活动](figures/p111.png)\n\n我们小组泄水对于存在的杯的水位高度经常问题我们将做以变化，导致流速不下改进...均匀，受水杯中刻度不均匀。\n明确存在的问题，梳理改进措施。\n根据交流评估的情况，明确主要的问题并提出改进意见。\n水钟修改方案日期：\n1. 将第一级泄水杯容量变大，可保证有足够的水量能满足测试10. 分钟的要。\n2. 将第一级泄水杯的出水孔孔径变大，可使水流速度大于第二级泄水杯中的流速，并在第二级泄水杯侧面加一个溢水孔，让多余的水能够流出，保持杯中水位不变。\n3. 用细长的直筒型容器作为受水杯，这样可做到刻度均匀。\n4. 第二级泄水孔孔径不能太小，水流速度要适当。增加刻度之间的距离，方便读数。\n5. 时间刻度标好后，用透明胶带贴住刻度防水，保证字迹清晰、不模糊。\n\n### [第 112 页]\n\n![第 112 页教学插图与实验活动](figures/p112.png)\n\n改进设计，完善作品。\n上面瓶盖孔径加宽到4毫米溢水口。\n水位转不变导管开始滴水保特水位不变孔径2毫米孔径小，滴滴下学生作品1学生作品2教育科学出一社学生作品4学生作品5\n\n### [第 113 页]\n\n![第 113 页教学插图与实验活动](figures/p113.png)\n\n能否用浮标来指示刻度？\n分钟交流哪一组的水钟计时比较准确且计时时间长？它是如何设计的？这种设计有什么优点？\n学生作品3\n\n#### 🚀 拓展除了水，还可以用哪些能流动的物体来制作计时工具？\n学生作品6沙漏"}, {"id": "sci_11_u04_l05", "lesson_idx": 230, "book": "六年级上册", "vol_dir": "11_六年级上册", "unit_no": 4, "unit_title": "第四单元计量时间", "lesson_no": 5, "title": "机械摆钟", "page": 114, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g11_s1_u04_l05.html", "code": "g11_s1_u04_l05", "sections": {"focus": "#### 🔬 探索摆幅观察钟摆的运动。\n摆绳测量并记录钟摆1分钟摆动的次数。\n摆锤摆动一次", "exploration": "摆幅观察钟摆的运动。\n摆绳测量并记录钟摆1分钟摆动的次数。\n摆锤摆动一次", "discussion": "同一个摆在相同时间内摆动次数相同吗？\n通过观察，摆还有什么运动特点？摆的快慢与摆幅有关系吗？\n比较每个小组的数据，不同摆的摆动快慢一样吗？如果不同，主要原因是什么？", "expansion": "观察生活中的各种“摆”们摆动的快慢相同吗？\n节拍器秋千", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p114.webp", "p115.webp", "p116.webp", "p117.webp"], "raw_text": "### [第 114 页]\n\n![第 114 页教学插图与实验活动](figures/p114.png)\n\n## 5. 机械摆钟\n\n\n机械摆钟日暑、水钟、沙漏等简易的计时工具，可以让我们知道大概的时间，但随着人类社会的发展，人们需要更精确的计时工具。机械摆钟的出现大大提高了计时的精确度，日募等计时工具逐渐被替代。\n\n#### 🎯 聚焦\n\n#### 🔬 探索摆幅观察钟摆的运动。\n摆绳测量并记录钟摆1分钟摆动的次数。\n摆锤摆动一次\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g11_s1_u04_l05.html)\n\n\n### [第 115 页]\n\n![第 115 页教学插图与实验活动](figures/p115.png)\n\n重复测量钟摆1分钟摆动的次数并记录。\n\n#### 📝 记录单钟摆1分钟摆动的次数日期：\n实验次数第一次第二次第三次摆动次数根据测量结果，思考钟摆运动的特点。\n自制一个摆，观察摆运动的特点。\n拿一根细绳，上端固定，下端挂重物，做成一个简单的摆。\n·让摆自由摆动（摆幅不要太大），测量并记录它1分钟摆动的次数。\n·重复多次，测量并记录摆1分钟摆动的次数。\n①组装铁架台教育科出②用细绳系好重物③调整高度\n\n### [第 116 页]\n\n![第 116 页教学插图与实验活动](figures/p116.png)\n\n④使摆自由摆动，测量并记录\n\n#### 📝 记录单自制摆1分钟摆动的次数日期：\n实验次数第一次第二次第三次摆动次数观测在相同时间内摆的摆动次数是否相同。\n摆在自由摆动过程中，摆幅会慢慢变小，那么摆的快慢是否也在变化？\n在自制摆连续摆动过程中，观测并记录摆10秒钟摆动的次数。\n摆动速度摆的方测量结果可变侵了吧？\n摆动的幅能存在误差！\n度越来越小了。\n向偏了。\n\n### [第 117 页]\n\n![第 117 页教学插图与实验活动](figures/p117.png)\n\n#### 📝 记录单自制摆10秒摆动的次数日期：\n时间间隔/秒摆动次数\n\n#### 💬 研讨同一个摆在相同时间内摆动次数相同吗？\n通过观察，摆还有什么运动特点？摆的快慢与摆幅有关系吗？\n比较每个小组的数据，不同摆的摆动快慢一样吗？如果不同，主要原因是什么？\n\n#### 🚀 拓展观察生活中的各种“摆”们摆动的快慢相同吗？\n节拍器秋千"}, {"id": "sci_11_u04_l06", "lesson_idx": 231, "book": "六年级上册", "vol_dir": "11_六年级上册", "unit_no": 4, "unit_title": "第四单元计量时间", "lesson_no": 6, "title": "制作钟摆", "page": 118, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g11_s1_u04_l06.html", "code": "g11_s1_u04_l06", "sections": {"focus": "我们能不能也制作这样一个摆？\n摆的摆动快慢与什么因素有关？", "exploration": "猜测影响摆的摆动快慢的因素。\n可能与摆绳可能与摆锤的长度有关。\n的质量有关。", "discussion": "摆的摆动快慢与什么因素有关？我们是怎样知道的？\n摆的摆动快慢与摆绳长度有什么关系？\n1. 分钟摆动60次的钟摆，它的摆绳长度有什么特点？\n教育科学云脉社", "expansion": "取一根长30厘米的木条，竖直悬挂起来，使其能自由摆动，观察它的摆动快慢。如果要在这个木条上固定一块金属圆片，让它正好1分钟摆动60次，圆片应该固定在什么位置？", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p118.webp", "p119.webp", "p120.webp", "p121.webp"], "raw_text": "### [第 118 页]\n\n![第 118 页教学插图与实验活动](figures/p118.png)\n\n## 6. 制作钟摆\n\n\n制作钟摆机械摆钟里的钟摆每分钟摆动60次。\n\n#### 🎯 聚焦我们能不能也制作这样一个摆？\n摆的摆动快慢与什么因素有关？\n\n#### 🔬 探索猜测影响摆的摆动快慢的因素。\n可能与摆绳可能与摆锤的长度有关。\n的质量有关。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g11_s1_u04_l06.html)\n\n\n### [第 119 页]\n\n![第 119 页教学插图与实验活动](figures/p119.png)\n\n2. 根据实验结果，检验我们的猜测。\n探究摆的摆动快慢与摆绳长度的关系。\n调整摆绳的长度，观测并记录摆绳长度不同的摆30秒摆动的次数，实验多次，取平均值。\n实验方案日期：\n提出的问题：摆的摆动快慢与摆绳长度有关吗？\n我们的猜测：摆的摆动快慢与摆绳长度有关，摆绳越长，摆动得越慢；\n摆绳越短，摆动得越快。\n实验器材：铁架台、秒表、长短不同的细绳、摆锤。\n需要改变的条件：摆绳的长度。\n不能改变的条件：摆锤质量和形状、摆幅等。\n实验方法：\n1. 把细绳固定在铁架台上，下端挂上一个摆锤，让摆小幅度地自由摆动。观测摆30秒摆动的次数，实验多次，取平均值。\n2. 保持摆锤质量不变，依次缩短摆绳的长度，观测摆绳长度不E同的摆30秒摆动的次数，实验多次，取平均值。\n中摆绳短摆绳长摆绳\n\n### [第 120 页]\n\n![第 120 页教学插图与实验活动](figures/p120.png)\n\n#### 📝 记录单摆绳长度不同的摆30秒摆动次数日期：\n30. 秒摆动次数摆绳的长短第1次观测第2次观测第3次观测平均值长中短探究摆的摆动快慢与摆锤质量的怎样改变摆锤质量而不会关系。\n影响摆绳的长短呢？\n把细绳固定在挂钩上，下端挂一个摆锤，让摆小幅度地自由摆动。\n观测并记录摆30秒摆动的次数。\n保持摆绳长度不变，依次增加摆锤的质量，观测并记录摆锤不同的摆30秒摆动的次数，实验多次，取平均值。\n\n#### 📝 记录单不同质量的摆锤30秒摆动次数日期：\n摆锤30秒摆动的次数质量第1次观测第2次观测第3次观测平均值初始值\n2. 倍\n3. 倍\n\n### [第 121 页]\n\n![第 121 页教学插图与实验活动](figures/p121.png)\n\n3. 制作1分钟摆动60次的摆。反复测试，不断调整和记录，使制作完成的摆正好1分钟摆动60次。\n怎样在最短时间内完成调试？\n\n#### 💬 研讨摆的摆动快慢与什么因素有关？我们是怎样知道的？\n摆的摆动快慢与摆绳长度有什么关系？\n1. 分钟摆动60次的钟摆，它的摆绳长度有什么特点？\n教育科学云脉社\n\n#### 🚀 拓展取一根长30厘米的木条，竖直悬挂起来，使其能自由摆动，观察它的摆动快慢。如果要在这个木条上固定一块金属圆片，让它正好1分钟摆动60次，圆片应该固定在什么位置？"}, {"id": "sci_11_u04_l07", "lesson_idx": 232, "book": "六年级上册", "vol_dir": "11_六年级上册", "unit_no": 4, "unit_title": "第四单元计量时间", "lesson_no": 7, "title": "时间与变化", "page": 122, "domain": "general_science", "domain_cn": "综合科学探究", "sim_file": "sim_g11_s1_u04_l07.html", "code": "g11_s1_u04_l07", "sections": {"focus": "科学家是根据什么证据推测各种生物在地球上出现的时间的？", "exploration": "认识“生物时钟”。\n生物的活动会随着时间进行规律性的周期变化，这些变化会在生物体上留下痕迹。\n观察树干的横截面，数一数它的年轮并测量其宽度，估计树木的大致年龄。\n调查、搜集更多关于生物体上时间的痕迹。\n年轮海贝表面的生长纹树干的横截面龟甲上的环纹了解古生物时钟（化石钟）。\n资料和现代生物一样，古代生物体上我国古生物学家马廷英一百多年也有反映其“年龄”特征的信息。那前就发现珊瑚化石上的生长纹记载了么，我们能知道古生物生活的年代和季节生长的过程。古生物学家通过对各个地质时期的四射珊瑚化石生长纹它们的生存环境吗？\n的观察和计算，发现从古到今一年中·观察珊瑚化石生长纹，搜集、查的天数在逐渐减少，而一天的时数却阅资料，讨论古珊瑚生长与季节之间在逐渐增加。这样的结果证明了地球的关系。交流地质历史时期珊瑚化石自转的速度在有规律地变慢。\n生长纹数量变化与地球自转周期之间的关系。", "discussion": "除了树木年轮，你还知道哪些“生物时钟”？\n如果在中生代地层中发现一根硅化木，你认为它大致是在什么时间被掩埋下去的？\n③将各种各样的钟进行比较，包括生物时钟和非生物时钟，谈一谈它们的异同点。\n“地层中化石群演进”图下部的化石主要是海洋生物留下的，说一说该地区古生代时的环境可能是怎样的。\n北京延庆硅化木国家地质公园", "expansion": "化石是地质历史的时钟，文物是人类历史的记录。要了解祖先的生活，就要靠他们留下的文物来推测，例如杭州良诸遗址出土的炭化稻。考古学家利用“放射性碳定年法”（又称“碳十四断代法”）测出炭化稻距今约5000年，这说明约杭州良遗址出土的炭化稻（左）五千年前良诸人就已经会种植水稻与现代水稻（右）的比较了。而且，炭化稻储量巨大，说明水稻丰收。\n请查阅资料，思考下列问题。\n1. 出土炭化稻的地区范围有多大？这些地区今天的环境有什么变化？这些地区的农作物类型是否仍然主要是水稻？\n2. 下图为良诸先民生活环境复原图，我们认为是否合理？\n出版", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p122.webp", "p123.webp", "p124.webp", "p125.webp", "p126.webp", "p127.webp", "p128.webp", "p129.webp", "p130.webp", "p131.webp"], "raw_text": "### [第 122 页]\n\n![第 122 页教学插图与实验活动](figures/p122.png)\n\n## 7. 时间与变化\n\n\n时间与变化亿万年前，人类还没有出现，更没有计时工具。但是，科学家发现地球上大约35亿年前出现了像草履虫一样的原始生物；又过了大约30. 亿年才进化出鱼；再用大约2亿年时间才进化出恐龙；然后又出现了哺乳动物：距今大约600. 万～700万年前才出现了最早的人类。\n生物进化谱系树\n\n#### 🎯 聚焦科学家是根据什么证据推测各种生物在地球上出现的时间的？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g11_s1_u04_l07.html)\n\n\n### [第 123 页]\n\n![第 123 页教学插图与实验活动](figures/p123.png)\n\n#### 🔬 探索认识“生物时钟”。\n生物的活动会随着时间进行规律性的周期变化，这些变化会在生物体上留下痕迹。\n观察树干的横截面，数一数它的年轮并测量其宽度，估计树木的大致年龄。\n调查、搜集更多关于生物体上时间的痕迹。\n年轮海贝表面的生长纹树干的横截面龟甲上的环纹了解古生物时钟（化石钟）。\n资料和现代生物一样，古代生物体上我国古生物学家马廷英一百多年也有反映其“年龄”特征的信息。那前就发现珊瑚化石上的生长纹记载了么，我们能知道古生物生活的年代和季节生长的过程。古生物学家通过对各个地质时期的四射珊瑚化石生长纹它们的生存环境吗？\n的观察和计算，发现从古到今一年中·观察珊瑚化石生长纹，搜集、查的天数在逐渐减少，而一天的时数却阅资料，讨论古珊瑚生长与季节之间在逐渐增加。这样的结果证明了地球的关系。交流地质历史时期珊瑚化石自转的速度在有规律地变慢。\n生长纹数量变化与地球自转周期之间的关系。\n\n### [第 124 页]\n\n![第 124 页教学插图与实验活动](figures/p124.png)\n\n搜集、阅读资料，交流科学家通过化石判断地层年代的方法和实例。\n现代新生代距今6600万年中生代距今2.5亿年古生代距今5.4亿年地层中化石群演进至少从古生代开始，地球就成了生机勃勃的星球，之后有数百万个物种先后出现又绝灭，构成了一幅壮观的生命演化图卷，一些物种可以形成化石保留在地层中，古生物的出现、存续和灭绝是地质时代的天然记录。科学家正是根据一组地层中的化石组合来确定物种灭绝的先后关系，而地层的绝对年代通常用“放射性同位素方法”测定。\n\n### [第 125 页]\n\n![第 125 页教学插图与实验活动](figures/p125.png)\n\n1. 总结和比较各种各样的生物时钟。\n\n#### 📝 记录单各种各样的“生物时钟”日期：\n“生物时钟”特征树木的年轮贝壳的生长纹龟甲上的环纹珊瑚化石的生长纹\n\n#### 💬 研讨除了树木年轮，你还知道哪些“生物时钟”？\n如果在中生代地层中发现一根硅化木，你认为它大致是在什么时间被掩埋下去的？\n③将各种各样的钟进行比较，包括生物时钟和非生物时钟，谈一谈它们的异同点。\n“地层中化石群演进”图下部的化石主要是海洋生物留下的，说一说该地区古生代时的环境可能是怎样的。\n北京延庆硅化木国家地质公园\n\n### [第 126 页]\n\n![第 126 页教学插图与实验活动](figures/p126.png)\n\n#### 🚀 拓展化石是地质历史的时钟，文物是人类历史的记录。要了解祖先的生活，就要靠他们留下的文物来推测，例如杭州良诸遗址出土的炭化稻。考古学家利用“放射性碳定年法”（又称“碳十四断代法”）测出炭化稻距今约5000年，这说明约杭州良遗址出土的炭化稻（左）五千年前良诸人就已经会种植水稻与现代水稻（右）的比较了。而且，炭化稻储量巨大，说明水稻丰收。\n请查阅资料，思考下列问题。\n1. 出土炭化稻的地区范围有多大？这些地区今天的环境有什么变化？这些地区的农作物类型是否仍然主要是水稻？\n2. 下图为良诸先民生活环境复原图，我们认为是否合理？\n出版\n\n### [第 127 页]\n\n![第 127 页教学插图与实验活动](figures/p127.png)\n\n#### 📋 单元小结日暮地球自转太阳钟圭表地球公转技术的发展“燃香钟”和“蜡烛钟”物质的可燃性计量水钟水的流动性时间机械摆钟摆的等时运动“生物时钟”生命的周期性变化演化的思想化石钟生命进化和地球演化自然界中一些物体会随着时间呈现有规律的变化，人类利用这些变化来计时，如地球自转形成昼夜变化，地球公转形成季节交替。随着技术的进步，人类制造出各种各样的计时工具，时间的测量精度越来越高。\n地球上万事万物发生的变化都与时间密不可分，生物世界同样如此寻找生物体上时间留下的痕迹，可以帮助我们回溯过去，了解生命的进化和地球的演化。\n我的收获评价内容评价等级怎样改进呢？\n我知道自然界中物体的运动变化现象可以用于计量时间我参与了制作水钟模型过程，并根据反馈结果进行改进我经历了水钟、钟摆等反复测试过程，体会到重复实验对获得可靠数据的重要性我体会到计时技术的发展和应用影响着社会发展\n\n### [第 128 页]\n\n![第 128 页教学插图与实验活动](figures/p128.png)\n\n#### 📖 科学阅读单摆的等时性是如何被发现的摆的等时性规律的发现是一个重大的历史事件，为机械摆钟的发明奠定了基础，推动了计时工具的发展。这个规律是怎么被发现的呢？\n1582. 年的一天，伽利略看到大厅中的吊灯被维修工人不小心碰到了，正在来回摆动。他的脑海里闪现出了一系列问题：吊灯来回摆动一次的时间相同吗？怎样来测量它来回摆动一次的时间呢？\n伽利略知道，人的脉搏每分钟跳动的次数是稳定的，能不能利用脉搏来测量时间呢？\n他把右手的手指搭在了左手的手腕上，同时数着吊灯来回摆动的次数。随着吊灯摆动幅度的减小，摆动的速度也在变慢，但就在这时伽利略发现吊灯来回摆动一次所用的时间是相同的。\n吊灯有这样的现象，如果换成其他物体能不能得到相同的结论呢？伽利略带着满心的欢喜回到了自己的房间，找出一根细绳，绳的一端系上一个小球，另一端系在天花板上，这样就做成了一个最简单的单摆。用这个装置，伽利略反复测量摆的摆动周期。他先后使伽利路观察吊灯的摆动（绘制图）\n\n### [第 129 页]\n\n![第 129 页教学插图与实验活动](figures/p129.png)\n\n用了铜球、铁球、木球来测试，结果发现，无论是什么材质的球，只要摆长是固定不变的，摆来回摆动一次所用的时间就是相同的。这也说明，单摆的摆动周期与摆球的质量是无关的。\n单摆的摆动周期与什么因素有关呢？伽利略制作了十几个摆长不同的摆，一一测量它们的摆动周期，发现摆长越长，摆的摆动周期也越长。\n伽利略很想利用摆来计量时间，尝试建造摆钟，奈何当时人们根本不相信科学，伽利略在从事科学活动时还会遭到迫害。直到1656年，荷兰科学家惠更斯完成了伽利略的遗愿，造出了世界上第一座摆钟。\n教出伽利略构想的摆钟\n\n### [第 130 页]\n\n![第 130 页教学插图与实验活动](figures/p130.png)\n\n后记本套科学教科书由根据《义务教育科学课程标准（2022年版）》组织编写。编写团队由科研院所和高校的科学家、教育教学专家以及全国各地的优秀科学教师、教研员组成，周忠和院士与张红霞教授共同担任主编。\n编写过程中，我们得到了诸多科学家、教研员和一线教师的支持与帮助。\n李金华、张智慧、李博强、杨顺华、魏科、石承民、李实、张金海等为教科书编写提供了专业审查和咨询意见，高伟组织并参与编写了“制作天文望远镜”等单元。此外，还有很多单位、专家和同仁为我们提供了审读、插图、资料等方面的支持和帮助。他们的参与为确保教科书内容的科学性、适切性提供了重要支撑，在此一并表示诚挚谢意！\n我们真诚地欢迎广大师生和社会各界人士对教科书提出宝贵意见，帮助我们共同打造培根铸魂、启智增慧的精品教材。子出片反不土电子邮箱：science@esph.com.cn\n\n### [第 131 页]\n\n![第 131 页教学插图与实验活动](figures/p131.png)\n\n教育科学云限社。班级姓名学号"}, {"id": "sci_12_u01_l01", "lesson_idx": 233, "book": "六年级下册", "vol_dir": "12_六年级下册", "unit_no": 1, "unit_title": "小小工程师", "lesson_no": 1, "title": "了解我们的住房", "page": 2, "domain": "engineering", "domain_cn": "综合科学探究", "sim_file": "sim_g12_s2_u01_l01.html", "code": "g12_s2_u01_l01", "sections": {"focus": "住房是我们每天生活的地方。你家住房的基本结构是怎样的？有哪些必需的系统？需要经历怎样的一个建造过程？", "exploration": "以你的家为例，说一说住房的基本结构。", "discussion": "1. 房屋在整个建造过程中经历了哪些重要的工作阶段？\n1. 一套住房包括哪些基本结构和系统？\n2. 在住房建造过程中，哪些工作阶段最重要？为什么？义不拓SP展搜集其他工程（如“中国天眼”、“神舟”飞船、高铁、桥梁、“鸟巢”等）建造过程的案例，下节课与同学分享。", "expansion": "", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p02.webp", "p03.webp"], "raw_text": "### [第 2 页]\n\n![第 2 页教学插图与实验活动](figures/p02.png)\n\n## 1. 了解我们的住房\n\n\n了解我们的住房\n\n#### 🎯 聚焦住房是我们每天生活的地方。你家住房的基本结构是怎样的？有哪些必需的系统？需要经历怎样的一个建造过程？\n\n#### 🔬 探索以你的家为例，说一说住房的基本结构。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g12_s2_u01_l01.html)\n\n\n### [第 3 页]\n\n![第 3 页教学插图与实验活动](figures/p03.png)\n\n指出住房所必须具有的系统。\n活动手册了解住房建造的过程。\n住房建造的主要过程活动手册班级记录表）想一想一套住房的建成需经历哪日期些过程。\n1. 选址\n2. 设计搜集住房建造的资料，将搜集到\n3. 建造的相关信息记录下来。\n我们的信息记录表日期：\n\n#### 💬 研讨\n\n1. 房屋在整个建造过程中经历了哪些重要的工作阶段？\n1. 一套住房包括哪些基本结构和系统？\n2. 在住房建造过程中，哪些工作阶段最重要？为什么？义不拓SP展搜集其他工程（如“中国天眼”、“神舟”飞船、高铁、桥梁、“鸟巢”等）建造过程的案例，下节课与同学分享。"}, {"id": "sci_12_u01_l02", "lesson_idx": 234, "book": "六年级下册", "vol_dir": "12_六年级下册", "unit_no": 1, "unit_title": "小小工程师", "lesson_no": 2, "title": "认识工程", "page": 4, "domain": "engineering", "domain_cn": "综合科学探究", "sim_file": "sim_g12_s2_u01_l02.html", "code": "g12_s2_u01_l02", "sections": {"focus": "我们已经了解了住房和它的建造过程，其他工程的建设过程又是怎样的？它们在建设过程中有什么共同特点呢？", "exploration": "阅读或观看港珠澳大桥的相关资料，试着整理和归纳下面的问题。", "discussion": "", "expansion": "收集塔的图片，观察塔的结构特点。", "frontier": "", "big_concept": "明确需求与限制 → 科学原理建模 → 方案设计与原型制作 → 极限工况测试评估 → 迭代优化改进。三角形结构具有极高的几何几何稳定性，因其三边长度一旦固定，内角不可变形。", "misconception": ""}, "figures": ["p04.webp", "p05.webp", "p06.webp", "p07.webp"], "raw_text": "### [第 4 页]\n\n![第 4 页教学插图与实验活动](figures/p04.png)\n\n## 2. 认识工程\n\n\n认识工程\n\n#### 🎯 聚焦我们已经了解了住房和它的建造过程，其他工程的建设过程又是怎样的？它们在建设过程中有什么共同特点呢？\n\n#### 🔬 探索阅读或观看港珠澳大桥的相关资料，试着整理和归纳下面的问题。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **现代大工程方法论（数字化BIM与大跨度空间桁架结构）**：从大兴国际机场流线型钢网架屋顶，到千米跨径悬索桥（如张靖皋长江大桥），现代工程师借助拓扑优化算法与有限元力学计算，实现轻量化与超高结构承载稳定性的极限平衡！\n- 🧠 **跨学科大概念（工程设计闭环流程）**：明确需求与限制 → 科学原理建模 → 方案设计与原型制作 → 极限工况测试评估 → 迭代优化改进。三角形结构具有极高的几何几何稳定性，因其三边长度一旦固定，内角不可变形。\n- ⚠️ 直觉错误：“建造高楼或大桥，只要用最沉、最厚的材料就一定最稳固”。**科学真相**：盲目增加结构自重反而会加剧基座剪切应变与地震共振破坏！现代工程追求‘高强轻质’与‘三角形铰接桁架’受力分解，以柔克刚消解动态荷载。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g12_s2_u01_l02.html)\n\n\n### [第 5 页]\n\n![第 5 页教学插图与实验活动](figures/p05.png)\n\n*(本页主要为教学情境图、实验探究活动与实物观察展示)*\n\n### [第 6 页]\n\n![第 6 页教学插图与实验活动](figures/p06.png)\n\n经过九年施工，港珠澳大桥终于正式开通了。港珠澳大桥飞跨伶仃洋，连接着我国经济最发达的地区和人口最密集的地区，大桥全长55千米，是集桥、岛、隧为一体的世界最长的跨海大桥。大桥将为粤港澳大湾区的经济发晨带来强劲的动力。\n为什么要建造港珠澳大桥？\n·大桥的建造曾面临哪些限制和挑战？\n·这些问题都是怎样解决的？\n我们搜集到了·大桥的建造经历了哪些主要过程？\n哪些资料限制和挑战解决办法大桥要经过通向香港的唯一航道，桥面高度必须在这片水域上修建六七千超过80米，桥塔高度超过200米，而香港机场不米长的海底隧道和22.9千允许有超过88米的建筑物出现米长的跨海大桥桥梁和隧道需要用岛屿连接，但这片海域上没有任何可用的岛屿修建人工岛建岛的海床上有15到20米深的淤泥，机械会滑出，移走淤泥又会对海洋造成毁灭性污染用圆钢筒围岛限制条件包括时间梳理工程建设过程的相似步骤。\n活动手册费用、可用材料、环境、抵抗自然界的破明确一个要解决的问题坏能力等。\n在限制条件下进行设计制作一个模型（画或写解决方案）测试这个模型，评估并改进实施建设\n\n### [第 7 页]\n\n![第 7 页教学插图与实验活动](figures/p07.png)\n\n了解这些宏大工程与科技进步的关系。\n本唐\n1. 通过两节课的学习，我们对工程有了哪些认出腾社识？这些认识的依据是什么？\n2. 完成一项工程要经历哪些重要的工作阶段？\n3. 工程与技术的关系是怎样的？\n4. 假如让我们做一名小小的工程师，我们都要完成哪些工作呢？\n\n#### 🚀 拓展收集塔的图片，观察塔的结构特点。"}, {"id": "sci_12_u01_l03", "lesson_idx": 235, "book": "六年级下册", "vol_dir": "12_六年级下册", "unit_no": 1, "unit_title": "小小工程师", "lesson_no": 3, "title": "建造塔台", "page": 8, "do 异，自然界才出现了相似，这种现象叫遗传；\n形形色色的植物。\n植物后代和亲代之间也会有一些细微的不同，这种\n\n#### 💬 研讨现象叫变异。\n1. 我们通过观察发现植物的亲代和后代之间有哪些相同和不同？\n2. 哪些事例可以说明人类利用植物的遗传和变异现象改善着人类生活？\n\n### [第 28 页]\n\n![第 28 页教学插图与实验活动](figures/p28.png)\n\n#### 🚀 拓展京科学省版孟德尔和豌豆实验了一系列具有历史性意义的实验。\n他的第一个目标是研究豌豆植株的高度。他将矮株豌豆与矮株豌豆杂交，得到的后代也是矮株的：将高株豌豆与高株豌豆进行杂交，这一次，后代并不全是高株的。为什么会这样？\n他继续实验，并把他的想法、观察结果和发现一一记录下来。\n他花了八年时间用豌豆进行实验，终于揭开了生物一代与一代之间又像又不像的奥秘，这就是著名的孟德尔遗传定律。\n查阅资料，了解更多有关孟德尔和他的研究成果的事情。"}, {"id": "sci_12_u02_l04", "lesson_idx": 243, "book": "六年级下册", "vol_dir": "12_六年级下册", "unit_no": 2, "unit_title": "生物的多样性", "lesson_no": 4, "title": "多种多样的动物", "page": 29, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g12_s2_u02_l04.html", "code": "g12_s2_u02_l04", "sections": {"focus": "我们已经感受到了植物世界的丰富多彩。那么，动物世界又是怎样的呢？动物宝宝和它们的爸爸妈妈有什么相同和不同呢？", "exploration": "比较动物后代与亲代的异同。\n描述狗妈妈和每只小狗的毛色与花纹有什么相同和不同。\n哪只小狗遗传了狗妈妈的毛色？哪只小狗相对妈妈的毛色来说发生了变异？\n推测狗爸爸的毛色可能是什么样的，说说你的理由。\n仔细观察，我们还发现狗宝宝遗传了狗妈妈的哪些特征？哪些方面发生了变化？\n小组交流其他动物的遗传和变异现象。", "discussion": "", "expansion": "选择一种动物，观察动物宝宝与它们的妈妈或爸爸在形态特征、行为方式、生活习性等方面有哪些相同和不同。以“动物和它的妈妈（爸爸）”为题写一篇观察日记。", "frontier": "", "big_concept": "生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。", "misconception": ""}, "figures": ["p29.webp", "p30.webp", "p31.webp"], "raw_text": "### [第 29 页]\n\n![第 29 页教学插图与实验活动](figures/p29.png)\n\n## 4. 多种多样的动物\n\n\n多种多样的动物\n\n#### 🎯 聚焦我们已经感受到了植物世界的丰富多彩。那么，动物世界又是怎样的呢？动物宝宝和它们的爸爸妈妈有什么相同和不同呢？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿古生物学与生态基因库（国家基因库与恐龙羽毛演化）**：我国热河生物群带羽毛恐龙（如中华龙鸟）化石的发现，无可辩驳地确立了“现代鸟类是由兽脚类恐龙演化而来”的里程碑定论；高通量基因测序技术更重构了全球物种生命树与食物网脆弱度阈值。\n- 🧠 **跨学科大概念（尺度与比例 / 生态位）**：生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。\n- ⚠️ 很多同学误以为“凶猛的肉食动物消灭弱小食草动物对大自然有害”。**科学真相**：顶级捕食者能控制食草动物种群数量以防止过度啃食植被草原（营养级联效应），捕食体弱病体反而促进了种群基因库的健康优化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g12_s2_u02_l04.html)\n\n\n### [第 30 页]\n\n![第 30 页教学插图与实验活动](figures/p30.png)\n\n#### 🔬 探索比较动物后代与亲代的异同。\n描述狗妈妈和每只小狗的毛色与花纹有什么相同和不同。\n哪只小狗遗传了狗妈妈的毛色？哪只小狗相对妈妈的毛色来说发生了变异？\n推测狗爸爸的毛色 然有害”。**科学真相**：顶级捕食者能控制食草动物种群数量以防止过度啃食植被草原（营养级联效应），捕食体弱病体反而促进了种群基因库的健康优化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g12_s2_u02_l07.html)\n\n\n### [第 37 页]\n\n![第 37 页教学插图与实验活动](figures/p37.png)\n\n*(本页主要为教学情境图、实验探究活动与实物观察展示)*\n\n### [第 38 页]\n\n![第 38 页教学插图与实验活动](figures/p38.png)\n\n资料了解目前为保护生物多样性正在采取的措施。\n生物多样性对人类的建立自然保护区保护濒危物种。\n健康和生存至关重要。生物建立植物种子库和花粉库。\n之间以及生物与环境之间相建立动物精子库。\n科学词汇互作用形成复杂的、互相联颁布相关法律法规。\n系的生态系统，提供所有生生态系统命赖以生存的条件。\n自然保护区自然保护区，是指对将我们的研究成果制成“保护生物多样有代表性的自然生态系统、性”宣传海报。\n珍稀濒危野生动植物物种的青海湖国家级自然保护区天然集中分布区、有特殊意义的自然遗迹等保护对象所在的陆地、陆地水体或者海域，依法划出一定面积予以特殊保护和管理的区域。人类建立自然保护区已有百余年的历史。\n\n#### 💬 研讨\n\n#### 🚀 拓展\n\n1. 地球上生物种类那么多，人类为什么还如此重视保护生物多样性？发社ES调查我们家乡保护\n2. 人类的哪些行为会导致生物多样性的生物多样性的现状。\n锐减？\n3. 我们能做哪些力所能及的事来保护生物多样性？\n青海可可西里国家级自然保护区\n\n### [第 39 页]\n\n![第 39 页教学插图与实验活动](figures/p39.png)\n\n1995. 年4月1日，哈勃太空望远镜在老鹰星云中拍摄到了一张珍贵照片。这张照片是圆柱状的星云气体和尘埃。在其中最高的一根“柱子”里，孕育着许多新生的恒星，因而得名“创生之柱”。\n宇宙好奇是人类的天性，理解是一种乐趣，知识是生存的先决条件。因为我们在这个宇宙中只不过是晨空中飞扬的一粒尘埃，所以我们认为：人类的未来取决于我们对这个宇宙的理解程度。\n一卡尔·萨根"}, {"id": "sci_12_u03_l01", "lesson_idx": 247, "book": "六年级下册", "vol_dir": "12_六年级下册", "unit_no": 3, "unit_title": "宇宙", "lesson_no": 1, "title": "太阳系大家庭", "page": 40, "domain": "astronomy", "domain_cn": "综合科学探究", "sim_file": "sim_g12_s2_u03_l01.html", "code": "g12_s2_u03_l01", "sections": {"focus": "我们知道月球是地球的卫星，太阳黑子地球是太阳系大家庭中的一颗行星。除了太阳、地球和月球外，我们还知道太阳系中有哪些天体？", "exploration": "画一画你知道的太阳系，然后和同学交流。\n活动手册了解太阳。\n太阳处于太阳系的中心位置，它的质量占整个太阳系所有天体质日冕量的99.86%，正因为如此，它支配太阳黑着太阳系中所有其他天体的运行。\n它是一颗充满活力的恒星，每时每刻都在向太空发出光和热。\n·搜索一个能提供太阳基本资料太阳光球上的网站。\n的米粒组织了解太阳的一些基本数据，比如质量、大小、结构等。\n·根据自已的兴趣，深人了解太阳的一些情况，比如太阳黑子、太阳对地球的影响等。", "discussion": "", "expansion": "彗星彗星也绕太阳公转，有的大约几十到几百年绕太阳一圈，有的绕太阳一圈需要长达数千年甚至数百万年。", "frontier": "", "big_concept": "天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。", "misconception": ""}, "figures": ["p40.webp", "p41.webp", "p42.webp"], "raw_text": "### [第 40 页]\n\n![第 40 页教学插图与实验活动](figures/p40.png)\n\n## 1. 太阳系大家庭\n\n\n太阳系大家庭\n\n#### 🎯 聚焦我们知道月球是地球的卫星，太阳黑子地球是太阳系大家庭中的一颗行星。除了太阳、地球和月球外，我们还知道太阳系中有哪些天体？\n\n#### 🔬 探索画一画你知道的太阳系，然后和同学交流。\n活动手册了解太阳。\n太阳处于太阳系的中心位置，它的质量占整个太阳系所有天体质日冕量的99.86%，正因为如此，它支配太阳黑着太阳系中所有其他天体的运行。\n它是一颗充满活力的恒星，每时每刻都在向太空发出光和热。\n·搜索一个能提供太阳基本资料太阳光球上的网站。\n的米粒组织了解太阳的一些基本数据，比如质量、大小、结构等。\n·根据自已的兴趣，深人了解太阳的一些情况，比如太阳黑子、太阳对地球的影响等。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿空间探索（中国探月与深空探测工程）**：从“嫦娥六号”实现人类首次月背采样返回，到“祝融号”火星车巡视火星乌托邦平原，航天科学家利用精密轨道力学与光谱分析，正在解开太阳系演化与地月系统的终极奥秘！\n- 🧠 **跨学科大概念（系统与模型 / CER 推理）**：天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。\n- ⚠️ 很多同学误以为“月相变化是地球的影子挡住了月亮”。**科学真相**：地球影子挡住月球的现象是罕见的“月食”；而平时的初一到十五月相变化，纯粹是因为月球绕地球公转时，我们在地球上看到的月球被太阳照亮的半球面角度不同！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g12_s2_u03_l01.html)\n\n\n### [第 41 页]\n\n![第 41 页教学插图与实验活动](figures/p41.png)\n\n本图不代表天体大小和距离的实际比例关系。\n\n### [第 42 页]\n\n![第 42 页教学插图与实验活动](figures/p42.png)\n\n了解太阳系大家庭中的其他天体。\n在太阳系中，有一些天体可以直接观察到。\n还有一些比较小或者比较远的天体，需要借助天文望远镜才能更好地观察。\n月球和木星、金星组成的“笑脸”流星小行星带1997. 年4月5日早晨，在地球\n2. 这些天体各有什么特点？\n上观察到的海尔-波普彗星\n\n#### 🚀 拓展彗星彗星也绕太阳公转，有的大约几十到几百年绕太阳一圈，有的绕太阳一圈需要长达数千年甚至数百万年。"}, {"id": "sci_12_u03_l02", "lesson_idx": 248, "book": "六年级下册", "vol_dir": "12_六年级下册", "unit_no": 3, "unit_title": "宇宙", "lesson_no": 2, "title": "八颗行星", "page": 43, "domain": "astronomy", "domain_cn": "综合科学探究", "sim_file": "sim_g12_s2_u03_l02.html", "code": "g12_s2_u03_l02", "sections": {"focus": "太阳系有八颗行星，地球是从太八颗行星的基本数据表阳向外的第三颗行星，其他的行星就好行星与太阳的平均距离赤道直径（万千米）（千米）像地球的兄弟姐妹一样。八颗行星有哪水星些？它们是如何排列的呢？\n金星地球", "exploration": "火星木星阅读风颗行星的基本数据表，说土星说从这张表中你知道了什么。\n天王星海王星给八颗行星排序。\n活动手册我的排序方法1：按离太阳的远近方法2：按直径大小", "discussion": "1. 在建造模型的过程中，各小组是如何处理数据的？有什么体会和发现？\n2. 观察全班制作出来的八颗行星位置模型，我们有什么新的认识或问题？", "expansion": "观察木星及其卫星因为木星相当巨大而又明亮，所以很容易被认出。用望远镜观察，它看起来像小圆盘。另外，你还有可能看到它的四颗最亮的卫星。", "frontier": "", "big_concept": "天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。", "misconception": ""}, "figures": ["p43.webp", "p44.webp"], "raw_text": "### [第 43 页]\n\n![第 43 页教学插图与实验活动](figures/p43.png)\n\n## 2. 八颗行星\n\n\n八颗行星本图不代表天体大小和距离的实际比例关系，\n\n#### 🎯 聚焦太阳系有八颗行星，地球是从太八颗行星的基本数据表阳向外的第三颗行星，其他的行星就好行星与太阳的平均距离赤道直径（万千米）（千米）像地球的兄弟姐妹一样。八颗行星有哪水星些？它们是如何排列的呢？\n金星地球\n\n#### 🔬 探索火星木星阅读风颗行星的基本数据表，说土星说从这张表中你知道了什么。\n天王星海王星给八颗行星排序。\n活动手册我的排序方法1：按离太阳的远近方法2：按直径大小\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿空间探索（中国探月与深空探测工程）**：从“嫦娥六号”实现人类首次月背采样返回，到“祝融号”火星车巡视火星乌托邦平原，航天科学家利用精密轨道力学与光谱分析，正在解开太阳系演化与地月系统的终极奥秘！\n- 🧠 **跨学科大概念（系统与模型 / CER 推理）**：天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。\n- ⚠️ 很多同学误以为“月相变化是地球的影子挡住了月亮”。**科学真相**：地球影子挡住月球的现象是罕见的“月食”；而平时的初一到十五月相变化，纯粹是因为月球绕地球公转时，我们在地球上看到的月球被太阳照亮的半球面角度不同！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g12_s2_u03_l02.html)\n\n\n### [第 44 页]\n\n![第 44 页教学插图与实验活动](figures/p44.png)\n\n建立行星的位置关系模型。\n活动手册以小组为单位，先处理行星与太阳距离远近的数据。\n应怎样处理取三条长度相同的纸带，每条纸带对折四次，然后将纸带数据呢？\n粘连成一条长纸带。在长纸带的折痕处标记数字。\n·将八颗行星标记在长纸带上。\n又该如何标记呢？\n根据处理后的数据将八颗行星画在纸带上。\n·将制作好的“八颗行星位置模型”纸带粘贴在班级的黑板上。\n观察我们的纸带模型。对比我们的模型与平时常见的太阳系八颗行星的图片有何不同。\n\n#### 💬 研讨\n\n1. 在建造模型的过程中，各小组是如何处理数据的？有什么体会和发现？\n2. 观察全班制作出来的八颗行星位置模型，我们有什么新的认识或问题？\n\n#### 🚀 拓展观察木星及其卫星因为木星相当巨大而又明亮，所以很容易被认出。用望远镜观察，它看起来像小圆盘。另外，你还有可能看到它的四颗最亮的卫星。"}, {"id": "sci_12_u03_l03", "lesson_idx": 249, "book": "六年级下册", "vol_dir": "12_六年级下册", "unit_no": 3, "unit_title": "宇宙", "lesson_no": 3, "title": "日食", "page": 45, "domain": "astronomy", "domain_cn": "综合科学探究", "sim_file": "sim_g12_s2_u03_l03.html", "code": "g12_s2_u03_l03", "sections": {"focus": "我们知道，在太阳的引力作用下，太阳系中的天体都在围绕太阳运行。月亮在绕着地球运动的同时，也被地球携带着绕太阳公转。在运行过程中，天体之间有时会发生一些有趣的天文现象，比如日食。我们观察过日食吗？知道日食是怎么发生的吗？", "exploration": "育科学出模拟三球运动。\n你能模拟太阳、地球和月球的运动吗？\n你在模拟实验中观察到了什么？\n模拟日食。\n活动手册我们知道日食是月球挡住了太阳发出的光。月球真的能遮挡住太阳吗？能否设计一个模拟实验来验证我们的推测？\n·用大小和颜色不同的纸片分别代表太阳、地球和月球（见图1）。\n图", "discussion": "1. 在模拟实验中，我们观察到日食现象了吗？月球处于远近不同的位置时，看到的现象有何不同？\n拓SP展金星运行到太阳与地球之间，恰巧三者排成一条直线时，就会出现金星凌日天象。凌日现象发生时，地球上的人们会看到金星在太阳的圆面上缓缓移动，从太阳的东边缘进入，最后从太阳西边缘移出。\n金星的直径和地球差不多大，凌日现象发生时，金 个旋涡，它有多条旋臂。太阳在其中一条猎户座支臂上，距离银河系中心盘面约2.6万光年。银河系中的天体围绕着银河系的中心高速公转。\n太阳你能描述一下银河系的形状有什么特点吗？\n银河系的“侧视图”\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿空间探索（中国探月与深空探测工程）**：从“嫦娥六号”实现人类首次月背采样返回，到“祝融号”火星车巡视火星乌托邦平原，航天科学家利用精密轨道力学与光谱分析，正在解开太阳系演化与地月系统的终极奥秘！\n- 🧠 **跨学科大概念（系统与模型 / CER 推理）**：天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。\n- ⚠️ 很多同学误以为“月相变化是地球的影子挡住了月亮”。**科学真相**：地球影子挡住月球的现象是罕见的“月食”；而平时的初一到十五月相变化，纯粹是因为月球绕地球公转时，我们在地球上看到的月球被太阳照亮的半球面角度不同！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g12_s2_u03_l06.html)\n\n\n### [第 52 页]\n\n![第 52 页教学插图与实验活动](figures/p52.png)\n\n建立银河系模型。\n我们来建一个银河系模型。\n准备一只陀螺、纸片、米粒、胶水等。\n在纸片上模拟画出银河系的“核球”和把一些米粒粘在纸片上，模拟银河系的几条“旋臂”，画好后剪下来“恒星”将纸片固定在陀螺上并开始旋转旋转过程中的“银河系”旋转我们的银河系模型，观察并我的观察和问题思考。根据模型，我们能提出一些有日期：\n意思的问题吗？\n活动手册用咬水将米粒因定好，可以使米粒掉不下来。那么，是什么吧“恒量”固定在银河系中的？\n河外星系。\n通过太空望远镜，人们发现银河系以外还有许多类似银河系一样庞大的恒星集团，比如仙女座星系、猎犬座星系。它们大小不一，直径从几千光年到几十万光年不等；它们形状各异，有椭圆的，有旋涡状的，有不规则的。这些星系都在高速运动着。\n\n### [第 53 页]\n\n![第 53 页教学插图与实验活动](figures/p53.png)\n\n遥远的大犬星座的两个螺旋形星系相互碰撞河外星系之一的仙女座星系科学家认为，宇宙诞生于上百亿年前的一次大爆炸。通过观测分析，我们的宇宙还处于膨胀之中.距地球约2800万光年的旋涡星系M104，其侧\n\n#### 💬 研讨面轮廓好像一顶宽边帽\n1. 银河系是怎样一个星系？请描述一下。\n2. 宇宙有多大？我们现在该怎样回答才好？\n3. 想象如果有一天，我们和河外星系的“外星人”有了联系，我们能准确地把自己的通信地址告诉他们吗？请按中文格式写下来。\n\n#### 🚀 拓展充满活力的宇宙现在，人们通过各种功能更为强大的望远镜观测星空，拍摄到许多令人叹为观止的天文奇观。\n宇宙中每时每刻都有许多恒星在诞生，同时也有许多恒星在消亡。恒星都在不停地高速运动，有些恒星自身还有节奏地膨胀和收蟹状星云爆发于1054年，在中国史书上缩，有些恒星还不断地向外抛射物有记载，后来被证实是超新星爆发质，宇宙充满了活力。"}, {"id": "sci_12_u03_l07", "lesson_idx": 253, "book": "六年级下册", "vol_dir": "12_六年级下册", "unit_no": 3, "unit_title": "宇宙", "lesson_no": 7, "title": "探索宇宙", "page": 54, "domain": "astronomy", "domain_cn": "综合科学探究", "sim_file": "sim_g12_s2_u03_l07.html", "code": "g12_s2_u03_l07", "sections": {"focus": "自从仰望星空的那一刻起，人类就对我们身处的宇宙充满了好奇和浓厚的兴趣。如果把人类有意识地观测和记录天体作为探索宇宙的开端，到今天，已经有好几千年的历史了。我们知道人类是怎样探索宇宙的吗？科学技术的进步是如何中国现存最古老的天文台帮助人类更好地探索宇宙的？\n登封观星台教育科。", "exploration": "通过多种方法与途径收集资料，对资料进行梳理和提炼，然后进行下面的讨论。\n了解人类探索宇宙的历史。\n在古代，人们就开始观测和记录各种天象，比如日升日落、月圆月缺、斗转星移等，并由此形成了日、月、年等时间概念。\n为了更好地观测，专门建立了观测、记录和研究天象的场所一天文台。\n伽利略绘制的月面图", "discussion": "", "expansion": "", "frontier": "", "big_concept": "天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。", "misconception": ""}, "figures": ["p54.webp", "p55.webp", "p56.webp", "p57.webp"], "raw_text": "### [第 54 页]\n\n![第 54 页教学插图与实验活动](figures/p54.png)\n\n## 7. 探索宇宙\n\n\n探索宇宙\n\n#### 🎯 聚焦自从仰望星空的那一刻起，人类就对我们身处的宇宙充满了好奇和浓厚的兴趣。如果把人类有意识地观测和记录天体作为探索宇宙的开端，到今天，已经有好几千年的历史了。我们知道人类是怎样探索宇宙的吗？科学技术的进步是如何中国现存最古老的天文台帮助人类更好地探索宇宙的？\n登封观星台教育科。\n\n#### 🔬 探索通过多种方法与途径收集资料，对资料进行梳理和提炼，然后进行下面的讨论。\n了解人类探索宇宙的历史。\n在古代，人们就开始观测和记录各种天象，比如日升日落、月圆月缺、斗转星移等，并由此形成了日、月、年等时间概念。\n为了更好地观测，专门建立了观测、记录和研究天象的场所一天文台。\n伽利略绘制的月面图\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿空间探索（中国探月与深空探测工程）**：从“嫦娥六号”实现人类首次月背采样返回，到“祝融号”火星车巡视火星乌托邦平原，航天科学家利用精密轨道力学与光谱分析，正在解开太阳系演化与地月系统的终极奥秘！\n- 🧠 **跨学科大概念（系统与模型 / CER 推理）**：天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。\n- ⚠️ 很多同学误以为“月相变化是地球的影子挡住了月亮”。**科学真相**：地球影子挡住月球的现象是罕见的“月食”；而平时的初一到十五月相变化，纯粹是因为月球绕地球公转时，我们在地球上看到的月球被太阳照亮的半球面角度不同！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g12_s2_u03_l07.html)\n\n\n### [第 55 页]\n\n![第 55 页教学插图与实验活动](figures/p55.png)\n\n自从1609年意大利科学家伽利略创制伽利略望远镜以来，人类借助望远镜观察太空，对宇宙的探索有了飞跃性的发展，所观测的宇宙空间不断扩大。现在，人们不断地改进，发明了更多功能各异的望远镜，从而获得了越来越多来17. 世纪研制的光学望远镜长达46米，使用自宇宙的信息。\n时必须吊在稳杆上哈勃太空望远镜位于贵州平塘县的500米口径球面射电望远镜空间站随着航天技术的进步，人类对宇宙的探索进人了航天时代。为了更好地观测宇宙，人类利用火箭将望远镜、人造卫星、空间探测器以及航天员等送到太空。人类还在太空建设空间站，航天员\n\n### [第 56 页]\n\n![第 56 页教学插图与实验活动](figures/p56.png)\n\n可以在空间站进行长时间的太空实验和科学观测。迄今为止，人类已经开展了200多次深空探测任务，其中月球是人类唯一登陆过的地球以外的天体。\n迄今为止，有500多位航天员邀游过太空，在太空中进行科学研究。但同时，也有20. 多位航天员在执行任务时以身殉职，为人类的航天事业献出了生命。\n“挑战者”号了解我国在太空探索方面的成就。\n目前，我国在太空探索方面取得了许多举世瞩目的成就。“神舟”系列载人飞船、“天宫”空间站、“嫦娥”系列“神舟”发射升空探月卫星、“玉兔”号月球车等都顺利实施。根据规划，我国还将建设新的空间站，深入探测月球和火星。未来，我国航天员还要登月考察。\n“玉兔”号月球车\n1. 从人类探索宇宙的历程中，我们知道了什么？\n2. 在太空探索中，我国取得了哪些成就？\n3. 结合实际，我们可以参加哪些天文类的实践活动？\n\n### [第 57 页]\n\n![第 57 页教学插图与实验活动](figures/p57.png)\n\n敬育科学出胶社物质的变化在我们生存的世界里，物质无处不在，物质的变化无处不有。\n当我们吃东西或呼吸的时候：我们的体内也会发生一些变化。有些变化非常神奇，它能够给我们提供能量，也能帮助我们感知世界。\n让我们走进物质的变化单元，一起去探讨物质世界的美妙，并解开我们心中有关世界的谜吧！"}, {"id": "sci_12_u04_l01", "lesson_idx": 254, "book": "六年级下册", "vol_dir": "12_六年级下册", "unit_no": 4, "unit_title": "物质的变化", "lesson_no": 1, "title": "厨房里的物质与变化", "page": 58, "domain": "chemistry", "domain_cn": "物质变化与化学", "sim_file": "sim_g12_s2_u04_l01.html", "code": "g12_s2_u04_l01", "sections": {"focus": "我们的生活离不开物质。上课使用的课本和桌椅、居住的房子和各种食物，都是由物质构成的。各种动植物，包括我们的身体，也是由物质构成的。\n你留意过厨房里的物质吗？厨房里各种各样的物质都是什么样的？它们会发生什么变化呢？", "exploration": "厨房中的物质。\n水是透明并且会流动的液体，它", "discussion": "下面几幅图代表了日常生活中常见的变化，这些变化改变的是什么？\n有新物质产生吗？\n二氧化碳灭火器烟花铜狮", "expansion": "", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p58.webp", "p59.webp", "p60.webp"], "raw_text": "### [第 58 页]\n\n![第 58 页教学插图与实验活动](figures/p58.png)\n\n## 1. 厨房里的物质与变化\n\n\n厨房里的物质与变化\n\n#### 🎯 聚焦我们的生活离不开物质。上课使用的课本和桌椅、居住的房子和各种食物，都是由物质构成的。各种动植物，包括我们的身体，也是由物质构成的。\n你留意过厨房里的物质吗？厨房里各种各样的物质都是什么样的？它们会发生什么变化呢？\n\n#### 🔬 探索厨房中的物质。\n水是透明并且会流动的液体，它\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g12_s2_u04_l01.html)\n\n\n### [第 59 页]\n\n![第 59 页教学插图与实验活动](figures/p59.png)\n\n没有味道；食盐是白色的微小晶体，它是咸的；铁锅是由坚硬且传热快的金属做的，而锅把手是由可以隔热的塑料或木头做的。\n描述几种厨房中的物质，说一说它们都有什么特征，以及有哪些用途。\n活动手册厨房中的变化。\n各种物质都在不断地变化，很多变化都与我们的生活息息相关。厨房里就经常会发生一些变化，米经过蒸煮才会变成饭，冰箱可以将水冻成冰块，有些放置久了的食物会变质….描述我们在厨房中能观察到的变化，把它们记录下来。\n活动手册\n\n### [第 60 页]\n\n![第 60 页教学插图与实验活动](figures/p60.png)\n\n不同的变化。\n比较下面的几种变化，它们有哪些相同之处？又有哪些不同之处？\n咬过后放置的苹果烧开的水慢慢融化的冰块生锈的铸铁锅物质总是在不断地变化，有些变化只改变了物质的大小、形态等，而有些变化产生了新的物质。我们把产生了新物质的变化叫作化学变化。\n\n#### 💬 研讨下面几幅图代表了日常生活中常见的变化，这些变化改变的是什么？\n有新物质产生吗？\n二氧化碳灭火器烟花铜狮"}, {"id": "sci_12_u04_l02", "lesson_idx": 255, "book": "六年级下册", "vol_dir": "12_六年级下册", "unit_no": 4, "unit_title": "物质的变化", "lesson_no": 2, "title": "产生气体的变化", "page": 61, "domain": "chemistry", "domain_cn": "物质变化与化学", "sim_file": "sim_g12_s2_u04_l02.html", "code": "g12_s2_u04_l02", "sections": {"focus": "物质在发生变化时，常常会伴随一些现象，这些现象可以帮助我们区别和判断物质发生了怎样的变化。\n下面这些物质发生了什么变化？我们能在变化中观察到哪些现象", "exploration": "观察有气体产生的变化。\n活动手册准备六个塑料瓶盖，把它们分为两组，每组三个瓶盖。在每组的第一组三个瓶盖中，分别加人少量的白砂糖、食盐和小苏打。然后，在第一组的三个瓶盖中滴人水，在第二组第二组的三个瓶盖中加入白醋。观察哪一个瓶盖内有气泡产生。", "discussion": "1. 通过查阅资料，你知道小苏打和白醋混合产生的气体是什么吗？\n2. 这种气体有什么特点？和人类有什么关系？", "expansion": "", "frontier": "", "big_concept": "无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！", "misconception": ""}, "figures": ["p61.webp", "p62.webp"], "raw_text": "### [第 61 页]\n\n![第 61 页教学插图与实验活动](figures/p61.png)\n\n## 2. 产生气体的变化\n\n\n产生气体的变化\n\n#### 🎯 聚焦物质在发生变化时，常常会伴随一些现象，这些现象可以帮助我们区别和判断物质发生了怎样的变化。\n下面这些物质发生了什么变化？我们能在变化中观察到哪些现象\n\n#### 🔬 探索观察有气体产生的变化。\n活动手册准备六个塑料瓶盖，把它们分为两组，每组三个瓶盖。在每组的第一组三个瓶盖中，分别加人少量的白砂糖、食盐和小苏打。然后，在第一组的三个瓶盖中滴人水，在第二组第二组的三个瓶盖中加入白醋。观察哪一个瓶盖内有气泡产生。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿化学与材料科学（高性能碳纤维与海水淡化反渗透膜）**：我国自主研发的T1000级超高强度碳纤维被称为‘新材料之王’，比铝还轻但强度比钢高数倍；先进聚酰胺反渗透膜孔径仅0.1纳米，高压迫使水分子穿透而将水合盐离子拦截，实现苦咸海水向纯净饮用水的瞬间转化！\n- 🧠 **跨学科大概念（物质形态与质量守恒定律）**：无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！\n- ⚠️ 常见前概念误区：“水蒸发或者蜡烛烧完了，物质就彻底消失了”。**科学真相**：物质绝不会凭空消失！蒸发的水分子逸散到了广袤的大气中形成看不见的水汽；蜡烛燃烧生成的二氧化碳气体和水蒸气扩散到了空气中，封闭体系称重会发现总质量分毫不差！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g12_s2_u04_l02.html)\n\n\n### [第 62 页]\n\n![第 62 页教学插图与实验活动](figures/p62.png)\n\n当把白醋滴入装有小苏打的瓶盖时，会有气体产生，这种气体是不同于小苏打和白醋的新物质，因此这种变化是化学变化。而在其他五个瓶盖中，发生的变化并没有新物质产生，这种变化是物理变化。\n2. 收集产生的气体。\n在上面的实验中，小苏打和白醋混合产生的气体都被释放到空气中了。你有办法收集这种气体吗？\n取一个能盛水的密封袋，在里面放人三勺白醋。在一个塑料瓶盖中加人一勺小苏打，再把它小心地放进密封袋中，注意不要让小苏打与白醋接触。先封好袋口，再打翻袋中的瓶盖，让小苏打与白醋混合，观察有什么现象发生。\n3. 进一步观察。\n日常生活中，还有一些物质可以和白醋产生气体，你能通过实验发现吗？\n白醋浸泡过的鸡蛋壳白醋浸泡过的贝壳\n\n#### 💬 研讨\n\n1. 通过查阅资料，你知道小苏打和白醋混合产生的气体是什么吗？\n2. 这种气体有什么特点？和人类有什么关系？"}, {"id": "sci_12_u04_l03", "lesson_idx": 256, "book": "六年级下册", "vol_dir": "12_六年级下册", "unit_no": 4, "unit_title": "物质的变化", "lesson_no": 3, "title": "发现变化中的新物质", "page": 63, "domain": "chemistry", "domain_cn": "物质变化与化学", "sim_file": "sim_g12_s2_u04_l03.html", "code": "g12_s2_u04_l03", "sections": {"focus": "化学变化是产生新物质的变化，你能通过实验发现新物质是怎么产生的吗？", "exploration": "活动手册蜡烛燃烧产生新物质。\n将一个透明的玻璃杯倒扣在蜡烛上，注意玻璃杯需要悬空，不能把蜡烛封闭。观察玻璃杯内壁的变化。\n用试管夹夹住一块玻璃片与蜡烛火焰短暂接触，注意不要被烫伤，观察玻璃片的变化。\n蜡烛燃烧在蜡烛上方倒扣玻璃杯，玻璃片接触火焰，有炭杯内壁出现水雾黑产生通过上面的实验，我们可以发现，蜡烛燃烧不但会发出光和热，还会产生水、炭黑等新物质。\n加热白砂糖产生新物质。\n向金属勺中加人少量白砂糖，在点燃的蜡烛上加热，观察白砂糖的变化开始加热②白砂糖熔化变黄③白砂糖变黑并冒烟", "discussion": "哪些变化产生的新物质对我们的生活有益？哪些变化产生的新物质对我们的生活有害？你能列举几个这样的事例吗？\n酸雨导致的后果", "expansion": "", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p63.webp", "p64.webp", "p65.webp"], "raw_text": "### [第 63 页]\n\n![第 63 页教学插图与实验活动](figures/p63.png)\n\n## 3. 发现变化中的新物质\n\n\n发现变化中的新物质\n\n#### 🎯 聚焦化学变化是产生新物质的变化，你能通过实验发现新物质是怎么产生的吗？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g12_s2_u04_l03.html)\n\n\n### [第 64 页]\n\n![第 64 页教学插图与实验活动](figures/p64.png)\n\n#### 🔬 探索活动手册蜡烛燃烧产生新物质。\n将一个透明的玻璃杯倒扣在蜡烛上，注意玻璃杯需要悬空，不能把蜡烛封闭。观察玻璃杯内壁的变化。\n用试管夹夹住一块玻璃片与蜡烛火焰短暂接触，注意不要被烫伤，观察玻璃片的变化。\n蜡烛燃烧在蜡烛上方倒扣玻璃杯，玻璃片接触火焰，有炭杯内壁出现水雾黑产生通过上面的实验，我们可以发现，蜡烛燃烧不但会发出光和热，还会产生水、炭黑等新物质。\n加热白砂糖产生新物质。\n向金属勺中加人少量白砂糖，在点燃的蜡烛上加热，观察白砂糖的变化开始加热②白砂糖熔化变黄③白砂糖变黑并冒烟\n\n### [第 65 页]\n\n![第 65 页教学插图与实验活动](figures/p65.png)\n\n在加热过程中，白砂糖首先会熔化，这是物理变化。但很快白砂糖颜色会变黄，然后越来越深，这是因为在加热过程中产生了有颜色的新物质。最后白砂糖变成了黑色的固体物质，我们也会闻到特殊的气味。黑色的固体是新物质，气味是散发到空气中的新物质。\n发现更多产生新物质的变化。\n物质变化中产生的新物质无处不在，你能发现它们吗？\n钢铁生锈用面粉烘制蛋糕社\n\n#### 💬 研讨哪些变化产生的新物质对我们的生活有益？哪些变化产生的新物质对我们的生活有害？你能列举几个这样的事例吗？\n酸雨导致的后果"}, {"id": "sci_12_u04_l04", "lesson_idx": 257 地球家园的化学变化", "page": 68, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g12_s2_u04_l05.html", "code": "g12_s2_u04_l05", "sections": {"focus": "我们生活的地球家园，每时每刻都在发生着化学变化。正是这些化学变化，给予了人类生存所需要的各种物质和条件。\n地球家园中有哪些主要的化学变化呢？\n文育科", "exploration": "各种矿石大地之下的化学变化。\n我们生活的大地蕴藏着许多宝藏。有各种矿物，可以用来冶炼不同的金属；有许多美丽珍贵的宝石，可以装点我们的生活；还有煤炭、石油等可以给我们提供能源。这些宝藏，并不是在一开始就存在的，而是经历了亿万年的许多变化才形成的。\n各种宝石", "discussion": "1. 我们怎么判断煤的形成过程经历了化学变化？\n2. 我们为什么要保护森林？\n3. 我们还能举出哪些身边的例子说明它们和化学变化有关？", "expansion": "", "frontier": "", "big_concept": "地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。", "misconception": ""}, "figures": ["p68.webp", "p69.webp", "p70.webp"], "raw_text": "### [第 68 页]\n\n![第 68 页教学插图与实验活动](figures/p68.png)\n\n## 5. 地球家园的化学变化\n\n\n地球家园的化学变化\n\n#### 🎯 聚焦我们生活的地球家园，每时每刻都在发生着化学变化。正是这些化学变化，给予了人类生存所需要的各种物质和条件。\n地球家园中有哪些主要的化学变化呢？\n文育科\n\n#### 🔬 探索各种矿石大地之下的化学变化。\n我们生活的大地蕴藏着许多宝藏。有各种矿物，可以用来冶炼不同的金属；有许多美丽珍贵的宝石，可以装点我们的生活；还有煤炭、石油等可以给我们提供能源。这些宝藏，并不是在一开始就存在的，而是经历了亿万年的许多变化才形成的。\n各种宝石\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿地球科学（深地探测与“奋斗者”号深潜）**：我国“深地一号”油气钻井已穿透地下万米白垩系地层，结合地震波断层成像技术，科学家如同给地球做“超声波CT”，实时洞察地壳构造板块运动与深部地幔热柱对流！\n- 🧠 **跨学科大概念（稳定与变化 / 因果机制）**：地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。\n- ⚠️ 小学生常认为“岩石是永恒不变、坚不可摧的”。**科学真相**：在水、大气、温度变化以及植物根系分泌酸的作用下，岩石在持续发生物理风化与化学侵蚀，并在地质循环中重熔为岩浆或沉积为土壤，地表始终在缓慢而剧烈地重塑。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g12_s2_u04_l05.html)\n\n\n### [第 69 页]\n\n![第 69 页教学插图与实验活动](figures/p69.png)\n\n让我们来仔细观察一块煤，看看能发现什么。\n活动手册我们常常能在煤有化石印迹的煤块块上看到植物的枝、叶等痕迹。有时候还能发现完整树干形状的煤。科学家们发现，煤田一般都位于远古时代森林茂密的地带。地底下发现的煤，一般都是位于煤层中。\n\n### [第 70 页]\n\n![第 70 页教学插图与实验活动](figures/p70.png)\n\n科学研究证实，在亿万年前，地球上生长着大片茂密的森林。在湖泊、沼泽等低洼地带，死亡的植物大量堆积，被泥沙层层掩埋。随着时间推移，有更多的泥沙堆积，更多的植物被掩埋。埋在深处的植物，在地底高温高压的环境下，慢慢变成了煤。\n2. 大气层中的化学变化。\n我们的呼吸离不开氧气。氧气占大气体积的约21%，大气中的氧气又是怎么来的呢？\n塑料早期地球的大气层中并没有氧气。\n燃油经过长时间的演变，氧气含量仍然很低。当绿色植物出现之后，地球的氧气含量逐步增加。\n绿色植物利用太阳能将二氧化碳与水转化为氧气和为生物提供能量的物质，增加了大气层中氧气的含量。\n纤维沥青石油的利用\n3. 资源利用与化学变化。\n石油是地球赋予人类的宝藏，它也是经历化学变化形成的。我们利用石油可以生产很多重要的生产生活材料。个子弘版从铁矿石里把铁冶炼出来，需要经过化学变化；用不同的原料合成药品，需要经历化学变化；农业上需要的化肥，也是通过化学变化过程制造的。\n\n#### 💬 研讨\n\n1. 我们怎么判断煤的形成过程经历了化学变化？\n2. 我们为什么要保护森林？\n3. 我们还能举出哪些身边的例子说明它们和化学变化有关？"}, {"id": "sci_12_u04_l06", "lesson_idx": 259, "book": "六年级下册", "vol_dir": "12_六年级下册", "unit_no": 4, "unit_title": "物质的变化", "lesson_no": 6, "title": "生命体中的化学变化", "page": 71, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g12_s2_u04_l06.html", "code": "g12_s2_u04_l06", "sections": {"focus": "在动植物包括我们人类的生命体内，每时每刻都发生着各种各样的变化，这些变化维系着我们的生命。\n我们的成长过程经历了哪些变化呢？", "exploration": "我们身体的变化。\n我们从婴儿长大成现在的样子，身体发生了哪些变化？\n我们的身体为什么能够发生这些变化呢？", "discussion": "1. 你还知道我们的身体中发生着哪些化学变化？\n2. 药物和食物中毒与化学变化有关吗？", "expansion": "", "frontier": "", "big_concept": "无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！", "misconception": ""}, "figures": ["p71.webp", "p72.webp"], "raw_text": "### [第 71 页]\n\n![第 71 页教学插图与实验活动](figures/p71.png)\n\n## 6. 生命体中的化学变化\n\n\n生命体中的化学变化\n\n#### 🎯 聚焦在动植物包括我们人类的生命体内，每时每刻都发生着各种各样的变化，这些变化维系着我们的生命。\n我们的成长过程经历了哪些变化呢？\n\n#### 🔬 探索我们身体的变化。\n我们从婴儿长大成现在的样子，身体发生了哪些变化？\n我们的身体为什么能够发生这些变化呢？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿化学与材料科学（高性能碳纤维与海水淡化反渗透膜）**：我国自主研发的T1000级超高强度碳纤维被称为‘新材料之王’，比铝还轻但强度比钢高数倍；先进聚酰胺反渗透膜孔径仅0.1纳米，高压迫使水分子穿透而将水合盐离子拦截，实现苦咸海水向纯净饮用水的瞬间转化！\n- 🧠 **跨学科大概念（物质形态与质量守恒定律）**：无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！\n- ⚠️ 常见前概念误区：“水蒸发或者蜡烛烧完了，物质就彻底消失了”。**科学真相**：物质绝不会凭空消失！蒸发的水分子逸散到了广袤的大气中形成看不见的水汽；蜡烛燃烧生成的二氧化碳气体和水蒸气扩散到了空气中，封闭体系称重会发现总质量分毫不差！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g12_s2_u04_l06.html)\n\n\n### [第 72 页]\n\n![第 72 页教学插图与实验活动](figures/p72.png)\n\n来自食物的能量和营养。\n食物具有能量。一些干燥的食物能够被点燃，说明食物蕴含着大量的能量，并且能够以燃烧的形式释放出来。\n食物被我们吃进体内后，并不是像燃烧那么简单地释放出能量，而是需要经历更复杂、更平稳的化学变化，才能转化为身体所需的能量。\n我们身体的生长也是一种化学我们反复咀嚼米饭或馒头，是不是能够感这就是睡液与变化，这种化学变化把食物中的营觉到它们变甜了？\n淀粉发生了化学变化。\n养物质转换成我们身体的一部分。\n3. 情绪也与化学变化有关。\n人有各种各样的情绪，有时候我们会开心，有时候我们会难过，甚至愤怒。情绪的产生非常复杂，但也与化学变化有关。\n科学研究发现，当我们特别积极地做某件事情时大脑中有一种物质可以让我们的心情变得愉快，这种物质是通过化学变化产生的。\n\n#### 💬 研讨\n\n1. 你还知道我们的身体中发生着哪些化学变化？\n2. 药物和食物中毒与化学变化有关吗？"}, {"id": "sci_12_u04_l07", "lesson_idx": 260, "book": "六年级下册", "vol_dir": "12_六年级下册", "unit_no": 4, "unit_title": "物质的变化", "lesson_no": 7, "title": "美丽的化学变化", "page": 73, "domain": "chemistry", "domain_cn": "物质变化与化学", "sim_file": "sim_g12_s2_u04_l07.html", "code": "g12_s2_u04_l07", "sections": {"focus": "化学变化产生的新物质可以让我们的生活变得更美好、更方便，化学变化本身也可以很美丽。我们观察过哪些美丽的化学变化？", "exploration": "感受化学变化的美丽。\n剪下两块紫甘蓝叶片，把它们分别浸泡在白醋和水中，观察并记录紫甘蓝颜色的变化。（为了让紫甘蓝能够完全浸没，可以在紫甘蓝表面压一片玻璃。）白醋水白醋水白醋水白醋水白醋水白醋水期水你认为紫甘蓝和白醋的反应是化学变化吗？这个变化美丽吗？\n1. 化学变化让我们的生活更美好。\n通过化学变化我们可以创造各种漂亮的色彩，美化我们的生活；\n可以生产药物，帮助我们恢复健康；可以制造矿泉水瓶，方便我们把饮用水带到很多地方。\n你能想到其他化学变化让我们的生活更美好的例子吗？", "discussion": "", "expansion": "", "frontier": "", "big_concept": "无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！", "misconception": ""}, "figures": ["p73.webp", "p74.webp", "p75.webp", "p76.webp"], "raw_text": "### [第 73 页]\n\n![第 73 页教学插图与实验活动](figures/p73.png)\n\n## 7. 美丽的化学变化\n\n\n美丽的化学变化\n\n#### 🎯 聚焦化学变化产生的新物质可以让我们的生活变得更美好、更方便，化学变化本身也可以很美丽。我们观察过哪些美丽的化学变化？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿化学与材料科学（高性能碳纤维与海水淡化反渗透膜）**：我国自主研发的T1000级超高强度碳纤维被称为‘新材料之王’，比铝还轻但强度比钢高数倍；先进聚酰胺反渗透膜孔径仅0.1纳米，高压迫使水分子穿透而将水合盐离子拦截，实现苦咸海水向纯净饮用水的瞬间转化！\n- 🧠 **跨学科大概念（物质形态与质量守恒定律）**：无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！\n- ⚠️ 常见前概念误区：“水蒸发或者蜡烛烧完了，物质就彻底消失了”。**科学真相**：物质绝不会凭空消失！蒸发的水分子逸散到了广袤的大气中形成看不见的水汽；蜡烛燃烧生成的二氧化碳气体和水蒸气扩散到了空气中，封闭体系称重会发现总质量分毫不差！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g12_s2_u04_l07.html)\n\n\n### [第 74 页]\n\n![第 74 页教学插图与实验活动](figures/p74.png)\n\n#### 🔬 探索感受化学变化的美丽。\n剪下两块紫甘蓝叶片，把它们分别浸泡在白醋和水中，观察并记录紫甘蓝颜色的变化。（为了让紫甘蓝能够完全浸没，可以在紫甘蓝表面压一片玻璃。）白醋水白醋水白醋水白醋水白醋水白醋水期水你认为紫甘蓝和白醋的反应是化学变化吗？这个变化美丽吗？\n1. 化学变化让我们的生活更美好。\n通过化学变化我们可以创造各种漂亮的色彩，美化我们的生活；\n可以生产药物，帮助我们恢复健康；可以制造矿泉水瓶，方便我们把饮用水带到很多地方。\n你能想到其他化学变化让我们的生活更美好的例子吗？\n\n### [第 75 页]\n\n![第 75 页教学插图与实验活动](figures/p75.png)\n\n关注我们的环境。\n塑料矿泉水瓶透明、轻便，而且不容易发生化学变化，是很好的材料。但如果它们被丢弃到环境中，会在环境中存在几百年，造成环境污染。因此我们要学会回收矿泉水瓶和其他塑料废物，减少对环境的污染。\n塑料矿泉水瓶和其他塑料废物造成的污染正确回收塑料矿泉水瓶我们对石油、煤、天然气等化石能源的广泛使用会产生大量二氧化碳气体，造成气候变化和海水酸化。酸化的海水会溶解贝类生物的外壳，造成贝类的死亡，破坏海洋中的生态平衡。为了解决这个问题，科学家正在利用化学变化，开发新的清洁能源，比如供电更持久的充电电池、更高效的太阳能电池等，为我们创建一个绿色的未来。\n本唐通过本单元的学习，你对物质的变化有哪些新的认识和体会？\n\n### [第 76 页]\n\n![第 76 页教学插图与实验活动](figures/p76.png)\n\n后记本套教科书在编写过程中，由郑永春、李金华、罗会仟、梁琰、张劲硕、史军、李实、张智慧、魏科、杨蔚、唐自华、张金海等组成的科学家团队参与了编写和讨论，提出了许多宝责的修改建议；\n浙江、山西、吉林、天津、广东、河南、北京、辽宁、湖北等9个省（市）的51所学校参与了试教工作，保证了教科书的适切性。在此表示诚挚的感谢！\n编者2018. 年12月教育科学云。班级姓名学号"}], "master_simulations": [{"file": "circuit_sandbox.html", "title": "闭合回路与电路沙盒", "domain": "physics", "domain_cn": "物质科学", "desc": "电池、灯泡、开关、导线自由组装电路，实时呈现闭合回路电流仿真。"}, {"file": "pendulum_lab.html", "title": "单摆周期与等时性受控实验", "domain": "physics", "domain_cn": "物质科学", "desc": "伽利略单摆受控实验，自主调节摆长、摆锤质量与摆幅，探究影响单摆周期的决定因素。"}, {"file": "virtual_microscope.html", "title": "高倍虚拟光学显微镜", "domain": "biology", "domain_cn": "生命科学", "desc": "目镜、物镜倍率切换，粗细准焦螺旋调节，洋葱表皮细胞与水中微小生物微观世界交互观察。"}, {"file": "buoyancy_boat_lab.html", "title": "浮力与橡皮泥造船工程", "domain": "physics", "domain_cn": "物质科学", "desc": "阿基米德浮力定律与排水量仿真，捏造不同船型测试载重量与沉浮稳定性。"}, {"file": "mechanics_lever.html", "title": "杠杆平衡与力矩力臂探究", "domain": "physics", "domain_cn": "物质科学", "desc": "支点、用力点、阻力点力矩计算，实时模拟省力杠杆、费力杠杆与等臂天平的受力平衡。"}, {"file": "optics_light_lab.html", "title": "光的反射定律与潜望镜光路", "domain": "physics", "domain_cn": "物质科学", "desc": "入射角等于反射角动态激光光路模拟，自由转动双平面镜搭建真实潜望镜。"}, {"file": "optics_prism_lab.html", "title": "牛顿三棱镜七彩色散光具座", "domain": "physics", "domain_cn": "物质科学", "desc": "白光经三棱镜发生色散分解为红橙黄绿蓝靛紫七色光谱，凸透镜成像规律仿真。"}, {"file": "solar_system_gravity.html", "title": "牛顿大炮与卫星轨道引力场", "domain": "earth", "domain_cn": "地球与宇宙", "desc": "八大行星引力场与卫星环绕轨道受控模拟，发射速度与椭圆轨道动力学。"}, {"file": "space_eclipse_constellation_lab.html", "title": "日食月食本影全景与四季星空", "domain": "earth", "domain_cn": "地球与宇宙", "desc": "地日月三球空间相对位置、日食月食本影半影视差与北斗七星四季星斗旋转。"}, {"file": "tower_engineering_lab.html", "title": "塔台结构工程力学与抗风抗震", "domain": "tech", "domain_cn": "技术与工程", "desc": "三角形稳固框架、重心高度控制与地震台震动测试，体验小小工程师塔台建造全流程。"}, {"file": "acoustics_oscilloscope.html", "title": "声波与频率示波器", "domain": "physics",
