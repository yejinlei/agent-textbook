态的，并尝试解释黄土高原地形地貌的成因。\n通过对长江地形特点的研究，说一说河流会给地表带来哪些改变。\n③我们的模拟实验主要模拟了河流的哪个河段？结合长江上、中、下游的特点，说一说理由。\n\n#### 🚀 拓展长江和黄河是我国最主要的两大河流，是中华民族的“母亲河”，也是世界著名大河。试着在地球仪上找到长江、黄河的位置。查阅资料，说一说长江和黄河分别有哪些特点。\n长江和黄河的有关资料河流名称发源地河水中注入的两岸主要河流长度泥沙特点海域名称农作物类型长江黄河教育科学"}, {"id": "sci_09_u04_l07", "lesson_idx": 176, "book": "五年级上册", "vol_dir": "09_五年级上册", "unit_no": 4, "unit_title": "第四单元地球表面的变化", "lesson_no": 7, "title": "风对地表的作用", "page": 122, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g09_s1_u04_l07.html", "code": "g09_s1_u04_l07", "sections": {"focus": "风给地表带来哪些改变？\n雅丹地貌在干早地区，风力侵蚀基岩、河流或湖泊沉积物形成的流线型突起地貌，被称为雅丹地貌。", "exploration": "了解风对地表的改变。\n观察图片中风的作用产物，描述其地貌特点。\n强劲的风沙是风蚀蘑菇形成的主要原因。\n由于近地面的气流含沙量大，孤突的岩石下部受到风沙的磨蚀比上部严重，下部就会越变越小，形成上大下小的蘑风蚀蘑菇菇状。\n沙漠放月州子公戈壁", "discussion": "风的作用给地表带来什么样的改变？举例说明。\n②对于地表的改变，风的作用与水的作用相比，有什么异同艺而风和水的作团与地震、火出喷发的作用相比，又有什么鼻同？片发个", "expansion": "西部大开发是我国实施的重大战略决策。我国重视对生态环境的保护，实施了中西部退耕还林还草和生态建设及种苗工程，投资了用于水土流失严重和生态环境恶劣地区的生态综合治理工程。搜集相关资料，了解我国西部的主要资源、主要环境问题以及国家采取的保护措施，将搜集到的信息与同学交流分享。", "frontier": "", "big_concept": "地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。", "misconception": ""}, "figures": ["p122.webp", "p123.webp", "p124.webp", "p125.webp", "p126.webp", "p127.webp", "p128.webp", "p129.webp", "p130.webp", "p131.webp"], "raw_text": "### [第 122 页]\n\n![第 122 页教学插图与实验活动](figures/p122.png)\n\n## 7. 风对地表的作用\n\n\n风对地表的作用风和流水类似，通过侵蚀和沉积塑造若地表的形态，甚至在缺少流水的地方，风还可能成为侵蚀的主力\n\n#### 🎯 聚焦风给地表带来哪些改变？\n雅丹地貌在干早地区，风力侵蚀基岩、河流或湖泊沉积物形成的流线型突起地貌，被称为雅丹地貌。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿地球科学（深地探测与“奋斗者”号深潜）**：我国“深地一号”油气钻井已穿透地下万米白垩系地层，结合地震波断层成像技术，科学家如同给地球做“超声波CT”，实时洞察地壳构造板块运动与深部地幔热柱对流！\n- 🧠 **跨学科大概念（稳定与变化 / 因果机制）**：地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。\n- ⚠️ 小学生常认为“岩石是永恒不变、坚不可摧的”。**科学真相**：在水、大气、温度变化以及植物根系分泌酸的作用下，岩石在持续发生物理风化与化学侵蚀，并在地质循环中重熔为岩浆或沉积为土壤，地表始终在缓慢而剧烈地重塑。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g09_s1_u04_l07.html)\n\n\n### [第 123 页]\n\n![第 123 页教学插图与实验活动](figures/p123.png)\n\n#### 🔬 探索了解风对地表的改变。\n观察图片中风的作用产物，描述其地貌特点。\n强劲的风沙是风蚀蘑菇形成的主要原因。\n由于近地面的气流含沙量大，孤突的岩石下部受到风沙的磨蚀比上部严重，下部就会越变越小，形成上大下小的蘑风蚀蘑菇菇状。\n沙漠放月州子公戈壁\n\n### [第 124 页]\n\n![第 124 页教学插图与实验活动](figures/p124.png)\n\n·沙漠和戈壁又是怎样形成的？做风对地表的作用模拟实验，检验我们的想法，观察实验现象并记录。\n0. 安全提醒用电吹风对准由沙和小石砾组成的沙堆，向沙堆吹风。\n佩戴好护目镜，防止沙子吹入眼睛。\n也可以用吸管对准由沙和小石砾组成的沙堆，通过吸管向沙堆吹气。\n吹风观察现象\n\n#### 📝 记录单风对地表的作用模拟实验叙日期实验方法观察到的现象我的解释\n\n### [第 125 页]\n\n![第 125 页教学插图与实验活动](figures/p125.png)\n\n2. 根据本单元的学习，绘制一张示意图，反映对地球表面形态的改变产生影响的各种因素及其相互关系。\n我们的认识与这幅图一样吗？\n太阳隆水山晴度蒸发尊小鸟地壳\n\n#### 💬 研讨风的作用给地表带来什么样的改变？举例说明。\n②对于地表的改变，风的作用与水的作用相比，有什么异同艺而风和水的作团与地震、火出喷发的作用相比，又有什么鼻同？片发个\n\n#### 🚀 拓展西部大开发是我国实施的重大战略决策。我国重视对生态环境的保护，实施了中西部退耕还林还草和生态建设及种苗工程，投资了用于水土流失严重和生态环境恶劣地区的生态综合治理工程。搜集相关资料，了解我国西部的主要资源、主要环境问题以及国家采取的保护措施，将搜集到的信息与同学交流分享。\n\n### [第 126 页]\n\n![第 126 页教学插图与实验活动](figures/p126.png)\n\n#### 📋 单元小结地球表面的变化内部外部因素因素地震火山喷发太阳能水的作用风的作用生物作用剧烈的改变缓慢的改变地球是一个由不同圈层组成的系统，外部由大气圈、水圈和生物圈组成，内部包括地壳、地慢和地核，地壳和地慢的一部分组成了岩石圈。不同圈层之间存在着相互作用，地球表面的形态正是在大气、水、生物和地球内部运动的共同作用下形成的。来自地球内部的力量，如地震、火山喷发等带来的变化更为迅猛；而来自外部的力量，如水、风等带来的变化则是一个缓慢的过程，需要很长时间我的收获评价内容评价等级我知道地球表面形态是地震、火山喷发、水、风等内外因素共同怎样改进呢？\n作用的结果我会通过模拟实验、查阅资料等方法解释火山、地震的成因官☆言我会制作地球内部的圈层结构模型我会用多种方法观察、描述岩石的特征我对地球表面变化的原因有极大的兴趣\n\n### [第 127 页]\n\n![第 127 页教学插图与实验活动](figures/p127.png)\n\n#### 📖 科学阅读冰川与海浪的侵蚀地质学家把在地表缓慢移动的大冰体称作冰川。在我国的西藏、新疆等地，我们都可以看到巍峨高耸的雪山和冰川，可是你知道吗？冰川也会改变地形地貌。\n虽然冰川的移动很缓慢，但冰的重量能把冰川下面的岩石压碎，并把它们冻结在冰川底部。冰川移动时，这些岩石碎块会磨蚀、挖掘下面的岩层，削尖山峰和山脊，形成斗状、碗状的洼地，U形的山谷，冰川湖，以及角峰和刃脊等各种地形。\n冰川在移动的过程中，沿途还会卷带大量的岩石。当冰川融化时，它带来的碎屑物将堆积下来，形成各种各样的堆积地形。\n科子出海面上风吹起的波浪也是有能量的，有时能量很大，能把岸边的岩石撞击出裂缝，时间一久，裂缝不断加大，最后岩石破碎。\n海浪还会掀起沙和砾石等沉积物，随着海浪向前运动，拍打并磨蚀岸边的岩石，洞穴、悬崖、拱桥和石柱等地形就形成了。一些规模巨大的湖泊中的波浪也有类似的作用。\n\n### [第 128 页]\n\n![第 128 页教学插图与实验活动](figures/p128.png)\n\n是什么力量塑造了黄土高原你知道吗？黄土高原是来自西北的大风吹出来的！冬春季节，从黄土高原逆风而行，当脚下的土变成了沙子，那你就已经进人沙漠了。如果继续往前行，你会看到越来越多的石头，这就是戈壁。远处，河流从高山上奔流而来，裹挟的石块、泥沙在山口突然散开，像一把扇子铺在山脚。千万年来，呼啸的西北风就是从这里把细小的颗粒吹走。地面跳着移动的颗粒在近处堆成了沙漠，半空中飞扬的颗粒就在沙漠外围形成了壮观的黄土高原。\n夏秋季节的降雨滋养了黄土高原的生灵，也雕刻了高原表面的形态。雨水在地表汇成溪流，挟带着黄土汇人黄河，在黄土高原留下不计其数的沟壑。\n离开黄土高原，黄河的流速减慢，泥沙逐渐淤积下来。日积月累，淤积的泥沙改变了地形，使得黄河改变了流向。来自黄土高原的泥沙沿新的河道堆积，先前的河道成了冲积平原的一部分。在漫长的地质历史中，这种变化反复发生。\n黄土和黄河对土壤深厚的华北平原的形成作出了贡献。\n黄土高原\n\n### [第 129 页]\n\n![第 129 页教学插图与实验活动](figures/p129.png)\n\n岩石与矿物矿物是大自然中产生的固态无生命物质，也是大部分岩石的基本组成部分。\n每一种矿物都有自己的化学成分及结构。有的岩石主要是由单一种类矿物组成的，如石英岩；有的是由多种矿物组成的，如花岗岩。科学家通过对矿物成分进行研究，了解关于地球的重要信息。\n地质学家已经辨识出地球上数千种不同的矿物，如石盐、石膏、金刚石、石墨等。矿物有各种各样的颜色、形状及质地，也有很多不同的用途。\n石盐石膏金刚石石墨性状：粒状或块状，性状：板状，白色、性状：八面体或六性状：片状或板状多为立方晶体，无浅灰或无色透明，面体，无色透明，等，铁黑色，不透明，色透明或浅灰、浅玻璃光泽或丝绢光晶面呈金刚光泽，条痕黑灰色，强金蓝等色，玻璃光泽，泽，性脆，指甲可最硬，性脆。\n属光泽或光泽暗淡，味成，性腿，易溶以刻画、骏轻。\n尚铁，有滑感于水用途：用角制水泥还用于钻探研日导燕友时尚温用途：P全要用子食制作模型、塑像，磨、切割玻璃和制性良好。\n用和防腐，还能制还用于医疗手术等。\n造激光器等。\n用途：可用于制造取纯碱、烧碱、盐电极、铅笔芯、防酸等。\n铸涂料等。\n矿物名片\n\n### [第 130 页]\n\n![第 130 页教学插图与实验活动](figures/p130.png)\n\n后记本套科学教科书由根据《义务教育科学课程标准（2022年版）》组织编写。编写团队由科研院所和高校的科学家、教育教学专家以及全国各地的优秀科学教师、教研员组成，周忠和院士与张红霞教授共同担任主编。\n编写过程中，我们得到了诸多科学家、教研员和一线教师的支持与帮助。\n李金华、张智慧、李博强、杨顺华、魏科、石承民、李实、张金海等为教科书编写提供了专业审查和咨询意见，高伟组织并参与编写了“制作天文望远镜”等单元。此外，还有很多单位、专家和同仁为我们提供了审读、插图、资料等方面的支持和帮助。他们的参与为确保教科书内容的科学性、适切性提供了重要支撑，在此一并表示诚挚谢意！\n我们真诚地欢迎广大师生和社会各界人士对教科书提出宝贵意见，帮助我们共同打造墙根铸魂、启智增慧的精品教材。子出片反不土电子邮箱：science@esph.com.cn\n\n### [第 131 页]\n\n![第 131 页教学插图与实验活动](figures/p131.png)\n\n教育科学云限社。班级、姓名学号"}, {"id": "sci_10_u01_l01", "lesson_idx": 177, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 1, "unit_title": "第一单元生物与环境", "lesson_no": 1, "title": "种子发芽实验", "page": 2, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g10_s2_u01_l01.html", "code": "g10_s2_u01_l01", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "植物的每一处器官形态均是自然选择的精妙杰作——扁平叶片最大化受光面积，维管束导管利用水分子毛细吸力将矿物质逆重力泵送百米树梢，根系向地性确保了机械固定与深层水源汲取。", "misconception": ""}, "figures": ["p02.webp", "p03.webp"], "raw_text": "### [第 2 页]\n\n![第 2 页教学插图与实验活动](figures/p02.png)\n\n## 1. 种子发芽实验\n\n\n种子发芽实验许多植物的新生命是从种子发芽开始的。种子发芽需要哪些条件？用什么实验可以验证我们的想法？\n绿豆发芽是否是否一定一定需要水？需要土壤？\n1. 根据我们在一、二年级的种植经验，预测绿豆发芽所必需的条件。\n2. 选择一个我们认为可能是种子发芽所必需的条件，光、空气和温度等是不是也是必设计一个实验来验证。需的条件呢？\n3. 根据小组的讨论确定研究在实验中只能改变方案，并写出实验计划。我们选择的那个条件，同时保证其他条件不变。\n绿豆种子发芽和土壤的关系实验计划日期：\n研究的问题：绿豆种子必须在土壤里才能发芽吗？\n预测：绿豆种子必须在土壤里才能发芽。\n相同的条件：温度、水、大小相同的绿豆种子各3粒。\n不同的条件：提供土壤和不提供土壤。\n实验的方法：1号组种子种在土壤里，保持湿润；2号组种子不提供土壤，也保持湿润。这个实验至少要有两个小组同时进行。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿生物工程（太空诱变育种与人工合成淀粉）**：中国空间站已成功开展水稻从种子到种子的全生命周期空间培养；中科院科研人员更在全球首次实现了从二氧化碳到淀粉的无细胞人工化学全合成，极大拓宽了光合作用的理论边界！\n- 🧠 **跨学科大概念（结构与功能相适应）**：植物的每一处器官形态均是自然选择的精妙杰作——扁平叶片最大化受光面积，维管束导管利用水分子毛细吸力将矿物质逆重力泵送百米树梢，根系向地性确保了机械固定与深层水源汲取。\n- ⚠️ 许多小学生认为“植物生长所需要的泥土全部被植物‘吃’进了肚子里”。**科学真相**：经典的凡·海尔蒙特柳树实验表明，植物增重的绝大部分干物质并非来自土壤，而是通过光合作用“抓取”空气中的二氧化碳分子同化而成的有机碳链！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u01_l01.html)\n\n\n### [第 3 页]\n\n![第 3 页教学插图与实验活动](figures/p03.png)\n\n4. 准备好实验所需要的材料，根据下面的方法进行操作。别忘了给玻璃皿编号。\n1. 准备两个玻璃皿 2 在其中一个玻璃皿里铺上一层土壤，另一个不铺\n3. 在两个玻璃皿里各放3粒绿豆 4 定期给两个玻璃皿浇同样多的水\n5. 坚持每天观察种子的变化，把观察到的现象记录下来。\n绿豆种子发芽和土壤的关系（班级记录表）日期：科学词汇种子的变化对比实验日期\n1. 号组（在土壤里）2号组（无土壤）月日月日月日月日\n1. 在实验中，我们为什么要设置两组进行对比？为什么要在每一个玻璃皿中放3粒种子？\n2. 在实验中，我们观察到的什么现象能验证我们的预测？\n3. 对于种子发芽必需的其他条件，我们可以怎样制订实验计划？"}, {"id": "sci_10_u01_l02", "lesson_idx": 178, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 1, "unit_title": "第一单元生物与环境", "lesson_no": 2, "title": "比较种子发芽实验", "page": 4, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g10_s2_u01_l02.html", "code": "g10_s2_u01_l02", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "植物的每一处器官形态均是自然选择的精妙杰作——扁平叶片最大化受光面积，维管束导管利用水分子毛细吸力将矿物质逆重力泵送百米树梢，根系向地性确保了机械固定与深层水源汲取。", "misconception": ""}, "figures": ["p04.webp", "p05.webp"], "raw_text": "### [第 4 页]\n\n![第 4 页教学插图与实验活动](figures/p04.png)\n\n## 2. 比较种子发芽实验\n\n\n比较种子发芽实验观察实验中的种子发芽情况，我们有了什么发现？比较各组的实验结果，我们又发现了什么？\n1. 分析我们在实验中收集绿豆种子发芽是否需要土壤的实验记录表到的数据，整理我们的日期：\n发现。种子已发未发我们的解释\n2. 和做相同实验的小组分总数芽数芽数享和交流。1号组（在土壤里）收集其他实验小组的数\n2. 号组（无据，分析并得出结论。看看土壤）和实验前的预测是否一致。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿生物工程（太空诱变育种与人工合成淀粉）**：中国空间站已成功开展水稻从种子到种子的全生命周期空间培养；中科院科研人员更在全球首次实现了从二氧化碳到淀粉的无细胞人工化学全合成，极大拓宽了光合作用的理论边界！\n- 🧠 **跨学科大概念（结构与功能相适应）**：植物的每一处器官形态均是自然选择的精妙杰作——扁平叶片最大化受光面积，维管束导管利用水分子毛细吸力将矿物质逆重力泵送百米树梢，根系向地性确保了机械固定与深层水源汲取。\n- ⚠️ 许多小学生认为“植物生长所需要的泥土全部被植物‘吃’进了肚子里”。**科学真相**：经典的凡·海尔蒙特柳树实验表明，植物增重的绝大部分干物质并非来自土壤，而是通过光合作用“抓取”空气中的二氧化碳分子同化而成的有机碳链！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u01_l02.html)\n\n\n### [第 5 页]\n\n![第 5 页教学插图与实验活动](figures/p05.png)\n\n3. 和做不同实验的小组分享和交流。\n了解他们的发现，看看他们是怎样用实验数据来解释结果的。\n放在冰箱里常温下绿豆种子发芽是否需要适宜温度的实验记录表日期：\n种子已发未发我们的总数芽数芽数解释\n1. 号组（18℃）18 16 2改变温度的条件 2号组（4℃）18 1 17绿豆种子发芽是否需要光的实验记录表日期：\n种子已发未发我们的总数芽数芽数解释\n1. 号组（有光）24 24 0改变光照的条件\n2. 号组（无光）24 24 0\n4. 查阅资料，进一步确认种子发芽需要的条件。\n5. 把实验中已经发芽的绿豆种子移植到花盆里，放到合适的地方，让绿豆芽生长一段时间。预测哪些条件会影响绿豆芽的生长。\n1. 实验结论和我们实验前的预测一致吗？我们怎样用实验中的数据来解释实验结果？\n2. 根据全班同学的实验结果，我们可以总结出绿豆种子发芽需要哪些条件呢？"}, {"id": "sci_10_u01_l03", "lesson_idx": 179, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 1, "unit_title": "第一单元生物与环境", "lesson_no": 3, "title": "绿豆苗的生长", "page": 6, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g10_s2_u01_l03.html", "code": "g10_s2_u01_l03", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "植物的每一处器官形态均是自然选择的精妙杰作——扁平叶片最大化受光面积，维管束导管利用水分子毛细吸力将矿物质逆重力泵送百米树梢，根系向地性确保了机械固定与深层水源汲取。", "misconception": ""}, "figures": ["p06.webp", "p07.webp"], "raw_text": "### [第 6 页]\n\n![第 6 页教学插图与实验活动](figures/p06.png)\n\n## 3. 绿豆苗的生长\n\n\n绿豆苗的生长绿豆种子发芽可以不需要阳光，绿豆苗的生长需要阳光吗？光对植物的生长起什么作用？\n科学词汇设计实验来研究绿豆苗的生长是否需要阳光。\n光合作用 1 思考讨论：我们要改变哪些条件？不改变哪些条件？\n绿豆苗的生长是否需要阳光的实验计划研究的问题：绿豆苗的生长是否需要阳光预测：绿豆苗的生长需要阳光。\n实验的方法：保持其他条件相同，把一盆绿豆苗放在阳光充足的地方，一盆放在黑暗的地方。\n我们要改变的条件：光照。\n我们不改变的条件：水、温度。\n2. 观察并记录：一个星期以后，两个花盆里的绿豆苗发生了什么样的变化？\n绿豆苗生长是否需要阳光的实验记录表日期：\n高度茎、叶的颜色茎的粗细我们的解释阳光下的绿豆苗黑暗处的绿豆苗\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿生物工程（太空诱变育种与人工合成淀粉）**：中国空间站已成功开展水稻从种子到种子的全生命周期空间培养；中科院科研人员更在全球首次实现了从二氧化碳到淀粉的无细胞人工化学全合成，极大拓宽了光合作用的理论边界！\n- 🧠 **跨学科大概念（结构与功能相适应）**：植物的每一处器官形态均是自然选择的精妙杰作——扁平叶片最大化受光面积，维管束导管利用水分子毛细吸力将矿物质逆重力泵送百米树梢，根系向地性确保了机械固定与深层水源汲取。\n- ⚠️ 许多小学生认为“植物生长所需要的泥土全部被植物‘吃’进了肚子里”。**科学真相**：经典的凡·海尔蒙特柳树实验表明，植物增重的绝大部分干物质并非来自土壤，而是通过光合作用“抓取”空气中的二氧化碳分子同化而成的有机碳链！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u01_l03.html)\n\n\n### [第 7 页]\n\n![第 7 页教学插图与实验活动](figures/p07.png)\n\n3. 阅读下面的资料。\n空气是一种混合物，氮气和氧气是空气的主要成分。在光照条件下，植物吸收空气中的二氧化碳水和水分，在绿色叶片中制二氧化碳造生存所需的养料，并释氧气放出氧气。养料\n1. 绿豆苗的生长需要阳光吗？光对植物生长起着什么作用？\n2. 为了使绿豆苗生长得更好，我们还需要做什么？我们可以怎样制订计划并通过实验来验证？\n3. 不同环境里的植物对阳光、水分等条件的需求相同吗？\n等绿豆苗再长大一些，将绿豆苗进行分盆或者将绿豆苗移栽到学校的植物园里。\n准备两个一面敞开的纸盒，一个在纸盒左壁挖个圆孔，一个在纸盒右壁挖个圆孔，使光能从圆孔中透入。将两盆绿豆芽或其他植物分别放在两个纸盒正中间，一个星期后，观察两盆植物的生长状况。"}, {"id": "sci_10_u01_l04", "lesson_idx": 180, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 1, "unit_title": "第一单元生物与环境", "lesson_no": 4, "title": "蚯蚓的选择", "page": 8, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g10_s2_u01_l04.html", "code": "g10_s2_u01_l04", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p08.webp", "p09.webp", "p10.webp"], "raw_text": "### [第 8 页]\n\n![第 8 页教学插图与实验活动](figures/p08.png)\n\n## 4. 蚯蚓的选择\n\n\n蚯蚓的选择我们在植物园里观察绿豆苗时发现了蚯蚓生活的痕迹。植物的生存需要一定的环境，动物也是这样吗？对于蚯蚓来说，适宜的生活环境是什么样的？\n1. 根据自己的经验推测蚯蚓适宜怎样的生活环境。\n蚯蚓生活在地怎样用实验下，我推测它喜来证明呢？\n欢黑暗的环境。\n实验中我们改变的是什么条件？没改变的又有哪些条件？\n干土里很难发现蚯蚓，我推测它不喜\n2. 观察实验中“蚯蚓的选择”。欢干燥的环境。\n（1）了解蚯蚓对光照的选择。\n找一个长方形的盒子，把盒子的里面涂成黑色，将盒盖的一端剪掉一块，在盒子底部铺上吸水纸。\n将蚯蚓10条一组放在盒子内黑暗与明亮的交界处，盖好盖子。5分钟以后，打开盒盖观察，做好记录。\n反复做几次，并记录下我们在实验中获得的信息。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u01_l04.html)\n\n\n### [第 9 页]\n\n![第 9 页教学插图与实验活动](figures/p09.png)\n\n蚯蚓会待在哪里呢？\n蚯蚓对光照的选择实验记录表日期：\n实验待在明亮一待在盒子中待在黑暗一我们的次数端的蚯蚓数间的蚯蚓数端的蚯蚓数解释（2）了解蚯蚓对干燥或潮湿环境的选择。\n找一个长方形的盒子，在盒子的两端分别铺上一层泥土，一端铺湿润的，一端铺干燥的。\n将蚯蚓10条一组放在盒子中间，盖好盖子。5分钟以后，打开盒盖观察，做好记录。\n反复做几次，并记录下我们在实验中获得的信息。\n蚯蚓对干燥或潮湿环境的选择实验记录表日期：\n实验待在干燥土壤待在盒子中待在湿润土壤我们的次数里的蚯蚓数间的蚯蚓数里的蚯蚓数解释我 1们 2小组 3其他组\n\n### [第 10 页]\n\n![第 10 页教学插图与实验活动](figures/p10.png)\n\n3. 整理从实验中获得的信息。\n蚯蚓的选择说我们小组的蚯明什么呢？\n蚓全部待在黑暗的一端。\n1. 适宜蚯蚓生活的环境具有什么特点？\n2. 你还知道哪些动物对环境的不同需求？\n青蛙企鹅天鹅蜥蜴狼"}, {"id": "sci_10_u01_l05", "lesson_idx": 181, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 1, "unit_title": "第一单元生物与环境", "lesson_no": 5, "title": "当环境改变了", "page": 11, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g10_s2_u01_l05.html", "code": "g10_s2_u01_l05", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p11.webp", "p12.webp"], "raw_text": "### [第 11 页]\n\n![第 11 页教学插图与实验活动](figures/p11.png)\n\n## 5. 当环境改变了\n\n\n当环境改变了在春天的田野里，我们能看见青蛙吗？它们在做什么？冬天它们到哪里去了？青蛙在不同的季节里会有哪些不同的行为？其他动物在环境改变时又会有哪些行为？\n1. 将青蛙的行为图片与环境图片相对应。\n春夏秋冬\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u01_l05.html)\n\n\n### [第 12 页]\n\n![第 12 页教学插图与实验活动](figures/p12.png)\n\n2. 将信息整理成表格。四季的田野记录表日期：\n3. 阅读下面的资料。季节气候草木蝴蝶青蛙丹顶鹤是有迁徙行为的鸟春温暖发芽由卵孵化成幼虫由卵孵化成蝌蚪类，需要洁净而开阔的湿地环境作为栖息地，对湿地环境变化夏非常敏感。每年春季，丹顶鹤会秋离开越冬的地方迁往东北的繁殖冬地。中途，它们还会在合适的地方做短暂的栖息。3月末4月初，当丹顶鹤到达繁殖地后不久，它们就会开始配对和筑巢。入秋后，因为气候、日照及食物等因素的变化，丹顶鹤又要从东北的繁殖地迁飞到温暖的南方越冬。\n为了保护好丹顶鹤以及它们的生存环境，我国在丹顶鹤等鹤类的繁殖区和越冬区建立了扎龙、向海、盐城等一批自丹顶鹤然保护区。\n1. 当环境发生改变时，青蛙会做出怎样的反应？青蛙的这种行为是为了适应哪些环境条件的改变？\n2. 当环境发生改变时，丹顶鹤会做出怎样的反应？丹顶鹤的这种行为是为了适应哪些环境条件的改变？\n3. 你还知道动物适应环境变化的哪些行为？\n如果在野外遇到正在冬眠的动物或迁徙途中“掉队”的鸟，我们可以如何帮助它们？"}, {"id": "sci_10_u01_l06", "lesson_idx": 182, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 1, "unit_title": "第一单元生物与环境", "lesson_no": 6, "title": "食物链和食物网", "page": 13, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g10_s2_u01_l06.html", "code": "g10_s2_u01_l06", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。", "misconception": ""}, "figures": ["p13.webp", "p14.webp", "p15.webp", "p16.webp"], "raw_text": "### [第 13 页]\n\n![第 13 页教学插图与实验活动](figures/p13.png)\n\n## 6. 食物链和食物网\n\n\n食物链和食物网小鸟蚜虫又会被谁吃掉？\n田野里的绿豆苗越长越大蚜虫从绿豆苗那了。在自然环境中，它们与周围里获得了什么？\n的生物会有什么联系呢？\n蚜虫落叶瓢虫蜘蛛小草蜗牛蟋蟀蚯蚓我们可以根据留下的活动痕迹推测生活在这里的动物。绿豆\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿古生物学与生态基因库（国家基因库与恐龙羽毛演化）**：我国热河生物群带羽毛恐龙（如中华龙鸟）化石的发现，无可辩驳地确立了“现代鸟类是由兽脚类恐龙演化而来”的里程碑定论；高通量基因测序技术更重构了全球物种生命树与食物网脆弱度阈值。\n- 🧠 **跨学科大概念（尺度与比例 / 生态位）**：生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。\n- ⚠️ 很多同学误以为“凶猛的肉食动物消灭弱小食草动物对大自然有害”。**科学真相**：顶级捕食者能控制食草动物种群数量以防止过度啃食植被草原（营养级联效应），捕食体弱病体反而促进了种群基因库的健康优化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u01_l06.html)\n\n\n### [第 14 页]\n\n![第 14 页教学插图与实验活动](figures/p14.png)\n\n1. 寻找并记录生活在绿豆苗周围的生物。\n2. 观察绿豆苗的生长状况，找找有没有被动物吃过的痕迹，推测是什么动物吃过绿豆苗。\n3. 讨论在绿豆苗丛中发现的动物，哪些会吃绿豆苗，它们又会被谁吃掉。\n食物是动物的必要需求，动物消耗食物而获得能量。\n有些动物既吃别的生物，自己也会被别的动物吃掉。我们一般用箭头表示食物链中“谁被谁吃”的关系。\n生物之间因为食物关系，构成很多的“链条”状的联系，像这样的食物关系，叫作食物链。\n4. 在绿豆苗生长的地方再找出几条食物链，用套筒游戏与同学交流食物链上生物之间的食物联系。\n\n### [第 15 页]\n\n![第 15 页教学插图与实验活动](figures/p15.png)\n\n5. 从绿豆苗与周围各种生物间找出更多的食物链，试着用箭头来表示它们之间的食物关系。外来物种可能破坏当地的食物网，不要随意释放或者丢弃科学词汇它们。\n食物链食物网这些生物之间因为食物关系而相互联系在一起，这种联系多像一张“网”啊！\n1. 绿豆苗和生活在它周围的生物间有着哪些食物关系？\n2. 绿豆苗生长所需的条件是怎样获得的？绿豆苗又为它周围的生物提供了哪些条件？\n3. 举例说明自然界的生物之间有着哪些食物关系。\n\n### [第 16 页]\n\n![第 16 页教学插图与实验活动](figures/p16.png)\n\n做模拟食物网的游戏\n1. 选择班里的2名同学作为“生物考察员”，将剩下的同学分成8～10组，每组同学分别扮演一种生物，共同用手握住一个圆环，思考在田野绿豆苗丛中能吃谁，又会被谁吃掉。\n2“生物考察员”将田野食物网里的几条食物链用“线”和“圆环”联结起来，形成“食物网”。\n3. 减少一种“生物”的数量或者去掉其中的一种“生物”，观察分析游戏中的“网”会发生什么变化，思考自己扮演的生物会不会受到影响。"}, {"id": "sci_10_u01_l07", "lesson_idx": 183, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 1, "unit_title": "第一单元生物与环境", "lesson_no": 7, "title": "设计和制作生态瓶", "page": 17, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g10_s2_u01_l07.html", "code": "g10_s2_u01_l07", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。", "misconception": ""}, "figures": ["p17.webp", "p18.webp", "p19.webp", "p20.webp"], "raw_text": "### [第 17 页]\n\n![第 17 页教学插图与实验活动](figures/p17.png)\n\n## 7. 设计和制作生态瓶\n\n\n设计和制作生态瓶绿豆苗和它周围的各种生物形成了一个群落。除了食物关系外，它们\n\n#### 💡 科学词汇之间还有什么关系？\n群落生态系统\n1. 观察绿豆苗周围的生物与非生群落里的各种生物与环境物，分析生物与生物之间、生物中的非生物相互联系、相互影与非生物之间的联系。响，构成了一个整体，我们把这个整体叫作生态系统。\n我们知道的生态系统（班级记录表）\n2. 模拟池塘生态系统设计一个生日期：态瓶。\n生态瓶设计方案绿豆苗日期：\n种类、数量草图生物非我们要让生态瓶里的各种生物生之间、生物与非生物之间相互物联系、相互影响，并达到平衡，让生物很好地生存下去。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿古生物学与生态基因库（国家基因库与恐龙羽毛演化）**：我国热河生物群带羽毛恐龙（如中华龙鸟）化石的发现，无可辩驳地确立了“现代鸟类是由兽脚类恐龙演化而来”的里程碑定论；高通量基因测序技术更重构了全球物种生命树与食物网脆弱度阈值。\n- 🧠 **跨学科大概念（尺度与比例 / 生态位）**：生物在特定生态系统中占据专属生态位。初级生产者捕获光能，初级与次级消费者逐级传递能量，分解者完成物质矿化循环，形成高度协同但又脆弱的食物网反馈回路。\n- ⚠️ 很多同学误以为“凶猛的肉食动物消灭弱小食草动物对大自然有害”。**科学真相**：顶级捕食者能控制食草动物种群数量以防止过度啃食植被草原（营养级联效应），捕食体弱病体反而促进了种群基因库的健康优化。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u01_l07.html)\n\n\n### [第 18 页]\n\n![第 18 页教学插图与实验活动](figures/p18.png)\n\n3. 制作生态瓶。我们还可以多制根据设计方案，让我们来制作一个生态瓶。作几个生态瓶来比较研究。\n1. 找一个大油桶，2 在桶底装入一层 3 在桶里种上几棵 4 植物存活后，再清洗干净后剪掉淘洗干净的沙，水草，在水面放放入少量的小上面一部分。再装入大半桶自一些浮萍。鱼、小虾、田螺然水域中的水。等小动物。\n生态瓶观察记录在生态系统日期：里，保护一种生物，就是保护了日期植物的情况动物的情况水的情况其他情况许多种生物；保护栖息地的环境，也就是保护了栖息地里的所有生物。\n1. 我们需要用到哪些材料来制作生态瓶？这些材料能够为在生态瓶里生活的生物提供哪些条件？\n2. 我们为什么这样设计生态瓶？\n3. 为了让生态瓶里的各种生物和谐地生存下去，我们应该注意什么？\n状态良好倒去一半水会怎的生态瓶样？如果拿掉部改变生态瓶里的生分水草或加入两条小鱼，又会出物数量和非生物条件，现什么现象？\n开展对比实验研究，观察生态瓶的变化。\n\n### [第 19 页]\n\n![第 19 页教学插图与实验活动](figures/p19.png)\n\n#### 📖 科学阅读东非动物大迁徙从每年的12月到第二年的5月，东非的食草动物们悠闲地生活在塞伦盖蒂国家公园的保护区内。这里有着丰美的水草，为它们提供了足够多的食物。\n从5月中后期开始，塞伦盖蒂国家公园就迎来了它的旱季，在这期间，公园的水草不能满足食草动物们的需求，所以食草动物们开始向塞伦盖蒂的西北面迁徙，只为追寻青草和水源。\n6. 月是东非动物的哺乳期，这时候，大量的小角马会诞生在迁徙途中，而大迁徙对这些小生命来说绝对是非常有难度的。\n到了7、8月，持续的干旱严重地威胁到动物们的生存，所以大量的动物纷纷渡过马拉河，来到马赛马拉国家公园，这样的情况会一直持续到9月。\n从10月份开始，塞伦盖蒂大草原会重新迎来雨季，在雨水的滋润下，草原开始返青。同时，面积只有塞伦盖蒂约十分之一的马赛马拉国家公园并不足以维持数量庞大的食草动物。所以，食草动物们又开始从东线南迁回塞伦盖蒂，整个过程大概持续一个月，要在12月才基本结束。\n12. 月，动物们回到了塞伦盖蒂大草原，开始繁衍后代、休养生息，为第二年做准备。\n\n### [第 20 页]\n\n![第 20 页教学插图与实验活动](figures/p20.png)\n\n船的研究船是人类的伟大发明。自从有了船，人们可以借助它在水面上自由、方便地行驶，还可以把很多货物运送到远方。\n人们是怎样造船的？造船的过程中需要用到哪些技术呢？让我们跟着船的历史去探索吧。"}, {"id": "sci_10_u02_l01", "lesson_idx": 184, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 2, "unit_title": "第二单元船的研究", "lesson_no": 1, "title": "船的历史", "page": 21, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g10_s2_u02_l01.html", "code": "g10_s2_u02_l01", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p21.webp", "p22.webp", "p23.webp"], "raw_text": "### [第 21 页]\n\n![第 21 页教学插图与实验活动](figures/p21.png)\n\n## 1. 船的历史\n\n\n船的历史船是生活中常见的运输工具，给人们的生活带来很多便利。关于船，你知道什么，还想研究什么？\n1. 交流我们知道的关于船的知识，并记录在班级记录表上。\n关于船的知识（班级记录表）日期：\n关于船的知识我们已经知道的我们还想研究的\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u02_l01.html)\n\n\n### [第 22 页]\n\n![第 22 页教学插图与实验活动](figures/p22.png)\n\n2. 观看船的发展历史图片，思考船的哪些方面发展了。\n独木舟帆船摇橹木船蒸汽船轮船潜艇\n\n### [第 23 页]\n\n![第 23 页教学插图与实验活动](figures/p23.png)\n\n船的比较日期：\n项目摇橹木船轮船体积船体材料动力\n3. 研究独木舟。\n把一根木条当作独木舟的模型。\n试一试，你的独木舟能稳定地负载一个物体吗？\n船在水中行驶时，会受到水的阻力。比一比，下面哪种形状的船受到的阻力小。\n1. 从船的发展历史中，你发现了哪些变化？\n2. 怎样让独木舟保持稳定而不侧翻？\n3. 怎样减小船在行驶中的阻力？"}, {"id": "sci_10_u02_l02", "lesson_idx": 185, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 2, "unit_title": "第二单元船的研究", "lesson_no": 2, "title": "用浮的材料造船", "page": 24, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g10_s2_u02_l02.html", "code": "g10_s2_u02_l02", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p24.webp", "p25.webp"], "raw_text": "### [第 24 页]\n\n![第 24 页教学插图与实验活动](figures/p24.png)\n\n## 2. 用浮的材料造船\n\n\n用浮的材料造船古人发现浮的材料可以造船。最早的独木舟就是人们利用可以漂浮的树干造出来的。但是，独木舟在水中不够稳定，装载的货物也有限，人们是怎么解决这个问题的呢？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u02_l02.html)\n\n\n### [第 25 页]\n\n![第 25 页教学插图与实验活动](figures/p25.png)\n\n1. 用几根竹竿或木条，做成一个竹筏或木排模型。\n要求：\n● ● 先画出设计图。\n● ● 能稳定地浮在水面。\n● ● 牢固、不散架。\n设计图样品\n2. 用螺母（或钩码）测试它们的载重量，观察能装载几个螺母。注意不能让水浸湿螺母。\n3. 与独木舟进行比较，看看它们有哪些不同。测试\n1. 竹筏与独木舟各有哪些优点？\n2. 竹筏与独木舟各有哪些不足之处？你打算继续改进自己怎样改进？的竹筏或木排。\n3. 观看下面的木船，你有什么发现？\n摇橹木船明代宝船的船体长达100多米"}, {"id": "sci_10_u02_l03", "lesson_idx": 186, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 2, "unit_title": "第二单元船的研究", "lesson_no": 3, "title": "用沉的材料造船", "page": 26, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g10_s2_u02_l03.html", "code": "g10_s2_u02_l03", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p26.webp", "p27.webp", "p28.webp"], "raw_text": "### [第 26 页]\n\n![第 26 页教学插图与实验活动](figures/p26.png)\n\n## 3. 用沉的材料造船\n\n\n用沉的材料造船有的材料在水中是浮的，有的材料在水中是沉的。浮的材料可以造船，沉的材料也可以造船吗？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u02_l03.html)\n\n\n### [第 27 页]\n\n![第 27 页教学插图与实验活动](figures/p27.png)\n\n1. 用在水中下沉的材料做船。\n橡皮泥和铝箔是在水中会下沉的材料，我们用它们来模拟造一艘船，让它们都能漂浮在水面上。\n2. 把船轻轻放入水中，测试橡皮泥船和铝箔船，看它们能否装载一定量的金属垫圈。\n\n#### 💡 科学词汇浮力橡皮泥和铝箔是在水中会下沉的材料，把它们做成船型后，它们在水中受到的浮力增大了，因而能更容易漂浮在水面上。\n随着技术的进步，钢铁也能造船。钢铁制造的船不但坚固，而且载重量也更大。\n\n### [第 28 页]\n\n![第 28 页教学插图与实验活动](figures/p28.png)\n\n1. 我们用了什么方法，让橡皮泥和铝箔漂浮在水面上？\n2. 为了让船型橡皮泥和铝箔稳定地漂浮在水面上，我们又用了什么方法？\n船在行驶中，稳定性十分重要，不然船就会侧翻，造成事故。\n渡船的底部特别宽阔双体帆船的稳定性大大提高"}, {"id": "sci_10_u02_l04", "lesson_idx": 187, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 2, "unit_title": "第二单元船的研究", "lesson_no": 4, "title": "增加船的载重量", "page": 29, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g10_s2_u02_l04.html", "code": "g10_s2_u02_l04", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p29.webp", "p30.webp"], "raw_text": "### [第 29 页]\n\n![第 29 页教学插图与实验活动](figures/p29.png)\n\n## 4. 增加船的载重量\n\n\n增加船的载重量随着社会的发展，人们需要越来越大的船来满足交通和运输货物的需要。\n造船的技术是怎样解决这个问题的呢？\n把铝箔做成船型容易漂浮在水面上。用边长12厘米的正方形铝箔做成不同底面积的船，比较它们的载重量。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u02_l04.html)\n\n\n### [第 30 页]\n\n![第 30 页教学插图与实验活动](figures/p30.png)\n\n1. 设计不同底面积的铝箔船。（单位：厘米）\n2. 根据设计，制作3艘铝箔船，分别计算它们的体积。\n3. 用弹珠或垫圈模拟货物，比较哪一艘船的载重量大。\n1. 船的载重量跟什么有关？\n2. 怎样提高船的载重量？\n弹珠会滚动，导致船容易侧翻，怎样解决这个问题？"}, {"id": "sci_10_u02_l05", "lesson_idx": 188, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 2, "unit_title": "第二单元船的研究", "lesson_no": 5, "title": "给船装上动力", "page": 31, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g10_s2_u02_l05.html", "code": "g10_s2_u02_l05", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p31.webp", "p32.webp"], "raw_text": "### [第 31 页]\n\n![第 31 页教学插图与实验活动](figures/p31.png)\n\n## 5. 给船装上动力\n\n\n给船装上动力最早的船靠人力行驶，随着船的体积越来越大，人力已经无法满足大船航行所需要的动力了。于是，人们逐步探索出了让船行驶的新方法，给船装上了新的动力。\n1. 试一试，给我们的船装上风帆，让它自己行驶。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u02_l05.html)\n\n\n### [第 32 页]\n\n![第 32 页教学插图与实验活动](figures/p32.png)\n\n2. 给小船装上其他动力，让它自己行驶起来。\n给小船装上风力推进装置给小船装上蒸汽推进装置\n3. 小船在行驶中容易偏离方向，如何让小船保持一定的方向？给它装上船舵试试看。\n船舵安装了船舵的小船\n1. 我们有哪些方法可以给船提供动力？潜艇\n2. 怎样解决动力的持续供应问题？潜艇是能够在水下航行的\n3. 如何让船的行驶保持一定的方向？船，种类很多，大小不同，形状各异。许多潜艇被设计成鱼类的身体形状，可以有效减小水的阻力。潜艇靠调节自身的重力和浮力的大小来下潜和上浮。常规的潜艇一般用柴油做动力。核潜艇的动力来自核能，它可以帮助潜艇在水下长时间地航行。"}, {"id": "sci_10_u02_l06", "lesson_idx": 189, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 2, "unit_title": "第二单元船的研究", "lesson_no": 6, "title": "设计我们的小船", "page": 33, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g10_s2_u02_l06.html", "code": "g10_s2_u02_l06", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p33.webp", "p34.webp"], "raw_text": "### [第 33 页]\n\n![第 33 页教学插图与实验活动](figures/p33.png)\n\n## 6. 设计我们的小船\n\n\n设计我们的小船根据所学的知识和提供的一些材料，发挥想象，自己设计并制作一艘小船。\n要求控制小船的制作成本，载重量达到200克，有自己的动力，能把货物运送到目的地。\n一些材料的参考价格材料名称参考价格材料名称参考价格泡沫板电池木板导线铝箔开关泡沫胶喷气装置小电动机纸张小风扇木条\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u02_l06.html)\n\n\n### [第 34 页]\n\n![第 34 页教学插图与实验活动](figures/p34.png)\n\n为了更好地完成任务，我们要先做好设计。\n1. 画出船的设计图，标注材料和结构。\n2. 讨论设计图的合理性和可靠性。\n3. 列出所需的材料，计算所需的费用。\n需要考虑的因素：\n• 船的大小• 船的形状• 船体材料• 载重量• 稳固性• 动力系统●交流我们的设计，说说设计的理由。●●相互提出改进建议。●●思考怎样用最少的费用造出一艘理想的船。●"}, {"id": "sci_10_u02_l07", "lesson_idx": 190, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 2, "unit_title": "第二单元船的研究", "lesson_no": 7, "title": "制作与测试我们的小船", "page": 35, "domain": "physics_mechanics", "domain_cn": "综合科学探究", "sim_file": "sim_g10_s2_u02_l07.html", "code": "g10_s2_u02_l07", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！", "misconception": ""}, "figures": ["p35.webp", "p36.webp", "p37.webp", "p38.webp"], "raw_text": "### [第 35 页]\n\n![第 35 页教学插图与实验活动](figures/p35.png)\n\n## 7. 制作与测试我们的小船\n\n\n制作与测试我们的小船有了船的设计图，我们就可以按照设计图开始制作了。思考怎样的制作步骤是比较合理的。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **大国重器与力学工程（“蛟龙”号万米浮力调节与港珠澳大桥抗震）**：港珠澳大桥运用巨型沉管隧道结构与橡胶减震隔震支座，抵御16级台风与8级地震；“奋斗者”号深潜器通过固体浮力材料与抛载配重实现万米深渊无动力悬浮与上浮！\n- 🧠 **跨学科大概念（牛顿经典力学体系）**：力是改变物体运动状态的原因而非维持运动的原因。简单机械（杠杆、滑轮、斜面）通过改变力的作用距离来实现省力，根据机械能守恒定律，任何机械都绝对不能省功（W = F·s）！\n- ⚠️ 小学生普遍错误：“用力推车车才走，不用力车就停，所以物体运动必须靠力来维持”。**科学真相**：这是亚里士多德两千年前的直觉错误！伽利略与牛顿用理想斜面实验证明：如果没有任何阻力（摩擦力和空气阻力），运动的物体将以恒定速度沿直线永远运动下去！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u02_l07.html)\n\n\n### [第 36 页]\n\n![第 36 页教学插图与实验活动](figures/p36.png)\n\n测试我们的小船。\n测试标准至少达到以下三项。\n●载重量达到200克。●●有自己的动力系统。●●能行驶一段距离。●通过测试，我们的船还可以怎样改进？\n举办我们的小船展览，给每一艘船写一份说明书。\n在学校的科技节上，同学们可以尝试制作一艘大型纸船，载着大家在水中行驶。\n安全提示纸船航行实验要在校园或实验室的水池等场地进行，并要有专人负责安全和指导。\n\n### [第 37 页]\n\n![第 37 页教学插图与实验活动](figures/p37.png)\n\n#### 📖 科学阅读现代轮船有骨架、船舱等结构设计，可以增加船的牢固程度，能更好地利用空间。船舱还可以阻止船体漏水后向其他地方蔓延，预防沉船。\n船底的龙骨结构，是我国古代的一项重大发明，不但能使船更加坚固，而且使其抗御风浪的能力大大增强，对世船的骨架界船舶结构的发展产生了深远影响。\n“奋斗者”号“奋斗者”号是我国首台完全自主研发的全海深载人潜水器。2020 年11 月10. 日，“奋斗者”号载人潜水器在马里亚纳海沟成功坐底，坐底深度10909 米。\n我国船舶制造业主要集中在三个区域，分别位于长三角（以上海为中心）、珠三角（以广州为中心）和环渤海地区（以大连为中心）。据统计，我国有三千多家船厂，能够制造出各类船舶。我国已经建造了自己的航空母舰。\n造船厂\n\n### [第 38 页]\n\n![第 38 页教学插图与实验活动](figures/p38.png)\n\n环境与我们地球是我们赖以生存的家园。\n人类的活动会不会影响环境呢？人类目前面临着哪些环境问题？\n这些日益严重的环境问题对人类有什么样的影响？为保护环境，我们又能做哪些力所能及的事情呢？\n人与自然和谐相处是我们共同的责任，让我们一起努力吧！"}, {"id": "sci_10_u03_l01", "lesson_idx": 191, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 3, "unit_title": "第三单元环境与我们", "lesson_no": 1, "title": "地球——宇宙的奇迹", "page": 39, "domain": "astronomy", "domain_cn": "综合科学探究", "sim_file": "sim_g10_s2_u03_l01.html", "code": "g10_s2_u03_l01", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。", "misconception": ""}, "figures": ["p39.webp", "p40.webp"], "raw_text": "### [第 39 页]\n\n![第 39 页教学插图与实验活动](figures/p39.png)\n\n## 1. 地球——宇宙的奇迹\n\n\n地球——宇宙的奇迹到目前为止，除地球之外，人类还未生命存在的必要条件发现其他适宜人类生存的星球。我们居住（班级记录表）的地球有什么独特之处？它为人类及其他日期：\n生命提供了哪些生存所必需的条件呢？\n1. 梳理我们认为生命存在的必要条件。\n2. 画一画我们的地球，标出与生命活动有关系的部分。Ꮑġல我们的地球：\n• 平均半径约为6400千米；\n• 大气层平均厚度约1000千米；\n• 海洋平均深度约为4千米；\n• 大陆地壳厚约15～80千米，大洋地壳厚约2～11千米。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿空间探索（中国探月与深空探测工程）**：从“嫦娥六号”实现人类首次月背采样返回，到“祝融号”火星车巡视火星乌托邦平原，航天科学家利用精密轨道力学与光谱分析，正在解开太阳系演化与地月系统的终极奥秘！\n- 🧠 **跨学科大概念（系统与模型 / CER 推理）**：天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。\n- ⚠️ 很多同学误以为“月相变化是地球的影子挡住了月亮”。**科学真相**：地球影子挡住月球的现象是罕见的“月食”；而平时的初一到十五月相变化，纯粹是因为月球绕地球公转时，我们在地球上看到的月球被太阳照亮的半球面角度不同！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u03_l01.html)\n\n\n### [第 40 页]\n\n![第 40 页教学插图与实验活动](figures/p40.png)\n\n3. 收集资料或观看图片，了解地球是一颗非常独特的行星。\n• 大气就像是盖在地球表面的一张毛毯，使地球表面的实际平均气温为15℃，适宜生命存在。\n• 火星和金星的大气基本上都不含有氧气，唯有地球的大气中有大量的氧气。\n• 地球在太阳系中的位置，正好位于离太阳不太近也不太远的一段距离内，保证了地球上有液态水。\n• 地球上有岩石和土壤，使雨水能够蓄积在地球表面。\n• 火星的气候会短期反复地剧烈变动，而地球的气候则在相当\n1. 地球为生命提供了哪些基本的生存长的时期内保持稳定。\n条件？为什么说要珍惜我们的地球家园？\n2. 如果我们来设计一个宇宙空间站，需要为宇航员保证哪些生存条件呢？\n丰富的海洋资源海洋是一个无比巨大的资源宝库，它为人类生存提供了生物、矿产、能源等多种资源。\n据统计，目前所知道的海洋生物有21万多种，其中海洋植物约1万种。海洋生物对维持海洋生态系统起着重要作用，同时也是大气中二氧化碳的主要吸收者之一。"}, {"id": "sci_10_u03_l02", "lesson_idx": 192, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 3, "unit_title": "第三单元环境与我们", "lesson_no": 2, "title": "我们面临的环境问题", "page": 41, "domain": "general_science", "domain_cn": "综合科学探究", "sim_file": "sim_g10_s2_u03_l02.html", "code": "g10_s2_u03_l02", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p41.webp", "p42.webp"], "raw_text": "### [第 41 页]\n\n![第 41 页教学插图与实验活动](figures/p41.png)\n\n## 2. 我们面临的环境问题\n\n\n我们面临的环境问题大气污染除了自然灾害之外，我们的地球家园面临着哪些环境问题？有些环境问题是由人类活动引发的，这些环境问题又对人类产生了怎样的影响呢？\n1. 列举我们面临的环境问题，并说出哪些与人类的活动有直接关系。\n大气污染固体废弃物污染水污染面临的环境问题噪声污染固体废弃物污染水资源短缺与水污染\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越 n![第 55 页教学插图与实验活动](figures/p55.png)\n\n区污水的排放等问题，城中湖污染加剧。到20世纪90年代，湖水的水质为劣五类，并且水体严重富营养化，水中生物急剧减少。\n城中湖周边主要有27个排污口，每日汇集污水量达30多万吨，其中绝大部分为生活污水，另一部分为湖周边的20多家企业的工业废水。污染物还来自湖渔业养殖带来的污染、湖周边的水上餐厅及一些娱乐设施污水、湖边农田林地施用的农药化肥、湖面上游船发动机排放的污染物。\n从20世纪90年代初，某市开始治理城中湖的环境问题。到2017年，城中湖的水质显著提升，生态环境得到了全面恢复，成为市民亲近自然的“生态绿心”，也成为该市对外宣传的旅游新名片。\n环境问题是很复杂的，依据人们居住的地域和所从事工作的不同，在看待某个污染问题时，人们会持有不同的态度。为了达成可行的解决办法，需要学会协调和放弃。让我们尝试从不同的角度来看待城中湖的环境问题，然后试着提出一些解决方案。\n以小组为单位，从湖周记录单边生活的普通市民、湖区渔日期：\n业养殖户、湖景区游船船主 1. 我们小组代表___________（谁）的观点。\n和环湖地区房地产开发商四 2. 这是我们___________小组在加剧城中湖环境问题严重性方面的一些行为：\n个角色中选择一个，并用自己的话填写右面的记录单。\n2. 这是我们____________小组在帮助解决城中湖环境问题方面提出的至少三种解决办法。\n我们小组的解决办法\n1.\n2.\n3.\n\n### [第 56 页]\n\n![第 56 页教学插图与实验活动](figures/p56.png)\n\n3. 各种解决办法可能给湖区环境的改善带来好处，也可能对我们小组造成不利的影响，请找出平衡协调的办法。\n解决办法一• 对城中湖环境改善的有利影响：\n• 对我们小组的不利影响：\n• 平衡协调的办法：\n解决办法二• 对城中湖环境改善的有利影响：\n• 对我们小组的不利影响：\n• 平衡协调的办法：\n解决办法三• 对城中湖环境改善的有利影响：\n• 对我们小组的不利影响：\n• 平衡协调的办法：\n1. 不同小组在破坏湖区环境方面有哪些相似点和不同点？\n2. 不同小组提出的解决办法有哪些相同之处和不同之处？\n3. 哪些解决办法不止一次被提到？哪些解决办法是互相冲突的？\n4. 列举我们作为个人，能够用来帮助解决当地环境问题的一些方法。\n收集资料，了解我们所在地区存在的环境问题、治理举措以及取得的成果。"}, {"id": "sci_10_u04_l01", "lesson_idx": 198, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 4, "unit_title": "第四单元热", "lesson_no": 1, "title": "温度与水的变化", "page": 58, "domain": "physics_thermal", "domain_cn": "综合科学探究", "sim_file": "sim_g10_s2_u04_l01.html", "code": "g10_s2_u04_l01", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "热量的本质是微观分子无规则剧烈运动的动能体现。热传导通过相邻分子热碰撞传递动能，遵循热力学第二定律——热量自发地从高温物体流向低温物体，直至达到热平衡。", "misconception": ""}, "figures": ["p58.webp", "p59.webp", "p60.webp"], "raw_text": "### [第 58 页]\n\n![第 58 页教学插图与实验活动](figures/p58.png)\n\n## 1. 温度与水的变化\n\n\n温度与水的变化\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **航天热控工程（天舟货运飞船热控百叶窗与气凝胶绝热材料）**：在太空中，向阳面温度高达150°C，背阳面低至-100°C。中国航天器利用自主研发的高性能二氧化硅纳米气凝胶毡与主动相变流体回路，精准将舱内仪器维持在人体最舒适的20°C左右！\n- 🧠 **跨学科大概念（热力学与微观热运动）**：热量的本质是微观分子无规则剧烈运动的动能体现。热传导通过相邻分子热碰撞传递动能，遵循热力学第二定律——热量自发地从高温物体流向低温物体，直至达到热平衡。\n- ⚠️ 小学生直觉迷思：“毛衣、棉被会自己发热，冬天盖着才暖和”。**科学真相**：棉被和毛衣本身绝对不会产生热量！它们内部饱含大量静止空气，而空气是极其不良的热导体，棉被的作用仅仅是阻止人体散发的热量通过对流与传导快速流失！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u04_l01.html)\n\n\n### [第 59 页]\n\n![第 59 页教学插图与实验活动](figures/p59.png)\n\n我们已经观察过水的沸腾和凝固成冰的现象，水的这些变化与什么有关呢？\n1. 整理水形态的变化与温度的关系。\n●回忆并写出水结冰时的温度和水 ●沸腾时的温度。\n冰水水蒸气●说说水的温度发生变化时，它的形态可能会发生怎样的变化。●\n\n### [第 60 页]\n\n![第 60 页教学插图与实验活动](figures/p60.png)\n\n2. 观察水加热时的变化现象。\n● ● 在烧杯中加入一些清水，放在酒精灯上加热。\n● ● 测量加热过程中水的温度变化。\n● ● 待水沸腾时，撤走酒精灯（停止给水加热），测量水的温度变化。\n● ● 静置一段时间后，再次给水加热至沸腾，并保持对沸水的持续加热，观测、记录水和温度的变化。\n水沸腾后的变化记录表日期：\n停止加热继续加热\n1. 分钟 2分钟 3分钟 1分钟 2分钟 3分钟温度变化水的变化\n1. 水在被持续加热过程中，温度发生了怎样探索水从常温持续的变化？停止加热后，温度发生了怎样的变化？下降到0℃以下，以及水又发生了什么变化？从0℃上升到常温后，\n2. 水的沸腾过程跟什么有关？水会发生什么变化。"}, {"id": "sci_10_u04_l02", "lesson_idx": 199, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 4, "unit_title": "第四单元热", "lesson_no": 2, "title": "水的蒸发和凝结", "page": 61, "domain": "physics_thermal", "domain_cn": "综合科学探究", "sim_file": "sim_g10_s2_u04_l02.html", "code": "g10_s2_u04_l02", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！", "misconception": ""}, "figures": ["p61.webp", "p62.webp"], "raw_text": "### [第 61 页]\n\n![第 61 页教学插图与实验活动](figures/p61.png)\n\n## 2. 水的蒸发和凝结\n\n\n水的蒸发和凝结在生活中，我们经常能看到水蒸发成水蒸气、水蒸气又凝结成水的现象。水和水蒸气的互相变换与什么因素有关？\n1. 说说生活中水蒸发和水蒸气凝结的现象。\n2. 交流我们对水蒸发、水蒸气凝结与什么有关的看法。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿化学与材料科学（高性能碳纤维与海水淡化反渗透膜）**：我国自主研发的T1000级超高强度碳纤维被称为‘新材料之王’，比铝还轻但强度比钢高数倍；先进聚酰胺反渗透膜孔径仅0.1纳米，高压迫使水分子穿透而将水合盐离子拦截，实现苦咸海水向纯净饮用水的瞬间转化！\n- 🧠 **跨学科大概念（物质形态与质量守恒定律）**：无论是物理变化（水的三态相变分子间距改变）还是化学变化（分子旧键断裂、新键重组生成新物质），系统内的原子种类和总质量在反应前后绝对保持守恒不变！\n- ⚠️ 常见前概念误区：“水蒸发或者蜡烛烧完了，物质就彻底消失了”。**科学真相**：物质绝不会凭空消失！蒸发的水分子逸散到了广袤的大气中形成看不见的水汽；蜡烛燃烧生成的二氧化碳气体和水蒸气扩散到了空气中，封闭体系称重会发现总质量分毫不差！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u04_l02.html)\n\n\n### [第 62 页]\n\n![第 62 页教学插图与实验活动](figures/p62.png)\n\n3. 探究水蒸发快慢与温度高低的关系。\n●推测水温高低与水蒸发快慢有怎 ●样的关系。\n●设计实验，证明水温高低是否影 ●响水蒸发的速度。\n4. 观察水蒸气的凝结现象。\n●在玻璃杯内加入冰块，用干布将玻 ● ●在装有冰块的玻璃杯内再加入一 ●璃杯外壁擦拭干净，静置一会儿，些食盐，继续观察玻璃杯外壁有观察玻璃杯外壁有什么现象，并记什么现象，并记录两支温度计的录玻璃杯内外温度计的读数。读数。\n1. 当温度变化时，我们观察到了哪些水的蒸发和凝结现象？\n2. 我们还能举出生活中哪些水的蒸发和凝结现象？\n自然界的云、雾、霜、雪是怎样形成的？与水蒸气的凝结有关吗？"}, {"id": "sci_10_u04_l03", "lesson_idx": 200, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 4, "unit_title": "第四单元热", "lesson_no": 3, "title": "温度不同的物体相互接触", "page": 63, "domain": "physics_thermal", "domain_cn": "综合科学探究", "sim_file": "sim_g10_s2_u04_l03.html", "code": "g10_s2_u04_l03", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "热量的本质是微观分子无规则剧烈运动的动能体现。热传导通过相邻分子热碰撞传递动能，遵循热力学第二定律——热量自发地从高温物体流向低温物体，直至达到热平衡。", "misconception": ""}, "figures": ["p63.webp", "p64.webp"], "raw_text": "### [第 63 页]\n\n![第 63 页教学插图与实验活动](figures/p63.png)\n\n## 3. 温度不同的物体相互接触\n\n\n温度不同的物体相互接触刚从冰箱里取出的牛奶，要使它变成热的，我们会把它浸在热水中。热水是怎样使牛奶由凉变热的？\n1. 预测一下温度不同的物体相互接触后温度会怎样变化。\n2. 将温度不同的水相互接触。\n●取一定量20℃左右的凉水代替牛奶，装在试管中。●●取一只大烧杯，倒入三分之二杯60℃左右的热水，然后将盛有凉水的试 ●管下端浸入热水中。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **航天热控工程（天舟货运飞船热控百叶窗与气凝胶绝热材料）**：在太空中，向阳面温度高达150°C，背阳面低至-100°C。中国航天器利用自主研发的高性能二氧化硅纳米气凝胶毡与主动相变流体回路，精准将舱内仪器维持在人体最舒适的20°C左右！\n- 🧠 **跨学科大概念（热力学与微观热运动）**：热量的本质是微观分子无规则剧烈运动的动能体现。热传导通过相邻分子热碰撞传递动能，遵循热力学第二定律——热量自发地从高温物体流向低温物体，直至达到热平衡。\n- ⚠️ 小学生直觉迷思：“毛衣、棉被会自己发热，冬天盖着才暖和”。**科学真相**：棉被和毛衣本身绝对不会产生热量！它们内部饱含大量静止空气，而空气是极其不良的热导体，棉被的作用仅仅是阻止人体散发的热量通过对流与传导快速流失！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u04_l03.html)\n\n\n### [第 64 页]\n\n![第 64 页教学插图与实验活动](figures/p64.png)\n\n3. 用两支温度计分别测量试管中的凉温度变化记录表水和烧杯中的热水的温度变化情日期：\n况，每间隔一定时间记录读数。\n凉水温度热水温度\n2. 分钟\n4. 分钟6. 分钟8. 分钟10. 分钟12. 分钟14. 分钟\n4. 将记录表上的数据制成折线图。\n温度(℃)\n1. 试管中的凉水温度变化了吗？\n是怎样变化的？什么现象说明凉水温度在变化？\n2. 凉水温度的变化是怎样引起的？\n你是根据什么做出的推测？\n3. 凉水的温度会不断上升吗？热 0 2 4 6 8 10 12 14 时间(分钟)水的温度会一直下降吗？\n在实验中，我们测量物体的温度通常使用温度计，生活中还有更多可以感知温度的方法，比如使用感温纸带、感温粉末……。把感温粉末加入水中，我们也可以观察到温度的变化。"}, {"id": "sci_10_u04_l04", "lesson_idx": 201, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 4, "unit_title": "第四单元热", "lesson_no": 4, "title": "热在金属中的传递", "page": 65, "domain": "physics_thermal", "domain_cn": "综合科学探究", "sim_file": "sim_g10_s2_u04_l04.html", "code": "g10_s2_u04_l04", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "热量的本质是微观分子无规则剧烈运动的动能体现。热传导通过相邻分子热碰撞传递动能，遵循热力学第二定律——热量自发地从高温物体流向低温物体，直至达到热平衡。", "misconception": ""}, "figures": ["p65.webp", "p66.webp", "p67.webp"], "raw_text": "### [第 65 页]\n\n![第 65 页教学插图与实验活动](figures/p65.png)\n\n## 4. 热在金属中的传递\n\n\n热在金属中的传递将牛奶包浸在热水中，牛奶会慢慢热起来，热水把热量传给了牛奶。喝汤时，热怎样传到勺柄？\n将金属勺浸在热汤中，过一会儿，勺柄也热起来了。怎样解释这种变化呢？热是怎样传递的？\n1. 猜测热是怎样传递到勺柄的，用箭头把想法画出来。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **航天热控工程（天舟货运飞船热控百叶窗与气凝胶绝热材料）**：在太空中，向阳面温度高达150°C，背阳面低至-100°C。中国航天器利用自主研发的高性能二氧化硅纳米气凝胶毡与主动相变流体回路，精准将舱内仪器维持在人体最舒适的20°C左右！\n- 🧠 **跨学科大概念（热力学与微观热运动）**：热量的本质是微观分子无规则剧烈运动的动能体现。热传导通过相邻分子热碰撞传递动能，遵循热力学第二定律——热量自发地从高温物体流向低温物体，直至达到热平衡。\n- ⚠️ 小学生直觉迷思：“毛衣、棉被会自己发热，冬天盖着才暖和”。**科学真相**：棉被和毛衣本身绝对不会产生热量！它们内部饱含大量静止空气，而空气是极其不良的热导体，棉被的作用仅仅是阻止人体散发的热量通过对流与传导快速流失！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u04_l04.html)\n\n\n### [第 66 页]\n\n![第 66 页教学插图与实验活动](figures/p66.png)\n\n2. 观察热在金属条中的传递。\n●在一根金属条表面均匀涂上蜡，然后将金属条固定在支架上。●●用火加热金属条的中部，观察金属条上蜡的变化。●当心别烫着手！\n还可以在金属条上涂感温油墨来帮助观察变化。\n3. 观察热在金属片中的传递。\n●在涂有蜡（或感温油墨）的金属 ●圆片边缘的一个点上加热，观察蜡（或感温油墨）的变化情况，推测热在金属片中是怎样传递的。\n●在涂有蜡（或感温油墨）的金属 ●圆片的中心加热，观察蜡（或感温油墨）的变化情况，推测热在金属片中是怎样传递的。\n\n### [第 67 页]\n\n![第 67 页教学插图与实验活动](figures/p67.png)\n\n1. 金属条上的热是通过什么传递热的传递方式（班级记录表）过去的？日期：\n2. 热在金属条中是怎样传递的？\n在金属片中又是怎样传递的？\n3. 在金属条和金属片中，热的传递方式有什么相同特点？\n热可以从一个物体传递给另一个物体，或者从物体的一部分传递到另一部分。\n三种热传递方式"}, {"id": "sci_10_u04_l05", "lesson_idx": 202, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 4, "unit_title": "第四单元热", "lesson_no": 5, "title": "热在水中的传递", "page": 68, "domain": "physics_thermal", "domain_cn": "综合科学探究", "sim_file": "sim_g10_s2_u04_l05.html", "code": "g10_s2_u04_l05", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "热量的本质是微观分子无规则剧烈运动的动能体现。热传导通过相邻分子热碰撞传递动能，遵循热力学第二定律——热量自发地从高温物体流向低温物体，直至达到热平衡。", "misconception": ""}, "figures": ["p68.webp", "p69.webp"], "raw_text": "### [第 68 页]\n\n![第 68 页教学插图与实验活动](figures/p68.png)\n\n## 5. 热在水中的传递\n\n\n热在水中的传递我们经常给水加热，直至把水烧开。热在水中是如何传递的？与在金属中的传热方加热时间不可太长，式相同吗？不要用手触摸，以免烫伤！\n1. 想象一下，在一根细长的试管中加入约三分之一容量的水，然后给试管中水的一端加热，水是怎样变热的？水的另一端是否也会热起来？用箭头表示出来。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **航天热控工程（天舟货运飞船热控百叶窗与气凝胶绝热材料）**：在太空中，向阳面温度高达150°C，背阳面低至-100°C。中国航天器利用自主研发的高性能二氧化硅纳米气凝胶毡与主动相变流体回路，精准将舱内仪器维持在人体最舒适的20°C左右！\n- 🧠 **跨学科大概念（热力学与微观热运动）**：热量的本质是微观分子无规则剧烈运动的动能体现。热传导通过相邻分子热碰撞传递动能，遵循热力学第二定律——热量自发地从高温物体流向低温物体，直至达到热平衡。\n- ⚠️ 小学生直觉迷思：“毛衣、棉被会自己发热，冬天盖着才暖和”。**科学真相**：棉被和毛衣本身绝对不会产生热量！它们内部饱含大量静止空气，而空气是极其不良的热导体，棉被的作用仅仅是阻止人体散发的热量通过对流与传导快速流失！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u04_l05.html)\n\n\n### [第 69 页]\n\n![第 69 页教学插图与实验活动](figures/p69.png)\n\n可能是热水向上运动造成的吧。\n水怎么只往上能看到水流动的我们也可以在清水中加入传热？热水怎方向吗？一些感温粉末，搅拌均么向上流？匀。然后用酒精灯给试管底部一侧加热，观察水的流动及颜色变化。\n加热时，试管口不可朝着人！\n2. 在一只大烧杯内注入约三分之一容量的清水；用滴管吸取红墨水，伸入到水下待加热的地方，挤出2滴红墨水；然后用酒精灯给烧杯底部一侧加热。观察加热后的水是怎么流动的，以及水中的颜色怎样变化。\n1. 试管中的水是如何传热的？\n2. 在烧杯底部的一侧加热，烧杯内的水都会变热吗？热是怎样传递到这杯水的各个部分的？\n冬天，我们在房间里使用取暖器时，房间里哪里的空气先热起来？房间里上部空气的温度和下部空气的温度哪里更高？房间里的空气是怎样逐步达到全部变热的？把我们的推测在取暖器右图中用文字和箭头表示出来。"}, {"id": "sci_10_u04_l06", "lesson_idx": 203, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 4, "unit_title": "第四单元热", "lesson_no": 6, "title": "哪个传热快", "page": 70, "domain": "physics_thermal", "domain_cn": "综合科学探究", "sim_file": "sim_g10_s2_u04_l06.html", "code": "g10_s2_u04_l06", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "热量的本质是微观分子无规则剧烈运动的动能体现。热传导通过相邻分子热碰撞传递动能，遵循热力学第二定律——热量自发地从高温物体流向低温物体，直至达到热平衡。", "misconception": ""}, "figures": ["p70.webp", "p71.webp", "p72.webp"], "raw_text": "### [第 70 页]\n\n![第 70 页教学插图与实验活动](figures/p70.png)\n\n## 6. 哪个传热快\n\n\n哪个传热快\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **航天热控工程（天舟货运飞船热控百叶窗与气凝胶绝热材料）**：在太空中，向阳面温度高达150°C，背阳面低至-100°C。中国航天器利用自主研发的高性能二氧化硅纳米气凝胶毡与主动相变流体回路，精准将舱内仪器维持在人体最舒适的20°C左右！\n- 🧠 **跨学科大概念（热力学与微观热运动）**：热量的本质是微观分子无规则剧烈运动的动能体现。热传导通过相邻分子热碰撞传递动能，遵循热力学第二定律——热量自发地从高温物体流向低温物体，直至达到热平衡。\n- ⚠️ 小学生直觉迷思：“毛衣、棉被会自己发热，冬天盖着才暖和”。**科学真相**：棉被和毛衣本身绝对不会产生热量！它们内部饱含大量静止空气，而空气是极其不良的热导体，棉被的作用仅仅是阻止人体散发的热量通过对流与传导快速流失！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u04_l06.html)\n\n\n### [第 71 页]\n\n![第 71 页教学插图与实验活动](figures/p71.png)\n\n在生活中，让热迅速地传给另一个物体是我们所希望的，比如用锅做饭时。但在另一些情况下，我们希望热还是慢慢传递比较好，比如手握锅柄时。\n不同材料制成的物体在传热方面有什么不同吗？\n1. 将不同材料的勺子（木勺、塑料勺、金属勺等）插入热汤时，推测哪种勺子更烫手。\n\n### [第 72 页]\n\n![第 72 页教学插图与实验活动](figures/p72.png)\n\n2. 用实验验证我们的猜测。\n●准备相同大小的木勺、塑料勺、金属勺，●在三种勺子的勺柄中段涂上蜡（或感温油墨），晾干。\n●在烧杯中加入约100毫升开水，将三种不同 ●材质勺子的勺部同时浸入热水中，观察勺柄上蜡（或感温油墨）的变化，并记录。\n不同材质勺柄温度变化记录表日期：\n30. 秒 60秒 90秒 120秒 150秒金属勺木勺准备一盆冷水和塑料勺湿布，防止烫伤手！\n3. 设计实验，观察并比较铜、铝、铁等金属材料的导热性能。\n找几根相同粗细、用蜡（或感温油长短的铜丝、铁墨）来判断它们丝、铝丝来比较。传热的快慢。\n1. 不同材料的物体，传热的快慢相同吗？什么材料传热更快？\n2. 不同导热性能的材料，在生活中有什么不同的用途？"}, {"id": "sci_10_u04_l07", "lesson_idx": 204, "book": "五年级下册", "vol_dir": "10_五年级下册", "unit_no": 4, "unit_title": "第四单元热", "lesson_no": 7, "title": "做个保温杯", "page": 73, "domain": "physics_thermal", "domain_cn": "综合科学探究", "sim_file": "sim_g10_s2_u04_l07.html", "code": "g10_s2_u04_l07", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "热量的本质是微观分子无规则剧烈运动的动能体现。热传导通过相邻分子热碰撞传递动能，遵循热力学第二定律——热量自发地从高温物体流向低温物体，直至达到热平衡。", "misconception": ""}, "figures": ["p73.webp", "p74.webp", "p75.webp"], "raw_text": "### [第 73 页]\n\n![第 73 页教学插图与实验活动](figures/p73.png)\n\n## 7. 做个保温杯\n\n\n做个保温杯冬天，我们大多喜欢喝热水。热水盛在怎样的杯子里才不容易变冷？我们怎样减慢物体热量的传递？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **航天热控工程（天舟货运飞船热控百叶窗与气凝胶绝热材料）**：在太空中，向阳面温度高达150°C，背阳面低至-100°C。中国航天器利用自主研发的高性能二氧化硅纳米气凝胶毡与主动相变流体回路，精准将舱内仪器维持在人体最舒适的20°C左右！\n- 🧠 **跨学科大概念（热力学与微观热运动）**：热量的本质是微观分子无规则剧烈运动的动能体现。热传导通过相邻分子热碰撞传递动能，遵循热力学第二定律——热量自发地从高温物体流向低温物体，直至达到热平衡。\n- ⚠️ 小学生直觉迷思：“毛衣、棉被会自己发热，冬天盖着才暖和”。**科学真相**：棉被和毛衣本身绝对不会产生热量！它们内部饱含大量静止空气，而空气是极其不良的热导体，棉被的作用仅仅是阻止人体散发的热量通过对流与传导快速流失！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g10_s2_u04_l07.html)\n\n\n### [第 74 页]\n\n![第 74 页教学插图与实验活动](figures/p74.png)\n\n1. 比较哪杯水凉得慢。\n●在容量大小差不多的不锈钢杯、陶瓷杯、塑料杯中，分别倒入同样 ●多、相同温度的热水。\n●过几分钟后测量三杯水的温度，比较哪杯水凉得最慢。●\n2. 交流能使杯中热水凉得更慢的方法。\n把杯子嵌在泡用毛巾把杯给杯子加一沫塑料里。\n子包起来。个密封的盖。\n3. 测试、比较各种方法的保温效果。\n杯子状况开始温度 10分钟后温度降温多少无盖的杯子加盖的杯子外包毛巾的杯子加盖、外包毛巾的杯子嵌入泡沫塑料中的杯子\n\n### [第 75 页]\n\n![第 75 页教学插图与实验活动](figures/p75.png)\n\n4. 制作一个保温杯。\n●选择合适的材料制作一个保温杯，要求杯外的包裹物厚度不超过3厘米。●●在杯中存放冰块，测试、比较各组自制保温杯的保温效果。●●观察、比较各组保温杯的制作方法，分析自制保温杯的优缺点。●设计图制作方法和材料保温效果需要改进的地方\n1. 什么样的材料散热快？什么样的材料能减慢热量的传递？\n2. 制作保温杯时，我们要从哪些方面考虑减慢热量的传递？实际效果如何？还可以在哪些方面做进一步的改进？\n木塞：热的不良导体，隔绝内部物质与外界空气的接触，减少热传导与热对流。\n真空：无热传导与热对流。\n镀银内壁：减少热辐射。\n保温瓶内胆原理图"}, {"id": "sci_11_u01_l01", "lesson_idx": 205, "book": "六年级上册", "vol_dir": "11_六年级上册", "unit_no": 1, "unit_title": "第一单元健康生活", "lesson_no": 1, "title": "生长发育的信息", "page": 2, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g11_s1_u01_l01.html", "code": "g11_s1_u01_l01", "sections": {"focus": "青少年时期是我们生长发育的关键阶段，目前我们的身体状况是怎样的？", "exploration": "打开“时间胶囊”，比较现在和一年级时的身体状况，用数据说明身体的变化。", "discussion": "回顾一年级时自己对身体生长的期待，我们哪些做到了，哪些没有达成？\n体质健康标准中，为什么要区分男生和女生的数据？\n为了健康生长，我们怎样做得更好？", "expansion": "无论是动物还是植物，它们的生长都需要从环境中获得物质和能量。我们观察过植物在不同类型的土壤中的生长状况，也做过植物发芽与水分关系的实验，还初步了解了人的呼吸与消化过程、植物的光合作用。现在从“时间胶囊”记录的信息里，我们已经知道自己五年来身体显著的变化：长高了、增重了。根据已有知识，查阅更多资料，思考我们长高、增重的物质和能量来自哪里。", "frontier": "", "big_concept": "植物的每一处器官形态均是自然选择的精妙杰作——扁平叶片最大化受光面积，维管束导管利用水分子毛细吸力将矿物质逆重力泵送百米树梢，根系向地性确保了机械固定与深层水源汲取。", "misconception": ""}, "figures": ["p02.webp", "p03.webp", "p04.webp", "p05.webp"], "raw_text": "### [第 2 页]\n\n![第 2 页教学插图与实验活动](figures/p02.png)\n\n## 1. 生长发育的信息\n\n\n一生长发育的信息一年级时制作的“时间胶囊”里面，记录着我们对自己成长的期待。\n打开看一看就可以知道这些年我们的变化。\n\n#### 🎯 聚焦青少年时期是我们生长发育的关键阶段，目前我们的身体状况是怎样的？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿生物工程（太空诱变育种与人工合成淀粉）**：中国空间站已成功开展水稻从种子到种子的全生命周期空间培养；中科院科研人员更在全球首次实现了从二氧化碳到淀粉的无细胞人工化学全合成，极大拓宽了光合作用的理论边界！\n- 🧠 **跨学科大概念（结构与功能相适应）**：植物的每一处器官形态均是自然选择的精妙杰作——扁平叶片最大化受光面积，维管束导管利用水分子毛细吸力将矿物质逆重力泵送百米树梢，根系向地性确保了机械固定与深层水源汲取。\n- ⚠️ 许多小学生认为“植物生长所需要的泥土全部被植物‘吃’进了肚 量，脑所消我们对脑有哪些新的认识？\n耗的能量占到了人体所需能量的五分我们的课表设计，在哪些方之一左右。所以，充足的营养和睡眠面考虑了健康用脑？\n才能保持大脑的活力。大脑感到疲倦时，适当地做一些学习、工作之外的事情，例如运动、听音乐、画画等，都可以让脑得到休息。", "expansion": "脑柔软得像豆腐一样，猛烈的撞击会对脑造成伤害。颅骨可以保护大脑，但在特定情况下我们仍旧需要借助头盔来增强对脑的保护。\n了解各种头盔的正确使用方法，观察头盔的结构，思考它是怎样保护脑的。", "frontier": "", "big_concept": "人体是由神经系统、循环系统、运动系统协同组成的超高精度自适应控制系统。感受器感知刺激产生神经冲动，传入中枢神经系统决策，再由传出神经驱动效应器肌肉收缩产生反应动作。", "misconception": ""}, "figures": ["p14.webp", "p15.webp", "p16.webp", "p17.webp"], "raw_text": "### [第 14 页]\n\n![第 14 页教学插图与实验活动](figures/p14.png)\n\n## 4. 身体的“总指挥”\n\n\n身体的总指挥以前人们认为心脏是情感和精神活动的发源之地，随着脑科学的发展，人们逐渐认识到脑是身体的“总指挥”。\n\n#### 🎯 聚焦脑作为身体的“总指挥”，是人体非常重要且活跃的器官，它每天需要消耗大量能量。\n那么，脑有哪些功能？它是怎样工作的？\n教育科学出料\n\n#### 🔬 探索脑位于颅腔内，包括大脑、小脑和脑认识脑的基本结构。\n干等部分。\n脑与脊髓相连。\n大脑、脑和脊髓联系着的神经分布到身体的各个部分。\n大脑是人体的控制中心，包括左右两脑干个大脑半球。\n小脑大脑半球\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿仿生医工（神经脑机接口与仿生眼）**：我国科学家在超高密度柔性微电极阵列脑机接口领域取得核心突破，通过解码运动皮层神经突触毫秒级电脉冲信号，使瘫痪患者能够意念控制外骨骼假肢灵巧抓握！\n- 🧠 **跨学科大概念（系统控制与反馈机制）**：人体是由神经系统、循环系统、运动系统协同组成的超高精度自适应控制系统。感受器感知刺激产生神经冲动，传入中枢神经系统决策，再由传出神经驱动效应器肌肉收缩产生反应动作。\n- ⚠️ 小学生常认为“我们是用眼睛看东西、用耳朵听声音”。**科学真相**：眼睛和耳朵仅仅是光学和声学信号转换器（将光子与声压振动转换为神经电脉冲）；真正进行图像重构、特征识别与意义解析的是大脑皮层的视觉中枢和听觉中枢！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g11_s1_u01_l04.html)\n\n\n### [第 15 页]\n\n![第 15 页教学插图与实验活动](figures/p15.png)\n\n2. 体验30秒的脑活动游戏。\n做一个简短的游戏活动，如“你做我猜”。游戏结束后，分析游戏中做动作的同学，他的大脑指挥身体做了哪些活动。\n嫦娥奔月\n3. 体验30秒的脑记忆游戏。\n我们对词语的记忆力怎么样？\n·用30秒的时间，记住右面的12个词语。合上书，一分纸、盘子、杯子、胡钟内试着默写出来。\n萝卜、酷、椅子、呕我们的视觉记忆吐、地板、灰尘、小卵石、牛奶、骆驼怎么样？\n用30秒的时间，记住托盘中的物品。合上书，一分钟内试着默写出来。\n你是怎样让自己记忆更多信息的？\n\n### [第 16 页]\n\n![第 16 页教学插图与实验活动](figures/p16.png)\n\n在游戏过程中，大脑要在短时间内接收不同信息，同时处理很多任务。这样的工作量，大脑会不会疲劳呢？\n资料研究发现，脑有很多不同的分区，它们分工合作，负责人体的各种活动。脑也是一个巨大的存储器，能够存储大量信息，并能及时调取出来。这些强大的功能，能够让人体在短时间内作出很多反应。\n\n#### 📝 记录单一天中脑都干了什么日期：\n时间思考心情运动感觉、观察早上该起床了，早餐高兴听到闲钟响，天亮了，吃饱了，吃什么？\n要起床饭莱黎香上学上午教育科学生中午下午傍晚晚上\n\n### [第 17 页]\n\n![第 17 页教学插图与实验活动](figures/p17.png)\n\n#### 💬 研讨资料脑承担着巨大的工作量，脑所消我们对脑有哪些新的认识？\n耗的能量占到了人体所需能量的五分我们的课表设计，在哪些方之一左右。所以，充足的营养和睡眠面考虑了健康用脑？\n才能保持大脑的活力。大脑感到疲倦时，适当地做一些学习、工作之外的事情，例如运动、听音乐、画画等，都可以让脑得到休息。\n\n#### 🚀 拓展脑柔软得像豆腐一样，猛烈的撞击会对脑造成伤害。颅骨可以保护大脑，但在特定情况下我们仍旧需要借助头盔来增强对脑的保护。\n了解各种头盔的正确使用方法，观察头盔的结构，思考它是怎样保护脑的。"}, {"id": "sci_11_u01_l05", "lesson_idx": 209, "book": "六年级上册", "vol_dir": "11_六年级上册", "unit_no": 1, "unit_title": "第一单元健康生活", "lesson_no": 5, "title": "睡眠要充足", "page": 18, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g11_s1_u01_l05.html", "code": "g11_s1_u01_l05", "sections": {"focus": "你的睡眠好吗？", "exploration": "制订调查睡眠情况的研究计划。\n参考下面的研究思路，做好调查研究活动的设计，完成调查活动。\n·分析选题的意义·确定研究目标交流“睡眠”对我们健康生活的了解同学们的睡眠情况。\n意义。\n分析睡眠充足（不充足）的原因。\n分享彼此睡眠的情况。\n提出改善睡眠的建议。\n●撰写研究报告●制订研究计划进行数据分析，依据分析结果设计调查表。\n撰写研究报告。\n实施问卷调查。\n整理调查数据。\n睡眠情况调查表\n1. 近一周以来，平均每天晚上大概睡几个小时？\n2. 晚上睡眠时长小于8小时的时候多吗？\n经常B.偶尔C.没有学出睡眠时长小于8小时的原因是什么？\nA.作业太多B.看电视C.睡眠环境不安静D.其他原因：\n4. 中午睡觉休息吗？\nA.经常B.偶尔C.没有\n5. 没有充足的睡眠，会对第二天的学习有怎样的影响？", "discussion": "在分析调查数据的过程中，我们遇到过什么困难吗？是怎样解决的？\n其他小组有哪些方法值得学习借鉴？\n睡眠是身体休息的过程，睡眠过程中，身体哪些部位得到了休息？", "expansion": "试着参照这次睡眠情况调查研究的过程和方法，进行有关运动情况的调查。\n运动情况调查表\n1. 你的性别：\n男口\n2. 你认为镀炼身体对身体健康重要吗？\n很重要B.比较重要不太重要D.完全不重要你每天大约花多少时间参加体育运动？\nA.少于1小时B.1~2小时C.2~3小时D.3小时以上\n4. 你经常参加的体育运动是什么？（可多选）A.广播体操B.跳绳C.跑步D.足球、篮球、排球E.乒乓球F.羽毛球游泳H其他你的家庭成员中，谁经常参加体育运动？\n6. 家里的成年人会跟你一起运动吗？\nA.经常B.偶尔C.几乎不", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p18.webp", "p19.webp", "p20.webp", "p21.webp"], "raw_text": "### [第 18 页]\n\n![第 18 页教学插图与实验活动](figures/p18.png)\n\n## 5. 睡眠要充足\n\n\n睡眠要充足良好的睡眠是身体健康的基础，小学生每天睡眠的时间应达到10小时。\n\n#### 🎯 聚焦你的睡眠好吗？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g11_s1_u01_l05.html)\n\n\n### [第 19 页]\n\n![第 19 页教学插图与实验活动](figures/p19.png)\n\n#### 🔬 探索制订调查睡眠情况的研究计划。\n参考下面的研究思路，做好调查研究活动的设计，完成调查活动。\n·分析选题的意义·确定研究目标交流“睡眠”对我们健康生活的了解同学们的睡眠情况。\n意义。\n分析睡眠充足（不充足）的原因。\n分享彼此睡眠的情况。\n提出改善睡眠的建议。\n●撰写研究报告●制订研究计划进行数据分析，依据分析结果设计调查表。\n撰写研究报告。\n实施问卷调查。\n整理调查数据。\n睡眠情况调查表\n1. 近一周以来，平均每天晚上大概睡几个小时？\n2. 晚上睡眠时长小于8小时的时候多吗？\n经常B.偶尔C.没有学出睡眠时长小于8小时的原因是什么？\nA.作业太多B.看电视C.睡眠环境不安静D.其他原因：\n4. 中午睡觉休息吗？\nA.经常B.偶尔C.没有\n5. 没有充足的睡眠，会对第二天的学习有怎样的影响？\n\n### [第 20 页]\n\n![第 20 页教学插图与实验活动](figures/p20.png)\n\n2. 实施睡眠情况调查方案。\n资料组内同学相互调查并分长期睡眠不足会影响大脑的休息，造成记析常见原因。\n忆力、注意力下降，精神不集中，从而影响学\n3. 全班汇总存在的问题及习效果。\n建议。\n要想有好的睡眠，就要做好学习、生活安排，保证睡眠时长；睡前不做强度过大的运动，不喝有刺激性的饮料，如咖啡、茶等；不表达要准确，要养成睡前看手机的习惯。\n呈现形式要直观。\n睡眠时长调查情况\n\n#### 💬 研讨在分析调查数据的过程中，我们遇到过什么困难吗？是怎样解决的？\n其他小组有哪些方法值得学习借鉴？\n睡眠是身体休息的过程，睡眠过程中，身体哪些部位得到了休息？\n\n### [第 21 页]\n\n![第 21 页教学插图与实验活动](figures/p21.png)\n\n#### 🚀 拓展试着参照这次睡眠情况调查研究的过程和方法，进行有关运动情况的调查。\n运动情况调查表\n1. 你的性别：\n男口\n2. 你认为镀炼身体对身体健康重要吗？\n很重要B.比较重要不太重要D.完全不重要你每天大约花多少时间参加体育运动？\nA.少于1小时B.1~2小时C.2~3小时D.3小时以上\n4. 你经常参加的体育运动是什么？（可多选）A.广播体操B.跳绳C.跑步D.足球、篮球、排球E.乒乓球F.羽毛球游泳H其他你的家庭成员中，谁经常参加体育运动？\n6. 家里的成年人会跟你一起运动吗？\nA.经常B.偶尔C.几乎不"}, {"id": "sci_11_u01_l06", "lesson_idx": 210, "book": "六年级上册", "vol_dir": "11_六年级上册", "unit_no": 1, "unit_title": "第一单元健康生活", "lesson_no": 6, "title": "管理我们的情绪", "page": 22, "domain": "biology", "domain_cn": "生命科学与生态", "sim_file": "sim_g11_s1_u01_l06.html", "code": "g11_s1_u01_l06", "sections": {"focus": "我们有快乐、愤怒、悲伤、恐惧等情绪，遇到什么事情会有这些情绪呢？这些情绪会怎样表现出来？", "exploration": "说一说，自己在不同情绪下会有怎样的表现？", "discussion": "我们有不同的情绪，这是正常现象吗？\n不同的人对同样的外界刺激表现出的情绪都一样吗？\n怎样控制和调整自己的情绪？\n我们怎样帮助周围同学调整情绪？\n资料", "expansion": "在生活中，我们可能会由于别人的误解或制作“压力疏解盒”遇到了困难等而感到紧把你认为能有效疏解压力的方法，分别写张。轻度的紧张有利于在不同的纸条上，装进一个盒子里。当你感受解决问题，但过度的紧张会影响我们的健康。\n到压力的时候，从盒子里任意取出一张纸条，遇到这样的情绪问题，尝试使用上面记录的方法来疏解压力。\n多跟好朋友、家长或老师说一说，寻求他们的帮助。\n育科子出去吃好吃的，散散心!去找朋友聊天8. 一快乐的！", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p22.webp", "p23.webp", "p24.webp", "p25.webp"], "raw_text": "### [第 22 页]\n\n![第 22 页教学插图与实验活动](figures/p22.png)\n\n## 6. 管理我们的情绪\n\n\n管理我们的情绪每个人都会有情绪。保持积极向上的正面情绪，有利于健康。\n育科喜仕\n\n#### 🎯 聚焦我们有 睡眠入中间区域。\n试着做不同组合的分析。\n合理充足我们把三个运动睡眠要素相结合，结果会怎样？\n合理运动教育科子出平衡膳食充足睡眠对于健康问题只考虑一个方面是不够的，需要我们从多个方面做好准备和计划。", "frontier": "", "big_concept": "人体是由神经系统、循环系统、运动系统协同组成的超高精度自适应控制系统。感受器感知刺激产生神经冲动，传入中枢神经系统决策，再由传出神经驱动效应器肌肉收缩产生反应动作。", "misconception": ""}, "figures": ["p26.webp", "p27.webp", "p28.webp", "p29.webp", "p30.webp", "p31.webp", "p32.webp", "p33.webp"], "raw_text": "### [第 26 页]\n\n![第 26 页教学插图与实验活动](figures/p26.png)\n\n## 7. 制订健康生活计划\n\n\n制订健康生活计划遇到生理和心理健康问题可以寻求专业医生帮助，而自己调节和控制也是非常重要的方法，制订健康生活计划就是有效的方法之一。\n\n#### 🎯 聚焦健康生活是我们的目标，怎样制订一个合理的计划来实现这个目标呢？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿仿生医工（神经脑机接口与仿生眼）**：我国科学家在超高密度柔性微电极阵列脑机接口领域取得核心突破，通过解码运动皮层神经突触毫秒级电脉冲信号，使瘫痪患者能够意念控制外骨骼假肢灵巧抓握！\n- 🧠 **跨学科大概念（系统控制与反馈机制）**：人体是由神经系统、循环系统、运动系统协同组成的超高精度自适应控制系统。感受器感知刺激产生神经冲动，传入中枢神经系统决策，再由传出神经驱动效应器肌肉收缩产生反应动作。\n- ⚠️ 小学生常认为“我们是用眼睛看东西、用耳朵听声音”。**科学真相**：眼睛和耳朵仅仅是光学和声学信号转换器（将光子与声压振动转换为神经电脉冲）；真正进行图像重构、特征识别与意义解析的是大脑皮层的视觉中枢和听觉中枢！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g11_s1_u01_l07.html)\n\n\n### [第 27 页]\n\n![第 27 页教学插图与实验活动](figures/p27.png)\n\n#### 🔬 探索提示说一说哪些生活习惯可以让我们保持怎样制订健康生活计划健康。\n1. 确定我们想要实现的健康目标。\n2. 从一件易操作的事情开始，参考下面\n2. 明确实现这个目标应养成的习惯。\n计划表中的内容，制订一个符合自己需求\n3. 制订每天具体的实践计划。\n的健康生活计划。\n4. 记录计划的执行效果。\n我的健康生活计划计划人：李明开始时间：\n年月健康目标多吃蔬莱多吃以前不爱吃的蔬菜，不再偏食、挑食，习惯养成养成良好的饮食习惯具体实践每日至少吃10筷子蔬莱，可逐渐增加执行效果每日进行打卡，自我评价，记上、中、下三等“多吃蔬菜”健康计划打卡表\n\n### [第 28 页]\n\n![第 28 页教学插图与实验活动](figures/p28.png)\n\n我的健康生活计划计划人：\n开始时间：\n年月健康目标习惯养成具体实践执行效果健康计划打卡表我们一起来制订一个管理情绪、坚持运动的计划吧。\n\n#### 💬 研讨和同学交流自已的健康生活计划，说一说这个计划是否需要修改。\n预估一下实施计划过程中的难处，如何去克服？\n\n### [第 29 页]\n\n![第 29 页教学插图与实验活动](figures/p29.png)\n\n#### 🚀 拓展\n\n“平衡膳食”“充足睡眠”“合理运动”是健康不运动会不会胖？\n生活的基本要素。如果我们只关注其中一两项是否可以呢？\n任选两项放入图中，如“平衡膳食+充足睡眠”，仅做到这两项是健康的生活吗？\n平衡充足可能会带来怎样的结果呢？把你的想法填膳食睡眠入中间区域。\n试着做不同组合的分析。\n合理充足我们把三个运动睡眠要素相结合，结果会怎样？\n合理运动教育科子出平衡膳食充足睡眠对于健康问题只考虑一个方面是不够的，需要我们从多个方面做好准备和计划。\n\n### [第 30 页]\n\n![第 30 页教学插图与实验活动](figures/p30.png)\n\n#### 📋 单元小结平衡膳食充足睡眠合理运动正确防护生长发育脑的保健生理健康健康生活心理健康对健康的态度认识我们的管理自己的关心他人的合理的可行的情绪情绪情绪目标计划我们正处在快速生长的青春期，身体健康状况会明显地影响我们的学习、生活和社交。想要拥有健康的身体，不仅要满足平衡食、充足睡眠、合理运动等健康生活基本要求，还需要有一个健康的大脑以保持活跃的思维和良好的情绪。\n子弘我的收获评价内容评价等级我开始重视自己的成长和健康状况怎样改进呢？\n我知道自己的饮食习惯存在什么问题我能做到在别人情绪波动时给予关心我学会了制订个人健康生活计划\n\n### [第 31 页]\n\n![第 31 页教学插图与实验活动](figures/p31.png)\n\n#### 📖 科学阅读保持身体的清洁卫生女生10岁左右，男生12岁左右，就会进人身体第二个快速发育的时期，这就是青春期。青春期的我们，因为身体发育，体内新陈代谢速度比较快，又因为每天运动量比较大，出汗量会增加，这些和油脂分泌都会让皮肤、毛发存有很多脏东西。油油的头发、难闻的汗臭既不利于身体健康，也会影响自身的形象。所以，我们要勤洗澡，保持身体清洁卫生。\n此外，我们还要保持衣物干净、整洁，特别是贴身穿的内衣、袜子要经常换洗，因为它们会吸收汗液和油脂，又不容易透气，很容易导致细菌滋生从而引发疾病。清洗内衣和袜子的时候应分开清洗，因为袜子很容易沾染细菌，并传给内衣。在清洗前，可以使用适量的家用消毒液浸泡袜子一段时间，杀灭细菌。\n学出\n\n### [第 32 页]\n\n![第 32 页教学插图与实验活动](figures/p32.png)\n\n脑的功能大脑的主要组成部分包括额叶、叶、枕叶、顶叶等，每个脑叶负责执行特定的功能。\n用手摸一摸脑门，这里面是思维功能体觉功能脑前面的部分，我们把它称为额叶，通常认为它具有精神听觉功能功能和思维功能。将手放在双耳上方，叶就在精神功能这里，可以处理声音和语言，同时部分长时记忆也在这里加工。摸摸后脑，这里面是枕叶，它的主要功能是视觉加视觉功能工。捂住头顶，那里面是顶叶，主要负责定位、计算和某些类型的识别等功能。\n小脑位于大脑尾部的下端，负责协调并控制各种躯体运动，比如让我们跑步、踢球时肢体更协调，确保我们的手准确地使用筷子把食物放进嘴里等。小脑也存储机械运动记忆，比如系红领巾、切菜等。\n人的行为受脑的支配，脑的生长发育对人的行为是有影响的。例如，额叶在人的成长过程中成熟得比较慢，青春后期的额叶仍然在成熟过程中，因此青春期额叶的情绪调节能力还不完全。这就是为什么青少年比成人更容易受情绪的支配，容易急躁、发脾气。\n\n### [第 33 页]\n\n![第 33 页教学插图与实验活动](figures/p33.png)\n\n第二单元光教育科学出版术晴天，在小树林中，我们会看见阳光透过树叶，形成一道道笔直的光束。雨后，我们有时能看见天边的彩虹，还有水面上树木和白云的倒影，这些现象都与光有关。那么，光有什么特性呢？它是怎样传播的？工程师们利用光的特性发明了唧些工具？"}, {"id": "sci_11_u02_l01", "lesson_idx": 212, "book": "六年级上册", "vol_dir": "11_六年级上册", "unit_no": 2, "unit_title": "第二单元光", "lesson_no": 1, "title": "怎样能看到物体", "page": 34, "domain": "physics_optics", "domain_cn": "综合科学探究", "sim_file": "sim_g11_s1_u02_l01.html", "code": "g11_s1_u02_l01", "sections": {"focus": "我们是怎样看清周围的世界的？这与光有什么关系？\n北斗七星的星光", "exploration": "在上页的5幅图中，哪些是光源？这些光资料源有什么不同？我们为什么能看到这些光源？\n光源可以分为自然光源和人造光源。比如，太阳是自然光0. 安全提醒源，电灯是人造光源。\n太阳、激光笔等光源发出的光很强烈，不能直接用眼睛正对着去看，它们会对我们的眼睛造成伤害。\n透光孔\n2. 我们能看到发光的光源，那么能不能看到不发光的物体呢？\n观察黑盒中的贴纸。\n观察孔一找一个黑色金子，在上侧面和左侧面分别打一个透光孔和观察孔，在右侧面内壁贴一个贴纸作为观察目标。\n用手指堵住透光孔，试一试从观察孔能否看到贴纸。\n透光孔将手指从透光孔上移开，试一试从贴纸观察孔能否看到贴纸。\n用手指控制透光孔透光的多少，看S贡贴纸的清晰度有什么变化。\n透光孔观察孔贴纸", "discussion": "脑接收和处理，于是我们就看到物体了。\n在没有光的环境中，我们能看到物体吗？为什么？\n如果在黑盒不同侧面开设透光孔，对我们观察物体的效果有什么影响？", "expansion": "建筑中的“天窗”明亮的光不但能让我们更清晰地看到物体，而且会让人产生积极的情绪感受，所以采光是各种建筑在设计中必须考虑的一个非常重要的因素。采光有时会和其他功能巧妙地结合到一个建筑元素中，从而让建筑更加美观、舒适，更富有文化特色。在我国古代的建筑中，人们普遍采用了“天窗”这一建筑元素，给人一种“别有洞天”的奇妙感觉。在现代建筑中，设计师也常利用“天窗”这一元素。搜集资料，思考古代建筑中“天窗”的不同作用，以及如何将它应用在现代建筑中。\n古代建筑中的天窗现代建筑中的天窗", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p34.webp", "p35.webp", "p36.webp", "p37.webp"], "raw_text": "### [第 34 页]\n\n![第 34 页教学插图与实验活动](figures/p34.png)\n\n## 1. 怎样能看到物体\n\n\n怎样能看到物体教室里的灯光太阳光萤火虫发出的光烛光白天，我们能清楚地看到周围的世界，但在晚上却看不清。\n\n#### 🎯 聚焦我们是怎样看清周围的世界的？这与光有什么关系？\n北斗七星的星光\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g11_s1_u02_l01.html)\n\n\n### [第 35 页]\n\n![第 35 页教学插图与实验活动](figures/p35.png)\n\n#### 🔬 探索在上页的5幅图中，哪些是光源？这些光资料源有什么不同？我们为什么能看到这些光源？\n光源可以分为自然光源和人造光源。比如，太阳是自然光0. 安全提醒源，电灯是人造光源。\n太阳、激光笔等光源发出的光很强烈，不能直接用眼睛正对着去看，它们会对我们的眼睛造成伤害。\n透光孔\n2. 我们能看到发光的光源，那么能不能看到不发光的物体呢？\n观察黑盒中的贴纸。\n观察孔一找一个黑色金子，在上侧面和左侧面分别打一个透光孔和观察孔，在右侧面内壁贴一个贴纸作为观察目标。\n用手指堵住透光孔，试一试从观察孔能否看到贴纸。\n透光孔将手指从透光孔上移开，试一试从贴纸观察孔能否看到贴纸。\n用手指控制透光孔透光的多少，看S贡贴纸的清晰度有什么变化。\n透光孔观察孔贴纸\n\n### [第 36 页]\n\n![第 36 页教学插图与实验活动](figures/p36.png)\n\n想一想，把这个透光孔开在什么位置，能更加清晰地看到贴纸？\n\n#### 📝 记录单观察黑盒中的贴纸日期：\n操作观察到的现象遥住透光孔不遮透光孔遮住一部分透光孔我的发现：\n眼暗中的晶状体相当于相机的镜头，而视网膜则相当于相机的底片或感光元件。我们之所以能看到物体，是因为在有光的情况下，外界物体的影像会经过晶状体投射在视网膜上，视网膜将光信号变成神经信号，然后通过神经系统传递到大脑并被大\n\n#### 💬 研讨脑接收和处理，于是我们就看到物体了。\n在没有光的环境中，我们能看到物体吗？为什么？\n如果在黑盒不同侧面开设透光孔，对我们观察物体的效果有什么影响？\n\n### [第 37 页]\n\n![第 37 页教学插图与实验活动](figures/p37.png)\n\n#### 🚀 拓展建筑中的“天窗”明亮的光不但能让我们更清晰地看到物体，而且会让人产生积极的情绪感受，所以采光是各种建筑在设计中必须考虑的一个非常重要的因素。采光有时会和其他功能巧妙地结合到一个建筑元素中，从而让建筑更加美观、舒适，更富有文化特色。在我国古代的建筑中，人们普遍采用了“天窗”这一建筑元素，给人一种“别有洞天”的奇妙感觉。在现代建筑中，设计师也常利用“天窗”这一元素。搜集资料，思考古代建筑中“天窗”的不同作用，以及如何将它应用在现代建筑中。\n古代建筑中的天窗现代建筑中的天窗"}, {"id": "sci_11_u02_l02", "lesson_idx": 间一张带孔的卡纸向左或向右移动1~2厘来移出一张带孔的卡纸我的结论：\n\n### [第 41 页]\n\n![第 41 页教学插图与实验活动](figures/p41.png)\n\n#### 💬 研讨实验中观察到了哪些现象？这些现象说明了光是怎样传播的？\n怎样解释在阳光下物体会产生影子的现象？\n\n#### 🚀 拓展\n\n《墨经》是我国战国时期的科学家墨子的著作，其中记录了“小孔成像”实验，在一间黑暗小屋朝阳的墙上开一个小孔，人对着小孔站在屋外，屋里与小孔相对的墙上就出现了一个倒立的人影。这个现象可以用光沿直线传播来解释。\n教育科我们也可以利用烛火和纸屏来做小孔成像的实验，观察纸屏上的烛火像与纸屏前的烛火有什么不同。前后移动纸屏，观察纸屏上的烛火像有什么变化。"}, {"id": "sci_11_u02_l03", "lesson_idx": 214, "book": "六年级上册", "vol_dir": "11_六年级上册", "unit_no": 2, "unit_title": "第二单元光", "lesson_no": 3, "title": "光能穿透物体吗", "page": 42, "domain": "physics_optics", "domain_cn": "综合科学探究", "sim_file": "sim_g11_s1_u02_l03.html", "code": "g11_s1_u02_l03", "sections": {"focus": "光在传播中如果遇到物体，能够穿透过去吗？会出现什么现象？", "exploration": "尝试用以下各种材料进行实验，光能穿透过去吗？\n厚皮革浅色薄布普通玻璃磨砂塑料片厚纸板磨砂玻璃\n2. 取一个大的长方体厚纸盒，左侧面开一个光照孔，盒子靠近光照孔的一端设有观察孔可以插人不同材料的卡槽。靠近右侧面的材料卡槽顶部开一个观察孔，正对观察孔的底面上贴一张笑脸贴纸。\n版用手电筒作为光源照射光照孔，分别光照孔笑险贴纸把浅色薄布、普通玻璃和厚纸板等材料放入卡槽，通过观察孔，我们能看清楚底部的贴纸吗？\n实验材料观察孔材料卡槽光照孔", "discussion": "光能穿透什么样的物体？这些物体在生活中有哪些应用？\n当光照射一个不透明的物体时，会发生什么现象？\n在什么情况下，我们能在小树林中看到光束？", "expansion": "育当月球运行至太阳和地球之间的某个位置时，会部分或全部遮挡住照射到地球的太阳光，地球上某些地区的人们就能看到日食日食；而当月球运行至地球的阴影中时，就会发生月食。尝试用有关光的传播的知识解释上述现象。\n月食", "frontier": "", "big_concept": "光在同种均匀介质中沿直线传播，在不同介质界面遵循反射定律（∠i = ∠r）与折射定律（Snell定律），是物质微观能级跃迁释放的电磁波。", "misconception": ""}, "figures": ["p42.webp", "p43.webp", "p44.webp", "p45.webp"], "raw_text": "### [第 42 页]\n\n![第 42 页教学插图与实验活动](figures/p42.png)\n\n## 3. 光能穿透物体吗\n\n\n光能穿透物体吗阳光从玻璃窗照进来，室内亮堂堂的；但如果拉上窗帘，光就会被遮挡一肉学\n\n#### 🎯 聚焦光在传播中如果遇到物体，能够穿透过去吗？会出现什么现象？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **尖端光电科技（空间激光通信与超精密光刻机）**：我国“墨子号”量子科学实验卫星实现了千公里级星地量子纠缠分发与保密通信；而在超精密芯片制造中，极紫外光（EUV，波长13.5纳米）通过超光滑多层反射镜阵列精确聚焦刻蚀纳米级晶体管线路！\n- 🧠 **跨学科大概念（波粒二象性与波动几何学）**：光在同种均匀介质中沿直线传播，在不同介质界面遵循反射定律（∠i = ∠r）与折射定律（Snell定律），是物质微观能级跃迁释放的电磁波。\n- ⚠️ 常见认知迷思：“人在镜子里看到的像是一个真实存在的发光物体”。**科学真相**：平面镜成像属于虚像，是由镜面反射的漫反射发散光线被人眼反向延长线相交在大脑中汇聚而成的视觉暂留感知，镜子后方并不存在实际光线会聚点！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g11_s1_u02_l03.html)\n\n\n### [第 43 页]\n\n![第 43 页教学插图与实验活动](figures/p43.png)\n\n#### 🔬 探索尝试用以下各种材料进行 界面遵循反射定律（∠i = ∠r）与折射定律（Snell定律），是物质微观能级跃迁释放的电磁波。\n- ⚠️ 常见认知迷思：“人在镜子里看到的像是一个真实存在的发光物体”。**科学真相**：平面镜成像属于虚像，是由镜面反射的漫反射发散光线被人眼反向延长线相交在大脑中汇聚而成的视觉暂留感知，镜子后方并不存在实际光线会聚点！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g11_s1_u02_l04.html)\n\n\n### [第 47 页]\n\n![第 47 页教学插图与实验活动](figures/p47.png)\n\n创设一个较暗的环境。调整手电筒与窄缝的距离，直到形成一道狭窄的光束。\n·使用平面镜将光束反射到中间的纸屏上。调整平面镜的角度，观察纸屏上光斑的位置并标记。\n·重复上面的实验，能否根据平面镜的角度正确预测反射光斑的位置？用画图的方法表示出来。\n纸屏手电筒窄缝手电筒平面镜反射光斑平面镜纸屏\n\n#### 📝 记录单光在镜面上的反射示意图日期：\n观察混合液中的光路。\n创设一个较暗的环境，让光照射面粉与水的混合液中的镜面，观察出现的现象。调整平面镜的角度，观察现象有什么变化，画出光的反射路径。\n\n### [第 48 页]\n\n![第 48 页教学插图与实验活动](figures/p48.png)\n\n平面镜\n\n#### 📝 记录单光在水槽里的镜面反射示意图日期：\n育科学大资料\n3. 在黑暗的桌屉中找橡皮。\n我们能看到不发光的物体，是因为它们把光源在桌屉最暗处有一块橡发出的光反射进了我们的眼睛。所有物体都会或多皮，如何摆放平面镜才能让或少地反射光，只是大多数时候物体的表面不像平橡皮被照亮呢？\n面镜那么平整，因此反射的光不像镜面反射时那样规则。\n\n### [第 49 页]\n\n![第 49 页教学插图与实验活动](figures/p49.png)\n\n#### 📝 记录单用平面镜照亮橡皮时光的路径图日期：\n\n#### 💬 研讨通过调整平面镜的角度，我们看到了桌屉内的橡皮，那么光是怎样从橡皮反射进我们眼睛的呢？\n举例说明日常生活中哪些地方也用到了光的反射原理。\n育\n\n#### 🚀 拓展到底有多少个乒乓球？\n在白纸上画个半圆，像量角器的刻度线那样，在半圆上画出不同的角度；用两面小镜子形成一个夹角，把乒乓球放在镜子中间。当改变镜子间的夹角时，你能看到几个乒乓球？说一说这是什么现象。"}, {"id": "sci_11_u02_l05", "lesson_idx": 216, "book": "六年级上册", "vol_dir": "11_六年级上册", "unit_no": 2, "unit_title": "第二单元光", "lesson_no": 5, "title": "设计潜望镜", "page": 50, "domain": "physics_optics", "domain_cn": "综合科学探究", "sim_file": "sim_g11_s1_u02_l05.html", "code": "g11_s1_u02_l05", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "", "frontier": "", "big_concept": "光在同种均匀介质中沿直线传播，在不同介质界面遵循反射定律（∠i = ∠r）与折射定律（Snell定律），是物质微观能级跃迁释放的电磁波。", "misconception": ""}, "figures": ["p50.webp", "p51.webp", "p52.webp", "p53.webp"], "raw_text": "### [第 50 页]\n\n![第 50 页教学插图与实验活动](figures/p50.png)\n\n## 5. 设计潜望镜\n\n\n设计潜望镜潜望镜在科学研究和国防建设上有很多用途。科研工作者可以用它在地下室里观察火箭的发射，在保护墙内观测有放射性危险的实验：潜艇在水下航行时，人们可以在潜艇里用它观察水面上的情况。生活中，我们可以用潜望镜做好多事情呢！\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **尖端光电科技（空间激光通信与超精密光刻机）**：我国“墨子号”量子科学实验卫星实现了千公里级星地量子纠缠分发与保密通信；而在超精密芯片制造中，极紫外光（EUV，波长13.5纳米）通过超光滑多层反射镜阵列精确聚焦刻蚀纳米级晶体管线路！\n- 🧠 **跨学科大概念（波粒二象性与波动几何学）**：光在同种均匀介质中沿直线传播，在不同介质界面遵循反射定律（∠i = ∠r）与折射定律（Snell定律），是物质微观能级跃迁释放的电磁波。\n- ⚠️ 常见认知迷思：“人在镜子里看到的像是一个真实存在的发光物体”。**科学真相**：平面镜成像属于虚像，是由镜面反射的漫反射发散光线被人眼反向延长线相交在大脑中汇聚而成的视觉暂留感知，镜子后方并不存在实际光线会聚点！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g11_s1_u02_l05.html)\n\n\n### [第 51 页]\n\n![第 51 页教学插图与实验活动](figures/p51.png)\n\n任务设想一个潜望镜的使用场景，利玩躲藏游戏时可以用它观察用光的知识设计并制作一个潜望镜，小伙伴的情况。\n用它可以清楚地观察外界情况。\n潜水员可以用它观察水面上的情况。\n可以用它细致地观察小金鱼进食。\n要求技术人员可以利用生活中常见的材料。\n用它来检查下水道使用生活中常见的工具。\n学幺服社中的故障能清楚地观察目标物品或现象。\n资料汉代初年成书的《淮南万毕术》记载：“取大镜高悬，置水盆于下，则见四邻矣。”意思是利用挂在高处的镜子，可将四周的景象反射到水盆中，以此来观察四周的情况。高处的镜子和低处的水面形成了一种类似潜望镜的“平面镜组合”，由此可知至少在公元前2世纪，我国人民已经掌握了镜面反射的原理并加以利用了。\n\n### [第 52 页]\n\n![第 52 页教学插图与实验活动](figures/p52.png)\n\n设计方案探索平面镜摆放的方法。\n观察潜望镜的外形，仿照做一个“之”形通道。试一试，怎样在两个转角处摆放平面镜？\n提示确定平面镜摆放的位置和角度的方法：\n1. 从通道一端能看利用平面潜望镜是一种可到另一端的物体。\n镜，光可以反以让光拐弯的装置，\n2. 手电筒的光能从射，就可以实可以让原本看不到的通道一端射入后，从另现拐弯。\n物体被看到。\n一端顺利射出。\n好主意！要拐几次弯呢？\n光沿直线传播，无法拐弯。\n学出根据探索的情况，在图中标出平面镜的摆放位置和角度，说一说这样摆放的理由。用直线和箭头标平面镜眼晴出光的行进路线。\n平面镜摆放成什么角度？\n物体\n\n### [第 53 页]\n\n![第 53 页教学插图与实验活动](figures/p53.png)\n\n3. 根据潜望镜的使用场景，合理选不同用处的择材料和工具。\n潜望镜要用不同的材料哟！\n讨论、确定方案，画出潜望镜设计图。\n记得标出零部\n\n#### 📝 记录单件的名称和它们的大小与材质哟！\n潜望镜设计记录单学出社潜望镜用途：\n设计图制作材料：\n制作工具："}, {"id": "sci_11_u02_l06", "lesson_idx": 217, "book": "六年级上册", "vol_dir": "11_六年级上册", "unit_no": 2, "unit_title": "第二单元光", "lesson_no": 6, "title": "制作潜望镜", "page": 54, "domain": "physics_optics", "domain_cn": "综合科学探究", "sim_file": "sim_g11_s1_u02_l06.html", "code": "g11_s1_u02_l06", "sections": {"focus": "", "exploration": "", "discussion": "", "expansion": "利用光的各种特性制造的，用于观察、显示、测量等用途的仪器叫光学仪器。查阅资料，了解常见光学仪器的使用方法，以及它们在人们的生产生活、科学研究、国防建设等方面发挥的作用。\n育科学投影仪光学显微镜望远镜照相机", "frontier": "", "big_concept": "光在同种均匀介质中沿直线传播，在不同介质界面遵循反射定律（∠i = ∠r）与折射定律（Snell定律），是物质微观能级跃迁释放的电磁波。", "misconception": ""}, "figures": ["p54.webp", "p55.webp", "p56.webp", "p57.webp"], "raw_text": "### [第 54 页]\n\n![第 54 页教学插图与实验活动](figures/p54.png)\n\n## 6. 制作潜望镜\n\n\n制作潜望镜制作潜望镜是一项非常考验合作能力的工作！\n实施方案科各部分之根据方案分工制作潜望镜。\n间怎样连接？\n选择合适的材料和工具，加工、制作各种零部件；然后进行组装，并调试平面镜的位置。\n可以分为哪几部分？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **尖端光电科技（空间激光通信与超精密光刻机）**：我国“墨子号”量子科学实验卫星实现了千公里级星地量子纠缠分发与保密通信；而在超精密芯片制造中，极紫外光（EUV，波长13.5纳米）通过超光滑多层反射镜阵列精确聚焦刻蚀纳米级晶体管线路！\n- 🧠 **跨学科大概念（波粒二象性与波动几何学）**：光在同种均匀介质中沿直线传播，在不同介质界面遵循反射定律（∠i = ∠r）与折射定律（Snell定律），是物质微观能级跃迁释放的电磁波。\n- ⚠️ 常见认知迷思：“人在镜子里看到的像是一个真实存在的发光物体”。**科学真相**：平面镜成像属于虚像，是由镜面反射的漫反射发散光线被人眼反向延长线相交在大脑中汇聚而成的视觉暂留感知，镜子后方并不存在实际光线会聚点！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g11_s1_u02_l06.html)\n\n\n### [第 55 页]\n\n![第 55 页教学插图与实验活动](figures/p55.png)\n\n制作我们的潜望镜。\n牙膏盒、水杯盒等都可以用来制作潜望镜。\n选用两个纸盒及工具。\n②把其中一个纸盒裁成两截，另一个去掉两端的盒盖。\n③在封口端分别裁剪出两个合适\n4. 根据设计图，用胶带把它们黏的插口，安装并调试平面镜的合起来。\n摆放角度。\n·制作潜望镜有许多面镜橡皮筋方法，我们还可以参考子出版其他方案。\n我的潜望镜可以常纸直筒用来做什么？选用什塑料么材料？制作的主要步骤是什么？平面镜是怎样安装的？\n平面镜塑料平面镜软管\n\n### [第 56 页]\n\n![第 56 页教学插图与实验活动](figures/p56.png)\n\n2. 展示与汇报。\n向全班展示设计图，汇报设计的思路和材料，然后展示作品并做讲解。\n测试改进测试潜望镜能否完成我们的任务，并根据发现的问题提出改进意见。\n\n### [第 57 页]\n\n![第 57 页教学插图与实验活动](figures/p57.png)\n\n如果在水中使用潜望镜，镜身需要使用什\n\n#### 📝 记录单么材料呢？如果要观察改进潜望镜较暗处的景物呢？\n日期：\n使用场景使用中的问题改进的方法检查下水道中的故障光线太暗，看不到物体在前端加装灯光\n\n#### 🚀 拓展利用光的各种特性制造的，用于观察、显示、测量等用途的仪器叫光学仪器。查阅资料，了解常见光学仪器的使用方法，以及它们在人们的生产生活、科学研究、国防建设等方面发挥的作用。\n育科学投影仪光学显微镜望远镜照相机"}, {"id": "sci_11_u02_l07", "lesson_idx": 218, "book": "六年级上册", "vol_dir": "11_六年级上册", "unit_no": 2, "unit_title": "第二单元光", "lesson_no": 7, "title": "制造彩虹", "page": 58, "domain": "physics_optics", "domain_cn": "综合科学探究", "sim_file": "sim_g11_s1_u02_l07.html", "code": "g11_s1_u02_l07", "sections": {"focus": "彩虹的出现似乎与水有关。\n我们可以用水来制造彩虹吗？", "exploration": "用水和镜子制造彩虹。\n在阳光下放一杯清水，将镜子斜立在杯子中，调整镜子的角度，使光照射到墙面上，观察墙面上的现象并记录。\n阴天时，我们可以怎样做呢？\n用三棱镜制造彩虹。\n把白光通过三棱镜后产生的彩虹画下来，观察彩虹由哪些颜色的光组成，以及它们的排列顺序。\n科兰出", "discussion": "在生活中，有哪些材料可以替代三棱镜来制造彩虹？\n推测一下，雨过天晴后的彩虹是怎样产生的？还有哪些方法可以制造彩虹？", "expansion": "观察三色光的叠加用红、绿、蓝三色透明塑料片，依次遮住手电筒的灯泡，将手电筒发出的光分别投射到白纸上，观察纸上是什么颜色的光。如果将三色光叠加投射在白纸上，会是什么颜色？想一想，为什么我们能看见这些颜色的光？\n教", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p58.webp", "p59.webp", "p60.webp", "p61.webp", "p62.webp", "p63.webp", "p64.webp", "p65.webp"], "raw_text": "### [第 58 页]\n\n![第 58 页教学插图与实验活动](figures/p58.png)\n\n## 7. 制造彩虹\n\n\n制造彩虹雨过天晴，天边有时会出现彩虹。\n教育科学出\n\n#### 🎯 聚焦彩虹的出现似乎与水有关。\n我们可以用水来制造彩虹吗？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g11_s1_u02_l07.html)\n\n\n### [第 59 页]\n\n![第 59 页教学插图与实验活动](figures/p59.png)\n\n#### 🔬 探索用水和镜子制造彩虹。\n在阳光下放一杯清水，将镜子斜立在杯子中，调整镜子的角度，使光照射到墙面上，观察墙面上的现象并记录。\n阴天时，我们可以怎样做呢？\n用三棱镜制造彩虹。\n把白光通过三棱镜后产生的彩虹画下来，观察彩虹由哪些颜色的光组成，以及它们的排列顺序。\n科兰出\n\n### [第 60 页]\n\n![第 60 页教学插图与实验活动](figures/p60.png)\n\n#### 📝 记录单制造彩虹实验日期：\n方法现象用水和镜子用三棱镜\n3. 试一试，用更多的方法制造彩虹。\n资料太阳光看上去是白色的，但它实际上是由许多不同颜色的光组成的。当白色光进入棱镜或水中时，就会分散成排列有序的“红橙黄绿蓝靛紫”彩色光带。\n斗学出\n\n### [第 61 页]\n\n![第 61 页教学插图与实验活动](figures/p61.png)\n\n#### 💬 研讨在生活中，有哪些材料可以替代三棱镜来制造彩虹？\n推测一下，雨过天晴后的彩虹是怎样产生的？还有哪些方法可以制造彩虹？\n\n#### 🚀 拓展观察三色光的叠加用红、绿、蓝三色透明塑料片，依次遮住手电筒的灯泡，将手电筒发出的光分别投射到白纸上，观察纸上是什么颜色的光。如果将三色光叠加投射在白纸上，会是什么颜色？想一想，为什么我们能看见这些颜色的光？\n教\n\n### [第 62 页]\n\n![第 62 页教学插图与实验活动](figures/p62.png)\n\n#### 📋 单元小结光的小孔成像传播沿直线传播影子的形成光的光照射在物体表镜面反射光反射面会出现”反弹制作潜望镜光的三棱镜分解彩色光合成与合用“水”等其他方法白光成我们之所以能够看到五彩缤纷的世界，是因为有太阳这个最重要的自然光源在不断发光。光照射在物体上，又被物体反射到人眼中，我们就可以看到物体了。人们利用光的反射特性，发明了潜望镜。光还有其他许多特性有待我们继续研究，例如，三棱镜可以将白光分解为不同颜色的光，而彩色光又可以合成白光。知识如海洋，探索是一个永无止境的航程。\n我的收获评价内容评价等级怎样改进呢？\n我知道人眼能看到物体是因为有光进入眼睛我能解释由光的传播方式产生的相关现象我能解释潜望镜的原理我会制作简易潜望镜我认识到技术对国家强大的作用\n\n### [第 63 页]\n\n![第 63 页教学插图与实验活动](figures/p63.png)\n\n#### 📖 科学阅读光与视觉两千多年前，毕达哥拉斯、柏拉图、欧几里得等古希腊学者曾认为，人之所以能看到各种东西，是因为眼晴里发出的“触须”投射到了物体上。今天我们已经知道，是外界物体发出或反射、折射的光进入眼晴引起了视觉。\n人的视网膜中有感光细胞。我们能在很暗的房间里粗略看到物体的轮廊却没有颜色的感觉，是其中一种杆形的视杆细胞在发挥作用。锥形的视锥细胞则在比较亮的环境下帮助我们形视杆细胞-成对各种颜色的感觉，使我们看到多姿多彩的大千世界。事实上，每个人的视锥细胞接收光形成颜色感觉的能力都会略有不同，只是多数人的差异不大。\n一视网膜视锥细胞\n\n### [第 64 页]\n\n![第 64 页教学插图与实验活动](figures/p64.png)\n\n动物眼晴里的感光细胞和人类不一样，有些动物的视锥细胞比人类少，而有些动物则比人类多，同样的光在动物眼中产生的颜色感觉与人并不相同。比如草丛、树叶反射的光进人人眼会让我们感觉到绿色，老虎身体反射的光进入人眼则会让我们感知到黄黑相间的颜色，这两种光进人牛、羊、鹿等许多动物的眼中产生的颜色感觉却没有明显区别。所以，绿色草丛、灌木中的老虎在我们眼中颜色鲜明，但在老虎的猎物们眼中却和周围环境融为一体，难以被发现。\n光除了引起视觉，是人类获取信息的重要途径之外，还对人体有许多生理、心理等方面的影响。昼夜交替的光照变化是人体生理节律的重要基础。学习时明亮的光照会让人更清醒、兴奋，从而提高学习效率：睡觉时则需要比较暗的环境，否则会影响睡眠质量。长时间、近距离看手机等电予产品的屏幕不仅可能影响视力，晚上看多了还会影响睡眠。\n如今，通过深人研究光如何通过视觉或非视觉的方式来影响人体，我们可以用光来治疗生理、心理疾病。科学合理地使用光，会让我们的身心更健康。\n\n### [第 65 页]\n\n![第 65 页教学插图与实验活动](figures/p65.png)\n\n第三单元地球的运动太阳总是东升西落，周而复始，为什么会这样呢？\n季节总是春夏秋冬，有序循环，是什么原因呢？\n夏热冬冷，又是什么原因呢？\n其实，这些现象都与地球的运动密切相关，让我们一起来探索这些问题，揭开地球运动的奥秘。"}, {"id": "sci_11_u03_l01", "lesson_idx": 219, "book": "六年级上册", "vol_dir": "11_六年级上册", "unit_no": 3, "unit_title": "第三单元地球的运动", "lesson_no": 1, "title": "利用地球模型来研究", "page": 66, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g11_s1_u03_l01.html", "code": "g11_s1_u03_l01", "sections": {"focus": "我们观察过的哪些现象与昼夜交替、四季变化有关？", "exploration": "分享我们的观察和思考。\n冬天上学时，天才蒙蒙亮，而夏南半球和北天上学时，太阳已半球季节相反，经升得很高了。\n是这样吗？\n整理信息。\n小组讨论，对大家观察到的现象和提出的问题进行分类整理。\n班级记录单科班级记录单我们的观察我们的问题日期：\n日期：\n昼夜现象四季现象尽夜会交替四季会变化昼夜有长短", "discussion": "通过交流，我们知道了哪些现象？产生了哪些疑问？\n通过观察地球仪，我们有哪些新的认识和问题？\n根据现有的条件，我们可以选择哪些问题去研究？", "expansion": "我们可以利用乒乓球、大蒜等常见物体制作地球模型，方便我们研究地球的运动。\n大蒜地球模型社乒乓球地球模型用乒乓球制作地球模型", "frontier": "", "big_concept": "地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。", "misconception": ""}, "figures": ["p66.webp", "p67.webp", "p68.webp", "p69.webp"], "raw_text": "### [第 66 页]\n\n![第 66 页教学插图与实验活动](figures/p66.png)\n\n## 1. 利用地球模型来研究\n\n\n利用地球模型来研究因为地球太大，所以科学家常常利用模型进行研究。地球模型是研究地球的重要工具。昼夜交替、四季变化都可以借助地球模型来研究。地球仪就是常用的地球模型。\n\n#### 🎯 聚焦我们观察过的哪些现象与昼夜交替、四季变化有关？\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿地球科学（深地探测与“奋斗者”号深潜）**：我国“深地一号”油气钻井已穿透地下万米白垩系地层，结合地震波断层成像技术，科学家如同给地球做“超声波CT”，实时洞察地壳构造板块运动与深部地幔热柱对流！\n- 🧠 **跨学科大概念（稳定与变化 / 因果机制）**：地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。\n- ⚠️ 小学生常认为“岩石是永恒不变、坚不可摧的”。**科学真相**：在水、大气、温度变化以及植物根系分泌酸的作用下，岩石在持续发生物理风化与化学侵蚀，并在地质循环中重熔为岩浆或沉积为土壤，地表始终在缓慢而剧烈地重塑。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g11_s1_u03_l01.html)\n\n\n### [第 67 页]\n\n![第 67 页教学插图与实验活动](figures/p67.png)\n\n#### 🔬 探索分享我们的观察和思考。\n冬天上学时，天才蒙蒙亮，而夏南半球和北天上学时，太阳已半球季节相反，经升得很高了。\n是这样吗？\n整理信息。\n小组讨论，对大家观察到的现象和提出的问题进行分类整理。\n班级记录单科班级记录单我们的观察我们的问题日期：\n日期：\n昼夜现象四季现象尽夜会交替四季会变化昼夜有长短\n\n### [第 68 页]\n\n![第 68 页教学插图与实验活动](figures/p68.png)\n\n利用模型来研究。\n观察地球仪，我们可以发现许多有关地球的信息。\n我观察到赤地球仪地球仪上标有许道将地球分为南上的地轴总多网格线，它们有什北半球。\n是有点斜。\n么作用？\n\n#### 📝 记录单资料地球仪上的信息地球模型有多种类型，有专门日期：\n反映地形的，也有反映行政区划的，还有反映地壳运动的..不同的模型反映不同领域的知识，具有不同的用途。\n\n### [第 69 页]\n\n![第 69 页教学插图与实验活动](figures/p69.png)\n\n#### 💬 研讨通过交流，我们知道了哪些现象？产生了哪些疑问？\n通过观察地球仪，我们有哪些新的认识和问题？\n根据现有的条件，我们可以选择哪些问题去研究？\n\n#### 🚀 拓展我们可以利用乒乓球、大蒜等常见物体制作地球模型，方便我们研究地球的运动。\n大蒜地球模型社乒乓球地球模型用乒乓球制作地球模型"}, {"id": "sci_11_u03_l02", "lesson_idx": 220, "book": "六年级上册", "vol_dir": "11_六年级上册", "unit_no": 3, "unit_title": "第三单元地球的运动", "lesson_no": 2, "title": "昼夜交替的解释", "page": 70, "domain": "astronomy", "domain_cn": "综合科学探究", "sim_file": "sim_g11_s1_u03_l02.html", "code": "g11_s1_u03_l02", "sections": {"focus": "昼夜交替是怎样形成的？是太阳自东向西地运动，还是地球在运动？", "exploration": "关于昼夜交替现象成因的假说自古以来，人们一直试图对昼夜交替现象的成因给出合理的解释。我们也可以大胆地提出自己的假说，用简单的示意图和文字进行表达。", "discussion": "根据模拟实验结果，我们的假说能成立吗？怎样判断模型上是否出现了昼夜交替现象？\n可以用于解释昼夜交替现象的假说有几种？它们有什么不同？\n现在，科学家们是怎样解释昼夜交替现象的？", "expansion": "“地心说”和“日心说”在人类认识地球运动的历史中，“地心说”和“日心说”是两种代表性的学说。查阅资料，了解这段科学史，和同学交流一下：“日心说”为什么可以土星水星金星太阳火星地球金星火星太阳月木星地球“地心说”示意图“日心说”示意图", "frontier": "", "big_concept": "提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。", "misconception": ""}, "figures": ["p70.webp", "p71.webp", "p72.webp", "p73.webp"], "raw_text": "### [第 70 页]\n\n![第 70 页教学插图与实验活动](figures/p70.png)\n\n## 2. 昼夜交替的解释\n\n\n昼夜交替的解释太阳每天东升西落，白昼黑夜交替出现。\n\n#### 🎯 聚焦昼夜交替是怎样形成的？是太阳自东向西地运动，还是地球在运动？\n\n#### 🔬 探索关于昼夜交替现象成因的假说自古以来，人们一直试图对昼夜交替现象的成因给出合理的解释。我们也可以大胆地提出自己的假说，用简单的示意图和文字进行表达。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿跨学科实证探究**：当代国家重大科研攻关高度重视从基础微观机理到宏观工程应用的闭环跨越，注重通过受控对比实验、数学建模与数据驱动验证科学假设。\n- 🧠 **跨学科大概念（系统模型与科学探究规范）**：提出科学问题 → 确立独立自变量与控制因变量 → 采集高保真量化证据 → 形成严密的CER主张论证闭环。\n- ⚠️ 认知误区：“科学家做实验总是一次就成功得出正确结论”。**科学真相**：科学的发展充满了对前人错误概念的修正、失败数据的排查与严谨同行评议，保持质疑与求真才是科学探索的灵魂！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g11_s1_u03_l02.html)\n\n\n### [第 71 页]\n\n![第 71 页教学插图与实验活动](figures/p71.png)\n\n昼夜交替现象成因的假说昼夜交替现象成因的假说日期：____月____日日期：____月____日太阳不动，地球烧看大阳转地球不动，太阳烧着地球转昼夜交替现象成因的假说\n\n#### 📝 记录单日期：____月____日昼夜交替现象成因的假说日期：\n地球绕着大阳转，同时地球转根据我们的假说，能在地\n2. 利用模型，做模拟实验。\n球模型上模拟出登夜交替吗？\n\n### [第 72 页]\n\n![第 72 页教学插图与实验活动](figures/p72.png)\n\n利用自制的地球模型同样可以做昼夜交替的模拟实验。我们可以在模型上做标志线，以便于观察昼夜覆盖的范围。其实地球仪上的网格线就是一种标志线。\n交流我们的假说和模拟实验的结果。\n班级记录单昼夜交替现象成因的探究日期：\n假说模拟实验结果\n\n### [第 73 页]\n\n![第 73 页教学插图与实验活动](figures/p73.png)\n\n#### 💬 研讨根据模拟实验结果，我们的假说能成立吗？怎样判断模型上是否出现了昼夜交替现象？\n可以用于解释昼夜交替现象的假说有几种？它们有什么不同？\n现在，科学家们是怎样解释昼夜交替现象的？\n\n#### 🚀 拓展\n\n“地心说”和“日心说”在人类认识地球运动的历史中，“地心说”和“日心说”是两种代表性的学说。查阅资料，了解这段科学史，和同学交流一下：“日心说”为什么可以土星水星金星太阳火星地球金星火星太阳月木星地球“地心说”示意图“日心说”示意图"}, {"id": "sci_11_u03_l03", "lesson_idx": 221, "book": "六年级上册", "vol_dir": "11_六年级上册", "unit_no": 3, "unit_title": "第三单元地球的运动", "lesson_no": 3, "title": "地球如何自转", "page": 74, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g11_s1_u03_l03.html", "code": "g11_s1_u03_l03", "sections": {"focus": "像陀螺这样，好像沿着一根穿过自身地球是一个球体，它是怎样自转的？地球自的轴进行旋转的运动转一定会产生昼夜交替现象吗？\n叫自转，这根轴叫自转轴。", "exploration": "尝试让球体自转。\n让一个球体自转起来。怎样能让它的自转持续而稳定呢？\n怎样能让乒乓球转动得更持久一些？\n观察地球仪自转。\n转动地球仪，观察它的自转。地球仪的自转有什么特点呢？\n这根轴模育科学出地轴倾斜的拟了什么？\n样子很特别。", "discussion": "地球自转一定会产生昼夜交替现象吗？请结合我们的模拟实验进行解释。\n对比陀螺的自转和地球的自转，有什么相同和不同？\n地球自转有什么特点？", "expansion": "地轴的倾斜角度是23.5度，这个角度对地球环境有重要的影响。在太阳系中，八颗行星都在自转，但它们自转轴的倾斜角度有比较大的差异。观察下图，推测哪颗行星上基本不会出现昼夜交替现象。\n教科出木星土星天王星海王星本图不代表天体大小的实际比例关系。", "frontier": "", "big_concept": "地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。", "misconception": ""}, "figures": ["p74.webp", "p75.webp", "p76.webp", "p77.webp"], "raw_text": "### [第 74 页]\n\n![第 74 页教学插图与实验活动](figures/p74.png)\n\n## 3. 地球如何自转\n\n\n地球如何自转陀螺转动时，以陀尖为支撑可以在一段时间内不停地旋转。\n资料\n\n#### 🎯 聚焦像陀螺这样，好像沿着一根穿过自身地球是一个球体，它是怎样自转的？地球自的轴进行旋转的运动转一定会产生昼夜交替现象吗？\n叫自转，这根轴叫自转轴。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿地球科学（深地探测与“奋斗者”号深潜）**：我国“深地一号”油气钻井已穿透地下万米白垩系地层，结合地震波断层成像技术，科学家如同给地球做“超声波CT”，实时洞察地壳构造板块运动与深部地幔热柱对流！\n- 🧠 **跨学科大概念（稳定与变化 / 因果机制）**：地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。\n- ⚠️ 小学生常认为“岩石是永恒不变、坚不可摧的”。**科学真相**：在水、大气、温度变化以及植物根系分泌酸的作用下，岩石在持续发生物理风化与化学侵蚀，并在地质循环中重熔为岩浆或沉积为土壤，地表始终在缓慢而剧烈地重塑。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g11_s1_u03_l03.html)\n\n\n### [第 75 页]\n\n![第 75 页教学插图与实验活动](figures/p75.png)\n\n#### 🔬 探索尝试让球体自转。\n让一个球体自转起来。怎样能让它的自转持续而稳定呢？\n怎样能让乒乓球转动得更持久一些？\n观察地球仪自转。\n转动地球仪，观察它的自转。地球仪的自转有什么特点呢？\n这根轴模育科学出地轴倾斜的拟了什么？\n样子很特别。\n\n### [第 76 页]\n\n![第 76 页教学插图与实验活动](figures/p76.png)\n\n3. 地球自转与昼夜交替现象。\n尝试改变地轴的倾斜角度做模拟实验，观察地球模型上是否会出现昼夜交替现象。\n在地球模型的几块大陆上，分别贴上几个反光的小圆片。\n用较强的光源照射地球模型，同时让地球模型自转。\n\n#### 📝 记录单地球自转与昼夜交替现象模拟实验日期：\n敬社地球自转时地轴倾斜的角度与方向观察到的现象①地轴竖直②地轴领斜③地轴平编且与阳光垂直④地轴平且指向太阳三在第④种情况下，昼夜还会交替出现吗？\n\n### [第 77 页]\n\n![第 77 页教学插图与实验活动](figures/p77.png)\n\n#### 💬 研讨地球自转一定会产生昼夜交替现象吗？请结合我们的模拟实验进行解释。\n对比陀螺的自转和地球的自转，有什么相同和不同？\n地球自转有什么特点？\n\n#### 🚀 拓展地轴的倾斜角度是23.5度，这个角度对地球环境有重要的影响。在太阳系中，八颗行星都在自转，但它们自转轴的倾斜角度有比较大的差异。观察下图，推测哪颗行星上基本不会出现昼夜交替现象。\n教科出木星土星天王星海王星本图不代表天体大小的实际比例关系。"}, {"id": "sci_11_u03_l04", "lesson_idx": 222, "book": "六年级上册", "vol_dir": "11_六年级上册", "unit_no": 3, "unit_title": "第三单元地球的运动", "lesson_no": 4, "title": "哪里先迎来黎明", "page": 78, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g11_s1_u03_l04.html", "code": "g11_s1_u03_l04", "sections": {"focus": "北京和乌鲁木齐，哪里先迎来黎明呢？在不同城市旅游时，我们是否发现过类似的现象？\n总出", "exploration": "根据位置关系，分别在两名同学身上贴上北京和乌鲁木齐，哪座城市先迎写有“北京”和“乌鲁来黎明？\n木齐”的卡片。\n·观察地球仪，确定北京和乌鲁木齐两座城市的相对位置。\n●做模拟实验。\n方法一：几名同学手拉手围成圆圈，分别向不同方向转动，谁先看到“太阳”呢？\n方法二：在大蒜上贴两个圆点，红点表示北京，绿点表示乌鲁木齐。\n按照不同的自转方向转动大蒜，红点和绿点哪个先迎来“黎明”呢？\n为什么会有两种不同的结果？\n出", "discussion": "在探讨北京和乌鲁木齐哪里先迎来黎明时，我们是怎样知道的？\n通过探究，结合以前的学习，我们可以知道地球自转的方向是什么样的吗？\n自转一周的时间是多长呢？\n③回顾第一课提出的问题，我们已经解决了哪些问题？", "expansion": "把我们解决问题的思维过程用图示清晰地呈现出来，可以更好地与别人进行交流。\n下图只是一种表示方式，我们也可以用不同的方式进行表达。\n因素1解决办法两地的位置关系借助地球仪确定两问题：\n地的位置关系东西两地哪里玄科先迎来黎明可能性1结果1因素2自东向西西边光迎来黎明地球自转方向可能性2结果2自西向东东边先迎来黎明支持的事实支持的原理太阳东升西落，地球运动物体和周围物体在在自转税觉上的运动方向相反", "frontier": "", "big_concept": "天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。", "misconception": ""}, "figures": ["p78.webp", "p79.webp", "p80.webp", "p81.webp"], "raw_text": "### [第 78 页]\n\n![第 78 页教学插图与实验活动](figures/p78.png)\n\n## 4. 哪里先迎来黎明\n\n\n哪里先迎来黎明暑假，家住北京的小明到乌鲁木齐旅游他发现北京和乌鲁木齐迎来黎明的时间不同\n\n#### 🎯 聚焦北京和乌鲁木齐，哪里先迎来黎明呢？在不同城市旅游时，我们是否发现过类似的现象？\n总出\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿空间探索（中国探月与深空探测工程）**：从“嫦娥六号”实现人类首次月背采样返回，到“祝融号”火星车巡视火星乌托邦平原，航天科学家利用精密轨道力学与光谱分析，正在解开太阳系演化与地月系统的终极奥秘！\n- 🧠 **跨学科大概念（系统与模型 / CER 推理）**：天体视运动是地球自转与公转在天球上的投影。科学主张（Claim）：昼夜交替与月相变化源于相对空间运动；经验证据（Evidence）：月球向阳面反光与地球自西向东自转；逻辑推理（Reasoning）：观察视角的相对性决定了我们在地表看到的明暗周期。\n- ⚠️ 很多同学误以为“月相变化是地球的影子挡住了月亮”。**科学真相**：地球影子挡住月球的现象是罕见的“月食”；而平时的初一到十五月相变化，纯粹是因为月球绕地球公转时，我们在地球上看到的月球被太阳照亮的半球面角度不同！\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g11_s1_u03_l04.html)\n\n\n### [第 79 页]\n\n![第 79 页教学插图与实验活动](figures/p79.png)\n\n#### 🔬 探索根据位置关系，分别在两名同学身上贴上北京和乌鲁木齐，哪座城市先迎写有“北京”和“乌鲁来黎明？\n木齐”的卡片。\n·观察地球仪，确定北京和乌鲁木齐两座城市的相对位置。\n●做模拟实验。\n方法一：几名同学手拉手围成圆圈，分别向不同方向转动，谁先看到“太阳”呢？\n方法二：在大蒜上贴两个圆点，红点表示北京，绿点表示乌鲁木齐。\n按照不同的自转方向转动大蒜，红点和绿点哪个先迎来“黎明”呢？\n为什么会有两种不同的结果？\n出\n\n#### 📝 记录单\n\n“哪里先迎来黎明”模拟实验日期：\n地球自转方向先迎来黎明的城市我的解释自西向东自东向西\n\n### [第 80 页]\n\n![第 80 页教学插图与实验活动](figures/p80.png)\n\n2. 确认地球自转的方向。\n坐在前进的汽车上观察窗外的树木，树木的运动方向是怎样的？\n坐在转动的椅子上观察，周围的物体在怎样运动？\n设想我们坐在地球这个“大转椅”上，每天看到太阳和其他天体东升西落，这说明地球的自转方向是怎样的？\n\n#### 📝 记录单探究地球的自转方向物体的运动方向在运动物体上的观察结果汽车向前行驶车窗外树木的运动方向：\n坐在椅子上顺时针转子周围物体的运动方向：\n地球：\n太阳东升西落\n\n### [第 81 页]\n\n![第 81 页教学插图与实验活动](figures/p81.png)\n\n#### 💬 研讨在探讨北京和乌鲁木齐哪里先迎来黎明时，我们是怎样知道的？\n通过探究，结合以前的学习，我们可以知道地球自转的方向是什么样的吗？\n自转一周的时间是多长呢？\n③回顾第一课提出的问题，我们已经解决了哪些问题？\n\n#### 🚀 拓展把我们解决问题的思维过程用图示清晰地呈现出来，可以更好地与别人进行交流。\n下图只是一种表示方式，我们也可以用不同的方式进行表达。\n因素1解决办法两地的位置关系借助地球仪确定两问题：\n地的位置关系东西两地哪里玄科先迎来黎明可能性1结果1因素2自东向西西边光迎来黎明地球自转方向可能性2结果2自西向东东边先迎来黎明支持的事实支持的原理太阳东升西落，地球运动物体和周围物体在在自转税觉上的运动方向相反"}, {"id": "sci_11_u03_l05", "lesson_idx": 223 gures/p85.png)\n\n在其他季节，也进行测量和记录\n4. 实际观察。\n正午时分，把自制的圭表放在太阳可以照射到的地方，记录影子的实际长度。\n\n#### 💬 研讨四季交替，正午时分物体的影长会怎样有规律地变化？\n如果不在正午时分进行观察可以吗？应该注意什么？\n\n#### 🚀 拓展存细分析表格中的数据，你有什么发现？\n北京地区日出日落时间和正午太阳高度角的变化表日出时间日落时间正午太阳高度角春分夏至秋分冬至"}, {"id": "sci_11_u03_l06", "lesson_idx": 224, "book": "六年级上册", "vol_dir": "11_六年级上册", "unit_no": 3, "unit_title": "第三单元地球的运动", "lesson_no": 6, "title": "地球的公转", "page": 86, "domain": "earth", "domain_cn": "地球与宇宙科学", "sim_file": "sim_g11_s1_u03_l06.html", "code": "g11_s1_u03_l06", "sections": {"focus": "我们都知道地球在自转，除了这种运动方式外，地球还在公转。什么是公转？地球的公转与四季变化有关系吗？\n资料", "exploration": "类比是一种常见的思维方法，它能直观形象将地球公转与围绕篝火跳舞进行类比。相地说明事物。我们应该互交流，然后填写在记录单中。\n恰当地进行类比，这样才能更科学、更准确地解释现象。", "discussion": "我们的记录单上的信息有什么相同和不同之处？其他同学的记录单对我们有什么帮助？\n如果用围绕篝火跳舞来类比地球公转，我们该怎样说明？\n北半球与南半球的季节是什么关系？", "expansion": "地球围绕太阳公转一周要一年。太阳系中，八颗行星的公转周期不同（如右图）。我们有什么发现吗？\n太阳", "frontier": "", "big_concept": "地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。", "misconception": ""}, "figures": ["p86.webp", "p87.webp", "p88.webp", "p89.webp"], "raw_text": "### [第 86 页]\n\n![第 86 页教学插图与实验活动](figures/p86.png)\n\n## 6. 地球的公转\n\n\n地球的公转们围绕篝火跳舞，跳舞的人就可以看作是在围绕等火公转，地球围绕着太阳公转，就好比是它在自转的同时，还国绕太阳跳等火舞\n\n#### 🎯 聚焦我们都知道地球在自转，除了这种运动方式外，地球还在公转。什么是公转？地球的公转与四季变化有关系吗？\n资料\n\n#### 🔬 探索类比是一种常见的思维方法，它能直观形象将地球公转与围绕篝火跳舞进行类比。相地说明事物。我们应该互交流，然后填写在记录单中。\n恰当地进行类比，这样才能更科学、更准确地解释现象。\n\n#### 🚀 科学家视角 · 深度课外拓展\n\n- 🌐 **前沿地球科学（深地探测与“奋斗者”号深潜）**：我国“深地一号”油气钻井已穿透地下万米白垩系地层，结合地震波断层成像技术，科学家如同给地球做“超声波CT”，实时洞察地壳构造板块运动与深部地幔热柱对流！\n- 🧠 **跨学科大概念（稳定与变化 / 因果机制）**：地貌形态是内力作用（板块构造挤压、地震火山爆发构建山脉）与外力作用（流水侵蚀、风化剥蚀削平高山）数十亿年动态博弈的产物。\n- ⚠️ 小学生常认为“岩石是永恒不变、坚不可摧的”。**科学真相**：在水、大气、温度变化以及植物根系分泌酸的作用下，岩石在持续发生物理风化与化学侵蚀，并在地质循环中重熔为岩浆或沉积为土壤，地表始终在缓慢而剧烈地重塑。\n- 🧪 **配套微仿真实验**：[🔬 启动本课交互微仿真实验](simulations/sim_g11_s1_u03_l06.html)\n\n\n### [第 87 页]\n\n![第 87 页教学插图与实验活动](figures/p87.png)\n\n#### 📝 记录单地球公转与围绕篝火跳舞的类比（一）日期：\n地球公转围绕等火跳舞以太阳为中心都有中心以算火为中心圆周运动圆图可大可小获得太阳能量获得筹火能量近热远冷根据提供的图片和文字资料，了解地球的公转，然后继续记录比较结果。\n资料一：有关地球公转的示意图公转过程中地地球公转一周的时间是多长？\n轴领斜的方向保持不变吗？\n春分冬至夏至秋分\n\n### [第
